  chapters:
    - id: ch01
      title: The Man-Pack
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "What came of the hunt, bold hunter? Brother, the watch was long and cold. What of the quarry you meant to kill? Brother, he still feeds in the jungle. Where is the strength that made you proud? Brother, it drains from my side. And where are you hurrying now? Brother, I go to my den to die."
        - id: ch01-b02
          speaker: narrator
          text: "Now we must return to the first tale. After the fight with the Pack at Council Rock, Mowgli left the wolves' cave and went down toward the plowed country. He would not stay near the jungle. He had made at least one dangerous enemy that night. So he followed the rough valley road at a steady trot for nearly twenty miles, until he reached a land he had never seen."
        - id: ch01-b03
          speaker: narrator
          text: "The valley widened into a great plain, broken by rocks and deep little ravines. A small village stood at one end. At the other, the thick jungle swept down to the grazing grounds and stopped as sharply as if a hoe had cut it away. Cattle and buffaloes fed all across the open land. The boys guarding them saw Mowgli, yelled, and ran, while the yellow dogs that lived around the village rushed out barking. Mowgli was hungry, so he kept walking until he reached the gate. There he found the huge thorn barrier that the villagers dragged across the entrance each night, now pushed to one side."
        - id: ch01-b04
          speaker: mowgli
          text: "Hmm. So the Men Folk here are afraid of the Jungle People too."
        - id: ch01-b05
          speaker: narrator
          text: "He sat beside the gate. When a man came out, Mowgli stood, opened his mouth, and pointed into it to ask for food. The man stared, then raced up the village's one street, calling for the priest. Soon the large priest arrived in white clothes, with red and yellow paint on his forehead. At least a hundred people came behind him. They stared, shouted, talked, and pointed."
        - id: ch01-b06
          speaker: mowgli
          text: "These Men Folk have no manners. Only the gray apes behave like this."
        - id: ch01-b07
          speaker: narrator
          text: "Mowgli tossed back his long hair and frowned at them."
        - id: ch01-b08
          speaker: priest
          text: "Why should anyone be frightened? Look at his arms and legs. Those marks are wolf bites. He is only a wolf-child who has run out of the jungle."
        - id: ch01-b09
          speaker: narrator
          text: "The wolf cubs had often nipped too hard during their games, leaving white scars on Mowgli's skin. Mowgli would never have called those marks bites. He knew what a real bite was."
        - id: ch01-b10
          speakers: [villager_1, villager_2, villager_3]
          ensemble: chorus
          text: "Oh, the poor child! The wolves have bitten him! What a handsome boy. His eyes burn like red fire. Messua, he looks so much like the son the tiger took from you."
        - id: ch01-b11
          speaker: messua
          text: "Let me see him. Yes, he does look like my boy. He is thinner, but the face is the same."
        - id: ch01-b12
          speaker: narrator
          text: "Messua wore heavy copper rings at her wrists and ankles. She shaded her eyes with one hand and studied Mowgli. The priest knew she was married to the richest man in the village. He looked up at the sky for a moment, then spoke in a grave voice."
        - id: ch01-b13
          speaker: priest
          text: "The jungle took a child, and now the jungle has returned one. Sister, bring this boy into your home. And remember to honor the priest who can see so deeply into men's lives."
        - id: ch01-b14
          speaker: mowgli
          text: "By the Bull that bought me, this talk feels like the Pack inspecting me all over again. Well, if I am a man, then I must learn to be one."
        - id: ch01-b15
          speaker: narrator
          text: "The crowd opened a path, and Messua beckoned Mowgli into her hut. He stared at everything around him. There was a red lacquered bed, a huge clay chest full of grain and covered with funny raised designs, and half a dozen copper cooking pots. The image of a Hindu god stood in a small alcove. On the wall hung a real looking glass, the kind sold at country fairs. Messua brought him bread and a long drink of milk. Then she laid one hand on his head and searched his eyes. She could not stop wondering whether this might truly be her own child, returned from the jungle where the tiger had taken him."
        - id: ch01-b16
          speaker: messua
          text: "Nathoo. Oh, Nathoo! Don't you remember the day I gave you new shoes?"
        - id: ch01-b17
          speaker: narrator
          text: "Mowgli gave no sign that the name meant anything. Messua touched his foot. Its sole was nearly as hard as horn."
        - id: ch01-b18
          speaker: messua
          text: "No. These feet have never worn shoes. But you look so much like my Nathoo. You shall be my son."
          emotion: sad
        - id: ch01-b19
          speaker: narrator
          text: "Mowgli felt uneasy. He had never been beneath a roof. Then he noticed that he could tear through the thatch whenever he wished, and that the window had no fastening."
        - id: ch01-b20
          speaker: mowgli
          text: "What good is a man who cannot understand men's speech? Among these people, I am as foolish and voiceless as a man would be among the wolves. I must learn their language."
        - id: ch01-b21
          speaker: narrator
          text: "Among the wolves, Mowgli had learned to copy the challenge of a buck and the grunt of a young wild pig. Now, whenever Messua said a word, he repeated it almost perfectly. By nightfall, he knew the names of many things in the hut."
        - id: ch01-b22
          speaker: narrator
          text: "Bedtime brought trouble. To Mowgli, the hut looked too much like a panther trap. When the door closed, he climbed straight out the window."
        - id: ch01-b23
          speaker: messua_husband
          text: "Let him choose for himself. Until now, he cannot have slept in a bed. If he has truly come in place of our son, he will stay near us."
        - id: ch01-b24
          speaker: narrator
          text: "Mowgli stretched himself in a bed of long clean grass at the edge of the field. He was nearly asleep when something soft and cool pushed beneath his chin. He opened his eyes to a familiar gray nose. Gray Brother had found him. He was the eldest of Mother Wolf's four cubs, and he had followed Mowgli all the way from the jungle."
        - id: ch01-b25
          speaker: brother_1
          text: "Phew! I followed you twenty miles, and this is my reward. You already smell of wood smoke and cattle, just like a man. Wake up, Little Brother. I have news."
        - id: ch01-b26
          speaker: mowgli
          text: "Is everyone in the jungle safe?"
        - id: ch01-b27
          speaker: narrator
          text: "Mowgli wrapped his arms around Gray Brother."
        - id: ch01-b28
          speaker: brother_1
          text: "Everyone except the wolves burned by the Red Flower. Listen now. Shere Khan has gone far away to hunt while his scorched coat grows back. He swears that when he returns, he will leave your bones in the Waingunga."
        - id: ch01-b29
          speaker: mowgli
          text: "He is not the only one who made a promise. Thank you for the news. I am tired tonight, Gray Brother. There have been so many new things. But always bring me word."
        - id: ch01-b30
          speaker: brother_1
          text: "You will remember that you are a wolf, won't you? The Men Folk will not make you forget us?"
        - id: ch01-b31
          speaker: mowgli
          text: "Never. I will always love you and everyone in our cave. And I will always remember that the Pack drove me out."
        - id: ch01-b32
          speaker: brother_1
          text: "Another pack may drive you out too. Men are only men, Little Brother, and their talk sounds like frogs around a pond. When I return, I will wait in the bamboos beside the grazing ground."
    - id: ch02
      title: The Village Herd
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "For the next three months, Mowgli hardly passed beyond the village gate. Learning men's customs kept him busy. First he had to wear a cloth around his body, which annoyed him terribly. Then he had to learn about money, though he could not understand it, and about plowing, though he could see no use in it."
        - id: ch02-b02
          speaker: narrator
          text: "The village children made him angry too. They mocked him when he could not play their games, fly a kite, or pronounce a word. The Law of the Jungle had taught him to hold his temper, because life and food can depend on that. Even so, only one thought stopped him from picking up those little naked cubs and breaking them in two. It would not be fair sport."
        - id: ch02-b03
          speaker: narrator
          text: "Mowgli had no idea how strong he was. In the jungle, he had always been weak beside the animals. In the village, people said he had the strength of a bull. He understood even less about the castes that divided one man from another. When the potter's donkey slipped into a clay pit, Mowgli simply took its tail and hauled the animal out. Afterward, he helped the potter stack his load of earthen pots for the trip to the market at Khanhiwara. To the villagers, this was shocking. They looked down on the potter as a low-caste man, and they placed his donkey lower still."
        - id: ch02-b04
          speaker: narrator
          text: "The priest scolded him, so Mowgli threatened to put the priest on the donkey too. After that, the priest told Messua's husband to give the boy work. The headman ordered Mowgli to take the buffaloes out to graze the next morning. Nobody could have been more pleased."
        - id: ch02-b05
          speaker: narrator
          text: "That evening, Mowgli joined the circle beneath the great fig tree. Now that the village had made him one of its servants, he had a place at its nightly gathering. A stone platform beneath the tree served as the village club. The headman came, along with the watchman and the barber, who knew every scrap of gossip in the village. Old Buldeo the hunter sat among them with his Tower musket across his knees. Monkeys chattered and argued in the upper branches. A cobra lived in a hole beneath the platform. Because the villagers held him sacred, they set out his own little dish of milk every night."
        - id: ch02-b06
          speaker: narrator
          text: "The old men pulled at their big water pipes and talked far into the night. They told marvelous stories about gods, men, and ghosts. Buldeo told still more marvelous tales about the jungle beasts, while the children outside the circle listened with enormous eyes. Animals filled most of the stories. The jungle stood at the village door. Deer and wild pigs rooted through the crops, and sometimes a tiger carried off a man at twilight within sight of the gate."
        - id: ch02-b07
          speaker: narrator
          text: "Mowgli knew a little about the jungle himself. He hid his face so no one would see him laugh. As Buldeo climbed from one astonishing tale to the next, Mowgli's shoulders shook."
        - id: ch02-b08
          speaker: buldeo
          text: "The tiger that took Messua's son is no ordinary beast. A wicked old moneylender's ghost lives inside him. I know it is true. Purun Dass limped after he was struck in the riot that burned his account books. This tiger limps too. His paw prints do not match."
        - id: ch02-b09
          speakers: [villager_1, villager_2]
          ensemble: duo
          text: "Yes, yes. That must be the truth."
        - id: ch02-b10
          speaker: mowgli
          text: "Are all your stories made of cobwebs and moonlight? Everyone knows that tiger limps because he was born lame. You say a moneylender's soul lives in a beast without a jackal's courage. That is a child's tale."
        - id: ch02-b11
          speaker: narrator
          text: "Buldeo lost his voice in surprise. Even the headman stared."
        - id: ch02-b12
          speaker: buldeo
          text: "Oh, so the jungle brat knows everything! If you are so wise, take the tiger's hide to Khanhiwara. The Government offers a hundred rupees for him. Better yet, keep quiet when your elders are speaking."
        - id: ch02-b13
          speaker: narrator
          text: "Mowgli stood and turned to leave. He called back over his shoulder."
        - id: ch02-b14
          speaker: mowgli
          text: "I have listened all evening, and Buldeo has hardly spoken one true word about the jungle outside your gate. Why should I believe his stories about ghosts, gods, and goblins that he claims to have seen?"
        - id: ch02-b15
          speaker: headman
          text: "It is certainly time that boy began herding."
        - id: ch02-b16
          speaker: narrator
          text: "Buldeo puffed and snorted over Mowgli's disrespect."
        - id: ch02-b17
          speaker: narrator
          text: "In most Indian villages, a few boys lead the cattle and buffaloes to pasture at dawn and bring them home at night. Cattle that might trample a grown stranger will let children no taller than their noses shout at them and beat them along. The herd keeps the boys safe. Even a tiger will not attack a crowd of cattle. But a child who wanders off for flowers or lizards can be carried away."
        - id: ch02-b18
          speaker: narrator
          text: "At dawn, Mowgli rode through the village on Rama, the great herd bull. One by one, slate-blue buffaloes came from their pens and followed. Their long horns swept backward above savage eyes. Mowgli made sure the other boys knew he was in command. He struck the buffaloes with a long smooth bamboo."
        - id: ch02-b19
          speaker: mowgli
          text: "Kamya, keep the cattle grazing by themselves. Stay close to them and do not wander away. I will take the buffaloes farther on."
        - id: ch02-b20
          speaker: narrator
          text: "The grazing land was a maze of rocks, scrub, grassy clumps, and little gullies where whole herds could vanish. Buffaloes liked the pools and muddy hollows. They would wallow there for hours in the warm mud. Mowgli drove them to the edge of the plain, where the Waingunga flowed out of the jungle. Then he slid from Rama's neck and ran to a bamboo thicket. Gray Brother was waiting."
        - id: ch02-b21
          speaker: brother_1
          text: "At last! I have waited here day after day. Why are you doing this cattle-herding work?"
        - id: ch02-b22
          speaker: mowgli
          text: "The village ordered it. For a while, I am their herdsman. What have you heard about Shere Khan?"
        - id: ch02-b23
          speaker: brother_1
          text: "He came back and waited a long time for you. Game grew scarce, so he left again. But he still means to kill you."
        - id: ch02-b24
          speaker: mowgli
          text: "Good. While he is gone, you or one of our brothers must sit on that rock. I will see you when I leave the village. When he returns, wait for me in the ravine beside the dhak tree in the middle of the plain. We need not walk straight into Shere Khan's mouth."
        - id: ch02-b25
          speaker: narrator
          text: "Mowgli found a shady patch and slept while the buffaloes grazed around him. Herding in India can be the laziest work in the world. The cattle take a few steps, tear up mouthfuls of grass, settle down, and then rise to move once more. They do not even low. They only grunt. The buffaloes say even less. One after another, they lower their heavy bodies into the muddy pools and work deeper into the warm mud. At last, nothing remains above the surface but their broad noses and their staring china-blue eyes. Then they lie as still as logs."
        - id: ch02-b26
          speaker: narrator
          text: "Heat makes the rocks dance. High overhead, one kite whistles, and never more than one. The herd boys know that if a child or cow died, that kite would drop. Another kite miles away would see and follow, then another and another, until twenty hungry birds appeared from nowhere."
        - id: ch02-b27
          speaker: narrator
          text: "The children sleep, wake, and sleep again. They weave dry grass into little baskets for grasshoppers. They make two praying mantises fight, string red and black jungle nuts into necklaces, or watch a lizard warming on a rock and a snake hunting frogs near the wallows. They sing long songs with strange turns at the end, while a single day seems longer than most people's lives."
        - id: ch02-b28
          speaker: narrator
          text: "Sometimes they build a mud castle, with mud men, horses, and buffaloes. Reeds become spears. The children pretend to be kings commanding armies, or gods receiving worship. At last evening comes. They call, and the buffaloes rise from the sticky pools with sounds like one gunshot after another. Then the herds cross the gray plain toward the village lights."
        - id: ch02-b29
          speaker: narrator
          text: "Day after day, Mowgli led the buffaloes to the wallows. Each day, he saw Gray Brother's back on the signal rock a mile and a half away. That meant Shere Khan had not returned. Mowgli lay in the grass, listening and dreaming of his old jungle life. In those long still mornings, he would have heard one false step from Shere Khan's lame paw in the forest beside the Waingunga."
    - id: ch03
      title: The Trap in the Ravine
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "Then one day, Gray Brother was missing from the signal rock. Mowgli laughed and drove the buffaloes toward the ravine beside the dhak tree, all covered in golden-red flowers. Gray Brother sat there with every hair on his back standing up."
        - id: ch03-b02
          speaker: brother_1
          text: "Shere Khan hid for a month so you would stop watching. Last night he crossed the hills with Tabaqui, following your trail as fast as he could."
        - id: ch03-b03
          speaker: narrator
          text: "Gray Brother was panting. Mowgli frowned."
        - id: ch03-b04
          speaker: mowgli
          text: "Shere Khan does not frighten me. But Tabaqui is clever."
        - id: ch03-b05
          speaker: brother_1
          text: "You need not fear him now. I met Tabaqui at dawn. He told me everything before I broke his back. Now he can share all his cleverness with the kites. Shere Khan plans to wait at the village gate tonight for you alone. Right now, he is lying in the great dry ravine of the Waingunga."
        - id: ch03-b06
          speaker: mowgli
          text: "Did he eat today, or is he hunting on an empty stomach?"
        - id: ch03-b07
          speaker: narrator
          text: "The answer could mean life or death."
        - id: ch03-b08
          speaker: brother_1
          text: "He killed a pig at dawn, and he drank afterward. You know Shere Khan. He cannot fast, not even for revenge."
        - id: ch03-b09
          speaker: mowgli
          text: "What a fool! He has eaten and drunk, and he thinks I will wait while he sleeps. Where exactly is he? If ten of us were here, we could drag him down where he lies. The buffaloes will not charge until they smell him, and I cannot speak their language. Can we bring them behind his trail?"
        - id: ch03-b10
          speaker: brother_1
          text: "He swam a long way down the Waingunga so that no trail would remain."
        - id: ch03-b11
          speaker: mowgli
          text: "Tabaqui must have taught him that. Shere Khan would never think of it himself."
        - id: ch03-b12
          speaker: narrator
          text: "Mowgli stood with one finger in his mouth and thought."
        - id: ch03-b13
          speaker: mowgli
          text: "The great Waingunga ravine opens onto the plain less than half a mile away. I can circle through the jungle, reach the head, and drive the herd down. But Shere Khan would slip out at the bottom. We must close that end. Gray Brother, can you divide the herd for me?"
        - id: ch03-b14
          speaker: brother_1
          text: "Perhaps I cannot do it alone. So I brought someone wiser."
        - id: ch03-b15
          speaker: narrator
          text: "Gray Brother ran off and dropped into a hollow. A huge gray head rose from it, one Mowgli knew well. Then the hot air filled with the loneliest sound in all the jungle, a wolf's hunting howl at midday."
        - id: ch03-b16
          speaker: mowgli
          text: "Akela! I should have known you would remember me. We have serious work to do. Split the herd in two. Keep the cows with their calves, and put the bulls and plow buffaloes together."
          emotion: happy
        - id: ch03-b17
          speaker: narrator
          text: "Akela and Gray Brother darted in and out among the buffaloes, weaving past one another like dancers in a chain. The startled herd snorted and flung up its heads. Slowly, it broke into two tight groups. The cow buffaloes pressed their calves safely into the center, then faced outward. They glared, pawed the earth, and waited for either wolf to stand still long enough to be charged and trampled. In the other group, the full-grown bulls, young bulls, and plow buffaloes stamped and tossed their horns. They looked more frightening than the cows. But they had no calves to protect, so they were not nearly as dangerous. Six men working together could not have divided that herd so neatly."
        - id: ch03-b18
          speaker: akela
          text: "What next? They are trying to come together again."
        - id: ch03-b19
          speaker: narrator
          text: "Akela spoke between breaths. Mowgli climbed onto Rama's back."
        - id: ch03-b20
          speaker: mowgli
          text: "Akela, drive the bulls away to the left. Gray Brother, hold the cows together after we leave and lead them to the foot of the ravine."
        - id: ch03-b21
          speaker: brother_1
          text: "How far into it?"
        - id: ch03-b22
          speaker: mowgli
          text: "Keep going until the walls are too high for Shere Khan to jump. Hold them there until we charge down."
        - id: ch03-b23
          speaker: narrator
          text: "Akela bayed, and the bulls swept away. Gray Brother faced the cows. They charged, and he raced just ahead of them toward the bottom of the ravine. Akela drove the bulls far off to the left."
        - id: ch03-b24
          speaker: mowgli
          text: "Well done! One more rush and they will be moving properly. Easy, Akela, easy. One snap too many and the bulls will turn on us. Hujah! This is wilder than driving blackbuck. Did you know these creatures could run so fast?"
        - id: ch03-b25
          speaker: akela
          text: "I hunted buffaloes myself once, long ago. Should I turn them into the jungle now?"
        - id: ch03-b26
          speaker: narrator
          text: "Akela gasped through the dust."
        - id: ch03-b27
          speaker: mowgli
          text: "Yes! Turn them, and do it quickly. Rama is wild with rage. If only I could tell him what I need today."
        - id: ch03-b28
          speaker: narrator
          text: "This time the bulls wheeled right and crashed into the thick brush. Half a mile away, the other herd boys watched beside the cattle. They ran for the village as fast as their legs could carry them, shouting that the buffaloes had gone mad."
        - id: ch03-b29
          speaker: narrator
          text: "Mowgli's plan was simple. He would make a wide circle uphill to the head of the ravine. Then the bulls would charge down and trap Shere Khan between themselves and the waiting cows. A tiger full of food and water could neither fight well nor climb the steep walls."
        - id: ch03-b30
          speaker: narrator
          text: "Mowgli soothed the buffaloes with his voice. Akela stayed well behind and gave a soft whine now and then to hurry the slowest animals. They made a very long circle so they would not pass close enough to warn Shere Khan. At last, Mowgli gathered the puzzled herd on a grassy slope above the ravine. From there, the plain lay beyond the treetops. But Mowgli watched the ravine walls. They rose almost straight up, and their hanging vines would give a climbing tiger no foothold."
        - id: ch03-b31
          speaker: mowgli
          text: "Let them catch their breath, Akela. They have not smelled him yet. Give them a moment. I must tell Shere Khan who is coming. We have him trapped."
        - id: ch03-b32
          speaker: narrator
          text: "Mowgli cupped his hands around his mouth and called into the ravine. It was like shouting through a tunnel. Echoes leaped from rock to rock. A long time passed. Then a sleepy, dragging snarl rose from a tiger awakened after a heavy meal."
        - id: ch03-b33
          speaker: shere_khan
          text: "Who is calling me?"
        - id: ch03-b34
          speaker: narrator
          text: "A splendid peacock burst from the ravine with a scream."
        - id: ch03-b35
          speaker: mowgli
          text: "I am, Mowgli! Cattle thief, it is time to come to Council Rock. Akela, drive them down! Down, Rama! Down!"
        - id: ch03-b36
          speaker: narrator
          text: "For one instant, the herd stopped at the slope's edge. Akela gave the full hunting yell. The buffaloes plunged over, one after another, as ships shoot through rapids. Sand and stones flew around them. Once they began, nothing could stop them. Before they reached the ravine floor, Rama caught Shere Khan's scent and bellowed."
        - id: ch03-b37
          speaker: mowgli
          text: "Ha! Now you understand!"
        - id: ch03-b38
          speaker: narrator
          text: "Mowgli rode above a flood of black horns, foaming mouths, and staring eyes. The herd tore down the ravine like boulders in a flood. Weaker buffaloes were shoved toward the walls, ripping through the vines. Now the animals knew their work. No tiger could stand against such a charge."
        - id: ch03-b39
          speaker: narrator
          text: "Shere Khan heard the thunder of hooves and hauled himself up. He lumbered down the ravine, searching each wall for an escape. There was none. Heavy with meat and drink, he ran on rather than turn and fight. The herd crashed through the pool where he had slept, and its bellowing filled the narrow cut."
        - id: ch03-b40
          speaker: narrator
          text: "A second bellow answered from the ravine's foot. Shere Khan heard it too and turned. If the worst came, he would rather meet the bulls than the furious cows protecting their calves. Rama charged on, tripped over something soft, stumbled, and caught his feet again. The bulls thundered behind him. A moment later they smashed headlong into the cows coming up from below. The shock lifted the weaker buffaloes clean off their feet. The two herds carried one another out of the ravine and onto the plain, where horns gored, hooves stamped, and every animal snorted with rage."
        - id: ch03-b41
          speaker: narrator
          text: "Mowgli chose his moment, slipped from Rama's neck, and struck right and left with his bamboo."
        - id: ch03-b42
          speaker: mowgli
          text: "Quick, Akela! Break them apart before they fight each other. Drive them away. Hai, Rama! Hai, my children! Gently now. Gently. It is finished."
          emotion: calm
        - id: ch03-b43
          speaker: narrator
          text: "Akela and Gray Brother raced among the buffaloes, nipping at their legs. The herd turned once as if to charge back up the ravine. Mowgli managed to wheel Rama toward the wallows, and all the others followed."
        - id: ch03-b44
          speaker: narrator
          text: "Shere Khan would never need another trampling. He was dead, and the kites were already coming."
    - id: ch04
      title: The Tiger's Hide
      blocks:
        - id: ch04-b01
          speaker: mowgli
          text: "Brothers, he died like a dog. He would never have stood and fought us. His hide will look fine on Council Rock. We must work quickly."
        - id: ch04-b02
          speaker: narrator
          text: "Since he began living with men, Mowgli had carried a knife in a sheath around his neck. An ordinary village boy would never have dreamed of skinning a ten-foot tiger without help. Mowgli understood an animal's body differently. He knew exactly how the skin fitted over it and where the hide must be freed. Even with that knowledge, the work was desperately hard. For a full hour he cut, tore, pulled, and grunted over the carcass. The wolves rested nearby with their tongues hanging out. Whenever Mowgli needed more strength, they came forward and tugged exactly where he told them."
        - id: ch04-b03
          speaker: narrator
          text: "Then a hand dropped onto his shoulder. Mowgli looked up and saw Buldeo with the Tower musket. The herd boys had reported the stampede, and Buldeo had come out in a fury, eager to punish Mowgli for losing control. At the sight of the man, the wolves slipped away and hid."
        - id: ch04-b04
          speaker: buldeo
          text: "What foolishness is this? You think you can skin a tiger? Where did the buffaloes kill him? Why, this is the Lame Tiger, with a hundred-rupee reward on his head. Well, perhaps we can forgive you for letting the herd run off. Once I take the hide to Khanhiwara, I may even give you one rupee."
          emotion: angry
        - id: ch04-b05
          speaker: narrator
          text: "Buldeo searched his waist cloth for flint and steel, then bent to burn off Shere Khan's whiskers. Hunters in those parts often singed a tiger's whiskers so its ghost could not haunt them. Mowgli kept peeling the hide from one forepaw."
        - id: ch04-b06
          speaker: mowgli
          text: "So you plan to take my hide, collect the reward, and perhaps give me one rupee. But I need this skin myself. Old man, move that fire away."
        - id: ch04-b07
          speaker: buldeo
          text: "How dare you speak that way to the village's chief hunter! Your luck and your stupid buffaloes killed this tiger. He had just fed, or he would have been twenty miles away. You cannot even skin him properly, you little beggar, and now you order Buldeo not to burn the whiskers? You will get no reward at all. You will get a beating. Leave the carcass!"
          emotion: angry
        - id: ch04-b08
          speaker: mowgli
          text: "By the Bull that bought me, must I waste the whole noon arguing with an old ape? Akela, this man is troubling me."
        - id: ch04-b09
          speaker: narrator
          text: "Buldeo was still bent over the tiger's head when he suddenly found himself flat on the grass. A gray wolf stood above him. Mowgli went on skinning as if no one else lived in all India."
        - id: ch04-b10
          speaker: mowgli
          text: "Yes, Buldeo, you were quite right. You will never give me one coin from the reward. This lame tiger and I have fought a very old war, and I have won it."
        - id: ch04-b11
          speaker: narrator
          text: "Ten years earlier, Buldeo might have risked a fight if he met Akela alone in the woods. This was different. A gray wolf had obeyed one word from a boy, and that boy spoke of a private war with a man-eating tiger. Buldeo knew this could be no common animal and no common herdboy. He decided he had stumbled into the worst sort of sorcery. As he lay beneath Akela, he wondered whether the charm around his neck could protect him. He did not dare move. At any moment, he expected Mowgli to turn into a tiger before his eyes."
        - id: ch04-b12
          speaker: buldeo
          text: "Maharaj. Great King."
          emotion: fearful
        - id: ch04-b13
          speaker: mowgli
          text: "Yes?"
        - id: ch04-b14
          speaker: narrator
          text: "Mowgli did not turn around. He gave a small chuckle."
        - id: ch04-b15
          speaker: buldeo
          text: "I am an old man. I did not know you were anything more than a herdboy. May I stand and leave, or will your servant tear me apart?"
          emotion: fearful
        - id: ch04-b16
          speaker: mowgli
          text: "Go in peace. Next time, do not interfere with my game. Akela, let him go."
        - id: ch04-b17
          speaker: narrator
          text: "Buldeo hobbled toward the village as fast as he could, glancing back in case Mowgli changed into something dreadful. Once home, he told such a tale of sorcery, spells, and magic that the priest became very grave."
        - id: ch04-b18
          speaker: narrator
          text: "Mowgli returned to work. Twilight was near before he and the wolves finally pulled the great bright hide free."
        - id: ch04-b19
          speaker: mowgli
          text: "Now we must hide the skin and take the buffaloes home. Akela, help me gather them."
    - id: ch05
      title: Cast Out Again
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "They gathered the herd in the misty dusk. Near the village, Mowgli saw lights and heard temple bells and conch shells sounding. Half the village seemed to be waiting beside the gate."
        - id: ch05-b02
          speaker: mowgli
          text: "They must have heard that I killed Shere Khan."
        - id: ch05-b03
          speaker: narrator
          text: "Instead, stones whistled past his ears."
        - id: ch05-b04
          speakers: [villager_1, villager_2, villager_3]
          ensemble: chorus
          text: "Sorcerer! Wolf's brat! Jungle demon! Get away from us! Leave before the priest turns you into a wolf again. Buldeo, shoot him!"
          emotion: angry
        - id: ch05-b05
          speaker: narrator
          text: "The old Tower musket fired with a crash. A young buffalo bawled in pain."
        - id: ch05-b06
          speakers: [villager_1, villager_2, villager_3]
          ensemble: chorus
          text: "More magic! He can turn bullets aside! Buldeo, you shot your own buffalo!"
          emotion: fearful
        - id: ch05-b07
          speaker: mowgli
          text: "What is happening now?"
          emotion: surprised
        - id: ch05-b08
          speaker: narrator
          text: "Mowgli stared as the stones came faster. Akela sat down without concern."
        - id: ch05-b09
          speaker: akela
          text: "These brothers of yours are rather like the Pack. If those bullets mean anything, I think they are casting you out."
        - id: ch05-b10
          speaker: priest
          text: "Wolf! Wolf-child! Go away!"
          emotion: angry
        - id: ch05-b11
          speaker: narrator
          text: "The priest waved a sprig from the sacred tulsi plant."
        - id: ch05-b12
          speaker: mowgli
          text: "Again? The wolves cast me out because I was a man. Now the men cast me out because I am a wolf. Come, Akela."
        - id: ch05-b13
          speaker: narrator
          text: "Messua ran through the herd toward him."
        - id: ch05-b14
          speaker: messua
          text: "Oh, my son! They say you are a sorcerer who can become an animal whenever you wish. I do not believe them. But you must go, or they will kill you. Buldeo calls you a wizard. I know only that you avenged Nathoo."
          emotion: fearful
        - id: ch05-b15
          speakers: [villager_1, villager_2, villager_3]
          ensemble: chorus
          text: "Come back, Messua! Come back now, or we will stone you too!"
          emotion: angry
        - id: ch05-b16
          speaker: narrator
          text: "A stone struck Mowgli in the mouth. He gave a short, ugly laugh."
        - id: ch05-b17
          speaker: mowgli
          text: "Run back, Messua. This is another foolish tale from the men beneath the big tree. At least I have paid the price for your son's life. Farewell, and run quickly. I will send the herd at them faster than they can throw their bricks. I am no wizard. Farewell!"
        - id: ch05-b18
          speaker: mowgli
          text: "Once more, Akela. Bring in the herd."
        - id: ch05-b19
          speaker: narrator
          text: "The buffaloes wanted their village pens. They scarcely needed Akela's cry. They rushed through the gate like a whirlwind and scattered the crowd on both sides."
        - id: ch05-b20
          speaker: mowgli
          text: "Count them carefully! Perhaps I stole one. Count every animal, because I will never herd for you again. Farewell, children of men. Thank Messua that I do not bring my wolves into your street and hunt you from end to end."
        - id: ch05-b21
          speaker: narrator
          text: "Mowgli turned away with the Lone Wolf. He looked up at the stars and felt happy."
        - id: ch05-b22
          speaker: mowgli
          text: "No more sleeping in traps, Akela. We will fetch Shere Khan's hide and leave. We will not hurt the village. Messua was kind to me."
        - id: ch05-b23
          speaker: narrator
          text: "The moon rose over the plain and washed everything in milky light. The frightened villagers watched Mowgli cross that pale open ground. He carried the bundled tiger skin on his head, with two wolves close behind his heels. He moved at the steady wolf's trot that eats up the long miles like fire. The sight sent the villagers back to their temple bells and conch shells, which rang and blared louder than before. Messua stood crying. Buldeo told and retold the story of his own adventure in the jungle, adding more each time. Before he finished, he claimed Akela had risen onto his hind legs and spoken to him like a man."
        - id: ch05-b24
          speaker: narrator
          text: "The moon was sinking when Mowgli and the two wolves reached the hill of Council Rock. They stopped outside Mother Wolf's cave."
        - id: ch05-b25
          speaker: mowgli
          text: "Mother! The Man-Pack has cast me out. But I brought Shere Khan's hide, just as I promised."
        - id: ch05-b26
          speaker: narrator
          text: "Mother Wolf came stiffly from the cave, with her cubs behind her. Her eyes shone when she saw the skin."
        - id: ch05-b27
          speaker: mother_wolf
          text: "The day he forced his head and shoulders into this cave to hunt you, Little Frog, I warned him. I said the hunter would become the hunted. You have done well."
        - id: ch05-b28
          speaker: bagheera
          text: "You have done well, Little Brother. The jungle was lonely without you."
        - id: ch05-b29
          speaker: narrator
          text: "Bagheera ran from the thicket and came to Mowgli's bare feet. Then Mowgli, Bagheera, the wolves, and the great striped hide went up to Council Rock together. Mowgli spread Shere Khan's skin over the flat stone where Akela had once sat as leader. He cut four sharp slivers of bamboo and used them to peg the hide down by its corners. Akela settled himself upon the skin. Then he lifted his voice in the old call that summoned the Pack to Council, just as he had called on the night when the wolves first brought Mowgli there."
        - id: ch05-b30
          speaker: akela
          text: "Look well, O Wolves! Look well!"
        - id: ch05-b31
          speaker: narrator
          text: "Since Akela lost his place, the Pack had lived without a leader. Each wolf hunted and fought whenever and however he pleased. Still, the old Council call pulled at them through long habit. They came back in poor condition. Some were lame from traps. Others limped from gunshot wounds. Some had grown mangy after eating rotten food. Many wolves were missing. All who remained gathered beneath Council Rock. Above them lay Shere Khan's striped hide, stretched across the stone, while the huge claws dangled from the ends of the empty paws."
        - id: ch05-b32
          speaker: narrator
          text: "Then a song rose into Mowgli's throat by itself. He shouted it out, leaping on the rattling skin and beating time with his heels until he had no breath. Gray Brother and Akela howled between the verses."
        - id: ch05-b33
          speaker: mowgli
          text: "Look well, O Wolves! Did I keep my word?"
        - id: ch05-b34
          speakers: [wolf_1, wolf_2, wolf_3, wolf_4]
          ensemble: chorus
          text: "Yes!"
        - id: ch05-b35
          speaker: narrator
          text: "One ragged wolf called from the Pack."
        - id: ch05-b36
          speaker: wolf_1
          text: "Lead us again, Akela! Lead us, Man-cub! We are sick of having no law. We want to be the Free People again."
        - id: ch05-b37
          speaker: bagheera
          text: "No. That cannot be. Once your bellies are full, madness may take you again. You chose freedom, and now it belongs to you. Feed on it, O Wolves."
        - id: ch05-b38
          speaker: mowgli
          text: "The Man-Pack and the Wolf-Pack have both cast me out. Now I will hunt alone in the jungle."
        - id: ch05-b39
          speakers: [brother_1, brother_2, brother_3, brother_4]
          ensemble: chorus
          text: "Then we will hunt with you."
        - id: ch05-b40
          speaker: narrator
          text: "From that day, Mowgli hunted in the jungle with his four wolf brothers. But he did not remain alone forever. Years later, he became a man and married."
        - id: ch05-b41
          speaker: narrator
          text: "But that is a story for grown-ups."
