  chapters:
    - id: ch01
      title: 诺瓦斯托什纳的白色幼崽
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            嘘，宝贝，安睡吧。黑夜已经退到身后，白日里碧绿闪亮的海水，此刻全黑了。月亮越过浪尖，低头寻找我们。我们躺在浪谷里，听水声在四周轻响。浪花碰着浪花，正好做你柔软的枕头。疲倦的小鳍儿，蜷起来睡吧。风暴惊不醒你，鲨鱼也追不上你。大海慢慢摇着你，你就在它怀里安睡。这是海豹的摇篮曲。
        - id: ch01-b02
          speaker: narrator
          text: >-
            许多年前，这个故事发生在白令海深处。那里有座圣保罗岛，岛上的东北角叫诺瓦斯托什纳。冬鹪鹩利默辛把故事告诉了我。有一回，风把他刮到一艘开往日本的轮船索具上。我带他进舱，给他取暖，又喂了两天，等他恢复力气，才让他飞回圣保罗岛。利默辛模样古怪，讲的却是真话。
        - id: ch01-b03
          speaker: narrator
          text: >-
            人若不是有事要办，绝不会去诺瓦斯托什纳。常到那里办事的，只有海豹。每到夏天，几十万头海豹从冰冷灰暗的海里赶来。全世界再找不到比那片海滩更适合它们的住处。捕海当然清楚。每年春天，无论他在哪里，都会像鱼雷艇一样径直游回来，花一个月跟同伴恶战，只求抢到一块紧靠海边的育儿地。
        - id: ch01-b04
          speaker: narrator
          text: >-
            捕海十五岁，身躯庞大，披着灰毛，肩上几乎长了一圈鬃毛，嘴里还有凶狠的长牙。他靠前鳍撑起来，身高超过四英尺，体重接近七百磅。当然，得有谁胆大包天，敢把他抬上秤，这个数字才能得到证实。一次次恶战让他遍身伤疤，却挡不住他再打一架。他总先把头偏开，装得不敢正眼看对手，随后猛地一探，快得像一道闪电。大牙一旦咬住对方的脖子，能不能逃走全凭对方自己，捕海绝不会松口帮忙。
        - id: ch01-b05
          speaker: narrator
          text: >-
            不过，已经认输的海豹他从来不追。海滩的规矩不许这样。捕海争斗不是为了杀戮，只想替自己的孩子占一块紧靠海边的育儿地。偏偏每年春天另有四五万头海豹也要同样的位置。尖啸、吼叫、咆哮和粗重喷气混在一起，骇人极了。从哈钦森山望下去，三英里半的地面铺满了打斗的海豹；近岸浪花之间，也处处浮着匆忙赶来、准备上岸加入争斗的脑袋。
        - id: ch01-b06
          speaker: narrator
          text: >-
            它们在碎浪里打，在沙地上打，也在育儿地光滑的玄武岩上打，跟人一样愚蠢，一样不肯让路。妻子们到五月底或六月初才来，免得被撕碎。两岁到四岁的年轻海豹还不成家，便穿过一排排争斗者，往内陆走半英里。到了沙丘，它们成群结队地追逐打闹，数量多得像一支支大军，地上只要冒出一点绿意，转眼就会被蹭得干干净净。它们叫霍鲁斯奇基，也就是单身汉。单在诺瓦斯托什纳，就聚着二三十万头。
        - id: ch01-b07
          speaker: narrator
          text: >-
            有一年春天，捕海刚打完第四十五场架，妻子玛特卡便从海中上岸。她皮毛柔滑，眼神温顺。捕海叼住她的后颈，把她放到自己的地盘上。捕海守海滩的四个月从不进食，脾气自然坏得很。
        - id: ch01-b08
          speaker: sea_catch
          text: >-
            还是这么晚。你究竟去了哪里？
        - id: ch01-b09
          speaker: matkah
          text: >-
            你倒真周到，又替咱们抢回了老地方。
        - id: ch01-b10
          speaker: sea_catch
          text: >-
            那当然。你看看我这身伤！
        - id: ch01-b11
          speaker: narrator
          text: >-
            他足有二十处伤口还在流血，一只眼睛险些掉出来，身体两侧更被撕成了布条。玛特卡用后鳍给自己扇风。
        - id: ch01-b12
          speaker: matkah
          text: >-
            你们这些公海豹呀，为什么不能讲点道理，安静分好地盘？你这副样子，倒像刚跟虎鲸拼过命。
        - id: ch01-b13
          speaker: sea_catch
          text: >-
            我从五月中旬起就没停过。今年海滩挤得不像样，光是从卢坎农来找地盘的，我就遇见一百头。大家就不能守着自己该待的地方吗？
        - id: ch01-b14
          speaker: matkah
          text: >-
            我总觉得，咱们若去水獭岛上岸，不挤在这里，会过得快活许多。
        - id: ch01-b15
          speaker: sea_catch
          text: >-
            呸！水獭岛是霍鲁斯奇基去的。我们去了，别人准说我们胆小。亲爱的，面子总要保住。
        - id: ch01-b16
          speaker: narrator
          text: >-
            捕海把头骄傲地缩进肥肩之间，假装睡觉，眼睛却随时找着下一场架。此时所有公海豹和妻子都已上岸。哪怕海上狂风呼啸，几英里外仍能听见它们的喧声。往少了说，海滩也有一百万头，老的、母的、幼小的、单身的，全在打斗、推搡、咩叫、爬行和玩耍。一队队海豹下海又上岸，也一队队从水里爬回来。目光所及，每一寸地方都被身体盖住；浓雾之中，还有大群海豹像一支支队伍般来回冲突。这里几乎总笼着雾。偶尔太阳露面，万物才短暂地闪出珍珠与彩虹的光。
        - id: ch01-b17
          speaker: narrator
          text: >-
            玛特卡的孩子科蒂克就在这场混乱中出生。他满身好像只剩脑袋和肩膀，一双淡蓝眼睛水汪汪的，幼崽原本都这样。不过，他的毛色很特别，玛特卡盯着看了很久。
        - id: ch01-b18
          speaker: matkah
          text: >-
            捕海，咱们的孩子长大以后会是白色的！
          emotion: surprised
        - id: ch01-b19
          speaker: sea_catch
          text: >-
            空蛤壳和干海草！世上从来没有过白海豹。
        - id: ch01-b20
          speaker: matkah
          text: >-
            那也没办法。从现在起，世上就会有了。没到六周别游水，不然脑袋沉下去，脚就会翘起来。夏日风暴和虎鲸，都爱欺负海豹小孩。它们坏得不能再坏。可你要扑水，要长得强壮。这样就不会走错路，因为你是大海的孩子。
        - id: ch01-b21
          speaker: narrator
          text: >-
            小科蒂克起初听不懂母亲的歌。他只管在她身边用鳍拨水，笨拙地爬来爬去。他还得学会一件要紧事：父亲一跟别的海豹交手，必须立刻让路。那两个庞然大物会缠成一团，沿着湿滑礁石翻滚，一路发出震耳的咆哮。玛特卡则常常游去深海寻找食物。她每隔两天才回来喂一次孩子，科蒂克便抓紧机会吃到一口也咽不下。这样的吃法倒很适合他，他一天比一天壮实。
    - id: ch02
      title: 学会大海的规矩
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            科蒂克第一次往内陆爬，就碰见数万只同龄幼崽。它们像小狗一样玩闹，困了便睡在干净的沙上，醒来继续玩。大海豹不来理会，霍鲁斯奇基也留在自己的地方，幼崽们因此过得无比快活。
        - id: ch02-b02
          speaker: narrator
          text: >-
            玛特卡从深海捕鱼回来，总会直奔游乐场，发出母羊寻找小羊那样的呼声。她停下来细听，直到科蒂克用自己的声音回应。一旦听准方向，她就走一条再直不过的路线冲过去，前鳍左右拨打，把挡路的幼崽撞得一个个脚朝天。游乐场上任何时候都有几百位母亲寻找孩子，于是小海豹们谁也别想安安稳稳躺太久。
        - id: ch02-b03
          speaker: matkah
          text: >-
            记住，不要躺在泥水里染疥癣，也别让硬沙磨进伤口。海上浪大时绝不能下水。守住这几条，你在这里就不会受伤。
        - id: ch02-b04
          speaker: narrator
          text: >-
            小海豹和小孩子一样，生下来都不会游，可不学会就绝不甘心。科蒂克头一回走到海边，正赶上一道浪涌来，把他卷到脚够不着底的深处。他还不知道怎样让身体浮起，大脑袋立刻往下一栽，两只小后鳍朝天翘起，恰好应了母亲歌里的警告。幸亏下一道浪紧跟着来到，又把他整个抛回岸上，否则他第一次下水就已经淹死。
        - id: ch02-b05
          speaker: narrator
          text: >-
            后来，他先躺进海滩水洼，只让薄薄的浪漫过身体。水把他轻轻托起，他就在原地试着划动，同时紧盯外海，防备会伤人的大浪。整整两个星期，他在水里跌跌撞撞，扑腾着进水又上岸，呛得咳嗽，累得哼哼。他会爬到高处，在沙地打一个短盹，醒了又回水里重来。终于有一天，四肢全听使唤了，他知道自己天生属于大海。
        - id: ch02-b06
          speaker: narrator
          text: >-
            从此，他跟伙伴们钻到迎面滚来的浪下，或者爬上浪头，跟着大浪旋转着冲向高处。等他们扑通落在海滩，四周水花乱飞，嘴里也噗噗喷水。他们学大海豹用尾巴直立，一本正经地挠脑袋，还在刚露出水面、湿滑而长满海草的礁石上争当城堡之王。有时，一片细长的鳍从近岸漂过，看起来像大鲨鱼的背鳍。那是专吃幼崽的虎鲸格兰帕斯。科蒂克立刻像箭一样逃回海滩，虎鲸的鳍却慢慢晃开，装作自己本来就没在寻找什么。
        - id: ch02-b07
          speaker: narrator
          text: >-
            十月末，海豹们按家族离开圣保罗岛，前往深海。育儿地不再争斗，霍鲁斯奇基也能随处玩耍。
        - id: ch02-b08
          speaker: matkah
          text: >-
            明年你就会成为霍鲁斯奇基。不过今年，你得先把捕鱼学会。
        - id: ch02-b09
          speaker: narrator
          text: >-
            母子俩一起横渡太平洋。玛特卡教他仰面睡在水上，把鳍收在身边，只露出鼻尖。太平洋长长的涌浪轻轻摇摆，世上没有更舒服的摇篮。科蒂克若觉得皮肤又麻又刺，那便是开始懂得水的感觉。坏天气快来时，水会先告诉他，他得赶紧游走。
        - id: ch02-b10
          speaker: matkah
          text: >-
            再过些时候，你就知道往哪边游。现在先跟着海猪吧，就是那头鼠海豚。他见识多，准不会走错。
        - id: ch02-b11
          speaker: narrator
          text: >-
            一群鼠海豚正排成队伍赶路。它们一会儿钻进海中，一会儿又撕开水面冲出来，速度快得惊人。小科蒂克使出全力，才勉强追在后边。他一边游一边喘，忍不住问它们究竟怎样知道该往哪里去。领头的海猪转过一只白眼瞧了瞧他，随即又潜进浪下。
        - id: ch02-b12
          speaker: porpoise
          text: >-
            小家伙，我尾巴发麻，说明风暴追在身后。快跟上！可要是在黏水以南，也就是赤道南边，尾巴发麻便说明风暴挡在前头，那时要向北游。别落下，这里的水已经不对劲了。
        - id: ch02-b13
          speaker: narrator
          text: >-
            科蒂克永远都在学。玛特卡教他顺着海底浅滩追鳕鱼和大比目鱼，把躲在水草洞里的岩鱼猛地扯出来；还教他贴着百英寻深处的沉船游。当受惊的鱼群从船骸里奔逃，他便能像步枪射出的子弹，从一扇舷窗穿进去，再从另一扇冲出来。满天闪电追逐时，他要在起伏的浪顶上跳舞。短尾信天翁和军舰鸟乘风掠过，他还会礼貌地向它们挥一挥鳍。
        - id: ch02-b14
          speaker: narrator
          text: >-
            他还学会像海豚一样跃出水面三四英尺，跃起时把双鳍紧贴身体，尾巴弯成弧形；也学会放过飞鱼，因为那种鱼全身都是硬骨头。潜到十英寻深的地方，他能一边全速前进，一边从鳕鱼肩头撕下一块肉。玛特卡反复提醒他，见到小船或大船都不能停下观看，尤其不能靠近划桨小艇。六个月过去，深海捕鱼再没有什么值得知道而他还不知道的事。这么久，他的鳍一次也没碰过干地。
        - id: ch02-b15
          speaker: narrator
          text: >-
            后来一天，他在胡安·费尔南德斯岛外的暖水里半睡半醒，忽然浑身发软，懒得动弹，仿佛人的腿脚一到春天便发酸。他想起七千英里外那片坚实的海滩，想起同伴的游戏、海草的气味、海豹的吼声和打斗，立刻掉头向北。路上，几十个伙伴也在回乡。
        - id: ch02-b16
          speaker: older_bachelor
          text: >-
            科蒂克，你回来啦！今年大家都是霍鲁斯奇基，可以去卢坎农外的浪里跳火舞，也能到新草地打滚。可你这一身白毛，是从哪儿弄来的？
        - id: ch02-b17
          speaker: kotick
          text: >-
            快游吧！我的骨头想念陆地，已经想得发疼了。至于这身毛，不是我弄来的，是自己长出来的。
        - id: ch02-b18
          speaker: narrator
          text: >-
            科蒂克其实很为那身几乎纯白的皮毛得意，只是不肯停下来炫耀。回到出生的海滩，他们又听见父辈在翻滚的雾中厮打。当晚，一岁的海豹一起跳起火舞。每逢夏夜，海里的微光从诺瓦斯托什纳一直铺到卢坎农。每头飞游的海豹身后都拖着一条燃油般的明亮航迹，跃出海面时更会闪出火焰似的光；大浪扑向海滩，再碎成一条条、一圈圈磷光。
        - id: ch02-b19
          speaker: narrator
          text: >-
            随后，他们到新长的野麦草中翻滚，互讲出海见闻。它们谈太平洋，就像孩子谈一片采过坚果的林子。谁若听得懂，便能据此画出世上从未有过的海图。三四岁的霍鲁斯奇基从哈钦森山上闹着冲下来，吆喝小家伙们让路，又吹嘘大海深不可测，年轻幼崽还没见过里面的种种东西。它们说，等真正绕过合恩角，才有资格谈海。一个家伙再次追问科蒂克的白外衣。科蒂克回答那身毛是自己长出来的，正准备把说话的家伙掀倒，沙丘后面便走出两个黑发红脸的人。
    - id: ch03
      title: 屠宰场与海象礁
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            科蒂克从没见过人，只咳了一声，低下头。霍鲁斯奇基轰地退开几码，坐在那里呆看。来者是猎海豹人的头领克里克·布特林和儿子帕塔拉蒙。他们住在半英里外的小村，这会儿正挑选要赶进屠宰场的海豹。那些海豹会像羊一样被赶走，后来变成皮外套。
        - id: ch03-b02
          speaker: patalamon
          text: >-
            嚯，快看那边！居然有头白海豹！
          emotion: surprised
        - id: ch03-b03
          speaker: narrator
          text: >-
            油污和烟垢下面，克里克的脸几乎吓白了。他是阿留申人，而阿留申人并不爱干净。他低声念起祷词。
        - id: ch03-b04
          speaker: kerick
          text: >-
            帕塔拉蒙，别碰他。我从出生起就没见过白海豹。他也许是老扎哈罗夫的鬼魂。去年那场大风暴把老扎哈罗夫卷走了。
          emotion: fearful
        - id: ch03-b05
          speaker: patalamon
          text: >-
            我才不会靠近。他会带来厄运。可他真是老扎哈罗夫回来了吗？我还欠老头几只海鸥蛋呢。
          emotion: fearful
        - id: ch03-b06
          speaker: kerick
          text: >-
            别盯着他。去把那群四岁的截住。今天原该剥两百张皮，可刚刚开工，工人手还生。一百头够了，快去！
        - id: ch03-b07
          speaker: narrator
          text: >-
            帕塔拉蒙把两块海豹肩骨摇得喀啦响，霍鲁斯奇基顿时停下，只顾呼哧喷气。他向前一步，海豹群便开始移动。克里克从旁拦着，它们竟没想过回伙伴那里。几十万头海豹看着这一切，仍照常玩耍。科蒂克四处发问，可伙伴只知道，每年总有六个星期到两个月，人会这样赶走海豹。
        - id: ch03-b08
          speaker: kotick
          text: >-
            我要跟过去，看他们究竟把伙伴带到哪里。
        - id: ch03-b09
          speaker: narrator
          text: >-
            他瞪圆眼睛，拖着身体跟在海豹群后。帕塔拉蒙惊呼，从来没有海豹会独自走向屠宰场。克里克不许儿子回头，坚持说那就是扎哈罗夫的鬼魂，还打算去问神父。
        - id: ch03-b10
          speaker: narrator
          text: >-
            路只有半英里，他们却走了一个钟头。海豹若走快了，身体会发热，剥皮时毛就会一块块脱落，所以克里克始终压着速度。他们缓慢走过海狮颈，又经过韦伯斯特屋，最后才到盐屋。那里恰好藏在海滩上海豹的视线之外。科蒂克喘着气，满心疑惑，只觉得自己已来到世界尽头。可身后育儿地的咆哮一点没有变小，仍像列车在隧道里隆隆驶过。
        - id: ch03-b11
          speaker: narrator
          text: >-
            克里克坐到苔藓上，掏出沉重的白镴表，让海豹凉三十分钟。雾珠从他帽檐滴落，科蒂克听得清清楚楚。十来个男人走来，每人拿着三四英尺长的包铁棍棒。被同伴咬伤或身子太热的海豹先被厚重的海象喉皮靴踢开。克里克一声令下，棍棒便飞快砸向余下海豹的脑袋。
        - id: ch03-b12
          speaker: narrator
          text: >-
            十分钟后，科蒂克再也认不出自己的朋友。它们的皮从鼻尖一路割到后鳍，接着整张被猛力扯掉，一张张扔在地上堆起来。他已经看得够多了。新长的胡须因恐惧根根直立，他转身便向大海飞奔。海豹若只跑一小段，速度可以快得出奇。到了海狮颈，他鳍脚朝天，一头翻进凉水，随后任身体在浪上摇晃，凄惨地大口喘气。一头向来只顾自己的海狮听见动静，粗声问他出了什么事。
        - id: ch03-b13
          speaker: kotick
          text: >-
            斯库奇尼，奥琴·斯库奇尼！我好孤单，真的好孤单！他们在杀霍鲁斯奇基，各个海滩上的都要杀！
          emotion: fearful
        - id: ch03-b14
          speaker: sea_lion
          text: >-
            胡说。你听，伙伴们还像往常一样吵。你只是撞见老克里克收拾一群海豹。他已经这么干了三十年。
        - id: ch03-b15
          speaker: kotick
          text: >-
            可那实在太可怕了！
          emotion: fearful
        - id: ch03-b16
          speaker: narrator
          text: >-
            一道浪从头顶盖过来，科蒂克立刻倒着划水避让。他又让鳍肢像螺旋一样转动，稳稳刹住身体，最后直立在水中，离尖锐礁石的边缘只有三英寸。这样的动作既灵巧又准确。海狮自己是游泳行家，看见一岁的幼崽有这份本领，也忍不住出声夸奖。
        - id: ch03-b17
          speaker: sea_lion
          text: >-
            站在你的角度，那场面也许真很可怕。不过你们年年都来，人自然记住了这里。除非你能找到一座人永远不到的岛，否则被赶走的事永远不会停。
        - id: ch03-b18
          speaker: kotick
          text: >-
            难道海上没有那样一座岛？
        - id: ch03-b19
          speaker: sea_lion
          text: >-
            我追大比目鱼二十年，也没找到。你既然喜欢向长辈问话，就去海象礁问海巫奇。他也许听说过。先别急，那边有六英里呢。换作我，会先上岸睡一觉再走。
        - id: ch03-b20
          speaker: narrator
          text: >-
            科蒂克觉得劝告有道理，便绕回自己的海滩，上岸睡了半个钟头。他躺在那里，身体像所有睡梦中的海豹一样不住抽动。醒来以后，他径直前往诺瓦斯托什纳东北方的海象礁。那段水路足有六英里。目的地是一片低矮的岩岛，岛上遍布一层层岩架、嶙峋礁石和数不清的海鸥窝，海象不与别的海兽混居，独自聚在那里。
        - id: ch03-b21
          speaker: narrator
          text: >-
            老海巫奇睡在浪边，后鳍一半泡在水里，一半搁在浪外。他庞大、臃肿、满身疙瘩，长着粗肥脖子和一对长牙，是北太平洋最丑陋的海象。除了睡着的时候，他一点礼貌也没有。海鸥叫得厉害，科蒂克只好放声把他叫醒。海巫奇迷迷糊糊地哼了几声，随手用长牙撞醒旁边的海象。那头又撞下一头，一直传遍整群。所有海象总算醒了，却朝每一个错误方向乱看，偏偏不看科蒂克所在的地方。
        - id: ch03-b22
          speaker: kotick
          text: >-
            嗨，是我！有没有一处人绝不会去、海豹却能生活的地方？
        - id: ch03-b23
          speaker: narrator
          text: >-
            浪里的科蒂克像一条白色小蛞蝓。海象们看他的眼神，就像一屋子困倦老先生望着突然闯来的小男孩。
        - id: ch03-b24
          speaker: sea_vitch
          text: >-
            可别把我剥皮！至于你的问题，自己去找。走开，我们忙着呢。
        - id: ch03-b25
          speaker: narrator
          text: >-
            科蒂克刚看够了剥皮，可不愿再听这个词。他像海豚般跃出水面，用最大声音骂海巫奇是吃蛤蜊的。海巫奇一生没抓过鱼，只会从海底拱出蛤蜊和海草，却偏要装成可怕的大人物。奇基鸥、古维鲁斯基鸥和埃帕特卡海雀，也就是大黑背鸥、三趾鸥和海鹦，向来一有机会便要无礼，马上跟着尖叫。足足五分钟，岛上即使有人开枪，枪声也会被淹没。所有居民都骂海巫奇是吃蛤蜊的老头，他却只能左右翻滚，不停哼哼咳嗽。
        - id: ch03-b26
          speaker: kotick
          text: >-
            这下你愿意回答了吗？
        - id: ch03-b27
          speaker: sea_vitch
          text: >-
            去找海牛。他如果还活着，或许能告诉你。
        - id: ch03-b28
          speaker: kotick
          text: >-
            我从没见过海牛，怎样才能认出他？
        - id: ch03-b29
          speaker: burgomaster_gull
          text: >-
            海里只有他比海巫奇更丑，脾气也更坏！听清了吗，老头子？
        - id: ch03-b30
          speaker: narrator
          text: >-
            科蒂克任海鸥继续尖叫，独自游回诺瓦斯托什纳。没有谁支持他寻找安静海滩。大家说，人赶霍鲁斯奇基是年年都有的寻常事；他若怕难看，就不该去屠宰场。可他们没有亲眼见过屠杀。科蒂克见过，这便使他和朋友们不同。何况他还是白海豹。
        - id: ch03-b31
          speaker: sea_catch
          text: >-
            你先长得像父亲这么强壮，替自己抢一片育儿地，人就不会碰你。再过五年，你该能保护自己了。
        - id: ch03-b32
          speaker: matkah
          text: >-
            你阻止不了那些屠杀。科蒂克，去海里玩吧。
        - id: ch03-b33
          speaker: narrator
          text: >-
            科蒂克只好去跳火舞，可那颗年轻的心沉得厉害。
    - id: ch04
      title: 五个季节的寻找
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            那年秋天，科蒂克早早离开海滩，独自出发。他那圆得像子弹的脑袋里装着一个念头。他要找到海牛，也要找到一座坚实安静的岛，让海豹住下，人永远够不着。从北太平洋到南太平洋，他日夜探索，有时一天便游三百英里。
        - id: ch04-b02
          speaker: narrator
          text: >-
            他的险遇多得说不完。姥鲨差一点捉住他，斑鲨和锤头鲨也险些得手。他见过海上到处游荡的种种无赖，那些家伙没有一个可信；也碰过动作笨重、礼数却十分周到的大鱼。还有长着猩红斑点的扇贝，它们把自己固定在一个地方，一待就是几百年，竟为这种本领骄傲得不得了。可无论走多远，海牛始终不见踪影，中意的岛也一座没有。
        - id: ch04-b03
          speaker: narrator
          text: >-
            海滩若坚硬舒适，后方又有斜坡供海豹游戏，天边准会升起捕鲸船熬炼鲸脂的烟。科蒂克一看就明白。有些岛上留着海豹来过、又被赶尽杀绝的痕迹。人只要来过一回，还会再来。
        - id: ch04-b04
          speaker: narrator
          text: >-
            一只老短尾信天翁说，凯尔盖朗岛最安静。科蒂克去了，却碰到雷电交加的雨雪风暴，差一点撞碎在黑色峭壁上。他顶着狂风离开时，仍看出那里也曾有育儿地。别的岛同样如此。
        - id: ch04-b05
          speaker: narrator
          text: >-
            利默辛为我列过一长串地名。据他说，科蒂克整整找了五个季节，每年只回诺瓦斯托什纳休息四个月。每次回去，霍鲁斯奇基都拿他和那些没人见过的岛取笑。他在赤道上的加拉帕戈斯群岛险些被烈日烤死，又去过南乔治亚群岛、奥克尼群岛、翡翠岛、小夜莺岛、戈夫岛、布韦岛和克罗泽群岛。他甚至找过好望角以南一座小得像海上斑点的岛。
        - id: ch04-b06
          speaker: narrator
          text: >-
            不管到了哪里，海中居民都说着同一件事。海豹很久以前曾在那里生活，后来人来了，把它们杀得一头不剩。从戈夫岛归来那次，科蒂克游出太平洋几千英里，来到一个名叫科连特斯角的地方。他在礁石上只找到几百头染着疥癣的海豹。它们告诉他，就连那片荒凉礁石，人也一样会来。
        - id: ch04-b07
          speaker: narrator
          text: >-
            一次次失败几乎把科蒂克的心压垮。他掉头绕过合恩角，向自己的海滩游去。北上途中，他在一座长满绿树的岛靠岸歇息。岛上住着一头老得不能再老的海豹，生命已经走到尽头。科蒂克不忍心丢下他，便下海替他捉来鱼吃，又守在身边，把五个季节里积下的失望和苦恼全讲了出来。
        - id: ch04-b08
          speaker: kotick
          text: >-
            我要回诺瓦斯托什纳。如果人把我和霍鲁斯奇基一起赶进屠宰场，我也无所谓了。
          emotion: sad
        - id: ch04-b09
          speaker: old_seal
          text: >-
            再找一次。我是马萨富埃拉失落育儿地最后一个活下来的。从前，人一次就杀我们十万头。那时海滩上流传着预言，有一天，白海豹会从北方出现，领着海豹一族去安静的地方。我太老了，看不到那一天，可别的海豹看得到。再试一次吧。
        - id: ch04-b10
          speaker: kotick
          text: >-
            所有海滩从来只生过我这一头白海豹。不论黑海豹还是白海豹，也只有我想过寻找新的岛。
        - id: ch04-b11
          speaker: narrator
          text: >-
            科蒂克卷起那副漂亮胡须，心里重新有了力量。那年夏天回到诺瓦斯托什纳时，他早已不是年轻的霍鲁斯奇基，而是完全长成的捕海。肩头披着卷曲的白鬃毛，体重和个头都赶上了父亲，发起怒来也同样凶猛。玛特卡看着成年的儿子，只盼他别再远游，赶快选一位妻子，在熟悉的海滩安顿下来。
        - id: ch04-b12
          speaker: kotick
          text: >-
            妈妈，再给我最后一个季节。你要记得，总是第七道浪冲上海滩最远。
        - id: ch04-b13
          speaker: narrator
          text: >-
            巧得很，另有一头海豹也愿意把婚事等到明年。最后一次远行前的夜里，科蒂克同她沿着卢坎农整片海滩跳遍火舞。出发后，他改向西方，因为恰好追上一大群大比目鱼。如今要维持强壮的身体，他每天至少得吃掉一百磅鱼。他一路追逐进食，直到疲惫不堪，才把身体蜷起来，躺进涌向铜岛的长浪波谷，在海面上沉沉睡去。
        - id: ch04-b14
          speaker: narrator
          text: >-
            午夜时，身子轻轻撞上水草床。他熟悉这里的海岸，只当今夜潮水格外急。可他在水下翻身睁眼，刚伸展开来，便像猫一样惊跳。浅水里有一群巨物，正用鼻子拱着浓密的海草穗边。
        - id: ch04-b15
          speaker: kotick
          text: >-
            凭麦哲伦海峡的巨浪起誓！深海里什么时候多了这些人？
          emotion: surprised
        - id: ch04-b16
          speaker: narrator
          text: >-
            它们不像任何海象、海狮、海豹、熊、鲸、鲨、鱼、乌贼或扇贝。它们有二三十英尺长，没有后鳍，只有一条像湿皮革削成的铲形尾巴。那脑袋蠢得无可比拟。不吃草时，它们就靠尾尖直立在深水里，彼此郑重鞠躬，挥动前鳍，像胖子在挥手。
        - id: ch04-b17
          speaker: kotick
          text: >-
            咳嗯，各位先生，玩得还好吗？
        - id: ch04-b18
          speaker: narrator
          text: >-
            巨物像青蛙仆人似的鞠躬挥鳍，又低头吃草。科蒂克这才看清，它们的上唇裂成两片，左右抽动时能相隔一英尺，再猛地合起来，把足足一蒲式耳海草夹在裂口中。随后，它们慢吞吞把海草塞进口中，神情严肃地咔哧嚼着。
        - id: ch04-b19
          speaker: kotick
          text: >-
            这吃法真够邋遢。好了，就算你们前鳍多一个关节，也不必没完没了地炫耀。你们鞠躬确实优雅，可总该告诉我，你们叫什么吧？
        - id: ch04-b20
          speaker: narrator
          text: >-
            两片嘴唇抖来动去，玻璃般的绿眼睛直直瞪着，就是没有回答。
        - id: ch04-b21
          speaker: kotick
          text: >-
            你们是我见过唯一比海巫奇还丑的家伙，礼貌也比他更差。
        - id: ch04-b22
          speaker: narrator
          text: >-
            这句话让他想起童年时大黑背鸥的叫喊。他惊得向后栽进水中，终于明白，眼前正是苦寻多年的海牛。
    - id: ch05
      title: 海牛的隧道
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            海牛仍在水草间咻噜咻噜地游，啃个不停，也嚼个不停。科蒂克把旅途中学会的语言全试了一遍。海中居民懂的语言几乎和人一样多，可海牛天生不会说话。他的颈骨本该有七块，却只有六块。海底都传说，这便是他连同伴也无法交谈的原因。
        - id: ch05-b02
          speaker: narrator
          text: >-
            不过，海牛的前鳍比别的动物多一个关节。他们让它上下左右挥动，便能传递一套笨拙的信号。到了天亮，科蒂克的鬃毛已经气得全竖起来，耐性早去了死螃蟹去的地方。海牛群这才缓缓北行，一会儿又停下，彼此鞠躬开会。
        - id: ch05-b03
          speaker: kotick
          text: >-
            这么愚蠢的家伙若没有一处安全岛屿，早该叫人杀光了。海牛住得下的地方，捕海也住得下。只是他们能不能游快一点？
        - id: ch05-b04
          speaker: narrator
          text: >-
            跟着海牛旅行实在辛苦。它们一天最多只走四五十英里，夜里还要停下吃草，而且从不肯离岸太远。科蒂克绕到前面催促，又从它们头顶和肚皮下方来回穿梭，使尽办法也没能让队伍多走半英里。越往北去，它们每隔几小时就停下开一次鞠躬会议。科蒂克急得险些把自己的漂亮胡须咬断。后来他细看水势，发现海牛一直沿着一股向北的暖流前进，这才承认那些家伙并非全无见识。
        - id: ch05-b05
          speaker: narrator
          text: >-
            一天夜里，海牛忽然没入闪亮的海水，像一块块石头直沉下去。自从科蒂克遇见它们，这还是它们第一次飞快游起来。他追在后面，简直不敢相信海牛也能有这样的速度。队伍直冲岸边一面伸入深水的峭壁，在水下二十英寻处找到一个黑洞，随后全部钻了进去。里面是一条又黑又长的隧道，长得仿佛没有尽头。科蒂克拼命跟紧，等前方终于透出开阔水色，他已经憋得胸口发紧，只想马上吸到空气。
        - id: ch05-b06
          speaker: kotick
          text: >-
            我的假发呀，这一潜可真长！不过没有白费力气。
          emotion: surprised
        - id: ch05-b07
          speaker: narrator
          text: >-
            海牛已经四散开来，沿着科蒂克见过最美的海滩悠闲吃草。被浪磨得光滑的岩石绵延几英里，宽阔平整，像是专为海豹育儿地铺设。岩石后方，硬实沙地缓缓向内陆升高，正适合幼崽追逐。岸边有可供海豹起舞的滚浪，有能躺进去打滚的长草，也有一座座可以爬上爬下的沙丘。最重要的是，水的感觉清清楚楚告诉科蒂克，从来没人到过这里。真正的捕海永远不会误读海水。
        - id: ch05-b08
          speaker: narrator
          text: >-
            他先下海试了试，确认附近的鱼足够多，随后沿着海岸游去，细数一座座可爱的低矮沙岛。那些岛屿半藏在翻滚的美丽浓雾中。向北望去，外海横着长长一线沙洲、浅滩和礁石，任何船都无法进入海滩六英里以内。群岛和大陆之间却铺着一片深水，一直伸到笔直的峭壁脚下。隧道入口便藏在某处崖底，只有潜入深水才能找到。
        - id: ch05-b09
          speaker: kotick
          text: >-
            这里像另一个诺瓦斯托什纳，却好上十倍。看来海牛比我以为的聪明。人下不了峭壁，船又会被外海浅滩撞碎。整片大海再没有比这里更安全的地方。
        - id: ch05-b10
          speaker: narrator
          text: >-
            科蒂克想起等着自己的那头海豹。虽然归心似箭，他仍把新天地每一处都查明，好回去回答所有疑问。他再次潜水，认准隧道口，向南飞驰。除海牛和海豹，谁也不会猜到峭壁后藏着这样一个世界。回头再望，连科蒂克都难以相信自己刚从岩壁底下穿过。
        - id: ch05-b11
          speaker: narrator
          text: >-
            科蒂克归心似箭，一路丝毫没有放慢，可还是整整游了六天才回到家。他在海狮颈上方爬上岸，最先迎来的不是父母，也不是嘲笑他的霍鲁斯奇基，而是那头一直等着他的海豹。科蒂克还没来得及开口，她只看了看他的眼睛，便已经知道：寻找了五个季节以后，他终于找到了那座岛。
    - id: ch06
      title: 白海豹的迁徙
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            科蒂克把发现讲给大家，霍鲁斯奇基、父亲捕海和其他海豹却一齐嘲笑。一头与他同龄的年轻海豹刚刚娶妻，正为此得意，扭着脑袋向他挑衅。
        - id: ch06-b02
          speaker: young_seal
          text: >-
            你的故事说得不错，可你不能从谁也不知道的地方回来，就命令我们搬走。我们为了育儿地拼过命，你却从没打过一架，只顾在海上闲逛。
        - id: ch06-b03
          speaker: narrator
          text: >-
            周围响起哄笑。那头年轻海豹更加神气。
        - id: ch06-b04
          speaker: kotick
          text: >-
            我没有育儿地要争。我只是想带你们去一处不会被人伤害的地方。何必为了旧地不停打架？
        - id: ch06-b05
          speaker: young_seal
          text: >-
            哦，原来你想找个借口退缩。那我当然没什么好说的了。
        - id: ch06-b06
          speaker: kotick
          text: >-
            如果我打赢你，你就跟我去吗？
          emotion: angry
        - id: ch06-b07
          speaker: narrator
          text: >-
            科蒂克眼里闪出绿光。他并不想打，却被逼得怒火中烧。
        - id: ch06-b08
          speaker: young_seal
          text: >-
            可以。你若赢了，我便跟你走。
        - id: ch06-b09
          speaker: narrator
          text: >-
            年轻海豹来不及反悔。科蒂克一探头，牙齿已咬进他颈上的脂肪。科蒂克靠后半身撑地，把对手拖倒，又摇又撞，最后掀翻在海滩上。
        - id: ch06-b10
          speaker: kotick
          text: >-
            五个季节以来，我已经为你们竭尽全力。我找到了安全的岛，可不把脑袋从你们那些蠢脖子上扯下来，你们就不肯相信。那我现在亲自教会你们。都小心了！
          emotion: angry
        - id: ch06-b11
          speaker: narrator
          text: >-
            利默辛每年都看一万头大海豹争斗，可他短短一生中，从未见过科蒂克这样的冲锋。科蒂克一头扎进育儿地，专找眼前最大的捕海。他咬住对方喉咙，勒得那头大海豹无法呼吸，又把他撞来撞去，重重摔打，直到对方只能哼着求饶。科蒂克随即把战败者扔向一旁，转身扑向下一头，连停也不停。
        - id: ch06-b12
          speaker: narrator
          text: >-
            别的大海豹每年守育儿地时都要连续饿上四个月，等真正交手，身体早已消耗了许多。科蒂克却从不曾这样挨饿，漫长的深海远游更把他练得无比强健。最要紧的是，他以前从没参加过海滩争斗，身上没有旧伤，全部力气都留到了今天。他卷曲的白鬃毛因愤怒根根竖起，双眼像在冒火，两排大犬齿闪着亮光。即使在遍地巨兽的育儿地里，他看上去也威风极了。
        - id: ch06-b13
          speaker: narrator
          text: >-
            老捕海看着儿子横冲直撞，把灰毛老海豹像大比目鱼一样拖来拖去，又把年轻单身汉掀得到处翻滚。他忽然发出一声大吼。
        - id: ch06-b14
          speaker: sea_catch
          text: >-
            他也许是个傻瓜，可他是海滩上最厉害的斗士！儿子，别咬你父亲，我跟你一起干！
        - id: ch06-b15
          speaker: narrator
          text: >-
            科蒂克吼声回应。老捕海胡须直立，摇摆着加入战斗，喷气声像火车头。玛特卡和科蒂克未来的妻子缩在一旁，钦佩地看着他们。只要还有海豹敢抬头，父子就继续打。等再没有对手，他们肩并肩来回巡行，放声咆哮。
        - id: ch06-b16
          speaker: narrator
          text: >-
            夜里，北极光在浓雾中闪动。科蒂克登上一块秃岩，低头看着散乱的育儿地，也看着那些浑身破伤、血流不止的海豹。
        - id: ch06-b17
          speaker: kotick
          text: >-
            现在，你们总该记住教训了。
        - id: ch06-b18
          speaker: sea_catch
          text: >-
            我的假发呀！虎鲸亲自来，也不能把它们打得更惨。儿子，我真为你骄傲。还有，我会跟你去那座岛，只要它确实存在。
        - id: ch06-b19
          speaker: kotick
          text: >-
            海里的肥猪们，都听好了！谁愿意跟我走进海牛的隧道？现在回答，不然我再教你们一次！
          emotion: angry
        - id: ch06-b20
          speaker: narrator
          text: >-
            整片海滩泛起潮水细浪般的低语。成千上万道疲惫的声音一起作答。
        - id: ch06-b21
          speakers: [seal_1, seal_2, seal_3]
          ensemble: chorus
          text: >-
            我们都去。我们跟随科蒂克，跟随白海豹。
        - id: ch06-b22
          speaker: narrator
          text: >-
            科蒂克把头缩进肩间，骄傲地闭起眼。此刻他早已不白，从头到尾都被鲜血染红，可他不肯看自己的伤，更不屑碰一下。
        - id: ch06-b23
          speaker: narrator
          text: >-
            一星期后，科蒂克带领自己的大军离开。队伍中有近一万头霍鲁斯奇基和老海豹，大家一路向北，前往海牛的隧道。留下的海豹站在诺瓦斯托什纳海滩上，骂他们全是傻瓜。第二年春天，两边的海豹在太平洋渔场外相遇。科蒂克的同伴把隧道后方的新海滩讲得那么好，听过故事的海豹便一批批离开诺瓦斯托什纳。
        - id: ch06-b24
          speaker: narrator
          text: >-
            当然，迁徙不是一下子完成的。海豹不算聪明，一件事要在脑中翻来覆去琢磨很久，才肯改变从前的习惯。可是年复一年，离开诺瓦斯托什纳、卢坎农和其他育儿地的海豹越来越多。它们穿过海牛的隧道，前往宁静、有遮护的新海滩。那里一道又一道浅滩挡住船只，高高的笔直峭壁挡住人，从来没有猎海豹的人类踏足。科蒂克每年整个夏天都安稳地坐在那里，身体一年比一年高大、肥壮、强健。霍鲁斯奇基则围在他身边，尽情嬉戏。
