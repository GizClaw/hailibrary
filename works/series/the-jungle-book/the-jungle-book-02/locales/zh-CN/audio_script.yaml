audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉稳从容，带着古老丛林故事的气息
        timbre: 温暖清晰
        pace: 舒缓而富有变化
        pitch: 中等
    baloo:
      display_name: 巴鲁
      tts:
        delivery: 朴实坦率，说话不花哨
        timbre: 厚实温和
        pace: 稍慢
        pitch: 中低
    bagheera:
      display_name: 巴希拉
      tts:
        delivery: 柔和机敏，必要时锋利果断
        timbre: 丝滑深沉
        pace: 从容
        pitch: 中低
    mowgli:
      display_name: 毛克利
      tts:
        delivery: 率真勇敢，少年气息自然鲜明
        timbre: 清亮结实
        pace: 灵活
        pitch: 中等
    kaa:
      display_name: 卡阿
      tts:
        delivery: 古老冷静，礼貌中藏着危险与力量
        timbre: 低柔沙哑
        pace: 缓慢沉稳
        pitch: 低
    rann:
      display_name: 鸢鹰兰恩
      tts:
        delivery: 机警爽快，话音带着高空俯瞰般的轻捷
        timbre: 清亮锐利
        pace: 稍快
        pitch: 偏高
    monkey_1:
      display_name: 猴甲
      tts:
        delivery: 浮夸吵闹，得意时语速飞快
        timbre: 尖亮
        pace: 快
        pitch: 高
    monkey_2:
      display_name: 猴乙
      tts:
        delivery: 轻佻善变，总急着附和同伴
        timbre: 干脆尖细
        pace: 快
        pitch: 偏高
    monkey_3:
      display_name: 猴丙
      tts:
        delivery: 喧闹鲁莽，喊叫时毫无节制
        timbre: 粗亮
        pace: 稍快
        pitch: 中高
    monkey_4:
      display_name: 猴丁
      tts:
        delivery: 虚荣兴奋，合声时格外卖力
        timbre: 沙亮
        pace: 快
        pitch: 高
    cobra_1:
      display_name: 眼镜蛇甲
      tts:
        delivery: 戒备克制，咝声低沉
        timbre: 阴柔沙哑
        pace: 缓慢
        pitch: 低
    cobra_2:
      display_name: 眼镜蛇乙
      tts:
        delivery: 冷淡警觉，句尾带轻微咝声
        timbre: 细冷
        pace: 稍慢
        pitch: 中低
    cobra_3:
      display_name: 眼镜蛇丙
      tts:
        delivery: 谨慎直接，始终保持防备
        timbre: 干涩低哑
        pace: 中等
        pitch: 低
  chapters:
    - id: ch01
      title: 巴鲁的功课
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 花斑让豹子欢喜，犄角叫水牛骄傲，猎手的强健却要从洁净发亮的皮毛上看。小公牛能挑翻你，浓眉水鹿能刺穿你，这种事不必停下活儿来报告，十个寒暑以前，大家就知道了。也别欺负异乡幼崽，要把他们当姐妹兄弟。他们虽小又胖，母亲说不定是头熊。幼崽头一次猎杀，总爱喊谁也比不上自己。丛林那么大，幼崽那么小，就让他安静地这么想吧。这些话出自《巴鲁箴言》。
        - id: ch01-b02
          speaker: narrator
          text: 故事发生在毛克利被西奥尼狼群逐走、找谢尔汗报仇以前。那时，严肃的大棕熊巴鲁正教他丛林法规。小狼只肯学自家狼群用得着的规矩，刚会背《猎手歌》就跑了。歌里说，脚步无声，黑暗里看得清，听得见风吹巢穴，嘴里又有白牙，这样的便是兄弟，塔巴基和讨厌的鬣狗除外。可毛克利是人崽，要学的多得多。
        - id: ch01-b03
          speaker: narrator
          text: 巴希拉有时懒洋洋地走来，把头抵着树，呼噜呼噜听自己的宠儿背书。毛克利爬树、游泳、奔跑，样样都好。巴鲁便教他怎样分辨好枝和朽枝，怎样在五十英尺高处向野蜂客气说话，正午惊动蝙蝠莽格该怎样招呼，跳进水塘前又该怎样提醒水蛇。丛林众生都讨厌受惊，谁突然闯来，它们很容易立刻扑上去。
        - id: ch01-b04
          speaker: narrator
          text: 他还得学异乡猎号。离开自己地盘狩猎时，要一遍遍高喊，直到当地有谁回答。那呼号用人的话说，就是我饿了，请准我在这里狩猎。回答则是只许为了食物捕猎，不许为了取乐杀生。同样的话念上一百遍，毛克利当然烦透了。有一天，他挨了巴鲁一掌，气冲冲跑开。巴鲁这才对巴希拉说起自己的道理。
        - id: ch01-b05
          speaker: baloo
          text: 人崽终究是人崽。丛林法规一条也不能少，他全得学会。
        - id: ch01-b06
          speaker: bagheera
          text: 可他才那么小。你那些没完没了的话，叫他那颗小脑袋怎么装得下？
        - id: ch01-b07
          speaker: baloo
          text: 丛林里再小的东西也可能被杀。所以我非教不可，他忘了，我才轻轻拍他一下。
        - id: ch01-b08
          speaker: bagheera
          text: 轻轻？你这双老铁掌也懂什么叫轻？今天他的脸都被你那份轻手打青了。呸。
        - id: ch01-b09
          speaker: baloo
          text: 与其让无知害死他，不如叫爱他的我把他打得满身青。我教的是丛林主宰密语。只要记牢，飞鸟、蛇族和四足猎手都会保护他，只有他自己的狼群不算。挨几下换来整个丛林的庇护，不值得吗？
        - id: ch01-b10
          speaker: bagheera
          text: 那也别把他打死。人崽不是给你磨钝爪子的树桩。不过我倒想听听那些密语。我惯常帮别人，很少开口求人。
        - id: ch01-b11
          speaker: narrator
          text: 巴希拉伸出前爪，欣赏那一排钢蓝色、凿子般的利爪。巴鲁说，只要毛克利肯，就叫他下来背给黑豹听。
        - id: ch01-b12
          speaker: baloo
          text: 来吧，小兄弟！
        - id: ch01-b13
          speaker: mowgli
          text: 我的脑袋像蜂巢树一样嗡嗡响。我下来是为了巴希拉，不是为了你，肥老巴鲁！
          emotion: angry
        - id: ch01-b14
          speaker: narrator
          text: 闷闷不乐的声音从头顶传来。毛克利怒冲冲滑下树干。巴鲁听得难过，嘴上却说自己不在乎，只叫他把今天学的密语念给巴希拉。
        - id: ch01-b15
          speaker: mowgli
          text: 要听哪一族的？丛林里有那么多语言，我全都知道。
        - id: ch01-b16
          speaker: baloo
          text: 你只知道一点点。看见了吧，巴希拉，学生从来不谢老师。没有一只小狼回来感谢老巴鲁。大学者，先念猎手一族的。
        - id: ch01-b17
          speaker: mowgli
          text: 你我同一血脉。
        - id: ch01-b18
          speaker: narrator
          text: 毛克利用猎手说密语时的熊腔念了出来。巴鲁让他再念飞鸟的，他又念一遍，末尾添上鸢鹰的尖哨。巴希拉叫他念蛇族的，回答便是一串无法形容的咝声。毛克利踢起双脚，拍手给自己叫好，又跳上巴希拉的背，拿脚后跟敲着油亮的黑毛，还送给巴鲁一个最难看的鬼脸。
        - id: ch01-b19
          speaker: baloo
          text: 好啦，好啦。为了学会这些，青上几块也值得。总有一天，你会想起我的。
        - id: ch01-b20
          speaker: narrator
          text: 巴鲁疼爱地说完，又告诉巴希拉，密语是从无所不知的野象哈蒂那里求来的。巴鲁不会发蛇音，哈蒂便把毛克利带到水塘边，请水蛇教他。如今出了意外，蛇、鸟、野兽大都不会伤害毛克利。
        - id: ch01-b21
          speaker: baloo
          text: 这样一来，就没什么可怕的了。
        - id: ch01-b22
          speaker: bagheera
          text: 还有他自己的族类呢。小兄弟，小心我的肋骨！你到底在乱跳什么？
        - id: ch01-b23
          speaker: narrator
          text: 毛克利一直揪着巴希拉肩头的毛，用力踢他，非要两个伙伴听自己说话。他们终于留神时，男孩正扯着嗓子宣布自己的新计划。
        - id: ch01-b24
          speaker: mowgli
          text: 我也会有自己的族群！我要整天领着他们在树枝间奔跑，还要把树枝和泥巴扔到老巴鲁身上。他们已经答应我了。啊！
        - id: ch01-b25
          speaker: narrator
          text: 巴鲁呜夫一声，伸掌把他从黑豹背上捞下来。毛克利仰躺在两只大前掌之间，一眼便看出老熊真生气了。
        - id: ch01-b26
          speaker: baloo
          text: 毛克利，你跟猴族说过话。
          emotion: angry
        - id: ch01-b27
          speaker: narrator
          text: 毛克利转眼去看巴希拉。黑豹的双眼已经硬得像两块碧玉。
        - id: ch01-b28
          speaker: bagheera
          text: 你竟跟灰猿混在一起。那群家伙没有法规，什么都吃。这是奇耻大辱。
          emotion: angry
        - id: ch01-b29
          speaker: mowgli
          text: 巴鲁打得我头疼。我走开以后，是灰猿从树上下来可怜我，别人根本不在乎。
          emotion: sad
        - id: ch01-b30
          speaker: narrator
          text: 毛克利还躺在那里，委屈地抽了抽鼻子。巴鲁喷着鼻息，说猴族的怜悯就像山涧的安静、夏日太阳的清凉，接着追问后来怎样。
        - id: ch01-b31
          speaker: mowgli
          text: 后来他们给我坚果和好吃的，还抱着我爬上树顶。他们说我是同胞兄弟，只是少了一条尾巴，以后会做他们的首领。
        - id: ch01-b32
          speaker: bagheera
          text: 他们连首领都没有。他们在撒谎，那些家伙从来只会撒谎。
        - id: ch01-b33
          speaker: mowgli
          text: 可他们对我很好，还叫我再去。你们为什么从不带我去见猴族？他们也用两只脚站着，不拿硬爪子打我，整天只管玩。放开我，坏巴鲁！我要找他们去！
        - id: ch01-b34
          speaker: baloo
          text: 听好，人崽。丛林各族的法规，我都教了你，唯独没讲树上的猴族。他们是没有法规的弃民，没有自己的语言，只会偷听别人的话。他们没有首领，也没有记性，只管吹牛闲扯，装作马上要成就大事。可一颗坚果掉下来，他们就笑闹着把什么都忘了。我们不喝他们喝过的水，不去他们去的地方，不在他们狩猎之处捕猎，也不在他们死去之处死去。直到今天，你听我提过他们吗？
        - id: ch01-b35
          speaker: mowgli
          text: 没有。
          emotion: sad
        - id: ch01-b36
          speaker: narrator
          text: 巴鲁说完，森林一片寂静。老熊继续告诉他，猴族又多又脏，不知羞耻，永远只想叫丛林注意自己。就算它们把坚果和污物扔下来，大家也不会理会。话音才落，坚果和细枝已经劈头盖脸穿过树叶，高处响起咳嗽、嚎叫和愤怒的蹦跳声。
        - id: ch01-b37
          speaker: baloo
          text: 猴族是禁忌。丛林众生不许和他们来往。记住。
        - id: ch01-b38
          speaker: bagheera
          text: 是禁忌。不过巴鲁，你早该提醒他提防猴族。
        - id: ch01-b39
          speaker: baloo
          text: 我怎么会猜到他要跟这种脏东西玩？猴族，呸！
        - id: ch01-b40
          speaker: narrator
          text: 又一阵杂物落下，巴鲁和巴希拉只得带毛克利小跑离开。猴子住在野兽很少抬头去看的树顶，本不该和丛林众生相遇。可它们会折磨病狼和伤兽，为了取乐扔东西，尖唱蠢歌，邀野兽上树打架，也会为小事彼此恶斗，再把死猴丢给大家看。它们总说很快会有首领、法规和风俗，却连一天的记忆都留不住，只用一句猴族此刻所想，丛林日后也会这样想来安慰自己。谁也够不着它们，谁也不理它们。如今毛克利陪它们玩，巴鲁又真的发了怒，它们快活极了。
        - id: ch01-b41
          speaker: narrator
          text: 猴族做事从没有真正的打算，但有一只猴子忽然想到，毛克利会把树枝编起来挡风，把他留下，就能教会全族。毛克利是樵夫的孩子，常用落枝搭小棚，连自己也不知道为何会做。猴子认定这回真要有首领，也真要成为丛林里最聪明、最受注意的族类。它们一路悄悄跟着三位伙伴。午睡时，毛克利羞愧地睡在巴鲁和巴希拉中间，已经决心再不接近猴族。
    - id: ch02
      title: 树上大道
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 接下来，毛克利只记得几只又硬又有力的手抓住腿和胳膊，树枝抽打脸颊。他从摇晃的叶隙望下去，看见巴鲁的吼声惊醒整座丛林，巴希拉露出满口牙，拼命往树上跃。猴族却抢上黑豹不敢追的细枝，得意地叫嚷，说巴希拉终于注意它们，整个丛林都佩服它们的聪明和本领。
        - id: ch02-b02
          speakers: [monkey_1, monkey_2, monkey_3, monkey_4]
          ensemble: chorus
          text: 他注意我们了！巴希拉注意我们了！丛林众生全都佩服我们！
          emotion: happy
        - id: ch02-b03
          speaker: narrator
          text: 两只最强壮的猴子架住毛克利的腋下，沿离地五十、七十，甚至一百英尺的树上大道飞荡。它们每一跃都有二十英尺，若没有男孩拖累还能快一倍。毛克利又恶心又眩晕，却也觉得这番狂奔有一点痛快。偶尔看见遥远的地面，他便害怕。每次荡到尽头，脚下只有虚空，身体猛地一顿一扯，心几乎要跳到牙齿间。
        - id: ch02-b04
          speaker: narrator
          text: 猴子带他冲到最细的树梢，枝条在脚下噼啪弯折。它们咳叫着扑进空中，再用手脚勾住下一棵树的低枝。有时毛克利能越过静止的绿海望出几英里，像站在桅顶眺望大海，转眼枝叶又迎面抽来，他们几乎落回地面。猴族就这样裹着俘虏，跳跃、冲撞、尖叫着卷向远方。
        - id: ch02-b05
          speaker: narrator
          text: 毛克利起初怕被失手扔下，后来只剩愤怒。他知道挣扎没用，便开始动脑筋。首先得给巴鲁和巴希拉送信。低头只能看见树枝上面，他便仰望天空，发现鸢鹰兰恩正在蓝天上盘旋，等着丛林里有什么东西死去。兰恩发现猴群抬着什么，降低几百码，以为那也许是食物。
        - id: ch02-b06
          speaker: mowgli
          text: 你我同一血脉！
        - id: ch02-b07
          speaker: narrator
          text: 兰恩听见飞鸟的呼号，吃惊地吹了声口哨。他刚看清树梢上的棕色小脸，翻涌的枝叶便把毛克利吞没。他立刻滑向下一棵树上空，男孩的脸果然又冒了出来。
        - id: ch02-b08
          speaker: mowgli
          text: 记住我的踪迹！去告诉西奥尼狼群的巴鲁，还有议事岩的巴希拉！
        - id: ch02-b09
          speaker: rann
          text: 小兄弟，我该以谁的名义传话？
        - id: ch02-b10
          speaker: mowgli
          text: 青蛙毛克利！他们叫我人崽！一定记住我的踪迹！
        - id: ch02-b11
          speaker: narrator
          text: 最后几个字，是毛克利被甩过空中时喊出的。兰恩点点头，一直升到像尘埃那么小，用望远镜般的眼睛盯住树梢的摇动。
        - id: ch02-b12
          speaker: rann
          text: 他们走不了多远。猴族从来做不成原本想做的事。这回只要我的眼睛没坏，它们啄下来的可是自己的麻烦。巴鲁不是雏鸟，巴希拉能杀的也绝不只是山羊。
        - id: ch02-b13
          speaker: narrator
          text: 兰恩收起双脚，轻轻摇着翅膀等待。与此同时，巴鲁和巴希拉又怒又痛。巴希拉用从未有过的力气爬树，可细枝承不住他，接连折断。他滑回地面，爪缝里塞满树皮。巴鲁则笨拙地小跑，还盼着追上猴群。
        - id: ch02-b14
          speaker: bagheera
          text: 你为什么没警告人崽？你差点一掌一掌把他打死，却一句也没提醒他防猴族。那些巴掌到底有什么用？
          emotion: angry
        - id: ch02-b15
          speaker: baloo
          text: 快一点！再快一点！我们也许还能追上！
          emotion: fearful
        - id: ch02-b16
          speaker: bagheera
          text: 就凭你这速度，连受伤的母牛都累不着。法规老师，打幼崽的家伙，你摇上一英里，肚皮就要爆了。坐下想办法！现在追不得，逼得太近，它们也许会把他扔下来。
        - id: ch02-b17
          speaker: baloo
          text: 它们也许早就抱腻，把他扔下去了！谁能信猴族？把死蝙蝠扣在我头上，叫我啃黑骨头，把我滚进蜂窝蜇死，再跟鬣狗埋在一起吧！我是世上最悲惨的熊。毛克利啊，我怎么只顾着敲你的脑袋，却没教你提防猴族？也许我连今天的功课都给打出去了。如今他一个人在丛林里，连主宰密语都记不起。
          emotion: sad
        - id: ch02-b18
          speaker: narrator
          text: 巴鲁用前掌捂住耳朵，滚来滚去地呻吟。巴希拉提醒他，毛克利不久前才准确念过所有密语，又骂老熊没记性、没体面。若堂堂黑豹也学豪猪伊基蜷起来嚎叫，整座丛林会怎样看他们？
        - id: ch02-b19
          speaker: baloo
          text: 我才不管丛林怎么看！他也许已经死了！
          emotion: fearful
        - id: ch02-b20
          speaker: bagheera
          text: 除非猴子拿摔他取乐，或无聊得把他杀掉，否则我不怕他出事。他聪明，受过好教导，还有一双叫丛林众生害怕的眼睛。麻烦在于猴族住在树上，谁都不怕。
        - id: ch02-b21
          speaker: narrator
          text: 巴希拉一边思量，一边舔着前爪。巴鲁忽然伸展开身体，骂自己是又肥又棕、只会刨树根的蠢熊。他想起哈蒂说过，各有各怕。猴族也有怕的东西，那就是岩蟒卡阿。卡阿同样能爬树，夜里还会偷走小猴。只要轻声说出他的名字，猴子的尾巴就会发冷。
        - id: ch02-b22
          speaker: baloo
          text: 我们去找卡阿。他年纪老，心眼多，最要紧的是总在挨饿。我们答应送他许多山羊。
        - id: ch02-b23
          speaker: bagheera
          text: 他为什么帮忙？他没有脚，也不是我们的族类，那双眼睛更邪门。他要是刚吃饱，就能睡一个月。即使醒着，也可能宁愿自己去杀山羊。
        - id: ch02-b24
          speaker: baloo
          text: 真要那样，你和我联起手来，也许能叫这位老猎手讲讲道理。
        - id: ch02-b25
          speaker: narrator
          text: 巴鲁拿褪色的棕肩膀蹭了蹭黑豹。两个伙伴动身去找岩蟒卡阿。
    - id: ch03
      title: 寻找卡阿
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 午后的岩架被太阳晒得暖烘烘，卡阿正在那里欣赏刚换好的棕黄斑新衣。他独自躲了十天蜕皮，此刻神采焕然，钝鼻子贴地游走，三十英尺长的身躯盘出一个个结和弧线。想到晚餐，他不住舔嘴。巴鲁看出他还没进食，松了口气，又提醒巴希拉，蛇刚蜕皮时眼神不清，出击却依旧快。卡阿不是毒蛇，也瞧不起胆小的毒蛇。他只靠缠抱，一旦巨大身体收紧，猎物便完了。
        - id: ch03-b02
          speaker: baloo
          text: 祝狩猎顺利！
        - id: ch03-b03
          speaker: narrator
          text: 卡阿起初没听见，随后盘紧身体，压低脑袋防备意外。
        - id: ch03-b04
          speaker: kaa
          text: 愿我们狩猎都顺利。巴鲁，巴希拉，你们来做什么？我们当中至少该有一个吃东西了。附近有母鹿吗？小公鹿也行。我肚里空得像枯井。
        - id: ch03-b05
          speaker: baloo
          text: 我们正在狩猎。
        - id: ch03-b06
          speaker: kaa
          text: 那就让我同行。你们挨一下不算什么，我却要在小径上等好几天，再爬半夜的树，才可能碰上一只小猴。现在的树枝尽是朽枝，远不如我年轻时结实。
        - id: ch03-b07
          speaker: baloo
          text: 也许是你的分量太大了。
        - id: ch03-b08
          speaker: kaa
          text: 我只是长得很匀称。上回我差点摔下来，尾巴一滑，猴族醒了，还用最恶毒的名字骂我。
        - id: ch03-b09
          speaker: bagheera
          text: 我好像听见它们叫你没脚的黄蚯蚓。
        - id: ch03-b10
          speaker: kaa
          text: 咝！它们真敢这样叫我？
          emotion: angry
        - id: ch03-b11
          speaker: bagheera
          text: 它们还说你牙掉光了，不敢碰比小山羊大的东西，因为你怕公山羊的角。猴族真不知羞耻。
        - id: ch03-b12
          speaker: narrator
          text: 卡阿很少显露怒气，可两位伙伴都看见他喉旁的吞咽肌鼓了起来。他平静地说猴族换了地方，自己晒太阳时听见了叫嚷。巴鲁只好承认，他们追的正是猴族。卡阿更加好奇，客气地追问什么大事能让两位丛林首领关心猴子。
        - id: ch03-b13
          speaker: bagheera
          text: 巴希拉就是巴希拉。事情很简单，那群偷坚果的家伙抢走了我们的人崽。你也许听说过他。
        - id: ch03-b14
          speaker: kaa
          text: 伊基讲过狼群里有个人类小东西，可他的故事总缺一半，还讲得很糟。
        - id: ch03-b15
          speaker: baloo
          text: 这是真的。他是最好、最聪明、最勇敢的人崽，也是我的学生。往后他会让各处丛林都知道巴鲁的名字。而且，我们爱他。
        - id: ch03-b16
          speaker: narrator
          text: 卡阿摆着头，说自己也懂得爱，还能讲许多故事。巴希拉连忙说，故事留到月明又吃饱的时候再听。眼下毛克利落在猴族手中，而丛林众生里，它们只怕卡阿。
        - id: ch03-b17
          speaker: kaa
          text: 它们怕我，怕得对。猴子吵闹、愚蠢又虚荣。它们拿到坚果，很快就厌了，扛着树枝说要做大事，转眼便折断。落在它们手里可没有好命。我们得教它们尊敬主人，也得帮帮它们那靠不住的记性。它们把幼崽带到哪里了？
        - id: ch03-b18
          speaker: narrator
          text: 巴鲁只知道它们往日落方向去了。正在这时，兰恩从高空喊他们抬头，俯冲到枝叶上方。
        - id: ch03-b19
          speaker: rann
          text: 我看见毛克利了。他叫我来传话。猴族带他过河，去了猴城寒穴。我一路盯着，还让蝙蝠夜里继续监视。它们可能待十夜，也可能一个钟头就走。口信送到，祝各位狩猎顺利！
        - id: ch03-b20
          speaker: bagheera
          text: 愿你吃得嗉囊饱满，睡得又沉又香！下次捕猎，我把头留下送给最了不起的鸢鹰。
        - id: ch03-b21
          speaker: rann
          text: 不算什么。男孩会主宰密语，我不能不帮。
        - id: ch03-b22
          speaker: narrator
          text: 兰恩飞回栖处。巴鲁为学生被拖过树梢时仍记得飞鸟密语而骄傲，巴希拉也承认自己同样骄傲。寒穴是一座被丛林掩埋的古城，猎手不去人类用过的地方，除了旱季水池还有水时，正派动物连看都不愿看那里。全速赶路也要半夜。巴鲁保证尽快，可黑豹叫他随后跟来，自己与卡阿先行。巨蟒说，有脚没脚，他都跟得上四条腿。
        - id: ch03-b23
          speaker: narrator
          text: 巴鲁奋力赶了一程，只得留下喘气。巴希拉飞跑，卡阿无声相随。过山溪时黑豹一跃而过，暂时领先，卡阿游过水面又追平。暮色里，巴希拉惊叹他一点也不慢。
        - id: ch03-b24
          speaker: kaa
          text: 我饿了。何况它们还叫我花斑青蛙。
        - id: ch03-b25
          speaker: bagheera
          text: 是蚯蚓，黄蚯蚓。
        - id: ch03-b26
          speaker: kaa
          text: 都一样。继续走。
    - id: ch04
      title: 寒穴之夜
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 寒穴的猴族毫无防备。失落之城建在山顶，石路通向残门，锈铰链上挂着木屑，树木穿墙而出，野藤垂过塔楼。无顶宫殿里，庭院和喷泉裂开，野草顶碎象院石板。空房像装满黑暗的蜂巢，旧神像成了广场上的怪石，公井只剩街角洼坑。猴子不懂这些东西，只会在议事厅捉虱子，学人类进出房间，收藏砖灰又立刻忘记，打斗哭叫后跑去摇落花果，把水喝浑又为水争吵。
        - id: ch04-b02
          speakers: [monkey_1, monkey_2, monkey_3, monkey_4]
          ensemble: chorus
          text: 丛林里没有谁比猴族更聪明、更善良、更机灵、更强壮、更温和！
          emotion: happy
        - id: ch04-b03
          speaker: narrator
          text: 下午很晚，猴子才把疲惫的毛克利拖进城，却不让他睡，反而手拉手跳舞唱歌。一只猴子宣布，抓住毛克利是猴族历史的新篇章，他会教大家用枝条藤蔓遮风挡雨。毛克利动手编了几根藤，猴子跟着学了几分钟，便去扯尾巴、跳来跳去。
        - id: ch04-b04
          speaker: mowgli
          text: 我饿了。我在这里是异乡人。给我食物，不然就准我在这里狩猎。
        - id: ch04-b05
          speaker: narrator
          text: 二三十只猴子去拿坚果和木瓜，半路却打起来，剩下的果子也不肯送回。毛克利又疼又饿，发出异乡猎号却无人回答。他终于明白巴鲁说的全是真的。这里没有法规、猎号和首领，只有蠢话与乱抓的小手。若自己饿死或被杀，全怪自己。他宁可回去挨巴鲁的打，也不愿陪猴族追玫瑰花瓣。
        - id: ch04-b06
          speaker: narrator
          text: 他走到城墙便被拖回，猴子掐他，要他懂得感激。毛克利咬牙不语，被带到蓄水池露台。半池雨水旁有一座破顶的大理石凉亭，镂花屏嵌着彩石。月光穿过孔洞，在地上投出黑丝绒刺绣般的影子。猴子一批批挤来，夸耀自己的伟大，又说毛克利想走十分愚蠢。
        - id: ch04-b07
          speakers: [monkey_1, monkey_2, monkey_3, monkey_4]
          ensemble: chorus
          text: 我们伟大，我们自由，我们是整座丛林最了不起的族类！大家都这样说，那就一定是真的！你得把我们的话带给丛林，让他们注意我们！
          emotion: happy
        - id: ch04-b08
          speaker: narrator
          text: 成百上千只猴子听演说家赞美自己，每逢对方换气便齐声附和。毛克利只管点头眨眼，偶尔说一声是，心里认定塔巴基咬过这里所有猴子，它们全得了疯病。他看见云正靠近月亮，盼着借黑暗逃走，却已经累极了。城墙下，巴希拉与卡阿也盯着那片云。他们知道猴族只有占到一百对一才肯开战，不能冒失。
        - id: ch04-b09
          speaker: kaa
          text: 我去西墙。那里顺坡，我能很快冲下来。它们不敢几百只一起扑到我背上。
        - id: ch04-b10
          speaker: bagheera
          text: 我明白。真希望巴鲁也在，可我们只能尽力。云一遮住月亮，我就上露台。它们正围着男孩开会。
        - id: ch04-b11
          speaker: kaa
          text: 祝狩猎顺利。
        - id: ch04-b12
          speaker: narrator
          text: 卡阿滑向西墙，寻找攀爬石壁的路。云终于遮住月亮，巴希拉几乎无声地冲上露台，在五六十层厚的猴群里左右猛击，不肯浪费时间下口。猴子又怕又怒，把他绊倒，随即挤成一团撕咬抓扯。另几只把毛克利拖上凉亭墙头，从破穹顶推下去。十五英尺本足以摔伤普通孩子，毛克利却照巴鲁教的办法双脚落地。
        - id: ch04-b13
          speakers: [monkey_1, monkey_2, monkey_3]
          ensemble: chorus
          text: 待在下面！等我们杀掉你的朋友，再来找你玩。要是毒族没先弄死你！
        - id: ch04-b14
          speaker: mowgli
          text: 你我同一血脉！你我同一血脉！
        - id: ch04-b15
          speakers: [cobra_1, cobra_2, cobra_3]
          ensemble: chorus
          text: 正是！全都收起颈冠。站稳，小兄弟，别踩伤我们。
        - id: ch04-b16
          speaker: narrator
          text: 废墟里本就遍布蛇窝。毛克利透过石屏听外面的恶战，巴希拉被层层压住，后退、腾跃、扭身、猛冲，发出嘶哑的咳声。黑豹平生第一次在为性命而战。毛克利相信巴鲁就在附近，因为巴希拉不会独自来。
        - id: ch04-b17
          speaker: mowgli
          text: 去水池，巴希拉！朝蓄水池滚！跳进水里！
        - id: ch04-b18
          speaker: narrator
          text: 男孩平安的喊声给了巴希拉力量，他一寸寸杀向水池。忽然，丛林一侧残墙上传来巴鲁轰响的战吼。老熊竭尽全力还是迟到了。
        - id: ch04-b19
          speaker: baloo
          text: 巴希拉，我来了！我正在爬！石头在脚下打滑。等着我，你们这些最卑鄙的猴族！
          emotion: angry
        - id: ch04-b20
          speaker: narrator
          text: 巴鲁登上露台便被猴群淹没。他坐稳后腿，张开前掌，抱住多少便打多少，啪、啪、啪，像明轮拍水。撞击和落水声说明巴希拉终于进了猴子不敢追的水池。猴群围住红台阶，等他上岸。黑豹以为卡阿逃了，绝望地抬起滴水的下巴，用蛇族密语求庇护。连快被闷死的巴鲁听见，也忍不住暗笑。
    - id: ch05
      title: 卡阿出击
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 卡阿刚翻过西墙，落地一扭便把压顶石撞进壕沟。他盘起又舒展身体，确保三十英尺的每一段都听使唤。蝙蝠把战讯传遍丛林，哈蒂也扬鼻长鸣，远处猴群正沿树上大道赶来，白日活动的鸟全被惊醒。卡阿笔直冲出，全部重量和力量都推到头部。那像长矛、攻城槌，又像一柄近半吨重的巨锤，柄里装着冷静的心。他第一击撞进围攻巴鲁的猴群，闭紧嘴巴，全力一击便已足够。
        - id: ch05-b02
          speakers: [monkey_1, monkey_2, monkey_3, monkey_4]
          ensemble: chorus
          text: 卡阿！是卡阿！快逃！
          emotion: fearful
        - id: ch05-b03
          speaker: narrator
          text: 老猴世代用卡阿的故事吓小猴。这个夜间盗贼能像苔藓生长一样无声滑过树枝，也能装成枯枝树桩，直到树枝忽然抓住猎物。没有猴子知道他的力量尽头，也没有谁被缠住后活下来。猴群结巴着逃上屋顶城墙。卡阿吐出长长咝声，援兵立刻停下，墙头也安静。巴希拉上岸抖水，猴子又跳上高墙和石像尖叫。毛克利则隔着石屏跳舞，发出猫头鹰般的嘲笑声。
        - id: ch05-b04
          speaker: bagheera
          text: 把人崽弄出来，我已经打不动了。带上他，我们走，猴子也许还会进攻。
        - id: ch05-b05
          speaker: kaa
          text: 没有我的命令，它们一步也不敢动。全都待着！兄弟，我来晚了，不过好像听见你求援。
        - id: ch05-b06
          speaker: bagheera
          text: 我在战斗中也许喊过一声。巴鲁，你受伤了吗？
        - id: ch05-b07
          speaker: baloo
          text: 我还不确定它们有没有把我扯成一百只小熊。哇，真疼！卡阿，我和巴希拉都欠你一条命。
        - id: ch05-b08
          speaker: kaa
          text: 不值一提。小人崽在哪里？
        - id: ch05-b09
          speaker: mowgli
          text: 我在这里，被困住了！我爬不出去！
        - id: ch05-b10
          speakers: [cobra_1, cobra_2, cobra_3]
          ensemble: chorus
          text: 把他带走。他跳得像孔雀毛奥，会踩坏我们的幼崽。
        - id: ch05-b11
          speaker: kaa
          text: 这小人崽到处都有朋友。退后，毒族也藏好。我要撞墙了。
        - id: ch05-b12
          speaker: narrator
          text: 卡阿找到石屏上一道变色裂缝，轻碰几下量准距离，抬起六英尺长的前身，用鼻端猛撞六次。石屏轰然破碎，瓦砾四飞。毛克利跃出缺口，扑进两个朋友中间，一手搂住一条粗脖子。
        - id: ch05-b13
          speaker: baloo
          text: 你受伤了吗？
        - id: ch05-b14
          speaker: mowgli
          text: 浑身都疼，又饿，还青了好多地方。可你们伤得更重，我的兄弟，你们都在流血！
          emotion: sad
        - id: ch05-b15
          speaker: bagheera
          text: 别人也一样。
        - id: ch05-b16
          speaker: baloo
          text: 只要你平安就好，我所有小青蛙里最叫我骄傲的一个！
          emotion: happy
        - id: ch05-b17
          speaker: bagheera
          text: 有没有事以后再说。我们靠卡阿赢了，你也欠他一条命。毛克利，照规矩道谢。
        - id: ch05-b18
          speaker: kaa
          text: 原来这就是小人崽。皮肤柔软，跟猴族也不全然两样。小心别让我在刚换衣的黄昏把你错认成猴子。
        - id: ch05-b19
          speaker: mowgli
          text: 你我同一血脉。今晚你救了我的命。卡阿，以后你饿了，我的猎物就是你的猎物。
        - id: ch05-b20
          speaker: kaa
          text: 多谢，小兄弟。这样勇敢的猎手能杀些什么？我只想知道，下次好跟着你出猎。
        - id: ch05-b21
          speaker: mowgli
          text: 我还小，什么也杀不了。不过我能替需要的人赶山羊。你饿时来找我，看我是不是说真话。我这双手也有些本领。若你落进陷阱，也许我能偿还欠你们的债。祝各位大人狩猎顺利。
        - id: ch05-b22
          speaker: kaa
          text: 勇敢的心，谦恭的舌头，会带你在丛林里走得很远。现在跟朋友离开，月亮快落了，接下来的事不适合你看。
    - id: ch06
      title: 饥饿之舞
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 月亮沉向山后，猴子挤在雉堞上，像一圈破烂颤动的穗边。巴鲁下去饮水，巴希拉整理皮毛。卡阿滑到露台中央，双颚啪地合拢，所有目光都被吸过去。
        - id: ch06-b02
          speaker: kaa
          text: 月亮要落了。现在还看得清吗？
        - id: ch06-b03
          speakers: [monkey_1, monkey_2, monkey_3, monkey_4]
          ensemble: chorus
          text: 看得清，卡阿大人。
          emotion: fearful
        - id: ch06-b04
          speaker: kaa
          text: 很好。现在开始卡阿的饥饿之舞。坐着别动，好好看。
        - id: ch06-b05
          speaker: narrator
          text: 卡阿绕着大圈游走，脑袋左右摆动。身体盘成圆环和八字，流动的三角又变成方形、五边形和层层丘堆。他不停，也不急，始终低声哼唱。天越来越暗，变幻的蛇身终于隐没，只剩鳞片摩擦的沙沙声。巴鲁和巴希拉僵如石头，颈毛直竖，毛克利却只是惊奇迷惑。
        - id: ch06-b06
          speaker: kaa
          text: 猴族，没有我的命令，你们能动一只手或一只脚吗？
        - id: ch06-b07
          speakers: [monkey_1, monkey_2, monkey_3, monkey_4]
          ensemble: chorus
          text: 没有您的命令，我们一只手、一只脚也动不了。
          emotion: fearful
        - id: ch06-b08
          speaker: kaa
          text: 很好。全都朝我走近一步。再近些！
        - id: ch06-b09
          speaker: narrator
          text: 一排排猴子不由自主向前，巴鲁和巴希拉也僵硬地迈步。毛克利抓住两个伙伴，把他们往外带。两头大兽猛然一震，仿佛从梦里醒来。
        - id: ch06-b10
          speaker: bagheera
          text: 手别离开我的肩膀。一直放着，不然我会回去，走到卡阿那里。
          emotion: fearful
        - id: ch06-b11
          speaker: mowgli
          text: 不过是老卡阿在尘土上绕傻圈。我们走吧。
        - id: ch06-b12
          speaker: narrator
          text: 三个伙伴从墙洞溜回丛林。到了寂静树下，巴鲁浑身一抖，发誓再也不请卡阿做盟友。巴希拉颤声说，卡阿懂得比他们多，再留一会儿，自己会走进他的喉咙。巴鲁知道，下一轮月亮升起前，会有许多猴子走上那条路，卡阿将用自己的方式好好狩猎。
        - id: ch06-b13
          speaker: mowgli
          text: 可那到底是什么意思？我只看见一条大蛇天黑前绕蠢圈。他的鼻子还擦破了。哈，哈！
        - id: ch06-b14
          speaker: bagheera
          text: 他的鼻子是为你伤的。我的耳朵、腰、爪子，还有巴鲁的脖颈和肩膀，也都为你挨了咬。好些天里我们都不能痛快狩猎。
          emotion: angry
        - id: ch06-b15
          speaker: baloo
          text: 没关系，人崽回来了。
        - id: ch06-b16
          speaker: bagheera
          text: 可代价很重。我们丢了狩猎时间，受了伤，损了皮毛和荣誉。我堂堂黑豹被迫向卡阿求庇护，我们又都被饥饿之舞迷住。人崽，这全因你同猴族玩耍。
        - id: ch06-b17
          speaker: mowgli
          text: 是这样。我是个坏人崽，肚子里满是悲伤。
          emotion: sad
        - id: ch06-b18
          speaker: bagheera
          text: 巴鲁，丛林法规怎么说？
        - id: ch06-b19
          speaker: narrator
          text: 巴鲁不愿让毛克利更难过，却不能歪曲法规，只得含糊地说，悲伤不能免去惩罚，不过孩子还小。巴希拉答应记得，但闯祸之后仍必须挨打。
        - id: ch06-b20
          speaker: bagheera
          text: 毛克利，你还有什么话要说？
        - id: ch06-b21
          speaker: mowgli
          text: 没有。我做错了，你和巴鲁都受了伤，我该受罚。
        - id: ch06-b22
          speaker: narrator
          text: 巴希拉按黑豹所谓的爱抚，给了毛克利半打轻掌。那力气未必叫得醒黑豹幼崽，落在七岁男孩身上，却是人人都想躲的重罚。毛克利挨完，打个喷嚏，默默站起。
        - id: ch06-b23
          speaker: bagheera
          text: 现在跳到我背上来，小兄弟。我们回家。
        - id: ch06-b24
          speaker: narrator
          text: 丛林法规有一个好处。惩罚过后，旧账就一笔勾销，不会再有没完没了的责备。毛克利把头伏在巴希拉背上，睡得很沉。后来被放进家洞时，他连醒也没有醒。
