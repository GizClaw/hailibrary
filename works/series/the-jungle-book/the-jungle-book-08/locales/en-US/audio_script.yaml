  chapters:
    - id: ch01
      title: Lukannon
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "All the St. Paul seals sing this deep-sea song as they return to their beaches for the summer. It is their sad national anthem."
        - id: ch01-b02
          speaker: narrator
          text: "I met my companions in the morning, though I had grown old. The summer swell roared against the ledges, and their chorus drowned the breaking waves. Two million voices sang of the Beaches of Lukannon."
        - id: ch01-b03
          speaker: narrator
          text: "They sang of pleasant resting places beside the salt lagoons, of companies of seals shuffling over the dunes, and of midnight dances that churned the sea to flame. Those were the Beaches of Lukannon before the sealers came."
        - id: ch01-b04
          speaker: narrator
          text: "I met my companions that morning, knowing I would never meet them again. They came and went in legions that darkened the shore. Across the foam-flecked sea, as far as voices carried, we hailed the seals and sang them up the beach."
        - id: ch01-b05
          speaker: narrator
          text: "They sang of Lukannon, where the winter wheat grew tall and curled lichens dripped in the sea fog. They sang of the smooth, worn rocks of their playground and the beaches where they were born."
        - id: ch01-b06
          speaker: narrator
          text: "When I met my companions that morning, they were only a broken and scattered band. Men shot the seals in the water and clubbed them on the land. They drove them toward the Salt House as if they were tame, foolish sheep. Still the seals sang of Lukannon as it had been before the sealers came."
        - id: ch01-b07
          speaker: narrator
          text: "Turn southward now, Gooverooska, and carry the story of our sorrow to the rulers of the deep sea. Go before the storm casts the empty beaches aside like a shark's egg, and Lukannon never sees its sons again."
