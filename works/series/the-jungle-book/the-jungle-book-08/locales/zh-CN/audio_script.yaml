audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉稳从容，带着古老丛林故事的气息
        timbre: 温暖清晰
        pace: 舒缓而富有变化
        pitch: 中等
    seal_1:
      display_name: 海豹甲
      tts:
        delivery: 疲惫却坚定，代表随行的海豹
        timbre: 粗厚
        pace: 中等
        pitch: 中低
    seal_2:
      display_name: 海豹乙
      tts:
        delivery: 疲惫却坚定，代表随行的海豹
        timbre: 清晰
        pace: 中等
        pitch: 中等
    seal_3:
      display_name: 海豹丙
      tts:
        delivery: 疲惫却坚定，代表随行的海豹
        timbre: 低柔
        pace: 中等
        pitch: 低
  chapters:
    - id: ch01
      title: 两百万个声音
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            每到夏天，圣保罗岛的海豹游回故乡海滩，就会一起唱起这首辽阔的深海之歌。歌声庄严，却又无比哀伤，像是海豹自己的国歌。
        - id: ch01-b02
          speakers: [seal_1, seal_2, seal_3]
          ensemble: chorus
          text: >-
            清晨，我遇见了伙伴。啊，我已经老了！夏日的长涌扑上岩架，滚滚咆哮。我听见伙伴们放声合唱，连碎浪的歌声也被压了下去。那是卢坎农的海滩，两百万个声音一同唱响。
        - id: ch01-b03
          speakers: [seal_1, seal_2, seal_3]
          ensemble: chorus
          text: >-
            我们唱咸水潟湖边安乐的家园，唱喷着水雾的队伍摇摇摆摆走下沙丘，也唱午夜的舞蹈怎样把大海搅成火光。那是卢坎农的海滩，是猎海豹人还没来时的故乡！
    - id: ch02
      title: 出生的故乡
      blocks:
        - id: ch02-b01
          speakers: [seal_1, seal_2, seal_3]
          ensemble: chorus
          text: >-
            清晨，我又遇见伙伴，可往后再也见不到他们了！他们曾像千军万马一样来去，把整片海岸遮得黑压压的。白沫斑斑的外海上，只要呼声还能传到，我们就迎接登岸的伙伴，一路唱着送他们上滩。
        - id: ch02-b02
          speakers: [seal_1, seal_2, seal_3]
          ensemble: chorus
          text: >-
            卢坎农的海滩啊，冬麦长得那么高。皱褶的地衣滴着水，海雾把一切湿透。游乐场的岩台被我们磨得又亮又滑。卢坎农的海滩啊，那是我们出生的故乡！
    - id: ch03
      title: 海滩的哀歌
      blocks:
        - id: ch03-b01
          speakers: [seal_1, seal_2, seal_3]
          ensemble: chorus
          text: >-
            清晨，我再遇见伙伴，只看见一群破碎离散的残兵。人在水里向我们开枪，又在陆上挥棒击打。他们把我们当成驯顺的笨羊，赶向盐屋。可我们仍在歌唱卢坎农，歌唱猎海豹人到来以前的故乡。
        - id: ch03-b02
          speakers: [seal_1, seal_2, seal_3]
          ensemble: chorus
          text: >-
            向南盘旋吧，向南盘旋吧。古韦鲁斯卡，飞去吧！把我们的苦难讲给深海的总督们听。快趁卢坎农还没有空得像风暴抛上岸的鲨鱼卵，趁这片海滩还没有永远失去自己的儿郎！
