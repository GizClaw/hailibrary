cover_prompt: |-
  A wordless cover scene in the forests of central India centers on Mowgli among the animals who teach and protect him. Mowgli is a lean brown-skinned Indian boy of about ten with shaggy black hair and a simple russet waistcloth, standing barefoot on a sun-warmed rock; he is designed from the text without resemblance to later adaptations. Bagheera is a sleek black panther with a pale throat mark, Baloo a large sloth bear with shaggy dark fur, and Akela a gray Indian wolf watching from the edge of the clearing. Mowgli extends an open hand toward a wolf cub as shafts of dawn light cross bamboo, sal trees, and tall grass, making belonging the focal action. Use a low forest-floor three-quarter view with the animals forming a protective arc and breathing room in the luminous canopy above. Keep anatomy, plants, and setting credible, expressions restrained, and the scene adventurous but non-frightening. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
