  chapters:
    - id: ch01
      title: The Man-Cub at the Cave
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Rann the Kite brings home the night that Mang the Bat sets free. The herds are shut in byre and hut, while claw and tusk and talon roam until dawn. This is the hour of pride and power. Good hunting to all who keep the Jungle Law."
        - id: ch01-b02
          speaker: narrator
          text: "At seven on a very warm evening in the Seeonee hills, Father Wolf woke from his day's rest. He scratched, yawned, and stretched each paw until the sleepy feeling left his toes. Mother Wolf lay nearby with her gray nose across four tumbling, squealing cubs. Moonlight shone into the cave."
        - id: ch01-b03
          speaker: father_wolf
          text: "Augrh! Time to hunt again."
        - id: ch01-b04
          speaker: narrator
          text: "He was about to spring downhill when a small shadow with a bushy tail crossed the entrance."
        - id: ch01-b05
          speaker: tabaqui
          text: "Good luck go with you, Chief of the Wolves. And may your noble children have strong white teeth and never forget the hungry creatures of this world."
        - id: ch01-b06
          speaker: narrator
          text: "It was Tabaqui the jackal, the Dish-licker. The wolves of India despised him. He ran from place to place making mischief and carrying tales, and he ate rags and scraps of leather from the rubbish heaps outside the village. Still, the wolves feared him too. More than any other creature in the jungle, Tabaqui was likely to go mad. When that happened, he forgot that he had ever feared anyone. He ran through the forest biting everything in his path. Even a tiger would run and hide when little Tabaqui went mad, because madness is the most shameful thing that can happen to a wild creature. Humans call the sickness hydrophobia. The animals called it dewanee, the madness, and they ran."
        - id: ch01-b07
          speaker: father_wolf
          text: "Come in and look if you wish, but there is no food here."
        - id: ch01-b08
          speaker: tabaqui
          text: "No food for a wolf, perhaps. For a lowly creature like me, a dry bone is a feast. We jackals cannot afford to be choosy."
        - id: ch01-b09
          speaker: narrator
          text: "He scuttled to the back of the cave, found a buck's bone with a little meat left on it, and cracked the end with delight."
        - id: ch01-b10
          speaker: tabaqui
          text: "Thank you for this fine meal. And what beautiful children! Such large eyes, and so young. Of course, I should have remembered that the children of kings are men from the very beginning."
        - id: ch01-b11
          speaker: narrator
          text: "Tabaqui knew that praising children to their faces brought bad luck. He enjoyed seeing Mother Wolf and Father Wolf grow uneasy. He sat quietly, pleased with his mischief, and then spoke with spite."
        - id: ch01-b12
          speaker: tabaqui
          text: "Shere Khan, the Big One, has moved his hunting ground. He told me he will hunt in these hills for the next moon."
        - id: ch01-b13
          speaker: narrator
          text: "Shere Khan was the tiger who lived near the Waingunga River, twenty miles away."
        - id: ch01-b14
          speaker: father_wolf
          text: "He has no right! The Jungle Law says he must warn us before he changes his ground. He will scare every animal for ten miles, and these days I must hunt for two."
          emotion: angry
        - id: ch01-b15
          speaker: mother_wolf
          text: "His mother named him Lungri, the Lame One, for good reason. One foot has been lame since birth, so he kills cattle instead of game. The Waingunga villagers are angry now, and he has come here to anger our villagers too. Once they set the grass alight and search for him, he will be far away while we run with our children. How grateful we should be to Shere Khan."
        - id: ch01-b16
          speaker: tabaqui
          text: "Would you like me to tell him how grateful you are?"
        - id: ch01-b17
          speaker: father_wolf
          text: "Out! Go hunt with your master. You have caused enough trouble for one night."
          emotion: angry
        - id: ch01-b18
          speaker: tabaqui
          text: "I am going. You can hear Shere Khan down in the thickets. I need not have brought the message at all."
        - id: ch01-b19
          speaker: narrator
          text: "Father Wolf listened. From the valley below came the dry, angry, singsong snarl of a tiger who had caught nothing and wanted the whole jungle to know."
        - id: ch01-b20
          speaker: father_wolf
          text: "What a fool! He begins the night's hunt with that noise. Does he think our deer are like his fat cattle by the Waingunga?"
        - id: ch01-b21
          speaker: mother_wolf
          text: "Hush. Tonight he is hunting neither deer nor cattle. He is hunting Man."
        - id: ch01-b22
          speaker: narrator
          text: "The tiger's whine became a humming purr that seemed to come from every direction. It was the sound that confused woodcutters and wandering people who slept outdoors. Sometimes they ran straight toward the tiger."
        - id: ch01-b23
          speaker: father_wolf
          text: "Man! Faugh! Are there not enough frogs and beetles in the pools? Must he hunt Man, and on our ground?"
        - id: ch01-b24
          speaker: narrator
          text: "The Jungle Law never gives an order without a reason. It forbids every beast to kill Man, except when a parent is showing the young how to kill. Even then, the lesson must take place outside the hunting ground of the pack or tribe. The true reason is what follows a man-killing. Sooner or later, white men arrive on elephants and bring guns. Hundreds of brown men come behind them, beating gongs and carrying rockets and torches. After that, every creature in the jungle suffers. Among themselves, the animals give another reason. Man, they say, is the weakest and most helpless of all living things, and it is not fair sport to touch him. They also say that man-eaters become mangy and lose their teeth, and that part is true."
        - id: ch01-b25
          speaker: narrator
          text: "The purr rose into the full cry of a charging tiger. Then came a howl that sounded nothing like a tiger."
        - id: ch01-b26
          speaker: mother_wolf
          text: "He missed. What happened?"
        - id: ch01-b27
          speaker: narrator
          text: "Father Wolf ran outside and heard Shere Khan tumbling through the scrub, muttering savagely."
        - id: ch01-b28
          speaker: father_wolf
          text: "The fool jumped at a woodcutter's fire and burned his feet. Tabaqui is with him."
        - id: ch01-b29
          speaker: mother_wolf
          text: "Something is coming up the hill. Get ready."
        - id: ch01-b30
          speaker: narrator
          text: "The bushes rustled softly in the thicket. Father Wolf dropped low, gathering his hind legs beneath him and preparing to spring. If you had been watching, you would have seen the most wonderful thing in the world. The wolf checked himself in the middle of his leap. He had already jumped before he saw what he was jumping at, and then he tried to stop. Instead of flying forward, he shot four or five feet straight into the air and landed almost exactly where he had begun."
        - id: ch01-b31
          speaker: father_wolf
          text: "Man! It is a man's cub. Look!"
          emotion: surprised
        - id: ch01-b32
          speaker: narrator
          text: "Right in front of him stood a naked brown baby, one hand holding a low branch. The child could only just walk. He was as soft and dimpled and tiny as any little creature that had ever come to a wolf's cave at night. He tilted his face toward Father Wolf, looked straight at him, and laughed."
        - id: ch01-b33
          speaker: mother_wolf
          text: "Is that truly a man's cub? I have never seen one. Bring him here."
        - id: ch01-b34
          speaker: narrator
          text: "A wolf who carries cubs can lift an egg without breaking it. Father Wolf closed his jaws around the child's back, yet not one tooth scratched him. He placed the baby among the cubs."
        - id: ch01-b35
          speaker: mother_wolf
          text: "He is so small, so naked, and so bold. Ahai! He is pushing between the cubs to reach my warmth, and now he is feeding with them. So this is a man's cub. Has any wolf ever had a man's cub among her children?"
        - id: ch01-b36
          speaker: father_wolf
          text: "I have heard of it once or twice, but never in our Pack or in my lifetime. He has no hair at all. One touch of my paw could kill him. Yet look at him. He is not afraid."
        - id: ch01-b37
          speaker: narrator
          text: "The moonlight vanished from the cave mouth. Shere Khan's great square head and shoulders filled the entrance, while Tabaqui squeaked behind him."
        - id: ch01-b38
          speaker: tabaqui
          text: "My lord, my lord, it came in here!"
        - id: ch01-b39
          speaker: father_wolf
          text: "Shere Khan honors us greatly. What does Shere Khan want?"
        - id: ch01-b40
          speaker: shere_khan
          text: "My prey. A man's cub came this way, and its parents ran away. Give it to me."
        - id: ch01-b41
          speaker: narrator
          text: "Shere Khan had indeed jumped at the woodcutter's campfire, just as Father Wolf had guessed. The pain from his burned feet had made him furious. But Father Wolf knew something the tiger could not change. The cave opening was far too narrow for Shere Khan to enter. Even where he stood, his shoulders and front paws had no room to move. He was as cramped as a man trying to fight from inside a barrel."
        - id: ch01-b42
          speaker: father_wolf
          text: "Wolves are a free people. We take orders from the head of our Pack, not from a striped killer of cattle. The man's cub belongs to us. We will decide whether he dies."
        - id: ch01-b43
          speaker: shere_khan
          text: "You will decide? By the bull I killed, must I stand with my nose in this dog's den and beg for what is mine? I am Shere Khan, and I have spoken!"
          emotion: angry
        - id: ch01-b44
          speaker: narrator
          text: "His roar thundered through the cave. Mother Wolf shook the cubs away and sprang forward. Her eyes were like two green moons facing the tiger's blazing stare."
        - id: ch01-b45
          speaker: mother_wolf
          text: "And I am Raksha, the Demon, and I answer you. The man's cub is mine, Lungri. Mine! He will not be killed. He will live and hunt with the Pack. In the end, you hunter of naked babies, you frog-eater and fish-killer, he will hunt you. Leave now, or by the sambhur I killed, I will send you back to your mother more lame than you came into this world. Go!"
          emotion: angry
        - id: ch01-b46
          speaker: narrator
          text: "Father Wolf stared in wonder. For a moment he remembered the old days, when he had won Mother Wolf in a fair fight against five other wolves. Back then she had run with the Pack, and no one had called her the Demon merely to flatter her. Shere Khan might have stood and fought Father Wolf. He could not stand against Mother Wolf here. She held every advantage in the narrow cave, and he knew she would fight until she died. So the tiger backed out of the entrance, growling all the way. Only when he was safely clear did he shout."
        - id: ch01-b47
          speaker: shere_khan
          text: "Every dog is brave in its own yard! We shall hear what the Pack says about raising a man's cub. He is mine, you bush-tailed thieves. In the end, my teeth will have him!"
          emotion: angry
        - id: ch01-b48
          speaker: narrator
          text: "Mother Wolf dropped among the cubs, panting."
        - id: ch01-b49
          speaker: father_wolf
          text: "One thing he said is true. We must show the cub to the Pack. Do you still mean to keep him, Mother?"
        - id: ch01-b50
          speaker: mother_wolf
          text: "Keep him? He came here naked, alone, hungry, and unafraid. Look, he has already pushed one of my babies aside. That lame butcher would have killed him, then slipped back to the Waingunga while our villagers searched every den for revenge. Of course I will keep him. Lie still, little frog. I will call you Mowgli the Frog. One day, you will hunt Shere Khan as he hunted you."
        - id: ch01-b51
          speaker: father_wolf
          text: "But what will the Pack say?"
    - id: ch02
      title: The Council Rock
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "The Jungle Law says a wolf may leave the Pack after taking a mate. But when the cubs can stand, their parents must bring them before the Pack Council at the full moon. The other wolves inspect and remember them. Afterward the cubs may roam freely, and no grown wolf may kill one before it takes its first buck. No excuse is accepted. The penalty is death, and that must be so."
        - id: ch02-b02
          speaker: narrator
          text: "Father Wolf waited until his cubs could run a little. Then, on the night of the Pack Meeting, he led Mother Wolf, their cubs, and Mowgli to the Council Rock. It was a hilltop covered with stones and boulders, with hiding places enough for a hundred wolves. Akela, the great gray Lone Wolf, lay stretched at full length on his own rock. His strength and cunning had made him leader of the Pack. More than forty wolves sat below him in every size and color. Some were old, badger-colored hunters who could bring down a buck alone. Others were black three-year-olds who only imagined they could do it. Akela had led them for a year. As a young wolf, he had fallen into traps twice. Another time, men had beaten him and left him for dead. He knew human manners and customs well."
        - id: ch02-b03
          speaker: narrator
          text: "There was very little talk at the Rock. The cubs tumbled over one another in the middle of the circle, while their mothers and fathers sat around them. Every so often, an older wolf rose and walked quietly up to one cub. The wolf looked carefully, then returned to its place on noiseless paws. Sometimes an anxious mother pushed her cub well out into the moonlight, making certain that the inspecting wolves had not missed it."
        - id: ch02-b04
          speaker: akela
          text: "You know the Law. Look carefully, Wolves."
        - id: ch02-b05
          speakers: [mother_wolf, wolf_1, wolf_2, wolf_3]
          ensemble: chorus
          text: "Look well, Wolves. Look well!"
        - id: ch02-b06
          speaker: narrator
          text: "At last Mother Wolf's neck bristled. Father Wolf pushed Mowgli the Frog into the circle. Mowgli sat laughing and playing with moonlit pebbles."
        - id: ch02-b07
          speaker: akela
          text: "Look well."
        - id: ch02-b08
          speaker: narrator
          text: "A muffled roar rose from behind the rocks. It was Shere Khan."
        - id: ch02-b09
          speaker: shere_khan
          text: "The cub is mine. Give him to me. Why should the Free People keep a man's cub?"
        - id: ch02-b10
          speaker: narrator
          text: "Akela did not even twitch an ear."
        - id: ch02-b11
          speaker: akela
          text: "Look well, Wolves. The Free People take orders only from the Free People. Look well."
        - id: ch02-b12
          speaker: narrator
          text: "Deep growls rolled through the Pack. Then a young wolf in his fourth year repeated the tiger's question."
        - id: ch02-b13
          speaker: young_wolf
          text: "Why should the Free People take in a man's cub?"
        - id: ch02-b14
          speaker: narrator
          text: "When the Pack disputes a cub's right to enter, the Law requires two members besides its parents to speak for it."
        - id: ch02-b15
          speaker: akela
          text: "Who among the Free People speaks for this cub?"
        - id: ch02-b16
          speaker: narrator
          text: "No one answered. Mother Wolf prepared for what she knew would be her last fight, if the matter came to fighting. Then Baloo rose onto his hind legs and grunted. The sleepy brown bear taught the wolf cubs the Jungle Law. He alone among outsiders could attend the Council, because he ate only roots, nuts, and honey."
        - id: ch02-b17
          speaker: baloo
          text: "The man's cub? I speak for him. There is no harm in him. I am no fine speaker, but I tell the truth. Let him enter with the other cubs and run with the Pack. I will teach him myself."
        - id: ch02-b18
          speaker: akela
          text: "We still need one more voice. Baloo, the teacher of our cubs, has spoken. Who else speaks?"
        - id: ch02-b19
          speaker: narrator
          text: "A black shadow dropped into the circle. It was Bagheera the Black Panther. His coat looked like ink, though certain light revealed markings like ripples in silk. Everyone knew him, and no one wished to cross him. He had Tabaqui's cunning, a wild buffalo's courage, and the recklessness of a wounded elephant. Yet his voice was as soft as honey dripping from a tree."
        - id: ch02-b20
          speaker: bagheera
          text: "Akela and Free People, I have no right to join your council. But the Law says that when a new cub is disputed, and the matter does not call for killing, someone may buy that cub's life. The Law does not say who may pay. Am I right?"
        - id: ch02-b21
          speakers: [wolf_1, wolf_2, wolf_3, wolf_4]
          ensemble: chorus
          text: "Good! Listen to Bagheera. A price may buy the cub. That is the Law."
        - id: ch02-b22
          speaker: bagheera
          text: "Since I have no right here, I ask your permission to continue."
        - id: ch02-b23
          speakers: [wolf_1, wolf_2, wolf_3, wolf_4]
          ensemble: chorus
          text: "Then speak, Bagheera. We are listening."
        - id: ch02-b24
          speaker: bagheera
          text: "There is shame in killing a naked cub. When he grows, perhaps he will give you better sport. Baloo has spoken for him. I will add a newly killed fat bull, lying less than half a mile away, if you accept the man's cub under the Law. Is that such a difficult choice?"
        - id: ch02-b25
          speakers: [wolf_1, wolf_2, wolf_3, wolf_4]
          ensemble: chorus
          text: "What does it matter? Winter rain may kill him, or the sun may burn him. What harm can one naked frog do? Let him join the Pack. Where is the bull? Accept him!"
        - id: ch02-b26
          speaker: akela
          text: "Look well, Wolves. Look well."
        - id: ch02-b27
          speaker: narrator
          text: "Mowgli was still deeply interested in the shining pebbles. He did not notice the wolves coming forward to look at him one by one, and he did not notice when the decision was made. At last every hungry wolf went down the hill to find Bagheera's dead bull. Akela, Bagheera, Baloo, Mowgli, and Mowgli's wolf family were left alone on the Rock. Shere Khan kept roaring into the night. He was furious that the Pack had refused to hand Mowgli over."
        - id: ch02-b28
          speaker: bagheera
          text: "Roar while you can. One day this naked little creature will make you sing another song, unless I know nothing about men."
        - id: ch02-b29
          speaker: akela
          text: "You did well. Humans and their cubs are clever. Someday he may help us."
        - id: ch02-b30
          speaker: bagheera
          text: "Yes, he may help when help is needed. No one can lead the Pack forever."
        - id: ch02-b31
          speaker: narrator
          text: "Akela said nothing. He thought of the day that comes for every leader. Strength fades, little by little, until the wolves kill the old leader and another rises, only to meet the same end."
        - id: ch02-b32
          speaker: akela
          text: "Take him home, Father Wolf. Train him as one of the Free People should be trained."
        - id: ch02-b33
          speaker: narrator
          text: "And so Mowgli entered the Seeonee Wolf Pack, bought with a bull and welcomed on Baloo's word."
    - id: ch03
      title: Ten Years in the Jungle
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "Now we must pass over ten or eleven whole years. You will have to imagine much of the wonderful life Mowgli lived among the wolves, because telling it all would fill many books. He grew up beside the cubs. Of course, they became full-grown wolves before he was much more than a child. Father Wolf taught him the work of a hunter and showed him what every sign in the jungle meant. A rustle moving through the grass told him one thing. A breath of warm night air told him another. He understood every note of the owls above him, every scratch made by a bat that paused to roost in a tree, and every splash of a little fish jumping in a pool. All those sounds meant as much to Mowgli as the work of an office means to a grown businessman."
        - id: ch03-b02
          speaker: narrator
          text: "When lessons were done, he slept in the sun, ate, and slept again. He swam in forest pools whenever he was hot or dirty. When he wanted honey, he climbed for it, because Baloo had taught him that nuts and honey tasted just as good as raw meat. Bagheera showed him how to climb."
        - id: ch03-b03
          speaker: bagheera
          text: "Come along, Little Brother."
        - id: ch03-b04
          speaker: narrator
          text: "At first Mowgli clung to the branches like a sloth. Later, he learned to throw himself from branch to branch almost as boldly as the gray ape. He also took his place at Council Rock whenever the Pack gathered. There he made a curious discovery. If he fixed his eyes on any wolf and kept staring, that wolf had to look away. Mowgli sometimes did it simply for fun. At other times, he helped his friends by pulling long thorns from the pads of their feet. Wolves suffer terribly from thorns in their paws and burrs caught deep in their coats."
        - id: ch03-b05
          speaker: narrator
          text: "At night Mowgli sometimes went down the hillside into the planted fields. From there he watched the villagers in their huts with great curiosity. Even so, he did not trust humans. Bagheera had shown him a square box with a door that dropped shut. Men had hidden it so cleverly in the jungle that Mowgli nearly walked inside before he saw it. Bagheera told him it was a trap. More than anything else, Mowgli loved going with Bagheera into the dark, warm heart of the forest. He slept there through the heavy, drowsy day. At night he watched how Bagheera made his kills. Bagheera hunted whenever he was hungry, and Mowgli did the same, except for one thing."
        - id: ch03-b06
          speaker: bagheera
          text: "The whole jungle is yours, and you may kill whatever you are strong enough to kill. But a bull's life bought your place in the Pack. For that bull's sake, you must never kill or eat cattle, young or old. That is the Jungle Law."
        - id: ch03-b07
          speaker: narrator
          text: "Mowgli obeyed that law faithfully. He kept growing, and every season made him stronger. That is how a boy grows when he never knows that anyone is teaching him lessons and has nothing in the world to think about except finding things to eat. Once or twice, Mother Wolf warned him that Shere Khan could never be trusted. She told Mowgli that one day he would have to kill the tiger. A young wolf would have carried that warning in mind every hour. Mowgli soon forgot it, because he was only a boy. Still, if he had known how to speak in any human tongue, he would have called himself a wolf."
        - id: ch03-b08
          speaker: narrator
          text: "Shere Khan was always crossing Mowgli's path in the jungle. Akela grew older and weaker with every season, and the lame tiger became a great friend of the younger wolves. They followed him because he left scraps for them. In his stronger years Akela would never have permitted such behavior. Now he did not dare push his authority as far as the Law allowed. Shere Khan praised those young wolves and made them feel important. Then he wondered aloud why such fine hunters were content to follow a dying wolf and obey a man's cub."
        - id: ch03-b09
          speaker: shere_khan
          text: "I hear that when the Council meets, none of you dares look that man-cub in the eyes."
        - id: ch03-b10
          speaker: narrator
          text: "The young wolves growled and raised their bristles. Bagheera heard and saw what was happening. More than once he warned Mowgli plainly that Shere Khan meant to kill him."
        - id: ch03-b11
          speaker: mowgli
          text: "Why should I fear him? I have the Pack and I have you. Even lazy old Baloo would strike a blow or two for me."
        - id: ch03-b12
          speaker: narrator
          text: "Then, on a very warm day, Bagheera heard something that gave him a new thought. Perhaps Ikki the Porcupine had told him. Deep in the jungle, Mowgli rested his head on the panther's beautiful black coat."
        - id: ch03-b13
          speaker: bagheera
          text: "Little Brother, how many times have I warned you that Shere Khan is your enemy?"
        - id: ch03-b14
          speaker: mowgli
          text: "As many times as there are nuts on that palm, and you know I cannot count them. Why talk about it now? I am sleepy. Shere Khan is nothing but a long tail and a loud voice, just like Mao the Peacock."
        - id: ch03-b15
          speaker: bagheera
          text: "This is not a time to sleep. Baloo knows. I know. The Pack knows. Even the foolish deer know. Tabaqui tried to tell you too."
        - id: ch03-b16
          speaker: mowgli
          text: "Tabaqui came to me with insults. He called me a naked man's cub who was not fit to dig for pig-nuts. I grabbed his tail and swung him against a palm tree twice. That taught him manners."
        - id: ch03-b17
          speaker: bagheera
          text: "That was foolish. Mischief-maker or not, he had news that mattered to you. Open your eyes. Shere Khan cannot kill you in the jungle while Akela leads. But Akela is old. Soon he will fail to bring down his buck, and then he will lose the leadership. Many wolves who inspected you as a baby are old now too. Shere Khan has taught the younger ones that a man's cub has no place in the Pack. Before long, you will be a man."
        - id: ch03-b18
          speaker: mowgli
          text: "Why should a man be forbidden to run with his brothers? I was born in the jungle. I have kept its Law. There is not one wolf in our Pack whose paw I have not freed from a thorn. They are my brothers."
        - id: ch03-b19
          speaker: narrator
          text: "Bagheera stretched out and half closed his eyes."
        - id: ch03-b20
          speaker: bagheera
          text: "Little Brother, put your hand beneath my jaw."
        - id: ch03-b21
          speaker: narrator
          text: "Mowgli reached under the silky chin. Beneath the glossy fur and great rolling muscles, his fingers found a small bald patch."
        - id: ch03-b22
          speaker: bagheera
          text: "No one else in the jungle knows I carry that mark. It is the mark left by a collar. I was born among humans, Little Brother, and my mother died there among them. We lived in the cages of the king's palace at Oodeypore. That is why I paid the price for you at Council Rock when you were a naked little cub. Yes, I too was born among men. In those days I had never once seen the jungle. They kept me behind iron bars and pushed my food through them in an iron pan. Then one night I felt what I truly was. I was Bagheera the Panther, not a plaything for any man. I struck the foolish lock once with my paw, broke it, and walked away. Because I had learned the ways of men, I became more terrible in the jungle than Shere Khan. Is that not true?"
        - id: ch03-b23
          speaker: mowgli
          text: "Yes. Everyone in the jungle fears Bagheera, except Mowgli."
        - id: ch03-b24
          speaker: bagheera
          text: "Oh, you are a man's cub. I returned to my jungle, and one day you must return to humans, who are your own people. You must go before the Council kills you."
        - id: ch03-b25
          speaker: mowgli
          text: "But why would anyone want to kill me?"
        - id: ch03-b26
          speaker: bagheera
          text: "Look at me."
        - id: ch03-b27
          speaker: narrator
          text: "Mowgli stared between Bagheera's eyes. In half a minute, the great panther turned his head away and shifted one paw among the leaves."
        - id: ch03-b28
          speaker: bagheera
          text: "That is the reason. Even I cannot meet your eyes, though I was born among humans and love you, Little Brother. The wolves hate you because they cannot hold your gaze. They hate your cleverness, and they remember that you pulled thorns from their feet. They hate you because you are a man."
        - id: ch03-b29
          speaker: mowgli
          text: "I never knew any of that."
        - id: ch03-b30
          speaker: narrator
          text: "Mowgli frowned beneath his heavy black eyebrows."
        - id: ch03-b31
          speaker: bagheera
          text: "The Jungle Law says to strike first and speak afterward. Your carelessness itself shows them you are human. So be wise now. Akela works harder with every hunt. When he misses his next buck, I believe the Pack will turn on him and you together. They will call a Council at the Rock, and then... I know what you must do! Go quickly to the human huts. Bring back some of the Red Flower they grow there. When the hour comes, it will be a stronger friend than I, Baloo, or any wolf who loves you. Get the Red Flower."
        - id: ch03-b32
          speaker: narrator
          text: "Bagheera meant fire. No jungle creature will use its true name. Every beast fears it to the death and invents other names instead."
        - id: ch03-b33
          speaker: mowgli
          text: "The Red Flower? It grows outside their huts at twilight. I will bring some."
        - id: ch03-b34
          speaker: bagheera
          text: "Now you sound like a man's cub. It grows in little pots. Take one quickly and keep it ready for the time of need."
        - id: ch03-b35
          speaker: mowgli
          text: "Good. I will go. But Bagheera, are you certain Shere Khan caused all this?"
        - id: ch03-b36
          speaker: bagheera
          text: "By the broken lock that freed me, I am certain, Little Brother."
        - id: ch03-b37
          speaker: mowgli
          text: "Then by the bull that bought me, I will repay Shere Khan in full, and perhaps a little more."
        - id: ch03-b38
          speaker: narrator
          text: "Mowgli threw an arm around Bagheera's neck, looked into his eyes, and bounded away. Bagheera lay down again."
        - id: ch03-b39
          speaker: bagheera
          text: "That is a man through and through. Shere Khan, no hunt was ever darker than the frog-hunt you began ten years ago."
    - id: ch04
      title: The Red Flower
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "Mowgli ran far through the forest with anger burning in his heart. Evening mist was rising when he reached the cave. The wolf cubs were away, but Mother Wolf heard his troubled breathing from the darkness at the back."
        - id: ch04-b02
          speaker: mother_wolf
          text: "What troubles you, Son?"
        - id: ch04-b03
          speaker: mowgli
          text: "Only some bat's chatter about Shere Khan. I will hunt among the plowed fields tonight."
        - id: ch04-b04
          speaker: narrator
          text: "He plunged through the bushes toward the stream. At the valley floor he stopped. The Pack was hunting. He heard its cries, the bellow of a sambhur, and the buck's snort as it turned to fight. Then the younger wolves shouted bitterly."
        - id: ch04-b05
          speakers: [young_wolf, wolf_2, wolf_3, wolf_4]
          ensemble: chorus
          text: "Akela! Give the Lone Wolf room. Let our leader show his strength. Spring, Akela!"
        - id: ch04-b06
          speaker: narrator
          text: "The Lone Wolf must have sprung and missed his hold. Mowgli heard Akela's jaws snap shut on empty air. A moment later came a yelp as the sambhur knocked him over with one of its forefeet. That told Mowgli everything he needed to know. He did not wait to hear more. He dashed on toward the fields, and the cruel cries of the young wolves grew fainter behind him as he ran into the farmland where the villagers lived."
        - id: ch04-b07
          speaker: mowgli
          text: "Bagheera told the truth. Tomorrow will decide both Akela's fate and mine."
        - id: ch04-b08
          speaker: narrator
          text: "Mowgli settled into a pile of cattle fodder beside the window of a hut. He pressed his face close and watched the fire burning on the hearth. During the night, the farmer's wife got up and fed the fire with black lumps. Mowgli watched carefully. Morning came, and the mist over the fields turned white and cold. Then the farmer's child picked up a wicker pot whose inside was plastered with earth. The child filled it with lumps of red-hot charcoal, tucked the pot beneath a blanket, and went outside to tend the cows in the byre."
        - id: ch04-b09
          speaker: mowgli
          text: "Is that all? If a child can carry it, there is nothing to fear."
        - id: ch04-b10
          speaker: narrator
          text: "Mowgli walked around the corner, met the boy, snatched the pot, and vanished into the mist. The frightened boy howled."
        - id: ch04-b11
          speaker: mowgli
          text: "Humans are very like me. This creature will die unless I feed it."
        - id: ch04-b12
          speaker: narrator
          text: "He blew into the pot as he had seen the woman do, then fed the coals with twigs and dry bark. Halfway uphill he met Bagheera, whose coat glittered with morning dew like moonstones."
        - id: ch04-b13
          speaker: bagheera
          text: "Akela missed. They meant to kill him last night, but they wanted you there too. They searched for you on the hill."
        - id: ch04-b14
          speaker: mowgli
          text: "I was in the farmland, and I am ready. Look!"
        - id: ch04-b15
          speaker: narrator
          text: "He raised the fire-pot."
        - id: ch04-b16
          speaker: bagheera
          text: "Good. I have watched men push a dry branch into those coals until the Red Flower opened at its tip. Are you not afraid?"
        - id: ch04-b17
          speaker: mowgli
          text: "Why should I be? I seem to remember, unless it was a dream, lying beside the Red Flower before I was a wolf. It felt warm and pleasant."
        - id: ch04-b18
          speaker: narrator
          text: "All that day Mowgli sat inside the cave and kept the fire-pot alive. Again and again he pushed dry branches among the coals to see what the Red Flower did to them. At last he found one branch that burned just as he wanted. Evening came. Tabaqui crept to the cave and, speaking rudely enough, told Mowgli that the Pack wanted him at Council Rock. Mowgli only laughed. He laughed until Tabaqui turned and ran away, and then he carried the pot to the Council, still laughing as he went."
    - id: ch05
      title: The Council of the Red Flower
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "Akela the Lone Wolf lay beside his rock instead of upon it. That was the sign that the Pack's leadership stood open. Shere Khan and the wolves who followed him walked back and forth in full view of everyone. They flattered the tiger, and he enjoyed every word. Bagheera lay close beside Mowgli. Between the boy's knees stood the pot of fire, still alive and waiting. When the last wolves had gathered, Shere Khan began addressing the Council. It was something he would never have dared to do while Akela was in his prime."
        - id: ch05-b02
          speaker: bagheera
          text: "He has no right to speak. Say so. Call him a dog's son, and he will lose his courage."
        - id: ch05-b03
          speaker: narrator
          text: "Mowgli jumped to his feet."
        - id: ch05-b04
          speaker: mowgli
          text: "Free People, is Shere Khan your leader now? What business has a tiger with the leadership of wolves?"
        - id: ch05-b05
          speaker: shere_khan
          text: "The leadership is open, and I was asked to speak..."
        - id: ch05-b06
          speaker: mowgli
          text: "Who asked you? Are we jackals who must flatter a cattle-killer? Only the Pack can choose the Pack's leader."
        - id: ch05-b07
          speaker: narrator
          text: "Some wolves shouted for the man-cub to be silent. Others said he had obeyed the Law and should speak. At last the older wolves thundered together."
        - id: ch05-b08
          speakers: [wolf_1, wolf_2, wolf_3, wolf_4]
          ensemble: chorus
          text: "Let the Dead Wolf speak!"
        - id: ch05-b09
          speaker: narrator
          text: "A leader who misses his kill is called the Dead Wolf for the short remainder of his life. Akela lifted his tired old head."
        - id: ch05-b10
          speaker: akela
          text: "Free People, and you jackals who follow Shere Khan, I led you to and from the kill for twelve seasons. Not one wolf was trapped or crippled while I led. Now I have missed. You know how the plot was arranged. You sent me after an untested buck so everyone would see my weakness. Cleverly done. The Law gives you the right to kill me here. So who will come and end the Lone Wolf? The Law also gives me the right to face you one by one."
        - id: ch05-b11
          speaker: narrator
          text: "A long silence followed. Not one wolf wanted to fight Akela alone to the death. Shere Khan roared."
        - id: ch05-b12
          speaker: shere_khan
          text: "Bah! Why waste time on this toothless fool? He is already doomed. The man-cub is the one who has lived too long. He was my prey from the beginning. Give him to me. I am tired of this man-wolf nonsense. For ten seasons he has troubled the jungle. Give him up, or I will hunt here forever and leave you no bones. He is a human child, and I hate him from the marrow of my bones!"
          emotion: angry
        - id: ch05-b13
          speakers: [young_wolf, wolf_2, wolf_3, wolf_4]
          ensemble: chorus
          text: "A man! Why should a man stay with us? Send him back to his own kind!"
        - id: ch05-b14
          speaker: shere_khan
          text: "And let him turn every villager against us? No. Give him to me. He is a man, and none of us can meet his eyes."
        - id: ch05-b15
          speaker: akela
          text: "He has shared our food and slept beside us. He has driven game for the Pack. He has broken no part of the Jungle Law."
        - id: ch05-b16
          speaker: bagheera
          text: "And I bought his life with a bull when the Pack accepted him. A bull is worth little, perhaps, but Bagheera's honor is worth fighting for."
        - id: ch05-b17
          speakers: [young_wolf, wolf_2, wolf_3, wolf_4]
          ensemble: chorus
          text: "That bull died ten years ago. Why should old bones matter now?"
        - id: ch05-b18
          speaker: bagheera
          text: "Does a promise matter just as little? You deserve your proud name, Free People."
        - id: ch05-b19
          speaker: narrator
          text: "His lip lifted over his white teeth."
        - id: ch05-b20
          speaker: shere_khan
          text: "No man's cub belongs with the jungle people. Give him to me!"
        - id: ch05-b21
          speaker: akela
          text: "He is our brother in everything but blood, and you would murder him here. I have lived too long. Some of you eat cattle. I have heard that others, taught by Shere Khan, creep through the darkness and snatch children from village doorways. I know now that I am speaking to cowards. My death is certain. My life is worth nothing, or I would offer it in the man-cub's place. But think of the Pack's honor. It may seem a small thing to you now that you have no leader and have forgotten it. Let Mowgli go back to his own people. In return, when my time comes to die, I will not bare a single tooth against you. I will die without fighting. That will save the Pack the lives of at least three wolves, because three of you would fall before you killed me. I can offer no more. But if you agree, I can save you from the shame of killing a brother who has done no wrong, a brother whom others spoke for and the Pack bought into its ranks under the Jungle Law."
        - id: ch05-b22
          speakers: [young_wolf, wolf_2, wolf_3, wolf_4]
          ensemble: chorus
          text: "He is a man! A man! A man!"
        - id: ch05-b23
          speaker: narrator
          text: "Most of the wolves crowded around Shere Khan, whose tail began to twitch."
        - id: ch05-b24
          speaker: bagheera
          text: "The choice is yours now, Mowgli. All we can do is fight."
        - id: ch05-b25
          speaker: narrator
          text: "Mowgli rose to his full height with the fire-pot in his hands. He stretched out both arms and yawned in the face of the Council. Inside, though, he was burning with rage and sorrow. He had grown up like a wolf, and like wolves, the members of the Pack had never told him what they felt. Until this night, he had never known how deeply they hated him."
        - id: ch05-b26
          speaker: mowgli
          text: "Listen to me. We need no more of this dog's chatter. Tonight you have called me a man again and again. I meant to live and die as a wolf beside you, but now I believe you. I will not call you brothers any longer. You are dogs, as a man would call you. You no longer decide what happens to me. I decide. And so that everyone may see clearly, I have brought a little of the Red Flower that you dogs fear."
          emotion: angry
        - id: ch05-b27
          speaker: narrator
          text: "He hurled the pot down. Red coals landed in dry moss, and flames leaped up. The whole Council shrank away in terror. Mowgli thrust his branch into the fire until its twigs blazed and cracked, then swung it above the cowering wolves."
        - id: ch05-b28
          speaker: bagheera
          text: "You are their master now. Save Akela. He has always been your friend."
        - id: ch05-b29
          speaker: narrator
          text: "Akela was a grim old wolf who had never once asked for mercy in all his life. Now he gave Mowgli one sorrowful, pleading look. The boy stood there naked in the middle of the wolves. His long black hair tossed across his shoulders in the light of the blazing branch, and every movement of the flame made the shadows around him jump and tremble."
        - id: ch05-b30
          speaker: mowgli
          text: "Good. Now I see that you are dogs. I will leave you and go to my own people, if they truly are my people. The jungle is closed to me. I must forget your voices and your company. Yet I will show more mercy than you did. I was almost your brother in blood, so when I become a man among men, I will not betray you as you betrayed me."
        - id: ch05-b31
          speaker: narrator
          text: "He kicked the fire, and sparks flew upward."
        - id: ch05-b32
          speaker: mowgli
          text: "There will be no war between me and the Pack. But before I leave, one debt must be paid."
        - id: ch05-b33
          speaker: narrator
          text: "He walked to Shere Khan, who blinked stupidly at the flames, and seized the tuft beneath the tiger's chin. Bagheera followed in case anything went wrong."
        - id: ch05-b34
          speaker: mowgli
          text: "Stand up, dog! Stand when a man speaks, or I will set your coat on fire."
          emotion: angry
        - id: ch05-b35
          speaker: narrator
          text: "Shere Khan flattened his ears and shut his eyes. The blazing branch was very close."
        - id: ch05-b36
          speaker: mowgli
          text: "This cattle-killer says he will murder me now because he failed when I was a baby. This is how men beat dogs. Move one whisker, Lungri, and I will thrust the Red Flower down your throat!"
          emotion: angry
        - id: ch05-b37
          speaker: narrator
          text: "He struck Shere Khan over the head with the branch. The terrified tiger whimpered and whined."
        - id: ch05-b38
          speaker: mowgli
          text: "Go, singed jungle cat! But remember this. When I next come to Council Rock as a man, I will wear Shere Khan's hide on my head. Akela will go free and live as he chooses. You will not kill him, because I forbid it. And none of you will sit here pretending to be important. You are dogs, and I drive you away. Go!"
          emotion: angry
        - id: ch05-b39
          speaker: narrator
          text: "The end of the branch was burning fiercely now. Mowgli swept it to the right and left around the circle. The wolves fled howling as sparks caught in their fur. When the rest had scattered, only Akela, Bagheera, and perhaps ten wolves who had stood on Mowgli's side remained. Then Mowgli felt a pain inside him unlike anything he had known before. It caught his breath. A sob broke from him, and tears began running down his face."
        - id: ch05-b40
          speaker: mowgli
          text: "What is happening to me? I do not want to leave the jungle. I do not know what this is. Bagheera, am I dying?"
          emotion: sad
        - id: ch05-b41
          speaker: bagheera
          text: "No, Little Brother. Those are only the tears that humans shed. Now I know you are a man, not a man's cub any longer. The jungle truly is closed to you. Let the tears fall, Mowgli. That is all they are."
          emotion: calm
        - id: ch05-b42
          speaker: narrator
          text: "Mowgli sat and cried as if his heart would break. Never before in his life had he cried."
        - id: ch05-b43
          speaker: mowgli
          text: "Now I will go to the humans. First I must say goodbye to my mother."
        - id: ch05-b44
          speaker: narrator
          text: "He returned to the cave where Mother Wolf and Father Wolf still lived. There he pressed himself against his mother's coat and cried. Around him, the four wolf brothers who had shared the cave with him since infancy lifted their voices and howled miserably."
        - id: ch05-b45
          speaker: mowgli
          text: "You will not forget me, will you?"
          emotion: sad
        - id: ch05-b46
          speakers: [brother_1, brother_2, brother_3, brother_4]
          ensemble: chorus
          text: "Never, while we can follow a trail. When you are a man, come to the foot of the hill and talk with us. We will come into the farmland and play with you at night."
          emotion: sad
        - id: ch05-b47
          speaker: father_wolf
          text: "Come back soon, wise little frog. Your mother and I are old now. Please come soon."
          emotion: sad
        - id: ch05-b48
          speaker: mother_wolf
          text: "Come soon, my little naked son. Listen to me, child of man. I loved you more than I ever loved my own cubs."
          emotion: sad
        - id: ch05-b49
          speaker: mowgli
          text: "I will come back. When I do, I will lay Shere Khan's hide on Council Rock. Do not forget me. Tell everyone in the jungle never to forget me."
          emotion: sad
        - id: ch05-b50
          speaker: narrator
          text: "By then the darkness was thinning, and dawn had begun to break over the hills. Mowgli left the cave and started down the long hillside alone. Behind him lay the jungle that had been his whole world. Ahead waited the strange and mysterious creatures the animals called men, and Mowgli went down to meet them."
