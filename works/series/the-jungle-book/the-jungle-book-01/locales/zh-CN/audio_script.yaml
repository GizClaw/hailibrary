audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉稳从容，带着古老丛林故事的气息
        timbre: 温暖清晰
        pace: 舒缓而富有变化
        pitch: 中等
    father_wolf:
      display_name: 狼爸爸
      tts:
        delivery: 威严直接，护卫家人时坚定有力
        timbre: 低沉粗粝
        pace: 稳健
        pitch: 低
    mother_wolf:
      display_name: 狼妈妈
      tts:
        delivery: 冷静果断，温柔中带着不容冒犯的力量
        timbre: 深厚柔韧
        pace: 从容
        pitch: 中低
    tabaqui:
      display_name: 塔巴基
      tts:
        delivery: 油滑谄媚，恶意常藏在客气话里
        timbre: 尖细干涩
        pace: 稍快
        pitch: 偏高
    shere_khan:
      display_name: 谢尔汗
      tts:
        delivery: 骄横凶狠，习惯发号施令
        timbre: 粗重轰鸣
        pace: 缓慢而逼人
        pitch: 低
    akela:
      display_name: 阿克拉
      tts:
        delivery: 克制威严，年老时仍保持首领的尊严
        timbre: 苍老浑厚
        pace: 沉着
        pitch: 低
    baloo:
      display_name: 巴鲁
      tts:
        delivery: 朴实坦率，说话不花哨
        timbre: 厚实温和
        pace: 稍慢
        pitch: 中低
    bagheera:
      display_name: 巴希拉
      tts:
        delivery: 柔和机敏，必要时锋利果断
        timbre: 丝滑深沉
        pace: 从容
        pitch: 中低
    mowgli:
      display_name: 毛克利
      tts:
        delivery: 率真勇敢，少年气息自然鲜明
        timbre: 清亮结实
        pace: 灵活
        pitch: 中等
    young_wolf:
      display_name: 青年狼
      tts:
        delivery: 冲动傲慢，容易受人煽动
        timbre: 年轻锐利
        pace: 稍快
        pitch: 中等
    wolf_1:
      display_name: 狼甲
      tts:
        delivery: 警觉直率，随群体情绪起伏
        timbre: 粗哑
        pace: 中等
        pitch: 中低
    wolf_2:
      display_name: 狼乙
      tts:
        delivery: 急切强硬，随群体一同呼喊
        timbre: 清硬
        pace: 稍快
        pitch: 中等
    wolf_3:
      display_name: 狼丙
      tts:
        delivery: 鲁莽响亮，容易跟随众狼起哄
        timbre: 浑厚
        pace: 中等
        pitch: 低
    wolf_4:
      display_name: 狼丁
      tts:
        delivery: 犹疑而易受煽动，合声时有力
        timbre: 沙哑
        pace: 中等
        pitch: 中等
  chapters:
    - id: ch01
      title: 夜里的狼洞
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 鸢鹰兰恩衔夜归，蝙蝠莽格放夜飞。牛群关进栏和棚，我们出猎到天明。此刻正是威风时，尖牙利爪逞雄姿。听那号令！祝所有遵守丛林法规的众生，狩猎顺利！
        - id: ch01-b02
          speaker: narrator
          text: 西奥尼山丘上，一个闷热的傍晚，七点钟，狼爸爸从白天的睡梦里醒来。他挠挠身子，打了个哈欠，再把四只爪子一只只伸开。狼妈妈的大灰鼻子搭在四只翻滚尖叫的幼崽身上，月光正照进他们的洞口。
        - id: ch01-b03
          speaker: father_wolf
          text: 嗷——呃！又该去打猎了。
        - id: ch01-b04
          speaker: narrator
          text: 他刚要纵身下山，一团蓬尾巴的小黑影就越过洞口，哼哼唧唧地开了腔。
        - id: ch01-b05
          speaker: tabaqui
          text: 愿好运跟着您，狼群的首领！也愿高贵的小公子们长出强健的白牙，永远别忘了世上还有挨饿的可怜虫。
        - id: ch01-b06
          speaker: narrator
          text: 来的是豺狼塔巴基，那个舔盘子的家伙。印度的狼都瞧不起他，因为他到处挑事，搬弄是非，还去村里的垃圾堆捡破布和皮革吃。可狼们也怕他。丛林里再没有谁比塔巴基更容易发疯。一旦疯病发作，他便忘了自己从前怕过谁，冲进森林见什么咬什么。连老虎见到发疯的小塔巴基，也要逃开躲藏。对野兽来说，再没有比发疯更丢脸的事了。我们管这叫恐水病，它们却叫德瓦尼，也就是疯病。只要听见这个名字，大家便赶紧逃走。
        - id: ch01-b07
          speaker: father_wolf
          text: 那你就进来看看吧。不过这里没有东西给你吃。
        - id: ch01-b08
          speaker: tabaqui
          text: 当然没有狼吃的好东西。可我这样卑贱的小人物，有根干骨头也算过节了。我们豺狼一族，哪有资格挑挑拣拣？
        - id: ch01-b09
          speaker: narrator
          text: 他窜到洞底，找到一根还带着肉的公鹿骨头，快活地坐下，把骨头一端嚼得咔咔作响。
        - id: ch01-b10
          speaker: tabaqui
          text: 多谢这顿大餐。几位小公子真漂亮，眼睛又大，年纪又小！瞧我这记性，王侯家的孩子一生下来，自然就是大人物。
        - id: ch01-b11
          speaker: narrator
          text: 塔巴基明明知道，当面夸幼崽最不吉利。狼爸爸和狼妈妈越不自在，他心里越得意。他安静了一会儿，忽然换上恶狠狠的口气。
        - id: ch01-b12
          speaker: tabaqui
          text: 大王谢尔汗换猎场了。他亲口告诉我，这一个月要到这些山里来打猎。
        - id: ch01-b13
          speaker: narrator
          text: 谢尔汗是一只老虎，住在二十英里外的温贡加河边。
        - id: ch01-b14
          speaker: father_wolf
          text: 他没这个权利！按丛林法规，换地盘以前必须先通告。他这一来，十英里内的猎物都会被吓跑，而我眼下要养活两份口粮！
          emotion: angry
        - id: ch01-b15
          speaker: mother_wolf
          text: 他母亲叫他朗格里，也就是瘸子，可不是随便叫的。他生下来就瘸了一只脚，只会扑杀牲口。温贡加的村民被他惹火了，他便跑来招惹我们的村民。等他逃远，人们会进丛林搜他。草一烧，我们和孩子都要逃命。真得好好谢谢谢尔汗。
        - id: ch01-b16
          speaker: tabaqui
          text: 要不要我替两位把这番谢意带给他？
        - id: ch01-b17
          speaker: father_wolf
          text: 滚！去跟你的主子打猎。一晚上惹这些祸，已经够多了。
          emotion: angry
        - id: ch01-b18
          speaker: tabaqui
          text: 我这就走。你们听，谢尔汗就在下面的灌木里。看来这消息，我根本用不着来报。
        - id: ch01-b19
          speaker: narrator
          text: 狼爸爸侧耳听去。山谷朝小河倾斜，谷底传来老虎干涩又恼怒的拖腔。他又吼又哼，摆明了没捕到东西，也不怕整座丛林听见。
        - id: ch01-b20
          speaker: father_wolf
          text: 蠢货！一晚的活儿竟闹出这种动静。他以为我们的公鹿也像温贡加的肥牛那么好抓吗？
        - id: ch01-b21
          speaker: mother_wolf
          text: 嘘。他今晚追的不是牛，也不是鹿。是人。
        - id: ch01-b22
          speaker: narrator
          text: 那哼声压成低低的呼噜，像从四面八方一齐传来。露宿的樵夫和吉卜赛人听见，常会吓得晕头转向，有时竟直奔老虎嘴里。
        - id: ch01-b23
          speaker: father_wolf
          text: 人！呸！水塘里的甲虫和青蛙还不够他吃？偏要吃人，还非得在我们的地盘上吃！
        - id: ch01-b24
          speaker: narrator
          text: 丛林法规从来不会无缘无故地下令。它禁止所有野兽吃人，除非是为了教幼崽怎样捕杀。即便这样，也必须离开自己族群的猎场。真正的缘故是，一旦杀了人，迟早会招来骑着大象、带着枪的白人，还会有成百个棕色人敲着铜锣，放着火箭，举着火把。到了那时，丛林里所有动物都要遭殃。野兽自己的说法是，人是所有生灵中最软弱、最没防备的，向人下手，不配称作真正的猎手。它们还说，吃人的野兽会长癞疮，牙齿也会一颗颗脱落。这一点倒是真的。
        - id: ch01-b25
          speaker: narrator
          text: 呼噜越来越响，最后炸成老虎扑击时那声响彻胸腔的啊——嗷！紧接着，谢尔汗又发出一声完全不像老虎的嚎叫。
        - id: ch01-b26
          speaker: mother_wolf
          text: 他扑空了。出什么事了？
        - id: ch01-b27
          speaker: narrator
          text: 狼爸爸跑出几步，只听见谢尔汗在矮树丛里跌跌撞撞，嘴里凶狠地咒骂。
        - id: ch01-b28
          speaker: father_wolf
          text: 那蠢货扑到樵夫的篝火上，烧伤脚了。塔巴基也跟着他。
        - id: ch01-b29
          speaker: mother_wolf
          text: 有东西上山来了。准备好。
        - id: ch01-b30
          speaker: narrator
          text: 灌木轻轻一响，狼爸爸后腿一收，伏身扑去。可他还在半空就硬生生停住了。他没看清目标便已经跃起，只好拼命收势，直窜到四五英尺高，几乎落回原地。
        - id: ch01-b31
          speaker: father_wolf
          text: 人！是人的幼崽。快看！
          emotion: surprised
        - id: ch01-b32
          speaker: narrator
          text: 一只刚会走路的棕皮肤小娃娃站在他面前，赤着身子，两手攀着低枝。他又软又胖，是夜里到过狼洞的最小一粒活东西。他抬头看着狼爸爸，笑了。
        - id: ch01-b33
          speaker: mother_wolf
          text: 这就是人的幼崽吗？我从没见过。把他叼过来。
        - id: ch01-b34
          speaker: narrator
          text: 狼搬动幼崽时，连鸡蛋也能含住而不咬破。狼爸爸衔住孩子的背，把他放进小狼中间，牙齿没在皮肤上留下一点伤。
        - id: ch01-b35
          speaker: mother_wolf
          text: 真小，光溜溜的，还这么大胆！啊哈，他挤进来吃奶了。原来人的幼崽就是这样。还有哪只母狼敢说，自己的孩子里养着一个人崽？
        - id: ch01-b36
          speaker: father_wolf
          text: 我偶尔听说过这种事，可我们的狼群从没有过，我也从没亲眼见过。他连一根毛都没有，我一爪就能杀掉。可是你看，他望着我们，一点也不怕。
        - id: ch01-b37
          speaker: narrator
          text: 洞口的月光突然暗了。谢尔汗方正的大脑袋和肩膀堵住入口，塔巴基躲在后面尖叫。
        - id: ch01-b38
          speaker: tabaqui
          text: 大王！大王！他钻进这个洞了！
        - id: ch01-b39
          speaker: father_wolf
          text: 谢尔汗大驾光临，我们真荣幸。你来做什么？
        - id: ch01-b40
          speaker: shere_khan
          text: 来拿我的猎物。一个人崽跑到这里，他父母已经逃了。把他交出来。
        - id: ch01-b41
          speaker: narrator
          text: 谢尔汗刚刚扑过樵夫的篝火，烧伤的脚疼得厉害，早已暴怒。狼爸爸却很清楚，洞口太窄，老虎根本进不来。谢尔汗就算站在那里，肩膀和前爪也被狭小的地方挤住，完全施展不开，就像一个人钻进木桶以后还想跟谁打架。
        - id: ch01-b42
          speaker: father_wolf
          text: 狼是自由的族类。我们只听狼群首领的号令，不听一只满身条纹、专杀牲口的家伙。人崽是我们的。杀不杀，由我们决定。
        - id: ch01-b43
          speaker: shere_khan
          text: 决定杀，决定不杀？哪有你们决定的份！我以亲手杀死的公牛起誓，难道还得把鼻子伸进你们的狗窝，低声下气讨回我的东西？现在说话的是谢尔汗！
          emotion: angry
        - id: ch01-b44
          speaker: narrator
          text: 老虎的吼声像雷一样灌满洞穴。狼妈妈抖开幼崽，纵身迎上去。黑暗里，她的眼睛像两轮绿色的月亮，正对着谢尔汗燃烧的双眼。
        - id: ch01-b45
          speaker: mother_wolf
          text: 回答你的是我，罗刹！人崽是我的，朗格里，是我的！谁也别想杀他。他会跟狼群一起奔跑，一起狩猎。到最后，你听清楚，你这个专猎赤裸幼崽、吞青蛙、杀小鱼的猎手，他会来猎你！现在滚！不然我以亲手杀死的水鹿起誓，你这只烧伤的野兽，会比刚出生时更瘸地滚回你母亲身边！滚！
          emotion: angry
        - id: ch01-b46
          speaker: narrator
          text: 狼爸爸惊呆了。他几乎忘了当年狼妈妈还随狼群奔跑时，自己怎样堂堂正正打败五只狼，才赢得了她。罗刹这个名号，从来不是别人为了恭维才叫的。谢尔汗也许敢跟狼爸爸交手，却知道在这窄洞里，狼妈妈占尽地利，而且真会拼到死。他只能低吼着退出洞口，到了外面才敢喊。
        - id: ch01-b47
          speaker: shere_khan
          text: 狗在自家院里都敢叫！等着瞧吧，看狼群准不准你们养这个人崽。他是我的，早晚会落进我的牙缝，蓬尾巴的贼！
          emotion: angry
        - id: ch01-b48
          speaker: narrator
          text: 狼妈妈喘着气，退回幼崽中间。狼爸爸神情严肃。
        - id: ch01-b49
          speaker: father_wolf
          text: 谢尔汗这句话倒没错。我们必须把幼崽带给狼群看。母亲，你还要留下他吗？
        - id: ch01-b50
          speaker: mother_wolf
          text: 留下！他光着身子，夜里独自找来，饿成这样却一点不怕。瞧，他都把我的一只幼崽挤开了。那个瘸腿屠夫想杀他，再逃回温贡加，让村民来搜遍我们的巢穴。你还问我留不留？当然留下。躺好，小青蛙。毛克利，我就叫你青蛙毛克利。总有一天，你会像谢尔汗猎你那样去猎他。
        - id: ch01-b51
          speaker: father_wolf
          text: 可狼群会怎么说？
    - id: ch02
      title: 议事岩上的代价
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 丛林法规说得很清楚。狼成婚后可以离开原来的狼群，可幼崽一能站稳，就必须在月圆之夜带到狼群大会，让其他狼认清它们。检视以后，幼崽便能自由奔跑。在它杀死第一头公鹿以前，任何成年狼若杀了它，一旦查出便要偿命。这条法规少不得。
        - id: ch02-b02
          speaker: narrator
          text: 幼崽们能稍稍奔跑时，狼爸爸带着它们、毛克利和狼妈妈来到议事岩。山顶遍布岩石和巨砾，足以藏下百只狼。大灰独狼阿克拉凭勇力和智谋统领狼群，此刻舒展身体，卧在自己的岩石上。下面坐着四十多只大小不同、毛色各异的狼。有些是獾灰色的老手，能独自收拾一头公鹿。也有三岁的黑色青年狼，自以为同样办得到。
        - id: ch02-b03
          speaker: narrator
          text: 阿克拉已经统领它们一年。他年轻时两次掉进捕狼陷阱，有一次还被打得半死，扔在一旁，因此很懂人类的习性。议事岩上几乎没人交谈。幼崽在圆圈中央互相扑滚，父母围坐四周。年长的狼不时悄悄上前，仔细看一只幼崽，再踩着无声的脚步退回原位。有的母狼会把自己的孩子推到月光最亮的地方，免得它没被看见。
        - id: ch02-b04
          speaker: akela
          text: 你们懂得法规。狼群啊，看仔细！
        - id: ch02-b05
          speakers: [wolf_1, wolf_2, wolf_3, wolf_4]
          ensemble: chorus
          text: 看啊！狼群，看仔细！
        - id: ch02-b06
          speaker: narrator
          text: 终于轮到毛克利。狼妈妈颈上的毛全竖了起来。狼爸爸把青蛙毛克利推到中央。他坐在那里笑，摆弄着月光下一闪一闪的小石子。
        - id: ch02-b07
          speaker: akela
          text: 看仔细！
        - id: ch02-b08
          speaker: narrator
          text: 岩石后面传来压低的咆哮。谢尔汗藏在那里。
        - id: ch02-b09
          speaker: shere_khan
          text: 那幼崽是我的，把他交出来！自由之民留一个人崽做什么？
        - id: ch02-b10
          speaker: akela
          text: 狼群啊，看仔细！自由之民只听自己族人的话，何必理会外来的号令？看仔细！
        - id: ch02-b11
          speaker: narrator
          text: 群狼低声怒吼。一只四岁的青年狼又把谢尔汗的问题抛了出来。
        - id: ch02-b12
          speaker: young_wolf
          text: 自由之民留一个人崽，到底有什么用？
        - id: ch02-b13
          speaker: narrator
          text: 若狼群争议一只幼崽能不能加入，法规要求至少有两名不是它父母的成员替它说话。
        - id: ch02-b14
          speaker: akela
          text: 谁愿意替这只幼崽说话？自由之民中，有谁肯开口？
        - id: ch02-b15
          speaker: narrator
          text: 没有回答。狼妈妈已经准备好，一旦动手，就打完她这一生最后一仗。这时，唯一获准参加狼群大会的别种动物站起后腿，哼了一声。那是懒洋洋的棕熊巴鲁，负责教幼狼丛林法规。他只吃坚果、草根和蜂蜜，所以哪里都能去。
        - id: ch02-b16
          speaker: baloo
          text: 是那个人崽吗？我替他说话。他不会伤害谁。我不大会说漂亮话，可这是真话。让他跟狼群一起跑，和别的幼崽一同入群。我来教他。
        - id: ch02-b17
          speaker: akela
          text: 还差一个。巴鲁已经替他说话，他又是幼崽们的老师。还有谁？
        - id: ch02-b18
          speaker: narrator
          text: 一道黑影落进圆圈，那是黑豹巴希拉。他通身墨黑，只有光线恰好时，豹纹才像水波绸上的花纹一样浮出来。丛林里谁都认识巴希拉，也没有谁愿意挡他的路。他像塔巴基一样狡猾，像野水牛一样勇猛，发起狠来又像受伤的大象那样不顾一切。他的嗓音却柔得像树上滴下的野蜂蜜，皮毛也比绒毛更软。
        - id: ch02-b19
          speaker: bagheera
          text: 阿克拉，还有自由之民的各位，我没资格参加你们的大会。不过丛林法规说，如果一只新幼崽的争议还没到非杀不可的地步，就能出价买下他的命。法规可没说谁能出价，谁不能。我说得没错吧？
        - id: ch02-b20
          speakers: [wolf_1, wolf_2, wolf_3, wolf_4]
          ensemble: chorus
          text: 没错！听巴希拉说！可以出价买下幼崽，这就是法规！
        - id: ch02-b21
          speaker: bagheera
          text: 既然我本来没有发言权，就请各位准我说几句。
        - id: ch02-b22
          speakers: [wolf_1, wolf_2, wolf_3, wolf_4]
          ensemble: chorus
          text: 说吧！
        - id: ch02-b23
          speaker: bagheera
          text: 杀死一个赤裸的幼崽，多丢脸。况且等他长大，也许还能给各位的狩猎添些趣味。巴鲁已经替他说话。只要你们照法规接纳人崽，我再加一头肥公牛。那头牛刚刚被我杀死，离这里不到半英里。这条件还不够吗？
        - id: ch02-b24
          speakers: [wolf_1, wolf_2, wolf_3, wolf_4]
          ensemble: chorus
          text: 有什么关系？冬雨也许会冻死他，太阳也许会烤坏他。一只光溜溜的青蛙能害谁？让他跟狼群跑！巴希拉，公牛在哪儿？接纳他！
        - id: ch02-b25
          speaker: akela
          text: 看仔细——狼群啊，看仔细！
        - id: ch02-b26
          speaker: narrator
          text: 毛克利只顾玩石子，根本没留意狼们一个个走来审视他。最后，大家都下山找那头死牛去了。议事岩上只剩阿克拉、巴希拉、巴鲁和毛克利一家。谢尔汗仍在夜里怒吼，因为他没能得到毛克利。
        - id: ch02-b27
          speaker: bagheera
          text: 尽管吼吧。总有一天，这个赤裸的小家伙会让你换个调子叫。否则，我就算一点也不懂人。
        - id: ch02-b28
          speaker: akela
          text: 办得好。人和人的幼崽都很聪明。以后他也许能帮上忙。
        - id: ch02-b29
          speaker: bagheera
          text: 没错，需要时会帮上忙。毕竟没有谁能永远统领狼群。
        - id: ch02-b30
          speaker: narrator
          text: 阿克拉没有回答。他想起每个狼群首领都躲不过的那一天。力气渐渐离开身体，群狼会杀死衰弱的首领，再选出新的，而新首领将来也会这样死去。
        - id: ch02-b31
          speaker: akela
          text: 带他回去吧。把他教成一个配得上自由之民的成员。
        - id: ch02-b32
          speaker: narrator
          text: 就这样，靠巴鲁一句担保，再加一头公牛，毛克利加入了西奥尼狼群。
    - id: ch03
      title: 丛林里的十年
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 现在，你只好容我们一口气跳过十年或十一年。毛克利在狼群中的奇妙生活，只能留给想象去补。若把那些日子一件件全讲出来，还不知道要装满多少本书。他和幼狼一同长大。可还没等他从幼童长成少年，当年跟他挤在一起的幼狼已经全成了成年狼。
        - id: ch03-b02
          speaker: narrator
          text: 狼爸爸教他狼的本领，也教他读懂丛林。草叶的窸窣，暖夜里空气的呼吸，头顶猫头鹰的叫声，蝙蝠落在树上时爪子的轻刮，还有池中小鱼跃起的水响，他都听得懂，就像商人熟悉每天的买卖。
        - id: ch03-b03
          speaker: narrator
          text: 不学习时，他就在太阳下睡觉，吃了再睡。身上又脏又热，便去林间水塘游泳。想吃蜂蜜时，他就爬树去取。巴鲁告诉他，蜂蜜和坚果不比生肉难吃，巴希拉则教会了他爬树。
        - id: ch03-b04
          speaker: bagheera
          text: 上来吧，小兄弟！
        - id: ch03-b05
          speaker: narrator
          text: 起初，毛克利像树懒一样紧紧抱住树干。后来，他已经能在树枝之间飞荡，胆量差不多赶上灰猴。他也会在狼群大会上坐上议事岩。他发现，只要自己盯住一只狼的眼睛，那只狼便不得不低下头去，于是常拿这件事跟它们开玩笑。
        - id: ch03-b06
          speaker: narrator
          text: 别的时候，他会替朋友从爪垫里拔出长刺。蒺藜和芒刺扎进狼的皮毛，会疼得很。夜里，他走下山，进到耕地，好奇地观察茅屋里的人，却一直不信任他们。巴希拉曾给他看过一个方盒子，落门藏得很巧，就摆在丛林里。毛克利差一点走进去。巴希拉告诉他，那是人设下的陷阱。
        - id: ch03-b07
          speaker: narrator
          text: 毛克利最爱跟巴希拉走进黑暗温暖的森林深处。白天，他们昏沉沉地睡上一整日。到了晚上，他便看着巴希拉怎样追踪，又怎样捕杀猎物。巴希拉饿了就四处猎食，毛克利也一样，只有一个例外，那就是牲口绝不能碰。等他长到懂事的年纪，巴希拉便把缘故告诉了他。
        - id: ch03-b08
          speaker: bagheera
          text: 整座丛林都是你的。只要你有力气杀死，就可以猎取。可你是用一头公牛换来的，所以无论牲口年老还是年幼，你都不能杀，也不能吃。这是丛林法规。
        - id: ch03-b09
          speaker: narrator
          text: 毛克利始终守着这条法规。他一天接一天地长大，身体也越来越强壮。一个孩子若不知道自己每天都在上课，世上又没有别的事要操心，只需要想着下一顿到哪里找东西吃，自然就会这样成长。
        - id: ch03-b10
          speaker: narrator
          text: 狼妈妈有一两次提醒他，谢尔汗不能信，总有一天他得杀掉那只老虎。青年狼会记住这种警告，毛克利却总忘，因为他毕竟只是个男孩。虽然他若会说人类的话，一定会说自己是一只狼。
        - id: ch03-b11
          speaker: narrator
          text: 谢尔汗却不断挡在他的路上。阿克拉一天比一天老弱，瘸虎便拉拢狼群里的青年狼。它们靠捡他的残羹过活。若阿克拉还敢完全施展首领的威严，绝不会容忍这件事。谢尔汗不停奉承它们，还装出惊讶的样子挑拨。
        - id: ch03-b12
          speaker: shere_khan
          text: 你们都是这么出色的年轻猎手，怎么还肯听一只快死的老狼，还有一个人崽发号施令？我听说在大会上，你们连他的眼睛都不敢看。
        - id: ch03-b13
          speaker: narrator
          text: 青年狼们听了，只会竖起背上的毛，低声咆哮。耳目遍布丛林的巴希拉知道不少内情。他曾有一两次直截了当地告诉毛克利，谢尔汗总有一天会杀死他。可毛克利每回听见，都只是笑。
        - id: ch03-b14
          speaker: mowgli
          text: 我有狼群，还有你。巴鲁虽然懒，看在我的份上也肯挥几掌。我有什么好怕的？
        - id: ch03-b15
          speaker: narrator
          text: 一个酷热的日子，巴希拉听到一件事，心里有了新主意。也许消息是豪猪伊基告诉他的。两人待在丛林深处，毛克利枕着巴希拉美丽的黑皮毛。
        - id: ch03-b16
          speaker: bagheera
          text: 小兄弟，我跟你说过多少次，谢尔汗是你的仇敌？
        - id: ch03-b17
          speaker: mowgli
          text: 那边棕榈树上有多少颗坚果，你就说过多少次。又怎么了？我困了，巴希拉。谢尔汗只是尾巴长，空话多，跟孔雀毛一样。
        - id: ch03-b18
          speaker: bagheera
          text: 现在不能睡。巴鲁知道，我知道，狼群知道，连最蠢的鹿也知道。塔巴基不也告诉过你？
        - id: ch03-b19
          speaker: mowgli
          text: 哈！前些日子，塔巴基跑来骂我，说我是光溜溜的人崽，连野猪吃的坚果都不配挖。我抓住他的尾巴，在棕榈树上甩了两圈，让他学学礼貌。
        - id: ch03-b20
          speaker: bagheera
          text: 那是在胡闹。塔巴基虽然惹人厌，却会带来跟你有关的消息。睁开眼，小兄弟。谢尔汗不敢在丛林里杀你，可阿克拉已经老了。很快就会有一天，他再也杀不死公鹿，也就不再是首领。当年检视你的狼，很多也老了。青年狼信了谢尔汗的话，认定人崽不该留在狼群。你很快就要成人了。
        - id: ch03-b21
          speaker: mowgli
          text: 人有什么特别，为什么不能跟兄弟们一起跑？我生在丛林，也守丛林法规。狼群里每只狼的爪子，我都替它拔过刺。它们当然是我的兄弟！
        - id: ch03-b22
          speaker: narrator
          text: 巴希拉伸展身体，半闭起眼睛。
        - id: ch03-b23
          speaker: bagheera
          text: 小兄弟，摸摸我下巴底下。
        - id: ch03-b24
          speaker: narrator
          text: 毛克利伸出强健的棕色手掌，仔细摸过巴希拉丝滑的下巴。他在那里摸到了一小块没有毛的秃斑。秃斑周围的肌肉又大又结实，随着黑豹的动作滚动起伏，平常却全被亮泽柔软的黑毛遮住，谁也看不出来。
        - id: ch03-b25
          speaker: bagheera
          text: 丛林里没人知道，我巴希拉带着一道项圈留下的疤。小兄弟，我生在人类中间，我母亲也死在人类中间，就在乌代浦王宫的笼子里。所以你还是赤裸的小幼崽时，我才会在大会上替你出价。不错，我没见过丛林，却在铁栏后出生，吃铁盘里的食物。直到有一晚，我终于明白，我是巴希拉，是黑豹，不是给人玩弄的东西。我一爪打破那把可笑的锁，逃了出来。我懂人的办法，所以在丛林里比谢尔汗更可怕。对不对？
        - id: ch03-b26
          speaker: mowgli
          text: 对。整座丛林都怕巴希拉，只有毛克利不怕。
        - id: ch03-b27
          speaker: bagheera
          text: 唉，你是个人崽。就像我回到自己的丛林，你最终也得回到人类那里，回到跟你同类的兄弟中间。除非你先在大会上被杀掉。
        - id: ch03-b28
          speaker: mowgli
          text: 可为什么？为什么会有谁想杀我？
        - id: ch03-b29
          speaker: bagheera
          text: 看着我。
        - id: ch03-b30
          speaker: narrator
          text: 毛克利照他说的，直直望进巴希拉的双眼。还不到半分钟，连这只勇猛的大黑豹也承受不住，只得把头转开。
        - id: ch03-b31
          speaker: bagheera
          text: 这就是原因。连我也看不住你的眼睛。我生在人类中间，又爱你，小兄弟。别的狼却恨你，因为它们挡不住你的目光，因为你比它们聪明，也因为你替它们拔过爪里的刺。说到底，因为你是人。
        - id: ch03-b32
          speaker: narrator
          text: 毛克利浓黑的眉毛皱了起来。
        - id: ch03-b33
          speaker: mowgli
          text: 这些事，我一点也不知道。
          emotion: sad
        - id: ch03-b34
          speaker: bagheera
          text: 丛林法规怎么说？先出手，再出声。你毫无防备，让它们看出了你是人。现在得聪明一点。我想，等阿克拉下一次捕鹿失手，狼群就会一起反对他，也反对你。它们会在议事岩开会，然后……有办法了！快下山，去谷里的人类茅屋，拿一些他们种的红花。到那一刻，你就会有一个朋友，比我、巴鲁，还有爱你的狼加起来都强。去取红花。
        - id: ch03-b35
          speaker: narrator
          text: 巴希拉说的红花就是火。丛林里的动物都不肯直呼火的名字。它们怕得要命，想出上百种说法来指它。
        - id: ch03-b36
          speaker: mowgli
          text: 红花？黄昏时，它长在人们屋外。我能拿一些来。
        - id: ch03-b37
          speaker: bagheera
          text: 这才像人崽说的话。记住，它装在小罐子里。快去取一罐，留在身边，等需要时再用。
        - id: ch03-b38
          speaker: mowgli
          text: 好，我现在就去。可你真的肯定吗，我的巴希拉？这一切全是谢尔汗捣的鬼？
        - id: ch03-b39
          speaker: narrator
          text: 毛克利用手臂搂住黑豹壮美的脖颈，深深望进他的眼睛。
        - id: ch03-b40
          speaker: bagheera
          text: 我以那把放我自由的断锁起誓。肯定是他，小兄弟。
        - id: ch03-b41
          speaker: mowgli
          text: 那么，我也以买下我的公牛起誓。我会把这笔账一点不少地还给谢尔汗，也许还要多还一点。
        - id: ch03-b42
          speaker: narrator
          text: 毛克利说完便一跃而去。
        - id: ch03-b43
          speaker: bagheera
          text: 这是人，完完全全是人。谢尔汗啊，十年前你追那只小青蛙，可真给自己招来了一场再黑暗不过的狩猎！
    - id: ch04
      title: 红花
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 毛克利一路飞奔，穿过很远很远的森林，胸口的怒火滚烫。暮雾升起时，他回到山洞，停下来喘气，低头望着山谷。幼狼们全都出去了，只有狼妈妈留在洞底。她听见他的呼吸声，立刻知道自己的小青蛙碰上了烦心事。
        - id: ch04-b02
          speaker: mother_wolf
          text: 出什么事了，儿子？
        - id: ch04-b03
          speaker: mowgli
          text: 没什么，只是几句关于谢尔汗的蝙蝠闲话。今晚我要去耕地打猎。
        - id: ch04-b04
          speaker: narrator
          text: 他冲下灌木，来到谷底的小溪边。那里传来狼群追猎的呼喊、水鹿的吼叫，还有公鹿转身抵抗时的喷鼻声。接着，青年狼发出阴狠尖利的嗥叫。
        - id: ch04-b05
          speakers: [young_wolf, wolf_1, wolf_2, wolf_3]
          ensemble: chorus
          text: 阿克拉！让独狼显显本事！给狼群首领让路！跳啊，阿克拉！
        - id: ch04-b06
          speaker: narrator
          text: 独狼一定扑出去又失手了。毛克利先听见牙齿合拢的脆响，接着是一声惨叫，公鹿用前蹄把阿克拉撞翻在地。
        - id: ch04-b07
          speaker: narrator
          text: 毛克利没再等。他继续奔跑，把身后的嗥叫越甩越远，直到跑进村民的农田。
        - id: ch04-b08
          speaker: mowgli
          text: 巴希拉说得对。明天既是阿克拉的日子，也是我的日子。
        - id: ch04-b09
          speaker: narrator
          text: 他蜷进一间茅屋窗下堆着的牲口饲料里，把脸贴近窗户，看着壁炉里的火。夜深后，农夫的妻子起身，往火里添了几块黑色的硬东西。清晨来到时，雾又白又冷。农夫的孩子拿起一个内壁糊着泥土的柳条罐，装满烧红的木炭，再塞到毯子下面，出门去牛棚照料牛群。
        - id: ch04-b10
          speaker: mowgli
          text: 原来这么简单？连幼崽都做得到，那就没什么可怕。
        - id: ch04-b11
          speaker: narrator
          text: 毛克利大步绕过墙角，迎面撞上男孩，一把夺走火罐，转眼消失在雾里。男孩吓得放声大哭。
        - id: ch04-b12
          speaker: mowgli
          text: 他们跟我很像。我要是不给这东西吃的，它也会死。
        - id: ch04-b13
          speaker: narrator
          text: 他学着那女人的样子，朝罐里吹气，又把细枝和干树皮喂给红炭。爬到半山腰时，他遇见巴希拉。晨露在黑豹身上闪着月长石一样的光。
        - id: ch04-b14
          speaker: bagheera
          text: 阿克拉失手了。昨晚它们本想杀他，可还需要找到你。它们正在山上到处搜寻。
        - id: ch04-b15
          speaker: mowgli
          text: 我去了耕地。我已经准备好了。看！
        - id: ch04-b16
          speaker: bagheera
          text: 很好！我见过人把干树枝插进去。用不了多久，枝头便会开出红花。你不害怕吗？
        - id: ch04-b17
          speaker: mowgli
          text: 不怕，为什么要怕？我现在想起来了，如果那不是梦，在变成狼以前，我曾躺在红花旁边。它又暖和，又舒服。
        - id: ch04-b18
          speaker: narrator
          text: 毛克利一整天都坐在洞里照看火罐，不时拿起一根干枝，把它伸进红炭里，仔细看火怎样从枝头烧起来。他试过一根又一根，终于选中一根满意的树枝。傍晚，塔巴基来到洞口，很不客气地通知他去议事岩。毛克利只看着他笑，笑得塔巴基转身逃走。随后，他也带着火罐去参加大会，一路仍笑个不停。
    - id: ch05
      title: 告别自由之民
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 独狼阿克拉没有再卧上自己的岩石，只躺在岩石旁边。这是在告诉大家，狼群首领的位置已经空了。谢尔汗带着那群靠他残羹过活的追随者，公然在众狼面前来回踱步，听着它们一句接一句地奉承自己。巴希拉紧挨着毛克利卧下，装着红炭的火罐就放在毛克利两膝之间。等大家到齐，谢尔汗便抢先开口发言。这种事在阿克拉盛年时，他绝对不敢做。
        - id: ch05-b02
          speaker: bagheera
          text: 他没资格说话。告诉它们。他不过是条狗崽子，会怕你的。
        - id: ch05-b03
          speaker: narrator
          text: 毛克利一跃而起。
        - id: ch05-b04
          speaker: mowgli
          text: 自由之民！什么时候轮到谢尔汗统领狼群了？老虎跟我们的首领之位有什么关系？
        - id: ch05-b05
          speaker: shere_khan
          text: 既然首领的位置空着，又有人请我讲话——
        - id: ch05-b06
          speaker: mowgli
          text: 谁请你了？难道我们全是豺狼，要向这个牲口屠夫摇尾巴？狼群的首领，只能由狼群决定。
        - id: ch05-b07
          speakers: [young_wolf, wolf_1]
          ensemble: duo
          text: 闭嘴，你这人崽！
        - id: ch05-b08
          speakers: [wolf_2, wolf_3]
          ensemble: duo
          text: 让他说！他一直遵守我们的法规！
        - id: ch05-b09
          speaker: narrator
          text: 最后，狼群里的长者一同发出雷鸣般的吼声。
        - id: ch05-b10
          speakers: [wolf_1, wolf_2, wolf_3, wolf_4]
          ensemble: chorus
          text: 让死狼说话！
        - id: ch05-b11
          speaker: narrator
          text: 狼群首领只要有一次捕猎失手，从那以后便会被叫作死狼。而所谓余生，通常也不会太长。阿克拉听见群狼的呼喊，疲惫地抬起老迈的头。
        - id: ch05-b12
          speaker: akela
          text: 自由之民，还有你们这些谢尔汗的豺狼！十二个寒暑里，我带你们去狩猎，也带你们带着猎物回来。没有一只狼落入陷阱，也没有一只受伤。现在我失手了。你们都知道那场阴谋怎样安排。你们故意赶来一头我从未试探过的公鹿，好让我的衰弱暴露出来。做得真聪明。现在你们有权在议事岩杀我。那么，谁来结束独狼的命？按丛林法规，我有权要你们一个一个上前。
        - id: ch05-b13
          speaker: narrator
          text: 很久都没有声音。没有哪只狼愿意单独跟阿克拉决一死战。谢尔汗这才吼起来。
        - id: ch05-b14
          speaker: shere_khan
          text: 呸！谁在乎这个没牙的蠢货？他已经死定了！该说的是那个活得太久的人崽。自由之民，他从一开始就是我的肉。把他给我！这套人狼把戏，我早就受够了。他搅扰丛林整整十个寒暑。要是不交，我就永远在这里打猎，一根骨头也不给你们留下。他是人，是人的孩子，我恨他恨到骨头里！
          emotion: angry
        - id: ch05-b15
          speakers: [young_wolf, wolf_1, wolf_2, wolf_3]
          ensemble: chorus
          text: 人！人！人跟我们有什么关系？让他回自己的地方！
        - id: ch05-b16
          speaker: shere_khan
          text: 再让他带各个村子的人来跟我们作对吗？不！把他交出来。他是人，我们谁都不敢看他的眼睛。
        - id: ch05-b17
          speaker: akela
          text: 他吃过我们的食物，跟我们睡在一起，也替我们赶过猎物。他从来没有违背丛林法规。
        - id: ch05-b18
          speaker: bagheera
          text: 而且他入群时，我用一头公牛买下了他。一头公牛不算什么，可巴希拉的荣誉还值一点分量。为了这份荣誉，我也许愿意一战。
        - id: ch05-b19
          speakers: [young_wolf, wolf_1, wolf_2, wolf_3]
          ensemble: chorus
          text: 十年前的一头牛！十年前剩下的骨头，谁还在乎？
        - id: ch05-b20
          speaker: bagheera
          text: 那么誓言呢？你们还真配得上自由之民这个名字！
        - id: ch05-b21
          speaker: shere_khan
          text: 人崽不能跟丛林之民一起跑。把他交给我！
        - id: ch05-b22
          speaker: akela
          text: 除了血缘，他处处都是我们的兄弟，你们竟然要在这里杀他！我确实活得太久了。你们中有些狼吃过牲口，还有一些听了谢尔汗的话，夜里摸进村庄，从人家门口叼走孩子。我知道你们是懦夫，现在也正对懦夫说话。
        - id: ch05-b23
          speaker: akela
          text: 我一定会死，这条命已经不值什么。不然，我愿意拿它换人崽的命。可是为了狼群的荣誉——你们没了首领，连这点小事都忘了——只要你们让他回到自己的族类，我死期来到时就不向你们露一颗牙。我会放弃抵抗，至少能替狼群省下三条命。我只能做到这些。
        - id: ch05-b24
          speaker: akela
          text: 还有，如果你们肯听，也能免去一桩耻辱。别杀一个没有犯错的兄弟。他依照丛林法规，有人担保，也有人出价，才加入了狼群。
        - id: ch05-b25
          speakers: [young_wolf, wolf_1, wolf_2, wolf_3]
          ensemble: chorus
          text: 他是人！是人！是人！
        - id: ch05-b26
          speaker: narrator
          text: 大半狼群离开原来的位置，一只接一只朝谢尔汗身边聚去。等它们围拢过来，谢尔汗的尾巴也开始一下下抽动起来。
        - id: ch05-b27
          speaker: bagheera
          text: 现在，全在你手里了。除了战斗，我们已经没有别的办法。
        - id: ch05-b28
          speaker: narrator
          text: 毛克利捧着火罐站直。他伸开双臂，对着大会打了个哈欠，心里却被愤怒和悲伤烧得发狂。狼有狼的脾气，它们从没告诉过他，原来这样恨他。
        - id: ch05-b29
          speaker: mowgli
          text: 听着！这些狗叫不必再听了。今晚，你们一遍遍说我是人。我本来想一辈子跟你们一起做狼，可现在我觉得，你们说对了。所以，我不再叫你们兄弟。我会像人那样叫你们萨格，也就是狗！你们该做什么，不该做什么，已经轮不到你们决定。现在由我来定。为了让大家看清楚，我这个人带来了一点红花，就是你们这些狗最怕的东西！
          emotion: angry
        - id: ch05-b30
          speaker: narrator
          text: 他把火罐摔在地上。几块红炭点燃了干苔，火焰猛地窜起。整个大会吓得往后退。毛克利把枯枝伸进火里，等细枝噼啪燃烧，便高高举过头顶，在畏缩的群狼之间挥舞。
        - id: ch05-b31
          speaker: bagheera
          text: 现在你是主人了。救下阿克拉，他一直是你的朋友。
        - id: ch05-b32
          speaker: narrator
          text: 严峻的老狼阿克拉一生从没向谁求过怜悯，此刻却哀伤地看了毛克利一眼。男孩赤裸着身体站在那里，长长的黑发散落在肩头。燃烧的树枝照亮了他，也让四周那些黑色的影子不停跳跃、颤动。
        - id: ch05-b33
          speaker: mowgli
          text: 好！我终于看清了，你们就是一群狗。我要离开，去找自己的族类——如果他们真是我的族类。丛林已经把门关上，我必须忘掉你们的语言，也忘掉你们的陪伴。可我会比你们仁慈。我曾经几乎是你们的亲兄弟，所以我答应，等我在人类中长大，绝不会像你们背叛我这样，把你们出卖给人类。
          emotion: angry
        - id: ch05-b34
          speaker: narrator
          text: 他一脚踢进火堆，火星四处飞溅。
        - id: ch05-b35
          speaker: mowgli
          text: 狼群里不会发生战争。不过离开以前，我还有一笔债要收。
        - id: ch05-b36
          speaker: narrator
          text: 他大步走到谢尔汗面前。老虎坐在那里，被火光照得发呆，只顾眨眼。毛克利一把抓住他下巴上的毛簇。巴希拉紧跟在后面，以防出事。
        - id: ch05-b37
          speaker: mowgli
          text: 起来，狗！人说话时，你给我站起来。不然我就点着你的皮毛！
          emotion: angry
        - id: ch05-b38
          speaker: narrator
          text: 谢尔汗把两只耳朵紧贴在脑后，闭上眼睛，因为燃烧的树枝已经逼到眼前。
        - id: ch05-b39
          speaker: mowgli
          text: 这个牲口屠夫说，要在大会上杀我，因为我还是幼崽时，他没能得手。人打狗，就是这样打！动一根胡须试试，朗格里，我就把红花塞进你的喉咙！
          emotion: angry
        - id: ch05-b40
          speaker: narrator
          text: 毛克利用树枝抽打谢尔汗的脑袋。老虎怕得痛苦呜咽。
        - id: ch05-b41
          speaker: mowgli
          text: 呸！烧焦了毛的丛林猫，滚吧！记住，下次我以人的身份来到议事岩，会把谢尔汗的皮披在头上。阿克拉可以自由生活，想怎样就怎样。你们谁也不准杀他，因为我不准！也别再坐在这里伸着舌头，装成了不起的大人物。你们只是一群狗，我就这样赶你们走。滚！
          emotion: angry
        - id: ch05-b42
          speaker: narrator
          text: 枝头的火烧得正旺。毛克利朝圆圈左边抽打，再朝右边挥去。狼们一边嚎叫，一边四散逃走。飞出的火星落在它们身上，烧焦了皮毛。最后，议事岩上只剩阿克拉、巴希拉，还有大约十只曾经支持毛克利的狼。
        - id: ch05-b43
          speaker: narrator
          text: 这时，毛克利心里有个地方突然疼了起来。这种疼，他一生从没尝过。他喘不上气，不住抽泣，泪水从脸上滚下来。
        - id: ch05-b44
          speaker: mowgli
          text: 这是什么？这到底是什么？我不想离开丛林，又不知道自己怎么了。我快死了吗，巴希拉？
          emotion: sad
        - id: ch05-b45
          speaker: bagheera
          text: 不，小兄弟。那只是人类流的眼泪。现在我知道，你是人，不再是人类的幼崽了。从今天起，丛林真的向你关上了门。让眼泪流吧，毛克利。那只是眼泪。
          emotion: calm
        - id: ch05-b46
          speaker: narrator
          text: 毛克利坐下来，哭得仿佛心都要碎了。他有生以来从没哭过。
        - id: ch05-b47
          speaker: mowgli
          text: 现在，我要去人类那里了。不过我得先向母亲告别。
        - id: ch05-b48
          speaker: narrator
          text: 他回到狼爸爸和狼妈妈居住的山洞，伏在母亲的皮毛上哭。四只狼兄弟也凄惨地嗥叫。
        - id: ch05-b49
          speaker: mowgli
          text: 你们不会忘记我吧？
          emotion: sad
        - id: ch05-b50
          speakers: [wolf_1, wolf_2, wolf_3, wolf_4]
          ensemble: chorus
          text: 只要我们还能循着足迹，就永远不会忘记。等你成了人，要到山脚下来，我们会跟你说话。夜里，我们也会走进耕地，陪你玩。
          emotion: sad
        - id: ch05-b51
          speaker: father_wolf
          text: 快回来！聪明的小青蛙，快回来吧。我和你母亲都老了。
          emotion: sad
        - id: ch05-b52
          speaker: mother_wolf
          text: 快回来，我赤裸的小儿子。人类的孩子，你听着，我爱你，胜过爱我亲生的幼崽。
          emotion: sad
        - id: ch05-b53
          speaker: mowgli
          text: 我一定回来。等我回来，会把谢尔汗的皮铺在议事岩上。别忘了我！也告诉丛林里的大家，永远别忘记我！
          emotion: sad
        - id: ch05-b54
          speaker: narrator
          text: 黎明刚刚出现，毛克利独自走下山坡，去迎接那些名叫人的神秘生灵。
