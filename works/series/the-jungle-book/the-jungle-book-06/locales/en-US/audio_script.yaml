      display_name: Little Toomai's Mother
      tts: {delivery: "gentle, soothing, and intimate", timbre: "soft and warm", pace: slow, pitch: medium}
  chapters:
    - id: ch01
      title: The Old Black Snake
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "An elephant's old song says: I will remember what I was. I am tired of rope and chain. I will remember my strength and all my life in the forest. I will not sell my back to men for a bundle of sugarcane. I will go back to my own kind and the creatures in their dens. I will walk until morning breaks, out where the wind is clean and the water touches me gently. I will forget the ring around my ankle and snap the stake that holds me. I will find the loves and playmates I lost, all of them free from masters."
        - id: ch01-b02
          speaker: narrator
          text: "Kala Nag's name meant Black Snake. He had served the Indian Government in every way an elephant could for forty-seven years. He had already been twenty when men caught him, so he was nearly seventy now, a great age for an elephant. Long before he reached his full strength, he had pushed with a thick leather pad on his forehead to free a gun sunk deep in mud. That was before the Afghan War of 1842."
        - id: ch01-b03
          speaker: narrator
          text: "His mother, Radha Pyari, had been caught in the same drive. Before Kala Nag lost his little milk tusks, she taught him that frightened elephants always got hurt. He learned the truth of it the first time he saw a shell explode. He backed away screaming, straight into a stack of rifles, and the bayonets stabbed every tender place they could reach. Before he was twenty-five, Kala Nag had stopped being afraid. That made him the best-loved and best-cared-for elephant in the Government's service."
        - id: ch01-b04
          speaker: narrator
          text: "He had carried twelve hundred pounds of tents on marches through Upper India. A steam crane had lifted him aboard a ship and carried him over the sea for days. In a strange rocky country far from India, he bore a mortar on his back and saw Emperor Theodore lying dead at Magdala. When he sailed home, the soldiers said he had earned the Abyssinian War medal. Ten years later, at Ali Musjid, he watched other elephants die from cold, fits, hunger, and sunstroke. Then he traveled thousands of miles south to the timberyards at Moulmein, where he hauled and stacked huge beams of teak. There he nearly killed a rebellious young elephant that refused to do its share."
        - id: ch01-b05
          speaker: narrator
          text: "After that, Kala Nag left the timber work. He joined scores of elephants trained to help catch wild herds in the Garo hills. The Indian Government guarded wild elephants carefully. A whole department did nothing but hunt them, capture them, train them, and send them wherever the country needed their strength."
        - id: ch01-b06
          speaker: narrator
          text: "Kala Nag stood a full ten feet at the shoulder. His tusks had been cut down to five feet, and copper bands protected their ends from splitting. Even with those blunt stumps, he could do more than an untrained elephant could do with sharp tusks. The catchers spent week after week carefully moving scattered elephants across the hills. At last they brought forty or fifty wild giants to the final stockade. The herd rushed through the entrance, and a heavy gate made from tree trunks lashed together crashed down behind them."
        - id: ch01-b07
          speaker: narrator
          text: "At a command, Kala Nag entered the firelit, trumpeting uproar. The work was usually done at night, when torches flickered and distances were hard to judge. He chose the biggest, fiercest tusker, battered him, and shouldered him into submission. While Kala Nag held that giant quiet, men riding the other tame elephants roped and tied the smaller captives."
        - id: ch01-b08
          speaker: narrator
          text: "Old Black Snake knew every kind of fight. More than once he had faced a wounded tiger charging him. He curled his soft trunk safely away, then struck the leaping animal sideways in midair with a quick, curved sweep of his head, a move he had invented himself. Once the tiger fell, Kala Nag knelt on it with his enormous knees until its last gasp and howl were over. Afterward, there was only a limp striped shape on the earth for him to pull by the tail."
        - id: ch01-b09
          speaker: big_toomai
          text: "There is nothing Black Snake fears except me. My grandfather saw him caught. My father took him to Abyssinia. Three generations of our family have fed and groomed him, and he will live long enough to see a fourth."
        - id: ch01-b10
          speaker: narrator
          text: "Big Toomai was Kala Nag's driver. Beside him stood his ten-year-old son, Little Toomai, stretching all four feet of himself as tall as he could. He wore only one rag. When he grew up, he would take his father's place on Kala Nag's neck and hold the heavy iron elephant goad, polished smooth by his father, grandfather, and great-grandfather."
        - id: ch01-b11
          speaker: little_toomai
          text: "He is afraid of me too."
        - id: ch01-b12
          speaker: narrator
          text: "Little Toomai had been born beneath Kala Nag's shadow and played with the tip of his trunk before he could walk. As soon as he could walk, he led Kala Nag down to water. The elephant would no more ignore the boy's high commands than he would have killed him on the day Big Toomai carried the brown baby beneath his tusks and told him to salute the master he would one day serve."
        - id: ch01-b13
          speaker: little_toomai
          text: "Yes, he is afraid of me. Come on, you fat old pig. Lift that foot. Now the next one."
        - id: ch01-b14
          speaker: narrator
          text: "Kala Nag obeyed, and Little Toomai tossed his shaggy head in imitation of his father."
        - id: ch01-b15
          speaker: little_toomai
          text: "Wah, what a huge elephant you are! The Government may pay for elephants, but they belong to us mahouts. One day a rich rajah will buy you because you are so large and so well behaved. You will lead the King's processions wearing gold earrings, a golden howdah, and a red cloth covered in gold. I will sit on your neck with a silver goad. Men with golden sticks will run ahead crying, 'Make way for the King's elephant!' That will be good, Kala Nag, but not as good as hunting here in the jungle."
        - id: ch01-b16
          speaker: big_toomai
          text: "Umph! You are only a boy, and as wild as a buffalo calf. Running over these hills is not the best Government work. I am old, and I have no love for wild elephants. Give me brick elephant lines, a stall for every animal, strong tethering stumps, and wide level roads. I am tired of camps that move. The barracks at Cawnpore were good. There was a bazaar nearby, and we worked only three hours a day."
        - id: ch01-b17
          speaker: narrator
          text: "Little Toomai remembered Cawnpore and kept quiet. He hated those flat roads, the daily digging for grass, and the long empty hours watching Kala Nag fidget at his ropes. Camp life suited him much better."
    - id: ch02
      title: Inside the Keddah
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "He loved climbing narrow paths that only an elephant could manage, then looking down into the valleys below. He loved catching a glimpse of wild herds feeding miles away and seeing startled pigs and peacocks dart from Kala Nag's feet. Warm rain could blind him while every hill and valley seemed to smoke. Misty mornings began without anyone knowing where the camp would stand that night. Then came the slow, steady pressure of the drive. Best of all was the final night, with its mad rush, blazing torches, and tremendous noise."
        - id: ch02-b02
          speaker: narrator
          text: "Elephants poured into the stockade like rocks in a landslide. Finding no escape, they hurled their bodies against the heavy posts. Men forced them back with yells, blazing torches, and volleys of blank shots. In that chaos, even a small boy could help. Little Toomai was worth three ordinary boys there. He fetched his own torch, waved it fiercely, and shouted as well as the oldest catcher."
        - id: ch02-b03
          speaker: narrator
          text: "When the captives were led out, the Keddah looked like the end of the world. No one could hear speech, so the men signaled with their hands. Little Toomai climbed a trembling post. With his sun-bleached hair flying in the torchlight, he looked like a goblin. In every pause, his sharp cries rang above trumpeting, crashing, snapping ropes, and groaning elephants."
        - id: ch02-b04
          speaker: little_toomai
          text: "Mael, mael, Kala Nag! Go on, Black Snake! Give him the tusk! Careful, careful! Hit him! Mind the post! Arre! Arre! Hai! Yai! Kya-a-ah!"
        - id: ch02-b05
          speaker: narrator
          text: "The fight swayed across the Keddah. Old catchers wiped their eyes and nodded at the boy wriggling with delight. One night he did more. He slid down between the elephants and threw a fallen rope to a driver trying to catch the leg of a kicking calf. Calves always caused more trouble than grown animals. Kala Nag saw him, lifted him in his trunk, and handed him to Big Toomai. His father slapped him at once and put him back on the post."
        - id: ch02-b06
          speaker: big_toomai
          text: "Are brick lines and a little tent carrying not enough for you? Must you catch elephants for yourself, you worthless little fellow? Those foolish hunters, who earn less than I do, have told Petersen Sahib."
        - id: ch02-b07
          speaker: narrator
          text: "Little Toomai was frightened. To him, Petersen Sahib was the greatest white man alive. He commanded every Keddah operation and knew more about elephants than any living man."
        - id: ch02-b08
          speaker: little_toomai
          text: "What will happen?"
          emotion: fearful
        - id: ch02-b09
          speaker: big_toomai
          text: "The worst! Petersen Sahib is mad, or he would not hunt these devils. He may make you a catcher, sleeping in feverish jungles until a beast tramples you. Luckily the season ends next week. We plains drivers will return to our stations, march on smooth roads, and forget this hunting."
        - id: ch02-b10
          speaker: big_toomai
          text: "I am angry that you meddled in work for Assamese jungle folk. Kala Nag obeys only me, so I ride him into the Keddah. But he fights. He does not rope captives. I sit safely above it all, as a mahout should, not crawling like a common hunter. I am a mahout, and I get a pension. Is Toomai's family to be crushed into Keddah dirt? Bad boy! Wicked boy! Worthless son!"
          emotion: angry
        - id: ch02-b11
          speaker: big_toomai
          text: "Go wash Kala Nag, inspect his ears, and clear the thorns from his feet. Otherwise Petersen Sahib will turn you into a wild hunter who follows elephant tracks, a jungle bear. Bah! Shame! Go!"
          emotion: angry
        - id: ch02-b12
          speaker: narrator
          text: "Little Toomai left without answering. While he checked Kala Nag's feet, he told the elephant all his troubles."
        - id: ch02-b13
          speaker: little_toomai
          text: "It does not matter. They have told Petersen Sahib my name, and perhaps... perhaps... perhaps... who knows? Hai! What a great thorn I pulled out!"
        - id: ch02-b14
          speaker: narrator
          text: "The next days were spent gathering all the elephants for departure. Each newly caught wild animal had to walk up and down between a pair of tame elephants. That practice kept it from causing too much trouble on the long journey down to the plains. Meanwhile, the men took stock of the camp. They counted blankets, ropes, and every other piece of equipment that had been worn through or lost during the season in the forest."
    - id: ch03
      title: When the Elephants Dance
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "Petersen Sahib arrived on Pudmini, his clever female elephant. The season was ending, and he had been paying the other hill camps. Beneath a tree, a clerk sat at a table and paid each driver. After collecting his wages, every man returned to his elephant and joined the line waiting to leave. The permanent Keddah men stayed behind all year. Catchers, hunters, and beaters sat on Petersen's elephants or leaned on trees with guns across their arms. They teased the departing plains drivers and laughed whenever a new elephant broke rank and ran about."
        - id: ch03-b02
          speaker: narrator
          text: "Big Toomai approached the clerk with Little Toomai behind him. Machua Appa, the head tracker, spoke quietly to a friend."
        - id: ch03-b03
          speaker: machua_appa
          text: "There goes at least one good piece of elephant stuff. It is a pity to send that young jungle cock down to the plains to lose his spirit."
        - id: ch03-b04
          speaker: narrator
          text: "Petersen Sahib seemed to have ears everywhere. A man must listen closely when his work is to follow wild elephants, the quietest creatures alive. He turned where he lay stretched along Pudmini's back."
        - id: ch03-b05
          speaker: petersen_sahib
          text: "What was that? I did not know any plains driver had enough sense to rope even a dead elephant."
        - id: ch03-b06
          speaker: machua_appa
          text: "Not a man, Sahib. A boy. During the last drive, he entered the Keddah and threw Barmao a rope. We were trying to pull that young calf with the blotch on its shoulder away from its mother."
        - id: ch03-b07
          speaker: narrator
          text: "Machua Appa pointed. Petersen Sahib looked at Little Toomai, and the boy bowed until he touched the ground."
        - id: ch03-b08
          speaker: petersen_sahib
          text: "He threw the rope? Why, he is smaller than a picket pin. Little one, what is your name?"
        - id: ch03-b09
          speaker: narrator
          text: "Little Toomai was too scared to answer. Kala Nag stood behind him. The boy made one small sign, and the elephant curled his trunk around him and lifted him level with Pudmini's forehead, right in front of the great Petersen Sahib. Little Toomai hid his face in his hands. Around elephants he knew no fear, but everywhere else he could be as shy as any child. Petersen smiled beneath his mustache."
        - id: ch03-b10
          speaker: petersen_sahib
          text: "Oho! Why did you teach your elephant that trick? Was it so you could steal green corn drying on the roofs?"
        - id: ch03-b11
          speaker: little_toomai
          text: "Not green corn, Protector of the Poor. Melons."
        - id: ch03-b12
          speaker: narrator
          text: "The men roared with laughter. Most of them had taught elephants the same trick as boys. Little Toomai hung eight feet above the ground and wished he could sink eight feet beneath it."
        - id: ch03-b13
          speaker: big_toomai
          text: "He is my son Toomai, Sahib. A very bad boy. He will end in jail."
        - id: ch03-b14
          speaker: petersen_sahib
          text: "I doubt that. A boy who faces a full Keddah at his age does not usually end in jail. Here, little one. Take four annas and buy sweets, because there is a little head underneath that great roof of hair. Perhaps one day you may become a hunter too. But remember, Keddahs are no playground for children."
        - id: ch03-b15
          speaker: narrator
          text: "Big Toomai's scowl deepened. Little Toomai drew a great breath."
        - id: ch03-b16
          speaker: little_toomai
          text: "Must I never go inside one, Sahib?"
        - id: ch03-b17
          speaker: petersen_sahib
          text: "You may go when you have seen the elephants dance. That will be the proper time. Come to me after you see their dance, and I will let you enter every Keddah."
        - id: ch03-b18
          speaker: narrator
          text: "Again the men burst out laughing. Among elephant catchers, that was an old joke meaning never. Deep in the forest were broad, cleared places called elephant ballrooms. Men found them only by accident, and no one had ever watched the elephants dance there. Whenever a driver bragged about his courage or skill, the others asked when he had seen the elephants dance."
        - id: ch03-b19
          speaker: narrator
          text: "Kala Nag lowered Little Toomai. The boy bowed once more and left with his father. He gave the silver coin to his mother, who was nursing his baby brother. Then the family climbed onto Kala Nag, and the long line of grunting, squealing elephants wound down the hill toward the plains. The new captives made the march lively. At every ford they caused trouble and had to be coaxed or beaten almost every minute."
        - id: ch03-b20
          speaker: narrator
          text: "Big Toomai was so angry that he jabbed Kala Nag spitefully. Little Toomai was too happy to speak. Petersen Sahib had noticed him and given him money. He felt like a common soldier praised before the ranks by the commander of the whole army. At last he spoke softly to his mother."
        - id: ch03-b21
          speaker: little_toomai
          text: "What did Petersen Sahib mean about the elephant dance?"
        - id: ch03-b22
          speaker: big_toomai
          text: "He meant that you must never become one of those hill-buffalo trackers. Hey, you ahead! What is stopping the line?"
        - id: ch03-b23
          speaker: narrator
          text: "Two or three elephants in front, an Assamese driver turned angrily."
        - id: ch03-b24
          speaker: assamese_driver
          text: "Bring Kala Nag forward and knock some manners into this youngster of mine. Why did Petersen Sahib choose me to march with you rice-field donkeys? Put your beast alongside, Toomai, and let him prod mine with his tusks. By every God of the Hills, these new elephants are bewitched, unless they can smell their wild companions in the forest."
        - id: ch03-b25
          speaker: narrator
          text: "Kala Nag struck the young elephant in the ribs and knocked the breath from him."
        - id: ch03-b26
          speaker: big_toomai
          text: "We cleared the hills of wild elephants in the last catch. Your careless driving is the only trouble. Must I keep order along this whole line?"
        - id: ch03-b27
          speaker: assamese_driver
          text: "Listen to him! We cleared the hills! Ho, ho! You plainsmen are wonderfully wise. Anyone but a mud-head who has never seen a jungle knows the wild herds can tell the drives are finished for the season. That is why tonight they will... But why waste wisdom on a river turtle?"
        - id: ch03-b28
          speaker: little_toomai
          text: "What will they do?"
        - id: ch03-b29
          speaker: assamese_driver
          text: "Ohe, little one! Are you there? I will tell you, because your head stays cool. The elephants will dance. Your father claims he has emptied every hill, so he had better double-chain his pickets tonight."
        - id: ch03-b30
          speaker: big_toomai
          text: "What nonsense is that? Father and son, our family has cared for elephants for forty years. We have never heard moonshine about dancing."
        - id: ch03-b31
          speaker: assamese_driver
          text: "A plainsman who lives in a hut knows only its four walls. Leave your elephants loose tonight and see what follows. As for the dance, I have seen the place where... Bapree-bap! How many bends can the Dihang River have? Another ford! We will have to swim the calves. You behind us, stand still!"
        - id: ch03-b32
          speaker: narrator
          text: "The march went on in just that fashion. The drivers talked and quarreled, the elephants crowded the path, and the whole line splashed through one river after another. Calves had to be guided across the water, and unruly new captives had to be brought back into line. By the time they reached the receiving camp where the wild elephants would be held, every driver had lost his temper."
    - id: ch04
      title: Out into the Moonlight
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "The men chained each elephant by a hind leg to a heavy picket stump and added ropes around the new captives. They piled fodder in front of them. Then the hill drivers headed back to Petersen Sahib through the afternoon light. They warned the plains drivers to be especially careful that night, but only laughed when asked why."
        - id: ch04-b02
          speaker: narrator
          text: "Little Toomai served Kala Nag his supper. As evening fell, the boy wandered through camp in a happiness too large for words, searching for a tom-tom. When an Indian child's heart is full, he does not always race about making a wild noise. He may sit alone and hold a little celebration of his own. Petersen Sahib had spoken to Little Toomai. If the boy had not found what he wanted, the joy might almost have made him ill."
        - id: ch04-b03
          speaker: narrator
          text: "The camp's sweet seller lent him a small hand drum, the kind played with the flat of the palm. Little Toomai sat cross-legged before Kala Nag as the first stars appeared. With the tom-tom resting in his lap, he thumped and thumped and thumped. Each time he remembered that the great Petersen Sahib had noticed him, spoken to him, and given him a silver coin, he struck the drum again. His drumming had neither tune nor words. He sat alone among the piles of elephant fodder, and the simple beat made his happiness complete."
        - id: ch04-b04
          speaker: narrator
          text: "Now and then, the new elephants pulled at their ropes, squealed, and trumpeted. From the camp hut came his mother's voice as she put the baby to sleep. She sang an ancient song about the great god Shiv, who once gave every animal its food. Little Toomai answered each verse with a joyful tunk-a-tunk."
        - id: ch04-b05
          speaker: mother
          text: "Shiv poured out the harvest and taught the winds to blow. Long ago he sat beside the doorway and gave each creature food, work, and fate, from the king upon his throne to the beggar at the gate. Shiva the Preserver made everything. Mahadeo, Mahadeo, he made it all. He gave thorns to the camel and fodder to the cattle, and he gave a mother's heart to the sleepy head of her little son."
        - id: ch04-b06
          speaker: narrator
          text: "Soon Little Toomai grew sleepy and stretched out on the fodder beside Kala Nag. One after another, the elephants lay down as elephants do. Only Kala Nag, at the end of the line, remained standing. He rocked slowly from side to side with his ears held forward, listening to the night wind moving gently across the hills."
        - id: ch04-b07
          speaker: narrator
          text: "All the separate night noises joined into one enormous silence. Bamboo stems clicked together. Something living rustled in the bushes. A half-awakened bird scratched and squawked, for birds wake at night more often than people suppose. Far away, water fell. Little Toomai slept. When he woke, brilliant moonlight filled the camp, and Kala Nag still stood with his ears raised."
        - id: ch04-b08
          speaker: narrator
          text: "The boy shifted in the fodder and watched the curve of Kala Nag's back blot out half the stars. Then, from so far away that it seemed like a tiny hole pierced through the silence, came the hoot-toot of a wild elephant. Every elephant in the lines sprang upright as if struck by a shot. Their grunting woke the mahouts. The men hurried out, hammered the picket pegs deeper, tightened one rope, and knotted another until the animals settled."
        - id: ch04-b09
          speaker: narrator
          text: "One new elephant had nearly torn its stake from the earth. Big Toomai removed Kala Nag's leg chain and used it to shackle the troublesome animal's front foot to its hind foot. Around Kala Nag's leg he slipped only a loop of grass cord, then ordered him to remember that he was securely tied. Big Toomai knew his father and grandfather had played the same trick hundreds of times. Usually Kala Nag answered an order with a gurgle, but this time he made no reply. He stared across the moonlight toward the great folds of the Garo hills, his head lifted and his ears spread like fans."
        - id: ch04-b10
          speaker: big_toomai
          text: "Watch him if he becomes restless tonight."
        - id: ch04-b11
          speaker: narrator
          text: "Big Toomai went into the hut and slept. Little Toomai was nearly asleep when the fiber cord snapped with a soft tang. Kala Nag glided from his place as slowly and silently as a cloud leaving the mouth of a valley. Barefoot, Little Toomai pattered after him along the moonlit road and kept his voice low."
        - id: ch04-b12
          speaker: little_toomai
          text: "Kala Nag! Kala Nag! Take me with you, O Kala Nag!"
        - id: ch04-b13
          speaker: narrator
          text: "Without a sound, the elephant turned and came back three strides. He lowered his trunk, swung the boy onto his neck, and slipped into the forest before Little Toomai had properly settled his knees. A single furious trumpet blast rose from the lines. Then silence closed over everything, and Kala Nag moved on."
        - id: ch04-b14
          speaker: narrator
          text: "Sometimes tall grass flowed along his sides like water along a ship. Sometimes wild pepper vines scraped his back, or a bamboo creaked against his shoulder. Between those sounds, he traveled in absolute silence, drifting through the thick Garo forest as if the trees were smoke. He climbed steadily. Little Toomai watched stars through gaps in the branches, but he could not tell which way they were going."
        - id: ch04-b15
          speaker: narrator
          text: "At the ridge, Kala Nag paused. For miles below, the treetops looked spotted and furry in the moonlight. Blue-white mist covered the river hollow. Little Toomai leaned forward. The forest beneath him felt awake, alive, and crowded. A large brown fruit bat brushed his ear. Porcupine quills rattled in a thicket. Between the tree trunks, a hog-bear dug in the warm wet ground and snuffled over its work."
        - id: ch04-b16
          speaker: narrator
          text: "Branches closed above them again. Kala Nag plunged down into the valley, no longer quietly but in one headlong rush, like a runaway gun rolling down a steep bank. His huge legs worked as evenly as pistons, covering eight feet at every stride, and the wrinkled skin at his elbows rustled. Undergrowth tore apart on both sides with the sound of ripping canvas. He shouldered young trees to the right and left. They bent away, sprang upright behind him, and struck his flanks. Long, tangled ropes of creeper caught across his tusks as he swung his head from side to side and plowed his own road. Little Toomai pressed his whole body flat against the great neck so a swinging branch would not sweep him to the ground. For the first time that night, he wished he were safely back in the lines."
        - id: ch04-b17
          speaker: narrator
          text: "The ground softened. Kala Nag's feet sucked and squelched, and cold valley mist wrapped around the boy. Water splashed and rushed as the elephant stepped into a river, testing every foothold. Above the swirl around Kala Nag's legs, Little Toomai heard more splashing both upstream and down. Trumpets, deep grunts, and angry snorts came through the mist, which seemed full of rolling shadows. His teeth chattered as he spoke half aloud."
        - id: ch04-b18
          speaker: little_toomai
          text: "Ai! The elephant folk are abroad tonight. It truly is the dance!"
        - id: ch04-b19
          speaker: narrator
          text: "Kala Nag climbed out, blew the water from his trunk, and started up the next slope. This time he was not alone, and a six-foot path lay ready before him. Bent grass was still struggling to stand. Many elephants had passed only minutes earlier. Behind them, a great wild tusker rose from the misty river, his tiny eyes glowing like hot coals. The trees closed around them once more. They climbed amid trumpet calls, crashes, and branches breaking on every side."
    - id: ch05
      title: The Dance Place
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "At last Kala Nag stopped between two trees on the hilltop. Those trunks belonged to a ring of trees around an uneven clearing three or four acres wide. Everywhere Little Toomai looked, the earth had been pressed as hard as a brick floor. A few trees stood in the center. Their bark had been rubbed away, leaving smooth white wood shining wherever the moon touched it. Flowering vines hung from the high branches, and their large waxy white bells slept in the night. Inside the whole circle, not one green blade remained. There was only trampled ground."
        - id: ch05-b02
          speaker: narrator
          text: "Moonlight turned the clearing iron gray, except where a few elephants stood and cast shadows as black as ink. Little Toomai held his breath. His eyes opened so wide they seemed ready to leap from his head. More elephants swung into the open between the trees, then more, and still more. The boy could count only to ten. He counted one set of ten after another on his fingers until he lost the number of tens and his head began to swim. Beyond the ring of trees, he heard great bodies crashing through the undergrowth as they fought their way uphill. Yet the instant each elephant crossed into the clearing, it became silent and moved like a ghost."
        - id: ch05-b03
          speaker: narrator
          text: "Wild bulls came in with white tusks and leaves, nuts, and twigs caught in the folds of their ears and necks. Heavy, slow-footed mothers arrived with restless pink-black calves, no more than three or four feet high, darting beneath their bellies. Young elephants carried the first points of new tusks proudly. Thin, bony old females had worried hollow faces and trunks rough as bark."
        - id: ch05-b04
          speaker: narrator
          text: "Savage old bulls bore long scars from fights across their shoulders and flanks. Dried mud from lonely wallows crumbled off their bodies. One elephant had a broken tusk and the deep dragging marks of a tiger's claws along his side. Scores upon scores of elephants stood head to head, crossed the ground in pairs, or rocked and swayed alone."
        - id: ch05-b05
          speaker: narrator
          text: "Little Toomai knew he would be safe while he stayed flat on Kala Nag's neck. Even in the panic of a Keddah drive, a wild elephant did not reach up and pull a man from a tame elephant. Besides, that night these animals were not thinking about men. Once, they started and pushed their ears forward when an iron chain clinked in the forest. It was Pudmini, Petersen Sahib's own elephant. Her chain had snapped short, and she came grunting and snuffling up the slope. She must have escaped directly from his camp."
        - id: ch05-b06
          speaker: narrator
          text: "Little Toomai noticed another unfamiliar elephant with deep rope wounds across his back and chest. He too had broken loose from some camp among the hills. At last no more animals could be heard approaching. Kala Nag left his place between the trees and rolled into the center of the crowd. He clucked and gurgled. All around him, elephants answered in their own language and began to move."
        - id: ch05-b07
          speaker: narrator
          text: "Still lying low, Little Toomai looked across scores of broad backs, flapping ears, tossing trunks, and small rolling eyes. Tusks clicked when they crossed by accident. Twined trunks made a dry rustle. Huge sides and shoulders rubbed together, while great tails flicked and hissed without stopping. A cloud covered the moon, and the boy sat in complete darkness. Yet the steady pushing, crowding, and gurgling continued."
        - id: ch05-b08
          speaker: narrator
          text: "Elephants surrounded Kala Nag so closely that there was no hope of backing him out. Little Toomai clenched his teeth and shivered. Inside a Keddah there were at least torches and shouting. Here, he was alone in the dark. Once, an unseen trunk rose and touched his knee."
        - id: ch05-b09
          speaker: narrator
          text: "Suddenly one elephant trumpeted. For five or ten terrible seconds, every elephant in the clearing joined that cry. Then they fell silent again. Dew shook loose from the branches overhead and splashed like rain across the backs that Little Toomai could not see. Beneath that patter, a low dull booming began. It was soft at first, and the boy could not tell what made it. The sound grew and grew. Kala Nag lifted one front foot, brought it down, then raised the other. He struck the earth in a steady one-two, one-two, like the hammers of a great machine. Every elephant was stamping now. Together, their feet sounded like a war drum beaten at the dark mouth of a cave."
        - id: ch05-b10
          speaker: narrator
          text: "The dew kept falling until the branches had no more to give. Still the booming continued. The earth rocked and trembled. Little Toomai covered his ears, but he could not shut out the enormous shaking that traveled through his entire body. Hundreds of heavy feet hammered the bare ground. Once or twice the whole herd surged several steps forward. For a while, the drumbeat became the wet crushing sound of green plants ground beneath them. A minute later, the feet were booming on hard earth again."
        - id: ch05-b11
          speaker: narrator
          text: "Nearby, a tree creaked and groaned. Little Toomai reached out and touched its bark, but Kala Nag tramped forward and carried him away. The boy could no longer tell where they stood in the clearing. The elephants made no other sound, except once when two or three calves squeaked together. Then came a thump and a shuffle, and the great booming rolled on. It lasted fully two hours. Every nerve in Little Toomai ached, but a change in the smell of the air told him dawn was near."
        - id: ch05-b12
          speaker: narrator
          text: "Morning opened as a sheet of pale yellow behind the green hills. At the first ray, the stamping stopped as sharply as if daylight had given an order. Before Little Toomai could clear the ringing from his head or even shift his cramped body, every elephant had vanished except Kala Nag, Pudmini, and the stranger with rope wounds. No rustle, whisper, or broken twig on the slopes showed where the others had gone."
        - id: ch05-b13
          speaker: narrator
          text: "Little Toomai stared, then stared again. The clearing was larger than he remembered. More trees now seemed to stand inside it because the brush and jungle grass around its edges had been pushed back. At last he understood the dance. The elephants had made more room. They had stamped thick grass and juicy cane into trash, trash into splinters, splinters into tiny fibers, and fibers into hard-packed earth."
        - id: ch05-b14
          speaker: little_toomai
          text: "Wah! Kala Nag, my lord, let us stay with Pudmini and go to Petersen Sahib's camp. If we do not, I will fall from your neck."
        - id: ch05-b15
          speaker: narrator
          text: "The wounded stranger watched Kala Nag and Pudmini leave. Then he snorted, turned, and chose another trail. Perhaps he belonged to some small native king fifty, sixty, or even a hundred miles away."
    - id: ch06
      title: A Child's True Tale
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: "Two hours later, Petersen Sahib sat at his early breakfast. Though his own elephants had been double-chained for the night, they suddenly began to trumpet. Pudmini came staggering into camp, sunk in mud to her shoulders. Footsore Kala Nag followed. On his neck, Little Toomai looked gray and pinched. Leaves filled his hair, and dew had soaked him through. Still he tried to salute Petersen Sahib."
        - id: ch06-b02
          speaker: little_toomai
          text: "The dance! The elephant dance! I have seen it, and now... I die!"
        - id: ch06-b03
          speaker: narrator
          text: "Kala Nag sat down, and the boy slid from his neck in a dead faint. But children like Little Toomai recover quickly. Two hours later he lay contentedly in Petersen Sahib's hammock. The Sahib's shooting coat made a pillow under his head. He had swallowed warm milk mixed with a little brandy and a touch of quinine. Three deep rows of old, hairy, scarred jungle hunters sat before him and watched as if he were a spirit. In the short plain words of a child, he told them everything."
        - id: ch06-b04
          speaker: little_toomai
          text: "If even one word is a lie, send men to look. They will find the elephant folk made their dance place larger. They will find ten tracks, then ten more, and many tens after that, all leading to the clearing. The elephants made more room with their feet. I saw them do it. Kala Nag carried me there, and I saw it. Also, Kala Nag's legs are very tired!"
        - id: ch06-b05
          speaker: narrator
          text: "Little Toomai leaned back and slept through the long afternoon and on into twilight. While he slept, Petersen Sahib and Machua Appa followed the tracks left by Kala Nag and Pudmini. The trail carried them fifteen miles across the hills before it reached the hidden clearing. Petersen Sahib had spent eighteen years catching elephants, yet in all that time he had found such a dance place only once before. Machua Appa had no need to search twice. One look around the enlarged clearing and one scrape of his toe across the packed, hammered earth told him exactly what had happened."
        - id: ch06-b06
          speaker: machua_appa
          text: "The child has spoken the truth. This was all done last night. I counted seventy tracks where they crossed the river. Look, Sahib. Pudmini's leg iron cut the bark of this tree. Yes, she came here too."
        - id: ch06-b07
          speaker: narrator
          text: "The two men looked at one another. They looked up and down the clearing, and wonder held them silent. No man, black or white, has enough understanding to explain all the ways of elephants."
        - id: ch06-b08
          speaker: machua_appa
          text: "For forty-five years I have followed my lord the elephant. Never have I heard of any human child seeing what this child has seen. By all the Gods of the Hills, it is... What can anyone say?"
        - id: ch06-b09
          speaker: narrator
          text: "Machua Appa shook his head. By the time the men returned to camp, the evening meal was due. Petersen Sahib ate alone inside his tent. He knew a feast would follow, so he ordered two sheep and several chickens for the camp, with twice the usual flour, rice, and salt."
        - id: ch06-b10
          speaker: narrator
          text: "Big Toomai had hurried up from the plains camp to search for his missing son and elephant. Now that both were safely found, he did not boast or scold. He looked at Kala Nag and the boy as though he were almost afraid of them both. Campfires blazed before the long lines of tethered elephants. The extra meat, flour, rice, and salt Petersen Sahib had ordered became a great evening feast, and Little Toomai stood at the center of it all. Every hunter now knew that the child had gone where none of them had gone and returned with a true account of the elephants' secret night."
        - id: ch06-b11
          speaker: narrator
          text: "The great brown elephant catchers passed him from hand to hand while the feast went on around the blazing fires. Trackers, drivers, and ropers all claimed him for a moment. So did the men who knew every secret used to tame the wildest elephants. These were the jungle people his father had spoken of with such contempt, but now they welcomed the boy as one of their own. They marked his forehead with blood from the breast of a newly killed jungle fowl. That sign named him a true forester, initiated into their company and free to travel through all the jungles. Little Toomai, who had expected a scolding for following Kala Nag, had become the hero of Petersen Sahib's whole camp."
    - id: ch07
      title: Toomai of the Elephants
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: "At last the flames sank. Red light from the logs washed over the elephants until they too seemed dipped in blood. Then Machua Appa sprang to his feet. He was master of all the drivers in all the Keddahs, and Petersen Sahib's other self. In forty years, he had never seen a road made by men. He was so great that everyone knew him simply as Machua Appa. He lifted Little Toomai high above his head."
        - id: ch07-b02
          speaker: machua_appa
          text: "Listen, my brothers! And listen, my lords standing in the lines, because I, Machua Appa, am speaking. From this night, this child will no longer be called Little Toomai. He shall be Toomai of the Elephants, the name his great-grandfather carried before him. He watched through the long night what no man has ever watched. The elephant folk favor him, and so do the Gods of the Jungles."
        - id: ch07-b03
          speaker: machua_appa
          text: "He will become a great tracker. He will become greater even than I, Machua Appa! His eyes will read a fresh trail, an old trail, and a trail where many tracks cross. No harm will touch him in the Keddah when he runs beneath the elephants to rope wild tuskers. If he falls before a charging bull, that bull will know him and will not crush him."
        - id: ch07-b04
          speaker: narrator
          text: "Machua Appa turned toward the long row of elephants, still holding the boy high."
        - id: ch07-b05
          speaker: machua_appa
          text: "Aihai, my lords in chains! Here is the child who has seen your dances in your secret places. He has seen the sight no man ever saw. Give him honor, my lords! Salute Toomai of the Elephants, my children! Gunga Pershad, ahaa! Hira Guj, Birchi Guj, Kuttar Guj, ahaa! Pudmini, you saw him at the dance. And you, Kala Nag, my pearl among elephants, ahaa! All together now! Honor Toomai of the Elephants! Barrao!"
        - id: ch07-b06
          speaker: narrator
          text: "At that last wild cry, every elephant in the line raised its trunk until the tip touched its forehead. Together they gave the full salute, the great crashing trumpet call that only the Viceroy of India was supposed to hear, the Salaamut of the Keddah."
        - id: ch07-b07
          speaker: narrator
          text: "But that night the salute belonged to Little Toomai. He had seen what no man had ever seen before: the elephants dancing at night, alone in the heart of the Garo hills."
