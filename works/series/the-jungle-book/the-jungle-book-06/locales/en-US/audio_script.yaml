audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, vivid, and unhurried
        timbre: rich and clear
        pace: measured
        pitch: medium
    mowgli:
      display_name: Mowgli
      tts:
        delivery: direct, lively, and fearless
        timbre: youthful and clear
        pace: quick
        pitch: medium-high
  chapters:
    - id: ch01
      title: Let the Jungle Listen
      blocks:
        - id: ch01-b01
          speaker: mowgli
          text: "This is Mowgli's song. I am Mowgli, and I am singing it. Let the whole jungle listen to what I have done."
        - id: ch01-b02
          speaker: mowgli
          text: "Shere Khan swore he would kill me. Kill me! At the village gates, in the twilight, he said he would kill Mowgli the Frog."
        - id: ch01-b03
          speaker: mowgli
          text: "He ate, and he drank. Drink deep, Shere Khan. When will you ever drink again? Sleep now, and dream of your kill."
        - id: ch01-b04
          speaker: mowgli
          text: "I stand alone on the grazing grounds. Gray Brother, come to me! Come, Lone Wolf! There is big game before us."
        - id: ch01-b05
          speaker: mowgli
          text: "Bring the great bull buffaloes. Bring the blue-skinned herd bulls with anger in their eyes. Drive them this way, then that way, exactly as I tell you."
        - id: ch01-b06
          speaker: mowgli
          text: "Are you still asleep, Shere Khan? Wake up! Wake up! I am coming, and the bulls are close behind me."
        - id: ch01-b07
          speaker: mowgli
          text: "Rama, King of the Buffaloes, stamped the earth. Waters of the Waingunga, where did Shere Khan go?"
        - id: ch01-b08
          speaker: mowgli
          text: "He cannot dig himself a hole like Ikki. He cannot fly away like Mao the Peacock. He cannot hang from a branch like Mang the Bat. Little bamboos, creaking together, tell me where he ran."
        - id: ch01-b09
          speaker: mowgli
          text: "Ow! There he is! Ahoo! There he is! The Lame One lies under Rama's feet. Get up, Shere Khan!"
        - id: ch01-b10
          speaker: mowgli
          text: "Get up and kill! Here is meat for you. Come, break the bulls' necks!"
        - id: ch01-b11
          speaker: mowgli
          text: "Hush. He is asleep. We must not wake him. His strength is very great. The kites have flown down to see him, and the black ants have climbed up to learn what happened. What a great gathering they have made in his honor."
    - id: ch02
      title: Shere Khan's Coat
      blocks:
        - id: ch02-b01
          speaker: mowgli
          text: "Alala! I have no cloth to cover me. The kites will see me naked. How can I face all these people?"
        - id: ch02-b02
          speaker: mowgli
          text: "Lend me your coat, Shere Khan. Lend me that bright striped coat, so I can go to the Council Rock."
        - id: ch02-b03
          speaker: mowgli
          text: "By the Bull that bought my life, I made a promise. It was only a little promise. All I need is your coat, and then I can keep my word."
        - id: ch02-b04
          speaker: mowgli
          text: "I will bend down and take my gift with a knife. It is the knife men use, the hunter's knife."
        - id: ch02-b05
          speaker: mowgli
          text: "Waters of the Waingunga, Shere Khan gives me his coat because he loves me so well. Pull, Gray Brother! Pull, Akela! Shere Khan's hide is heavy."
    - id: ch03
      title: Between Village and Jungle
      blocks:
        - id: ch03-b01
          speaker: mowgli
          text: "The Man Pack is angry. They throw stones at me and babble like children. My mouth is bleeding. Let me run away."
        - id: ch03-b02
          speaker: mowgli
          text: "Run quickly beside me, my brothers. Run through the night, through the hot night. We will leave the village lights behind and race toward the low moon."
        - id: ch03-b03
          speaker: mowgli
          text: "Waters of the Waingunga, the Man Pack has driven me out. I never harmed them, but they were afraid of me. Why?"
        - id: ch03-b04
          speaker: mowgli
          text: "Wolf Pack, you drove me out too. The jungle is closed to me, and so are the village gates. Why?"
        - id: ch03-b05
          speaker: mowgli
          text: "Mang the Bat flies between the beasts and the birds. Just so, I fly between the village and the jungle. Why?"
    - id: ch04
      title: Two Mowglis
      blocks:
        - id: ch04-b01
          speaker: mowgli
          text: "I dance on Shere Khan's hide, but my heart feels very heavy. The village stones have cut and wounded my mouth. Still, my heart feels very light because I have come back to the jungle. Why?"
        - id: ch04-b02
          speaker: mowgli
          text: "Those two feelings fight inside me like snakes fighting in spring. Water runs from my eyes, yet I laugh while it falls. Why?"
        - id: ch04-b03
          speaker: mowgli
          text: "I am two Mowglis, and the hide of Shere Khan lies under my feet."
        - id: ch04-b04
          speaker: mowgli
          text: "The whole jungle knows I killed Shere Khan. Look at me, Wolves. Look well!"
        - id: ch04-b05
          speaker: mowgli
          text: "Ahae! My heart is heavy with all the things I cannot understand."
