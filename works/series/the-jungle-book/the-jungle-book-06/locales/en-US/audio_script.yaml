audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, vivid, and unhurried
        timbre: rich and clear
        pace: measured
        pitch: medium
    big_toomai:
      display_name: Big Toomai
      tts: {delivery: "proud, practical, and gruff", timbre: "deep and weathered", pace: measured, pitch: low}
    little_toomai:
      display_name: Little Toomai
      tts: {delivery: "bright, eager, and fearless", timbre: "youthful and clear", pace: quick, pitch: high}
    petersen_sahib:
      display_name: Petersen Sahib
      tts: {delivery: "commanding, observant, and dryly amused", timbre: "firm and resonant", pace: measured, pitch: medium-low}
    machua_appa:
      display_name: Machua Appa
      tts: {delivery: "seasoned, confident, and ceremonial", timbre: "rough and full", pace: unhurried, pitch: low}
    assamese_driver:
      display_name: Assamese Driver
      tts: {delivery: "sharp, spirited, and teasing", timbre: "wiry and clear", pace: brisk, pitch: medium}
