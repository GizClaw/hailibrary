audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉稳从容，带着古老丛林故事的气息
        timbre: 温暖清晰
        pace: 舒缓而富有变化
        pitch: 中等
    little_toomai:
      display_name: 小杜迈
      tts:
        delivery: 勇敢机灵，带着孩子的热烈与坦率
        timbre: 明亮稚嫩
        pace: 中等偏快
        pitch: 高
    big_toomai:
      display_name: 大杜迈
      tts:
        delivery: 自负老练，训斥时粗声粗气
        timbre: 厚实粗粝
        pace: 中等
        pitch: 中低
    petersen_sahib:
      display_name: 彼得森老爷
      tts:
        delivery: 威严敏锐，言语间藏着温和的幽默
        timbre: 沉着洪亮
        pace: 从容
        pitch: 中低
    machua_appa:
      display_name: 马丘阿·阿帕
      tts:
        delivery: 久经丛林，郑重时像宣告古老仪式
        timbre: 苍劲深沉
        pace: 舒缓有力
        pitch: 低
    assamese_driver:
      display_name: 阿萨姆象夫
      tts:
        delivery: 泼辣健谈，嘲弄中透着山林人的自信
        timbre: 粗犷响亮
        pace: 偏快
        pitch: 中等
    little_toomai_mother:
      display_name: 小杜迈的母亲
      tts:
        delivery: 温柔安稳，歌唱时古朴悠长
        timbre: 柔和圆润
        pace: 舒缓
        pitch: 中高
  chapters:
    - id: ch01
      title: 年老的黑蛇
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            有一支属于大象的歌。歌里的象说，他受够了绳索和锁链，总有一天要记起从前的力量，回到森林里的同族身边。他不要再为一捆甘蔗把脊背卖给人。他要挣断拴桩，迎着干净的风和水，一直走到天亮，去寻找失散的爱侣，还有那些从来没有主人的伙伴。
        - id: ch01-b02
          speaker: narrator
          text: >-
            卡拉·纳格的名字，就是“黑蛇”。他为印度政府服役了四十七年。被捕时他已经二十岁，所以这时差不多七十岁了。他还记得年轻时额头垫着厚皮垫，去推一门陷在深泥里的大炮。那是一八四二年阿富汗战争以前的事，当时他还没长出全部力气。
        - id: ch01-b03
          speaker: narrator
          text: >-
            他的母亲拉达·皮亚里，也就是“亲爱的拉达”，和他在同一次围捕中落入人手。卡拉·纳格的乳牙还没掉，母亲便教他，象若害怕，准会受伤。他第一次看见炮弹爆炸时，尖叫着倒退进一排步枪，刺刀把身上最软的地方扎了个遍。从那以后，他慢慢不再害怕。不到二十五岁，他已经成了政府役象里最受疼爱、照顾得最好的一头。
        - id: ch01-b04
          speaker: narrator
          text: >-
            他在印度北部随军行进时，驮过足足一千二百磅重的帐篷。后来，蒸汽起重机从船边垂下来，把他整个吊进轮船。他在海上漂了许多天，又到远离印度的一片陌生多石之地，背着一门臼炮做工。他亲眼见过特沃德罗斯皇帝死在马格达拉。回国时，士兵还说，凭这些经历，卡拉·纳格也有资格领一枚阿比西尼亚战争勋章。十年后，他在一个叫阿里清真寺的地方，看着同伴被严寒、癫痫、饥饿和中暑夺去性命。后来他又被送到南方几千英里外的毛淡棉木场，拖运粗大的柚木，再把木料一根根堆好。在那里，一头年轻象抗命偷懒，不肯分担该做的工作，卡拉·纳格险些把他打死。
        - id: ch01-b05
          speaker: narrator
          text: >-
            再后来，卡拉·纳格不用拖木料了。他和几十头受过专门训练的象一起，到加罗山捕捉野象。印度政府对大象管得很严，专门有一个部门负责追猎、围捕、驯服，再按工作的需要把它们送往各地。卡拉·纳格肩高整整十英尺，象牙在五英尺处截短，尖端箍着铜圈，免得裂开。可那两截断牙在他手里，比未经训练的象的一对锋利长牙还管用。
        - id: ch01-b06
          speaker: narrator
          text: >-
            人们常要花上几个星期，小心地翻山越岭，把四处分散的野象慢慢赶到一处。最后，四五十头庞然大物会被逼进最末一道围栏，树干捆成的沉重大门就在身后轰然落下。围捕多半选在夜里。火把忽明忽暗，叫人看不准远近。围象场里全是象鸣和混乱。只要有人下令，卡拉·纳格就会冲进去，找准象群中最大最野的公象，一阵猛撞狠挤，逼得它安静下来。其他象背上的人便趁机用绳索捆住较小的象。
        - id: ch01-b07
          speaker: narrator
          text: >-
            老黑蛇懂得所有搏斗的办法。他不止一次面对受伤老虎的扑击。老虎腾空时，他会先把柔软的鼻子卷好，不让利爪碰到，再用自己想出的一招，脑袋像镰刀一样飞快横扫，把半空中的猛兽撞向一旁。随后他把老虎掀翻，用两只巨膝死死压住。等一声喘息和一声哀号都停了，地上只剩一团带条纹的毛皮，任他拖着尾巴走。
        - id: ch01-b08
          speaker: big_toomai
          text: >-
            黑蛇什么都不怕，只怕我。我们家已经有三代人喂他、替他梳洗，他还会活着见到第四代。
        - id: ch01-b09
          speaker: narrator
          text: >-
            说话的是他的象夫大杜迈。大杜迈的父亲叫黑杜迈，当年曾带卡拉·纳格远征阿比西尼亚。大杜迈的祖父便是老一辈的“大象的杜迈”，卡拉·纳格被捕时，那位老人亲眼看着。这样算来，这头老象的确已经陪伴了杜迈家三代人。
        - id: ch01-b10
          speaker: little_toomai
          text: >-
            他也怕我。
        - id: ch01-b11
          speaker: narrator
          text: >-
            小杜迈十岁，只有四英尺高，身上只围一块布。他是大杜迈的长子。照家里的老规矩，等他长大，就会接替父亲，坐上卡拉·纳格的颈背，使用那柄沉重的铁象钩。象钩经过父亲、祖父和曾祖父的手，早已磨得光滑。他从小生在卡拉·纳格的影子里。不会走路时，他便玩象鼻尖。刚会走路，便领大象去饮水。卡拉·纳格从没想过违抗他尖细的命令。小杜迈还是棕色皮肤的小婴儿时，大杜迈曾抱他走过象牙底下，叫大象向未来的主人行礼。那时候，卡拉·纳格也绝不会伤害他。
        - id: ch01-b12
          speaker: little_toomai
          text: >-
            没错，他怕我。来吧，你这头肥老猪，把脚一只一只抬起来！哇，你可真大。政府花钱买象，可象归我们象夫。等你老了，会有富有的王公因为你的个头和好脾气，把你买走。你会戴金耳环，背金轿，披着绣金红毯，走在国王的队伍最前头。我拿银象钩坐在你颈上，人们举着金杖跑在前面，喊着给国王的大象让路。那一定很好，可还是不如在丛林里捕象痛快。
        - id: ch01-b13
          speaker: big_toomai
          text: >-
            哼，你还是个孩子，野得像小水牛。山里东奔西跑，不算政府最好的差事。我老了，也受够了野象。给我砖砌的象棚，让每头象各有栏舍，牢牢拴在大木桩上，再给我平坦宽阔的路，平日就在那上面活动。这样的生活才好。我可不想今天来、明天走，四处扎营。坎普尔的营房多舒服，旁边就是集市，每天只干三个钟头。
        - id: ch01-b14
          speaker: narrator
          text: >-
            小杜迈想起坎普尔，便不作声了。他心里喜欢营地的日子，讨厌那些平坦的大路，也讨厌每天到饲料地刨草。最难熬的是那些无事可做的长时间，只能望着卡拉·纳格在拴桩旁烦躁地动来动去。
    - id: ch02
      title: 围象场的小男孩
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            小杜迈爱的是只有大象能走的险峻小路，爱的是忽然冲下山谷，远望几英里外觅食的野象。他喜欢看受惊的野猪和孔雀从卡拉·纳格脚边飞窜，喜欢温热大雨遮住眼睛，让群山万壑都冒出水汽。他也喜欢雾中的美丽清晨，因为没人知道晚上会在哪里宿营。他喜欢不慌不忙地驱赶野象，更喜欢最后一夜的围捕。野象像山崩的巨石涌进围栏，发现逃不出去，便不顾一切向沉重木桩猛撞。震天的叫喊、熊熊火把和一阵阵空枪又把它们逼回去。
        - id: ch02-b02
          speaker: narrator
          text: >-
            小孩子在那里也有用，小杜迈一个能顶三个。他会抓起火把，使劲挥舞，跟最会喊的大人一样呐喊。等人们开始把象一头头赶出来，才真正到了最痛快的时刻。围象场简直像世界末日，谁也听不清自己说话，只能互相打手势。小杜迈却会爬到一根颤动的围桩顶上。一头晒得发浅的棕发披在肩上，他在火光里活像小妖怪。
        - id: ch02-b03
          speaker: little_toomai
          text: >-
            迈尔！迈尔！卡拉·纳格，上啊！丹特多，用牙顶他！索马洛，小心！马罗，打他！当心木桩！阿雷！嗨！咿！咔——啊！
        - id: ch02-b04
          speaker: narrator
          text: >-
            只要场中稍微安静一瞬，象的号叫、冲撞，绳索崩断和被拴大象的呻吟之上，立刻会冒出他的尖嗓门。卡拉·纳格和野象在整个围象场里来回搏斗，打得局势一会儿倒向这边，一会儿又倒向那边。老捕象人一边擦去流进眼睛的汗，一边还会朝桩顶上乐得扭来扭去的小杜迈点头。
        - id: ch02-b05
          speaker: narrator
          text: >-
            有一夜，小杜迈不只是在桩上助威。他从高处滑下来，钻进挤作一团的象群。一名象夫正设法让绳子在一头乱踢的小象腿上吃住力气，偏偏另一端掉到了地上。小杜迈捡起绳头，向他抛去。小象往往比成年象更难摆弄。卡拉·纳格看见孩子，立刻用鼻子卷起他，送回大杜迈手里。父亲当场给了他一巴掌，又把他放回木桩。
        - id: ch02-b06
          speaker: big_toomai
          text: >-
            砖象棚和驮帐篷的安稳差事还不够吗？你这没用的小东西，竟敢自己跑去捕象！那些工钱还没我高的蠢猎手，已经把事情告诉彼得森老爷了。
        - id: ch02-b07
          speaker: narrator
          text: >-
            小杜迈一下害怕起来。他不太懂白人的事，却知道彼得森老爷统领所有围象行动，为印度政府捕捉大象。世上再没人比那位老爷更懂象。
        - id: ch02-b08
          speaker: little_toomai
          text: >-
            那……那会怎么样？
          emotion: fearful
        - id: ch02-b09
          speaker: big_toomai
          text: >-
            最坏的事都可能发生！彼得森老爷是个疯子，要不怎么会追这些野魔鬼？他兴许会逼你当捕象人，让你睡遍这片闹热病的丛林，最后在围象场里给踩死。好在这回没出事。下星期围捕结束，我们平原人就回驻地，走平整的大路，把这些全忘掉。
          emotion: angry
        - id: ch02-b10
          speaker: big_toomai
          text: >-
            我气的是，你偏要插手肮脏的阿萨姆丛林人才做的活。卡拉·纳格只听我的，我才不得不骑他进围栏。可他是战象，并不负责下绳套。我是象夫，是服役期满能领养老金的人，不是普通猎手。“大象的杜迈”一家，能在围象场的泥里让人踩吗？坏东西！没用的儿子！去给卡拉·纳格洗澡，查看他的耳朵和脚底。否则彼得森老爷会抓走你，把你变成追象脚印的丛林熊。真丢脸，快去！
          emotion: angry
        - id: ch02-b11
          speaker: narrator
          text: >-
            小杜迈一句也不回，默默走去检查卡拉·纳格的脚。他一面察看脚底，一面把满肚子委屈全说给大象听。说到最后，他又掀开卡拉·纳格那只巨大右耳边缘的皱褶，仔细检查里面。
        - id: ch02-b12
          speaker: little_toomai
          text: >-
            没关系。他们已经向彼得森老爷提起我了。也许……也许……也许……谁知道呢？嗨，我拔出的这根刺可真大！
        - id: ch02-b13
          speaker: narrator
          text: >-
            后面几天，众人忙着把象集中起来。他们让新捕的野象夹在两头驯象之间来回练习，免得下山去平原时闹得太凶。人们还清点毛毯、绳索和其他用品，一件件查明哪些已经用坏，哪些遗失在森林里。
        - id: ch02-b14
          speaker: narrator
          text: >-
            捕象季将尽，彼得森老爷骑着聪明的母象普德米妮来到营地。他刚走过山中其他营地，把各处的工钱结清。树下坐着一个印度书记，给这里的象夫逐一发钱。领到钱的人回到自己的象边，排进准备出发的队伍。常年留在丛林里的正式围象队员，有捕象人、猎手，也有驱赶手。他们或骑在彼得森队里的象背上，或把枪横在臂弯，靠着树木，拿要离开的平原象夫取乐。新捕的象冲出队伍乱跑，他们便笑得更响。
        - id: ch02-b15
          speaker: narrator
          text: >-
            大杜迈走去领钱，小杜迈跟在身后。首席追踪手马丘阿·阿帕看见他，低声对同伴说起话来。
        - id: ch02-b16
          speaker: machua_appa
          text: >-
            那里倒有一块捕象的好材料。可惜这只丛林小公鸡要送去平原换毛了。
        - id: ch02-b17
          speaker: narrator
          text: >-
            能听懂野象无声动静的人，浑身都得长着耳朵。彼得森老爷正舒展身子卧在普德米妮背上，马上听见了。
        - id: ch02-b18
          speaker: petersen_sahib
          text: >-
            你说什么？平原象夫里，难道还有人聪明得能套住一头死象？
        - id: ch02-b19
          speaker: machua_appa
          text: >-
            不是大人，是个孩子。上回我们要把肩上带斑的小象从母象身边带开，他闯进围象场，捡起绳子抛给了巴尔毛。
        - id: ch02-b20
          speaker: narrator
          text: >-
            马丘阿·阿帕指向小杜迈。彼得森老爷转头望过来，孩子赶紧俯身，一直拜到地面。
    - id: ch03
      title: 大象跳舞的玩笑
      blocks:
        - id: ch03-b01
          speaker: petersen_sahib
          text: >-
            是他抛的绳？他还没拴象桩高呢。小家伙，你叫什么？
        - id: ch03-b02
          speaker: narrator
          text: >-
            小杜迈怕得开不了口，只向身后的卡拉·纳格打个手势。大象用鼻子卷起他，托到普德米妮额头一样高，让他正对着彼得森老爷。除了大象的事情，这孩子和别的孩子一样害羞，只好用双手把脸遮住。
        - id: ch03-b03
          speaker: petersen_sahib
          text: >-
            哦嗬！你教大象这一招，是想叫他替你偷屋顶上晒着的青玉米吗？
        - id: ch03-b04
          speaker: little_toomai
          text: >-
            不是青玉米，穷人的庇护者。是甜瓜。
        - id: ch03-b05
          speaker: narrator
          text: >-
            坐在四周的人一下全笑出了声。他们大多在小时候也教过自家的象同一招，自然知道那鼻子曾替孩子们偷过什么。小杜迈却还吊在八英尺高的半空，四面八方的笑声全冲着他来，他恨不得自己能钻进地下八英尺。
        - id: ch03-b06
          speaker: big_toomai
          text: >-
            他叫杜迈，是我的儿子，老爷。他坏透了，往后准会进监牢。
        - id: ch03-b07
          speaker: petersen_sahib
          text: >-
            我看不会。这么小便敢面对满围栏的野象，不会进监牢。给你四安娜买糖吧。那蓬乱头发底下总算还有点聪明。将来你也许能当猎手。不过记住，围象场不是孩子玩耍的地方。
        - id: ch03-b08
          speaker: little_toomai
          text: >-
            我永远都不能再进去吗，老爷？
        - id: ch03-b09
          speaker: petersen_sahib
          text: >-
            能。等你见过大象跳舞，就来找我。到了那时，我准你进所有的围象场。
        - id: ch03-b10
          speaker: narrator
          text: >-
            众人又大笑起来。这是捕象人中传了许久的老笑话，真正的意思是永远不可能。森林深处确有一些隐蔽而开阔的平地，人们把它们叫作大象舞场，可那样的地方只能偶然发现，从来没人亲眼见过舞会本身。哪个象夫若吹嘘自己捕象的本领和胆量，旁人便会用同一个问题来挖苦他，问他究竟是哪一天看见大象跳舞的。
        - id: ch03-b11
          speaker: narrator
          text: >-
            卡拉·纳格放下小杜迈。孩子再次伏地行礼，随后跟父亲离开。他把得到的四安娜银币交给正在哺育弟弟的母亲，一家人都坐到卡拉·纳格背上，跟随一支又低鸣又尖叫的象队下山。新捕的象每到浅滩便惹麻烦，隔不了一会儿就要人哄劝或抽打，所以一路十分热闹。大杜迈还在生气，不住拿象钩刺卡拉·纳格。小杜迈却高兴得说不出话。彼得森老爷注意到他，还亲手赏了钱。他觉得自己像一个普通士兵，忽然让总司令叫出队伍，当众夸奖了一番。
        - id: ch03-b12
          speaker: little_toomai
          text: >-
            妈妈，彼得森老爷说的大象跳舞，是什么意思？
        - id: ch03-b13
          speaker: big_toomai
          text: >-
            就是叫你永远别变成那些追踪手一样的山野水牛。还能有什么意思？喂，前面是谁堵住路了？
        - id: ch03-b14
          speaker: assamese_driver
          text: >-
            把卡拉·纳格带上来，教训教训我这头小东西！彼得森老爷怎么偏叫我陪你们这些稻田里的蠢驴下山？杜迈，让你的象靠过来，用牙顶他一下。凭山中诸神起誓，这群新象要么中了邪，要么闻见了丛林同伴的气味。
          emotion: angry
        - id: ch03-b15
          speaker: narrator
          text: >-
            卡拉·纳格撞上新象的肋部，一下让他喘不过气。
        - id: ch03-b16
          speaker: big_toomai
          text: >-
            上一回围捕，我们已经扫光山里的野象。只是你不会赶罢了。难道整支队伍都要我来管？
        - id: ch03-b17
          speaker: assamese_driver
          text: >-
            听听这位聪明的平原人！只要不是从没见过丛林的泥脑袋，都知道野象明白本季围捕已经结束。所以今天夜里，它们全都会……算了，我为什么要把智慧浪费在河龟身上？
        - id: ch03-b18
          speaker: little_toomai
          text: >-
            它们都会做什么？
        - id: ch03-b19
          speaker: assamese_driver
          text: >-
            哦，小家伙也在。你头脑冷静，我就告诉你。它们都会去跳舞。你父亲既然已经扫光全山的野象，今晚最好给他的象拴两道锁链。
        - id: ch03-b20
          speaker: big_toomai
          text: >-
            什么梦话！我们父子相传，照顾大象四十年，从没听过它们跳舞。
        - id: ch03-b21
          speaker: assamese_driver
          text: >-
            平原人住在屋里，只认得自己的四面墙。今晚别给象上镣铐，看看会怎样。至于舞场，我曾经见过那个地方……老天，这条迪杭河到底有多少道弯？前面又要过河了，得让小象游过去。后面的都停住！
        - id: ch03-b22
          speaker: narrator
          text: >-
            队伍一路说着、争着，泼溅着渡过一道道河。还没走到专门收容新象的营地，大家便先失去了耐性。到了以后，所有大象的后腿都锁在粗大的拴桩上，新象身上还多加了绳子，面前则堆起饲料。山地象夫趁着下午的天光返回彼得森老爷那里。走前，他们再三嘱咐平原人今夜要格外小心。平原人追问为什么，他们只顾发笑。
        - id: ch03-b23
          speaker: narrator
          text: >-
            小杜迈照料过卡拉·纳格的晚饭，暮色中满心欢喜地寻找一面小手鼓。印度孩子快活到了极处，不会胡乱奔跑吵闹，而会独自坐下，给自己举行一场小小的狂欢。要是没找到想要的鼓，他恐怕会活活憋出病来。幸好营地里的糖果贩子借给他一面用手掌拍的小鼓。星星出现时，他盘腿坐在卡拉·纳格面前的饲料之间。越想彼得森老爷给他的荣誉，鼓就敲得越响。没有曲调，也没有词，只有咚、咚、咚，可他快乐极了。
        - id: ch03-b24
          speaker: narrator
          text: >-
            新象不时用力拉扯绳索，又尖叫，又长鸣。营舍里，母亲正用一支古老得不能再古老的歌哄弟弟睡觉。歌里说，大神湿婆曾把各自的食物、劳作和命运，分配给世上的每一种动物。那曲调听来十分安神。
        - id: ch03-b25
          speaker: little_toomai_mother
          text: >-
            湿婆撒下丰收，又唤清风吹起，坐在远古岁月的一扇扇门扉。他赐众生食物、劳作和命运，从宝座上的国王，直到门边的乞丐。守护神湿婆造出万物。摩诃提婆，摩诃提婆，一切皆由他造。骆驼有荆棘，牛群有草料，困倦的小儿呀，有母亲的心怀。
    - id: ch04
      title: 月光下的出走
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            每唱完一节，小杜迈便给母亲敲一声欢快的“咚个咚”。后来他困了，舒展身体，躺在卡拉·纳格身边的饲料上。象照着习惯一头接一头卧倒，只有队伍最右边的卡拉·纳格还站着。他慢慢从一边摇向另一边，双耳向前伸展，听夜风轻轻吹过山岭。竹秆互相碰出轻响，灌木里有活物窸窣，半醒的鸟儿又抓挠又啼叫。其实鸟儿在夜里醒来的次数，比人们以为的多得多。很远很远的地方，还有水落下。许多细响合在一起，反倒像一片巨大的安静。
        - id: ch04-b02
          speaker: narrator
          text: >-
            小杜迈睡了一阵，睁眼时月光明亮。卡拉·纳格仍竖着耳朵。孩子望着大象遮住半片星空的背影，忽然听见极远处一头野象“呼——嘟”叫了一声。那声音小得像在寂静上扎了一个针孔。
        - id: ch04-b03
          speaker: narrator
          text: >-
            象群猛然全站起来，仿佛同时中了枪。低吼声终于惊醒了熟睡的象夫。人们拿着大木槌出来，把拴桩砸得更深，再收紧这根绳，扎牢那处结，直到一切重新安静。一头新象几乎拔出自己的木桩，大杜迈便取下卡拉·纳格腿上的锁链，拿去把那头新象前后脚相连地捆住。他只在老黑蛇腿上松松套了一圈草绳，还叮嘱他记住自己已经拴牢。大杜迈知道，他的父亲和祖父也这样做过几百次。卡拉·纳格却不像平日那样发出咕噜声回答，只一动不动地抬着头，张开扇形大耳，凝望月色中的加罗山。
        - id: ch04-b04
          speaker: big_toomai
          text: >-
            他夜里要是不安分，你照看着点。
        - id: ch04-b05
          speaker: narrator
          text: >-
            大杜迈回屋睡了。小杜迈刚要合眼，草绳轻轻一响，断开了。卡拉·纳格无声地离开木桩，像云飘出山谷。小杜迈光着脚追上月下的道路。
        - id: ch04-b06
          speaker: little_toomai
          text: >-
            卡拉·纳格！带上我，卡拉·纳格！
        - id: ch04-b07
          speaker: narrator
          text: >-
            大象一声不响地回身走了三步，垂下鼻子，把他送上颈背。孩子的膝盖还没坐稳，他们已经进入森林。象棚里传出一声愤怒的号叫，随即沉寂把一切盖住，卡拉·纳格开始赶路。高草像波浪擦过船舷一样，刷过他的两侧。成簇的野胡椒藤刮过他的背，肩膀偶尔碰得竹子嘎吱一响。可两次声响之间，他穿过浓密的加罗森林竟没有一点声音，像烟一样飘了过去。他一直向高处走，小杜迈不断从树冠裂开的缝隙里寻找星星，却仍认不出他们正去哪个方向。
        - id: ch04-b08
          speaker: narrator
          text: >-
            到了坡顶，卡拉·纳格停了一会儿。月光铺在几英里又几英里的树冠上，树梢看起来斑斑驳驳，毛茸茸的。低处的河流罩着一层蓝白雾气。小杜迈向前探身，觉得脚下整片森林醒着、活着，而且挤满了生灵。棕色大果蝠擦过他的耳朵，灌木里传来豪猪硬刺的咔啦声。树干之间的黑暗里，还有一头懒熊在温暖潮湿的土里用力刨食，一面刨，一面喷着鼻息。
        - id: ch04-b09
          speaker: narrator
          text: >-
            树枝再次合拢在头顶，卡拉·纳格开始下山。这一次他不再安静，而像一门失控的大炮冲下陡坡，一口气直奔谷底。四条巨腿像活塞一样稳稳起落，每步都跨出八英尺，肘尖的皱皮互相摩擦。两边灌木发出帆布撕裂般的响声。幼树被肩膀推向左右，又弹回来抽打他的腰腹。纠缠成团的藤蔓挂满象牙，他左右甩头，硬生生犁出道路。小杜迈紧贴宽大的象颈，生怕摇摆的树枝把自己扫落，心里开始想念安全的象棚。
        - id: ch04-b10
          speaker: narrator
          text: >-
            谷底的草越来越湿软，象脚每次落地都被泥吸住，发出咕唧声。冷冷的夜雾裹住小杜迈。前方传来泼水、踏水和流水的响声。卡拉·纳格走进河床，每一步都先探稳了再落下。河水绕着他的腿旋转。水声上面，上游下游都传来更多泼溅和长鸣，还有粗重低吼与恼怒的喷鼻。孩子觉得四周浓雾里全是起伏游动的影子。
        - id: ch04-b11
          speaker: little_toomai
          text: >-
            象族今晚全出来了。原来真是它们的舞会！
          emotion: surprised
        - id: ch04-b12
          speaker: narrator
          text: >-
            卡拉·纳格哗啦哗啦走出河，喷净鼻子里的水，再次上山。这回他不再孤单，也不用自己开路。前面已有一条六英尺宽的通道，压倒的丛林草还在慢慢挺起。必定有许多象在几分钟前刚从这里走过。小杜迈回头看见一头巨大的野公象正从雾河里抬起身体，那双猪崽似的小眼睛亮得像火炭。树木又合拢了，他们一路向上，四周到处响起象鸣、冲撞和枝条断裂的声音。
        - id: ch04-b13
          speaker: narrator
          text: >-
            最后，卡拉·纳格停在山顶两棵树之间。那里有一圈树木，围着三四英亩大的不规则空地。整片泥土都被踩得像砖地一样硬。空地中央还长着几棵树，树皮已经磨掉，露出的白色木质在一片片月光下光滑发亮。藤蔓从高枝垂下，开着蜡白色的大花，花冠像一只只钟，正在夜里沉睡。可在这圈树林里面，连一根青草也找不到，只有反复踩实的泥土。
        - id: ch04-b14
          speaker: narrator
          text: >-
            月色把整片空地照得铁灰，只有场中的象和它们黑得像墨的影子打破那片灰色。小杜迈屏住呼吸，眼睛瞪得几乎要掉出来。越来越多的大象从一根根树干之间摇摆着走来。他只会数到十，只好掰着手指从头数了一次又一次。后来，他连自己数过多少个十都忘了，脑袋也开始发晕。象在圈外一路撞开灌木，声音从山坡下不断传来。可它们一走进林间空地，就变成无声的幽灵。
        - id: ch04-b15
          speaker: narrator
          text: >-
            长着白牙的野公象，带着幼崽的肥母象，刚冒出象牙便骄傲起来的年轻象，全都来了。瘦削的老母象满脸忧虑，鼻子粗得像树皮。暴烈的老公象身上布满旧伤，泥块从肩头剥落。其中还有一头断牙的象，侧腹留着老虎全力抓过的深痕。它们有的头抵着头，有的成双来回走，有的独自摇摆。几十头，又几十头。
    - id: ch05
      title: 大象的杜迈
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            小杜迈知道，只要安静趴在卡拉·纳格颈上，野象就不会伤他。即使围捕时一片冲撞和混乱，它们也不会抬起鼻子，把人从驯象颈上拖走，而今晚的象根本没想人类。森林里有腿镣叮当一响，象群猛地吃了一惊，全都警觉地竖起耳朵。来的是彼得森老爷宠爱的普德米妮。她把锁链齐齐挣断，一路低吼、喷着鼻息爬上山。她准是从彼得森的营地直接赶来的。还有一头小杜迈不认识的象，胸前和背上带着很深的绳伤，想必也从附近山里的某处营地逃了出来。
        - id: ch05-b02
          speaker: narrator
          text: >-
            等森林里再也听不见新来的脚步，卡拉·纳格才离开两棵树之间的位置，摇摆着走到象群中央，发出咯咯咕噜的声音。所有象开始用自己的语言交谈，也开始四处移动。小杜迈一直伏着，向下望去，只见几十又几十片宽阔的背、来回扇动的耳、扬起的鼻和滚动的小眼睛。他听见象牙偶然交碰的咔嗒声，鼻子互相缠绕的干涩声，拥挤中巨大腰腹和肩膀彼此摩擦的声音。粗大的尾巴从未停下，挥动时一声接一声地飕飕作响。
        - id: ch05-b03
          speaker: narrator
          text: >-
            一片云遮住月亮，四周顿时漆黑。安静而持续的拥挤、推搡和咕噜声一点没停。小杜迈知道，卡拉·纳格已经被象群从四面围住，根本不可能倒退出这场集会，只好咬紧牙齿发抖。围象场至少有火把和人的喊声，这里却只有黑暗，只有他孤零零一个人。忽然，一条象鼻从黑暗里伸上来，碰了碰他的膝盖。
        - id: ch05-b04
          speaker: narrator
          text: >-
            一头象突然长鸣，所有象一齐回应。那阵可怕的号叫持续了五到十秒，震得头顶树叶上的露水像雨一样落在看不见的象背上。接着，低沉的轰响从地面升起。声音起初不大，小杜迈还听不出那是什么，后来越来越响。卡拉·纳格轮流抬起两只前脚，再稳稳踩下，一、二，一、二，像两柄不断落下的重锤。此刻群象全都在一起跺脚，那声音仿佛有人站在洞口敲响战鼓。
        - id: ch05-b05
          speaker: narrator
          text: >-
            树上的露水全都落尽了，轰响还没停。大地一直摇晃、震颤。孩子捂住耳朵也挡不住，因为几百只沉重脚掌踏在裸土上，那一下下震动正穿过他的整个身体。有一两次，他感觉卡拉·纳格和所有象一起向前涌出几步。沉重的鼓点随即变成青草和多汁植物被压烂的咯吱声。只过一两分钟，脚掌撞击硬地的轰响又重新开始。附近有棵树正在嘎吱呻吟。小杜迈伸手摸到了树皮，可卡拉·纳格仍在边走边踏，他已经不知道自己身处空地的哪一边。群象始终没有说话，只有两三头小象曾一起尖叫一回。后来，他又听见一下撞击和一阵拖动，轰响仍然继续。跺脚足足持续两小时。小杜迈每一根神经都疼得发紧，可他从夜风的气味中知道，天快亮了。
        - id: ch05-b06
          speaker: narrator
          text: >-
            青山后亮起一整片淡黄。第一线晨光一到，轰鸣立刻停止，像是光本身下了命令。小杜迈耳中的响声还没有散，甚至没来得及挪动身体，眼前便只剩卡拉·纳格、普德米妮和那头带绳伤的象。山坡上没有脚步，没有低语，连草叶也不响，找不到半点迹象能说明其他象去了哪里。它们全都消失了。
        - id: ch05-b07
          speaker: narrator
          text: >-
            他一次又一次打量空地。和昨夜记忆中的样子相比，舞场真的变大了。中央似乎多出了一些树，那是因为边缘的灌木与丛林草都被推平。小杜迈终于看懂了群象整夜在做什么。它们把茂密的草和多汁的芦苇踩成烂叶，把烂叶踩成碎条，把碎条碾成细小纤维，最后又把纤维踏进坚硬的泥土。它们真的用脚开出了新的舞场。
        - id: ch05-b08
          speaker: little_toomai
          text: >-
            卡拉·纳格，我的老爷，跟着普德米妮回彼得森老爷的营地吧。再不走，我就要从你颈上掉下去了。
        - id: ch05-b09
          speaker: narrator
          text: >-
            那头陌生象站在原地，看着卡拉·纳格和普德米妮离开。随后它喷了声鼻息，转过庞大的身体，也独自走上自己的路。谁也不知道它从哪里来。它也许属于五十、六十，甚至一百英里外某个当地小王公的象队。
        - id: ch05-b10
          speaker: narrator
          text: >-
            两小时后，彼得森老爷正在吃早饭。昨夜拴过两道锁链的象突然全都长鸣。普德米妮浑身泥浆，深得一直没到肩头，卡拉·纳格也走得双脚疼痛。两头象一起蹒跚进入营地。小杜迈脸色灰白，面颊憔悴，头发里塞满树叶，又被露水湿透，却还努力想向彼得森老爷行礼。
        - id: ch05-b11
          speaker: little_toomai
          text: >-
            舞会……大象的舞会！我亲眼看见了。我……我要死了！
        - id: ch05-b12
          speaker: narrator
          text: >-
            卡拉·纳格一坐下，孩子便从象颈上滑落，彻底昏了过去。不过印度孩子谈不上有什么脆弱的神经。两小时后，他已舒舒服服躺在彼得森老爷的吊床上，脑袋枕着猎装外套。肚子里则有一杯温牛奶，里面加了少量白兰地和一点奎宁。一群多毛带疤的丛林老猎手在他面前围了三层，像看精灵那样看他。小杜迈用孩子那种简短的话，把整件事从头到尾讲了一遍。
        - id: ch05-b13
          speaker: little_toomai
          text: >-
            我若有一个字是假话，就派人去看。象族把舞场踏大了。那里会有十加十，再加许多个十的脚印。它们用脚开出了地方。我亲眼看见了，是卡拉·纳格带我去的。还有，他的腿已经累坏了！
        - id: ch05-b14
          speaker: narrator
          text: >-
            小杜迈说完便向后躺下，从漫长的下午一直睡到黄昏。他熟睡时，彼得森老爷和马丘阿·阿帕沿着两头象留下的足迹，在山里翻越了十五英里。彼得森捕象十八年，从前也只找到过一次这样的舞场。马丘阿·阿帕更不必看第二眼，也不用伸脚刮一刮夯实的泥土。他一眼便认出昨夜发生的一切。
        - id: ch05-b15
          speaker: machua_appa
          text: >-
            孩子说的全是真的。这里的一切都是昨夜才发生的。我数过了，足足有七十道象的足迹越过河流。老爷，你再看那棵树，普德米妮的腿镣从树旁擦过，把树皮深深割开。没错，她昨夜也在这里。
        - id: ch05-b16
          speaker: narrator
          text: >-
            两个人彼此看看，又从近处望到远处，心里只有说不尽的惊奇。大象神秘莫测的行事方式，无论黑人还是白人，都没有足够的聪明才智把它想透。
        - id: ch05-b17
          speaker: machua_appa
          text: >-
            我追随我的主人——大象——已经四十五年了，可我从没听说过哪个人类的孩子，能见到这个孩子昨夜所见的景象。凭山中诸神起誓，这件事真是……我们还能说什么呢？
        - id: ch05-b18
          speaker: narrator
          text: >-
            他们回到营地时，正赶上晚饭。彼得森老爷独自在帐篷用餐，却吩咐人送给全营两只羊、几只鸡，还有双份面粉、大米和盐。他知道大家一定要庆祝。大杜迈也从平原营地一路飞奔上山，寻找失踪的儿子和大象。如今两个都找回来了，他望着他们，竟像对他们两个都有些害怕。
        - id: ch05-b19
          speaker: narrator
          text: >-
            篝火在一排拴住的大象前熊熊燃烧，小杜迈成了宴会的英雄。棕色皮肤的高大捕象人、追踪手、象夫、下绳套的能手，还有那些懂得怎样驯服最野大象的行家，把孩子从一双手传到另一双手。他们用刚刚宰杀的丛林公鸡胸口的血，在他额上画下印记。从这一刻起，他完成了入门礼，成了可以自由行走所有丛林的林中人。
        - id: ch05-b20
          speaker: narrator
          text: >-
            火焰终于低下去，木柴的红光照着象群，仿佛它们也浸过鲜血。马丘阿·阿帕忽然跳起，把小杜迈高高举过头顶。他是所有围象场、所有象夫的首领，也是彼得森老爷的另一个自己。他在丛林里过了一生，四十年没见过人工铺成的道路。他的地位那么高，根本不用别的名字，人们只须称他马丘阿·阿帕。
        - id: ch05-b21
          speaker: machua_appa
          text: >-
            听着，我的弟兄们！队伍里的各位老爷，你们也听着，现在说话的是马丘阿·阿帕！这孩子以后不再叫小杜迈。他要像曾祖父从前那样，叫作“大象的杜迈”。人类从未见过的景象，他在漫漫长夜里亲眼看见了。象族和丛林诸神都眷顾他。
        - id: ch05-b22
          speaker: machua_appa
          text: >-
            他会成为伟大的追踪手，甚至会比我马丘阿·阿帕更伟大！不论足迹是新鲜的、陈旧的，还是许多脚印混在一起，他都能用明亮清醒的眼睛一路追下去。他会在围象场里钻到大象腹下，给野公象套上绳索，却不会受到伤害。即使脚下一滑，摔在迎面冲来的公象脚前，那头象也会认出他是谁，不肯把他踩碎。
        - id: ch05-b23
          speaker: machua_appa
          text: >-
            哎嗨，锁链中的各位老爷！这个孩子见过你们在秘密之地起舞，见过从没人见过的景象。向他致敬吧，我的老爷们！萨拉姆卡罗，我的孩子们！向“大象的杜迈”行礼！贡加·佩沙德，啊哈！希拉·古杰，比尔奇·古杰，库塔尔·古杰，啊哈！普德米妮，你在舞会上见过他。还有你，卡拉·纳格，我在象群中的珍珠！一起向“大象的杜迈”致敬。巴劳！
        - id: ch05-b24
          speaker: narrator
          text: >-
            最后那声狂野的呼喊一落，拴桩边整整一排大象同时扬起长鼻，直到鼻尖触着各自的前额。紧接着，它们一齐爆发出完整而震天动地的号鸣，声音响彻篝火照亮的整座营地。那就是围象场的萨拉穆特大礼，平日只有印度总督才能听见。这一次，整场隆重的敬礼只献给小杜迈。因为他独自在深夜的加罗山腹地，看见了人类从未见过的景象——大象避开人类，独自举行的舞会。
