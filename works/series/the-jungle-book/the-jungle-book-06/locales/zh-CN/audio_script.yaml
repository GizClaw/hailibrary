audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉稳从容，带着古老丛林故事的气息
        timbre: 温暖清晰
        pace: 舒缓而富有变化
        pitch: 中等
    mowgli:
      display_name: 毛克利
      tts:
        delivery: 率真勇敢，少年气息自然鲜明
        timbre: 清亮结实
        pace: 灵活
        pitch: 中等
  chapters:
    - id: ch01
      title: 大猎物来了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            毛克利踩着谢尔汗的虎皮，在议事岩上边舞边唱。
        - id: ch01-b02
          speaker: mowgli
          text: >-
            我就是毛克利，这首歌唱的是我做过的事。丛林都来听吧！谢尔汗说过，他一定要杀我。要杀我！他打算黄昏守在村口，杀掉青蛙毛克利。可他先吃饱喝足了。喝吧，谢尔汗，多喝一点，下一次喝水还不知要等到何时。你尽管睡，尽管梦见又杀了猎物。
        - id: ch01-b03
          speaker: mowgli
          text: >-
            牧场上只剩我一个。灰兄弟，快来！孤狼，你也来吧！大猎物正在等我们。把那些青灰皮、怒眼睛的大公水牛赶来，全照我的号令奔跑。谢尔汗，你还睡着？醒一醒！我来了，公牛群正跟在后面！
    - id: ch02
      title: 瘸腿的老虎
      blocks:
        - id: ch02-b01
          speaker: mowgli
          text: >-
            水牛之王拉玛重重踏下一只脚。温贡加河的水啊，你们看见谢尔汗去了哪里吗？他不会像伊基那样刨洞，也不能像孔雀毛一样飞走，更不能学蝙蝠芒倒挂在树枝上。小竹子们，你们咯吱直响，可曾看见他往哪里逃？嗷，我看见了！啊呜，他就在那儿！那个瘸子倒在拉玛脚下。起来，谢尔汗！起来杀吧！肉就在眼前，快咬断公牛的脖子！
        - id: ch02-b02
          speaker: mowgli
          text: >-
            嘘，他睡熟了。别叫醒他，他的力气大得吓人呢。鸢鹰落下来看他的本事，黑蚂蚁也爬上来。为了他，大家聚得真齐！可我没有布裹身，鸢鹰会看见我赤条条的。来了这么多客人，我怎么好意思见他们？
        - id: ch02-b03
          speaker: mowgli
          text: >-
            谢尔汗，把你的外衣借我穿穿吧。把那件漂亮的条纹外衣借给我，我好穿着它回议事岩。凭买下我的那头公牛起誓，我许过一个小小的诺。如今只缺这件外衣，我就能守住诺言。我拿起人族用的刀，拿起猎手用的刀，弯下腰来收取这份礼物。温贡加河的水啊，谢尔汗多么疼爱我，竟把外衣送给了我。灰兄弟，用力拉！阿克拉，你也拉！谢尔汗的皮实在太沉了。
    - id: ch03
      title: 两边的门
      blocks:
        - id: ch03-b01
          speaker: mowgli
          text: >-
            人群发怒了。他们拿石头砸我，尽说孩子气的傻话。我的嘴流血了，我还是逃吧。兄弟们，陪我跑过炎热的长夜。我们把村庄的灯火留在身后，一起奔向低低的月亮。
        - id: ch03-b02
          speaker: mowgli
          text: >-
            温贡加河的水啊，人群把我赶走了。我没有伤过他们，他们为什么怕我？狼群啊，你们也赶走了我。丛林关上了门，村庄也关上了门，这是为什么？蝙蝠芒飞在野兽与飞鸟之间，我也只能飞在村庄和丛林之间。为什么会这样？
    - id: ch04
      title: 两个毛克利
      blocks:
        - id: ch04-b01
          speaker: mowgli
          text: >-
            我踩着谢尔汗的皮起舞，心里却沉甸甸的。村民扔来的石头割破了我的嘴，伤口还在疼，我心里又轻飘飘的，因为我终于回到了丛林。这究竟是为什么？两种心绪在我身体里厮打，就像春天的蛇彼此争斗。眼泪从眼睛里流出来，我却边流泪边笑。为什么呢？
        - id: ch04-b02
          speaker: mowgli
          text: >-
            我成了两个毛克利，可谢尔汗的皮仍在我的脚下。整座丛林都知道，是我杀了谢尔汗。狼群啊，看清楚，好好看清楚！那些我怎么也弄不懂的事，压得我的心好沉。
