        pitch: 中等
  chapters:
    - id: ch01
      title: 人群里的狼孩
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            勇敢的猎手，狩猎怎么样？兄弟，守候又漫长又寒凉。你要杀的猎物，如今在何方？兄弟，他还在丛林里啃草忙。那叫你骄傲的力量，去了哪里？兄弟，正从我的腰胁流淌。你匆匆赶路，要奔向何方？兄弟，我回洞穴去，回去死亡。
        - id: ch01-b02
          speaker: narrator
          text: >-
            故事还要从毛克利离开狼洞说起。议事岩那场争斗结束以后，他走下山，来到人类耕种的田地。这里离丛林太近，议事会上结下的死敌随时可能找来，他不愿停留，便沿山谷里的崎岖小路不停奔跑。他用稳定的小跑赶了将近二十英里，直到熟悉的山林全被甩在身后。眼前出现一片陌生的平原，乱石散落，沟壑交错。平原一头是小村庄，另一头是茂密的丛林。树林一气铺到牧场边，突然齐刷刷停住，像是有人拿锄头把边缘斩断了。牛和水牛散在各处吃草。看守牲口的小男孩远远见到毛克利，便大喊着逃跑。每座印度村庄边都有的黄毛野狗，也冲着他叫个不停。毛克利只管朝前走，因为他肚子饿了。来到村口，他看见黄昏用来封门的那丛大荆棘已经挪到一旁。
        - id: ch01-b03
          speaker: mowgli
          text: 这里的人也害怕丛林众生。看来不管走到哪里，人都是一样的。
        - id: ch01-b04
          speaker: narrator
          text: >-
            他在门边坐下。一个男人走出来，毛克利就站起身，张开嘴指指里面，告诉对方自己要吃东西。男人盯着他看了又看，忽然转身跑回村中，沿着唯一的街道大喊，要人快去请祭司。那位身穿白衣、额头画着红黄印记的胖祭司赶来了，身后至少跟着一百个人。众人围住毛克利，又说又叫，还不停伸手指他。
        - id: ch01-b05
          speaker: mowgli
          text: 这些人族太没规矩了。只有灰猿才会这样盯着别人乱喊。
        - id: ch01-b06
          speaker: narrator
          text: 毛克利把长发甩到背后，皱眉看着人群。祭司倒摆出一副什么都明白的样子。
        - id: ch01-b07
          speaker: priest
          text: >-
            不用害怕。看看他手脚上的伤疤，那都是狼牙留下的。这是个从丛林里跑出来的狼孩。
        - id: ch01-b08
          speaker: narrator
          text: >-
            幼狼同毛克利玩耍时，的确常常没轻没重，在他身上留下许多白疤。可毛克利绝不会说那是被狼咬的，因为真正的一口咬下来是什么滋味，他比谁都清楚。
        - id: ch01-b09
          speakers: [woman_1, woman_2]
          ensemble: duo
          text: >-
            哎呀，可怜的孩子！被狼咬成这样，模样却真俊，眼睛还像两团红火。梅苏亚，他很像你那个叫老虎叼走的儿子。
        - id: ch01-b10
          speaker: messua
          text: 让我仔细看看。他瘦了些，可这张脸，这副神情，真的很像我的孩子。
        - id: ch01-b11
          speaker: narrator
          text: >-
            梅苏亚的手腕和脚踝戴着沉重的铜环。她搭起手掌遮住阳光，久久望着毛克利。祭司知道她嫁给了村里最富有的人，便仰头看了一会儿天，庄严地开了口。
        - id: ch01-b12
          speaker: priest
          text: >-
            丛林从你身边夺走一个孩子，如今又送回一个。姐妹，带他回家吧。还有，别忘了敬奉那位能看透人一生命运的祭司。
        - id: ch01-b13
          speaker: mowgli
          text: >-
            凭买下我的公牛起誓，他们这样围着我说个没完，跟狼群审看我也差不多。好吧，我既然是个人，就学着做人。
        - id: ch01-b14
          speaker: narrator
          text: >-
            梅苏亚带他走进小屋。里面有红漆床、带凸纹的大陶粮柜、六口铜锅，壁龛里供着一尊神像，墙上还挂着一面集市上买来的真镜子。她先给毛克利牛奶和面包，又把手放在他的头上，望进他的眼睛。也许，自己的儿子真的从老虎叼走他的那片丛林里回来了。
        - id: ch01-b15
          speaker: messua
          text: 纳图，哦，纳图！你还记得吗？那一天，我给了你一双新鞋。
        - id: ch01-b16
          speaker: narrator
          text: >-
            毛克利没有反应。梅苏亚摸摸他的脚，那脚底几乎像牛角一样硬。
        - id: ch01-b17
          speaker: messua
          text: >-
            不，这双脚从来没穿过鞋。可你和我的纳图太像了。从今天起，你就是我的儿子。
          emotion: sad
        - id: ch01-b18
          speaker: narrator
          text: >-
            毛克利第一次待在屋顶下面，心里很不自在。不过他看了看茅草顶，知道随时可以扯开逃走，窗户也没有闩，便放下心来。他听不懂人的话，觉得自己又傻又哑，就像一个人误闯狼群。要是连人的语言都不会，做人又有什么用呢？于是梅苏亚每说一个词，他都认真模仿。过去在狼群里，他学雄鹿挑战的叫声，学小野猪的哼哼，绝不只是为了玩耍。如今他用同样敏锐的耳朵学习人的语言，几乎每个词都能原样说出来。天黑以前，屋里许多东西，他已经能叫出名字。
        - id: ch01-b19
          speaker: narrator
          text: >-
            到了睡觉时，他怎么也不肯钻进那间活像黑豹陷阱的屋子。门一关，他就从窗户跳了出去。
        - id: ch01-b20
          speaker: messua_husband
          text: >-
            随他吧。他从前一定没有睡过床。要是他真是来替代我们儿子的，就不会离开我们。
        - id: ch01-b21
          speaker: narrator
          text: >-
            毛克利躺进田边又长又干净的草里。眼睛还没闭上，一只柔软的灰鼻子便拱了拱他的下巴。那是狼妈妈最大的幼崽，灰兄弟。
        - id: ch01-b22
          speaker: gray_brother
          text: >-
            呸！我跟着你跑了二十英里，你却已经满身木烟和牛的气味，闻起来活像个人。快醒醒，小兄弟，我有消息给你。
        - id: ch01-b23
          speaker: mowgli
          text: 丛林里的大家都平安吗？
        - id: ch01-b24
          speaker: gray_brother
          text: >-
            除了几头被红花烧伤的狼，大家都好。谢尔汗烧得很重，已经远走狩猎，等着皮毛重新长好。他发过誓，回来以后要把你的骨头摆进温贡加河。
        - id: ch01-b25
          speaker: mowgli
          text: >-
            誓言可不只他会立，我也答应过自己一件事。今晚这些新鲜事叫我累坏了，不过灰兄弟，有消息时，你永远都要来告诉我。
        - id: ch01-b26
          speaker: gray_brother
          text: 你不会忘了自己是一头狼吧？人类不会叫你忘记吧？
        - id: ch01-b27
          speaker: mowgli
          text: >-
            永远不会。我爱你，也爱我们洞里的每一个，这件事我永远记得。我也不会忘记，是狼群把我赶了出来。
        - id: ch01-b28
          speaker: gray_brother
          text: >-
            另一个群体也可能赶走你。人终究只是人，他们的话就像池塘里的青蛙乱叫。下次来，我会在牧场边的竹林等你。
    - id: ch02
      title: 村庄的规矩
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            此后三个月，毛克利几乎没有离开村口。他忙着学习人的规矩。先要拿布裹住身体，这已经叫他难受透了。接着要认识钱，可他怎么也不明白那东西。人们还教他耕田，他同样看不出有什么用。最让他恼火的是村里的小孩子。他们笑他不会玩游戏、不会放风筝，还拿他说错的词取乐。幸好丛林法规早教会他控制脾气。在丛林里，食物和性命都要靠这份克制。他一次次提醒自己，不能为了几个笑话，就抓起赤条条的小幼崽，把他们掰成两段。
        - id: ch02-b02
          speaker: narrator
          text: >-
            毛克利也不知道自己有多大力气。过去在丛林中，他只觉得自己比野兽弱。到了村里，人们却说他壮得像头公牛。他更不懂种姓为什么能把人与人隔得那么远。陶匠的驴滑进黏土坑，他看见了，便揪住尾巴把它拖出来，又帮陶匠把坛坛罐罐堆好，预备运往坎希瓦拉的集市。村民们觉得这两件事都十分可怕，因为陶匠属于低等种姓，而他的驴在他们眼里比主人还要低。祭司赶来责骂毛克利，毛克利却威胁说，再骂下去，就连祭司也放到驴背上。祭司只好转去告诉梅苏亚的丈夫，应该立刻给这个无法无天的孩子找份活儿。村长便命令毛克利第二天跟水牛出村，整天看着它们吃草。
        - id: ch02-b03
          speaker: narrator
          text: >-
            没有人比毛克利更高兴。当晚，他觉得自己已经算是村庄的一名正式仆役，便去参加大无花果树下的夜谈。那里有一座石台，就是全村人的会所。村长、守夜人、理发匠和老猎手布尔迪奥每天都坐在上面，一边吸大水烟筒，一边聊到深夜。理发匠知道村里所有闲话，布尔迪奥的膝上则横着一杆塔式火枪。树顶的猴子也在说话。石台底下有个洞，住着一条神圣的眼镜蛇，每晚都有人送给它一小碟牛奶。老人们讲神灵、人类和鬼怪，布尔迪奥讲的丛林奇谈比那些还离奇。圈外的孩子听得眼睛都快凸出来。丛林就在村口，鹿和野猪会来拱坏庄稼，老虎偶尔也会在黄昏叼走人，而且村口的人都看得见。所以，他们讲得最多的总是野兽。
        - id: ch02-b04
          speaker: narrator
          text: >-
            毛克利比谁都清楚他们讲的东西。他只能遮住脸，不让大家看见自己发笑。布尔迪奥一个故事接一个故事说下去，毛克利的肩膀也越抖越厉害。那老猎手说，叼走梅苏亚儿子的其实是一只鬼虎，身体里住着邪恶放债人的鬼魂。
        - id: ch02-b05
          speaker: buldeo
          text: >-
            这件事绝不会错。普伦·达斯的账本在暴乱里被烧掉，他也挨了一棍，从此走路一瘸一拐。那只老虎的四个脚印深浅不同，也同样瘸腿。你们说，这还不够明白吗？
        - id: ch02-b06
          speakers: [elder_1, elder_2]
          ensemble: duo
          text: 对，对，一定就是这样。
        - id: ch02-b07
          speaker: mowgli
          text: >-
            你讲的都是蛛网和月光织出来的故事吗？那只老虎生下来就瘸，丛林里谁不知道？它连豺狼的胆量都没有，肚子里怎么会住着放债人的灵魂？这是小孩子才信的话。
        - id: ch02-b08
          speaker: narrator
          text: 布尔迪奥一时惊得张不开嘴，村长也瞪住了毛克利。
        - id: ch02-b09
          speaker: buldeo
          text: >-
            哦，原来是你这个丛林小崽子。你这样聪明，就把虎皮送到坎希瓦拉去吧。官府悬了一百卢比买它的命。还有，长辈讲话时，最好闭上嘴。
        - id: ch02-b10
          speaker: mowgli
          text: >-
            我整晚躺在这里听。除了一两句话，你讲起门前这片丛林，就没有说过一句真的。既然如此，你那些亲眼见过的鬼魂、神灵和妖怪，我又为什么要信？
        - id: ch02-b11
          speaker: headman
          text: 这孩子早该去放牛了。
        - id: ch02-b12
          speaker: narrator
          text: >-
            印度许多村庄都让几个男孩天亮时把牛赶出去，晚上再赶回来。那些能把白人活活踩死的牲口，却任由还没自己鼻子高的孩子敲打、责骂、大声吆喝。只要孩子跟牛群待在一起，便很安全，因为就连老虎也不敢冲进一大群牛。可谁要独自跑去摘花或捉蜥蜴，有时就会被猛兽带走，再也回不来。第二天黎明，毛克利骑在牛群头领拉玛背上，走过村中唯一的街道。青灰色水牛一头接一头走出棚圈，长角向后弯扫，眼神凶猛，然后全跟在拉玛身后。毛克利挥着光滑的长竹竿抽打水牛，也清清楚楚地让同行的孩子明白，今天谁才是首领。他叫卡米亚把黄牛单独带到一边吃草，千万不要自己离开牛群。随后，他领着所有水牛向平原深处走去。
        - id: ch02-b13
          speaker: narrator
          text: >-
            印度的牧场遍布石块、灌木、草墩和小沟，牛群走散以后很快便看不见。水牛爱待在池塘和烂泥里，一泡就是几个钟头。毛克利把它们赶到温贡加河流出丛林的地方，从拉玛颈背上跳下，跑到竹林中。灰兄弟已经等在那里。
        - id: ch02-b14
          speaker: gray_brother
          text: 我等了你好多天。你怎么替人放起牛来了？
        - id: ch02-b15
          speaker: mowgli
          text: 是村里的命令。我暂时做一名牧人。谢尔汗有消息吗？
        - id: ch02-b16
          speaker: gray_brother
          text: >-
            他回到这里，等了你很久。猎物太少，他眼下又离开了。不过，他回来就是要杀你。
        - id: ch02-b17
          speaker: mowgli
          text: >-
            很好。他不在时，你或另外三个兄弟每天坐到那块岩石上，让我出村就能看见。等他回来，到平原中央达克树旁的沟里等我。我们不必自己走进谢尔汗嘴里。
        - id: ch02-b18
          speaker: narrator
          text: >-
            毛克利找片阴凉躺下，让水牛在身边吃草。印度的放牛生活清闲得很。黄牛走几步，低头咬嚼一阵，躺下来歇息，然后再站起来往前走。它们连一声哞叫也没有，只偶尔从鼻子里哼哼。水牛更加沉默。它们一个跟一个挤进泥塘，在暖泥里晒上几个钟头，慢慢把身体沉下去。最后，水面上只剩鼻孔和瓷蓝色的圆眼睛，一动不动，仿佛一根根泡在水里的木头。太阳烤得岩石在热浪中摇晃。高空传来一只鸢鹰的尖哨，永远只有一只，飞得几乎看不见。孩子们知道，人或牛一倒下，那只鸢鹰便会俯冲。几英里外的下一只看见它坠落，也会立刻飞来。接着是第三只、第四只，一只跟着一只。死者也许还没完全断气，二十只饥饿的鸢鹰已经不知从哪里聚齐了。
        - id: ch02-b19
          speaker: narrator
          text: >-
            孩子们睡了又醒，醒了又睡。睡腻以后，他们拿干草编成小篮子，把捉来的蚱蜢装进去。或者捉两只螳螂，看它们彼此打架。红黑相间的丛林果实可以串成项链，趴在岩石上晒太阳的蜥蜴也能看上很久。泥塘边若有一条蛇追赶青蛙，那更是整整一个下午的好戏。后来，他们唱起拖得长长的歌，每一段末尾都带着当地人古怪的颤音。在那样炎热安静的平原上，一天仿佛比大多数人的一生还长。有时，他们用泥巴造出一座城堡，再捏出男人、马匹和水牛。泥人手里插着芦苇，他们就假装自己是国王，眼前这些小像全是军队。过一会儿，他们又假装自己成了受人膜拜的神。直到黄昏来临，孩子们才站起来，朝散开的牲口出声呼唤。水牛从黏泥里拔出沉重的身体，一头接一头，响声就像枪连续炸开。所有牛慢慢排成长队，穿过灰色平原，走向远处一盏盏闪烁的村灯。
        - id: ch02-b20
          speaker: narrator
          text: >-
            日子一天天过去。毛克利每天把水牛带到泥塘，每天都能在一英里半外看到灰兄弟的背脊。那就说明谢尔汗还没回来。他躺在草地上，听四周的声音，回想丛林里的旧日生活。那些清晨漫长又安静，谢尔汗若在温贡加河畔踏错一步，他也能听见。
    - id: ch03
      title: 沟中的虎
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            终于有一天，信号岩上不见灰兄弟。毛克利笑起来，把水牛赶向达克树旁的沟。树上开满金红色的花，灰兄弟就坐在下面，背毛根根直立。
        - id: ch03-b02
          speaker: gray_brother
          text: >-
            谢尔汗躲了一个月，想叫你放松戒备。昨夜，他和塔巴基翻过山岭，一路追着你的踪迹赶来。
        - id: ch03-b03
          speaker: mowgli
          text: 谢尔汗不难对付，可塔巴基狡猾得很。
        - id: ch03-b04
          speaker: gray_brother
          text: >-
            你不用再担心塔巴基。天亮时，我遇见了他。他把谢尔汗的计划全说了出来，然后我咬断了他的脊背。现在，他正把自己的聪明讲给鸢鹰听。谢尔汗今晚会守在村口，只等你一个。他眼下躲在温贡加河那条宽阔的干沟里。
        - id: ch03-b05
          speaker: mowgli
          text: 他今天吃过东西吗？还是空着肚子？
        - id: ch03-b06
          speaker: narrator
          text: 这个问题的答案，关系着毛克利是生是死。
        - id: ch03-b07
          speaker: gray_brother
          text: >-
            天亮时他杀了一头猪，后来还喝过水。谢尔汗从来受不了饥饿，哪怕为了报仇，也不肯空着肚子。
        - id: ch03-b08
          speaker: mowgli
          text: >-
            蠢货，真是幼崽生的幼崽！他吃饱喝足，还以为我会等他睡醒。可他究竟藏在哪里？若有十个伙伴，我们就能趁他躺着时撕碎他。水牛只有闻到老虎才肯冲，我又不会说水牛的话。我们能绕到他的踪迹后面，让牛群闻见吗？
        - id: ch03-b09
          speaker: gray_brother
          text: 他特意从温贡加河很下游的地方游过去，没有在这边留下气味。
        - id: ch03-b10
          speaker: mowgli
          text: >-
            一定是塔巴基教他的，他自己想不出来。那条宽沟离这里不到半英里，沟口通向平原。我能带牛群绕进丛林，从沟头冲下去，可谢尔汗会从沟尾逃走。我们得堵住那一头。灰兄弟，你能把牛群分成两半吗？
        - id: ch03-b11
          speaker: gray_brother
          text: 只靠我也许不行，不过我带来了一位聪明的帮手。
        - id: ch03-b12
          speaker: narrator
          text: >-
            灰兄弟跳进一道洼沟。一颗巨大的灰色脑袋从里面升起来，炎热的空气中随即响起狼在正午的狩猎长嗥。那是整个丛林最凄凉的声音，也是毛克利再熟悉不过的声音。
        - id: ch03-b13
          speaker: mowgli
          text: >-
            阿克拉！我早该知道你不会忘记我。现在有件大事。把牛群分开，让母牛和小牛待在一起，公牛和耕地的水牛另成一群。
        - id: ch03-b14
          speaker: narrator
          text: >-
            两头狼在牛群中来回穿梭，像是在跳链环舞。水牛昂头喷气，渐渐分成两团。母水牛把小牛护在中央，瞪眼刨蹄，只要狼稍一停步，它们便会冲上去把狼踩死。另一边的公牛和年轻公牛也跺脚喷气，模样更加吓人，却没有小牛要保护，危险反而小些。就算来了六个男人，也不能把牛群分得这样整齐。
        - id: ch03-b15
          speaker: akela
          text: 接下来呢？它们又想挤到一起了。
        - id: ch03-b16
          speaker: mowgli
          text: >-
            阿克拉，把公牛往左边赶远。灰兄弟，等我们走开，你就拢住母牛，把它们赶到沟尾。
        - id: ch03-b17
          speaker: gray_brother
          text: 要赶到多远？
        - id: ch03-b18
          speaker: mowgli
          text: >-
            赶到两边的崖壁高得让谢尔汗跳不出去。守住它们，等我们从上面冲下来！
        - id: ch03-b19
          speaker: narrator
          text: >-
            阿克拉放声长嗥，公牛群立刻向左席卷。灰兄弟挡在母牛面前，贴着牛角奔跑，把它们引向沟尾。毛克利骑上拉玛，在尘土中向阿克拉呼喊。
        - id: ch03-b20
          speaker: mowgli
          text: >-
            干得好！再赶一次，它们就会上路。小心，阿克拉，别多咬一口，不然公牛会冲你。呼驾！这可比赶黑羚疯狂多了。你想得到这些大家伙能跑这么快吗？
        - id: ch03-b21
          speaker: akela
          text: 我从前也猎过它们。要赶进丛林吗？
        - id: ch03-b22
          speaker: mowgli
          text: >-
            对，快让它们转过去！拉玛已经气疯了。要是我能告诉它，今天需要它做什么就好了。
        - id: ch03-b23
          speaker: narrator
          text: >-
            公牛向右急转，轰然冲入密立的灌木。半英里外，别的孩子正守着黄牛。他们一见水牛狂奔，便拼命跑回村里，边跑边喊，说水牛全疯了。毛克利的计划却很简单。他要先带公牛绕一个大圈上山，来到沟头，再让它们顺沟冲下，把谢尔汗夹在公牛与母牛之间。沟尾已有灰兄弟看守的母牛，老虎无论往哪边逃，都会撞上牛角和铁蹄。何况谢尔汗刚吃过一头猪，又喝足了水，沉重的肚子让他不能搏斗，也爬不上陡直的沟壁。毛克利一路用声音安抚发怒的水牛，让它们继续奔跑，却不要过早乱冲。阿克拉远远落在后面，只偶尔低呜一两声，催促队尾的牛赶上。他们故意绕了很远很远，宁可多走山路，也不肯靠近干沟，泄露脚步和气味，提前惊动那只正在睡觉的老虎。
        - id: ch03-b24
          speaker: narrator
          text: >-
            终于，毛克利把茫然的公牛收拢在沟头草坡上。那里陡陡斜向沟底，从高处可以越过树梢看见平原。毛克利只看两边的沟壁。岩壁几乎笔直，上方垂下的藤蔓也不能托住老虎的脚。他满意地举起手。
        - id: ch03-b25
          speaker: mowgli
          text: >-
            先让它们喘口气。它们还没闻到谢尔汗。我得告诉他，是谁来找他了。我们已经把他困在陷阱里。
        - id: ch03-b26
          speaker: narrator
          text: >-
            毛克利把双手拢到嘴边，朝沟底大喊。声音仿佛冲进隧道，回声从一块岩石跳向另一块。很久以后，下面传来一声懒洋洋的低吼。一只吃饱的老虎刚从睡梦中醒来。
        - id: ch03-b27
          speaker: shere_khan
          text: 谁在叫我？
        - id: ch03-b28
          speaker: narrator
          text: 一只华丽的孔雀尖叫着飞出干沟。
        - id: ch03-b29
          speaker: mowgli
          text: >-
            是我，毛克利！偷牛贼，该回议事岩了。阿克拉，把它们赶下去！下去，拉玛，冲下去！
        - id: ch03-b30
          speaker: narrator
          text: >-
            牛群在坡顶顿了一瞬。阿克拉发出完整的狩猎长嗥，水牛便一头接一头扑下陡坡，像汽船冲过急流。沙土和碎石四下喷起，一旦冲动便再也停不住。还没到沟底，拉玛已经嗅见谢尔汗，放声怒吼。
        - id: ch03-b31
          speaker: mowgli
          text: 哈！现在你明白了吧！
        - id: ch03-b32
          speaker: narrator
          text: >-
            黑色弯角、冒着白沫的口鼻和圆瞪的眼睛汇成一股洪流，像涨水时滚落的巨石，旋转着沿狭沟冲去。强壮的水牛占住沟底，弱小的全被挤到两边，在岩壁下撕断一条条藤蔓。牛群已经知道前面是什么了。那是一整群水牛朝天敌发起的可怕冲锋，世上没有哪一只老虎能够站住抵挡。谢尔汗听见蹄声如雷，连忙撑起身体，拖着吃饱喝足的沉重肚子沿沟逃跑。他一路左右张望，寻找能够脱身的斜坡或裂口。可沟壁直上直下，悬垂的藤蔓也托不住虎爪。他只能笨重地往前跑，宁愿做任何事，也不肯转身迎战。牛群踏水冲过他刚刚躺过的池塘，放声吼叫，整条狭沟都在回响。
        - id: ch03-b33
          speaker: narrator
          text: >-
            沟尾传来母牛的回应。谢尔汗转过身来。真到了绝境，他宁愿迎向公牛，也不敢面对护崽的母牛。拉玛忽然绊了一下，踩过一团柔软的东西，踉跄着继续冲去。公牛群随即撞上另一群水牛，弱小的牛被冲力掀起。两群牛纠缠着冲出平原，彼此用角顶撞，用蹄乱踩。毛克利看准时机，从拉玛背上滑下，挥着棍子左右抽打。
        - id: ch03-b34
          speaker: mowgli
          text: >-
            快，阿克拉，把它们拆开！不然牛群要自己打起来了。嗨，拉玛！我的孩子们，慢些，慢些！事情已经结束了。
        - id: ch03-b35
          speaker: narrator
          text: >-
            阿克拉和灰兄弟来回轻咬水牛的腿。牛群一度想重新冲进干沟，毛克利却让拉玛转过方向，其他水牛便跟着头领回到泥塘。谢尔汗再也不需要第二次践踏。他已经死了，鸢鹰正从天边飞来。
        - id: ch03-b36
          speaker: mowgli
          text: >-
            兄弟们，他死得像条狗，也根本不敢应战。这张虎皮铺在议事岩上，一定很好看。我们赶快动手。
        - id: ch03-b37
          speaker: narrator
          text: >-
            自从住进村里，毛克利总把一把刀连鞘挂在颈上。在人群中长大的男孩绝不会独自去剥十英尺长的虎皮，毛克利却比谁都明白兽皮怎样贴着筋肉生长，也知道该从哪里割开，怎样完整取下。他割着，撕着，哼哧了整整一个钟头。两头狼伸着舌头歇息，毛克利一招呼，它们便上前咬住皮毛用力拉扯。忽然，一只手按住他的肩。他抬起头，看见布尔迪奥扛着塔式火枪站在那里。放牛孩子已经把水牛狂奔的消息带回村庄，老猎手气冲冲赶来，一心要教训毛克利没有看好牛群。两头狼看见人来，立刻藏起身影。
    - id: ch04
      title: 第二次被逐
      blocks:
        - id: ch04-b01
          speaker: buldeo
          text: >-
            你这是在胡闹什么？凭你也想剥老虎皮？水牛在哪里踩死它的？原来还是那头悬赏一百卢比的瘸虎。好吧，你让牛群逃走的事，我可以不追究。等我把虎皮送去坎希瓦拉，也许分给你一个卢比。
        - id: ch04-b02
          speaker: narrator
          text: >-
            布尔迪奥从腰布里摸出火石和火镰，弯腰要烧掉虎须。当地猎人相信，烧掉虎须，老虎的鬼魂便不会回来缠人。毛克利仍在剥一只前爪的皮。
        - id: ch04-b03
          speaker: mowgli
          text: >-
            原来你想拿走虎皮领赏，再赏给我一个卢比。可我正要把这张皮留给自己。老头，把火拿远些！
        - id: ch04-b04
          speaker: buldeo
          text: >-
            你敢这样对村里的首席猎手讲话？你不过走运，又碰上这些蠢水牛，才捡到这头猎物。老虎刚吃过东西，不然早跑出二十英里了。你连皮都不会剥，还敢命令我？我一个安那也不会给你，只会狠狠揍你一顿。离开这具尸体！
          emotion: angry
        - id: ch04-b05
          speaker: mowgli
          text: >-
            凭买下我的公牛起誓，难道整个中午我都得陪这只老猴子废话？阿克拉，这个人一直来烦我。
        - id: ch04-b06
          speaker: narrator
          text: >-
            布尔迪奥还伏在虎头旁，转眼却趴到了草地上。一头灰狼站在他身上。毛克利继续剥皮，仿佛整个印度只剩下自己。
        - id: ch04-b07
          speaker: mowgli
          text: >-
            对啊，布尔迪奥，你说得没错。你永远不会给我一个安那。这头瘸虎同我有一场很久以前就开始的旧仗。现在，我赢了。
        - id: ch04-b08
          speaker: narrator
          text: >-
            公道地说，布尔迪奥若年轻十岁，在树林里单独撞见阿克拉，也敢冒险动手。可是这头狼听从男孩的命令，而男孩又同吃人虎有自己的战争。这绝不是寻常野兽。布尔迪奥认定自己遇上了最可怕的妖术。他一动不动地伏在地上，只盼颈间的护身符能保住性命，还怕毛克利随时会变成另一头老虎。
        - id: ch04-b09
          speaker: buldeo
          text: 大君，伟大的王！
          emotion: fearful
        - id: ch04-b10
          speaker: mowgli
          text: 嗯？
        - id: ch04-b11
          speaker: buldeo
          text: >-
            我只是个老人，不知道您不只是一名放牛娃。能不能准我站起来离开？还是您的仆从要把我撕碎？
          emotion: fearful
        - id: ch04-b12
          speaker: mowgli
          text: >-
            走吧，愿平安跟着你。下一次，不要插手我的猎物。阿克拉，让他走。
        - id: ch04-b13
          speaker: narrator
          text: >-
            布尔迪奥一瘸一拐，尽快赶回村庄，还不住回头，生怕毛克利变成可怕的怪物。回去以后，他讲了一大套魔术、妖法和邪术，连祭司也听得满脸凝重。毛克利继续干活，直到暮色将临，才同两头狼把那张巨大华丽的虎皮完整剥下。
        - id: ch04-b14
          speaker: mowgli
          text: 我们得把虎皮藏起来，再把水牛赶回家。阿克拉，来帮我放牛。
        - id: ch04-b15
          speaker: narrator
          text: >-
            牛群在朦胧的暮色中重新聚拢。快到村口时，毛克利看见灯光，听见庙里的海螺和钟铛乱响。半个村子的人仿佛都在门边等他。毛克利以为，他们是在等杀死谢尔汗的英雄。没想到，一阵石头呼啸而来，从他的耳旁擦过。
        - id: ch04-b16
          speakers: [villager_1, villager_2]
          ensemble: duo
          text: >-
            妖人！狼崽！丛林恶魔！快滚，不然祭司要把你变回狼！布尔迪奥，开枪！
          emotion: fearful
        - id: ch04-b17
          speaker: narrator
          text: >-
            塔式火枪砰然炸响，一头小水牛痛得大叫。
        - id: ch04-b18
          speakers: [villager_1, villager_2]
          ensemble: duo
          text: >-
            又是妖法！他能让子弹拐弯。布尔迪奥，你打中自己的水牛了！
          emotion: surprised
        - id: ch04-b19
          speaker: mowgli
          text: 这又是什么事？
        - id: ch04-b20
          speaker: narrator
          text: 石雨越落越密，毛克利一时弄不明白。
        - id: ch04-b21
          speaker: akela
          text: >-
            你的这些人类兄弟，跟狼群还真相像。要是子弹有什么意思，我猜他们也要把你赶走了。
        - id: ch04-b22
          speaker: priest
          text: 狼崽！快从这里滚开！
          emotion: angry
        - id: ch04-b23
          speaker: narrator
          text: 祭司一边喊，一边挥舞一枝神圣的圣罗勒。
        - id: ch04-b24
          speaker: mowgli
          text: >-
            又来一次？上回，因为我是人，狼群赶走我。这回，因为我是狼，人群又赶走我。阿克拉，我们走吧。
        - id: ch04-b25
          speaker: narrator
          text: >-
            梅苏亚穿过牛群跑来，朝毛克利伸出双手。
        - id: ch04-b26
          speaker: messua
          text: >-
            我的儿子！他们说你是个妖人，想变什么野兽就能变成什么野兽。我不信。可你快走吧，不然他们会杀了你。布尔迪奥说你会邪术，我却知道，你已经替纳图报了仇。
          emotion: fearful
        - id: ch04-b27
          speakers: [villager_1, villager_2]
          ensemble: duo
          text: 梅苏亚，快回来！不然连你一起用石头打！
          emotion: angry
        - id: ch04-b28
          speaker: narrator
          text: >-
            一块石头击中毛克利的嘴。他发出一声短促而难听的笑。
        - id: ch04-b29
          speaker: mowgli
          text: >-
            快跑回去，梅苏亚。这只是他们黄昏坐在大树下讲的又一个蠢故事。我至少已经替你的儿子偿了命。快走吧，我赶牛进村，会比他们扔石头更快。我不是妖人。再见！
        - id: ch04-b30
          speaker: mowgli
          text: 阿克拉，再来一次，把牛赶进去！
        - id: ch04-b31
          speaker: narrator
          text: >-
            水牛早就急着回村。阿克拉几乎不用出声，它们已经像旋风一样冲过村口，把人群撞向两边。
        - id: ch04-b32
          speaker: mowgli
          text: >-
            数清楚你们的牛！说不定我偷了一头。好好数吧，我再也不给你们放牛了。再见，人类的孩子们！你们应该感谢梅苏亚。要不是她，我会带狼群进村，把你们追遍每一条街。
        - id: ch04-b33
          speaker: narrator
          text: >-
            毛克利转身同孤狼离开。他抬头看着星星，心里竟觉得快活。再不用睡在人类的陷阱里了。他要去取谢尔汗的皮，然后离开这里。可他不会伤害村庄，因为梅苏亚待他很好。月亮升过平原，把大地照得一片乳白。惊恐的村民远远看见毛克利头顶一个大包袱，两头狼紧跟在后。他们保持着均匀的狼步，从不急冲，却像火一样吞掉漫长的里程。村民只得把庙钟敲得更响，把海螺吹得更响。梅苏亚为失而复得、又再次失去的儿子流着泪。布尔迪奥却不断给自己的丛林历险添枝加叶。他越说越离奇，最后竟告诉大家，阿克拉曾用后腿站立，像人一样开口讲话。
    - id: ch05
      title: 虎皮回到议事岩
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            月亮将要落下时，毛克利和两头狼来到议事岩所在的山丘。他们停在狼妈妈的洞前。
        - id: ch05-b02
          speaker: mowgli
          text: >-
            妈妈，人群把我赶了出来。不过我带回了谢尔汗的皮，守住了自己的诺言。
        - id: ch05-b03
          speaker: narrator
          text: >-
            狼妈妈脚步僵硬地走出洞，几头幼狼跟在后面。一看到那张虎皮，她的眼睛便亮了起来。
        - id: ch05-b04
          speaker: mother_wolf
          text: >-
            小青蛙，那一天，谢尔汗把头和肩膀硬塞进这座洞，要取你的命。我对他说过，猎手终有一天会成为猎物。你做得很好。
        - id: ch05-b05
          speaker: bagheera
          text: 小兄弟，做得好。没有你，丛林里寂寞得很。
        - id: ch05-b06
          speaker: narrator
          text: >-
            巴希拉从灌木中跑出来，来到毛克利光裸的脚边。他们一同登上议事岩。毛克利把谢尔汗的皮摊在阿克拉从前坐过的平石上，用四根竹片牢牢钉住。阿克拉躺到虎皮上，发出古老的议事召唤。毛克利第一次被带到这里时，他也曾这样召唤狼群。
        - id: ch05-b07
          speaker: akela
          text: 看啊，好好看啊，狼群！
        - id: ch05-b08
          speaker: narrator
          text: >-
            自从阿克拉被罢黜，狼群便没了首领。大家想怎样狩猎就怎样狩猎，想同谁争斗就同谁争斗。可听见旧日召唤，它们还是依照习惯作了回答。剩下的狼一头头来到议事岩。有些掉进陷阱，伤了腿。有些被枪弹击中，走路一瘸一拐。有些吃了坏食物，浑身长满疥癣。还有许多狼不见了，再也没有回来。留下的狼全都围住岩石，看见谢尔汗的条纹毛皮摊在上面。四只空荡荡的脚垂在石边，巨大的虎爪仍挂在脚掌末端。那个曾让狼群恐惧的敌人，如今只剩下一张皮。
        - id: ch05-b09
          speaker: narrator
          text: >-
            就在这时，一支歌自己涌进毛克利的喉咙，仿佛那首歌早就藏在那里，只等这一刻。他放开声音唱着，在哗啦作响的虎皮上跳起又落下，用脚后跟一下下敲出拍子。每唱完一段，灰兄弟和阿克拉便仰头长嗥，狼的声音越过议事岩，传进夜色。毛克利不停地唱，不停地跳，直到胸口再也挤不出一口气，才终于停下来。
        - id: ch05-b10
          speaker: mowgli
          text: 狼群，好好看着。我有没有守住诺言？
        - id: ch05-b11
          speakers: [wolf_1, wolf_2, wolf_3, wolf_4]
          ensemble: chorus
          text: 你守住了！
        - id: ch05-b12
          speaker: wolf_1
          text: >-
            阿克拉，再来带领我们！人崽，也来带领我们！我们受够了无法无天的日子，我们想重新成为自由之民。
        - id: ch05-b13
          speaker: bagheera
          text: >-
            不，那不可能。你们吃饱以后，也许又会发疯。你们被称为自由之民，并不是没有缘故。你们为自由争斗，如今自由归你们了。狼群，把这自由吞下去吧。
        - id: ch05-b14
          speaker: mowgli
          text: 人群和狼群都把我赶了出来。往后，我要独自在丛林里狩猎。
        - id: ch05-b15
          speakers: [wolf_1, wolf_2, wolf_3, wolf_4]
          ensemble: chorus
          text: 我们会跟你一起狩猎！
        - id: ch05-b16
          speaker: narrator
          text: >-
            从那一天起，毛克利便同四头幼狼一起在丛林里狩猎，日日结伴穿行在熟悉的林间。不过，他并非一生都独自生活。许多年后，他长成了男人，还娶了妻子。
        - id: ch05-b17
          speaker: narrator
          text: 不过，那是讲给大人听的故事了。
