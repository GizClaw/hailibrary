audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉稳从容，带着古老丛林故事的气息
        timbre: 温暖清晰
        pace: 舒缓而富有变化
        pitch: 中等
    camp_man:
      display_name: 营中人
      tts: {delivery: 仓促惊慌，喊话干脆, timbre: 结实清亮, pace: 快, pitch: 中等}
    billy:
      display_name: 骡子比利
      tts: {delivery: 老练刻薄，嘴硬而自信, timbre: 粗哑结实, pace: 中等偏快, pitch: 中低}
    camel:
      display_name: 行李骆驼
      tts: {delivery: 胆怯讨好，紧张时结结巴巴, timbre: 干涩含混, pace: 忽快忽慢, pitch: 中高}
    troop_horse:
      display_name: 军马
      tts: {delivery: 骄傲端正，带着骑兵的礼貌与锐气, timbre: 清朗有力, pace: 稳健, pitch: 中等}
    young_mule:
      display_name: 年轻骡子
      tts: {delivery: 生涩直率，害怕时急促发颤, timbre: 年轻清亮, pace: 偏快, pitch: 中高}
    bull_one:
      display_name: 一号炮牛
      tts: {delivery: 迟缓固执，说话一本正经, timbre: 低沉厚重, pace: 缓慢, pitch: 低}
    bull_two:
      display_name: 二号炮牛
      tts: {delivery: 迟缓固执，与同伴语气齐整, timbre: 低沉厚重, pace: 缓慢, pitch: 低}
    two_tails:
      display_name: 双尾
      tts: {delivery: 多思敏感，解释时郑重而烦恼, timbre: 深厚浑圆, pace: 舒缓, pitch: 低}
    vixen:
      display_name: 维克森
      tts: {delivery: 机灵神气，吠叫般爽快, timbre: 清脆明亮, pace: 快, pitch: 高}
    old_chief:
      display_name: 中亚老酋长
      tts: {delivery: 威严困惑，问话直截了当, timbre: 苍老浑厚, pace: 缓慢, pitch: 低}
    native_officer:
      display_name: 土著军官
      tts: {delivery: 克制笃定，回答层次分明, timbre: 沉着清晰, pace: 从容, pitch: 中低}
  chapters:
    - id: ch01
      title: 雨夜逃营
      blocks:
        - {id: ch01-b01, speaker: narrator, text: "分数和比例都算得明白，可叮当东的路不是叮当西的径。任你怎么拧、怎么转，编到累倒也没用。皮利·温基走的路，绝不是温基·波普的行。"}
        - id: ch01-b02
          speaker: narrator
          text: 大雨整整下了一个月，昼夜不停地浇着拉瓦尔品第的营地。三万名士兵，连同成千上万的骆驼、大象、马、役牛和骡子，全都挤在那里，等印度总督来检阅。那时阿富汗埃米尔正在来访。他是那片蛮荒之地上的一位蛮悍君主，随行带了八百名护卫和八百匹马。那些人和马来自中亚深处，从没见过军营，也没见过火车头，对周围的一切都很陌生，个个野性十足。
        - id: ch01-b03
          speaker: narrator
          text: 每到夜里，不是马挣断脚绊，在黑暗里踩着泥浆乱冲，就是骆驼脱缰奔跑，绊倒在帐篷绳上。对正想睡觉的人来说，这当然再惬意不过了。我的帐篷离骆驼队很远，我原以为不会出事。偏偏有一晚，一个人猛地把头探进来。
        - {id: ch01-b04, speaker: camp_man, text: "快出来！它们冲过来了！我的帐篷已经叫它们弄没了！", emotion: fearful}
        - id: ch01-b05
          speaker: narrator
          text: 我一听就知道“它们”是谁，赶紧套上靴子和雨衣，蹚进泥水。小猎狐梗维克森从帐篷另一头钻了出去。随即，咆哮、哼唧和咕噜声一起逼近。帐篷杆啪地断了，整顶帐篷塌下来，先瘫成一团，又像发疯的鬼魂一样在黑暗里乱舞。原来有头骆驼直接撞了进来。雨不停往身上浇，我很快从头到脚湿透，心里又恼火，却看着那顶乱跳的帐篷忍不住想笑。可我最后还是拔腿跑了，因为谁也不知道究竟逃出来多少头骆驼，也不知道下一头会从哪边冲来。没过多久，我已经完全看不见营地，只能在没膝的泥水里一步步费力跋涉。
        - id: ch01-b06
          speaker: narrator
          text: 后来我被一门炮的炮尾绊倒，才知道自己大概进了炮兵营。夜里的大炮都停在这里。我不想冒着细雨继续摸黑乱走，就把雨衣搭在炮口上，找两三根推弹杆撑起一个小窝棚，再沿着另一门炮的炮尾躺下。我一面猜维克森去了哪里，一面琢磨自己到底身在何处。
        - id: ch01-b07
          speaker: narrator
          text: 我正要睡着，忽然听见挽具叮当响，还有一声哼气。一头骡子从旁边经过，湿耳朵甩个不停。鞍垫上的皮带、铁环、锁链和零碎物件一路碰响，叫我听出他属于拆装炮队。那种小炮分成两截，使用时才旋接起来。只要骡子能找到路，就能把它驮上山，专在岩石遍地的地方作战。
        - id: ch01-b08
          speaker: narrator
          text: 骡子身后跟着一头骆驼。他柔软的大脚陷进泥里，噗叽噗叽直滑，长脖子来回点着，像只迷路的母鸡。好在我跟当地人学过一点营中牲口的话，所以听得懂他们。那骆驼准是撞倒我帐篷的家伙。
        - {id: ch01-b09, speaker: camel, text: "我怎么办？该往哪边走？刚才有个白东西飘来飘去，非要跟我打架，还拿棍子敲我的脖子。我们还要接着跑吗？", emotion: fearful}
        - {id: ch01-b10, speaker: narrator, text: "那根棍子正是我折断的帐篷杆。知道它打中过骆驼，我心里很是痛快。"}
        - {id: ch01-b11, speaker: billy, text: "原来是你。你和那群朋友闹得全营不得安生，是不是？明早自然有人收拾你，我现在先替他们付一点定金。"}
        - {id: ch01-b12, speaker: narrator, text: "挽具叮当一响，骡子向后退了几步，照骆驼肋骨踢了两下，咚咚响得像敲鼓。"}
        - {id: ch01-b13, speaker: billy, text: "记住了，半夜别一边喊有贼、失火，一边冲进骡炮队。现在坐下，把你那根傻长脖子安顿好。"}
        - id: ch01-b14
          speaker: narrator
          text: 骆驼呜咽着折起身子，像一把两英尺长的折尺。黑暗里又传来整齐的蹄声。一匹高大的军马稳稳小跑而来，仿佛正在受检阅。他越过炮尾，落在骡子旁边。
        - {id: ch01-b15, speaker: troop_horse, text: "真丢脸。那些骆驼又冲进我们的队列了，这星期已经是第三回。觉都睡不成，马还怎么保存体力？谁在这里？"}
        - {id: ch01-b16, speaker: billy, text: "我是第一拆装炮队二号炮的炮尾骡。旁边这位算你的朋友，他也把我吵醒了。你又是谁？"}
        - {id: ch01-b17, speaker: troop_horse, text: "第九枪骑兵团E队十五号，迪克·坎利夫的坐骑。请往旁边让一点。"}
        - {id: ch01-b18, speaker: billy, text: "对不住，黑得什么都看不清。我受不了这些骆驼，正因为想找个安静地方，才离开自己的队伍。"}
        - {id: ch01-b19, speaker: camel, text: "各位老爷，我们夜里做了噩梦，实在怕得要命。我不过是第三十九土著步兵团的一头行李骆驼，哪有各位老爷那么勇敢。", emotion: fearful}
        - {id: ch01-b20, speaker: billy, text: "那你怎么不守着第三十九团的行李，反倒在营里四处乱闯？"}
        - {id: ch01-b21, speaker: camel, text: "那些梦太可怕了。对不起！听，那是什么？我们是不是又该跑了？", emotion: fearful}
        - {id: ch01-b22, speaker: billy, text: "坐稳，不然你那几条长棍腿会折在大炮中间。是牛，拉炮的牛。你们倒真有本事，把全营都吵醒了。平时想让炮牛起身，非拿刺棒狠戳不可。"}
    - id: ch02
      title: 黑暗里的伙伴
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 锁链拖过地面，一对白色大公牛阴沉着脸，并肩挤过来。大象不肯再靠近炮火时，就由这种牛拖沉重的攻城炮。紧跟在锁链后面的，是另一头炮队骡子。他慌慌张张地叫着比利。
        - {id: ch02-b02, speaker: billy, text: "那是我们的新兵。小伙子，别尖声乱叫。黑夜从没伤过谁。"}
        - {id: ch02-b03, speaker: narrator, text: "两头炮牛卧下反刍，年轻骡子却紧贴在比利身旁。"}
        - {id: ch02-b04, speaker: young_mule, text: "那些东西太吓人了，比利！我们睡着时，它们闯进队里。它们会不会杀了我们？", emotion: fearful}
        - {id: ch02-b05, speaker: billy, text: "我真该按最高规格踢你一顿。受过训练、足有十四掌高的骡子，竟敢当着这位先生的面给炮队丢脸！", emotion: angry}
        - {id: ch02-b06, speaker: troop_horse, text: "慢一点。新手起初都这样。我三岁那年还在澳大利亚，第一次看见人，一口气跑了半天。那时若再遇见骆驼，我怕是到今天还没停下。"}
        - {id: ch02-b07, speaker: narrator, text: "英国骑兵的马几乎都从澳大利亚运到印度，再由骑兵亲手驯养。"}
        - {id: ch02-b08, speaker: billy, text: "这话一点没错。别抖了，小伙子。第一次有人把全套挽具连同所有锁链都搭到我背上，我也吓得够呛。我一下倒立在两条前腿上，把身上的每一件东西全踢飞出去。那时候我还没学会真正高明的踢法呢，可炮队的人后来都说，他们活到那么大，从没见过那样一场热闹。所以新手害怕并不稀奇，可你得赶紧学会站稳，别当着外人的面给炮队丢脸。"}
        - {id: ch02-b09, speaker: young_mule, text: "可这次不是挽具，也不是叮当响的东西。那些家伙像树一样，在队里一倒一起，还咕噜直叫。我的笼头绳断了，赶骡人不见了，你也不见了。我只好跟这些先生一起跑。"}
        - {id: ch02-b10, speaker: billy, text: "我听说骆驼逃了，便自己走开。瞧你吓成什么样，连炮牛都叫先生。地上二位，你们是哪一队的？"}
        - {id: ch02-b11, speakers: [bull_one, bull_two], ensemble: duo, text: "重炮队第一门炮的第七对牛。骆驼冲来时踩到了我们，我们便起身离开。与其在好垫草上受打扰，不如安静躺在泥里。我们早告诉你这位朋友没什么可怕，可他见识多，自然另有高见。哇！"}
        - {id: ch02-b12, speaker: narrator, text: "两头牛继续慢吞吞地嚼食团。"}
        - {id: ch02-b13, speaker: billy, text: "看见害怕的下场了吧？现在连炮牛都笑你。小伙子，但愿你喜欢。"}
        - {id: ch02-b14, speaker: narrator, text: "年轻骡子的牙齿咔哒作响。他低声嘀咕，说哪一头满身牛肉的老公牛都吓不住他。炮牛只是把角碰得咔咔响，仍旧嚼个不停。"}
        - {id: ch02-b15, speaker: troop_horse, text: "受过惊以后，可别恼羞成怒。那是最糟的一种胆小。夜里撞见不明白的东西，吓一跳倒情有可原。我这支队里的四百五十匹马，不知道集体逃脱过多少回。有一次，只因为一个新兵说起澳大利亚老家的鞭蛇，整队马都把那故事记在心里。后来谁只要看见笼头绳末端散开的绳头，就以为毒蛇到了脚边，立刻吓得魂飞魄散。所以我不笑你方才害怕。我只劝你，弄明白眼前是什么以后，就别再拿别人撒气。"}
        - {id: ch02-b16, speaker: billy, text: "在营里当然说得轻巧。我若一两天没出去，有时也会为了好玩跟着跑，我可没装作自己从来不跑。可真正上了战场，你怎么办？"}
        - {id: ch02-b17, speaker: troop_horse, text: "那就是另一副新蹄铁了。迪克·坎利夫坐在我背上，用两膝夹住我。我只管看准落脚的地方，把后腿稳稳收在身下，还要听缰。"}
        - {id: ch02-b18, speaker: young_mule, text: "听缰是什么意思？"}
        - {id: ch02-b19, speaker: troop_horse, text: "凭内陆的蓝桉树起誓，你们这一行竟没人教这个？缰绳一压到颈上，就得马上转身，这关系到骑手和你的性命。感觉缰绳来了，收住后腿转过去。地方太窄，就稍稍抬起前身，用后腿原地转。这便是听缰。"}
        - {id: ch02-b20, speaker: billy, text: "我们不这样学。牵头的人叫走就走，叫停就停，结果大概一样。不过你又转又立，尽是些会伤飞节的花样。你到底做什么差事？"}
        - {id: ch02-b21, speaker: troop_horse, text: "那得看当时的情形。通常我要冲进一大群叫喊的长毛人中间。他们手里都有刀，又长又亮，比钉蹄匠用的刀可怕得多。冲锋时，我还得让迪克的靴子正好碰到旁边骑手的靴子，彼此贴紧，却不能把人家的靴子挤坏。我从右眼外侧能看见迪克的长枪，就知道自己在队列里很安全。那时候只须信他的膝盖和缰绳，照他指的方向一直冲。迪克和我真正赶起路来，谁要挡在前面，不管是人还是马，我都替他捏一把汗。"}
        - {id: ch02-b22, speaker: young_mule, text: "那些刀不会砍伤你吗？"}
        - {id: ch02-b23, speaker: troop_horse, text: "我胸口挨过一刀，可那不是迪克的错。"}
        - {id: ch02-b24, speaker: young_mule, text: "伤口要是会疼，我才不管是谁的错！"}
        - {id: ch02-b25, speaker: troop_horse, text: "你非管不可。不相信自己的人，还不如立刻逃走。有些马就是这样，我也不怪他们。那次有个人躺在地上，我伸长身子，想避开不踩他，他却向上挥刀砍我。下回再跨过倒地的人，我会狠狠踩上去。"}
    - id: ch03
      title: 各自的战法
      blocks:
        - {id: ch03-b01, speaker: billy, text: "听着真蠢。刀从来都是肮脏东西。正经本事是背着平衡妥当的驮鞍爬山，四只蹄子牢牢抓地，恨不得连耳朵都来帮忙。一路蹭、爬、扭，钻上高出所有人几百英尺的山脊。那里只容四只蹄子站稳。小伙子，别让人扶你的头。等他们装好炮，再看小炮弹像罂粟花一样落进远处树梢。"}
        - {id: ch03-b02, speaker: troop_horse, text: "你从来不会失足吗？"}
        - {id: ch03-b03, speaker: billy, text: "等骡子失足，母鸡的耳朵也能劈成两半了。装得不好的驮鞍偶尔会把一头骡子弄翻，不过少得很。我真希望你能亲眼看看我们的本事，那才叫漂亮。光弄懂人们想让我们做什么，我就学了三年。诀窍是永远别把身子显在天际线上，不然人家会朝你开枪。记住，小伙子，宁可多绕一英里，也要尽量藏好。遇到这种攀爬，都是我走在前面领着炮队。四只脚下也许只有一小块落脚处，可只要驮子平衡得好，赶骡人肯让我选路，我就能稳稳把炮送上去。"}
        - {id: ch03-b04, speaker: troop_horse, text: "挨枪打，却不能冲向开枪的人？我受不了。我非和迪克一起冲过去不可。"}
        - {id: ch03-b05, speaker: billy, text: "你不会。大炮一到阵地，就会替你冲锋。那才叫科学，干净又利落。至于刀，呸！"}
        - id: ch03-b06
          speaker: narrator
          text: 行李骆驼早把头来回晃了半天，急着插话。他紧张地清了清嗓子。
        - {id: ch03-b07, speaker: camel, text: "我……我也打过一点仗，不过既不爬山，也不奔跑。"}
        - {id: ch03-b08, speaker: billy, text: "看你的模样，确实爬不高，也跑不远。干草包老兄，那你怎么打？"}
        - {id: ch03-b09, speaker: camel, text: "我们用正经办法。大家全都坐下。"}
        - {id: ch03-b10, speaker: troop_horse, text: "坐下？我的鞍尾带和胸带啊！", emotion: surprised}
        - {id: ch03-b11, speaker: camel, text: "整整一百头骆驼坐成大方阵。人们把行李和鞍子堆在外边，站在四面，越过我们的背向外开枪。"}
        - {id: ch03-b12, speaker: troop_horse, text: "什么样的人都能越过你开枪吗？难道随便走来一个也行？骑术学校教过我们卧下，让主人伏在身上开枪，可除了迪克·坎利夫，我谁也不信。枪贴着肚带放出去，弄得我发痒。更糟的是，头贴在地上以后，什么都看不见。我得知道背上的人是谁，也得知道他会照顾我。要我躺在那里，把性命交给一个陌生人，我可办不到。"}
        - {id: ch03-b13, speaker: camel, text: "是谁开的枪，有什么关系？身边全是人和骆驼，到处冒烟。我那时一点不怕，只管坐着等。"}
        - {id: ch03-b14, speaker: billy, text: "可你夜里做个梦，就把全营撞翻了！若要我躺下让人越过身子开枪，我的后蹄准得跟他的脑袋谈一谈。你们听过这么可怕的事吗？"}
        - id: ch03-b15
          speaker: narrator
          text: 大家沉默了很久。后来，一头炮牛抬起沉重的脑袋。
        - {id: ch03-b16, speaker: bull_one, text: "这些话都很愚蠢。打仗只有一个办法。"}
        - {id: ch03-b17, speaker: billy, text: "请说，千万别顾忌我。我猜是用尾巴站着打吧？"}
        - {id: ch03-b18, speakers: [bull_one, bull_two], ensemble: duo, text: "只有一个办法。双尾一鸣叫，人们立刻把二十对牛套到大炮上。"}
        - {id: ch03-b19, speaker: young_mule, text: "双尾为什么要鸣叫？"}
        - {id: ch03-b20, speakers: [bull_one, bull_two], ensemble: duo, text: "因为他不肯再靠近对面的硝烟。双尾是个大懦夫。他一叫，人们便把二十对牛全套到大炮上。我们一齐拖炮，嗨呀，呼啦！嗨呀，呼啦！我们不像猫那样爬，也不像牛犊那样跑。二十对牛并肩走过平坦的原野，一直把沉重的大炮拖到指定的地方，等人们替我们卸下轭。然后我们低头吃草，大炮隔着整片平原，向一座泥墙城开口说话。墙上的泥一块块落下，尘烟升起来，看着就像有许多牛正踏着尘土回家。"}
        - {id: ch03-b21, speaker: young_mule, text: "那时候你们还吃草？"}
        - {id: ch03-b22, speakers: [bull_one, bull_two], ensemble: duo, text: "那时吃，别的时候也吃。吃总是好事。等再次上轭，我们把炮拖回双尾那里。有时城里的炮也回话，我们中便有一些死去，剩下的反而多些草。这就是命。双尾还是个懦夫。我们来自哈普尔，父亲是湿婆神的圣牛。话说完了。"}
        - {id: ch03-b23, speaker: troop_horse, text: "今晚真长见识。拆装炮队的先生，前方重炮向你们开火，双尾又在后面，你们还吃得下吗？"}
        - {id: ch03-b24, speaker: billy, text: "就跟卧下任人乱爬，或冲向刀群时一样吃不下。我只要一道山脊、一副好驮子，再有一个信我选路的赶骡人。其他那些事，绝对不干。"}
        - {id: ch03-b25, speaker: troop_horse, text: "大家本来就不是照同一个模子造的。我看得出来，你父亲那边的亲族，有许多事大概理解不了。"}
        - {id: ch03-b26, speaker: billy, text: "别提我父亲那边！我父亲是南方绅士，随便碰上哪匹马，都能把对方扑倒，连咬带踢，撕成破布。记住了，你这匹棕色大野马！", emotion: angry}
        - id: ch03-b27
          speaker: narrator
          text: 每头骡子都恨别人提醒他父亲是驴。“布伦比”又是没有血统的野马。就像拉车马把名马苏诺尔叫作驽马，那匹澳大利亚军马听后，眼白立刻在暗处闪了一下。
        - {id: ch03-b28, speaker: troop_horse, text: "听好，你这头进口马拉加公驴的儿子。论母系，我和墨尔本杯冠军卡宾有亲缘。在我的家乡，谁也不能叫一头鹦鹉嘴、猪脑袋、待在爆米花小炮队里的骡子骑到头上。准备好了吗？", emotion: angry}
        - {id: ch03-b29, speaker: billy, text: "用后腿站起来！", emotion: angry}
        - id: ch03-b30
          speaker: narrator
          text: 两个家伙同时扬起前身，面对面站着。眼看恶战要开始，右边黑暗里却传来低沉的咕噜声。
        - {id: ch03-b31, speaker: two_tails, text: "孩子们，你们争什么呢？安静一点。"}
        - id: ch03-b32
          speaker: narrator
          text: 马和骡子厌恶地喷着鼻息，四蹄一起落地。它们都受不了大象的嗓音。
    - id: ch04
      title: 恐惧和命令
      blocks:
        - {id: ch04-b01, speaker: troop_horse, text: "是双尾！我受不了他。一头一尾才公平，两头各有一条算什么？"}
        - {id: ch04-b02, speaker: billy, text: "我也是这么想。有些地方，我们俩很相像。"}
        - {id: ch04-b03, speaker: troop_horse, text: "想必都从母亲那里得来，不值得为此打架。双尾，你拴住了吗？"}
        - {id: ch04-b04, speaker: two_tails, text: "拴着。今晚系在桩上。你们的话我全听见了，不过放心，我不会走过去。"}
        - {id: ch04-b05, speakers: [bull_one, bull_two], ensemble: duo, text: "怕双尾？真是胡说。抱歉叫你听见，不过那是实话。双尾，开炮时你为什么害怕？"}
        - {id: ch04-b06, speaker: two_tails, text: "这个嘛，我不确定你们能不能懂。"}
        - {id: ch04-b07, speaker: bull_one, text: "我们不懂，却还得拖炮。"}
        - {id: ch04-b08, speaker: two_tails, text: "我知道。你们其实比自己想的勇敢。我不同。前几天炮队长说我是厚皮类时代错置物。"}
        - {id: ch04-b09, speaker: billy, text: "那也是一种打法吗？"}
        - {id: ch04-b10, speaker: two_tails, text: "你不懂这个词，我懂。它说我卡在两头中间。炮弹爆炸会怎样，我能先在脑袋里看见，你们这些牛看不见。"}
        - {id: ch04-b11, speaker: troop_horse, text: "我也能看见一点，只是尽量不想。"}
        - {id: ch04-b12, speaker: two_tails, text: "我看得比你多，而且我偏会去想。我知道自己这么大的身子，无论走到哪里都得小心。一颗炮弹落下来会怎样，我还没走近就能在脑袋里看清。我也知道，自己一旦病倒，根本没人懂得怎样医治。人们只会扣掉象夫的工钱，一直扣到我恢复。可我偏偏信不过自己的象夫。所以炮火一响，我脑子里装着所有可能发生的事，脚下却还得听命令往前走。"}
        - {id: ch04-b13, speaker: troop_horse, text: "这就说得通了。我信迪克。"}
        - {id: ch04-b14, speaker: two_tails, text: "就算把一团的迪克放在我背上，也没用。我懂得刚好足以难受，却没懂到能不顾一切冲过去。"}
        - {id: ch04-b15, speakers: [bull_one, bull_two], ensemble: duo, text: "我们还是不懂。"}
        - {id: ch04-b16, speaker: two_tails, text: "我知道。我不是在和你们说。你们连血是什么都不知道。"}
        - {id: ch04-b17, speakers: [bull_one, bull_two], ensemble: duo, text: "我们知道。红红的，会渗进地里，还有气味。"}
        - id: ch04-b18
          speaker: narrator
          text: 军马猛地踢跳起来，喷了声鼻息。
        - {id: ch04-b19, speaker: troop_horse, text: "别提它。我现在一想就闻得到。迪克若不在背上，那味道会叫我逃跑。"}
        - {id: ch04-b20, speakers: [camel, bull_one, bull_two], ensemble: chorus, text: "这里根本没有血，你为什么这么蠢？"}
        - {id: ch04-b21, speaker: billy, text: "那东西确实恶心。我不想跑，也不想谈。"}
        - {id: ch04-b22, speaker: two_tails, text: "你们看！"}
        - {id: ch04-b23, speaker: bull_one, text: "当然看见了。我们整夜都在这里。"}
        - {id: ch04-b24, speaker: two_tails, text: "我没和你们说话。你们不会在脑袋里看东西。"}
        - {id: ch04-b25, speakers: [bull_one, bull_two], ensemble: duo, text: "不会。我们用四只眼睛朝外看，一直看正前方。"}
        - {id: ch04-b26, speaker: two_tails, text: "我要也只能用眼睛看正前方，根本就用不着你们替我拖炮了。可我想起的，是炮队长那种聪明。他在开炮前就能在脑袋里看见一切，明明吓得浑身发抖，却又懂得太多，所以不会逃跑。我要像他一样，就能自己拖炮。可我要真有那么聪明，压根不会留在这里。我会回到从前的森林，继续做国王。白天睡掉一半，什么时候想洗澡就什么时候洗。你们知道吗，我已经整整一个月没痛痛快快洗过澡了。"}
        - {id: ch04-b27, speaker: billy, text: "说得漂亮。可给一件事起个长名字，也不会叫它好受一点。"}
        - {id: ch04-b28, speaker: troop_horse, text: "嘘，我想我懂双尾的意思。"}
        - {id: ch04-b29, speaker: two_tails, text: "再过一会儿，你会懂得更清楚。先解释一下，你为什么不喜欢这个！赫哼！噜噜！噜噜哼！噜哈！", emotion: angry}
        - id: ch04-b30
          speaker: narrator
          text: 双尾扯开嗓门狂叫，那声音一下冲进黑夜。比利和军马刚才还摆出一副什么都不怕的模样，这时却一齐跺脚，浑身发抖。大象的鸣叫向来刺耳，到了看不见东西的深夜里，更叫听者不知道那声音会从哪里扑来，也难怪马和骡子都受不了。
        - {id: ch04-b31, speakers: [billy, troop_horse], ensemble: duo, text: "住口！", emotion: fearful}
        - id: ch04-b32
          speaker: narrator
          text: 双尾忽然停下。暗处传来细小的呜咽，维克森终于找到我了。她和我一样明白，最能吓坏大象的是一条汪汪叫的小狗。她绕着双尾的巨足又跑又叫，专心欺负这头拴住的大象。
        - {id: ch04-b33, speaker: two_tails, text: "走开，小狗！别闻我的脚腕，不然我真要踢你了。好狗狗，乖乖的小狗，快回家去吧！别绕着我的脚跑，你这个乱叫的小坏蛋！哎呀，怎么没有人来把她带走？她离我越来越近了，马上就要咬我啦！我已经拴在桩上，根本没法避开。快叫她走，别让她碰我的腿！", emotion: fearful}
        - {id: ch04-b34, speaker: billy, text: "依我看，双尾什么都怕。要是每踢过一条阅兵场上的狗就能吃一顿，我也快胖得和他一样了。"}
        - id: ch04-b35
          speaker: narrator
          text: 我吹了声口哨，维克森立刻跑过来。她从头到脚沾满泥浆，先舔了舔我的鼻子，接着滔滔不绝地讲起自己怎样搜遍整个营地，才终于找到我。我从来不肯让她知道，我其实听得懂兽语。她若知道这个秘密，准会觉得自己什么话都能对我说，从此放肆得无法无天。我把她扣在大衣胸前，不让她再去追双尾。那头大象仍在原地拖步、跺脚，一面用鼻子四处摸索，一面独自咕哝。
        - {id: ch04-b36, speaker: two_tails, text: "真怪，这是我们家族的毛病。那个讨厌的小东西去哪里了？看来大家都有自己的毛病。刚才我叫的时候，各位先生好像受惊了。"}
        - {id: ch04-b37, speaker: troop_horse, text: "说不上真怕，只像一窝黄蜂钻进该放鞍子的地方。别再来一次。"}
        - {id: ch04-b38, speaker: two_tails, text: "我怕小狗，骆驼怕夜里的梦。"}
        - {id: ch04-b39, speaker: troop_horse, text: "幸好我们不必用同一种办法打仗。"}
        - {id: ch04-b40, speaker: young_mule, text: "我只想知道，我们为什么非打仗不可？"}
        - {id: ch04-b41, speaker: troop_horse, text: "因为有人命令。"}
        - {id: ch04-b42, speaker: billy, text: "命令。"}
        - {id: ch04-b43, speakers: [camel, two_tails, bull_one, bull_two], ensemble: chorus, text: "胡克姆·海！这是命令！"}
        - {id: ch04-b44, speaker: young_mule, text: "可是谁下的命令？"}
        - {id: ch04-b45, speakers: [billy, troop_horse, camel, bull_one], ensemble: chorus, text: "走在你前面的人，骑在你背上的人，牵你鼻绳的人，拧你尾巴的人。"}
        - {id: ch04-b46, speaker: young_mule, text: "那又是谁命令他们？"}
        - {id: ch04-b47, speaker: billy, text: "小伙子，你问得太多，容易挨踢。服从前面的人，别问。"}
        - {id: ch04-b48, speaker: two_tails, text: "比利说得对。我卡在两头之间，不能次次服从。可你得听身边下令的人，否则整支炮队都会停住，你还要挨鞭子。"}
        - {id: ch04-b49, speakers: [bull_one, bull_two], ensemble: duo, text: "天快亮了，我们要归队。我们只用眼睛向外看，也不聪明。不过今晚只有我们没怕过。晚安，勇敢的各位。"}
    - id: ch05
      title: 女王陛下的仆役
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 没谁回答炮牛。军马为了换个话题，问那条小狗在哪里，说有狗的地方一定有人。
        - {id: ch05-b02, speaker: vixen, text: "我就在炮尾下面，和主人在一起。你这头又大又笨的骆驼撞翻了我们的帐篷，我主人气坏了。"}
        - {id: ch05-b03, speaker: bull_one, text: "他一定是白人！", emotion: fearful}
        - {id: ch05-b04, speaker: vixen, text: "当然。难道你们以为照料我的是黑皮肤的赶牛人？"}
        - {id: ch05-b05, speakers: [bull_one, bull_two], ensemble: duo, text: "快走！", emotion: fearful}
        - id: ch05-b06
          speaker: narrator
          text: 两头牛猛冲进泥里，竟把牛轭卡进弹药车的车杆，再也动不了。
        - {id: ch05-b07, speaker: billy, text: "这下闯祸了。别挣，天亮前只能挂在那里。你们到底怎么了？"}
        - id: ch05-b08
          speaker: narrator
          text: 炮牛发出长长的嘶鸣，推挤扭动，在泥里滑来跌去，险些摔倒。
        - {id: ch05-b09, speaker: troop_horse, text: "你们快把脖子折断了。白人有什么可怕？我就和他们一起住。"}
        - {id: ch05-b10, speaker: bull_one, text: "他们吃我们！用力拉！", emotion: fearful}
        - id: ch05-b11
          speaker: narrator
          text: 牛轭啪地断了，两头牛一同笨重地跑远。直到这时，我才明白印度牛为什么怕英国人。赶牛人不碰牛肉，我们却吃，牛当然不喜欢。
        - {id: ch05-b12, speaker: billy, text: "谁猜得到两块这么大的肉也能吓得失去理智？我要早知道，就叫人拿我的鞍垫锁链抽我。"}
        - {id: ch05-b13, speaker: troop_horse, text: "别理他们，我去看看这个人。我认识的白人，口袋里大多有好东西。"}
        - {id: ch05-b14, speaker: billy, text: "那我就告辞了。我自己也不大喜欢白人。再说，一个连睡处都没有的白人，多半是个贼，而我背上带着不少政府财产。走吧，小伙子，我们回队里去。晚安，澳大利亚，明天阅兵时大概还会见面。晚安，老干草包，尽量管好你的情绪，别再梦见什么就到处乱撞。晚安，双尾。明天地面阅兵时若从我们旁边经过，千万别又扯开嗓门鸣叫。大家都得踩准步子，你那一声会把整条队形弄乱。"}
        - id: ch05-b15
          speaker: narrator
          text: 比利迈步离开了。他带着那种久经沙场的老兵才有的架势，就算腿有点跛，走起来仍旧神气十足。军马没有立刻走。他把头探到我胸前，闻到口袋里的东西，我便拿出几块饼干喂给他。自负得不得了的维克森站在旁边，马上向这位骑兵吹嘘起来，说我和她共同养着几十匹马，仿佛那些马全归她指挥。
        - {id: ch05-b16, speaker: vixen, text: "明天我要坐狗拉小车看阅兵。你在哪儿？"}
        - {id: ch05-b17, speaker: troop_horse, text: "第二中队左侧。我替全队掌握步调，小姐。现在得回迪克那里了。我尾巴全是泥，他要梳洗两个钟头，才能让我参加阅兵。"}
        - id: ch05-b18
          speaker: narrator
          text: 第二天下午，三万名士兵参加大阅兵。维克森和我占了个好位置，离总督和阿富汗埃米尔很近。埃米尔戴着又高又大的黑色阿斯特拉罕羔羊皮帽，帽子正中缀着一颗硕大的钻石星章。阅兵前半段阳光灿烂。一个团接一个团从眼前经过，无数条腿同时抬起，又同时落下，像一重接一重涌来的波浪。骑兵、步兵和炮队各守着自己的位置，大炮也排成笔直的行列，一眼望过去，整齐得叫人眼花。
        - id: ch05-b19
          speaker: narrator
          text: 随后，骑兵伴着优美的《美丽的邓迪》小跑而来。维克森端端正正坐在狗拉小车上，竖起一只耳朵留神听着。枪骑兵第二中队从眼前飞驰过去，那匹军马果然就在其中，正处在他昨夜所说的中队左侧。他的尾巴已经被迪克梳洗得像纺好的丝线，头颈漂亮地收向胸前。一只耳朵向前，一只耳朵向后，他一面看路，一面听着身后的队伍，替整个中队掌握步调。四条腿运转得平稳又轻快，就像一支流畅的华尔兹舞曲。
        - id: ch05-b20
          speaker: narrator
          text: 接着轮到重炮。我清楚看见双尾和另外两头大象排成一列，套在一门四十磅攻城炮前。大象身后还跟着整整二十对公牛，昨夜那第七对已经换上新轭，走起路来显得有些僵硬，也有些疲倦。最后经过的是拆装炮队。骡子比利昂首阔步，神气得仿佛全军都由他统率。他身上的挽具上足了油，每一处都擦得闪闪发亮。我认出他来，独自大声替他欢呼，可这位老兵始终目不斜视，仿佛根本没听见。
        - id: ch05-b21
          speaker: narrator
          text: 雨又落下来。一时间雾浓得很，谁也看不清部队究竟在做什么。他们先横过平原，排成一个巨大的半圆，接着再向两边展开，成为一条笔直的长线。从这一翼到另一翼，足有四分之三英里，远远看去，像一道由人、马和大炮共同筑起的坚墙。那条线还在不断拉长，各支队伍却始终守着各自的位置，一刻也没有散乱。随后，整条战线保持着笔直的队形，一步一步朝总督和埃米尔压来。距离越近，脚下的大地震得越厉害，仿佛人正站在一艘开足马力的蒸汽船甲板上。
        - id: ch05-b22
          speaker: narrator
          text: 要是没有亲眼见过，你绝想不到这支稳步逼近的大军会让观众多么害怕，即使人人都明白，这不过是一场阅兵。那不是一群人各自走来，而是一整面严密的墙不断靠近，脚步、马蹄和车轮又让大地一起发抖。我转头去看埃米尔。直到那一刻，他脸上还没有半点惊讶，也看不出别的神情。可军阵继续压来，他的眼睛越睁越大，忽然伸手抄起马颈上的缰绳，又赶紧回头察看身后。有那么一会儿，他仿佛真要拔出刀，从后方马车里的英国男人和女人中间砍开一条退路。
        - id: ch05-b23
          speaker: narrator
          text: 就在那一刻，整支大军忽然停住。推进戛然而止，刚才还不断震动的大地也随之安静下来。人、马、大象、公牛、骡子和一门门大炮，全都在命令到来的同一刻守住位置。那道漫长的阵线一齐敬礼，动作整齐得像同一个人。紧接着，三十支军乐队同时奏响，声音盖过雨声，阅兵到这里才算结束。一个个团重新转向，在雨中返回各自的营地。方才那堵令人害怕的坚墙，又依照各自的队列有条不紊地散开。其中一支步兵军乐队边走边奏起一首歌。
        - id: ch05-b24
          speakers: [camp_man, native_officer, old_chief]
          ensemble: chorus
          text: 动物成双又成对，万岁！动物成双又成对，大象带着炮队骡，大家都进方舟里，躲开雨水！
        - id: ch05-b25
          speaker: narrator
          text: 随后，我听见一位随埃米尔而来的中亚老酋长问土著军官。他头发灰白，长发披在肩上。
        - {id: ch05-b26, speaker: old_chief, text: "告诉我，这样的奇观到底怎么办成？"}
        - {id: ch05-b27, speaker: native_officer, text: "命令一下，他们就服从。"}
        - {id: ch05-b28, speaker: old_chief, text: "这些牲口也像人一样聪明吗？"}
        - id: ch05-b29
          speaker: native_officer
          text: 它们和人一样懂得服从。骡子、马、大象和公牛，都服从驾驭它们的人。驾驭者再服从军士，军士服从中尉，中尉服从上尉，上尉服从少校，少校服从上校。上校听命于统领三个团的旅长，旅长服从将军，将军服从总督。就连总督也不是随心所欲，因为总督是女王陛下的仆役。命令就这样一级一级传下来，每一个人和每一头牲口都守住自己的位置。眼前这番奇观，就是这样办成的。
        - {id: ch05-b30, speaker: old_chief, text: "但愿阿富汗也能这样！我们那里，人人只服从自己的意愿。"}
        - id: ch05-b31
          speaker: narrator
          text: 土著军官捻着胡子，回答了他。
        - {id: ch05-b32, speaker: native_officer, text: "正因为这样，你们不肯服从的埃米尔才不得不到这里，听我们的总督下令。"}
