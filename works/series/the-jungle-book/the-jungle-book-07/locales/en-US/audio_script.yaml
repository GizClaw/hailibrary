  chapters:
    - id: ch01
      title: Her Majesty's Servants
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "You may solve it with fractions or a simple rule of three, but Tweedle-dum's way is not Tweedle-dee's. Twist it, turn it, plait it till you drop, and still Pilly Winky's way is not the way of Winkie Pop."
        - id: ch01-b02
          speaker: narrator
          text: "Rain had poured for a whole month on a camp at Rawal Pindi. Thirty thousand men were gathered there with thousands of camels, elephants, horses, bullocks, and mules, all waiting for the Viceroy of India to review them. The Viceroy was receiving the Amir of Afghanistan, a wild king from a very wild country. The Amir had brought a bodyguard of eight hundred men and horses from somewhere at the back of Central Asia. Neither the savage men nor their savage horses had ever seen a camp or a locomotive in all their lives."
        - id: ch01-b03
          speaker: narrator
          text: "Every night some of those strange horses were certain to break their heel ropes. Then a whole mob would stampede up and down through the muddy camp in the dark. On other nights, the camels broke loose instead. They ran among the tents, tripped over the ropes, and fell across them. You can imagine how pleasant all of that was for men who were trying to sleep. My own tent stood far from the camel lines, so I thought it was safe. Then, one night, a man suddenly thrust his head inside."
        - id: ch01-b04
          speaker: camp_man
          text: "Get out, quick! They're coming! My tent is down!"
          emotion: fearful
        - id: ch01-b05
          speaker: narrator
          text: "I knew exactly who he meant. I pulled on my boots and waterproof and scrambled into the slush. Little Vixen, my fox terrier, slipped out the other side. Behind us came roaring, grunting, and bubbling. The tent pole snapped, the canvas fell in, and the whole thing danced like a mad ghost. A camel had blundered straight into it. Wet and angry as I was, I had to laugh. Then I ran, because I had no idea how many camels were loose. Soon the camp had vanished behind me, and I was plowing alone through the mud."
        - id: ch01-b06
          speaker: narrator
          text: "At last I tripped over the tail of a gun. That told me I had reached the artillery lines, where the cannon were parked for the night. I had had enough of wandering through drizzle and darkness. I spread my waterproof over one gun's muzzle, propped it up with two or three rammers, and made myself a little shelter. Then I lay along the tail of another gun, wondering where Vixen was and where I was myself."
        - id: ch01-b07
          speaker: narrator
          text: "Just as I was settling down to sleep, harness jingled and an animal grunted. A mule went past, shaking his wet ears. The straps, rings, and chains rattling on his saddle pad told me he belonged to a screw-gun battery. Screw-guns are small cannon made in two pieces. The pieces travel on mules and are screwed together when the time comes to use them. Wherever a mule can find a mountain road, those guns can go, which makes them very useful in rocky country."
        - id: ch01-b08
          speaker: narrator
          text: "A camel followed him. His broad, soft feet slipped and squelched, and his neck bobbed like the neck of a lost hen. Luckily, people in the camp had taught me enough camp-beast language to understand him. This was not the language of wild animals, of course. The camel sounded very much like the one that had fallen into my tent."
        - id: ch01-b09
          speaker: baggage_camel
          text: "What am I to do? Where can I go? I fought a white thing that waved at me, and it struck my neck with a stick. Should we keep running?"
          emotion: fearful
        - id: ch01-b10
          speaker: narrator
          text: "The stick had been my broken tent pole, and I was glad to learn what had happened to it."
        - id: ch01-b11
          speaker: billy
          text: "So it was you and your friends making all that trouble. You'll be beaten for it in the morning. I might as well give you something in advance."
        - id: ch01-b12
          speaker: narrator
          text: "Harness rattled as the mule backed up. He landed two kicks on the camel's ribs, and they rang like blows on a drum."
        - id: ch01-b13
          speaker: billy
          text: "Next time, don't race through a mule battery at night yelling about thieves and fire. Sit down now, and hold that foolish neck still."
        - id: ch01-b14
          speaker: narrator
          text: "The camel folded himself like a two-foot ruler and sat whimpering. Hoofs began beating steadily through the dark. A large troop horse cantered up as evenly as if he were on parade, cleared the tail of a gun, and came down beside the mule."
        - id: ch01-b15
          speaker: troop_horse
          text: "This is disgraceful. Those camels have crashed through our lines again, for the third time this week. How can a horse stay fit if he never gets any sleep? Who is here?"
        - id: ch01-b16
          speaker: billy
          text: "I'm the breech-piece mule for number two gun in the First Screw Battery. This other fellow is one of your camel friends, and he woke me too. Who are you?"
        - id: ch01-b17
          speaker: troop_horse
          text: "Number Fifteen, E Troop, Ninth Lancers. I belong to Dick Cunliffe. Move over a little, please."
        - id: ch01-b18
          speaker: billy
          text: "Beg your pardon. It's hard to see in this dark. Aren't these camels unbearable? I left my own lines hoping to find some peace and quiet here."
        - id: ch01-b19
          speaker: baggage_camel
          text: "My lords, we had terrible dreams, and they frightened us badly. I am only a baggage camel of the Thirty-ninth Native Infantry. I am not brave like you, my lords."
          emotion: fearful
        - id: ch01-b20
          speaker: billy
          text: "Then why didn't you stay with the Thirty-ninth and carry its baggage? Why run all over camp?"
        - id: ch01-b21
          speaker: baggage_camel
          text: "The dreams were so dreadful. I am sorry. Listen! What is that sound? Should we run again?"
          emotion: fearful
        - id: ch01-b22
          speaker: billy
          text: "Sit down, or you'll break those long stick legs among the guns."
        - id: ch01-b23
          speaker: narrator
          text: "Billy raised one ear and listened."
        - id: ch01-b24
          speaker: billy
          text: "Bullocks. Gun bullocks. You and your friends have certainly awakened the whole camp. It takes plenty of poking to make a gun bullock get up."
        - id: ch01-b25
          speaker: narrator
          text: "A chain dragged noisily over the ground. Two huge, sullen white bullocks shouldered toward us together under one yoke. They were the animals that hauled the heavy siege guns whenever the elephants refused to go any closer to the firing. Another battery mule followed so closely that he almost stepped on their dragging chain, and all the while he was calling wildly for Billy."
        - id: ch01-b26
          speaker: billy
          text: "That's one of our new recruits. He's looking for me. Here, youngster, stop squealing. The dark has never harmed anyone."
        - id: ch01-b27
          speaker: narrator
          text: "The bullocks lay down together and began chewing their cud. The young mule pressed himself close to Billy."
        - id: ch01-b28
          speaker: young_mule
          text: "Things came into our lines, Billy. Awful, horrible things! We were asleep when they came. Do you think they'll kill us?"
          emotion: fearful
        - id: ch01-b29
          speaker: billy
          text: "I ought to give you a first-class kicking. A fourteen-hand mule with your training, shaming the battery in front of this gentleman!"
          emotion: angry
        - id: ch01-b30
          speaker: troop_horse
          text: "Easy, easy. They all begin this way. When I was three years old in Australia, I saw a man for the first time and ran for half a day. If I had seen a camel too, I might still be running."
        - id: ch01-b31
          speaker: narrator
          text: "Most horses used by the English cavalry in India come from Australia. The troopers break them in themselves."
        - id: ch01-b32
          speaker: billy
          text: "That's true enough. Stop trembling, youngster. The first time they loaded me with full harness and all its chains, I stood on my forelegs and kicked every piece off. I didn't yet understand the real art of kicking, but the battery said it had never seen anything like it."
        - id: ch01-b33
          speaker: young_mule
          text: "But these weren't straps or jingling things. Those don't bother me now. These Things were tall as trees. They swayed and bubbled all through our lines. My head rope broke, and I couldn't find my driver. I couldn't find you either, Billy, so I ran away with these gentlemen."
          emotion: fearful
        - id: ch01-b34
          speaker: billy
          text: "Hmm. The moment I heard that camels were loose, I left on my own account. Still, a screw-gun mule must be badly shaken if he calls gun bullocks gentlemen. Who are you two lying there?"
        - id: ch01-b35
          speakers: [near_bullock, off_bullock]
          ensemble: duo
          text: "We are the seventh yoke of the first gun in the Big Gun Battery. We were asleep when the camels arrived. Once they trampled us, we rose and walked away. Quiet mud is better than fine bedding where no one lets you rest. We told your young friend there was no danger, but he thought he knew better. Wah!"
        - id: ch01-b36
          speaker: narrator
          text: "The bullocks calmly went on chewing."
        - id: ch01-b37
          speaker: billy
          text: "That's what fear brings you, youngster. Even gun bullocks laugh at you. I hope you're pleased."
        - id: ch01-b38
          speaker: narrator
          text: "The young mule snapped his teeth and muttered that no fat old bullock in the world frightened him. The bullocks merely knocked their horns together and kept chewing."
        - id: ch01-b39
          speaker: troop_horse
          text: "Don't turn angry just because you were afraid. That's cowardice at its worst. Anyone may be forgiven for a fright in the dark when something makes no sense. Four hundred and fifty of us have broken out more than once. All it took was one new horse telling stories about Australian whip snakes until the loose ends of our own head ropes terrified us."
        - id: ch01-b40
          speaker: billy
          text: "That is all very well in camp. I don't mind joining a stampede myself for the fun of it, especially when I have not been out for a day or two. Active service is different. What do you do then?"
        - id: ch01-b41
          speaker: troop_horse
          text: "That's a different matter altogether. Dick Cunliffe is on my back then, with his knees pressed against me. I only need to mind my footing, keep my hind legs well under me, and answer the rein properly."
        - id: ch01-b42
          speaker: young_mule
          text: "What does answering the rein mean?"
        - id: ch01-b43
          speaker: troop_horse
          text: "By the Blue Gums of the Back Blocks! Don't they teach that in your work? When the rein touches your neck, you must wheel around at once. Your man's life depends on it, so yours does too. Keep your hind legs beneath you and turn the instant you feel that pressure. If there isn't room, rise a little and swing around on your hind legs. That's being bridle-wise."
        - id: ch01-b44
          speaker: billy
          text: "That isn't our training. We obey the man walking at our head. We move when he tells us and stop when he tells us. I suppose the result is much the same. But with all that fancy wheeling and rearing, which cannot be good for your hocks, what do you actually do?"
        - id: ch01-b45
          speaker: troop_horse
          text: "Usually I charge among shouting, hairy men carrying long, bright knives, worse than a farrier's knives. I keep Dick's boot just touching the next rider's boot without crushing it. When I can see Dick's lance beside my right eye, I know all is well. I wouldn't want to be the man or horse facing Dick and me when we're moving fast."
        - id: ch01-b46
          speaker: young_mule
          text: "Don't those knives hurt?"
        - id: ch01-b47
          speaker: troop_horse
          text: "One of those knives cut me across the chest once. That was not Dick's fault, though."
        - id: ch01-b48
          speaker: young_mule
          text: "If it hurt, I wouldn't care whose fault it was!"
        - id: ch01-b49
          speaker: troop_horse
          text: "You have to care about whose fault it is. If you do not trust your man, you may as well turn and run away at once. Some horses in our ranks do exactly that, and I cannot blame them. As I was saying, the cut truly was not Dick's fault. The man who struck me was lying on the ground. I stretched myself out because I did not want to tread on him, and he slashed upward across my chest. The next time I have to pass over a man who is lying down, I shall put my hoof on him hard."
        - id: ch01-b50
          speaker: billy
          text: "Hmm. It sounds foolish. Knives are nasty things at any time. Proper work means climbing a mountain with a well-balanced saddle. You cling with all four feet and your ears besides. You creep, crawl, and wriggle along until you come out hundreds of feet above everyone else, on a ledge barely wide enough for your hoofs. Then you stand perfectly still and keep quiet. Never ask a man to hold your head, youngster. Keep quiet while the men put the guns together. After that, you watch their little poppy shells fall into the treetops ever so far below."
        - id: ch01-b51
          speaker: troop_horse
          text: "Do you never stumble?"
        - id: ch01-b52
          speaker: billy
          text: "They say that when a mule stumbles, you can split a hen's ear. Now and then, a badly packed saddle may throw a mule off balance, but that happens very seldom. I wish I could show you our work for yourself. It is beautiful. Why, it took me three full years to understand what the men were trying to do. The great secret is never to let yourself show against the skyline. If you do, the enemy may fire at you. Remember that, youngster. Always keep yourself hidden as much as you can, even when hiding means going a whole mile out of your way. When the battery faces that kind of climb, I am the mule who leads it."
        - id: ch01-b53
          speaker: troop_horse
          text: "They fire at you, and you cannot charge the ones doing it? I could never bear that. I would need to rush them with Dick."
        - id: ch01-b54
          speaker: billy
          text: "No, you wouldn't. Once the guns are ready, they do all the charging for you. It is tidy, scientific work. But knives? Pah!"
        - id: ch01-b55
          speaker: narrator
          text: "The baggage camel had been nodding and weaving his head, eager to speak. At last he nervously cleared his throat."
        - id: ch01-b56
          speaker: baggage_camel
          text: "I have done a little fighting too, though not by climbing or running."
        - id: ch01-b57
          speaker: billy
          text: "Now that you mention it, you don't look built for much climbing or running. So how did you fight, old Hay-bales?"
        - id: ch01-b58
          speaker: baggage_camel
          text: "In the proper way. We all sat down."
        - id: ch01-b59
          speaker: troop_horse
          text: "Oh, my crupper and breastplate. You sat down?"
          emotion: surprised
        - id: ch01-b60
          speaker: baggage_camel
          text: "A hundred of us sat down together in one large square. The men took off our packs and saddles and piled them all around the outside of that square. Then the men stood along every side and fired their weapons over our backs."
        - id: ch01-b61
          speaker: troop_horse
          text: "What men? Any men who happened along? At riding school they teach us to lie down while our masters fire across us, but Dick Cunliffe is the only man I would trust. It tickles around my girths, and with my head down I cannot see."
        - id: ch01-b62
          speaker: baggage_camel
          text: "Why should it matter which man fires across you? There are plenty of men nearby, plenty of other camels close beside me, and a great many thick clouds of smoke. At a time like that I am not frightened. I sit perfectly still among the others, and I wait."
        - id: ch01-b63
          speaker: billy
          text: "Yet at night you dream and turn the camp upside down. Well, well. Before I let a man fire across me while I lay or sat, my heels would have a meeting with his head. Have you ever heard anything so dreadful?"
        - id: ch01-b64
          speaker: narrator
          text: "For a long moment nobody spoke. Then one bullock raised his broad head."
        - id: ch01-b65
          speaker: near_bullock
          text: "All this is extremely foolish. There is only one proper way to fight."
        - id: ch01-b66
          speaker: billy
          text: "Please, go ahead. Don't let me stop you. Do you fellows fight while standing on your tails?"
        - id: ch01-b67
          speakers: [near_bullock, off_bullock]
          ensemble: duo
          text: "There is only one way. When Two Tails trumpets, all twenty yoke of us are fastened to the big gun."
        - id: ch01-b68
          speaker: narrator
          text: "The two bullocks must have been twins. They spoke as one. Two Tails was the camp name for the elephant."
        - id: ch01-b69
          speaker: young_mule
          text: "Why does Two Tails trumpet?"
        - id: ch01-b70
          speakers: [near_bullock, off_bullock]
          ensemble: duo
          text: "He is saying that he will go no closer to the smoke on the other side. Two Tails is a great coward. Then all twenty yoke of us lean into the big gun and pull together. Heya, hullah! Heeyah, hullah! We don't climb like cats or race like calves. We go straight across the level plain, forty bullocks together, until the men unyoke us. Then we graze while the great guns speak across the plain to a mud-walled town. Pieces tumble from the walls, and the dust rises as if a great herd of cattle were coming home."
        - id: ch01-b71
          speaker: young_mule
          text: "You choose that moment to eat?"
        - id: ch01-b72
          speakers: [near_bullock, off_bullock]
          ensemble: duo
          text: "That moment or any other moment. Eating is always good. We graze until the men yoke us again, and then all together we haul the gun back to the place where Two Tails is waiting. Sometimes great guns inside the town answer our guns, and some of us are killed. Then there is that much more grazing for those who remain. This is Fate. Even so, Two Tails is a great coward. Ours is the proper way to fight. We are brothers from Hapur, and our father was a sacred bull of Shiva. We have spoken."
        - id: ch01-b73
          speaker: troop_horse
          text: "Tonight has certainly taught me something. Billy, do you screw-gun gentlemen feel like eating while heavy guns fire at you and Two Tails waits behind?"
        - id: ch01-b74
          speaker: billy
          text: "About as much as we feel like sitting down while men lie all over us, or charging people with knives. What nonsense! Give me a mountain ledge, a balanced load, and a driver who trusts me to choose the path. Then I am ready. All those other things? Never."
        - id: ch01-b75
          speaker: troop_horse
          text: "Of course, we aren't all made alike. I can see that the family on your father's side would have trouble understanding many things."
        - id: ch01-b76
          speaker: billy
          text: "Leave my father's family alone! My father was a Southern gentleman. He could drag down, bite, and kick to pieces any horse he met. Remember that, you great brown Brumby!"
          emotion: angry
        - id: ch01-b77
          speaker: narrator
          text: "Every mule hates being reminded that his father was a donkey. And Brumby means a wild horse with no breeding. Imagine a cart horse calling a celebrated racehorse a worn-out skate, and you can guess how the Australian horse felt. The white of his eye flashed in the darkness."
        - id: ch01-b78
          speaker: troop_horse
          text: "Listen, you son of an imported Malaga jackass. On my mother's side, I am related to Carbine, winner of the Melbourne Cup. Where I come from, no parrot-mouthed, pig-headed mule from a pop-gun battery insults us and walks away. Are you ready?"
          emotion: angry
        - id: ch01-b79
          speaker: billy
          text: "Up on your hind legs!"
          emotion: angry
        - id: ch01-b80
          speaker: narrator
          text: "They both reared and faced each other. I expected a furious fight. Then a wet, rumbling voice rolled out of the darkness on the right."
        - id: ch01-b81
          speaker: two_tails
          text: "Children, what are you fighting over? Be quiet there."
        - id: ch01-b82
          speaker: narrator
          text: "Both animals dropped at once and snorted with disgust. Neither horses nor mules can endure an elephant's voice."
        - id: ch01-b83
          speaker: troop_horse
          text: "It's Two Tails. I cannot stand him. Having a tail at both ends simply isn't fair."
        - id: ch01-b84
          speaker: billy
          text: "I feel exactly the same. We are rather alike about some things."
        - id: ch01-b85
          speaker: narrator
          text: "Billy crowded against the troop horse for company."
        - id: ch01-b86
          speaker: troop_horse
          text: "Perhaps we got those feelings from our mothers. They aren't worth a quarrel. Two Tails, are you tied?"
        - id: ch01-b87
          speaker: two_tails
          text: "Yes. I am picketed for the night. I heard everything you fellows said, but don't worry. I am not coming over there."
        - id: ch01-b88
          speakers: [near_bullock, off_bullock, baggage_camel]
          ensemble: chorus
          text: "Afraid of Two Tails? What nonsense!"
        - id: ch01-b89
          speakers: [near_bullock, off_bullock]
          ensemble: duo
          text: "We are sorry you overheard us, but it is true. Two Tails, why do firing guns frighten you?"
        - id: ch01-b90
          speaker: two_tails
          text: "I am not sure you would understand."
        - id: ch01-b91
          speaker: narrator
          text: "He rubbed one hind leg against the other, exactly like a small boy reciting a poem."
        - id: ch01-b92
          speakers: [near_bullock, off_bullock]
          ensemble: duo
          text: "We don't understand, yet we still have to pull the guns."
        - id: ch01-b93
          speaker: two_tails
          text: "I know. You are much braver than you realize. But I am different. My battery captain called me a Pachydermatous Anachronism the other day."
        - id: ch01-b94
          speaker: billy
          text: "Is that some other way of fighting?"
        - id: ch01-b95
          speaker: two_tails
          text: "Naturally, you don't know what it means, but I do. It means being caught between one thing and another, which is exactly my trouble. When a shell bursts, I can see inside my mind what will happen. You bullocks cannot."
        - id: ch01-b96
          speaker: troop_horse
          text: "I can see a little of it. I try not to think about it."
        - id: ch01-b97
          speaker: two_tails
          text: "I see more than you, and I cannot help thinking. There is so much of me to protect. No one knows how to treat me when I fall ill. They only stop my driver's pay until I recover, and I do not trust my driver."
        - id: ch01-b98
          speaker: troop_horse
          text: "Ah, that explains it. I trust Dick."
        - id: ch01-b99
          speaker: two_tails
          text: "You could place a whole regiment of men like Dick on my back, and I would not feel any better. I know just enough about what may happen to make myself uncomfortable. I do not know enough to go forward in spite of it."
        - id: ch01-b100
          speakers: [near_bullock, off_bullock]
          ensemble: duo
          text: "We do not understand."
        - id: ch01-b101
          speaker: two_tails
          text: "I know you don't. I was not speaking to you. You know nothing about blood."
        - id: ch01-b102
          speakers: [near_bullock, off_bullock]
          ensemble: duo
          text: "We know blood. It is red, it sinks into the earth, and it has a smell."
        - id: ch01-b103
          speaker: narrator
          text: "The troop horse kicked, bounded, and blew through his nostrils."
        - id: ch01-b104
          speaker: troop_horse
          text: "Don't speak of it. Just thinking makes me smell it. Without Dick on my back, it makes me want to run."
          emotion: fearful
        - id: ch01-b105
          speakers: [baggage_camel, near_bullock, off_bullock]
          ensemble: chorus
          text: "There is no blood here. Why are you being so foolish?"
        - id: ch01-b106
          speaker: billy
          text: "It is horrible stuff. I don't feel like running, but I don't care to discuss it."
        - id: ch01-b107
          speaker: two_tails
          text: "There! That is exactly what I mean."
        - id: ch01-b108
          speaker: narrator
          text: "Two Tails waved his tail as if that would make everything clear."
        - id: ch01-b109
          speakers: [near_bullock, off_bullock]
          ensemble: duo
          text: "Certainly. We have all been here the whole night."
        - id: ch01-b110
          speaker: narrator
          text: "Two Tails stamped until the iron ring around his foot jingled."
        - id: ch01-b111
          speaker: two_tails
          text: "I am not talking to you! You cannot see things inside your own heads."
          emotion: angry
        - id: ch01-b112
          speakers: [near_bullock, off_bullock]
          ensemble: duo
          text: "No. We look out through our four eyes. They point straight ahead."
        - id: ch01-b113
          speaker: two_tails
          text: "If I could look straight ahead and do nothing else, no one would need you to haul the great guns. If I were like my captain, things might be different. He can picture what will happen before the shooting starts. He trembles all over, but he knows too much to run away. If I were like him, I could pull the guns. Yet if I were as wise as all that, I would never be here. I would be a king in the forest again, as I used to be. I would sleep for half the day and bathe whenever I pleased. I have not had a proper bath for a whole month."
        - id: ch01-b114
          speaker: billy
          text: "That sounds impressive, but a long name does not improve a thing."
        - id: ch01-b115
          speaker: troop_horse
          text: "Hush. I believe I understand Two Tails."
        - id: ch01-b116
          speaker: two_tails
          text: "You will understand even better in a moment. Explain why you dislike this!"
          emotion: angry
        - id: ch01-b117
          speaker: narrator
          text: "He trumpeted with all his strength."
        - id: ch01-b118
          speakers: [billy, troop_horse]
          ensemble: duo
          text: "Stop that!"
          emotion: fearful
        - id: ch01-b119
          speaker: narrator
          text: "They stamped and shivered. An elephant's trumpet is always unpleasant, especially on a dark night."
        - id: ch01-b120
          speaker: two_tails
          text: "I will not stop. Can you explain it? Hhrrmph! Rrrt! Rrrmph! Rrrhha!"
        - id: ch01-b121
          speaker: narrator
          text: "He stopped without warning. A little whimper came through the dark, and I knew Vixen had found me. She knew, just as I did, that nothing frightens an elephant quite like a small barking dog. She stayed to bully Two Tails at his picket, yapping around his enormous feet. He shuffled and squeaked."
        - id: ch01-b122
          speaker: two_tails
          text: "Go away, little dog! Stop sniffing my ankles, or I will kick you. There, good dog, nice little dog. Now go home, you yelping creature! Why won't someone take her away? She will bite me any moment!"
          emotion: fearful
        - id: ch01-b123
          speaker: billy
          text: "It seems our friend Two Tails fears almost everything. If I had received a full meal for every dog I kicked across the parade ground, I would be nearly as fat as he is."
        - id: ch01-b124
          speaker: narrator
          text: "I whistled. Vixen came running, covered in mud. She licked my nose and gave me a long account of searching through camp. I never told her I understood beast language. If she knew, she would take every sort of liberty. I buttoned her inside my overcoat while Two Tails shuffled, stamped, and growled to himself."
        - id: ch01-b125
          speaker: two_tails
          text: "Extraordinary. Most extraordinary. This fear runs in our family. Now where did that horrible little creature go?"
        - id: ch01-b126
          speaker: narrator
          text: "I heard his trunk feeling around for her."
        - id: ch01-b127
          speaker: two_tails
          text: "Different things affect each of us differently. You gentlemen seemed disturbed when I trumpeted."
        - id: ch01-b128
          speaker: troop_horse
          text: "Not exactly disturbed. It felt more as if hornets had gathered under my saddle. Please don't do it again."
        - id: ch01-b129
          speaker: two_tails
          text: "I fear a small dog, and this camel fears his dreams at night."
        - id: ch01-b130
          speaker: troop_horse
          text: "We are fortunate that we don't all have to fight in one fashion."
        - id: ch01-b131
          speaker: young_mule
          text: "I have been wondering about something. Why must we fight at all?"
        - id: ch01-b132
          speaker: troop_horse
          text: "Because we are ordered to fight."
        - id: ch01-b133
          speaker: billy
          text: "Orders."
        - id: ch01-b134
          speaker: narrator
          text: "Billy snapped his teeth."
        - id: ch01-b135
          speakers: [baggage_camel, two_tails, near_bullock, off_bullock]
          ensemble: chorus
          text: "Hukm hai! It is an order!"
        - id: ch01-b136
          speaker: young_mule
          text: "But who gives those orders?"
        - id: ch01-b137
          speaker: billy
          text: "The man walking at your head."
        - id: ch01-b138
          speaker: troop_horse
          text: "The man sitting on your back."
        - id: ch01-b139
          speaker: baggage_camel
          text: "The man holding your nose rope."
        - id: ch01-b140
          speaker: near_bullock
          text: "The man twisting your tail."
        - id: ch01-b141
          speaker: young_mule
          text: "Then who gives orders to the men?"
        - id: ch01-b142
          speaker: billy
          text: "Now you are asking too much, youngster, and that is how a mule gets kicked. Obey the man at your head. Ask no questions."
        - id: ch01-b143
          speaker: two_tails
          text: "Billy is right. I cannot always obey because I am caught between one thing and another. Still, he is right. Obey the nearest man who gives the order. Otherwise you may stop the entire battery, and you will be thrashed besides."
        - id: ch01-b144
          speaker: narrator
          text: "The gun bullocks rose to leave."
        - id: ch01-b145
          speakers: [near_bullock, off_bullock]
          ensemble: duo
          text: "Morning is near, so we will return to our lines. We admit that we see only through our eyes and are not very clever. Even so, we alone have felt no fear tonight. Good night, brave people."
        - id: ch01-b146
          speaker: narrator
          text: "No one replied. The troop horse changed the subject."
        - id: ch01-b147
          speaker: troop_horse
          text: "Where is that little dog? A dog means there must be a man close by."
        - id: ch01-b148
          speaker: vixen
          text: "Here I am, beneath the gun tail with my man. You great clumsy camel, you knocked down our tent. My man is very angry with you."
        - id: ch01-b149
          speakers: [near_bullock, off_bullock]
          ensemble: duo
          text: "Phew! Then he must be a white man!"
          emotion: fearful
        - id: ch01-b150
          speaker: vixen
          text: "Of course he is. Did you imagine a black bullock driver looked after me?"
        - id: ch01-b151
          speakers: [near_bullock, off_bullock]
          ensemble: duo
          text: "Huah! Ouach! Ugh! We must get away at once!"
          emotion: fearful
        - id: ch01-b152
          speaker: narrator
          text: "They lunged through the mud and somehow drove their yoke onto the pole of an ammunition wagon. It stuck fast."
        - id: ch01-b153
          speaker: billy
          text: "Now look what you have done. Stop struggling. You are trapped until daylight. What in the world is wrong?"
        - id: ch01-b154
          speaker: narrator
          text: "The bullocks answered with the long, hissing snorts Indian cattle make. They shoved, twisted, crowded, stamped, slipped, and nearly fell as they grunted savagely in the mud."
        - id: ch01-b155
          speaker: troop_horse
          text: "You'll break your necks in another moment. What is so terrible about white men? I live with them."
        - id: ch01-b156
          speaker: near_bullock
          text: "They eat us! Pull!"
          emotion: fearful
        - id: ch01-b157
          speaker: narrator
          text: "The yoke broke with a sharp twang, and the bullocks lumbered away together. Until that night, I had never understood why Indian cattle feared Englishmen. We eat beef, while cattle drivers never touch it. Naturally, the cattle dislike us for that."
        - id: ch01-b158
          speaker: billy
          text: "May my own pad chains flog me! Who would expect two great lumps like those to lose their senses?"
        - id: ch01-b159
          speaker: troop_horse
          text: "Never mind them. I mean to inspect this man. Most white men I know carry interesting things in their pockets."
        - id: ch01-b160
          speaker: billy
          text: "Then I shall leave you to it. I cannot say that I am especially fond of white men myself. Besides, a white man who has nowhere to sleep is quite likely to be a thief, and I carry a great deal of Government property on my back. Come along, youngster. We will return to our own lines. Good night, Australia. I suppose I will see you at tomorrow's parade. Good night, old Hay-bales. Try to keep those feelings under control. Good night, Two Tails. If you pass us while we're lying on the ground tomorrow, please do not trumpet. It spoils our formation."
        - id: ch01-b161
          speaker: narrator
          text: "Billy stumped off with the proud limp of an old campaigner. The troop horse pushed his nose against my coat, and I fed him biscuits. Vixen, a very conceited little dog, told him lies about the many horses she and I kept."
        - id: ch01-b162
          speaker: vixen
          text: "Tomorrow I will come to the parade in my dogcart. Where should I look for you?"
        - id: ch01-b163
          speaker: troop_horse
          text: "I will be on the left of the second squadron, little lady. I set the pace for my whole troop. Now I must return to Dick. My tail is muddy, and preparing me for parade will take him two hard hours."
        - id: ch01-b164
          speaker: narrator
          text: "The next afternoon brought the grand parade of all thirty thousand men in the camp. Vixen and I had a fine place from which to watch, close beside the Viceroy and the Amir of Afghanistan. The Amir was easy to recognize. He wore a high, broad black hat made of astrakhan wool, and a great diamond star shone from its center."
        - id: ch01-b165
          speaker: narrator
          text: "The first part of the review took place in bright sunshine. Regiment after regiment passed us, wave upon wave of legs all moving together. The guns rolled by in lines so exact that watching them made our eyes grow dizzy. Then the cavalry came up to the lovely cavalry canter of Bonnie Dundee. Vixen sat in the dogcart and cocked one ear to listen as the riders approached."
        - id: ch01-b166
          speaker: narrator
          text: "The Lancers' second squadron swept past. There was the troop horse, his tail smooth as spun silk and his head tucked toward his chest. One ear pointed ahead and one behind. He kept time for the entire squadron, and his legs moved as easily as dancing music."
        - id: ch01-b167
          speaker: narrator
          text: "Then the great siege guns passed us. I saw Two Tails and two other elephants harnessed in a line to a forty-pounder, while twenty yoke of bullocks marched behind. The seventh pair wore a new yoke, and both animals looked rather stiff and tired after their struggle in the mud. Last of all came the screw-guns. Billy carried himself as if he commanded every soldier on the field. His harness had been oiled and polished until it winked in the light. I gave Billy a cheer all by myself, but the old campaigner never looked right or left."
        - id: ch01-b168
          speaker: narrator
          text: "Rain began to fall again, and for a while the mist grew too thick for us to see what the troops were doing. They had formed a huge half circle across the plain. Now they spread out into a single line. It grew and grew until it reached three-quarters of a mile from wing to wing, one solid wall of men, horses, and guns. Then that whole wall advanced straight toward the Viceroy and the Amir. As it drew closer, the earth began to shake like the deck of a steamer when its engines are running fast."
        - id: ch01-b169
          speaker: narrator
          text: "Unless you have stood there yourself, you cannot imagine how frightening that steady advance of troops appears to the people watching. It frightens them even when they know perfectly well that it is only a review. I looked across at the Amir. Until that moment, his face had shown no shadow of astonishment or any other feeling. Now his eyes opened wider and wider. He picked up the reins from his horse's neck and looked behind him. For one moment, it seemed as though he might draw his sword and slash his way out through the English men and women seated in the carriages at the back."
        - id: ch01-b170
          speaker: narrator
          text: "Then the advance stopped dead. The shaking ground became still. The entire long line saluted, and thirty bands began playing all at once. That ended the review. The regiments marched away to their camps through the rain. An infantry band struck up a tune about the animals going into the Ark two by two, hurrah, with the elephant and the battery mule among them, all hurrying inside to get out of the rain."
        - id: ch01-b171
          speaker: narrator
          text: "Afterward, I heard a grizzled, long-haired chief from Central Asia questioning a native officer. The chief had traveled down with the Amir."
        - id: ch01-b172
          speaker: central_asian_chief
          text: "Tell me, how was this wonderful thing accomplished?"
        - id: ch01-b173
          speaker: native_officer
          text: "An order was given, and everyone obeyed it."
        - id: ch01-b174
          speaker: central_asian_chief
          text: "Are the animals as wise as the men?"
        - id: ch01-b175
          speaker: native_officer
          text: "They obey, just as the men obey. Mule, horse, elephant, and bullock obey the driver. The driver obeys the sergeant, the sergeant obeys the lieutenant, and the lieutenant obeys the captain. The captain obeys the major, the major obeys the colonel, and the colonel obeys the brigadier who commands three regiments. The brigadier obeys the general. The general obeys the Viceroy, and the Viceroy is the Empress's servant. That is how it is done."
        - id: ch01-b176
          speaker: central_asian_chief
          text: "If only Afghanistan were like that. There, each of us obeys only his own will."
        - id: ch01-b177
          speaker: native_officer
          text: "And that is why your Amir, whom you refuse to obey, must come here to receive orders from our Viceroy."
