  chapters:
    - id: ch01
      title: The White Seal of Novastoshnah
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Hush now, little seal. Night has covered the water that shone green through the day, and now those waves are black. The moon looks down over the crests, searching for us where one billow meets the next. It finds us resting in the soft hollows between them. Curl your tired little flippers and settle easily into the slow-swinging sea. Let the water be your pillow. No storm will wake you there, and no hunting shark will overtake you while the waves hold you asleep."
        - id: ch01-b02
          speaker: narrator
          text: "This happened years ago at Novastoshnah, the North East Point of St. Paul Island, far out in the Bering Sea. Limmershin the Winter Wren told the tale after a storm blew him onto a steamer bound for Japan. He spent two days in a warm cabin with plenty to eat before he flew home again. He was an odd little bird, but he told the truth."
        - id: ch01-b03
          speaker: narrator
          text: "Only seals have regular business at Novastoshnah. Every summer they rise from the cold gray sea by the hundreds of thousands, because no beach in the world suits seals better. Sea Catch knew that well. Each spring he swam straight there from wherever winter had taken him. Then he spent a month fighting other seals for a nursery place on the rocks close to the water."
        - id: ch01-b04
          speaker: narrator
          text: "Sea Catch was fifteen years old, a huge gray fur seal with a mane beginning on his shoulders and long, dangerous teeth. Propped on his front flippers, he stood more than four feet high. He weighed nearly seven hundred pounds and carried scars from savage fights all over his body. Still, he was always ready for one more. He would turn his head aside as though afraid to face an enemy, then strike like lightning and lock his teeth into the other seal's neck. After that, the other seal had to escape without Sea Catch's help."
        - id: ch01-b05
          speaker: narrator
          text: "He never chased a beaten seal. The Rules of the Beach forbade that. All he wanted was room by the sea for his family. But forty or fifty thousand seals wanted the same thing each spring, so the beach shook with whistling, roaring, bellowing, and blowing. From Hutchinson's Hill, three and a half miles of fighting seals filled the ground. More heads dotted the surf as newcomers hurried ashore to join them. They fought in the breakers, across the sand, and over the smooth black nursery rocks. No one would make room for anyone else. In that way, the seals behaved very much like people."
        - id: ch01-b06
          speaker: narrator
          text: "The mother seals waited until late May or early June before coming ashore, when the worst fighting was done. Young seals of two, three, and four years had no families yet. These bachelors, called holluschickie, passed through the fighting ranks and played half a mile inland among the dunes. Two or three hundred thousand of them might gather at Novastoshnah alone, rubbing away every green plant under their bodies."
        - id: ch01-b07
          speaker: narrator
          text: "One spring, Sea Catch had just ended his forty-fifth fight when his wife Matkah came smoothly out of the sea. He caught her by the neck and dropped her onto their place."
        - id: ch01-b08
          speaker: sea_catch
          text: "Late again. Where have you been?"
        - id: ch01-b09
          speaker: narrator
          text: "Sea Catch ate nothing during the four months he stayed on the beach, so he was usually in a bad temper. Matkah knew better than to argue. She looked around their old nursery place and cooed."
        - id: ch01-b10
          speaker: matkah
          text: "How thoughtful. You won our old place again."
        - id: ch01-b11
          speaker: sea_catch
          text: "Of course I did. Just look at me!"
        - id: ch01-b12
          speaker: narrator
          text: "He bled from twenty scratches. One eye was nearly closed, and both sides were torn into strips. Matkah fanned herself with a hind flipper."
        - id: ch01-b13
          speaker: matkah
          text: "Oh, you males! Why can't you settle your places sensibly? You look as if you fought a Killer Whale."
        - id: ch01-b14
          speaker: sea_catch
          text: "I have done nothing but fight since the middle of May. The beach is disgracefully crowded. At least a hundred seals from Lukannon have come looking for homes. Why can't they stay where they belong?"
        - id: ch01-b15
          speaker: matkah
          text: "Sometimes I think we would be happier on Otter Island, away from this crowd."
        - id: ch01-b16
          speaker: sea_catch
          text: "Bah! Only bachelors go there. Everyone would say we were frightened. We have our position to keep, my dear."
        - id: ch01-b17
          speaker: narrator
          text: "Sea Catch tucked his head proudly between his shoulders and pretended to sleep for a few minutes, though he watched sharply for the next fight. By then the seals and their wives covered the land, and their noise carried for miles, even through the strongest gale. More than a million old seals, mothers, tiny babies, and bachelors fought, crawled, bleated, played, and moved to and from the sea. They came and went in gangs and regiments. Every foot of ground disappeared beneath them, and whole brigades seemed to skirmish through the fog. Novastoshnah was almost always foggy, except when a brief sun turned everything pearly and bright with rainbows."
        - id: ch01-b18
          speaker: narrator
          text: "Kotick was born in the middle of that confusion. He was mostly head and shoulders, with the pale watery-blue eyes of every newborn seal. But something in his coat made Matkah study him closely."
        - id: ch01-b19
          speaker: matkah
          text: "Sea Catch, our baby is going to be white."
        - id: ch01-b20
          speaker: sea_catch
          text: "Empty shells and dry seaweed! No white seal has ever lived."
        - id: ch01-b21
          speaker: matkah
          text: "That changes nothing. There will be one now."
        - id: ch01-b22
          speaker: narrator
          text: "Then she crooned the song every mother seal sings. A baby must not swim before six weeks, or his head will sink while his heels rise. Summer storms and Killer Whales are dangerous. But a child of the open sea who splashes and grows strong will do well."
        - id: ch01-b23
          speaker: narrator
          text: "Kotick did not understand the song yet. He paddled beside his mother and learned to scramble clear whenever Sea Catch fought another seal and the pair rolled roaring across the slippery rocks. Matkah went to sea for food. Kotick ate only once every two days, but each time he ate all he could, and he grew well."
        - id: ch01-b24
          speaker: narrator
          text: "His first journey was inland, where tens of thousands of babies his age played like puppies, slept on clean sand, and woke to play again. The grown seals in the nurseries paid no attention to them, and the bachelors stayed on their own ground. No one taught the babies games or arranged their day. They tumbled together until they were tired, slept wherever they dropped, and began again when they woke. It was a wonderful time."
        - id: ch01-b25
          speaker: narrator
          text: "Whenever Matkah returned from deep-sea fishing, she called across the playground like a sheep calling its lamb. She waited for Kotick's answer, then charged straight toward him, knocking other youngsters aside with her front flippers. Hundreds of mothers might be searching at once, so every baby had to stay alert."
        - id: ch01-b26
          speaker: matkah
          text: "Keep out of muddy water so you do not get mange. Never grind hard sand into a cut, and do not swim when the sea is heavy. Remember those things, and nothing here will hurt you."
        - id: ch01-b27
          speaker: narrator
          text: "Baby seals cannot swim any more than baby children can, though they ache to learn. On Kotick's first visit to the water, a wave swept him beyond his depth. His big head went under and his little hind flippers rose, exactly as Matkah's song had warned. The next wave threw him ashore. Without it, he would have drowned."
        - id: ch01-b28
          speaker: narrator
          text: "After that he practiced in a beach pool, where the edge of each wave covered and lifted him while he paddled. He kept watching for larger waves that could hurt him. For two weeks he floundered in and out, coughing, grunting, crawling onto the beach for naps, and trying again. At last he knew that the water was truly his home."
        - id: ch01-b29
          speaker: narrator
          text: "Then the games began. Kotick and his friends dived beneath the rollers. They rode the crest of a great wave and landed with a splash while the water whirled far up the beach. They balanced on their tails to scratch their heads like the grown seals and played King of the Castle on slippery, weed-covered rocks that barely rose above the wash. Sometimes a thin fin drifted close to shore, looking like the fin of a giant shark. That was the Grampus, the Killer Whale who ate young seals whenever he could catch them. Kotick would shoot toward the beach like an arrow, while the fin moved slowly away as though it had never wanted anything."
    - id: ch02
      title: Learning the Open Sea
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "Late in October, the seals began leaving St. Paul by families and tribes. The nursery fights ended, and the bachelors could play wherever they pleased."
        - id: ch02-b02
          speaker: matkah
          text: "Next year you will be a bachelor too. This year, you must learn to catch fish."
        - id: ch02-b03
          speaker: narrator
          text: "Matkah and Kotick crossed the Pacific together. She taught him to sleep on his back with his flippers tucked against his sides and only his little nose above water. No cradle could have been more comfortable than the long rocking swell of that ocean. When Kotick's skin tingled all over, she told him he was beginning to learn the feel of the water. Those prickling warnings meant bad weather was coming. He must wake, swim hard, and get out of its path instead of waiting for the storm to find him."
        - id: ch02-b04
          speaker: matkah
          text: "Soon you will know where to go by yourself. For now, follow Sea Pig the Porpoise. He is very wise."
        - id: ch02-b05
          speaker: narrator
          text: "A school of porpoises plunged and raced through the sea, and Kotick followed as quickly as he could."
        - id: ch02-b06
          speaker: kotick
          text: "How do you know which way to swim?"
        - id: ch02-b07
          speaker: narrator
          text: "Their leader rolled one white eye toward Kotick and dived."
        - id: ch02-b08
          speaker: porpoise
          text: "My tail is tingling, youngster. A gale is coming behind us, so keep moving. South of the Sticky Water, a tingling tail means the gale is ahead, and then you turn north. Hurry now. This water feels wrong."
        - id: ch02-b09
          speaker: narrator
          text: "That was only one of the many things Kotick learned, and he was learning all the time. Matkah showed him how to follow cod and halibut over the banks beneath the sea, and how to wrench a rockling from its hole among the weeds. She taught him to skim around wrecks lying a hundred fathoms down. As the frightened fish ran, he would dart through one porthole and out through another like a rifle bullet. He learned to dance on top of the waves while lightning raced across the whole sky. When a short-tailed albatross or a Man-of-war Hawk sailed past on the wind, Kotick raised a flipper politely."
        - id: ch02-b10
          speaker: narrator
          text: "He learned to spring clear of the water like a dolphin, with flippers held close and tail curved. He left flying fish alone because they were too bony. Ten fathoms down, at full speed, he could tear the shoulder from a cod. He never stopped to inspect boats or ships, especially rowboats. Six months passed without his touching dry land, and by then there was almost nothing left for him to learn about deep-sea fishing."
        - id: ch02-b11
          speaker: narrator
          text: "One day he floated half asleep in warm water near Juan Fernandez Island. A heavy, restless feeling came over him, the way spring can make a person's legs ache. He remembered the firm beaches of Novastoshnah, seven thousand miles away. He remembered the games, the smell of seaweed, the roar of seals, and the fighting. At once he turned north."
        - id: ch02-b12
          speaker: narrator
          text: "As he traveled, scores of his old companions joined him, all going home."
        - id: ch02-b13
          speakers: [seal_1, seal_2, seal_3, seal_4]
          ensemble: chorus
          text: "Greetings, Kotick! We are bachelors now. We can dance the Fire-dance at Lukannon and roll in the new grass. But what happened to your coat?"
        - id: ch02-b14
          speaker: narrator
          text: "Kotick's fur had become almost pure white. He was proud of it, but he only urged them onward."
        - id: ch02-b15
          speaker: kotick
          text: "Swim faster! My bones are aching to feel land."
        - id: ch02-b16
          speaker: narrator
          text: "Together they returned to the beaches where they had been born and heard their fathers fighting through the rolling fog. That night Kotick joined the yearlings in the Fire-dance. On summer nights the sea from Novastoshnah to Lukannon shines with living fire. Each swimming seal trails a wake like burning oil. When a seal leaps clear of the surface, a bright flame seems to flash around him. The waves themselves break in great shining bands, then whirl away in glowing streaks and circles. Through all that cold fire, the young seals raced and danced."
        - id: ch02-b17
          speaker: narrator
          text: "Afterward the young seals went inland to the bachelor grounds. They rolled up and down through the new wild wheat and traded stories of everything they had done at sea. They spoke about the immense Pacific as casually as boys might speak about a familiar wood where they had gone gathering nuts. They remembered currents, fishing banks, storms, islands, and the feel of distant water. Anyone who understood their talk could have gone away and drawn a map of the ocean finer than any map ever made. Then the three- and four-year-old bachelors came romping down Hutchinson's Hill."
        - id: ch02-b18
          speakers: [seal_1, seal_2, seal_3]
          ensemble: chorus
          text: "Make room, youngsters! You have no idea how deep the sea is. Wait until you round the Horn. And you there, yearling, where did that white coat come from?"
        - id: ch02-b19
          speaker: kotick
          text: "I did not find it. It grew."
        - id: ch02-b20
          speaker: narrator
          text: "Kotick was about to roll the questioner over when two black-haired men with flat red faces stepped from behind a dune. Kotick had never seen a human. He coughed and lowered his head. The other bachelors shuffled a few yards away and stared. The men were Kerick Booterin, the island's chief seal-hunter, and his son Patalamon. They had come from the village near the nurseries to choose seals for the killing pens. Later, those seals would become fur coats."
        - id: ch02-b21
          speaker: patalamon
          text: "Look there! A white seal!"
          emotion: surprised
        - id: ch02-b22
          speaker: narrator
          text: "Under all the oil and smoke on his face, Kerick turned nearly white. He began muttering a prayer."
        - id: ch02-b23
          speaker: kerick_booterin
          text: "Do not touch him, Patalamon. I have never seen a white seal in all my life. It may be old Zaharrof's ghost. He vanished in last year's great gale."
          emotion: fearful
        - id: ch02-b24
          speaker: patalamon
          text: "I will stay away. He looks unlucky. Do you truly think Zaharrof came back? I still owe him some gulls' eggs."
        - id: ch02-b25
          speaker: kerick_booterin
          text: "Do not even look at him. Cut that herd of four-year-olds away from the rest. The men should skin two hundred today, but they are new and the season has only begun. One hundred will be enough. Quickly!"
    - id: ch03
      title: The Killing Grounds
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "Patalamon shook two seal shoulder bones before a herd of bachelors. The seals stopped at once, puffing and blowing. When he stepped closer, they moved away from him. Kerick guided them inland, and not one tried to return to its companions. Hundreds of thousands watched the herd go, then went right on playing. Only Kotick asked what was happening. His friends knew nothing except that men drove seals away like this for six weeks or two months every year."
        - id: ch03-b02
          speaker: kotick
          text: "I am going after them."
        - id: ch03-b03
          speaker: narrator
          text: "His eyes nearly sprang from his head as he shuffled behind the herd."
        - id: ch03-b04
          speaker: patalamon
          text: "The white seal is following us! No seal has ever come to the killing grounds by himself."
          emotion: surprised
        - id: ch03-b05
          speaker: kerick_booterin
          text: "Hush, and do not turn around. It is Zaharrof's ghost. I must ask the priest about this."
          emotion: fearful
        - id: ch03-b06
          speaker: narrator
          text: "The killing grounds lay only half a mile away, yet the journey took an hour. Kerick would not let the seals move quickly and grow hot, because overheated fur came away in patches during skinning. Slowly they passed Sea Lion's Neck, then Webster House, and finally the Salt House, where the nursery seals could no longer see them. Kotick followed, panting and wondering at every step. He felt as if he had reached the world's end. Yet the roar of the nurseries behind him was still so loud that it sounded like a train rushing through a tunnel."
        - id: ch03-b07
          speaker: narrator
          text: "Kerick sat down on the moss, pulled out a heavy pewter watch, and gave the herd thirty minutes to cool. Everything was so still that Kotick could hear drops of fog sliding from the brim of the man's cap. Then ten or twelve more men arrived. Each carried a club three or four feet long, bound with iron. Kerick picked out one or two seals that had been bitten by their companions or were still too warm. The men kicked those aside with heavy boots made from the skin of a walrus's throat. When Kerick gave the word, the clubs rose and fell on the other seals as fast as the men could swing them."
        - id: ch03-b08
          speaker: narrator
          text: "Ten minutes later, Kotick could no longer recognize the seals he had followed. Their skins had been cut open from the nose all the way to the hind flippers. The men pulled each skin free in a single piece and threw it down with the others until a pile rose on the ground. That sight was enough for Kotick. He turned and galloped back toward the sea, moving with the sudden speed a seal can manage over a short distance. His new little mustache stood out with horror, and he did not slow until the killing ground was behind him."
        - id: ch03-b09
          speaker: narrator
          text: "At Sea Lion's Neck, where the great sea lions sat beside the surf, Kotick tumbled head over flippers into the cool water. He floated there, miserable and gasping. One sea lion spoke without much interest."
        - id: ch03-b10
          speaker: sea_lion
          text: "What is all this?"
        - id: ch03-b11
          speaker: kotick
          text: "I am lonely, terribly lonely! They are killing all the bachelors on every beach!"
          emotion: sad
        - id: ch03-b12
          speaker: narrator
          text: "The Sea Lion turned his head toward shore."
        - id: ch03-b13
          speaker: sea_lion
          text: "Nonsense. Your friends are making as much noise as ever. You saw old Kerick finish a drove, that is all. He has done it for thirty years."
        - id: ch03-b14
          speaker: kotick
          text: "But it is horrible."
          emotion: disgusted
        - id: ch03-b15
          speaker: narrator
          text: "A wave passed over Kotick. He backed through it and turned his flippers like screws, stopping upright within three inches of a jagged rock."
        - id: ch03-b16
          speaker: sea_lion
          text: "That was fine swimming for a yearling. I suppose the killing looks terrible to you. But seals return here every year, so of course men learn where to find them. Unless you discover an island that men never visit, they will keep driving you."
        - id: ch03-b17
          speaker: kotick
          text: "Does such an island exist?"
        - id: ch03-b18
          speaker: sea_lion
          text: "I have chased halibut for twenty years without finding one. Since you enjoy questioning your elders, swim six miles to Walrus Islet and ask Sea Vitch. He might know. But rest first, little one. Do not rush off tired."
        - id: ch03-b19
          speaker: narrator
          text: "Kotick took the advice. He went back to his beach, slept for half an hour with his body twitching as seals do, and then headed northeast for Walrus Islet. It was a low slab of rock, thick with ledges and gull nests, where walruses lived apart from everyone else."
        - id: ch03-b20
          speaker: narrator
          text: "Kotick landed beside old Sea Vitch, the huge, swollen, pimpled, thick-necked walrus of the North Pacific. Long tusks were his best feature, and he had no manners except in sleep. At that moment, he was sleeping with his hind flippers in the surf."
        - id: ch03-b21
          speaker: kotick
          text: "Wake up!"
        - id: ch03-b22
          speaker: sea_vitch
          text: "Hah? Ho! Hmph! What is it?"
        - id: ch03-b23
          speaker: narrator
          text: "Sea Vitch jabbed the walrus beside him awake. That walrus struck the next, and the blow traveled down the line until every walrus was awake and looking everywhere except toward Kotick."
        - id: ch03-b24
          speaker: kotick
          text: "Over here! It is me."
        - id: ch03-b25
          speaker: sea_vitch
          text: "Well, skin me!"
        - id: ch03-b26
          speaker: narrator
          text: "They all stared at the little white seal the way a room full of sleepy old gentlemen might stare at a boy. Kotick had heard quite enough about skinning."
        - id: ch03-b27
          speaker: kotick
          text: "Is there a place where seals can live and men never come?"
        - id: ch03-b28
          speaker: sea_vitch
          text: "Find out for yourself. Go away. We are busy."
        - id: ch03-b29
          speaker: narrator
          text: "Kotick sprang into the air like a dolphin and shouted the insult every walrus hated."
        - id: ch03-b30
          speaker: kotick
          text: "Clam-eater! Clam-eater!"
        - id: ch03-b31
          speaker: narrator
          text: "Sea Vitch had never caught a fish in his life. He dug up clams and seaweed while pretending to be terribly fierce. The Burgomaster Gulls, Kittiwakes, and Puffins were always waiting for a chance to be rude, so they seized the cry at once. Soon the whole population of Walrus Islet was jeering at Sea Vitch. For nearly five minutes their screams were loud enough to hide a gunshot. The old walrus rolled heavily from side to side, coughing and grunting beneath the noise."
        - id: ch03-b32
          speakers: [burgomaster_gull, seal_1, seal_2, seal_3]
          ensemble: chorus
          text: "Clam-eater! Old man! Clam-eater!"
        - id: ch03-b33
          speaker: kotick
          text: "Now will you answer me?"
        - id: ch03-b34
          speaker: sea_vitch
          text: "Ask Sea Cow. If he is still alive, he may know."
        - id: ch03-b35
          speaker: kotick
          text: "How will I recognize him?"
        - id: ch03-b36
          speaker: burgomaster_gull
          text: "He is the only creature uglier and ruder than Sea Vitch! Old man!"
        - id: ch03-b37
          speaker: narrator
          text: "The gull wheeled beneath the walrus's nose while Kotick swam home. No seal at Novastoshnah cared about his plan to find a peaceful home. They said the men had always driven the bachelors and that ugly sights were part of life. If Kotick disliked them, he should not have followed the herd. But those seals had not watched the killing. Kotick had, and he was white besides."
        - id: ch03-b38
          speaker: sea_catch
          text: "Grow into a great seal like your father and win a nursery. Then the men will leave you alone. Give yourself five years, and you can fight for your own place."
        - id: ch03-b39
          speaker: matkah
          text: "You cannot stop the killing, Kotick. Go play in the sea."
        - id: ch03-b40
          speaker: narrator
          text: "Kotick went away and danced the Fire-dance, but his little heart was heavy."
    - id: ch04
      title: Five Seasons of Searching
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "That autumn, Kotick left the beach as soon as he could. He set out alone with one fixed idea in his round head. If Sea Cow truly existed, Kotick would find him. More than that, he would find an island with firm beaches where seals could live beyond the reach of men."
        - id: ch04-b02
          speaker: narrator
          text: "He explored alone from the North Pacific to the South, sometimes swimming three hundred miles in one day and night. He survived more adventures than anyone could tell. A Basking Shark nearly caught him. So did a Spotted Shark and a Hammerhead. He met every sort of dishonest ruffian that drifted up and down the seas. There were heavy fish with grand, polite manners, and red-spotted scallops that had stayed tied to one place for hundreds of years and had grown extremely proud of doing nothing. Yet Kotick found neither Sea Cow nor an island he liked."
        - id: ch04-b03
          speaker: narrator
          text: "Whenever he found a hard beach with a good slope behind it for seals to play on, smoke rose from a whaling ship at the edge of the sky. Men were boiling down blubber aboard it, and Kotick knew exactly what that meant. On other islands, there was no ship in sight, but old marks showed that seals had once visited and had been killed until they stopped coming. Kotick would not mistake an empty beach for a safe one. If men had found a place once, he knew they would find it again."
        - id: ch04-b04
          speaker: narrator
          text: "An old albatross with a short tail told him Kerguelen Island offered perfect peace. Kotick swam there and nearly smashed against black cliffs during a sleet storm filled with thunder and lightning. As he fought his way back through the gale, he saw that seals had once had a nursery even there. Every other island brought the same disappointment."
        - id: ch04-b05
          speaker: narrator
          text: "Limmershin remembered a long list, because Kotick searched for five seasons. Each year he spent four months resting at Novastoshnah, and each year the bachelors made jokes about him and the islands they said existed only in his head. He visited the Galapagos on the Equator, a horrible dry place where the heat nearly baked him. He searched the Georgia Islands, the Orkneys, Emerald Island, Little Nightingale, Gough, Bouvet, the Crosets, and even a tiny dot of land south of the Cape of Good Hope. At every stop, the Sea People told him the same sad history. Seals had lived on those islands once, perhaps in great numbers, but humans had found them and killed them until none remained."
        - id: ch04-b06
          speaker: narrator
          text: "He even swam thousands of miles beyond the Pacific. Returning from Gough's Island, he reached Cape Corrientes and found a few hundred sickly seals crowded on one rock. Men came there too. Kotick's heart nearly broke. He rounded the Horn and turned toward home."
        - id: ch04-b07
          speaker: narrator
          text: "On the northward journey, he rested on a green island. An ancient seal lay there dying, so Kotick caught fish for him and told him the whole sad story."
        - id: ch04-b08
          speaker: kotick
          text: "I am going home to Novastoshnah. If the men drive me to the killing pens with the bachelors, I will not care anymore."
          emotion: sad
        - id: ch04-b09
          speaker: old_seal
          text: "Try one more time. I am the last seal from the Lost Rookery of Masafuera. Long ago, when men killed us by the hundred thousand, our beaches had a story. Someday a white seal would come from the North and lead the seal people to a peaceful home. I am too old to see that day, but others will. Try again."
        - id: ch04-b10
          speaker: narrator
          text: "Kotick curled his fine mustache, and his courage returned."
        - id: ch04-b11
          speaker: kotick
          text: "I am the only white seal ever born on the beaches. And white or black, I am the only seal who ever went searching for a new island."
        - id: ch04-b12
          speaker: narrator
          text: "That thought cheered him greatly. When he reached Novastoshnah that summer, Matkah begged him to marry and settle down. He was no bachelor now. He had become a full-grown sea catch, as large, heavy, and fierce as his father, with a curling white mane across his shoulders."
        - id: ch04-b13
          speaker: kotick
          text: "Give me one more season, Mother. Remember, the seventh wave always reaches farthest up the beach."
        - id: ch04-b14
          speaker: narrator
          text: "One female seal also decided to wait another year before marrying. On the night before Kotick left, they danced the Fire-dance together all along Lukannon Beach. Then he began his final search."
        - id: ch04-b15
          speaker: narrator
          text: "This time he traveled west. He had found the trail of a vast school of halibut, and a seal his size needed a hundred pounds of fish each day to stay strong. He chased them until he tired, curled up, and slept in the rolling swell toward Copper Island. He knew that coast well. Near midnight, a bed of weeds gently bumped him."
        - id: ch04-b16
          speaker: kotick
          text: "Hm. The tide is running hard tonight."
        - id: ch04-b17
          speaker: narrator
          text: "He rolled underwater, slowly opened his eyes, and stretched. Then he jumped like a startled cat. Enormous creatures were feeding among the thick weeds in the shallow water."
        - id: ch04-b18
          speaker: kotick
          text: "By the Great Combers of Magellan! Who are these Deep Sea people?"
          emotion: surprised
        - id: ch04-b19
          speaker: narrator
          text: "Kotick had seen walruses, sea lions, seals, bears, whales, sharks, fish, squid, and scallops. These creatures resembled none of them. They measured twenty or thirty feet from end to end. Instead of hind flippers, each had a broad tail like a shovel cut from wet leather. Their heads looked wonderfully foolish. When they stopped grazing, they balanced on their tails, bowed solemnly to one another, and waved their front flippers like fat men moving their arms."
        - id: ch04-b20
          speaker: kotick
          text: "Ahem. Good feeding tonight, gentlemen?"
        - id: ch04-b21
          speaker: narrator
          text: "The creatures only bowed and waved. When they returned to the weeds, Kotick saw that each upper lip divided into two long halves. The halves opened almost a foot apart, closed around a great bundle of seaweed, and tucked it into the mouth to be chewed with grave attention."
        - id: ch04-b22
          speaker: kotick
          text: "That is a messy way to eat."
        - id: ch04-b23
          speaker: narrator
          text: "Again they bowed, and Kotick began to lose patience."
        - id: ch04-b24
          speaker: kotick
          text: "Yes, yes, you have an extra joint in each front flipper. You need not keep showing it off. Your bows are graceful enough, but what are your names?"
        - id: ch04-b25
          speaker: narrator
          text: "Their split lips twitched and their glassy green eyes stared, but no answer came."
        - id: ch04-b26
          speaker: kotick
          text: "You are uglier than Sea Vitch, and your manners are worse. I have never met anyone else who could manage that."
        - id: ch04-b27
          speaker: narrator
          text: "In a flash, he remembered the Burgomaster Gull's words from his first visit to Walrus Islet. Kotick tumbled backward through the water. At last, he had found Sea Cow."
        - id: ch04-b28
          speaker: narrator
          text: "The sea cows kept pulling, chewing, and swallowing weeds with wet sounds. Kotick questioned them in every language he had learned on his travels, for the Sea People have nearly as many languages as humans. Still they said nothing. Sea Cow cannot talk. He has only six bones in his neck where he ought to have seven, and the Sea People say that missing bone prevents him from speaking even to another sea cow. In its place, he has an extra joint in each front flipper. By moving that joint up, down, and around, he can send a slow and clumsy message much like a simple telegraph."
        - id: ch04-b29
          speaker: narrator
          text: "By daylight Kotick's mane stood straight up, and all his patience had vanished. Then the sea cows began traveling north. They moved very slowly and often stopped for solemn bowing councils. Kotick followed with a new thought. Creatures this helpless would have been killed long ago unless they knew of a safe island. A refuge good enough for Sea Cow would suit a fur seal too. He only wished they would hurry."
        - id: ch04-b30
          speaker: narrator
          text: "The journey wore him down. The herd covered no more than forty or fifty miles a day. They stopped to feed at night and stayed close to shore every mile of the way. Kotick circled above them, dived under them, and swam around them again and again. Nothing he did made them hurry by even half a mile. Farther north, they paused every few hours for another bowing council. Kotick nearly chewed off his own mustache with impatience. Then he realized that each turn and pause kept them inside a warm current flowing north. After that, he respected their slow wisdom much more."
    - id: ch05
      title: Beyond the Sea Cow's Tunnel
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "One night the sea cows sank through the shining water like stones. For the first time since Kotick found them, they swam fast. He followed in amazement. They went straight toward a cliff that dropped into deep water, then plunged into a black opening twenty fathoms below the surface."
        - id: ch05-b02
          speaker: narrator
          text: "The underwater tunnel was long. Kotick badly needed air before he reached the far end. At last he burst into open water, gasping and puffing."
        - id: ch05-b03
          speaker: kotick
          text: "My wig! That was a long dive, but it was worth every stroke."
        - id: ch05-b04
          speaker: narrator
          text: "The sea cows had spread out to graze beside the finest beaches Kotick had ever seen. Long reaches of smooth, wave-worn rock stretched for miles, perfectly shaped for seal nurseries. Behind them lay playgrounds of hard sand that sloped gently inland. There were rolling waves for the Fire-dance, long grass for tumbling, and sand dunes to climb up and down. Every need of old seals, mothers, bachelors, and babies seemed to have its own place. Best of all, Kotick could tell by the feel of the water, which never lies to a true sea catch, that no human had ever entered this country."
        - id: ch05-b05
          speaker: narrator
          text: "First he tested the fishing and found it plentiful. Then he swam along every beach and counted the delightful low sandy islands, half hidden in beautiful rolling fog. To the north and seaward, a chain of bars, shoals, and rocks reached across the water. No ship could pass them or come within six miles of the beach. Between the islands and the mainland lay a broad stretch of deep water that ran directly to the upright cliffs. Somewhere far below those cliffs was the only entrance, the hidden mouth of the sea cows' tunnel."
        - id: ch05-b06
          speaker: kotick
          text: "It is another Novastoshnah, only ten times better. Sea Cow is wiser than I thought. No one can climb down those cliffs, and the seaward rocks would smash a ship apart. If any place in the ocean is safe, this is the one."
        - id: ch05-b07
          speaker: narrator
          text: "Kotick thought of the female seal waiting at home. He longed to return at once, but he carefully explored the whole country first, so he could answer every question. Then he dived, found the tunnel entrance again, and raced south through it. No creature but a seal or sea cow would have guessed the refuge existed. Looking back at the cliffs, even Kotick could hardly believe he had passed beneath them."
        - id: ch05-b08
          speaker: narrator
          text: "He reached home in six days, and he had not traveled slowly. Just above Sea Lion's Neck, the first seal he met was the one who had waited for him. One look at his eyes told her that he had finally found the island."
    - id: ch06
      title: The Seals Follow Kotick
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: "The bachelors laughed when Kotick described his discovery. Sea Catch laughed too, and so did the other grown seals. One young seal of Kotick's own age spoke for them. He had married that year and made sure everyone knew it."
        - id: ch06-b02
          speaker: young_seal
          text: "Your story sounds fine, Kotick, but you cannot appear from nowhere and command us to leave. We have fought to win nurseries here. You have never done that. You chose to wander around the sea instead."
        - id: ch06-b03
          speaker: narrator
          text: "The others laughed again. The young seal swung his head proudly from side to side."
        - id: ch06-b04
          speaker: kotick
          text: "I have no nursery to defend. I only want to lead everyone to a safe home. Why keep fighting here?"
        - id: ch06-b05
          speaker: young_seal
          text: "If you want an excuse to avoid a fight, say so. I have nothing more to discuss."
        - id: ch06-b06
          speaker: kotick
          text: "If I beat you, will you come with me?"
        - id: ch06-b07
          speaker: narrator
          text: "Anger brought a green light into Kotick's eyes. He hated being forced to fight at all."
        - id: ch06-b08
          speaker: young_seal
          text: "All right. Win, and I will go."
        - id: ch06-b09
          speaker: narrator
          text: "He had no chance to change his mind. Kotick shot forward and sank his teeth into the fat of the young seal's neck. He pulled backward, dragged his enemy down the beach, shook him, and knocked him flat. Then Kotick turned on the watching seals."
        - id: ch06-b10
          speaker: kotick
          text: "For five seasons I have done everything I could for you. I found an island where no one will kill you, yet you refuse to believe until someone drags the heads from your foolish necks. Very well. I will teach you. Defend yourselves!"
          emotion: angry
        - id: ch06-b11
          speaker: narrator
          text: "Limmershin saw ten thousand great seal fights every year, but in all his small bird's life he had never seen anything like Kotick's charge through the nurseries. Kotick threw himself at the largest sea catch he could find. He caught the great seal by the throat, choked him, struck him, and battered him until the seal grunted for mercy. Then Kotick flung that opponent aside and sprang at the next. He drove straight through the crowded beach without pausing to choose easy enemies."
        - id: ch06-b12
          speaker: narrator
          text: "Kotick had three great advantages. Unlike the nursery seals, he had not gone without food for four months of every year. His long journeys through the deep sea had kept every muscle in perfect condition. And until that day, he had never spent his strength in a fight. His curly white mane rose with fury, his eyes burned, and his long dog teeth flashed. The seals who had mocked his travels now saw what those five years had made of him. He looked magnificent."
        - id: ch06-b13
          speaker: narrator
          text: "Old Sea Catch watched his son rush past, hauling gray veterans around like halibut and scattering bachelors in every direction. Then the old seal gave a tremendous roar."
        - id: ch06-b14
          speaker: sea_catch
          text: "He may be foolish, but he is the finest fighter on the beaches! Do not attack your father, Son. I am on your side!"
        - id: ch06-b15
          speaker: narrator
          text: "Kotick roared back. Sea Catch waddled into the battle with his mustache standing straight and his breath blowing like a locomotive. Matkah and the seal who meant to marry Kotick crouched nearby and admired their two fighters. It was a splendid battle. Father and son kept going as long as any seal dared lift his head against them. When none did, they stopped fighting and paraded side by side along the beach, bellowing like two proud kings."
        - id: ch06-b16
          speaker: narrator
          text: "Night came, and the Northern Lights winked through the fog. Kotick climbed onto a bare rock and looked over the scattered nurseries and the seals lying torn and bleeding below."
        - id: ch06-b17
          speaker: kotick
          text: "Now you have learned your lesson."
        - id: ch06-b18
          speaker: sea_catch
          text: "My wig! Even a Killer Whale could not have left them in worse shape. Son, I am proud of you. More than that, I will follow you to this island, if it truly exists."
        - id: ch06-b19
          speaker: narrator
          text: "Sea Catch hauled his bruised body stiffly onto the rock. Kotick raised his voice over the beach."
        - id: ch06-b20
          speaker: kotick
          text: "Listen, you fat sea pigs! Who will follow me through Sea Cow's tunnel? Answer now, or I will teach you once more!"
          emotion: angry
        - id: ch06-b21
          speaker: narrator
          text: "A murmur traveled along the beaches like the edge of the tide. Then thousands of exhausted seals answered together."
        - id: ch06-b22
          speakers: [seal_1, seal_2, seal_3, seal_4]
          ensemble: chorus
          text: "We will go. We will follow Kotick, the White Seal."
        - id: ch06-b23
          speaker: narrator
          text: "Kotick tucked his head proudly between his shoulders and closed his eyes. At that moment he was no longer white. Blood covered him from nose to tail. Even so, he would have scorned to inspect or touch a single wound."
        - id: ch06-b24
          speaker: narrator
          text: "One week later, Kotick led his army away from the old beaches and north toward the Sea Cow's tunnel. Nearly ten thousand bachelors and full-grown old seals followed the white leader into the open water. They trusted him to find the hidden entrance beneath the cliffs and guide them safely through its long darkness. The seals who stayed at Novastoshnah watched them leave and called every one of them a fool."
        - id: ch06-b25
          speaker: narrator
          text: "The next spring, the travelers met the old colony on the Pacific fishing banks. Kotick's seals told such wonderful stories of the new beaches beyond Sea Cow's tunnel that still more seals decided to leave Novastoshnah. It did not happen in one season. Seals are not quick to accept a new idea, and they need a long time to turn it over in their minds. But year after year, more families left Novastoshnah, Lukannon, and the other crowded nurseries to make the hidden journey north."
        - id: ch06-b26
          speaker: narrator
          text: "They went to the quiet, sheltered beaches Kotick had found, in the sea where no man comes. There were no killing pens beyond the tunnel and no hunters waiting behind the dunes. Kotick spent every summer there, growing larger, fatter, and stronger, while the young bachelors played safely around him."
