audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and unhurried, with the steady rhythm of an old fireside tale
        timbre: clear and gently weathered
        pace: measured
        pitch: medium
    jack_hannaford:
      display_name: Jack Hannaford
      tts:
        delivery: quick-witted and assured, with a sly ease that never sounds hurried
        timbre: lean and weathered
        pace: medium
        pitch: medium-low
    farmer_wife:
      display_name: Farmer's Wife
      tts:
        delivery: earnest and trusting, speaking each thought with complete conviction
        timbre: mature and homely
        pace: medium
        pitch: medium
    farmer:
      display_name: Farmer
      tts:
        delivery: blunt and impatient, with confidence that easily turns to temper
        timbre: sturdy and rough-edged
        pace: medium
        pitch: low
  chapters:
    - id: ch01
      title: Ten Pounds in the Chimney
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Jack Hannaford was an old soldier who had spent years and years at war. By the time the fighting was behind him, his clothes were worn through at the elbows, and he had no idea where to earn his living. He crossed moors and went down through glens until he came to a farm. The farmer had gone to market, leaving his wife at home. She had been a widow before he married her, and she was a very foolish woman. The farmer was foolish too. By the end of this tale, you may decide which of them was worse.
        - id: ch01-b02
          speaker: narrator
          text: Before setting out for market, the farmer had given his wife ten pounds in gold.
        - id: ch01-b03
          speaker: farmer
          text: Here are ten pounds, all in gold. Keep them safe until I get home.
        - id: ch01-b04
          speaker: narrator
          text: A wiser man would never have left the money with her. Once he was gone, his wife decided to hide it from thieves. She tied the gold in a rag and pushed the bundle up the parlor chimney.
        - id: ch01-b05
          speaker: farmer_wife
          text: There now. No thief will ever find it up there. I'm certain of that.
        - id: ch01-b06
          speaker: narrator
          text: Just then, Jack Hannaford came to the farm and knocked at the door.

    - id: ch02
      title: A Message from Paradise
      blocks:
        - id: ch02-b01
          speaker: farmer_wife
          text: Who's there?
        - id: ch02-b02
          speaker: jack_hannaford
          text: Jack Hannaford.
        - id: ch02-b03
          speaker: farmer_wife
          text: And where have you come from?
        - id: ch02-b04
          speaker: jack_hannaford
          text: Paradise.
        - id: ch02-b05
          speaker: farmer_wife
          text: Lord have mercy! Then perhaps you've seen my former husband there.
          emotion: surprised
        - id: ch02-b06
          speaker: jack_hannaford
          text: Yes, I have seen him.
        - id: ch02-b07
          speaker: farmer_wife
          text: How is the poor man getting along?
        - id: ch02-b08
          speaker: jack_hannaford
          text: Only fairly well. He repairs old shoes, and cabbage is all he gets to eat.
        - id: ch02-b09
          speaker: farmer_wife
          text: Oh, dear! Didn't he send me any message?
        - id: ch02-b10
          speaker: jack_hannaford
          text: He did. He's run out of leather, and his pockets are empty. He asked you to send a few shillings so he can buy a new supply.
        - id: ch02-b11
          speaker: farmer_wife
          text: Then he shall have the money. Bless his poor soul!
        - id: ch02-b12
          speaker: narrator
          text: She hurried to the parlor chimney, pulled down the rag, and gave Jack all ten pounds. She told him that her former husband could spend whatever he needed and send back the rest. Once the money was in Jack's hands, he did not linger. He walked away as fast as he could.

    - id: ch03
      title: The Farmer Gives Chase
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Before long, the farmer came home and asked for his gold. His wife explained that she had sent it to her former husband in Paradise. A soldier was carrying it there so the dead man could buy leather and repair the shoes of Heaven's saints and angels. The farmer flew into a rage. He swore that he had never known anyone as foolish as his wife.
        - id: ch03-b02
          speaker: farmer_wife
          text: You're the greater fool. You were the one who trusted me with the money.
        - id: ch03-b03
          speaker: narrator
          text: There was no time to stand there arguing. The farmer mounted his horse and raced after Jack Hannaford. Soon Jack heard hoofbeats clattering along the road behind him. He knew the farmer must be coming after him. So Jack lay flat on the ground. With one hand shading his eyes, he stared into the sky and pointed upward with the other.
        - id: ch03-b04
          speaker: farmer
          text: What are you doing down there?
        - id: ch03-b05
          speaker: jack_hannaford
          text: Lord save you, I've just seen a very strange sight!
        - id: ch03-b06
          speaker: farmer
          text: What did you see?
        - id: ch03-b07
          speaker: jack_hannaford
          text: A man going straight up into the sky, just as though he were walking along a road.
        - id: ch03-b08
          speaker: farmer
          text: Can you still see him?
        - id: ch03-b09
          speaker: jack_hannaford
          text: Yes, I can.
        - id: ch03-b10
          speaker: farmer
          text: Where is he?
        - id: ch03-b11
          speaker: jack_hannaford
          text: Climb down from your horse and lie here.
        - id: ch03-b12
          speaker: farmer
          text: All right, if you'll hold my horse.
        - id: ch03-b13
          speaker: narrator
          text: Jack willingly took the reins while the farmer lay on the ground.

    - id: ch04
      title: Two Foolish Things
      blocks:
        - id: ch04-b01
          speaker: farmer
          text: I can't see him.
        - id: ch04-b02
          speaker: jack_hannaford
          text: Put your hand over your eyes. Then you'll soon see a man flying away from you.
        - id: ch04-b03
          speaker: narrator
          text: And that was exactly what the farmer saw. Jack sprang onto the horse and rode off with it. The farmer walked all the way home.
        - id: ch04-b04
          speaker: farmer_wife
          text: You're a bigger fool than I am. I did only one foolish thing, but you've done two.
