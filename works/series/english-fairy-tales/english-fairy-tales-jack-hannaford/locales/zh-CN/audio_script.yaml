audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容讲述古老童话，带着一本正经的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中
    jack_hannaford:
      display_name: 杰克·汉纳福德
      tts:
        delivery: 老练机敏，编起瞎话来镇定自若
        timbre: 粗粝而清楚
        pace: 中等
        pitch: 中低
    farmer_wife:
      display_name: 农夫妻子
      tts:
        delivery: 糊涂轻信，想到什么便直说什么
        timbre: 明亮朴实
        pace: 中等偏快
        pitch: 中高
    farmer:
      display_name: 农夫
      tts:
        delivery: 自以为精明，着急时粗声粗气
        timbre: 浑厚朴实
        pace: 中等
        pitch: 中低
  chapters:
    - id: ch01
      title: 从天堂来的老兵
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "从前有个老兵，名叫杰克·汉纳福德。他打了许多年仗，穷得连衣肘都磨破了，也不知道该去哪里谋生。他走过荒原，穿过山谷，最后来到一座农庄。农夫赶集去了，家里只有他的妻子。她嫁给农夫以前守过寡，是个糊涂透顶的女人，可农夫也聪明不到哪里去。究竟谁更傻，听完故事，你自己来评一评。"
        - id: ch01-b02
          speaker: narrator
          text: "农夫出门前，拿出十英镑，枚枚都是金币，叫妻子妥善保管，等他回来。他若不傻，当然不会把钱交给她。农夫赶着大车走后，妻子怕钱叫贼偷去，便用破布包好，塞进客厅的烟囱。"
        - id: ch01-b03
          speaker: farmer_wife
          text: "藏在这儿，贼一辈子也找不到。这样肯定安全了。"
        - id: ch01-b04
          speaker: narrator
          text: "这时，老兵杰克走来敲门。"
        - id: ch01-b05
          speaker: farmer_wife
          text: "门外是谁呀？"
        - id: ch01-b06
          speaker: jack_hannaford
          text: "我是杰克·汉纳福德。"
        - id: ch01-b07
          speaker: farmer_wife
          text: "你是从哪儿来的？"
        - id: ch01-b08
          speaker: jack_hannaford
          text: "我从天堂来。"
        - id: ch01-b09
          speaker: farmer_wife
          text: "主啊，发发慈悲！你在那儿见过我家老头子吗？"
        - id: ch01-b10
          speaker: narrator
          text: "她问的是自己死去的前夫。"
        - id: ch01-b11
          speaker: jack_hannaford
          text: "见过他。"
        - id: ch01-b12
          speaker: farmer_wife
          text: "那他日子过得怎么样？"
        - id: ch01-b13
          speaker: jack_hannaford
          text: "只能算马马虎虎。他天天替人补旧鞋，吃来吃去却只有卷心菜。"
        - id: ch01-b14
          speaker: farmer_wife
          text: "哎哟，他可真可怜！难道没托你给我捎句话？"
        - id: ch01-b15
          speaker: jack_hannaford
          text: "当然托了。他的皮子已经用光，口袋里又一个钱也没有，想叫你捎几个先令，好买一批新皮子。"
        - id: ch01-b16
          speaker: farmer_wife
          text: "钱一定给他。愿上帝保佑他可怜的灵魂！"
        - id: ch01-b17
          speaker: narrator
          text: "女人跑到烟囱前，取出那个布包，把十英镑全交给杰克。她还特意嘱咐，自己的老头子要用多少就用多少，只须把剩下的钱送回来。杰克拿了钱，一刻也没耽搁，迈开大步赶紧走了。"
    - id: ch02
      title: 谁是更大的傻瓜
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "没过多久，农夫回家来要钱。妻子告诉他，自己已经托一个老兵把钱带上天堂，送给前夫买皮子，好替圣徒和天使补鞋。农夫气得赌咒，说这辈子从没见过这么傻的妻子。"
        - id: ch02-b02
          speaker: farmer_wife
          text: "你明知道我傻，还把钱交给我，那不是比我更傻吗？"
        - id: ch02-b03
          speaker: narrator
          text: "农夫顾不上再跟她斗嘴，跨上马就去追杰克。杰克听见背后传来一阵马蹄声，猜到准是农夫赶来了。他立刻躺在路上，一只手遮住眼睛，抬头盯着天空，另一只手还直指天上。农夫追到跟前，勒住了马。"
        - id: ch02-b04
          speaker: farmer
          text: "你躺在地上做什么？"
        - id: ch02-b05
          speaker: jack_hannaford
          text: "愿上帝保佑你！我刚刚瞧见了一件稀奇事。"
        - id: ch02-b06
          speaker: farmer
          text: "你瞧见什么了？"
        - id: ch02-b07
          speaker: jack_hannaford
          text: "有个人一直往天空升，走得跟脚下真有一条大路似的。"
        - id: ch02-b08
          speaker: farmer
          text: "那人现在还看得见吗？"
        - id: ch02-b09
          speaker: jack_hannaford
          text: "现在还看得见。"
        - id: ch02-b10
          speaker: farmer
          text: "那人究竟在哪儿？"
        - id: ch02-b11
          speaker: jack_hannaford
          text: "你先下马，躺在地上看。"
        - id: ch02-b12
          speaker: farmer
          text: "那你得替我把马牵住。"
        - id: ch02-b13
          speaker: narrator
          text: "杰克一口答应，接过了缰绳。农夫躺到地上，抬头找了半天。"
        - id: ch02-b14
          speaker: farmer
          text: "我怎么什么也看不见？"
        - id: ch02-b15
          speaker: jack_hannaford
          text: "拿手遮住眼睛吧。你很快就会看见，有个人正从你眼前飞走。"
    - id: ch03
      title: 第二件傻事
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "这句话果然说中了。杰克翻身跳上马，骑着它飞快地走了。农夫丢了马，只能一步一步走回家。"
        - id: ch03-b02
          speaker: farmer_wife
          text: "你可比我更傻。我只做了一件傻事，你倒一连做了两件。"
