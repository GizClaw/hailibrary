audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and unhurried, with the steady rhythm of an old fireside tale
        timbre: clear and gently weathered
        pace: measured
        pitch: medium
    eldest_princess:
      display_name: Elder Princess
      tts:
        delivery: proud and bitter, with cold resolve beneath every word
        timbre: mature and firm
        pace: measured
        pitch: medium-low
    youngest_princess:
      display_name: Younger Princess
      tts:
        delivery: gentle and earnest, becoming desperate as danger closes in
        timbre: clear and youthful
        pace: medium
        pitch: medium-high
    millers_daughter:
      display_name: Miller's Daughter
      tts:
        delivery: alert and direct, calling out with sudden urgency
        timbre: bright and clear
        pace: medium-quick
        pitch: medium-high
    enchanted_harp:
      display_name: Enchanted Harp
      tts:
        delivery: low and clear, singing with an eerie and sorrowful stillness
        timbre: pure and bell-like
        pace: measured
        pitch: medium-high
  chapters:
    - id: ch01
      title: Two Sisters at Binnorie
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there were two daughters of a king. They lived in a bower near the bonny mill-dams of Binnorie. Sir William came to court the elder sister, and he won her love. With a glove and a ring, they pledged themselves to each other.
        - id: ch01-b02
          speaker: narrator
          text: But after a while, Sir William saw the younger sister. Her cheeks were like cherries, and her hair was golden. His love turned toward her, until he cared nothing for the elder sister. The elder princess began to hate her sister for taking his love away. Her hatred grew each day, and she made plan after plan to be rid of her.
        - id: ch01-b03
          speaker: eldest_princess
          text: Come with me this fine morning. Let's watch our father's boats arrive at the bonny mill-stream of Binnorie.
        - id: ch01-b04
          speaker: narrator
          text: The sisters went hand in hand. At the riverbank, the younger one stepped onto a stone to watch for the boats. Her sister came up behind her, seized her around the waist, and flung her into the rushing stream.

    - id: ch02
      title: The Rushing Mill-Stream
      blocks:
        - id: ch02-b01
          speaker: youngest_princess
          text: Oh, sister, please reach out your hand! I'll give you half of everything I have now, and half of everything I ever receive!
          emotion: fearful
        - id: ch02-b02
          speaker: narrator
          text: The current carried her farther away.
        - id: ch02-b03
          speaker: eldest_princess
          text: No, sister. I won't give you my hand. I will inherit all your land. And I would be ashamed to touch the hand of the one who came between me and my own true love.
          emotion: angry
        - id: ch02-b04
          speaker: youngest_princess
          text: Then reach me your glove, sister! Save me, and you can have your William back!
          emotion: fearful
        - id: ch02-b05
          speaker: narrator
          text: Still she drifted farther from the bank.
        - id: ch02-b06
          speaker: eldest_princess
          text: Go on and sink! You will touch neither my hand nor my glove. Once you're under the bonny mill-stream of Binnorie, sweet William will belong to me.
          emotion: angry
        - id: ch02-b07
          speaker: narrator
          text: The cruel princess turned away and went home to her father's castle. Her sister was swept down the mill-stream, swimming for a time and then sinking, until she came near the mill.

    - id: ch03
      title: The Miller's Daughter
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: That day, the miller's daughter was cooking and needed water. She went to draw some from the stream and saw something floating toward the mill-dam.
        - id: ch03-b02
          speaker: millers_daughter
          text: Father! Father! Shut the dam! Something white is coming down the stream. Is it a merry maiden, or a milk-white swan?
        - id: ch03-b03
          speaker: narrator
          text: The miller hurried to the dam and stopped the heavy, cruel wheels. Then he and his daughter drew the princess from the water and laid her on the bank.
        - id: ch03-b04
          speaker: narrator
          text: She looked fair and beautiful there. Pearls and precious stones shone in her golden hair. A golden girdle covered her waist, and the gold fringe of her white dress fell over her lily-white feet. But she was drowned. Drowned.

    - id: ch04
      title: The Harper Returns
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: A famous harper passed the mill-dam while the princess lay there in all her beauty. He saw her sweet, pale face. Though he traveled far away, he could never forget it.
        - id: ch04-b02
          speaker: narrator
          text: Many days later, he returned to the bonny mill-stream of Binnorie. He went to the place where they had laid her to rest, but all he found were her bones and her golden hair. From her breastbone and hair, he made a harp.
        - id: ch04-b03
          speaker: narrator
          text: Then the harper climbed the hill above the mill-dam and came to the castle of the princess's father.

    - id: ch05
      title: The Harp That Sang
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: That night, everyone gathered in the castle hall to hear the great harper. The king and queen were there, along with their daughter and son, Sir William, and the whole court.
        - id: ch05-b02
          speaker: narrator
          text: First he played his old harp. With its music, he could fill them with joy or bring them to tears, just as he pleased. The new harp rested on a stone in the hall. Then it began to sing by itself, low and clear. The harper stopped, and everyone fell silent.
        - id: ch05-b03
          speaker: enchanted_harp
          text: Oh, yonder sits my father, the king. Binnorie, oh Binnorie. And yonder sits my mother, the queen, by the bonny mill-dams of Binnorie.
        - id: ch05-b04
          speaker: enchanted_harp
          text: And yonder stands my brother Hugh. Binnorie, oh Binnorie. Beside him stands my William, false and true, by the bonny mill-dams of Binnorie.
        - id: ch05-b05
          speaker: narrator
          text: Everyone wondered at the song. The harper told them that he had seen the drowned princess on the bank near the bonny mill-dams of Binnorie. He told them, too, how he later made this harp from her hair and breastbone.
        - id: ch05-b06
          speaker: narrator
          text: At that very moment, the harp began to sing once more. This time its voice rang loud and clear.
        - id: ch05-b07
          speaker: enchanted_harp
          text: And there sits my sister, who drowned me by the bonny mill-dams of Binnorie.
        - id: ch05-b08
          speaker: narrator
          text: The harp snapped and broke. It never sang again.
