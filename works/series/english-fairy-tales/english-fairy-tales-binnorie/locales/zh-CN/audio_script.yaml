audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容讲述古老童话，带着一本正经的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中
    elder_princess:
      display_name: 大公主
      tts:
        delivery: 骄傲冷硬，妒恨时狠毒决绝
        timbre: 清亮而冷峻
        pace: 中等偏慢
        pitch: 中高
    younger_princess:
      display_name: 小公主
      tts:
        delivery: 温柔清澈，危急时哀切，歌唱时空灵沉静
        timbre: 轻柔纯净
        pace: 舒缓
        pitch: 高
    miller_daughter:
      display_name: 磨坊主的女儿
      tts:
        delivery: 朴实爽快，发现险情时急切响亮
        timbre: 明亮清脆
        pace: 中等偏快
        pitch: 中高
  chapters:
    - id: ch01
      title: 磨坊河边的姐妹
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "从前，有一位国王的两个女儿住在闺楼里，离比诺里秀美的磨坊堰塘不远。威廉爵士前来追求大公主，用手套和戒指订下婚约，也赢得了她的心。后来，他看见小公主双颊红润，一头金发，便转而爱上了她，把姐姐忘在一旁。大公主恨妹妹夺走威廉的爱情，恨意一天比一天深，一心盘算着怎样除掉她。"
        - id: ch01-b02
          speaker: narrator
          text: "一个晴朗的早晨，大公主对妹妹开了口。"
        - id: ch01-b03
          speaker: elder_princess
          text: "咱们去比诺里的磨坊河边吧，正好看看父王的船回来。"
        - id: ch01-b04
          speaker: narrator
          text: "姐妹俩手牵着手来到河边。小公主站上一块石头，朝船来的方向张望。姐姐从后面悄悄靠近，猛地搂住她的腰，把她推进湍急的河水里。小公主被水越冲越远，只能大声求救。"
        - id: ch01-b05
          speaker: younger_princess
          text: "姐姐，姐姐，伸手拉我一把！救我上去吧，我现在有的、将来会有的，全都分一半给你！"
          emotion: fearful
        - id: ch01-b06
          speaker: elder_princess
          text: "不，我不会拉你。你的土地本来就该由我继承。你这只手横在我和心上人中间，我要是碰它，才真该羞耻。"
        - id: ch01-b07
          speaker: narrator
          text: "河水仍把小公主往下游卷去，她又一次苦苦哀求。"
        - id: ch01-b08
          speaker: younger_princess
          text: "姐姐，那就把手套递给我吧！只要你肯救我，我就把威廉还给你！"
          emotion: fearful
        - id: ch01-b09
          speaker: elder_princess
          text: "你只管往下沉吧。我的手和手套，你一样也碰不到。等你沉进比诺里的磨坊河底，亲爱的威廉就全是我的了。"
        - id: ch01-b10
          speaker: narrator
          text: "狠心的大公主说完，转身回了父王的城堡。"
    - id: ch02
      title: 水中的白影
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "小公主顺着磨坊河漂向下游。她一会儿挣扎着浮起来，一会儿又沉入水里，最后漂到了磨坊附近。那天，磨坊主的女儿正要做饭，需要到河里舀水。她走到河边，看见一个白色的东西正朝堰塘漂来，赶紧呼喊父亲。"
        - id: ch02-b02
          speaker: miller_daughter
          text: "爸爸！爸爸！快把水闸关上！河里漂来一个白色的东西，不知是位俏姑娘，还是一只雪白的天鹅！"
        - id: ch02-b03
          speaker: narrator
          text: "磨坊主连忙跑到水闸边，让沉重而无情的磨轮停住。父女俩把小公主捞上来，放在岸边。她静静躺在那里，看上去依旧美丽动人。金发间缀着珍珠宝石，金腰带遮住了纤腰，白裙上的金色流苏垂到她百合般洁白的双足上。可她已经淹死了。她真的淹死了。"
    - id: ch03
      title: 用遗骨制成的竖琴
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "小公主美丽的身躯还躺在岸上时，一位名闻四方的竖琴师正好经过比诺里的磨坊堰塘。他看见了她苍白温柔的脸。后来，他远行到很远的地方，却怎么也忘不掉那张脸。许多天过去，他又回到比诺里的磨坊河边。可在安葬小公主的地方，只剩下她的遗骨和金发。竖琴师便用她的胸骨和头发做成一架竖琴，带着琴走上山冈，来到她父王的城堡。"
        - id: ch03-b02
          speaker: narrator
          text: "当天夜里，城堡大厅里坐满了人，都在等这位了不起的竖琴师演奏。国王和王后在场，他们的女儿和儿子也在场，威廉爵士和满朝廷臣全来了。竖琴师先弹起自己的旧琴。他想叫大家快乐，琴声便叫人欢喜。他想叫大家悲伤，琴声便惹人落泪。至于当天新做的那架竖琴，他把它放在大厅的一块石头上。"
        - id: ch03-b03
          speaker: narrator
          text: "过了一会儿，新竖琴忽然自己唱起来，声音低柔又清澈。竖琴师停下双手，大厅里所有人都安静了。竖琴唱出了这样的歌。"
        - id: ch03-b04
          speaker: younger_princess
          text: "那边坐着我的父王，比诺里啊，比诺里。那边坐着我的母后，在比诺里秀美的磨坊堰塘边。那边站着我的兄弟休，比诺里啊，比诺里。他身旁是我的威廉，负心又真心，在比诺里秀美的磨坊堰塘边。"
    - id: ch04
      title: 竖琴揭开的秘密
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "众人听见竖琴唱出这些名字，全都惊诧不已。竖琴师便告诉他们，他曾在比诺里的堰塘边看见淹死的公主躺在岸上，后来又用她的金发和胸骨制成了这架琴。话音刚落，竖琴再次唱了起来。这一次，歌声响亮又清楚。"
        - id: ch04-b02
          speaker: younger_princess
          text: "那里坐着淹死我的姐姐，在比诺里秀美的磨坊堰塘边。"
        - id: ch04-b03
          speaker: narrator
          text: "歌声一落，琴弦突然崩断，竖琴也裂开了。从那以后，它再也没有唱过。"
