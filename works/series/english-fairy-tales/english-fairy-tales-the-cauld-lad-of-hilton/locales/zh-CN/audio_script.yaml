audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容讲述古老童话，带着轻快而一本正经的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中
    brownie:
      display_name: 棕精灵
      tts:
        delivery: 古怪顽皮，吟唱时带着哀怨，得意时轻快跳脱
        timbre: 粗哑而小巧
        pace: 忽缓忽快
        pitch: 中高
    henwife:
      display_name: 养鸡婆
      tts:
        delivery: 老练直率，不耐烦时尖刻有力
        timbre: 干涩苍老
        pace: 中等
        pitch: 中低
  chapters:
    - id: ch01
      title: 最爱捣乱的棕精灵
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "很久很久以前，希尔顿庄园里住着一个棕精灵。要说跟人作对，再没有哪个棕精灵比得过它。仆人们一睡下，它就把庄园搅得乱七八糟。盐罐里装进糖，啤酒里撒上胡椒，这还只是开头。椅子被它推倒，桌子叫它翻了个底朝天，连炉火也给扒灭了。它能闯多少祸，就一定闯多少祸。"
        - id: ch01-b02
          speaker: narrator
          text: "当然，它偶尔也会有好心情。那时候可就……等等，你问棕精灵是什么？它也算一种鬼怪，只是没有红帽鬼那么凶。什么？连鬼怪和红帽鬼都没听过？唉呀呀，这个世道可要变成什么样啦！"
        - id: ch01-b03
          speaker: narrator
          text: "这么说吧，棕精灵是个滑稽的小东西，半人半妖，耳朵尖尖的，身上长满毛。有人埋了宝藏，会在上面洒几滴刚宰的小山羊或小羊羔的血。更稳妥的，还会把牲口和财宝埋在一起。这样，棕精灵就肯替他守着宝藏，把别人统统吓走。"
    - id: ch02
      title: 尚未落下的橡子
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "我刚才说到哪儿了？对了，希尔顿庄园这个棕精灵虽然爱闯祸，倒也肯帮忙。仆人若留一碗奶油，或是一块抹了蜂蜜的指节面包给它，它就会替大家收好东西，把厨房打扫得整整齐齐。"
        - id: ch02-b02
          speaker: narrator
          text: "有一天晚上，仆人们很迟还没睡。他们听见厨房里有声音，便悄悄往里看。棕精灵正抓着烤肉架的吊链，荡过来，荡过去，嘴里念着一支哀歌。"
        - id: ch02-b03
          speaker: brownie
          text: "苦啊！苦啊！那一颗橡子，还没落下树梢。它要长成大树，大树要做成摇篮，摇篮要摇着婴孩，婴孩要长成大汉，大汉才能使我安息。苦啊！苦啊！"
          emotion: sad
    - id: ch03
      title: 林肯绿斗篷
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "仆人们听了，都很可怜这个不幸的小东西。他们去找附近的养鸡婆，请教怎样才能送走它。"
        - id: ch03-b02
          speaker: henwife
          text: "这还不容易。拿一样不会坏的东西，算作它干活的酬劳。棕精灵一收下，马上就会离开。"
        - id: ch03-b03
          speaker: narrator
          text: "仆人们便用林肯绿呢做了一件斗篷，还配上兜帽。他们把衣裳放在炉边，躲到一旁看着。棕精灵来了。它一瞧见兜帽和斗篷，立刻穿到身上，欢快地蹦来跳去，又用一条腿跳起了舞。"
        - id: ch03-b04
          speaker: brownie
          text: "你们的斗篷归了我，兜帽也归了我。希尔顿的冷小子，再不替你们干活！"
          emotion: happy
        - id: ch03-b05
          speaker: narrator
          text: "这句话刚唱完，它就不见了。打那以后，谁也没再见过它，也没再听到过它的消息。"
