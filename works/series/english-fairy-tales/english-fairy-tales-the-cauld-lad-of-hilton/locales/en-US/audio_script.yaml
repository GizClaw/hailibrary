audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and unhurried, with the steady rhythm of an old fireside tale
        timbre: clear and gently weathered
        pace: measured
        pitch: medium
    brownie:
      display_name: The Brownie
      tts:
        delivery: mournful and uncanny, turning light and lively when delighted
        timbre: small and rough
        pace: measured
        pitch: medium-high
    henwife:
      display_name: The Henwife
      tts:
        delivery: practical and certain, with the ease of someone who knows old lore
        timbre: earthy and clear
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Contrary Brownie
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long years ago, Hilton Hall was home to the most contrary Brownie you could ever meet. Once the servants had gone to bed, it turned everything upside down. It tipped sugar into the saltcellars and pepper into the beer. It knocked over chairs, laid tables on their backs, raked out the fires, and made every kind of mischief it could.
        - id: ch01-b02
          speaker: narrator
          text: Now and then, though, the Brownie was in a good temper. But wait. What's a Brownie, you ask? It's something like a Bogle, only not as cruel as a Redcap. What? You don't know Bogles or Redcaps either? Ah, what is the world coming to?
        - id: ch01-b03
          speaker: narrator
          text: A Brownie, of course, is a funny little creature, half man and half goblin, with pointed ears and a hairy hide. If you buried treasure, you could scatter drops of blood from a newly killed kid or lamb over it. Better still, you could bury the animal with the treasure. Then a Brownie would guard it and frighten everyone else away.

    - id: ch02
      title: The Song on the Jack Chain
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Now, where was I? Ah, yes. The Hilton Brownie loved its mischief. Still, whenever the servants left it a bowl of cream or a knuckle cake covered with honey, it cleared things away for them and left the kitchen neat.
        - id: ch02-b02
          speaker: narrator
          text: One night, the servants stayed up late. They heard a noise from the kitchen and peeped inside. There was the Brownie, swinging back and forth on the Jack chain and singing to itself.
        - id: ch02-b03
          speaker: brownie
          text: Woe is me! Woe is me! The acorn has not yet fallen from the tree that will grow the wood that will make the cradle that will rock the baby who will grow into the man who will lay me. Woe is me! Woe is me!
          emotion: sad

    - id: ch03
      title: The Henwife's Advice
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The servants felt sorry for the poor Brownie. They went to the nearest henwife and asked how they might send it away.
        - id: ch03-b02
          speaker: henwife
          text: That's simple enough. Pay a Brownie for its work with something that won't perish, and it will leave at once.
        - id: ch03-b03
          speaker: narrator
          text: So the servants made a hooded cloak of Lincoln green. They laid it beside the hearth and settled down to watch.

    - id: ch04
      title: No More Good
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The Brownie came in and found the hood and cloak. It put them on, then frisked about and danced on one leg.
        - id: ch04-b02
          speaker: brownie
          text: I've taken your cloak, and I've taken your hood. The Cauld Lad of Hilton will do no more good.
          emotion: happy
        - id: ch04-b03
          speaker: narrator
          text: With that, the Brownie vanished. No one ever saw or heard it again.
