audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容讲述古老童话，带着一本正经的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中
    great_bear:
      display_name: 大熊
      tts:
        delivery: 粗犷低沉，开口时威严而响亮
        timbre: 粗厚浑沉
        pace: 缓慢
        pitch: 低
    middle_bear:
      display_name: 中熊
      tts:
        delivery: 稳重平直，语气不急不慢
        timbre: 温厚结实
        pace: 中等
        pitch: 中
    little_bear:
      display_name: 小小熊
      tts:
        delivery: 稚嫩直接，着急时又尖又亮
        timbre: 细小清亮
        pace: 中等偏快
        pitch: 高
  chapters:
    - id: ch01
      title: 三只熊的家
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "从前，森林里有一座属于三只熊自己的小屋，它们就住在一起。一只是又大又大的大熊，一只是中等个头的中熊，还有一只是又小又小的小小熊。"
        - id: ch01-b02
          speaker: narrator
          text: "三只熊各有一只盛粥的罐子。大熊用大罐，中熊用中罐，小小熊用小罐。它们坐的椅子也是一把大、一把中、一把小。到了晚上，又分别睡进大床、中床和小床。每样东西都正配它们各自的个头。"
        - id: ch01-b03
          speaker: narrator
          text: "一天早晨，三只熊煮好早饭的粥，又把粥盛进各自的罐子。刚出锅的粥还烫着，要是急着入口，准会把嘴烫坏。于是它们先去森林里走一走，等粥凉些再回来吃。"
        - id: ch01-b04
          speaker: narrator
          text: "它们刚走，一个小老太婆就来到房子前。她可不像个善良诚实的人。先扒着窗口往里看，又贴着钥匙孔偷偷瞧。看见屋里没人，她便抬起门闩，推门进去了。三只熊从不伤害谁，也想不到会有人来伤害它们，所以门根本没锁。"
        - id: ch01-b05
          speaker: narrator
          text: "老太婆看见桌上的三罐粥，高兴极了。她要是个善良的人，本该等主人回来。三只熊虽然有熊那种粗粗的模样，心地却很好，也十分好客，说不定真会请她吃早饭。可这个老太婆又无礼又贪心，根本不想等，马上动手吃起了别人的东西。"
    - id: ch02
      title: 正合适的东西
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "她先走到又大又大的大熊的粥罐前，尝了一口。太烫了，她立刻骂了句难听的话。再尝中熊的粥，这回又太凉，她照样要骂。最后轮到又小又小的小小熊。它的粥不冷不热，正合适。老太婆喜欢得很，一口接一口，把整罐粥全吃光了。吃完还嫌小罐盛得不够多，又骂了一句。"
        - id: ch02-b02
          speaker: narrator
          text: "接着，她坐上又大又大的大熊的椅子，可那把椅子太硬。她换到中熊的椅子上，这一把又太软。最后那把属于又小又小的小小熊，不硬也不软，坐着正合适。她舒舒服服地窝在里面，越坐越久，竟把椅子底坐穿了，自己也扑通一声摔到地上。她爬起来，为这件事又恶狠狠地骂了一句。"
        - id: ch02-b03
          speaker: narrator
          text: "老太婆随后上了楼，走进三只熊合睡的卧房。她先躺到又大又大的大熊床上，可床头太高。接着躺到中熊床上，这张床的床尾又太高。最后，她试了又小又小的小小熊的床。床头不高，床尾也不高，处处都刚刚好。她舒舒服服地盖上被子，躺在那里，很快便睡熟了。"
    - id: ch03
      title: 谁动过我们的东西
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "这时候，三只熊觉得粥应该凉得差不多了，便回家吃早饭。又大又大的大熊走到桌前，一眼就看见自己的勺子直挺挺地插在粥里。"
        - id: ch03-b02
          speaker: great_bear
          text: "有人动过我的粥！"
        - id: ch03-b03
          speaker: narrator
          text: "大熊的声音又粗又哑，在屋里轰隆隆地响。中熊低头查看自己的粥，勺子也立在罐里。幸好这些都是木勺。若是银勺，那个淘气的老太婆准会把它们塞进口袋，一把也不留下。"
        - id: ch03-b04
          speaker: middle_bear
          text: "有人尝过我的粥！"
        - id: ch03-b05
          speaker: narrator
          text: "中熊就用它不大不小的嗓门说了这句话。轮到又小又小的小小熊查看了。勺子还留在粥罐里，罐子却已经空了，连一口粥也没有。"
        - id: ch03-b06
          speaker: little_bear
          text: "有人吃了我的粥，一口也没给我留下呀！"
        - id: ch03-b07
          speaker: narrator
          text: "小小熊的嗓音又细又小。三只熊这才明白，真有人闯进了它们的家，还吃光了小小熊的早饭。它们马上四处查看起来。大熊椅子上的硬坐垫没有摆正，一看就叫人动过。"
        - id: ch03-b08
          speaker: great_bear
          text: "有人坐过我的椅子！"
        - id: ch03-b09
          speaker: narrator
          text: "再看中熊的椅子，那个软坐垫已经叫人压得瘪了下去。"
        - id: ch03-b10
          speaker: middle_bear
          text: "我的椅子也叫人坐过了！"
        - id: ch03-b11
          speaker: narrator
          text: "至于第三把椅子，你当然知道它成了什么样。"
        - id: ch03-b12
          speaker: little_bear
          text: "有人坐了我的椅子，还把椅子底坐穿了！"
    - id: ch04
      title: 床上的闯入者
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "椅子查完了，三只熊觉得非得继续找不可，就一起上楼走进卧房。大熊来到自己的床前，马上发现枕头已经被人拉开，不在原来的位置。"
        - id: ch04-b02
          speaker: great_bear
          text: "有人睡过我的床！"
        - id: ch04-b03
          speaker: narrator
          text: "中熊再看自己的床，床上的长枕也叫人拉开，早已离开原位。"
        - id: ch04-b04
          speaker: middle_bear
          text: "也有人躺过我的床！"
        - id: ch04-b05
          speaker: narrator
          text: "小小熊走到床前。它的长枕还好好放在原处，枕头也整整齐齐地搁在长枕上。可是枕头上多了一颗又丑又脏的脑袋。那是小老太婆的脑袋，它可绝不该出现在这里，因为老太婆压根没有资格睡这张床。"
        - id: ch04-b06
          speaker: little_bear
          text: "有人睡了我的床——她还没走呢！"
          emotion: surprised
        - id: ch04-b07
          speaker: narrator
          text: "老太婆睡得实在太沉。又大又大的大熊那粗哑、轰隆隆的声音传进耳朵，她只当是大风怒吼，又像远处滚过一阵雷。中熊不大不小的声音响起来时，她也没有醒，只觉得有人在梦里说话。"
        - id: ch04-b08
          speaker: narrator
          text: "可又小又小的小小熊的声音实在又尖又细，一下就钻进耳朵，把她惊醒了。老太婆猛地坐起来，看见三只熊全站在床的一边，赶紧从另一边滚下去，朝窗口奔去。"
        - id: ch04-b09
          speaker: narrator
          text: "窗子正开着。三只熊爱干净，每天早晨一起床，总会把卧房的窗户打开。老太婆纵身跳了出去。"
        - id: ch04-b10
          speaker: narrator
          text: "她后来怎么样了呢？也许摔断了脖子，也许跑进森林，再也没找到路。还有一种可能，她走出了森林，却因为四处流浪，被治安官抓去送进感化院。究竟是哪一种，我可不知道。只知道三只熊从此再也没有见过她。"
