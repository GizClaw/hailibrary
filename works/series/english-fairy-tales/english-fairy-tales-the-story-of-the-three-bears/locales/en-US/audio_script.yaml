audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and unhurried, with the steady rhythm of an old fireside tale
        timbre: clear and gently weathered
        pace: measured
        pitch: medium
    great_huge_bear:
      display_name: Great, Huge Bear
      tts:
        delivery: firm and deliberate, with a great rough gruff weight
        timbre: deep and rugged
        pace: slow
        pitch: very low
    middle_bear:
      display_name: Middle Bear
      tts:
        delivery: direct and measured, with a steady everyday manner
        timbre: rounded and clear
        pace: medium
        pitch: medium
    little_small_wee_bear:
      display_name: Little, Small, Wee Bear
      tts:
        delivery: bright and earnest, turning sharp and shrill in alarm
        timbre: small and clear
        pace: medium-fast
        pitch: high
  chapters:
    - id: ch01
      title: The Three Bears
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, three Bears lived together in their own house in a wood. One was a Little, Small, Wee Bear. One was a Middle-sized Bear. And the other was a Great, Huge Bear.
        - id: ch01-b02
          speaker: narrator
          text: Each Bear had his own pot for porridge. The Little, Small, Wee Bear had a little pot, the Middle Bear had a middle-sized pot, and the Great, Huge Bear had a great pot.
        - id: ch01-b03
          speaker: narrator
          text: Each one had his own chair as well. There was a little chair for the Little, Small, Wee Bear, a middle-sized chair for the Middle Bear, and a great chair for the Great, Huge Bear.
        - id: ch01-b04
          speaker: narrator
          text: And each Bear had his own bed. The Little, Small, Wee Bear slept in a little bed, the Middle Bear in a middle-sized bed, and the Great, Huge Bear in a great bed.
        - id: ch01-b05
          speaker: narrator
          text: One morning, the Bears made porridge for breakfast and poured it into their three pots. It was too hot to eat at once, so they went for a walk in the wood while it cooled. That way, they would not burn their mouths.

    - id: ch02
      title: An Uninvited Visitor
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: While the Bears were out walking, a little old Woman came to their house. She looked through the window first. Then she peeped through the keyhole. When she saw that no one was home, she lifted the latch.
        - id: ch02-b02
          speaker: narrator
          text: The door was unlocked. The Bears never harmed anyone, and it had never occurred to them that anyone might harm them. So the little old Woman opened the door and walked inside.
        - id: ch02-b03
          speaker: narrator
          text: She was very pleased when she saw the porridge waiting on the table. A good and honest visitor would have waited for the Bears to come home. They might even have invited her to breakfast. The Bears were a little rough, as bears often are, but they were good-natured and welcoming.
        - id: ch02-b04
          speaker: narrator
          text: This Woman did not wait. She was rude and badly behaved, and she began helping herself.
        - id: ch02-b05
          speaker: narrator
          text: First she tasted the Great, Huge Bear's porridge. It was too hot, and she said something bad about it. Then she tried the Middle Bear's porridge. That was too cold, and she said something bad about that too.
        - id: ch02-b06
          speaker: narrator
          text: Last of all, she tasted the Little, Small, Wee Bear's porridge. It was neither too hot nor too cold. It was just right. She liked it so much that she ate every bit.
        - id: ch02-b07
          speaker: narrator
          text: Even then, the naughty old Woman complained. She said something bad about the little porridge pot because it had not held enough for her.

    - id: ch03
      title: Three Chairs and Three Beds
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Next, the little old Woman sat in the Great, Huge Bear's chair. It was too hard for her. She moved to the Middle Bear's chair, but that one was too soft.
        - id: ch03-b02
          speaker: narrator
          text: Then she tried the Little, Small, Wee Bear's chair. It was neither too hard nor too soft. It was just right. She settled into it and sat there until the bottom fell out. Down she went, landing plump on the ground. She said something wicked about that as well.
        - id: ch03-b03
          speaker: narrator
          text: After that, the Woman went upstairs to the bedroom where the three Bears slept. She lay down on the Great, Huge Bear's bed, but its head was too high for her.
        - id: ch03-b04
          speaker: narrator
          text: She tried the Middle Bear's bed next. This one was too high at the foot. Then she climbed into the Little, Small, Wee Bear's bed. It was not too high at the head or the foot. It was just right.
        - id: ch03-b05
          speaker: narrator
          text: The little old Woman pulled the covers around herself, made herself comfortable, and lay there until she fell fast asleep.

    - id: ch04
      title: Somebody Has Been Here
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: By then, the Three Bears thought their porridge must be cool enough, so they came home for breakfast. The old Woman had left the Great, Huge Bear's spoon standing in his porridge.
        - id: ch04-b02
          speaker: great_huge_bear
          text: Someone has been eating my porridge!
          emotion: surprised
        - id: ch04-b03
          speaker: narrator
          text: The Great, Huge Bear spoke in his great, rough, gruff voice. The Middle Bear looked into his own pot and saw his spoon standing there too. The spoons were wooden. If they had been silver, the naughty old Woman would have slipped them into her pocket.
        - id: ch04-b04
          speaker: middle_bear
          text: Someone has been tasting my porridge!
          emotion: surprised
        - id: ch04-b05
          speaker: narrator
          text: The Middle Bear spoke in his middle voice. Then the Little, Small, Wee Bear looked into his pot. His spoon was there, but his porridge was gone.
        - id: ch04-b06
          speaker: little_small_wee_bear
          text: Someone has been eating my porridge, and they've eaten it all up!
          emotion: surprised
        - id: ch04-b07
          speaker: narrator
          text: That came in his little, small, wee voice. Now the Bears knew someone had entered their house and eaten the Little, Small, Wee Bear's breakfast, so they began looking around.
        - id: ch04-b08
          speaker: narrator
          text: When the Woman got up from the Great, Huge Bear's chair, she had left its hard cushion crooked.
        - id: ch04-b09
          speaker: great_huge_bear
          text: Someone has been sitting in my chair!
          emotion: surprised
        - id: ch04-b10
          speaker: narrator
          text: The Great, Huge Bear spoke in his great, rough, gruff voice. The Woman had also crushed down the Middle Bear's soft cushion.
        - id: ch04-b11
          speaker: middle_bear
          text: Someone has been sitting in my chair!
          emotion: surprised
        - id: ch04-b12
          speaker: narrator
          text: The Middle Bear spoke in his middle voice. And you already know what had happened to the third chair.
        - id: ch04-b13
          speaker: little_small_wee_bear
          text: Someone has been sitting in my chair, and they've broken the bottom right out!
          emotion: surprised
        - id: ch04-b14
          speaker: narrator
          text: The Little, Small, Wee Bear spoke in his little, small, wee voice.

    - id: ch05
      title: Here She Is
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The Three Bears decided they had better search farther, so they went upstairs to their bedroom. The little old Woman had pulled the Great, Huge Bear's pillow out of place.
        - id: ch05-b02
          speaker: great_huge_bear
          text: Someone has been lying in my bed!
          emotion: surprised
        - id: ch05-b03
          speaker: narrator
          text: The Great, Huge Bear spoke in his great, rough, gruff voice. The Woman had pulled the Middle Bear's bolster out of place too.
        - id: ch05-b04
          speaker: middle_bear
          text: Someone has been lying in my bed!
          emotion: surprised
        - id: ch05-b05
          speaker: narrator
          text: The Middle Bear spoke in his middle voice. Then the Little, Small, Wee Bear came to his bed. His bolster was in its place, and so was the pillow. But on that pillow lay the little old Woman's ugly, dirty head. Her head certainly did not belong there, because she had no business being in that bed.
        - id: ch05-b06
          speaker: little_small_wee_bear
          text: Someone has been lying in my bed, and here she is!
          emotion: surprised
        - id: ch05-b07
          speaker: narrator
          text: The Little, Small, Wee Bear cried out in his little, small, wee voice.
        - id: ch05-b08
          speaker: narrator
          text: The old Woman had heard the Great, Huge Bear while she slept. His great, rough, gruff voice sounded no more troubling than roaring wind or rumbling thunder. She had heard the Middle Bear too, but his voice seemed like someone speaking in a dream.
        - id: ch05-b09
          speaker: narrator
          text: Then the Little, Small, Wee Bear's sharp, shrill voice reached her, and she woke at once. She sprang up and saw all Three Bears standing on one side of the bed. She tumbled out on the other side and ran for the window.
        - id: ch05-b10
          speaker: narrator
          text: The window was open. The Bears were good, tidy Bears, and they always opened their bedroom window when they got up in the morning. The little old Woman jumped straight out.
        - id: ch05-b11
          speaker: narrator
          text: Perhaps she broke her neck in the fall. Perhaps she ran into the wood and became lost. Or perhaps she escaped the wood, only for a constable to catch her and send the vagrant to the House of Correction. I cannot tell you which it was.
        - id: ch05-b12
          speaker: narrator
          text: But the Three Bears never saw her again.
