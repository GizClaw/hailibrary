audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and unhurried, with the steady rhythm of an old fireside tale
        timbre: clear and gently weathered
        pace: measured
        pitch: medium
    husband:
      display_name: Husband
      tts:
        delivery: guarded and uneasy, trying to sound braver than he feels
        timbre: dry and restrained
        pace: measured
        pitch: medium-low
    wife:
      display_name: Wife's Ghost
      tts:
        delivery: hollow and reproachful, rising to a sudden accusing cry
        timbre: cold and spectral
        pace: slow
        pitch: low
  chapters:
    - id: ch01
      title: The Golden Arm
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a man who traveled all over the land looking for a wife. He met women young and old, rich and poor, pretty and plain, but not one of them suited him.
        - id: ch01-b02
          speaker: narrator
          text: At last, he found a young woman who was beautiful and rich. Her right arm was made of solid gold. He married her at once and believed no man could be luckier.
        - id: ch01-b03
          speaker: narrator
          text: They lived happily together. Yet no matter what he wanted others to believe, he cared more for that golden arm than for all his wife's other gifts.

    - id: ch02
      title: The Stolen Treasure
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: In time, his wife died. At the funeral, her husband wore the blackest clothes and made the saddest face he could.
        - id: ch02-b02
          speaker: narrator
          text: But in the middle of the night, he rose from his bed and dug up her body. He cut off the golden arm, hurried home, and hid his treasure. He was sure no one would ever know.

    - id: ch03
      title: The Ghost's Return
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The next night, the man slipped the golden arm under his pillow. He was just falling asleep when his dead wife's ghost glided into the room. She came straight to the bedside, drew back the curtain, and fixed him with a reproachful look.
        - id: ch03-b02
          speaker: narrator
          text: The man pretended he was not afraid and spoke to her.
        - id: ch03-b03
          speaker: husband
          text: What happened to your cheeks, once so red?
        - id: ch03-b04
          speaker: wife
          text: They have all withered and wasted away.
        - id: ch03-b05
          speaker: husband
          text: And what happened to your rosy red lips?
        - id: ch03-b06
          speaker: wife
          text: They have all withered and wasted away.
        - id: ch03-b07
          speaker: husband
          text: What happened to your golden hair?
        - id: ch03-b08
          speaker: wife
          text: It has all withered and wasted away.
        - id: ch03-b09
          speaker: husband
          text: Then what happened to your golden arm?
        - id: ch03-b10
          speaker: wife
          text: You have it!
          emotion: angry
