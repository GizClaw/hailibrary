audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容讲述古老童话，诙谐中渐渐透出紧张
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中
    stepmother:
      display_name: 继母
      tts:
        delivery: 冷硬阴沉，假意温和时仍透着狠毒
        timbre: 低沉的成熟女声
        pace: 中等偏慢
        pitch: 中低
    white_bird:
      display_name: 白鸟
      tts:
        delivery: 清澈空灵，歌唱时美丽而哀伤
        timbre: 明亮的年轻女声
        pace: 舒缓
        pitch: 中高
    father:
      display_name: 父亲
      tts:
        delivery: 朴实沉稳，话语简短
        timbre: 厚实的中年男声
        pace: 中等偏慢
        pitch: 中低
    little_brother:
      display_name: 小弟弟
      tts:
        delivery: 年幼真挚，悲伤时仍克制清楚
        timbre: 清亮的男孩声
        pace: 中等
        pitch: 高
    shoemaker:
      display_name: 鞋匠
      tts:
        delivery: 朴直热情，被歌声深深吸引
        timbre: 温厚的成年男声
        pace: 中等
        pitch: 中低
    watchmaker:
      display_name: 钟表匠
      tts:
        delivery: 温和赞叹，说话细致清楚
        timbre: 清润的成年男声
        pace: 中等
        pitch: 中
    miller_1:
      display_name: 磨坊工人甲
      tts:
        delivery: 粗朴爽快，赞叹时十分响亮
        timbre: 洪亮的成年男声
        pace: 中等
        pitch: 中低
    miller_2:
      display_name: 磨坊工人乙
      tts:
        delivery: 直率热切，跟同伴说话合拍
        timbre: 清朗的成年男声
        pace: 中等
        pitch: 中
    miller_3:
      display_name: 磨坊工人丙
      tts:
        delivery: 沉厚干脆，跟同伴一同回应
        timbre: 略显沙哑的成年男声
        pace: 中等偏慢
        pitch: 低
  chapters:
    - id: ch01
      title: 三捆蜡烛
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "从前，有个善良的男人，膝下有一儿一女。女儿是前妻所生，儿子是后妻所生。女孩白得像牛奶，嘴唇红得像樱桃，一头金发仿佛金色丝线，一直垂到地上。弟弟很爱姐姐，狠心的继母却恨她。"
        - id: ch01-b02
          speaker: stepmother
          text: "孩子，你去杂货铺给我买一磅蜡烛。"
        - id: ch01-b03
          speaker: narrator
          text: "继母把钱交给小姑娘。她买好蜡烛，走上回家的路。路上横着一道栅栏，她把蜡烛放在地上，正准备翻过去，一条狗忽然跑来，叼起蜡烛就跑了。"
        - id: ch01-b04
          speaker: narrator
          text: "小姑娘回到杂货铺，又买了一捆。可她走到栅栏边，刚放下蜡烛往上爬，那条狗又来了，第二捆蜡烛也被叼走了。"
        - id: ch01-b05
          speaker: narrator
          text: "她只好第三次去买。谁知到了栅栏边，还是出了同样的事。钱全花光了，三捆蜡烛也全丢了。小姑娘哭着回到继母跟前。"
        - id: ch01-b06
          speaker: narrator
          text: "继母气得很，表面上却装作没有关系。"
        - id: ch01-b07
          speaker: stepmother
          text: "来，把头枕在我腿上，我替你梳梳头。"
        - id: ch01-b08
          speaker: narrator
          text: "小姑娘把头枕进那女人怀里。梳子一下下梳过金黄的长发，头发从继母膝头披落，一直卷到地上。继母见这头发这样美，心里越发恨她。"
        - id: ch01-b09
          speaker: stepmother
          text: "你的头枕在我膝上，我没法给你分头发。去拿一截木头来。"
        - id: ch01-b10
          speaker: narrator
          text: "小姑娘拿来了木头。"
        - id: ch01-b11
          speaker: stepmother
          text: "梳子也分不开你的头发。再去给我拿把斧子。"
        - id: ch01-b12
          speaker: narrator
          text: "小姑娘又把斧子拿来了。"
        - id: ch01-b13
          speaker: stepmother
          text: "好了，把头搁在木头上，我来给你分头发。"
        - id: ch01-b14
          speaker: narrator
          text: "唉，小姑娘一点儿也没有害怕，就把金色的小脑袋放了下去。嗖的一声，斧子劈落，她的头掉了下来。继母擦净斧子，笑了。"
    - id: ch02
      title: 玫瑰树上的白鸟
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "继母取出小姑娘的心和肝，炖熟后端进屋里当晚饭。父亲尝了尝，摇着头说，这肉的味道古怪得很。继母又分给小男孩一些，他不肯吃。她硬逼着他吃，男孩还是不肯，转身跑进花园。"
        - id: ch02-b02
          speaker: narrator
          text: "他抱起小妹妹，把她放进一只箱子，埋在一株玫瑰树下。从那以后，男孩每天都到树下哭，泪水一直滴落在箱子上。"
        - id: ch02-b03
          speaker: narrator
          text: "春天来了。有一天，玫瑰树开满了花，繁花之间停着一只白鸟。它唱了又唱，歌声就像从天堂飘来的天使之声。唱罢，白鸟飞到一家鞋匠铺附近，落在树上。"
        - id: ch02-b04
          speaker: white_bird
          text: "狠心的母亲杀了我，亲爱的父亲吃了我。我深爱的小弟弟，坐在树下，我在树上唱歌。树枝，树干，石头，我死了。"
          emotion: sad
        - id: ch02-b05
          speaker: shoemaker
          text: "这首歌真美。鸟儿，请你再唱一遍吧。"
        - id: ch02-b06
          speaker: white_bird
          text: "那你先把正在做的那双红鞋送给我。"
        - id: ch02-b07
          speaker: narrator
          text: "鞋匠把红鞋送给白鸟，它便把那首歌又唱了一遍。随后，白鸟飞到钟表匠铺前，停在一棵树上。"
        - id: ch02-b08
          speaker: white_bird
          text: "狠心的母亲杀了我，亲爱的父亲吃了我。我深爱的小弟弟，坐在树下，我在树上唱歌。树枝，树干，石头，我死了。"
          emotion: sad
        - id: ch02-b09
          speaker: watchmaker
          text: "啊，这歌多美！可爱的鸟儿，请你再唱一次。"
        - id: ch02-b10
          speaker: white_bird
          text: "那你要先把手里的金表和金链送给我。"
        - id: ch02-b11
          speaker: narrator
          text: "钟表匠把金表和金链给了它。白鸟一只爪子抓住金表和金链，另一只抓住红鞋，把歌再唱一遍，便飞向三个正在琢磨盘的磨坊工人。它落在旁边一棵树上，重新唱起来。"
    - id: ch03
      title: 三个磨坊工人
      blocks:
        - id: ch03-b01
          speaker: white_bird
          text: "狠心的母亲杀了我，亲爱的父亲吃了我。我深爱的小弟弟，坐在树下，我在树上唱歌。唱到最后一句，它先唱出：“树枝！”"
          emotion: sad
        - id: ch03-b02
          speaker: narrator
          text: "第一个工人听见了，放下工具，停住手里的活儿，抬头望去。"
        - id: ch03-b03
          speaker: white_bird
          text: "接下来，白鸟唱出了“树干”。"
          emotion: sad
        - id: ch03-b04
          speaker: narrator
          text: "第二个磨坊工人也把工具搁在一旁，抬起了头。"
        - id: ch03-b05
          speaker: white_bird
          text: "然后，它又唱出了“石头”。"
          emotion: sad
        - id: ch03-b06
          speaker: narrator
          text: "第三个磨坊工人放下工具，也向上望去。"
        - id: ch03-b07
          speaker: white_bird
          text: "白鸟这才唱完最后两个字：“死了。”"
          emotion: sad
        - id: ch03-b08
          speakers: [miller_1, miller_2, miller_3]
          ensemble: chorus
          text: "啊，这首歌真美！可爱的鸟儿，请你再唱一遍吧。"
        - id: ch03-b09
          speaker: white_bird
          text: "那你们把磨盘套在我脖子上。"
        - id: ch03-b10
          speaker: narrator
          text: "三个工人照它的话做了。白鸟脖子上套着磨盘，一只爪子抓住红鞋，另一只抓住金表和金链，就这样飞离了那里。它唱完那首歌，便往家飞去。"
    - id: ch04
      title: 雷带来的礼物
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "回到家后，白鸟用磨盘去撞屋檐，撞得咔啦作响。"
        - id: ch04-b02
          speaker: stepmother
          text: "打雷了。"
        - id: ch04-b03
          speaker: narrator
          text: "小男孩跑出去看雷。刚到外面，那双红鞋便落在他的脚边。白鸟又用磨盘撞了一次屋檐。"
        - id: ch04-b04
          speaker: stepmother
          text: "又打雷了。"
        - id: ch04-b05
          speaker: narrator
          text: "这次父亲跑了出去，金链从空中落下，正好套在他的脖子上。父子俩笑着跑回屋里。"
        - id: ch04-b06
          speakers: [father, little_brother]
          ensemble: duo
          text: "快看，雷给我们带来了多好的东西！"
          emotion: happy
        - id: ch04-b07
          speaker: narrator
          text: "白鸟第三次用磨盘撞响了屋檐。"
        - id: ch04-b08
          speaker: stepmother
          text: "又打雷了。说不定这回，雷也给我带了什么东西。"
        - id: ch04-b09
          speaker: narrator
          text: "继母跑出门去。可她的脚刚跨过门槛，磨盘就从上面砸落在她头上。她就这样死了。"
