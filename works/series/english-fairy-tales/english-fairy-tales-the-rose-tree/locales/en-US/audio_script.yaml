  chapters:
    - id: ch01
      title: Three Bunches of Candles
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, a good man had two children. His daughter was born to his first wife, and his son to his second. The girl was white as milk, with lips like cherries. Her golden hair was as soft as silk, and it fell all the way to the ground. Her brother loved her dearly, but her wicked stepmother hated her.
        - id: ch01-b02
          speaker: stepmother
          text: Child, go to the grocer's and bring me a pound of candles.
        - id: ch01-b03
          speaker: narrator
          text: The stepmother gave her the money. The little girl bought the candles and started home. On the way, she had to cross a stile. She set the candles down while she climbed over. Just then, a dog came running up and carried them away.
        - id: ch01-b04
          speaker: narrator
          text: The girl went back to the shop and got another bunch. Once again, she reached the stile and put the candles down so she could cross. Once again, the dog ran off with them.
        - id: ch01-b05
          speaker: narrator
          text: She returned to the grocer a third time and got one last bunch. At the stile, the very same thing happened. She had spent all the money, and now three bunches of candles were gone. So she went home to her stepmother in tears.

    - id: ch02
      title: The Golden Hair
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The stepmother was angry, though she acted as if the loss did not matter.
        - id: ch02-b02
          speaker: stepmother
          text: Come here and rest your head in my lap. I'll comb your hair.
        - id: ch02-b03
          speaker: narrator
          text: The little girl laid her head in the woman's lap. As the stepmother combed, the yellow silken hair spilled over her knees and rolled right down to the ground. The sight of its beauty only made her hate the child more.
        - id: ch02-b04
          speaker: stepmother
          text: I can't part your hair on my knee. Go and bring me a block of wood.
        - id: ch02-b05
          speaker: narrator
          text: The girl fetched one.
        - id: ch02-b06
          speaker: stepmother
          text: This comb won't part your hair. Now bring me an axe.
        - id: ch02-b07
          speaker: narrator
          text: The girl fetched the axe too.
        - id: ch02-b08
          speaker: stepmother
          text: Now lay your head on the block while I part your hair.
        - id: ch02-b09
          speaker: narrator
          text: Without any fear, the girl laid down her little golden head. Then, quick as a whisper, the axe came down and cut it off. The stepmother wiped the blade and laughed.
        - id: ch02-b10
          speaker: narrator
          text: She took the girl's heart and liver, stewed them, and served them for supper. Her husband tasted the food and shook his head.
        - id: ch02-b11
          speaker: father
          text: This tastes very strange.
        - id: ch02-b12
          speaker: narrator
          text: The stepmother offered some to the little boy, but he would not eat it. She tried to force him, and still he refused. He ran into the garden, gathered up his little sister, and placed her in a box. Then he buried the box beneath a rose-tree. Every day he came back to the tree and wept until his tears fell onto the box.

    - id: ch03
      title: The White Bird's Song
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: One spring day, the rose-tree burst into flower. Among the blossoms sat a white bird. It sang and sang, as beautifully as an angel from heaven. Then it flew to a shoemaker's shop and perched in a nearby tree. There it began its song.
        - id: ch03-b02
          speaker: bird
          text: My wicked mother slew me. My dear father ate me. My little brother, whom I love, sits below, and I sing above. Stick, stock, stone dead.
        - id: ch03-b03
          speaker: shoemaker
          text: What a beautiful song! Sweet bird, please sing it once more.
        - id: ch03-b04
          speaker: bird
          text: First, give me the little red shoes you're making.
        - id: ch03-b05
          speaker: narrator
          text: The shoemaker gave the bird the red shoes, and the bird sang its song again. Then it flew to a tree outside a watchmaker's shop.
        - id: ch03-b06
          speaker: bird
          text: My wicked mother slew me. My dear father ate me. My little brother, whom I love, sits below, and I sing above. Stick, stock, stone dead.
        - id: ch03-b07
          speaker: watchmaker
          text: Oh, what a lovely song! Sing it again, sweet bird.
        - id: ch03-b08
          speaker: bird
          text: First, give me the gold watch and chain in your hand.
        - id: ch03-b09
          speaker: narrator
          text: The watchmaker handed them over. The bird held the watch and chain in one foot and the red shoes in the other. It repeated the song, then flew away.

    - id: ch04
      title: The Millstone
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The bird came to three millers who were shaping a millstone. It settled on a tree and started to sing.
        - id: ch04-b02
          speaker: bird
          text: My wicked mother slew me. My dear father ate me. My little brother, whom I love, sits below, and I sing above. Stick!
        - id: ch04-b03
          speaker: narrator
          text: The first miller put down his tool and looked up from his work.
        - id: ch04-b04
          speaker: bird
          text: The next word is stock!
        - id: ch04-b05
          speaker: narrator
          text: The second miller laid his tool aside and looked up.
        - id: ch04-b06
          speaker: bird
          text: The next word is stone!
        - id: ch04-b07
          speaker: narrator
          text: The third miller set down his tool and looked up.
        - id: ch04-b08
          speaker: bird
          text: The last word is dead!
        - id: ch04-b09
          speakers: [miller_1, miller_2, miller_3]
          ensemble: chorus
          text: Oh, what a beautiful song! Sweet bird, sing it again.
        - id: ch04-b10
          speaker: bird
          text: Then put the millstone around my neck.
        - id: ch04-b11
          speaker: narrator
          text: The three men did as the bird asked. Away it flew with the millstone around its neck, the red shoes in one foot, and the gold watch and chain in the other. As it went, it sang the song once more.

    - id: ch05
      title: What the Thunder Brought
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: At last, the bird flew home. It struck the millstone against the eaves of the house, making a great rattling sound.
        - id: ch05-b02
          speaker: stepmother
          text: That's thunder.
        - id: ch05-b03
          speaker: narrator
          text: The little boy ran outside to see the thunder. The bird dropped the red shoes right at his feet.
        - id: ch05-b04
          speaker: narrator
          text: Again, the bird rattled the millstone against the eaves.
        - id: ch05-b05
          speaker: stepmother
          text: It's thundering again.
        - id: ch05-b06
          speaker: narrator
          text: This time the father ran out. The gold chain fell from above and settled around his neck.
        - id: ch05-b07
          speaker: narrator
          text: Father and son hurried back into the house, laughing.
        - id: ch05-b08
          speakers: [father, brother]
          ensemble: duo
          text: Look at the fine things the thunder brought us!
          emotion: happy
        - id: ch05-b09
          speaker: narrator
          text: Then, for a third time, the bird rattled the millstone against the eaves.
        - id: ch05-b10
          speaker: stepmother
          text: More thunder! Perhaps it has brought something for me this time.
        - id: ch05-b11
          speaker: narrator
          text: She ran out. The moment she stepped through the door, the millstone fell onto her head, and she died.
