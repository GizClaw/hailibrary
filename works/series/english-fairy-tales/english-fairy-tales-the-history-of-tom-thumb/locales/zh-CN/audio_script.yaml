audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容讲述古老童话，带着一本正经的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中
    mother:
      display_name: 汤姆的母亲
      tts:
        delivery: 善良慈爱，遇到险情时焦急真切
        timbre: 温柔朴实
        pace: 中等
        pitch: 中高
    tom_thumb:
      display_name: 汤姆·拇指
      tts:
        delivery: 机灵活泼，身陷险境时急切而清楚
        timbre: 清脆稚嫩
        pace: 稍快
        pitch: 高
    playmate:
      display_name: 玩伴
      tts:
        delivery: 孩子气直率，抓住恶作剧时又气又得意
        timbre: 明亮清脆
        pace: 稍快
        pitch: 中高
  chapters:
    - id: ch01
      title: 拇指大的孩子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "伟大的亚瑟王当政时，世上有位法力无边的魔法师，名叫梅林。他学识渊博，法术高强，古往今来无人能及。梅林想变成什么模样都行。有一回，他化作穷乞丐四处游历，走累了，便到一户农夫的茅舍歇脚，向主人讨些吃的。"
        - id: ch01-b02
          speaker: narrator
          text: "农夫热情地请他进屋。善良的农夫妻子很快端来一木碗牛奶，还有一盘粗糙的黑面包。梅林很喜欢他们的好心，却发现屋里整洁舒适，两人还是满面忧愁。一问才知道，他们因为没有孩子，心里十分难过。"
        - id: ch01-b03
          speaker: mother
          text: "我若能有个儿子，哪怕他还没有我丈夫的拇指大，我也心满意足，是世上最幸福的人了。"
          emotion: sad
        - id: ch01-b04
          speaker: narrator
          text: "女人说着，眼里含着泪。一个不及拇指大的男孩，这个念头让梅林觉得十分有趣，于是决定成全她。没过多久，她果然生下一个儿子。说来也奇妙，孩子一点儿也不比父亲的拇指大。"
        - id: ch01-b05
          speaker: narrator
          text: "仙后想看看这个小家伙。母亲坐在床上，正爱不释眼地端详孩子，仙后便从窗口飞进来，亲了亲他，给他取名汤姆·拇指。她又叫来几位仙女，照自己的吩咐，为小教子从头到脚穿戴起来。汤姆的橡树叶帽子像一顶王冠，蜘蛛丝织成衬衣，蓟草绒毛做成外衫，裤子用羽毛裁成。苹果皮做袜子，母亲的一根睫毛系住袜口，鼠皮做成的鞋里还留着柔软的毛。"
    - id: ch02
      title: 樱桃核与布丁
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "汤姆一直只有父亲的拇指那么大，而那不过是根寻常的拇指。他越长大，心眼儿越多，也越爱恶作剧。能和别的男孩一起玩以后，他若输光了樱桃核，就会钻进玩伴的小袋，把衣兜装满，再趁人不注意偷偷溜出来，若无其事地重新加入游戏。"
        - id: ch02-b02
          speaker: narrator
          text: "有一天，汤姆又去偷樱桃核，爬出小袋时正好被主人看见。"
        - id: ch02-b03
          speaker: playmate
          text: "哈，小汤姆！这回我可逮住你了。你偷我的樱桃核，我非得好好赏你一顿不可。"
        - id: ch02-b04
          speaker: narrator
          text: "男孩说完，便把袋口的绳子紧紧勒在汤姆脖子周围，使足力气摇起袋子。可怜的小汤姆在里面被撞来撞去，两条小腿、大腿和身上都伤得不轻，疼得放声大叫。"
        - id: ch02-b05
          speaker: tom_thumb
          text: "快放我出去吧！我答应你，以后再也不偷了。"
        - id: ch02-b06
          speaker: narrator
          text: "没过多久，母亲做起面糊布丁。汤姆急着看个明白，爬上碗沿，却脚下一滑，一头栽进面糊。母亲没有看见，搅面糊时把他也搅进布丁袋，放进锅里煮了起来。面糊堵住汤姆的嘴，他没法呼救。热水一烫，他只好在锅里拼命踢打。母亲以为布丁中了邪，连忙捞出来，扔到门外。"
        - id: ch02-b07
          speaker: narrator
          text: "一个穷补锅匠恰好路过，捡起布丁，装进行囊背走了。汤姆嘴里的面糊一松，马上高声叫喊。补锅匠吓得扔下布丁，拔腿就跑。布丁摔得粉碎，汤姆浑身糊着面浆，从里面爬出来，一步步走回家。母亲见心爱的孩子如此狼狈，心疼极了。她把汤姆放进茶杯，洗净面糊，亲亲他，再送他上床睡觉。"
    - id: ch03
      title: 母牛、乌鸦和大海
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "布丁历险后不久，母亲带汤姆去草地挤牛奶。那天风很大，她怕汤姆被刮走，就用细线把他拴在蓟草上。母牛发现了他的橡树叶帽子，觉得看起来很好吃，一口把汤姆和蓟草都吞进嘴里。母牛嚼着蓟草，那排大牙眼看就要把汤姆咬碎，他怕得拼命大喊。"
        - id: ch03-b02
          speaker: tom_thumb
          text: "妈妈，快来救我！"
          emotion: fearful
        - id: ch03-b03
          speaker: mother
          text: "汤姆，你在哪里？我亲爱的汤姆，你到底在哪里？"
          emotion: fearful
        - id: ch03-b04
          speaker: tom_thumb
          text: "妈妈，我在这里，就在红母牛的嘴里。"
          emotion: fearful
        - id: ch03-b05
          speaker: narrator
          text: "母亲哭起来，急得直绞双手。母牛听见喉咙里传出怪声，吃惊地张开嘴，让汤姆掉了出去。幸亏母亲用围裙接住他，不然他非摔坏不可。她把汤姆放进怀里，飞快地跑回家。"
        - id: ch03-b06
          speaker: narrator
          text: "父亲用大麦秆给汤姆做了一条赶牲口的鞭子。一天，汤姆到了田里，一脚踩空，滚进犁沟。一只乌鸦从空中飞过，把他衔起来，越过大海，又把他扔进海里。汤姆刚落水，就被一条大鱼吞进了肚子。"
    - id: ch04
      title: 亚瑟王的侏儒
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "不久，大鱼被人捕到，买去给亚瑟王做菜。厨子剖开鱼准备烹调，竟从鱼肚里发现这么小的一个男孩，众人无不惊奇。汤姆重获自由，快活极了。他们把汤姆送到国王面前，国王让他做了自己的侏儒。汤姆那些把戏和嬉闹，不但逗乐了国王和王后，也叫所有圆桌骑士开怀大笑。他很快便成了宫廷里的红人。"
        - id: ch04-b02
          speaker: narrator
          text: "据说，国王骑马出游时常把汤姆带在身边。路上下起阵雨，汤姆就钻进陛下的背心口袋，睡到雨停。一天，亚瑟王问起汤姆的父母，想知道他们是否也这样矮小，家里是否富裕。汤姆说，父母的个头跟宫里的人一样，只是日子相当穷苦。"
        - id: ch04-b03
          speaker: narrator
          text: "国王听了，亲自把汤姆带进收藏全部钱财的宝库，准他尽量多拿些钱回家送给父母。这个意外的恩典让小家伙乐得又蹦又跳。他立刻找来一只水泡做成的钱袋，回到宝库，领了一枚三便士银币。那枚银币对汤姆来说实在太沉。要把这个重担背上身，他费了好一番力气，好不容易安顿妥当，才踏上归途。"
        - id: ch04-b04
          speaker: narrator
          text: "汤姆一路平安，只是歇了一百多次。走过两天两夜，他终于到了父亲家。那枚硕大的银币在他背上压了整整四十八小时，汤姆已经累得几乎要死。母亲跑出来迎接，把他抱进屋里。可没过多久，他又回到了宫廷。"
    - id: ch05
      title: 骑老鼠的托马斯爵士
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "汤姆掉过面糊布丁，又待过鱼肚子，衣服早已破烂不堪。陛下便命人为他做一套新衣，还让他骑上一只老鼠，封他做了骑士。蝴蝶翅膀成了衬衣，小鸡皮做成长靴。一位手脚麻利、最懂裁衣手艺的仙女替他缝好整套衣裳，一枚针垂在腰间，一只精神的老鼠驮着他。汤姆就这样威风凛凛地出场了。"
        - id: ch05-b02
          speaker: narrator
          text: "汤姆穿着这一身漂亮的新衣，神气地骑着老鼠，跟国王和贵族们一同出猎。这样一位小骑士，偏偏骑着一匹昂首腾跃的老鼠坐骑，那副模样实在有趣。众人看着看着，笑得几乎喘不过气。国王很欣赏他的机敏风度，命人做了一把小椅子，让他坐在自己的餐桌上。国王又给他造了一座黄金宫殿，只有一拃高，门宽一英寸，还送给他一辆由六只小老鼠拉的马车。"
        - id: ch05-b03
          speaker: narrator
          text: "王后见托马斯爵士得到这么多尊荣，气得要毁掉他。她告诉国王，小骑士曾对她出言无礼。国王急忙传召汤姆。汤姆知道君王发怒有多危险，便钻进一个空蜗牛壳，躲到几乎饿死，才敢探头张望。"
        - id: ch05-b04
          speaker: narrator
          text: "藏身处附近停着一只漂亮的大蝴蝶。汤姆悄悄靠近，纵身骑上它的背，随它飞到空中。蝴蝶载着他，从一棵树飞到另一棵树，又从一片田野飞到另一片田野，最后回到宫廷。国王和贵族都争着抓他。可怜的汤姆却从蝴蝶背上摔进浇水壶，险些淹死。"
    - id: ch06
      title: 汤姆·拇指之死
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: "王后看见汤姆，怒不可遏，说非砍掉他的脑袋不可。于是汤姆又被关进捕鼠笼，等着行刑。一只猫发现笼里有个活物，拿爪子翻来拨去，直到铁丝折断，这才放出了托马斯。"
        - id: ch06-b02
          speaker: narrator
          text: "国王重新宠信汤姆，可惜他没能享受多久。一天，一只大蜘蛛袭击了他。汤姆拔剑迎战，打得十分英勇，最后还是抵挡不住蜘蛛喷出的毒气。他当场倒下，断了气，蜘蛛吸尽了他的每一滴血。"
        - id: ch06-b03
          speaker: narrator
          text: "亚瑟王和宫廷上下失去了心爱的小宠臣，悲痛不已。众人穿起丧服，在汤姆坟上立了一座美丽的白色大理石碑。碑文说，汤姆·拇指长眠于此。他是亚瑟王的骑士，死在毒蜘蛛的咬噬之下。宫里人人都认识他，他曾给满堂带来欢笑。他在比武场上挺枪冲刺，也曾骑着老鼠出猎。他活着时，宫廷充满笑声。他一死，悲伤便随之而来。大家擦擦眼泪，摇摇头，哭一声，唉，汤姆·拇指死了！"
