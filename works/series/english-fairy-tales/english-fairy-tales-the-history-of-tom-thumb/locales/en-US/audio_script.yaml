audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and unhurried, with the steady rhythm of an old fireside tale
        timbre: clear and gently weathered
        pace: measured
        pitch: medium
    mother:
      display_name: Tom's Mother
      tts:
        delivery: tender and earnest, quickening sharply when Tom is in danger
        timbre: warm and clear
        pace: medium
        pitch: medium-high
    tom_thumb:
      display_name: Tom Thumb
      tts:
        delivery: lively and clever, with youthful boldness and quick changes of feeling
        timbre: small and bright
        pace: medium-fast
        pitch: high
    playfellow:
      display_name: Tom's Playfellow
      tts:
        delivery: brisk and triumphant, with the directness of a country boy
        timbre: clear and youthful
        pace: medium-fast
        pitch: medium-high
    king_arthur:
      display_name: King Arthur
      tts:
        delivery: noble and generous, with easy warmth toward Tom
        timbre: full and commanding
        pace: measured
        pitch: low
    queen:
      display_name: Queen
      tts:
        delivery: proud and severe, sharpened by jealousy and anger
        timbre: polished and cool
        pace: measured
        pitch: medium-high
  chapters:
    - id: ch01
      title: A Wish No Bigger Than a Thumb
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: In the days of the great Prince Arthur, there lived a mighty magician named Merlin. No enchanter in all the world was more learned or skillful, and his fame had spread far and wide.
        - id: ch01-b02
          speaker: narrator
          text: Merlin could take any shape he pleased. Once, while traveling in the form of a poor beggar, he grew tired and stopped at a ploughman's cottage. He asked if he might rest and have something to eat.
        - id: ch01-b03
          speaker: narrator
          text: The ploughman welcomed him. His good-hearted wife brought out milk in a wooden bowl and coarse brown bread on a platter.
        - id: ch01-b04
          speaker: narrator
          text: Their kindness pleased Merlin. The cottage was neat and comfortable, yet both husband and wife looked deeply unhappy. Merlin asked what troubled them, and learned that they were miserable because they had no children.
        - id: ch01-b05
          speaker: mother
          text: If only I had a son, I would be the happiest woman in the world. I would be content even if he were no bigger than my husband's thumb.
          emotion: sad
        - id: ch01-b06
          speaker: narrator
          text: The thought of a boy no bigger than a man's thumb amused Merlin, and he decided to grant the poor woman's wish. Before long, the ploughman's wife had a son. Wonderful as it may seem, the baby was not one bit bigger than his father's thumb.
        - id: ch01-b07
          speaker: narrator
          text: The queen of the fairies wished to see the tiny child. She flew in through the window while his mother sat up in bed admiring him. The fairy queen kissed him, named him Tom Thumb, and called her fairies to dress her little godson.
        - id: ch01-b08
          speaker: narrator
          text: An oak leaf crowned his head. Spiders had spun his shirt, and thistle down made his jacket. His trousers were feathers. His stockings were apple peel, tied with an eyelash from his mother's eye, and his shoes were mouse skin with the soft fur turned inside.

    - id: ch02
      title: Tom's Early Troubles
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Tom never grew beyond the size of his father's ordinary thumb. As he got older, though, he became clever and full of tricks.
        - id: ch02-b02
          speaker: narrator
          text: When he played cherry stones with the other boys and lost all his own, he would creep into their bags and fill his pockets. Then he slipped out unseen and joined the game again.
        - id: ch02-b03
          speaker: narrator
          text: One day, a boy caught Tom climbing from his bag after stealing the usual handful.
        - id: ch02-b04
          speaker: playfellow
          text: Aha, Tommy! So I've finally caught you taking my cherry stones. Now you'll get what those thieving tricks deserve.
        - id: ch02-b05
          speaker: narrator
          text: The boy pulled the bag string tight around Tom's neck and shook the bag with all his might. Tom's legs, thighs, and body were badly bruised.
        - id: ch02-b06
          speaker: tom_thumb
          text: Oh, let me out! Please! I'll never steal again!
        - id: ch02-b07
          speaker: narrator
          text: Not long afterward, Tom's mother was making a batter pudding. Eager to see how she did it, Tom climbed to the rim of the bowl. His foot slipped, and he tumbled headfirst into the batter. His mother never saw him fall. She stirred him into the pudding bag and set it in the pot to boil.
        - id: ch02-b08
          speaker: narrator
          text: Batter filled Tom's mouth, so he could not call out. When the hot water reached him, he kicked and struggled so hard that his mother thought the pudding was bewitched. She pulled it from the pot and threw it outside.
        - id: ch02-b09
          speaker: narrator
          text: A poor tinker passing by picked up the pudding, put it in his bag, and walked away. By then, Tom had cleared the batter from his mouth and began to cry at the top of his voice. The frightened tinker flung the pudding down and ran.
        - id: ch02-b10
          speaker: narrator
          text: The fall broke the pudding apart. Tom crawled out, covered from head to foot in batter, and made his way home. His mother was very sorry to see her darling in such a woeful state. She washed him in a teacup, kissed him, and tucked him into bed.

    - id: ch03
      title: Into the Wider World
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Soon after the pudding adventure, Tom's mother took him with her to milk the cow in the meadow. A high wind was blowing, so she tied him to a thistle with a fine thread to keep him from being swept away.
        - id: ch03-b02
          speaker: narrator
          text: The cow noticed Tom's oak-leaf hat and liked the look of it. In one mouthful, she took in Tom, hat, thistle, and all. As she chewed, Tom watched her great teeth coming dangerously close to crushing him.
        - id: ch03-b03
          speaker: tom_thumb
          text: Mother! Mother!
          emotion: fearful
        - id: ch03-b04
          speaker: mother
          text: Where are you, Tommy? My dear Tommy, where are you?
          emotion: fearful
        - id: ch03-b05
          speaker: tom_thumb
          text: I'm here, Mother, inside the red cow's mouth!
          emotion: fearful
        - id: ch03-b06
          speaker: narrator
          text: His mother cried and wrung her hands. The strange noise in her throat startled the cow, and she opened her mouth. Tom dropped out. Luckily, his mother caught him in her apron before he hit the ground. Without that catch, he would have been dreadfully hurt. She tucked him against her breast and ran home.
        - id: ch03-b07
          speaker: narrator
          text: Tom's father made him a whip from barley straw so he could drive the cattle. One day in the fields, Tom lost his footing and rolled into a furrow. A raven flying overhead swooped down, picked him up, carried him across the sea, and dropped him.
        - id: ch03-b08
          speaker: narrator
          text: The moment Tom struck the water, a great fish swallowed him. Soon afterward, fishermen caught that very fish, and it was bought for King Arthur's table. When the cooks cut it open to prepare it, everyone stared in wonder at the tiny boy inside. Tom himself was delighted to be free again.
        - id: ch03-b09
          speaker: narrator
          text: They carried him before the king, who made Tom his dwarf. Tom soon became a great favorite at court. His tricks and lively games amused the king and queen, and all the Knights of the Round Table as well.
        - id: ch03-b10
          speaker: narrator
          text: People say that King Arthur often took Tom along when he rode out. If rain began to fall, Tom crept into the king's waistcoat pocket and slept there until the shower passed.

    - id: ch04
      title: A Gift for Home
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: One day, King Arthur asked Tom about his parents. Were they as small as he was? And did they have enough to live on?
        - id: ch04-b02
          speaker: tom_thumb
          text: My father and mother are as tall as anyone here at court, Your Majesty, but they are rather poor.
        - id: ch04-b03
          speaker: narrator
          text: The king took Tom to the treasury where all his money was kept.
        - id: ch04-b04
          speaker: king_arthur
          text: Carry home as much money as you can and give it to your parents.
        - id: ch04-b05
          speaker: narrator
          text: Tom capered with joy. He quickly found a purse made from a water bubble and returned to the treasury. There he was given a silver threepenny piece.
        - id: ch04-b06
          speaker: narrator
          text: The coin was a tremendous burden for such a little traveler. Tom struggled to hoist it onto his back, but at last he settled it just as he wanted and started for home.
        - id: ch04-b07
          speaker: narrator
          text: He met with no accident along the way, though the load forced him to stop and rest more than a hundred times. Step by step, he struggled onward beneath the silver piece. After two whole days and two nights, he finally reached his father's house safely.
        - id: ch04-b08
          speaker: narrator
          text: Tom had carried that huge silver coin for forty-eight hours and was nearly dead with weariness. His mother ran to meet him and bore him into the house. Before long, however, he returned to court.

    - id: ch05
      title: Sir Thomas at Court
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Tom's clothes had suffered badly in the batter pudding and inside the fish, so the king ordered a new suit for him. He also had Tom mounted as a knight upon a mouse.
        - id: ch05-b02
          speaker: narrator
          text: His shirt was made from butterfly wings, and his boots from chicken skin. A nimble fairy, well trained in the tailor's trade, supplied the rest of his clothing. A needle dangled at his side for a sword. Then Tom climbed onto a dapper mouse and strutted about in stately pride.
        - id: ch05-b03
          speaker: narrator
          text: Dressed like this, Tom rode out hunting with the king and all the nobility. His little mouse pranced grandly beneath him while the tiny knight sat tall in the saddle. The sight of Tom and his fine charger was so funny that everyone was nearly overcome with laughter.
        - id: ch05-b04
          speaker: narrator
          text: The king was delighted with Tom's clever ways. He ordered a little chair so Tom could sit at the royal table. He gave him a gold palace a span high, with a door one inch wide, and a coach drawn by six small mice.
        - id: ch05-b05
          speaker: narrator
          text: But the queen grew furious over all the honors given to Sir Thomas. She decided to ruin him and told the king that the little knight had spoken rudely to her.
        - id: ch05-b06
          speaker: narrator
          text: The king sent for Tom at once. Tom understood the danger of a king's anger, so he hid inside an empty snail shell. He stayed there so long that hunger nearly overcame him.
        - id: ch05-b07
          speaker: narrator
          text: At last, Tom dared to peep out. A fine large butterfly rested on the ground nearby. He crept close, leaped onto its back, and was carried into the air.
        - id: ch05-b08
          speaker: narrator
          text: The butterfly bore him from tree to tree and field to field, then finally returned to court. The king and all the nobles tried to catch Tom. But he lost his seat and fell into a watering pot, where he very nearly drowned.
        - id: ch05-b09
          speaker: queen
          text: He shall be beheaded!
          emotion: angry
        - id: ch05-b10
          speaker: narrator
          text: Once again Tom was seized. This time, they locked him in a mouse trap to wait for his execution.

    - id: ch06
      title: The Last Battle of Tom Thumb
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: A cat noticed something moving inside the trap. It batted the cage about until the wires broke, and Tom was free.
        - id: ch06-b02
          speaker: narrator
          text: The king welcomed Tom back into his favor. Sadly, Tom did not live long enough to enjoy it. One day, a great spider attacked him.
        - id: ch06-b03
          speaker: narrator
          text: Tom drew his sword and fought bravely, but at last the spider's poisonous breath overcame him. He fell dead where he stood, and the spider sucked every drop of his blood.
        - id: ch06-b04
          speaker: narrator
          text: King Arthur and the whole court grieved for their little favorite. They dressed in mourning and raised a fine monument of white marble over his grave.
        - id: ch06-b05
          speaker: narrator
          text: The words carved on the stone told everyone who came there that Tom Thumb had been King Arthur's knight and had died from a cruel spider's bite. All through Arthur's court, people had known him well. He had given them gallant sport, ridden at the tilt and tournament, and gone hunting on a mouse. While he lived, he filled the court with mirth. Now his death had quickly turned their laughter into sorrow.
        - id: ch06-b06
          speaker: narrator
          text: Wipe your eyes, shake your head, and cry, “Alas! Tom Thumb is dead!”
