audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容讲述古老童话，带着一本正经的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中
    dick:
      display_name: 迪克·惠廷顿
      tts:
        delivery: 早年纯朴稚气，历经困苦仍谦和真诚，成年后稳重有礼
        timbre: 清亮柔和
        pace: 中等
        pitch: 中高
    passerby:
      display_name: 过路人
      tts:
        delivery: 冷淡粗暴，话说得毫不客气
        timbre: 干硬
        pace: 稍快
        pitch: 中
    gentleman:
      display_name: 好心的绅士
      tts:
        delivery: 朴实和善，问话直接而关切
        timbre: 温厚清晰
        pace: 中等
        pitch: 中低
    cook:
      display_name: 厨娘
      tts:
        delivery: 刻薄急躁，奚落人时尖酸又得意
        timbre: 尖利粗哑
        pace: 快
        pitch: 中高
    fitzwarren:
      display_name: 菲茨沃伦先生
      tts:
        delivery: 正直宽厚，身为商人说话明白果断
        timbre: 沉稳温暖
        pace: 中等
        pitch: 中低
    alice:
      display_name: 艾丽斯小姐
      tts:
        delivery: 温柔善良，关心别人时真挚自然
        timbre: 清柔明亮
        pace: 中等
        pitch: 中高
    girl:
      display_name: 卖猫的女孩
      tts:
        delivery: 爽快活泼，带着乡间女孩的质朴
        timbre: 稚嫩清脆
        pace: 轻快
        pitch: 高
    captain:
      display_name: 船长
      tts:
        delivery: 见多识广，遇事机敏，谈生意时胸有成竹
        timbre: 洪亮结实
        pace: 中等
        pitch: 中低
    courtier_1:
      display_name: 宫廷侍从甲
      tts:
        delivery: 恭敬庄重，谈到鼠患时满是苦恼
        timbre: 清晰成熟
        pace: 中等
        pitch: 中
    courtier_2:
      display_name: 宫廷侍从乙
      tts:
        delivery: 恭敬庄重，谈到鼠患时满是苦恼
        timbre: 稍低沉
        pace: 中等
        pitch: 中低
    king:
      display_name: 巴巴里国王
      tts:
        delivery: 威严直率，惊喜时毫不掩饰
        timbre: 浑厚响亮
        pace: 中等
        pitch: 低
    henry_v:
      display_name: 亨利五世
      tts:
        delivery: 威严开阔，赞叹时真诚爽朗
        timbre: 浑厚清晰
        pace: 中等
        pitch: 低
    queen:
      display_name: 巴巴里王后
      tts:
        delivery: 好奇热切，亲近猫儿时又惊又喜
        timbre: 华美柔和
        pace: 稍快
        pitch: 中高
  chapters:
    - id: ch01
      title: 黄金铺成的伦敦
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "在大名鼎鼎的爱德华三世统治时期，有个小男孩叫迪克·惠廷顿。他很小就没了父母，又没长到能做工的年纪，日子实在苦极了。午饭总吃不饱，有时连早饭也没有。村里人同样穷困，能分给他的，往往只有土豆皮，偶尔才有一块干硬的面包皮。"
        - id: ch01-b02
          speaker: narrator
          text: "迪克听过许多关于伦敦的奇闻。那时的乡下人相信，伦敦人全是衣着华贵的绅士淑女，城里终日歌声乐声不断，街道更是用黄金铺成的。"
        - id: ch01-b03
          speaker: narrator
          text: "一天，一辆八匹马拉的大货车从村中经过，马头上的铃铛一路叮当作响。迪克正站在路牌旁，猜想货车一定要去美丽的伦敦。他鼓起勇气，请车夫准许自己跟在车旁同行。车夫知道他无父无母，再看看那身破衣裳，觉得这孩子的境况无论如何也不会更糟了，便答应带他上路。"
        - id: ch01-b04
          speaker: narrator
          text: "迪克平安到了伦敦，一心只想快些找到黄金铺成的漂亮街道。他连好心的车夫都忘了道谢，两条腿能跑多快就跑多快，一口气穿过一条又一条街，总觉得下一条路准会闪着金光。他在自己的小村子里一共只见过三回基尼金币，却清楚记得，一枚金币确实能换回来好多好多钱。只要从金路上挖几小块下来，自己岂不是想要多少钱就有多少钱？"
        - id: ch01-b05
          speaker: narrator
          text: "他一直跑到两腿发软，早把一路相伴的车夫忘得一干二净。天色也渐渐黑了。可无论往哪边走，脚下都只有泥污，根本没有黄金。可怜的迪克只好坐进昏暗的墙角，伤心地哭着，哭着哭着就睡着了。"
    - id: ch02
      title: 菲茨沃伦先生的家
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "迪克在街头熬过一夜。第二天早晨，他饿着肚子四处走动，见到谁都求人赏半便士，好让自己不至于饿死。没有人肯停下来答话，只有两三个人给了他半便士。没过多久，这个可怜的孩子便饿得浑身无力，眼前很快发昏。"
        - id: ch02-b02
          speaker: passerby
          text: "去找活儿干，你这个懒鬼！"
          emotion: angry
        - id: ch02-b03
          speaker: dick
          text: "我愿意干活！只要您肯用我，我马上就做。"
        - id: ch02-b04
          speaker: narrator
          text: "那人只管咒骂，头也不回地走了。后来，一位面相和善的绅士看出迪克饿得厉害，便停下来问他。"
        - id: ch02-b05
          speaker: gentleman
          text: "小伙子，你怎么不去做工呢？"
        - id: ch02-b06
          speaker: dick
          text: "我很想做，可是不知道上哪儿找活儿。"
        - id: ch02-b07
          speaker: gentleman
          text: "你既然肯干，就跟我走吧。"
        - id: ch02-b08
          speaker: narrator
          text: "绅士带他去了牧草地。迪克干活十分卖力，直到干草全部收好以前，天天都有饭吃，日子过得很快活。可活儿一完，他又落到了从前那般困苦的境地。眼看就要再次饿死，他只得躺倒在富商菲茨沃伦先生的门前。"
        - id: ch02-b09
          speaker: narrator
          text: "厨娘很快发现了他。这个女人脾气很坏，当时正忙着给主人夫妇准备晚饭，一见迪克就叫骂起来。"
        - id: ch02-b10
          speaker: cook
          text: "你这个懒鬼，在这里躺什么？叫花子怎么到处都是！赶快滚开，不然我就拿滚烫的洗碗水浇你，看你跳不跳得起来！"
          emotion: angry
        - id: ch02-b11
          speaker: narrator
          text: "恰好菲茨沃伦先生回家吃饭。他看见门口躺着一个肮脏褴褛的男孩，便走过去问。"
        - id: ch02-b12
          speaker: fitzwarren
          text: "孩子，你怎么躺在这里？你已经能做工了，莫非是自己犯懒？"
        - id: ch02-b13
          speaker: dick
          text: "不是的，先生。我真心愿意做事，可在这里谁也不认识。我想自己是饿得病倒了。"
        - id: ch02-b14
          speaker: fitzwarren
          text: "可怜的孩子。起来，让我看看你究竟怎么了。"
        - id: ch02-b15
          speaker: narrator
          text: "迪克试着起身，却虚弱得只能重新躺下。他整整三天没吃东西，连站立的力气都没有，更别说在街上奔走乞讨了。好心的商人立即叫人把他扶进屋，让他饱餐一顿，又留下他替厨娘做些力所能及的活儿。"
        - id: ch02-b16
          speaker: narrator
          text: "若不是那个恶毒的厨娘，迪克在这户人家原本会过得很幸福。可厨娘把他当成手下，整天逼他擦烤肉叉和接油盘，生火，给烤肉架上发条，还要干遍洗刷间的杂活。"
        - id: ch02-b17
          speaker: cook
          text: "手脚麻利点儿！什么活儿都得赶紧干完，要不然你就等着瞧吧！"
          emotion: angry
        - id: ch02-b18
          speaker: narrator
          text: "说着，她还会朝迪克挥舞汤勺。她最爱给烤肉浇油。没有肉可浇时，就拿扫帚或随手抓来的任何东西，往可怜的迪克头上肩上“浇”一顿。菲茨沃伦先生的女儿艾丽斯后来听说厨娘怎样虐待他，便警告这个女人，若不肯对迪克好些，就把她赶走。厨娘这才稍稍收敛。"
    - id: ch03
      title: 一便士买来的猫
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "迪克还有一件苦恼。他睡在满是破洞的阁楼里，夜夜受大小老鼠折磨。有位绅士让他擦鞋，赏了他一便士。迪克马上想到，可以用这枚钱买只猫。第二天，他真遇见一个带猫的女孩。"
        - id: ch03-b02
          speaker: dick
          text: "我用一便士买你的猫，好不好？"
        - id: ch03-b03
          speaker: girl
          text: "好呀，少爷。她可是捉老鼠的好手呢。"
        - id: ch03-b04
          speaker: narrator
          text: "迪克把猫藏在阁楼，每顿饭都省下一点儿喂她。不久，老鼠全被赶跑了，他终于能够夜夜安睡。"
        - id: ch03-b05
          speaker: narrator
          text: "不久，菲茨沃伦先生有一艘船就要启航。按照当时的规矩，主人不能只顾自己做生意，还要让所有仆人都有机会靠海外买卖碰碰运气。他把大家召进客厅，问每个人愿意送什么货物上船。别人都拿得出愿意冒险的东西，只有迪克既无钱财，也无货物，只好留在外面。艾丽斯猜到原因，叫人把他请了进来。"
        - id: ch03-b06
          speaker: alice
          text: "我从自己的钱袋里拿钱，替迪克投一份吧。"
        - id: ch03-b07
          speaker: fitzwarren
          text: "不行，艾丽斯。必须拿他自己的东西去做生意。"
        - id: ch03-b08
          speaker: dick
          text: "我除了一只猫，什么也没有。她是我前些时候花一便士买来的。"
        - id: ch03-b09
          speaker: fitzwarren
          text: "那么就把猫抱下来，让她跟船去吧。"
        - id: ch03-b10
          speaker: narrator
          text: "迪克含着眼泪从阁楼抱下猫儿，把她交给船长。"
        - id: ch03-b11
          speaker: dick
          text: "猫儿走了，老鼠又会闹得我整晚睡不着。"
          emotion: sad
        - id: ch03-b12
          speaker: narrator
          text: "满屋的人都笑这桩古怪的投资。艾丽斯却很可怜迪克，特意给了他一些钱，让他再买一只猫。可她这次的照顾，加上平日许多别的好意，反倒叫那个坏脾气的厨娘心生嫉妒。厨娘对迪克比从前更加残忍，还总拿他把猫送去海上的事取笑他。"
        - id: ch03-b13
          speaker: cook
          text: "你那只猫卖来的钱，够买一根打你的棍子吗？"
        - id: ch03-b14
          speaker: narrator
          text: "迪克再也忍受不住这样的折磨，决心从这里逃走。他收好自己仅有的几件东西，在十一月一日万圣节那天一大早离开了。一路走到霍洛韦，他才坐在一块石头上，仔细思量接下来究竟该走哪条路。直到今天，人们还把那块石头叫作“惠廷顿石”。"
    - id: ch04
      title: 鲍教堂的钟声
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "迪克正拿不定主意，鲍教堂的六口钟忽然一齐响了。钟声飘到他耳边，听来仿佛在唱。"
        - id: ch04-b02
          speaker: narrator
          text: "回来吧，惠廷顿，三任伦敦市长郎。"
        - id: ch04-b03
          speaker: dick
          text: "伦敦市长！只要长大以后能当上市长，坐进漂亮的马车，现在受什么苦我都愿意。好，我回去！老厨娘就算打我骂我，我也不在乎了。"
        - id: ch04-b04
          speaker: narrator
          text: "迪克转身往回走。他赶在老厨娘下楼以前溜进屋，已经埋头干起活来。"
    - id: ch05
      title: 巴巴里宫中的鼠患
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "现在，该跟随猫小姐去非洲海岸看看了。载着她的船在海上漂泊许久，最后被风吹到巴巴里海岸的一处地方。那里只住着英国人从未见过的摩尔人。当地人好奇水手的肤色与自己不同，纷纷赶来看他们，待人也十分客气。双方渐渐熟悉以后，他们更是争着购买船上装载的精美货物。"
        - id: ch05-b02
          speaker: narrator
          text: "船长挑出最好的几样货物，把样品送给国王。国王非常喜欢，立刻召他进宫。客人们依照当地风俗，坐在绣着金银花纹的华美地毯上。国王和王后坐在大厅上首，一道又一道菜送到面前。可众人才坐下不久，大群老鼠突然涌进来，一眨眼就把所有肉食吃得精光。船长看得十分惊讶，问这些害兽是不是叫他们很苦恼。"
        - id: ch05-b03
          speakers: [courtier_1, courtier_2]
          ensemble: duo
          text: "它们讨厌极了！只要能除掉这些老鼠，国王情愿拿出一半财宝。它们不只吃光晚餐，还闯进寝室，爬上国王的床。国王睡着时都要有人守着，就怕它们来袭。"
          emotion: disgusted
        - id: ch05-b04
          speaker: narrator
          text: "船长高兴得跳起来。他想起惠廷顿那只猫，忙说船上有一种动物，马上就能消灭全部害兽。国王听到这个消息，跳得比他还高，连头巾都落了下来。"
        - id: ch05-b05
          speaker: king
          text: "快把那种动物带来！宫里有这些害兽，实在可怕。她若真有这样的本领，我就拿满船黄金珠宝来换。"
          emotion: happy
        - id: ch05-b06
          speaker: narrator
          text: "船长深谙生意之道，趁这个机会把猫小姐的本领好好夸了一番。"
        - id: ch05-b07
          speaker: captain
          text: "陛下，我实在不便同她分开。猫一离船，老鼠说不定会把货物咬坏。不过为了陛下，我愿意把她带来。"
        - id: ch05-b08
          speaker: queen
          text: "快去，快去！我真想立刻见到这个可爱的小东西。"
        - id: ch05-b09
          speaker: narrator
          text: "船长赶回船上，宫里又准备了一桌饭菜。他把猫儿夹在臂下带进大厅，正赶上老鼠爬满餐桌。猫儿一看见它们，根本不用吩咐，立刻跳出船长怀抱。几分钟后，几乎所有老鼠都死在她脚边，剩下的吓得逃回了洞里。"
        - id: ch05-b10
          speaker: narrator
          text: "国王这么容易就摆脱了祸害，高兴极了。王后想近处看看这位大功臣，船长便把猫儿唤到身旁。"
        - id: ch05-b11
          speaker: captain
          text: "咪咪，咪咪，咪咪！到这里来。"
        - id: ch05-b12
          speaker: narrator
          text: "船长把猫儿抱给王后。王后却往后一缩，不敢碰这个杀死了无数老鼠的小东西。船长抚摸着猫，又叫了两声“咪咪”，王后这才伸出手。她还不会说英语，只能学着另一个声音来叫。"
        - id: ch05-b13
          speaker: queen
          text: "米米，米米。"
        - id: ch05-b14
          speaker: narrator
          text: "船长把猫放到王后膝上。她呼噜呼噜地同王后的手玩了一会儿，最后就这样打着呼噜睡着了。"
        - id: ch05-b15
          speaker: narrator
          text: "国王亲眼见识了猫夫人的功绩，又听说她将来生下的小猫足以遍布全国，使这里从此再无鼠患，便同船长谈妥价钱，先买下了整船货物。而他为这只猫付的钱，竟是其余全部货物总价的十倍。船长随后辞别国王、王后和宫中众人，乘着顺风扬帆驶回英格兰。航程一路平安顺遂，最后安然抵达伦敦。"
    - id: ch06
      title: 惠廷顿先生的财富
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: "一天清早，菲茨沃伦先生刚在账房的书桌前坐下，准备清点现钱，安排一天的生意，门上忽然传来笃、笃的敲门声。"
        - id: ch06-b02
          speaker: fitzwarren
          text: "门外是谁？"
        - id: ch06-b03
          speaker: captain
          text: "是朋友。我给您带来了“独角兽号”的好消息。"
        - id: ch06-b04
          speaker: narrator
          text: "商人匆匆起身，忙得连自己的痛风都忘了。门一打开，外面等候的正是船长和代理商。他们带来一匣珠宝，还有一张提货单。菲茨沃伦先生仔细看过单据，便抬起眼睛，感谢上天赐给他这样兴旺顺利的一趟航程。"
        - id: ch06-b05
          speaker: narrator
          text: "船长和代理商讲完猫儿的故事，又展示国王和王后为她送给迪克的贵重礼物。商人一听，马上高声吩咐仆人。"
        - id: ch06-b06
          speaker: fitzwarren
          text: "快去请他进厅堂，告诉他美名已传扬。称呼可要改一改，请叫惠廷顿先生郎。"
        - id: ch06-b07
          speaker: narrator
          text: "有几个仆人觉得，这么大一笔财宝全给迪克未免太多。菲茨沃伦先生却显出了真正的善良。"
        - id: ch06-b08
          speaker: fitzwarren
          text: "上帝不许我少给他哪怕一便士。财宝本来就是他的，一分钱也不能克扣。"
        - id: ch06-b09
          speaker: narrator
          text: "这时，迪克正满身污垢地替厨娘刷锅。他听说主人叫他进账房，觉得自己实在不该进去。"
        - id: ch06-b10
          speaker: dick
          text: "屋子已经扫干净了，可我的鞋又脏，还钉满铁钉。我还是别进去吧。"
        - id: ch06-b11
          speaker: narrator
          text: "菲茨沃伦先生坚持要他来，还叫人摆好椅子。迪克以为大家又要拿自己取笑。"
        - id: ch06-b12
          speaker: dick
          text: "请别捉弄我这个没见过世面的穷孩子了。让我下楼继续干活吧。"
        - id: ch06-b13
          speaker: fitzwarren
          text: "惠廷顿先生，我们说的全是实话。这两位先生给您带来了天大的好消息，我真心替您高兴。船长把您的猫卖给巴巴里的国王，换回来的财富，比我在这世上拥有的一切还多。愿您长久享用这份财富！"
          emotion: happy
        - id: ch06-b14
          speaker: narrator
          text: "菲茨沃伦先生命人打开大宝箱。"
        - id: ch06-b15
          speaker: fitzwarren
          text: "惠廷顿先生，现在您只须找个安全地方，把这些财宝存好。"
        - id: ch06-b16
          speaker: narrator
          text: "迪克欢喜得不知如何是好。他说这一切都来自主人的恩情，请菲茨沃伦先生随意拿走一份。"
        - id: ch06-b17
          speaker: fitzwarren
          text: "不，不。这全是你的。我相信你会把它们用在好地方。"
        - id: ch06-b18
          speaker: narrator
          text: "接着，迪克又请女主人和艾丽斯收下一部分好运，她们也不肯，只说看见他有这样的好运，自己一样欢喜。这个从穷苦中走来的年轻人心地太好，不愿把全部财富独自留下，便送了礼物给船长、大副和菲茨沃伦先生家的其他仆人，连那个恶毒的老厨娘也没有漏下。"
    - id: ch07
      title: 三任伦敦市长
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: "菲茨沃伦先生劝迪克请一位像样的裁缝，把自己打扮成绅士，又告诉他，在找到更好的住处以前，尽管继续住在这个家里。迪克洗净脸，烫卷头发，把帽子斜斜戴好，再换上一套漂亮衣裳，看起来英俊又斯文，同任何一位来菲茨沃伦先生家做客的年轻绅士相比都毫不逊色。"
        - id: ch07-b02
          speaker: narrator
          text: "艾丽斯从前待迪克亲切，只把他当成一个值得怜惜的穷孩子，如今却觉得他正适合做自己的心上人。何况迪克时时都在想怎样让她高兴，总把能找到的最精美的礼物送给她。菲茨沃伦先生很快看出两个人彼此相爱，便提议让他们结为夫妻。迪克和艾丽斯都欣然答应。"
        - id: ch07-b03
          speaker: narrator
          text: "婚期很快定下。到了那一天，伦敦市长、市参议会的议员、治安官，还有许多城中最富有的商人，一同陪着他们前往教堂。婚礼完成以后，新婚夫妇又设下一场极其丰盛的宴席，好好款待了前来祝贺的众人。"
        - id: ch07-b04
          speaker: narrator
          text: "历史告诉我们，惠廷顿先生和夫人后来一直生活得富贵堂皇，也过得十分幸福。他们还生了好几个孩子。惠廷顿当过伦敦治安官，三次出任伦敦市长，最后受亨利五世册封，成为爵士。"
        - id: ch07-b05
          speaker: narrator
          text: "亨利五世征服法国以后，惠廷顿设下盛宴款待国王和王后。宴会的排场实在太大，连国王也忍不住赞叹。"
        - id: ch07-b06
          speaker: henry_v
          text: "从没有哪个君王拥有过这样的臣民。"
        - id: ch07-b07
          speaker: dick
          text: "也从没有哪个臣民拥有过这样的君王。"
        - id: ch07-b08
          speaker: narrator
          text: "古老的纽盖特监狱是理查德·惠廷顿爵士为关押犯人建造的。从前，监狱门洞上方立着一尊石像，刻的是惠廷顿爵士怀抱爱猫的模样。直到一七八〇年，人们还能在那里看见它。"
