audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and unhurried, with the steady rhythm of an old fireside tale
        timbre: clear and gently weathered
        pace: measured
        pitch: medium
    mother:
      display_name: Mother
      tts:
        delivery: brisk, practical, and quick to speak her mind
        timbre: mature and earthy
        pace: medium
        pitch: medium-low
    daughter:
      display_name: Daughter
      tts:
        delivery: youthful and direct, shifting from careless to frightened to clever
        timbre: bright and natural
        pace: medium
        pitch: medium-high
    king:
      display_name: King
      tts:
        delivery: confident and plainspoken, with an easy royal authority
        timbre: full and resonant
        pace: measured
        pitch: medium-low
    tom_tit_tot:
      display_name: Tom Tit Tot
      tts:
        delivery: sly and needling, growing more eager as the bargain nears its end
        timbre: thin and raspy
        pace: quick
        pitch: high
  chapters:
    - id: ch01
      title: Five Pies
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, a woman baked five pies. When she took them from the oven, she found she had baked them too long. The crusts were so hard that no one could eat them.
        - id: ch01-b02
          speaker: mother
          text: Daughter, put those pies up on the shelf. Leave them there for a while, and they'll come again.
        - id: ch01-b03
          speaker: narrator
          text: What she meant was that the crusts would soften again. But that was not what her daughter thought.
        - id: ch01-b04
          speaker: daughter
          text: Well, if they're going to come again, I may as well eat these now.
        - id: ch01-b05
          speaker: narrator
          text: So she began eating, and before long she had eaten every one of the five pies.
        - id: ch01-b06
          speaker: narrator
          text: At suppertime, her mother remembered the pies.
        - id: ch01-b07
          speaker: mother
          text: Go and fetch one of those pies. They should have come again by now.
        - id: ch01-b08
          speaker: narrator
          text: The girl went to the shelf and looked. There was nothing there but five empty dishes. She came back to her mother.
        - id: ch01-b09
          speaker: daughter
          text: No, they haven't come again.
        - id: ch01-b10
          speaker: mother
          text: Not even one?
        - id: ch01-b11
          speaker: daughter
          text: Not a single one.
        - id: ch01-b12
          speaker: mother
          text: Come again or not, I mean to have a pie for supper.
        - id: ch01-b13
          speaker: daughter
          text: But you can't have one if they haven't come.
        - id: ch01-b14
          speaker: mother
          text: Oh, yes, I can. Go and bring me the best one.
        - id: ch01-b15
          speaker: daughter
          text: Best or worst, I've eaten them all. You can't have one until it comes again.
        - id: ch01-b16
          speaker: narrator
          text: That finished the matter. The woman took her spinning to the doorway. As she worked, she sang the same words over and over.
        - id: ch01-b17
          speaker: mother
          text: My daughter ate five, five pies today. My daughter ate five, five pies today.

    - id: ch02
      title: The King's Bargain
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Just then, the king came down the street. He heard the tune, but he could not make out the words. He stopped beside the woman.
        - id: ch02-b02
          speaker: king
          text: Good woman, what was that song you were singing?
        - id: ch02-b03
          speaker: narrator
          text: The woman was ashamed to tell the king what her daughter had done. So this time, she changed the words.
        - id: ch02-b04
          speaker: mother
          text: My daughter spun five, five skeins today. My daughter spun five, five skeins today.
        - id: ch02-b05
          speaker: king
          text: My stars! I've never heard of anyone who could spin as much as that.
        - id: ch02-b06
          speaker: narrator
          text: Then the king made the woman an offer.
        - id: ch02-b07
          speaker: king
          text: Listen carefully. I am looking for a wife, and I will marry your daughter. For eleven months of every year, she may eat whatever she likes, wear all the gowns she wants, and keep whatever company she pleases. But in the final month, she must spin five skeins every day. If she fails, I will have her killed.
        - id: ch02-b08
          speaker: mother
          text: Very well. I agree.
        - id: ch02-b09
          speaker: narrator
          text: The mother thought it was a splendid marriage. The month of spinning was far away. When it came, surely there would be some way around the promise. Most likely, the king would forget it altogether.
        - id: ch02-b10
          speaker: narrator
          text: So the king and the girl were married. For eleven months, she ate what she liked, had all the gowns she wanted, and kept all the company she pleased.
        - id: ch02-b11
          speaker: narrator
          text: As the eleventh month drew to an end, she began thinking about those five skeins. She wondered whether the king still remembered. He said nothing, so she came to believe he had forgotten.
        - id: ch02-b12
          speaker: narrator
          text: But on the last day of that month, he led her to a room she had never seen. Inside were only a spinning wheel and a stool.
        - id: ch02-b13
          speaker: king
          text: Tomorrow, my dear, you will be locked in here with food and flax. If you have not spun five skeins by nightfall, your head will come off.
        - id: ch02-b14
          speaker: narrator
          text: With that, he went away about his business.
        - id: ch02-b15
          speaker: narrator
          text: The girl was terrified. She had always been careless and helpless, and she did not even know how to spin. Tomorrow she would be alone, with no one allowed near her. What could she possibly do? She sat on a stool in the kitchen and cried and cried.

    - id: ch03
      title: The Thing at the Door
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: All at once, she heard a faint knock, very low down on the door. She got up and opened it. There stood a tiny black creature with a long tail. It peered up at her in a curious way.
        - id: ch03-b02
          speaker: tom_tit_tot
          text: What are you crying about?
        - id: ch03-b03
          speaker: daughter
          text: What business is that of yours?
        - id: ch03-b04
          speaker: tom_tit_tot
          text: Never mind that. Just tell me why you're crying.
        - id: ch03-b05
          speaker: daughter
          text: Telling you won't do me any good.
        - id: ch03-b06
          speaker: tom_tit_tot
          text: You don't know that.
        - id: ch03-b07
          speaker: narrator
          text: The creature curled its tail around and around.
        - id: ch03-b08
          speaker: daughter
          text: Well, it can't hurt to tell you, even if it doesn't help.
        - id: ch03-b09
          speaker: narrator
          text: And she told the whole tale, from the five pies to the five skeins.
        - id: ch03-b10
          speaker: tom_tit_tot
          text: Then here is what I'll do. Every morning, I'll come to your window and take the flax. Every night, I'll bring it back spun.
        - id: ch03-b11
          speaker: daughter
          text: And what do you want in return?
        - id: ch03-b12
          speaker: narrator
          text: The little creature looked sideways at her.
        - id: ch03-b13
          speaker: tom_tit_tot
          text: Each night, you may guess my name three times. If you have not guessed it before the month ends, you will belong to me.
        - id: ch03-b14
          speaker: narrator
          text: The girl felt certain she could discover its name within a month.
        - id: ch03-b15
          speaker: daughter
          text: All right. I agree.
        - id: ch03-b16
          speaker: tom_tit_tot
          text: Then we have a bargain.
        - id: ch03-b17
          speaker: narrator
          text: Its long tail spun around and around.
        - id: ch03-b18
          speaker: narrator
          text: The next morning, the king took his wife into the room. The day's food and a bundle of flax were waiting there.
        - id: ch03-b19
          speaker: king
          text: There is your flax. If it is not all spun by tonight, you will lose your head.
        - id: ch03-b20
          speaker: narrator
          text: He left the room and locked the door behind him. He had scarcely gone when something tapped at the window.
        - id: ch03-b21
          speaker: narrator
          text: The girl opened it, and there sat the little creature on the ledge.
        - id: ch03-b22
          speaker: tom_tit_tot
          text: Where is the flax?
        - id: ch03-b23
          speaker: daughter
          text: Here it is.
        - id: ch03-b24
          speaker: narrator
          text: She handed the flax through the window. That evening, another tapping came. She opened the window again. The creature was back, with five skeins over one arm.
        - id: ch03-b25
          speaker: tom_tit_tot
          text: Here are your skeins. Now, tell me my name.
        - id: ch03-b26
          speaker: daughter
          text: Is it Bill?
        - id: ch03-b27
          speaker: tom_tit_tot
          text: No, it isn't.
        - id: ch03-b28
          speaker: narrator
          text: Its tail gave a twirl.
        - id: ch03-b29
          speaker: daughter
          text: Then is it Ned?
        - id: ch03-b30
          speaker: tom_tit_tot
          text: No, it isn't.
        - id: ch03-b31
          speaker: narrator
          text: The tail twirled again.
        - id: ch03-b32
          speaker: daughter
          text: Is it Mark?
        - id: ch03-b33
          speaker: tom_tit_tot
          text: No, it isn't!
        - id: ch03-b34
          speaker: narrator
          text: This time the tail whirled harder, and the creature flew away.
        - id: ch03-b35
          speaker: narrator
          text: When the king returned, the five finished skeins were ready for him.
        - id: ch03-b36
          speaker: king
          text: I see I won't have to kill you tonight, my dear. You will have more food and flax in the morning.
        - id: ch03-b37
          speaker: narrator
          text: Then he went away.

    - id: ch04
      title: One Night Left
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The same thing happened day after day. Food and flax were brought to the room. The little black creature came every morning and every evening. All day long, the girl tried to think of names for her three guesses. Yet she never found the right one.
        - id: ch04-b02
          speaker: narrator
          text: As the end of the month came closer, the creature looked more and more spiteful. Whenever she guessed wrong, its tail spun faster than before.
        - id: ch04-b03
          speaker: narrator
          text: At last, the next-to-last night arrived. The creature brought the five skeins and fixed its eyes on her.
        - id: ch04-b04
          speaker: tom_tit_tot
          text: What? You still haven't found my name?
        - id: ch04-b05
          speaker: daughter
          text: Is it Nicodemus?
        - id: ch04-b06
          speaker: tom_tit_tot
          text: No, that's not it.
        - id: ch04-b07
          speaker: daughter
          text: Is it Sammle?
        - id: ch04-b08
          speaker: tom_tit_tot
          text: No, that's not it.
        - id: ch04-b09
          speaker: daughter
          text: Well, is it Methusalem?
        - id: ch04-b10
          speaker: tom_tit_tot
          text: No, that isn't it either.
        - id: ch04-b11
          speaker: narrator
          text: Its eyes glowed like burning coals as it stared at her.
        - id: ch04-b12
          speaker: tom_tit_tot
          text: Woman, you have only tomorrow night left. Then you will be mine!
        - id: ch04-b13
          speaker: narrator
          text: And it flew away. The girl felt dreadful.
        - id: ch04-b14
          speaker: narrator
          text: Soon she heard the king coming along the passage. He entered and saw the five skeins.
        - id: ch04-b15
          speaker: king
          text: Well, my dear, it seems you will have tomorrow's skeins ready too. Since I expect I won't have to kill you, I shall eat supper here tonight.
        - id: ch04-b16
          speaker: narrator
          text: Supper was brought in, along with another stool. The king and the girl sat down together. He had eaten only a mouthful or two when he stopped and began to laugh.
        - id: ch04-b17
          speaker: daughter
          text: What are you laughing about?
        - id: ch04-b18
          speaker: king
          text: Well, I was hunting today, and I wandered into a part of the woods I had never seen. There was an old chalk pit there. I heard a strange humming sound, so I climbed down from my horse and crept quietly to the edge. When I looked into the pit, I saw the funniest little black creature you could imagine. It had a tiny spinning wheel. It was spinning at a tremendous speed and whipping its tail around. And while it spun, it sang this.
        - id: ch04-b19
          speaker: king
          text: Nimmy nimmy not. My name's Tom Tit Tot.
        - id: ch04-b20
          speaker: narrator
          text: When the girl heard those words, she felt she could have jumped out of her skin for joy. But she kept silent.

    - id: ch05
      title: The Final Guess
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The next morning, the little creature looked more spiteful than ever when it came for the flax.
        - id: ch05-b02
          speaker: narrator
          text: Night came. The girl heard the tap against the windowpanes and opened the window. The creature climbed right onto the ledge. It grinned from ear to ear, and its tail was spinning so fast it was almost a blur.
        - id: ch05-b03
          speaker: tom_tit_tot
          text: What is my name?
        - id: ch05-b04
          speaker: narrator
          text: It handed her the five skeins. The girl pretended to be afraid.
        - id: ch05-b05
          speaker: daughter
          text: Is it Solomon?
          emotion: fearful
        - id: ch05-b06
          speaker: tom_tit_tot
          text: No, it isn't.
        - id: ch05-b07
          speaker: narrator
          text: It moved farther into the room.
        - id: ch05-b08
          speaker: daughter
          text: Then is it Zebedee?
          emotion: fearful
        - id: ch05-b09
          speaker: tom_tit_tot
          text: No, it isn't!
        - id: ch05-b10
          speaker: narrator
          text: The creature laughed. Its tail whirled so quickly that the girl could hardly see it.
        - id: ch05-b11
          speaker: tom_tit_tot
          text: Take your time, woman. One more guess, and you are mine.
        - id: ch05-b12
          speaker: narrator
          text: It stretched its black hands toward her. She stepped back once, then again. She looked straight at the creature and burst out laughing. Pointing one finger at it, she cried out.
        - id: ch05-b13
          speaker: daughter
          text: Nimmy nimmy not, your name's Tom Tit Tot!
          emotion: happy
        - id: ch05-b14
          speaker: narrator
          text: At the sound of its name, the creature gave a terrible shriek and flew away into the darkness.
        - id: ch05-b15
          speaker: narrator
          text: She never saw it again.
