audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容讲述古老童话，诙谐中渐渐透出紧张
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中
    mother:
      display_name: 母亲
      tts:
        delivery: 直率粗朴，说话干脆
        timbre: 成熟女声，略显沙哑
        pace: 中等
        pitch: 中低
    daughter:
      display_name: 姑娘
      tts:
        delivery: 年轻自然，起初懒散，后来惶恐而机敏
        timbre: 清脆的年轻女声
        pace: 中等偏快
        pitch: 中高
    king:
      display_name: 国王
      tts:
        delivery: 自信随意，命令不容置疑
        timbre: 洪亮沉稳的男声
        pace: 中等
        pitch: 中低
    imp:
      display_name: 小妖
      tts:
        delivery: 狡猾尖刻，越到后来越得意凶狠
        timbre: 细而干涩的怪声
        pace: 灵活偏快
        pitch: 高
  chapters:
    - id: ch01
      title: 五只馅饼
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "从前有个女人，一回烤了五只馅饼。可她烤得太久，馅饼刚从炉子里拿出来，饼皮就硬得咬不动了。她只好叫来女儿，想让馅饼先在架子上放一放。"
        - id: ch01-b02
          speaker: mother
          text: "闺女，把这几只馅饼放到架子上吧。搁上一会儿，它们就会回过来了。"
        - id: ch01-b03
          speaker: narrator
          text: "母亲说的“回过来”，是指硬邦邦的饼皮放上一阵，就会重新变软。姑娘听了，却偏偏把这话当成了另一回事。"
        - id: ch01-b04
          speaker: daughter
          text: "既然它们还会回来，那我现在吃掉也不要紧。"
        - id: ch01-b05
          speaker: narrator
          text: "她说吃就吃，从第一只吃到最后一只，五只馅饼全进了她的肚子。到了晚饭时候，母亲想起架子上的馅饼，该拿一只来吃了。"
        - id: ch01-b06
          speaker: mother
          text: "去拿一只来吧。放了这么久，它们应该已经回过来了。"
        - id: ch01-b07
          speaker: narrator
          text: "姑娘走到架子前，只看到五只空盘。她转回来告诉母亲。"
        - id: ch01-b08
          speaker: daughter
          text: "没有，它们一只也没回来。"
        - id: ch01-b09
          speaker: mother
          text: "怎么，一只都没有吗？"
        - id: ch01-b10
          speaker: daughter
          text: "对，一只都没有。"
        - id: ch01-b11
          speaker: mother
          text: "不管它们回没回来，晚饭我都要吃一只。"
        - id: ch01-b12
          speaker: daughter
          text: "它们没回来，你怎么吃得着呢？"
        - id: ch01-b13
          speaker: mother
          text: "我当然吃得着。快去，把最好的一只拿来。"
        - id: ch01-b14
          speaker: daughter
          text: "别说最好的一只，最坏的也没有。我已经全吃光了。等它们回来，你才能吃到。"
        - id: ch01-b15
          speaker: narrator
          text: "母亲这下彻底没辙了。她拿着纺线的活儿坐到门口，一边转动纺车，一边把这件丢人的事唱了出来。"
        - id: ch01-b16
          speaker: mother
          text: "我闺女今天吃了五只，五只馅饼。我闺女今天吃了五只，五只馅饼。"
        - id: ch01-b17
          speaker: narrator
          text: "国王正从街上经过。他听见歌声，却没听清唱词，便停下脚步。"
        - id: ch01-b18
          speaker: king
          text: "好大嫂，你刚才唱的是什么？"
        - id: ch01-b19
          speaker: narrator
          text: "母亲哪好意思说女儿偷吃了五只馅饼？她赶紧换了一首。"
        - id: ch01-b20
          speaker: mother
          text: "我闺女今天纺了五绞，五绞细线。我闺女今天纺了五绞，五绞细线。"
        - id: ch01-b21
          speaker: king
          text: "我的星星呀！我还从没听说谁一天能纺这么多。"
        - id: ch01-b22
          speaker: narrator
          text: "国王正想娶妻。他当场说出了自己的条件。"
        - id: ch01-b23
          speaker: king
          text: "我就娶你的女儿。一年里有十一个月，她爱吃什么就吃什么，爱穿什么就穿什么，爱和谁来往都行。可最后一个月，她每天必须纺出五绞线。少一绞，我就杀了她。"
        - id: ch01-b24
          speaker: mother
          text: "好，就这么办。"
        - id: ch01-b25
          speaker: narrator
          text: "母亲满口答应，只想着女儿嫁给国王，这门亲事有多体面。至于每天那五绞线，等日子真到了，总会有许多法子躲过去。何况过了十一个月，国王说不定早已忘得干干净净。"
    - id: ch02
      title: 最后一个月
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "姑娘就这样嫁给了国王。头十一个月，她想吃什么就吃什么，想添多少衣裳就添多少，也尽可以和喜欢的人来往。眼看这段好日子快过完，她开始惦记每天五绞线的约定，还偷偷猜测国王记不记得。国王一直只字不提，她便以为他真的忘了。"
        - id: ch02-b02
          speaker: narrator
          text: "谁知第十一个月的最后一天，国王领她来到一间从未见过的屋子。屋里只有一架纺车和一只凳子。"
        - id: ch02-b03
          speaker: king
          text: "亲爱的，明天你会被锁在这里。我会留下食物和亚麻。天黑前要是纺不出五绞线，你就得掉脑袋。"
        - id: ch02-b04
          speaker: narrator
          text: "国王说完，转身去忙自己的事。姑娘却吓得六神无主。她一向是个懒散又没本事的人，连纺线该怎么下手都不知道。明天门一锁，谁也不能靠近，她一个人该怎么办？她坐在厨房的小凳上，越想越怕，放声大哭起来。"
        - id: ch02-b05
          speaker: narrator
          text: "忽然，门板最下面传来轻轻的敲击声。她打开门，看见一个黑黢黢的小东西，身后拖着长尾巴。它好奇地仰头瞧她。"
        - id: ch02-b06
          speaker: imp
          text: "你为什么哭呀？"
        - id: ch02-b07
          speaker: daughter
          text: "这跟你有什么关系？"
        - id: ch02-b08
          speaker: imp
          text: "有没有关系不用你管。先告诉我，你到底为什么哭。"
        - id: ch02-b09
          speaker: daughter
          text: "就算告诉你，也帮不上忙。"
        - id: ch02-b10
          speaker: imp
          text: "那可不一定。"
        - id: ch02-b11
          speaker: narrator
          text: "小东西把尾巴绕着身子一转。姑娘想，反正说出来也没有损失，便把馅饼、五绞线和所有的事都讲给它听。"
        - id: ch02-b12
          speaker: imp
          text: "我可以帮你。每天早上，我到窗边取走亚麻。晚上，我把纺好的线送回来。"
        - id: ch02-b13
          speaker: daughter
          text: "那我要拿什么付给你？"
        - id: ch02-b14
          speaker: narrator
          text: "小东西从眼角斜斜地瞟着她。"
        - id: ch02-b15
          speaker: imp
          text: "每天晚上，你可以猜三次我的名字。这个月结束以前，如果你还猜不中，你就归我。"
        - id: ch02-b16
          speaker: narrator
          text: "姑娘觉得，一个月里总能猜中一个名字。"
        - id: ch02-b17
          speaker: daughter
          text: "行，我答应你。"
        - id: ch02-b18
          speaker: imp
          text: "那我们就说定了。"
        - id: ch02-b19
          speaker: narrator
          text: "小东西答应一声，尾巴顿时欢快地转了起来。"
    - id: ch03
      title: 每晚三个名字
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "第二天，国王把姑娘带进屋。当天的食物和亚麻已经摆在那里。"
        - id: ch03-b02
          speaker: king
          text: "亚麻都在这儿。今晚还纺不完，你的脑袋就没了。"
        - id: ch03-b03
          speaker: narrator
          text: "国王说完便走出去，从外面锁上了门。他前脚刚走，窗户就被敲响了。姑娘起身打开窗，那个黑黢黢的小东西果然已经坐在窗台上等她。"
        - id: ch03-b04
          speaker: imp
          text: "把亚麻给我吧。"
        - id: ch03-b05
          speaker: daughter
          text: "给你，都在这里。"
        - id: ch03-b06
          speaker: narrator
          text: "姑娘把屋里的亚麻递了过去。一直到了傍晚，窗户再次被敲响。她赶忙打开窗，小东西已经回来了，胳膊上搭着五绞纺得好好的亚麻线。"
        - id: ch03-b07
          speaker: imp
          text: "线给你。现在该你猜了，我叫什么？"
        - id: ch03-b08
          speaker: daughter
          text: "你是不是叫比尔？"
        - id: ch03-b09
          speaker: imp
          text: "不，不是。"
        - id: ch03-b10
          speaker: narrator
          text: "它转了转尾巴。"
        - id: ch03-b11
          speaker: daughter
          text: "那你叫内德吗？"
        - id: ch03-b12
          speaker: imp
          text: "也不是。"
        - id: ch03-b13
          speaker: narrator
          text: "它的尾巴又转了一圈。"
        - id: ch03-b14
          speaker: daughter
          text: "会不会是马克？"
        - id: ch03-b15
          speaker: imp
          text: "还是不对。"
        - id: ch03-b16
          speaker: narrator
          text: "小东西把尾巴转得更快，一下子飞走了。后来国王进屋查看，五绞线已经纺好，正整整齐齐地摆在那里等着他。"
        - id: ch03-b17
          speaker: king
          text: "亲爱的，看来今晚不用杀你。明早，你还会拿到食物和亚麻。"
        - id: ch03-b18
          speaker: narrator
          text: "往后的每一天，食物和亚麻都会按时送来。小妖也一天不落，早晨从窗边取走亚麻，晚上带着五绞线回来。姑娘白天就坐在屋里搜肠刮肚，想出一个又一个名字，等小妖来了再猜，可她始终没有碰对。月底越来越近，小妖的神情也一天比一天恶毒。姑娘每猜错一个名字，它的尾巴就比上一次转得更快。"
    - id: ch04
      title: 林中的歌声
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "终于，只剩下最后两天。那天晚上，小妖照常带着五绞线来了。"
        - id: ch04-b02
          speaker: imp
          text: "怎么，你到现在还不知道我的名字？"
        - id: ch04-b03
          speaker: daughter
          text: "你叫尼科迪默斯吗？"
        - id: ch04-b04
          speaker: imp
          text: "不，不是这个。"
        - id: ch04-b05
          speaker: daughter
          text: "那么，是萨默尔吗？"
        - id: ch04-b06
          speaker: imp
          text: "也不是。"
        - id: ch04-b07
          speaker: daughter
          text: "难道是玛土撒拉？"
        - id: ch04-b08
          speaker: imp
          text: "这个也不对。"
        - id: ch04-b09
          speaker: narrator
          text: "小妖用煤火一样的眼睛盯住姑娘。"
        - id: ch04-b10
          speaker: imp
          text: "女人，只剩明天晚上了。明晚一过，你就是我的！"
          emotion: angry
        - id: ch04-b11
          speaker: narrator
          text: "它飞走了。姑娘怕得浑身难受。随后，国王沿着走廊走进屋，看到了纺好的五绞线。"
        - id: ch04-b12
          speaker: king
          text: "亲爱的，看来明晚你也能把线纺好。我大概不用杀你了。今晚，我就在这儿和你一起吃饭。"
        - id: ch04-b13
          speaker: narrator
          text: "仆人送来晚饭，又搬来一只凳子。两人才吃了几口，国王忽然笑了起来。"
        - id: ch04-b14
          speaker: daughter
          text: "你在笑什么？"
        - id: ch04-b15
          speaker: king
          text: "今天打猎时，我走进林子里一个从没去过的地方。那里有个废弃的白垩土坑。我听见有人哼歌，就下了小马，悄悄走到坑边往下看。坑里有个滑稽透顶的黑色小东西。它守着一架小纺车，飞快地纺线，尾巴不停打转。它还一边纺，一边唱呢。"
        - id: ch04-b16
          speaker: king
          text: "尼米，尼米，猜不着。我叫汤姆·蒂特·托特。"
        - id: ch04-b17
          speaker: narrator
          text: "姑娘听见这个名字，高兴得简直要从自己的皮囊里跳出来。可她忍住了，一个字也没说。"
    - id: ch05
      title: 汤姆·蒂特·托特
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "第二天早上，小妖来取亚麻时，满脸都是恶意。夜里，它敲响了窗玻璃。姑娘刚把窗打开，它便跳上窗台，嘴一直咧到耳根，尾巴快得只剩下一团影子。"
        - id: ch05-b02
          speaker: imp
          text: "线给你。现在说吧，我叫什么名字？"
        - id: ch05-b03
          speaker: daughter
          text: "你是所罗门吗？"
        - id: ch05-b04
          speaker: narrator
          text: "姑娘故意装出害怕的样子。"
        - id: ch05-b05
          speaker: imp
          text: "不，不是。"
        - id: ch05-b06
          speaker: narrator
          text: "小妖往屋里逼近了一些。"
        - id: ch05-b07
          speaker: daughter
          text: "那你是西庇太吗？"
        - id: ch05-b08
          speaker: imp
          text: "不，还是不对。"
        - id: ch05-b09
          speaker: narrator
          text: "小妖大笑起来，尾巴转得几乎看不见了。"
        - id: ch05-b10
          speaker: imp
          text: "慢慢猜吧，女人。只剩最后一次。再猜错，你就归我了。"
        - id: ch05-b11
          speaker: narrator
          text: "它把两只黑手伸向姑娘。姑娘往后退了两步，盯着它看了一会儿，忽然笑出了声。她伸手指住小妖。"
        - id: ch05-b12
          speaker: daughter
          text: "尼米，尼米，猜不着——你的名字叫汤姆·蒂特·托特！"
          emotion: happy
        - id: ch05-b13
          speaker: narrator
          text: "小妖一听，发出一声骇人的尖叫，转身飞进了黑暗。姑娘从此再也没有见过它。"
