        timbre: clear and gently weathered
        pace: measured
        pitch: medium
    princess:
      display_name: The Princess
      tts:
        delivery: gentle and gracious, with quiet courage and openhearted warmth
        timbre: youthful and clear
        pace: measured
        pitch: medium-high
    old_man:
      display_name: The Old Man
      tts:
        delivery: plainspoken and watchful, with the gravity of hidden wisdom
        timbre: aged and dry
        pace: unhurried
        pitch: low
    first_head:
      display_name: The First Golden Head
      tts:
        delivery: musical and stately, with a bright note of enchantment
        timbre: clear and bell-like
        pace: measured
        pitch: medium-high
    second_head:
      display_name: The Second Golden Head
      tts:
        delivery: musical and gracious, with a flowing fairy-tale cadence
        timbre: light and silvery
