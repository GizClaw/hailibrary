  chapters:
    - id: ch01
      title: The Princess Seeks Her Fortune
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long before Arthur and the Knights of the Round Table, a king ruled in eastern England and kept his court at Colchester. His queen died at the height of his glory. She left him one daughter, about fifteen years old, whose beauty and kindness amazed everyone who knew her.
        - id: ch01-b02
          speaker: narrator
          text: The king heard of another lady who had an only daughter. He wanted the lady's riches, so he chose to marry her, though she was old, ugly, hook-nosed, and hump-backed. Her yellow-haired daughter was envious and ill-natured, much like her mother.
        - id: ch01-b03
          speaker: narrator
          text: Within a few weeks, the king and all his nobles brought the bride to the palace, and the marriage was performed. Before long, the new queen and her daughter turned him against his own daughter with false stories.
        - id: ch01-b04
          speaker: narrator
          text: Once the young princess had lost her father's love, she grew tired of court. One day she met him in the garden. With tears in her eyes, she asked to leave and seek her fortune. The king agreed and told her stepmother to give her whatever she pleased.
        - id: ch01-b05
          speaker: narrator
          text: The queen gave her a canvas bag with brown bread and hard cheese, and a bottle of beer. It was a poor dowry for a king's daughter, but the princess thanked her and set out.
        - id: ch01-b06
          speaker: narrator
          text: She traveled through groves, woods, and valleys. At last she saw an old man sitting on a stone beside the mouth of a cave.
        - id: ch01-b07
          speaker: old_man
          text: Good morning, fair maiden. Where are you going in such a hurry?
        - id: ch01-b08
          speaker: princess
          text: Good father, I am going to seek my fortune.
        - id: ch01-b09
          speaker: old_man
          text: And what are you carrying in your bag and bottle?
        - id: ch01-b10
          speaker: princess
          text: I have bread and cheese in my bag, and good small beer in my bottle. Would you care for some?
        - id: ch01-b11
          speaker: old_man
          text: Yes, with all my heart.
        - id: ch01-b12
          speaker: narrator
          text: The princess took out her food and invited him to eat as much as he wished. When he had eaten, he thanked her warmly and gave her a warning.
        - id: ch01-b13
          speaker: old_man
          text: A thick thorn hedge lies ahead, and you cannot pass it alone. Take this wand. Strike the hedge three times and say, “Please, hedge, let me through.” It will open at once. A little farther on, you will find a well. Sit on its edge, and three golden heads will rise and speak to you. Whatever they ask, be sure to do it.
        - id: ch01-b14
          speaker: narrator
          text: She promised she would. Then she took the wand, said farewell, and continued on her way.

    - id: ch02
      title: The Three Golden Heads
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: When the princess reached the hedge, she struck it three times with the old man's wand and spoke the words he had taught her. The hedge parted and let her pass. Soon she found the well and sat down on its edge. At once, a golden head rose from the water, singing.
        - id: ch02-b02
          speaker: first_head
          text: Wash me and comb me, then lay me down softly. Lay me on a bank to dry, so I may look pretty when somebody passes by.
        - id: ch02-b03
          speaker: princess
          text: Yes, I will.
        - id: ch02-b04
          speaker: narrator
          text: She rested the head in her lap, combed it with a silver comb, and placed it on a bank of primroses. Then a second golden head rose and made the same request.
        - id: ch02-b05
          speaker: second_head
          text: Wash me and comb me, then lay me down softly. Lay me on a bank to dry, so I may look pretty when somebody passes by.
        - id: ch02-b06
          speaker: narrator
          text: The princess cared for the second head just as gently. When the third head came up and asked for the same kindness, she gave it too.
        - id: ch02-b07
          speaker: third_head
          text: Wash me and comb me, then lay me down softly. Lay me on a bank to dry, so I may look pretty when somebody passes by.
        - id: ch02-b08
          speaker: narrator
          text: After she had set all three on the primrose bank, she took out her provisions and sat down to eat. The golden heads began to talk among themselves.
        - id: ch02-b09
          speaker: first_head
          text: What gift shall we bestow on this maiden, who has treated us so kindly?
        - id: ch02-b10
          speaker: first_head
          text: I grant her such beauty that she will charm the most powerful prince in the world.
        - id: ch02-b11
          speaker: second_head
          text: I grant her a voice sweeter than the nightingale's song.
        - id: ch02-b12
          speaker: third_head
          text: My gift will be no smaller. She is a king's daughter, so I grant her such good fortune that she will become queen to the greatest prince who reigns.
        - id: ch02-b13
          speaker: narrator
          text: The princess lowered the heads into the well again and went on. Before she had traveled far, she saw a king hunting in his park with his nobles. She tried to avoid him, but he caught sight of her and came near. Her beauty and sweet voice made him fall deeply in love, and before long he persuaded her to marry him.
        - id: ch02-b14
          speaker: narrator
          text: When the young king learned that his bride was the King of Colchester's daughter, he ordered chariots prepared for a visit to his father-in-law. He and his queen rode in a chariot adorned with rich gems of gold.
        - id: ch02-b15
          speaker: narrator
          text: Her father was astonished to see how fortunate she had become. Then the young king told him everything that had happened. Everyone at court rejoiced except the queen and her club-footed daughter, who nearly burst with envy.
        - id: ch02-b16
          speaker: narrator
          text: Feasting and dancing went on for many days. At last, the young king and queen returned home, taking with them the dowry her father had given her.

    - id: ch03
      title: The Stepsister Takes the Same Road
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The hump-backed stepsister saw how lucky the princess had been in seeking her fortune and decided to do the same. She told her mother, and the queen made every preparation. She gave her daughter rich dresses, great quantities of sugar, almonds, and sweetmeats, and a large bottle of Malaga wine.
        - id: ch03-b02
          speaker: narrator
          text: The stepsister followed the same road. When she came near the cave, the old man called to her.
        - id: ch03-b03
          speaker: old_man
          text: Young woman, where are you going so fast?
        - id: ch03-b04
          speaker: stepsister
          text: What business is that of yours?
        - id: ch03-b05
          speaker: old_man
          text: Then tell me, what do you have in your bag and bottle?
        - id: ch03-b06
          speaker: stepsister
          text: Good things, and you need not trouble yourself about them.
        - id: ch03-b07
          speaker: old_man
          text: Will you spare me a little?
        - id: ch03-b08
          speaker: stepsister
          text: Not one bite or one drop, unless it would choke you.
        - id: ch03-b09
          speaker: narrator
          text: The old man frowned at her.
        - id: ch03-b10
          speaker: old_man
          text: Then may evil fortune follow you!
          emotion: angry
        - id: ch03-b11
          speaker: narrator
          text: She went on until she reached the thorn hedge. She spotted a gap and tried to squeeze through, but the hedge closed around her. The thorns tore into her flesh, and she escaped only with great difficulty. Covered in blood, she began looking for water and soon saw the well.
        - id: ch03-b12
          speaker: narrator
          text: She sat on the edge. One of the golden heads rose and asked to be washed, combed, and laid down gently, just as before.
        - id: ch03-b13
          speaker: first_head
          text: Wash me and comb me, then lay me down softly.
        - id: ch03-b14
          speaker: narrator
          text: Instead, the stepsister struck the head with her bottle.
        - id: ch03-b15
          speaker: stepsister
          text: There! That is all the washing you will get.
          emotion: angry
        - id: ch03-b16
          speaker: narrator
          text: The second and third heads rose in turn, and she treated each one just as badly. Then the three heads considered how they should punish her cruel behavior.
        - id: ch03-b17
          speaker: first_head
          text: Let leprosy cover her face.
        - id: ch03-b18
          speaker: second_head
          text: Let her voice grow as harsh as a corn-crake's cry.
        - id: ch03-b19
          speaker: third_head
          text: And let her husband be no more than a poor country cobbler.

    - id: ch04
      title: The Cobbler's Bargain
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The stepsister continued until she reached a town on market day. People stared at her diseased face and heard her harsh, squeaking voice. Everyone ran away except a poor country cobbler.
        - id: ch04-b02
          speaker: narrator
          text: Not long before, the cobbler had repaired an old hermit's shoes. The hermit had no money, so he paid with a box of ointment that could cure leprosy and a bottle of spirits that could restore a harsh voice. Wanting to do a charitable deed, the cobbler approached the young woman and asked who she was.
        - id: ch04-b03
          speaker: stepsister
          text: I am the daughter-in-law of the King of Colchester.
        - id: ch04-b04
          speaker: cobbler
          text: If I bring back your natural complexion and cure both your face and your voice, will you take me as your husband in return?
        - id: ch04-b05
          speaker: stepsister
          text: Yes, friend. I will, with all my heart!
        - id: ch04-b06
          speaker: narrator
          text: The cobbler applied the remedies. Within a few weeks, her face and voice were well again. Then the two were married and set out for the court at Colchester.
        - id: ch04-b07
          speaker: narrator
          text: When the queen learned that her daughter had married only a poor cobbler, she hanged herself in a fury. Her death pleased the king, who was glad to be rid of her so soon.
        - id: ch04-b08
          speaker: narrator
          text: He gave the cobbler a hundred pounds and ordered him to leave court with his wife. They went to a distant part of the kingdom, where he spent many years mending shoes while she spun his thread.
