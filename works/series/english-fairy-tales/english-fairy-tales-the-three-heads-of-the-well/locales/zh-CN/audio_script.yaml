audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容讲述古老童话，带着轻快而一本正经的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中
    princess:
      display_name: 公主
      tts:
        delivery: 温柔善良，言谈真诚有礼，面对命运时安静而勇敢
        timbre: 清澈柔和
        pace: 中等偏慢
        pitch: 中高
    old_man:
      display_name: 洞口老人
      tts:
        delivery: 苍老沉稳，待善者亲切，受冒犯时严厉
        timbre: 低沉粗粝
        pace: 缓慢
        pitch: 低
    first_head:
      display_name: 第一个金脑袋
      tts:
        delivery: 神秘庄重，说话清楚而有分量
        timbre: 明亮空灵
        pace: 舒缓
        pitch: 中高
    second_head:
      display_name: 第二个金脑袋
      tts:
        delivery: 神秘温和，语气轻盈如歌
        timbre: 清脆空灵
        pace: 舒缓
        pitch: 高
    third_head:
      display_name: 第三个金脑袋
      tts:
        delivery: 神秘自信，语气庄重而笃定
        timbre: 饱满空灵
        pace: 中等偏慢
        pitch: 中
    young_king:
      display_name: 年轻国王
      tts:
        delivery: 坦率热诚，举止高贵而不傲慢
        timbre: 明朗醇厚
        pace: 中等
        pitch: 中低
    stepsister:
      display_name: 驼背公主
      tts:
        delivery: 傲慢尖刻，只顾自己，得意或恼怒都毫不掩饰
        timbre: 尖细干涩
        pace: 偏快
        pitch: 高
    cobbler:
      display_name: 乡下鞋匠
      tts:
        delivery: 朴实厚道，说话直截了当
        timbre: 温厚粗朴
        pace: 中等偏慢
        pitch: 中低
  chapters:
    - id: ch01
      title: 离开科尔切斯特
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "早在亚瑟王和圆桌骑士出现以前，英格兰东部有位国王，宫廷设在科尔切斯特。王后去世时，只留下一个十五岁左右的女儿。公主不但美丽，还心地善良，认识她的人都十分喜爱她。"
        - id: ch01-b02
          speaker: narrator
          text: "后来，国王听说一位贵妇很富有，便想娶她。那贵妇年老貌丑，生着鹰钩鼻，还是个驼背。她的独生女儿脸色蜡黄，衣着邋遢，既善妒又刻薄，和母亲像是一个模子刻出来的。可没过几星期，国王还是在贵族乡绅的陪同下把她接进王宫，举行了婚礼。"
        - id: ch01-b03
          speaker: narrator
          text: "母女俩进宫不久，就用一句句谗言挑拨国王。国王渐渐不再疼爱自己的女儿。公主厌倦了宫里的日子，有一天在花园遇见父亲，便含着眼泪，请他准许自己离宫，到外面碰碰运气。国王答应了，又叫继母随意送她些东西。"
        - id: ch01-b04
          speaker: narrator
          text: "王后只给了她一个帆布袋，里面是黑面包和硬奶酪，另外还有一瓶淡啤酒。这份嫁妆配不上国王的女儿，公主却依然道了谢，带着它启程了。她走过一片片树丛、森林和山谷，最后来到一座洞穴前。一个老人正坐在洞口的石头上。"
        - id: ch01-b05
          speaker: old_man
          text: "早安，美丽的姑娘。你走得这样急，是要上哪儿去？"
        - id: ch01-b06
          speaker: princess
          text: "老伯伯，我想到外面去碰碰运气。"
        - id: ch01-b07
          speaker: old_man
          text: "那你的袋子和瓶子里，都带了些什么？"
        - id: ch01-b08
          speaker: princess
          text: "袋子里是面包和奶酪，瓶子里是味道不错的淡啤酒。您要不要也吃一点？"
        - id: ch01-b09
          speaker: old_man
          text: "当然想，我求之不得。"
    - id: ch02
      title: 井里的金脑袋
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "公主取出食物，请老人尽管享用。老人吃完，连声谢过她，又告诉她，前面有一道浓密的荆棘篱笆，根本钻不过去。"
        - id: ch02-b02
          speaker: old_man
          text: "拿着这根魔杖，在篱笆上敲三下，再求它让你过去，它马上就会打开。再走一小段，你会见到一口井。坐在井沿上，三个金脑袋会冒出来跟你说话。不论它们要你做什么，你都照办。"
        - id: ch02-b03
          speaker: narrator
          text: "公主答应了老人，向他告别。到了篱笆前，她拿起老人给的魔杖敲了三下，又开口请求篱笆让路。荆棘立刻朝两边分开，露出一条通道。她穿过去，又往前走了一小段，来到那口井边。她才刚刚坐下，第一个金脑袋便从井里冒出来，唱起歌来。"
        - id: ch02-b04
          speaker: first_head
          text: "替我洗一洗，替我梳一梳，再轻轻把我安放。放在岸边晒干爽，等到有人从旁经过，让他瞧见我漂亮模样。"
        - id: ch02-b05
          speaker: princess
          text: "好呀，我来替你梳洗。"
        - id: ch02-b06
          speaker: narrator
          text: "公主把金脑袋抱到膝上，用银梳细细梳理，再把它放在长满报春花的岸坡上。第二个和第三个脑袋也冒出井口，唱了同样的歌。公主一个个替它们洗好、梳好、安放好，才取出自己的食物吃午饭。"
        - id: ch02-b07
          speaker: first_head
          text: "这姑娘待我们这样亲切，我们该赐给她什么命运？"
        - id: ch02-b08
          speaker: first_head
          text: "我要赐她无与伦比的美貌，让世上最强大的王子也为她倾心。"
        - id: ch02-b09
          speaker: second_head
          text: "我要赐她甜美的歌喉，连夜莺也远远比不上。"
        - id: ch02-b10
          speaker: third_head
          text: "我的礼物也不会轻。她是国王的女儿，我就赐她绝佳的福运，让她嫁给世上最伟大的君王，成为王后。"
    - id: ch03
      title: 公主成为王后
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "公主把三个脑袋放回井里，继续赶路。没过多久，她看见一位国王正带着贵族们在园林里打猎。本想悄悄避开，可那国王已经瞧见了她，立刻来到她面前。公主美丽的容貌和甜美的声音叫他深深着迷。不久，他便打动公主，使她答应了婚事。"
        - id: ch03-b02
          speaker: narrator
          text: "年轻国王得知妻子是科尔切斯特国王的女儿，便吩咐人备好几辆马车，带她去拜访岳父。他们同乘的马车装饰着许多黄金和宝石，显得十分华美。公主的父亲见女儿有了这样的福分，起初惊讶得不敢相信。年轻国王把一路发生的事全说给他听，他才终于明白。"
        - id: ch03-b03
          speaker: narrator
          text: "宫里人人欢喜，只有王后和她那个跛脚女儿嫉妒得快要气炸了。宴饮和舞会接连举行了许多天。庆祝结束以后，年轻夫妇带着父王赠给公主的嫁妆，回自己的国家去了。"
    - id: ch04
      title: 另一场寻福之旅
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "驼背的公主眼看继姐出去碰碰运气，竟成了一国王后，也想照样出去寻找自己的福分。她把这个念头告诉母亲，王后马上替女儿准备好一切，给她带上华贵衣裳、大包的糖、杏仁和甜点，还有一大瓶马拉加甜酒。她沿着继姐走过的路出发，快到洞口时，又遇见了那个老人。"
        - id: ch04-b02
          speaker: old_man
          text: "年轻姑娘，你急匆匆的是要去哪儿？"
        - id: ch04-b03
          speaker: stepsister
          text: "这跟你有什么关系？"
        - id: ch04-b04
          speaker: old_man
          text: "那么，你的袋子和瓶子里装了什么？"
        - id: ch04-b05
          speaker: stepsister
          text: "都是好东西，反正不会拿来麻烦你。"
        - id: ch04-b06
          speaker: old_man
          text: "一点儿也不能分给我吗？"
        - id: ch04-b07
          speaker: stepsister
          text: "一点不给，一滴也不给。除非这些东西能噎死你。"
        - id: ch04-b08
          speaker: old_man
          text: "但愿厄运一路跟着你！"
          emotion: angry
        - id: ch04-b09
          speaker: narrator
          text: "老人皱紧眉头。姑娘却继续赶路，来到荆棘篱笆前。她看见一道缺口，便径直往里钻。不料篱笆突然合拢，尖刺扎进她的皮肉。她好不容易才挣脱出来，已经浑身是血，只想找水洗一洗。她四下一望，看见那口井，便坐在井沿上。"
        - id: ch04-b10
          speaker: first_head
          text: "替我洗一洗，替我梳一梳，再轻轻把我安放。"
        - id: ch04-b11
          speaker: narrator
          text: "姑娘举起酒瓶，狠狠砸了金脑袋一下。"
        - id: ch04-b12
          speaker: stepsister
          text: "拿去，这就是我给你洗的！"
        - id: ch04-b13
          speaker: narrator
          text: "第二个和第三个脑袋接着冒出来，也挨了她的打。三个脑袋便商量，要降下什么灾祸，惩罚她这样恶毒地对待它们。"
        - id: ch04-b14
          speaker: first_head
          text: "让麻风毁掉她的脸。"
        - id: ch04-b15
          speaker: second_head
          text: "让她的声音变得像秧鸡叫一样刺耳。"
        - id: ch04-b16
          speaker: third_head
          text: "让她只能嫁给一个穷乡下鞋匠。"
    - id: ch05
      title: 鞋匠的报偿
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "姑娘继续往前走，来到一座城镇，正赶上集市。人们看见她满脸烂疮，又听见那尖厉难听的嗓音，全都逃开了，只有一个穷乡下鞋匠留在那里。这个鞋匠不久前替一位老隐士补过鞋。隐士当时没有钱付账，就给了他一盒能治麻风的药膏，还有一瓶能治坏嗓子的药酒。"
        - id: ch05-b02
          speaker: narrator
          text: "鞋匠想做件善事，便走到姑娘跟前，问她是谁。"
        - id: ch05-b03
          speaker: stepsister
          text: "我是科尔切斯特国王的继女。"
        - id: ch05-b04
          speaker: cobbler
          text: "如果我能让你恢复原来的容貌，把你的脸和声音都治好，你愿不愿意嫁给我，算作报答？"
        - id: ch05-b05
          speaker: stepsister
          text: "愿意，朋友，我当然愿意！"
        - id: ch05-b06
          speaker: narrator
          text: "鞋匠给她用上那两样药。几个星期过去，她的脸和嗓子果然都好了。两人结成夫妻，一同前往科尔切斯特王宫。王后发现女儿嫁的只是一个穷鞋匠，竟气得上吊死了。国王倒十分高兴，庆幸这么快就摆脱了她。"
        - id: ch05-b07
          speaker: narrator
          text: "国王给了鞋匠一百英镑，叫他带妻子离开宫廷，到王国边远的地方生活。鞋匠在那里替人补了许多年鞋，妻子就在一旁替他纺线。"
