audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容讲述古老童话，带着一本正经的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中
    jack:
      display_name: 杰克
      tts:
        delivery: 机敏大胆，面对危险也带着俏皮的自信
        timbre: 清朗有力
        pace: 中等偏快
        pitch: 中高
    magistrate:
      display_name: 地方官
      tts:
        delivery: 郑重简洁，带着公事口吻
        timbre: 稳重清晰
        pace: 中等
        pitch: 中
    cormoran:
      display_name: 科莫兰
      tts:
        delivery: 凶暴骄横，咆哮般说话
        timbre: 粗厚轰鸣
        pace: 缓慢而有压迫感
        pitch: 低
    welsh_giant:
      display_name: 双头巨人
      tts:
        delivery: 表面客气，暗里阴狠，惊讶时显得笨拙
        timbre: 低沉浑厚
        pace: 中慢
        pitch: 低
    prince:
      display_name: 王子
      tts:
        delivery: 善良坦率，遇到难题时忧心却不失礼
        timbre: 温和明亮
        pace: 中等
        pitch: 中
    old_woman:
      display_name: 老妇人
      tts:
        delivery: 恳切直白，带着多年讨债的执着
        timbre: 苍老清楚
        pace: 中慢
        pitch: 中高
    three_headed_giant:
      display_name: 三头巨人
      tts:
        delivery: 自负夸张，受惊后慌乱急切
        timbre: 洪亮厚重
        pace: 中等
        pitch: 低
    enchanted_lady:
      display_name: 被施魔法的小姐
      tts:
        delivery: 冷淡强硬，出题时不容争辩
        timbre: 清冷平滑
        pace: 从容
        pitch: 中高
    captive:
      display_name: 囚徒
      tts:
        delivery: 虚弱悲苦，重获希望时急切
        timbre: 沙哑单薄
        pace: 中慢
        pitch: 中
    thunderdell:
      display_name: 雷霆德尔
      tts:
        delivery: 暴怒狂妄，威胁时声如雷鸣
        timbre: 粗砺震响
        pace: 缓慢沉重
        pitch: 极低
    old_man:
      display_name: 白发老人
      tts:
        delivery: 慈和庄重，讲述秘密时清楚而恳切
        timbre: 苍老温厚
        pace: 舒缓
        pitch: 中低
  chapters:
    - id: ch01
      title: 康沃尔的巨人
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "贤明的亚瑟王在位时，英格兰西端的康沃尔郡住着一个农夫。他只有一个儿子，名叫杰克。这个年轻人动作敏捷，心思又快，世上仿佛没有谁能胜过他，也没有什么难事能困住他。"
        - id: ch01-b02
          speaker: narrator
          text: "那时候，科莫兰巨人盘踞在康沃尔的圣迈克尔山。他足有十八英尺高，腰围约莫三码，长着一副凶狠阴沉的面孔，附近的人一听他的名字就害怕。科莫兰住在山洞里。肚子一饿，他便涉水来到大陆，见什么抢什么。人们远远看见他，立刻逃出家门。他却扛走牛羊猪猡，一次背六头牛也不费力。羊和猪更被他扎成一捆，围在腰间，活像一束牛油蜡烛。这样过了许多年，整个康沃尔都快绝望了。"
        - id: ch01-b03
          speaker: narrator
          text: "一天，地方官们在市政厅商议怎样除掉这个祸害，杰克正好也在场。"
        - id: ch01-b04
          speaker: jack
          text: "要是谁杀掉科莫兰，会得到什么奖赏？"
        - id: ch01-b05
          speaker: magistrate
          text: "巨人洞里的财宝，全归杀死他的人。"
        - id: ch01-b06
          speaker: jack
          text: "好，那这件事就交给我。"
        - id: ch01-b07
          speaker: narrator
          text: "一个黑沉沉的冬日傍晚，杰克带着号角、铁锹和鹤嘴锄来到山上。他挖了一整夜。天亮以前，一个二十二英尺深、差不多同样宽的大坑已经挖好。坑口架起长树枝，盖上稻草，再撒一层薄土，谁看都只当那里是平地。杰克站到坑的另一边，离巨人洞穴远远的。破晓时，他举起号角，使劲吹出一串嘹亮的声音。"
        - id: ch01-b08
          speaker: narrator
          text: "科莫兰从睡梦中惊醒，怒气冲冲地奔出洞来。"
        - id: ch01-b09
          speaker: cormoran
          text: "你这个不知悔改的恶棍，竟敢来搅我的好梦！你得付出代价。我要把你整个儿抓来，烤成我的早饭！"
          emotion: angry
        - id: ch01-b10
          speaker: narrator
          text: "他刚说完，就一脚踏空，掉进了大坑。那一下震得山根都摇了起来。"
        - id: ch01-b11
          speaker: jack
          text: "巨人，你跑到哪儿去啦？哈，你如今掉进傻瓜圈儿了！刚才还说要烤我当早饭，现在滋味怎么样？除了可怜的杰克，难道什么都不能让你填饱肚子？"
        - id: ch01-b12
          speaker: narrator
          text: "杰克又戏弄了他一会儿，才抡起鹤嘴锄，朝他的头顶狠狠砸下去。科莫兰当场死了。杰克把大坑填平，又走进巨人的洞穴仔细搜查，果然找到了许多财宝。地方官们得知喜讯，郑重宣布，从今往后，人人都该称他为巨人杀手杰克。他们还赠给杰克一把宝剑和一条腰带。腰带上用金线绣着两句话：且看康沃尔真豪杰，挥手斩杀科莫兰。"
        - id: ch01-b13
          speaker: narrator
          text: "胜利的消息很快传遍英格兰西部，也传到了布伦德博巨人耳中。布伦德博住在荒僻树林深处的一座魔法城堡里。他发誓，只要撞见杰克，非替科莫兰报仇不可。大约四个月以后，杰克去威尔士，恰好走过那片树林。他赶路赶得疲倦，就在一道清泉旁坐下，很快睡熟了。巨人前来取水，一眼看见杰克，又从腰带上那两句金字认出，这就是大名鼎鼎的巨人杀手。他二话不说，把杰克扛到肩上，朝自己的城堡走去。穿过灌木丛时，枝叶窸窣作响，把杰克惊醒了。他发现自己落在巨人手中，已经十分吃惊。等进了城堡，看见地上到处散着人骨，又听巨人说他的骨头很快也会混在里面，他才知道真正的可怕还在后头。"
        - id: ch01-b14
          speaker: narrator
          text: "布伦德博把杰克锁进一间大屋，自己去叫住在同一片树林里的巨人兄弟，准备两人一起享用这顿饭。过了一会儿，杰克从窗口望见两个巨人正走回来。他心想，眼下不是死期，就是逃生的机会。屋角正好有几根结实绳索。他拿起两根，各打一个活套。两个巨人才到铁门外，杰克便把绳套抛过他们的头，再将绳尾搭过屋梁，拼尽力气往下拉。等巨人的脸全憋黑了，他顺绳滑下，拔剑杀死了两个怪物。"
        - id: ch01-b15
          speaker: narrator
          text: "杰克拿着钥匙打开各间屋门，发现三个美丽的姑娘被人用头发绑在那里，几乎已经饿死。"
        - id: ch01-b16
          speaker: jack
          text: "善良的姑娘们，这个恶魔和他那野蛮的兄弟都死了。你们自由了。"
        - id: ch01-b17
          speaker: narrator
          text: "他把钥匙交给姑娘们，随后继续赶往威尔士。"
    - id: ch02
      title: 双头巨人的早饭
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "杰克一心赶路，不料走错了方向。天已经黑了，他仍找不到住处。后来，他走进一道狭窄的山谷，看见一座大宅子，便壮着胆子去敲门。开门的是个长着两颗脑袋的可怕巨人。这个威尔士巨人不像先前那些巨人那样暴躁，因为他更喜欢装出友善的样子，再在暗中害人。杰克说明自己的难处，巨人便领他进了一间卧房。到了半夜，杰克听见主人在另一间屋里嘟囔。"
        - id: ch02-b02
          speaker: welsh_giant
          text: "今夜虽让你投宿，明朝休想再见日出。看我一棒砸碎头骨！"
        - id: ch02-b03
          speaker: jack
          text: "原来你打的是这个主意。果然很像威尔士人的把戏。不过比心眼儿，你未必胜得过我。"
        - id: ch02-b04
          speaker: narrator
          text: "杰克下了床，把一截木柴摆进被窝，拿它代替自己，随后藏到屋角。夜最深的时候，威尔士巨人摸进屋来。他抡起大棒，朝床上接连猛砸几下，认定杰克从头到脚每一根骨头都已经断了。第二天早晨，杰克心里暗笑，脸上却不露声色，还郑重谢谢巨人留他过夜。"
        - id: ch02-b05
          speaker: welsh_giant
          text: "昨晚睡得怎么样？夜里没有感觉到什么吗？"
        - id: ch02-b06
          speaker: jack
          text: "什么事也没有。只有一只老鼠，用尾巴拍了我两三下。"
        - id: ch02-b07
          speaker: narrator
          text: "巨人惊讶极了，又端来四加仑面糊粥，请杰克吃早饭。杰克不愿让对方觉得自己吃不下，便在宽外衣底下藏了一只大皮袋，偷偷把粥全装了进去。然后，他说要表演一手绝活，拿刀割开皮袋。面糊粥一下全流出来了。"
        - id: ch02-b08
          speaker: welsh_giant
          text: "活见鬼！这一招俺自己也会！"
          emotion: surprised
        - id: ch02-b09
          speaker: narrator
          text: "巨人抢过刀，剖开自己的肚子，立刻倒地死了。"
    - id: ch03
      title: 王子与三头巨人
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "当时，亚瑟王唯一的儿子打算前往威尔士公国碰碰运气。那里住着一位美丽的小姐，身上附了七个恶灵。王子请求父亲给他一大笔钱，好去寻找自己的前程。国王竭力劝他别去，可王子心意已决，怎么也拦不住。国王最后只得让步。王子带着两匹马出发，一匹驮着那笔钱，另一匹供他自己骑乘。几天后，他来到威尔士的一座集镇，看见人群围得水泄不通。他打听以后才知道，有个人去世时欠了好几笔巨债，债主竟把尸体扣住，不许下葬。"
        - id: ch03-b02
          speaker: prince
          text: "债主这样对待死者，实在太残酷了。你们尽管去安葬他，再叫所有债主来我的住处。我替他把债还清。"
        - id: ch03-b03
          speaker: narrator
          text: "债主来得太多。到了晚上，王子口袋里只剩两便士。杰克也正好来到镇上。他钦佩王子如此慷慨，便请求做他的仆人，王子答应了。第二天，两人一起骑马出城，一个老妇人在后面追着呼喊。"
        - id: ch03-b04
          speaker: old_woman
          text: "死者还欠我两便士呢，整整七年都没还。求您也替他还给我吧。"
        - id: ch03-b05
          speaker: narrator
          text: "王子把最后两便士全给了她。两人买完当天的食物，又花光杰克仅有的一点小钱，从此身无分文。太阳渐渐落下，王子开始发愁。"
        - id: ch03-b06
          speaker: prince
          text: "杰克，我们一文钱也没有，今晚能住到哪儿去呢？"
        - id: ch03-b07
          speaker: jack
          text: "主人，您不必担心。我有个叔叔住在两英里以内。他是个三头巨人，一个人能打败五百名披甲武士，把他们全赶跑。"
        - id: ch03-b08
          speaker: prince
          text: "可我们去了怎么办？他准会一口把我们剁碎吞下去。我们两个人恐怕连他的一颗蛀牙都填不满！"
          emotion: fearful
        - id: ch03-b09
          speaker: jack
          text: "这没什么。我先去替您把路铺好。您留在这里，等我回来。"
        - id: ch03-b10
          speaker: narrator
          text: "杰克纵马来到城堡门前，使劲敲门，四周山岭都响起回声。里面传来雷鸣般的吼声。"
        - id: ch03-b11
          speaker: three_headed_giant
          text: "门外是谁？"
        - id: ch03-b12
          speaker: jack
          text: "只是您可怜的侄儿杰克。"
        - id: ch03-b13
          speaker: three_headed_giant
          text: "我可怜的杰克侄儿，你带来了什么消息？"
        - id: ch03-b14
          speaker: jack
          text: "亲爱的叔叔，是天大的坏消息，老天作证！"
        - id: ch03-b15
          speaker: three_headed_giant
          text: "快告诉我，什么坏消息能吓得住我？我长着三颗脑袋，还能把五百名披甲武士打得像风中的糠秕一样乱飞。你又不是不知道。"
        - id: ch03-b16
          speaker: jack
          text: "可国王的儿子带着一千名披甲武士赶来了！他们要杀您，还要把您的家业全毁掉！"
        - id: ch03-b17
          speaker: three_headed_giant
          text: "哎呀，杰克侄儿，这可真是天大的坏消息！我马上藏起来。你把门锁好，插上门闩，再架上门杠。钥匙由你拿着，等王子走了再放我出去。"
          emotion: fearful
        - id: ch03-b18
          speaker: narrator
          text: "杰克把叔叔关进地下室，再接王子来到城堡。两人在上面痛痛快快地吃喝取乐，三头巨人却躲在地下，怕得一直发抖。第二天一早，杰克给主人添足金银，请他先走三英里。等王子走得足够远，再也闻不到巨人的气味，杰克才回来开门。巨人问他，自己该怎样报答这份救命之恩。"
        - id: ch03-b19
          speaker: jack
          text: "我什么也不多要。把您床头的旧外套、旧帽子、锈剑和旧拖鞋送给我就行。"
        - id: ch03-b20
          speaker: three_headed_giant
          text: "你不知道自己要走了什么。这些是我最珍贵的宝物。外套能使人隐身，帽子能告诉你想知道的一切，宝剑碰上什么都能劈成两半，那双鞋跑起来更是快得出奇。不过你帮了我大忙，我情愿全都送给你。"
        - id: ch03-b21
          speaker: narrator
          text: "杰克谢过叔叔，带上四件宝物，很快便追上了主人。"
    - id: ch04
      title: 七个恶灵
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "杰克带着宝物离开三头巨人的城堡，很快追上主人。两人没过多久便来到那位小姐家。小姐知道王子是来求婚的，便为他摆下一桌华美的宴席。等到宴会结束，她拿出一条手帕，亲手替王子擦了擦嘴。"
        - id: ch04-b02
          speaker: enchanted_lady
          text: "明天早晨，把这条手帕拿给我看。拿不出来，你就要掉脑袋。"
        - id: ch04-b03
          speaker: narrator
          text: "小姐说完便把手帕收进怀里。王子满怀忧愁地上床睡了，杰克那顶无所不知的帽子却告诉杰克，该用什么办法取回手帕。到了半夜，小姐召来服侍她的精怪，让精怪载她前去见撒旦。杰克披上能叫人看不见的外套，又穿起速度非凡的鞋子，竟和她同时赶到。小姐走进老魔头的住处，把手帕交给老撒旦，撒旦随手将它放上架子。谁也看不见的杰克走过去取走手帕，赶回去交给主人。第二天，王子当面拿出手帕，就这样保住了性命。小姐当天吻了他一下，接着又出了第二道难题。"
        - id: ch04-b04
          speaker: enchanted_lady
          text: "明天早晨，我要看见昨夜最后被我亲吻的那一双嘴唇。否则，你还是要掉脑袋。"
        - id: ch04-b05
          speaker: prince
          text: "只要你除了我谁也不吻，我当然拿得出来。"
        - id: ch04-b06
          speaker: enchanted_lady
          text: "这话没有用。拿不出来，你就得死！"
        - id: ch04-b07
          speaker: narrator
          text: "午夜时分，小姐又去了撒旦那里，还责怪他没有守住手帕。"
        - id: ch04-b08
          speaker: enchanted_lady
          text: "这回国王的儿子别想赢我。我要亲吻你，再叫他把你的嘴唇拿给我看。"
        - id: ch04-b09
          speaker: narrator
          text: "她说完便吻了撒旦。等她不在旁边，杰克一剑砍下撒旦的脑袋，藏在隐身外套下面，送到主人那里。第二天早晨，王子抓住头上的双角，当着小姐的面把它提了出来。魔法破了，七个恶灵离开小姐，她恢复了原本的美貌。第二天，两人结为夫妻，不久便回到亚瑟王的宫廷。杰克立下了这些大功，也被封为圆桌骑士。"
    - id: ch05
      title: 雷霆德尔的末日
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "杰克很快又去寻找巨人。他骑马没走多远，便看见一个巨人坐在洞口的木头上，旁边放着带疙瘩的铁棒。那怪物的眼珠像火焰，脸孔阴森丑陋，两边面颊像大片腌肉。胡须根根硬似铁丝，垂到粗壮肩头的头发则像盘曲的蛇，又像嘶嘶作响的蝰蛇。杰克下了马，披起隐身外套，走到巨人近前。"
        - id: ch05-b02
          speaker: jack
          text: "哈，你果然在这儿。用不了多久，我就会抓牢你的胡子。"
        - id: ch05-b03
          speaker: narrator
          text: "巨人始终看不见他。杰克走到极近的地方，挥剑去砍巨人的头，却一剑砍偏，只削掉了鼻子。怪物发出雷鸣般的吼声，疯了似的挥舞铁棒，向四周乱打。杰克绕到背后，把宝剑直刺进去，直到剑柄顶住巨人的后背。巨人倒地死去。杰克砍下他的头，又把他兄弟的头一起交给雇来的车夫，送往亚瑟王的宫廷。"
        - id: ch05-b04
          speaker: narrator
          text: "随后，杰克决心进入洞穴，把巨人藏着的财宝找出来。他沿着洞里的通道一直往前走，路上拐过许多弯，才来到一间铺着方石的大屋。屋子尽头架着一口咕嘟翻滚的大锅，右边摆着一张巨大的餐桌，怪物平时就在这里用饭。杰克又走到一扇装有铁栏的窗口前，向里面望去，只见数量惊人的可怜人全被囚禁在那里。囚徒们也看见了他。"
        - id: ch05-b05
          speaker: captive
          text: "唉，年轻人，你也被抓来，要在这座苦牢里跟我们作伴吗？"
        - id: ch05-b06
          speaker: jack
          text: "算是吧。不过请你告诉我，你们为什么全被关在这里？"
        - id: ch05-b07
          speaker: captive
          text: "巨人们把我们养在这里。哪天想要大吃一顿，就挑最肥的人宰掉！他们不知道吃过多少被害的人了！"
        - id: ch05-b08
          speaker: jack
          text: "竟然有这样的事！"
        - id: ch05-b09
          speaker: narrator
          text: "杰克立刻打开牢门，把所有囚徒都放了出来。他们看见自由就在眼前，欢喜得就像一个等死的人忽然收到了赦免令。杰克接着搜查巨人的箱柜，找出金银，给每个人平均分了一份。随后，他领众人来到附近的一座城堡。大家摆起宴席，为终于逃出魔窟尽情欢乐。可他们正高兴时，一个信使赶来报信。双头巨人雷霆德尔听说亲族被杀，已经从北方山谷赶来报仇。此刻他离城堡不到一英里，沿路百姓都像风中的糠秕一样四散奔逃。"
        - id: ch05-b10
          speaker: jack
          text: "让他来！我这里有件家伙，正好替他剔牙。各位先生、各位女士，请到花园里去，亲眼看看雷霆德尔怎样送命。"
        - id: ch05-b11
          speaker: narrator
          text: "城堡位于一座小岛中央，四周的护城河深三十英尺、宽二十英尺，河上架着吊桥。杰克叫人从吊桥两侧往桥心锯，留下最后一点没有锯断。他披上隐身外套，提着无坚不摧的宝剑，走去迎敌。雷霆德尔看不见杰克，却闻出了他的气味。"
        - id: ch05-b12
          speaker: thunderdell
          text: "呋，咦，否，方！我闻见英格兰人的血香！不管他是活是亡，都要磨碎骨头做面包尝！"
        - id: ch05-b13
          speaker: jack
          text: "这么说来，你还真是个穷凶极恶的磨坊主。"
        - id: ch05-b14
          speaker: thunderdell
          text: "就是你这恶棍杀了我的亲族？我要用牙把你撕碎，吸干你的血，再把骨头磨成粉！"
          emotion: angry
        - id: ch05-b15
          speaker: jack
          text: "那也要先追得上我。"
        - id: ch05-b16
          speaker: narrator
          text: "杰克脱下隐身外套，让巨人看见自己，又穿上飞行快鞋转身就跑。雷霆德尔仿佛一座会走路的城堡，挥着大棒在后面猛追。他每踏一步，大地的根基都像在摇晃。杰克领着他绕了一个大圈，好让花园里的先生小姐们看清。最后，杰克轻快地跑过吊桥。巨人全速追到桥中央，巨大的体重压断桥面，他一头栽进水里，像鲸鱼一样翻滚扑腾。"
        - id: ch05-b17
          speaker: narrator
          text: "杰克站在河边，一直笑话他。雷霆德尔气得口吐白沫，在水里来回扑腾，却始终爬不上岸。杰克找来拉车的粗绳，套住他的两颗头，又用一队马把他拖出水面，最后挥动宝剑，砍下两颗脑袋，照样送给了亚瑟王。"
    - id: ch06
      title: 山顶的魔法城堡
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: "众人欢宴了一阵，杰克告别骑士和小姐们，再次踏上冒险之路。他穿过许多树林，来到一座高山脚下。深夜里，他发现一间孤零零的屋子，便上前敲门。开门的是个白发胜雪的老人。"
        - id: ch06-b02
          speaker: jack
          text: "老伯，我迷了路，也错过了宿头。您能留我住一夜吗？"
        - id: ch06-b03
          speaker: old_man
          text: "当然可以。我的寒舍欢迎你。"
        - id: ch06-b04
          speaker: narrator
          text: "杰克进屋坐下，老人看见了他的腰带。"
        - id: ch06-b05
          speaker: old_man
          text: "孩子，凭这条腰带，我知道你就是那位伟大的巨人征服者。山顶上有一座魔法城堡，由加利甘图亚巨人把守。他和一个老巫师合谋，把许多骑士和小姐骗进城堡，再用魔法将他们变成各种模样。最让我难过的是一位公爵的女儿。他们从她父亲的花园掳走了她，让喷火的巨龙拉着烈焰飞车，载她穿过天空。到了城堡，她又被变成一头白色母鹿。许多骑士都想破除魔法、救她出来，却没有一个办得到。城门前有两头可怕的狮鹫，任何人走近，都会被它们杀死。不过，你能不叫它们发现，从旁边走过去。大门上刻着醒目的字，会告诉你怎样解除魔咒。"
        - id: ch06-b06
          speaker: narrator
          text: "杰克握住老人的手，答应天一亮就冒着性命危险去救小姐。第二天早晨，他披上隐身外套，戴好魔法帽，穿起飞行快鞋，做好了战斗准备。他登上山顶，很快便看见两头喷火的狮鹫。它们无法看穿隐身外套，杰克毫不畏惧地从身旁走过。城堡门上挂着一把金号角，下面系着银链。号角下刻着一首短诗，说谁能将它吹响，谁便能打倒巨人，破除黑暗魔咒，让所有人重新得到幸福。"
        - id: ch06-b07
          speaker: narrator
          text: "杰克读完以后，立即吹响金号角。城堡连同庞大的根基都颤抖起来。巨人和巫师陷进可怕的慌乱，一个咬着自己的大拇指，一个拼命撕扯头发。他们心里都明白，长久以来作恶统治的日子终于到头了。巨人弯下身子，想拾起大棒还击。杰克没有给他机会，只挥一剑便砍掉他的脑袋。巫师见势不妙，飞上天空，立刻被一阵旋风卷走。黑暗魔法终于解除。那些长久以来被变成飞禽走兽的爵爷和小姐，一个接一个恢复了真正的模样。整座城堡则化成一大团烟雾，在所有人眼前消失得无影无踪。"
        - id: ch06-b08
          speaker: narrator
          text: "加利甘图亚的头也照从前的规矩，被人送到亚瑟王的宫廷。就在第二天，杰克带着所有获救的骑士和小姐们赶到那里。国王为奖赏他一次次立下的功劳，亲自说服公爵，把女儿嫁给诚实勇敢的杰克。他们举行了婚礼，整个王国都为这桩喜事欢欣鼓舞。国王还赐给杰克一座堂皇的城堡，以及附属于城堡的一片美丽庄园。从那以后，杰克和妻子便一直住在那里，一生都过得喜悦而幸福。"
