cover_prompt: |-
  A wordless cover scene in the English countryside of the late nineteenth century shows a quick-witted country boy climbing an immense green beanstalk above a thatched cottage and rolling patchwork fields. He wears a plain linen shirt, brown knee-breeches, sturdy shoes, and a small cloth cap, while a white hen watches from the cottage yard below. High among the leaves, a distant stone castle emerges from soft clouds as the boy reaches toward the next curling stem. The upward climb is the single focal action, with the cottage, hedgerows, and tiny winding road grounding the many wonders of the collection in rural England. Use a gently elevated wide view with strong vertical movement through the center and broad calm sky across the upper portion for title placement. Keep the boy adventurous rather than endangered, make the giant scale wondrous and child-friendly, and use entirely original clothing, architecture, and creature designs. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
