  chapters:
    - id: ch01
      title: The More the Merrier
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, there was a boy named Jack. One morning, he set out to seek his fortune. He had not gone far when he met a cat.
        - id: ch01-b02
          speaker: cat
          text: Where are you off to, Jack?
        - id: ch01-b03
          speaker: jack
          text: I'm going to seek my fortune.
        - id: ch01-b04
          speaker: cat
          text: Could I come along?
        - id: ch01-b05
          speaker: jack
          text: Of course. The more the merrier.
        - id: ch01-b06
          speaker: narrator
          text: So they went on together, jiggelty-jolt, jiggelty-jolt. A little farther along, they met a dog.
        - id: ch01-b07
          speaker: dog
          text: Where are you headed, Jack?
        - id: ch01-b08
          speaker: jack
          text: I'm off to seek my fortune.
        - id: ch01-b09
          speaker: dog
          text: May I join you?
        - id: ch01-b10
          speaker: jack
          text: Yes. The more the merrier.
        - id: ch01-b11
          speaker: narrator
          text: On they went, jiggelty-jolt, jiggelty-jolt, until they came upon a goat.
        - id: ch01-b12
          speaker: goat
          text: Where are you going, Jack?
        - id: ch01-b13
          speaker: jack
          text: I'm going to seek my fortune.
        - id: ch01-b14
          speaker: goat
          text: Can I go with you?
        - id: ch01-b15
          speaker: jack
          text: Yes, come along. The more the merrier.
        - id: ch01-b16
          speaker: narrator
          text: And on they went, jiggelty-jolt, jiggelty-jolt. Soon they met a bull.
        - id: ch01-b17
          speaker: bull
          text: Where are you bound for, Jack?
        - id: ch01-b18
          speaker: jack
          text: I'm seeking my fortune.
        - id: ch01-b19
          speaker: bull
          text: May I come too?
        - id: ch01-b20
          speaker: jack
          text: Yes. The more the merrier.
        - id: ch01-b21
          speaker: narrator
          text: So they traveled on, jiggelty-jolt, jiggelty-jolt. A little way farther, they met a rooster.
        - id: ch01-b22
          speaker: rooster
          text: Where are you going, Jack?
        - id: ch01-b23
          speaker: jack
          text: I'm going to seek my fortune.
        - id: ch01-b24
          speaker: rooster
          text: Will you let me come with you?
        - id: ch01-b25
          speaker: jack
          text: Yes, indeed. The more the merrier.
        - id: ch01-b26
          speaker: narrator
          text: And away they all went, jiggelty-jolt, jiggelty-jolt.

    - id: ch02
      title: The House at Nightfall
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: They kept going until it was nearly dark. Then they began looking for somewhere to spend the night. Before long, they saw a house. Jack told the others to be quiet while he went up and peered through a window.
        - id: ch02-b02
          speaker: narrator
          text: Inside, a band of robbers was counting its money. Jack slipped back to his companions. He told them to wait for his signal, and then make every bit of noise they could.
        - id: ch02-b03
          speaker: narrator
          text: When everyone was ready, Jack gave the word. The cat mewed, the dog barked, the goat bleated, the bull bellowed, and the rooster crowed.
        - id: ch02-b04
          speaker: narrator
          text: Together, they made such a dreadful noise that the robbers were terrified and ran away. Then Jack and his companions went inside and took possession of the house.

    - id: ch03
      title: Ready for the Robbers
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Jack feared the robbers might return during the night. So when it was time for bed, he placed each companion where they could wait for them.
        - id: ch03-b02
          speaker: narrator
          text: He put the cat in the rocking chair and the dog beneath the table. The goat went upstairs, and the bull went down into the cellar. The rooster flew onto the roof. Then Jack went to bed.
        - id: ch03-b03
          speaker: narrator
          text: After a while, the robbers saw that the house was dark. They sent one man back to see what had happened to their money.
        - id: ch03-b04
          speaker: narrator
          text: He did not stay long. Soon he came racing back, frightened out of his wits, and told the others what had happened.

    - id: ch04
      title: The Robber's Tale
      blocks:
        - id: ch04-b01
          speaker: robber
          text: I went into the house and tried to sit in the rocking chair. But an old woman was sitting there knitting, and she jabbed me with her knitting needles!
          emotion: fearful
        - id: ch04-b02
          speaker: narrator
          text: That was the cat, of course.
        - id: ch04-b03
          speaker: robber
          text: Then I went over to the table to look for the money. A shoemaker was hiding underneath it, and he stabbed me with his awl!
          emotion: fearful
        - id: ch04-b04
          speaker: narrator
          text: That was the dog.
        - id: ch04-b05
          speaker: robber
          text: I tried to go upstairs, but a man up there was threshing. He struck me down with his flail!
          emotion: fearful
        - id: ch04-b06
          speaker: narrator
          text: That was the goat.
        - id: ch04-b07
          speaker: robber
          text: So I started down to the cellar. There was a man chopping wood below, and he knocked me back up with his axe!
          emotion: fearful
        - id: ch04-b08
          speaker: narrator
          text: That was the bull.
        - id: ch04-b09
          speaker: robber
          text: I could have stood all that, if it hadn't been for the little fellow on the roof. He kept shouting, “Chuck him up to me-e! Chuck him up to me-e!”
          emotion: fearful
        - id: ch04-b10
          speaker: narrator
          text: And that, of course, was the rooster's cock-a-doodle-doo.
