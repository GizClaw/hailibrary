audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容讲述古老童话，诙谐中渐渐透出紧张
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中
    jack:
      display_name: 杰克
      tts:
        delivery: 开朗勇敢，说话爽快利落
        timbre: 清亮的少年声
        pace: 中等
        pitch: 中高
    cat:
      display_name: 猫
      tts:
        delivery: 从容机灵，提出条件时干脆直接
        timbre: 轻柔清亮
        pace: 中等
        pitch: 中高
    dog:
      display_name: 狗
      tts:
        delivery: 热情直率，声音有活力
        timbre: 明亮结实
        pace: 中等偏快
        pitch: 中
    goat:
      display_name: 山羊
      tts:
        delivery: 友善爽朗，问话干脆
        timbre: 略带沙哑
        pace: 中等
        pitch: 中高
    bull:
      display_name: 公牛
      tts:
        delivery: 沉稳厚重，话语简短
        timbre: 浑厚低沉
        pace: 舒缓
        pitch: 低
    rooster:
      display_name: 公鸡
      tts:
        delivery: 神气响亮，语气明快
        timbre: 高亢清脆
        pace: 中等偏快
        pitch: 高
    robber:
      display_name: 强盗
      tts:
        delivery: 惊魂未定，越说越慌张
        timbre: 粗哑紧绷
        pace: 偏快
        pitch: 中低
  chapters:
    - id: ch01
      title: 伙伴越多越快活
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "从前有个男孩叫杰克。一天早晨，他出了门，要去寻找自己的幸福。才走出没多远，一只猫迎面走来。"
        - id: ch01-b02
          speaker: cat
          text: "杰克，你这是要去哪儿？"
        - id: ch01-b03
          speaker: jack
          text: "我要去找属于我的幸福。"
        - id: ch01-b04
          speaker: cat
          text: "那我能跟你一起走吗？"
        - id: ch01-b05
          speaker: jack
          text: "来吧，伙伴越多越快活。"
        - id: ch01-b06
          speaker: narrator
          text: "于是他俩接着走，颠呀颠，晃呀晃。没过多久，他们又碰见一条狗。"
        - id: ch01-b07
          speaker: dog
          text: "杰克，你们往哪儿走？"
        - id: ch01-b08
          speaker: jack
          text: "我出门寻找自己的幸福。"
        - id: ch01-b09
          speaker: dog
          text: "带上我一起去，行不行？"
        - id: ch01-b10
          speaker: jack
          text: "当然行，伙伴越多越快活。"
        - id: ch01-b11
          speaker: narrator
          text: "他们便一道赶路，颠呀颠，晃呀晃。又走了一程，一只山羊出现在路上。"
        - id: ch01-b12
          speaker: goat
          text: "杰克，你打算上哪儿去？"
        - id: ch01-b13
          speaker: jack
          text: "我要去寻找自己的幸福。"
        - id: ch01-b14
          speaker: goat
          text: "我也跟你们去，可以吗？"
        - id: ch01-b15
          speaker: jack
          text: "可以呀，伙伴越多越快活。"
        - id: ch01-b16
          speaker: narrator
          text: "一行伙伴继续向前，颠呀颠，晃呀晃。"
    - id: ch02
      title: 队伍越来越长
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "再往前走一小段，他们遇见了一头公牛。"
        - id: ch02-b02
          speaker: bull
          text: "杰克，你要去什么地方？"
        - id: ch02-b03
          speaker: jack
          text: "我要去找自己的幸福。"
        - id: ch02-b04
          speaker: bull
          text: "我能不能跟你一起去？"
        - id: ch02-b05
          speaker: jack
          text: "能啊，伙伴越多越快活。"
        - id: ch02-b06
          speaker: narrator
          text: "大家又上了路，颠呀颠，晃呀晃。走着走着，他们碰见了一只公鸡。"
        - id: ch02-b07
          speaker: rooster
          text: "杰克，你们要去哪儿呀？"
        - id: ch02-b08
          speaker: jack
          text: "我要去寻找属于我的幸福。"
        - id: ch02-b09
          speaker: rooster
          text: "让我也加入你们吧？"
        - id: ch02-b10
          speaker: jack
          text: "好啊，伙伴越多越快活。"
        - id: ch02-b11
          speaker: narrator
          text: "于是，他们又颠呀颠，晃呀晃地向前走去。"
    - id: ch03
      title: 吓跑强盗
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "他们一直走到天快黑了，才想到得找个地方过夜。正巧，前面有一幢房子。杰克让大家安静等着，自己走到窗边往里看。屋里坐着一伙强盗，正在数钱。"
        - id: ch03-b02
          speaker: narrator
          text: "杰克回来告诉伙伴们，听到他的号令，就一起放开嗓门，叫得越响越好。大家全都准备好了。杰克一声令下，猫喵喵叫起来，狗汪汪吠起来，山羊咩咩叫，公牛哞哞大吼，公鸡也扯开嗓子喔喔啼鸣。几种声音一齐响起，简直吓死人。强盗们听了，统统逃出了房子，一个也没敢留下。"
        - id: ch03-b03
          speaker: narrator
          text: "杰克带着伙伴们走进屋里，把房子占了下来。他怕强盗半夜返回，睡觉前特意安排好守卫。猫坐在摇椅里，狗守在桌子底下，山羊待在楼上，公牛进了地窖，公鸡飞上屋顶。杰克这才上床睡觉。"
    - id: ch04
      title: 屋里的可怕人物
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "过了一会儿，强盗们看见屋里黑漆漆的，就派一个同伴回去看看留在屋里的钱。那人进屋没多久，便吓得逃了回来，慌慌张张讲起自己的遭遇。"
        - id: ch04-b02
          speaker: robber
          text: "我回到屋里，刚想坐进摇椅，椅子上那个织毛线的老太婆就用织针狠狠扎了我！"
          emotion: fearful
        - id: ch04-b03
          speaker: narrator
          text: "他认错了。摇椅里坐着的是猫。"
        - id: ch04-b04
          speaker: robber
          text: "我又去桌边找钱，桌下的鞋匠突然拿锥子戳我！"
          emotion: fearful
        - id: ch04-b05
          speaker: narrator
          text: "那位所谓的鞋匠，其实是狗。"
        - id: ch04-b06
          speaker: robber
          text: "我正准备上楼，上面那个打谷的人抡起连枷，一下就把我打倒了！"
          emotion: fearful
        - id: ch04-b07
          speaker: narrator
          text: "可楼上只有山羊。"
        - id: ch04-b08
          speaker: robber
          text: "我转身要下地窖，里面还有个人在劈柴。他挥起斧头，一下把我顶了上来！"
          emotion: fearful
        - id: ch04-b09
          speaker: narrator
          text: "地窖里的当然是公牛。"
        - id: ch04-b10
          speaker: robber
          text: "这些我都还能忍。可屋顶上那个小个子一直喊：‘把他扔上来给我——！把他扔上来给我——！’这才最吓人！"
          emotion: fearful
        - id: ch04-b11
          speaker: narrator
          text: "不用说，屋顶上哪有什么小个子。那不过是公鸡在喔喔啼。"
