audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容讲述古老童话，带着一本正经的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中
    jack:
      display_name: 杰克
      tts:
        delivery: 机灵大胆，遇事反应快，说话直爽
        timbre: 清亮的少年嗓音
        pace: 明快
        pitch: 中高
    mother:
      display_name: 杰克的母亲
      tts:
        delivery: 劳苦而直率，焦急或生气时语气强烈
        timbre: 略显疲惫的成年女声
        pace: 中等
        pitch: 中
    old_man:
      display_name: 古怪老头
      tts:
        delivery: 神秘从容，话里带着试探和逗趣
        timbre: 干涩而温和的老年男声
        pace: 偏慢
        pitch: 中低
    ogre_wife:
      display_name: 食人魔的妻子
      tts:
        delivery: 说话爽利，警告时严肃，圆谎时镇定机敏
        timbre: 浑厚的成年女声
        pace: 中等
        pitch: 中低
    ogre:
      display_name: 食人魔
      tts:
        delivery: 粗暴威严，嗅到猎物时凶狠多疑
        timbre: 低沉洪亮
        pace: 沉重
        pitch: 低
    golden_harp:
      display_name: 金竖琴
      tts:
        delivery: 清脆响亮，呼喊主人时急切
        timbre: 空灵明亮
        pace: 中等
        pitch: 高
  chapters:
    - id: ch01
      title: 一头牛换几颗豆子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "从前，有个穷寡妇，和独生子杰克相依为命。家里还有一头母牛，名字叫乳白。每天早晨，乳白产下牛奶，母子俩拿到集市上卖，日子就全靠这点收入。谁知有一天，乳白再也挤不出奶来。他们一下没了生计。"
        - id: ch01-b02
          speaker: mother
          text: "这下怎么办？我们可怎么办呀？"
        - id: ch01-b03
          speaker: narrator
          text: "母亲急得直搓手。杰克却想自己出去找活干。"
        - id: ch01-b04
          speaker: jack
          text: "妈妈，别发愁。我到外面找份工，总能挣到钱。"
        - id: ch01-b05
          speaker: mother
          text: "我们早试过了，根本没人肯雇你。只能把乳白卖掉，用那笔钱另想出路。也许能开一间小铺子。"
        - id: ch01-b06
          speaker: jack
          text: "好，今天正好赶集。我这就牵乳白去卖。等拿到钱，我们再决定做什么。"
        - id: ch01-b07
          speaker: narrator
          text: "杰克牵着牛刚走出不远，就碰上一个模样古怪的老头。老头竟然认得他。"
        - id: ch01-b08
          speaker: old_man
          text: "早安，杰克。"
        - id: ch01-b09
          speaker: jack
          text: "您早。"
        - id: ch01-b10
          speaker: narrator
          text: "杰克心里直犯嘀咕，这人怎么会知道我的名字？"
        - id: ch01-b11
          speaker: old_man
          text: "杰克，你牵着牛要到哪儿去？"
        - id: ch01-b12
          speaker: jack
          text: "我要去集市，把我家的牛卖了。"
        - id: ch01-b13
          speaker: old_man
          text: "看得出来，你准是个卖牛的好手。那我考考你，五颗豆子要怎么放？"
        - id: ch01-b14
          speaker: jack
          text: "两只手各拿两颗，嘴里再含一颗。"
        - id: ch01-b15
          speaker: narrator
          text: "杰克答得又快又准。老头马上从口袋里摸出几颗从没见过的怪豆子。"
        - id: ch01-b16
          speaker: old_man
          text: "答对了，就是这几颗。你这么聪明，我就跟你做笔交易。你把牛给我，我把豆子给你。"
        - id: ch01-b17
          speaker: jack
          text: "少来这一套！您倒挺会占便宜。"
        - id: ch01-b18
          speaker: old_man
          text: "你还不知道它们的本事。夜里把豆子种下，第二天早上，它们已经长到天上去了。要是没有，你尽管把牛领回来。"
        - id: ch01-b19
          speaker: jack
          text: "真有这种事？那好，换了！"
        - id: ch01-b20
          speaker: narrator
          text: "杰克把乳白的缰绳递给老头，又把那些古怪的豆子仔细收进口袋。他本来就没有走出多远，转身回家以后，来到门前时天色仍然明亮。母亲看见儿子这么快回来，身边又没有乳白，便以为他已经把牛卖掉，还卖了个好价钱。"
        - id: ch01-b21
          speaker: mother
          text: "这么快就回来了？乳白卖掉了吧？收了多少钱？"
        - id: ch01-b22
          speaker: jack
          text: "妈妈，您绝对猜不出来。"
        - id: ch01-b23
          speaker: mother
          text: "难道卖得这么好？五镑？十镑？十五镑？总不会是二十镑吧！"
        - id: ch01-b24
          speaker: jack
          text: "我就说您猜不着。瞧，是这些豆子！它们有魔法，今晚种下去就能——"
        - id: ch01-b25
          speaker: mother
          text: "什么？你这个大傻瓜！乳白是全教区最会产奶的牛，养肥以后，肉也值不少钱。你居然拿它换了几颗破豆子！叫你胡来！叫你胡来！叫你胡来！豆子也别想留下，全给我滚到窗外去。现在立刻上床。今晚不许喝水，也不许吃东西！"
          emotion: angry
        - id: ch01-b26
          speaker: narrator
          text: "杰克回到阁楼的小房间，又伤心又后悔。他不只惦记没吃上的晚饭，更难过的是让母亲受了苦。最后，他还是睡着了。"
    - id: ch02
      title: 云端的房子
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "早晨醒来，杰克觉得房里怪极了。阳光只照亮了房间的一角，其余地方却全被浓浓的暗影遮住。他赶紧跳下床，穿好衣服，跑到窗前一看，顿时呆住。昨晚母亲扔进花园的豆子，已经长成一株粗壮无比的豆茎。它向上长了又长，一直钻进天空。古怪老头没有骗人。"
        - id: ch02-b02
          speaker: narrator
          text: "豆茎紧挨窗口，像一架枝条编成的巨大梯子。杰克只要推开窗户，轻轻一跃，就能攀住它。他向上爬呀爬，不知爬了多久，终于到了天上。那里有一条又长又宽的大路，直得像一支射出去的箭。杰克顺着它走了又走，最后来到一幢高大得惊人的房子前。门阶上，站着一个同样高大的女人。"
        - id: ch02-b03
          speaker: jack
          text: "早安，太太。您能给我一点早饭吃吗？"
        - id: ch02-b04
          speaker: narrator
          text: "杰克从昨天早晨起就没有吃过东西，早已饿得前胸贴后背。"
        - id: ch02-b05
          speaker: ogre_wife
          text: "你还想吃早饭？再不走，你就要成为早饭了！我男人是食人魔，最喜欢把男孩子烤在面包片上吃。快走吧，他就要回来了。"
        - id: ch02-b06
          speaker: jack
          text: "求求您，给我一点吃的吧。我真的从昨天早上一直饿到现在。反正都快饿死了，让他烤来吃又有什么分别？"
        - id: ch02-b07
          speaker: narrator
          text: "食人魔的妻子其实不算坏。她把杰克带进厨房，给了他一大块面包和奶酪，还有一壶牛奶。杰克还没吃完一半，屋外忽然响起沉重的脚步。咚！咚！咚！整幢房子都跟着发颤。"
        - id: ch02-b08
          speaker: ogre_wife
          text: "老天，是我男人回来了！快，钻进烤炉里！"
          emotion: fearful
        - id: ch02-b09
          speaker: narrator
          text: "她刚把杰克塞进烤炉，食人魔便踏进屋来。他大得吓人，腰带上还倒挂着三头小牛。食人魔把小牛解下，往桌上一扔。"
        - id: ch02-b10
          speaker: ogre
          text: "老婆，给我烤两头当早饭。咦，这是什么气味？呋——咿——呋——嗬——呣，我闻见英国人的血腥味。不管他是活人还是死尸，我要拿他的骨头磨面吃。"
        - id: ch02-b11
          speaker: ogre_wife
          text: "别胡说了，亲爱的，你准是在做梦。也许是昨天晚饭那个小男孩剩下的味道，你不是吃得很香吗？先去洗洗脸，收拾一下。等你回来，早饭正好上桌。"
        - id: ch02-b12
          speaker: narrator
          text: "食人魔走开后，杰克正要逃出烤炉，女人却让他别动。"
        - id: ch02-b13
          speaker: ogre_wife
          text: "再等等。他吃过早饭总要睡上一觉，那时你再跑。"
        - id: ch02-b14
          speaker: narrator
          text: "食人魔吃饱以后，走到一只大箱子旁，从里面取出两袋沉甸甸的金币。他坐在那里，一枚接一枚地数。数着数着，脑袋便一点一点垂下去。很快，震耳的鼾声又摇动了整幢房子。杰克这才踮着脚爬出烤炉。经过食人魔身边时，他悄悄抱起一袋金币，夹在胳膊下面，撒腿逃走。"
        - id: ch02-b15
          speaker: narrator
          text: "到了豆茎边，杰克先把钱袋扔下云端。它穿过天空，一直落进母亲的花园。杰克随后抓紧豆茎，一段接一段地往下爬，终于回到地面。他跑去把一路的经历讲给母亲听，又打开钱袋，让她亲眼看看里面的金币。"
        - id: ch02-b16
          speaker: jack
          text: "妈妈，现在您相信了吧？那些豆子确实有魔法。"
    - id: ch03
      title: 金蛋母鸡
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "母子俩靠着那袋金币生活了很久，可钱总有花完的一天。杰克决定再到豆茎顶上试一次。一个晴朗的清晨，他早早起身，顺着豆茎一直爬上天空，又沿长路来到那幢巨大的房子前。高大的女人果然还站在门口。"
        - id: ch03-b02
          speaker: jack
          text: "早安，太太。能不能再给我一点东西吃？"
        - id: ch03-b03
          speaker: ogre_wife
          text: "快走，孩子！我男人会拿你当早饭。等等，你是不是以前来过？就在你出现的那天，他少了一袋金币。"
        - id: ch03-b04
          speaker: jack
          text: "这就怪了。我或许知道一点内情。可我饿得连话都说不动，得先吃点东西才行。"
        - id: ch03-b05
          speaker: narrator
          text: "女人越想知道金币的下落，好奇心终于压过了戒心。她又把杰克领进屋，拿来食物给他。杰克为了拖延时间，每一口都故意嚼得很慢。可是他才刚开始吃，咚、咚、咚的脚步声已经传来。那声音一下比一下近，正是食人魔回来了。女人赶紧把杰克藏进烤炉。"
        - id: ch03-b06
          speaker: narrator
          text: "一切都和上次一样。食人魔进门念起那首可怕的歌谣，又吃掉三头烤牛。吃完以后，他朝妻子伸出手。"
        - id: ch03-b07
          speaker: ogre
          text: "老婆，把会下金蛋的母鸡拿来。"
        - id: ch03-b08
          speaker: narrator
          text: "妻子抱来母鸡，放到食人魔面前。"
        - id: ch03-b09
          speaker: ogre
          text: "下蛋！"
        - id: ch03-b10
          speaker: narrator
          text: "母鸡立刻生下一枚纯金的蛋。过了一会儿，食人魔又低下脑袋，呼呼睡熟。杰克轻手轻脚地溜出烤炉，抓起母鸡，转身便跑。可母鸡突然咯咯大叫，惊醒了食人魔。杰克刚逃出门口，就听见身后传来怒吼。"
        - id: ch03-b11
          speaker: ogre
          text: "老婆！我的金母鸡呢？你把它弄到哪里去了？"
          emotion: angry
        - id: ch03-b12
          speaker: ogre_wife
          text: "怎么啦，亲爱的？"
        - id: ch03-b13
          speaker: narrator
          text: "后面的话，杰克一句也没听见。他抱紧不断挣动的母鸡，冲到豆茎旁，立刻抓住枝条往下爬。他下得那么快，简直像身上着了火。等双脚终于踩回自家的花园，他马上把这只神奇的母鸡抱到母亲面前，要让她看看母鸡究竟有什么本事。"
        - id: ch03-b14
          speaker: jack
          text: "下蛋！"
        - id: ch03-b15
          speaker: narrator
          text: "母鸡果然生出一枚金蛋。从此，只要杰克发出这道命令，它就会再下一枚。"
    - id: ch04
      title: 会说话的金竖琴
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "有了金蛋，杰克仍不满足。不久以后，他又挑了一个晴朗的早晨，早早爬上豆茎。可这回，他没有直接去敲食人魔的门。快到房子时，杰克躲在灌木后，等高大的女人提着水桶离开，才偷偷进屋，藏进一口煮锅。"
        - id: ch04-b02
          speaker: narrator
          text: "不一会儿，熟悉的咚咚声再次响起。食人魔和妻子回来了。"
        - id: ch04-b03
          speaker: ogre
          text: "呋——咿——呋——嗬——呣，我闻见英国人的血腥味！老婆，他就在这里，我闻得一清二楚！"
        - id: ch04-b04
          speaker: ogre_wife
          text: "是吗，亲爱的？要是偷走金币和金母鸡的那个小坏蛋又来了，他一定还会躲进烤炉。"
        - id: ch04-b05
          speaker: narrator
          text: "两人一齐冲向烤炉，里面当然空空如也。杰克正安安静静地藏在煮锅里。"
        - id: ch04-b06
          speaker: ogre_wife
          text: "瞧，你又闻错了。昨晚抓来的那个小子已经让我烤成了你的早饭。怪我差点忘了，也怪你连活人的气味和死人的气味都分不清。"
        - id: ch04-b07
          speaker: narrator
          text: "食人魔坐下吃早饭，却还是不放心。他吃上几口，就低声念叨自己明明没有闻错。过一会儿，他又放下食物站起身，把食品储藏室、一个个柜橱，还有屋里能找的地方全都翻遍了。躲在锅里的杰克只能一声不响。幸好，食人魔始终没有想起那口煮锅。"
        - id: ch04-b08
          speaker: ogre
          text: "老婆，把我的金竖琴拿来！"
        - id: ch04-b09
          speaker: narrator
          text: "妻子将金竖琴放到桌上。"
        - id: ch04-b10
          speaker: ogre
          text: "唱吧！"
        - id: ch04-b11
          speaker: narrator
          text: "竖琴奏出美妙极了的歌声，一直唱到食人魔睡着。他的鼾声像雷一样滚过屋子。杰克慢慢顶开锅盖，落地时没有发出一点声音。他像小老鼠那样伏低身子，手脚并用地爬到桌边，突然站起，抱住金竖琴就冲向门外。"
        - id: ch04-b12
          speaker: golden_harp
          text: "主人！主人！"
          emotion: fearful
        - id: ch04-b13
          speaker: narrator
          text: "竖琴的喊声惊醒了食人魔。他睁眼便看见杰克抱着自己的宝物逃跑，立刻追了出去。杰克先跑了一段，又认得道路，还能左右躲闪，这才没有马上被抓住。可等他跑到豆茎旁，食人魔已经追到二十码以内。"
        - id: ch04-b14
          speaker: narrator
          text: "杰克到了路的尽头，转眼便消失了。食人魔追到那里，探头往下一看，原来那孩子已经攀在豆茎上，正为了活命拼命往下爬。食人魔看着这架悬在空中的细长梯子，一时不敢把自己的庞大身子压上去，只能站在上面犹豫。杰克趁着这点工夫，又往下逃了一大截。"
        - id: ch04-b15
          speaker: golden_harp
          text: "主人！主人！"
          emotion: fearful
        - id: ch04-b16
          speaker: narrator
          text: "这一声催得食人魔攀上了豆茎。豆茎被他压得来回摇晃。杰克在前面不停往下爬，食人魔紧追不舍。眼看地面越来越近，杰克朝家里放声大喊。"
        - id: ch04-b17
          speaker: jack
          text: "妈妈！快拿斧子来！把斧子给我！"
        - id: ch04-b18
          speaker: narrator
          text: "母亲提着斧子冲出家门。可她来到豆茎下面，抬头看见食人魔正从云层下方爬来，顿时吓得一动也不能动。"
        - id: ch04-b19
          speaker: narrator
          text: "杰克跳到地上，接过斧子，对准豆茎猛砍。第一斧下去，豆茎断了一半。上面的食人魔感到脚下又晃又颤，停住身子查看。杰克紧接着砍下第二斧。豆茎彻底断开，摇摇晃晃地倒了下去。食人魔也从高空坠落，摔破了脑袋。"
        - id: ch04-b20
          speaker: narrator
          text: "杰克把金竖琴拿给母亲看。后来，他们靠展示这件会唱歌的宝物，又不断卖掉母鸡生下的金蛋，成了非常富有的人。杰克还娶了一位了不起的公主，从此永远过着幸福的生活。"
