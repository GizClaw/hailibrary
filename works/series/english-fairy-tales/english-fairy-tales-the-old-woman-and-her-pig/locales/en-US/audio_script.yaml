audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and unhurried, with the steady rhythm of an old fireside tale
        timbre: clear and gently weathered
        pace: measured
        pitch: medium
    old_woman:
      display_name: Old Woman
      tts:
        delivery: practical and persistent, with a firm country manner
        timbre: mature and gently weathered
        pace: medium
        pitch: medium
    cat:
      display_name: Cat
      tts:
        delivery: cool and matter-of-fact, with a self-satisfied air
        timbre: smooth and light
        pace: measured
        pitch: medium-high
    cow:
      display_name: Cow
      tts:
        delivery: slow, plainspoken, and unhurried
        timbre: broad and mellow
        pace: slow
        pitch: low
  chapters:
    - id: ch01
      title: The Crooked Sixpence
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: An old woman was sweeping her house one day when she found a little crooked sixpence.
        - id: ch01-b02
          speaker: old_woman
          text: Now, what shall I do with this little sixpence? I know. I'll go to market and buy a little pig.
        - id: ch01-b03
          speaker: narrator
          text: So that was what she did. But on the way home, she came to a stile, and the little pig would not go over it.

    - id: ch02
      title: No One Would Help
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The old woman went a little farther and met a dog.
        - id: ch02-b02
          speaker: old_woman
          text: Dog, bite the pig! The pig won't cross the stile, and I won't get home tonight.
        - id: ch02-b03
          speaker: narrator
          text: But the dog would not do it. So she went on until she met a stick.
        - id: ch02-b04
          speaker: old_woman
          text: Stick, beat the dog! The dog won't bite the pig, the pig won't cross the stile, and I won't get home tonight.
        - id: ch02-b05
          speaker: narrator
          text: But the stick would not do it. A little farther on, she met a fire.
        - id: ch02-b06
          speaker: old_woman
          text: Fire, burn the stick! The stick won't beat the dog, the dog won't bite the pig, the pig won't cross the stile, and I won't get home tonight.
        - id: ch02-b07
          speaker: narrator
          text: But the fire would not do it. The old woman went on and met some water.
        - id: ch02-b08
          speaker: old_woman
          text: Water, put out the fire! The fire won't burn the stick, the stick won't beat the dog, the dog won't bite the pig, the pig won't cross the stile, and I won't get home tonight.
        - id: ch02-b09
          speaker: narrator
          text: But the water would not do it.

    - id: ch03
      title: The Chain Grows Longer
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: She walked a little farther and met an ox.
        - id: ch03-b02
          speaker: old_woman
          text: Ox, drink the water! The water won't put out the fire, the fire won't burn the stick, the stick won't beat the dog, the dog won't bite the pig, the pig won't cross the stile, and I won't get home tonight.
        - id: ch03-b03
          speaker: narrator
          text: But the ox would not do it. Farther along, she met a butcher.
        - id: ch03-b04
          speaker: old_woman
          text: Butcher, kill the ox! The ox won't drink the water, the water won't put out the fire, the fire won't burn the stick, the stick won't beat the dog, the dog won't bite the pig, the pig won't cross the stile, and I won't get home tonight.
        - id: ch03-b05
          speaker: narrator
          text: But the butcher would not do it. Then the old woman met a rope.
        - id: ch03-b06
          speaker: old_woman
          text: Rope, hang the butcher! The butcher won't kill the ox, the ox won't drink the water, the water won't put out the fire, the fire won't burn the stick, the stick won't beat the dog, the dog won't bite the pig, the pig won't cross the stile, and I won't get home tonight.
        - id: ch03-b07
          speaker: narrator
          text: But the rope would not do it. She went a little farther and met a rat.
        - id: ch03-b08
          speaker: old_woman
          text: Rat, gnaw through the rope! The rope won't hang the butcher, the butcher won't kill the ox, the ox won't drink the water, the water won't put out the fire, the fire won't burn the stick, the stick won't beat the dog, the dog won't bite the pig, the pig won't cross the stile, and I won't get home tonight.
        - id: ch03-b09
          speaker: narrator
          text: But the rat would not do it.

    - id: ch04
      title: Milk for the Cat
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The old woman went on once more, and this time she met a cat.
        - id: ch04-b02
          speaker: old_woman
          text: Cat, kill the rat! The rat won't gnaw through the rope, the rope won't hang the butcher, the butcher won't kill the ox, the ox won't drink the water, the water won't put out the fire, the fire won't burn the stick, the stick won't beat the dog, the dog won't bite the pig, the pig won't cross the stile, and I won't get home tonight.
        - id: ch04-b03
          speaker: cat
          text: Go to that cow and bring me a saucer of milk. Then I'll kill the rat.
        - id: ch04-b04
          speaker: narrator
          text: Off the old woman went to the cow.
        - id: ch04-b05
          speaker: cow
          text: Go to that haystack and bring me a handful of hay. Then I'll give you the milk.
        - id: ch04-b06
          speaker: narrator
          text: So the old woman hurried to the haystack, took a handful of hay, and brought it back to the cow. As soon as the cow had eaten, she gave the old woman some milk. The old woman carried it away in a saucer and took it to the cat.

    - id: ch05
      title: Home That Night
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: As soon as the cat had lapped up the milk, everything began to happen. The cat began to kill the rat. The rat began to gnaw through the rope. The rope began to hang the butcher. The butcher began to kill the ox. The ox began to drink the water. The water began to put out the fire. The fire began to burn the stick. The stick began to beat the dog. And the dog began to bite the pig.
        - id: ch05-b02
          speaker: narrator
          text: The little pig was so frightened that it jumped over the stile. And so the old woman got home that night.
