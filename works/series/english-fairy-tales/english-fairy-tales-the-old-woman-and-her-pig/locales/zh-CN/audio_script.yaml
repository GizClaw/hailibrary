audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容讲述古老童话，诙谐中渐渐透出紧张
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中
    old_woman:
      display_name: 老妇人
      tts:
        delivery: 朴实爽利，反复请求时越来越急切
        timbre: 略显苍老的女声
        pace: 中等偏快
        pitch: 中高
    cat:
      display_name: 猫
      tts:
        delivery: 从容机灵，提出条件时干脆直接
        timbre: 轻柔清亮
        pace: 中等
        pitch: 中高
    cow:
      display_name: 奶牛
      tts:
        delivery: 沉稳实在，不紧不慢
        timbre: 浑厚温和的女声
        pace: 舒缓
        pitch: 中低
  chapters:
    - id: ch01
      title: 不肯跨过栅栏的小猪
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "有一位老妇人，打扫屋子时捡到一枚弯弯的小六便士硬币。"
        - id: ch01-b02
          speaker: old_woman
          text: "这枚小小的六便士，拿来做什么好呢？有了，我上市场买一头小猪吧。"
        - id: ch01-b03
          speaker: narrator
          text: "老妇人买了小猪，带着它回家。走到一道栅栏前，小猪却停住了，怎么也不肯跨过去。她只好继续往前走。没走多远，她遇见一条狗。"
        - id: ch01-b04
          speaker: old_woman
          text: "狗啊，快去咬小猪！小猪不肯跨过栅栏，害得我今晚回不了家。"
        - id: ch01-b05
          speaker: narrator
          text: "可狗偏不肯。老妇人再往前走了一小段，又遇见一根棍子。"
        - id: ch01-b06
          speaker: old_woman
          text: "棍子啊，快去打狗！狗不肯咬小猪，小猪又不过栅栏，我今晚可怎么回家？"
        - id: ch01-b07
          speaker: narrator
          text: "棍子也不肯。老妇人接着往前走，这回遇见了一团火。"
        - id: ch01-b08
          speaker: old_woman
          text: "火啊，快把棍子烧起来！棍子不肯打狗，狗不肯咬小猪，小猪不肯过栅栏，我今晚就到不了家了。"
        - id: ch01-b09
          speaker: narrator
          text: "可是火不肯烧。老妇人又向前走了一小段，遇见了一些水。"
        - id: ch01-b10
          speaker: old_woman
          text: "水啊，快去把火浇灭！火不肯烧棍子，棍子不肯打狗，狗不肯咬小猪，小猪又不过栅栏。这样下去，我今晚还怎么回家？"
        - id: ch01-b11
          speaker: narrator
          text: "水也不肯。"
    - id: ch02
      title: 谁也不肯帮忙
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "老妇人再走了一小段，碰见一头牛。"
        - id: ch02-b02
          speaker: old_woman
          text: "牛啊，快去喝水！水不肯灭火，火不肯烧棍子，棍子不肯打狗，狗不肯咬小猪，小猪也不跨栅栏，我今晚就回不了家啦。"
        - id: ch02-b03
          speaker: narrator
          text: "牛还是不肯。老妇人继续向前，遇见一个屠夫。"
        - id: ch02-b04
          speaker: old_woman
          text: "屠夫啊，快把牛杀掉！牛不肯喝水，水不肯灭火，火不肯烧棍子，棍子不肯打狗，狗不肯咬小猪，小猪又不跨栅栏，我今晚哪还回得了家？"
        - id: ch02-b05
          speaker: narrator
          text: "屠夫也不肯。老妇人只得再走一小段。前面有一根绳子。"
        - id: ch02-b06
          speaker: old_woman
          text: "绳子啊，快去吊死屠夫！屠夫不肯杀牛，牛不肯喝水，水不肯灭火，火不肯烧棍子，棍子不肯打狗，狗不肯咬小猪，小猪就是不过栅栏。今晚我可回不了家了。"
        - id: ch02-b07
          speaker: narrator
          text: "绳子偏偏也不肯。老妇人又往前走，遇见一只老鼠。"
        - id: ch02-b08
          speaker: old_woman
          text: "老鼠啊，快把绳子咬断！绳子不肯吊屠夫，屠夫不肯杀牛，牛不肯喝水，水不肯灭火，火不肯烧棍子，棍子不肯打狗，狗不肯咬小猪，小猪也不过栅栏。我今晚真要回不了家啦。"
        - id: ch02-b09
          speaker: narrator
          text: "可老鼠也不肯。"
    - id: ch03
      title: 猫想喝牛奶
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "老妇人再往前走了一小段，终于遇见一只猫。"
        - id: ch03-b02
          speaker: old_woman
          text: "猫啊，快去咬死老鼠！老鼠不肯咬绳子，绳子不肯吊屠夫，屠夫不肯杀牛，牛不肯喝水，水不肯灭火，火不肯烧棍子，棍子不肯打狗，狗不肯咬小猪，小猪就是不跨栅栏。我今晚还怎么回家呢？"
        - id: ch03-b03
          speaker: cat
          text: "你到那边的奶牛那里，给我取一碟牛奶来。我喝到牛奶，就去咬死老鼠。"
        - id: ch03-b04
          speaker: narrator
          text: "老妇人马上去找奶牛。"
        - id: ch03-b05
          speaker: cow
          text: "你去那边的干草垛，给我拿一把干草来。我吃到干草，就把牛奶给你。"
        - id: ch03-b06
          speaker: narrator
          text: "老妇人又赶到干草垛，抓了一把干草，带回来给奶牛。"
    - id: ch04
      title: 老妇人回家了
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "奶牛吃完干草，立刻给了老妇人牛奶。老妇人用碟子盛着牛奶，马上送到猫跟前。"
        - id: ch04-b02
          speaker: narrator
          text: "猫舔完牛奶，便去咬死老鼠。老鼠动手咬绳子，绳子动手吊屠夫，屠夫动手杀牛，牛动手喝水，水动手浇灭火，火动手烧棍子，棍子动手打狗，狗动手咬小猪。"
        - id: ch04-b03
          speaker: narrator
          text: "小猪吓得猛地一跳，越过了栅栏。就这样，老妇人那天晚上终于回到了家。"
