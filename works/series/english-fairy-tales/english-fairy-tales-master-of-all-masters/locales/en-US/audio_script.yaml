audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and unhurried, with the steady rhythm of an old fireside tale
        timbre: clear and gently weathered
        pace: measured
        pitch: medium
    servant:
      display_name: The Servant Girl
      tts:
        delivery: polite and practical, becoming breathless with alarm
        timbre: young and clear
        pace: measured
        pitch: medium-high
    old_gentleman:
      display_name: The Old Gentleman
      tts:
        delivery: fussy and self-important, with firm attention to his peculiar names
        timbre: dry and reedy
        pace: measured
        pitch: medium
  chapters:
    - id: ch01
      title: A Peculiar Master
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once, a girl went to the fair to find work as a servant. At last, a funny-looking old gentleman hired her and took her home. When they arrived, he told her she had something to learn. In his house, he used his own names for things.
        - id: ch01-b02
          speaker: old_gentleman
          text: Now then, what are you going to call me?
        - id: ch01-b03
          speaker: servant
          text: Master, or mister, or anything you please, sir.
        - id: ch01-b04
          speaker: old_gentleman
          text: You are to call me “master of all masters.” Now, what would you call this?
        - id: ch01-b05
          speaker: narrator
          text: He pointed to his bed.
        - id: ch01-b06
          speaker: servant
          text: A bed, or a couch, or anything you please, sir.
        - id: ch01-b07
          speaker: old_gentleman
          text: No. That is my “barnacle.” And what do you call these?
        - id: ch01-b08
          speaker: narrator
          text: This time, he pointed to his pantaloons.
        - id: ch01-b09
          speaker: servant
          text: Breeches, or trousers, or anything you please, sir.
        - id: ch01-b10
          speaker: old_gentleman
          text: You must call them “squibs and crackers.”

    - id: ch02
      title: His Names for Everything
      blocks:
        - id: ch02-b01
          speaker: old_gentleman
          text: And what would you call her?
        - id: ch02-b02
          speaker: narrator
          text: He pointed to the cat.
        - id: ch02-b03
          speaker: servant
          text: A cat, or a kitten, or anything you please, sir.
        - id: ch02-b04
          speaker: old_gentleman
          text: You must call her “white-faced simminy.” Now, what would you call this?
        - id: ch02-b05
          speaker: narrator
          text: He showed her the fire.
        - id: ch02-b06
          speaker: servant
          text: Fire, or flame, or anything you please, sir.
        - id: ch02-b07
          speaker: old_gentleman
          text: You must call it “hot cockalorum.” And what is this?
        - id: ch02-b08
          speaker: narrator
          text: He pointed to the water.
        - id: ch02-b09
          speaker: servant
          text: Water, or something wet, or anything you please, sir.
        - id: ch02-b10
          speaker: old_gentleman
          text: No. Its name is “pondalorum.” And what do you call all of this?
        - id: ch02-b11
          speaker: narrator
          text: He pointed to the house around them.
        - id: ch02-b12
          speaker: servant
          text: A house, or a cottage, or anything you please, sir.
        - id: ch02-b13
          speaker: old_gentleman
          text: You must call it “high topper mountain.”

    - id: ch03
      title: Hot Cockalorum
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: That very night, the servant woke her master in a fright.
        - id: ch03-b02
          speaker: servant
          text: Master of all masters, get out of your barnacle and put on your squibs and crackers! White-faced simminy has a spark of hot cockalorum on her tail. If you do not fetch some pondalorum, high topper mountain will be all on hot cockalorum!
          emotion: fearful
        - id: ch03-b03
          speaker: narrator
          text: And that is all.
