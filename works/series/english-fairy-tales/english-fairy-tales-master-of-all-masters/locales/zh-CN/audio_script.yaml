audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容讲述古老童话，带着轻快而一本正经的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中
    girl:
      display_name: 姑娘
      tts:
        delivery: 善良质朴，受委屈时柔弱，作出决定时勇敢坚定
        timbre: 清澈柔和
        pace: 中等
        pitch: 中高
    old_gentleman:
      display_name: 老先生
      tts:
        delivery: 一本正经又古怪，对自己定下的规矩十分得意
        timbre: 苍老而略带鼻音
        pace: 中等偏慢
        pitch: 中低
  chapters:
    - id: ch01
      title: 古怪人家的规矩
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "从前，有个姑娘到集市上找活儿，想给人家做女佣。她找了好一阵，最后，一位模样滑稽的老先生雇了她，把她带回家。"
        - id: ch01-b02
          speaker: narrator
          text: "姑娘刚到，老先生就说，自己有件事要教她。在这所房子里，各样东西都得用他亲自起的名字，姑娘非学会不可。"
        - id: ch01-b03
          speaker: old_gentleman
          text: "你准备怎么称呼我？"
        - id: ch01-b04
          speaker: girl
          text: "主人也行，老爷也行。先生，您爱听哪个，我就叫哪个。"
        - id: ch01-b05
          speaker: old_gentleman
          text: "都不对。你得叫我‘万主之主’。再看看我指着的这张床，你会叫它什么？"
        - id: ch01-b06
          speaker: girl
          text: "先生，床也行，卧榻也行。您喜欢哪个名字，我就用哪个。"
        - id: ch01-b07
          speaker: old_gentleman
          text: "不成。那是我的‘摇篮船’。再看我身上这两条裤子，你叫它们什么？"
        - id: ch01-b08
          speaker: girl
          text: "马裤也行，长裤也行。先生想怎么叫都行。"
        - id: ch01-b09
          speaker: old_gentleman
          text: "你得叫它们‘噼啪双响炮’。现在瞧瞧那只猫，你又会叫她什么？"
    - id: ch02
      title: 样样都有怪名字
      blocks:
        - id: ch02-b01
          speaker: girl
          text: "猫也行，咪咪也行。还是照先生喜欢的叫。"
        - id: ch02-b02
          speaker: old_gentleman
          text: "她叫‘白脸咪娜娜’。再看炉子里的火，你管这个叫什么？"
        - id: ch02-b03
          speaker: girl
          text: "火也行，火焰也行。您觉得什么顺耳，就叫什么。"
        - id: ch02-b04
          speaker: old_gentleman
          text: "它叫‘火辣轰隆隆’。接着看我指的水，这个又叫什么？"
        - id: ch02-b05
          speaker: girl
          text: "水也行，湿水也行。您想给它什么名字都成。"
        - id: ch02-b06
          speaker: old_gentleman
          text: "错了。它的名字是‘池水晃荡荡’。最后看看周围，这整座房子该叫什么？"
        - id: ch02-b07
          speaker: girl
          text: "房子也行，村舍也行。先生说了算。"
        - id: ch02-b08
          speaker: old_gentleman
          text: "记住了，它叫‘高顶大山冈’。"
    - id: ch03
      title: 当夜的一场火
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "当天夜里，姑娘忽然惊醒。她慌忙跑去叫醒老先生，把白天学会的所有怪名字一口气全用上了。"
        - id: ch03-b02
          speaker: girl
          text: "万主之主，快离开您的摇篮船，穿上噼啪双响炮！白脸咪娜娜的尾巴沾了一星火辣轰隆隆。您再不拿池水晃荡荡来，整座高顶大山冈都要变成火辣轰隆隆啦！"
          emotion: fearful
        - id: ch03-b03
          speaker: narrator
          text: "故事到这里，就讲完了。"
