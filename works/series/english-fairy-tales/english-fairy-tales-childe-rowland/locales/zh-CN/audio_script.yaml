audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容讲述古老童话，带着一本正经的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中
    childe_rowland:
      display_name: 小骑士罗兰
      tts:
        delivery: 年轻勇敢，态度坚定，危急时果断有力
        timbre: 清朗坚实
        pace: 中等
        pitch: 中高
    burd_ellen:
      display_name: 艾伦姑娘
      tts:
        delivery: 温柔端庄，忧虑时低沉克制
        timbre: 柔和清澈
        pace: 中慢
        pitch: 中高
    warlock_merlin:
      display_name: 术士梅林
      tts:
        delivery: 古老睿智，告诫时郑重严肃
        timbre: 苍老低沉
        pace: 缓慢
        pitch: 低
    eldest_brother:
      display_name: 大哥
      tts:
        delivery: 勇敢急切，说话直截了当
        timbre: 年轻有力
        pace: 中等
        pitch: 中
    horse_herd:
      display_name: 牧马人
      tts:
        delivery: 冷淡简短，语气疏离
        timbre: 粗哑
        pace: 中等
        pitch: 中低
    cow_herd:
      display_name: 牧牛人
      tts:
        delivery: 平淡敷衍，不愿多说
        timbre: 浑厚
        pace: 中等
        pitch: 低
    hen_wife:
      display_name: 养鸡婆
      tts:
        delivery: 苍老神秘，指路时缓慢清楚
        timbre: 干涩沙哑
        pace: 缓慢
        pitch: 中低
    king_of_elfland:
      display_name: 仙灵王
      tts:
        delivery: 威猛凶狠，落败后屈服求生
        timbre: 洪亮厚重
        pace: 中等偏慢
        pitch: 低
  chapters:
    - id: ch01
      title: 艾伦姑娘失踪了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "小骑士罗兰和两个哥哥正在玩皮球，妹妹艾伦姑娘也和他们玩在一起。罗兰抬脚一踢，又用膝盖一顶，最后猛地冲进众人中间，竟把球踢过了教堂屋顶。"
        - id: ch01-b02
          speaker: narrator
          text: "艾伦姑娘绕过教堂侧廊，独自去找皮球。哥哥们等了又等，妹妹始终没有回来。他们往东找，往西找，到处寻找，却怎么也找不到她，个个伤心极了。"
        - id: ch01-b03
          speaker: narrator
          text: "最后，大哥去见术士梅林，把事情从头到尾讲了一遍，问他知不知道艾伦姑娘在哪里。"
        - id: ch01-b04
          speaker: warlock_merlin
          text: "美丽的艾伦姑娘准是被仙灵掳走了。她绕教堂走了逆日方向，也就是和太阳相反的方向。如今她被关在仙灵王的黑塔里。想救她回来，非得是全基督教世界最勇敢的骑士不可。"
        - id: ch01-b05
          speaker: eldest_brother
          text: "只要妹妹还有可能回来，我就去救她。哪怕为此送命，我也要试一试。"
        - id: ch01-b06
          speaker: warlock_merlin
          text: "救她并非不可能。可是，无论谁去，要是没有事先学会该做什么，必定会大难临头。"
        - id: ch01-b07
          speaker: narrator
          text: "大哥不肯被危险吓退。他求梅林教自己一路上该做什么，又不能做什么。学完训诫，再背给梅林听过，他便出发去了仙灵国。"
        - id: ch01-b08
          speaker: narrator
          text: "家里人等了很久，又等了更久。等得越久，心里的疑虑和痛苦就越深。可是大哥再也没有回来，弟弟们伤心不已。"
        - id: ch01-b09
          speaker: narrator
          text: "二哥等得又厌烦又难受，也去问术士梅林同样的事，随后出发寻找艾伦姑娘。家里人又等了很久很久，满怀疑虑，受尽煎熬。二哥也没有回来，母亲和罗兰更加悲伤。"
        - id: ch01-b10
          speaker: narrator
          text: "家里人等了又等，过了很久很久。最后，小骑士罗兰也想去救人。他求母亲让自己出发，可善良的王后一开始怎么也不肯。如今留在她身边的孩子只剩罗兰，要是他也失踪，一切就全完了。"
        - id: ch01-b11
          speaker: narrator
          text: "罗兰求了又求，王后终于答应了。她把罗兰父亲那把百击百中的宝剑交给他，亲手系在他的腰间，又念动咒语，让宝剑能够克敌制胜。"
    - id: ch02
      title: 梅林的两条训诫
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "罗兰向母亲告别，来到术士梅林的洞穴。"
        - id: ch02-b02
          speaker: childe_rowland
          text: "再告诉我一次，只要最后一次。一个母亲生下的儿子，到底怎样才能救出艾伦姑娘和她的两个哥哥？"
        - id: ch02-b03
          speaker: warlock_merlin
          text: "我的孩子，你只需记住两件事。听起来容易，做起来却很难。一件必须做，一件绝不能做。"
        - id: ch02-b04
          speaker: warlock_merlin
          text: "踏进仙灵国以后，在见到艾伦姑娘以前，无论谁对你开口，你都要拔出父亲的宝剑，砍下那人的头。这就是你必须做的事。"
        - id: ch02-b05
          speaker: warlock_merlin
          text: "绝不能做的事，是吃下一口东西，或喝下一滴水。无论多饿多渴，也要忍住。只要在仙灵国里吃一口、喝一滴，你就再也回不到人间了。"
        - id: ch02-b06
          speaker: narrator
          text: "罗兰一遍又一遍地背诵两条训诫，直到牢牢记住。他谢过梅林，继续上路。走啊走，走啊走，又走了很远，他看见仙灵王的牧马人正在放牧马群。那些马双眼冒火，罗兰立刻明白，自己已经来到仙灵国。"
        - id: ch02-b07
          speaker: childe_rowland
          text: "请告诉我，仙灵王的黑塔在哪里？"
        - id: ch02-b08
          speaker: horse_herd
          text: "我不能告诉你。再往前走一段，你会遇到牧牛人，也许他知道。"
        - id: ch02-b09
          speaker: narrator
          text: "罗兰没有再说一句话。他拔出父亲那把百击百中的宝剑，一剑砍下牧马人的头。随后，他继续往前走，直到遇见牧牛人，又问了同样的问题。"
        - id: ch02-b10
          speaker: cow_herd
          text: "我也不能告诉你。继续往前走，你会遇见养鸡婆，她一定知道。"
        - id: ch02-b11
          speaker: narrator
          text: "罗兰又拔出那把从不失手的宝剑，一剑砍下牧牛人的头。他再往前走了一段，遇见一个披着灰斗篷的老妇人，便问她知不知道仙灵王的黑塔在哪里。"
        - id: ch02-b12
          speaker: hen_wife
          text: "继续往前，你会看见一座浑圆的绿丘。从山脚到山顶，全是一圈圈台地。你要绕着它逆日走三圈。每走一圈，都说：开门啊，门！快开门！放我进去吧。第三遍说完，门就会打开，你便可以进去。"
        - id: ch02-b13
          speaker: narrator
          text: "罗兰正要离开，忽然想起梅林的训诫。他拔出那把百击百中的宝剑，一剑砍下了养鸡婆的头。"
    - id: ch03
      title: 黑塔里的奇景
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "罗兰继续走啊走，终于来到那座浑圆的绿丘。层层台地从山顶一直环绕到山脚。他逆日绕了三圈，每一圈都念同样的话。"
        - id: ch03-b02
          speaker: childe_rowland
          text: "开门啊，门！快开门！放我进去吧。"
        - id: ch03-b03
          speaker: narrator
          text: "第三遍刚念完，门果然开了。罗兰走进去，门就在身后咔嗒一声关上，把他留在黑暗之中。"
        - id: ch03-b04
          speaker: narrator
          text: "那里并非一片漆黑，更像黄昏时的朦胧暮色。四下没有窗，也没有蜡烛，微光仿佛从墙壁和穹顶里透出来。透明岩石砌成粗犷的拱顶，上面结着云母、岩晶和其他闪亮的石头。岩洞里的空气却很温暖，仙灵国向来如此。"
        - id: ch03-b05
          speaker: narrator
          text: "罗兰沿着这条温暖的岩石通道一直前行，最后来到两扇又高又宽、半开着的对开门前。他把门推开，里面的景象瑰丽得惊人。大厅宽阔无比，仿佛和整座绿丘一样长、一样宽。支撑屋顶的巨柱又高又大，连大教堂的石柱也不能相比。"
        - id: ch03-b06
          speaker: narrator
          text: "那些柱子全由金银铸成，上面镂着繁复的花纹。柱间和柱身四周缠满花环。可你猜那些花朵是什么做的？竟是钻石、绿宝石和各色珍宝。连拱顶的拱心石，也装饰着一簇簇钻石、红宝石、珍珠，还有许多别的宝石。"
        - id: ch03-b07
          speaker: narrator
          text: "所有拱肋都在屋顶中央相会。就在交会的地方，一条金链垂下来，吊着一盏硕大无朋的灯。整盏灯是用一颗挖空的透明大珍珠制成的。灯心里，一颗巨大的红玉不停旋转。正是它射出的光芒照遍大厅，让四周看起来就像落日余晖洒满了墙壁。"
        - id: ch03-b08
          speaker: narrator
          text: "大厅里的陈设同样华美。尽头摆着一张用天鹅绒、丝绸和黄金做成的卧榻。艾伦姑娘坐在那里，正用银梳梳理金发。她看见小骑士罗兰，立刻站了起来。"
        - id: ch03-b09
          speaker: burd_ellen
          text: "愿上帝怜悯你，这个不幸的傻孩子。你来这里做什么？"
          emotion: sad
        - id: ch03-b10
          speaker: burd_ellen
          text: "我最小的弟弟啊，你为什么不留在家里？就算你有十万条性命，也经不起白白断送。"
          emotion: sad
        - id: ch03-b11
          speaker: burd_ellen
          text: "可是，你还是坐下吧。苦啊，真苦啊，我恨你曾经降生人间。只要仙灵王走进大厅，你的命运就再也无法挽回了。"
          emotion: sad
    - id: ch04
      title: 金盆里的面包和牛奶
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "姐弟俩一起坐下。罗兰把一路上做过的事告诉姐姐。艾伦姑娘也告诉他，两个哥哥都曾到过黑塔，却被仙灵王施了魔法。如今他们被封在坟墓里，躺着一动不动，仿佛已经死去。"
        - id: ch04-b02
          speaker: narrator
          text: "两人又谈了一会儿。罗兰赶了那么远的路，渐渐饿得难受。他告诉姐姐自己有多饿，还向她讨些食物，竟把梅林的警告忘得一干二净。"
        - id: ch04-b03
          speaker: narrator
          text: "艾伦姑娘悲伤地望着弟弟，轻轻摇头。可是她中了魔法，没法开口警告他。她只能起身离开，不久便端回一只金盆，里面装满面包和牛奶。"
        - id: ch04-b04
          speaker: narrator
          text: "罗兰正要把盛着面包和牛奶的金盆举到嘴边，忽然抬眼看见姐姐。这一眼让他想起，自己一路走了那么远，闯进黑塔，究竟是为了什么。他猛地把金盆摔在地上。"
        - id: ch04-b05
          speaker: childe_rowland
          text: "艾伦姑娘一天没有重获自由，我就一口不喝，一口不吃！"
        - id: ch04-b06
          speaker: narrator
          text: "就在这时，他们听见有人走近。一个洪亮的声音从外面传来。"
        - id: ch04-b07
          speaker: king_of_elfland
          text: "呸，咳，嗅，哼！我闻见了基督徒鲜血的气味。无论他是死是活，我都要挥起宝剑，把他的脑浆从头盖骨里砸飞！"
          emotion: angry
        - id: ch04-b08
          speaker: narrator
          text: "大厅的对开门被猛地撞开，仙灵王冲了进来。"
    - id: ch05
      title: 永别了，黑塔
      blocks:
        - id: ch05-b01
          speaker: childe_rowland
          text: "妖怪，有胆量就来砍我！"
          emotion: angry
        - id: ch05-b02
          speaker: narrator
          text: "罗兰高声迎战，举起那把从不失手的宝剑，迎面向仙灵王冲去。他们打了又打，打了又打。最后，罗兰把仙灵王击倒在地，逼得他跪在面前。仙灵王只好认输，开口求饶。"
        - id: ch05-b03
          speaker: childe_rowland
          text: "我可以饶你。先解开我妹妹身上的魔法，再让我的两个哥哥死而复生，放我们所有人自由离开。你做到这些，我便留你一命。"
        - id: ch05-b04
          speaker: king_of_elfland
          text: "我答应你的条件。"
        - id: ch05-b05
          speaker: narrator
          text: "仙灵王从地上站起来，走到一只箱子前。他打开箱子，从里面拿出一个小瓶，瓶中装着血红色的药液。仙灵王用药液涂抹两个哥哥的耳朵、眼皮、鼻孔、嘴唇和每根手指的指尖。两人立刻一跃而起，重新活了过来。他们说，自己的灵魂方才去了远方，现在终于回来了。"
        - id: ch05-b06
          speaker: narrator
          text: "接着，仙灵王对艾伦姑娘念了几句话，她身上的魔法也解除了。兄妹四人一起离开大厅，穿过长长的通道。他们背对黑塔而去，从此再也没有回来。"
        - id: ch05-b07
          speaker: narrator
          text: "兄妹四人终于都平安回到家，回到母亲，那位善良的王后身边。从那以后，艾伦姑娘再也没有绕着教堂逆日而行。"
