  chapters:
    - id: ch01
      title: Burd Ellen Vanishes
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Childe Rowland and his two brothers were playing ball, with their sister Burd Ellen in the middle of the game. Rowland kicked the ball with his foot and caught it on his knee. Then he plunged in among them all and sent it flying over the church.
        - id: ch01-b02
          speaker: narrator
          text: Burd Ellen went around the church aisle to fetch it. Her brothers waited a long while, and then longer still, but she never came back.
        - id: ch01-b03
          speaker: narrator
          text: They searched east and west. They searched high and low. Their hearts were full of sorrow, for Burd Ellen could not be found.
        - id: ch01-b04
          speaker: narrator
          text: At last, the eldest brother went to the Warlock Merlin. He told him everything and asked if he knew where Burd Ellen was.
        - id: ch01-b05
          speaker: warlock_merlin
          text: Fair Burd Ellen must have been carried away by the fairies. She walked around the church widershins, against the path of the sun. Now she is in the Dark Tower of the King of Elfland. Only the boldest knight in Christendom could bring her home.
        - id: ch01-b06
          speaker: eldest_brother
          text: If she can be brought back, I will do it, even if I die trying.
        - id: ch01-b07
          speaker: warlock_merlin
          text: It can be done. But sorrow will come to any man who tries it unless he first learns exactly what he must do.
        - id: ch01-b08
          speaker: narrator
          text: No fear of danger could turn the eldest brother aside. He begged Merlin to teach him what to do and what to avoid on his journey. When he had learned the lesson and repeated it correctly, he set out for Elfland.
        - id: ch01-b09
          speaker: narrator
          text: His family waited a long while, and then longer still. Doubt and bitter pain grew as the days passed. His brothers' hearts were heavy, for he did not return.
        - id: ch01-b10
          speaker: narrator
          text: The second brother grew sick of waiting. He went to Merlin, asked the same questions, and then set out to find Burd Ellen.
        - id: ch01-b11
          speaker: narrator
          text: Again the family waited a long while, and then longer still. They were filled with great doubt and pain. His mother and his youngest brother grieved, for he did not come back either.

    - id: ch02
      title: Merlin's Two Commands
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: After they had waited a good long time, Childe Rowland, the youngest brother, wanted to go. He asked his mother, the good queen, to let him search for the others.
        - id: ch02-b02
          speaker: narrator
          text: At first, she refused. Rowland was the last of her children left to her. If he vanished too, she would have lost them all. But he begged and begged until she finally allowed him to go.
        - id: ch02-b03
          speaker: narrator
          text: The queen gave Rowland his father's fine sword, the good brand that never struck in vain. As she fastened it around his waist, she spoke the spell that would bring it victory.
        - id: ch02-b04
          speaker: narrator
          text: Rowland said goodbye to his mother and went to the Warlock Merlin's cave.
        - id: ch02-b05
          speaker: childe_rowland
          text: Tell me once more, and only once more. How can anyone rescue Burd Ellen and my two brothers?
        - id: ch02-b06
          speaker: warlock_merlin
          text: My son, there are only two rules. They may sound simple, but they are hard to follow. One tells you what to do. The other tells you what you must never do.
        - id: ch02-b07
          speaker: warlock_merlin
          text: Once you enter Fairyland, draw your father's sword and cut off the head of everyone who speaks to you, until you meet Burd Ellen.
        - id: ch02-b08
          speaker: warlock_merlin
          text: And while you are in Elfland, eat no food and drink no drink, however hungry or thirsty you become. If you swallow one drop or bite one morsel, you will never see Middle Earth again.
        - id: ch02-b09
          speaker: narrator
          text: Rowland repeated both commands again and again until he knew them by heart. Then he thanked Merlin and went on his way.
        - id: ch02-b10
          speaker: narrator
          text: He traveled on and on, and then farther still, until he found the King of Elfland's horse-herd feeding the royal horses. Their fiery eyes told Rowland that he had reached the land of Fairy.
        - id: ch02-b11
          speaker: childe_rowland
          text: Can you tell me where to find the King of Elfland's Dark Tower?
        - id: ch02-b12
          speaker: horse_herd
          text: I cannot. Go a little farther and you will meet the cow-herd. Perhaps he can tell you.
        - id: ch02-b13
          speaker: narrator
          text: Rowland said nothing more. He drew the good brand that never struck in vain, and the horse-herd's head fell. Then he continued until he met the cow-herd and asked the same question.
        - id: ch02-b14
          speaker: cow_herd
          text: I cannot tell you. Keep going and you will come to the hen-wife. She is sure to know.
        - id: ch02-b15
          speaker: narrator
          text: Out came Rowland's good sword, and the cow-herd's head fell. A little farther on, Rowland met an old woman in a gray cloak. He asked her where the Dark Tower stood.
        - id: ch02-b16
          speaker: hen_wife
          text: Go on until you find a round green hill, with rings of terraces running from bottom to top. Walk around it three times widershins. Each time, say, "Open, door! Open, door! And let me come in." On the third round, the door will open, and you may enter.
        - id: ch02-b17
          speaker: narrator
          text: Rowland started to leave, but then he remembered Merlin's command. He drew the good brand that never struck in vain, and the hen-wife's head fell.

    - id: ch03
      title: Inside the Dark Tower
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Rowland went on and on until he reached the round green hill, ringed with terraces from top to bottom. He walked around it three times widershins. Each time, he called out the words the hen-wife had taught him.
        - id: ch03-b02
          speaker: childe_rowland
          text: Open, door! Open, door! And let me come in.
        - id: ch03-b03
          speaker: narrator
          text: On the third round, a door opened. Rowland stepped through, and it clicked shut behind him, leaving him in the dark.
        - id: ch03-b04
          speaker: narrator
          text: Yet it was not quite dark. A strange twilight filled the place, though there were no windows or candles. Rowland could not tell whether the light came through the walls or the roof.
        - id: ch03-b05
          speaker: narrator
          text: Rough arches of clear stone rose around him. They glittered with sheepsilver, rock crystal, and other bright stones. Though everything was made of rock, the air was warm, as it always is in Elfland.
        - id: ch03-b06
          speaker: narrator
          text: Rowland followed the passage until he came to two tall, wide folding doors standing partly open. He pushed them apart and saw a glorious hall, as long and broad as the green hill itself.
        - id: ch03-b07
          speaker: narrator
          text: Great, lofty pillars held up the roof. Even the pillars of a cathedral would have looked like nothing beside them. These pillars were made of gold and silver, with delicate patterns worked across them. Wreaths curled between and around them, but they were not wreaths of leaves. They were made of diamonds, emeralds, and every kind of precious stone.
        - id: ch03-b08
          speaker: narrator
          text: Even the key-stones at the tops of the arches were decorated with clusters of diamonds, rubies, pearls, and other jewels. All those arches met at the very center of the roof. From that point, an immense lamp hung down on a golden chain.
        - id: ch03-b09
          speaker: narrator
          text: The lamp was one enormous pearl, hollow and clear. Inside it, a great carbuncle spun round and round. Its rays filled the hall with a light like the setting sun.
        - id: ch03-b10
          speaker: narrator
          text: The light spread across the whole enormous hall, as if the setting sun were shining inside the hill. The furnishings were every bit as grand as the pillars and roof. At one end stood a magnificent couch of velvet, silk, and gold. Burd Ellen sat upon it, combing her golden hair with a silver comb.

    - id: ch04
      title: The Bread and Milk
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: When Burd Ellen saw Childe Rowland, she rose to her feet.
        - id: ch04-b02
          speaker: burd_ellen
          text: God pity you, poor unlucky fool. Why have you come here?
          emotion: sad
        - id: ch04-b03
          speaker: burd_ellen
          text: Listen to me, my youngest brother. Why did you not stay at home? Even if you had a hundred thousand lives, you could not spare a single one.
          emotion: sad
        - id: ch04-b04
          speaker: burd_ellen
          text: But sit beside me. Oh, how I wish you had never been born! When the King of Elfland comes in, there will be no hope for you.
          emotion: sad
        - id: ch04-b05
          speaker: narrator
          text: They sat down together. Rowland told her everything he had done. Burd Ellen told him that their two brothers had also reached the Dark Tower. The King of Elfland had enchanted them, and now they lay entombed as if they were dead.
        - id: ch04-b06
          speaker: narrator
          text: They talked a little longer. Then the hunger from Rowland's long journey began to trouble him. Forgetting Merlin's warning, he told Burd Ellen how hungry he was and asked her for food.
        - id: ch04-b07
          speaker: narrator
          text: Burd Ellen looked at him sadly and shook her head. But she was under a spell and could not warn him. She stood, left the hall, and soon returned with a golden bowl full of bread and milk.
        - id: ch04-b08
          speaker: narrator
          text: Rowland was lifting the bowl to his lips when he looked at his sister. Then he remembered why he had traveled all that way. He hurled the bowl to the floor.
        - id: ch04-b09
          speaker: childe_rowland
          text: I will not swallow one drop or bite one morsel until Burd Ellen is free!
        - id: ch04-b10
          speaker: narrator
          text: At that very moment, they heard someone coming. A great voice thundered through the passage.
        - id: ch04-b11
          speaker: king_of_elfland
          text: Fee, fi, fo, fum! I smell the blood of a Christian man. Dead or alive, I will strike him with my sword and smash his skull!
          emotion: angry
        - id: ch04-b12
          speaker: narrator
          text: The folding doors burst open, and the King of Elfland charged into the hall.

    - id: ch05
      title: The King of Elfland
      blocks:
        - id: ch05-b01
          speaker: childe_rowland
          text: Then strike, monster, if you dare!
          emotion: angry
        - id: ch05-b02
          speaker: narrator
          text: Rowland rushed to meet him, holding the good brand that had never failed. The two fought on and on in the great hall. At last, Rowland beat the King of Elfland down onto his knees. The king could fight no longer. He yielded and begged Rowland to show him mercy.
        - id: ch05-b03
          speaker: childe_rowland
          text: I will spare you if you free my sister from your spells, bring my brothers back to life, and let all four of us leave.
        - id: ch05-b04
          speaker: king_of_elfland
          text: I agree.
        - id: ch05-b05
          speaker: narrator
          text: The Elfin King rose and went to a chest. From it, he took a small bottle filled with blood-red liquid. He touched the liquid to the ears, eyelids, nostrils, lips, and fingertips of Rowland's two brothers.
        - id: ch05-b06
          speaker: narrator
          text: At once, both brothers sprang back to life.
        - id: ch05-b07
          speakers: [eldest_brother, second_brother]
          ensemble: duo
          text: Our souls were away, but now they have returned!
        - id: ch05-b08
          speaker: narrator
          text: Then the King of Elfland spoke certain words over Burd Ellen, and the enchantment left her.
        - id: ch05-b09
          speaker: narrator
          text: All four siblings passed out of the great hall and through the long passage. They turned their backs on the Dark Tower and never returned.
        - id: ch05-b10
          speaker: narrator
          text: At last, they reached home, and the good queen had all her children with her once again. After everything that had happened, Burd Ellen never again walked around a church widershins.
