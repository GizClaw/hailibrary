audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容讲述古老童话，带着一本正经的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中
    woman:
      display_name: 女人
      tts:
        delivery: 起初镇定好奇，随着怪客成形渐渐紧张
        timbre: 清晰柔和
        pace: 中等
        pitch: 中高
    visitor:
      display_name: 怪客
      tts:
        delivery: 声音忽而粗哑，忽而尖细哀鸣，最后爆发出骇人的吼声
        timbre: 阴沉多变
        pace: 缓慢拖曳
        pitch: 中低
  chapters:
    - id: ch01
      title: 炉边的怪客
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "一天夜里，一个女人坐在绕线架旁。她坐呀坐，绕呀绕，心里只盼着能有个人来陪伴。"
        - id: ch01-b02
          speaker: narrator
          text: "这时，一双宽宽的脚板走进屋，在炉火边坐了下来。"
        - id: ch01-b03
          speaker: narrator
          text: "女人还是坐呀坐，绕呀绕，只盼能有个人来陪伴。"
        - id: ch01-b04
          speaker: narrator
          text: "接着，一双小小的腿走进来，坐在那双宽宽的脚板上。"
        - id: ch01-b05
          speaker: narrator
          text: "女人仍旧坐呀坐，绕呀绕，只盼能有个人来陪伴。"
        - id: ch01-b06
          speaker: narrator
          text: "一双粗粗的膝盖又走进来，坐到了小小的腿上。"
        - id: ch01-b07
          speaker: narrator
          text: "女人还是坐呀坐，绕呀绕，只盼能有个人来陪伴。"
        - id: ch01-b08
          speaker: narrator
          text: "随后进来的是一双瘦瘦的大腿，它们坐在粗粗的膝盖上。"
        - id: ch01-b09
          speaker: narrator
          text: "女人照旧坐呀坐，绕呀绕，只盼能有个人来陪伴。"
        - id: ch01-b10
          speaker: narrator
          text: "一副大大的胯骨走进屋，往瘦瘦的大腿上一坐。"
        - id: ch01-b11
          speaker: narrator
          text: "女人还是坐呀坐，绕呀绕，只盼能有个人来陪伴。"
        - id: ch01-b12
          speaker: narrator
          text: "一把小小的腰也进来了，坐在大大的胯骨上。"
        - id: ch01-b13
          speaker: narrator
          text: "女人仍旧坐呀坐，绕呀绕，只盼能有个人来陪伴。"
        - id: ch01-b14
          speaker: narrator
          text: "然后，一副宽宽的肩膀走进来，坐到了小小的腰上。"
        - id: ch01-b15
          speaker: narrator
          text: "女人还是坐呀坐，绕呀绕，只盼能有个人来陪伴。"
        - id: ch01-b16
          speaker: narrator
          text: "一双小小的胳膊走进来，坐在宽宽的肩膀上。"
        - id: ch01-b17
          speaker: narrator
          text: "女人照旧坐呀坐，绕呀绕，只盼能有个人来陪伴。"
        - id: ch01-b18
          speaker: narrator
          text: "一双大大的手紧跟着进来，坐在小小的胳膊上。"
        - id: ch01-b19
          speaker: narrator
          text: "女人还是坐呀坐，绕呀绕，只盼能有个人来陪伴。"
        - id: ch01-b20
          speaker: narrator
          text: "一截小小的脖子走了进来，坐在宽宽的肩膀上。"
        - id: ch01-b21
          speaker: narrator
          text: "女人仍旧坐呀坐，绕呀绕，只盼能有个人来陪伴。"
        - id: ch01-b22
          speaker: narrator
          text: "最后，一颗大大的脑袋走进屋，端端正正坐上了小小的脖子。"
    - id: ch02
      title: 怪客的回答
      blocks:
        - id: ch02-b01
          speaker: woman
          text: "你的脚怎么会这么宽？"
        - id: ch02-b02
          speaker: visitor
          text: "走得多，走得多。"
        - id: ch02-b03
          speaker: narrator
          text: "怪客的声音又粗又哑。女人接着问。"
        - id: ch02-b04
          speaker: woman
          text: "你的腿怎么会这么小？"
        - id: ch02-b05
          speaker: visitor
          text: "哎——来——特——威——毛——"
        - id: ch02-b06
          speaker: narrator
          text: "怪客哼哼唧唧，把声音拖得老长。"
        - id: ch02-b07
          speaker: woman
          text: "你的膝盖怎么会这么粗？"
        - id: ch02-b08
          speaker: visitor
          text: "祷告得多，祷告得多。"
        - id: ch02-b09
          speaker: narrator
          text: "这一回，怪客的口气虔诚得很。"
        - id: ch02-b10
          speaker: woman
          text: "你的大腿怎么会这么瘦？"
        - id: ch02-b11
          speaker: visitor
          text: "哎——来——特——威——毛——"
        - id: ch02-b12
          speaker: narrator
          text: "那哼哼唧唧的长音又响了起来。"
        - id: ch02-b13
          speaker: woman
          text: "你的胯骨怎么会这么大？"
        - id: ch02-b14
          speaker: visitor
          text: "坐得多，坐得多。"
        - id: ch02-b15
          speaker: narrator
          text: "怪客又用粗哑的嗓音回答。"
        - id: ch02-b16
          speaker: woman
          text: "你的腰怎么会这么小？"
        - id: ch02-b17
          speaker: visitor
          text: "哎——来——特——威——毛——"
        - id: ch02-b18
          speaker: narrator
          text: "那声音仍旧哼哼唧唧，拖得很长。"
        - id: ch02-b19
          speaker: woman
          text: "你的肩膀怎么会这么宽？"
        - id: ch02-b20
          speaker: visitor
          text: "扛扫帚扛的，扛扫帚扛的。"
        - id: ch02-b21
          speaker: narrator
          text: "怪客的声音又变得粗哑。"
        - id: ch02-b22
          speaker: woman
          text: "你的胳膊怎么会这么小？"
        - id: ch02-b23
          speaker: visitor
          text: "哎——来——特——威——毛——"
        - id: ch02-b24
          speaker: narrator
          text: "怪客再一次哼哼唧唧地拖长了声音。"
        - id: ch02-b25
          speaker: woman
          text: "你的手怎么会这么大？"
        - id: ch02-b26
          speaker: visitor
          text: "拿铁连枷打谷打的，拿铁连枷打谷打的。"
        - id: ch02-b27
          speaker: narrator
          text: "这个回答依旧又粗又哑。"
        - id: ch02-b28
          speaker: woman
          text: "你的脖子怎么会这么小？"
        - id: ch02-b29
          speaker: visitor
          text: "哎——来——特——威——毛——"
          emotion: sad
        - id: ch02-b30
          speaker: narrator
          text: "这一次，那拖长的叫声听来可怜兮兮。"
        - id: ch02-b31
          speaker: woman
          text: "你的脑袋怎么会这么大？"
        - id: ch02-b32
          speaker: visitor
          text: "懂得多，懂得多。"
        - id: ch02-b33
          speaker: narrator
          text: "怪客的嗓音忽然变得尖锐又机警。"
    - id: ch03
      title: 它为何而来
      blocks:
        - id: ch03-b01
          speaker: woman
          text: "那么，你到这里来做什么？"
        - id: ch03-b02
          speaker: narrator
          text: "怪客猛地挥起胳膊，双脚重重一跺，突然扯开了嗓门。"
        - id: ch03-b03
          speaker: visitor
          text: "我就是来找你的！"
