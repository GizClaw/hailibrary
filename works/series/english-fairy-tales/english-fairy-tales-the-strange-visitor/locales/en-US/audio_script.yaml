audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and unhurried, with the steady rhythm of an old fireside tale
        timbre: clear and gently weathered
        pace: measured
        pitch: medium
    woman:
      display_name: Woman
      tts:
        delivery: steady and direct, asking each question with plain curiosity
        timbre: mature and clear
        pace: measured
        pitch: medium
    visitor:
      display_name: Strange Visitor
      tts:
        delivery: uncanny and changeable, shifting between a low growl and a thin whine
        timbre: rough and hollow
        pace: slow
        pitch: low
  chapters:
    - id: ch01
      title: The Visitor Takes Shape
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: One night, a woman sat at her reel. On and on she worked, turning the reel and wishing someone would come to keep her company.
        - id: ch01-b02
          speaker: narrator
          text: Then a pair of broad, broad soles came in and settled beside the fire. The woman stayed at her reel. She went on turning it, and she still wished for company.
        - id: ch01-b03
          speaker: narrator
          text: Next came two small, small legs. They placed themselves on top of the broad, broad soles. Still the woman sat there, working her reel and wishing for company.
        - id: ch01-b04
          speaker: narrator
          text: After that came two thick, thick knees. They set themselves upon the small, small legs. The woman kept turning her reel, and she kept wishing for company.
        - id: ch01-b05
          speaker: narrator
          text: Then two thin, thin thighs came in and rested on the thick, thick knees. Still she sat. Still she worked. And still she wished for company.
        - id: ch01-b06
          speaker: narrator
          text: In came two huge, huge hips, and down they sat upon the thin, thin thighs. The woman remained at her reel, turning it and wishing for company.
        - id: ch01-b07
          speaker: narrator
          text: A wee, wee waist came next and settled on the huge, huge hips. Still the woman sat there. Still she reeled, and still she wished for company.
        - id: ch01-b08
          speaker: narrator
          text: Then a pair of broad, broad shoulders came in and sat upon the wee, wee waist. The woman went on working her reel, and she went on wishing for company.
        - id: ch01-b09
          speaker: narrator
          text: Two small, small arms appeared next and took their place on the broad, broad shoulders. Still she sat. Still she reeled. Still she wished for company.
        - id: ch01-b10
          speaker: narrator
          text: Then two huge, huge hands came in and rested on the small, small arms. The woman stayed beside her reel, turning it and wishing for company.
        - id: ch01-b11
          speaker: narrator
          text: A small, small neck came next and set itself upon the broad, broad shoulders. Still the woman sat there. Still she worked, and still she wished for company.
        - id: ch01-b12
          speaker: narrator
          text: Last of all, a huge, huge head came in and settled on top of the small, small neck.

    - id: ch02
      title: The Woman's Questions
      blocks:
        - id: ch02-b01
          speaker: woman
          text: How did your feet grow so broad?
        - id: ch02-b02
          speaker: visitor
          text: From tramping far and long. Tramping, tramping.
        - id: ch02-b03
          speaker: woman
          text: And why are your legs so small?
        - id: ch02-b04
          speaker: visitor
          text: Aih-h-h! Late and wee-e-e moul.
        - id: ch02-b05
          speaker: woman
          text: How did your knees become so thick?
        - id: ch02-b06
          speaker: visitor
          text: From praying again and again. Praying, praying.
        - id: ch02-b07
          speaker: woman
          text: Then how did your thighs grow so thin?
        - id: ch02-b08
          speaker: visitor
          text: Aih-h-h! Late and wee-e-e moul.
        - id: ch02-b09
          speaker: woman
          text: Why are your hips so big?
        - id: ch02-b10
          speaker: visitor
          text: From sitting so much. Sitting, sitting.
        - id: ch02-b11
          speaker: woman
          text: And how did you get such a tiny waist?
        - id: ch02-b12
          speaker: visitor
          text: Aih-h-h! Late and wee-e-e moul.
        - id: ch02-b13
          speaker: woman
          text: How did your shoulders grow so broad?
        - id: ch02-b14
          speaker: visitor
          text: From carrying a broom. Carrying and carrying it.
        - id: ch02-b15
          speaker: woman
          text: Why are your arms so small?
        - id: ch02-b16
          speaker: visitor
          text: Aih-h-h! Late and wee-e-e moul.
        - id: ch02-b17
          speaker: woman
          text: How did your hands become so huge?
        - id: ch02-b18
          speaker: visitor
          text: From threshing with an iron flail. Threshing, threshing.
        - id: ch02-b19
          speaker: woman
          text: And how did you get such a small neck?
        - id: ch02-b20
          speaker: visitor
          text: Aih-h-h! Late, wee-e-e moul.
        - id: ch02-b21
          speaker: woman
          text: How did your head grow so huge?
        - id: ch02-b22
          speaker: visitor
          text: From knowing so much. So much knowledge.

    - id: ch03
      title: What the Visitor Wanted
      blocks:
        - id: ch03-b01
          speaker: woman
          text: What have you come here for?
        - id: ch03-b02
          speaker: narrator
          text: The visitor waved an arm and stamped those feet. Then, at the very top of its voice, it shouted one answer.
        - id: ch03-b03
          speaker: visitor
          text: For you!
