audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and unhurried, with the steady rhythm of an old fireside tale
        timbre: clear and gently weathered
        pace: measured
        pitch: medium
    king:
      display_name: King
      tts:
        delivery: dignified but openhearted, with feeling close to the surface
        timbre: mature and resonant
        pace: measured
        pitch: medium-low
    queen:
      display_name: Queen
      tts:
        delivery: gentle and thoughtful, with quiet royal dignity
        timbre: warm and clear
        pace: measured
        pitch: medium
    giant:
      display_name: Giant
      tts:
        delivery: booming and forceful, with a rough, threatening edge
        timbre: deep and gravelly
        pace: deliberate
        pitch: very low
    hen_wifes_boy:
      display_name: Hen-Wife's Boy
      tts:
        delivery: young and plainspoken, with innocent directness
        timbre: light and clear
        pace: medium
        pitch: high
    gardeners_boy:
      display_name: Gardener's Boy
      tts:
        delivery: young and straightforward, with a country lilt
        timbre: clear and youthful
        pace: medium
        pitch: medium-high
    nix_nought_nothing:
      display_name: Nix Nought Nothing
      tts:
        delivery: earnest and brave, growing from youthful candor into steady resolve
        timbre: clear and youthful
        pace: medium
        pitch: medium
    giants_daughter:
      display_name: Giant's Daughter
      tts:
        delivery: kind, quick-minded, and urgent when danger draws near
