audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容讲述古老童话，带着一本正经的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中
    jack:
      display_name: 杰克
      tts:
        delivery: 憨直迟钝，说话简短，总把教训照字面记住
        timbre: 年轻朴实
        pace: 稍慢
        pitch: 中
    mother:
      display_name: 杰克的母亲
      tts:
        delivery: 劳苦而直率，责备中带着急切
        timbre: 苍老温厚
        pace: 中等
        pitch: 中低
  chapters:
    - id: ch01
      title: 懒汉终于去做工
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "从前有个叫杰克的男孩，跟母亲住在一片公地上。家里穷得很，全靠老太太纺纱过日子。可杰克实在太懒了。天一热，他就躺到太阳底下晒暖。冬天来了，他又缩在壁炉角落里，什么活儿也不肯干。所以，人人都管他叫懒汉杰克。母亲拿他一点办法也没有。直到一个星期一，她终于撂下了狠话。"
        - id: ch01-b02
          speaker: mother
          text: "你要是还不肯干活，挣自己的粥饭，我就把你赶出去。到时候，你自己想办法过活吧。"
        - id: ch01-b03
          speaker: narrator
          text: "杰克这才动了起来。第二天，他去邻近的一户农家干活，挣了一便士。那是他头一次拿到钱，哪里懂得该怎么收好。回家经过一条小溪时，硬币就这么丢了。"
        - id: ch01-b04
          speaker: mother
          text: "你这个笨孩子！该把钱放进口袋里呀。"
        - id: ch01-b05
          speaker: jack
          text: "下次我就这么办。"
    - id: ch02
      title: 牛奶与奶酪
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "到了星期三，杰克又出门了。这次，他给一个牧牛人干了一天活，换来一罐牛奶。杰克没忘记母亲教的办法，顺手就把罐子塞进外套的大口袋。结果路还没走完，牛奶已经全洒光了。"
        - id: ch02-b02
          speaker: mother
          text: "哎呀！你该把牛奶顶在头上带回来。"
        - id: ch02-b03
          speaker: jack
          text: "下次我就这么办。"
        - id: ch02-b04
          speaker: narrator
          text: "星期四，雇杰克的是另一个农夫，答应给他一块奶油奶酪。傍晚收了工，杰克真的把奶酪放到头顶，就这样往家走。到家一看，一部分奶酪早掉在路上，其余的也全黏进头发里，再也不能吃了。"
        - id: ch02-b05
          speaker: mother
          text: "你这个笨家伙！该用双手小心捧着它才对。"
        - id: ch02-b06
          speaker: jack
          text: "下次我就这么办。"
    - id: ch03
      title: 公猫与羊肩
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "星期五，懒汉杰克照样出去找活儿。这回，他替一个面包师做工，最后领到的竟是一只大公猫。杰克牢记母亲的话，两只手捧着猫，走得小心极了。可猫咪抓个不停，没一会儿，他就疼得受不住，只能松开手。猫一下子跑没影了。"
        - id: ch03-b02
          speaker: mother
          text: "你这个傻小子！该拿绳子把猫拴住，拖在身后带回来。"
        - id: ch03-b03
          speaker: jack
          text: "下次我就这么办。"
        - id: ch03-b04
          speaker: narrator
          text: "星期六，杰克又替一个屠夫做了工。屠夫很大方，拿一只羊肩酬谢他。杰克立刻找绳子拴好，拖在身后的泥地里走了一路。等他回到家，那块肉已经彻底不能吃了。母亲这次真气坏了。明明第二天就是星期日，她的晚餐却只剩卷心菜可以凑合。"
        - id: ch03-b05
          speaker: mother
          text: "你这个大傻瓜！该把羊肩扛在肩上呀。"
        - id: ch03-b06
          speaker: jack
          text: "下次我就这么办。"
    - id: ch04
      title: 肩上的驴
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "转眼又到了星期一。懒汉杰克再一次出门，给一个牧牛人干活。这回的报酬可不一般，竟然是一头驴。杰克想把驴举上肩膀，费了好大一番力气才成功。接着，他就扛着这份奖赏，一步一步往家挪。"
        - id: ch04-b02
          speaker: narrator
          text: "回家的路边，住着一个富翁。他有个美丽的独生女儿，可姑娘听不见声音，也不能开口说话。从出生到现在，她一次都没有笑过。医生们断定，只有谁能把她逗笑，她才可能开口。"
        - id: ch04-b03
          speaker: narrator
          text: "那天，姑娘恰好站在窗边。她往外一望，正看见杰克扛着驴走过，驴的四条腿还直挺挺地翘在半空。她从没见过这么古怪滑稽的样子，忽然放声大笑起来。笑声一出口，她竟立刻听见了声音，也能开口说话了。"
        - id: ch04-b04
          speaker: narrator
          text: "富翁高兴极了，便照先前许下的诺言，让女儿嫁给懒汉杰克。就这样，杰克成了富有的绅士。婚后，他们住在一幢大宅子里，还把杰克的母亲接来同住。老太太直到去世，都和他们幸福地生活在一起。"
