audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and unhurried, with the steady rhythm of an old fireside tale
        timbre: clear and gently weathered
        pace: measured
        pitch: medium
    jack:
      display_name: Jack
      tts:
        delivery: slow and simple, always certain he can follow the latest advice next time
        timbre: youthful and open
        pace: relaxed
        pitch: medium
    mother:
      display_name: Jack's Mother
      tts:
        delivery: hardworking and plainspoken, with growing exasperation
        timbre: mature and sturdy
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: Jack Goes to Work
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, a boy named Jack lived with his mother on a common. They were very poor. His mother earned their living by spinning, while Jack did nothing at all. In hot weather, he lay in the sun. In winter, he sat beside the hearth. That was why everyone called him Lazy Jack.
        - id: ch01-b02
          speaker: narrator
          text: His mother could never persuade him to help her. At last, one Monday, she gave him a warning.
        - id: ch01-b03
          speaker: mother
          text: If you don't start working for your porridge, I'll turn you out. Then you'll have to earn your own living.
        - id: ch01-b04
          speaker: narrator
          text: That stirred Jack into action. He went out and hired himself to a nearby farmer for the following day. The farmer paid him one penny. Jack had never owned money before, and while crossing a brook on his way home, he lost it.
        - id: ch01-b05
          speaker: mother
          text: You foolish boy! You ought to have put the penny in your pocket.
        - id: ch01-b06
          speaker: jack
          text: That's what I'll do next time.

    - id: ch02
      title: Milk and Cheese
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: On Wednesday, Jack found work with a cow-keeper. At the end of the day, the man paid him with a jar of milk. Remembering his mother's advice, Jack put the jar into the large pocket of his jacket. Long before he reached home, all the milk had spilled out.
        - id: ch02-b02
          speaker: mother
          text: Oh, Jack! You should have balanced the jar on your head.
        - id: ch02-b03
          speaker: jack
          text: I'll remember that next time.
        - id: ch02-b04
          speaker: narrator
          text: On Thursday, Jack worked for another farmer, who promised him a cream cheese. That evening, Jack set the cheese on his head and started home. By the time he arrived, the cheese was ruined. Some of it had fallen away, and the rest was tangled in his hair.
        - id: ch02-b05
          speaker: mother
          text: You stupid lout! You should have held it carefully in your hands.
        - id: ch02-b06
          speaker: jack
          text: I'll do that next time.

    - id: ch03
      title: The Cat and the Mutton
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: On Friday, Lazy Jack hired himself to a baker. For all his work, the baker gave him nothing but a large tomcat. Jack held the cat very carefully in his hands, just as his mother had told him. Before long, the cat scratched him so badly that he had to let it go.
        - id: ch03-b02
          speaker: mother
          text: You silly fellow! You should have tied the cat to a string and pulled it along behind you.
        - id: ch03-b03
          speaker: jack
          text: That's what I'll do next time.
        - id: ch03-b04
          speaker: narrator
          text: On Saturday, Jack worked for a butcher. The butcher rewarded him with a fine shoulder of mutton. Jack tied the meat to a string and dragged it home through the dirt. By the time he arrived, it was completely spoiled.
        - id: ch03-b05
          speaker: narrator
          text: His mother finally lost all patience. The next day was Sunday, and now she had to make do with cabbage for her dinner.
        - id: ch03-b06
          speaker: mother
          text: You ninny-hammer! You should have carried the mutton on your shoulder.
          emotion: angry
        - id: ch03-b07
          speaker: jack
          text: I'll do that next time.

    - id: ch04
      title: The Donkey
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The next Monday, Lazy Jack went out once more. This time, he hired himself to a cattle-keeper, who gave him a donkey for his trouble. Jack found it hard to lift the donkey onto his shoulders, but at last he managed it. Then he set off slowly for home with his prize.
        - id: ch04-b02
          speaker: narrator
          text: Along Jack's road stood the home of a rich man and his only daughter. She was a beautiful girl, but she could neither hear nor speak. She had never laughed in her life, and the doctors said she would not speak until someone made her laugh.
        - id: ch04-b03
          speaker: narrator
          text: The young woman happened to be looking from the window as Jack passed by. There he was, carrying a donkey on his shoulders, with all four legs sticking up in the air. The sight was so strange and funny that she burst into a great fit of laughter. At once, she could speak and hear.
        - id: ch04-b04
          speaker: narrator
          text: Her father was overjoyed. He kept his promise and gave his daughter in marriage to Lazy Jack, making Jack a rich gentleman. Jack and his wife lived in a large house, and his mother lived there happily with them until she died.
