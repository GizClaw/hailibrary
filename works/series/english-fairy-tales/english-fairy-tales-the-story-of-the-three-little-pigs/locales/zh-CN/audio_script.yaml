audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容讲述古老童话，带着一本正经的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中
    first_little_pig:
      display_name: 第一只小猪
      tts:
        delivery: 天真直率，说话干脆
        timbre: 清亮稚嫩
        pace: 中等偏快
        pitch: 中高
    second_little_pig:
      display_name: 第二只小猪
      tts:
        delivery: 朴实爽快，回答坚定
        timbre: 明亮稚嫩
        pace: 中等
        pitch: 中高
    third_little_pig:
      display_name: 第三只小猪
      tts:
        delivery: 机灵镇定，得意时带一点调皮
        timbre: 清脆灵动
        pace: 明快
        pitch: 中高
    wolf:
      display_name: 狼
      tts:
        delivery: 狡猾蛮横，恼怒时凶狠急躁
        timbre: 粗哑低沉
        pace: 中等
        pitch: 低
  chapters:
    - id: ch01
      title: 稻草屋和荆豆屋
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "从前呀，猪儿说话押着韵，猴子嘴里嚼烟草。母鸡鼻烟吸一吸，要把身子练得好。鸭子只会嘎嘎叫，嘎呀嘎呀嘎！那时，有一头老母猪养着三只小猪。家里的东西不够吃，她只好让孩子们出门，各自去谋一条生路。"
        - id: ch01-b02
          speaker: narrator
          text: "第一只小猪上路以后，碰见一个抱着一捆稻草的人。"
        - id: ch01-b03
          speaker: first_little_pig
          text: "好心人，请把那些稻草送给我吧，我想盖间屋子。"
        - id: ch01-b04
          speaker: narrator
          text: "那人答应了。小猪用稻草搭好屋子，没过多久，一只狼就走到门前，敲响了门。"
        - id: ch01-b05
          speaker: wolf
          text: "小猪，小猪，快让我进去。"
        - id: ch01-b06
          speaker: first_little_pig
          text: "不行，不行，我下巴上的毛可不答应！"
        - id: ch01-b07
          speaker: wolf
          text: "那我就呼呼吹，狠狠吹，把你的屋子吹塌掉！"
        - id: ch01-b08
          speaker: narrator
          text: "狼呼呼地吹，又狠狠地吹。稻草屋一下就塌了，狼把第一只小猪吃掉了。"
        - id: ch01-b09
          speaker: narrator
          text: "第二只小猪碰见的那个人，怀里抱着一捆荆豆枝。"
        - id: ch01-b10
          speaker: second_little_pig
          text: "好心人，请把荆豆枝送给我吧，我要拿它们盖屋子。"
        - id: ch01-b11
          speaker: narrator
          text: "那人也答应了。第二只小猪刚把屋子盖好，狼又来了。"
        - id: ch01-b12
          speaker: wolf
          text: "小猪，小猪，让我进屋去。"
        - id: ch01-b13
          speaker: second_little_pig
          text: "不行，不行，我下巴上的毛可不答应！"
        - id: ch01-b14
          speaker: wolf
          text: "那我就狠狠吹，呼呼吹，把你的屋子吹塌掉！"
        - id: ch01-b15
          speaker: narrator
          text: "狼狠狠吹，呼呼吹，呼呼吹，又狠狠吹。到最后，荆豆屋也倒了，第二只小猪也让狼吃掉了。"
    - id: ch02
      title: 吹不倒的砖屋
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "第三只小猪在路上遇见一个人，车里装着满满一车砖。"
        - id: ch02-b02
          speaker: third_little_pig
          text: "好心人，请把这些砖给我吧，我想用它们盖间屋子。"
        - id: ch02-b03
          speaker: narrator
          text: "那人把砖送给了他。小猪盖起一间砖屋，狼也像前两回一样找上门来。"
        - id: ch02-b04
          speaker: wolf
          text: "小猪，小猪，快让我进去。"
        - id: ch02-b05
          speaker: third_little_pig
          text: "不行，不行，我下巴上的毛可不答应！"
        - id: ch02-b06
          speaker: wolf
          text: "那我就呼呼吹，狠狠吹，把你的屋子吹塌掉！"
        - id: ch02-b07
          speaker: narrator
          text: "狼呼呼吹，狠狠吹，翻来覆去地吹了又吹。可这回，不管他使多大力气，砖屋还是纹丝不动。狼知道吹屋子的办法行不通，便换了个主意。"
        - id: ch02-b08
          speaker: wolf
          text: "小猪，我知道哪儿有一片很好的芜菁地。"
        - id: ch02-b09
          speaker: third_little_pig
          text: "在哪儿？"
        - id: ch02-b10
          speaker: wolf
          text: "就在史密斯先生宅地的田里。你明早准备好，我来叫你。咱们一起拔些芜菁，带回家做晚饭。"
        - id: ch02-b11
          speaker: third_little_pig
          text: "好，我会准备好。你几点出发？"
        - id: ch02-b12
          speaker: wolf
          text: "六点钟。"
        - id: ch02-b13
          speaker: narrator
          text: "第二天，小猪五点就起床了。他赶在狼来以前，已经去田里拔好了芜菁。六点左右，狼来到砖屋门前。"
        - id: ch02-b14
          speaker: wolf
          text: "小猪，你准备好了吗？"
        - id: ch02-b15
          speaker: third_little_pig
          text: "准备好？我早就去过，又回来了！我还拔了满满一锅芜菁，晚饭正好吃。"
        - id: ch02-b16
          speaker: narrator
          text: "狼气得不轻。他暗暗打定主意，无论用什么办法，下一回一定要胜过这只小猪。"
    - id: ch03
      title: 苹果树下的较量
      blocks:
        - id: ch03-b01
          speaker: wolf
          text: "小猪，我还知道一棵很好的苹果树。"
        - id: ch03-b02
          speaker: third_little_pig
          text: "在哪儿？"
        - id: ch03-b03
          speaker: wolf
          text: "就在快乐花园。你要是不再骗我，我明早五点来接你，咱们一起摘苹果。"
        - id: ch03-b04
          speaker: narrator
          text: "小猪第二天四点就忙着起床，独自赶往果园。他以为能抢先回来，可快乐花园路远，还要爬树。等他正要从树上下来时，狼已经走来了。小猪见了，心里害怕极了。狼来到树下，抬头看见了他。"
        - id: ch03-b05
          speaker: wolf
          text: "怎么，你又比我先到？树上的苹果好吃吗？"
        - id: ch03-b06
          speaker: third_little_pig
          text: "好吃极了。我扔一个给你尝尝。"
        - id: ch03-b07
          speaker: narrator
          text: "小猪把苹果使劲扔向远处。狼跑去捡时，他立刻跳下树，飞快地逃回了家。"
        - id: ch03-b08
          speaker: narrator
          text: "第二天，狼又来到砖屋前。"
        - id: ch03-b09
          speaker: wolf
          text: "小猪，今天下午尚克林有集市，你去不去？"
        - id: ch03-b10
          speaker: third_little_pig
          text: "去呀。你准备几点出发？"
        - id: ch03-b11
          speaker: wolf
          text: "三点钟。"
        - id: ch03-b12
          speaker: narrator
          text: "小猪还是提前出了门。他到了集市，买下一只搅黄油的木桶，又带着它往家走。半路上，他看见狼迎面过来，一下不知该怎么办，只好钻进木桶里藏起来。可他一钻进去，木桶就翻倒了，载着他一路滚下山坡。狼看见一个圆滚滚的大家伙朝自己冲来，吓得掉头就逃，连集市也不敢去了。"
        - id: ch03-b13
          speaker: narrator
          text: "后来，狼跑到小猪家，说起那个滚下山坡、擦着他冲过去的圆东西，还说自己吓得有多厉害。小猪一听就明白了。"
        - id: ch03-b14
          speaker: third_little_pig
          text: "哈，原来把你吓跑的是我！我从集市买了只搅黄油的木桶，看见你时就钻进去，一路滚下了山。"
    - id: ch04
      title: 烟囱里的狼
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "狼这才知道，自己又让小猪耍了一回。他当真暴跳如雷，发誓非把小猪吃掉不可。既然门进不去，他就要从烟囱里钻进屋。小猪看出了狼的打算，马上在火上吊起一锅水，把火烧得旺旺的。"
        - id: ch04-b02
          speaker: narrator
          text: "狼顺着烟囱往下爬。就在他快要落下来时，小猪猛地揭开锅盖。狼扑通一声，正好掉进滚热的锅里。小猪立刻把锅盖盖紧，将狼煮熟，当作晚饭吃掉了。"
        - id: ch04-b03
          speaker: narrator
          text: "从那以后，第三只小猪一直过着幸福的生活。"
