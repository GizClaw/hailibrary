audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and unhurried, with the steady rhythm of an old fireside tale
        timbre: clear and gently weathered
        pace: measured
        pitch: medium
    first_pig:
      display_name: First Little Pig
      tts:
        delivery: young and direct, with an easy confidence
        timbre: light and clear
        pace: medium
        pitch: high
    second_pig:
      display_name: Second Little Pig
      tts:
        delivery: young and straightforward, with a firm little voice
        timbre: bright and clear
        pace: medium
        pitch: medium-high
    third_pig:
      display_name: Third Little Pig
      tts:
        delivery: quick-witted and cheerful, becoming alert when danger comes near
        timbre: youthful and clear
        pace: medium
        pitch: medium-high
    wolf:
      display_name: Wolf
      tts:
        delivery: sly and threatening, turning rough when he loses patience
        timbre: deep and coarse
        pace: measured
        pitch: low
  chapters:
    - id: ch01
      title: The House of Straw
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, pigs spoke in rhyme, monkeys chewed tobacco, hens took snuff to make themselves tough, and ducks went quack, quack, quack, O!
        - id: ch01-b02
          speaker: narrator
          text: In those days, an old sow lived with her three little pigs. She had too little to keep them, so she sent them out to seek their fortunes.
        - id: ch01-b03
          speaker: narrator
          text: The first little pig set off and met a man carrying a bundle of straw.
        - id: ch01-b04
          speaker: first_pig
          text: Please, sir, may I have that straw? I want to build myself a house.
        - id: ch01-b05
          speaker: narrator
          text: The man gave him the straw, and the little pig built his house. Before long, a wolf came by and knocked on the door.
        - id: ch01-b06
          speaker: wolf
          text: Little pig, little pig, let me come in.
        - id: ch01-b07
          speaker: first_pig
          text: No, no, by the hair of my chiny chin chin!
        - id: ch01-b08
          speaker: wolf
          text: Then I'll huff, and I'll puff, and I'll blow your house in!
        - id: ch01-b09
          speaker: narrator
          text: The wolf huffed. He puffed. He blew the house in, and then he ate the first little pig.

    - id: ch02
      title: The House of Furze
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The second little pig met a man carrying a bundle of furze.
        - id: ch02-b02
          speaker: second_pig
          text: Please, sir, may I have that furze? I need it to build a house.
        - id: ch02-b03
          speaker: narrator
          text: The man gave him the furze, and the pig built his house. Then the wolf came along.
        - id: ch02-b04
          speaker: wolf
          text: Little pig, little pig, let me come in.
        - id: ch02-b05
          speaker: second_pig
          text: No, no, by the hair of my chiny chin chin!
        - id: ch02-b06
          speaker: wolf
          text: Then I'll puff, and I'll huff, and I'll blow your house in!
        - id: ch02-b07
          speaker: narrator
          text: He huffed and puffed, then puffed and huffed. At last, he blew the house down and ate the second little pig.

    - id: ch03
      title: The House of Bricks
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The third little pig met a man with a load of bricks.
        - id: ch03-b02
          speaker: third_pig
          text: Please, sir, may I have those bricks? I'd like to build a house with them.
        - id: ch03-b03
          speaker: narrator
          text: The man gave him the bricks, and the little pig built his house. Soon the wolf came, just as he had come to the other two pigs.
        - id: ch03-b04
          speaker: wolf
          text: Little pig, little pig, let me come in.
        - id: ch03-b05
          speaker: third_pig
          text: No, no, by the hair of my chiny chin chin!
        - id: ch03-b06
          speaker: wolf
          text: Then I'll huff, and I'll puff, and I'll blow your house in!
        - id: ch03-b07
          speaker: narrator
          text: The wolf huffed and puffed. He huffed and puffed again. He puffed and huffed with all his might, but he could not bring the brick house down.

    - id: ch04
      title: The Turnip Field
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: When the wolf saw that all his huffing and puffing had failed, he tried another way to catch the little pig.
        - id: ch04-b02
          speaker: wolf
          text: Little pig, I know a field where some fine turnips grow.
        - id: ch04-b03
          speaker: third_pig
          text: Where is it?
        - id: ch04-b04
          speaker: wolf
          text: In Mr. Smith's Home-field. Be ready tomorrow morning, and I'll call for you. We can go together and bring back turnips for dinner.
        - id: ch04-b05
          speaker: third_pig
          text: All right, I'll be ready. What time are we going?
        - id: ch04-b06
          speaker: wolf
          text: Six o'clock.
        - id: ch04-b07
          speaker: narrator
          text: The next morning, the little pig rose at five. He went to the field, gathered his turnips, and reached home before the wolf arrived at about six.
        - id: ch04-b08
          speaker: wolf
          text: Little pig, are you ready?
        - id: ch04-b09
          speaker: third_pig
          text: Ready? I've already been there and come home again. I have a fine potful of turnips for dinner!
        - id: ch04-b10
          speaker: narrator
          text: This made the wolf very angry. Still, he meant to get the better of the little pig somehow, so he thought of another plan.

    - id: ch05
      title: The Apple Tree
      blocks:
        - id: ch05-b01
          speaker: wolf
          text: Little pig, I know where there's a fine apple tree.
        - id: ch05-b02
          speaker: third_pig
          text: Where is it?
        - id: ch05-b03
          speaker: wolf
          text: Down at Merry-garden. If you don't trick me this time, I'll come for you at five tomorrow, and we'll gather some apples.
        - id: ch05-b04
          speaker: narrator
          text: The little pig hurried out at four the next morning. He hoped to fetch the apples and return before the wolf came. But Merry-garden was farther away, and he had to climb the tree.
        - id: ch05-b05
          speaker: narrator
          text: Just as he started climbing down, he saw the wolf coming. The sight frightened him very much.
        - id: ch05-b06
          speaker: wolf
          text: Well, little pig! You got here before me again. Are those apples good?
        - id: ch05-b07
          speaker: third_pig
          text: Yes, they're very good. I'll toss one down to you.
        - id: ch05-b08
          speaker: narrator
          text: The little pig threw the apple far away. While the wolf went to pick it up, the pig jumped from the tree and ran home.

    - id: ch06
      title: The Fair and the Chimney
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: The next day, the wolf came back to the little pig's house.
        - id: ch06-b02
          speaker: wolf
          text: Little pig, there's a fair at Shanklin this afternoon. Will you come with me?
        - id: ch06-b03
          speaker: third_pig
          text: Oh, yes, I'll go. What time will you be ready?
        - id: ch06-b04
          speaker: wolf
          text: Three o'clock.
        - id: ch06-b05
          speaker: narrator
          text: As usual, the little pig left before the appointed time. He reached the fair and bought a butter churn. On his way home with it, he saw the wolf coming and did not know what to do.
        - id: ch06-b06
          speaker: narrator
          text: He climbed inside the churn to hide. That made it tip over and roll down the hill with him still inside. The great round thing frightened the wolf so badly that he ran home without ever reaching the fair.
        - id: ch06-b07
          speaker: narrator
          text: Later, the wolf went to the little pig's house. He told the pig how a great round thing had rolled past him on the hill and given him a terrible fright.
        - id: ch06-b08
          speaker: third_pig
          text: Ha! So I was the one who frightened you. I'd bought a butter churn at the fair. When I saw you, I climbed inside it and rolled down the hill.
        - id: ch06-b09
          speaker: narrator
          text: Now the wolf was angrier than ever. He declared that he would eat the little pig, and he began climbing down the chimney after him.
        - id: ch06-b10
          speaker: narrator
          text: The little pig saw what the wolf meant to do. He hung a pot full of water over the fire and made the flames blaze high.
        - id: ch06-b11
          speaker: narrator
          text: Just as the wolf came down the chimney, the pig lifted the pot's cover. The wolf fell straight in. In an instant, the pig put the cover back on, boiled the wolf, and ate him for supper.
        - id: ch06-b12
          speaker: narrator
          text: And the little pig lived happily ever after.
