audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容讲述古老童话，带着一本正经的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中
    molly_whuppie:
      display_name: 莫莉·伍比
      tts:
        delivery: 聪明大胆，遇到危险仍机敏利落
        timbre: 年轻清脆
        pace: 中等偏快
        pitch: 中高
    giant:
      display_name: 巨人
      tts:
        delivery: 粗暴凶狠，发怒时震耳逼人
        timbre: 粗重洪亮
        pace: 中慢
        pitch: 低
    giant_wife:
      display_name: 巨人的妻子
      tts:
        delivery: 心软而直率，好奇时急切
        timbre: 成熟温厚
        pace: 中等
        pitch: 中
    king:
      display_name: 国王
      tts:
        delivery: 威严沉着，许诺时清楚果断
        timbre: 稳重浑厚
        pace: 中等偏慢
        pitch: 中低
  chapters:
    - id: ch01
      title: 林中巨人的屋子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "从前，一对夫妻生了太多孩子，没法给他们弄到足够的肉吃，只好把三个最小的女儿丢在树林里。三个姑娘走了很久，始终见不到人家。天越来越黑，她们也饿坏了。好不容易望见一点灯光，她们赶过去，找到一幢房子，便上前敲门。"
        - id: ch01-b02
          speaker: giant_wife
          text: "你们想要什么？"
        - id: ch01-b03
          speaker: molly_whuppie
          text: "求您让我们进去吧，再给我们一点吃的。"
        - id: ch01-b04
          speaker: giant_wife
          text: "我不能让你们进来。我男人是个巨人，他回家看见你们，会把你们杀掉的。"
        - id: ch01-b05
          speaker: molly_whuppie
          text: "求求您了，只让我们待一小会儿。等他回来以前，我们一定离开。"
        - id: ch01-b06
          speaker: narrator
          text: "姑娘们苦苦哀求，女人终于让她们进屋，领她们坐在炉火前，又端来牛奶和面包。姑娘们才刚开始吃，门上猛然响起重重的敲击声。一个可怕的声音从外面传来。"
        - id: ch01-b07
          speaker: giant
          text: "咿，呀，嗬，哼！我闻见了凡人的血腥气。老婆，你这儿藏了谁？"
        - id: ch01-b08
          speaker: giant_wife
          text: "唉，不过是三个又冷又饿的穷姑娘，她们马上就走。当家的，你可不许碰她们。"
        - id: ch01-b09
          speaker: narrator
          text: "巨人没说什么，只顾吃完一大顿晚餐，又命令姑娘们留下过夜。他自己也有三个女儿，便让六个姑娘同睡一张床。"
        - id: ch01-b10
          speaker: narrator
          text: "三个外来姑娘里，最小的叫莫莉·伍比。莫莉很聪明。睡觉以前，她看见巨人把草绳套在她和两个姐姐的脖子上，却给自己的三个女儿戴上金链。她留心醒着，等所有人都睡熟了，便悄悄下床。"
        - id: ch01-b11
          speaker: narrator
          text: "莫莉解下自己和姐姐颈上的草绳，又取下巨人女儿们的金链。她把草绳套给那三个姑娘，把金链戴到自己和姐姐颈上，然后才躺回床上。"
        - id: ch01-b12
          speaker: narrator
          text: "到了半夜，巨人握着一根大木棒起了身。屋里一片漆黑，他只能伸手摸索，找到三个戴草绳的脖子。他把自己的女儿拖下床，扔到地板上，用木棒一通猛打，直到把她们都打死了。巨人还以为事情办得漂亮，倒头又睡。"
        - id: ch01-b13
          speaker: narrator
          text: "莫莉知道自己和姐姐该赶快逃了。她叫醒两个姐姐，嘱咐她们千万别出声，三个人便悄悄溜出屋子。她们都平安逃了出去，跑啊跑，一刻也没有停，一直跑到天亮。"
    - id: ch02
      title: 宝剑和钱袋
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "天亮时，姐妹三人看见前面出现了一幢宏伟的房子，原来是国王的宫殿。莫莉进去，把全部遭遇讲给国王听。"
        - id: ch02-b02
          speaker: king
          text: "莫莉，你真是个聪明姑娘，事情办得很漂亮。要是你肯回去，把挂在巨人床头的宝剑偷来，事情就办得更漂亮了。那样，我就让你大姐嫁给我的大儿子。"
        - id: ch02-b03
          speaker: molly_whuppie
          text: "我愿意试一试。"
        - id: ch02-b04
          speaker: narrator
          text: "莫莉一路回到巨人的屋子，设法偷偷溜进去，藏在床底下。巨人回家以后，先吃下一顿丰盛的晚餐，才上床睡觉。莫莉耐心等到他的鼾声响起来，这才从床底爬出，探身越过巨人，取下挂在床头的宝剑。"
        - id: ch02-b05
          speaker: narrator
          text: "可宝剑刚从床上方抽出来，就当啷响了一声。巨人猛地跳起来。莫莉抓着剑冲出门去，巨人在后面紧追。他们一直跑到独发桥边。莫莉过了桥，巨人却过不去。"
        - id: ch02-b06
          speaker: giant
          text: "莫莉·伍比，你这个祸事缠身的丫头！再也别来了！"
          emotion: angry
        - id: ch02-b07
          speaker: molly_whuppie
          text: "老东西，我还要来两回，还要再来西班牙！"
        - id: ch02-b08
          speaker: narrator
          text: "莫莉把宝剑交给国王，大姐便嫁给了国王的大儿子。"
        - id: ch02-b09
          speaker: king
          text: "莫莉，你这回办得很好。要是你再去把巨人枕头底下的钱袋偷来，我就让你二姐嫁给我的二儿子。"
        - id: ch02-b10
          speaker: molly_whuppie
          text: "我再去试试。"
        - id: ch02-b11
          speaker: narrator
          text: "莫莉再次动身去巨人的屋子。她偷偷溜进去，仍旧藏到床底，等着巨人回家。巨人吃过晚餐，睡得鼾声震天。莫莉这才钻出来，把手伸到他的枕头下面，掏出了钱袋。可她刚要走出屋子，巨人就醒了，立刻追赶她。"
        - id: ch02-b12
          speaker: narrator
          text: "莫莉在前面跑，巨人在后面追，又一路追到独发桥。莫莉过得去，巨人还是过不去。"
        - id: ch02-b13
          speaker: giant
          text: "莫莉·伍比，你这个祸事缠身的丫头！再也别来了！"
          emotion: angry
        - id: ch02-b14
          speaker: molly_whuppie
          text: "老东西，我还要来一回，还要再来西班牙！"
        - id: ch02-b15
          speaker: narrator
          text: "莫莉把钱袋交给国王，二姐便嫁给了国王的二儿子。"
    - id: ch03
      title: 巨人抓住了莫莉
      blocks:
        - id: ch03-b01
          speaker: king
          text: "莫莉，你确实聪明。要是你还能把巨人手指上的戒指偷来，我就把自己的小儿子许配给你。"
        - id: ch03-b02
          speaker: molly_whuppie
          text: "我愿意去试。"
        - id: ch03-b03
          speaker: narrator
          text: "莫莉第三次回到巨人的屋子，仍旧藏在床底。巨人很快回来了，吃完一顿丰盛的晚餐，便上床睡觉。不一会儿，他就鼾声如雷。"
        - id: ch03-b04
          speaker: narrator
          text: "莫莉爬出来，探身抓住巨人的手。她拔了又拔，好不容易才把戒指取下来。可戒指刚一离开手指，巨人便醒了，一把攥住她的手。"
        - id: ch03-b05
          speaker: giant
          text: "莫莉·伍比，这回我抓到你了！你害我这么惨。要是换成我这样害你，你会怎么处置我？"
          emotion: angry
        - id: ch03-b06
          speaker: molly_whuppie
          text: "我会把你塞进口袋，再把猫、狗、针线和剪刀放到你身边。我会把口袋挂在墙上，去树林里挑一根能找到的最粗的棍子。回来以后，我就把你取下来，一直打到你断气。"
        - id: ch03-b07
          speaker: giant
          text: "好啊，莫莉，那我就照你说的办。"
        - id: ch03-b08
          speaker: narrator
          text: "巨人找来一只口袋，把莫莉、猫、狗、针线和剪刀全装进去，又把口袋挂到墙上。随后，他独自去了树林，要挑一根棍子。"
    - id: ch04
      title: 口袋里的奇景
      blocks:
        - id: ch04-b01
          speaker: molly_whuppie
          text: "哎呀，你要是看得见我看见的东西就好了。"
        - id: ch04-b02
          speaker: giant_wife
          text: "咦，莫莉，你到底看见什么了？"
        - id: ch04-b03
          speaker: narrator
          text: "莫莉没有回答，只把那句话又唱了一遍。"
        - id: ch04-b04
          speaker: molly_whuppie
          text: "哎呀，你要是看得见我看见的东西就好了！"
        - id: ch04-b05
          speaker: narrator
          text: "巨人的妻子越听越好奇，苦苦央求莫莉把自己拉进口袋，好亲眼看看莫莉所见的东西。莫莉拿起剪刀，在口袋上剪开一个洞，又拿好针线，从洞里跳到地上。接着，她帮巨人的妻子钻进口袋，再用针线把洞仔细缝好。"
        - id: ch04-b06
          speaker: narrator
          text: "巨人的妻子什么也没看见，便嚷着要出来。莫莉根本不理，只藏到门后。"
    - id: ch05
      title: 第三次越过独发桥
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "巨人回来了，手里提着一棵粗壮的大树。他取下口袋，抡起来就打。"
        - id: ch05-b02
          speaker: giant_wife
          text: "当家的，是我啊！"
          emotion: fearful
        - id: ch05-b03
          speaker: narrator
          text: "可是，口袋里的狗汪汪叫，猫也喵喵叫，巨人没有认出妻子的声音。这时，莫莉从门后跑了出来。巨人一看见她，马上追了过去。"
        - id: ch05-b04
          speaker: narrator
          text: "莫莉在前面跑，巨人在后面追，第三次来到独发桥边。莫莉越过了桥，巨人仍旧只能站在另一边。"
        - id: ch05-b05
          speaker: giant
          text: "莫莉·伍比，你这个祸事缠身的丫头！再也别来了！"
          emotion: angry
        - id: ch05-b06
          speaker: molly_whuppie
          text: "再也不来了，老东西！我再也不会来西班牙了。"
        - id: ch05-b07
          speaker: narrator
          text: "莫莉把戒指交给国王，嫁给了国王的小儿子。从此以后，她再也没有见过那个巨人。"
