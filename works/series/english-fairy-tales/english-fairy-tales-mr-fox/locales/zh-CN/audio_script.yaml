audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容讲述古老童话，带着一本正经的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中
    lady_mary:
      display_name: 玛丽小姐
      tts:
        delivery: 聪慧勇敢，表面镇定，揭露真相时坚定有力
        timbre: 清亮柔和
        pace: 中等
        pitch: 中高
    mr_fox:
      display_name: 狐狸先生
      tts:
        delivery: 起初殷勤从容，受到追问时竭力维持镇定
        timbre: 低沉圆润
        pace: 稍慢
        pitch: 中低
  chapters:
    - id: ch01
      title: 林中的城堡
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "玛丽小姐年轻又美丽。她有两个哥哥，追求她的人多得数不清。可这些人里，最勇敢、最英俊潇洒的还是狐狸先生。玛丽小姐回父亲的乡间宅邸时认识了他。谁也不清楚狐狸先生的来历，只知道他很勇敢，也显然十分富有。玛丽小姐的追求者虽多，心里却只有他。最后，两人说定要结婚。"
        - id: ch01-b02
          speaker: lady_mary
          text: "我们结婚以后，要住在哪里呢？"
        - id: ch01-b03
          speaker: narrator
          text: "狐狸先生向她描述了自己的城堡，也告诉她城堡在哪里。奇怪的是，他从没请玛丽小姐或她的哥哥们去看看。婚期将近的一天，两个哥哥出了门，狐狸先生又说自己有事，要离开一两天。玛丽小姐便独自去找他的城堡。她寻觅了许久，终于在树林里找到了。那是一座坚固的华宅，四周有高墙，还有一道深壕。大门上写着：大胆向前，大胆向前。"
        - id: ch01-b04
          speaker: narrator
          text: "大门敞开着，玛丽小姐走了进去，里面一个人也没有。屋门上又写着：大胆向前，大胆向前，可别太过大胆。她还是继续往里走。进了大厅，她登上宽阔的楼梯，来到楼廊的一扇门前。这里的警告更长了：大胆向前，大胆向前，可别太过大胆，否则连心头的热血也要冷成寒潭。"
    - id: ch02
      title: 血腥密室
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "玛丽小姐偏偏胆量过人。她推开门，只见满屋都是美丽姑娘的尸首和骸骨，个个沾满鲜血。这个可怕的地方再也不能久留了。她赶紧关上门，穿过楼廊，正要走下楼梯，再穿过大厅逃出去，忽然透过窗户看见狐狸先生。他从大门那边走来，身后还拖着一个美丽的年轻姑娘，一路走向屋门。"
        - id: ch02-b02
          speaker: narrator
          text: "玛丽小姐飞奔下楼，刚好赶在狐狸先生进门前，藏到一只大木桶后面。狐狸先生拖着那个可怜的姑娘进来了，姑娘好像已经昏了过去。他们走到离玛丽小姐很近的地方时，狐狸先生看见姑娘手指上的钻石戒指闪闪发亮，便伸手去摘。可是戒指卡得死紧，他怎么用力也摘不下来。狐狸先生破口咒骂，拔出长剑，高高举起，一剑砍掉了姑娘的手。"
        - id: ch02-b03
          speaker: narrator
          text: "断手弹到半空，世上有那么多地方可落，却偏偏落进玛丽小姐怀里。狐狸先生四下看了看，却没想到木桶后面也该找一找。最后，他拖着姑娘上了楼，把她带进那间血腥密室。玛丽小姐听见他走过楼廊，立刻从木桶后爬出来，溜出屋门，穿过大门，拼尽全力跑回了家。"
    - id: ch03
      title: 早餐桌上的梦
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "第二天正是两人签订婚约的日子。签约前，家里摆了一桌丰盛的早餐。狐狸先生坐在玛丽小姐对面，望着她苍白的脸。"
        - id: ch03-b02
          speaker: mr_fox
          text: "亲爱的，你今天早上怎么这样苍白？"
        - id: ch03-b03
          speaker: lady_mary
          text: "我昨夜没有睡好，做了些可怕的梦。"
        - id: ch03-b04
          speaker: mr_fox
          text: "梦里的事往往都要反着来。不过，你还是讲给我们听听吧。听着你甜美的声音，时间很快就会过去，幸福的时刻也就到了。"
        - id: ch03-b05
          speaker: lady_mary
          text: "我梦见昨天早晨去了你的城堡。我在树林里找到了它，那里有高墙，还有深壕。大门上的字叫我大胆向前。"
        - id: ch03-b06
          speaker: mr_fox
          text: "没有这回事，从前也没有这回事。"
        - id: ch03-b07
          speaker: lady_mary
          text: "我走到屋门前，上面的字还是叫我大胆向前，却又警告我别太过大胆。"
        - id: ch03-b08
          speaker: mr_fox
          text: "没有这回事，从前也没有这回事。"
        - id: ch03-b09
          speaker: lady_mary
          text: "后来我上了楼，走进一条楼廊。尽头有一扇门，门上的话还要可怕。它说，大胆向前，可别太过大胆，否则心头的热血也要冷成寒潭。"
        - id: ch03-b10
          speaker: mr_fox
          text: "没有这回事，从前也没有这回事。"
    - id: ch04
      title: 手与戒指
      blocks:
        - id: ch04-b01
          speaker: lady_mary
          text: "后来……后来我推开了那扇门。房间里尽是可怜女人的尸首和骸骨，全都沾着她们自己的鲜血。"
        - id: ch04-b02
          speaker: mr_fox
          text: "没有这回事，从前也没有这回事。上帝也绝不会容许这种事发生。"
        - id: ch04-b03
          speaker: lady_mary
          text: "接着，我梦见自己飞奔着穿过楼廊。刚要下楼梯，我就看见你，狐狸先生。你朝大厅门口走来，身后拖着一个衣着华贵、美丽又可怜的年轻姑娘。"
        - id: ch04-b04
          speaker: mr_fox
          text: "没有这回事，从前也没有这回事。上帝也绝不会容许这种事发生。"
        - id: ch04-b05
          speaker: lady_mary
          text: "我赶紧奔下楼，刚好躲到一只大木桶后面。这时你拖着那姑娘的胳膊进来了。经过我身边时，你想摘下她的钻石戒指，可怎么也摘不下来。于是，在梦里，我看见你拔出长剑，砍掉了那可怜姑娘的手，只为了拿到戒指。"
        - id: ch04-b06
          speaker: mr_fox
          text: "没有这回事，从前也没有这回事。上帝也绝不会容许这种事发生。"
        - id: ch04-b07
          speaker: narrator
          text: "狐狸先生从座位上站起来，正要再说些什么，玛丽小姐却高声喊了出来。"
        - id: ch04-b08
          speaker: lady_mary
          text: "可这件事现在是真的，从前也是真的！手和戒指都在这里，可以给你作证。"
        - id: ch04-b09
          speaker: narrator
          text: "她从衣襟里取出那只姑娘的断手，笔直地指向狐狸先生。她的哥哥们和朋友们立刻拔出长剑，把狐狸先生斩成了一千块。"
