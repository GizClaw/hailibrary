audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and unhurried, with the steady rhythm of an old fireside tale
        timbre: clear and gently weathered
        pace: measured
        pitch: medium
    lady_mary:
      display_name: Lady Mary
      tts:
        delivery: poised and clear, gathering quiet courage as danger closes in
        timbre: bright and composed
        pace: measured
        pitch: medium-high
    mr_fox:
      display_name: Mr. Fox
      tts:
        delivery: polished and confident, with menace beneath the courtesy
        timbre: smooth and dark
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Castle in the Woods
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Lady Mary was young and fair. She had two brothers and more suitors than she could count. The bravest and most gallant of them was Mr. Fox, whom she met while staying at her father's country house. No one knew who he really was. Still, he seemed brave and rich, and he was the only one Lady Mary cared for.
        - id: ch01-b02
          speaker: narrator
          text: In time, they agreed to marry. Lady Mary asked where they would live, and Mr. Fox told her about his castle and where to find it. Yet, strangely, he never invited her or her brothers to see the place.
        - id: ch01-b03
          speaker: narrator
          text: A few days before the wedding, Lady Mary's brothers went out. Mr. Fox had also gone away on business, or so he said. Lady Mary decided to visit his castle alone. She searched for a long while before she found it in the woods. It was a fine, strong house, surrounded by high walls and a deep moat.
        - id: ch01-b04
          speaker: narrator
          text: "At the open gateway, she saw these words written above her: “Be bold, be bold.” She passed through, but no one was there."
        - id: ch01-b05
          speaker: narrator
          text: "Over the doorway, another warning waited: “Be bold, be bold, but not too bold.” Lady Mary went inside anyway. She crossed the hall, climbed the broad stairs, and reached a door at the end of the gallery."
        - id: ch01-b06
          speaker: narrator
          text: "Above that door were the words: “Be bold, be bold, but not too bold, lest your heart's blood should run cold.”"
        - id: ch01-b07
          speaker: narrator
          text: Lady Mary was brave. She opened the door. Inside were the bodies and skeletons of beautiful young women, all stained with blood.

    - id: ch02
      title: The Bloody Chamber
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Lady Mary knew she had to leave that horrible place at once. She shut the door, hurried back along the gallery, and was about to go down the stairs when she looked through a window.
        - id: ch02-b02
          speaker: narrator
          text: There was Mr. Fox. He was dragging a beautiful young woman from the gateway toward the house. Lady Mary rushed downstairs and slipped behind a cask just before he entered. The poor young woman he pulled along seemed to have fainted.
        - id: ch02-b03
          speaker: narrator
          text: As Mr. Fox came near the cask, a diamond ring flashed on the young woman's finger. He tried to pull it free, but the ring was stuck. Mr. Fox cursed and swore. Then he drew his sword, lifted it, and struck the woman's hand.
        - id: ch02-b04
          speaker: narrator
          text: The blade cut the hand clean off. Up it flew, and of all the places it could have fallen, it landed right in Lady Mary's lap.
        - id: ch02-b05
          speaker: narrator
          text: Mr. Fox searched for the hand, but he never thought to look behind the cask. At last, he gave up and dragged the young woman upstairs into the Bloody Chamber.
        - id: ch02-b06
          speaker: narrator
          text: Lady Mary listened until he had crossed the gallery. Then she crept from her hiding place, slipped out through the door and the gateway, and ran home as fast as she could.

    - id: ch03
      title: Lady Mary's Dream
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The very next day, Lady Mary and Mr. Fox were to sign their marriage contract. A splendid breakfast was served first. Mr. Fox sat across the table from Lady Mary and studied her face.
        - id: ch03-b02
          speaker: mr_fox
          text: My dear, you look so pale this morning.
        - id: ch03-b03
          speaker: lady_mary
          text: I slept badly last night. I had terrible dreams.
        - id: ch03-b04
          speaker: mr_fox
          text: Dreams mean the opposite of what they show us. But tell us yours. Your sweet voice will help the time pass until our happy hour arrives.
        - id: ch03-b05
          speaker: lady_mary
          text: I dreamed that yesterday morning I went to your castle. I found it in the woods, with high walls and a deep moat. Above the gateway, the words said, “Be bold, be bold.”
        - id: ch03-b06
          speaker: mr_fox
          text: It isn't true, and it never was true.
        - id: ch03-b07
          speaker: lady_mary
          text: Then I reached the doorway. Over it, I read, “Be bold, be bold, but not too bold.”
        - id: ch03-b08
          speaker: mr_fox
          text: It isn't true, and it never was true.
        - id: ch03-b09
          speaker: lady_mary
          text: I climbed the stairs and came to a gallery. At the far end stood a door. On it were the words, “Be bold, be bold, but not too bold, lest your heart's blood should run cold.”
        - id: ch03-b10
          speaker: mr_fox
          text: It isn't true, and it never was true.
        - id: ch03-b11
          speaker: lady_mary
          text: Then... then I opened that door. The room was full of the bodies and skeletons of poor dead women, all stained with blood.
          emotion: fearful
        - id: ch03-b12
          speaker: mr_fox
          text: It isn't true, and it never was true. God forbid that it ever should be.
        - id: ch03-b13
          speaker: lady_mary
          text: Next, I dreamed I ran back along the gallery. As I reached the stairs, I saw you coming toward the hall door. You were dragging a poor young woman behind you. She was rich and beautiful.
        - id: ch03-b14
          speaker: mr_fox
          text: It isn't true, and it never was true. God forbid that it ever should be.

    - id: ch04
      title: The Hand and the Ring
      blocks:
        - id: ch04-b01
          speaker: lady_mary
          text: I dreamed I raced downstairs and hid behind a cask just as you came in, dragging the young woman by her arm. When you passed me, I saw you trying to pull off her diamond ring. You couldn't do it. Then, in my dream, you drew your sword and hacked off her hand to get the ring.
        - id: ch04-b02
          speaker: mr_fox
          text: It isn't true, and it never was true. God forbid that it ever should be.
        - id: ch04-b03
          speaker: narrator
          text: Mr. Fox rose from his chair and began to say something more. But Lady Mary cried out over him.
        - id: ch04-b04
          speaker: lady_mary
          text: But it is true, and it was true! Here are the hand and the ring to prove it!
        - id: ch04-b05
          speaker: narrator
          text: She pulled the young woman's hand from inside her dress and pointed it straight at Mr. Fox.
        - id: ch04-b06
          speaker: narrator
          text: At once, Lady Mary's brothers and her friends drew their swords. They cut Mr. Fox into a thousand pieces.
