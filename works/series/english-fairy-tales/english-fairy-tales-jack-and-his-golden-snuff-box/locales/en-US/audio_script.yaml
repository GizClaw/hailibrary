  chapters:
    - id: ch01
      title: Jack Leaves the Forest
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, and a very good time it was, though it was not in my time, or your time, or anyone else's time, an old man and an old woman lived deep in a great forest with their only son, Jack. The forest was the only home the boy had ever known.
        - id: ch01-b02
          speaker: narrator
          text: Jack had never seen another person besides his father and mother. Still, he owned plenty of books, and they told him there were other people in the world. He read every day. Whenever he found a story about pretty young women, he could hardly bear not knowing what it was like to see one.
        - id: ch01-b03
          speaker: narrator
          text: One day, while his father was away cutting wood, Jack told his mother he wanted to seek his living in another country and see someone besides his parents.
        - id: ch01-b04
          speaker: jack
          text: There is nothing here for me to see but great trees on every side. If I stay, I may lose my senses before I ever see the world.
        - id: ch01-b05
          speaker: narrator
          text: His poor mother thought about what would be best for him.
        - id: ch01-b06
          speaker: mother
          text: Well, my poor boy, if you truly want to leave, then you had better go. God be with you. But wait. Shall I make you a little cake with my blessing, or a big cake with my curse?
        - id: ch01-b07
          speaker: jack
          text: Oh, make it a big cake. I may be hungry on the road.
        - id: ch01-b08
          speaker: narrator
          text: So his mother baked the big cake he had chosen. When it was time for him to leave, she climbed onto the roof of the house. From there, she cursed him for as long as he remained in sight, until the road carried him away.
        - id: ch01-b09
          speaker: narrator
          text: Before long, Jack met his father and told him the same thing he had told his mother.
        - id: ch01-b10
          speaker: father
          text: Where are you bound, my poor boy? I am sorry to see you leave, but if your mind is made up, it is best that you go.
        - id: ch01-b11
          speaker: narrator
          text: Jack had not gone far when his father called him back. The old man took a golden snuff-box from his pocket.
        - id: ch01-b12
          speaker: father
          text: Take this little box and keep it in your pocket. Whatever happens, do not open it until you are close to death.
        - id: ch01-b13
          speaker: narrator
          text: Away Jack went along the road. He walked until his legs were tired and hunger came over him. Before long, he had eaten every bit of the great cake. Then night closed around him, and it grew so dark that he could scarcely make out the way ahead.
        - id: ch01-b14
          speaker: narrator
          text: Far ahead, he spotted a light. He followed it to a house, found the back door, and knocked. A maid-servant answered.
        - id: ch01-b15
          speaker: servant
          text: What do you need at this hour?
        - id: ch01-b16
          speaker: jack
          text: Night has caught me on the road. I only need somewhere to sleep.
        - id: ch01-b17
          speaker: narrator
          text: The maid brought him into the warmth of the fire. She set plenty before him to eat and drink, with good meat, bread, and beer. While Jack sat eating in the back kitchen, the gentleman's young daughter came down to look at the stranger. She loved him as soon as she saw him, and Jack loved her too.
        - id: ch01-b18
          speaker: young_lady
          text: Father, there is a handsome young man in the back kitchen.
        - id: ch01-b19
          speaker: narrator
          text: Her father came at once and questioned Jack about the work he could do. Foolish Jack claimed he could do anything. He only meant any little odd job around the house.
        - id: ch01-b20
          speaker: jack
          text: I can turn my hand to anything you ask.
        - id: ch01-b21
          speaker: gentleman
          text: Then by eight tomorrow morning, make a great lake before my mansion, with the largest warships sailing on it. One ship must fire a royal salute, and its last shot must break a leg of the bed where my daughter sleeps. Fail, and your life is forfeit.
        - id: ch01-b22
          speaker: jack
          text: Very well.

    - id: ch02
      title: Three Impossible Tasks
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Jack went away to his bed as if there were nothing more to say. He quietly said his prayers and fell asleep. He did not wake until it was nearly eight in the morning. There was hardly time even to think, and then the memory of his father's little golden box came rushing back.
        - id: ch02-b02
          speaker: jack
          text: I have never been nearer death than I am now.
        - id: ch02-b03
          speaker: narrator
          text: He pulled the box from his pocket and opened it. Three little red men hopped out.
        - id: ch02-b04
          speakers: [red_man_1, red_man_2, red_man_3]
          ensemble: chorus
          text: What would you have us do?
        - id: ch02-b05
          speaker: jack
          text: Put a great lake before this mansion, with some of the largest warships in the world. One of them must fire a royal salute, and the last shot must break a leg of the young lady's bed.
        - id: ch02-b06
          speakers: [red_man_1, red_man_2, red_man_3]
          ensemble: chorus
          text: It shall be done. Go back to sleep.
        - id: ch02-b07
          speaker: narrator
          text: Jack had barely managed to give the little men their orders when the clock struck eight. Bang, bang went one of the mightiest warships on the new lake. The sound made Jack leap straight out of bed and hurry to the window. After spending his whole life among nothing but his parents and the trees, he could hardly believe the wondrous sight before him.
        - id: ch02-b08
          speaker: narrator
          text: He dressed, said his prayers, and came downstairs laughing. He was proud that the work had been done so well.
        - id: ch02-b09
          speaker: gentleman
          text: Young man, you are remarkably clever. Come and eat breakfast. Complete two more tasks, and you may marry my daughter.
        - id: ch02-b10
          speaker: narrator
          text: Jack ate and stole a good look at the young lady. She looked right back at him.
        - id: ch02-b11
          speaker: narrator
          text: The gentleman's next demand was that every great tree for miles around be felled by eight the following morning. Once again, Jack had an impossible task before him. But when morning came, the work was finished exactly as required, and the gentleman was thoroughly pleased with what he saw.
        - id: ch02-b12
          speaker: gentleman
          text: One last task. Build me a great castle on twelve golden pillars. Regiments of soldiers must march there and perform their drill. At eight, their commanding officer must order them to shoulder arms.
        - id: ch02-b13
          speaker: jack
          text: Very well.
        - id: ch02-b14
          speaker: narrator
          text: The third and final morning arrived, and the great feat was complete. The castle stood high on its twelve golden pillars, the regiments performed their drill, and the officer gave his order at eight. So Jack received the young daughter in marriage. But, oh dear, worse was still to come.

    - id: ch03
      title: The Stolen Castle
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The gentleman arranged a great hunting party. He invited gentlemen from all around the country, both to hunt and to admire the castle. Jack now had a beautiful horse and a scarlet hunting suit of his own.
        - id: ch03-b02
          speaker: narrator
          text: That morning, after Jack changed for the hunt, his valet put away the clothes he had taken off. Jack had mistakenly left the golden snuff-box in a waistcoat pocket. The valet found it and opened it, and out hopped the three little red men.
        - id: ch03-b03
          speakers: [red_man_1, red_man_2, red_man_3]
          ensemble: chorus
          text: What would you have us do?
        - id: ch03-b04
          speaker: valet
          text: Move this castle far away from here, across the sea.
        - id: ch03-b05
          speaker: red_man_1
          text: Do you wish to go with it?
        - id: ch03-b06
          speaker: valet
          text: Yes, I do.
        - id: ch03-b07
          speakers: [red_man_1, red_man_2, red_man_3]
          ensemble: chorus
          text: Then climb aboard.
        - id: ch03-b08
          speaker: narrator
          text: Away they went, far across the great sea.
        - id: ch03-b09
          speaker: narrator
          text: The grand hunting party returned expecting to find the castle on its twelve golden pillars. Instead, it had vanished completely. All the gentlemen who had not seen it before were bitterly disappointed. They believed poor foolish Jack had deceived them, and he was threatened with the loss of his beautiful young wife.
        - id: ch03-b10
          speaker: narrator
          text: At last, the gentleman made an agreement with him. Jack would have a year and a day to find the castle. So Jack set off with a good horse and money in his pocket.

    - id: ch04
      title: The Kings of Mice and Frogs
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Jack went looking for his missing castle over hills and dales, across valleys and mountains, through woolly woods and over sheepwalks. On and on he rode, farther than I can tell you, or ever mean to tell you. At last, after all that wandering, he reached the country where the King of every little mouse in the world had his palace.
        - id: ch04-b02
          speaker: narrator
          text: A mouse stood guard at the gate leading to the palace and tried to stop him.
        - id: ch04-b03
          speaker: jack
          text: Where does your King live? I would like to see him.
        - id: ch04-b04
          speaker: narrator
          text: The sentry sent another mouse to show Jack the way. When the King saw him, he welcomed him inside and asked where he was going.
        - id: ch04-b05
          speaker: narrator
          text: Jack told the whole truth. His great castle had been stolen, and he had a year and a day to find it.
        - id: ch04-b06
          speaker: jack
          text: Have you heard anything about my missing castle?
        - id: ch04-b07
          speaker: mouse_king
          text: No, but I rule all the little mice in the world. In the morning I will call them together. Perhaps one of them has seen it.
        - id: ch04-b08
          speaker: narrator
          text: The Mouse King gave Jack a good meal that evening and a bed for the night. In the morning, Jack went out to the fields beside him. The King called together every mouse under his rule and asked them all whether they had seen a great and beautiful castle standing on golden pillars.
        - id: ch04-b09
          speakers: [mouse_sentry, mouse_2, mouse_3]
          ensemble: chorus
          text: No, none of us has seen it.
        - id: ch04-b10
          speaker: mouse_king
          text: I have two brothers. One rules all the frogs. The eldest rules every bird in the world. Perhaps they know where your castle is.
        - id: ch04-b11
          speaker: mouse_king
          text: Leave your horse with me until you return, and ride one of my finest. Take this cake to my brother, so he will know who sent you. Tell him I am well and would dearly like to see him.
        - id: ch04-b12
          speaker: narrator
          text: Jack and the King shook hands. As Jack passed through the gate, the mouse sentry asked to come along.
        - id: ch04-b13
          speaker: mouse_sentry
          text: May I go with you?
        - id: ch04-b14
          speaker: jack
          text: No. If I take you, I will get into trouble with the King.
        - id: ch04-b15
          speaker: mouse_sentry
          text: You had better let me come. Someday I may help you when you least expect it.
        - id: ch04-b16
          speaker: jack
          text: Then jump up.
        - id: ch04-b17
          speaker: narrator
          text: The little mouse ran up the horse's leg and made it dance. Jack tucked him safely into his pocket, wished the King good morning, and began the first long day of his journey.
        - id: ch04-b18
          speaker: narrator
          text: At last, Jack came to the frogs' country. A frog sentry stood at the gate with a gun on his shoulder and tried to hold him back. Once Jack said he wished to see the King, the frog let him pass.
        - id: ch04-b19
          speaker: narrator
          text: The King came to the door and asked Jack's business. Jack told him the story from beginning to end.
        - id: ch04-b20
          speaker: frog_king
          text: Well, well. Come inside.
        - id: ch04-b21
          speaker: narrator
          text: The Frog King treated him well that night. In the morning, the King made a very funny sound, and every frog in the world gathered around. He asked whether any of them knew of a castle standing on twelve golden pillars.
        - id: ch04-b22
          speakers: [frog_sentry, frog_2, frog_3]
          ensemble: chorus
          text: Kro-kro, kro-kro! No, we have neither seen it nor heard of it.
        - id: ch04-b23
          speaker: narrator
          text: Jack was given another horse and another cake to carry to the eldest brother, the King of all the birds. As Jack rode through the gate, the frog sentry asked to join him.
        - id: ch04-b24
          speaker: frog_sentry
          text: Will you take me with you, Jack?
        - id: ch04-b25
          speaker: narrator
          text: Jack refused at first, but the frog kept asking.
        - id: ch04-b26
          speaker: jack
          text: All right, jump up.
        - id: ch04-b27
          speaker: narrator
          text: Jack placed the frog in his other waistcoat pocket and set off again.

    - id: ch05
      title: The Eagle and the Golden Box
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: This time, the great journey was three times as long as the one before it. Still Jack rode on until he finally reached the birds' country. A fine bird was standing sentry there. Jack passed the guard and went on his way, and the bird never spoke a single word to him.
        - id: ch05-b02
          speaker: narrator
          text: Jack met the King of the Birds and told him everything about the stolen castle.
        - id: ch05-b03
          speaker: bird_king
          text: In the morning, my birds will tell us whether any of them knows where it is.
        - id: ch05-b04
          speaker: narrator
          text: Jack stabled his horse, ate, and went to bed. The next morning, he followed the King into a field. The King gave a strange call, and all the birds in the world came flying to him. He asked whether they had seen the fine castle.
        - id: ch05-b05
          speakers: [bird_sentry, bird_2, bird_3]
          ensemble: chorus
          text: No, none of us has seen it.
        - id: ch05-b06
          speaker: bird_king
          text: Then where is the great bird?
        - id: ch05-b07
          speaker: narrator
          text: The great bird had not answered the summons, so everyone waited. A long time passed with no sign of him. At last, the King sent two little birds high into the sky to whistle for the eagle and tell him to make all possible haste. Finally, the eagle appeared, covered in perspiration from his hurried flight.
        - id: ch05-b08
          speaker: bird_king
          text: Have you seen the great castle?
        - id: ch05-b09
          speaker: eagle
          text: Yes. I have just come from the place where it stands now.
        - id: ch05-b10
          speaker: bird_king
          text: This young gentleman has lost that castle. You must carry him back to it, but first you need something to eat.
        - id: ch05-b11
          speaker: narrator
          text: Before they left, they killed a thief. The best part was packed as food for the eagle during the long journey, because the great bird would have to carry Jack on his back. Then Jack climbed aboard, and the eagle bore him away over the sea.
        - id: ch05-b12
          speaker: narrator
          text: When the castle came into sight, no one knew how to recover the golden box.
        - id: ch05-b13
          speaker: mouse_sentry
          text: Put me down. I will fetch the little box for you.
        - id: ch05-b14
          speaker: narrator
          text: The mouse slipped quietly into the castle and managed to get hold of the golden box. But while he was coming down the stairs, it tumbled from him. He was very nearly caught. Somehow he escaped, snatched up the box, and came racing out of the castle, laughing as hard as he could.
        - id: ch05-b15
          speaker: jack
          text: Did you get it?
        - id: ch05-b16
          speaker: mouse_sentry
          text: Yes, I have it!
          emotion: happy
        - id: ch05-b17
          speaker: narrator
          text: They flew away and left the castle behind.
        - id: ch05-b18
          speaker: narrator
          text: As Jack, the mouse, the frog, and the eagle crossed the great sea, they began quarreling over who had recovered the box. They looked at it and passed it from one to another, until it slipped from their grasp and sank to the bottom.
        - id: ch05-b19
          speaker: frog_sentry
          text: I knew I would be needed for something. Let me go down into the water.
        - id: ch05-b20
          speaker: narrator
          text: They let the frog drop into the sea. Down he went, all the way toward the bottom, and he did not return for three days and three nights. At last, they saw his nose and little mouth break the surface of the water.
        - id: ch05-b21
          speakers: [jack, mouse_sentry, eagle]
          ensemble: chorus
          text: Did you find it?
        - id: ch05-b22
          speaker: frog_sentry
          text: No.
        - id: ch05-b23
          speaker: jack
          text: Then what are you doing up here?
        - id: ch05-b24
          speaker: frog_sentry
          text: Nothing. I only need a full breath.
        - id: ch05-b25
          speaker: narrator
          text: Once he had taken his full breath, the poor little frog dived a second time. He stayed beneath the waves for another whole day and night. Then he rose to the surface again, and this time he brought the golden box up with him.

    - id: ch06
      title: The Castle Crosses the Sea
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: After four days and nights above the sea, they started back. It was a long, hard journey over water and mountains, but they finally reached the palace of the old King who ruled all the birds.
        - id: ch06-b02
          speaker: narrator
          text: The King proudly welcomed them home, and they talked for a long while. Then Jack opened the golden box.
        - id: ch06-b03
          speaker: jack
          text: Go back and bring the castle here. Every one of you must return as quickly as you can.
        - id: ch06-b04
          speaker: narrator
          text: The three little men hurried away. When they reached the castle, they were afraid to approach until the gentleman, the lady, and all the servants had gone to a dance. Only the cook and one maid remained.
        - id: ch06-b05
          speaker: red_man_1
          text: Would you rather come with the castle or stay behind?
        - id: ch06-b06
          speakers: [cook, second_maid]
          ensemble: duo
          text: We will go with you.
        - id: ch06-b07
          speakers: [red_man_1, red_man_2, red_man_3]
          ensemble: chorus
          text: Then run upstairs, quickly!
        - id: ch06-b08
          speaker: narrator
          text: The two women had scarcely reached a drawing room when the gentleman, the lady, and all the servants appeared in the distance. They were too late. The castle flew away at full speed. The women laughed through the window while everyone below waved for them to stop, but nothing could stop it.
        - id: ch06-b09
          speaker: narrator
          text: The castle spent nine days on its journey across the sea. When Sunday came, everyone tried to keep the day holy. There was already a grand chapel inside the castle, so one little red man became the priest, the second served as clerk, and the third took his place at the organ. The cook and the maid were the singers.
        - id: ch06-b10
          speaker: narrator
          text: Before long, a dreadful discord broke into the music. One of the little men ran up an organ pipe to discover where the bad sound was coming from. He soon found that the two women had stopped singing because they were laughing at the tiny organist. The little fellow had stretched both legs to their full length across the bass pipes, with both arms spread wide at the same time. As always, his little red nightcap remained firmly on his head.
        - id: ch06-b11
          speaker: narrator
          text: The women had never seen such a sight and could not stop laughing, there on the open sea. But when everyone neglected the work they had begun, the castle nearly sank in the middle of the water.
        - id: ch06-b12
          speaker: narrator
          text: At last, the merry travelers reached Jack and the Bird King. The King was amazed by the castle. He climbed its golden stairs to see what lay inside.

    - id: ch07
      title: Jack Comes Home
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: The Bird King was greatly pleased with the castle. But Jack's year and a day were nearly over, and he longed to return to his young wife.
        - id: ch07-b02
          speaker: jack
          text: Be ready to leave by eight tomorrow morning. We will stop one night with the next brother, then go on to the youngest, the King of the Mice. Leave the castle in his care until I send for it.
        - id: ch07-b03
          speaker: narrator
          text: Jack said farewell to the Bird King and thanked him warmly for his hospitality. Then Jack and his castle set off. They spent one night with the Frog King before continuing to the country of the mice.
        - id: ch07-b04
          speaker: narrator
          text: Jack left the castle in the Mouse King's care. Since he could not take it farther, he mounted the horse he had left there at the beginning of his search.
        - id: ch07-b05
          speaker: narrator
          text: Poor Jack left his castle behind and turned his horse toward home. He had enjoyed so much merriment each night with the three royal brothers that weariness soon caught up with him. He began falling asleep in the saddle and would certainly have wandered from the road if the little men had not kept guiding him.
        - id: ch07-b06
          speaker: narrator
          text: At last, he arrived home worn and weary. No one greeted him kindly because they thought he had failed to find the stolen castle. Worse still, his beautiful young wife did not come to meet him. Her parents had kept her away.
        - id: ch07-b07
          speaker: narrator
          text: That did not last long. Jack gave the little men their full power and sent them to fetch the castle. They reached the Mouse King's country in no time.
        - id: ch07-b08
          speaker: narrator
          text: Jack went back to the Mouse King and shook hands with him once more. He offered the King his warmest thanks for all the kingly kindness he had shown, and especially for keeping the great castle safe under his care.
        - id: ch07-b09
          speaker: jack
          text: Now hurry with all your strength. Take us home as fast as you can.
        - id: ch07-b10
          speaker: narrator
          text: The little men put on all possible speed, and away the castle went. The return journey did not take long. When at last it reached its journey's end, Jack's young wife came out to meet him. In her arms she carried a fine, sturdy baby son.
        - id: ch07-b11
          speaker: narrator
          text: And they all lived happily ever after.
