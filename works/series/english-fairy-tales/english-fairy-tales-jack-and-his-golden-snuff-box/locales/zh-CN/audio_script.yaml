audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容讲述古老童话，带着一本正经的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中
    jack:
      display_name: 杰克
      tts:
        delivery: 朴实直率，冒险时带着年轻人的莽撞和勇气
        timbre: 清朗结实
        pace: 中等
        pitch: 中
    mother:
      display_name: 杰克的母亲
      tts:
        delivery: 年迈慈爱，忧心时仍说得爽快
        timbre: 温厚苍老
        pace: 中等偏慢
        pitch: 中低
    father:
      display_name: 杰克的父亲
      tts:
        delivery: 沉稳朴实，叮嘱时郑重清楚
        timbre: 苍老低厚
        pace: 舒缓
        pitch: 低
    maid:
      display_name: 女仆
      tts:
        delivery: 勤快利落，问话直接
        timbre: 明亮清脆
        pace: 中等偏快
        pitch: 中高
    young_lady:
      display_name: 年轻小姐
      tts:
        delivery: 温柔真挚，话语清楚端庄
        timbre: 柔和清亮
        pace: 中等
        pitch: 中高
    gentleman:
      display_name: 老爷
      tts:
        delivery: 威严挑剔，说话不容置疑
        timbre: 浑厚严正
        pace: 中等偏慢
        pitch: 低
    red_man_1:
      display_name: 红衣小人甲
      tts:
        delivery: 机敏干脆，答话整齐有力
        timbre: 细亮结实
        pace: 中等偏快
        pitch: 高
    red_man_2:
      display_name: 红衣小人乙
      tts:
        delivery: 机敏干脆，答话整齐有力
        timbre: 细亮结实
        pace: 中等偏快
        pitch: 高
    red_man_3:
      display_name: 红衣小人丙
      tts:
        delivery: 机敏干脆，答话整齐有力
        timbre: 细亮结实
        pace: 中等偏快
        pitch: 高
    valet:
      display_name: 贴身男仆
      tts:
        delivery: 狡猾自利，得意时语气轻快
        timbre: 窄而顺滑
        pace: 中等
        pitch: 中
    mouse_king:
      display_name: 鼠王
      tts:
        delivery: 亲切庄重，待客热诚
        timbre: 细柔而年迈
        pace: 中等偏慢
        pitch: 中高
    little_mouse:
      display_name: 小老鼠
      tts:
        delivery: 聪明热心，语气轻快坚定
        timbre: 轻细明亮
        pace: 中等偏快
        pitch: 高
    frog_king:
      display_name: 蛙王
      tts:
        delivery: 爽直好客，声音带着圆润顿挫
        timbre: 浑圆略哑
        pace: 中等
        pitch: 中低
    little_frog:
      display_name: 小青蛙
      tts:
        delivery: 实在热心，疲惫时仍很执着
        timbre: 清脆略哑
        pace: 中等
        pitch: 中高
    bird_king:
      display_name: 百鸟之王
      tts:
        delivery: 年长威严，待客宽厚
        timbre: 辽阔深沉
        pace: 舒缓
        pitch: 低
    eagle:
      display_name: 大鹰
      tts:
        delivery: 强健可靠，答话简洁
        timbre: 粗犷洪亮
        pace: 中等
        pitch: 低
    cook:
      display_name: 厨娘
      tts:
        delivery: 爽朗大胆，笑意明快
        timbre: 饱满温暖
        pace: 中等
        pitch: 中
    second_maid:
      display_name: 另一名女仆
      tts:
        delivery: 活泼果断，语气轻快
        timbre: 清亮柔和
        pace: 中等偏快
        pitch: 中高
  chapters:
    - id: ch01
      title: 离开森林
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "从前有一对老夫妇，带着独生子住在大森林里。那是个好时候，却不属于我、你，或是如今任何人的年头。"
        - id: ch01-b02
          speaker: narrator
          text: "儿子除了爹娘，从没见过别人。他天天读书，知道森林外还有许多人。每次读到漂亮的年轻姑娘，他都恨不得马上见到一个。终于有一天，父亲出门砍柴时，他向母亲说出了心愿。"
        - id: ch01-b03
          speaker: jack
          text: "娘，我想到别的地方谋生，也想看看你们以外的人。这里四周只有大树，再待下去，我恐怕没见到别的东西就先发疯了。"
        - id: ch01-b04
          speaker: mother
          text: "好吧，我可怜的孩子。你真想走，那就走吧，愿上帝保佑你。不过先选一选，你要一张带着祝福的小饼，还是一张带着咒骂的大饼？"
        - id: ch01-b05
          speaker: jack
          text: "给我做大饼吧。路这么远，我说不定会饿。"
        - id: ch01-b06
          speaker: narrator
          text: "母亲为他做了大饼，又爬上屋顶，朝着远去的儿子一路骂，直到再也看不见他。她这样做，也是一心替孩子着想。"
        - id: ch01-b07
          speaker: narrator
          text: "杰克很快遇见父亲，又把离家的缘由说了一遍。"
        - id: ch01-b08
          speaker: father
          text: "看你离开，我心里不好受。可你已经拿定主意，那就去吧。"
        - id: ch01-b09
          speaker: narrator
          text: "杰克还没走远，父亲又把他叫住，从口袋里取出一只金鼻烟盒。"
        - id: ch01-b10
          speaker: father
          text: "把这只小盒子收好。不到性命快保不住的时候，千万别打开。"
        - id: ch01-b11
          speaker: narrator
          text: "杰克一路走着，很快吃光了大饼。后来，他又累又饿，夜色也落了下来，眼前的路几乎看不清。远处亮着一点灯光，他朝灯光走去，找到一座宅子的后门，敲了又敲。女仆出来问他想做什么。杰克说天已经黑了，只求一个睡觉的地方。女仆让他进来烤火，又端来许多肉、面包和啤酒，叫他好好吃一顿。"
        - id: ch01-b12
          speaker: maid
          text: "外头已经全黑了。你先坐下吃饱，今晚就在这里歇脚吧。"
        - id: ch01-b13
          speaker: narrator
          text: "老爷家的小姐来到后厨。她和杰克彼此看了一眼，便爱上了对方。小姐马上跑去告诉父亲，后厨里来了个漂亮的年轻人。老爷赶来盘问杰克会做什么活。"
        - id: ch01-b14
          speaker: jack
          text: "什么活我都做得来。"
        - id: ch01-b15
          speaker: narrator
          text: "这个傻小子其实只想说，宅子里不管有什么零碎笨活，他都愿意做。老爷听了，却另有打算。"
    - id: ch02
      title: 三桩不可能的差事
      blocks:
        - id: ch02-b01
          speaker: gentleman
          text: "你既然什么都能做，明早八点以前，就在宅子前造一座大湖。湖上要开着几艘世上最大的战舰。最大的一艘得鸣放皇家礼炮，最后一炮还要打断我女儿睡床的一条腿。办不到，你就拿命来抵。"
        - id: ch02-b02
          speaker: jack
          text: "没问题。"
        - id: ch02-b03
          speaker: narrator
          text: "杰克安安静静做过祷告，倒头便睡。醒来时已经快到八点，他这才想起父亲给的金鼻烟盒。"
        - id: ch02-b04
          speaker: jack
          text: "我从没像现在这样离死这么近。看来只能打开它了。"
        - id: ch02-b05
          speaker: narrator
          text: "盒盖一开，三个红衣小人蹦了出来。"
        - id: ch02-b06
          speakers: [red_man_1, red_man_2, red_man_3]
          ensemble: chorus
          text: "您要我们做什么？"
        - id: ch02-b07
          speaker: jack
          text: "我要一座大湖和几艘最大的战舰，就在宅子前面。最大的一艘要鸣放皇家礼炮，最后一炮得打断小姐睡床的一条腿。"
        - id: ch02-b08
          speakers: [red_man_1, red_man_2, red_man_3]
          ensemble: chorus
          text: "没问题，您睡觉去吧。"
        - id: ch02-b09
          speaker: narrator
          text: "杰克才交代完，钟就敲了八下。湖上的大战舰轰轰开炮，杰克吓得跳下床，奔到窗边。一个从小住在森林里的人，哪里见过这样的奇景！"
        - id: ch02-b10
          speaker: narrator
          text: "杰克穿好衣服，又做完祷告，得意地笑着下楼。事情办得这样漂亮，他心里别提多骄傲了。老爷走过来看见湖、战舰和断掉的床腿，也不得不服气。"
        - id: ch02-b11
          speaker: gentleman
          text: "年轻人，你确实聪明。先来吃早饭吧。还有两件事，等你全都办成，我就把女儿嫁给你。"
        - id: ch02-b12
          speaker: narrator
          text: "杰克坐下吃早饭，一面吃，一面好好瞧了小姐几眼，小姐也回望着他。老爷交代的第二桩差事，是在下一个早晨八点前，把方圆几英里的参天大树全部砍倒。杰克再次打开鼻烟盒，请三个小人帮忙。到了八点，远近的大树果然全倒了，老爷看得十分满意。"
        - id: ch02-b13
          speaker: gentleman
          text: "最后，你要造一座由十二根金柱托起的大城堡。还要有一队队士兵来操练。八点整，指挥官必须喊出‘举枪上肩’。"
        - id: ch02-b14
          speaker: jack
          text: "这也没问题。"
        - id: ch02-b15
          speaker: narrator
          text: "第三天早晨，城堡、士兵和操练全都出现了。杰克终于娶到小姐。可惜呀，更糟的事情还在后面。"
        - id: ch02-b16
          speaker: narrator
          text: "老爷举办盛大的狩猎会，请乡间的绅士们来打猎，也来参观城堡。杰克骑上漂亮的马，换好猩红猎装，同大家出发了。贴身男仆收拾衣服时，却从杰克的背心里摸到了金鼻烟盒。"
        - id: ch02-b17
          speaker: narrator
          text: "男仆刚打开盒子，三个红衣小人便跳到他面前。"
        - id: ch02-b18
          speakers: [red_man_1, red_man_2, red_man_3]
          ensemble: chorus
          text: "您想叫我们做什么？"
        - id: ch02-b19
          speaker: valet
          text: "把这座城堡搬走，越过大海，搬到很远很远的地方。"
        - id: ch02-b20
          speaker: red_man_1
          text: "没问题。您要跟城堡一起走吗？"
        - id: ch02-b21
          speaker: valet
          text: "当然要去。"
        - id: ch02-b22
          speaker: red_man_1
          text: "那就上去吧。"
        - id: ch02-b23
          speaker: narrator
          text: "三个小人叫男仆登上城堡，随后让整座城堡拔地而起，越过茫茫大海，飞往很远很远的地方。浩浩荡荡的狩猎队回来后，眼前只剩一片空地，十二根金柱和整座城堡全都没了。那些先前没见到奇观的绅士们尤其失望，认定杰克欺骗了他们。众人威胁要夺走他年轻美丽的妻子。最后，老爷同杰克讲定条件，给他一年零一天寻找城堡。杰克带上足够的钱，骑着一匹好马出发了。"
    - id: ch03
      title: 三位动物国王
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "杰克为了找回失踪的城堡，翻过山岭，走过丘陵和谷地，又穿过毛茸茸的密林和放羊的牧场。他走得那么远，远得连我也说不清，而且我压根不打算说清。最后，他来到天下鼠王居住的地方。通往宫殿的正门前，一只小老鼠正在站岗。它见杰克要进去，马上上前阻拦。"
        - id: ch03-b02
          speaker: jack
          text: "鼠王住在哪里？我有要紧事想见他。"
        - id: ch03-b03
          speaker: narrator
          text: "站岗的小老鼠叫来另一个伙伴，领杰克去见鼠王。鼠王一看见他，便请他进宫，又仔细问他为什么一路走到这里。杰克不敢隐瞒，把事情从头说起。他的宏伟城堡被人偷走了，老爷只给他一年零一天。期限一到，若还找不回来，他连年轻的妻子也保不住。"
        - id: ch03-b04
          speaker: jack
          text: "您知道那座城堡去了哪里吗？"
        - id: ch03-b05
          speaker: mouse_king
          text: "我不知道。不过天下的小老鼠都听我号令。明早把它们全叫来，或许有谁见过。"
        - id: ch03-b06
          speaker: narrator
          text: "鼠王先让杰克吃了一顿好饭，又给他一张舒服的床。天一亮，两人一同来到田野。鼠王把天下所有小老鼠召到跟前，问它们有没有见过一座宏伟漂亮、由十二根金柱托起的城堡。小老鼠们一只接一只回答，谁也没有见过。"
        - id: ch03-b07
          speaker: mouse_king
          text: "我还有两个哥哥。一个统领天下青蛙，年纪最大的那个统领天下飞鸟。他们也许知道消息。你的马留在这里，骑我的好马去吧。再把这张饼交给我哥哥，他会认出是谁送的。告诉他，我一切都好，也很想见他。"
        - id: ch03-b08
          speaker: narrator
          text: "鼠王同杰克握手道别。杰克走到门口，先前站岗的小老鼠追来问，能不能跟他同行。"
        - id: ch03-b09
          speaker: jack
          text: "还是别去。鼠王知道了，我可要惹麻烦。"
        - id: ch03-b10
          speaker: little_mouse
          text: "带上我更好。也许哪一天，我能在您意想不到的时候帮上忙。"
        - id: ch03-b11
          speaker: jack
          text: "那就跳上来吧。"
        - id: ch03-b12
          speaker: narrator
          text: "小老鼠沿马腿往上爬，弄得马直蹦，杰克连忙把它装进口袋。他向鼠王道过早安，这才正式踏上寻找下一位国王的路。这只是赶路的第一天，路却长得吓人。直到很晚，他才来到蛙王的宫殿。一只青蛙扛着枪在门前站岗，也想阻止他进去。杰克说明自己要见蛙王，它才肯放行。蛙王亲自走出门来，询问他的来意。杰克便从最初得到鼻烟盒讲起，把城堡被偷、限期寻找的事从头到尾说了一遍。"
        - id: ch03-b13
          speaker: frog_king
          text: "好吧，进来歇一晚。明早我替你问问。"
        - id: ch03-b14
          speaker: narrator
          text: "蛙王当晚好好款待杰克，让他吃饱，也让他安稳睡了一夜。次日早晨，蛙王发出一种非常古怪的声音，天下所有青蛙便从四处跳来，聚集在王的面前。他问有没有谁知道，或是亲眼见过一座由十二根金柱托着的城堡。青蛙们先是呱啰呱啰叫成一片，随后纷纷回答，却没有一只见过。"
        - id: ch03-b15
          speaker: narrator
          text: "蛙王只好叫杰克再换一匹马，又给他一张饼，托他带给自己的哥哥，也就是天下飞禽的王。走到大门口，站岗的小青蛙也问能不能同行。杰克起先不肯，推辞了一阵，最后还是叫它跳上来，把它放进背心另一个口袋。这次的路是上次的三倍长。他走啊走，终于抵达百鸟之王的宫殿。门前有一只漂亮的鸟儿站岗，却没拦他，也一句话没说。"
        - id: ch03-b16
          speaker: bird_king
          text: "今晚先吃饭休息。明早我召来所有鸟儿，看它们知不知道那座城堡。"
        - id: ch03-b17
          speaker: narrator
          text: "天亮后，杰克和百鸟之王来到田野。老国王发出一阵奇怪的鸣叫，天下所有飞禽立刻从四面八方赶来。他问它们有没有见过那座美丽的城堡，群鸟一个个回答，都说没有。百鸟之王环顾四周，发现那只大鸟还没来，便派两只小鸟飞上高空，朝它打呼哨，催它能飞多快就飞多快。大家等了很久，大鹰才满身是汗地落下。"
        - id: ch03-b18
          speaker: bird_king
          text: "大鹰，你见过那座宏伟的城堡吗？"
        - id: ch03-b19
          speaker: eagle
          text: "见过。我刚从它现在停着的地方飞回来。"
        - id: ch03-b20
          speaker: bird_king
          text: "这位年轻人丢了城堡，你得带他回去。先吃点东西，再动身。"
    - id: ch04
      title: 海上的失而复得
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "他们杀了一个贼，挑出最好的肉给大鹰带在路上吃。大鹰不光要越过茫茫大海，还得把杰克驮在背上，当然要有足够的食物。杰克带着口袋里的老鼠和青蛙坐上鹰背，他们飞了很远。等城堡终于出现在远处，大家却犯了难。城堡虽然找到了，可那只金鼻烟盒还在里面，谁也想不出怎样拿回来。"
        - id: ch04-b02
          speaker: little_mouse
          text: "把我放下去吧。我进城堡替你们拿盒子。"
        - id: ch04-b03
          speaker: narrator
          text: "小老鼠偷偷溜进去，果真拿到了盒子。下楼时，盒子突然落地，它险些被捉住。好在它抱起盒子，一路笑着跑了出来。"
        - id: ch04-b04
          speaker: jack
          text: "你真的拿到了吗？"
        - id: ch04-b05
          speaker: little_mouse
          text: "拿到了，就在这里！"
          emotion: happy
        - id: ch04-b06
          speaker: narrator
          text: "杰克、老鼠、青蛙和大鹰带着盒子返程，把城堡留在原地。飞到大海上空时，他们争起究竟是谁取回了盒子。盒子在他们手里传来传去，一滑便掉进海底。"
        - id: ch04-b07
          speaker: little_frog
          text: "我早知道总有事情非得我做不可。快放我下水吧。"
        - id: ch04-b08
          speaker: narrator
          text: "小青蛙沉入海中，三天三夜才浮上来，只把鼻尖和小嘴露出水面。大家赶紧问它有没有找到。"
        - id: ch04-b09
          speaker: little_frog
          text: "没有。我只是上来喘足一口气。"
        - id: ch04-b10
          speaker: narrator
          text: "可怜的小青蛙再次下潜。这一回过了一天一夜，它终于带着盒子钻出水面。为了这只盒子，大家在海上整整停了四天四夜。"
        - id: ch04-b11
          speaker: narrator
          text: "盒子失而复得，他们立刻继续赶路。越过大海和群山时，这一程走得又长又辛苦。最后，大家总算回到百鸟之王的宫殿。老国王见他们平安归来，心里十分自豪，不但热情欢迎，还摆出食物，同他们长谈了好一阵。杰克这才打开盒子，把三个红衣小人唤到面前。"
        - id: ch04-b12
          speaker: jack
          text: "回去把城堡搬到这里。你们要用最快的速度赶回来。"
        - id: ch04-b13
          speaker: narrator
          text: "三个小人赶到城堡附近，却不敢立刻靠近。他们等到老爷、太太和所有仆人出门参加舞会，才走进去。里面只剩厨娘和另一名女仆。"
        - id: ch04-b14
          speaker: red_man_1
          text: "城堡马上要走了。你们愿意跟着走，还是留下？"
        - id: ch04-b15
          speakers: [cook, second_maid]
          ensemble: duo
          text: "我们跟你们走！"
        - id: ch04-b16
          speaker: red_man_1
          text: "那就赶快跑上楼。"
        - id: ch04-b17
          speaker: narrator
          text: "两人才进楼上的客厅，老爷、太太和仆人们已经出现在远处。可惜太迟了。城堡飞快离去，两个女人从窗口笑着看他们。地上的人拼命挥手叫停，半点用也没有。"
    - id: ch05
      title: 航行的城堡
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "城堡在路上一共走了九天。到了星期日，大家还想守好安息日，好在城堡里本来就有一座华丽的礼拜堂。一个红衣小人做牧师，一个做教堂司事，第三个坐到管风琴前。厨娘和女仆站在一旁，负责唱诗。于是，这座漂在海上的城堡里，也像模像样地做起了礼拜。"
        - id: ch05-b02
          speaker: narrator
          text: "唱着唱着，乐声里忽然冒出不和谐的怪音。一个小人顺着管风琴管爬上去查看，才发现两个女人正在发笑。另一个红衣小人戴着从不离身的红睡帽，趴在低音管上，把两条短腿和两只胳膊都伸到最长。"
        - id: ch05-b03
          speaker: narrator
          text: "两个女人从没见过这种模样。城堡又在茫茫海面上航行，她们实在忍不住。可大家没有继续做好手头的事，险些闯下大祸。有一回，整座城堡差一点沉进大海中央。"
        - id: ch05-b04
          speaker: narrator
          text: "这趟快乐的旅程总算平安结束。城堡来到杰克和百鸟之王面前，老国王看得目瞪口呆。他登上金色台阶，把城堡里面仔仔细细参观了一遍，喜欢得不得了。"
        - id: ch05-b05
          speaker: narrator
          text: "可是，杰克的一年零一天已经快用完了。他一心想赶回年轻的妻子身边，不能再把城堡留在这里欣赏。于是，他吩咐三个小人做好准备，第二天早晨八点准时带城堡启程。先到下一位兄弟，也就是蛙王那里住一夜，再送去最后一位、年纪最小的鼠王那里。城堡要请鼠王保管，直到有人来取。安排妥当后，他向百鸟之王告别。"
        - id: ch05-b06
          speaker: jack
          text: "多谢您一路照顾，也多谢您的盛情款待。我该回家了。"
        - id: ch05-b07
          speaker: narrator
          text: "第二天，杰克和他的城堡再次上路。他们先到蛙王那里，照原先的安排停住一夜。天亮后，城堡又飞往第三处，也就是鼠王的领地。杰克请鼠王继续照看，自己却不能带着这座庞然大物回家，只好把城堡留在身后，重新骑上最初来访时寄放在这里的那匹马。"
    - id: ch06
      title: 城堡回家了
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: "杰克把城堡留在身后，独自朝家走。先前跟三位动物国王夜夜欢聚，他实在太困，骑在马上不停打瞌睡。幸亏三个小人一路指引，他才没有迷路。"
        - id: ch06-b02
          speaker: narrator
          text: "经过漫长的归途，他终于精疲力竭地回到家。众人见他两手空空，没有带回那座被偷的城堡，谁也不给他好脸色。更叫他失望的是，年轻美丽的妻子也没有跑出来迎接。并不是她不愿意见杰克，而是她的父母故意把她拦在了里面。"
        - id: ch06-b03
          speaker: narrator
          text: "不过，他们没能拦多久。杰克立刻使出盒子的全部力量，派三个小人去鼠王那里取城堡。三个小人转眼便赶到了。杰克也同鼠王握手道别。"
        - id: ch06-b04
          speaker: jack
          text: "多谢您像真正的国王一样，替我好好照看城堡。现在请三位加快速度，越快越好！"
        - id: ch06-b05
          speaker: narrator
          text: "三个小人带着城堡飞快赶路，一路越过先前走过的山川，没过多久便到了旅程的终点。杰克年轻的妻子立刻从城堡里迎出来，怀中还抱着一个白白胖胖的小儿子。从此以后，他们全都幸福地生活在一起。"
