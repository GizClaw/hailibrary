audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容讲述古老童话，带着一本正经的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中
    earl_mars_daughter:
      display_name: 马尔伯爵的女儿
      tts:
        delivery: 温柔而勇敢，面对惊异之事仍清醒坚定
        timbre: 清澈柔和
        pace: 中等
        pitch: 中高
    florentine:
      display_name: 弗洛伦廷王子
      tts:
        delivery: 真挚深情，危急时果断，悲伤时克制
        timbre: 明朗温润
        pace: 中等
        pitch: 中
    earl_mar:
      display_name: 马尔伯爵
      tts:
        delivery: 威严强硬，发怒时粗暴而不容反驳
        timbre: 低沉厚重
        pace: 中等偏慢
        pitch: 低
    queen:
      display_name: 王后
      tts:
        delivery: 高贵自信，对儿子慈爱，施展魔法时神秘凝重
        timbre: 成熟饱满
        pace: 从容
        pitch: 中低
  chapters:
    - id: ch01
      title: 绿橡树上的鸽子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "一个晴朗的夏日，马尔伯爵的女儿来到城堡的花园。她脚步轻盈，一路跳着舞，快活地嬉戏。她时不时停下来，专心听一阵鸟儿的歌声，然后再往前走。后来，她坐在一棵绿橡树的树荫下乘凉，一抬头，看见一只活泼的鸽子高高栖在一根枝头。"
        - id: ch01-b02
          speaker: earl_mars_daughter
          text: "咕咕鸽，我的乖鸽子，下来陪我吧。我送你一只金笼子，再带你回家好好疼爱。世上别的鸟儿有多受宠，你也会一样受宠。"
        - id: ch01-b03
          speaker: narrator
          text: "她刚说完，鸽子就飞下来，落到她肩头，紧挨着她的脖颈。姑娘轻轻理顺它的羽毛，把它带回了自己的房间。白天过去，夜色降临。她正准备睡觉，转过身，却见一位英俊的年轻人站在旁边。门明明早就闩上了，她自然吓了一跳。不过，她很勇敢，马上开口问他。"
        - id: ch01-b04
          speaker: earl_mars_daughter
          text: "年轻人，你为什么跑到这里来吓我？这扇门几个钟头前就闩好了。你究竟是怎么进来的？"
          emotion: surprised
        - id: ch01-b05
          speaker: florentine
          text: "嘘，小声些。我就是树上那只咕咕叫的鸽子，是你把我哄到身边来的。"
        - id: ch01-b06
          speaker: earl_mars_daughter
          text: "那你到底是谁？你又怎么会变成那只可爱的小鸟？"
        - id: ch01-b07
          speaker: florentine
          text: "我叫弗洛伦廷。我的母亲是王后，可她还懂魔法，会念咒语。我不愿照她的意思行事，她就罚我白天变成鸽子。只有到了夜里，法术失效，我才能恢复人形。今天我飞过大海，第一次看见你。我很庆幸自己是只鸟，这样才能靠近你。要是你不爱我，我再也不会快活了。"
        - id: ch01-b08
          speaker: earl_mars_daughter
          text: "可我若是爱上你，哪天你会不会忽然飞走，把我独自留下？"
        - id: ch01-b09
          speaker: florentine
          text: "永远不会。嫁给我吧，我也会永远属于你。白天我是鸟，夜里我是王子，不论是什么模样，我都会做你的丈夫，守在你身边。"
    - id: ch02
      title: 七年后的大祸
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "两人就这样秘密成了婚，在城堡里幸福地过日子。没有人知道，咕咕鸽每晚都会变回弗洛伦廷王子。此后每过一年，他们便添一个小儿子，个个都可爱极了。可每个孩子一出生，王子就让小家伙伏在自己背上，带他飞过大海，送到母亲王后那里。七年过去，一场大祸来了。马尔伯爵要把女儿嫁给一位前来求婚的显贵。父亲苦苦相逼，姑娘还是不肯答应。"
        - id: ch02-b02
          speaker: earl_mars_daughter
          text: "亲爱的父亲，我不想嫁人。有咕咕鸽陪着，我已经很快活了。"
        - id: ch02-b03
          speaker: narrator
          text: "马尔伯爵顿时勃然大怒，还狠狠发了毒誓。"
        - id: ch02-b04
          speaker: earl_mar
          text: "明天，只要我还活着，还吃得下饭，我就非扭断那只小鸟的脖子不可！"
          emotion: angry
        - id: ch02-b05
          speaker: narrator
          text: "说完，他跺着脚冲出了女儿的房间。"
        - id: ch02-b06
          speaker: florentine
          text: "哎呀，我该走了。"
        - id: ch02-b07
          speaker: narrator
          text: "咕咕鸽跳上窗台，转眼便飞走了。他飞呀，飞呀，飞到深深的大海上空，还一直向前飞，直到母亲的城堡。王后正在外面散步，看见漂亮的鸽子从头顶飞过，落在城墙上。"
        - id: ch02-b08
          speaker: queen
          text: "舞者们，快来跳吉格舞！风笛手们，好好吹起来！我的弗洛伦廷回来了。这次他没有带小男孩回来，一定是要留下陪我啦。"
          emotion: happy
        - id: ch02-b09
          speaker: florentine
          text: "不，母亲。别叫舞者，也别叫乐师。我的爱妻，也是我七个儿子的母亲，明天就要嫁给别人了。那会是我最悲伤的一天。"
          emotion: sad
    - id: ch03
      title: 王后的魔法
      blocks:
        - id: ch03-b01
          speaker: queen
          text: "我的儿子，你要我怎么帮你？只要我的魔法办得到，我一定替你办成。"
        - id: ch03-b02
          speaker: florentine
          text: "亲爱的母亲，请把二十四名舞者和风笛手变成二十四只灰苍鹭，把我的七个儿子变成七只白天鹅，再把我变成苍鹰，让我领着他们。"
        - id: ch03-b03
          speaker: queen
          text: "唉，我的儿子，这件事我办不到。我的魔力伸不了那么远。不过，我的老师奥斯特里的女先知也许有办法。"
          emotion: sad
        - id: ch03-b04
          speaker: narrator
          text: "王后急忙赶到奥斯特里的洞穴。过了一会儿，她走出洞来，脸色白得吓人，手里拿着从洞中带出的燃烧香草，嘴里不停念着咒语。忽然，咕咕鸽变成了苍鹰。二十四只灰苍鹭在他周围飞旋，七只幼天鹅飞在他们上方。"
        - id: ch03-b05
          speaker: narrator
          text: "他们一句话也没有说，连一声告别也没有留下，就飞向翻腾呜咽的深蓝大海。他们飞呀，飞呀，越过海面，终于俯冲到马尔伯爵的城堡。那时，迎亲队伍正要出发去教堂。"
    - id: ch04
      title: 被鸟群带走的新娘
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "披甲执械的卫士走在最前头，后面跟着新郎的朋友，再后面是马尔伯爵的随从。接着走来的是新郎，最后才是脸色苍白却依然美丽的新娘。庄严的乐声响着，队伍缓缓经过鸟群停落的树林。化作苍鹰的弗洛伦廷一声令下，所有鸟儿一齐升空。苍鹭飞在下面，幼天鹅飞在上面，苍鹰盘旋在最高处。"
        - id: ch04-b02
          speaker: narrator
          text: "参加婚礼的人还在仰头发愣，苍鹭已经猛冲进人群，把卫士撞得四散。小天鹅们护住母亲，苍鹰俯冲下去，把新郎捆在一棵树上。随后，苍鹭聚拢起来，铺成一张羽毛床。小天鹅把母亲安放在上面，鸟群便托着新娘飞上天空，稳稳朝弗洛伦廷的家飞去。"
        - id: ch04-b03
          speaker: narrator
          text: "世上大概再没有哪支迎亲队伍，被搅得这样天翻地覆。参加婚礼的人什么也做不了，只能眼睁睁看着美丽的新娘被鸟群托走，越飞越远。最后，她和苍鹭、天鹅、苍鹰一起消失在天边。就在那一天，弗洛伦廷王子把马尔伯爵的女儿带到了母亲的城堡。王后解开他身上的魔咒。从此，他们永远幸福地生活在一起。"
