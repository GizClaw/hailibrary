audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and unhurried, with the steady rhythm of an old fireside tale
        timbre: clear and gently weathered
        pace: measured
        pitch: medium
    earl_mars_daughter:
      display_name: Earl Mar's Daughter
      tts:
        delivery: brave and tender, with the quiet confidence of a young noblewoman
        timbre: clear and graceful
        pace: measured
        pitch: medium-high
    florentine:
      display_name: Prince Florentine
      tts:
        delivery: gentle and devoted, with a princely steadiness beneath moments of sorrow
        timbre: youthful and resonant
        pace: measured
        pitch: medium
    earl_mar:
      display_name: Earl Mar
      tts:
        delivery: commanding and forceful, with little patience for refusal
        timbre: mature and robust
        pace: deliberate
        pitch: low
    queen:
      display_name: The Queen
      tts:
        delivery: regal and assured, softened by concern for her son
        timbre: mature and rich
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: Coo-my-dove
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: One fine summer day, Earl Mar's daughter went dancing through the castle garden. As she played, she would stop now and then to hear the birds sing. After a while, she rested in the shade of a green oak. High among its branches, she saw a lively dove.
        - id: ch01-b02
          speaker: earl_mars_daughter
          text: Coo-my-dove, my dear, come down to me. I'll give you a golden cage, take you home, and care for you better than any other bird.
        - id: ch01-b03
          speaker: narrator
          text: The words were scarcely out before the dove flew down and settled on her shoulder. It nestled against her neck while she stroked its feathers. Then she carried it home to her own room.
        - id: ch01-b04
          speaker: narrator
          text: Night came, and Earl Mar's daughter was about to sleep. When she turned around, a handsome young man stood beside her. The door had been locked for hours, so the sight startled her. Still, she was brave enough to question him.
        - id: ch01-b05
          speaker: earl_mars_daughter
          text: What are you doing here, young man, frightening me like this? My door has been barred for hours. How did you ever get in?
          emotion: surprised
        - id: ch01-b06
          speaker: florentine
          text: Hush, hush. I was the cooing dove you coaxed down from the tree.
        - id: ch01-b07
          speaker: earl_mars_daughter
          text: Then who are you? And how were you turned into that dear little bird?
        - id: ch01-b08
          speaker: florentine
          text: My name is Florentine, and my mother is a queen. She is more than a queen, for she knows magic and spells. I would not obey her wishes, so she made me a dove by day. At night, her spell grows weak and I become a man again. Today I crossed the sea and saw you for the first time. I was glad to be a bird, because it let me come close to you. If you cannot love me, I will never be happy again.
        - id: ch01-b09
          speaker: earl_mars_daughter
          text: But if I do love you, won't you fly away and leave me one day?
        - id: ch01-b10
          speaker: florentine
          text: Never, never. Be my wife, and I will be yours forever. I may be a bird by day and a prince by night, but I will always stay beside you as your husband.
        - id: ch01-b11
          speaker: narrator
          text: So they married in secret and lived happily in the castle. No one knew that Coo-my-dove became Prince Florentine each night. Every year, they had a little son, as bonny as could be. And whenever a son was born, Florentine carried the baby on his back across the sea. There he left the child with his mother, the queen.

    - id: ch02
      title: Florentine Flies Home
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Seven years went by in this way. Then great trouble came. A high-born nobleman began courting Earl Mar's daughter, and Earl Mar wanted her to marry him. Her father pressed her hard, but she refused.
        - id: ch02-b02
          speaker: earl_mars_daughter
          text: Dear Father, I don't want to marry. I can be perfectly happy here with Coo-my-dove.
        - id: ch02-b03
          speaker: narrator
          text: Earl Mar flew into a mighty rage. He swore a great oath.
        - id: ch02-b04
          speaker: earl_mar
          text: Tomorrow, as surely as I live and eat, I'll wring that bird's neck!
          emotion: angry
        - id: ch02-b05
          speaker: narrator
          text: With that, he stamped out of her room.
        - id: ch02-b06
          speaker: florentine
          text: Oh, oh! It is time for me to go.
          emotion: fearful
        - id: ch02-b07
          speaker: narrator
          text: Coo-my-dove sprang onto the windowsill and flew away. On and on he went, out over the deep sea, until he reached his mother's castle. The queen was walking outside when she saw the pretty dove overhead. It came down upon the castle wall.
        - id: ch02-b08
          speaker: queen
          text: Dancers, come and dance your jigs! Pipers, play your finest tunes! My own Florentine has come home to stay, for this time he has brought no bonny boy with him.
          emotion: happy
        - id: ch02-b09
          speaker: florentine
          text: No, Mother. I want no dancers and no music. My dear wife, the mother of my seven boys, is to be married tomorrow. It is a sorrowful day for me.
          emotion: sad
        - id: ch02-b10
          speaker: queen
          text: Tell me what I can do, my son. If my magic has the power, it shall be done.
        - id: ch02-b11
          speaker: florentine
          text: Then, dear Mother, turn the twenty-four dancers and pipers into twenty-four gray herons. Change my seven sons into seven white swans, and make me a goshawk to lead them.
        - id: ch02-b12
          speaker: queen
          text: Alas, my son, I cannot do that. My magic does not reach so far. But perhaps my teacher, the spaewife of Ostree, knows stronger magic.
          emotion: sad

    - id: ch03
      title: The Birds Take Flight
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The queen hurried away to Ostree's cave. After a while, she came out again, white as could be. She carried burning herbs from the cave and muttered over them. At once, Coo-my-dove changed into a goshawk. Twenty-four gray herons circled around him, and seven young swans flew above.
        - id: ch03-b02
          speaker: narrator
          text: No one stopped for a word or a farewell. They flew out over the deep blue sea as it tossed and moaned below. They flew on until they reached Earl Mar's castle. The wedding party was just setting out for the church.
        - id: ch03-b03
          speaker: narrator
          text: The men-at-arms came first, followed by the bridegroom's friends. Earl Mar's men came next, then the bridegroom himself. Last of all walked Earl Mar's daughter, pale and beautiful. To the sound of stately music, the party moved slowly toward the trees where the birds were settling.

    - id: ch04
      title: The Wedding Party Scattered
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Prince Florentine, in the shape of the goshawk, gave the word. Every bird rose into the air. The herons flew below, the young swans above, and the goshawk circled over them all. The wedding guests stared at the sight.
        - id: ch04-b02
          speaker: narrator
          text: Then down swept the herons, right among the party, scattering the men-at-arms. The swans took charge of their mother. The goshawk dashed at the bridegroom and tied him to a tree.
        - id: ch04-b03
          speaker: narrator
          text: Next, the herons gathered close until their feathers made one great bed. The swans placed their mother upon it. All at once, the birds rose together and carried the bride safely away toward Florentine's home.
        - id: ch04-b04
          speaker: narrator
          text: Surely no wedding party in the world was ever thrown into such confusion. What could the guests do? They watched their pretty bride fly farther and farther away, until she, the herons, the swans, and the goshawk had all disappeared.
        - id: ch04-b05
          speaker: narrator
          text: That very day, Prince Florentine brought Earl Mar's daughter to his mother's castle. The queen lifted the spell from him, and they lived happily ever afterward.
