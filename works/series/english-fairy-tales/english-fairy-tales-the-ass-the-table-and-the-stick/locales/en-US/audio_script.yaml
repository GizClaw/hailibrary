  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and unhurried, with the steady rhythm of an old fireside tale
        timbre: clear and gently weathered
        pace: measured
        pitch: medium
    jack:
      display_name: Jack
      tts:
        delivery: eager and spirited, with a plainspoken country warmth
        timbre: bright and youthful
        pace: lively
        pitch: medium
    old_woman:
      display_name: The Old Woman
      tts:
        delivery: kindly and matter-of-fact
        timbre: soft and aged
        pace: unhurried
        pitch: medium
