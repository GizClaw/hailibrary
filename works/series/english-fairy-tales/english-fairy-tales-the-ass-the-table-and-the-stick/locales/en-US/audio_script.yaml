  chapters:
    - id: ch01
      title: Neddy's Silver and Gold
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: A lad named Jack was so miserable at home under his father's ill treatment that he decided to run away and seek his fortune in the wide world.
        - id: ch01-b02
          speaker: narrator
          text: He ran and ran until he could run no farther. Then he went straight into a little old woman who was gathering sticks. Jack was too winded even to apologize, but she was good-natured and took no offense.
        - id: ch01-b03
          speaker: old_woman
          text: You look like a capable lad. Come and work for me, and I'll pay you well.
        - id: ch01-b04
          speaker: narrator
          text: Jack was very hungry, so he agreed. She took him to her house in the wood, and he served her for a year and a day.
        - id: ch01-b05
          speaker: narrator
          text: When his service was over, the old woman called him in and told him his good wages were ready. From her stable she brought an ass named Neddy. All Jack had to do was pull Neddy's ears. Neddy would begin to bray, “Ee-aw!” and silver sixpences, half crowns, and golden guineas would tumble from his mouth.
        - id: ch01-b06
          speaker: narrator
          text: Jack was delighted with his wages. He rode away until he reached an inn, where he ordered the very best of everything. The innkeeper would not serve him until he paid first.
        - id: ch01-b07
          speaker: narrator
          text: So Jack went out to the stable and pulled Neddy's ears. As the ass brayed, enough coins fell from his mouth to fill Jack's pockets. The innkeeper secretly watched it all through a crack in the door. When night came, he led away precious Neddy and put an ass of his own in Neddy's place.
        - id: ch01-b08
          speaker: narrator
          text: Jack noticed nothing. The next morning, he rode home to his father on the wrong ass.

    - id: ch02
      title: The Table That Would Be Covered
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Near Jack's home lived a poor widow and her only daughter. Jack and the maiden were faithful sweethearts. When he asked his father's permission to marry her, his father refused.
        - id: ch02-b02
          speaker: father
          text: Not until you have enough money to support her.
        - id: ch02-b03
          speaker: jack
          text: I do have enough, Father.
        - id: ch02-b04
          speaker: narrator
          text: Jack went to the ass and tugged its long ears. He pulled and pulled until one ear came off in his hand. The animal brayed again and again, but not one half crown or guinea fell out.
        - id: ch02-b05
          speaker: narrator
          text: Jack's father snatched up a hayfork and beat him out of the house. Jack ran so hard that he crashed through a door and landed in a joiner's shop.
        - id: ch02-b06
          speaker: joiner
          text: You seem a capable lad. Work for me for a year and a day, and I'll give you good wages.
        - id: ch02-b07
          speaker: narrator
          text: Jack agreed and served the joiner for a year and a day. When the time was up, his master gave him a table as his pay.
        - id: ch02-b08
          speaker: joiner
          text: Say, “Table, be covered,” and it will spread itself with plenty to eat and drink.
        - id: ch02-b09
          speaker: narrator
          text: Jack strapped the table to his back and set off. Before long, he came to the same inn.
        - id: ch02-b10
          speaker: jack
          text: Innkeeper! Bring me your finest dinner today.
        - id: ch02-b11
          speaker: innkeeper
          text: I'm very sorry, but all I have is ham and eggs.
        - id: ch02-b12
          speaker: jack
          text: Ham and eggs? I can fare much better than that. Come, table, be covered!
        - id: ch02-b13
          speaker: narrator
          text: At once, the table filled with turkey and sausages, roast mutton, potatoes, and greens. The innkeeper stared wide-eyed, but he kept quiet.
        - id: ch02-b14
          speaker: narrator
          text: That night, he brought down a similar table from his attic and switched it for Jack's. The next morning, Jack carried the worthless table home without suspecting a thing.
        - id: ch02-b15
          speaker: jack
          text: Father, may I marry my lass now?
        - id: ch02-b16
          speaker: father
          text: Not unless you can provide for her.
        - id: ch02-b17
          speaker: jack
          text: Look here, Father. This table obeys whatever I tell it to do.
        - id: ch02-b18
          speaker: father
          text: Then show me.
        - id: ch02-b19
          speaker: narrator
          text: Jack set the table in the middle of the room and commanded it to be covered. Nothing happened. The tabletop stayed bare.
        - id: ch02-b20
          speaker: narrator
          text: His father flew into a rage. He pulled the warming pan from the wall and warmed Jack's back with it until the lad fled the house, howling. Once again, Jack ran and ran. This time he came to a river and tumbled straight in.

    - id: ch03
      title: Up, Stick, and Bang Him
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: A man pulled Jack from the water and asked him to help build a bridge across the river. And how was the bridge being made? The man was felling a tree across the stream. Jack climbed right to the treetop and pressed down with all his weight. When the man tore up the roots, Jack and the top of the tree dropped onto the far bank.
        - id: ch03-b02
          speaker: bridge_builder
          text: Thank you. Now I'll pay you for your help.
        - id: ch03-b03
          speaker: narrator
          text: The man tore a branch from the tree and shaped it into a club with his knife.
        - id: ch03-b04
          speaker: bridge_builder
          text: Take this stick. Whenever someone angers you, say, “Up, stick, and bang him,” and it will knock that person down.
        - id: ch03-b05
          speaker: narrator
          text: Jack was overjoyed with the stick. He set off at once for the inn. The moment the innkeeper appeared before him, Jack gave the command.
        - id: ch03-b06
          speaker: jack
          text: Up, stick, and bang him!
        - id: ch03-b07
          speaker: narrator
          text: The cudgel sprang from Jack's hand. It thumped the innkeeper's back, rapped his head, bruised his arms, and tickled his ribs until he fell groaning on the floor. Even then, the stick kept beating him.
        - id: ch03-b08
          speaker: narrator
          text: Jack would not call it off until the innkeeper returned the stolen ass and table.

    - id: ch04
      title: Jack Returns in Wealth
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Jack galloped home on Neddy with the recovered table across his shoulders and the stick in his hand. When he arrived at the house, he found that his father was dead.
        - id: ch04-b02
          speaker: narrator
          text: He led the ass into the stable and pulled its ears until money filled the manger. Soon the whole town knew that Jack had returned rolling in wealth. Every girl in the place began trying to win him.
        - id: ch04-b03
          speaker: jack
          text: I'll marry the richest lass in town. Tomorrow, all of you must come before my house with your money in your aprons.

    - id: ch05
      title: The Richest Lass
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The next morning, the street was packed with girls holding out aprons full of gold and silver. Jack's own sweetheart stood among them. She had no gold or silver, only two copper pennies.
        - id: ch05-b02
          speaker: jack
          text: Stand aside, lass. You have no silver or gold, so keep away from the others.
        - id: ch05-b03
          speaker: narrator
          text: Jack spoke roughly, and she obeyed. Tears rolled down her cheeks and filled her apron with diamonds.
        - id: ch05-b04
          speaker: jack
          text: Up, stick, and bang them!
        - id: ch05-b05
          speaker: narrator
          text: The cudgel leaped up and raced along the line of girls. It knocked every one of them on the head and left them senseless on the pavement.
        - id: ch05-b06
          speaker: narrator
          text: Jack gathered all their money and poured it into his true love's lap.
        - id: ch05-b07
          speaker: jack
          text: Now you are the richest lass, and you are the one I'll marry.
