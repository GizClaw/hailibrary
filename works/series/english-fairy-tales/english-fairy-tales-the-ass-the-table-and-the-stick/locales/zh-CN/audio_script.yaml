audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容讲述古老童话，带着轻快而一本正经的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中
    jack:
      display_name: 杰克
      tts:
        delivery: 年轻直率，得意时响亮，受挫时急切
        timbre: 清亮有朝气
        pace: 中等偏快
        pitch: 中高
    innkeeper:
      display_name: 店主
      tts:
        delivery: 圆滑谨慎，挨打时惊慌求饶
        timbre: 浑厚略沙哑
        pace: 中等
        pitch: 中低
    father:
      display_name: 父亲
      tts:
        delivery: 冷硬暴躁，话语短促而不容争辩
        timbre: 粗重低沉
        pace: 中等偏慢
        pitch: 低
    joiner:
      display_name: 木匠
      tts:
        delivery: 爽快务实，说话干脆
        timbre: 结实温和
        pace: 中等
        pitch: 中低
    bridge_builder:
      display_name: 架桥人
      tts:
        delivery: 朴实友善，语气坦荡
        timbre: 沉稳清晰
        pace: 中等
        pitch: 中低
  chapters:
    - id: ch01
      title: 林中老太太的工钱
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "从前有个小伙子，名叫杰克。父亲待他很坏，他在家实在过不下去，便决定逃走，到外面的世界碰碰运气。"
        - id: ch01-b02
          speaker: narrator
          text: "杰克跑啊跑，一直跑到两腿再也迈不动，却一头撞上一个捡柴的小老太太。他喘得连道歉都说不出来。老太太心肠很好，觉得这个小伙子挺能干，便愿意收他做仆人，还答应给他丰厚的工钱。杰克正饿得难受，马上答应了。"
        - id: ch01-b03
          speaker: narrator
          text: "老太太把杰克带回林中的家。他在那里服侍了她整整一年零一天。日子一满，老太太把他叫来，说该付工钱了。她从马厩里牵出一头驴，送给杰克。"
        - id: ch01-b04
          speaker: narrator
          text: "这头驴名叫内迪。只要拉一拉它的耳朵，它立刻就会咿——啊、咿——啊地叫。每叫一声，嘴里就掉出银六便士、半克朗，还有金灿灿的几尼金币。"
    - id: ch02
      title: 被掉包的内迪
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "杰克对这份工钱满意极了。他骑着内迪上路，来到一家客店，把最好的酒菜全点了一遍。店主却说，不先付钱就不给他上菜。杰克只好走进马厩，拉了拉驴耳朵，很快便装了满满一口袋钱。"
        - id: ch02-b02
          speaker: narrator
          text: "店主躲在门缝后面，把一切看得清清楚楚。到了夜里，他牵来自己的一头驴，把宝贝内迪换走了。第二天一早，杰克根本不知道驴被掉了包，就骑回了父亲家。"
        - id: ch02-b03
          speaker: narrator
          text: "杰克家附近住着一个穷寡妇，她只有一个女儿。杰克和那姑娘情投意合，两个人真心相爱。杰克一到家，就请求父亲准许自己娶她。"
        - id: ch02-b04
          speaker: father
          text: "等你有钱养活她，再来谈成亲。"
        - id: ch02-b05
          speaker: jack
          text: "父亲，我已经有钱了。"
        - id: ch02-b06
          speaker: narrator
          text: "杰克走到驴子跟前，用力拉起它的长耳朵。他拉呀拉，竟把一只耳朵扯了下来。那头驴只管咿啊、咿啊地叫，嘴里却连半个克朗、半枚几尼也没掉出来。"
        - id: ch02-b07
          speaker: narrator
          text: "父亲抄起干草叉，把杰克打出了家门。我敢说，他这回跑得可快啦！杰克跑啊跑，一头撞开一扇门，直闯进一间木匠铺。"
        - id: ch02-b08
          speaker: joiner
          text: "你看着倒是个能干的小伙子。替我做满一年零一天，我一定好好付你工钱。"
        - id: ch02-b09
          speaker: narrator
          text: "杰克答应了，跟着木匠干了一年零一天。期满的时候，师傅把他叫到跟前。"
        - id: ch02-b10
          speaker: joiner
          text: "现在该付你工钱了。这张桌子送给你。只要说一声‘桌子，摆上酒菜’，上面马上就会有吃不完的好东西。"
    - id: ch03
      title: 空空的桌子
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "杰克把桌子缚在背上，又来到那家客店。他一进门就高声招呼店主。"
        - id: ch03-b02
          speaker: jack
          text: "喂，店主！今天给我上饭，要你店里最好的！"
        - id: ch03-b03
          speaker: innkeeper
          text: "实在对不住，店里只有火腿和鸡蛋。"
        - id: ch03-b04
          speaker: jack
          text: "你让我吃火腿和鸡蛋？我有更好的。来吧，我的桌子，摆上酒菜！"
        - id: ch03-b05
          speaker: narrator
          text: "话音一落，桌上便摆满了火鸡、香肠、烤羊肉、土豆和青菜。店主看得眼睛都直了，可他一句话也没说。对，一个字也没说。"
        - id: ch03-b06
          speaker: narrator
          text: "当天夜里，店主从阁楼搬下一张十分相像的桌子，偷偷换走了杰克的宝贝。第二天一早，杰克还是毫不知情，把那张没用的桌子背回了家。"
        - id: ch03-b07
          speaker: jack
          text: "父亲，这回我可以娶我的姑娘了吗？"
        - id: ch03-b08
          speaker: father
          text: "除非你有本事养活她。"
        - id: ch03-b09
          speaker: jack
          text: "您看！我有一张桌子，不管我叫它做什么，它都会照办。"
        - id: ch03-b10
          speaker: father
          text: "那就让我看看。"
        - id: ch03-b11
          speaker: narrator
          text: "杰克把桌子放在屋子中央，叫它摆上酒菜。可他怎么叫也没用，桌面始终空空的。父亲大发雷霆，从墙上摘下暖床锅，把儿子的后背狠狠暖了一顿。杰克嚎叫着逃出门去。"
        - id: ch03-b12
          speaker: narrator
          text: "他跑啊跑，一直跑到河边，一脚跌进水里。一个男人把他捞上岸，又叫他帮忙在河上架桥。你猜那人要怎么架？他打算砍倒一棵树，让它横在河上。"
        - id: ch03-b13
          speaker: narrator
          text: "杰克爬到树梢，用全身的重量把树往下压。那男人刨断树根以后，杰克连同树冠一起落到了对岸。"
        - id: ch03-b14
          speaker: bridge_builder
          text: "多谢你帮忙，我也该付你工钱。"
        - id: ch03-b15
          speaker: narrator
          text: "那男人从树上扯下一根枝条，用刀削成一根棍棒，然后交给杰克。"
        - id: ch03-b16
          speaker: bridge_builder
          text: "拿着这根棍子。以后谁惹你生气，只要说‘棍子，起来揍他’，它就会把那个人打倒。"
    - id: ch04
      title: 棍子讨回宝贝
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "杰克得到这根棍子，喜出望外，立刻带着它赶回客店。店主刚一露面，他便喊了起来。"
        - id: ch04-b02
          speaker: jack
          text: "棍子，起来揍他！"
        - id: ch04-b03
          speaker: narrator
          text: "棍棒应声飞出杰克的手，狠捶老店主的后背，又猛敲他的脑袋。它把店主的胳膊打得青一块紫一块，还在他的肋骨上挠痒似的乱抽。店主呻吟着倒在地上，棍子仍旧打个不停。"
        - id: ch04-b04
          speaker: narrator
          text: "杰克一直等到店主交还偷走的驴子和桌子，才叫棍子住手。随后，他把桌子扛在肩上，棍子拿在手里，骑着内迪飞奔回家。"
        - id: ch04-b05
          speaker: narrator
          text: "杰克到家时，发现父亲已经死了。他把内迪牵进马厩，一遍遍拉它的耳朵，直到钱币装满了饲料槽。"
    - id: ch05
      title: 最富有的姑娘
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "没过多久，全镇都知道杰克带着大笔财富回来了。镇上的姑娘个个都想博得他的欢心。"
        - id: ch05-b02
          speaker: jack
          text: "我要娶镇上最富有的姑娘。明天，你们全把钱装进围裙，带到我家门前来。"
        - id: ch05-b03
          speaker: narrator
          text: "第二天早晨，街上站满了姑娘。她们张开围裙，里面盛着金子和银子。杰克自己的心上人也来了，可她没有金子，也没有银子。她只有两枚铜便士，那就是她全部的钱。"
        - id: ch05-b04
          speaker: jack
          text: "姑娘，你站到一边去。你没有银子，也没有金子，离其他人远些。"
        - id: ch05-b05
          speaker: narrator
          text: "杰克说话时粗声粗气。姑娘听话地退到一旁，眼泪顺着脸颊落下来，竟化作钻石，盛满了她的围裙。"
        - id: ch05-b06
          speaker: jack
          text: "棍子，起来揍她们！"
        - id: ch05-b07
          speaker: narrator
          text: "棍棒立刻跳起来，沿着姑娘们排成的长队一路打过去。它把姑娘们一个个敲在头上，打得全都昏倒在人行道上。杰克拿走她们所有的钱，一股脑儿倒进心上人的围裙里。"
        - id: ch05-b08
          speaker: jack
          text: "这下好了。你现在是最富有的姑娘，我就娶你做妻子。"
