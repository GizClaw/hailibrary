audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容讲述古老童话，带着一本正经的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中
    margaret:
      display_name: 玛格丽特公主
      tts:
        delivery: 温柔端庄，身陷魔咒时仍勇敢恳切
        timbre: 清澈柔美
        pace: 中等偏缓
        pitch: 中高
    knight:
      display_name: 骑士
      tts:
        delivery: 坦率热情，赞叹发自内心
        timbre: 明亮洪厚
        pace: 中等
        pitch: 中低
    witch_queen:
      display_name: 女巫王后
      tts:
        delivery: 高傲狠毒，命令冷厉而急切
        timbre: 冷硬锐利
        pace: 中等偏快
        pitch: 中高
    warlock:
      display_name: 术士
      tts:
        delivery: 深沉笃定，像在宣告古老的秘密
        timbre: 苍老低沉
        pace: 缓慢
        pitch: 低
    childe_wynd:
      display_name: 温德王子
      tts:
        delivery: 果决勇敢，面对妹妹时转为谨慎关切
        timbre: 坚实清朗
        pace: 中等
        pitch: 中低
  chapters:
    - id: ch01
      title: 新王后
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "从前，班堡城堡里住着一位国王。他有一位美丽的妻子，还有一双儿女。儿子叫温德王子，女儿叫玛格丽特。温德王子出门闯荡后不久，母后便去世了。国王伤心了很长时间，一直没有忘记她。"
        - id: ch01-b02
          speaker: narrator
          text: "一天，国王打猎时遇见一位绝色女子，一见倾心，决定娶她。他派人回城报信，说要带一位新王后回来。"
        - id: ch01-b03
          speaker: narrator
          text: "玛格丽特公主听说有人要代替母后，心里自然不快。可她没有抱怨，仍照父王的吩咐，在约定的日子带着钥匙来到城门前。迎亲队伍渐渐近了，新王后走到她面前。公主向继母深深行礼，双颊泛红，眼睛望着地面，把城堡钥匙捧了上去。"
        - id: ch01-b04
          speaker: margaret
          text: "亲爱的父王，欢迎您回到自己的厅堂和寝宫。也欢迎您，我的新母后，这里的一切都归您了。请收下这些钥匙吧。"
        - id: ch01-b05
          speaker: narrator
          text: "一名一路护送新王后回来的骑士见了公主，忍不住大声赞叹。"
        - id: ch01-b06
          speaker: knight
          text: "这位北国公主，一定是世上最美的公主！"
        - id: ch01-b07
          speaker: narrator
          text: "新王后听完，脸一下子涨红了。"
        - id: ch01-b08
          speaker: witch_queen
          text: "你要是真懂礼貌，就该说除了我以外！"
          emotion: angry
        - id: ch01-b09
          speaker: narrator
          text: "接着，她压低声音，恶狠狠地咕哝起来。"
        - id: ch01-b10
          speaker: witch_queen
          text: "我很快就会毁掉她的美貌。"
          emotion: angry
        - id: ch01-b11
          speaker: narrator
          text: "原来，新王后是个有名的女巫。当天夜里，她偷偷下到一间僻静的地牢，在那里把咒语念了三遍又三遍，把手势做了九遍又九遍。玛格丽特公主就这样落入了她的魔咒。"
        - id: ch01-b12
          speaker: witch_queen
          text: "我咒你变成丑陋恶龙，永远不得复原真身。除非国王亲生的温德王子来到岩前，给你三吻。否则，哪怕世界走到尽头，你也休想恢复真身。"
    - id: ch02
      title: 斯宾德尔斯顿岩的恶龙
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "玛格丽特入睡时还是个美丽姑娘，醒来却成了一条丑陋恶龙。清晨，侍女们进来替她梳妆，看见床上盘着一条可怕的巨龙。巨龙舒展开身子朝她们逼近，吓得她们尖叫着逃了出去。"
        - id: ch02-b02
          speaker: narrator
          text: "恶龙爬了又爬，蜿蜒又蜿蜒，来到斯宾德尔斯顿岩。它把身子盘在岩石四周，躺着晒起太阳，可怕的长嘴直指天空。"
        - id: ch02-b03
          speaker: narrator
          text: "很快，附近的人都领教了它的厉害。恶龙饿了就钻出洞穴，路上撞见什么便吞掉什么。人们实在没有办法，只好一起去请教一位法力高强的术士，问他究竟该怎么办。术士翻过法书，又询问了身边的精怪，这才说出对策。"
        - id: ch02-b04
          speaker: warlock
          text: "这条恶龙其实就是玛格丽特公主。她做出这些可怕的事，全是饥饿逼的。你们拨出七头母牛，每天日落时，把挤出的每一滴奶都倒进岩脚的石槽。只要有奶充饥，她就不会再祸害乡里。"
        - id: ch02-b05
          speaker: warlock
          text: "要想让公主恢复原样，也让施咒的人受到惩罚，就渡海去请她的哥哥温德王子回来。"
        - id: ch02-b06
          speaker: narrator
          text: "人们全照着做了。恶龙每天喝七头母牛的奶，从此不再惊扰乡野。温德王子听到消息，立下重誓，一定要救回妹妹，也要向狠毒的继母讨还公道。他手下的三十三个人跟着发了誓，大家一起造出一艘长船，还特地用花楸木做了船底的龙骨。准备妥当后，他们划起船桨，直奔班堡城堡。"
    - id: ch03
      title: 渡海归来
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "长船快到城堡时，继母用魔力察觉到有人要对付她。她赶紧召来听命的小魔怪。"
        - id: ch03-b02
          speaker: witch_queen
          text: "温德王子正在渡海，绝不能让他上岸！掀起风暴也好，凿穿船底也好，总之别让他的脚碰到陆地！"
          emotion: angry
        - id: ch03-b03
          speaker: narrator
          text: "小魔怪们出发拦船，可一靠近就发现，自己的魔法根本伤不了它。因为那艘船的龙骨是花楸木做的。它们只得回去复命，女巫王后也没了主意。她命披甲士兵守住岸边，只要温德王子登陆，就上前抵抗。接着，她又施咒逼迫恶龙等在港口入口。"
        - id: ch03-b04
          speaker: narrator
          text: "长船驶近时，恶龙松开盘绕的身躯，探进海里抓住船身，猛地把船撞回海上。温德王子三次催大家奋力划桨，三次都被恶龙挡在岸外。"
        - id: ch03-b05
          speaker: narrator
          text: "王子忽然下令掉转船头。女巫王后以为他终于放弃了，谁知长船只是绕过下一处海岬，平平安安地在巴德尔湾靠了岸。温德王子拔剑张弓，带着手下冲向那条阻挡他们的恶龙。"
        - id: ch03-b06
          speaker: narrator
          text: "就在王子踏上陆地的一刻，女巫控制恶龙的法力消失了。王后独自躲回寝宫，身边没有小魔怪，也没有披甲士兵。她知道，自己的末日到了。"
    - id: ch04
      title: 三个亲吻
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "温德王子冲到恶龙面前，恶龙没有拦他，也没有伤他。王子刚举起剑，正要砍下去，龙口里却传出了亲妹妹玛格丽特的声音。"
        - id: ch04-b02
          speaker: margaret
          text: "快收起长剑，松开弓弦，再给我三个亲吻。我虽是身带剧毒的恶龙，也绝不会伤害你半分。"
        - id: ch04-b03
          speaker: narrator
          text: "温德王子停了手，可他不知道眼前是不是又有巫术作怪。恶龙只得再次恳求。"
        - id: ch04-b04
          speaker: margaret
          text: "快收起长剑，松开弓弦，再给我三个亲吻。若日落前我不能得救，就永远不能恢复真身。"
        - id: ch04-b05
          speaker: narrator
          text: "温德王子走上前，吻了恶龙一下。没有变化。他又吻了一下，还是没有变化。第三次，他吻了那个可憎的怪物。只听一声嘶鸣，一声怒吼，恶龙猛地仰起身子。转眼间，站在王子面前的已经是妹妹玛格丽特。"
        - id: ch04-b06
          speaker: narrator
          text: "王子用斗篷裹住她，带着她来到城堡。到了主堡，他直奔女巫王后的寝宫，用一根花楸树枝碰了她一下。女巫立刻开始萎缩，越缩越小，最后变成一只硕大丑陋的癞蛤蟆。它两眼凸出，瞪得吓人，嘴里发出骇人的嘶嘶声。"
        - id: ch04-b07
          speaker: narrator
          text: "癞蛤蟆一会儿呱呱叫，一会儿嘶嘶叫，蹦跳着逃下城堡台阶。温德王子接替父王做了国王，从此，众人都过上了幸福的生活。"
        - id: ch04-b08
          speaker: narrator
          text: "直到今天，人们偶尔还能在班堡城堡附近，看见那只可憎的癞蛤蟆四处游荡。那个邪恶的女巫王后，如今成了一只丑陋癞蛤蟆。"
