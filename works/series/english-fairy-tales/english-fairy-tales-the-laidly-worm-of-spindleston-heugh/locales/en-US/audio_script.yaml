audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and unhurried, with the steady rhythm of an old fireside tale
        timbre: clear and gently weathered
        pace: measured
        pitch: medium
    margaret:
      display_name: Princess Margaret
      tts:
        delivery: gracious and brave, becoming urgent when trapped by the spell
        timbre: clear and youthful
        pace: measured
        pitch: medium-high
    knight:
      display_name: The Knight
      tts:
        delivery: open and admiring
        timbre: bright and assured
        pace: measured
        pitch: medium
    witch_queen:
      display_name: The Witch-Queen
      tts:
        delivery: proud and cutting, with cold command beneath every word
        timbre: smooth and dark
        pace: deliberate
        pitch: medium-low
    warlock:
      display_name: The Warlock
      tts:
        delivery: grave and certain, as one revealing hidden truth
        timbre: deep and weathered
        pace: slow
        pitch: low
    childe_wynd:
      display_name: Childe Wynd
      tts:
        delivery: bold and resolute, softening only at the sound of his sister
        timbre: strong and clear
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: The New Queen
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long ago, a king lived in Bamborough Castle with his wife and their children, Childe Wynd and Princess Margaret. Childe Wynd sailed away to seek his fortune. Soon afterward, his mother died, and the king mourned her faithfully.
        - id: ch01-b02
          speaker: narrator
          text: Then the king met a beautiful lady while hunting. He fell deeply in love and decided to marry her. He sent word ahead that he would bring a new queen home to Bamborough Castle.
        - id: ch01-b03
          speaker: narrator
          text: Margaret was sorry to see another woman take her mother's place, but she did not complain. On the appointed day, she went to the castle gate with the keys ready for her stepmother.
        - id: ch01-b04
          speaker: narrator
          text: When the procession arrived, Margaret bowed to the new queen and held out the keys. Her cheeks flushed, and she kept her eyes on the ground.
        - id: ch01-b05
          speaker: margaret
          text: Welcome home, dear father, to your halls and bowers. And welcome, my new mother. Everything here is yours.
        - id: ch01-b06
          speaker: narrator
          text: She offered the keys again. One of the new queen's knights gazed at Margaret in wonder.
        - id: ch01-b07
          speaker: knight
          text: Surely no princess in the north could be lovelier than she is.
        - id: ch01-b08
          speaker: narrator
          text: The new queen's face burned with anger.
        - id: ch01-b09
          speaker: witch_queen
          text: You might at least have made an exception for me.
          emotion: angry
        - id: ch01-b10
          speaker: narrator
          text: Then she muttered under her breath.
        - id: ch01-b11
          speaker: witch_queen
          text: Her beauty will not last much longer.
          emotion: angry

    - id: ch02
      title: The Laidly Worm
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: That night, the new queen crept into a lonely dungeon where she worked her magic. She was a noted witch. With spells three times three and passes nine times nine, she laid her enchantment on Margaret.
        - id: ch02-b02
          speaker: witch_queen
          text: I doom you to be a Laidly Worm. You shall never regain your shape until Childe Wynd, the king's son, comes to the Heugh and kisses you three times. No one else shall free you before the world ends.
        - id: ch02-b03
          speaker: narrator
          text: Margaret went to bed a beautiful maiden and rose as a Laidly Worm. Her maidens came to dress her and found a dreadful dragon coiled on the bed. It uncoiled toward them, and they fled, shrieking.
        - id: ch02-b04
          speaker: narrator
          text: The Worm crawled and crept, and crept and crawled, until it reached the Heugh, the great rock of the Spindlestone. It wrapped its coils around the rock and lay there in the sun, its terrible snout raised in the air.
        - id: ch02-b05
          speaker: narrator
          text: Soon the whole countryside knew the Laidly Worm of Spindleston Heugh. Hunger drove it from its cave to devour whatever it found. At last, the people asked a mighty warlock for help.
        - id: ch02-b06
          speaker: narrator
          text: The warlock consulted his books and familiar spirit, then answered them.
        - id: ch02-b07
          speaker: warlock
          text: The Laidly Worm is Princess Margaret. Hunger drives her to these deeds. Set aside seven cows. At sunset, pour all their milk into the stone trough below the Heugh. Then she will trouble you no more.
        - id: ch02-b08
          speaker: warlock
          text: To restore the princess and punish the witch, send across the sea for her brother, Childe Wynd.
        - id: ch02-b09
          speaker: narrator
          text: The people followed every part of his advice. From then on, the Laidly Worm lived on the milk of the seven cows, and the countryside was left in peace.

    - id: ch03
      title: Childe Wynd Comes Home
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: When the news reached Childe Wynd, he swore a mighty oath. He would rescue his sister and avenge her against their cruel stepmother. Thirty-three of his men took the oath beside him.
        - id: ch03-b02
          speaker: narrator
          text: Together they built a long ship with a keel of rowan wood. When it was ready, they took up their oars and pulled straight toward Bamborough Keep.
        - id: ch03-b03
          speaker: narrator
          text: As the ship drew near, the stepmother's magic warned her that someone was working against her. She called up her familiar imps and gave them an order.
        - id: ch03-b04
          speaker: witch_queen
          text: Childe Wynd is crossing the sea, and he must not land. Raise a storm or bore through his hull. Do whatever you must, but never let him reach the shore.
        - id: ch03-b05
          speaker: narrator
          text: The imps flew out to meet the ship. But when they came close, their power failed. The rowan keel protected the vessel from their magic. They hurried back to the witch-queen, and even she did not know what to do next.
        - id: ch03-b06
          speaker: narrator
          text: She commanded her men-at-arms to fight Childe Wynd if he landed nearby. Then she used her spells to make the Laidly Worm wait at the harbor entrance.
        - id: ch03-b07
          speaker: narrator
          text: The long ship approached. The Worm loosened its coils, plunged into the sea, seized the vessel, and battered it away from land. Three times Childe Wynd urged his men to pull bravely with all their strength. Three times the Worm held them off.
        - id: ch03-b08
          speaker: narrator
          text: At last, Childe Wynd ordered the ship to turn away. The witch-queen believed he had abandoned his attempt. Instead, he sailed around the next point and landed safely in Budle Creek.
        - id: ch03-b09
          speaker: narrator
          text: Childe Wynd drew his sword, and his men bent their bows. Then they rushed toward the terrible Worm that had kept them from shore.

    - id: ch04
      title: Three Kisses
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The moment Childe Wynd stepped onto land, the witch-queen lost her power over the Laidly Worm. She went back to her bower alone. Neither imp nor man-at-arms remained to help her, and she knew her hour had come.
        - id: ch04-b02
          speaker: narrator
          text: Childe Wynd raced up to the Worm. It made no move to stop or harm him. He raised his sword to strike, but then his sister Margaret's own voice came from between its jaws.
        - id: ch04-b03
          speaker: margaret
          text: Put down your sword and loosen your bow. Come and kiss me three times. Though I am a poisonous worm, I will do you no harm.
        - id: ch04-b04
          speaker: narrator
          text: Childe Wynd held back his hand. He knew his sister's voice, yet he wondered whether this might be another piece of witchcraft. The Worm spoke again.
        - id: ch04-b05
          speaker: margaret
          text: Put down your sword and loosen your bow. Give me three kisses. If I am not freed before the sun sets, I never shall be.
        - id: ch04-b06
          speaker: narrator
          text: Childe Wynd walked up to the Laidly Worm and kissed it once. Nothing changed. He kissed it a second time, but still the monster kept its dreadful shape.
        - id: ch04-b07
          speaker: narrator
          text: Then he kissed the loathsome creature a third time. With a hiss and a roar, the Worm reared back. In the next moment, it was gone, and his sister Margaret stood before him.
        - id: ch04-b08
          speaker: narrator
          text: Childe Wynd wrapped his cloak around her. Side by side, they went up to the castle.

    - id: ch05
      title: The Laidly Toad
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: When they reached the keep, Childe Wynd went straight to the witch-queen's bower. He found her there and touched her with a twig from a rowan tree.
        - id: ch05-b02
          speaker: narrator
          text: At once, she began to shrivel. Smaller and smaller she grew, until she became a huge, ugly toad with bold, staring eyes and a horrible hiss. She croaked and hissed, then hopped away down the castle steps.
        - id: ch05-b03
          speaker: narrator
          text: Childe Wynd took his father's place as king, and they all lived happily afterward.
        - id: ch05-b04
          speaker: narrator
          text: But even now, people sometimes see a loathsome toad haunting the land around Bamborough Keep. The wicked witch-queen remains a Laidly Toad to this day.
