audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容讲述古老童话，带着一本正经的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中
    mouse:
      display_name: 老鼠
      tts:
        delivery: 客气殷勤，话到要紧处变得胆怯迟疑
        timbre: 轻细清脆
        pace: 轻快
        pitch: 高
    cat:
      display_name: 猫
      tts:
        delivery: 冷淡粗鲁，步步紧逼，最后凶相毕露
        timbre: 沙哑厚实
        pace: 中等偏慢
        pitch: 中低
  chapters:
    - id: ch01
      title: 门后的猫
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "老鼠登门去看猫，只见猫坐在大厅门后纺线。"
        - id: ch01-b02
          speaker: mouse
          text: "夫人呀，夫人呀，你这是在做什么？快告诉我，你在做什么呀，夫人？"
        - id: ch01-b03
          speaker: cat
          text: "我在纺一条旧裤子，好人儿，好人儿。我纺的是旧裤子，好人儿。"
        - id: ch01-b04
          speaker: narrator
          text: "猫答得又尖又利，老鼠仍旧客客气气。"
        - id: ch01-b05
          speaker: mouse
          text: "愿你把它穿得长长久久，夫人呀，夫人呀。愿你一直穿着它，夫人呀。"
        - id: ch01-b06
          speaker: cat
          text: "我会穿破它，再把它扯烂，好人儿，好人儿。穿破它，扯烂它，好人儿。"
        - id: ch01-b07
          speaker: narrator
          text: "猫粗声说完，老鼠又讲起自己的事。"
    - id: ch02
      title: 老鼠的布丁
      blocks:
        - id: ch02-b01
          speaker: mouse
          text: "我方才在打扫房间，夫人呀，夫人呀。我刚才扫了房间，夫人呀。"
        - id: ch02-b02
          speaker: cat
          text: "这么一来，你可就更干净了，好人儿，好人儿。你变得更干净了，好人儿。"
        - id: ch02-b03
          speaker: mouse
          text: "我还捡到一枚六便士银币，夫人呀，夫人呀。我捡到一枚银币，夫人呀。"
        - id: ch02-b04
          speaker: cat
          text: "这么一来，你可就更有钱了，好人儿，好人儿。你变得更富有了，好人儿。"
        - id: ch02-b05
          speaker: mouse
          text: "后来我去了集市，夫人呀，夫人呀。我一路走到集市去了，夫人呀。"
        - id: ch02-b06
          speaker: cat
          text: "这么一来，你可就走得更远了，好人儿，好人儿。你走得更远了，好人儿。"
        - id: ch02-b07
          speaker: mouse
          text: "我给自己买了一个布丁，夫人呀，夫人呀。我在集市买了布丁，夫人呀。"
        - id: ch02-b08
          speaker: narrator
          text: "听到这里，猫龇起了牙。"
        - id: ch02-b09
          speaker: cat
          text: "这么一来，你可就有更多东西吃了，好人儿，好人儿。你有更多吃的了，好人儿。"
        - id: ch02-b10
          speaker: mouse
          text: "我把布丁搁到窗台上，让它慢慢凉下来，夫人呀。我把它放在那里晾凉。"
        - id: ch02-b11
          speaker: cat
          text: "这么一来，你就能快些把它吃掉，好人儿，好人儿。你能更快吃掉它，好人儿。"
        - id: ch02-b12
          speaker: narrator
          text: "猫的声音又尖了起来。老鼠吓得几乎不敢往下说。"
    - id: ch03
      title: 捕鼠猫扑来了
      blocks:
        - id: ch03-b01
          speaker: mouse
          text: "可是猫来了，把布丁吃掉了，夫人呀，夫人呀。猫把它吃了，夫人呀。"
          emotion: fearful
        - id: ch03-b02
          speaker: cat
          text: "那我也要吃掉你，好人儿，好人儿。我要把你吃掉，好人儿。"
        - id: ch03-b03
          speaker: narrator
          text: "猫扑到老鼠身上，把老鼠弄死了。"
