audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容讲述古老童话，带着一本正经的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中
    mother:
      display_name: 母亲
      tts:
        delivery: 贫苦而严正，说起祝福与诅咒时毫不含糊
        timbre: 成熟微哑
        pace: 中等偏慢
        pitch: 中低
    elder_brother:
      display_name: 哥哥
      tts:
        delivery: 年轻气盛，遇到凶险时慌乱迟疑
        timbre: 年轻清朗
        pace: 中等
        pitch: 中
    younger_brother:
      display_name: 弟弟
      tts:
        delivery: 聪敏勇敢，答话爽快坚定
        timbre: 年轻明亮
        pace: 中等
        pitch: 中
    shepherd:
      display_name: 牧羊人
      tts:
        delivery: 像吟唱古老预言，郑重而神秘
        timbre: 苍老粗粝
        pace: 舒缓
        pitch: 低
    castle_woman:
      display_name: 城堡里的老婆婆
      tts:
        delivery: 谨慎忧虑，警告来客时急切真诚
        timbre: 苍老温厚
        pace: 中等偏慢
        pitch: 中低
    red_ettin_head_1:
      display_name: 红埃廷的第一个脑袋
      tts:
        delivery: 凶残蛮横，发问时咄咄逼人
        timbre: 粗重洪亮
        pace: 中慢
        pitch: 低
    red_ettin_head_2:
      display_name: 红埃廷的第二个脑袋
      tts:
        delivery: 阴沉狠毒，话音冷硬逼人
        timbre: 沙哑厚重
        pace: 缓慢
        pitch: 低
    red_ettin_head_3:
      display_name: 红埃廷的第三个脑袋
      tts:
        delivery: 狡猾傲慢，出谜时带着威吓
        timbre: 尖利浑厚
        pace: 中等偏慢
        pitch: 中低
    raven:
      display_name: 乌鸦
      tts:
        delivery: 突然出声提醒，短促而清楚
        timbre: 干涩尖亮
        pace: 中等偏快
        pitch: 高
    fairy:
      display_name: 仙女
      tts:
        delivery: 慈和睿智，指点时清晰笃定
        timbre: 柔和清澈
        pace: 从容
        pitch: 中高
  chapters:
    - id: ch01
      title: 两张饼和一把小刀
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "从前，有个寡妇带着两个儿子，住在向农夫租来的一小块地上。后来，两个儿子到了该出门谋生的年纪。一天，母亲让大儿子拿罐子去井边打水。水带回来多少，她就用多少水烤饼。水多，饼便大。水少，饼便小。儿子上路时，她能给的也只有这张饼。"
        - id: ch01-b02
          speaker: narrator
          text: "大儿子把罐子装满了水，可罐子有破洞。等他回到家，水已经漏掉大半，母亲只能烤出一张很小的饼。她让儿子自己选。"
        - id: ch01-b03
          speaker: mother
          text: "你拿半张饼，我把祝福送给你。你要是拿走整张，跟着你的就只有我的诅咒。"
        - id: ch01-b04
          speaker: narrator
          text: "大儿子怕路途遥远，又不知道下一顿饭在哪里，宁可要整张饼。母亲便把饼和诅咒一起给了他。临走以前，他把弟弟叫到一边，交给弟弟一把小刀。"
        - id: ch01-b05
          speaker: elder_brother
          text: "替我收好这把刀，每天早晨都看看它。刀身一直明亮，就说明我平安无事。它要是暗了，生了锈，那我一定遭了祸。"
        - id: ch01-b06
          speaker: narrator
          text: "说完，大儿子便出门寻找前程。他走过第一天，又走过第二天。到了第三天下午，他看见一个牧羊人坐在羊群旁，便上前问这些羊是谁的。牧羊人用歌谣回答他。"
        - id: ch01-b07
          speaker: shepherd
          text: "爱尔兰的红埃廷，从前住在巴利甘。掳走马尔科姆王的女儿，那是美丽苏格兰的国王。他打她，他捆她，把她缚在木板上。每天还要挥起闪亮的银杖，将她打伤。他像罗马的朱利安，世上没有谁能叫他胆寒。听说命中注定有一人，生来要做他的死敌。可那个人还没有降生，但愿他永远别出世。"
        - id: ch01-b08
          speaker: narrator
          text: "牧羊人还提醒年轻人，前面会遇见一些野兽。那些怪物和他从前见过的任何野兽都不一样，一定得小心。"
    - id: ch02
      title: 哥哥变成石柱
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "年轻人接着赶路。不久，一大群可怕的怪兽挡在眼前。它们都有两个脑袋，每个脑袋上又长着四只角。年轻人吓坏了，掉头拼命逃。最后，他逃上一座小山丘，看见那里有一座城堡，大门一直敞到了墙边。他赶紧躲了进去。"
        - id: ch02-b02
          speaker: narrator
          text: "厨房的炉火旁坐着一个老婆婆。年轻人说自己走了很远，累得厉害，求她留自己住一夜。老婆婆答应了，却警告他说，这座城堡并不是安身的地方。"
        - id: ch02-b03
          speaker: castle_woman
          text: "这里属于红埃廷。他生着三个脑袋，是个凶恶透顶的怪物。只要让他抓到活人，他一个也不会放过。"
        - id: ch02-b04
          speaker: narrator
          text: "年轻人很想离开，可城堡外还有那群怪兽。他只好求老婆婆尽力把自己藏好，别向红埃廷泄露半点消息。他想着，只要熬过这一夜，明早或许就能避开怪兽逃走。可他藏起来还没多久，红埃廷便回来了。三个脑袋一进门，就一同喊起来。"
        - id: ch02-b05
          speakers: [red_ettin_head_1, red_ettin_head_2, red_ettin_head_3]
          ensemble: chorus
          text: "前屋嗅，后屋闻，凡人的气味我闻得真。不管是活人还是死人，今晚都要拿他的心下饭吞。"
        - id: ch02-b06
          speaker: narrator
          text: "红埃廷很快找到了可怜的年轻人，把他从藏身处拖出来。怪物说，年轻人若能答出三个问题，就可以活命。第一个脑袋先开口。"
        - id: ch02-b07
          speaker: red_ettin_head_1
          text: "什么东西没有尽头？"
        - id: ch02-b08
          speaker: elder_brother
          text: "我不知道。"
        - id: ch02-b09
          speaker: red_ettin_head_2
          text: "什么东西越小越危险？"
        - id: ch02-b10
          speaker: elder_brother
          text: "这个我也答不出来。"
        - id: ch02-b11
          speaker: red_ettin_head_3
          text: "死人背着活人。你来猜猜，这是什么？"
        - id: ch02-b12
          speaker: elder_brother
          text: "我认输，我还是不知道。"
        - id: ch02-b13
          speaker: narrator
          text: "三个问题，大儿子一个也没答出来。红埃廷拿起木槌，朝他头上一敲，把他变成了一根石柱。"
    - id: ch03
      title: 弟弟和仙女
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "第二天早晨，弟弟取出小刀，发现刀身已经满是褐色的锈。他难过极了，告诉母亲，自己也到了出门远行的时候。母亲又让儿子拿破罐子去井边打水，好给他烤一张饼。弟弟打好水往回走，头顶的一只乌鸦忽然叫了起来。"
        - id: ch03-b02
          speaker: raven
          text: "低头看看！罐里的水正在往外漏！"
        - id: ch03-b03
          speaker: narrator
          text: "弟弟很有头脑。他一看水正从破洞流走，马上找来泥，把洞堵住。带回家的水足够烤一张大饼。母亲还是给了他同样的选择。"
        - id: ch03-b04
          speaker: mother
          text: "半张饼带着我的祝福，整张饼带着我的诅咒。你要哪一样？"
        - id: ch03-b05
          speaker: younger_brother
          text: "我宁愿拿半张饼，也要您的祝福。"
        - id: ch03-b06
          speaker: narrator
          text: "这半张饼已经比哥哥拿走的整张还大。弟弟带着它上了路。走了很远以后，他遇见一个老婆婆。老婆婆问他，能不能分一点玉米饼给她。"
        - id: ch03-b07
          speaker: younger_brother
          text: "当然可以，我很愿意分给您。"
        - id: ch03-b08
          speaker: narrator
          text: "弟弟掰下一块饼，递给老婆婆。老婆婆送给他一根魔杖作为回报，还说只要用得对，这根魔杖日后便能救助他。原来她是一位仙女。她把年轻人将会遇到的许多事，还有每一步该怎么做，全都告诉了他。交代完以后，她一眨眼便消失了。"
        - id: ch03-b09
          speaker: fairy
          text: "记住我告诉你的话，也要好好使用这根魔杖。这样，我送你的东西才帮得上你。"
        - id: ch03-b10
          speaker: narrator
          text: "弟弟继续赶路，又走了很远，来到那个放羊的老人面前。他也问这些羊属于谁。牧羊人再次唱起那首歌谣，可歌谣的结尾已经不同了。"
        - id: ch03-b11
          speaker: shepherd
          text: "爱尔兰的红埃廷，从前住在巴利甘。掳走马尔科姆王的女儿，那是美丽苏格兰的国王。他打她，他捆她，把她缚在木板上。每天还要挥起闪亮的银杖，将她打伤。他像罗马的朱利安，世上没有谁能叫他胆寒。可我怕他的末日已近，命中劫数就在眼前。我一眼便能看出，你将继承他的田园。"
    - id: ch04
      title: 红埃廷的三道谜语
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "弟弟来到那些怪兽盘踞的地方。他没有停下，也没有逃跑，而是勇敢地从怪兽中间穿过去。一只怪兽张开大嘴，咆哮着扑来，要把他吞掉。弟弟举起魔杖一击，那怪兽立刻死在他脚边。"
        - id: ch04-b02
          speaker: narrator
          text: "不久，他到了红埃廷的城堡，敲门进去。炉火旁的老婆婆告诉他，红埃廷有多么可怕，也告诉他哥哥落得了什么下场。弟弟听完，仍旧毫不畏惧。很快，红埃廷回来了。三个脑袋又一齐叫喊。"
        - id: ch04-b03
          speakers: [red_ettin_head_1, red_ettin_head_2, red_ettin_head_3]
          ensemble: chorus
          text: "前屋嗅，后屋闻，凡人的气味我闻得真。不管是活人还是死人，都要拿他的心下饭吞。"
        - id: ch04-b04
          speaker: narrator
          text: "红埃廷一下便发现了弟弟，命令他走到屋子中央，又拿出那三道谜语。可好心的仙女早已告诉弟弟一切，他知道所有答案。第一个脑袋问他。"
        - id: ch04-b05
          speaker: red_ettin_head_1
          text: "什么东西没有尽头？"
        - id: ch04-b06
          speaker: younger_brother
          text: "没有尽头的是一只圆碗。"
        - id: ch04-b07
          speaker: red_ettin_head_2
          text: "什么东西越小越危险？"
        - id: ch04-b08
          speaker: younger_brother
          text: "越小越危险的是一座桥。"
        - id: ch04-b09
          speaker: red_ettin_head_3
          text: "什么时候死人会背着活人？你来猜猜。"
        - id: ch04-b10
          speaker: younger_brother
          text: "一艘船载着人在海上航行的时候。"
        - id: ch04-b11
          speaker: narrator
          text: "红埃廷听见三个答案，知道自己的法力已经消失。弟弟拿起一把斧头，砍下了怪物的三个脑袋。"
    - id: ch05
      title: 石柱重新活过来
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "弟弟请城堡里的老婆婆带他去找国王的女儿。老婆婆领他上楼，打开许许多多扇门。每一扇门后，都走出一位被红埃廷囚禁的美丽姑娘，其中一个正是国王的女儿。"
        - id: ch05-b02
          speaker: narrator
          text: "老婆婆又带弟弟下楼，进了一间低矮的屋子。那里面立着一根石柱。弟弟只要用魔杖碰它一下，哥哥就能活过来。他照着做了，哥哥立刻活生生地跳了出来。"
        - id: ch05-b03
          speaker: narrator
          text: "所有囚徒都为重获自由而欢喜，纷纷感谢救了她们的年轻人。第二天，众人一起出发，前往国王的宫廷。他们浩浩荡荡地走在路上，真是一支气派非凡的队伍。"
        - id: ch05-b04
          speaker: narrator
          text: "到了王宫，国王把自己的女儿嫁给救她的弟弟，又把一位贵族的女儿嫁给哥哥。从那以后，他们全都快快活活地过了一辈子。"
