audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and unhurried, with the steady rhythm of an old fireside tale
        timbre: clear and gently weathered
        pace: measured
        pitch: medium
    mr_vinegar:
      display_name: Mr. Vinegar
      tts:
        delivery: eager and impulsive, easily carried away by each new idea
        timbre: light and open
        pace: medium
        pitch: medium-high
    mrs_vinegar:
      display_name: Mrs. Vinegar
      tts:
        delivery: practical and forceful, with feelings close to the surface
        timbre: mature and sturdy
        pace: medium
        pitch: medium
    thief:
      display_name: Thief
      tts:
        delivery: low and businesslike, speaking with guarded confidence
        timbre: rough and shadowed
        pace: measured
        pitch: low
    bagpiper:
      display_name: Bagpiper
      tts:
        delivery: smooth and persuasive, quick to spot a favorable bargain
        timbre: bright and seasoned
        pace: medium
        pitch: medium
    glove_man:
      display_name: Glove Seller
      tts:
        delivery: cheerful and persuasive, with an easy salesman's assurance
        timbre: clear and mellow
        pace: medium
        pitch: medium
    stick_man:
      display_name: Traveler
      tts:
        delivery: friendly and matter-of-fact, with the ease of a practiced walker
