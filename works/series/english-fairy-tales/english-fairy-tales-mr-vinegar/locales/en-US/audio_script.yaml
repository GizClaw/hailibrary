  chapters:
    - id: ch01
      title: The Door in the Tree
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Mr. and Mrs. Vinegar lived in a vinegar bottle. Mrs. Vinegar was a very good housewife. One day, while Mr. Vinegar was away, she was busily sweeping their house. The broom gave one unlucky thump, and the whole house came clitter-clatter, clitter-clatter, down around her ears. Overcome with grief, she rushed out to meet her husband.
        - id: ch01-b02
          speaker: mrs_vinegar
          text: Oh, Mr. Vinegar, we're ruined! I knocked our house down, and now it's all in pieces!
          emotion: sad
        - id: ch01-b03
          speaker: mr_vinegar
          text: My dear, let's see what we can do. The door is still here. I'll carry it on my back, and we'll go out to seek our fortune.
        - id: ch01-b04
          speaker: narrator
          text: They walked all day. At nightfall, they entered a thick forest. Both of them were very, very tired.
        - id: ch01-b05
          speaker: mr_vinegar
          text: My love, I'll climb this tree and pull up the door. Then you can climb up after me.
        - id: ch01-b06
          speaker: narrator
          text: Mr. Vinegar climbed the tree and dragged the door up after him. Mrs. Vinegar followed. Then they stretched their weary legs across the door and fell fast asleep.
        - id: ch01-b07
          speaker: narrator
          text: In the middle of the night, voices below woke Mr. Vinegar. To his horror, a band of thieves had gathered under the tree to divide their loot.
        - id: ch01-b08
          speaker: thief
          text: Here, Jack, five pounds for you. Bill, you get ten pounds. And Bob, here are three pounds for you.
        - id: ch01-b09
          speaker: narrator
          text: Mr. Vinegar was so terrified that he trembled and trembled. At last, he shook the door right out of the tree and down onto the thieves' heads. They scampered away, but Mr. Vinegar did not dare leave the tree until broad daylight.

    - id: ch02
      title: Forty Golden Guineas
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: In the morning, Mr. Vinegar scrambled out of the tree and went to lift the fallen door. He could hardly believe what he saw beneath it. There lay a heap of golden guineas.
        - id: ch02-b02
          speaker: mr_vinegar
          text: Come down, Mrs. Vinegar! Come down! We've made our fortune!
          emotion: happy
        - id: ch02-b03
          speaker: narrator
          text: Mrs. Vinegar climbed down as fast as she could. When she saw the money, she jumped for joy.
        - id: ch02-b04
          speaker: mrs_vinegar
          text: Now, my dear, here's what you should do. There's a fair in the next town. Take these forty guineas and buy a cow. I can make butter and cheese, and you can sell them at market. Then we'll live very comfortably.
        - id: ch02-b05
          speaker: narrator
          text: Mr. Vinegar gladly agreed. He took the money and set off for the fair. After walking up and down among the stalls, he saw a beautiful red cow. She gave excellent milk and seemed perfect in every way.
        - id: ch02-b06
          speaker: mr_vinegar
          text: If only I had that cow, I'd be the happiest man alive.
        - id: ch02-b07
          speaker: narrator
          text: He offered all forty guineas for her. The owner said that, since Mr. Vinegar was a friend, he would oblige him. The bargain was made. Mr. Vinegar took the cow and proudly drove her back and forth for everyone to see.

    - id: ch03
      title: The Beautiful Bagpipes
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Before long, he saw a man playing the bagpipes. Tweedle-dum, tweedle-dee! Children followed the piper everywhere, while money seemed to pour into his pockets from every side.
        - id: ch03-b02
          speaker: mr_vinegar
          text: If only I had that beautiful instrument, I'd be the happiest man alive. My fortune would be made.
        - id: ch03-b03
          speaker: narrator
          text: He went up to the bagpiper.
        - id: ch03-b04
          speaker: mr_vinegar
          text: Friend, what a beautiful instrument! You must earn a great deal of money with it.
        - id: ch03-b05
          speaker: bagpiper
          text: Oh, yes, I certainly earn plenty. It's a wonderful instrument.
        - id: ch03-b06
          speaker: mr_vinegar
          text: How I wish it were mine!
        - id: ch03-b07
          speaker: bagpiper
          text: Well, since you're a friend, I suppose I could part with it. Give me that red cow, and the bagpipes are yours.
        - id: ch03-b08
          speaker: mr_vinegar
          text: Done!
          emotion: happy
        - id: ch03-b09
          speaker: narrator
          text: Delighted, Mr. Vinegar traded the beautiful red cow for the bagpipes. Then he walked up and down with his new purchase, trying again and again to play. But he could not get a tune from it. No pennies came his way. Instead, the boys followed him, hooting, laughing, and pelting him.

    - id: ch04
      title: Warm Hands and Weary Legs
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Poor Mr. Vinegar's fingers grew very cold. Just as he was leaving town, he met a man wearing a fine, thick pair of gloves.
        - id: ch04-b02
          speaker: mr_vinegar
          text: My fingers are freezing. If only I had those beautiful gloves, I'd be the happiest man alive.
        - id: ch04-b03
          speaker: narrator
          text: He went over to the man.
        - id: ch04-b04
          speaker: mr_vinegar
          text: Friend, those look like an excellent pair of gloves.
        - id: ch04-b05
          speaker: glove_man
          text: They certainly are. Even on this cold November day, my hands are as warm as can be.
        - id: ch04-b06
          speaker: mr_vinegar
          text: Well, I'd like to have them.
        - id: ch04-b07
          speaker: glove_man
          text: What will you give me? Since you're a friend, I'll let you have them for those bagpipes.
        - id: ch04-b08
          speaker: mr_vinegar
          text: Done!
          emotion: happy
        - id: ch04-b09
          speaker: narrator
          text: Mr. Vinegar put on the gloves. Feeling perfectly happy, he trudged toward home.
        - id: ch04-b10
          speaker: narrator
          text: After a while, he grew very tired. Then he saw a man coming toward him with a good, stout walking stick.
        - id: ch04-b11
          speaker: mr_vinegar
          text: If only I had that stick, I'd be the happiest man alive.
        - id: ch04-b12
          speaker: mr_vinegar
          text: Friend, that is a wonderfully good stick you've got.
        - id: ch04-b13
          speaker: stick_man
          text: Yes, it has carried me over many a long mile, and it has served me well. But if you've taken a fancy to it, I'll give it to you for those gloves. After all, you're a friend.
        - id: ch04-b14
          speaker: narrator
          text: Mr. Vinegar thought of how warm the gloves had made his hands and how tired his legs now felt. A stout stick seemed just the thing he needed, so he gladly made the exchange.

    - id: ch05
      title: The Parrot in the Tree
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: As Mr. Vinegar neared the wood where he had left his wife, he heard a parrot in a tree calling his name.
        - id: ch05-b02
          speaker: parrot
          text: Mr. Vinegar, you foolish man! You blockhead! You simpleton! You went to the fair and spent all your money on a cow. Then you traded the cow for bagpipes you couldn't play, though they weren't worth a tenth as much. Next you gave away the bagpipes for gloves worth less than a quarter of their value. Then you traded the gloves for one miserable stick. After forty guineas, a cow, bagpipes, and gloves, all you have left is a poor stick you could have cut from any hedge!
        - id: ch05-b03
          speaker: narrator
          text: The bird laughed and laughed. Mr. Vinegar flew into a violent rage and hurled the stick at its head. The stick caught in the tree.
        - id: ch05-b04
          speaker: narrator
          text: So he returned to his wife with no money, no cow, no bagpipes, no gloves, and no stick. Mrs. Vinegar instantly gave him such a sound cudgelling that she almost broke every bone in his skin.
