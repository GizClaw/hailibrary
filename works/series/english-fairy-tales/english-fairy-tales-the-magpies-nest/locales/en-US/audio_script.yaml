audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and unhurried, with the steady rhythm of an old fireside tale
        timbre: clear and gently weathered
        pace: measured
        pitch: medium
    magpie:
      display_name: Madge Magpie
      tts:
        delivery: capable and patient at first, turning sharp when repeatedly ignored
        timbre: bright and crisp
        pace: measured
        pitch: medium-high
    thrush:
      display_name: Thrush
      tts:
        delivery: quick and confidently satisfied
        timbre: light and musical
        pace: brisk
        pitch: high
    blackbird:
      display_name: Blackbird
      tts:
        delivery: assured and eager to be off
        timbre: smooth and mellow
        pace: brisk
        pitch: medium
    owl:
      display_name: Wise Owl
      tts:
        delivery: certain and knowingly dignified
        timbre: rounded and resonant
        pace: deliberate
        pitch: low
    sparrow:
      display_name: Sparrow
      tts:
        delivery: lively and impulsive
        timbre: small and chirpy
        pace: quick
        pitch: high
    starling:
      display_name: Starling
      tts:
        delivery: pleased and decisive
        timbre: clear and nimble
        pace: brisk
        pitch: medium-high
    turtle_dove:
      display_name: Turtle-Dove
      tts:
        delivery: absent-minded and endlessly repetitive, with a long cooing finish
        timbre: soft and hollow
        pace: slow
        pitch: medium
  chapters:
    - id: ch01
      title: The Birds Ask for a Lesson
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, pigs spoke in rhyme, monkeys chewed tobacco, hens took snuff to make themselves tough, and ducks went quack, quack, quack, O!
        - id: ch01-b02
          speaker: narrator
          text: In those days, all the birds of the air came to the magpie. They wanted her to teach them how to build nests, because no bird was cleverer at nest-building than she was. Madge Magpie gathered them around and began her lesson.
        - id: ch01-b03
          speaker: narrator
          text: First, she took some mud and shaped it into a kind of round cake.
        - id: ch01-b04
          speaker: thrush
          text: Oh, so that's the way to do it!
        - id: ch01-b05
          speaker: narrator
          text: The thrush flew away at once. And that is how thrushes have built their nests ever since.

    - id: ch02
      title: One Bird After Another
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Next, the magpie took some twigs and set them in a ring around the mud.
        - id: ch02-b02
          speaker: blackbird
          text: Now I understand the whole thing!
        - id: ch02-b03
          speaker: narrator
          text: Off flew the blackbird. And blackbirds still make their nests that way today.
        - id: ch02-b04
          speaker: narrator
          text: The magpie spread another layer of mud over the twigs.
        - id: ch02-b05
          speaker: owl
          text: Ah, yes. The rest is perfectly clear.
        - id: ch02-b06
          speaker: narrator
          text: The wise owl flew away, and owls have never made any better nests since then.
        - id: ch02-b07
          speaker: narrator
          text: After that, the magpie took more twigs and wove them around the outside.
        - id: ch02-b08
          speaker: sparrow
          text: That's just what I needed to see!
        - id: ch02-b09
          speaker: narrator
          text: Away went the sparrow. That is why sparrows still make rather untidy nests.
        - id: ch02-b10
          speaker: narrator
          text: Then Madge Magpie gathered feathers and other soft things. She lined the inside until the nest was very comfortable.
        - id: ch02-b11
          speaker: starling
          text: That will do nicely for me!
        - id: ch02-b12
          speaker: narrator
          text: The starling flew off too. And starlings have had very comfortable nests ever since.

    - id: ch03
      title: The Last Bird Listening
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: So it went on. Each bird learned one part of nest-building and then hurried away. Not one of them waited for the lesson to end.
        - id: ch03-b02
          speaker: narrator
          text: All the while, Madge Magpie kept working without looking up. At last, only the turtle-dove remained. But the turtle-dove had not been paying attention at all. It simply went on repeating its foolish cry.
        - id: ch03-b03
          speaker: turtle_dove
          text: Take two, Taffy. Take two-o-o-o.
        - id: ch03-b04
          speaker: narrator
          text: Just as the magpie laid a twig across the nest, she finally heard the turtle-dove.
        - id: ch03-b05
          speaker: magpie
          text: One is enough.
        - id: ch03-b06
          speaker: narrator
          text: But the turtle-dove kept saying the same thing.
        - id: ch03-b07
          speaker: turtle_dove
          text: Take two, Taffy. Take two-o-o-o.

    - id: ch04
      title: The Magpie Flies Away
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The magpie grew angry.
        - id: ch04-b02
          speaker: magpie
          text: I tell you, one is enough!
          emotion: angry
        - id: ch04-b03
          speaker: narrator
          text: Still the turtle-dove called out.
        - id: ch04-b04
          speaker: turtle_dove
          text: Take two, Taffy. Take two-o-o-o.
        - id: ch04-b05
          speaker: narrator
          text: At long last, the magpie looked up. Every other bird had gone. Nobody was near her except that foolish turtle-dove. Madge Magpie became very angry indeed. She flew away and refused ever to teach the birds how to build nests again.
        - id: ch04-b06
          speaker: narrator
          text: And that is why different birds build their nests in different ways.
