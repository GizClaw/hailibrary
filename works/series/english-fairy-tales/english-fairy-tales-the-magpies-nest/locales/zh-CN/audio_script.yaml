audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容讲述古老童话，带着轻快而一本正经的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中
    magpie:
      display_name: 喜鹊玛姬
      tts:
        delivery: 聪明能干，专心示范，动怒时干脆利落
        timbre: 清亮敏捷
        pace: 中等偏快
        pitch: 中高
    thrush:
      display_name: 鸫鸟
      tts:
        delivery: 一知半解却十分笃定
        timbre: 清脆轻盈
        pace: 轻快
        pitch: 高
    blackbird:
      display_name: 乌鸫
      tts:
        delivery: 自信爽快，刚懂一点便急着离开
        timbre: 圆润明亮
        pace: 中等偏快
        pitch: 中
    owl:
      display_name: 猫头鹰
      tts:
        delivery: 自认聪明，语气郑重而自满
        timbre: 低柔沉稳
        pace: 中等偏缓
        pitch: 低
    sparrow:
      display_name: 麻雀
      tts:
        delivery: 急切活泼，想到什么便脱口而出
        timbre: 细亮轻巧
        pace: 快
        pitch: 高
    starling:
      display_name: 椋鸟
      tts:
        delivery: 快活满意，反应直率
        timbre: 明快饱满
        pace: 中等偏快
        pitch: 中高
    turtle_dove:
      display_name: 斑鸠
      tts:
        delivery: 心不在焉，反复咕咕念着同一句话
        timbre: 柔和浑圆
        pace: 舒缓拖长
        pitch: 中低
  chapters:
    - id: ch01
      title: 鸟儿们来学筑巢
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "从前，猪会把诗吟，猴儿嚼烟草上瘾，母鸡吸鼻烟壮身，鸭子嘎嘎叫不停！"
        - id: ch01-b02
          speaker: narrator
          text: "天上所有的鸟儿都来请教喜鹊，想跟她学习怎样筑巢。因为论起这门手艺，再没有哪只鸟比喜鹊更聪明。喜鹊让大家围过来，便开始示范。她先衔来泥，做出一块圆圆的泥饼。"
        - id: ch01-b03
          speaker: thrush
          text: "啊，我看懂了，巢原来要这么做。"
        - id: ch01-b04
          speaker: narrator
          text: "鸫鸟说完就飞走了。于是，鸫鸟的巢便总是这样造的。"
        - id: ch01-b05
          speaker: narrator
          text: "下一步，她把细枝一根根衔来，围着泥饼排好。"
        - id: ch01-b06
          speaker: blackbird
          text: "行了，这回我什么都知道了。"
        - id: ch01-b07
          speaker: narrator
          text: "乌鸫觉得自己已经学全，拍拍翅膀也走了。直到今天，它们筑巢用的还是这个办法。"
    - id: ch02
      title: 没有谁等到最后
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "可喜鹊还没做完。她又拿泥盖住那圈细枝。"
        - id: ch02-b02
          speaker: owl
          text: "哦，这一步明明白白，我已经会了。"
        - id: ch02-b03
          speaker: narrator
          text: "那只自以为聪明的猫头鹰也飞了。从那以后，猫头鹰再没造出过更好的巢。"
        - id: ch02-b04
          speaker: narrator
          text: "这还没完。喜鹊再取来细枝，绕着巢外一根根编起来。"
        - id: ch02-b05
          speaker: sparrow
          text: "对，对，就是这样！"
        - id: ch02-b06
          speaker: narrator
          text: "麻雀说完便飞走了，所以麻雀直到如今还是把巢搭得挺马虎。"
        - id: ch02-b07
          speaker: narrator
          text: "接下来轮到巢里面了。喜鹊玛姬找来羽毛和柔软的东西，铺得舒舒服服。"
        - id: ch02-b08
          speaker: starling
          text: "这样就很合我的心意！"
        - id: ch02-b09
          speaker: narrator
          text: "椋鸟叫了一声，也飞走了。倒是椋鸟的巢，从来都十分舒服。"
        - id: ch02-b10
          speaker: narrator
          text: "就这样，鸟儿们各自学到一点便离开了，没有谁肯留下来看到最后。喜鹊玛姬却一直埋头干活，连头都没有抬。"
    - id: ch03
      title: 斑鸠只会说拿两根
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "到后来，喜鹊身边只剩下一只斑鸠。可这只斑鸠从开始就没认真看过，只顾一遍又一遍地叫。"
        - id: ch03-b02
          speaker: turtle_dove
          text: "拿两根，塔菲，拿两根——"
        - id: ch03-b03
          speaker: narrator
          text: "喜鹊正好要横放一根细枝，这才听见斑鸠的叫声。"
        - id: ch03-b04
          speaker: magpie
          text: "一根就够了。"
        - id: ch03-b05
          speaker: narrator
          text: "斑鸠不理会，仍旧叫个不停。"
        - id: ch03-b06
          speaker: turtle_dove
          text: "拿两根，塔菲，拿两根——"
        - id: ch03-b07
          speaker: narrator
          text: "喜鹊听得生了气。"
        - id: ch03-b08
          speaker: magpie
          text: "我说了，一根就够！"
          emotion: angry
        - id: ch03-b09
          speaker: narrator
          text: "可是斑鸠还在叫。"
        - id: ch03-b10
          speaker: turtle_dove
          text: "拿两根，塔菲，拿两根——"
        - id: ch03-b11
          speaker: narrator
          text: "等了又等，喜鹊终于抬头一看，才发现别的鸟早已走光，身边只有这只傻斑鸠。她顿时火冒三丈，振翅飞走了，从此再也不肯教鸟儿们筑巢。所以，不同的鸟才会造出不同的巢。"
