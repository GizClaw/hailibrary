audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and unhurried, with the steady rhythm of an old fireside tale
        timbre: clear and gently weathered
        pace: measured
        pitch: medium
    pupil:
      display_name: Pupil
      tts:
        delivery: young and impulsive, turning breathless when frightened
        timbre: light and clear
        pace: medium-fast
        pitch: medium-high
    beelzebub:
      display_name: Beelzebub
      tts:
        delivery: commanding and relentless, with every word carrying a furnace-like threat
        timbre: deep and rumbling
        pace: measured
        pitch: very low
  chapters:
    - id: ch01
      title: The Black Book
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long ago, in the north-country, there lived a very learned man. He knew every language under the sun and all the mysteries of creation.
        - id: ch01-b02
          speaker: narrator
          text: He owned one great book. It was bound in black calfskin, clasped and cornered with iron, and chained to a table fixed firmly to the floor. Whenever the master read it, he first unlocked it with an iron key. No one else was allowed to read a word.
        - id: ch01-b03
          speaker: narrator
          text: The book held all the secrets of the spirit world. It told how many angels were in heaven, how they marched in their ranks and sang in their choirs, what work each one did, and the name of every mighty angel.
        - id: ch01-b04
          speaker: narrator
          text: It told about the demons too. It named them, counted them, and described their powers and their labors. It even gave the words for summoning them, setting them tasks, and chaining them as servants to human beings.
        - id: ch01-b05
          speaker: narrator
          text: This master had a pupil, a foolish young lad who also served him. The boy was never permitted to look inside the black book. He was hardly even allowed into the master's private room.

    - id: ch02
      title: The Pupil Tries the Master's Arts
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: One day, while the master was away, curiosity got the better of the lad. He hurried into the room where the master kept all his wondrous instruments.
        - id: ch02-b02
          speaker: narrator
          text: There were crucibles for changing copper into gold and lead into silver. The pupil tried them, but nothing happened. There was a mirror that showed the master anything taking place in the world. The boy stared into it, but all he saw were clouds and smoke.
        - id: ch02-b03
          speaker: narrator
          text: There was also a shell that could whisper every word spoken by anyone the master wished to hear. The lad held it to his ear. He heard only a confused murmur, like distant seas breaking on some unknown shore.
        - id: ch02-b04
          speaker: pupil
          text: I can't make any of it work. I don't know the right words, and they're all locked away in that book.
        - id: ch02-b05
          speaker: narrator
          text: Then he looked around and saw that the book was not locked. The master had forgotten to fasten it before leaving. The boy rushed over and opened it.
        - id: ch02-b06
          speaker: narrator
          text: Its pages were covered in red and black writing. He could understand very little, but he placed his finger beneath one line and slowly spelled out the words.

    - id: ch03
      title: A Task for Beelzebub
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: At once, darkness filled the room and the whole house shook. Thunder crashed through the passage and into the old chamber. Then a horrible shape stood before the pupil, breathing fire, with eyes like burning lamps.
        - id: ch03-b02
          speaker: narrator
          text: It was the demon Beelzebub. The boy had summoned him and now had to give him work.
        - id: ch03-b03
          speaker: beelzebub
          text: Give me a task!
          emotion: angry
        - id: ch03-b04
          speaker: narrator
          text: His voice roared like an iron furnace. The pupil could only tremble, and his hair stood on end.
        - id: ch03-b05
          speaker: beelzebub
          text: Give me a task, or I'll strangle you!
          emotion: angry
        - id: ch03-b06
          speaker: narrator
          text: Still the lad could not speak. The evil spirit stepped closer, reached out, and laid his hands on the boy's throat. His fingers burned the pupil's skin.
        - id: ch03-b07
          speaker: beelzebub
          text: Give me a task!
          emotion: angry
        - id: ch03-b08
          speaker: pupil
          text: Water that flower!
          emotion: fearful
        - id: ch03-b09
          speaker: narrator
          text: In despair, the boy pointed to a geranium in a pot on the floor. The spirit vanished, then returned in an instant with a barrel on his back. He emptied it over the flower.
        - id: ch03-b10
          speaker: narrator
          text: Again and again, Beelzebub went away and came back. Each time he poured out another barrel, until water covered the floor up to the boy's ankles.
        - id: ch03-b11
          speaker: pupil
          text: Stop! That's enough!
          emotion: fearful
        - id: ch03-b12
          speaker: narrator
          text: But the demon paid no attention. The pupil did not know the words that would send him away, so Beelzebub kept fetching water.

    - id: ch04
      title: The Rising Water
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The water climbed to the boy's knees, and still more came pouring in. It rose to his waist, while Beelzebub went on carrying full barrels into the room.
        - id: ch04-b02
          speaker: narrator
          text: When it reached his armpits, the pupil scrambled onto the table. Soon the water stood as high as the window. It washed against the glass and swirled around his feet. Then it climbed to his chest.
        - id: ch04-b03
          speaker: narrator
          text: The boy cried out, but nothing would make the evil spirit leave. Beelzebub would still be pouring water today, and all Yorkshire would have drowned, if the master had not remembered the unlocked book while he was traveling.
        - id: ch04-b04
          speaker: narrator
          text: The master hurried home. Just as the water began bubbling around his pupil's chin, he rushed into the room and spoke the words of dismissal. In an instant, Beelzebub was cast back into his fiery home.
