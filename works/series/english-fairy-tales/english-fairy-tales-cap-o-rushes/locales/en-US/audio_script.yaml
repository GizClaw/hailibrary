        timbre: clear and gently weathered
        pace: measured
        pitch: medium
    cap_o_rushes:
      display_name: Cap o' Rushes
      tts:
        delivery: gentle and self-possessed, with quiet courage beneath her modest manner
        timbre: clear and youthful
        pace: medium
        pitch: medium-high
    father:
      display_name: Father
      tts:
        delivery: proud and commanding, softening when sorrow breaks through
        timbre: rich and mature
        pace: measured
        pitch: medium-low
    eldest_daughter:
      display_name: Eldest Daughter
      tts:
        delivery: warm and assured, speaking with polished affection
        timbre: smooth and youthful
        pace: medium
        pitch: medium-high
    second_daughter:
      display_name: Second Daughter
      tts:
        delivery: earnest and emphatic, eager to make her devotion clear
        timbre: bright and youthful
        pace: medium
        pitch: medium-high
    housekeeper:
      display_name: Housekeeper
      tts:
        delivery: brisk and practical, with the authority of a busy household servant
        timbre: sturdy and mature
        pace: medium
        pitch: medium
    maid_one:
      display_name: First Maid
      tts:
        delivery: lively and talkative, delighted by grand clothes and romance
        timbre: bright and youthful
        pace: quick
