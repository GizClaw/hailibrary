audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容讲述古老童话，带着轻快而一本正经的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中
    queen:
      display_name: 王后
      tts:
        delivery: 表面和善，内里冷淡而精于算计
        timbre: 圆润成熟
        pace: 从容
        pitch: 中低
    henwife:
      display_name: 养鸡婆
      tts:
        delivery: 老练直率，不耐烦时尖刻有力
        timbre: 干涩苍老
        pace: 中等
        pitch: 中低
    kate:
      display_name: 凯特
      tts:
        delivery: 勇敢机灵，说话爽快而沉着
        timbre: 明亮年轻
        pace: 轻快
        pitch: 中高
    prince:
      display_name: 病王子
      tts:
        delivery: 起初虚弱恍惚，康复后清楚而有精神
        timbre: 柔和年轻
        pace: 中等
        pitch: 中
    fairy:
      display_name: 仙女
      tts:
        delivery: 轻盈随意，像在谈论一桩寻常秘密
        timbre: 空灵清脆
        pace: 轻快
        pitch: 高
  chapters:
    - id: ch01
      title: 养鸡婆的锅
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "从前，有一个国王和一个王后。国王的女儿叫安妮，王后的女儿叫凯特。安妮比凯特漂亮得多，可两个姑娘彼此疼爱，就像亲姐妹一样。"
        - id: ch01-b02
          speaker: narrator
          text: "王后却嫉妒安妮的美貌，一心想把它毁掉。她找养鸡婆商量。养鸡婆出了个主意，要她第二天一早别给安妮东西吃，就这么把姑娘送来。"
        - id: ch01-b03
          speaker: queen
          text: "好孩子，到山谷里的养鸡婆那里去，替我讨几个鸡蛋回来。"
        - id: ch01-b04
          speaker: narrator
          text: "安妮一早出了门。经过厨房时，她瞧见一块面包皮，顺手拿上，边走边吃了。到了养鸡婆家，她照王后的话讨鸡蛋。"
        - id: ch01-b05
          speaker: henwife
          text: "把那边的锅盖揭开，自己瞧瞧。"
        - id: ch01-b06
          speaker: narrator
          text: "安妮揭开盖子，什么事也没发生。"
        - id: ch01-b07
          speaker: henwife
          text: "回去告诉你妈咪，食品柜的门该锁得严一点。"
        - id: ch01-b08
          speaker: narrator
          text: "安妮回去传了话。王后一听就明白，姑娘在路上吃过东西。第二天，她亲自盯着安妮空腹出门。可是路边有人在摘豌豆，安妮待人亲切，上前同他们说了几句话，又拿了一把豌豆在路上吃。"
        - id: ch01-b09
          speaker: henwife
          text: "揭开锅盖吧，这一回你就会看见了。"
        - id: ch01-b10
          speaker: narrator
          text: "安妮照做了，仍旧什么也没发生。养鸡婆气得厉害。"
        - id: ch01-b11
          speaker: henwife
          text: "去告诉你妈咪，火都灭了，锅还怎么烧得开！"
        - id: ch01-b12
          speaker: narrator
          text: "安妮又把这句话带回给王后。到了第三天，王后干脆亲自陪她去。安妮这次才揭开锅盖，漂亮的脑袋就从肩上滚了下来，一颗羊头立刻跳上了她的脖子。王后终于称了心，独自回家去了。"
    - id: ch02
      title: 凯特守夜
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "凯特却没有丢下安妮。她拿细麻布裹住姐姐的羊头，牵着姐姐出门谋生。两个人走了很久，来到一座城堡。凯特敲门，请主人让她和生病的姐姐住一夜。"
        - id: ch02-b02
          speaker: narrator
          text: "这里原来也是一位国王的家。他有两个儿子，其中一位王子病得越来越重，眼看就要死了，却谁也找不出病因。还有件怪事。无论谁在夜里看守王子，此后都再没有人见过。"
        - id: ch02-b03
          speaker: narrator
          text: "国王答应，谁肯守一夜，就赏一配克银子。凯特胆子很大，当即接下了这件事。"
        - id: ch02-b04
          speaker: narrator
          text: "午夜前一直平安无事。钟声刚敲十二下，病王子便从床上起来，穿好衣裳，悄悄下楼。凯特一路跟着，他却像是根本看不见她。"
        - id: ch02-b05
          speaker: narrator
          text: "王子走进马厩，给马备上鞍，叫来猎犬，翻身上马。凯特轻轻一跃，也坐到了他的身后。他们飞奔进绿林。一路经过挂满果实的树木，凯特不停地摘坚果，很快就装满了围裙。"
        - id: ch02-b06
          speaker: narrator
          text: "马儿跑了又跑，最后停在一座青翠的小山前。王子勒住缰绳，对着山开了口。"
        - id: ch02-b07
          speaker: prince
          text: "开门，开门，青翠的小山。让年轻王子带着他的马、他的猎犬进去。"
        - id: ch02-b08
          speaker: kate
          text: "也让坐在他身后的姑娘进去。"
        - id: ch02-b09
          speaker: narrator
          text: "青山立刻裂开，两人骑马进去了。里面有一座灯火通明的大厅，华丽极了。许多美丽的仙女围上来，把王子领去跳舞。凯特没叫任何人看见，躲到了门后。"
        - id: ch02-b10
          speaker: narrator
          text: "王子不停地跳啊，跳啊，一直跳到再也站不住，倒在长榻上。仙女们便围着给他扇风。等他刚能起身，她们又让他继续跳。"
        - id: ch02-b11
          speaker: narrator
          text: "好不容易等到雄鸡啼叫，王子赶紧上马，凯特也跳到了后面。他们赶回城堡。清晨，众人进房一看，凯特已经坐在炉边嗑坚果了。她说王子夜里过得很好。不过，要她再守一夜，赏钱得换成一配克金子。"
    - id: ch03
      title: 魔杖和小鸟
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "第二夜和头一夜一样。午夜，王子骑马奔向青山里的舞会。凯特仍坐在他身后，穿过树林时摘了一路坚果。"
        - id: ch03-b02
          speaker: narrator
          text: "这一晚，她没再盯着王子跳舞，因为不用看也知道，他会一直跳个不停。凯特注意到一个仙女娃娃。娃娃手里拿着一根魔杖，正玩得起劲。她又听见一个仙女说起那根魔杖。"
        - id: ch03-b03
          speaker: fairy
          text: "只要拿那根魔杖，在凯特生病的姐姐身上敲三下，她马上就会变回原来那么漂亮。"
        - id: ch03-b04
          speaker: narrator
          text: "凯特拿出坚果，一颗接一颗滚向娃娃。娃娃摇摇晃晃地追着坚果，追着追着，魔杖从手里掉了下来。凯特赶紧拾起魔杖，藏进自己的围裙。"
        - id: ch03-b05
          speaker: narrator
          text: "雄鸡一叫，他们便像先前一样回到城堡。凯特进了自己的房间，马上跑到安妮面前，举起魔杖，在她身上敲了三下。那颗讨厌的羊头滚落下来，安妮终于又有了从前那张漂亮的脸。"
        - id: ch03-b06
          speaker: narrator
          text: "凯特答应再守第三夜，不过这一回，她要病王子娶自己为妻。到了午夜，一切仍旧照前两夜那样发生。只不过仙女娃娃手里玩的，不再是魔杖，而是一只小鸟。凯特又听见仙女说。"
        - id: ch03-b07
          speaker: fairy
          text: "让病王子吃那只小鸟三口，他就会恢复健康，和以前一模一样。"
        - id: ch03-b08
          speaker: narrator
          text: "于是凯特把剩下的坚果全滚向娃娃。娃娃追个不停，终于丢下了小鸟。凯特把鸟儿捡起来，收进围裙。"
    - id: ch04
      title: 三口小鸟
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "鸡叫以后，两人再次回到城堡。往常这时候，凯特会坐在炉边嗑坚果。这一回，她拔去小鸟的羽毛，把它烤熟了。没多久，房里便飘起一股诱人的香味。"
        - id: ch04-b02
          speaker: prince
          text: "啊，真想尝一口那只小鸟！"
        - id: ch04-b03
          speaker: narrator
          text: "凯特给他吃了一口。王子立刻用胳膊肘撑起了身子。过了一会儿，他又叫起来。"
        - id: ch04-b04
          speaker: prince
          text: "啊，要是能再给我吃一口就好了！"
        - id: ch04-b05
          speaker: narrator
          text: "凯特又递给他一口。这一次，王子能在床上坐起来了。接着，他第三次开口。"
        - id: ch04-b06
          speaker: prince
          text: "啊，要是还能吃第三口那只小鸟就好了！"
        - id: ch04-b07
          speaker: narrator
          text: "凯特给了他第三口。王子的病一下子全好了。他起身穿衣，走到炉边坐下。第二天早上，众人进来时，看见凯特正和年轻王子一起嗑坚果。"
        - id: ch04-b08
          speaker: narrator
          text: "就在这段日子里，王子的弟弟见到了安妮。安妮那张脸甜美又漂亮，谁见了都会喜欢，他也立刻爱上了她。后来，生过病的王子娶了健康的凯特，健康的王子娶了生过病的安妮。大家活得快活，死得也快活，一辈子从没端过一只空杯子。"
