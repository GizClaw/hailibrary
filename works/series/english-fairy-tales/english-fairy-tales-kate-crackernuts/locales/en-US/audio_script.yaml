audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and unhurried, with the steady rhythm of an old fireside tale
        timbre: clear and gently weathered
        pace: measured
        pitch: medium
    queen:
      display_name: The Queen
      tts:
        delivery: outwardly gracious but cold and calculating beneath
        timbre: smooth and mature
        pace: deliberate
        pitch: medium-low
    anne:
      display_name: Anne
      tts:
        delivery: gentle, trusting, and quietly warm
        timbre: clear and youthful
        pace: measured
        pitch: medium-high
    henwife:
      display_name: The Henwife
      tts:
        delivery: blunt and knowing, with a sharp edge when crossed
        timbre: dry and weathered
        pace: measured
        pitch: medium-low
    kate:
      display_name: Kate
      tts:
        delivery: brave, quick-witted, and matter-of-fact
        timbre: bright and youthful
        pace: lively
        pitch: medium-high
    prince:
      display_name: The Sick Prince
      tts:
        delivery: weary and distant at first, growing clear and vigorous
        timbre: soft and youthful
        pace: measured
        pitch: medium
    fairy:
      display_name: A Fairy
      tts:
        delivery: light and conversational, as if sharing an interesting secret
        timbre: airy and clear
        pace: lively
        pitch: high
  chapters:
    - id: ch01
      title: The Henwife's Pot
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, there lived a king and queen. Each had a daughter. The king's daughter was Anne, and the queen's was Kate. Anne was much prettier than Kate, but the two girls loved each other like true sisters.
        - id: ch01-b02
          speaker: narrator
          text: The queen could not bear to see Anne outshine her own child. She began searching for a way to spoil the girl's beauty. At last, she went to the henwife for advice. The henwife told her to send Anne down to the glen the next morning without letting her eat first.
        - id: ch01-b03
          speaker: queen
          text: Anne, dear, go to the henwife in the glen and ask her for some eggs.
        - id: ch01-b04
          speaker: narrator
          text: Anne set off early, just as she had been told. On her way through the kitchen, she spotted a crust of bread. She picked it up and ate it as she walked.
        - id: ch01-b05
          speaker: narrator
          text: At the henwife's house, Anne asked for the eggs. The woman pointed to a pot.
        - id: ch01-b06
          speaker: henwife
          text: Take the lid off that pot and have a look inside.
        - id: ch01-b07
          speaker: narrator
          text: Anne lifted the lid, but nothing happened.
        - id: ch01-b08
          speaker: henwife
          text: Go back to your mother and tell her she ought to lock her pantry door more carefully.
        - id: ch01-b09
          speaker: narrator
          text: Anne returned and repeated the message. The queen understood at once that Anne had eaten something. So the next morning, she watched the girl closely and sent her away hungry.
        - id: ch01-b10
          speaker: narrator
          text: Along the road, Anne came upon some country people picking peas. She stopped to speak kindly to them, and they gave her a handful. She ate the peas on her way to the glen.
        - id: ch01-b11
          speaker: henwife
          text: Lift the pot lid. Then you'll see what is inside.
        - id: ch01-b12
          speaker: narrator
          text: Anne did as the henwife said. Once again, nothing happened. This time the woman grew terribly angry.
        - id: ch01-b13
          speaker: henwife
          text: Tell your mother the pot cannot boil when the fire has gone out.
          emotion: angry
        - id: ch01-b14
          speaker: narrator
          text: Anne carried that message home too. On the third day, the queen went with her all the way to the henwife's house. This time, when Anne raised the lid, her own lovely head fell off, and a sheep's head sprang onto her shoulders in its place.
        - id: ch01-b15
          speaker: narrator
          text: The queen was perfectly satisfied. She went home and left Anne as she was.

    - id: ch02
      title: The Castle and the Sick Prince
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: But Kate would not abandon her sister. She wrapped a fine linen cloth around Anne's head, took her by the hand, and led her away to seek their fortune.
        - id: ch02-b02
          speaker: narrator
          text: They walked on and on until they reached a castle. Kate knocked and asked if there was room for her and her sick sister to spend the night.
        - id: ch02-b03
          speaker: narrator
          text: The castle belonged to another king, and he had two sons. One of them was wasting away, though no one could discover what was wrong. Stranger still, anyone who stayed beside the prince at night vanished and was never seen again.
        - id: ch02-b04
          speaker: narrator
          text: The king had promised a peck of silver to anyone willing to keep watch. Kate was a brave girl, and she offered to stay with the prince until morning.
        - id: ch02-b05
          speaker: narrator
          text: All was quiet until midnight. Then the clock struck twelve. The sick prince rose, put on his clothes, and slipped downstairs. Kate followed, though he seemed not to notice her.
        - id: ch02-b06
          speaker: narrator
          text: He went into the stable, saddled his horse, and called his hound. The prince mounted, and Kate sprang lightly onto the horse behind him. They rode away through the greenwood. As the trees swept past, Kate picked nuts from the branches and filled her apron.
        - id: ch02-b07
          speaker: narrator
          text: At last they came to a green hill. The prince drew rein and called out.
        - id: ch02-b08
          speaker: prince
          text: Open, open, green hill. Let the young prince enter with his horse and his hound.
        - id: ch02-b09
          speaker: kate
          text: And let in the lady riding behind him!
        - id: ch02-b10
          speaker: narrator
          text: At once, the green hill opened, and they rode inside.

    - id: ch03
      title: The Fairy Ball
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Beyond the hill stood a splendid hall, blazing with light. Beautiful fairies crowded around the prince and swept him into their dance. No one noticed Kate slip behind the door.
        - id: ch03-b02
          speaker: narrator
          text: From her hiding place, she watched the prince dance and dance until he could go no farther and fell onto a couch. The fairies fanned him until he could stand. Then they made him dance again.
        - id: ch03-b03
          speaker: narrator
          text: At last, a cock crowed. The prince hurried to his horse, and Kate climbed up behind him. They rode home just as the sun was rising.
        - id: ch03-b04
          speaker: narrator
          text: When the household came in, there sat Kate by the fire, cracking her nuts. She told them that the prince had passed a good night. But she would not keep watch again unless the king gave her a peck of gold.
        - id: ch03-b05
          speaker: narrator
          text: On the second night, everything happened just as before. At midnight, the prince rode to the green hill and its fairy ball. Kate followed, gathering nuts as they passed through the forest.
        - id: ch03-b06
          speaker: narrator
          text: This time, she already knew how the prince would be forced to dance. Instead of watching him, she noticed a fairy baby playing with a wand. Then she heard one fairy speaking nearby.
        - id: ch03-b07
          speaker: fairy
          text: Three taps from that wand would make Kate's sick sister as pretty as she ever was.
        - id: ch03-b08
          speaker: narrator
          text: Kate rolled a nut toward the baby, then another. The little one toddled after them and dropped the wand. Kate snatched it up and tucked it into her apron.
        - id: ch03-b09
          speaker: narrator
          text: When the cock crowed, she rode home behind the prince. The moment she reached her room, Kate rushed to Anne and touched her three times with the wand. The ugly sheep's head fell away, and Anne's own pretty face returned.

    - id: ch04
      title: The Fairy Bird
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Kate agreed to watch the prince for a third night, but only on the promise that she would marry him. Once more, midnight came. Once more, she rode behind him through the greenwood and entered the bright hall inside the hill.
        - id: ch04-b02
          speaker: narrator
          text: That night, the fairy baby was playing with a little bird. Kate listened as one of the fairies spoke.
        - id: ch04-b03
          speaker: fairy
          text: Three bites of that little bird would make the sick prince as healthy as he ever was.
        - id: ch04-b04
          speaker: narrator
          text: Kate began rolling nuts to the baby again. She kept rolling them until every nut in her apron was gone. The baby followed them and let the bird fall. Kate picked it up and hid it in her apron.
        - id: ch04-b05
          speaker: narrator
          text: At cockcrow, Kate and the prince started home. This time, she did not sit by the fire cracking nuts. She plucked the bird, cooked it, and soon its savory smell filled the room.
        - id: ch04-b06
          speaker: prince
          text: Oh, I wish I could have one bite of that bird.
        - id: ch04-b07
          speaker: narrator
          text: Kate gave him a bite. The prince raised himself onto one elbow. After a little while, he called to her again.
        - id: ch04-b08
          speaker: prince
          text: Oh, if only I could have another bite!
        - id: ch04-b09
          speaker: narrator
          text: Kate gave him the second bite, and the prince sat upright in bed.
        - id: ch04-b10
          speaker: prince
          text: If only I could have one last bite of that bird!
        - id: ch04-b11
          speaker: narrator
          text: Kate gave him the third bite. At once, he rose from the bed completely well. He dressed and joined her beside the fire.

    - id: ch05
      title: Two Weddings
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: When the household entered the next morning, they found Kate and the young prince sitting together, cracking nuts.
        - id: ch05-b02
          speaker: narrator
          text: While all this had been happening, the prince's brother had seen Anne. Like everyone who looked upon her sweet, pretty face, he had fallen in love with her.
        - id: ch05-b03
          speaker: narrator
          text: So the prince who had been sick married the sister who had always been well. His healthy brother married the sister who had been sick. They all lived happily and died happily, and they never drank from an empty cup.
