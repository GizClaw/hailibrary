audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容讲述古老童话，带着轻快而一本正经的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中
    dame_goody:
      display_name: 古迪大娘
      tts:
        delivery: 朴实爽快，待人客气，得意时直率自信
        timbre: 温厚明亮
        pace: 中等
        pitch: 中
    old_pixy:
      display_name: 斜眼小老头
      tts:
        delivery: 古怪机敏，平日客气，秘密败露时尖厉恼怒
        timbre: 干涩苍老
        pace: 中等偏快
        pitch: 中高
  chapters:
    - id: ch01
      title: 半夜来的客人
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "古迪大娘是个看护，照料病人，也替人带孩子。有一天半夜，她忽然被人叫醒。她下楼一看，门外站着个陌生的小老头。他又矮又丑，两只眼睛斜睨着人。"
        - id: ch01-b02
          speaker: narrator
          text: "小老头要请她去照看自己的妻子。妻子病得太重，没法照料婴儿。古迪大娘一见他就不喜欢，可生意终究是生意。她赶紧披戴好，跟着他下了楼。"
        - id: ch01-b03
          speaker: narrator
          text: "门口等着一匹高大的乌黑骏马，两只眼睛像火一样发亮。小老头一把将古迪大娘卷上马背，骏马转眼便飞奔起来。古迪大娘死死抱住他，一点也不敢松手。"
        - id: ch01-b04
          speaker: narrator
          text: "两人骑啊骑，不知骑了多久，终于停在一间小屋门前。他们下马进去，只见女主人病卧在床，几个孩子在周围玩耍。她的身旁，还躺着一个白白胖胖的男婴。"
    - id: ch02
      title: 眼膏下的真相
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "古迪大娘抱起那个婴儿。孩子长得真好，谁见了都会喜欢。母亲把孩子交给她时，还递来一盒药膏，叮嘱她，等孩子一睁眼，就把药膏涂在他的眼皮上。"
        - id: ch02-b02
          speaker: narrator
          text: "过了一会儿，婴儿慢慢睁开眼睛。原来，他也像父亲一样长着一双斜眼。古迪大娘打开盒子，照吩咐给孩子的两片眼皮都抹上药膏。"
        - id: ch02-b03
          speaker: narrator
          text: "这种做法，她从前见也没见过。那药膏究竟有什么用呢？古迪大娘实在忍不住好奇。她悄悄看看四周，趁别人没有留意，也在自己的右眼皮上抹了一点。"
        - id: ch02-b04
          speaker: narrator
          text: "才一抹上，眼前的一切全变了。简陋的小屋有了华美的陈设。床上的母亲原来是位美丽的夫人，身穿白绸衣裳。那个婴儿比刚才更漂亮，身上裹着银光闪闪的薄纱。"
        - id: ch02-b05
          speaker: narrator
          text: "床边那几个孩子，却成了塌鼻子、尖耳朵的小妖怪。他们彼此扮鬼脸，乱抓自己的脑袋。有时还伸出毛茸茸的长爪子，去扯生病夫人的耳朵。这群小东西，什么恶作剧都干得出来。"
        - id: ch02-b06
          speaker: narrator
          text: "古迪大娘这才知道，自己进了小妖精的家。她半个字也没声张。等那位夫人好些，已经能亲自照看婴儿，她便请小老头送自己回去。"
        - id: ch02-b07
          speaker: narrator
          text: "小老头牵来那匹双眼冒火的乌黑骏马。他们又飞奔起来，和来时一样快，也许还快了几分。到了古迪大娘的小屋，小老头把她抱下马，客客气气地向她道谢，还付了一笔从未有过的丰厚酬劳。随后，他便离开了。"
    - id: ch03
      title: 集市上的老主顾
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "第二天正好是赶集的日子。古迪大娘离家一夜，屋里缺了不少东西，便走到集市上采买。买着买着，她忽然看见昨夜那个斜眼小老头。"
        - id: ch03-b02
          speaker: narrator
          text: "你猜他正在做什么？他挨个摊位走过去，这里拿些水果，那里取几个鸡蛋，见什么便拿什么。可周围没有一个人注意他。"
        - id: ch03-b03
          speaker: narrator
          text: "古迪大娘没打算管这件事。不过，这位老主顾出手那么阔绰，从眼前经过了，总该招呼一声。她走上前，屈膝行了一礼。"
        - id: ch03-b04
          speaker: dame_goody
          text: "您好呀，先生。想来尊夫人和小宝贝现在都很安好——"
    - id: ch04
      title: 看得太多的眼睛
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "古迪大娘还没说完，小老头就吓得向后一跳。"
        - id: ch04-b02
          speaker: old_pixy
          text: "什么！今天你看得见我？"
          emotion: surprised
        - id: ch04-b03
          speaker: dame_goody
          text: "看得见您？当然看得见，跟天上的太阳一样清楚。我还看得出，您这会儿正忙着呢。"
        - id: ch04-b04
          speaker: old_pixy
          text: "啊，你看见的东西未免太多了。那你告诉我，你是用哪只眼睛看见这些的？"
        - id: ch04-b05
          speaker: narrator
          text: "古迪大娘得意极了，还以为自己抓住了他的把柄。"
        - id: ch04-b06
          speaker: dame_goody
          text: "当然是右眼。"
        - id: ch04-b07
          speaker: old_pixy
          text: "那药膏！原来是那药膏！谁叫你插手不该管的事，这就是给你的惩罚！往后你再也别想看见我。"
          emotion: angry
        - id: ch04-b08
          speaker: narrator
          text: "妖精老贼喊着，猛地打在古迪大娘的右眼上。她马上就看不见他了。更糟的是，从那一刻起，她的右眼彻底瞎了，直到去世那天也没能复明。"
