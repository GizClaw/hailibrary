audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and unhurried, with the steady rhythm of an old fireside tale
        timbre: clear and gently weathered
        pace: measured
        pitch: medium
    dame_goody:
      display_name: Dame Goody
      tts:
        delivery: practical and warm, with plainspoken confidence and lively curiosity
        timbre: mature and clear
        pace: measured
        pitch: medium
    old_pixy:
      display_name: The Old Pixy
      tts:
        delivery: civil but sly, turning sharp and threatening when discovered
        timbre: dry and wiry
        pace: brisk
        pitch: medium-high
    pixy_mother:
      display_name: The Pixy Mother
      tts:
        delivery: gentle and direct, with the quiet weariness of a mother recovering in bed
        timbre: soft and clear
        pace: unhurried
        pitch: medium-high
  chapters:
    - id: ch01
      title: The Midnight Call
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Dame Goody was a nurse who cared for sick people and minded babies. One night, she woke at midnight and went downstairs. There stood a strange little old fellow. He was ugly and squinny-eyed, and he wanted her to come to his wife, who was too ill to care for her baby.
        - id: ch01-b02
          speaker: narrator
          text: Dame Goody did not like the look of him. Still, business was business. She put on her things and went down to the door. The old fellow whisked her onto a great coal-black horse with fiery eyes. Away they flew at a tremendous pace, while Dame Goody clung to him like grim death.
        - id: ch01-b03
          speaker: narrator
          text: They rode on and on until they stopped outside a cottage. Inside, the good woman lay in bed. Children played all around her, and beside her lay a fine, bouncing baby boy.

    - id: ch02
      title: A Touch of Ointment
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The mother handed the baby to Dame Goody to mind. He was a fine, bouncing boy, as lovely a baby as anyone could wish to see. Then the mother gave Dame Goody a box of ointment and told her what to do with it.
        - id: ch02-b02
          speaker: pixy_mother
          text: As soon as his eyes open, stroke both eyelids with this ointment.
        - id: ch02-b03
          speaker: narrator
          text: After a while, the baby began to open his eyes. Dame Goody saw that they were squinny, just like his father's. She took the box and carefully rubbed the ointment over both his eyelids. But she had never seen such a thing done before, and she could not help wondering what it was for. She looked around to see whether anyone was watching. When no one seemed to notice her, she touched a little ointment to her own right eyelid.
        - id: ch02-b04
          speaker: narrator
          text: At once, everything around her changed. The plain cottage now had elegant furnishings. The woman in bed had become a beautiful lady dressed in white silk. Her baby looked lovelier than ever, wrapped in clothes like silvery gauze.
        - id: ch02-b05
          speaker: narrator
          text: The other children were flat-nosed imps with pointed ears. They pulled faces, scratched their heads, and tugged at the sick lady's ears with long, hairy paws. They were up to every kind of mischief. Then Dame Goody knew she was inside a house of pixies.
        - id: ch02-b06
          speaker: narrator
          text: Dame Goody said nothing to anyone about what she saw. As soon as the lady was well enough to mind her own baby, she asked the old fellow to take her home. He came around to the cottage door with the coal-black horse and its eyes of fire. They mounted, and off they went, as fast as before, or perhaps a little faster.
        - id: ch02-b07
          speaker: narrator
          text: At Dame Goody's cottage, the old fellow lifted her down. He thanked her politely and paid her more than she had ever received for such work. Then he left her.

    - id: ch03
      title: The Pixy at the Market
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The next day was market day. Dame Goody needed many things for the house after being away, so she trudged off to buy them. As she moved among the stalls, she spotted the squinny-eyed old fellow who had taken her riding on the coal-black horse.
        - id: ch03-b02
          speaker: narrator
          text: And what was he doing? He went from stall to stall, picking up whatever he pleased. Here he took some fruit, there he took some eggs, and then he went on for more. Yet the sellers and shoppers never seemed to notice him at all.
        - id: ch03-b03
          speaker: narrator
          text: Dame Goody did not mean to interfere. But he had been a very good customer, and she thought she ought to speak to him. She went over, bobbed a curtsey, and began to ask after his family.
        - id: ch03-b04
          speaker: dame_goody
          text: Good day, sir. I hope your good lady and the little one are both as well as—
        - id: ch03-b05
          speaker: narrator
          text: She got no further. The funny old fellow jumped back in surprise.
        - id: ch03-b06
          speaker: old_pixy
          text: What! You can see me today?
          emotion: surprised
        - id: ch03-b07
          speaker: dame_goody
          text: See you? Of course I can. I see you as plainly as the sun in the sky. And I can see you're keeping busy, too.
        - id: ch03-b08
          speaker: old_pixy
          text: Ah, you can see far too much. Tell me, which eye sees all this?
        - id: ch03-b09
          speaker: narrator
          text: Dame Goody was proud to have caught him out.
        - id: ch03-b10
          speaker: dame_goody
          text: My right eye, to be sure.

    - id: ch04
      title: The Price of Seeing
      blocks:
        - id: ch04-b01
          speaker: old_pixy
          text: The ointment! It was the ointment!
          emotion: surprised
        - id: ch04-b02
          speaker: narrator
          text: The old pixy thief cried out in anger.
        - id: ch04-b03
          speaker: old_pixy
          text: Take that for meddling in what does not concern you. You will never see me again!
          emotion: angry
        - id: ch04-b04
          speaker: narrator
          text: He struck Dame Goody on her right eye. She could no longer see him. Worse still, she was blind on her right side from that hour until the day she died.
