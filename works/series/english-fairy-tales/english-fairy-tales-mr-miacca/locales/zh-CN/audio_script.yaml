audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容讲述古老童话，带着一本正经的诙谐
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中
    tommy:
      display_name: 汤米·格赖姆斯
      tts:
        delivery: 机灵大胆，带着男孩直来直去的口气和一点淘气
        timbre: 稚嫩清亮
        pace: 轻快
        pitch: 中高
    mother:
      display_name: 汤米的母亲
      tts:
        delivery: 严肃警醒，话里带着朴实的关切
        timbre: 成熟温暖
        pace: 中等
        pitch: 中
    mr_miacca:
      display_name: 米亚卡先生
      tts:
        delivery: 粗声粗气，把可怕的事说得理所当然，饿急时不耐烦
        timbre: 低沉粗粝
        pace: 稍慢
        pitch: 低
    mrs_miacca:
      display_name: 米亚卡太太
      tts:
        delivery: 质朴随和，毫无戒心，一提到甜食便格外热切
        timbre: 饱满温厚
        pace: 舒缓
        pitch: 中低
  chapters:
    - id: ch01
      title: 街角之外
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "汤米·格赖姆斯有时很乖，有时却很淘气。可他一旦淘气起来，那真是坏透了。母亲常常这样提醒他。"
        - id: ch01-b02
          speaker: mother
          text: "汤米，要做个好孩子。别走出这条街，不然米亚卡先生会把你抓走。"
        - id: ch01-b03
          speaker: narrator
          text: "可汤米一使起坏来，还是会溜出这条街。有一天，他才刚刚转过街角，就真被米亚卡先生抓住了。那人把他头朝下塞进口袋，一路带回了自己家。"
    - id: ch02
      title: 米亚卡太太和布丁
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "进了屋，米亚卡先生把汤米从口袋里倒出来，放到地上站好，又仔仔细细捏了捏他的胳膊和腿。"
        - id: ch02-b02
          speaker: mr_miacca
          text: "你的肉是老了点儿，可今晚也只有你能下锅。煮熟以后，味道总不会太差。糟了，我忘带香草啦！没有香草，你吃起来准会发苦。萨莉！萨莉，快来！"
        - id: ch02-b03
          speaker: narrator
          text: "米亚卡太太听见喊声，从隔壁房间走了出来。"
        - id: ch02-b04
          speaker: mrs_miacca
          text: "亲爱的，你找我有什么事？"
        - id: ch02-b05
          speaker: mr_miacca
          text: "我带了个小男孩回来做晚饭，可香草忘了拿。我要去取，你替我盯住他。"
        - id: ch02-b06
          speaker: mrs_miacca
          text: "行啊，亲爱的。"
        - id: ch02-b07
          speaker: narrator
          text: "米亚卡先生说完就出了门。汤米看看独自留在屋里的米亚卡太太，便开口问她。"
        - id: ch02-b08
          speaker: tommy
          text: "米亚卡先生每天晚饭都吃小男孩吗？"
        - id: ch02-b09
          speaker: mrs_miacca
          text: "差不多吧，亲爱的。哪个小男孩坏得够呛，又正好撞上他，他就吃哪个。"
        - id: ch02-b10
          speaker: tommy
          text: "那你们不吃点别的吗？就没有布丁？"
        - id: ch02-b11
          speaker: mrs_miacca
          text: "我可爱吃布丁了！但像我这样的人，哪能常常吃得到呢。"
        - id: ch02-b12
          speaker: tommy
          text: "我妈妈今天就在做布丁。我要是去问，她准肯分你一些。要不，我跑回家替你拿来？"
        - id: ch02-b13
          speaker: mrs_miacca
          text: "你想得可真周到。快去快回，别错过了晚饭。"
        - id: ch02-b14
          speaker: narrator
          text: "汤米立刻撒腿飞奔出去。他没费什么力气就逃了出来，心里别提多高兴了。"
    - id: ch03
      title: 又一次被抓
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "接下来的好长一段日子里，汤米乖得不能再乖，也一直没走过那处街角。可他没法永远都听话。一天，他又转过了街角。偏偏运气不好，他才刚一露面，米亚卡先生就把他抓起来，塞进口袋，再次带回了家。"
        - id: ch03-b02
          speaker: narrator
          text: "米亚卡先生把汤米从口袋里倒出来。一认出这个男孩，他马上开了口。"
        - id: ch03-b03
          speaker: mr_miacca
          text: "原来又是你这个小鬼！上次你耍了我和我太太，害得我们晚饭都没吃成。这一回，你别想再逃。钻到沙发底下去，我亲自坐在上面守着你，等锅里的水烧开。"
        - id: ch03-b04
          speaker: narrator
          text: "可怜的汤米只得爬到沙发底下。米亚卡先生就坐在上面，一边看住他，一边守着那口锅。他们等啊，等啊，锅偏偏一直不开。米亚卡先生终于等得不耐烦了。"
        - id: ch03-b05
          speaker: mr_miacca
          text: "喂，躲在下面的小子，我等够了！伸一条腿出来。这下看你还怎么溜走。"
    - id: ch04
      title: 沙发腿
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "汤米伸出一条腿。米亚卡先生拿起砍刀，咔嚓一声把它剁下来，丢进了锅里。"
        - id: ch04-b02
          speaker: mr_miacca
          text: "萨莉，亲爱的！萨莉！"
        - id: ch04-b03
          speaker: narrator
          text: "可是没有人答应。米亚卡先生只好走进隔壁房间，去找米亚卡太太。趁他还在那边，汤米悄悄从沙发底下爬出来，一口气冲出了门。原来，他刚才伸出去的根本不是自己的腿，而是沙发的一条腿。"
        - id: ch04-b04
          speaker: narrator
          text: "汤米·格赖姆斯一路跑回了家。打那以后，直到长大到能独自出门，他再也没有走过那处街角。"
