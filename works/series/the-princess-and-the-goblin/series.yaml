cover_prompt: |-
  A wordless cover scene in a remote Victorian-era mountain kingdom shows Princess Irene and Curdie following a magical thread beneath the castle. Irene is an eight-year-old girl with dark curls, a simple ivory nightdress, and a small blue cloak; Curdie is a sturdy twelve-year-old miner's son with brown hair, rough gray tunic, leather belt, and a miner's lamp. A fine luminous thread winds from Irene's hand through a stone arch toward a high tower window, while distant goblin shapes remain small and hidden beyond the warm circle of light. Irene steps forward as Curdie shields the lamp, making their trust in the guiding thread the focal action. Use a low three-quarter view with cavern steps rising toward moonlit mountain architecture and generous dark breathing room above. Keep the magic original and reassuring, the goblins non-frightening, and every design independent of later adaptations. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
