audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a playful touch
        timbre: clear and gently rounded
        pace: measured with lively turns
        pitch: medium
    alice:
      display_name: Alice
      tts:
        delivery: bright, curious, and candid
        timbre: clear and youthful
        pace: naturally quick with thoughtful pauses
        pitch: medium-high
    king:
      display_name: King of Hearts
      tts:
        delivery: pompous, uncertain, and eager to sound commanding
        timbre: round and slightly reedy
        pace: deliberate with abrupt commands
        pitch: medium
    queen:
      display_name: Queen of Hearts
      tts:
        delivery: fierce, imperious, and quick to threaten
        timbre: sharp and forceful
        pace: brisk and explosive
        pitch: medium-high
    white_rabbit:
      display_name: White Rabbit
      tts:
        delivery: formal, hurried, and officious
        timbre: light and crisp
        pace: quick with careful announcements
        pitch: high
    juror:
      display_name: Juror
      tts:
        delivery: earnest and inquisitive
        timbre: small and clear
        pace: measured
        pitch: medium
    juror_2:
      display_name: Second Juror
      tts:
        delivery: puzzled and dutiful
        timbre: light and slightly nasal
        pace: measured
        pitch: medium-high
    knave:
      display_name: Knave of Hearts
      tts:
        delivery: subdued, anxious, and plainly defensive
        timbre: gentle and dry
        pace: careful
        pitch: medium
    sister:
      display_name: Alice's Sister
      tts:
        delivery: affectionate, thoughtful, and serene
        timbre: warm and soft
        pace: unhurried
        pitch: medium
  chapters:
    - id: ch01
      title: Alice Takes the Stand
      blocks:
        - id: ch01-b01
          speaker: alice
          text: Here I am!
        - id: ch01-b02
          speaker: narrator
          text: Alice sprang up in such a hurry that she forgot how much she had grown in the last few minutes. The edge of her skirt caught the jury box and tipped it over. Every juror tumbled onto the heads of the people below. There they all lay sprawling together, looking to Alice like the goldfish from a bowl she had accidentally knocked over the week before.
        - id: ch01-b03
          speaker: alice
          text: Oh, please forgive me!
        - id: ch01-b04
          speaker: narrator
          text: Thoroughly alarmed, she began picking them up as fast as she could. The accident with the goldfish kept running through her mind. She had a vague feeling that these jurors, too, had to be collected at once and put safely back into their box. Otherwise, she thought, they might die.
        - id: ch01-b05
          speaker: king
          text: This trial will not continue until every juror is back where he belongs. Every one of them.
        - id: ch01-b06
          speaker: narrator
          text: The King spoke very gravely and stared hard at Alice. She looked into the box and saw that, in her hurry, she had put the Lizard in upside down. The poor creature could not move. He could only wave his tail sadly in the air. Alice pulled him out and turned him right side up.
        - id: ch01-b07
          speaker: alice
          text: Not that it makes much difference. He'd be about as useful in this trial either way.
        - id: ch01-b08
          speaker: narrator
          text: It took the jurors a little while to recover from being dumped out. Their slates and pencils had scattered too, but those were found and handed back. Then the jurors set to work with tremendous care, each writing a history of the whole accident. All except the Lizard. He seemed too overcome to do anything but sit with his mouth open and gaze up at the courtroom ceiling.
        - id: ch01-b09
          speaker: king
          text: What do you know about this case?
        - id: ch01-b10
          speaker: alice
          text: Nothing.
        - id: ch01-b11
          speaker: king
          text: Nothing at all?
        - id: ch01-b12
          speaker: alice
          text: Nothing at all.
        - id: ch01-b13
          speaker: king
          text: That is extremely important.
        - id: ch01-b14
          speaker: narrator
          text: The jurors had just begun writing that down when the White Rabbit broke in. He spoke with great respect, though he frowned and made faces at the King.
        - id: ch01-b15
          speaker: white_rabbit
          text: Your Majesty means unimportant, of course.
        - id: ch01-b16
          speaker: king
          text: Unimportant, yes. Of course that's what I meant. Important... unimportant... unimportant... important...
        - id: ch01-b17
          speaker: narrator
          text: The King muttered the words as if he were testing which one sounded better. Some jurors wrote “important” and some wrote “unimportant.” Alice was close enough to read their slates.
        - id: ch01-b18
          speaker: alice
          text: It doesn't matter in the least.
        - id: ch01-b19
          speaker: narrator
          text: The King had been scribbling busily in his notebook for some time. Now he suddenly let out a sharp cackle for everyone to be quiet.
        - id: ch01-b20
          speaker: king
          text: Silence! Rule Forty-two says that anyone more than a mile tall must leave the court.
        - id: ch01-b21
          speaker: narrator
          text: Everyone turned to look at Alice.
        - id: ch01-b22
          speaker: alice
          text: I'm not a mile tall.
        - id: ch01-b23
          speaker: king
          text: Yes, you are.
        - id: ch01-b24
          speaker: queen
          text: Nearly two miles tall.
        - id: ch01-b25
          speaker: alice
          text: Well, I'm not leaving. And that isn't a real rule. You just made it up.
        - id: ch01-b26
          speaker: king
          text: It happens to be the oldest rule in this book.
        - id: ch01-b27
          speaker: alice
          text: Then it should be Rule Number One.
        - id: ch01-b28
          speaker: narrator
          text: The King went pale and snapped his notebook shut.
        - id: ch01-b29
          speaker: king
          text: Jury, consider your verdict.
          emotion: fearful
    - id: ch02
      title: The Mysterious Verses
      blocks:
        - id: ch02-b01
          speaker: white_rabbit
          text: Please, Your Majesty, there is still more evidence to hear! This paper was only just found.
        - id: ch02-b02
          speaker: narrator
          text: The White Rabbit jumped up in a tremendous hurry.
        - id: ch02-b03
          speaker: queen
          text: What does it say?
        - id: ch02-b04
          speaker: white_rabbit
          text: I haven't opened it, but it looks like a letter from the prisoner to... well, to somebody.
        - id: ch02-b05
          speaker: king
          text: Naturally. Unless he wrote it to nobody, and people don't usually do that.
        - id: ch02-b06
          speaker: juror
          text: Who is it addressed to?
        - id: ch02-b07
          speaker: white_rabbit
          text: No one. There isn't anything written on the outside.
        - id: ch02-b08
          speaker: narrator
          text: He unfolded the paper and looked again.
        - id: ch02-b09
          speaker: white_rabbit
          text: This isn't a letter after all. It's a poem.
        - id: ch02-b10
          speaker: juror_2
          text: Is it in the prisoner's handwriting?
        - id: ch02-b11
          speaker: white_rabbit
          text: No, it isn't. That's the strangest part.
        - id: ch02-b12
          speaker: narrator
          text: Every juror looked confused.
        - id: ch02-b13
          speaker: king
          text: Then he must have copied someone else's handwriting.
        - id: ch02-b14
          speaker: narrator
          text: At once, the whole jury looked cheerful again.
        - id: ch02-b15
          speaker: knave
          text: Your Majesty, I didn't write it, and no one can prove that I did. There isn't even a name at the bottom.
        - id: ch02-b16
          speaker: king
          text: That only makes you look worse. If you meant no harm, you would have signed your name like an honest man.
        - id: ch02-b17
          speaker: narrator
          text: A general burst of applause followed. It was the first truly clever thing the King had managed to say all day, and the whole court seemed to know it.
        - id: ch02-b18
          speaker: queen
          text: That proves he's guilty!
        - id: ch02-b19
          speaker: alice
          text: It doesn't prove anything! You don't even know what the poem is about!
          emotion: angry
        - id: ch02-b20
          speaker: king
          text: Read it aloud.
        - id: ch02-b21
          speaker: narrator
          text: The White Rabbit put on his spectacles.
        - id: ch02-b22
          speaker: white_rabbit
          text: Where should I start, Your Majesty?
        - id: ch02-b23
          speaker: king
          text: Start at the beginning. Keep going until you reach the end. Then stop.
        - id: ch02-b24
          speaker: narrator
          text: And so the White Rabbit read the verses.
        - id: ch02-b25
          speaker: white_rabbit
          text: |-
            They told me you had been to her,
            And mentioned me to him.
            She gave me a good character,
            But said I could not swim.

            He sent them word I had not gone.
            We know it to be true.
            If she should push the matter on,
            What would become of you?

            I gave her one, they gave him two,
            You gave us three or more.
            They all returned from him to you,
            Though they were mine before.

            If I or she should chance to be
            Involved in this affair,
            He trusts to you to set them free,
            Exactly as we were.

            My notion was that you had been,
            Before she had this fit,
            An obstacle that came between
            Him, and ourselves, and it.

            Don't let him know she liked them best,
            For this must ever be
            A secret, kept from all the rest,
            Between yourself and me.
    - id: ch03
      title: Sentence Before Verdict
      blocks:
        - id: ch03-b01
          speaker: king
          text: That is the most important evidence we've heard. Now, jury—
        - id: ch03-b02
          speaker: narrator
          text: The King rubbed his hands, delighted with his new evidence, but Alice cut him off. During the last few minutes she had grown so large that she was not the least bit afraid of interrupting him anymore.
        - id: ch03-b03
          speaker: alice
          text: If anyone can explain that poem, I'll give him sixpence. I don't think there's a bit of meaning in it.
        - id: ch03-b04
          speaker: narrator
          text: Every juror carefully wrote on a slate that Alice did not think the poem had a bit of meaning. Yet not one of them offered an explanation of the paper itself.
        - id: ch03-b05
          speaker: king
          text: If it means nothing, that saves us a great deal of work. We won't have to search for a meaning. Though... perhaps there is something here after all. It says, “But said I could not swim.” You can't swim, can you?
        - id: ch03-b06
          speaker: narrator
          text: He spread the poem across his knee and studied it with one eye. The Knave sadly shook his head.
        - id: ch03-b07
          speaker: knave
          text: Do I look as if I can?
          emotion: sad
        - id: ch03-b08
          speaker: narrator
          text: He certainly did not. He was made entirely of cardboard.
        - id: ch03-b09
          speaker: king
          text: Good. That part fits. Next it says, “We know it to be true.” That must mean the jury. Then, “I gave her one, they gave him two.” Why, that must be about what he did with the tarts.
        - id: ch03-b10
          speaker: alice
          text: But the next line says they all came back from him to you.
        - id: ch03-b11
          speaker: king
          text: And there they are!
        - id: ch03-b12
          speaker: narrator
          text: The King pointed triumphantly at the tarts on the table.
        - id: ch03-b13
          speaker: king
          text: That couldn't be any clearer. Now here's another part. “Before she had this fit.” My dear, you have never had fits, have you?
        - id: ch03-b14
          speaker: queen
          text: Never!
          emotion: angry
        - id: ch03-b15
          speaker: narrator
          text: The Queen hurled an inkstand at the Lizard. Poor Bill had given up trying to write with one finger because it left no mark. Now he hurriedly used the ink running down his face, for as long as it lasted.
        - id: ch03-b16
          speaker: king
          text: Then those words don't fit you.
        - id: ch03-b17
          speaker: narrator
          text: The King smiled around the courtroom. No one made a sound.
        - id: ch03-b18
          speaker: king
          text: It's a pun!
          emotion: angry
        - id: ch03-b19
          speaker: narrator
          text: He sounded deeply offended. Then everyone laughed. The King hurried on to the same command he had already given about twenty times that day.
        - id: ch03-b20
          speaker: king
          text: Jury, consider your verdict.
        - id: ch03-b21
          speaker: queen
          text: No, no! Give the sentence first. The verdict can come afterward.
        - id: ch03-b22
          speaker: alice
          text: What nonsense! You can't have the sentence before the verdict!
          emotion: angry
        - id: ch03-b23
          speaker: queen
          text: Be quiet!
          emotion: angry
        - id: ch03-b24
          speaker: narrator
          text: The Queen turned purple.
        - id: ch03-b25
          speaker: alice
          text: I will not!
          emotion: angry
        - id: ch03-b26
          speaker: queen
          text: Cut off her head!
          emotion: angry
        - id: ch03-b27
          speaker: narrator
          text: She screamed the order as loudly as she could, but nobody moved.
        - id: ch03-b28
          speaker: alice
          text: Why should anyone care what you say? You're nothing but a pack of cards!
        - id: ch03-b29
          speaker: narrator
          text: By then Alice had reached her full size. At her words, the whole pack shot into the air and flew down at her. Alice gave a little scream, half frightened and half angry. She tried to beat the cards away. Then she found herself lying on the riverbank with her head in her sister's lap. Her sister was gently brushing dead leaves from Alice's face, leaves that had fluttered down from the trees.
    - id: ch04
      title: The Dream of Wonderland
      blocks:
        - id: ch04-b01
          speaker: sister
          text: Wake up, dear Alice! What a long nap you've had!
        - id: ch04-b02
          speaker: alice
          text: Oh, I had the strangest dream!
        - id: ch04-b03
          speaker: narrator
          text: Alice told her sister all the strange adventures she could remember, the same adventures you have just heard. She did her best to tell every one of them. When the story was finished, her sister kissed her.
        - id: ch04-b04
          speaker: sister
          text: It certainly was a strange dream, dear. Now hurry in for tea. It's getting late.
        - id: ch04-b05
          speaker: narrator
          text: Alice got up and ran toward home. All the way there, she kept thinking about the dream. And after everything that had happened in it, she had good reason to think it was wonderful.
        - id: ch04-b06
          speaker: narrator
          text: Her sister stayed right where Alice had left her. She rested her head on one hand and watched the sun going down. Her thoughts stayed with little Alice and every one of those wonderful adventures. After a while, she began to dream in her own way. This was the dream that came to her.
        - id: ch04-b07
          speaker: narrator
          text: First she pictured Alice herself. Once more, those small hands were folded on her knee and those bright, eager eyes looked up into hers. She could hear the very sound of Alice's voice. She could see that funny little toss of the head Alice used when her wandering hair fell into her eyes, as it always did. Her sister listened, or seemed to listen. Slowly, the whole place around her filled with the strange creatures from the dream Alice had told her.
        - id: ch04-b08
          speaker: narrator
          text: The long grass rustled around her feet while the White Rabbit hurried by. The frightened Mouse splashed his way through the nearby pool. She heard teacups rattling as the March Hare and his friends sat at their meal that never ended. The Queen's sharp voice ordered her unfortunate guests away to be executed. Once again, the pig-baby sneezed on the Duchess's knee while plates and dishes crashed around it. Then came the Gryphon's shriek, the squeak of the Lizard's slate pencil, and the choking sounds of the guinea pigs who were being held down. All those noises mixed with the distant sobs of the miserable Mock Turtle.
        - id: ch04-b09
          speaker: narrator
          text: She stayed there with her eyes shut and half believed that she had entered Wonderland too. Still, she knew she only had to open them. At once, the dream would fade into ordinary life. The long grass would only be rustling in the wind. The pool would only be rippling as the reeds waved over it. The rattle of teacups would turn into the tinkling bells of sheep, and the Queen's sharp cries would become the call of a shepherd boy. The baby's sneeze, the Gryphon's shriek, and every other strange sound would blend into the noisy bustle of the farmyard. In the distance, the lowing cattle would take the place of the Mock Turtle's heavy sobs.
        - id: ch04-b10
          speaker: narrator
          text: Last of all, she imagined this same little sister in the years to come, when Alice was a grown woman. Even then, Alice would keep the simple, loving heart she had carried through childhood. She would gather other little children close around her. Their eyes would grow bright and eager as she told them one strange tale after another, perhaps even the dream of Wonderland from long ago. She would understand all their simple sorrows and find happiness in all their simple joys. And as she listened to them, she would remember her own life as a child and the happy summer days that had passed.
