audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带着一本正经的幽默
        timbre: 温暖清亮
        pace: 舒展而富有变化
        pitch: 中音
    alice:
      display_name: 爱丽丝
      tts:
        delivery: 好奇伶俐，想到什么就自然说出来
        timbre: 清脆稚嫩
        pace: 轻快，思索时稍慢
        pitch: 中高音
    duchess:
      display_name: 公爵夫人
      tts:
        delivery: 粗暴专横，喜怒无常
        timbre: 沙哑粗粝
        pace: 急促有力
        pitch: 中低音
    queen_of_hearts:
      display_name: 红心王后
      tts:
        delivery: 暴躁专横，命令像吼叫
        timbre: 尖厉响亮
        pace: 急促有力
        pitch: 高音
    king_of_hearts:
      display_name: 红心国王
      tts:
        delivery: 胆怯又爱摆威严，遇事急着讲道理
        timbre: 偏细而清楚
        pace: 中等
        pitch: 中高音
    gryphon:
      display_name: 鹰头狮
      tts:
        delivery: 粗率爽直，笑话别人时毫不客气
        timbre: 浑厚洪亮
        pace: 明快利落
        pitch: 中低音
    mock_turtle:
      display_name: 假海龟
      tts:
        delivery: 忧郁多愁，讲起往事郑重又容易动气
        timbre: 低沉空洞
        pace: 缓慢，叹息时停顿较长
        pitch: 低音
  chapters:
    - id: ch01
      title: 公爵夫人的教训
      blocks:
        - id: ch01-b01
          speaker: duchess
          text: 再见到你，我真是太高兴了，我的老宝贝儿！
          emotion: happy
        - id: ch01-b02
          speaker: narrator
          text: 公爵夫人亲亲热热地把胳膊挽进爱丽丝臂弯，两个人一同往前走。爱丽丝也很高兴，因为公爵夫人今天脾气好得出奇。她想起两人上回在厨房见面时，公爵夫人凶得吓人。现在看来，那股坏脾气也许全是胡椒害的。
        - id: ch01-b03
          speaker: alice
          text: 等我当了公爵夫人，厨房里一点胡椒也不许放。虽说我大概当不成，可汤没有胡椒照样好喝呀。也许人吃了胡椒，脾气才会那么冲。醋把人吃酸了，甘菊把人吃苦了，麦芽糖一类的东西，却能把孩子吃得甜甜和和。我真希望大人都懂这个道理。那样，他们就不会这么舍不得给孩子糖吃了。
        - id: ch01-b04
          speaker: narrator
          text: 爱丽丝越想越高兴，觉得自己发现了一条从没人发现过的新规律。想着想着，她早把身边的公爵夫人忘得一干二净。那沙哑的声音忽然贴着耳朵响起来，她不由得吓了一跳。
        - id: ch01-b05
          speaker: duchess
          text: 亲爱的，你只顾想事情，都忘了说话。这件事有什么教训，我一会儿就能想起来。
        - id: ch01-b06
          speaker: alice
          text: 也许它根本没有教训。
        - id: ch01-b07
          speaker: duchess
          text: 啧，孩子！什么事情都有教训，只看你找不找得到。
        - id: ch01-b08
          speaker: narrator
          text: 公爵夫人一边说，一边又朝爱丽丝挤近了一些。爱丽丝很不喜欢这样贴着她。第一，公爵夫人长得实在太难看。第二，她的个头恰好能把下巴搁在爱丽丝肩上，而那下巴又尖得扎人。可爱丽丝不想失礼，只能尽量忍着。为了不让两人一直沉默，她随口提起比赛，说现在比刚才顺利多了。
        - id: ch01-b09
          speaker: duchess
          text: 没错。这里的教训是，爱呀，爱呀，是爱让世界转个不停！
        - id: ch01-b10
          speaker: alice
          text: 可我听人说，只要人人少管闲事，世界就能转下去。
        - id: ch01-b11
          speaker: duchess
          text: 哎呀，那还不是一个意思！这里的教训是，意思照看好，声音自然妙。
        - id: ch01-b12
          speaker: narrator
          text: 公爵夫人的尖下巴说着又钻进爱丽丝的肩头。爱丽丝暗暗觉得，她真是什么都能扯出一番教训来。沉默了一会儿，公爵夫人猜爱丽丝正在奇怪，自己为什么不伸手搂她的腰。其实，她只是拿不准那只火烈鸟脾气怎么样。她还问爱丽丝，要不要干脆试一试。
        - id: ch01-b13
          speaker: alice
          text: 它说不定会咬人。还是别试了吧。
        - id: ch01-b14
          speaker: duchess
          text: 很对。火烈鸟和芥末都会咬人，所以羽毛相同的鸟总爱聚在一处。
        - id: ch01-b15
          speaker: alice
          text: 芥末可不是鸟。我想，它是矿物。
        - id: ch01-b16
          speaker: duchess
          text: 当然是矿物。你说什么都这么清楚，我当然同意你。这附近就有一座很大的芥末矿。这里的教训是，我的越多，你的越少。
        - id: ch01-b17
          speaker: alice
          text: 啊，我想起来了，芥末其实是植物！虽然看着一点也不像，可它的确就是植物。
        - id: ch01-b18
          speaker: duchess
          text: 我完全赞成。这里的教训是，你想让人看见你是什么样，就做成什么样。你要是嫌这话不够简单，那我再说一遍。千万别把自己想成并非另一个样子，以免别人眼里的你过去或将来可能成为的样子，并不是那个本来会让他们看成另一个样子的你曾经有过的样子。
        - id: ch01-b19
          speaker: alice
          text: 要是写在纸上，我也许能多懂一点。您这样说，我实在跟不上。
        - id: ch01-b20
          speaker: duchess
          text: 这算什么？只要我愿意，还能说得厉害多了。
        - id: ch01-b21
          speaker: alice
          text: 那就请您别费心把它说得更长了。
        - id: ch01-b22
          speaker: duchess
          text: 别提什么费心！我刚才说的那些话，全都送给你。
        - id: ch01-b23
          speaker: narrator
          text: 爱丽丝心想，这种礼物可真便宜，幸好过生日时不兴送这种东西。可是，她没敢把这句心里话说出来。公爵夫人又用尖下巴扎了她一下，问她是不是又在想事情。爱丽丝已经被扎得有点烦了。
        - id: ch01-b24
          speaker: alice
          text: 我当然有权想事情。
          emotion: angry
        - id: ch01-b25
          speaker: duchess
          text: 你有权想事情，就跟猪有权飞差不多。这里的教——
        - id: ch01-b26
          speaker: narrator
          text: 她最爱说的“教训”才讲到一半，声音忽然越来越小，最后完全没了。那只挽着爱丽丝的胳膊也抖了起来。爱丽丝惊讶地抬头一看，王后正抱着双臂站在面前，眉头压得低低的，那张脸就像一场马上要落下来的雷雨。
        - id: ch01-b27
          speaker: duchess
          text: 陛下，今天天气真好。
          emotion: fearful
        - id: ch01-b28
          speaker: queen_of_hearts
          text: 我警告你！你和你的脑袋，马上得有一个滚开！自己选！
          emotion: angry
        - id: ch01-b29
          speaker: narrator
          text: 王后吼叫时还用力跺着地，命令公爵夫人在自己滚开和脑袋滚开之间挑一个。公爵夫人马上选好了。她要保住自己的脑袋，所以一眨眼就跑得无影无踪。
    - id: ch02
      title: 鹰头狮带路
      blocks:
        - id: ch02-b01
          speaker: queen_of_hearts
          text: 回去继续比赛。
        - id: ch02-b02
          speaker: narrator
          text: 爱丽丝吓得一个字也不敢说，只好慢慢跟着王后回到槌球场。王后不在时，宾客们全都趁机躲进阴凉处歇息。现在一看见她回来，他们马上跳起来，慌慌张张地跑回场上。王后只是冷冷地说，谁敢耽搁片刻，谁就得送命。
        - id: ch02-b03
          speaker: narrator
          text: 比赛重新开始以后，王后一刻也没停止跟别的选手争吵。她一会儿喊着砍掉他的脑袋，一会儿又要砍掉她的脑袋。被判刑的人都由士兵押起来。士兵要去抓人，自然不能继续趴在地上当拱门。大约半小时以后，场上一个拱门也没了。除了国王、王后和爱丽丝，所有选手都被关押起来，等候处死。王后终于喊得没了力气。她上气不接下气，转过来问爱丽丝。
        - id: ch02-b04
          speaker: queen_of_hearts
          text: 你见过假海龟吗？
        - id: ch02-b05
          speaker: alice
          text: 没有。我连假海龟是什么都不知道。
        - id: ch02-b06
          speaker: queen_of_hearts
          text: 假海龟嘛，就是做假海龟汤用的东西。既然你没见过，那就跟我来，让它亲口讲讲自己的身世。
        - id: ch02-b07
          speaker: narrator
          text: 她们一同离开球场时，爱丽丝听见国王压低嗓门，对还留在那里的所有人宣布了一件事。听见那些死刑都不算数，她心里总算好受了些。王后刚才判了那么多人去死，这一直叫她很难过。
        - id: ch02-b08
          speaker: king_of_hearts
          text: 你们全都赦免了。
        - id: ch02-b09
          speaker: narrator
          text: 不久，她们看见一只鹰头狮躺在阳光下熟睡。你要是不知道鹰头狮长什么样，那就看看图。
        - id: ch02-b10
          speaker: queen_of_hearts
          text: 起来，懒东西！带这位小姐去见假海龟，听它讲身世。我得回去看看那些处决办得怎么样了。
        - id: ch02-b11
          speaker: narrator
          text: 王后说完便走了，只把爱丽丝留在鹰头狮旁边。爱丽丝虽然不喜欢这怪物的模样，可她仔细想了想，留在这里怎么也比追赶那个凶恶的王后安全，于是站着等它醒来。鹰头狮揉揉眼睛坐起身，一直盯着王后的背影。等她完全走得看不见了，它忽然咯咯笑起来。
        - id: ch02-b12
          speaker: gryphon
          text: 真有意思！
          emotion: happy
        - id: ch02-b13
          speaker: alice
          text: 什么有意思？
        - id: ch02-b14
          speaker: gryphon
          text: 当然是王后。那些处决全是她自己瞎想出来吓人的。其实，她从来没真把任何人处死过。行了，走吧！
        - id: ch02-b15
          speaker: narrator
          text: 爱丽丝慢吞吞地跟上去，心想，这里人人都命令她“走吧”，她一辈子也没这样被支使过。
        - id: ch02-b16
          speaker: narrator
          text: 没走多远，他们就看见假海龟孤零零地坐在一块低矮的礁石上。离得还很远时，它看上去已经满脸悲伤。等他们走近一些，爱丽丝听见它一声接一声地叹气，仿佛整颗心都快碎了。她顿时十分同情，连忙问鹰头狮，假海龟究竟遇上了什么伤心事。
        - id: ch02-b17
          speaker: gryphon
          text: 又是它自己瞎想的。它根本没有伤心事。走吧！
        - id: ch02-b18
          speaker: narrator
          text: 他们沿着礁石走到假海龟面前。假海龟没有起身，只抬起头，用一双盛满眼泪的大眼睛望着他们。它看了爱丽丝，又看看鹰头狮，却始终一句话也不说。
        - id: ch02-b19
          speaker: gryphon
          text: 喂，这位小姐想知道你的身世。她就是为这个来的。
        - id: ch02-b20
          speaker: mock_turtle
          text: 好吧，我把身世讲给她听。你们两个都坐下。在我把故事全部讲完以前，一个字也不许说。
        - id: ch02-b21
          speaker: narrator
          text: 他们照它的话坐了下来。好几分钟过去，三个人谁也没开口。爱丽丝心里直纳闷，它要是一直不肯开头，又怎么可能把故事讲完呢？不过她没有催促，仍旧耐着性子等下去。
    - id: ch03
      title: 海底的学校
      blocks:
        - id: ch03-b01
          speaker: mock_turtle
          text: 从前，在那些很久以前的日子里，我还是一只真正的海龟。
          emotion: sad
        - id: ch03-b02
          speaker: narrator
          text: 这句话说完，四周又安静了很久。沉默中，只有鹰头狮偶尔发出一声“赫咳——”，假海龟则一直沉重地抽泣。爱丽丝差点站起身来，对它说，多谢先生讲了这么有趣的故事。可是转念一想，后面一定还有下文。她便坐着不动，什么也没说。
        - id: ch03-b03
          speaker: mock_turtle
          text: 我们还小的时候，都去海里的学校上学。老师是一只年纪很大的海龟，可我们从来不叫它海龟老师，都管它叫陆课老师。
        - id: ch03-b04
          speaker: alice
          text: 它又不是陆龟，为什么要这样叫？
        - id: ch03-b05
          speaker: mock_turtle
          text: 因为它给我们授课，所以叫陆课老师。你怎么这么迟钝！
          emotion: angry
        - id: ch03-b06
          speaker: gryphon
          text: 这么简单的问题也要问，你该害臊。
        - id: ch03-b07
          speaker: narrator
          text: 鹰头狮又责怪爱丽丝，说这么简单的问题也问得出口，她真该害臊。接着，两个怪物一声不响，一起盯住可怜的爱丽丝。爱丽丝窘得恨不得钻进地下。过了好一会儿，鹰头狮才转向假海龟，催它快往下讲，别为了这点事耗上一整天。
        - id: ch03-b08
          speaker: mock_turtle
          text: 我们确实在海里的学校上学，你也许不相信——
        - id: ch03-b09
          speaker: alice
          text: 我可从来没说过不相信！
        - id: ch03-b10
          speaker: mock_turtle
          text: 你说了。
        - id: ch03-b11
          speaker: gryphon
          text: 闭嘴，让它接着讲！
        - id: ch03-b12
          speaker: mock_turtle
          text: 我们在那里受的是最好的教育。真的，我们每天都去学校上课，一天也不落。
        - id: ch03-b13
          speaker: alice
          text: 我也每天去学校上课呀。光凭这个，你用不着那么神气。
        - id: ch03-b14
          speaker: mock_turtle
          text: 你们有额外课程吗？
        - id: ch03-b15
          speaker: alice
          text: 有，我们学法语和音乐。
        - id: ch03-b16
          speaker: mock_turtle
          text: 还学洗衣吗？
        - id: ch03-b17
          speaker: alice
          text: 当然不学！
          emotion: angry
        - id: ch03-b18
          speaker: mock_turtle
          text: 啊，那你们的学校算不上真正的好学校。我可放心了。我们的收费单最后明明写着，法语、音乐和洗衣都要另行收费。
        - id: ch03-b19
          speaker: alice
          text: 可你们住在海底，应该不需要洗衣吧？
        - id: ch03-b20
          speaker: mock_turtle
          text: 我倒不是用不着学，是实在出不起那笔额外的学费。我只能上普通课程。
          emotion: sad
        - id: ch03-b21
          speaker: alice
          text: 普通课程都有什么？
        - id: ch03-b22
          speaker: mock_turtle
          text: 普通课程嘛，一开始当然要学读卷和写扭。接着就是算术的各门分科，夹法、减法、丑法和笑法。
        - id: ch03-b23
          speaker: alice
          text: 等一等，我以前从没听说过“丑法”这门算术。它到底是什么意思？
        - id: ch03-b24
          speaker: gryphon
          text: 什么？你居然连变丑都没听说过！那么，把东西变美是什么意思，你总该知道吧？
          emotion: surprised
        - id: ch03-b25
          speaker: alice
          text: 知道，就是把什么东西变得更漂亮。
        - id: ch03-b26
          speaker: gryphon
          text: 那你还不知道变丑是什么意思，可真是个傻瓜。
        - id: ch03-b27
          speaker: narrator
          text: 这番话一点也没有鼓励爱丽丝继续问下去。她不敢再追究丑法，便转向假海龟，打听他们还学过什么。假海龟抬起鳍，一边回答，一边把那些科目一门一门数给她听。
        - id: ch03-b28
          speaker: mock_turtle
          text: 还有谜史，分成古代谜史和现代谜史，另外还要学海理。再就是素描。素描老师是一条老康吉鳗，每星期来一次。它不光教我们素描，还教拉长，以及盘成圈儿晕倒。
        - id: ch03-b29
          speaker: alice
          text: 盘成圈儿晕倒是什么样？
        - id: ch03-b30
          speaker: mock_turtle
          text: 我自己没法把那种动作演给你看，因为我的身子早就僵得弯不动了。至于鹰头狮，它根本没有学过。
        - id: ch03-b31
          speaker: gryphon
          text: 我没时间学那些。不过，我上过古典老师的课。那位老师是一只老螃蟹，真是古板得不能再古板了。
        - id: ch03-b32
          speaker: mock_turtle
          text: 我从来没机会去上它的课。听别的学生说，那只老螃蟹教的是嬉文和悲文。
          emotion: sad
        - id: ch03-b33
          speaker: gryphon
          text: 没错，它教的就是这些。的确是这些。
          emotion: sad
        - id: ch03-b34
          speaker: narrator
          text: 鹰头狮说着也叹了一口气。两个怪物一同用爪子捂住了脸，仿佛想起了多么难过的往事。爱丽丝赶紧换个话题，问他们在学校里一天要上几个小时的课。
        - id: ch03-b35
          speaker: mock_turtle
          text: 第一天十个小时，第二天九个小时，就这样一天比一天少。
        - id: ch03-b36
          speaker: alice
          text: 这办法真古怪！
          emotion: surprised
        - id: ch03-b37
          speaker: gryphon
          text: 所以才叫课少，因为每天都少一点。
        - id: ch03-b38
          speaker: narrator
          text: 这种解释，爱丽丝从前连想都没想过。她低头琢磨了一会儿，又在心里把后面的日子接着算了下去，这才提出下一个问题。
        - id: ch03-b39
          speaker: alice
          text: 那么第十一天一定放假了？
        - id: ch03-b40
