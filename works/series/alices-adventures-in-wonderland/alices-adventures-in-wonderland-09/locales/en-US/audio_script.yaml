audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a playful touch
        timbre: clear and gently rounded
        pace: measured with lively turns
        pitch: medium
    alice:
      display_name: Alice
      tts:
        delivery: bright, curious, and candid
        timbre: clear and youthful
        pace: naturally quick with thoughtful pauses
        pitch: medium-high
    queen_of_hearts:
      display_name: Queen of Hearts
      tts:
        delivery: imperious, explosive, and fiercely impatient
        timbre: full and cutting
        pace: forceful with sudden bursts
        pitch: medium-high
    king_of_hearts:
      display_name: King of Hearts
      tts:
        delivery: timidly dignified and eager to sound decisive
        timbre: mild and rounded
        pace: measured with nervous quickening
        pitch: medium
    duchess:
      display_name: Duchess
      tts:
        delivery: overly affectionate, confident, and fond of giving advice
        timbre: rich and slightly nasal
        pace: leisurely with emphatic turns
        pitch: medium-low
    gryphon:
      display_name: Gryphon
      tts:
        delivery: blunt, gruff, and easily amused
        timbre: rough and resonant
        pace: brisk with sudden chuckles
        pitch: low
    mock_turtle:
      display_name: Mock Turtle
      tts:
        delivery: mournful, solemn, and easily offended
        timbre: deep and hollow
        pace: slow with heavy pauses
        pitch: low
  chapters:
    - id: ch01
      title: The Mock Turtle's Story
      blocks:
        - id: ch01-b01
          speaker: duchess
          text: You dear old thing! You can't imagine how glad I am to see you again.
          emotion: happy
        - id: ch01-b02
          speaker: narrator
          text: As she said this, the Duchess tucked her arm affectionately into Alice's, and the two of them walked away together. Alice was very glad to see her in such a pleasant mood. She began to wonder if the pepper in the kitchen had been the only thing that made the Duchess so savage when they first met.
        - id: ch01-b03
          speaker: alice
          text: If I ever become a Duchess, there won't be any pepper in my kitchen at all. Not that I really expect to become one. Soup is perfectly good without pepper. Maybe pepper always makes people hot-tempered. Vinegar must make them sour, and chamomile makes them bitter. Then barley sugar and things like that must be what make children sweet-tempered. I only wish grown-ups knew that. Then they wouldn't be so stingy about giving sweets to children.
        - id: ch01-b04
          speaker: narrator
          text: Alice was so pleased with her new rule that she forgot the Duchess was there. Then a voice sounded right beside her ear and startled her.
        - id: ch01-b05
          speaker: duchess
          text: You're thinking, my dear. That's why you've forgotten to talk. I can't tell you the moral just now, but I'll remember it soon.
        - id: ch01-b06
          speaker: alice
          text: Maybe there isn't one.
        - id: ch01-b07
          speaker: duchess
          text: Nonsense, child! Everything has a moral, if you can only find it.
        - id: ch01-b08
          speaker: narrator
          text: As she spoke, the Duchess squeezed herself even closer against Alice. Alice didn't enjoy being pressed together like that. For one thing, the Duchess was very ugly. For another, she was exactly the right height to rest her chin on Alice's shoulder, and that chin was uncomfortably sharp. Alice didn't want to be rude, though, so she bore it as well as she could.
        - id: ch01-b09
          speaker: alice
          text: The game seems to be going a little better now.
        - id: ch01-b10
          speaker: duchess
          text: So it does. And the moral is, “Oh, it's love, it's love that makes the world go round!”
        - id: ch01-b11
          speaker: alice
          text: I heard someone say it happens when everybody minds their own business.
        - id: ch01-b12
          speaker: duchess
          text: Oh, well, that's almost the same thing. And here's the moral of that. “Take care of the sense, and the sounds will take care of themselves.”
        - id: ch01-b13
          speaker: narrator
          text: While she spoke, the Duchess dug her sharp little chin into Alice's shoulder again. Alice kept the thought to herself, but she couldn't help noticing how very fond the Duchess was of finding morals in absolutely everything.
        - id: ch01-b14
          speaker: duchess
          text: I expect you're wondering why I haven't put my arm around your waist. I'm not sure what kind of temper your flamingo has. Shall I try it and see?
        - id: ch01-b15
          speaker: alice
          text: He might bite.
        - id: ch01-b16
          speaker: narrator
          text: Alice answered carefully. She had no wish at all to see the Duchess try.
        - id: ch01-b17
          speaker: duchess
          text: Quite true. Flamingos bite, and so does mustard. The moral is, “Birds of a feather flock together.”
        - id: ch01-b18
          speaker: alice
          text: But mustard isn't a bird.
        - id: ch01-b19
          speaker: duchess
          text: Right, as usual! You do put things so clearly.
        - id: ch01-b20
          speaker: alice
          text: I think it's a mineral.
        - id: ch01-b21
          speaker: duchess
          text: Of course it is. There's a large mustard mine near here. And the moral is, “The more there is of mine, the less there is of yours.”
        - id: ch01-b22
          speaker: alice
          text: Oh, now I know! Mustard is a vegetable. It doesn't look like one, but it is.
          emotion: surprised
        - id: ch01-b23
          speaker: duchess
          text: I completely agree. And the moral is, “Be what you would seem to be.” Or, to put it more simply, “Never imagine yourself not to be otherwise than what it might appear to others that what you were or might have been was not otherwise than what you had been would have appeared to them to be otherwise.”
        - id: ch01-b24
          speaker: alice
          text: I think I'd understand that better if I saw it written down. I can't quite follow it when you say it.
        - id: ch01-b25
          speaker: duchess
          text: That's nothing compared with what I could say if I wanted to.
          emotion: happy
        - id: ch01-b26
          speaker: alice
          text: Please don't trouble yourself to make it any longer.
        - id: ch01-b27
          speaker: duchess
          text: Oh, never mind the trouble! I'll give you everything I've said so far as a present.
        - id: ch01-b28
          speaker: narrator
          text: Alice thought that was a very cheap kind of present. She was certainly glad people didn't hand out birthday presents like that. But this was another thought she did not dare to say out loud.
        - id: ch01-b29
          speaker: duchess
          text: Thinking again?
        - id: ch01-b30
          speaker: narrator
          text: The sharp little chin dug into Alice's shoulder once more. By now, Alice was getting worried.
        - id: ch01-b31
          speaker: alice
          text: I have a right to think.
          emotion: angry
        - id: ch01-b32
          speaker: duchess
          text: About as much right as pigs have to fly. And the mor—
        - id: ch01-b33
          speaker: narrator
          text: To Alice's great surprise, the Duchess's voice faded away right in the middle of her favorite word, “moral.” At the same moment, the arm linked through Alice's began to tremble. Alice looked up and saw the Queen standing directly in front of them. Her arms were folded, and she was frowning like a thunderstorm.
        - id: ch01-b34
          speaker: duchess
          text: A fine day, Your Majesty.
          emotion: fearful
        - id: ch01-b35
          speaker: queen_of_hearts
          text: I'm warning you now! Either you go, or your head goes, and you have almost no time at all to choose!
          emotion: angry
        - id: ch01-b36
          speaker: narrator
          text: The Duchess made her choice and disappeared at once.
        - id: ch01-b37
          speaker: queen_of_hearts
          text: Let's get on with the game.
        - id: ch01-b38
          speaker: narrator
          text: Alice was too frightened to say a single word. She slowly followed the Queen back to the croquet ground. While the Queen had been away, all the other guests had taken the chance to rest in the shade. But the moment they saw her coming, they hurried back into the game. The Queen's only comment was that even one moment of delay would cost them their lives.
        - id: ch01-b39
          speaker: narrator
          text: All through the game, the Queen never stopped quarreling with the other players. Again and again, she shouted, “Off with his head!” or, “Off with her head!” Each person she sentenced was taken into custody by the soldiers. Of course, every soldier who made an arrest had to stop serving as a croquet arch. So after about half an hour, there wasn't a single arch left. By then, every player except the King, the Queen, and Alice had been arrested and sentenced to execution.
        - id: ch01-b40
          speaker: queen_of_hearts
          text: Have you met the Mock Turtle yet?
        - id: ch01-b41
          speaker: narrator
          text: The Queen had finally stopped shouting and was quite out of breath.
        - id: ch01-b42
          speaker: alice
          text: No. I don't even know what a Mock Turtle is.
        - id: ch01-b43
          speaker: queen_of_hearts
          text: It's what Mock Turtle Soup is made from.
        - id: ch01-b44
          speaker: alice
          text: I've never seen one. I've never even heard of one.
        - id: ch01-b45
          speaker: queen_of_hearts
          text: Come with me, then. He can tell you his story himself.
        - id: ch01-b46
          speaker: narrator
          text: Alice walked away beside the Queen. As they went, she heard the King behind them, speaking in a low voice to all the prisoners at once.
        - id: ch01-b47
          speaker: king_of_hearts
          text: You are all pardoned.
        - id: ch01-b48
          speaker: alice
          text: Well, that's one good thing!
          emotion: happy
        - id: ch01-b49
          speaker: narrator
          text: Alice said that only to herself. She had felt quite miserable when the Queen ordered so many executions, and the King's quiet pardon was a great relief.
        - id: ch01-b50
          speaker: narrator
          text: Before long, Alice and the Queen came upon a Gryphon lying fast asleep in the warm sun.
        - id: ch01-b51
          speaker: queen_of_hearts
          text: Wake up, you lazy creature! Take this young lady to the Mock Turtle so she can hear his story. I have to go back and see to the executions I've ordered.
        - id: ch01-b52
          speaker: narrator
          text: With that, the Queen walked away and left Alice alone with the Gryphon. Alice didn't much like the look of the creature. Still, when she thought about the savage Queen, she decided it was probably just as safe to stay where she was. So she waited for the Gryphon to wake.
        - id: ch01-b53
          speaker: narrator
          text: At last, the Gryphon sat up and rubbed the sleep from its eyes. It watched the Queen walking away and waited until she was completely out of sight. Then it turned back toward Alice and gave a chuckle.
        - id: ch01-b54
          speaker: gryphon
          text: What a joke!
          emotion: happy
        - id: ch01-b55
          speaker: alice
          text: What is?
        - id: ch01-b56
          speaker: gryphon
          text: The Queen. It's all make-believe. Nobody ever gets executed. Come on!
        - id: ch01-b57
          speaker: narrator
          text: Alice went slowly after the Gryphon. To herself, she grumbled that everybody in this strange place kept saying, “Come on!” She had never been ordered around so much in her entire life.
        - id: ch01-b58
          speaker: narrator
          text: They hadn't gone far when Alice spotted the Mock Turtle in the distance. He was sitting sad and lonely on a little shelf of rock. As Alice and the Gryphon came closer, she heard him sigh as if his heart were going to break. The sound made her pity him deeply.
        - id: ch01-b59
          speaker: alice
          text: What's making him so sad?
        - id: ch01-b60
          speaker: gryphon
          text: It's all make-believe. He hasn't got any sorrow. Come on!
        - id: ch01-b61
          speaker: narrator
          text: They went up to the Mock Turtle. He stared at them with huge, tearful eyes but didn't say a word.
        - id: ch01-b62
          speaker: gryphon
          text: This young lady wants to hear your story.
        - id: ch01-b63
          speaker: mock_turtle
          text: I'll tell her. Both of you, sit down. And don't say one word until I'm finished.
        - id: ch01-b64
          speaker: narrator
          text: Alice and the Gryphon sat down as they were told. Then nobody spoke for several minutes. Alice wondered how the Mock Turtle could possibly finish his story if he never began it. Even so, she waited patiently and said nothing.
        - id: ch01-b65
          speaker: mock_turtle
          text: Once, I was a real Turtle.
          emotion: sad
        - id: ch01-b66
          speaker: narrator
          text: Those few words were followed by another very long silence. Every now and then the Gryphon broke it with a strange cry of “Hjckrrh!” Meanwhile, the Mock Turtle kept sobbing heavily. Alice came very close to standing up and saying, “Thank you, sir, for your interesting story.” But she couldn't help believing there had to be more. So she sat still without speaking.
        - id: ch01-b67
          speaker: mock_turtle
          text: When we were young, we went to school in the sea. Our teacher was an old Turtle, but we called him Tortoise.
          emotion: sad
        - id: ch01-b68
          speaker: alice
          text: Why did you call him Tortoise if he wasn't one?
        - id: ch01-b69
          speaker: mock_turtle
          text: We called him Tortoise because he taught us. Really, how can you be so slow?
          emotion: angry
        - id: ch01-b70
          speaker: gryphon
          text: You ought to be ashamed of asking such an easy question.
        - id: ch01-b71
          speaker: narrator
          text: After scolding her, both creatures fell silent. They sat there staring at poor Alice until she felt ready to sink straight into the ground. At last, the Gryphon stopped staring and turned back to the Mock Turtle.
        - id: ch01-b72
          speaker: gryphon
          text: Go on, old fellow! Don't take all day!
        - id: ch01-b73
          speaker: mock_turtle
          text: Yes, we went to school in the sea, whether you believe it or not—
        - id: ch01-b74
          speaker: alice
          text: I never said I didn't believe you!
        - id: ch01-b75
          speaker: mock_turtle
          text: You did.
        - id: ch01-b76
          speaker: gryphon
          text: Be quiet!
        - id: ch01-b77
          speaker: narrator
          text: Before Alice could answer, the Mock Turtle continued.
        - id: ch01-b78
          speaker: mock_turtle
          text: We had the very best education. We went to school every single day.
        - id: ch01-b79
          speaker: alice
          text: I go to a day school, too. There's no need to be so proud of that.
        - id: ch01-b80
          speaker: mock_turtle
          text: Did your school offer extras?
        - id: ch01-b81
          speaker: narrator
          text: The Mock Turtle leaned into the question and sounded a little anxious to hear what Alice would say.
        - id: ch01-b82
          speaker: alice
          text: Yes. We learned French and music.
        - id: ch01-b83
          speaker: mock_turtle
          text: What about washing?
        - id: ch01-b84
          speaker: alice
          text: Of course not!
          emotion: angry
        - id: ch01-b85
          speaker: mock_turtle
          text: Ah! Then yours couldn't have been a truly good school. At our school, the words at the very end of the bill were, “French, music, and washing, extra.”
        - id: ch01-b86
          speaker: narrator
          text: He sounded greatly relieved.
        - id: ch01-b87
          speaker: alice
          text: You couldn't have needed washing very much at the bottom of the sea.
        - id: ch01-b88
          speaker: mock_turtle
          text: I couldn't afford to study it. I only took the regular course.
          emotion: sad
        - id: ch01-b89
          speaker: alice
          text: What did that include?
        - id: ch01-b90
          speaker: mock_turtle
          text: Why, we started with Reeling and Writhing, naturally. After that came all the different branches of Arithmetic. We studied Ambition, Distraction, Uglification, and Derision.
        - id: ch01-b91
          speaker: alice
          text: I've never heard of Uglification. What does it mean?
        - id: ch01-b92
          speaker: narrator
          text: The Gryphon was so surprised by Alice's question that it lifted both paws high into the air before answering her.
        - id: ch01-b93
          speaker: gryphon
          text: What? You've never heard of making something uglier? You know what it means to beautify something, don't you?
          emotion: surprised
        - id: ch01-b94
          speaker: alice
          text: I think so. It means making something prettier.
        - id: ch01-b95
          speaker: gryphon
          text: Well, if you can't work out what uglify means, you're a simpleton.
        - id: ch01-b96
          speaker: narrator
          text: Alice didn't feel brave enough to ask anything else about that. Instead, she turned to the Mock Turtle.
        - id: ch01-b97
          speaker: alice
          text: What other things did you have to study?
        - id: ch01-b98
          speaker: mock_turtle
          text: Well, we had Mystery, both ancient and modern, along with Seaography. Then there was Drawling. The Drawling teacher was an old conger eel who came to the school once every week. He taught us Drawling, Stretching, and Fainting in Coils.
        - id: ch01-b99
          speaker: narrator
          text: As he named the subjects one by one, the Mock Turtle carefully counted each of them off on his flappers.
        - id: ch01-b100
          speaker: alice
          text: What was Fainting in Coils like?
        - id: ch01-b101
          speaker: mock_turtle
          text: I can't demonstrate it myself. I'm too stiff. And the Gryphon never studied it.
        - id: ch01-b102
          speaker: gryphon
          text: I didn't have time. But I did study with the Classics teacher. He was an old crab.
        - id: ch01-b103
          speaker: mock_turtle
          text: I never studied with him. They said he taught Laughing and Grief.
          emotion: sad
        - id: ch01-b104
          speaker: gryphon
          text: He did. He certainly did.
          emotion: sad
        - id: ch01-b105
          speaker: narrator
          text: The Gryphon sighed as it answered. Then both creatures hid their faces in their paws.
        - id: ch01-b106
          speaker: alice
          text: How many hours of lessons did you have each day?
        - id: ch01-b107
          speaker: narrator
          text: Alice hurried to change the subject.
        - id: ch01-b108
          speaker: mock_turtle
          text: Ten hours on the first day, nine on the next, and so on.
        - id: ch01-b109
          speaker: alice
          text: What a strange way to do it!
          emotion: surprised
        - id: ch01-b110
          speaker: gryphon
          text: That's why they're called lessons. They lessen from one day to the next.
        - id: ch01-b111
          speaker: narrator
          text: Calling them lessons because they grew shorter each day was a completely new idea to Alice. She turned it over in her mind for a moment before making her next remark.
        - id: ch01-b112
          speaker: alice
          text: Then the eleventh day had to be a holiday.
        - id: ch01-b113
          speaker: mock_turtle
          text: Of course it was.
        - id: ch01-b114
          speaker: alice
          text: Then what did you do on the twelfth day?
        - id: ch01-b115
          speaker: narrator
          text: Alice asked that last question eagerly, wanting to know how the plan could continue. But the Gryphon cut the subject short in a firm and decided voice.
        - id: ch01-b116
          speaker: gryphon
          text: That's enough about lessons. Now tell her about the games.
