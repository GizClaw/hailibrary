audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带着一本正经的幽默
        timbre: 温暖清亮
        pace: 舒展而富有变化
        pitch: 中音
    alice:
      display_name: 爱丽丝
      tts:
        delivery: 好奇伶俐，想到什么就自然说出来
        timbre: 清脆稚嫩
        pace: 轻快，思索时稍慢
        pitch: 中高音
    white_rabbit:
      display_name: 白兔
      tts:
        delivery: 匆忙焦急，说话短促
        timbre: 细而清楚
        pace: 快
        pitch: 高音
    mouse:
      display_name: 老鼠
      tts:
        delivery: 敏感自尊，激动时尖锐急促
        timbre: 细亮而略显紧绷
        pace: 中等，生气时加快
        pitch: 高音
  chapters:
    - id: ch01
      title: 越长越高
      blocks:
        - id: ch01-b01
          speaker: alice
          text: 越来越奇，越来越怪啦！我像世上最大的望远镜一样，正在往外伸呢！再见啦，我的脚！
          emotion: surprised
        - id: ch01-b02
          speaker: narrator
          text: 爱丽丝惊讶得连正经话都忘了怎么说。她低头一看，两只脚离得太远，几乎都瞧不见了。
        - id: ch01-b03
          speaker: alice
          text: 我可怜的小脚，以后谁替你们穿鞋穿袜呢？反正我离得这么远，肯定管不了啦。你们只好自己想办法。可我也得对你们好一点儿，不然你们不肯往我要去的地方走，那可怎么办？有了！每年圣诞节，我都送你们一双新靴子。
        - id: ch01-b04
          speaker: narrator
          text: 接着，她又盘算起靴子该怎么送。
        - id: ch01-b05
          speaker: alice
          text: 得托运货的人送去。给自己的脚寄礼物，想想就好笑。地址更怪，得写成：壁炉围栏旁，炉前地毯上，爱丽丝的右脚先生收。爱丽丝谨致问候。哎呀，我说的都是什么傻话！
        - id: ch01-b06
          speaker: narrator
          text: 就在这时，她的脑袋撞到了大厅屋顶。原来她已经有九英尺多高了。爱丽丝马上拿起小金钥匙，赶到花园门前。可怜的爱丽丝只能侧身躺下，好不容易才用一只眼睛望进花园。至于从那扇小门钻过去，比刚才还要没有希望。她只好坐下来，又哭了。
        - id: ch01-b07
          speaker: alice
          text: 爱丽丝，你真该害臊！都这么大一个姑娘了，还哭个不停。我命令你马上停下！
        - id: ch01-b08
          speaker: narrator
          text: 她嘴上这样训自己，眼泪却一点儿没停，反而一股接一股地往下淌，足足流了好几加仑。泪水在她四周积成一个大池子，约有四英寸深，一直淌到大厅中间。
        - id: ch01-b09
          speaker: narrator
          text: 过了一会儿，远处传来轻轻的脚步声。爱丽丝赶紧擦干眼睛，想看清是谁来了。原来是白兔回来了。它穿得很讲究，一只手拿着一双白色小山羊皮手套，另一只手拿着大扇子，一路急急忙忙地小跑，嘴里还不停念叨。
        - id: ch01-b10
          speaker: white_rabbit
          text: 哎呀！公爵夫人，公爵夫人！我要是让她等久了，她还不得大发雷霆！
          emotion: fearful
        - id: ch01-b11
          speaker: narrator
          text: 爱丽丝已经急得不管碰见谁都想求助。等白兔走近，她怯生生地开了口。
        - id: ch01-b12
          speaker: alice
          text: 先生，请问，您能帮帮我吗？
        - id: ch01-b13
          speaker: narrator
          text: 白兔猛地吓了一跳，扔下手套和扇子，拼命逃进黑暗里。爱丽丝捡起东西。大厅热得很，她拿着扇子不停扇风，也继续跟自己说起话来。
    - id: ch02
      title: 我究竟是谁
      blocks:
        - id: ch02-b01
          speaker: alice
          text: 天哪，今天什么都怪透了！昨天明明还和平常一样。难道我夜里被换掉了？今天早晨醒来时，我还是原来的我吗？我好像记得，那时已经觉得有一点儿不一样。可要是我不是我，那天底下，我究竟是谁？这才是个大难题！
        - id: ch02-b02
          speaker: narrator
          text: 她把所有认识的、跟自己同岁的孩子挨个儿想了一遍，猜自己会不会在夜里变成了其中一个。要弄清自己是谁，她决定先看看脑子里那些从前会的东西还在不在。
        - id: ch02-b03
          speaker: alice
          text: 我肯定不是艾达，她的头发打着长长的鬈儿，我的头发可一点儿也不鬈。我也不可能是梅布尔。我懂各种各样的东西，她却只懂那么一点点。再说，她就是她，我就是我，而且——哎呀，怎么越想越糊涂！我来试试从前学会的东西。四五十二，四六十三，四七是——照这样下去，我永远也算不到二十！算了，乘法表不重要，试试地理。伦敦是巴黎的首都，巴黎是罗马的首都，罗马——不对，全错啦！我一定变成梅布尔了。再背背那首“小小的是怎样”。
        - id: ch02-b04
          speaker: narrator
          text: 她把双手交叠在膝头，摆出背功课的样子。可是声音听着又哑又陌生，词也全变了。
        - id: ch02-b05
          speaker: alice
          text: 小小鳄鱼多勤快，把闪亮尾巴巧梳妆，尼罗河水轻轻洒，金灿灿的鳞片放光芒！看它笑得多欢畅，利爪张得多漂亮，温温柔柔咧开嘴，欢迎小鱼儿游进嘴巴！
        - id: ch02-b06
          speaker: narrator
          text: 爱丽丝一听就知道，这绝不是从前背过的词。她越发相信自己变成了别人，眼睛里又涌满了泪水。
        - id: ch02-b07
          speaker: alice
          text: 看来我真是梅布尔了。我得住进她那间又小又憋闷的屋子，几乎没有玩具，还要学数也数不清的功课。不，我决定了！要是我是梅布尔，我就留在这里。就算他们探头下来喊我回去，我也要先问清楚，我到底是谁。要是我喜欢那个人，我就上去。要是不喜欢，我就待到自己变成别人。可是……我真希望他们能把头探下来呀！我一个人待在这里，已经烦透了！
          emotion: sad
        - id: ch02-b08
          speaker: narrator
          text: 她突然放声大哭。低头一看，自己说话时竟戴上了一只白兔的小山羊皮手套。她怎么也想不通，自己的手怎样塞得进去，只能猜是身体又在缩小。她站起来，走到桌边比了比，估摸着只剩两英尺高，而且还在迅速变小。很快她发现，原来是手里的扇子在作怪。她急忙把扇子扔掉。幸好扔得及时，差一点儿就缩得完全不见了。
        - id: ch02-b09
          speaker: alice
          text: 好险呀！还好我自己没有消失，真的还好端端地活着。现在去花园！
          emotion: surprised
        - id: ch02-b10
          speaker: narrator
          text: 她一心惦记着花园，飞快跑回那扇小门前。可是，小门已经重新关上了，那把小金钥匙也跟先前一样，远远地躺在玻璃桌上。
        - id: ch02-b11
          speaker: alice
          text: 事情比刚才更糟了。我从来没有这么小过！这实在太过分了！
    - id: ch03
      title: 掉进自己的眼泪
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 话才说完，爱丽丝脚下一滑。扑通！咸水一下淹到她的下巴。她先以为自己掉进了海里。
        - id: ch03-b02
          speaker: alice
          text: 要真是海，我就能坐火车回去。
        - id: ch03-b03
          speaker: narrator
          text: 爱丽丝一生中只去过一次海边，却已经得出了一个结论。在英国，不管到了哪一处海岸，海里总有一排更衣浴车，沙滩上总有孩子拿木铲挖沙。孩子们身后是一排出租的房屋，房屋后面准有火车站。所以，她才觉得只要是海，就能坐火车回家。可是很快，她发现这根本不是海。她正泡在自己九英尺高时哭出的那池眼泪里。
        - id: ch03-b04
          speaker: alice
          text: 我真不该哭那么多！这下大概要受罚了，竟然会淹死在自己的眼泪里。那可真够稀奇的！不过，今天什么事都稀奇。
        - id: ch03-b05
          speaker: narrator
          text: 她一边在池里游来游去，一边寻找出去的路。忽然，不远处有什么东西在水里扑腾。她游近一点儿，想看清那究竟是什么。起初，她猜那一定是海象或河马，随即才想起自己现在小得很。仔细一瞧，原来只是一只老鼠，也跟她一样失足掉进了水里。
        - id: ch03-b06
          speaker: narrator
          text: 爱丽丝心想，这地方什么怪事都有，老鼠很可能也会说话，试试总没有坏处。
        - id: ch03-b07
          speaker: alice
          text: 老鼠啊，你知道怎么游出这个水池吗？我在这里游得累极了，老鼠啊！
        - id: ch03-b08
          speaker: narrator
          text: 她从没跟老鼠说过话，只记得哥哥的拉丁语法书上写着：“一只老鼠，一只老鼠的，给一只老鼠，一只老鼠，老鼠啊！”所以她以为，对老鼠就该这样称呼。老鼠颇为好奇地看着她。爱丽丝觉得，它仿佛还眨了一下小眼睛，却一个字也没有说。
        - id: ch03-b09
          speaker: alice
          text: 它也许听不懂英语。我敢说，这是一只跟征服者威廉一起来的法国老鼠。
        - id: ch03-b10
          speaker: narrator
          text: 爱丽丝历史学得不少，却分不清那些事到底发生在多久以前。她又换成法语，说出了课本里的第一句话。
        - id: ch03-b11
          speaker: alice
          text: Où est ma chatte？我的猫在哪里？
        - id: ch03-b12
          speaker: narrator
          text: 老鼠突然从水里蹿了一下，吓得浑身发抖。爱丽丝这才怕自己伤了它的感情。
        - id: ch03-b13
          speaker: alice
          text: 哎呀，请原谅！我完全忘了你不喜欢猫。
        - id: ch03-b14
          speaker: mouse
          text: 不喜欢猫？要是你是我，你会喜欢猫吗？
          emotion: angry
    - id: ch04
      title: 老鼠为什么生气
      blocks:
        - id: ch04-b01
          speaker: alice
          text: 嗯，要是我是你，也许不会喜欢。你别生气。不过，我真想让你看看我家的黛娜。只要见它一面，你说不定就会喜欢猫了。它是个多么可爱、多么安静的小家伙呀。它坐在炉火边时，呼噜打得可好听了。它还会舔舔爪子，洗洗脸。抱在怀里又柔软又舒服，而且，它特别会捉老鼠——哎呀，请原谅！
        - id: ch04-b02
          speaker: narrator
          text: 爱丽丝懒洋洋地在水里游着，越说越像在自言自语。等她提起黛娜会捉老鼠，眼前这只老鼠全身的毛都竖了起来。她看得出，这回老鼠真的受了冒犯。
        - id: ch04-b03
          speaker: alice
          text: 要是你不愿意，我们再也不谈黛娜了。
        - id: ch04-b04
          speaker: mouse
          text: 我们？说得好像我肯谈这种事一样！我们一家向来痛恨猫。猫又恶心，又卑贱，又粗俗！别再让我听见那个名字！
          emotion: angry
        - id: ch04-b05
          speaker: narrator
          text: 老鼠气得一直抖到尾巴尖。爱丽丝赶紧答应，急着另找一个话题。
        - id: ch04-b06
          speaker: alice
          text: 我一定不提了。那么，你……你喜欢狗吗？我家附近有一只很可爱的小狗，真想让你看看。它是一只小梗犬，眼睛亮晶晶的，棕色长毛还打着鬈儿。你把东西扔出去，它会替你捡回来。它还会坐起来讨饭吃，也会做各种各样的事，我连一半都记不住。它是一个农夫养的。那个农夫说，它能干极了，足足值一百英镑呢！他说，那只狗能咬死所有的耗子，还会——哎呀！我恐怕又得罪它了！
          emotion: sad
        - id: ch04-b07
          speaker: narrator
          text: 老鼠一句也没回答，拼命朝远处游去，把池水搅得哗啦作响。爱丽丝只好在后面轻声喊它。
        - id: ch04-b08
          speaker: alice
          text: 亲爱的老鼠，快回来吧！只要你不喜欢，我们既不谈猫，也不谈狗！
        - id: ch04-b09
          speaker: narrator
          text: 老鼠听见后，终于转过身，慢慢游了回来。它的脸已经气得煞白，至少爱丽丝觉得，那准是气的。老鼠游到她身边，连开口时的声音都还低低地发着抖。
        - id: ch04-b10
          speaker: mouse
          text: 咱们先上岸。等到了岸上，我会把自己的身世讲给你听。那时你就明白，我为什么恨猫和狗了。
        - id: ch04-b11
          speaker: narrator
          text: 他们确实该赶快上岸了。掉进池里的鸟兽越来越多，水面已经挤得满满当当。里面有一只鸭子、一只渡渡鸟、一只吸蜜鹦鹉、一只小鹰，还有好些说不出名字的稀奇动物。爱丽丝游在最前面领路，这一大群伙伴便跟着她，一起向岸边游去。
