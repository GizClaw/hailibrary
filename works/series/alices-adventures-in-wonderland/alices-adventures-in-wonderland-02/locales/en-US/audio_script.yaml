audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a playful touch
        timbre: clear and gently rounded
        pace: measured with lively turns
        pitch: medium
    alice:
      display_name: Alice
      tts:
        delivery: bright, curious, and candid
        timbre: clear and youthful
        pace: naturally quick with thoughtful pauses
        pitch: medium-high
    white_rabbit:
      display_name: White Rabbit
      tts:
        delivery: breathless, fussy, and hurried
        timbre: light and crisp
        pace: quick
        pitch: high
    mouse:
      display_name: Mouse
      tts:
        delivery: sharp, dignified, and easily offended
        timbre: small and reedy
        pace: brisk with tense pauses
        pitch: high
  chapters:
    - id: ch01
      title: Taller Than Ever
      blocks:
        - id: ch01-b01
          speaker: alice
          text: Curiouser and curiouser! I'm stretching out like the biggest telescope there ever was! Good-bye, feet!
          emotion: surprised
        - id: ch01-b02
          speaker: narrator
          text: Alice was so surprised that she forgot how to speak proper English. When she looked down, her feet seemed almost out of sight. They were getting farther away every second.
        - id: ch01-b03
          speaker: alice
          text: Oh, my poor little feet! Who's going to put on your shoes and stockings now? I certainly can't do it. I'll be much too far away. You'll have to manage somehow. But I'd better be kind to you, or maybe you won't take me where I want to go. Let's see. I'll give you a new pair of boots every Christmas.
        - id: ch01-b04
          speaker: narrator
          text: Then she began planning how she would send the boots all the way down to her feet. The idea of giving presents to part of herself seemed very funny.
        - id: ch01-b05
          speaker: alice
          text: I'll have to send the boots with a deliveryman. How funny, sending presents to my own feet! And what a strange address I'll write. Alice's Right Foot, Esquire. Hearthrug, near the Fender. With Alice's love. Oh dear, what nonsense I'm talking!
        - id: ch01-b06
          speaker: narrator
          text: Just then, her head bumped against the roof of the hall. She was more than nine feet tall. Alice quickly picked up the little golden key and hurried to the garden door.
        - id: ch01-b07
          speaker: narrator
          text: Poor Alice had to lie on her side just to look into the garden with one eye. That was all she could manage. Getting through the tiny doorway was more impossible than ever, and the lovely garden remained out of reach. She sat down and began to cry again.
        - id: ch01-b08
          speaker: alice
          text: You should be ashamed of yourself! A great big girl like you, crying this way. Stop right now, do you hear me?
          emotion: angry
        - id: ch01-b09
          speaker: narrator
          text: But Alice kept crying all the same. She shed gallons of tears until a pool surrounded her. It was about four inches deep and reached halfway down the hall.
    - id: ch02
      title: The Rabbit's Fan
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: After a while, Alice heard the soft patter of feet in the distance. She quickly dried her eyes and looked to see what was coming. The White Rabbit was returning. He was splendidly dressed, with white kid gloves in one hand and a large fan in the other. He hurried along, muttering to himself.
        - id: ch02-b02
          speaker: white_rabbit
          text: Oh, the Duchess! The Duchess! She'll be furious if I've kept her waiting!
          emotion: fearful
        - id: ch02-b03
          speaker: narrator
          text: Alice was desperate enough to ask anyone for help. When the Rabbit came close, she spoke in a low, timid voice.
        - id: ch02-b04
          speaker: alice
          text: Excuse me, sir—
        - id: ch02-b05
          speaker: narrator
          text: The Rabbit gave a violent start when he heard her. He dropped the gloves and the fan, then raced away into the darkness as fast as he could.
        - id: ch02-b06
          speaker: narrator
          text: Alice picked up the fan and gloves. The hall was very hot, so she fanned herself while she talked.
        - id: ch02-b07
          speaker: alice
          text: Oh dear. Everything is so strange today! Yesterday, everything happened just as usual. Could I have changed during the night? Was I the same person when I got up this morning? I almost remember feeling a little different. But if I'm not the same, then who in the world am I? That's the great puzzle!
        - id: ch02-b08
          speaker: narrator
          text: She thought carefully about every child she knew who was her age. Perhaps she had somehow changed into one of them while she slept. If she could rule them out one by one, she might discover who she was now.
        - id: ch02-b09
          speaker: alice
          text: I know I'm not Ada. Her hair falls in long ringlets, and mine doesn't curl at all. And I can't be Mabel. I know all sorts of things, and she knows hardly anything. Besides, she's herself, and I'm myself, and—oh, this is so confusing! I'll see whether I still know the things I used to know. Four times five is twelve. Four times six is thirteen. Four times seven is—oh dear! At that rate, I'll never reach twenty!
        - id: ch02-b10
          speaker: alice
          text: Never mind multiplication. I'll try geography. London is the capital of Paris, Paris is the capital of Rome, and Rome—no, that's completely wrong! I must have turned into Mabel. I'll try reciting, “How doth the little—”
        - id: ch02-b11
          speaker: narrator
          text: Alice folded her hands neatly in her lap as though she were reciting a lesson at school. But her voice sounded hoarse and unfamiliar. Even worse, the familiar poem would not come back correctly. Different words came out instead.
        - id: ch02-b12
          speaker: alice
          text: How doth the little crocodile improve his shining tail, and pour the waters of the Nile on every golden scale! How cheerfully he seems to grin, how neatly spreads his claws, and welcomes little fishes in with gently smiling jaws!
        - id: ch02-b13
          speaker: alice
          text: Those can't be the right words. I really must be Mabel. I'll have to live in that cramped little house, with almost no toys and far too many lessons! No. I've decided. If I'm Mabel, I'm staying down here. It won't help if they lean down and call, “Come back up, dear!” I'll look up and ask, “Who am I? Tell me that first. If I like being that person, I'll come up. If I don't, I'll stay here until I'm somebody else.”
          emotion: sad
        - id: ch02-b14
          speaker: alice
          text: Oh, I wish they would lean down and call me! I'm so tired of being alone down here!
          emotion: sad
        - id: ch02-b15
          speaker: narrator
          text: Alice burst into tears at the thought of being left alone. Then she looked at her hands and was amazed to find that, while talking, she had slipped on one of the Rabbit's tiny white gloves. A moment ago, it could never have fit her.
        - id: ch02-b16
          speaker: alice
          text: How could I possibly have put that on? I must be getting smaller again.
          emotion: surprised
        - id: ch02-b17
          speaker: narrator
          text: She stood beside the table to measure herself. As nearly as she could tell, she was about two feet tall, and she was still shrinking quickly. She tried to work out what had caused the change. Then she noticed the fan in her hand and understood. Alice dropped it at once, just before she could shrink away completely.
        - id: ch02-b18
          speaker: alice
          text: That was a close call! I'm still here, thank goodness. Now, off to the garden!
          emotion: fearful
        - id: ch02-b19
          speaker: narrator
          text: Alice ran as fast as she could to the little door. But the door was locked again, and the golden key lay on the glass table just as before.
        - id: ch02-b20
          speaker: alice
          text: Now things are worse than ever! I've never been this small before. Never! It really isn't fair!
          emotion: angry
    - id: ch03
      title: The Pool of Tears
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: As Alice said this, her foot slipped. A moment later, splash! She was in salt water up to her chin.
        - id: ch03-b02
          speaker: narrator
          text: At first, she thought she had somehow fallen into the sea. Alice had visited the seaside once in her life. From that one trip, she had decided every English coast looked the same. There would be bathing machines in the water, children digging in the sand with wooden spades, a row of lodging houses, and a railway station behind them.
        - id: ch03-b03
          speaker: alice
          text: If this is the sea, I can take the train home.
        - id: ch03-b04
          speaker: narrator
          text: But soon she understood. She was swimming in the pool of tears she had made when she was nine feet tall.
        - id: ch03-b05
          speaker: alice
          text: I wish I hadn't cried so much! Now I suppose I'll be punished by drowning in my own tears. What a strange thing that would be. Then again, everything is strange today.
        - id: ch03-b06
          speaker: narrator
          text: Something splashed in the pool a short distance away. Alice swam closer, trying to see what it was through the water. At first, she imagined it must be something enormous, perhaps a walrus or a hippopotamus. Then she remembered how small she was now. What looked so large to her was only a mouse that had fallen in, just as she had.
        - id: ch03-b07
          speaker: narrator
          text: Alice wondered whether speaking to the Mouse would do any good. Everything down there was so unusual that it might very well know how to talk. There was no harm in trying.
        - id: ch03-b08
          speaker: alice
          text: O Mouse, do you know how to get out of this pool? I'm very tired of swimming around in here, O Mouse!
        - id: ch03-b09
          speaker: narrator
          text: Alice had never spoken to a mouse before, so she was not sure how to address one politely. She used the form she remembered seeing in her brother's Latin grammar. A mouse. Of a mouse. To a mouse. A mouse. O mouse. The Mouse looked at her with interest and seemed to wink one tiny eye, but it said nothing.
        - id: ch03-b10
          speaker: narrator
          text: Perhaps it did not understand English, Alice thought. Maybe it was a French mouse that had come over with William the Conqueror. That seemed possible to her. Alice knew plenty of names from history, but she had no clear idea how long ago any of those people had lived.
        - id: ch03-b11
          speaker: alice
          text: Où est ma chatte?
        - id: ch03-b12
          speaker: narrator
          text: That was the first sentence in her French lesson book. It meant, “Where is my cat?” The Mouse leaped out of the water and trembled all over with fright.
        - id: ch03-b13
          speaker: alice
          text: Oh, I'm so sorry! I forgot that you don't like cats.
          emotion: fearful
        - id: ch03-b14
          speaker: mouse
          text: Don't like cats? Would you like cats if you were me?
          emotion: angry
    - id: ch04
      title: The Mouse
      blocks:
        - id: ch04-b01
          speaker: alice
          text: Well, maybe I wouldn't. Please don't be angry. But I wish you could meet our cat, Dinah. I think you'd learn to like cats if you saw her. She's such a sweet, quiet thing.
        - id: ch04-b02
          speaker: narrator
          text: Alice was almost talking to herself as she drifted lazily through the pool.
        - id: ch04-b03
          speaker: alice
          text: Dinah sits by the fire and purrs so beautifully. She licks her paws and washes her face. She's soft and lovely to hold, and she's excellent at catching mice—oh! I'm sorry!
          emotion: surprised
        - id: ch04-b04
          speaker: narrator
          text: The Mouse's fur was standing on end all over its body. Alice could see at once that mentioning a cat catching mice had made matters much worse. She was sure she had truly offended it this time.
        - id: ch04-b05
          speaker: alice
          text: We won't talk about Dinah anymore, if you'd rather not.
        - id: ch04-b06
          speaker: mouse
          text: We? As if I would ever talk about cats! My whole family has always hated them. They're nasty, low, vulgar creatures. Don't say that name again!
          emotion: angry
        - id: ch04-b07
          speaker: narrator
          text: The Mouse was trembling all the way to the tip of its tail. Alice hurried to find a different subject.
        - id: ch04-b08
          speaker: alice
          text: I won't! Are you—are you fond of dogs?
        - id: ch04-b09
          speaker: narrator
          text: The Mouse did not answer, so Alice eagerly went on.
        - id: ch04-b10
          speaker: alice
          text: There's a wonderful little dog near our house. I'd love to show him to you. He's a bright-eyed terrier with long, curly brown hair. He fetches anything you throw, and he sits up to beg for his dinner. He can do so many tricks that I can't remember half of them. He belongs to a farmer who says he's worth a hundred pounds because he's so useful. He kills all the rats and—oh dear! I've upset you again!
          emotion: sad
        - id: ch04-b11
          speaker: narrator
          text: The Mouse was already swimming away from her as fast as it could. Its furious paddling churned the pool and sent little waves spreading through the crowded water.
        - id: ch04-b12
          speaker: alice
          text: Dear Mouse, please come back! We won't talk about cats or dogs, if you don't like them!
        - id: ch04-b13
          speaker: narrator
          text: The Mouse turned around and slowly swam back. Its face was pale. Alice thought it was pale with anger. In a low, trembling voice, it spoke.
        - id: ch04-b14
          speaker: mouse
          text: Let's get to the shore. Then I'll tell you my story, and you'll understand why I hate cats and dogs.
          emotion: angry
        - id: ch04-b15
          speaker: narrator
          text: It was certainly time to leave the pool. While Alice and the Mouse had been talking, more and more birds and animals had fallen in. The water was now crowded. There was a Duck, a Dodo, a Lory, an Eaglet, and several other curious creatures. Alice led the way toward dry ground, and the whole wet party swam after her to the shore.
