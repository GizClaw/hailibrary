cover_prompt: |-
  A wordless cover scene shows Alice standing at the threshold of a bewildering underground garden in a distinctly mid-Victorian world. Alice is a curious seven-year-old English girl with long fair hair, a plain pale-blue ankle-length dress, white pinafore, striped stockings, and black buttoned shoes, designed directly from the period rather than any later adaptation. A hurried white rabbit in a waistcoat holds a pocket watch nearby, while a grinning cat rests on a branch and tiny playing-card gardeners paint white roses red in the distance. Alice reaches toward a small golden key on a low glass table, making discovery the focal action. Use a low three-quarter view through an arched doorway, arranging the strange figures in layered depth and leaving calm dark space above the arch. Keep the wonder playful, original, and non-frightening, with no resemblance to film or animation designs. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
