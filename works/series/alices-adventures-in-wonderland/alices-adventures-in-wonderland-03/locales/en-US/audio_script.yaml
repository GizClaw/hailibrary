audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a playful touch
        timbre: clear and gently rounded
        pace: measured with lively turns
        pitch: medium
    alice:
      display_name: Alice
      tts:
        delivery: bright, curious, and candid
        timbre: clear and youthful
        pace: naturally quick with thoughtful pauses
        pitch: medium-high
    mouse:
      display_name: Mouse
      tts:
        delivery: sharp, dignified, and easily offended
        timbre: small and reedy
        pace: brisk with tense pauses
        pitch: high
    lory:
      display_name: Lory
      tts:
        delivery: prickly, superior, and quick to sulk
        timbre: dry and feathery
        pace: brisk
        pitch: medium-high
    duck:
      display_name: Duck
      tts:
        delivery: literal-minded and mildly argumentative
        timbre: round and nasal
        pace: measured
        pitch: medium
    dodo:
      display_name: Dodo
      tts:
        delivery: grand, solemn, and self-important
        timbre: full and slightly pompous
        pace: deliberate
        pitch: medium-low
    eaglet:
      display_name: Eaglet
      tts:
        delivery: young, blunt, and mischievous
        timbre: light and keen
        pace: quick
        pitch: high
    old_crab:
      display_name: Old Crab
      tts:
        delivery: motherly, moralizing, and pointed
        timbre: papery and mature
        pace: unhurried
        pitch: medium
    young_crab:
      display_name: Young Crab
      tts:
        delivery: impatient, snappish, and youthful
        timbre: bright and clipped
        pace: quick
        pitch: medium-high
