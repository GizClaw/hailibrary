  chapters:
    - id: ch01
      title: A Caucus-Race and a Long Tale
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: What a strange-looking crowd stood dripping on the bank. The birds' feathers hung in wet clumps, and the animals' fur was plastered close to their bodies. Every one of them was soaked, uncomfortable, and cross.
        - id: ch01-b02
          speaker: narrator
          text: The first thing they had to decide was how to get dry. They talked it over, and within minutes Alice was chatting with the creatures as easily as if she had known them forever. She even had a long argument with the Lory. In the end, the Lory turned sulky and refused to say anything except this.
        - id: ch01-b03
          speaker: lory
          text: I'm older than you, so I know better.
        - id: ch01-b04
          speaker: narrator
          text: Alice would not accept that unless the Lory said how old it was. She wanted to know what proof the Lory had. But the Lory flatly refused to reveal its age, so there was nothing more either of them could say.
        - id: ch01-b05
          speaker: mouse
          text: Everyone, sit down and listen! I'll have you dry in no time.
        - id: ch01-b06
          speaker: narrator
          text: The Mouse seemed to have some authority over the others. They immediately formed a wide ring around it. Alice watched anxiously. If she stayed wet much longer, she felt certain she would catch a terrible cold.
        - id: ch01-b07
          speaker: mouse
          text: Ahem! Is everyone ready? This is the driest thing I know. Quiet, please. William the Conqueror had the pope on his side. The English soon submitted to him because they needed leaders and had lately grown used to being conquered. Edwin and Morcar, the earls of Mercia and Northumbria—
        - id: ch01-b08
          speaker: lory
          text: Ugh!
        - id: ch01-b09
          speaker: narrator
          text: The Lory shivered. The Mouse frowned, though it spoke very politely.
        - id: ch01-b10
          speaker: mouse
          text: Excuse me. Did you say something?
        - id: ch01-b11
          speaker: lory
          text: No, not me!
        - id: ch01-b12
          speaker: mouse
          text: I thought you did. Now, where was I? Edwin and Morcar, the earls of Mercia and Northumbria, supported William. Even Stigand, the patriotic archbishop of Canterbury, found it advisable—
        - id: ch01-b13
          speaker: duck
          text: Found what?
        - id: ch01-b14
          speaker: mouse
          text: Found it. You know perfectly well what “it” means.
        - id: ch01-b15
          speaker: duck
          text: I know what it means when I find something. Usually, I find a frog or a worm. But what did the archbishop find?
        - id: ch01-b16
          speaker: narrator
          text: The Mouse ignored the question and rushed on.
        - id: ch01-b17
          speaker: mouse
          text: He found it advisable to go with Edgar Atheling, meet William, and offer him the crown. At first, William behaved moderately. But then his Normans became insolent—How are you doing now, my dear?
        - id: ch01-b18
          speaker: narrator
          text: The Mouse had turned to Alice.
        - id: ch01-b19
          speaker: alice
          text: I'm just as wet as before. This isn't drying me at all.
          emotion: sad
        - id: ch01-b20
          speaker: narrator
          text: The Dodo rose with great dignity.
        - id: ch01-b21
          speaker: dodo
          text: Then I propose that we adjourn this meeting and immediately adopt more energetic remedies—
        - id: ch01-b22
          speaker: eaglet
          text: Speak English! I don't understand half those long words, and I bet you don't either.
        - id: ch01-b23
          speaker: narrator
          text: The Eaglet ducked its head to hide a smile. Several other birds giggled where everyone could hear them. The Dodo sounded offended.
        - id: ch01-b24
          speaker: dodo
          text: I was going to say that the best way for us to get dry is to have a Caucus-race.
        - id: ch01-b25
          speaker: alice
          text: What's a Caucus-race?
        - id: ch01-b26
          speaker: narrator
          text: Alice was not especially curious, but the Dodo had paused as if somebody ought to ask, and nobody else seemed willing.
        - id: ch01-b27
          speaker: dodo
          text: The best way to explain it is to do it.
        - id: ch01-b28
          speaker: narrator
          text: Perhaps you might want to try a Caucus-race yourself on some winter day, so here is how the Dodo managed it. First, it marked out a course in a sort of circle. The Dodo said the exact shape did not matter. Then it placed everyone here and there along the course, with no proper starting line. Nobody called, “One, two, three, go!” The creatures simply began running whenever they pleased. They also stopped whenever they pleased. Some would be racing while others were standing still, so it was not easy to tell when the race was really finished.
        - id: ch01-b29
          speaker: narrator
          text: On and on they went for about half an hour. By then, all that running had finally made them completely dry. Without warning, the Dodo decided the race had lasted long enough and shouted to the runners.
        - id: ch01-b30
          speaker: dodo
          text: The race is over!
        - id: ch01-b31
          speaker: narrator
          text: The whole party crowded around, panting.
        - id: ch01-b32
          speakers: [alice, lory, duck, eaglet]
          ensemble: chorus
          text: But who won?
        - id: ch01-b33
          speaker: narrator
          text: The Dodo could not answer such an important question without thinking very hard. It sat down for a long time with one finger pressed to its forehead. It looked just like Shakespeare in the pictures people make of him. The others stood around it and waited without a sound. At last, the Dodo was ready to announce its decision.
        - id: ch01-b34
          speaker: dodo
          text: Everybody won, and everybody must get a prize.
        - id: ch01-b35
          speakers: [lory, duck, eaglet]
          ensemble: chorus
          text: Then who's giving out the prizes?
        - id: ch01-b36
          speaker: dodo
          text: She is, of course.
        - id: ch01-b37
          speaker: narrator
          text: The Dodo pointed straight at Alice. At once, they all pressed around her, calling for prizes in a jumble of voices.
        - id: ch01-b38
          speakers: [lory, duck, eaglet]
          ensemble: chorus
          text: Prizes! We want prizes!
        - id: ch01-b39
          speaker: narrator
          text: Alice had no idea how she was supposed to produce prizes for an entire crowd. In despair, she reached into her pocket and felt around. She pulled out a box of little candies. Luckily, the salt water had not gotten inside, so the candy was still good. Alice handed the pieces around one by one. When she finished, there had been exactly enough for every creature to receive one.
        - id: ch01-b40
          speaker: mouse
          text: Alice ought to get a prize too.
        - id: ch01-b41
          speaker: dodo
          text: Of course. Alice, what else is in your pocket?
        - id: ch01-b42
          speaker: alice
          text: Just a thimble.
          emotion: sad
        - id: ch01-b43
          speaker: dodo
          text: Give it to me.
        - id: ch01-b44
          speaker: narrator
          text: Alice handed over the thimble. Once again, everyone gathered closely around her. Then the Dodo stood before Alice with a very serious expression and solemnly presented her own thimble back to her as if it were a splendid award.
        - id: ch01-b45
          speaker: dodo
          text: Please accept this elegant thimble.
        - id: ch01-b46
          speaker: narrator
          text: When the little speech ended, everyone cheered. Alice thought the whole ceremony was ridiculous. But all the creatures looked so serious that she did not dare laugh. She could think of nothing to say, so she bowed, accepted the thimble, and tried to look just as solemn as they did.
        - id: ch01-b47
          speaker: narrator
          text: Then it was time to eat the candy. That made plenty of noise and confusion. The large birds complained that they could not even taste such tiny pieces. The small birds choked and had to be patted on the back. At last, it was all over. Everyone sat down in a ring again and asked the Mouse to tell them more.
        - id: ch01-b48
          speaker: alice
          text: You promised to tell me your history, remember? And why you hate C and D.
        - id: ch01-b49
          speaker: narrator
          text: Alice whispered the letters. She was half afraid of offending the Mouse again.
        - id: ch01-b50
          speaker: mouse
          text: Mine is a long and sad tale.
          emotion: sad
        - id: ch01-b51
          speaker: narrator
          text: Alice stared in wonder at the Mouse's tail.
        - id: ch01-b52
          speaker: alice
          text: Your tail certainly is long. But why do you call it sad?
        - id: ch01-b53
          speaker: narrator
          text: While the Mouse spoke, Alice kept puzzling over its tail. In her mind, the story twisted and bent like this.
        - id: ch01-b54
          speaker: mouse
          text: Fury met a mouse in a house and said, “Come to court with me. I'm going to prosecute you, and I won't take no for an answer. We must have a trial, because I truly have nothing else to do this morning.” The mouse answered the dog, “Dear sir, a trial with no judge and no jury would only waste our breath.” But clever old Fury said, “I'll be the judge, and I'll be the jury too. I'll hear the whole case by myself. Then I'll find you guilty and sentence you to death.”
        - id: ch01-b55
          speaker: mouse
          text: You aren't listening! What are you thinking about?
          emotion: angry
        - id: ch01-b56
          speaker: alice
          text: I'm very sorry. I think you'd reached the fifth bend.
        - id: ch01-b57
          speaker: mouse
          text: I had not!
          emotion: angry
        - id: ch01-b58
          speaker: alice
          text: A knot? Oh, let me help you untie it!
        - id: ch01-b59
          speaker: narrator
          text: Alice looked around anxiously, ready to be useful. But the Mouse stood up and began to walk away.
        - id: ch01-b60
          speaker: mouse
          text: I won't do anything of the kind. You insult me with all this nonsense!
          emotion: angry
        - id: ch01-b61
          speaker: alice
          text: I didn't mean to! But you do get offended so easily.
        - id: ch01-b62
          speaker: narrator
          text: The Mouse answered with nothing but a growl.
        - id: ch01-b63
          speaker: alice
          text: Please come back and finish your story!
        - id: ch01-b64
          speakers: [lory, duck, dodo, eaglet]
          ensemble: chorus
          text: Yes, please come back!
        - id: ch01-b65
          speaker: narrator
          text: The Mouse only shook its head impatiently and walked faster.
        - id: ch01-b66
          speaker: lory
          text: What a shame it wouldn't stay!
          emotion: sad
        - id: ch01-b67
          speaker: narrator
          text: The moment the Mouse was out of sight, an old Crab turned to her daughter and seized the opportunity.
        - id: ch01-b68
          speaker: old_crab
          text: There, my dear. Let that teach you never to lose your temper.
        - id: ch01-b69
          speaker: young_crab
          text: Be quiet, Ma! You could wear out an oyster's patience!
          emotion: angry
        - id: ch01-b70
          speaker: alice
          text: I wish Dinah were here. She'd bring that Mouse back soon enough!
        - id: ch01-b71
          speaker: narrator
          text: Alice had spoken aloud to no one in particular. The Lory answered her.
        - id: ch01-b72
          speaker: lory
          text: And who is Dinah, if I may ask?
        - id: ch01-b73
          speaker: narrator
          text: Alice was always eager to talk about her pet.
        - id: ch01-b74
          speaker: alice
          text: Dinah is our cat. You wouldn't believe how good she is at catching mice! And you should see her chase birds. She'll eat a little bird the moment she sees it!
        - id: ch01-b75
          speaker: narrator
          text: That caused quite a stir. Several birds hurried away at once. An old Magpie began wrapping itself up very carefully.
        - id: ch01-b76
          speaker: magpie
          text: I really must go home. The night air is bad for my throat.
        - id: ch01-b77
          speaker: narrator
          text: A Canary called to its children in a trembling voice.
        - id: ch01-b78
          speaker: canary
          text: Come along, my dears! It's long past your bedtime!
          emotion: fearful
        - id: ch01-b79
          speaker: narrator
          text: That was enough for the rest of the party. Each bird or animal suddenly found some excuse to leave. They moved off in different directions, careful not to say that Dinah was the real reason. One by one, they all disappeared. Very soon, Alice was left sitting there completely alone.
        - id: ch01-b80
          speaker: alice
          text: I wish I hadn't mentioned Dinah. Nobody down here seems to like her, and I'm sure she's the best cat in the world. Oh, my dear Dinah! Will I ever see you again?
          emotion: sad
        - id: ch01-b81
          speaker: narrator
          text: Poor Alice began to cry again. She felt lonely and miserable.
        - id: ch01-b82
          speaker: narrator
          text: After a little while, she heard the soft patter of footsteps in the distance. Alice looked up eagerly, half hoping the Mouse had changed its mind and was coming back to finish the story.
