audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带着一本正经的幽默
        timbre: 温暖清亮
        pace: 舒展而富有变化
        pitch: 中音
    alice:
      display_name: 爱丽丝
      tts:
        delivery: 好奇伶俐，想到什么就自然说出来
        timbre: 清脆稚嫩
        pace: 轻快，思索时稍慢
        pitch: 中高音
    mouse:
      display_name: 老鼠
      tts:
        delivery: 敏感自尊，激动时尖锐急促
        timbre: 细亮而略显紧绷
        pace: 中等，生气时加快
        pitch: 高音
    lory:
      display_name: 吸蜜鹦鹉
      tts:
        delivery: 倔强直率，容易不耐烦
        timbre: 清亮偏尖
        pace: 中快
        pitch: 高音
    duck:
      display_name: 鸭子
      tts:
        delivery: 认真追问，带着朴实的较真
        timbre: 略低而浑厚
        pace: 中等
        pitch: 中低音
    dodo:
      display_name: 渡渡鸟
      tts:
        delivery: 郑重其事，爱用庄严口吻
        timbre: 圆厚清楚
        pace: 稍慢
        pitch: 中低音
    eaglet:
      display_name: 小鹰
      tts:
        delivery: 年幼爽快，毫不客气
        timbre: 清脆明亮
        pace: 快
        pitch: 高音
    bird_1:
      display_name: 鸟儿甲
      tts:
        delivery: 活泼直率，发问时迫不及待
        timbre: 清亮轻盈
        pace: 较快
        pitch: 高音
    bird_2:
      display_name: 鸟儿乙
      tts:
        delivery: 认真热切，说话干脆
        timbre: 明亮圆润
        pace: 中快
        pitch: 中高音
    animal_1:
      display_name: 小兽甲
      tts:
        delivery: 朴实爽快，跟着伙伴热心应和
        timbre: 温厚清楚
        pace: 中等
        pitch: 中低音
    old_crab:
      display_name: 老螃蟹
      tts:
        delivery: 爱教训人，语重心长
        timbre: 沙哑温厚
        pace: 稍慢
        pitch: 低音
    young_crab:
      display_name: 小螃蟹
      tts:
        delivery: 不耐烦，回话干脆带刺
        timbre: 清亮略紧
        pace: 快
        pitch: 中高音
    magpie:
      display_name: 老喜鹊
      tts:
        delivery: 故作镇定，急着找借口离开
        timbre: 略尖而清楚
        pace: 中快
        pitch: 中高音
    canary:
      display_name: 金丝雀
      tts:
        delivery: 温柔护幼，受惊时微微发颤
        timbre: 轻细明亮
        pace: 中快
        pitch: 高音
  chapters:
    - id: ch01
      title: 党团赛跑和一条长尾巴
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 岸上聚着好古怪的一群。鸟儿的湿羽毛全耷拉着，兽儿的皮毛紧紧贴在身上。每一个都浑身滴水，又恼火，又难受。眼下最要紧的，当然是想办法把身子弄干。它们围在一起商量。才过了几分钟，爱丽丝竟很自然地跟大家熟络起来，好像彼此认识了一辈子。她还跟吸蜜鹦鹉争了好半天。最后，吸蜜鹦鹉闹起了别扭，只肯拿年纪压她。
        - id: ch01-b02
          speaker: lory
          text: 我比你年长，懂得自然比你多。
        - id: ch01-b03
          speaker: narrator
          text: 爱丽丝可不肯认。她非要先问清吸蜜鹦鹉到底多大，对方却坚决不说，这场争论也就没法继续了。最后，老鼠摆出很有威望的样子，招呼所有人坐下。大家马上围成一个大圈，老鼠就在正中央。
        - id: ch01-b04
          speaker: mouse
          text: 大家都坐好，听我讲！我马上就能让你们干透！都准备好了吗？咳！这是我知道的最干巴巴的东西。请各位安静！征服者威廉得到教皇支持，很快就使英格兰人臣服了。那些人正需要领袖，近来又早已习惯了篡位与征服。麦西亚伯爵埃德温和诺森布里亚伯爵莫卡……
        - id: ch01-b05
          speaker: narrator
          text: 爱丽丝焦急地盯着老鼠。她认定自己要是不赶快干透，一定会患上重感冒。老鼠用一本正经的腔调讲着那段干巴巴的历史，吸蜜鹦鹉忽然打了个寒战。
        - id: ch01-b06
          speaker: lory
          text: 呃，冷得我直发抖！
        - id: ch01-b07
          speaker: mouse
          text: 对不起，是你在说话吗？
        - id: ch01-b08
          speaker: lory
          text: 不是我！
        - id: ch01-b09
          speaker: mouse
          text: 我还以为是你。那我继续。埃德温和莫卡两位伯爵宣布拥护威廉。就连爱国的坎特伯雷大主教斯蒂甘德，也认为宜于……
        - id: ch01-b10
          speaker: duck
          text: 他认为宜于什么？
        - id: ch01-b11
          speaker: mouse
          text: 宜于此事。你当然知道“此事”是什么意思。
        - id: ch01-b12
          speaker: duck
          text: 我找到东西时，当然知道“此物”是什么。通常是青蛙，要不就是虫子。可那位大主教究竟找到了什么？
        - id: ch01-b13
          speaker: narrator
          text: 老鼠不理它，只管匆匆讲下去。
        - id: ch01-b14
          speaker: mouse
          text: 他认为应该陪同流亡者埃德加去见威廉，再把王冠献给他。威廉起初做事还算温和，可他手下的诺曼人骄横无礼……好了，亲爱的，听了这么干巴巴的一大段，你现在觉得怎么样？
        - id: ch01-b15
          speaker: alice
          text: 还是一样湿。这些话根本没把我弄干。
          emotion: sad
        - id: ch01-b16
          speaker: narrator
          text: 渡渡鸟听了，郑重地站起身来。
        - id: ch01-b17
          speaker: dodo
          text: 既然如此，我提议暂时休会，立即采用更加积极有效的措施……
        - id: ch01-b18
          speaker: eaglet
          text: 说人话！这些长词有一半我都听不懂。再说，我才不信你自己懂呢！
        - id: ch01-b19
          speaker: narrator
          text: 小鹰说完便低下头，想把笑容藏起来。好几只鸟却已经吱吱咯咯地笑出了声。渡渡鸟觉得受了冒犯，只好把那串长词换成简单的话。
        - id: ch01-b20
          speaker: dodo
          text: 我是说，想把身子弄干，最好的办法就是来一场党团赛跑。
        - id: ch01-b21
          speaker: alice
          text: 党团赛跑是什么？
        - id: ch01-b22
          speaker: narrator
          text: 爱丽丝其实并不怎么想知道。只是渡渡鸟停在那里，摆明了在等人接话，别人又都不开口。
        - id: ch01-b23
          speaker: dodo
          text: 最好的解释，就是直接做给你看。
        - id: ch01-b24
          speaker: narrator
          text: 也许哪一个冬日，你也想试试，那就听听渡渡鸟怎么安排。它先划出一条大致呈圆形的跑道，还特别说明，究竟是什么形状并不重要。接着，它让大家沿着跑道东一个、西一个地站好。这里没有谁来喊“一、二、三，跑”。谁高兴什么时候开跑，就什么时候开跑。谁想停下，也随时可以停下。这样一来，谁都瞧不出比赛究竟何时才算结束。大家乱纷纷地跑了大约半个钟头，身子终于全干透了。渡渡鸟忽然高声宣布比赛结束。所有人都气喘吁吁地围了上来，只想知道最要紧的那件事。
        - id: ch01-b25
          speakers: [bird_1, bird_2, animal_1]
          ensemble: chorus
          text: 可是谁赢了呢？
        - id: ch01-b26
          speaker: narrator
          text: 这个问题可把渡渡鸟难住了，非得大大思量一番才行。它把一根手指抵在额头上，摆出画像里莎士比亚常有的姿势，坐在那里想了很久。其他人全都一声不响地等着。过了好一阵，它终于有了答案。
        - id: ch01-b27
          speaker: dodo
          text: 人人都赢了，所以人人都该得奖。
        - id: ch01-b28
          speakers: [bird_1, bird_2, animal_1]
          ensemble: chorus
          text: 可奖品由谁来发？
        - id: ch01-b29
          speaker: dodo
          text: 当然是她。
        - id: ch01-b30
          speaker: narrator
          text: 渡渡鸟指向爱丽丝。大伙儿立刻把她团团围住。
        - id: ch01-b31
          speakers: [bird_1, bird_2, animal_1]
          ensemble: chorus
          text: 奖品！快发奖品！
        - id: ch01-b32
          speaker: narrator
          text: 大伙儿一边喊着奖品，一边乱纷纷地挤在爱丽丝身边。爱丽丝完全不知怎么办，简直急得没了主意。无奈之下，她伸手摸了摸口袋，竟掏出一整盒糖果。幸好刚才池里的咸水没有渗进盒里。她便把糖果当作奖品，一个一个分给大家。数目恰好，每一个伙伴都分到一颗，谁也不缺。
        - id: ch01-b33
          speaker: mouse
          text: 可她自己也该有奖品。
        - id: ch01-b34
          speaker: dodo
          text: 当然。你口袋里还有什么？
        - id: ch01-b35
          speaker: alice
          text: 只剩一枚顶针了。
          emotion: sad
        - id: ch01-b36
          speaker: dodo
          text: 把它交给我。
        - id: ch01-b37
          speaker: narrator
          text: 大家再次从四面八方围拢过来。渡渡鸟郑重其事地把顶针颁回给爱丽丝。
        - id: ch01-b38
          speaker: dodo
          text: 我们恭请你收下这枚精美的顶针。
        - id: ch01-b39
          speaker: narrator
          text: 这篇短短的演说刚结束，大家便齐声欢呼。爱丽丝觉得整件事荒唐透顶，可它们的神情全都那么严肃，她实在不敢发笑。她又想不出什么话可说，只好尽量摆出庄重的脸色，规规矩矩地鞠了一躬，再接下自己的顶针。接着该吃糖果了，这又惹出一阵喧嚷和混乱。大鸟抱怨一颗糖太小，根本尝不出味道。小鸟却被糖噎住了，只好让人拍拍后背。好不容易吃完后，它们又围成一圈坐下，央求老鼠再讲一些。
        - id: ch01-b40
          speaker: alice
          text: 你答应过，要把自己的身世讲给我听。还要告诉我，你为什么恨……猫和狗。
        - id: ch01-b41
          speaker: narrator
          text: 最后几个字，爱丽丝说得很轻，怕老鼠又生气。老鼠转向她，叹了一口气。
        - id: ch01-b42
          speaker: mouse
          text: 我的故事又长，又悲伤！
          emotion: sad
        - id: ch01-b43
          speaker: alice
          text: 你的尾巴确实很长，可为什么说它悲伤呢？
        - id: ch01-b44
          speaker: narrator
          text: 老鼠开始讲自己的故事，爱丽丝却一直盯着它那条又细又长的尾巴琢磨，满脑子只想着，尾巴为什么会悲伤。她根本没有用心听老鼠的话。于是，在她的想象里，那个故事也跟着尾巴一道弯弯曲曲地垂下来，越讲越细，最后几乎收成了一个尖儿。
        - id: ch01-b45
          speaker: mouse
          text: 恶狗遇见小老鼠，在屋里把它拦住。它说，咱俩一同上法庭，我要告你这只老鼠。你不许推托，也不许躲，这场官司非打不可，因为今天一大早，我实在闲得没事做。小老鼠便对恶狗说，亲爱的先生，没有陪审团，也没有法官，打起官司只会白费口舌。那只狡猾的老恶狗却回答，我来当法官，我也来当陪审团。整桩案子都由我审，我还要判你死罪！
        - id: ch01-b46
          speaker: mouse
          text: 你根本没听！你到底在想什么？
          emotion: angry
        - id: ch01-b47
          speaker: alice
          text: 请原谅。我想，你已经讲到第五个弯了吧？
        - id: ch01-b48
          speaker: mouse
          text: 才没有弯！
          emotion: angry
        - id: ch01-b49
          speaker: alice
          text: 没有弯？那就是有结了！快让我帮你把结解开吧！
        - id: ch01-b50
          speaker: mouse
          text: 我才不要！你尽说这种胡话来侮辱我！
          emotion: angry
        - id: ch01-b51
          speaker: alice
          text: 我不是故意的！可你也太容易生气了呀！
        - id: ch01-b52
          speaker: narrator
          text: 老鼠根本不接受她的解释，只从喉咙里发出一声低吼，起身便走。
        - id: ch01-b53
          speaker: alice
          text: 求你回来，把故事讲完吧！
        - id: ch01-b54
          speakers: [bird_1, bird_2, animal_1]
          ensemble: chorus
          text: 是啊，求你讲完吧！
        - id: ch01-b55
          speaker: narrator
          text: 老鼠烦躁地摇着头，一句也不答。大家越是央求，它反而走得越快，最后完全看不见了。
        - id: ch01-b56
          speaker: lory
          text: 真可惜，它不肯留下来！
        - id: ch01-b57
          speaker: old_crab
          text: 唉，亲爱的，你可要记住这个教训。永远别乱发脾气！
        - id: ch01-b58
          speaker: young_crab
          text: 妈，闭嘴吧！就连牡蛎碰上你，也会给磨得没了耐性！
          emotion: angry
        - id: ch01-b59
          speaker: alice
          text: 真希望我家的黛娜在这儿！它马上就能把老鼠捉回来！
        - id: ch01-b60
          speaker: lory
          text: 恕我冒昧问一句，黛娜是谁？
        - id: ch01-b61
          speaker: alice
          text: 黛娜是我家的猫。你根本想不到，它捉老鼠有多厉害！我真希望你能看看它追鸟。它一见到小鸟，马上就会把鸟吃掉！
        - id: ch01-b62
          speaker: narrator
          text: 爱丽丝说得兴高采烈，因为无论什么时候，只要讲起自己的宠物，她总有说不完的话。可这番话在伙伴们中间立刻引起了一场非同小可的骚动。有些鸟一听黛娜既会捉老鼠又会吃小鸟，马上匆匆离开。老喜鹊仔仔细细地把自己裹严实，急着找了个理由回家。
        - id: ch01-b63
          speaker: magpie
          text: 我确实得回家了。夜里的风对我的嗓子不好。
        - id: ch01-b64
          speaker: canary
          text: 孩子们，快走吧！你们早就该上床睡觉了！
          emotion: fearful
        - id: ch01-b65
          speaker: narrator
          text: 其他鸟兽也找出各式各样的借口，一个接一个地走了。才过了没多久，岸上便只剩爱丽丝孤零零一个人。
        - id: ch01-b66
          speaker: alice
          text: 真希望我刚才没有提黛娜。这里好像谁都不喜欢它，可我敢肯定，它是世上最好的猫。哎呀，我亲爱的黛娜！不知道我还能不能再见到你！
          emotion: sad
        - id: ch01-b67
          speaker: narrator
          text: 说到这里，可怜的爱丽丝又哭了。刚才还围着她的一大群伙伴全走光了，岸边一下子变得空空荡荡。她觉得又孤单，又沮丧，心里难受极了。没过多久，远处再次传来一阵轻轻的脚步声。她立刻抬起头，急切地望过去，心里还存着一半希望。也许老鼠改变了主意，正赶回来把那个没有讲完的故事继续讲下去。
