audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带着一本正经的幽默
        timbre: 温暖清亮
        pace: 舒展而富有变化
        pitch: 中音
    alice:
      display_name: 爱丽丝
      tts:
        delivery: 好奇伶俐，想到什么就自然说出来
        timbre: 清脆稚嫩
        pace: 轻快，思索时稍慢
        pitch: 中高音
    two:
      display_name: 园丁二
      tts:
        delivery: 谨小慎微，对权贵格外恭敬
        timbre: 朴实清楚
        pace: 中等，害怕时稍快
        pitch: 中音
    five:
      display_name: 园丁五
      tts:
        delivery: 爱抱怨又嘴快，紧张时脱口而出
        timbre: 略哑而清晰
        pace: 中快
        pitch: 中音
    seven:
      display_name: 园丁七
      tts:
        delivery: 好争辩，受了委屈便立刻反驳
        timbre: 明亮偏紧
        pace: 中快
        pitch: 中高音
    queen_of_hearts:
      display_name: 红心王后
      tts:
        delivery: 暴躁专横，命令像吼叫
        timbre: 尖厉响亮
        pace: 急促有力
        pitch: 高音
    king_of_hearts:
      display_name: 红心国王
      tts:
        delivery: 胆怯又爱摆威严，遇事急着讲道理
        timbre: 偏细而清楚
        pace: 中等
        pitch: 中高音
    white_rabbit:
      display_name: 白兔
      tts:
        delivery: 匆忙焦急，说话短促
        timbre: 细而清楚
        pace: 快
        pitch: 高音
    cheshire_cat:
      display_name: 柴郡猫
      tts:
        delivery: 悠然机智，总像含着一丝笑意
        timbre: 柔和圆润
        pace: 从容，句间略作停顿
        pitch: 中音
    executioner:
      display_name: 刽子手
      tts:
        delivery: 固执认真，谈起规矩毫不含糊
        timbre: 粗粝低沉
        pace: 稍慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 第八章　王后的槌球场
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 花园入口边有一大棵玫瑰树。满树开的明明都是白花，三个园丁却忙着把它们涂红。爱丽丝觉得奇怪，便走近去看。她刚到跟前，就听见园丁二嚷了起来。
        - id: ch01-b02
          speaker: two
          text: 五，小心！别把颜料往我身上溅！
        - id: ch01-b03
          speaker: five
          text: 我有什么办法？是七撞了我的胳膊肘。
        - id: ch01-b04
          speaker: seven
          text: 好啊，五！出了错，你总能赖到别人身上！
        - id: ch01-b05
          speaker: five
          text: 你还好意思说我？昨天王后亲口说了，你犯的罪就该砍头！
        - id: ch01-b06
          speaker: two
          text: 他到底犯了什么罪？
        - id: ch01-b07
          speaker: seven
          text: 二，这事跟你没关系！
        - id: ch01-b08
          speaker: five
          text: 当然有关系！我告诉他。你把郁金香球根当成洋葱，送给厨娘了。
        - id: ch01-b09
          speaker: narrator
          text: 七气得扔下刷子，张口便说，天底下还有比这更不公道的事吗？可他忽然看见爱丽丝站在一旁，马上闭了嘴。另外两个也转过身，三个人一齐深深鞠躬。
        - id: ch01-b10
          speaker: alice
          text: 请问，你们为什么要把玫瑰涂红？
        - id: ch01-b11
          speaker: narrator
          text: 五和七都不肯回答，只盯着二。二压低嗓门，吞吞吐吐地解释起来。
        - id: ch01-b12
          speaker: two
          text: 小姐，是这么回事。这里本该种红玫瑰，我们却错种成白的。要让王后发现，我们三个都得掉脑袋。所以，我们想赶在她来以前，把这些花——
        - id: ch01-b13
          speaker: five
          text: 王后！王后来啦！
          emotion: fearful
        - id: ch01-b14
          speaker: narrator
          text: 五刚才还焦急地望着花园另一头。这一声喊出来，三个园丁立刻脸朝下扑倒。许多人的脚步声越来越近，爱丽丝急着看看王后是什么模样，赶紧回过头。最先走来的是十名扛着棍棒的士兵。他们和园丁长得一样，身子又长又扁，手脚都长在四角。后面十名大臣浑身画着方块，也像士兵那样两人一排。接下来是十个画着红心的王室孩子。小家伙们两两牵手，欢蹦乱跳地往前走。
        - id: ch01-b15
          speaker: narrator
          text: 宾客们接着出现，大多是国王和王后。白兔也在里面，神情紧张，说话又快又急，别人说什么它都陪笑，路过爱丽丝时却完全没看见她。再后面是红心杰克。他捧着一块深红色天鹅绒软垫，垫子上稳稳放着国王的王冠。整支盛大队伍走到最后，红心国王和红心王后才终于出现。
        - id: ch01-b16
          speaker: narrator
          text: 爱丽丝拿不准自己是不是也该像三个园丁那样脸朝下趴着。可她怎么也想不起，过去听人说过观看游行还有这种规矩。要是人人都趴在地上，根本什么也看不见，那游行还有什么用？她想过以后，仍旧站在原地，一动不动地等着队伍走来。
        - id: ch01-b17
          speaker: queen_of_hearts
          text: 这是谁？
        - id: ch01-b18
          speaker: narrator
          text: 队伍停在爱丽丝面前。王后问的是红心杰克，杰克只会鞠躬赔笑。
        - id: ch01-b19
          speaker: queen_of_hearts
          text: 蠢货！孩子，你叫什么名字？
          emotion: angry
        - id: ch01-b20
          speaker: alice
          text: 陛下，我叫爱丽丝。
        - id: ch01-b21
          speaker: narrator
          text: 爱丽丝答得十分客气，心里却想，他们说到底不过是一副纸牌，根本没什么好怕的。王后又指向趴在玫瑰树四周的园丁。三个人全都脸贴着地，背面的花纹又和其余纸牌一模一样。王后看不到他们的正面，根本认不出他们是园丁、士兵、大臣，还是自己的三个孩子。
        - id: ch01-b22
          speaker: queen_of_hearts
          text: 那三个又是谁？
        - id: ch01-b23
          speaker: alice
          text: 我怎么知道？这事又不归我管。
        - id: ch01-b24
          speaker: narrator
          text: 爱丽丝自己也没想到会这样大胆。王后的脸顿时涨得通红，像野兽一般瞪住她，接着尖叫起来。
        - id: ch01-b25
          speaker: queen_of_hearts
          text: 砍掉她的脑袋！砍——
          emotion: angry
        - id: ch01-b26
          speaker: alice
          text: 胡说！
          emotion: angry
        - id: ch01-b27
          speaker: narrator
          text: 爱丽丝这一声又响亮又坚决，王后竟然不说话了。国王轻轻把手搭在王后的胳膊上。
        - id: ch01-b28
          speaker: king_of_hearts
          text: 亲爱的，想一想吧。她只是个孩子呀！
          emotion: fearful
        - id: ch01-b29
          speaker: narrator
          text: 王后怒气冲冲地转开脸，叫红心杰克把园丁翻过来。杰克不敢用手，只小心翼翼地伸出一只脚，把他们一个个翻过来。
        - id: ch01-b30
          speaker: queen_of_hearts
          text: 都起来！
          emotion: angry
        - id: ch01-b31
          speaker: narrator
          text: 三个园丁立刻跳起来，对国王、王后、王室孩子和所有人轮流鞠躬。
        - id: ch01-b32
          speaker: queen_of_hearts
          text: 别鞠了！你们弄得我头晕。说，你们到底在这里做什么？
          emotion: angry
        - id: ch01-b33
          speaker: narrator
          text: 二单膝跪下，声音谦卑得不能再谦卑。
        - id: ch01-b34
          speaker: two
          text: 启禀陛下，我们正想办法——
          emotion: fearful
        - id: ch01-b35
          speaker: queen_of_hearts
          text: 我看见了！砍掉他们的脑袋！
          emotion: angry
        - id: ch01-b36
          speaker: narrator
          text: 王后已经看过树上的花。队伍继续前进，只留下三名士兵处决园丁。三个倒霉蛋赶紧跑到爱丽丝身边求救。
        - id: ch01-b37
          speaker: alice
          text: 他们休想砍你们的头！
        - id: ch01-b38
          speaker: narrator
          text: 她把三个园丁全都塞进旁边的一只大花盆。留下来的三名士兵在四周漫无目的地转了一两分钟，到处寻找该处决的人。实在找不到，他们只好安静地排好队，追上前面的队伍。
        - id: ch01-b39
          speaker: queen_of_hearts
          text: 他们的脑袋砍掉了吗？
        - id: ch01-b40
          speaker: narrator
          text: 士兵们远远喊着，脑袋已经没了，陛下。王后听了十分满意，马上问谁会不会打槌球。三名士兵谁也没有答话，全都转头看向爱丽丝。这下很明白了，王后问的正是她。
        - id: ch01-b41
          speaker: alice
          text: 会！
        - id: ch01-b42
          speaker: queen_of_hearts
          text: 那就跟上！
        - id: ch01-b43
          speaker: narrator
          text: 爱丽丝跟进队伍，心里不停猜测接下来还会出什么事。白兔恰好走在她旁边，一面不安地偷看她的脸，一面用胆怯的声音结结巴巴地说，今天天气很好。爱丽丝只简单答了一句，就立刻问起公爵夫人。
        - id: ch01-b44
          speaker: alice
          text: 是很好。公爵夫人到哪儿去了？
        - id: ch01-b45
          speaker: white_rabbit
          text: 嘘！轻点儿！
          emotion: fearful
        - id: ch01-b46
          speaker: narrator
          text: 白兔慌忙回头，踮起脚尖，把嘴凑到爱丽丝耳边。
        - id: ch01-b47
          speaker: white_rabbit
          text: 她被判死刑了。
          emotion: fearful
        - id: ch01-b48
          speaker: alice
          text: 为什么？
        - id: ch01-b49
          speaker: white_rabbit
          text: 你刚才说“真可惜”吗？
        - id: ch01-b50
          speaker: alice
          text: 我没说，而且也不觉得可惜。我问的是，她为什么被判死刑？
        - id: ch01-b51
          speaker: white_rabbit
          text: 她打了王后一耳光——
        - id: ch01-b52
          speaker: narrator
          text: 爱丽丝听说公爵夫人打了王后一耳光，忍不住轻轻笑出了声。白兔吓坏了，急忙压低声音叫她安静，免得被王后听见。它接着解释，公爵夫人来得有点晚，王后刚说了句什么，雷鸣般的吼声就盖过了一切。
        - id: ch01-b53
          speaker: queen_of_hearts
          text: 各就各位！
          emotion: angry
        - id: ch01-b54
          speaker: narrator
          text: 所有人朝四面八方乱跑，彼此撞得东倒西歪。一两分钟后，他们总算各自站好，比赛开始了。爱丽丝从没见过这样的槌球场。地面没有一处平整，到处都是土埂和沟槽。球是一只只活刺猬，球槌是一只只活火烈鸟。士兵还得把身子对折，双手双脚一起撑在地上，充当一道道拱门。
        - id: ch01-b55
          speaker: narrator
          text: 爱丽丝一开始最头疼的，就是怎样管住手里的火烈鸟。把它的身子舒舒服服地夹在腋下还算容易，两条长腿就那么垂着。可她每次刚把它的长脖子拉直，正要用它的脑袋去打刺猬，它偏偏要扭过头，用困惑透顶的神情望着她。爱丽丝每次都被逗得放声大笑。等她好不容易按下鸟头，准备重新击球，刺猬又舒展开蜷着的身子，已经开始往远处爬了。
        - id: ch01-b56
          speaker: narrator
          text: 事情还不止这些。她想把刺猬打到哪里，哪里通常就挡着土埂或沟槽。充当拱门的士兵也总是自己站起来，走到球场别处。爱丽丝很快认定，这比赛实在难打。更糟的是，选手们谁也不等轮次，全都一齐下手。他们从头到尾争吵不休，还互相抢夺刺猬。王后没过多久就大发雷霆，跺着脚四处走，差不多每隔一分钟都要喊一次，砍掉他的脑袋，或是砍掉她的脑袋。
        - id: ch01-b57
          speaker: narrator
          text: 爱丽丝越来越不安。她虽然还没和王后争吵，可谁知道下一刻会不会吵起来？真闹起来，她又该怎么办？这里的人这样喜欢砍脑袋，居然还有活人留下，才叫奇怪。她四处寻找逃走的路，心里盘算能不能不被人看见，悄悄溜掉。就在这时，空中出现了一个古怪的东西。起初她完全看不懂那是什么，盯着看了一两分钟，才认出了那张笑脸。
        - id: ch01-b58
          speaker: alice
          text: 是柴郡猫。总算有人能听我说说话了。
        - id: ch01-b59
          speaker: cheshire_cat
          text: 你打得怎么样？
        - id: ch01-b60
          speaker: narrator
          text: 猫的嘴才刚出现，已经足够开口，就问起比赛。爱丽丝耐心等到它的眼睛也露出来，才向它点点头。她想，耳朵还没长出来，现在说话也没有用，至少得先有一只耳朵。又过了一分钟，整颗猫头终于出现了。爱丽丝这才放下火烈鸟，把比赛从头讲给它听。总算有人愿意听她说话，她心里高兴极了。猫似乎认为显出一颗头已经完全够用，便再也没有露出身子的其他部分。
        - id: ch01-b61
          speaker: alice
          text: 他们打得一点也不公平，还吵个不停，害得人连自己说话都听不清。这里好像没有规矩。就算有，也没人照着做。最乱的是，所有东西都是活的。我下一道拱门跑到了球场另一头。刚才我正要用自己的刺猬撞王后的那只，它一看见我的球过来，居然先逃了！
        - id: ch01-b62
          speaker: cheshire_cat
          text: 那你喜欢王后吗？
        - id: ch01-b63
          speaker: alice
          text: 一点也不喜欢。她实在太——
        - id: ch01-b64
          speaker: narrator
          text: 爱丽丝突然看见王后就站在身后听着，马上改了口。
        - id: ch01-b65
          speaker: alice
          text: 太有希望获胜了！这场比赛好像都不用打完啦。
        - id: ch01-b66
          speaker: narrator
          text: 王后听见这句话，满意地笑了笑，继续往前走，并没有追问爱丽丝刚才想说什么。国王却来到爱丽丝面前，带着满脸好奇，仔细打量悬在空中的那颗猫头。
        - id: ch01-b67
          speaker: king_of_hearts
          text: 你在和谁说话？
        - id: ch01-b68
          speaker: alice
          text: 这是我的朋友，柴郡猫。请允许我替您介绍。
        - id: ch01-b69
          speaker: king_of_hearts
          text: 我不喜欢它这副模样。不过，它要是愿意，可以亲吻我的手。
        - id: ch01-b70
          speaker: cheshire_cat
          text: 我可不愿意。
        - id: ch01-b71
          speaker: king_of_hearts
          text: 不许无礼！也别那样盯着我！
        - id: ch01-b72
          speaker: narrator
          text: 国王说着，躲到了爱丽丝身后。
        - id: ch01-b73
          speaker: alice
          text: 猫也有权看国王。我在书里读过，只是忘了是哪一本。
        - id: ch01-b74
          speaker: king_of_hearts
          text: 不管怎样，必须把它赶走。亲爱的，请你来处理这只猫！
        - id: ch01-b75
          speaker: narrator
          text: 王后不论碰到多大或多小的难题，都只有同一个办法。她连头也没回。
        - id: ch01-b76
          speaker: queen_of_hearts
          text: 砍掉它的脑袋！
          emotion: angry
        - id: ch01-b77
          speaker: king_of_hearts
          text: 我亲自去找刽子手！
        - id: ch01-b78
          speaker: narrator
          text: 国王兴冲冲地跑去找人了。爱丽丝听见王后还在远处愤怒地尖叫，便回去看看比赛进行得怎样。她已经听到王后判了三个选手死刑，罪名是没有轮到自己就擅自动手。眼下的情形实在叫人不安。场面乱得可怕，爱丽丝从来弄不清到底是不是轮到自己，只好先去寻找自己的刺猬。
        - id: ch01-b79
          speaker: narrator
          text: 她的刺猬正在和另一只打架。爱丽丝觉得机会再好不过，正好可以拿其中一只撞另一只。唯一的问题是，她的火烈鸟已经跑到花园另一头。她远远看见它无可奈何地扑腾着，想飞到一棵树上。等她终于捉住火烈鸟，把它带回来，两只刺猬早已打完架，全都不见了。不过，这一边的士兵拱门也全走光了，似乎没什么要紧。她把火烈鸟牢牢夹在腋下，免得它再次逃跑，然后回去找柴郡猫继续说话。
        - id: ch01-b80
          speaker: narrator
          text: 回到原处，爱丽丝吃惊地发现猫头周围已经聚起一大群人。刽子手、国王和王后正在为怎样砍掉它的脑袋激烈争论，三个人同时说个不停。其他人却全都沉默不语，一个个显得很不自在。爱丽丝刚一出现，争论的三个人便一齐请她裁决。他们又各自把自己的道理从头说了一遍。可三张嘴同时开合，她费了好大力气，也只能勉强弄明白他们各自在说什么。
        - id: ch01-b81
          speaker: executioner
          text: 没有身子，脑袋从哪儿砍下来？这种差事我从没干过。我活到这个年纪，可不打算现在开头。
        - id: ch01-b82
          speaker: king_of_hearts
          text: 只要有脑袋，就可以砍头。别再说这些胡话！
        - id: ch01-b83
          speaker: narrator
          text: 王后的道理最简单，也最吓人。要是不能在眨眼之间把问题解决，她就把在场的人一个不留，统统处死。正是这句话，让周围所有人的脸色都变得又严肃又紧张。爱丽丝听完三种说法，实在想不出别的办法。
        - id: ch01-b84
          speaker: alice
          text: 这只猫是公爵夫人的。你们最好问问她。
        - id: ch01-b85
          speaker: queen_of_hearts
          text: 她在监狱里。把她带来！
        - id: ch01-b86
          speaker: narrator
          text: 刽子手像离弦的箭一样冲了出去。他刚一离开，猫头便开始慢慢变淡。等他带着公爵夫人赶回来，那颗头已经彻底消失，连笑容也无影无踪。国王和刽子手顿时发了慌，跑上跑下，到处寻找那颗不存在的脑袋。其余人见这里没什么可看的了，只好回到球场，继续那场混乱的比赛。
