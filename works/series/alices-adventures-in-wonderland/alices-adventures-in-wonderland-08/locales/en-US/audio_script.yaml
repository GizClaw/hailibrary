  chapters:
    - id: ch01
      title: The Queen's Croquet-Ground
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Near the garden entrance stood a large rose tree. Its roses were white, and three gardeners were hard at work painting them red. Alice found that very strange, so she stepped closer to watch. Just as she reached them, one gardener spoke.
        - id: ch01-b02
          speaker: two
          text: Careful, Five! Stop splashing paint all over me!
        - id: ch01-b03
          speaker: five
          text: I couldn't help it. Seven bumped my arm.
        - id: ch01-b04
          speaker: narrator
          text: Five sounded thoroughly sulky. Seven looked up at once.
        - id: ch01-b05
          speaker: seven
          text: Of course, Five. You always blame somebody else!
        - id: ch01-b06
          speaker: five
          text: You shouldn't be talking! Yesterday I heard the Queen say you ought to lose your head!
        - id: ch01-b07
          speaker: two
          text: What did he do?
        - id: ch01-b08
          speaker: seven
          text: That's not your concern, Two!
        - id: ch01-b09
          speaker: five
          text: Yes, it is, and I'll tell him. Seven brought the cook tulip roots instead of onions.
        - id: ch01-b10
          speaker: narrator
          text: Seven threw down his brush.
        - id: ch01-b11
          speaker: seven
          text: Well! I've never heard anything so unfair—
          emotion: angry
        - id: ch01-b12
          speaker: narrator
          text: Then he caught sight of Alice and stopped. The other two turned to look, and all three gardeners bowed very low.
        - id: ch01-b13
          speaker: alice
          text: Could you please tell me why you're painting the roses?
        - id: ch01-b14
          speaker: narrator
          text: Alice asked a little timidly. Five and Seven kept quiet and looked at Two. He lowered his voice.
        - id: ch01-b15
          speaker: two
          text: Well, miss, this was supposed to be a red rose tree, but we planted a white one by mistake. If the Queen finds out, she'll have all our heads cut off. So we're doing everything we can before she gets here to—
          emotion: fearful
        - id: ch01-b16
          speaker: narrator
          text: Five had been staring anxiously across the garden. All at once, he called out.
        - id: ch01-b17
          speaker: five
          text: The Queen! The Queen!
          emotion: fearful
        - id: ch01-b18
          speaker: narrator
          text: The three gardeners dropped flat on their faces. Many footsteps came toward them, and Alice turned eagerly to see the Queen. Ten soldiers carrying clubs came first. Like the gardeners, they were flat and oblong, with hands and feet at their corners. Ten courtiers followed. They were decorated all over with diamonds, and they too walked two by two. Next came ten royal children, each one decorated with hearts. The little princes and princesses skipped merrily along, holding hands in pairs. Then came the guests, mostly kings and queens. Alice spotted the White Rabbit among them. He hurried along, talking nervously and smiling at everything anyone said. He passed Alice without noticing her. Behind him came the Knave of Hearts, carrying the King's crown on a crimson velvet cushion. At last, at the very end of this grand procession, came the King and Queen of Hearts.
        - id: ch01-b19
          speaker: narrator
          text: Alice wondered whether she ought to lie facedown like the three gardeners. But she could not remember ever hearing of that rule for processions. And what use would a procession be, she thought, if everyone had to lie down and couldn't see it go by? So she stayed right where she was, standing on her feet, and waited.
        - id: ch01-b20
          speaker: narrator
          text: When the procession reached Alice, everyone stopped and stared. The Queen spoke sharply to the Knave.
        - id: ch01-b21
          speaker: queen_of_hearts
          text: Who is this?
        - id: ch01-b22
          speaker: narrator
          text: The Knave only bowed and smiled.
        - id: ch01-b23
          speaker: queen_of_hearts
          text: Idiot! What's your name, child?
          emotion: angry
        - id: ch01-b24
          speaker: alice
          text: My name is Alice, Your Majesty.
        - id: ch01-b25
          speaker: narrator
          text: Alice answered very politely. To herself, though, she remembered that the King, the Queen, and all the others were only a pack of cards. She decided she did not need to be afraid of them.
        - id: ch01-b26
          speaker: queen_of_hearts
          text: And who are these?
        - id: ch01-b27
          speaker: narrator
          text: She pointed at the three gardeners lying around the rose tree. They were still facedown, and the patterns on their backs looked like every other card in the pack. The Queen could not tell whether they were gardeners, soldiers, courtiers, or even three of her own children.
        - id: ch01-b28
          speaker: alice
          text: How would I know? They have nothing to do with me.
        - id: ch01-b29
          speaker: narrator
          text: Alice was surprised by how brave her own answer sounded. The Queen's face turned crimson with fury. For a moment she fixed Alice with a glare like a wild animal. Then she screamed.
        - id: ch01-b30
          speaker: queen_of_hearts
          text: Off with her head! Off—
          emotion: angry
        - id: ch01-b31
          speaker: alice
          text: What nonsense!
        - id: ch01-b32
          speaker: narrator
          text: Alice said it loudly and firmly. The Queen fell silent. The King put a hand on her arm and spoke timidly.
        - id: ch01-b33
          speaker: king_of_hearts
          text: Think again, my dear. She's only a child.
        - id: ch01-b34
          speaker: narrator
          text: The Queen turned angrily away from him and addressed the Knave.
        - id: ch01-b35
          speaker: queen_of_hearts
          text: Turn them over!
          emotion: angry
        - id: ch01-b36
          speaker: narrator
          text: The Knave carefully turned the gardeners over with one foot.
        - id: ch01-b37
          speaker: queen_of_hearts
          text: Get up!
          emotion: angry
        - id: ch01-b38
          speaker: narrator
          text: All three gardeners sprang to their feet at once. Then they began bowing again and again, first to the King, then to the Queen, the royal children, and everyone else in sight.
        - id: ch01-b39
          speaker: queen_of_hearts
          text: Stop that! You're making me dizzy. Now, what have you been doing here?
          emotion: angry
        - id: ch01-b40
          speaker: narrator
          text: Two dropped to one knee and answered as humbly as he could.
        - id: ch01-b41
          speaker: two
          text: If it pleases Your Majesty, we were trying to—
          emotion: fearful
        - id: ch01-b42
          speaker: narrator
          text: The Queen had been inspecting the roses.
        - id: ch01-b43
          speaker: queen_of_hearts
          text: I see! Off with their heads!
          emotion: angry
        - id: ch01-b44
          speaker: narrator
          text: The procession moved on. Three soldiers stayed behind to carry out the sentence, and the terrified gardeners ran to Alice.
        - id: ch01-b45
          speaker: alice
          text: I won't let them cut off your heads!
        - id: ch01-b46
          speaker: narrator
          text: She hid all three gardeners inside a large flowerpot that stood nearby. The soldiers wandered around for a minute or two, searching for them. When they found no one, they quietly marched away after the procession.
        - id: ch01-b47
          speaker: queen_of_hearts
          text: Are their heads off?
        - id: ch01-b48
          speakers: [soldier_one, soldier_two, soldier_three]
          ensemble: chorus
          text: Their heads are gone, Your Majesty!
        - id: ch01-b49
          speaker: queen_of_hearts
          text: Good! Can you play croquet?
        - id: ch01-b50
          speaker: narrator
          text: The three soldiers did not answer. Instead, they turned and looked at Alice. The Queen had clearly meant the question for her.
        - id: ch01-b51
          speaker: alice
          text: Yes!
        - id: ch01-b52
          speaker: queen_of_hearts
          text: Then come along!
        - id: ch01-b53
          speaker: narrator
          text: Alice joined the procession, wondering what might happen next.
        - id: ch01-b54
          speaker: white_rabbit
          text: It's—it's a lovely day!
        - id: ch01-b55
          speaker: narrator
          text: A timid voice spoke beside her. Alice was walking next to the White Rabbit, who kept peeking anxiously into her face.
        - id: ch01-b56
          speaker: alice
          text: It is. Where's the Duchess?
        - id: ch01-b57
          speaker: white_rabbit
          text: Hush! Keep your voice down!
          emotion: fearful
        - id: ch01-b58
          speaker: narrator
          text: The Rabbit looked over his shoulder, rose on tiptoe, and whispered close to Alice's ear.
        - id: ch01-b59
          speaker: white_rabbit
          text: She's been sentenced to execution.
          emotion: fearful
        - id: ch01-b60
          speaker: alice
          text: What did she do?
        - id: ch01-b61
          speaker: white_rabbit
          text: Did you say, "What a pity"?
        - id: ch01-b62
          speaker: alice
          text: No. I don't think it's a pity at all. I asked what she did.
        - id: ch01-b63
          speaker: white_rabbit
          text: She boxed the Queen's ears—
        - id: ch01-b64
          speaker: narrator
          text: Alice let out a little scream of laughter.
        - id: ch01-b65
          speaker: white_rabbit
          text: Oh, hush! The Queen might hear you! The Duchess came late, you see, and the Queen said—
          emotion: fearful
        - id: ch01-b66
          speaker: queen_of_hearts
          text: Take your places!
          emotion: angry
        - id: ch01-b67
          speaker: narrator
          text: The Queen's voice thundered across the garden. Everyone ran in every direction. They bumped and tumbled into one another in the confusion. Somehow, after a minute or two, they all found their places and the game began.
        - id: ch01-b68
          speaker: narrator
          text: Alice had never seen a croquet ground like it. Ridges and furrows covered the ground. Live hedgehogs were the balls, and live flamingos were the mallets. The soldiers bent double and balanced on their hands and feet to form the arches.
        - id: ch01-b69
          speaker: narrator
          text: At first, Alice's greatest problem was controlling her flamingo. She managed to tuck its body comfortably under her arm, with its long legs hanging down. Then she would straighten its neck and get ready to strike the hedgehog with its head. But just at that moment, the flamingo would twist itself around and stare up into Alice's face. It looked so puzzled that she could not help bursting out laughing.
        - id: ch01-b70
          speaker: narrator
          text: When Alice finally got the flamingo's head down and tried again, she often found that the hedgehog had unrolled itself and was already crawling away. Even if it stayed put, there was usually a ridge or a furrow exactly where she wanted to send it. Meanwhile, the doubled-up soldiers who formed the arches kept getting to their feet and walking off to other parts of the ground. Alice soon decided this was a very difficult game indeed.
        - id: ch01-b71
          speaker: narrator
          text: No one waited for a turn. Every player swung at once. They argued without stopping and fought over which hedgehog belonged to whom. It did not take long for the Queen to fly into a furious passion. She stamped around the croquet ground, and about once every minute she ordered another head cut off.
        - id: ch01-b72
          speaker: queen_of_hearts
          text: Off with his head!
          emotion: angry
        - id: ch01-b73
          speaker: queen_of_hearts
          text: Off with her head!
          emotion: angry
        - id: ch01-b74
          speaker: narrator
          text: Alice grew more and more uneasy. It was true that she had not quarreled with the Queen yet, but it could happen at any moment. And if it did, what would become of her? These people were dreadfully fond of cutting off heads. Alice thought the real wonder was that anyone in the garden was still alive.
        - id: ch01-b75
          speaker: narrator
          text: Alice looked around for some way to escape. She wondered if she could slip away without anyone seeing her. While she searched, she noticed something very strange hanging in the air. It puzzled her at first. But after watching it for a minute or two, she recognized a grin.
        - id: ch01-b76
          speaker: alice
          text: It's the Cheshire Cat. At least now I'll have someone to talk to.
        - id: ch01-b77
          speaker: cheshire_cat
          text: How is the game going?
        - id: ch01-b78
          speaker: narrator
          text: The Cat spoke as soon as enough of its mouth had appeared. Alice waited until its eyes came into view, then nodded. She thought there was no use answering before its ears appeared, or at least one of them. A minute later, the whole head had come into sight. Nothing below the head appeared at all.
        - id: ch01-b79
          speaker: narrator
          text: Alice put her flamingo down and began telling the Cat all about the game. She was very glad to have someone who would listen. The Cat seemed to think there was enough of itself in sight already, because no more of its body appeared.
        - id: ch01-b80
          speaker: alice
          text: They don't play fairly at all. They argue so loudly that I can barely hear myself speak. I don't think they have any real rules. Or if they do, nobody pays attention to them. And since everything in the game is alive, nothing stays where it belongs. The arch I'm supposed to use next has walked all the way to the other end of the ground. A moment ago I was ready to hit the Queen's hedgehog with mine, but hers saw mine coming and ran away!
        - id: ch01-b81
          speaker: cheshire_cat
          text: What do you think of the Queen?
        - id: ch01-b82
          speaker: alice
          text: I can't stand her. She's so terribly—
        - id: ch01-b83
          speaker: narrator
          text: Then Alice noticed the Queen standing close behind her, listening.
        - id: ch01-b84
          speaker: alice
          text: —likely to win that there hardly seems any point in finishing.
        - id: ch01-b85
          speaker: narrator
          text: The Queen seemed satisfied with that answer. She smiled, then moved on without saying anything.
        - id: ch01-b86
          speaker: king_of_hearts
          text: Who are you talking to?
        - id: ch01-b87
          speaker: narrator
          text: The King came closer and studied the Cat's head with great curiosity.
        - id: ch01-b88
          speaker: alice
          text: This is a friend of mine, the Cheshire Cat. Let me introduce you.
        - id: ch01-b89
          speaker: king_of_hearts
          text: I don't care for its looks. Still, it may kiss my hand if it wishes.
        - id: ch01-b90
          speaker: cheshire_cat
          text: I'd prefer not to.
        - id: ch01-b91
          speaker: king_of_hearts
          text: Don't be rude! And stop looking at me that way!
          emotion: angry
        - id: ch01-b92
          speaker: narrator
          text: The King did not sound nearly as bold as his words. As he spoke, he moved around and took shelter behind Alice.
        - id: ch01-b93
          speaker: alice
          text: A cat is allowed to look at a king. I read that somewhere, though I can't remember where.
        - id: ch01-b94
          speaker: king_of_hearts
          text: Then this cat must be taken away. My dear, please have it removed!
        - id: ch01-b95
          speaker: narrator
          text: The Queen was passing by. She had the same answer for every problem, large or small. She did not even turn around.
        - id: ch01-b96
          speaker: queen_of_hearts
          text: Off with his head!
          emotion: angry
        - id: ch01-b97
          speaker: king_of_hearts
          text: I'll get the executioner myself!
        - id: ch01-b98
          speaker: narrator
          text: The King was eager to carry out the Queen's order. He hurried away to fetch the executioner himself.
        - id: ch01-b99
          speaker: narrator
          text: Alice decided she might as well see how the game was going. She could hear the Queen screaming with rage in the distance. Three players had already been sentenced to execution because they had missed their turns. Alice did not like the look of things at all. The game was so confused that she could never tell whether it was her own turn. Still, she went to search for her hedgehog.
        - id: ch01-b100
          speaker: narrator
          text: She found her hedgehog in the middle of a fight with another hedgehog. That seemed like an excellent chance to knock one of them with the other. There was just one problem. Alice's flamingo had gone all the way across the garden. She could see it there, making a helpless attempt to fly up into a tree.
        - id: ch01-b101
          speaker: narrator
          text: By the time Alice caught the flamingo and carried it back, the fight was over. Both hedgehogs had disappeared. Then again, Alice thought, that hardly mattered because all the arches had left this side of the ground too. She tucked the flamingo firmly under her arm so it could not escape again, then went back for a little more conversation with her friend.
        - id: ch01-b102
          speaker: narrator
          text: When Alice returned to the Cheshire Cat, she was surprised to find a large crowd gathered around it. The King, the Queen, and the executioner were in the middle of a dispute, and all three were talking at once. Everyone else stood completely silent and looked deeply uncomfortable.
        - id: ch01-b103
          speaker: narrator
          text: The moment Alice arrived, the executioner, the King, and the Queen all called on her to settle their argument. Each one repeated the whole case to her. But they all spoke at the same time, so it was very hard to make out exactly what any of them was saying.
        - id: ch01-b104
          speaker: executioner
          text: You can't cut off a head unless there's a body to cut it from. I've never been asked to do that before, and I'm not starting now, at my age.
        - id: ch01-b105
          speaker: king_of_hearts
          text: Anything with a head can be beheaded. Don't talk nonsense.
        - id: ch01-b106
          speaker: queen_of_hearts
          text: If this isn't settled at once, I'll have every one of you executed!
          emotion: angry
        - id: ch01-b107
          speaker: narrator
          text: The Queen's threat explained why the whole crowd looked so grave and anxious. Alice listened to all three arguments, but she could think of only one thing to say.
        - id: ch01-b108
          speaker: alice
          text: The Cat belongs to the Duchess. You should ask her what to do.
        - id: ch01-b109
          speaker: queen_of_hearts
          text: She's in prison. Bring her here!
        - id: ch01-b110
          speaker: narrator
          text: The executioner shot away like an arrow. The Cat's head began to fade as soon as he left. By the time he returned with the Duchess, it had vanished completely. The King and the executioner ran wildly up and down, searching everywhere for the missing head, while everyone else went back to the game.
