audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a playful touch
        timbre: clear and gently rounded
        pace: measured with lively turns
        pitch: medium
    alice:
      display_name: Alice
      tts:
        delivery: bright, curious, and candid
        timbre: clear and youthful
        pace: naturally quick with thoughtful pauses
        pitch: medium-high
    white_rabbit:
      display_name: White Rabbit
      tts:
        delivery: breathless, fussy, and hurried
        timbre: light and crisp
        pace: quick
        pitch: high
  chapters:
    - id: ch01
      title: By the Riverbank
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Alice was getting very tired of sitting beside her sister on the riverbank with nothing to do. Once or twice, she peeked into the book her sister was reading. There were no pictures in it, and nobody was talking.
        - id: ch01-b02
          speaker: alice
          text: What good is a book without pictures or conversations?
        - id: ch01-b03
          speaker: narrator
          text: The day was hot, and Alice felt sleepy and slow. She tried to decide whether making a daisy chain would be worth the trouble of standing up and picking the flowers. Just then, a White Rabbit with pink eyes ran close past her.
        - id: ch01-b04
          speaker: narrator
          text: A rabbit by itself did not seem so remarkable. Even when it spoke, Alice did not think much of it at the time. Only afterward did it occur to her that a talking rabbit should have made her wonder.
        - id: ch01-b05
          speaker: white_rabbit
          text: Oh dear! Oh dear! I'm going to be late!
        - id: ch01-b06
          speaker: narrator
          text: Later, Alice realized she should have been surprised. But in that moment, it all seemed perfectly natural. Then the Rabbit pulled a watch from its waistcoat pocket, looked at it, and hurried on.
        - id: ch01-b07
          speaker: narrator
          text: Alice sprang to her feet. She had never seen a rabbit with a waistcoat pocket, much less a watch to take from one. Burning with curiosity, she raced across the field after it. She arrived just in time to see it pop into a large rabbit hole beneath the hedge.
        - id: ch01-b08
          speaker: narrator
          text: A moment later, Alice went down after it. She never once stopped to wonder how she would get out again.
    - id: ch02
      title: Down, Down, Down
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The rabbit hole ran straight ahead like a tunnel. Then, without warning, it dropped sharply. Alice had no time to stop herself before she was falling down a very deep well.
        - id: ch02-b02
          speaker: narrator
          text: Either the well was terribly deep, or Alice was falling very slowly. She had plenty of time to look around and wonder what would happen next. First she tried to see what lay below and where she might land, but it was too dark to make out anything. Then she studied the walls. They were lined with cupboards and bookshelves, and here and there, maps and pictures hung from pegs.
        - id: ch02-b03
          speaker: narrator
          text: As she floated past one shelf, Alice took down a jar labeled Orange Marmalade. To her great disappointment, it was empty. She was afraid the jar might kill someone below if she dropped it, so she managed to place it in a cupboard as she fell past.
        - id: ch02-b04
          speaker: alice
          text: Well! After a fall like this, tumbling down the stairs won't bother me at all. Everyone at home will think I'm so brave. Why, I wouldn't say a word even if I fell from the top of the house!
        - id: ch02-b05
          speaker: narrator
          text: And that was probably true. Down, down, down she went. Would the fall ever end?
        - id: ch02-b06
          speaker: alice
          text: I wonder how many miles I've fallen already. I must be getting close to the center of the earth. Let me think. That would be about four thousand miles down.
        - id: ch02-b07
          speaker: narrator
          text: Alice had learned facts like that during her lessons. This was not a very useful time to show off what she knew, especially with no one there to hear her. Still, saying it aloud was good practice.
        - id: ch02-b08
          speaker: alice
          text: Yes, that distance sounds right. But what latitude or longitude have I reached?
        - id: ch02-b09
          speaker: narrator
          text: Alice did not know what latitude or longitude meant. She only thought they were fine, grand words to say. After a while, she began again.
        - id: ch02-b10
          speaker: alice
          text: What if I fall straight through the earth? It would be funny to come out where people walk with their heads pointing down. The Antipathies, I think.
        - id: ch02-b11
          speaker: narrator
          text: She was rather glad nobody heard that, because it did not sound like the right word.
        - id: ch02-b12
          speaker: alice
          text: Of course, I'll need to ask what country I'm in. Please, ma'am, is this New Zealand or Australia?
        - id: ch02-b13
          speaker: narrator
          text: Alice tried to curtsy as she spoke. Imagine trying to curtsy while falling through the air. Could you do it?
        - id: ch02-b14
          speaker: alice
          text: She'll think I'm such an ignorant little girl for asking. No, I mustn't ask. Maybe the country's name will be written somewhere.
        - id: ch02-b15
          speaker: narrator
          text: Down, down, down. There was nothing else to do, so soon Alice started talking again.
        - id: ch02-b16
          speaker: alice
          text: Dinah must miss me very much tonight. I hope they remember her saucer of milk at teatime. Oh, Dinah, dear, I wish you were down here with me! There probably aren't any mice in the air, but you could catch a bat. A bat is a lot like a mouse, you know. But do cats eat bats?
        - id: ch02-b17
          speaker: narrator
          text: Dinah was Alice's cat. By now, Alice was growing very sleepy. In a dreamy voice, she kept repeating the question.
        - id: ch02-b18
          speaker: alice
          text: Do cats eat bats? Do cats eat bats? Or do bats eat cats?
        - id: ch02-b19
          speaker: narrator
          text: Since she could not answer either question, it hardly mattered which way she asked it. Her eyes began to close. She dreamed that she was walking hand in hand with Dinah and questioning her very seriously.
        - id: ch02-b20
          speaker: alice
          text: Now, Dinah, tell me the truth. Have you ever eaten a bat?
        - id: ch02-b21
          speaker: narrator
          text: Suddenly, thump, thump! Alice landed on a heap of sticks and dry leaves. The long fall was over.
    - id: ch03
      title: The Hall of Locked Doors
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Alice was not hurt at all. She jumped to her feet and looked up, but everything above her was dark. Ahead lay another long passage, and the White Rabbit was still in sight, racing away. There was no time to lose. Alice flew after it like the wind.
        - id: ch03-b02
          speaker: white_rabbit
          text: Oh, my ears and whiskers! It's getting so late!
        - id: ch03-b03
          speaker: narrator
          text: Alice heard him say this as he turned a corner. She was almost on his heels. But when she rounded the corner herself, the Rabbit had vanished. She stood in a long, low hall, lit by a row of lamps hanging from the ceiling. There was no sign of where he had gone.
        - id: ch03-b04
          speaker: narrator
          text: Doors lined every side of the hall, and every one was locked. Alice went all the way down one side and all the way back up the other, trying every door as she went. None would open. Then she walked sadly through the middle of the hall, wondering how she would ever find her way out again.
        - id: ch03-b05
          speaker: narrator
          text: All at once, she found a little three-legged table made entirely of solid glass. A tiny golden key lay on top. Alice thought it must open one of the doors, but it did not. Some locks were too large, and the key was too small for the others.
        - id: ch03-b06
          speaker: narrator
          text: On her second trip around the hall, Alice noticed a low curtain she had missed before. Behind it was a little door, only about fifteen inches high. She put the golden key into its lock. To her delight, it fit.
    - id: ch04
      title: The Loveliest Garden
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Alice opened the little door. Beyond it was a narrow passage, not much bigger than a rat hole. She knelt and peered through. At the far end was the loveliest garden she had ever seen, filled with beds of bright flowers and cool fountains.
        - id: ch04-b02
          speaker: narrator
          text: How she longed to leave that dark hall and wander among the bright flower beds and cool fountains. The garden was right there before her, yet she could not even push her head through the doorway.
        - id: ch04-b03
          speaker: alice
          text: Even if my head did fit, it wouldn't help much without my shoulders. Oh, I wish I could fold myself up like a telescope! I think I could do it, if only I knew where to start.
        - id: ch04-b04
          speaker: narrator
          text: So many strange things had happened that Alice was beginning to believe almost nothing was truly impossible.
        - id: ch04-b05
          speaker: narrator
          text: There was no point waiting beside the door, so she returned to the glass table. She half hoped another key might be there. Or perhaps she would find a book of instructions for folding people up like telescopes.
        - id: ch04-b06
          speaker: narrator
          text: This time, a small bottle stood on the table. Alice was certain it had not been there before. A paper label was tied around its neck. In large, beautiful letters, it said, Drink Me.
        - id: ch04-b07
          speaker: narrator
          text: A label could say Drink Me, but sensible little Alice was not about to obey in a hurry.
        - id: ch04-b08
          speaker: alice
          text: No. First I'll check whether it says poison.
        - id: ch04-b09
          speaker: narrator
          text: Alice had read several pleasant little stories about children who were burned, eaten by wild animals, or met with other nasty accidents. All those troubles came because the children refused to remember the simple rules their friends had taught them. Hold a red-hot poker too long, and it will burn you. Cut your finger very deeply with a knife, and it will usually bleed. Most important of all, if you drink a great deal from a bottle marked Poison, sooner or later it will almost certainly make you ill. Alice had never forgotten that.
        - id: ch04-b10
          speaker: narrator
          text: This bottle did not say Poison, so Alice dared to taste it. It was delicious. Somehow, it tasted like cherry tart, custard, pineapple, roast turkey, toffee, and hot buttered toast, all mixed together. Before long, she had finished every drop.
    - id: ch05
      title: Alice Grows Small
      blocks:
        - id: ch05-b01
          speaker: alice
          text: What a strange feeling! I must be folding up like a telescope.
          emotion: surprised
        - id: ch05-b02
          speaker: narrator
          text: And that was exactly what was happening. Alice was now only ten inches tall. Her face lit up. At last, she was the right size to pass through the little door and enter the lovely garden.
        - id: ch05-b03
          speaker: narrator
          text: First, though, she waited a few minutes to see whether she would shrink any more. The thought made her a little nervous.
        - id: ch05-b04
          speaker: alice
          text: I might keep going until there's nothing left of me, like a candle going out. What would I be like then?
          emotion: fearful
        - id: ch05-b05
          speaker: narrator
          text: Alice tried to imagine what a candle flame looks like after the candle has been blown out. She could not remember ever seeing such a thing.
        - id: ch05-b06
          speaker: narrator
          text: After a while, nothing else happened, so she decided to enter the garden at once. But poor Alice had left the little golden key on the table. When she went back, she could not reach it.
        - id: ch05-b07
          speaker: narrator
          text: She could see the key clearly through the glass. She tried her hardest to climb one of the table legs, but it was much too slippery. At last, worn out from trying, she sat down and cried.
        - id: ch05-b08
          speaker: alice
          text: Come on, crying won't do any good. Stop it this minute!
          emotion: angry
        - id: ch05-b09
          speaker: narrator
          text: Alice often gave herself excellent advice, though she hardly ever followed it. Sometimes she scolded herself so fiercely that she brought fresh tears to her own eyes. Once, she had even tried to box her own ears. She had caught herself cheating in a game of croquet, and since she was playing the game against herself, she felt she deserved it. This curious child was very fond of pretending to be two different people.
        - id: ch05-b10
          speaker: alice
          text: But pretending to be two people is no use now. There's barely enough of me left to make one proper person!
        - id: ch05-b11
          speaker: narrator
          text: Soon Alice noticed a little glass box beneath the table. She opened it and found a very small cake. The words Eat Me were spelled across the top in currants.
        - id: ch05-b12
          speaker: alice
          text: All right, I'll eat it. If it makes me bigger, I can reach the key. If it makes me smaller, I can crawl under the door. Either way, I'll get into the garden, so I don't care which one happens.
        - id: ch05-b13
          speaker: narrator
          text: Alice ate a small bite. She held one hand on top of her head so she could feel which way she was growing.
        - id: ch05-b14
          speaker: alice
          text: Which way? Which way?
        - id: ch05-b15
          speaker: narrator
          text: To her surprise, she stayed exactly the same size. Of course, that is what usually happens when someone eats cake. But Alice had grown so used to expecting nothing but strange things that it now seemed dull and silly for life to go on in the ordinary way.
        - id: ch05-b16
          speaker: narrator
          text: So she went right on eating, and very soon, the whole cake was gone.
