audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带着一本正经的幽默
        timbre: 温暖清亮
        pace: 舒展而富有变化
        pitch: 中音
    alice:
      display_name: 爱丽丝
      tts:
        delivery: 好奇伶俐，想到什么就自然说出来
        timbre: 清脆稚嫩
        pace: 轻快，思索时稍慢
        pitch: 中高音
    white_rabbit:
      display_name: 白兔
      tts:
        delivery: 匆忙焦急，说话短促
        timbre: 细而清楚
        pace: 快
        pitch: 高音
  chapters:
    - id: ch01
      title: 白兔跑过河岸
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 爱丽丝挨着姐姐坐在河岸上，已经闲得不耐烦了。她探头看过一两次姐姐手里的书，可里面没有图画，也没有人物说话。
        - id: ch01-b02
          speaker: alice
          text: 一本书既没有图画，也没有对话，那还有什么意思呢？
        - id: ch01-b03
          speaker: narrator
          text: 天气热得她昏昏欲睡，脑子也转不快。她正盘算着，做一串雏菊花环虽然好玩，可值不值得特意站起来摘花。就在这时，一只粉红眼睛的白兔忽然从身边跑了过去。
        - id: ch01-b04
          speaker: white_rabbit
          text: 哎呀！哎呀！我要迟到了！
        - id: ch01-b05
          speaker: narrator
          text: 兔子跑过去，本来没有多稀奇。就连听见它开口说话，爱丽丝也没觉得特别反常。后来回想起来，她才明白自己当时本该吃惊。可紧接着，白兔真的从背心口袋里掏出一块表，看了一眼，又匆匆往前赶。爱丽丝一下跳了起来。她从没见过有背心口袋的兔子，更别说兔子还会从里面掏出手表了。好奇心一下烧了起来，她穿过田野追上去。幸好赶得正是时候，她亲眼看见白兔嗖地钻进树篱下的一个大洞。
        - id: ch01-b06
          speaker: narrator
          text: 爱丽丝立刻跟着钻了进去，根本没想以后要怎么出来。兔子洞先像隧道一样直直向前，随后突然向下折去。她连停下来的念头都还没生出来，人已经往一口深井里掉了。
    - id: ch02
      title: 漫长的坠落
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 不知是井太深，还是她落得太慢。一路往下时，爱丽丝有的是工夫四处张望，也有的是工夫猜接下来会怎样。她先朝脚下看，想知道自己会落到哪里，可下面漆黑一片，什么也看不见。井壁两边却排满橱柜和书架，钉子上还挂着地图和画片。她经过一层架子，顺手拿下一只写着“橘子酱”的罐子，满心期待地一看，里面竟然是空的。她不敢随手丢掉，怕砸死下面的人，只好在经过另一个橱柜时，想办法把罐子放了进去。
        - id: ch02-b02
          speaker: alice
          text: 摔过这么大一跤，以后从楼梯上滚下来，根本算不了什么！家里人准会觉得我勇敢极了。就算从屋顶上掉下来，我也不会提一个字！
        - id: ch02-b03
          speaker: narrator
          text: 这句话多半不假。爱丽丝就这样往下，往下，又往下。难道永远都落不到底吗？
        - id: ch02-b04
          speaker: alice
          text: 我到底掉了多少英里啦？现在应该快到地心了吧。让我想想，大概有四千英里深，我记得是这样。
        - id: ch02-b05
          speaker: narrator
          text: 爱丽丝在课堂上学过这类知识。眼下没人听，算不上卖弄学问的好机会，不过背一遍也算练习。
        - id: ch02-b06
          speaker: alice
          text: 对，差不多就是这么远。可我现在是在什么纬度，什么经度呢？
        - id: ch02-b07
          speaker: narrator
          text: 其实她根本不知道纬度和经度是什么，只觉得这两个词又长又气派。过了一会儿，她又想到了别的事。
        - id: ch02-b08
          speaker: alice
          text: 我会不会一直穿过地球，从另一头掉出去？要是那里的人全都头朝下走路，一定很好玩。我想，他们叫“反感人”吧。可是我总得问问那是什么国家。请问，太太，这里是新西兰，还是澳大利亚？
        - id: ch02-b09
          speaker: narrator
          text: 爱丽丝一边往下掉，一边还试着行了个屈膝礼。你能想象吗？换了你，办得到吗？这回她倒庆幸没有听众，因为“反感人”怎么听都不像正确的说法。其实，她想说的是住在地球另一边的人。
        - id: ch02-b10
          speaker: alice
          text: 人家听了准会觉得，我怎么连这种事都不知道。不行，我不能问。说不定什么地方会写着国名呢。
        - id: ch02-b11
          speaker: narrator
          text: 她还在往下，往下，往下。四周没有别的事可做，也没有人陪她说话，她很快又自己开口了。
        - id: ch02-b12
          speaker: alice
          text: 黛娜今晚一定会很想我！希望他们下午茶时记得给她一碟牛奶。亲爱的黛娜，真希望你也掉到这里来。空中恐怕没有老鼠，不过你可以捉蝙蝠，蝙蝠和老鼠很像。可是，猫吃蝙蝠吗？
        - id: ch02-b13
          speaker: narrator
          text: 爱丽丝越来越困，迷迷糊糊地反复念着“猫吃蝙蝠吗”，有时又颠倒成“蝙蝠吃猫吗”。反正两个问题她都答不出来，怎么说也没多大分别。她渐渐睡着了，梦见自己牵着黛娜散步。
        - id: ch02-b14
          speaker: alice
          text: 黛娜，你得老实告诉我，你究竟吃过蝙蝠没有？
        - id: ch02-b15
          speaker: narrator
          text: 就在这时，只听砰！砰！她落到一堆枯枝败叶上，漫长的坠落终于结束了。
    - id: ch03
      title: 门后的花园
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 爱丽丝一点儿也没受伤，马上跳了起来。抬头一看，头顶黑漆漆的。面前却有一条长通道，白兔还看得见，正沿着通道赶路。现在一刻也不能耽误。她像风一样追过去，刚好听见它在拐角处叫喊。
        - id: ch03-b02
          speaker: white_rabbit
          text: 哎呀我的耳朵和胡子，已经这么晚了！
        - id: ch03-b03
          speaker: narrator
          text: 爱丽丝明明紧跟在后面，可她转过拐角时，白兔已经不见了。她来到一间又长又矮的大厅，屋顶垂下一排灯，把四周照得通亮。大厅四面全是门，可没有一扇能打开。她沿一边走到底，又从另一边走回来，把每扇门都试过了，最后只好伤心地走在大厅中央，不知道怎样才能出去。
        - id: ch03-b04
          speaker: narrator
          text: 她忽然发现一张三条腿的玻璃小桌，整张桌子都由坚实的玻璃制成。桌上只放着一把金钥匙。她以为钥匙能开这里的某扇门，可不是锁太大，就是钥匙太小，一扇也不合适。第二次绕着大厅寻找时，她看见一幅刚才漏掉的低矮门帘。帘后藏着一扇小门，只有十五英寸高。那把金钥匙插进去，正好能开。她高兴极了。
        - id: ch03-b05
          speaker: narrator
          text: 门后是一条比老鼠洞大不了多少的小走道。爱丽丝跪下往里看，尽头竟是她见过的最美丽的花园。鲜艳的花坛，清凉的喷泉，都在那边。她多想离开昏暗的大厅，到花坛和喷泉之间走一走，可她连脑袋都伸不过那扇门，更别说把肩膀挤过去了。
        - id: ch03-b06
          speaker: alice
          text: 就算脑袋能过去，肩膀还留在这边，也没有用呀。要是我能像望远镜那样缩起来就好了！只要知道从哪儿开始，我想我一定会缩。
        - id: ch03-b07
          speaker: narrator
          text: 近来发生的事情一件比一件稀奇，爱丽丝已经渐渐觉得，世上真正办不到的事恐怕少得可怜。
    - id: ch04
      title: 瓶子上的纸标签
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 继续守着小门也没有用。爱丽丝回到桌边，心里还抱着一半希望，也许能再找到一把钥匙，就算没有，至少也该有一本说明书，教人怎样像望远镜一样缩小。这一次，桌上竟多出一个小瓶子。
        - id: ch04-b02
          speaker: alice
          text: 这个瓶子刚才明明不在这里。
        - id: ch04-b03
          speaker: narrator
          text: 瓶颈上系着纸标签，上面用漂亮的大字写着“喝我”。可标签叫她喝，她也不会马上照办。
        - id: ch04-b04
          speaker: alice
          text: 我得先看看，上面有没有写“有毒”。
        - id: ch04-b05
          speaker: narrator
          text: 聪明的小爱丽丝不肯冒冒失失。她读过不少有趣的故事。故事里的孩子让火烧伤了，让野兽吃掉了，或者碰上别的倒霉事，都是因为他们偏偏不记得朋友教过的简单规矩。烧红的火钳握久了会烫手，刀子在手指上割得太深，通常就会流血。还有，瓶子上要是写着“有毒”，喝下太多，迟早几乎一定会叫人不舒服。这些事她可从没有忘记。
        - id: ch04-b06
          speaker: narrator
          text: 不过，这个瓶子没有写“有毒”，爱丽丝便壮着胆子尝了一口。味道好极了，像把樱桃馅饼、蛋奶布丁、菠萝、烤火鸡、太妃糖和热腾腾的黄油吐司全混在一起。她越喝越喜欢，很快便喝得一滴不剩。
        - id: ch04-b07
          speaker: alice
          text: 这感觉真奇怪！我一定是在像望远镜一样缩小。
        - id: ch04-b08
          speaker: narrator
          text: 她果真像望远镜一样缩了起来，现在只有十英寸高。她总算变成了合适的大小，可以穿过小门，走进美丽的花园。想到这里，她脸上顿时有了光彩。不过她先等了几分钟，想看看自己会不会接着变小，心里也有点紧张。
        - id: ch04-b09
          speaker: alice
          text: 要是一直缩下去，说不定我会像蜡烛一样，彻底熄灭。那时候我会是什么样呢？
        - id: ch04-b10
          speaker: narrator
          text: 她努力想象，一根蜡烛吹灭以后，那点火焰究竟是什么模样，可她怎么也不记得自己见过这种东西。过了一阵，再没有什么变化，她便决定立刻去花园。
    - id: ch05
      title: 吃我
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 可怜的爱丽丝走到小门前，才想起金钥匙还留在桌上。她跑回去，却怎么也够不着。隔着玻璃，钥匙明明看得清清楚楚。她使出全身力气，想沿着一条桌腿爬上去，可桌腿太滑，一次也没成功。等她折腾得筋疲力尽，只好坐在地上哭了。
        - id: ch05-b02
          speaker: alice
          text: 好了，这样哭一点用也没有！我劝你现在就停下来！
        - id: ch05-b03
          speaker: narrator
          text: 爱丽丝常常给自己很好的忠告，却很少听从。有时她把自己骂得太凶，反倒骂出了眼泪。有一回，她独自跟自己玩槌球，竟然对自己耍了赖，事后甚至想扇自己的耳光。这个古怪的小姑娘特别爱假装自己是两个人。
        - id: ch05-b04
          speaker: alice
          text: 可我现在装成两个人也没用啦。我剩下的这点儿个头，连一个像样的人都快凑不出来了！
        - id: ch05-b05
          speaker: narrator
          text: 不久，她的目光落到桌子下面，那里放着一只小玻璃盒。她打开盒盖，发现里面装着一块很小的蛋糕，上面用葡萄干漂漂亮亮地嵌着“吃我”两个字。
        - id: ch05-b06
          speaker: alice
          text: 那我就吃掉它。要是我变大，就能够到钥匙。要是我变小，就能从门底下钻过去。不管变大还是变小，我总能进花园，所以哪一种都行！
        - id: ch05-b07
          speaker: narrator
          text: 她咬了一小口，把手按在头顶，急着感觉身体究竟朝哪边变化。
        - id: ch05-b08
          speaker: alice
          text: 哪边？哪边？
        - id: ch05-b09
          speaker: narrator
          text: 她满以为身体会立刻变化，结果自己的个头一点没变，实在叫她惊讶。说真的，人吃了蛋糕，通常正是这个结果。可爱丽丝已经习惯只等怪事发生。日子要是照平常的样子过下去，她反而觉得又乏味又无聊。
        - id: ch05-b10
          speaker: narrator
          text: 于是，她不再等待，认真地一口接一口吃起来，很快就把整块蛋糕吃光了。
