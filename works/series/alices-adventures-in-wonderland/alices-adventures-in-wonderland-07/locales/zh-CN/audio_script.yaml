audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带着一本正经的幽默
        timbre: 温暖清亮
        pace: 舒展而富有变化
        pitch: 中音
    alice:
      display_name: 爱丽丝
      tts:
        delivery: 好奇伶俐，想到什么就自然说出来
        timbre: 清脆稚嫩
        pace: 轻快，思索时稍慢
        pitch: 中高音
    march_hare:
      display_name: 三月兔
      tts:
        delivery: 热情得荒唐，抬杠时理直气壮
        timbre: 明亮略尖
        pace: 轻快跳脱
        pitch: 中高音
    hatter:
      display_name: 帽匠
      tts:
        delivery: 古怪机敏，刻薄话也说得一本正经
        timbre: 干脆清晰
        pace: 忽快忽慢
        pitch: 中音
    dormouse:
      display_name: 睡鼠
      tts:
        delivery: 困倦含混，被催促时偶尔急切
        timbre: 沙哑微弱
        pace: 缓慢拖沓
        pitch: 中高音
    queen_of_hearts:
      display_name: 红心王后
      tts:
        delivery: 暴躁专横，命令像吼叫
        timbre: 尖厉响亮
        pace: 急促有力
        pitch: 高音
  chapters:
    - id: ch01
      title: 第七章　疯狂茶会
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 屋前的树下摆着一张茶桌。三月兔和帽匠坐在桌边喝茶，睡鼠夹在他们中间，睡得正熟。那两个家伙拿它当靠垫，胳膊肘都压在它身上，还隔着它的脑袋聊天。爱丽丝看着这一幕，心想，睡鼠这样一定很不舒服。不过，它既然睡着了，大概也不会在意。
        - id: ch01-b02
          speaker: narrator
          text: 桌子明明很大，三个家伙却偏偏挤在一角。爱丽丝一走近，他们便一齐嚷起来。
        - id: ch01-b03
          speaker: march_hare
          text: 没位子！没位子！
        - id: ch01-b04
          speaker: alice
          text: 位子多得很！
          emotion: angry
        - id: ch01-b05
          speaker: narrator
          text: 爱丽丝气呼呼地走到桌子另一端，在一把大扶手椅里坐下。三月兔不但没有赶她，反而立刻换上一副殷勤的口气招呼她。
        - id: ch01-b06
          speaker: march_hare
          text: 来点葡萄酒吧。
        - id: ch01-b07
          speaker: narrator
          text: 爱丽丝把桌面看了个遍，只有茶，哪有什么酒。
        - id: ch01-b08
          speaker: alice
          text: 我怎么没看见葡萄酒？
        - id: ch01-b09
          speaker: march_hare
          text: 因为根本没有。
        - id: ch01-b10
          speaker: alice
          text: 没有还请我喝，你这样很没礼貌。
          emotion: angry
        - id: ch01-b11
          speaker: march_hare
          text: 没人请你，你就自己坐下，也不见得多有礼貌。
        - id: ch01-b12
          speaker: alice
          text: 我又不知道桌子是你的。这里摆了这么多茶具，明明能坐很多人。
        - id: ch01-b13
          speaker: narrator
          text: 帽匠好奇地盯了爱丽丝半天，终于开口了。
        - id: ch01-b14
          speaker: hatter
          text: 你的头发该剪啦。
        - id: ch01-b15
          speaker: alice
          text: 别对人家的长相说三道四。你应该学学这个道理，随便议论别人很失礼。
        - id: ch01-b16
          speaker: narrator
          text: 帽匠听得双眼圆睁，却没有道歉，只抛出一个问题。
        - id: ch01-b17
          speaker: hatter
          text: 乌鸦为什么像写字台？
        - id: ch01-b18
          speaker: narrator
          text: 爱丽丝一下来了精神。她心想，这下总算有点乐子了，真高兴他们开始猜谜语啦。她相信自己能猜到答案，于是把这话也说出了口。
        - id: ch01-b19
          speaker: alice
          text: 这个我想我能猜出来。
        - id: ch01-b20
          speaker: march_hare
          text: 你的意思是，你能找到谜底？
        - id: ch01-b21
          speaker: alice
          text: 就是这个意思。
        - id: ch01-b22
          speaker: march_hare
          text: 那你心里怎么想，就该怎么说。
        - id: ch01-b23
          speaker: alice
          text: 我就是这么说的呀。至少，我说的就是我想的。这不是一回事吗？
        - id: ch01-b24
          speaker: hatter
          text: 差得远呢！难道“我看见什么就吃什么”，跟“我吃什么就看见什么”也一样？
        - id: ch01-b25
          speaker: march_hare
          text: 难道“我有什么就喜欢什么”，跟“我喜欢什么就有什么”也一样？
        - id: ch01-b26
          speaker: dormouse
          text: 难道“我睡觉时呼吸”，跟“我呼吸时睡觉”也一样？
        - id: ch01-b27
          speaker: hatter
          text: 对你来说倒真一样。
        - id: ch01-b28
          speaker: narrator
          text: 这番话说完，大家忽然都没了声音。他们安安静静地坐了一分钟。爱丽丝趁机搜遍记忆，想找出乌鸦和写字台有什么相像，可她知道的实在不多。最后还是帽匠先开口。他从口袋里掏出一块表，神色不安地看了又看，不时摇几下，再贴到耳边听，随后转过来问爱丽丝今天是几号。
        - id: ch01-b29
          speaker: alice
          text: 四号。
        - id: ch01-b30
          speaker: hatter
          text: 慢了两天！我早就告诉过你，黄油会弄坏机芯！
          emotion: angry
        - id: ch01-b31
          speaker: march_hare
          text: 可我用的是最好的黄油。
        - id: ch01-b32
          speaker: hatter
          text: 黄油是好，可面包屑也掉进去了。你就不该拿切面包的刀往里抹。
        - id: ch01-b33
          speaker: narrator
          text: 三月兔接过表，愁眉苦脸地端详了一会儿。他忽然把整块表浸进自己的茶杯，捞出来以后又仔细看了一遍。可他想来想去，还是只会重复那句话，说自己用的确实是最好的黄油。爱丽丝一直好奇地越过他肩头，也把这块古怪的表看了个清楚。
        - id: ch01-b34
          speaker: alice
          text: 这表真怪。我还是第一次见到这样的表。它会告诉你今天是几号，却偏偏不告诉你现在几点钟。
        - id: ch01-b35
          speaker: hatter
          text: 它为什么非得报时？你的表会告诉你今年是哪一年吗？
        - id: ch01-b36
          speaker: alice
          text: 当然不会。因为好长一段时间里，年份都一样。
        - id: ch01-b37
          speaker: hatter
          text: 我的表也是这个道理。
        - id: ch01-b38
          speaker: narrator
          text: 爱丽丝听得一头雾水。帽匠说的每一个字明明都是英语，合在一起却没有半点意思。她想了又想，最后只能尽量客气地承认，自己实在没听明白。帽匠完全没有解释，反倒留意到睡鼠又睡着了。他拿起茶杯，把一点热茶倒在睡鼠鼻子上。睡鼠连眼睛都没睁，只是不耐烦地摇了摇头。
        - id: ch01-b39
          speaker: dormouse
          text: 当然，当然。我刚才也正要这样说。
        - id: ch01-b40
          speaker: hatter
          text: 那个谜语，你猜出来没有？
        - id: ch01-b41
          speaker: alice
          text: 没有，我认输了。谜底到底是什么？
        - id: ch01-b42
          speaker: hatter
          text: 我一点也不知道。
        - id: ch01-b43
          speaker: march_hare
          text: 我也不知道。
        - id: ch01-b44
          speaker: alice
          text: 有时间问没答案的谜语，还不如做点有用的事。这样太浪费时间了。
        - id: ch01-b45
          speaker: hatter
          text: 你要是像我一样熟悉时间先生，就不会说浪费“它”了。时间不是东西，是一位先生。
        - id: ch01-b46
          speaker: alice
          text: 我还是不懂。
        - id: ch01-b47
          speaker: hatter
          text: 当然不懂！我看你根本没和时间先生说过话。
        - id: ch01-b48
          speaker: alice
          text: 也许没有。不过我学音乐时，得打拍子。
        - id: ch01-b49
          speaker: hatter
          text: 原来如此！时间先生可经不起你打。你要跟他交上朋友，他就会照你的意思拨钟。假如早上九点刚要上课，你在他耳边说一句，表针眨眼就能转到一点半。该吃午饭啦！
        - id: ch01-b50
          speaker: march_hare
          text: 真希望现在就是一点半。
        - id: ch01-b51
          speaker: alice
          text: 那倒很好。可时间一下过去，我还不会饿呀。
        - id: ch01-b52
          speaker: hatter
          text: 开始也许不饿。可只要你愿意，就让它永远停在一点半。
        - id: ch01-b53
          speaker: alice
          text: 你就是这么办的？
        - id: ch01-b54
          speaker: narrator
          text: 帽匠听完，悲伤地摇了摇头。他可没办法让时间停在一点半。去年三月，他跟时间先生吵翻了，就在三月兔发疯以前。说到这里，他还拿茶匙指了指三月兔。那时红心王后正在举行一场盛大的音乐会，帽匠得登台唱一支歌。
        - id: ch01-b55
          speaker: hatter
          text: >-
            小蝙蝠呀亮晶晶，
            你在忙些什么事情？
            你听过这支歌吗？
        - id: ch01-b56
          speaker: alice
          text: 我听过一首有点像的。
        - id: ch01-b57
          speaker: hatter
          text: >-
            后面是这样的。
            高高飞过世界顶，
            像只茶盘挂天庭。
            小蝙蝠呀亮晶晶——
        - id: ch01-b58
          speaker: narrator
          text: 歌还没唱完，睡鼠忽然抖了抖身子，在梦里跟着唱起“亮晶晶”。它一遍又一遍地唱，怎么也没有停下来的意思。帽匠和三月兔只好动手掐它，它这才总算安静。帽匠接着说，那场音乐会上，自己连第一节都还没唱完，红心王后便猛地跳起来，冲着他大吼。
        - id: ch01-b59
          speaker: queen_of_hearts
          text: 他在糟蹋时间！砍掉他的脑袋！
          emotion: angry
        - id: ch01-b60
          speaker: alice
          text: 这也太凶残了！
          emotion: surprised
        - id: ch01-b61
          speaker: hatter
          text: 从那以后，时间先生再也不肯帮我。现在永远是六点钟。
          emotion: sad
        - id: ch01-b62
          speaker: narrator
          text: 爱丽丝脑子里忽然闪过一个念头。既然钟永远停在六点，也就永远是喝茶时间，难怪桌上放着这么多茶具。帽匠叹着气承认，中间根本没有空闲让他们洗杯盘。他们只能把手边的茶具用脏，再沿着桌子往前挪，换下一副接着用。
        - id: ch01-b63
          speaker: alice
          text: 可是，你们一直这样换下去，等绕回最开始的位子以后，到底又该怎么办呢？
        - id: ch01-b64
          speaker: march_hare
          text: 还是换个话题吧。我已经听腻了。让这位小姐给我们讲故事。
        - id: ch01-b65
          speaker: alice
          text: 可我恐怕不会讲。
        - id: ch01-b66
          speaker: narrator
          text: 三月兔和帽匠立刻替她作了决定，故事就交给睡鼠来讲。两人一齐大喊，要睡鼠快醒醒，还从左右两边同时掐它。睡鼠这才慢慢睁开眼睛，声音又沙哑又微弱，却坚持说自己一直醒着。
        - id: ch01-b67
          speaker: dormouse
          text: 我根本没睡。你们说的每个字，我都听见了。
        - id: ch01-b68
          speaker: march_hare
          text: 那就讲个故事！
        - id: ch01-b69
          speaker: alice
          text: 对，请讲吧。
        - id: ch01-b70
          speaker: hatter
          text: 快点儿，不然故事没讲完，你又睡着了。
        - id: ch01-b71
          speaker: dormouse
          text: 从前有三个小姐妹，叫埃尔茜、蕾茜和蒂莉。她们住在一口井底下——
        - id: ch01-b72
          speaker: alice
          text: 她们靠吃什么生活？
        - id: ch01-b73
          speaker: narrator
          text: 爱丽丝一向对吃什么、喝什么格外关心，所以故事才刚开头，她就忍不住插嘴。她想知道住在井底的三个小姐妹平常吃些什么。睡鼠没有马上回答，足足想了一两分钟，才说她们全靠糖浆生活。
        - id: ch01-b74
          speaker: alice
          text: 光吃糖浆可活不下去。她们会生病的。
        - id: ch01-b75
          speaker: dormouse
          text: 她们确实病了，还病得很重。
        - id: ch01-b76
          speaker: narrator
          text: 爱丽丝试着想象，每天住在井底，只靠糖浆过日子，会是个什么滋味。可这种生活实在太离奇，她怎么想也想不出来。于是，她接着追问三个小姐妹为什么要住在井底。睡鼠还没回答，三月兔却突然一本正经地劝她再喝点茶。
        - id: ch01-b77
          speaker: alice
          text: 我一口也没喝，怎么能再多喝一点？
        - id: ch01-b78
          speaker: hatter
          text: 你是不能少喝一点。比一口不喝多喝一点，当然容易。
        - id: ch01-b79
          speaker: alice
          text: 又没人问你。
        - id: ch01-b80
          speaker: hatter
          text: 现在是谁在说人家的不是？
        - id: ch01-b81
          speaker: narrator
          text: 爱丽丝被帽匠问住，一时想不出该回什么。她只好自己倒了茶，又取来面包黄油，转头把刚才的问题再问睡鼠一遍。三个小姐妹到底为什么住在井底呢？睡鼠又花了一两分钟思考，才说那是一口糖浆井。爱丽丝气冲冲地才说出“世上没有”，帽匠和三月兔就一齐嘘她，要她安静。
        - id: ch01-b82
          speaker: dormouse
          text: 你要是不能客气点儿，故事就由你自己讲完。
        - id: ch01-b83
          speaker: alice
          text: 别，请继续讲。我不再打断了。说不定真有那么一口井。
        - id: ch01-b84
          speaker: dormouse
          text: 什么叫说不定？当然有！那三个小姐妹呀，正在学画画——
        - id: ch01-b85
          speaker: alice
          text: 她们画什么？
        - id: ch01-b86
          speaker: dormouse
          text: 画糖浆。
        - id: ch01-b87
          speaker: hatter
          text: 我要换只干净杯子。大家往前挪一个位子。
        - id: ch01-b88
          speaker: narrator
          text: 帽匠说着就挪到下一个位子，睡鼠也跟着他挪。三月兔占了睡鼠原来的位置，爱丽丝则很不情愿地坐到三月兔的位置。这样一换，只有帽匠占了便宜。三月兔刚刚把牛奶罐打翻在自己的盘子里，爱丽丝眼前这副茶具比原来还糟。她不愿再惹睡鼠生气，便把语气放得格外小心，问小姐妹究竟从哪里画出糖浆来。
        - id: ch01-b89
          speaker: hatter
          text: 水井里能汲水，糖浆井里当然能汲糖浆。懂了吗，笨蛋？
        - id: ch01-b90
          speaker: alice
          text: 可她们明明是在井里面呀。
        - id: ch01-b91
          speaker: dormouse
          text: 对呀，陷得可深了。
        - id: ch01-b92
          speaker: narrator
          text: 这个回答让可怜的爱丽丝越听越糊涂。接下来好一阵，她索性不再插嘴，任凭睡鼠往下讲。睡鼠已经困得厉害，一边揉眼睛，一边打哈欠。它说三个小姐妹是在学画画，而且什么东西都画，只要那样东西的名字用 M 开头。
        - id: ch01-b93
          speaker: alice
          text: 为什么偏偏要用 M 开头？
        - id: ch01-b94
          speaker: march_hare
          text: 为什么不呢？
        - id: ch01-b95
          speaker: narrator
          text: 面对三月兔的反问，爱丽丝只好闭上嘴。睡鼠这时也合上了眼睛，声音越来越低，眼看就要重新睡过去。帽匠伸手掐了它一下，它发出一声短促的尖叫，猛地醒过来，又把刚才的话接了下去。
        - id: ch01-b96
          speaker: dormouse
          text: 用 M 开头的东西，有捕鼠夹、月亮、记忆，还有多少。人们不是会说“多少总有些相像”吗？可你见过谁把“多少”画出来？
        - id: ch01-b97
          speaker: alice
          text: 你这么一问，我想我没——
        - id: ch01-b98
          speaker: hatter
          text: 那你就别说话。
        - id: ch01-b99
          speaker: narrator
          text: 这句话实在无礼到了极点，爱丽丝再也忍受不了。她厌恶地站起身，转头离开茶桌。睡鼠立刻沉沉睡去，另外两个家伙对她离开也毫不在意。爱丽丝走出一段，又回头看了一两次，心里多少还盼着他们叫住她。可是没人开口。她最后一次回头时，只看见帽匠和三月兔正想把睡鼠塞进茶壶。
        - id: ch01-b100
          speaker: alice
          text: 我再也不去那里了！这是我一辈子参加过的最愚蠢的茶会！
          emotion: angry
        - id: ch01-b101
          speaker: narrator
          text: 爱丽丝一边说着再也不去那种茶会，一边在林子里仔细挑着能走的路前行。就在这时，她注意到一棵树上竟然装着一扇门，门后直接通进树干。她站住脚，越看越觉得这事古怪，转念又想，今天发生的每件事都古怪得很。既然如此，不如马上进去看看。于是她不再犹豫，推开那扇门，径直走进了树里。
        - id: ch01-b102
          speaker: narrator
          text: 门的另一边，竟然又是那条熟悉的长厅。爱丽丝发现自己正好站在玻璃小桌旁。这一次，她不愿再像先前那样受阻，打算把每一步都安排得更好些。
        - id: ch01-b103
          speaker: alice
          text: 这回我知道该怎么办了。
        - id: ch01-b104
          speaker: narrator
          text: 她先从玻璃桌上拿起小金钥匙，用它打开那扇通往花园的小门。接着，她取出一直放在口袋里的那块蘑菇，一点一点地啃。等自己的身高缩到大约一英尺，她才走进门后的狭窄过道。这一次，再没有什么挡住她。爱丽丝走到过道尽头，终于踏进那座美丽的花园，置身在鲜艳的花坛和清凉的喷泉之间。
