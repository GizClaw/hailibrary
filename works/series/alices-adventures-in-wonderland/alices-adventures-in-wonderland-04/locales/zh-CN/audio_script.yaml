audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带着一本正经的幽默
        timbre: 温暖清亮
        pace: 舒展而富有变化
        pitch: 中音
    alice:
      display_name: 爱丽丝
      tts:
        delivery: 好奇伶俐，想到什么就自然说出来
        timbre: 清脆稚嫩
        pace: 轻快，思索时稍慢
        pitch: 中高音
    white_rabbit:
      display_name: 白兔
      tts:
        delivery: 神经紧张又爱发号施令，着急时又快又冲
        timbre: 尖细清楚
        pace: 中快，慌乱时加快
        pitch: 高音
    pat:
      display_name: 帕特
      tts:
        delivery: 乡音浓重，老实迟疑，对主人恭恭敬敬
        timbre: 粗朴偏哑
        pace: 稍慢
        pitch: 中音
    bill:
      display_name: 小比尔
      tts:
        delivery: 胆小局促，受惊后虚弱慌张
        timbre: 细弱微颤
        pace: 中快，惊魂未定时断续
        pitch: 高音
    animal_1:
      display_name: 鸟兽甲
      tts:
        delivery: 机灵急切，说话干脆利落
        timbre: 清亮偏细
        pace: 快速
        pitch: 中高音
    animal_2:
      display_name: 鸟兽乙
      tts:
        delivery: 忙乱认真，语气直率
        timbre: 圆润清楚
        pace: 中快
        pitch: 中音
    animal_3:
      display_name: 鸟兽丙
      tts:
        delivery: 胆怯谨慎，着急时略显慌张
        timbre: 轻薄微颤
        pace: 稍快
        pitch: 高音
    animal_4:
      display_name: 鸟兽丁
      tts:
        delivery: 热心爽快，招呼同伴时响亮有力
        timbre: 略粗而明朗
        pace: 中快
        pitch: 中低音
  chapters:
    - id: ch01
      title: 兔子派小比尔进来
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 回来的正是白兔。它放慢脚步，一边走一边焦急地到处找，嘴里还不停地念叨。
        - id: ch01-b02
          speaker: white_rabbit
          text: 公爵夫人！公爵夫人！我的爪子呀，我的毛皮和胡须呀！她准会砍掉我的头，就像雪貂准是雪貂一样准！我到底把它们丢在哪儿了？
          emotion: fearful
        - id: ch01-b03
          speaker: narrator
          text: 爱丽丝马上猜到，它找的是那把扇子和那副白色小山羊皮手套。她很愿意帮忙，便跟着到处翻找，可怎么也看不见那两样东西。自从她游过那片泪水池，四周已经完全变了。玻璃桌、小门和那座大厅，全都消失得无影无踪。白兔很快发现了正在找东西的爱丽丝。
        - id: ch01-b04
          speaker: white_rabbit
          text: 玛丽·安，你怎么还在外面？立刻回家，把手套和扇子给我拿来！快！
          emotion: angry
        - id: ch01-b05
          speaker: narrator
          text: 爱丽丝吓了一跳，根本没顾上解释它认错了人，转身就朝白兔所指的方向跑。
        - id: ch01-b06
          speaker: alice
          text: 它竟把我当成了女仆。等它知道我是谁，准得吓一大跳！不过，找得到的话，我还是把扇子和手套带给它吧。
        - id: ch01-b07
          speaker: narrator
          text: 她跑到一幢小巧整洁的房子前。门上嵌着一块闪亮的铜牌，清清楚楚刻着“白兔先生”。爱丽丝顾不上敲门，直接闯进去，又匆匆跑上楼。她一路提心吊胆，生怕真正的玛丽·安突然出现，那样自己还没找到扇子和手套，就会被赶出门去。
        - id: ch01-b08
          speaker: alice
          text: 替一只兔子跑腿可真古怪！下次说不定就是黛娜差遣我了。它会说，爱丽丝小姐，马上过来，准备出去散步！我只好回答，保姆，我一会儿就来，可得先看住那只老鼠，别让它逃走。不过，要是黛娜真敢这样对人发号施令，家里肯定不会再让它住下去。
        - id: ch01-b09
          speaker: narrator
          text: 楼上有间收拾得整整齐齐的小屋，窗边摆着一张桌子。爱丽丝盼望找到的东西果然都在桌上，一把扇子，还有两三副小小的白色山羊皮手套。她拿起扇子和一副手套，刚要离开，眼睛又被梳妆镜旁的小瓶吸引住了。瓶上这次没有“喝我”的标签，她却照样拔掉瓶塞，送到嘴边。
        - id: ch01-b10
          speaker: alice
          text: 每次吃了或喝了什么，都会有有趣的事发生。让我看看这一瓶有什么用。最好能把我变大，我已经受够这么小的个子了！
        - id: ch01-b11
          speaker: narrator
          text: 这瓶东西确实让她长大了，而且快得出奇。还不到半瓶，她的头就抵住天花板，只能弯着脖子，免得颈骨折断。她赶紧把瓶子放下。
        - id: ch01-b12
          speaker: alice
          text: 够了，千万别再长了！我现在已经出不了门。早知道就不喝那么多啦！
          emotion: fearful
        - id: ch01-b13
          speaker: narrator
          text: 后悔也来不及了。爱丽丝继续往上长，很快只能跪在地上。再过一分钟，连跪的地方也没有了。她躺下来，一只胳膊肘抵着门，另一条胳膊护住头，可身子还在变大。最后，她只得把一条胳膊伸出窗户，再把一只脚塞进烟囱。
        - id: ch01-b14
          speaker: alice
          text: 我已经什么都做不了了。不管接下来发生什么，我到底会变成什么样呢？
          emotion: fearful
        - id: ch01-b15
          speaker: narrator
          text: 幸好小魔法瓶终于使完了全部力气，爱丽丝总算不再长了。可她的身子硬塞在小屋里，这个姿势实在难受。眼前又看不出半点能逃出去的希望，难怪她越来越不开心。
        - id: ch01-b16
          speaker: alice
          text: 家里舒服多了，不会总是忽大忽小，也不用让老鼠和兔子呼来喝去。我真有点后悔钻进兔子洞。可是，这种日子又确实很奇妙，你说是不是？我真想知道，自己究竟遇上了什么事。以前读童话，我总觉得那些事绝不会真的发生，现在我自己偏偏就在一个童话里！真该有人把我的事写成一本书，而且一定要写。等我长大了，就自己来写。可我现在已经长大了，至少这屋里再没地方让我继续长啦。
        - id: ch01-b17
          speaker: narrator
          text: 她又想到，自己会不会永远停在现在的年纪。如果真是这样，倒有一个好处，那就是永远不用变成老太太。可坏处也明摆着，她岂不是永远都得上课？爱丽丝可受不了这个念头。转念一想，她又站到另一边，责备起自己来。
        - id: ch01-b18
          speaker: alice
          text: 傻爱丽丝，你困在这里怎么上课？连你自己都快放不下了，课本更没有地方放！
        - id: ch01-b19
          speaker: narrator
          text: 爱丽丝一会儿替这边说，一会儿替那边答，就这样同自己聊了起来。几分钟后，屋外传来了声音。
        - id: ch01-b20
          speaker: white_rabbit
          text: 玛丽·安！马上把我的手套拿来！
          emotion: angry
        - id: ch01-b21
          speaker: narrator
          text: 楼梯上响起嗒嗒的轻快脚步声，白兔真的上来找她了。爱丽丝吓得全身发抖，连整幢房子也被震得摇晃。她早忘了自己现在足足比白兔大上千倍，完全没有理由怕它。白兔走到门边，使劲想把门推开。可门偏偏朝里开，爱丽丝的胳膊肘又死死顶在那里，它怎么推也推不动。
        - id: ch01-b22
          speaker: white_rabbit
          text: 门打不开，我绕到窗户那边进去。
        - id: ch01-b23
          speaker: alice
          text: 你休想进来！
        - id: ch01-b24
          speaker: narrator
          text: 爱丽丝等了一会儿，估摸白兔已经走到窗户正下方，突然摊开手掌，朝空中猛抓一把。她什么也没碰到，却听见一声短短的尖叫。紧接着，有东西摔了下去，玻璃也哗啦啦碎了一地。爱丽丝听着这些声音，猜白兔很可能跌进了种黄瓜的玻璃暖棚，或者什么差不多的地方。
        - id: ch01-b25
          speaker: white_rabbit
          text: 帕特！帕特！你在哪儿？
          emotion: angry
        - id: ch01-b26
          speaker: pat
          text: 老爷，我就在这儿呐，正忙着挖苹果呢！
        - id: ch01-b27
          speaker: white_rabbit
          text: 挖什么苹果！快过来，把我从这里弄出去！
          emotion: angry
        - id: ch01-b28
          speaker: narrator
          text: 外面又传来玻璃破碎的声音。白兔爬出来以后，立刻问帕特。
        - id: ch01-b29
          speaker: white_rabbit
          text: 你看，窗户里到底是什么？
        - id: ch01-b30
          speaker: pat
          text: 老爷，那准是一条胳——膊！
        - id: ch01-b31
          speaker: narrator
          text: 帕特带着怪腔，把“胳膊”两个字拖得长长的。
        - id: ch01-b32
          speaker: white_rabbit
          text: 胳膊？你这个呆鹅！哪有那么大的胳膊？整个窗户都让它塞住了！
        - id: ch01-b33
          speaker: pat
          text: 是塞得满满的，老爷。可它再大，也还是胳膊呀。
        - id: ch01-b34
          speaker: white_rabbit
          text: 反正它不该在那里。去把它弄走！
          emotion: angry
        - id: ch01-b35
          speaker: narrator
          text: 外面安静了很久。爱丽丝只能偶尔听见几句悄悄话。帕特一再说，老爷，他一点也不喜欢这件事，真的一点也不喜欢。白兔却骂他是胆小鬼，逼他照吩咐去做。爱丽丝再次摊开手掌，突然朝外猛抓一把。这回外面同时响起两声小小的尖叫，随后又有不少玻璃被撞碎了。
        - id: ch01-b36
          speaker: alice
          text: 这里到底有多少座黄瓜暖棚？它们还会想出什么办法？要是真能从窗口把我拖出去，那倒正好，我一点也不想待在这儿了！
        - id: ch01-b37
          speaker: narrator
          text: 她等了好一阵，终于听见小车轮滚来，还有一大群声音在外面吵成一团。
        - id: ch01-b38
          speaker: animal_1
          text: 另一架梯子在哪儿？
        - id: ch01-b39
          speaker: animal_2
          text: 我只需要带一架，另一架在比尔那里！
        - id: ch01-b40
          speaker: animal_3
          text: 比尔，小子，把它拿过来！
        - id: ch01-b41
          speaker: animal_4
          text: 把两架梯子搭在这个墙角。
        - id: ch01-b42
          speaker: animal_1
          text: 不对，先捆在一起，要不连一半高也够不到。
        - id: ch01-b43
          speaker: animal_2
          text: 哎呀，这样就能用了，别那么挑剔！
        - id: ch01-b44
          speaker: animal_3
          text: 比尔，抓住这根绳子。
        - id: ch01-b45
          speaker: animal_4
          text: 屋顶撑得住吗？
        - id: ch01-b46
          speaker: animal_1
          text: 当心那块松瓦！
        - id: ch01-b47
          speaker: animal_2
          text: 不好，它掉下来啦，下面的人快低头！
        - id: ch01-b48
          speaker: narrator
          text: 屋外轰隆一声巨响，众人又吵着追问是谁闯的祸。有人猜一定是比尔干的。接着，它们开始商量谁从烟囱下去，却一个推一个，谁也不肯往里钻。最后，白兔替大家作了决定。
        - id: ch01-b49
          speaker: white_rabbit
          text: 就让比尔去。比尔，主人命令你从烟囱下去！
        - id: ch01-b50
          speaker: alice
          text: 原来要让比尔下来。它们什么事都推给他，我可不愿意跟他换位置。烟道虽然窄，我应该还能踢上一脚。
        - id: ch01-b51
          speaker: narrator
          text: 爱丽丝把脚伸进烟囱，尽量往低处放。上方有只小动物抓抓蹭蹭地爬下来，她也猜不出是哪一种。等声音靠近，她认定那就是比尔，猛地踢出一脚。
        - id: ch01-b52
          speakers: [animal_1, animal_2, animal_3, animal_4]
          ensemble: chorus
          text: 比尔飞出去啦！
        - id: ch01-b53
          speaker: white_rabbit
          text: 篱笆边上的快接住他！
        - id: ch01-b54
          speaker: animal_1
          text: 托住他的头，
        - id: ch01-b55
          speaker: animal_2
          text: 拿白兰地来，
        - id: ch01-b56
          speaker: animal_3
          text: 别呛着他！
        - id: ch01-b57
          speaker: animal_4
          text: 老伙计，刚才出了什么事？快告诉我们！
        - id: ch01-b58
          speaker: narrator
          text: 白兔又叫篱笆边上的伙伴接住比尔。外面忽然安静下来，随后才乱成一团。大家忙着托住比尔的头，找来白兰地，又怕把他呛着，还七嘴八舌地追问他遇上了什么。闹了好一会儿，一个虚弱的尖嗓子才终于响起。爱丽丝听出那就是比尔。
        - id: ch01-b59
          speaker: bill
          text: 我也不知道发生了什么。谢谢，别再给我喝了，我已经好多了。可我慌得什么都说不清。我只知道，有个东西像盒子里的弹簧小人一样朝我冲过来，我就像火箭一样飞上了天！
          emotion: fearful
        - id: ch01-b60
          speakers: [animal_1, animal_2, animal_3, animal_4]
          ensemble: chorus
          text: 老伙计，你确实飞上去了！
        - id: ch01-b61
          speaker: white_rabbit
          text: 我们只好把房子烧掉！
          emotion: angry
        - id: ch01-b62
          speaker: alice
          text: 你们敢烧房子，我就叫黛娜来对付你们！
          emotion: angry
        - id: ch01-b63
          speaker: narrator
          text: 外面立刻静得一点声音也没有。爱丽丝等着它们的下一步，怎么猜也猜不出来。她心想，这群家伙只要稍微有点头脑，就该把屋顶整个掀开。过了一两分钟，外面终于又传来走动的声音。
        - id: ch01-b64
          speaker: white_rabbit
          text: 先推满满一独轮车过来，这些应该够用了。
        - id: ch01-b65
          speaker: alice
          text: 它说的是满满一车什么东西？
        - id: ch01-b66
          speaker: narrator
          text: 她没来得及多想，答案马上就来了。一阵小石子从窗口噼里啪啦地飞进屋里，在地板上蹦得到处都是，还有几颗直接砸中了爱丽丝的脸。
        - id: ch01-b67
          speaker: alice
          text: 你们最好别再扔了！
          emotion: angry
        - id: ch01-b68
          speaker: narrator
          text: 外面再次安静了。爱丽丝惊讶地发现，落在地板上的石子竟一个个变成了小蛋糕。她马上想到，吃下一块准会改变自己的大小。既然不可能变得更大，那就只能变小了。她吞下一块，果然立刻缩了起来。身子刚小到能穿过门，她便冲出房子。门外挤满了小动物和鸟儿。可怜的小蜥蜴比尔躺在中间，由两只豚鼠扶着。它们正从一个瓶子里倒出东西给他喝。大家一看见爱丽丝便全扑过来。她只得拼命奔跑，很快逃进茂密的树林，这才觉得安全。
        - id: ch01-b69
          speaker: alice
          text: 现在先让自己恢复原来的大小，再想办法走进那座美丽的花园。这样安排最好。
        - id: ch01-b70
          speaker: narrator
          text: 这计划听来又清楚又简单，几乎没有比它更好的安排了。唯一的问题是，爱丽丝连第一步该怎么做都不知道。她正焦急地从树木之间往远处细看，头顶忽然传来又短又尖的一声犬吠。她吓了一跳，连忙抬起头。
        - id: ch01-b71
          speaker: narrator
          text: 一只大得吓人的小狗正用圆眼睛望着她，还笨拙地伸出爪子来碰她。
        - id: ch01-b72
          speaker: alice
          text: 可怜的小家伙，过来呀！
        - id: ch01-b73
          speaker: narrator
          text: 爱丽丝努力吹着口哨哄它，心里却一直怕得要命。要是小狗正饿着，不管她说多少好话，它还是很可能一口把她吃掉。她自己也不知道该怎么办，慌乱中捡起一小截树枝，举到小狗面前。小狗顿时欢叫一声，四只脚同时跳离地面。它冲向树枝，装出要狠狠撕咬一番的样子。爱丽丝赶快躲到一株大蓟后面，以免被它踩扁。
        - id: ch01-b74
          speaker: narrator
          text: 她刚从大蓟另一边露头，小狗又扑向树枝，急得一头栽倒，翻了个跟头。爱丽丝觉得，跟这么大的小狗玩耍，简直像在逗一匹拉车的马。她随时都可能被踩在脚下，只能又绕着大蓟跑一圈。小狗接连朝树枝发起短短的冲锋，每回只往前跑一点，却要退回很远，还不停地发出粗哑的叫声。最后，它总算在远处坐下来，舌头长长地垂在嘴外，呼哧呼哧直喘气，两只圆圆的大眼睛也半闭上了。
        - id: ch01-b75
          speaker: narrator
          text: 爱丽丝看见小狗累得坐下，知道逃跑的好机会来了，立刻转身便跑。她一直跑到浑身没力气，连气也喘不上来，这才停下。小狗的叫声已经落在很远的地方，传到耳边只剩微弱的一点。她靠着一株毛茛休息，还摘下一片叶子给自己扇风。
        - id: ch01-b76
          speaker: alice
          text: 它其实真可爱。要是我的大小合适，我很想教它几样把戏。糟了，我差点忘记还得长大！该怎么做呢？多半要吃点或喝点什么，可到底该吃什么、喝什么？
        - id: ch01-b77
          speaker: narrator
          text: 这确实是最要紧的问题。爱丽丝看遍四周的花朵和一片片草叶，没有一样像是眼下该吃或该喝的东西。附近倒有一朵大蘑菇，长得跟她差不多高。她先弯腰瞧了瞧蘑菇底下，又仔细看过两边，还特意绕到后面找了一遍。既然四周都看过了，她便踮起脚尖，伸长身子，想看看蘑菇顶上有什么。
        - id: ch01-b78
          speaker: narrator
          text: 她刚从边缘探出头，就对上了一双眼睛。蘑菇顶上坐着一条蓝色的大毛毛虫。它双臂交叉，安静地抽着长水烟袋，既不理爱丽丝，也不在意周围的任何事情。
