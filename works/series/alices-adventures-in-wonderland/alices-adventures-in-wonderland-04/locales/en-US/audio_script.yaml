  chapters:
    - id: ch01
      title: The Rabbit Sends in a Little Bill
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The White Rabbit came trotting slowly back the way he had come. He looked anxiously from side to side, like someone who had lost something important. As he searched, Alice heard him muttering to himself.
        - id: ch01-b02
          speaker: white_rabbit
          text: The Duchess! Oh, my paws and whiskers! She'll have me executed, sure as ferrets are ferrets! Where could I have dropped them?
          emotion: fearful
        - id: ch01-b03
          speaker: narrator
          text: Alice immediately guessed that he meant the fan and the pair of white kid gloves. She was good-natured enough to begin hunting for them herself. But no matter where she looked, neither the fan nor the gloves could be seen. Everything around her seemed to have changed since her swim in the pool. The great hall had completely vanished, along with its glass table and little door.
        - id: ch01-b04
          speaker: narrator
          text: Soon the Rabbit spotted Alice searching nearby. He mistook her for someone else and snapped at her.
        - id: ch01-b05
          speaker: white_rabbit
          text: Mary Ann, why are you standing out here? Run home right now and bring me gloves and a fan. Hurry!
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: Alice was so frightened that she ran where he pointed without explaining his mistake.
        - id: ch01-b07
          speaker: alice
          text: He thinks I'm his housemaid. Won't he be surprised when he finds out who I am? Still, I'd better bring the fan and gloves, if I can find them.
        - id: ch01-b08
          speaker: narrator
          text: As Alice ran, she came to a neat little house. A bright brass plate on the front door had the name “W. Rabbit” engraved on it. She went straight in without knocking and hurried upstairs. The whole time, she worried that the real Mary Ann might find her and throw her out before she could locate the fan and gloves.
        - id: ch01-b09
          speaker: alice
          text: How strange, running errands for a rabbit! Next, Dinah will be ordering me around. “Miss Alice, come get ready for your walk!” And I'll say, “Just a minute, Nurse! I have to keep the mouse from getting out.” Though if Dinah started giving orders like that, I don't think they'd let her stay in the house.
        - id: ch01-b10
          speaker: narrator
          text: By then, Alice had found her way into a tidy little room. A table stood beside the window. Just as she had hoped, the fan lay on it with two or three pairs of tiny white kid gloves. Alice picked up the fan and one pair of gloves and was about to leave. Then a little bottle near the looking glass caught her eye. This time, there was no label saying “Drink Me.” That did not stop her. She pulled out the cork and put the bottle to her lips.
        - id: ch01-b11
          speaker: alice
          text: Something interesting always happens when I eat or drink anything here. I'll see what this bottle does. I hope it makes me big again. I'm tired of being so tiny!
        - id: ch01-b12
          speaker: narrator
          text: It did, much faster than Alice expected. Before she'd swallowed half, her head pressed against the ceiling. She had to bend down to keep from hurting her neck, and she quickly set the bottle aside.
        - id: ch01-b13
          speaker: alice
          text: That's enough! Please don't let me grow anymore. I already can't fit through the door. I wish I hadn't drunk so much!
        - id: ch01-b14
          speaker: narrator
          text: But wishing came too late. Alice went on growing and growing. Soon she had to kneel on the floor. Another minute passed, and there wasn't even enough space to kneel. She tried lying down instead, with one elbow pressed hard against the door and her other arm curled around her head. Still she grew. There was only one thing left to try. Alice pushed one arm out the window and put one foot up the chimney.
        - id: ch01-b15
          speaker: alice
          text: That's all I can do, no matter what happens. What will become of me?
          emotion: fearful
        - id: ch01-b16
          speaker: narrator
          text: Luckily for Alice, the little magic bottle had finally finished its work. She stopped growing. Even so, being folded into that tiny room was terribly uncomfortable. There seemed to be no possible way for her to get out again, so it was no wonder that she felt unhappy.
        - id: ch01-b17
          speaker: alice
          text: Life at home was much nicer. There, I wasn't always growing bigger and smaller, and I didn't have mice and rabbits ordering me around. I almost wish I'd never gone down that rabbit hole. And yet... this kind of life is very curious. What in the world could have happened to me? When I read fairy tales, I always thought those things never really happened. Now here I am, right in the middle of one! There ought to be a book written about me. There really ought. When I grow up, I'll write one myself. But wait, I'm grown up now. At least, there's no room to grow any more in this house.
          emotion: sad
        - id: ch01-b18
          speaker: alice
          text: Does that mean I'll never get older? It would be nice never to become an old woman. But then I'd always have lessons to learn. Oh, I wouldn't like that at all!
        - id: ch01-b19
          speaker: alice
          text: Silly Alice! How could you study in here? There's barely room for you, and none at all for lesson books.
        - id: ch01-b20
          speaker: narrator
          text: Alice kept arguing with herself, first taking one side and then the other. After a few minutes, a voice outside made her stop and listen.
        - id: ch01-b21
          speaker: white_rabbit
          text: Mary Ann! Bring me my gloves this instant!
          emotion: angry
        - id: ch01-b22
          speaker: narrator
          text: Little feet came pattering up the stairs. Alice knew the Rabbit was coming to find her, and she trembled so hard that the whole house shook. She forgot that she was now about a thousand times his size and had no reason to fear him.
        - id: ch01-b23
          speaker: narrator
          text: The Rabbit tried the door, but it opened inward, and Alice's elbow held it shut.
        - id: ch01-b24
          speaker: white_rabbit
          text: I'll go around and climb in through the window.
        - id: ch01-b25
          speaker: alice
          text: No, you won't!
        - id: ch01-b26
          speaker: narrator
          text: Alice waited until the sounds told her the Rabbit was directly below the window. Then she suddenly spread out her hand and grabbed at the air. Her fingers closed on nothing. But she heard a tiny shriek, then a fall, then the crash of breaking glass. From those sounds, she guessed that he might have fallen into a cucumber frame, or something like one.
        - id: ch01-b27
          speaker: white_rabbit
          text: Pat! Pat! Where are you?
          emotion: angry
        - id: ch01-b28
          speaker: pat
          text: Right here, sir! Digging for apples.
        - id: ch01-b29
          speaker: white_rabbit
          text: Digging for apples? Come over here and help me out of this!
          emotion: angry
        - id: ch01-b30
          speaker: narrator
          text: More glass broke outside. Then the Rabbit questioned Pat.
        - id: ch01-b31
          speaker: white_rabbit
          text: Now, Pat, tell me what's in that window.
        - id: ch01-b32
          speaker: pat
          text: Why, that's an arm, sir.
        - id: ch01-b33
          speaker: white_rabbit
          text: An arm, you goose? No arm is that big. It fills the whole window!
        - id: ch01-b34
          speaker: pat
          text: It surely does, sir, but it's an arm all the same.
        - id: ch01-b35
          speaker: white_rabbit
          text: Well, it has no business being there. Go take it away!
        - id: ch01-b36
          speaker: narrator
          text: A long silence followed. Alice could only catch a whisper now and then. Pat kept saying that he did not like the job at all, while the Rabbit ordered him to obey and called him a coward. At last, Alice heard them come close enough to try.
        - id: ch01-b37
          speaker: pat
          text: I don't like this, sir. Not one bit.
          emotion: fearful
        - id: ch01-b38
          speaker: white_rabbit
          text: Do as I say, you coward!
          emotion: angry
        - id: ch01-b39
          speaker: narrator
          text: Alice reached out again and made another grab. This time two little shrieks sounded, followed by more breaking glass.
        - id: ch01-b40
          speaker: alice
          text: How many cucumber frames can there be? What will they try next? If they want to pull me through the window, I wish they could. I certainly don't want to stay in here.
        - id: ch01-b41
          speaker: narrator
          text: Alice waited for some time and heard nothing else. At last, little cartwheels came rumbling toward the house. A great many voices arrived with them, all talking at once. Alice listened closely and managed to make out what they were saying.
        - id: ch01-b42
          speaker: animal_one
          text: Where's the other ladder?
        - id: ch01-b43
          speaker: animal_two
          text: I was only supposed to bring one. Bill has the other. Bill, bring it here!
        - id: ch01-b44
          speaker: animal_three
          text: Set them up at this corner. No, tie them together first. They aren't nearly tall enough.
        - id: ch01-b45
          speaker: animal_one
          text: They'll be fine. Don't fuss. Bill, grab this rope. Will the roof hold us?
        - id: ch01-b46
          speaker: animal_two
          text: Watch that loose slate! It's falling! Look out below!
        - id: ch01-b47
          speaker: narrator
          text: Something hit the ground with a loud crash.
        - id: ch01-b48
          speaker: animal_three
          text: Who did that? I think it was Bill. Now, who's going down the chimney?
        - id: ch01-b49
          speaker: animal_one
          text: Not me! You go.
        - id: ch01-b50
          speaker: animal_two
          text: I won't! Bill can do it.
        - id: ch01-b51
          speaker: animal_three
          text: Bill! The master says you're going down the chimney!
        - id: ch01-b52
          speaker: alice
          text: So Bill has to come down, does he? They make poor Bill do everything. I wouldn't trade places with him for anything. This fireplace is narrow, but I think I can kick a little.
        - id: ch01-b53
          speaker: narrator
          text: Alice pulled her foot as far down the chimney as she could. Soon, a little animal came scratching and scrambling just above her. She couldn't tell what kind it was.
        - id: ch01-b54
          speaker: alice
          text: That must be Bill.
        - id: ch01-b55
          speaker: narrator
          text: She gave one sharp kick and waited.
        - id: ch01-b56
          speakers: [animal_one, animal_two, animal_three]
          ensemble: chorus
          text: There goes Bill!
          emotion: surprised
        - id: ch01-b57
          speaker: white_rabbit
          text: Catch him, over by the hedge!
        - id: ch01-b58
          speaker: narrator
          text: Silence came first, then another burst of voices.
        - id: ch01-b59
          speaker: animal_one
          text: Hold his head up!
        - id: ch01-b60
          speaker: animal_two
          text: Bring the brandy. Don't choke him!
        - id: ch01-b61
          speaker: animal_three
          text: What happened, old fellow? Tell us!
        - id: ch01-b62
          speaker: narrator
          text: At last, Bill answered in a weak little squeak.
        - id: ch01-b63
          speaker: bill
          text: I hardly know. No more, thank you. I'm better now, but I'm too shaken to explain. Something shot at me like a jack-in-the-box, and up I flew like a skyrocket!
        - id: ch01-b64
          speakers: [animal_one, animal_two, animal_three]
          ensemble: chorus
          text: You certainly did, old fellow!
        - id: ch01-b65
          speaker: white_rabbit
          text: We'll have to burn the house down!
          emotion: angry
        - id: ch01-b66
          speaker: alice
          text: If you do, I'll send Dinah after you!
        - id: ch01-b67
          speaker: narrator
          text: Everyone outside fell completely silent.
        - id: ch01-b68
          speaker: alice
          text: What will they try now? If they had any sense, they'd take off the roof.
        - id: ch01-b69
          speaker: narrator
          text: A minute or two later, the creatures began moving again.
        - id: ch01-b70
          speaker: white_rabbit
          text: One wheelbarrow full should be enough to start.
        - id: ch01-b71
          speaker: alice
          text: A wheelbarrow full of what?
        - id: ch01-b72
          speaker: narrator
          text: Alice did not have to wonder for long. The very next moment, a shower of tiny pebbles came rattling in through the open window. They scattered across the crowded room, and several of them struck Alice right in the face.
        - id: ch01-b73
          speaker: alice
          text: I'll stop this. You'd better not do that again!
          emotion: angry
        - id: ch01-b74
          speaker: narrator
          text: Another dead silence followed. To Alice's surprise, the pebbles on the floor were changing into little cakes. Then she had an idea.
        - id: ch01-b75
          speaker: alice
          text: If I eat one, it has to change my size somehow. I can't possibly get any bigger, so I suppose it must make me smaller.
        - id: ch01-b76
          speaker: narrator
          text: Alice swallowed one of the little cakes. To her delight, she began shrinking right away. The moment she was small enough to fit through the door, she raced out of the house. A whole crowd of little animals and birds was waiting outside. Poor Bill the Lizard sat in the middle of them, held upright by two guinea pigs. They were giving him something from a bottle. As soon as Alice appeared, the entire crowd rushed at her. She ran as hard as she could and soon found herself safely hidden in a thick wood.
        - id: ch01-b77
          speaker: alice
          text: First, I need to get back to my proper size. Second, I have to find my way into that beautiful garden. Yes, that's the best plan.
        - id: ch01-b78
          speaker: narrator
          text: There was no doubt that it sounded like an excellent plan. Alice had arranged it all very neatly and simply in her mind. There was only one difficulty. She had not the smallest idea how to do either part of it. While she peered anxiously among the trees, a sharp little bark sounded just above her head. Alice looked up in a hurry.
        - id: ch01-b79
          speaker: narrator
          text: An enormous puppy stared down at her with big round eyes. It stretched out one paw and tried to touch her.
        - id: ch01-b80
          speaker: alice
          text: Poor little thing!
        - id: ch01-b81
          speaker: narrator
          text: Alice tried her best to whistle to the puppy in a gentle, coaxing way. But all the while, she was terribly frightened. What if the puppy was hungry? If it was, it might eat her up no matter how sweetly she spoke to it.
        - id: ch01-b82
          speaker: narrator
          text: Alice hardly knew what she was doing. She picked up a little piece of stick and held it toward the puppy. At once, the puppy jumped into the air with all four feet off the ground. It gave a delighted yelp, rushed at the stick, and made believe it was fighting with it. Alice dodged behind a great thistle to keep from being run over.
        - id: ch01-b83
          speaker: narrator
          text: The moment Alice appeared on the other side of the thistle, the puppy charged at the stick again. It was in such a hurry to catch it that it tumbled head over heels. Alice thought this was very much like trying to play with a cart horse. She expected to be trampled under its feet at any moment, so she dashed around the thistle again.
        - id: ch01-b84
          speaker: narrator
          text: Now the puppy began making one short charge after another. Each time, it ran only a little way forward, then backed up a long way. All the while, it barked in a rough, hoarse voice. At last, the game tired it out. It sat down a good distance away, panting hard. Its tongue hung out of its mouth, and its great eyes were half closed.
        - id: ch01-b85
          speaker: narrator
          text: Alice saw that this was a good chance to escape. She set off at once and ran without stopping. She kept going until she was completely tired and out of breath, and until the puppy's bark sounded faint in the distance behind her.
        - id: ch01-b86
          speaker: alice
          text: Still, what a sweet little puppy! I would have loved to teach it tricks, if only I'd been the right size. Oh, dear! I almost forgot that I have to grow again. How can I do it? I suppose I need to eat or drink something. The real question is, what?
        - id: ch01-b87
          speaker: narrator
          text: Alice leaned against a buttercup to catch her breath and fanned herself with one of its leaves. The great question really was what she should eat or drink. She looked carefully all around her, searching among the flowers and the tall blades of grass. But under the circumstances, nothing she saw looked like the right thing.
        - id: ch01-b88
          speaker: narrator
          text: A large mushroom grew nearby, and it was about the same height as Alice herself. She examined it carefully. First she looked underneath. Then she went around and looked along both sides, and finally behind it. After searching everywhere else, it occurred to her that she might as well find out what was sitting on top.
        - id: ch01-b89
          speaker: narrator
          text: Alice stretched herself as tall as she could, rose on tiptoe, and peeked over the mushroom's edge. At once, her eyes met the eyes of a large blue caterpillar. It was sitting on top with its arms folded, quietly smoking a long hookah. The Caterpillar took not the smallest notice of Alice. In fact, it seemed to take no notice of anything else either.
