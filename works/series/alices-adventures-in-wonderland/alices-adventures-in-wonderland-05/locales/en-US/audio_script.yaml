audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a playful touch
        timbre: clear and gently rounded
        pace: measured with lively turns
        pitch: medium
    alice:
      display_name: Alice
      tts:
        delivery: bright, curious, and candid
        timbre: clear and youthful
        pace: naturally quick with thoughtful pauses
        pitch: medium-high
    caterpillar:
      display_name: Caterpillar
      tts:
        delivery: languid, sleepy, and coolly severe
        timbre: dry and smoky
        pace: slow with clipped replies
        pitch: medium-low
    pigeon:
      display_name: Pigeon
      tts:
        delivery: harried, suspicious, and fiercely protective
        timbre: sharp and fluttery
        pace: quick with breathless complaints
        pitch: high
  chapters:
    - id: ch01
      title: Who Are You?
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: For a long while, Alice and the Caterpillar simply stared at each other. At last, it took the hookah from its mouth and spoke in a slow, drowsy voice.
        - id: ch01-b02
          speaker: caterpillar
          text: Who are you?
        - id: ch01-b03
          speaker: narrator
          text: That was not a very welcoming way to begin. Alice answered shyly.
        - id: ch01-b04
          speaker: alice
          text: I... I hardly know right now, sir. I knew who I was when I got up this morning, but I think I've changed several times since then.
        - id: ch01-b05
          speaker: caterpillar
          text: What do you mean? Explain yourself!
          emotion: angry
        - id: ch01-b06
          speaker: alice
          text: I'm afraid I can't explain myself, sir, because I'm not myself anymore. You see?
        - id: ch01-b07
          speaker: caterpillar
          text: No, I don't.
        - id: ch01-b08
          speaker: alice
          text: I can't make it any clearer because I don't understand it myself. And changing size so many times in one day is terribly confusing.
        - id: ch01-b09
          speaker: caterpillar
          text: It isn't.
        - id: ch01-b10
          speaker: alice
          text: Maybe it hasn't happened to you yet. But someday you'll become a chrysalis, and then a butterfly. Won't that feel a little strange?
        - id: ch01-b11
          speaker: caterpillar
          text: Not at all.
        - id: ch01-b12
          speaker: alice
          text: Well, maybe you feel differently. I only know it would feel very strange to me.
        - id: ch01-b13
          speaker: caterpillar
          text: You? Who are you?
        - id: ch01-b14
          speaker: narrator
          text: And just like that, they were back where they had started. Those tiny replies were beginning to irritate Alice. She drew herself up and spoke very seriously.
        - id: ch01-b15
          speaker: alice
          text: I think you should tell me who you are first.
        - id: ch01-b16
          speaker: caterpillar
          text: Why?
        - id: ch01-b17
          speaker: narrator
          text: Alice could not think of a good answer. The Caterpillar seemed to be in a thoroughly unpleasant mood, so she turned to leave.
        - id: ch01-b18
          speaker: caterpillar
          text: Come back! I have something important to tell you!
        - id: ch01-b19
          speaker: narrator
          text: That sounded promising. Alice turned around and returned.
        - id: ch01-b20
          speaker: caterpillar
          text: Don't lose your temper.
        - id: ch01-b21
          speaker: alice
          text: Is that all?
        - id: ch01-b22
          speaker: narrator
          text: Alice swallowed her anger as best she could.
        - id: ch01-b23
          speaker: caterpillar
          text: No.
        - id: ch01-b24
          speaker: narrator
          text: Alice had nothing else to do, so she decided to wait. Perhaps, after all, it would tell her something worth hearing. For several minutes, the Caterpillar only puffed at its hookah. It did not say a word. At last, it unfolded its arms, slowly took the hookah from its mouth again, and spoke.
        - id: ch01-b25
          speaker: caterpillar
          text: So, you think you've changed?
        - id: ch01-b26
          speaker: alice
          text: I'm afraid so, sir. I can't remember things the way I used to, and I can't stay the same size for even ten minutes!
        - id: ch01-b27
          speaker: caterpillar
          text: What can't you remember?
        - id: ch01-b28
          speaker: alice
          text: I tried reciting “How Doth the Little Busy Bee,” but every word came out differently.
          emotion: sad
        - id: ch01-b29
          speaker: caterpillar
          text: Recite “You Are Old, Father William.”
        - id: ch01-b30
          speaker: narrator
          text: Alice folded her hands and began.
        - id: ch01-b31
          speaker: alice
          text: “You are old, Father William,” the young man said, “and your hair has become very white. And yet you keep standing on your head again and again. At your age, do you really think that is right?”
        - id: ch01-b32
          speaker: alice
          text: “When I was young,” Father William told his son, “I feared it might injure my brain. But now that I'm perfectly sure I have none, I do it again and again.”
        - id: ch01-b33
          speaker: alice
          text: “You are old,” said the young man, “as I already mentioned. And you've grown amazingly fat. But you turned a backward somersault right through the door. Please tell me, why did you do that?”
        - id: ch01-b34
          speaker: alice
          text: The old man shook his gray hair. “When I was young, I kept every one of my limbs very flexible by using this ointment. It costs one shilling a box. Now, would you let me sell you a couple?”
        - id: ch01-b35
          speaker: alice
          text: “You are old,” said the young man, “and your jaws are too weak for anything tougher than suet. But you ate an entire goose, bones, beak, and all. How did you manage that?”
        - id: ch01-b36
          speaker: alice
          text: “When I was young,” said Father William, “I took up the law. I argued every case with my wife. That gave my jaw such powerful muscles that the strength has stayed with me for the rest of my life.”
        - id: ch01-b37
          speaker: alice
          text: “You are old,” said the young man, “so no one would expect your eye to be steady. But you balanced an eel on the tip of your nose. How did you ever get so clever?”
        - id: ch01-b38
          speaker: alice
          text: His father answered, “I have answered three questions, and that is enough. Don't get so full of yourself! Do you think I can sit here listening to this nonsense all day? Go away now, or I'll kick you straight down the stairs!”
        - id: ch01-b39
          speaker: caterpillar
          text: That wasn't right.
        - id: ch01-b40
          speaker: alice
          text: Not quite right, I'm afraid. Some of the words changed.
        - id: ch01-b41
          speaker: caterpillar
          text: It was wrong from beginning to end.
        - id: ch01-b42
          speaker: narrator
          text: The Caterpillar sounded certain. Then both of them fell silent for several minutes.
        - id: ch01-b43
          speaker: caterpillar
          text: What size do you want to be?
        - id: ch01-b44
          speaker: alice
          text: I don't really care what size I am. I just don't like changing so often.
        - id: ch01-b45
          speaker: caterpillar
          text: I wouldn't know.
        - id: ch01-b46
          speaker: narrator
          text: Alice said nothing at all. In her entire life, she had never been contradicted so many times in one conversation. She could feel herself beginning to lose her temper again.
        - id: ch01-b47
          speaker: caterpillar
          text: Are you satisfied with your size now?
        - id: ch01-b48
          speaker: alice
          text: Well, I'd like to be a little taller, if you don't mind. Three inches is a miserable height.
        - id: ch01-b49
          speaker: caterpillar
          text: Three inches is an excellent height!
          emotion: angry
        - id: ch01-b50
          speaker: narrator
          text: The Caterpillar rose upright as it spoke. It was exactly three inches tall.
        - id: ch01-b51
          speaker: alice
          text: But I'm not used to it!
          emotion: sad
        - id: ch01-b52
          speaker: narrator
          text: Poor Alice pleaded in a miserable voice. Quietly, to herself, she wished that all the creatures she met here would not get offended quite so easily.
        - id: ch01-b53
          speaker: caterpillar
          text: You'll get used to it eventually.
        - id: ch01-b54
          speaker: narrator
          text: It put the hookah back in its mouth and began smoking again.
    - id: ch02
      title: The Two Sides of the Mushroom
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: This time, Alice waited patiently for it to speak. After a minute or two, the Caterpillar removed the hookah, yawned, and gave itself a shake. Then it climbed down from the mushroom and crawled away through the grass. As it went, it offered one last remark.
        - id: ch02-b02
          speaker: caterpillar
          text: One side will make you taller. The other side will make you shorter.
        - id: ch02-b03
          speaker: alice
          text: One side of what? And the other side of what?
        - id: ch02-b04
          speaker: narrator
          text: Alice had only thought the question, but the Caterpillar answered as though she had said it aloud.
        - id: ch02-b05
          speaker: caterpillar
          text: The mushroom.
        - id: ch02-b06
          speaker: narrator
          text: A moment later, the Caterpillar was out of sight. Alice stayed where she was and studied the mushroom thoughtfully. She had to figure out which were its two sides. But the mushroom was perfectly round, so that was a very difficult question. At last, she stretched both arms around it as far as they could reach. With one hand on either side, she broke two pieces from the edge.
        - id: ch02-b07
          speaker: alice
          text: Now, which piece does which?
        - id: ch02-b08
          speaker: narrator
          text: She nibbled a little from the piece in her right hand to see what would happen. The very next moment, something struck her violently under the chin. Her chin had hit her own foot! Such a sudden change frightened her badly. She was shrinking so quickly that there was no time to waste. She immediately tried to eat some of the other piece. But her chin was pressed so tightly against her foot that there was hardly enough room to open her mouth. After struggling for a moment, she finally got it open and swallowed a small bite from the piece in her left hand.
        - id: ch02-b09
          speaker: alice
          text: There! My head is free at last!
          emotion: happy
        - id: ch02-b10
          speaker: narrator
          text: Her delight lasted only a moment. Then it changed to alarm when she discovered that her shoulders were nowhere to be found. She looked down, but all she could see was an enormous length of neck. It seemed to rise like a stalk from a whole sea of green leaves, and those leaves lay far, far below her.
        - id: ch02-b11
          speaker: alice
          text: What is all that green stuff? Where did my shoulders go? Oh, my poor hands! Why can't I see you?
          emotion: surprised
        - id: ch02-b12
          speaker: narrator
          text: Alice moved her hands around while she spoke, but nothing seemed to happen except a little rustling among the distant green leaves. There was no hope of lifting her hands all the way to her head. Instead, she tried bringing her head down to her hands. To her delight, her neck could bend easily in every direction, just like a snake. She curved it downward in a graceful zigzag and was about to dip among the leaves. Only then did she realize what they were. She was looking at the tops of the very trees she had been wandering under. Just as she prepared to dive between them, a sharp hiss made her pull back in a hurry. A large Pigeon had flown straight into her face and was beating her violently with its wings.
        - id: ch02-b13
          speaker: pigeon
          text: Serpent!
          emotion: fearful
        - id: ch02-b14
          speaker: alice
          text: I am not a serpent! Leave me alone!
          emotion: angry
    - id: ch03
      title: The Pigeon's Complaint
      blocks:
        - id: ch03-b01
          speaker: pigeon
          text: Serpent, I tell you!
        - id: ch03-b02
          speaker: narrator
          text: The Pigeon repeated the accusation more quietly. Then its voice broke into something like a sob.
        - id: ch03-b03
          speaker: pigeon
          text: I've tried everything, and nothing suits them!
          emotion: sad
        - id: ch03-b04
          speaker: alice
          text: I have no idea what you're talking about.
        - id: ch03-b05
          speaker: pigeon
          text: I've tried making my nest in tree roots. I've tried the banks, and I've tried the hedges too. But those serpents always find me! There is simply no pleasing them!
        - id: ch03-b06
          speaker: narrator
          text: Alice grew more puzzled by the moment, but she decided not to say anything until the Pigeon had finished.
        - id: ch03-b07
          speaker: pigeon
          text: You would think hatching the eggs was trouble enough. But no! I have to stay on the lookout for serpents night and day. Why, I haven't had a single wink of sleep in three whole weeks!
        - id: ch03-b08
          speaker: alice
          text: I'm very sorry they've caused you so much trouble.
        - id: ch03-b09
          speaker: narrator
          text: Alice was beginning to understand what the Pigeon meant.
        - id: ch03-b10
          speaker: pigeon
          text: I had just chosen the highest tree in the whole woods. I was finally starting to think I would be safe from them up here. But no! They have to come wriggling down right out of the sky! Ugh! Serpent!
          emotion: disgusted
        - id: ch03-b11
          speaker: alice
          text: But I'm not a serpent! I'm a... I'm a...
        - id: ch03-b12
          speaker: pigeon
          text: Well? What are you? I can see you're making something up!
        - id: ch03-b13
          speaker: alice
          text: I... I'm a little girl.
        - id: ch03-b14
          speaker: narrator
          text: Alice sounded rather uncertain. She was remembering all the changes she had gone through that day.
        - id: ch03-b15
          speaker: pigeon
          text: Oh, what a very believable story! I've seen a great many little girls in my time, but I have never seen a single one with a neck like yours. No, no. You are a serpent, and there's no point denying it. I suppose next you'll tell me that you've never tasted an egg!
        - id: ch03-b16
          speaker: alice
          text: I have eaten eggs. But little girls eat eggs just as often as serpents do.
        - id: ch03-b17
          speaker: pigeon
          text: I don't believe that. But if it's true, then little girls must be a kind of serpent. That's all there is to it.
        - id: ch03-b18
          speaker: narrator
          text: This idea was so new that Alice said nothing for a minute or two. The Pigeon seized the chance to continue.
        - id: ch03-b19
          speaker: pigeon
          text: I know you're hunting for eggs. So why should I care whether you're a little girl or a serpent?
        - id: ch03-b20
          speaker: alice
          text: It matters very much to me! And I'm not hunting for eggs. Even if I were, I wouldn't want yours. I don't like them raw.
        - id: ch03-b21
          speaker: pigeon
          text: Then go away!
        - id: ch03-b22
          speaker: narrator
          text: The Pigeon settled back into its nest in a sulky mood. Alice crouched down among the trees as well as she could. It was difficult because her long neck kept getting tangled in the branches. Every now and then, she had to stop and carefully untwist it. After a while, Alice remembered that she was still holding both pieces of mushroom. She began working very carefully, nibbling first from one piece and then from the other. One bite made her taller, and the next made her shorter. She went on adjusting her height until at last she brought herself back down to her usual size.
        - id: ch03-b23
          speaker: narrator
          text: It had been such a long time since Alice was anywhere near her proper size that being herself felt quite strange at first. But after a few minutes, she got used to it. Before long, she was talking to herself in her usual way.
        - id: ch03-b24
          speaker: alice
          text: There, that's half my plan finished! These changes are so confusing. I never know what I'm going to be from one minute to the next. Still, I'm the right size again. Now I have to get into that beautiful garden. But how am I going to do that?
        - id: ch03-b25
          speaker: narrator
          text: As Alice said this, she suddenly came upon an open clearing. A little house stood there, and it was only about four feet high.
        - id: ch03-b26
          speaker: alice
          text: Whoever lives there, I can't go near them at this size. I'd scare them out of their wits!
        - id: ch03-b27
          speaker: narrator
          text: So Alice began nibbling from the piece in her right hand once more. She stayed where she was until she had brought herself down to only nine inches tall. Only then did she dare go near the little house.
