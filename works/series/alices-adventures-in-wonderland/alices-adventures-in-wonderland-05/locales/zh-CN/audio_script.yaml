audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带着一本正经的幽默
        timbre: 温暖清亮
        pace: 舒展而富有变化
        pitch: 中音
    alice:
      display_name: 爱丽丝
      tts:
        delivery: 好奇伶俐，想到什么就自然说出来
        timbre: 清脆稚嫩
        pace: 轻快，思索时稍慢
        pitch: 中高音
    caterpillar:
      display_name: 毛毛虫
      tts:
        delivery: 慵懒困倦，寡言傲慢，发问时冷冷逼人
        timbre: 低沉含混
        pace: 缓慢，短句间停顿明显
        pitch: 中低音
    pigeon:
      display_name: 鸽子
      tts:
        delivery: 疲惫多疑，护蛋心切，激动时尖声控诉
        timbre: 尖亮微颤
        pace: 中快，抱怨时越来越急
        pitch: 高音
  chapters:
    - id: ch01
      title: 毛毛虫的忠告
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 毛毛虫和爱丽丝互相看着，谁也不出声。过了好一阵，毛毛虫才从嘴里拿下水烟袋，用又懒又困的声音开口。
        - id: ch01-b02
          speaker: caterpillar
          text: 你——是谁？
        - id: ch01-b03
          speaker: narrator
          text: 这样的开场可不怎么亲切。爱丽丝有点不好意思，可还是回答了。
        - id: ch01-b04
          speaker: alice
          text: 我——我现在也不太清楚，先生。今天早晨起床的时候，我还知道自己是谁。可从那以后，我大概已经变过好几次了。
        - id: ch01-b05
          speaker: caterpillar
          text: 你这是什么意思？把自己解释清楚！
          emotion: angry
        - id: ch01-b06
          speaker: alice
          text: 恐怕我解释不了“我自己”，先生。因为我已经不是原来的那个我了，你明白吗？
        - id: ch01-b07
          speaker: caterpillar
          text: 不明白。
        - id: ch01-b08
          speaker: alice
          text: 我也没法说得更清楚，因为连我自己都没弄懂。一天里换了那么多种个头，真的很让人糊涂。
        - id: ch01-b09
          speaker: caterpillar
          text: 不会。
        - id: ch01-b10
          speaker: alice
          text: 也许你还没遇到过。可是总有一天，你得先变成蛹，后来再变成蝴蝶。到那时候，你多少也会觉得奇怪吧？
        - id: ch01-b11
          speaker: caterpillar
          text: 完全不会。
        - id: ch01-b12
          speaker: alice
          text: 那也许你的感觉跟我不一样。反正换成我，我一定会觉得怪极了。
        - id: ch01-b13
          speaker: caterpillar
          text: 你？你——是谁？
        - id: ch01-b14
          speaker: narrator
          text: 话题又绕回了原点。毛毛虫每句话都短得出奇，爱丽丝听得有些恼火。她挺直身子，郑重地反问它。
        - id: ch01-b15
          speaker: alice
          text: 我觉得，应该先由你告诉我，你是谁。
        - id: ch01-b16
          speaker: caterpillar
          text: 为什么？
        - id: ch01-b17
          speaker: narrator
          text: 这问题又把爱丽丝难住了。她怎么想也找不到一个像样的理由。再看毛毛虫，它的心情似乎坏得很。爱丽丝不想再跟它说下去，只好转身离开。
        - id: ch01-b18
          speaker: caterpillar
          text: 回来！我有件重要的事要告诉你！
        - id: ch01-b19
          speaker: narrator
          text: 这倒像是有好消息。爱丽丝马上转身走了回来。
        - id: ch01-b20
          speaker: caterpillar
          text: 别发脾气。
        - id: ch01-b21
          speaker: alice
          text: 你要说的就这些吗？
        - id: ch01-b22
          speaker: narrator
          text: 爱丽丝使劲忍着，才没有发火。
        - id: ch01-b23
          speaker: caterpillar
          text: 不。
        - id: ch01-b24
          speaker: narrator
          text: 爱丽丝反正没别的事，便决定继续等下去。说不定到了最后，毛毛虫真能告诉她什么值得一听的事。它只顾一口接一口地抽烟，好几分钟都不出声。后来，它总算松开抱在胸前的双臂，又把水烟袋从嘴里取出来。
        - id: ch01-b25
          speaker: caterpillar
          text: 这么说，你觉得自己变了？
        - id: ch01-b26
          speaker: alice
          text: 恐怕是的，先生。我记不住以前会背的东西，而且我的个头连十分钟都不能保持不变！
        - id: ch01-b27
          speaker: caterpillar
          text: 什么东西记不住？
        - id: ch01-b28
          speaker: alice
          text: 我试着背《勤劳的小蜜蜂怎样忙碌》，可背出来的全都变了样！
          emotion: sad
        - id: ch01-b29
          speaker: caterpillar
          text: 那就背《威廉爸爸，你已经老了》。
        - id: ch01-b30
          speaker: narrator
          text: 爱丽丝把双手规规矩矩地叠在身前，开始背诵。
        - id: ch01-b31
          speaker: alice
          text: >-
            “威廉爸爸，你已经老了，”年轻人开口讲，“你的头发也已经变得雪白。可你还是不停倒立，把头顶在地上。请你想想，这把年纪还合适吗？”“年轻时，我总怕伤了脑袋，”威廉爸爸回答儿子，“这种危险一直叫我不安。如今我完全确信，自己的脑袋里什么也没有，所以我想倒几遍，就倒几遍。”

            “你已经老了，”年轻人说，“我刚才也讲过，你的身子已经胖得少见。可你进门时竟然向后翻了个筋斗。请问，这到底是什么缘故？”“年轻时，”老人摇着灰白的头发回答，“我常用这种油膏，让四肢一直柔韧灵巧。每盒只卖一先令，要不要让我卖给你两盒？”

            “你已经老了，”年轻人说，“你的牙床软弱无力，比板油更硬的东西都应该咬不动。可你把那只鹅连骨头带嘴都吃得干干净净。请问，你究竟用了什么本领？”“年轻时，”父亲说，“我一心钻研法律，每一桩案子都拿来跟妻子争辩。这把我的下巴练得肌肉强健，那股力气够我用上一辈子。”

            “你已经老了，”年轻人说，“谁也想不到，你的眼睛还像从前一样稳。可你竟然让一条鳗鱼立在鼻尖。到底是什么让你变得这么高明？”“我已经回答了三个问题，这就够啦，”父亲说道，“少在我面前神气！你以为我能一整天听这种废话？快滚，不然我一脚把你踹下楼梯！”
        - id: ch01-b32
          speaker: caterpillar
          text: 你背得不对。
        - id: ch01-b33
          speaker: alice
          text: 恐怕不是完全正确。有几个词儿好像自己变掉了。
        - id: ch01-b34
          speaker: caterpillar
          text: 从开头到结尾，没有一句是对的。
        - id: ch01-b35
          speaker: narrator
          text: 毛毛虫说得斩钉截铁。接下来，四周又安静了好几分钟。最后，还是毛毛虫先说话。
        - id: ch01-b36
          speaker: caterpillar
          text: 你想要多高？
        - id: ch01-b37
          speaker: alice
          text: 我对个头其实不挑。只不过，老是变来变去，谁都会不喜欢，你知道的。
        - id: ch01-b38
          speaker: caterpillar
          text: 我不知道。
        - id: ch01-b39
          speaker: narrator
          text: 爱丽丝没话可说了。她从来没有碰到过这么爱顶嘴的家伙，心里的火气又冒了上来。
        - id: ch01-b40
          speaker: caterpillar
          text: 你现在满意吗？
        - id: ch01-b41
          speaker: alice
          text: 先生，要是你不介意，我希望自己能再高一点点。只有三英寸高，实在太难受了。
        - id: ch01-b42
          speaker: caterpillar
          text: 三英寸明明是再好不过的身高！
          emotion: angry
        - id: ch01-b43
          speaker: narrator
          text: 毛毛虫气得直起身子。原来，它自己正好有三英寸高。
        - id: ch01-b44
          speaker: alice
          text: 可我不习惯这么矮呀！真希望这些家伙别动不动就生气！
        - id: ch01-b45
          speaker: caterpillar
          text: 时间久了，你自然会习惯。
        - id: ch01-b46
          speaker: narrator
          text: 毛毛虫又把水烟袋含进嘴里，继续抽烟。爱丽丝这次耐心地等着，让它自己决定什么时候再开口。过了一两分钟，它拿下水烟袋，接连打了几个哈欠，又抖了抖身子。接着，它从蘑菇上爬下来，慢慢钻进草丛。一路爬走时，它只留下一句话。
        - id: ch01-b47
          speaker: caterpillar
          text: 一边会让你长高，另一边会让你变矮。
        - id: ch01-b48
          speaker: alice
          text: 什么东西的一边？什么东西的另一边？
        - id: ch01-b49
          speaker: narrator
          text: 爱丽丝只是在心里问了问，毛毛虫却像听见了一样。
        - id: ch01-b50
          speaker: caterpillar
          text: 蘑菇。
        - id: ch01-b51
          speaker: narrator
          text: 话音一落，它就消失了。爱丽丝留在原地，对着蘑菇认真想了好一会儿，努力分辨哪儿是这一边，哪儿是另一边。可蘑菇圆得不能再圆，这个问题实在难办。最后，她把双臂尽量伸开，环抱住蘑菇，两只手各从边缘掰下一小块。
        - id: ch01-b52
          speaker: alice
          text: 可现在，哪一块是哪一边呢？
        - id: ch01-b53
          speaker: narrator
          text: 她决定先试试右手里的蘑菇，就轻轻咬了一点。下一秒，下巴忽然挨了狠狠一撞。撞上来的竟然是她自己的脚！变化来得太突然，爱丽丝吓了一大跳。她的身子还在飞快缩小，已经不能再耽搁了。她赶紧去吃另一块，可下巴紧紧贴着脚，嘴里几乎没有张开的余地。费了好大劲，她才终于张开嘴，吞下一小口左手里的蘑菇。
        - id: ch01-b54
          speaker: alice
          text: 好啦，我的脑袋总算自由了！
          emotion: happy
        - id: ch01-b55
          speaker: narrator
          text: 可她马上又慌了，因为自己的肩膀不知道去了哪里。她低头往下看，还是找不到肩膀，只看见一条长得吓人的脖子。它仿佛一根细长的茎，从遥远下方那片绿叶的海洋里一直伸上来。
        - id: ch01-b56
          speaker: alice
          text: 下面那一大片绿色到底是什么？我的肩膀去哪儿了？还有我的手，我怎么也看不见你们？
        - id: ch01-b57
          speaker: narrator
          text: 她说话时不停挥动双手。遥远的树叶轻轻摇了几下，除此以外，什么也没发生。既然手没法举到脑袋旁边，她就试着把脑袋低下去找它们。爱丽丝高兴地发现，那条长脖子像蛇一样灵活，朝哪个方向都能弯。她把脖子弯成一道好看的之字形，正准备一头钻进叶丛。这时她才认出，那些绿叶其实是自己刚才走过的树木顶端。突然，一声尖利的嘶叫传来，吓得她赶紧向后缩。一只大鸽子迎面直扑过来，用两只翅膀狠狠拍打她。
        - id: ch01-b58
          speaker: pigeon
          text: 蛇！
          emotion: fearful
        - id: ch01-b59
          speaker: alice
          text: 我不是蛇！别来烦我！
          emotion: angry
        - id: ch01-b60
          speaker: pigeon
          text: 我再说一次，你就是蛇！我什么办法都试过了，可怎么做也不能让它们满意！
          emotion: sad
        - id: ch01-b61
          speaker: alice
          text: 我根本不知道你在说什么。
        - id: ch01-b62
          speaker: pigeon
          text: 树根我试过，河岸我试过，树篱我也试过！可那些蛇呢？无论怎样，它们都不肯放过我！
        - id: ch01-b63
          speaker: narrator
          text: 爱丽丝越听越糊涂。可是鸽子还没说完，她觉得自己插嘴也没有用。
        - id: ch01-b64
          speaker: pigeon
          text: 孵蛋本来就够麻烦了，我还得白天黑夜防着蛇！三个星期了，我连一会儿觉都没睡过！
        - id: ch01-b65
          speaker: alice
          text: 真对不起，让你受了这么多打扰。
        - id: ch01-b66
          speaker: narrator
          text: 爱丽丝总算开始明白鸽子的意思。鸽子的声音却越来越高，最后几乎成了尖叫。
        - id: ch01-b67
          speaker: pigeon
          text: 我好不容易选了树林里最高的树，还以为这下总能躲开它们。谁知道，它们竟然从天上扭着身子下来！呸，蛇！
          emotion: disgusted
        - id: ch01-b68
          speaker: alice
          text: 我已经说了，我不是蛇！我是——我是——
        - id: ch01-b69
          speaker: pigeon
          text: 那你到底是什么？我看你正在现编答案！
        - id: ch01-b70
          speaker: alice
          text: 我——我是个小女孩。
        - id: ch01-b71
          speaker: narrator
          text: 爱丽丝想起这一天变了那么多次，说这句话时连自己也有些怀疑。
        - id: ch01-b72
          speaker: pigeon
          text: 这故事编得可真像！我活到现在，已经见过不少小女孩，可从没见过哪一个长着你这样的脖子！不，不，别再抵赖了，你就是蛇。你接下来是不是还要告诉我，自己从来没有吃过蛋？
        - id: ch01-b73
          speaker: alice
          text: 我当然吃过蛋。可小女孩也吃蛋，不只是蛇才吃呀。
        - id: ch01-b74
          speaker: pigeon
          text: 我不相信。就算小女孩真的吃蛋，那她们也是一种蛇。没别的解释。
        - id: ch01-b75
          speaker: narrator
          text: 这种说法对爱丽丝来说实在太新奇了，她一两分钟都没出声。鸽子正好抓住这个机会，接着往下说。
        - id: ch01-b76
          speaker: pigeon
          text: 我知道得清清楚楚，你就是来找蛋的。至于你是个小女孩，还是一条蛇，对我来说又有什么区别？
        - id: ch01-b77
          speaker: alice
          text: 对我来说，区别可大了！再说了，我碰巧根本不是来找蛋的。就算我真的想找蛋，也不会拿你的，因为我不喜欢吃生蛋。
        - id: ch01-b78
          speaker: pigeon
          text: 那你就快走！
        - id: ch01-b79
          speaker: narrator
          text: 鸽子气呼呼地伏回窝里。爱丽丝也尽量低下身子，缩在树木中间。可她的脖子总是缠进树枝，走不了多远，就得停下来把它解开。过了一会儿，她想起两只手里还各拿着一块蘑菇。她小心地咬一口这边，再咬一口那边，身子一会儿长高，一会儿变矮。这样调了好一阵，她终于恢复了平常的身高。
        - id: ch01-b80
          speaker: narrator
          text: 爱丽丝已经很久没有接近正常的个头了，刚刚变回来时，这个本来熟悉的身高反而让她觉得十分陌生。不过几分钟后，她就重新习惯了自己的身体，又像平时那样，一边往前走，一边跟自己说起话。
        - id: ch01-b81
          speaker: alice
          text: 好了，我的计划已经完成一半！这些变化真让人糊涂，我从来都说不准，下一分钟自己会变成什么样。不过，现在我已经回到正常的个头了。接下来得想办法走进那座美丽的花园。可是，我究竟该怎么进去呢？
        - id: ch01-b82
          speaker: narrator
          text: 她说着说着，忽然走进一片空地。空地上孤零零地立着一幢小房子，只有大约四英尺高。
        - id: ch01-b83
          speaker: alice
          text: 不管这房子里住的是谁，我都不能用现在这个个头走过去。要是这样突然出现在他们面前，准会把他们吓得魂飞魄散！
        - id: ch01-b84
          speaker: narrator
          text: 爱丽丝觉得，用现在的身高去见屋里的人，准会把对方吓得魂飞魄散。于是，她又咬起右手里的蘑菇。她一直把自己缩到九英寸高，才终于敢慢慢走近那幢小房子。
