audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带着一本正经的幽默
        timbre: 温暖清亮
        pace: 舒展而富有变化
        pitch: 中音
    alice:
      display_name: 爱丽丝
      tts:
        delivery: 好奇伶俐，想到什么就自然说出来
        timbre: 清脆稚嫩
        pace: 轻快，思索时稍慢
        pitch: 中高音
    fish_footman:
      display_name: 鱼脸听差
      tts:
        delivery: 一本正经，礼节周全得近乎滑稽
        timbre: 清亮微尖
        pace: 缓慢庄重
        pitch: 中高音
    frog_footman:
      display_name: 蛙脸听差
      tts:
        delivery: 呆板迟钝，说荒唐话也若无其事
        timbre: 低哑浑厚
        pace: 拖沓缓慢
        pitch: 中低音
    duchess:
      display_name: 公爵夫人
      tts:
        delivery: 粗暴专横，喜怒无常
        timbre: 沙哑粗粝
        pace: 急促有力
        pitch: 中低音
    cook:
      display_name: 厨娘
      tts:
        delivery: 漠然凶悍，合唱时放声吼叫
        timbre: 粗重响亮
        pace: 中速
        pitch: 中低音
    baby:
      display_name: 婴儿
      tts:
        delivery: 哭闹不休，声音含混尖厉
        timbre: 稚嫩沙哑
        pace: 急促断续
        pitch: 高音
    cheshire_cat:
      display_name: 柴郡猫
      tts:
        delivery: 悠然机智，总像含着一丝笑意
        timbre: 柔和圆润
        pace: 从容，句间略作停顿
        pitch: 中音
  chapters:
    - id: ch01
      title: 第六章　猪与胡椒
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 爱丽丝站在树林边，望着那幢小房子，有一两分钟都想不出下一步该怎么办。忽然，一个穿制服的听差从树林里跑出来，用指关节重重敲门。爱丽丝凭制服认出他是听差，要只看那张脸，她准会说那是一条鱼。另一个穿制服的听差打开门。他长着圆脸和一双大眼睛，活像青蛙。爱丽丝还发现，两个人都扑了一头白粉，卷发堆了满脑袋。她实在想知道这是怎么回事，便悄悄从树林里探出一点身子，仔细听起来。
        - id: ch01-b02
          speaker: narrator
          text: 鱼脸听差从腋下抽出一封几乎跟他一样大的信，郑重地递给对方。
        - id: ch01-b03
          speaker: fish_footman
          text: 交给公爵夫人。女王请她去打槌球。
        - id: ch01-b04
          speaker: frog_footman
          text: 女王送来的。给公爵夫人的槌球邀请。
        - id: ch01-b05
          speaker: narrator
          text: 两人庄严地深鞠一躬，结果满头卷发立刻缠在了一起。爱丽丝见了笑得停不下来，只好赶紧跑回树林，免得被他们听见。等她下一次探头时，鱼脸听差已经不见了。蛙脸听差独自坐在门边的地上，呆头呆脑地抬眼望着天空。爱丽丝有点害怕，还是慢慢走过去，敲了敲房门。
        - id: ch01-b06
          speaker: frog_footman
          text: 敲门没有一点用。第一，我跟你都在门外。第二，里面闹成这样，谁也听不见。
        - id: ch01-b07
          speaker: narrator
          text: 屋里的声音确实非同寻常。哭喊和喷嚏一刻也不停，隔一会儿又传来一声巨响，听上去就像有人把盘子或水壶摔了个粉碎。
        - id: ch01-b08
          speaker: alice
          text: 那么请问，我要怎么进去呢？
        - id: ch01-b09
          speaker: frog_footman
          text: 要是门隔在我们中间，你敲门还有点道理。比如，你在里面敲，我就能放你出来。你明白吧。
        - id: ch01-b10
          speaker: narrator
          text: 听差说话时始终仰头看天，根本没理会她刚才的问题。爱丽丝觉得他这样很没礼貌，转念一想，他的眼睛差不多长在头顶，也许实在没有办法。可是，不管眼睛长在哪里，回答别人的问题总还是可以的。
        - id: ch01-b11
          speaker: alice
          text: 我到底怎么进去？
        - id: ch01-b12
          speaker: frog_footman
          text: 我要坐在这里，一直坐到明天。
        - id: ch01-b13
          speaker: narrator
          text: 房门猛地打开，一只大盘子旋转着飞向听差的脑袋，擦过他的鼻尖，撞在身后的树上摔得粉碎。
        - id: ch01-b14
          speaker: frog_footman
          text: 当然，我也许会一直坐到后天。
        - id: ch01-b15
          speaker: narrator
          text: 他的口气一点没变，甚至连头也没低下来，好像刚才那只盘子从来没有飞过。爱丽丝只得提高声音，再问一次。
        - id: ch01-b16
          speaker: alice
          text: 我要怎样才能进去？
        - id: ch01-b17
          speaker: frog_footman
          text: 你该不该进去才是第一个问题，你知道吧。
        - id: ch01-b18
          speaker: narrator
          text: 这的确是个问题，爱丽丝没法否认。可是她一点也不喜欢听差用这种口气提醒自己。
        - id: ch01-b19
          speaker: alice
          text: 这里的家伙怎么个个都爱抬杠？简直要把人逼疯了！
        - id: ch01-b20
          speaker: frog_footman
          text: 我要断断续续地坐在这儿，一坐就是好多好多天。
        - id: ch01-b21
          speaker: alice
          text: 可我该怎么办？
        - id: ch01-b22
          speaker: frog_footman
          text: 随你的便。
        - id: ch01-b23
          speaker: narrator
          text: 听差不再理她，坐在原地吹起口哨。爱丽丝这下彻底绝望了，她知道再问下去也不会得到一个像样的回答。
        - id: ch01-b24
          speaker: alice
          text: 跟他说什么都没用。他就是个大傻瓜！
        - id: ch01-b25
          speaker: narrator
          text: 她只好自己打开门，径直走了进去。门后就是一间大厨房，从这一头到那一头全被烟雾填满。公爵夫人坐在屋子正中央的一张三脚凳上，怀里抱着一个婴儿。厨娘弯腰守在炉火前，不停搅着一口大锅，锅里煮的看起来像是汤。
        - id: ch01-b26
          speaker: alice
          text: 这锅汤的胡椒一定放得太多了！
        - id: ch01-b27
          speaker: narrator
          text: 爱丽丝一边打喷嚏，一边勉强把话说完。空气里的胡椒确实多得惊人。连公爵夫人也会偶尔打个喷嚏，至于她怀里的婴儿，更是一会儿打喷嚏，一会儿放声号哭，连喘口气的工夫也没有。整间厨房里，只有厨娘和炉边蹲着的那只大猫不打喷嚏。那只猫咧着嘴，一直笑到了耳根。
        - id: ch01-b28
          speaker: alice
          text: 请问，您的猫为什么那样笑？
        - id: ch01-b29
          speaker: duchess
          text: 因为它是柴郡猫。就是这个缘故。猪！
          emotion: angry
        - id: ch01-b30
          speaker: narrator
          text: 最后那一声“猪”来得又凶又突然，吓得爱丽丝整个人跳了起来。过了一会儿，她才看出公爵夫人是在骂怀里的婴儿，并不是在骂自己。爱丽丝这才定下心，又壮起胆子继续说话。
        - id: ch01-b31
          speaker: alice
          text: 我不知道柴郡猫都会笑。其实，我连猫能笑都不知道。
        - id: ch01-b32
          speaker: duchess
          text: 猫全都会笑，大多数猫也确实在笑。
        - id: ch01-b33
          speaker: alice
          text: 我认识的猫里，一只会笑的也没有。
        - id: ch01-b34
          speaker: narrator
          text: 爱丽丝说得十分客气。她觉得自己总算跟公爵夫人搭上了话，心里还颇为高兴。
        - id: ch01-b35
          speaker: duchess
          text: 那是你见识太少。事实就是这样。
        - id: ch01-b36
          speaker: narrator
          text: 爱丽丝一点也不喜欢公爵夫人的口气，正想着换个话题，厨娘已经把汤锅从火上端了下来。接着，她抓起手边够得着的一切，朝公爵夫人和婴儿乱扔。最先飞过去的是火钳和火铲，随后，平底锅、盘子和碟子像雨点一样砸过去。就算被砸中，公爵夫人也毫不理会。婴儿本来就哭得震天响，谁也听不出它挨打以后是不是更疼了。爱丽丝看得胆战心惊，只能在一旁急得跳来跳去。
        - id: ch01-b37
          speaker: alice
          text: 请当心呀！那只大锅差点把他可怜的小鼻子削掉了！
          emotion: fearful
        - id: ch01-b38
          speaker: duchess
          text: 要是人人只管自己的事，世界会比现在转得快得多。
        - id: ch01-b39
          speaker: alice
          text: 那可不是什么好事。白天和黑夜都会乱套的！地球绕自己的轴一圈，需要二十四小时才能转完。
        - id: ch01-b40
          speaker: duchess
          text: 说到斧子，把她的脑袋砍下来！
          emotion: angry
        - id: ch01-b41
          speaker: narrator
          text: 爱丽丝不安地望向厨娘，想看看她会不会听从这个可怕的吩咐。幸好，厨娘只顾低头搅汤，像是什么也没听见。爱丽丝便继续说了下去。
        - id: ch01-b42
          speaker: alice
          text: 我想是二十四小时。还是十二小时来着？我有点记不清了。
        - id: ch01-b43
          speaker: duchess
          text: 别来烦我！我最受不了数字！
          emotion: angry
        - id: ch01-b44
          speaker: narrator
          text: 公爵夫人说自己一向受不了数字，接着又哄起孩子。她嘴里唱着一支古怪的摇篮曲，每唱完一行，就把婴儿狠狠摇上一下。
        - id: ch01-b45
          speaker: duchess
          text: >-
            对你的小男孩，说话要粗暴，
            他一打喷嚏，就把他痛打。
            他明明知道，这会惹人恼，
            所以才故意，啊嚏又啊嚏。
        - id: ch01-b46
          speaker: cook
          text: 哇！哇！哇！
        - id: ch01-b47
          speaker: baby
          text: 哇！哇！哇！
        - id: ch01-b48
          speaker: narrator
          text: 唱第二节时，公爵夫人把婴儿一次次抛上抛下。小家伙哭得太响，爱丽丝几乎听不清歌词。
        - id: ch01-b49
          speaker: duchess
          text: >-
            我对我的孩子，说话最严厉，
            他一打喷嚏，我就把他打。
            只要他愿意，他心里欢喜，
            就能大口享用胡椒的辛辣！
        - id: ch01-b50
          speaker: cook
          text: 哇！哇！哇！
        - id: ch01-b51
          speaker: baby
          text: 哇！哇！哇！
        - id: ch01-b52
          speaker: duchess
          text: 来，你愿意的话，就替我抱它一会儿！我得去准备陪女王打槌球了。
        - id: ch01-b53
          speaker: narrator
          text: 公爵夫人话音未落，就把婴儿朝爱丽丝扔了过去，自己匆匆跑出厨房，要去为槌球赛作准备。她出门时，厨娘又把一只煎锅扔向她，不过差了一点，没有打中。那个婴儿形状古怪，胳膊腿儿朝各个方向伸着，活像一只海星。爱丽丝费了好大劲才接住。小东西像蒸汽机一样呼哧直喘，身子蜷起来又猛地伸直。头一两分钟里，她使出浑身力气，才没有让它掉下去。
        - id: ch01-b54
          speaker: narrator
          text: 过了一阵，爱丽丝总算摸索出一个抱稳它的办法。她得先把这个古怪的小东西拧成一个结，再一手抓紧它的右耳，一手抓住它的左脚，不让它忽然把自己伸展开。她就保持着这个别扭的姿势，把婴儿从满是胡椒和烟雾的厨房里抱到屋外，来到开阔的空气中。
        - id: ch01-b55
          speaker: alice
          text: 我要是不带它走，那些人一两天内准会把它弄死。把它留下，不就等于杀了它吗？
        - id: ch01-b56
          speaker: narrator
          text: 最后一句，爱丽丝不小心说出了声。婴儿不打喷嚏了，倒哼了一声回答她。
        - id: ch01-b57
          speaker: alice
          text: 别哼哼。这样说话一点也不像话。
        - id: ch01-b58
          speaker: narrator
          text: 婴儿又哼了一声。爱丽丝很担心，连忙仔细看它的脸，想弄清它究竟出了什么事。那鼻子越翘越高，与其说是鼻子，不如说已经成了猪嘴。它的两只眼睛也越变越小，完全不像婴儿的眼睛。爱丽丝一点也不喜欢它现在的模样，又猜它也许只是在抽泣，便凑近一些，仔细找了找眼泪。可是，一滴也没有。
        - id: ch01-b59
          speaker: alice
          text: 亲爱的，你要是要变成一头猪，我可就不管你了。听清楚了吗？
        - id: ch01-b60
          speaker: narrator
          text: 小东西又呜咽了一声，也可能只是哼了一声，实在分不清。接下来，他们安静地走了一阵。爱丽丝正想着，等把这个小东西带回家，该拿它怎么办，小东西忽然使足力气狠狠一哼。她有些害怕，连忙低头再看它的脸。这一次绝不会错了，它不多不少，已经彻头彻尾变成了一头猪。再抱着一头猪继续赶路，实在太荒唐了。
        - id: ch01-b61
          speaker: narrator
          text: 爱丽丝立刻把小东西放到地上。看见小猪没有闹腾，只是安安静静地跑进树林，她终于松了口气。
        - id: ch01-b62
          speaker: alice
          text: 它要是长成大人，一定是个丑得吓人的孩子。不过，当一头猪倒还挺好看。我认识的孩子里，也有几个变成猪一定很合适。要是我知道怎么把他们变成猪就好了。
        - id: ch01-b63
          speaker: narrator
          text: 爱丽丝正想着自己认识的那些孩子，忽然发现几码外的一根树枝上坐着柴郡猫，不由得吃了一惊。猫看见她，没有出声，只咧嘴一笑。爱丽丝觉得它看起来脾气不错，可它的爪子长得吓人，嘴里的牙齿又实在太多，所以跟它说话时还是恭敬些为妙。
        - id: ch01-b64
          speaker: alice
          text: 柴郡猫咪……请问，我从这里应该往哪边走？
        - id: ch01-b65
          speaker: narrator
          text: 她叫得很小心，因为完全不确定猫喜不喜欢“柴郡猫咪”这个称呼。猫没有生气，反而把嘴咧得更开了一点。爱丽丝心想，到现在为止，它似乎还挺高兴，于是放心问了下去。
        - id: ch01-b66
          speaker: cheshire_cat
          text: 那主要得看你想去哪里。
        - id: ch01-b67
          speaker: alice
          text: 我不太在乎去哪里。
        - id: ch01-b68
          speaker: cheshire_cat
          text: 那你走哪条路都一样。
        - id: ch01-b69
          speaker: alice
          text: 我只是希望最后能到个地方。
        - id: ch01-b70
          speaker: cheshire_cat
          text: 只要一直走，走得够远，你当然会到一个地方。
        - id: ch01-b71
          speaker: narrator
          text: 爱丽丝想了想，觉得这句话确实无法反驳。不过，这个回答并没有告诉她该往哪里去，于是她只好换了个问题。
        - id: ch01-b72
          speaker: alice
          text: 这附近住着什么样的人？
        - id: ch01-b73
          speaker: cheshire_cat
          text: 那边住着一个帽匠，另一边住着一只三月兔。你想去找哪个都行，反正两个都疯了。
        - id: ch01-b74
          speaker: narrator
          text: 猫说着，先后挥了挥两只爪子，指向两个方向。
        - id: ch01-b75
          speaker: alice
          text: 可我不想跑到疯子中间去。
        - id: ch01-b76
          speaker: cheshire_cat
          text: 这可由不得你。这里的人都疯了。我疯了，你也疯了。
        - id: ch01-b77
          speaker: alice
          text: 你怎么知道我疯了？
        - id: ch01-b78
          speaker: cheshire_cat
          text: 你一定疯了。不然，你就不会来到这里。
        - id: ch01-b79
          speaker: narrator
          text: 爱丽丝听完并不服气。她觉得，自己来到这里根本不能证明自己疯了。不过她没有停下来争辩，而是接着追问。
        - id: ch01-b80
          speaker: alice
          text: 那你又怎么知道自己疯了？
        - id: ch01-b81
          speaker: cheshire_cat
          text: 先说狗吧。狗没有疯，这一点你承认吗？
        - id: ch01-b82
          speaker: alice
          text: 我想是吧。
        - id: ch01-b83
          speaker: cheshire_cat
          text: 狗生气时咆哮，高兴时摇尾巴。可我高兴时咆哮，生气时摇尾巴。所以，我疯了。
        - id: ch01-b84
          speaker: alice
          text: 我觉得那叫打呼噜，不叫咆哮。
        - id: ch01-b85
          speaker: cheshire_cat
          text: 你爱叫什么都行。今天你去陪女王打槌球吗？
        - id: ch01-b86
          speaker: alice
          text: 我很想去，可还没人邀请我。
        - id: ch01-b87
          speaker: cheshire_cat
          text: 那我们会在那里见面。
        - id: ch01-b88
          speaker: narrator
          text: 猫说完，突然从树枝上消失了。爱丽丝一路上见过太多稀奇古怪的事，已经渐渐习惯，所以并没有多么惊讶。她还站在那里，望着猫刚才待过的地方。没想到，猫忽然又出现了。
        - id: ch01-b89
          speaker: cheshire_cat
          text: 对了，那个婴儿后来怎么样了？我差点忘记问。
        - id: ch01-b90
          speaker: alice
          text: 它变成猪了。
        - id: ch01-b91
          speaker: narrator
          text: 爱丽丝说得十分平静，就好像猫突然回来是再自然不过的事。
        - id: ch01-b92
          speaker: cheshire_cat
          text: 我早就猜到了。
        - id: ch01-b93
          speaker: narrator
          text: 猫说完，又一次消失了。爱丽丝留在原地等了一会儿，心里多少还盼着它再次出现。可过了一两分钟，它仍没回来。她只好照着猫刚才指的方向，朝三月兔的住处走去。
        - id: ch01-b94
          speaker: alice
          text: 帽匠我以前见过，三月兔肯定更有趣。现在已经是五月，它也许没那么疯了。至少不会像三月里那样疯。
        - id: ch01-b95
          speaker: narrator
          text: 爱丽丝抬起头，猫果然又坐在树枝上。
        - id: ch01-b96
          speaker: cheshire_cat
          text: 你刚才说的是猪，还是无花果？
        - id: ch01-b97
          speaker: alice
          text: 我说的是猪。还有，请你别再一下出现、一下消失了，弄得人头晕。
        - id: ch01-b98
          speaker: cheshire_cat
          text: 好吧。
        - id: ch01-b99
          speaker: narrator
          text: 这次，猫果然没有突然不见。它消失得非常慢，先从尾巴尖开始，接着一点点往前，最后才轮到脸上的笑容。猫的身体已经完全消失了，那笑容却还留在空中，过了好一会儿才跟着散去。
        - id: ch01-b100
          speaker: alice
          text: 没有笑容的猫，我见得多了。可是没有猫的笑容？这真是我这辈子见过最稀奇的东西！
          emotion: surprised
        - id: ch01-b101
          speaker: narrator
          text: 爱丽丝没再走多远，就远远看见了三月兔的房子。她知道自己一定找对了，因为两根烟囱做成了兔耳朵的形状，屋顶还盖着一层毛皮。那幢房子实在太大，她没敢立刻走近。她先拿出左手里的蘑菇，又多啃了几口，让自己长到大约两英尺高。可就算已经长高了，她一步步朝房子走去时，心里还是有些害怕。
        - id: ch01-b102
          speaker: alice
          text: 万一它还是疯得很厉害呢？我真有点后悔没去找帽匠！
