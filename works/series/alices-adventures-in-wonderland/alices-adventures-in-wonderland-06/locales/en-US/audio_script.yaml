audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a playful touch
        timbre: clear and gently rounded
        pace: measured with lively turns
        pitch: medium
    alice:
      display_name: Alice
      tts:
        delivery: bright, curious, and candid
        timbre: clear and youthful
        pace: naturally quick with thoughtful pauses
        pitch: medium-high
    fish_footman:
      display_name: Fish-Footman
      tts:
        delivery: stiff, ceremonial, and solemn
        timbre: smooth and slightly watery
        pace: slow and formal
        pitch: medium
    frog_footman:
      display_name: Frog-Footman
      tts:
        delivery: vacant, stubborn, and matter-of-fact
        timbre: round and throaty
        pace: unhurried with long pauses
        pitch: medium-low
    duchess:
      display_name: Duchess
      tts:
        delivery: harsh, impatient, and forceful
        timbre: hoarse and rough-edged
        pace: brisk with abrupt turns
        pitch: medium-low
    cook:
      display_name: Cook
      tts:
        delivery: blunt and unruffled
        timbre: sturdy and smoky
        pace: steady
        pitch: medium
    baby:
      display_name: Baby
      tts:
        delivery: fussy and loudly insistent
        timbre: small and squeaky
        pace: uneven bursts
        pitch: high
    cheshire_cat:
      display_name: Cheshire Cat
      tts:
        delivery: amused, relaxed, and teasingly logical
        timbre: velvety and resonant
        pace: leisurely with precise pauses
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Footmen at the Door
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Alice stood watching the house for a minute or two, wondering what she should do. Then a footman in livery came running out of the woods and knocked hard on the door. Alice decided he must be a footman because of his uniform. By his face alone, she would have called him a fish.
        - id: ch01-b02
          speaker: narrator
          text: Another liveried footman opened the door. He had a round face and large eyes, rather like a frog. Both footmen wore powdered hair that curled all over their heads. The sight made Alice more curious than ever. She crept out of the woods a little way and listened.
        - id: ch01-b03
          speaker: narrator
          text: The Fish-Footman pulled an enormous letter from under his arm. It was nearly as large as he was. He handed it over with great ceremony.
        - id: ch01-b04
          speaker: fish_footman
          text: For the Duchess. The Queen invites her to play croquet.
        - id: ch01-b05
          speaker: frog_footman
          text: From the Queen. An invitation for the Duchess to play croquet.
        - id: ch01-b06
          speaker: narrator
          text: Both footmen bowed very low, and all their curls became tangled together. Alice laughed so hard that she had to run back among the trees before they heard her. When she dared to peek out again, the Fish-Footman had gone. The Frog-Footman was sitting on the ground beside the door, staring foolishly up at the sky.
        - id: ch01-b07
          speaker: narrator
          text: Alice walked up rather timidly and knocked.
        - id: ch01-b08
          speaker: frog_footman
          text: Knocking won't do any good, for two reasons. First, I'm out here on the same side of the door as you. Second, they're making so much noise in there that nobody could hear you.
        - id: ch01-b09
          speaker: narrator
          text: He was right about the noise. From inside came endless howling and sneezing, along with crashes that sounded like dishes or kettles smashing to pieces.
        - id: ch01-b10
          speaker: alice
          text: Then how am I supposed to get in?
        - id: ch01-b11
          speaker: frog_footman
          text: Knocking might make sense if the door were between us. Say you were inside. Then you could knock, and I could let you out.
        - id: ch01-b12
          speaker: narrator
          text: He kept looking up at the sky the whole time he spoke. Alice thought that was extremely rude. Then she considered his face. Perhaps he could not help looking upward, since his eyes were so very close to the top of his head. Even so, she thought, he might at least answer a question.
        - id: ch01-b13
          speaker: alice
          text: How do I get inside?
        - id: ch01-b14
          speaker: frog_footman
          text: I plan to sit right here until tomorrow...
        - id: ch01-b15
          speaker: narrator
          text: Just then, the door flew open and a large plate sailed straight at his head. It skimmed his nose and shattered against a tree behind him.
        - id: ch01-b16
          speaker: frog_footman
          text: Or maybe until the day after that.
        - id: ch01-b17
          speaker: narrator
          text: His voice never changed, as though nothing had happened.
        - id: ch01-b18
          speaker: alice
          text: How am I supposed to get in?
        - id: ch01-b19
          speaker: frog_footman
          text: Are you supposed to get in at all? That's the question you should ask first.
        - id: ch01-b20
          speaker: narrator
          text: There was no doubt that it was the first question. Alice simply did not like being told so, especially by this Footman.
        - id: ch01-b21
          speaker: alice
          text: Every creature here has to argue about everything. It's enough to make anyone crazy!
        - id: ch01-b22
          speaker: narrator
          text: The Footman seemed to think this was the perfect time to repeat himself in a new way.
        - id: ch01-b23
          speaker: frog_footman
          text: I'll be sitting here, now and then, for days and days.
        - id: ch01-b24
          speaker: alice
          text: But what am I supposed to do?
        - id: ch01-b25
          speaker: frog_footman
          text: Whatever you want.
        - id: ch01-b26
          speaker: narrator
          text: Then he began to whistle.
        - id: ch01-b27
          speaker: alice
          text: Talking to him is hopeless. He's a complete idiot!
        - id: ch01-b28
          speaker: narrator
          text: Alice said this desperately. There truly was no use talking to him. She stopped trying, opened the door herself, and went inside.
    - id: ch02
      title: Pepper in the Kitchen
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The door opened directly into a large kitchen filled with smoke. In the middle, the Duchess sat on a three-legged stool with a baby in her arms. The cook leaned over the fire, stirring a huge pot of soup.
        - id: ch02-b02
          speaker: alice
          text: There is far too much pepper in that soup!
        - id: ch02-b03
          speaker: narrator
          text: Alice could barely get the words out between sneezes. There was certainly far too much pepper, not only in the soup but in the air itself. Even the Duchess sneezed now and then. As for the baby, it never stopped for a moment. It would sneeze, then howl, then sneeze again. Only two creatures in the whole kitchen seemed untouched by the pepper. One was the cook. The other was a large cat sitting by the fireplace and grinning from ear to ear.
        - id: ch02-b04
          speaker: alice
          text: Excuse me, but why does your cat grin like that?
        - id: ch02-b05
          speaker: narrator
          text: Alice asked timidly, unsure whether it was polite to speak first.
        - id: ch02-b06
          speaker: duchess
          text: Because it's a Cheshire Cat. Pig!
        - id: ch02-b07
          speaker: narrator
          text: The last word came out so violently that Alice jumped. A moment later, she realized the Duchess meant the baby, not her, and found the courage to continue.
        - id: ch02-b08
          speaker: alice
          text: I never knew Cheshire Cats always grinned. I didn't even know cats could grin.
        - id: ch02-b09
          speaker: duchess
          text: Every cat can. Most of them do.
        - id: ch02-b10
          speaker: alice
          text: I've never seen one do it.
        - id: ch02-b11
          speaker: narrator
          text: Alice was pleased that they had managed to start a real conversation.
        - id: ch02-b12
          speaker: duchess
          text: Then you don't know much. That's a fact.
        - id: ch02-b13
          speaker: narrator
          text: Alice did not like that answer or the Duchess's tone. She decided another subject would be safer, but before she could choose one, the cook lifted the soup pot from the fire. Then the cook began hurling everything within reach at the Duchess and the baby. The fireplace tools came first. A whole shower of saucepans, plates, and dishes followed. The Duchess paid no attention, even when things hit her. The baby was already howling so loudly that no one could tell whether the blows hurt it or not.
        - id: ch02-b14
          speaker: alice
          text: Please, be careful! Oh! That one almost took off his poor little nose!
          emotion: fearful
        - id: ch02-b15
          speaker: narrator
          text: Alice leaped up and down in terror as an especially large saucepan flew past the baby's face.
        - id: ch02-b16
          speaker: duchess
          text: If everyone took care of their own business, the world would spin much faster.
        - id: ch02-b17
          speaker: alice
          text: That wouldn't be a good thing. Think what it would do to day and night! The earth takes twenty-four hours to turn on its axis...
        - id: ch02-b18
          speaker: duchess
          text: Speaking of axes, chop off her head!
          emotion: angry
        - id: ch02-b19
          speaker: narrator
          text: Alice glanced anxiously toward the cook to see whether that terrible order would be followed. But the cook was busy stirring the soup again and did not seem to be listening, so Alice went on.
        - id: ch02-b20
          speaker: alice
          text: I think it's twenty-four hours. Or is it twelve? I...
        - id: ch02-b21
          speaker: duchess
          text: Oh, stop bothering me! I never could stand numbers!
          emotion: angry
        - id: ch02-b22
          speaker: narrator
          text: The Duchess began nursing the child again. She sang a strange lullaby and gave the baby a violent shake at the end of every line.
        - id: ch02-b23
          speaker: duchess
          text: Speak sharply to your little boy, and beat him when he sneezes. He only does it to annoy you, because he knows it teases.
        - id: ch02-b24
          speakers: [cook, baby]
          ensemble: duo
          text: Wow! Wow! Wow!
        - id: ch02-b25
          speaker: narrator
          text: During the second verse, the Duchess tossed the baby violently up and down. The poor thing howled so loudly that Alice could hardly make out the song.
        - id: ch02-b26
          speaker: duchess
          text: I speak severely to my boy, and beat him when he sneezes. For he can enjoy the pepper whenever he pleases!
        - id: ch02-b27
          speakers: [cook, baby]
          ensemble: duo
          text: Wow! Wow! Wow!
        - id: ch02-b28
          speaker: duchess
          text: Here, you can hold it for a while if you want. I have to get ready to play croquet with the Queen.
        - id: ch02-b29
          speaker: narrator
          text: She flung the baby at Alice and hurried out. The cook threw a frying pan after her, but it missed.
    - id: ch03
      title: The Baby Becomes a Pig
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Alice managed to catch the baby, though it was not easy at all. The strange little creature held its arms and legs out in every direction, just like a starfish. As soon as she had it, it began snorting like a steam engine. It kept folding itself double and then springing straight again. For the first minute or two, simply keeping it in her arms took all Alice's strength.
        - id: ch03-b02
          speaker: narrator
          text: At last, she worked out the proper way to carry it. She had to twist it into a kind of knot, then hold its right ear in one hand and its left foot in the other. That kept it from unfolding itself again. With a firm grip on both, she carried the baby out into the open air.
        - id: ch03-b03
          speaker: alice
          text: If I leave this child in there, they'll kill it in a day or two. Wouldn't leaving it behind be murder?
        - id: ch03-b04
          speaker: narrator
          text: Alice said the last question aloud. The baby had stopped sneezing, but it answered with a grunt.
        - id: ch03-b05
          speaker: alice
          text: Don't grunt. That is not a proper way to express yourself.
        - id: ch03-b06
          speaker: narrator
          text: The baby grunted again. Alice looked anxiously into its face to find out what was wrong. There was no denying that its nose turned up very sharply. In fact, it looked far more like a snout than a baby's nose. Its eyes were also becoming extremely small for a baby. Altogether, Alice did not like the look of it. Perhaps the poor thing was only sobbing, she thought. She peered into its eyes again to see whether it had any tears.
        - id: ch03-b07
          speaker: narrator
          text: There were none.
        - id: ch03-b08
          speaker: alice
          text: If you're going to turn into a pig, my dear, I won't have anything more to do with you. Remember that!
        - id: ch03-b09
          speaker: narrator
          text: The little creature made another sound that might have been a sob or a grunt. After that, they traveled in silence for a while.
        - id: ch03-b10
          speaker: narrator
          text: Before long, Alice began wondering what she could possibly do with this creature when she got it home. At that moment, it gave another grunt, so violent that she looked down at its face in alarm. This time she could not possibly be mistaken. The creature in her arms was neither more nor less than a pig. She felt it would be perfectly absurd to carry it any farther.
        - id: ch03-b11
          speaker: narrator
          text: Alice set the little creature down on the ground. She was quite relieved to see that it needed no help from her. It simply trotted away by itself and disappeared quietly into the woods.
        - id: ch03-b12
          speaker: alice
          text: It would have grown into a terribly ugly child, but I think it makes a rather handsome pig.
        - id: ch03-b13
          speaker: narrator
          text: Then Alice began thinking over the other children she knew. Some of them, she decided, might do very well as pigs. She was just saying to herself that it would be useful to know the right way to change them when something startled her. The Cheshire Cat was sitting on the branch of a tree only a few yards away.
    - id: ch04
      title: The Cheshire Cat
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: When the Cat saw Alice, it did nothing but grin. Alice thought it looked good-natured enough. Still, she could not ignore its very long claws or the great many teeth showing in that enormous smile. Whatever else it might be, this was clearly a creature she ought to treat with respect.
        - id: ch04-b02
          speaker: alice
          text: Cheshire Puss...
        - id: ch04-b03
          speaker: narrator
          text: She spoke rather timidly because she had no idea whether the Cat would like being called that. It did not object. Instead, it grinned a little wider. Alice decided that, so far at least, it seemed pleased.
        - id: ch04-b04
          speaker: alice
          text: Would you please tell me which way I should go from here?
        - id: ch04-b05
          speaker: cheshire_cat
          text: That depends on where you want to end up.
        - id: ch04-b06
          speaker: alice
          text: I don't really care where...
        - id: ch04-b07
          speaker: cheshire_cat
          text: Then it doesn't matter which road you take.
        - id: ch04-b08
          speaker: alice
          text: As long as I get somewhere.
        - id: ch04-b09
          speaker: cheshire_cat
          text: Oh, you will. You only have to walk long enough.
        - id: ch04-b10
          speaker: narrator
          text: Alice had to admit that the Cat was right. If she walked long enough, she was bound to reach somewhere. Since there was no point arguing, she tried another question.
        - id: ch04-b11
          speaker: alice
          text: What kind of people live around here?
        - id: ch04-b12
          speaker: narrator
          text: The Cat waved one paw in one direction, then the other paw in the opposite direction.
        - id: ch04-b13
          speaker: cheshire_cat
          text: A Hatter lives that way, and a March Hare lives over there. Visit either one. They're both mad.
        - id: ch04-b14
          speaker: alice
          text: But I don't want to visit mad people.
        - id: ch04-b15
          speaker: cheshire_cat
          text: You can't avoid them. Everyone here is mad. I'm mad, and so are you.
        - id: ch04-b16
          speaker: alice
          text: How do you know I'm mad?
        - id: ch04-b17
          speaker: cheshire_cat
          text: You must be, or you never would have come here.
        - id: ch04-b18
          speaker: narrator
          text: Alice did not think that proved her madness at all, but she let the point go and continued.
        - id: ch04-b19
          speaker: alice
          text: Then how do you know you're mad?
        - id: ch04-b20
          speaker: cheshire_cat
          text: Let's begin with a dog. A dog isn't mad. You agree with that, don't you?
        - id: ch04-b21
          speaker: alice
          text: I suppose so.
        - id: ch04-b22
          speaker: cheshire_cat
          text: A dog growls when it's angry and wags its tail when it's happy. I growl when I'm happy and wag my tail when I'm angry. So I must be mad.
        - id: ch04-b23
          speaker: alice
          text: I would call that purring, not growling.
        - id: ch04-b24
          speaker: cheshire_cat
          text: Call it anything you like. Are you playing croquet with the Queen today?
        - id: ch04-b25
          speaker: alice
          text: I'd love to, but I haven't been invited.
        - id: ch04-b26
          speaker: cheshire_cat
          text: You'll see me there.
        - id: ch04-b27
          speaker: narrator
          text: With that, the Cat vanished. Alice was becoming so used to strange things happening that she was not very surprised. She kept looking at the place where it had been. While her eyes were still on the empty branch, the Cat suddenly appeared again.
        - id: ch04-b28
          speaker: cheshire_cat
          text: By the way, what happened to the baby? I almost forgot to ask.
        - id: ch04-b29
          speaker: alice
          text: It turned into a pig.
        - id: ch04-b30
          speaker: narrator
          text: Alice answered as calmly as though the Cat had returned in the most ordinary way.
        - id: ch04-b31
          speaker: cheshire_cat
          text: I thought it would.
        - id: ch04-b32
          speaker: narrator
          text: The Cat vanished again. Alice waited there for a little while, half expecting it to come back once more. This time it did not appear. After another minute or two, she walked on in the direction where the Cat had said the March Hare lived.
        - id: ch04-b33
          speaker: alice
          text: I've met hatters before, so the March Hare should be much more interesting. And since it's May, perhaps it won't be wildly mad. At least, not as mad as it was in March.
        - id: ch04-b34
          speaker: narrator
          text: She looked up as she spoke. There was the Cat again, sitting on a branch.
        - id: ch04-b35
          speaker: cheshire_cat
          text: Did you say pig or fig?
        - id: ch04-b36
          speaker: alice
          text: I said pig. And I wish you wouldn't appear and disappear so suddenly. It makes me quite dizzy.
        - id: ch04-b37
          speaker: cheshire_cat
          text: Very well.
        - id: ch04-b38
          speaker: narrator
          text: This time, the Cat did not disappear all at once. It vanished very slowly, beginning at the end of its tail. Bit by bit, the rest faded away. The grin went last, and it remained floating there for some time after every other part of the Cat was gone.
        - id: ch04-b39
          speaker: alice
          text: I've often seen a cat without a grin. But a grin without a cat? That is the strangest thing I've ever seen!
          emotion: surprised
        - id: ch04-b40
          speaker: narrator
          text: Alice had not gone much farther before the March Hare's house came into view. She felt sure it was the right house because its chimneys were shaped like ears and its roof was thatched with fur. It was such a large house that she did not want to go any closer at her present size. First, she nibbled some more from the left-hand piece of mushroom and raised herself to about two feet tall. Even then, she walked toward the house rather timidly.
        - id: ch04-b41
          speaker: alice
          text: What if he's wildly mad after all? I almost wish I'd gone to see the Hatter instead!
