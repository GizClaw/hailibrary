audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a playful touch
        timbre: clear and gently rounded
        pace: measured with lively turns
        pitch: medium
    alice:
      display_name: Alice
      tts:
        delivery: bright, curious, and candid
        timbre: clear and youthful
        pace: naturally quick with thoughtful pauses
        pitch: medium-high
    gryphon:
      display_name: Gryphon
      tts:
        delivery: blunt, gruff, and easily amused
        timbre: rough and resonant
        pace: brisk with sudden chuckles
        pitch: low
    king:
      display_name: King of Hearts
      tts:
        delivery: pompous, uncertain, and eager to sound commanding
        timbre: round and slightly reedy
        pace: deliberate with abrupt commands
        pitch: medium
    queen:
      display_name: Queen of Hearts
      tts:
        delivery: fierce, imperious, and quick to threaten
        timbre: sharp and forceful
        pace: brisk and explosive
        pitch: medium-high
    white_rabbit:
      display_name: White Rabbit
      tts:
        delivery: formal, hurried, and officious
        timbre: light and crisp
        pace: quick with careful announcements
        pitch: high
    hatter:
      display_name: Hatter
      tts:
        delivery: nervous, rambling, and desperately polite
        timbre: thin and tremulous
        pace: uneven with frequent hesitations
        pitch: medium-high
    march_hare:
      display_name: March Hare
      tts:
        delivery: impulsive, emphatic, and argumentative
        timbre: wiry and bright
        pace: quick
        pitch: medium-high
    dormouse:
      display_name: Dormouse
      tts:
        delivery: drowsy, touchy, and faintly grumbling
        timbre: soft and muffled
        pace: slow with sleepy pauses
        pitch: medium
    juror:
      display_name: Juror
      tts:
        delivery: earnest and inquisitive
        timbre: small and clear
        pace: measured
        pitch: medium
    cook:
      display_name: Duchess's Cook
      tts:
        delivery: blunt, defiant, and unimpressed
        timbre: coarse and smoky
        pace: clipped
        pitch: low
  chapters:
    - id: ch01
      title: The Court and the Accusation
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: When Alice and the Gryphon arrived, the King and Queen of Hearts sat on their throne. A great crowd surrounded them. There were little birds and beasts of every kind, along with the whole pack of cards. The Knave stood in front of the throne in chains, guarded by a soldier on each side. Near the King, the White Rabbit held a trumpet in one hand and a parchment scroll in the other.
        - id: ch01-b02
          speaker: narrator
          text: A table stood in the very center of the court, with a large dish of tarts on it. They looked so delicious that Alice grew hungry just looking at them.
        - id: ch01-b03
          speaker: alice
          text: I wish they'd finish this trial and pass around the refreshments!
        - id: ch01-b04
          speaker: narrator
          text: But there seemed to be no chance of that happening. To pass the time, Alice began studying everything around her. She had never been inside a court of justice before, though she had read about courts in books. It pleased her to discover that she knew the proper name for nearly everything she saw.
        - id: ch01-b05
          speaker: alice
          text: That must be the judge. I can tell by his enormous wig.
        - id: ch01-b06
          speaker: narrator
          text: The judge was the King himself. He had balanced his crown on top of the great wig. However he managed to keep them both on his head, he looked terribly uncomfortable, and the arrangement did not suit him at all.
        - id: ch01-b07
          speaker: alice
          text: And that must be the jury box. Those twelve creatures must be the jurors.
        - id: ch01-b08
          speaker: narrator
          text: She had to call them creatures because some were animals and some were birds. Alice repeated the word “jurors” to herself two or three times, enjoying the sound of it. She was rather proud to know what it meant. She felt, quite correctly, that very few girls her age would know the word at all. Still, “jury members” would have worked just as well.
        - id: ch01-b09
          speaker: narrator
          text: All twelve jurors were scribbling busily on slates. Alice leaned toward the Gryphon and whispered.
        - id: ch01-b10
          speaker: alice
          text: What are they writing? The trial hasn't even started, so there can't be anything to record yet.
        - id: ch01-b11
          speaker: gryphon
          text: They're writing down their own names. They're afraid they'll forget them before the trial is over.
        - id: ch01-b12
          speaker: alice
          text: What stupid crea—
        - id: ch01-b13
          speaker: narrator
          text: Alice had started saying it loudly and indignantly, but stopped at once when the White Rabbit called out.
        - id: ch01-b14
          speaker: white_rabbit
          text: Silence in the court!
        - id: ch01-b15
          speaker: narrator
          text: The King put on his spectacles and peered anxiously around, trying to discover who had spoken. Alice had such a clear view of the jurors' slates that it was almost as if she were looking over their shoulders. Every one of them was writing down “stupid creatures.” One juror did not even know how to spell “stupid” and had to ask his neighbor how to write it.
        - id: ch01-b16
          speaker: alice
          text: Their slates will be a fine mess by the time this trial ends.
        - id: ch01-b17
          speaker: narrator
          text: One juror had a pencil that squeaked every time he wrote. Alice simply could not bear the sound. She walked around the court, slipped behind him, and soon found a chance to snatch it away. The poor little juror was Bill the Lizard. Alice moved so quickly that Bill had no idea where his pencil had gone. He hunted all around his place for it, but found nothing. At last he had to spend the rest of the day writing with one finger. It was not much use, because his finger left no mark on the slate.
        - id: ch01-b18
          speaker: king
          text: Herald, read the accusation!
        - id: ch01-b19
          speaker: narrator
          text: The White Rabbit blew three trumpet blasts, unrolled the parchment, and read.
        - id: ch01-b20
          speaker: white_rabbit
          text: “The Queen of Hearts made some tarts upon a summer day. The Knave of Hearts then stole those tarts and carried them away!”
        - id: ch01-b21
          speaker: king
          text: Jury, consider your verdict.
        - id: ch01-b22
          speaker: white_rabbit
          text: Not yet! Not yet! We have a great deal to hear first.
        - id: ch01-b23
          speaker: king
          text: Then call the first witness.
        - id: ch01-b24
          speaker: narrator
          text: The White Rabbit sounded three more blasts on the trumpet.
        - id: ch01-b25
          speaker: white_rabbit
          text: First witness!
    - id: ch02
      title: The Hatter Takes the Stand
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The first witness was the Hatter. He entered carrying a teacup in one hand and bread and butter in the other.
        - id: ch02-b02
          speaker: hatter
          text: Please excuse these, Your Majesty. I hadn't finished my tea when they sent for me.
        - id: ch02-b03
          speaker: king
          text: You should have finished it. When did you start?
        - id: ch02-b04
          speaker: narrator
          text: The Hatter looked toward the March Hare, who had come into court arm in arm with the Dormouse.
        - id: ch02-b05
          speaker: hatter
          text: I think it was March fourteenth.
        - id: ch02-b06
          speaker: march_hare
          text: The fifteenth.
        - id: ch02-b07
          speaker: dormouse
          text: The sixteenth.
        - id: ch02-b08
          speaker: king
          text: Write all that down.
        - id: ch02-b09
          speaker: narrator
          text: The jury eagerly wrote down all three dates on their slates. As if that made perfect sense, they added the dates together. Then they reduced the answer to shillings and pence.
        - id: ch02-b10
          speaker: king
          text: Take off your hat.
        - id: ch02-b11
          speaker: hatter
          text: It doesn't belong to me.
        - id: ch02-b12
          speaker: king
          text: Stolen!
          emotion: surprised
        - id: ch02-b13
          speaker: narrator
          text: The King turned toward the jury, and every juror immediately made a note of it.
        - id: ch02-b14
          speaker: hatter
          text: I sell hats. I don't own any myself. That's what makes me a hatter.
        - id: ch02-b15
          speaker: narrator
          text: The Queen put on her spectacles and stared at the Hatter. He turned pale and began to fidget.
        - id: ch02-b16
          speaker: king
          text: Give us your evidence. And don't be nervous, or I'll have you executed right here.
        - id: ch02-b17
          speaker: narrator
          text: This did not encourage the witness at all. He kept shifting from one foot to the other while he looked uneasily at the Queen. He grew so confused that, instead of taking a bite of bread and butter, he bit a large piece right out of his teacup.
        - id: ch02-b18
          speaker: narrator
          text: Just then, Alice noticed a very strange feeling. For a while she could not make out what it was. Then she understood that she had begun to grow larger again. Her first thought was to stand up and leave the court. On second thought, she decided to remain in her seat for as long as there was still room for her.
        - id: ch02-b19
          speaker: dormouse
          text: Stop squeezing me so much. I can hardly breathe.
        - id: ch02-b20
          speaker: alice
          text: I can't stop it. I'm growing.
        - id: ch02-b21
          speaker: narrator
          text: Alice answered very meekly.
        - id: ch02-b22
          speaker: dormouse
          text: You have no right to grow in here.
        - id: ch02-b23
          speaker: alice
          text: Don't be ridiculous. You grow too, you know.
        - id: ch02-b24
          speaker: narrator
          text: This time Alice spoke more boldly.
        - id: ch02-b25
          speaker: dormouse
          text: Yes, but I grow at a sensible speed. I don't shoot up in that absurd way.
        - id: ch02-b26
          speaker: narrator
          text: The Dormouse rose sulkily and crossed to the other side of the court. The Queen had never stopped staring at the Hatter. As the Dormouse crossed the room, she turned to one of the court officers.
        - id: ch02-b27
          speaker: queen
          text: Bring me the list of singers from the last concert!
        - id: ch02-b28
          speaker: narrator
          text: The miserable Hatter shook so hard that both his shoes flew off.
        - id: ch02-b29
          speaker: king
          text: Give your evidence, or I'll have you executed whether you're nervous or not!
          emotion: angry
    - id: ch03
      title: A Very Poor Speaker
      blocks:
        - id: ch03-b01
          speaker: hatter
          text: I'm a poor man, Your Majesty. I hadn't begun my tea more than a week ago, and the bread and butter kept getting thinner, and then there was the twinkling of the tea—
        - id: ch03-b02
          speaker: king
          text: The twinkling of what?
        - id: ch03-b03
          speaker: hatter
          text: Well, “twinkling” began with the tea.
        - id: ch03-b04
          speaker: king
          text: Of course twinkling begins with a T! Do you think I'm a dunce? Keep going!
          emotion: angry
        - id: ch03-b05
          speaker: hatter
          text: As I said, I'm a poor man. After that, almost everything twinkled. Then the March Hare said—
        - id: ch03-b06
          speaker: march_hare
          text: I never said anything!
        - id: ch03-b07
          speaker: narrator
          text: The March Hare cut in at once.
        - id: ch03-b08
          speaker: hatter
          text: Yes, you did!
        - id: ch03-b09
          speaker: march_hare
          text: I deny it!
        - id: ch03-b10
          speaker: king
          text: He denies it. Leave that part out.
        - id: ch03-b11
          speaker: hatter
          text: Anyway, the Dormouse said—
        - id: ch03-b12
          speaker: narrator
          text: The Hatter looked anxiously around to see whether the Dormouse would deny that too. This time no interruption came. The Dormouse was fast asleep and denied nothing.
        - id: ch03-b13
          speaker: hatter
          text: After that, I cut myself some more bread and butter—
        - id: ch03-b14
          speaker: juror
          text: But what did the Dormouse say?
        - id: ch03-b15
          speaker: hatter
          text: I can't remember.
        - id: ch03-b16
          speaker: king
          text: You must remember, or I'll have you executed.
        - id: ch03-b17
          speaker: narrator
          text: The wretched Hatter dropped his teacup and bread and butter, then sank to one knee.
        - id: ch03-b18
          speaker: hatter
          text: I'm only a poor man, Your Majesty.
        - id: ch03-b19
          speaker: king
          text: And you're a very poor speaker.
        - id: ch03-b20
          speaker: narrator
          text: One of the guinea pigs cheered, and the court officers immediately suppressed him. That is a rather difficult word, so here is exactly what happened. The officers had a large canvas bag with strings that tied its mouth shut. They slipped the guinea pig into the bag headfirst. Then they pulled the strings tight and sat down on top of it.
        - id: ch03-b21
          speaker: alice
          text: I'm glad I finally saw how that works. Newspapers always say that applause in court was immediately suppressed by the officers. Until now, I never knew what they meant.
        - id: ch03-b22
          speaker: king
          text: If that's everything you know, you may step down.
        - id: ch03-b23
          speaker: hatter
          text: I can't get any lower. I'm already down on the floor.
        - id: ch03-b24
          speaker: king
          text: Then you may sit down.
        - id: ch03-b25
          speaker: narrator
          text: At that, the other guinea pig cheered. The officers suppressed this one in exactly the same way.
        - id: ch03-b26
          speaker: alice
          text: Well, that's taken care of both guinea pigs. Maybe the trial can move along now.
        - id: ch03-b27
          speaker: hatter
          text: I'd rather go finish my tea.
        - id: ch03-b28
          speaker: narrator
          text: He looked anxiously at the Queen, who was reading the list of singers.
        - id: ch03-b29
          speaker: king
          text: You may go.
        - id: ch03-b30
          speaker: narrator
          text: The Hatter hurried out of court without even stopping to put on his shoes.
        - id: ch03-b31
          speaker: queen
          text: And have his head taken off outside.
        - id: ch03-b32
          speaker: narrator
          text: The Queen gave the order to an officer, but the Hatter had vanished before the officer reached the door.
        - id: ch03-b33
          speaker: king
          text: Call the next witness!
    - id: ch04
      title: The Cook and the Next Witness
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The next witness was the Duchess's cook. She carried her pepper box. Before she had even entered the court, everyone near the door began sneezing, so Alice knew at once who was coming.
        - id: ch04-b02
          speaker: king
          text: Give us your evidence.
        - id: ch04-b03
          speaker: cook
          text: I won't.
        - id: ch04-b04
          speaker: narrator
          text: The King gave the White Rabbit an anxious look. The Rabbit lowered his voice.
        - id: ch04-b05
          speaker: white_rabbit
          text: Your Majesty will have to cross-examine this witness.
        - id: ch04-b06
          speaker: king
          text: Well, if I have to, then I have to.
        - id: ch04-b07
          speaker: narrator
          text: The King sounded miserable. He folded his arms and frowned at the cook until his eyes nearly disappeared. Then he spoke in a deep voice.
        - id: ch04-b08
          speaker: king
          text: What are tarts made from?
        - id: ch04-b09
          speaker: cook
          text: Mostly pepper.
        - id: ch04-b10
          speaker: dormouse
          text: Treacle.
        - id: ch04-b11
          speaker: narrator
          text: The sleepy answer came from behind the cook.
        - id: ch04-b12
          speaker: queen
          text: Seize that Dormouse! Behead him! Throw him out of court! Suppress him! Pinch him! Cut off his whiskers!
          emotion: angry
        - id: ch04-b13
          speaker: narrator
          text: For several minutes, the whole court was in confusion. Everyone was busy getting the Dormouse turned out of the room, and nothing else could continue. By the time they had managed it and the court had settled down once more, the cook had disappeared.
        - id: ch04-b14
          speaker: king
          text: Never mind! Call the next witness.
        - id: ch04-b15
          speaker: narrator
          text: The King looked greatly relieved. Then he leaned toward the Queen and spoke under his breath.
        - id: ch04-b16
          speaker: king
          text: My dear, you'll really have to question the next witness. This is making my forehead ache.
        - id: ch04-b17
          speaker: narrator
          text: Alice watched the White Rabbit fumbling through his list. She was very curious to see what sort of witness would come next.
        - id: ch04-b18
          speaker: alice
          text: They certainly haven't found much evidence so far.
        - id: ch04-b19
          speaker: narrator
          text: The White Rabbit found the next name at the top of his list. Then he cried it out in his highest, shrillest voice. Imagine Alice's surprise when she heard that the next witness was Alice herself.
        - id: ch04-b20
          speaker: white_rabbit
          text: Alice!
