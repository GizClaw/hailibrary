audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带着一本正经的幽默
        timbre: 温暖清亮
        pace: 舒展而富有变化
        pitch: 中音
    alice:
      display_name: 爱丽丝
      tts:
        delivery: 好奇伶俐，想到什么就自然说出来
        timbre: 清脆稚嫩
        pace: 轻快，思索时稍慢
        pitch: 中高音
    gryphon:
      display_name: 鹰头狮
      tts:
        delivery: 粗率爽直，笑话别人时毫不客气
        timbre: 浑厚洪亮
        pace: 明快利落
        pitch: 中低音
    king_of_hearts:
      display_name: 红心国王
      tts:
        delivery: 胆怯又爱摆威严，遇事急着讲道理
        timbre: 偏细而清楚
        pace: 中等
        pitch: 中高音
    queen_of_hearts:
      display_name: 红心王后
      tts:
        delivery: 暴躁专横，命令像吼叫
        timbre: 尖厉响亮
        pace: 急促有力
        pitch: 高音
    white_rabbit:
      display_name: 白兔
      tts:
        delivery: 匆忙焦急，说话短促
        timbre: 细而清楚
        pace: 快
        pitch: 高音
    hatter:
      display_name: 帽匠
      tts:
        delivery: 古怪机敏，刻薄话也说得一本正经
        timbre: 干脆清晰
        pace: 忽快忽慢
        pitch: 中音
    march_hare:
      display_name: 三月兔
      tts:
        delivery: 热情得荒唐，抬杠时理直气壮
        timbre: 明亮略尖
        pace: 轻快跳脱
        pitch: 中高音
    dormouse:
      display_name: 睡鼠
      tts:
        delivery: 困倦含混，被催促时偶尔急切
        timbre: 沙哑微弱
        pace: 缓慢拖沓
        pitch: 中高音
    cook:
      display_name: 厨娘
      tts:
        delivery: 漠然凶悍，合唱时放声吼叫
        timbre: 粗重响亮
        pace: 中速
        pitch: 中低音
    juror:
      display_name: 陪审员
      tts:
        delivery: 认真又糊涂，提问时煞有介事
        timbre: 平实清楚
        pace: 中等
        pitch: 中音
  chapters:
    - id: ch01
      title: 法庭上的馅饼
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 爱丽丝和鹰头狮赶到法庭时，红心国王和王后已经坐上宝座。四周挤满各式各样的小鸟、小兽，还有整副扑克牌。红心武士戴着锁链站在宝座前面，两旁各有一名士兵看守。白兔就在国王身边，一手拿喇叭，一手拿羊皮纸卷。
        - id: ch01-b02
          speaker: narrator
          text: 法庭中央摆着一张桌子，上面是一大盘香喷喷的馅饼。爱丽丝看得肚子都饿了。
        - id: ch01-b03
          speaker: alice
          text: 但愿他们快点审完，好把点心分给大家吃。
        - id: ch01-b04
          speaker: narrator
          text: 可这时候根本看不出审判什么时候才能结束。爱丽丝只好仔细打量身边的每样东西，拿这些新鲜事打发时间。她以前从没进过法庭，只在书里读到过。如今发现这里的东西几乎都叫得出名字，心里很是得意。
        - id: ch01-b05
          speaker: alice
          text: 那个一定是法官，因为他戴着一顶大假发。
        - id: ch01-b06
          speaker: narrator
          text: 这位法官正是国王。他居然把王冠扣在那顶大假发外面。如果你实在想不出那是什么模样，可以去看看卷首插图。总之，他看起来很不舒服，那顶王冠也一点儿不衬他。
        - id: ch01-b07
          speaker: alice
          text: 那边是陪审席，里面十二个家伙就是陪审员。
        - id: ch01-b08
          speaker: narrator
          text: 她非叫他们“家伙”不可，因为其中有走兽，也有飞鸟，实在不能把他们全叫做人。爱丽丝把“陪审员”这个词默念了两三遍，颇有几分骄傲。她觉得像自己这么大的小姑娘，很少有人知道这个词是什么意思。她这样想倒没错，不过叫他们“陪审团的人”也一样说得通。
        - id: ch01-b09
          speaker: narrator
          text: 十二名陪审员正忙着在石板上写字。
        - id: ch01-b10
          speaker: alice
          text: 审判还没开始，他们能有什么可记的？
        - id: ch01-b11
          speaker: gryphon
          text: 他们在记自己的名字，怕审判还没结束，就连名字也忘了。
        - id: ch01-b12
          speaker: alice
          text: 真是一群笨蛋！
          emotion: angry
        - id: ch01-b13
          speaker: narrator
          text: 爱丽丝一气之下说得太响，话刚出口就赶紧闭嘴。
        - id: ch01-b14
          speaker: white_rabbit
          text: 法庭肃静！
        - id: ch01-b15
          speaker: narrator
          text: 国王马上戴起眼镜，紧张地四处寻找刚才说话的人。爱丽丝虽然没有站在陪审员身后，却像越过他们的肩膀看一样，瞧得清清楚楚。陪审员全把“一群笨蛋”写进了石板。还有一个连“笨”字也不会写，只好请邻座教他。
        - id: ch01-b16
          speaker: alice
          text: 等审完案子，那些石板准会乱得一塌糊涂呀。
        - id: ch01-b17
          speaker: narrator
          text: 一名陪审员的铅笔写起来吱吱作响，爱丽丝当然受不了。她绕过整个法庭，走到那名陪审员背后，很快便瞅准机会，一下拿走了铅笔。原来那名可怜的小陪审员是蜥蜴比尔。爱丽丝出手太快，比尔根本弄不明白铅笔去了哪里。他四处找了一通，只得在这一天余下的时间里用手指写字。可手指哪能在石板上留下痕迹呢？
        - id: ch01-b18
          speaker: king_of_hearts
          text: 传令官，现在宣读罪状！
        - id: ch01-b19
          speaker: narrator
          text: 白兔当真把喇叭一连吹响三次，然后展开手里的羊皮纸卷，向整座法庭宣读罪状。
        - id: ch01-b20
          speaker: white_rabbit
          text: “红心王后烤馅饼，正是一个夏日天。红心武士偷馅饼，拿得一个也不见！”
        - id: ch01-b21
          speaker: king_of_hearts
          text: 陪审团可以商议裁决了。
        - id: ch01-b22
          speaker: white_rabbit
          text: 还不行！前面还有许多程序没有走呢！
        - id: ch01-b23
          speaker: king_of_hearts
          text: 那就传第一位证人。
        - id: ch01-b24
          speaker: narrator
          text: 白兔再次吹了三声喇叭，叫第一位证人进来。
    - id: ch02
      title: 帽匠作证
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 第一位证人是帽匠。他走进法庭时，一只手端着茶杯，另一只手还拿着一片黄油面包，两样东西都没有放下。
        - id: ch02-b02
          speaker: hatter
          text: 请陛下原谅我把这些带进来。有人来叫我的时候，我还没喝完茶呢。
        - id: ch02-b03
          speaker: king_of_hearts
          text: 你早就该喝完了。你从哪一天开始喝的？
        - id: ch02-b04
          speaker: narrator
          text: 帽匠看向三月兔。三月兔挽着睡鼠，也跟进了法庭。
        - id: ch02-b05
          speaker: hatter
          text: 我想，大概是三月十四号开始的。
        - id: ch02-b06
          speaker: march_hare
          text: 我记得是三月十五号。
        - id: ch02-b07
          speaker: dormouse
          text: 我说是三月十六号。
        - id: ch02-b08
          speaker: king_of_hearts
          text: 把这三个日期都记下来。
        - id: ch02-b09
          speaker: narrator
          text: 陪审员听话得很，赶紧把三个日期全都写在石板上。他们又郑重其事地把三个日期加在一起，最后竟把算出的答案折算成了先令和便士。
        - id: ch02-b10
          speaker: king_of_hearts
          text: 证人，把帽子摘下来。
        - id: ch02-b11
          speaker: hatter
          text: 可这顶帽子不是我的。
        - id: ch02-b12
          speaker: king_of_hearts
          text: 原来帽子是偷来的！
          emotion: surprised
        - id: ch02-b13
          speaker: narrator
          text: 国王立刻转向陪审团，陪审员也立刻把这件事记了下来。
        - id: ch02-b14
          speaker: hatter
          text: 我做帽子是为了卖。我自己一顶也没有，因为我是帽匠啊。
        - id: ch02-b15
          speaker: narrator
          text: 这时，王后也戴上眼镜，开始死死盯住帽匠。帽匠叫她看得脸色发白，一刻不停地动来动去，怎么也站不安稳。
        - id: ch02-b16
          speaker: king_of_hearts
          text: 快把证词说出来。别紧张，不然我现在就砍掉你的头。
        - id: ch02-b17
          speaker: narrator
          text: 这句话一点儿也没有鼓励到帽匠。他还是紧张极了，一会儿把重心移到这只脚，一会儿又换到另一只脚，还不停地偷看王后。慌乱之中，他忘了手里哪样是吃的，没去咬黄油面包，反倒从茶杯上咬下了一大块。
        - id: ch02-b18
          speaker: narrator
          text: 就在这时，爱丽丝身上忽然有了一种很奇怪的感觉。她纳闷了好一会儿，终于弄明白，原来自己又开始长大了。起初她想站起来离开法庭，可转念一想，又决定只要这里还容得下自己，就继续坐下去。
        - id: ch02-b19
          speaker: dormouse
          text: 你别再往我这边挤了。我都快喘不过气了。
        - id: ch02-b20
          speaker: alice
          text: 我也没有办法呀，我正在长大。
        - id: ch02-b21
          speaker: dormouse
          text: 可你没有权利在法庭里长大。
        - id: ch02-b22
          speaker: alice
          text: 别说傻话了，你自己也会长大呀。
        - id: ch02-b23
          speaker: dormouse
          text: 可我是按合理的速度长，才不像你这么荒唐。
        - id: ch02-b24
          speaker: narrator
          text: 睡鼠气呼呼地起身，穿过法庭，坐到另一边去了。这段时间里，王后的眼睛一直没有离开帽匠。睡鼠刚走过去，她就吩咐一名法警，赶快拿来上次音乐会的歌手名单。可怜的帽匠听了抖得更厉害，竟把两只鞋都抖掉了。
        - id: ch02-b25
          speaker: king_of_hearts
          text: 快说证词！不然我就砍掉你的头，不管你紧不紧张！
          emotion: angry
        - id: ch02-b26
          speaker: hatter
          text: 陛下，我只是个穷人。我喝茶才开始了顶多一个星期。黄油面包越来越薄，还有茶光闪烁……
          emotion: fearful
        - id: ch02-b27
          speaker: king_of_hearts
          text: 你说什么东西在闪？
        - id: ch02-b28
          speaker: hatter
          text: 我是从“茶光闪烁”的“茶”字开头说起的。
        - id: ch02-b29
          speaker: king_of_hearts
          text: 那当然是从“茶”字开头！难道你把我当傻瓜吗？接着说！
          emotion: angry
        - id: ch02-b30
          speaker: hatter
          text: 我只是个穷人。后来差不多什么都闪起来了。只有三月兔说……
        - id: ch02-b31
          speaker: march_hare
          text: 我根本没说过！
        - id: ch02-b32
          speaker: hatter
          text: 你明明说了！
        - id: ch02-b33
          speaker: march_hare
          text: 我绝不承认！
        - id: ch02-b34
          speaker: king_of_hearts
          text: 他既然不承认，那一段就不要记。
        - id: ch02-b35
          speaker: hatter
          text: 好吧，反正睡鼠后来还说……
        - id: ch02-b36
          speaker: narrator
          text: 帽匠说到睡鼠，马上紧张地四下张望，想看看睡鼠会不会也矢口否认。可睡鼠已经睡得很熟了，既没否认，也没有说别的话。
        - id: ch02-b37
          speaker: hatter
          text: 接下来，我又切了几片黄油面包……
        - id: ch02-b38
          speaker: juror
          text: 睡鼠到底说了什么？
        - id: ch02-b39
          speaker: hatter
          text: 那句话我已经记不起来了。
        - id: ch02-b40
          speaker: king_of_hearts
          text: 你必须想起来，不然我就砍掉你的头。
        - id: ch02-b41
          speaker: narrator
          text: 可怜的帽匠扔下茶杯和面包，单膝跪在地上。
        - id: ch02-b42
          speaker: hatter
          text: 陛下，我真的只是个穷人。
          emotion: fearful
        - id: ch02-b43
          speaker: king_of_hearts
          text: 可你还是个糟糕透顶的陈述人。
    - id: ch03
      title: 两只豚鼠
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 一只豚鼠听见国王的话，忍不住喝起彩来，马上遭到法警“压制”。这个词不太好懂，所以我得仔细告诉你，他们是怎么“压制”的。法警拿来一个帆布大袋，袋口装着几根可以收紧的绳子。他们把豚鼠头朝下塞进袋里，扎紧袋口，然后一屁股坐在上面。
        - id: ch03-b02
          speaker: alice
          text: 幸好我看见了。报纸总说，有人企图喝彩，立刻遭到法警压制。我到今天才弄懂这句话。
        - id: ch03-b03
          speaker: king_of_hearts
          text: 你要是只知道这些，现在可以退下了。
        - id: ch03-b04
          speaker: hatter
          text: 我已经跪在地板上，实在没法再往下退了。
        - id: ch03-b05
          speaker: king_of_hearts
          text: 那么，你就坐下吧。
        - id: ch03-b06
          speaker: narrator
          text: 话音刚落，另一只豚鼠也喝起彩来。法警照刚才的办法，把它也塞进帆布袋，立刻给“压制”住了。
        - id: ch03-b07
          speaker: alice
          text: 这下两只豚鼠都解决了，审判应该会顺利一点儿吧。
        - id: ch03-b08
          speaker: hatter
          text: 我还是想回去把茶喝完。
        - id: ch03-b09
          speaker: narrator
          text: 帽匠不安地看着王后。王后正在读那张歌手名单。
        - id: ch03-b10
          speaker: king_of_hearts
          text: 你可以走了。
        - id: ch03-b11
          speaker: narrator
          text: 国王一放行，帽匠便急急忙忙逃出法庭。他连停下来穿好刚才抖掉的两只鞋也顾不上。
        - id: ch03-b12
          speaker: queen_of_hearts
          text: 等他到了外面，顺手把他的头砍下来。
        - id: ch03-b13
          speaker: narrator
          text: 可法警还没走到门口，帽匠早就跑得没影了。
        - id: ch03-b14
          speaker: king_of_hearts
          text: 现在传下一位证人！
    - id: ch04
      title: 下一位证人
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 下一位证人是公爵夫人的厨娘，手里还拿着那只胡椒罐。其实她还没有走进法庭，门口附近的人便突然一个接一个打起喷嚏。爱丽丝一看这情形，马上猜出了来人的身份。
        - id: ch04-b02
          speaker: king_of_hearts
          text: 请把你知道的证词说出来。
        - id: ch04-b03
          speaker: cook
          text: 我不说。
        - id: ch04-b04
          speaker: narrator
          text: 国王不安地看向白兔。
        - id: ch04-b05
          speaker: white_rabbit
          text: 陛下必须亲自盘问这位证人。
        - id: ch04-b06
          speaker: king_of_hearts
          text: 既然非问不可，那就只好问了。
        - id: ch04-b07
          speaker: narrator
          text: 国王愁眉苦脸地抱起双臂，又狠狠皱起眉，盯得两只眼睛几乎都藏进了眉毛底下，这才压低声音开口。
        - id: ch04-b08
          speaker: king_of_hearts
          text: 告诉我，馅饼是拿什么做的？
        - id: ch04-b09
          speaker: cook
          text: 馅饼主要是胡椒做的。
        - id: ch04-b10
          speaker: dormouse
          text: 馅饼明明是糖浆做的。
        - id: ch04-b11
          speaker: queen_of_hearts
          text: 抓住那只睡鼠！砍掉它的头！把它赶出去！压制它！掐它！再拔光它的胡子！
          emotion: angry
        - id: ch04-b12
          speaker: narrator
          text: 接下来的好几分钟，整个法庭都乱成了一团。众人七手八脚，只顾着把睡鼠弄出法庭。等骚乱终于平息，大家重新坐好，那位厨娘早已经不见了。
        - id: ch04-b13
          speaker: king_of_hearts
          text: 她不见了也没关系。传下一位证人。
        - id: ch04-b14
          speaker: narrator
          text: 国王松了一大口气，又小声对王后诉起苦来。
        - id: ch04-b15
          speaker: king_of_hearts
          text: 亲爱的，下一位证人一定要由你来盘问。这差事弄得我额头都疼了。
        - id: ch04-b16
          speaker: narrator
          text: 爱丽丝看着白兔在证人名单里翻来找去，心里好奇极了，很想知道下一位证人会是什么模样。
        - id: ch04-b17
          speaker: alice
          text: 他们审了这么久，到现在也没拿出多少证据。
        - id: ch04-b18
          speaker: narrator
          text: 白兔忽然用他最高最尖的嗓门，念出了“爱丽丝”这个名字。你可以想象，她听见以后有多么吃惊。爱丽丝怎么也没想到，下一位被叫上法庭的证人竟是自己！
