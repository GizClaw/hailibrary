audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切从容，带着一本正经的幽默
        timbre: 温暖清亮
        pace: 舒展而富有变化
        pitch: 中音
    alice:
      display_name: 爱丽丝
      tts:
        delivery: 好奇伶俐，想到什么就自然说出来
        timbre: 清脆稚嫩
        pace: 轻快，思索时稍慢
        pitch: 中高音
    gryphon:
      display_name: 鹰头狮
      tts:
        delivery: 粗率爽直，笑话别人时毫不客气
        timbre: 浑厚洪亮
        pace: 明快利落
        pitch: 中低音
    mock_turtle:
      display_name: 假海龟
      tts:
        delivery: 忧郁多愁，讲起往事郑重又容易动气
        timbre: 低沉空洞
        pace: 缓慢，叹息时停顿较长
        pitch: 低音
  chapters:
    - id: ch01
      title: 龙虾四对舞
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 假海龟深深叹了口气，又用鳍背抹了抹眼睛。它望着爱丽丝，几次想开口，可哭得太厉害，一两分钟都没能说出话。
        - id: ch01-b02
          speaker: gryphon
          text: 瞧它这样，简直像喉咙里卡了根骨头。
        - id: ch01-b03
          speaker: narrator
          text: 鹰头狮一面说，一面抓住假海龟使劲摇，还朝它背上捶了几拳。假海龟这才找回声音。它脸上挂着两道泪，又往下说。
        - id: ch01-b04
          speaker: mock_turtle
          text: 你大概没在海底住过多久吧？也许从来没有谁替你引见过龙虾。既没住过海底，又没认识过龙虾，那你怎么可能知道，龙虾四对舞有多好玩呢！
        - id: ch01-b05
          speaker: alice
          text: 我的确没在海底住过。龙虾嘛，我倒吃过一回……不，我从来没有见过。龙虾四对舞是什么样的？
        - id: ch01-b06
          speaker: gryphon
          text: 一开始，大家要沿着海岸排成一行。
        - id: ch01-b07
          speaker: mock_turtle
          text: 是两行！海豹、海龟、鲑鱼，还有别的海兽和鱼，都要排进去。排好队，还得先把水母全都清出场地。
        - id: ch01-b08
          speaker: gryphon
          text: 清水母通常就要花很长时间。
        - id: ch01-b09
          speaker: mock_turtle
          text: 清完以后，大家先向前走两遍。
        - id: ch01-b10
          speaker: gryphon
          text: 每个人都得找一只龙虾当舞伴！
        - id: ch01-b11
          speaker: mock_turtle
          text: 那当然。向前走过两遍，还要跟舞伴面对面跳。
        - id: ch01-b12
          speaker: gryphon
          text: 然后交换龙虾，照原来的次序退回去。
        - id: ch01-b13
          speaker: mock_turtle
          text: 接下来，该做投掷的动作了。
        - id: ch01-b14
          speaker: gryphon
          text: 把龙虾扔出去！
        - id: ch01-b15
          speaker: narrator
          text: 鹰头狮说到这里，猛地跳到半空。
        - id: ch01-b16
          speaker: mock_turtle
          text: 对，尽你最大的力气，把它扔到大海深处！
        - id: ch01-b17
          speaker: gryphon
          text: 再游过去追上它！
        - id: ch01-b18
          speaker: mock_turtle
          text: 接着在海里翻一个筋斗！
        - id: ch01-b19
          speaker: narrator
          text: 假海龟也蹦起来，疯了似的满地乱跳。
        - id: ch01-b20
          speaker: gryphon
          text: 再换一回龙虾！
        - id: ch01-b21
          speaker: mock_turtle
          text: 最后回到岸上。这样，第一组舞步就完成了。
        - id: ch01-b22
          speaker: narrator
          text: 假海龟喊到最后一句时，声音一下子低了下去。方才还像发疯一样又喊又跳的两个怪物重新坐好，安静得出奇。它们脸上的兴奋也消失了，又都满脸悲伤地望着爱丽丝。
        - id: ch01-b23
          speaker: alice
          text: 这舞一定很好看。
        - id: ch01-b24
          speaker: mock_turtle
          text: 你想看看吗？我们可以跳一小段。
        - id: ch01-b25
          speaker: alice
          text: 我非常想看。
        - id: ch01-b26
          speaker: mock_turtle
          text: 那就来吧！我们先跳第一组。没有龙虾也不要紧。鹰头狮，咱们谁唱歌？
        - id: ch01-b27
          speaker: gryphon
          text: 你来唱。我已经把歌词忘了。
        - id: ch01-b28
          speaker: narrator
          text: 没有龙虾，也没有别的舞伴，它们还是神情严肃地围着爱丽丝，一圈又一圈地跳。每次从她身旁经过，它们都贴得太近，常常一脚踩中她的脚趾。两只怪物还不停挥动前爪，拿爪子打着拍子。就在这样的伴奏里，假海龟用又慢又伤心的调子唱了起来。
        - id: ch01-b29
          speaker: mock_turtle
          text: “‘请你再走快一点！’鳕鱼对蜗牛说，‘一只海豚紧跟在身后，它已经踩上我的尾巴。瞧那些龙虾和海龟，正争先恐后地往前赶。它们都在石滩上等着呢，你要不要来跳舞？你来不来，来不来，愿不愿来跳舞？你来不来，来不来，到底愿不愿来跳舞？’”
        - id: ch01-b30
          speaker: mock_turtle
          text: “‘你不知道那有多快活！我们会和龙虾一起被抓起来，再远远扔进大海！’蜗牛斜眼瞧着鳕鱼，回答说：‘太远啦，实在太远啦。谢谢你的好意，可我不肯去跳舞。’不肯来，不能来，不肯来，不能来，就是不肯来跳舞。不肯来，不能来，不肯来，不能来，不能来跳舞。”
        - id: ch01-b31
          speaker: mock_turtle
          text: “‘路有多远怕什么？’长着鳞片的朋友回答，‘大海那一边，还有另一道海岸。离英格兰越远，离法兰西就越近。亲爱的蜗牛，脸可别吓白了，快来和我们一起跳舞。你来不来，来不来，愿不愿来跳舞？你来不来，来不来，到底愿不愿来跳舞？’”
        - id: ch01-b32
          speaker: alice
          text: 谢谢你们，这舞看着真有意思。那首唱鳕鱼的怪歌，我也特别喜欢。
        - id: ch01-b33
          speaker: narrator
          text: 爱丽丝其实最庆幸的，是这场舞终于结束了。
    - id: ch02
      title: 鳕鱼的讲究
      blocks:
        - id: ch02-b01
          speaker: mock_turtle
          text: 说到鳕鱼，你当然见过它们吧？
        - id: ch02-b02
          speaker: alice
          text: 见过，我吃晚……我是说，我常常见到它们。
        - id: ch02-b03
          speaker: mock_turtle
          text: 我不知道“吃晚”是个什么地方。不过，既然你常见鳕鱼，你肯定知道它们长什么样。
        - id: ch02-b04
          speaker: alice
          text: 我想我知道。它们把尾巴含在嘴里，浑身上下还都是面包屑。
        - id: ch02-b05
          speaker: mock_turtle
          text: 面包屑可不对。一下海，那些屑早被水冲光了，不可能还留在身上。不过，鳕鱼确实把尾巴含在嘴里。这里面当然有缘故。只是讲到缘故，我现在有点困了。
        - id: ch02-b06
          speaker: narrator
          text: 假海龟说着打了个哈欠，闭起眼睛，把这件事交给鹰头狮来讲。
        - id: ch02-b07
          speaker: gryphon
          text: 鳕鱼偏要和龙虾一块儿去跳舞，所以也被扔进了大海。它们往下掉了很远，尾巴一下卡进嘴里，从此怎么也拔不出来。这就是全部原因。
        - id: ch02-b08
          speaker: alice
          text: 谢谢你，这可真有意思。我以前从没听过鳕鱼还有这么多事。
        - id: ch02-b09
          speaker: gryphon
          text: 你要是想听，我还能讲更多。你知道鳕鱼为什么叫鳕鱼吗？
        - id: ch02-b10
          speaker: alice
          text: 我从来没想过。为什么？
        - id: ch02-b11
          speaker: gryphon
          text: 因为鳕鱼专门替人把皮鞋“揩鳕”。
        - id: ch02-b12
          speaker: alice
          text: 它替人给皮鞋“揩鳕”？
          emotion: surprised
        - id: ch02-b13
          speaker: narrator
          text: 爱丽丝完全听糊涂了。她把鹰头狮那句话重复了一遍，声音里全是惊奇。鹰头狮却还是一本正经，好像这件事再明白不过。
        - id: ch02-b14
          speaker: gryphon
          text: 那你的鞋是拿什么揩亮的？
        - id: ch02-b15
          speaker: narrator
          text: 爱丽丝低头看了看自己的鞋，认真想了一阵。
        - id: ch02-b16
          speaker: alice
          text: 我想，我的鞋是用黑鞋油擦亮的。
        - id: ch02-b17
          speaker: gryphon
          text: 海底的鞋全拿鳕鱼“揩鳕”。现在你明白了吧。
        - id: ch02-b18
          speaker: alice
          text: 那么，海底的鞋又是用什么做的？
        - id: ch02-b19
          speaker: gryphon
          text: 当然用鞋底鱼和鳗鱼。这点小事，任何一只小虾都能告诉你。
        - id: ch02-b20
          speaker: alice
          text: 如果我是歌里的鳕鱼，我就会对那只海豚说，请它离远一点，我们不想带它一起走。
        - id: ch02-b21
          speaker: mock_turtle
          text: 可它们必须带上那只海豚。聪明的鱼不论去哪儿，都不会不带一只海豚。
        - id: ch02-b22
          speaker: alice
          text: 真的吗？一条聪明的鱼绝不会自己出门？
          emotion: surprised
        - id: ch02-b23
          speaker: mock_turtle
          text: 当然是真的。如果有条鱼来找我，说它准备去旅行，我就会问它，是为了什么海豚。
        - id: ch02-b24
          speaker: alice
          text: 你是不是想问，它旅行有什么目的？
        - id: ch02-b25
          speaker: mock_turtle
          text: 我说出口的，就是我想说的话。
          emotion: angry
        - id: ch02-b26
          speaker: gryphon
          text: 好了，现在该让我们听听你的冒险故事了。
    - id: ch03
      title: 变了样的诗
      blocks:
        - id: ch03-b01
          speaker: alice
          text: 我可以从今天早上开始讲。可是，讲到昨天就没有用了，因为昨天的我和现在不是同一个人。
        - id: ch03-b02
          speaker: mock_turtle
          text: 那你先解释清楚，为什么会变成不同的人。
        - id: ch03-b03
          speaker: gryphon
          text: 不行，先讲冒险！解释那些事要花太多时间。
        - id: ch03-b04
          speaker: narrator
          text: 爱丽丝便从今天早上第一次看见白兔讲起。刚开口时，她心里有点慌，因为鹰头狮和假海龟从左右两边紧紧贴着她，眼睛睁得特别大，嘴巴也张得特别大。说着说着，爱丽丝渐渐有了勇气，讲得也顺畅起来。两位听众始终安静得出奇，直到她讲到毛毛虫那里。她当时在毛毛虫面前背了《威廉爸爸，你老了》，可背出口的每一句都变了样。假海龟听到这里，长长吸了一口气。
        - id: ch03-b05
          speaker: mock_turtle
          text: 这件事真奇怪。
        - id: ch03-b06
          speaker: gryphon
          text: 这已经奇怪到不能再奇怪了。
        - id: ch03-b07
          speaker: mock_turtle
          text: 每句话都变了样！这实在太奇怪了。我想听听她现在再背一首，会背成什么样。你叫她开始吧，让她马上背给我们听。
        - id: ch03-b08
          speaker: narrator
          text: 假海龟说这话时一直看着鹰头狮，好像它真有权命令爱丽丝。
        - id: ch03-b09
          speaker: gryphon
          text: 站起来，背《这是懒汉的声音》。
        - id: ch03-b10
          speaker: narrator
          text: 爱丽丝心里抱怨，这里的怪物怎么都爱使唤人，还逼人一遍遍背功课。这样下去，她还不如干脆回学校呢。可她不敢反抗，还是站了起来。她脑子里塞得满满的，全是刚才那场龙虾四对舞，连自己说的是什么都弄不清。这样背出来的诗，自然也怪得不得了。
        - id: ch03-b11
          speaker: alice
          text: “这是龙虾的声音，我听见它大声嚷，你把我烤得太焦，我要给头发撒上糖。鸭子用眼皮梳妆，它却拿鼻子来整理腰带和纽扣，还把脚尖朝外张。”
        - id: ch03-b12
          speaker: narrator
          text: 后来的版本又续了几句。沙地干燥时，龙虾像云雀一样快活，还用瞧不起的口气谈论鲨鱼。等潮水升起，鲨鱼游到四周，它的声音立刻变得胆怯又颤抖。
        - id: ch03-b13
          speaker: gryphon
          text: 这和我小时候背的完全不一样。
        - id: ch03-b14
          speaker: mock_turtle
          text: 我以前没听过这首诗。它听上去真是一堆少见的胡说八道。
        - id: ch03-b15
          speaker: narrator
          text: 爱丽丝一句话也不说。她坐回地上，双手捂住脸，心里只想知道，这个地方到底会不会有哪件事照正常的样子发生。
        - id: ch03-b16
          speaker: mock_turtle
          text: 我希望有人把这首诗解释给我听。
        - id: ch03-b17
          speaker: gryphon
          text: 她根本解释不了。让她接着背下一节。
        - id: ch03-b18
          speaker: mock_turtle
          text: 可是，诗里还说到了脚尖。龙虾怎么能用鼻子把脚尖转到外面去？
        - id: ch03-b19
          speaker: alice
          text: 那是跳舞时的第一个站姿。
        - id: ch03-b20
          speaker: narrator
          text: 爱丽丝回答了，却觉得整件事越说越乱。她现在只想赶紧换一个话题。
        - id: ch03-b21
          speaker: gryphon
          text: 继续背下一节。开头是，我从它的花园外走过。
        - id: ch03-b22
          speaker: narrator
          text: 爱丽丝知道，这一回多半又要全背错。可是，她没胆量违抗鹰头狮，只能用发抖的声音背下去。
        - id: ch03-b23
          speaker: alice
          text: “我从它的花园外面走过，眯起一只眼，看见猫头鹰和豹子，正在分一只馅饼。”
        - id: ch03-b24
          speaker: narrator
          text: 后来的版本还说，豹子拿走了饼皮、肉汁和馅肉，留给猫头鹰的只有盘子。馅饼吃完后，猫头鹰承蒙好意，可以把汤匙装进口袋。豹子低声咆哮着接过刀叉。讲到它怎样结束这场宴席时，诗句就在这里断了。
        - id: ch03-b25
          speaker: mock_turtle
          text: 你背一句，却不解释一句，这样背下去有什么用？我这辈子从没听过这么叫人糊涂的东西！
        - id: ch03-b26
          speaker: gryphon
          text: 对，我看你别再背了。
        - id: ch03-b27
          speaker: narrator
          text: 爱丽丝听到这句话，别提有多高兴了。
    - id: ch04
      title: 美丽的汤
      blocks:
        - id: ch04-b01
          speaker: gryphon
          text: 我们要不要再跳一组龙虾四对舞？还是说，你想听假海龟唱一首歌？
        - id: ch04-b02
          speaker: alice
          text: 我想听歌！请假海龟唱吧，只要它愿意唱给我听，我会非常高兴。
        - id: ch04-b03
          speaker: gryphon
          text: 哼，人的口味真没法解释。老伙计，给她唱一首《海龟汤》吧。
        - id: ch04-b04
          speaker: narrator
          text: 假海龟没有马上回答。它先深深叹了口气，才缓缓唱了起来。它唱得那么伤心，嗓音不时被抽泣截断，却仍旧一句一句地往下唱。
        - id: ch04-b05
          speaker: mock_turtle
          text: “美丽的汤啊，鲜浓又碧绿，盛在滚烫的汤盆里等候！这样的美味，谁能不低头？晚餐的汤啊，美丽的汤！晚餐的汤啊，美丽的汤！美——丽的汤——啊！美——丽的汤——啊！晚——餐的汤——啊，美丽的，美丽的汤！”
          emotion: sad
        - id: ch04-b06
          speaker: mock_turtle
          text: “美丽的汤！谁还在乎鱼鲜、野味，或是别的菜肴？谁会舍不得拿一切来换，只换两便士的美丽的汤？只换一便士的美丽的汤？美——丽的汤——啊！美——丽的汤——啊！晚——餐的汤——啊，美丽的，美——丽的汤！”
          emotion: sad
        - id: ch04-b07
          speaker: gryphon
          text: 再唱一次副歌！
        - id: ch04-b08
          speaker: narrator
          text: 假海龟刚从头唱起，远处忽然有人高声叫喊，审判已经开始了。
        - id: ch04-b09
          speaker: gryphon
          text: 快走！
        - id: ch04-b10
          speaker: narrator
          text: 鹰头狮一把拉住爱丽丝的手，带着她飞快跑开，完全不管那首歌还没有唱完。
        - id: ch04-b11
          speaker: alice
          text: 到底要审判什么？
        - id: ch04-b12
          speaker: narrator
          text: 爱丽丝边跑边问，已经有些喘不过气。鹰头狮没有告诉她是什么审判，还是只催她快走，脚下反而越跑越快。风从身后追来，也把假海龟悲伤的歌声送到他们耳边。那声音越来越远，越来越轻。
        - id: ch04-b13
          speaker: mock_turtle
          text: “晚——餐的汤——啊，美丽的，美丽的汤！”
          emotion: sad
