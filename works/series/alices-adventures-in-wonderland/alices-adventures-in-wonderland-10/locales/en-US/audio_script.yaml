audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a playful touch
        timbre: clear and gently rounded
        pace: measured with lively turns
        pitch: medium
    alice:
      display_name: Alice
      tts:
        delivery: bright, curious, and candid
        timbre: clear and youthful
        pace: naturally quick with thoughtful pauses
        pitch: medium-high
    gryphon:
      display_name: Gryphon
      tts:
        delivery: blunt, gruff, and easily amused
        timbre: rough and resonant
        pace: brisk with sudden chuckles
        pitch: low
    mock_turtle:
      display_name: Mock Turtle
      tts:
        delivery: mournful, solemn, and easily offended
        timbre: deep and hollow
        pace: slow with heavy pauses
        pitch: low
    distant_voice:
      display_name: Distant Voice
      tts:
        delivery: urgent and carrying from far away
        timbre: clear and bright
        pace: brisk
        pitch: medium-high
  chapters:
    - id: ch01
      title: The Lobster Quadrille
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The Mock Turtle let out a deep sigh and drew the back of one flapper across his eyes. He looked at Alice and tried to speak, but for a minute or two, his sobs stopped every word. The Gryphon said it was just like having a bone stuck in his throat. Then it set to work shaking him and punching him in the back. At last the Mock Turtle recovered. With tears still running down his cheeks, he found his voice and went on.
        - id: ch01-b02
          speaker: mock_turtle
          text: I don't suppose you've spent much time under the sea.
        - id: ch01-b03
          speaker: alice
          text: No, I haven't.
        - id: ch01-b04
          speaker: mock_turtle
          text: And perhaps no one has ever introduced you to a lobster.
        - id: ch01-b05
          speaker: narrator
          text: Alice started to say that she had once tasted one. She caught herself just in time.
        - id: ch01-b06
          speaker: alice
          text: No. Never.
        - id: ch01-b07
          speaker: mock_turtle
          text: Then you can't possibly know how delightful a Lobster Quadrille is!
        - id: ch01-b08
          speaker: alice
          text: No, I really don't. What kind of dance is it?
        - id: ch01-b09
          speaker: gryphon
          text: First, you make a line along the seashore.
        - id: ch01-b10
          speaker: mock_turtle
          text: Two lines! Seals, turtles, salmon, and all the rest. Then you clear every jellyfish out of the way.
        - id: ch01-b11
          speaker: gryphon
          text: That part usually takes a while.
        - id: ch01-b12
          speaker: mock_turtle
          text: Then you advance twice.
        - id: ch01-b13
          speaker: gryphon
          text: With a lobster for your partner!
        - id: ch01-b14
          speaker: mock_turtle
          text: Naturally. Advance twice, then face your partners.
        - id: ch01-b15
          speaker: gryphon
          text: Trade lobsters, and move back in the same order.
        - id: ch01-b16
          speaker: mock_turtle
          text: After that, you throw the—
        - id: ch01-b17
          speaker: narrator
          text: The Gryphon sprang into the air.
        - id: ch01-b18
          speaker: gryphon
          text: The lobsters!
        - id: ch01-b19
          speaker: mock_turtle
          text: As far out to sea as you can.
        - id: ch01-b20
          speaker: gryphon
          text: Swim after them!
        - id: ch01-b21
          speaker: mock_turtle
          text: Turn a somersault in the water!
        - id: ch01-b22
          speaker: narrator
          text: The Mock Turtle was dancing wildly now.
        - id: ch01-b23
          speaker: gryphon
          text: Change lobsters again!
        - id: ch01-b24
          speaker: mock_turtle
          text: Then go back to shore. That's the whole first figure.
        - id: ch01-b25
          speaker: narrator
          text: His voice suddenly dropped. All this time, both creatures had been jumping around like mad things. Now they sat down again, very sad and quiet, and looked at Alice.
        - id: ch01-b26
          speaker: alice
          text: It must be a very pretty dance.
        - id: ch01-b27
          speaker: narrator
          text: She said it rather timidly.
        - id: ch01-b28
          speaker: mock_turtle
          text: Would you like us to show you a little of it?
        - id: ch01-b29
          speaker: alice
          text: Yes, very much!
        - id: ch01-b30
          speaker: mock_turtle
          text: Come on, let's do the first figure. We don't really need lobsters. Which one of us will sing?
        - id: ch01-b31
          speaker: gryphon
          text: You sing. I've forgotten the words.
        - id: ch01-b32
          speaker: narrator
          text: They began to dance solemnly, circling Alice again and again. Every now and then, when they passed too close, they stepped on her toes. They waved their front paws to mark the time, while the Mock Turtle sang very slowly and sadly.
        - id: ch01-b33
          speaker: mock_turtle
          text: “Will you walk a little faster?” said the whiting to the snail. “There's a porpoise close behind us, and he's treading on my tail. See how eagerly the lobsters and the turtles all advance! They're waiting on the shingle. Will you come and join the dance? Will you, won't you, will you, won't you, will you join the dance? Will you, won't you, will you, won't you, won't you join the dance?”
        - id: ch01-b34
          speaker: mock_turtle
          text: “You really have no idea how delightful it will be when they take us up and throw us, with the lobsters, out to sea!” But the snail answered, “Too far, too far!” and gave a sideways look. He thanked the whiting kindly, but said he would not join the dance. Would not, could not, would not, could not, would not join the dance. Would not, could not, would not, could not, could not join the dance.
        - id: ch01-b35
          speaker: mock_turtle
          text: “What does it matter how far we go?” his scaly friend replied. “There's another shore, you know, upon the other side. The farther we travel from England, the nearer we get to France. So don't turn pale, beloved snail. Come and join the dance. Will you, won't you, will you, won't you, will you join the dance? Will you, won't you, will you, won't you, won't you join the dance?”
        - id: ch01-b36
          speaker: alice
          text: Thank you. It's a very interesting dance to watch. And I really do like that curious song about the whiting!
        - id: ch01-b37
          speaker: narrator
          text: Alice spoke politely, but inside she was very glad that the dance had finally come to an end.
        - id: ch01-b38
          speaker: mock_turtle
          text: Speaking of whiting, you've seen them, of course?
        - id: ch01-b39
          speaker: alice
          text: Yes. I've seen them lots of times at din—
        - id: ch01-b40
          speaker: narrator
          text: Once again, Alice stopped herself.
        - id: ch01-b41
          speaker: mock_turtle
          text: I don't know where this place called Din may be. But if you've seen whiting there so often, then of course you must know what they're like.
        - id: ch01-b42
          speaker: alice
          text: I think so. They hold their tails in their mouths, and they're covered in bread crumbs.
        - id: ch01-b43
          speaker: mock_turtle
          text: You're wrong about the bread crumbs. Crumbs would all wash off the moment they went into the sea. But you are right about their tails. Whiting really do hold them in their mouths, and the reason is—
        - id: ch01-b44
          speaker: narrator
          text: The Mock Turtle yawned and closed his eyes.
        - id: ch01-b45
          speaker: mock_turtle
          text: You tell her the reason and everything.
        - id: ch01-b46
          speaker: gryphon
          text: The reason is, they insisted on going to the dance with the lobsters. So they were thrown out to sea. Then they had to fall a long, long way. Their tails got stuck fast in their mouths, and they couldn't get them out again. That's all there is to it.
        - id: ch01-b47
          speaker: alice
          text: Thank you. That's very interesting. I never knew so much about a whiting before.
        - id: ch01-b48
          speaker: gryphon
          text: I can tell you more than that, if you'd like. Do you know why people call it a whiting?
        - id: ch01-b49
          speaker: alice
          text: I never wondered about that. Why is it?
        - id: ch01-b50
          speaker: gryphon
          text: It does the boots and shoes.
        - id: ch01-b51
          speaker: narrator
          text: The Gryphon gave this answer very solemnly, but Alice was completely puzzled.
        - id: ch01-b52
          speaker: alice
          text: It does the boots and shoes?
          emotion: surprised
        - id: ch01-b53
          speaker: gryphon
          text: Well, what are your shoes done with? What makes them shine?
        - id: ch01-b54
          speaker: narrator
          text: Alice looked down at her shoes and thought for a moment.
        - id: ch01-b55
          speaker: alice
          text: I believe they're done with blacking.
        - id: ch01-b56
          speaker: gryphon
          text: Boots and shoes under the sea are done with whiting. That's how we make them shine. There. Now you know.
        - id: ch01-b57
          speaker: alice
          text: Then what are they made of?
        - id: ch01-b58
          speaker: gryphon
          text: They're made of soles and eels, of course. Any shrimp could have told you that much.
        - id: ch01-b59
          speaker: alice
          text: If I were that whiting in the song, I'd tell the porpoise, “Please stay back. We don't want you with us!”
        - id: ch01-b60
          speaker: mock_turtle
          text: They were obliged to bring the porpoise with them. No sensible fish would ever go anywhere without one.
        - id: ch01-b61
          speaker: alice
          text: Really? It wouldn't?
          emotion: surprised
        - id: ch01-b62
          speaker: mock_turtle
          text: Certainly not. If a fish came to me and said it was taking a journey, I'd ask, “With what porpoise?”
        - id: ch01-b63
          speaker: alice
          text: Don't you mean “purpose”?
        - id: ch01-b64
          speaker: mock_turtle
          text: I mean what I say, and I said “porpoise.”
          emotion: angry
        - id: ch01-b65
          speaker: gryphon
          text: Now then, tell us some of your adventures.
        - id: ch01-b66
          speaker: alice
          text: I could start with what happened this morning. There's no point going back to yesterday, because I was a different person then.
        - id: ch01-b67
          speaker: mock_turtle
          text: You must explain that.
        - id: ch01-b68
          speaker: gryphon
          text: No, no! Adventures first. Explanations take such a terrible amount of time.
        - id: ch01-b69
          speaker: narrator
          text: So Alice began telling them everything that had happened since she first saw the White Rabbit that morning. At first she was rather nervous. The two creatures crowded so close, one on each side of her, and opened their eyes and mouths so very wide. But as the story went on, she found her courage. They listened in perfect silence until she reached the Caterpillar. Alice told them how she had tried to repeat “You Are Old, Father William,” and how all the words had come out different.
        - id: ch01-b70
          speaker: mock_turtle
          text: That is very curious.
          emotion: surprised
        - id: ch01-b71
          speaker: gryphon
          text: About as curious as anything could possibly be.
        - id: ch01-b72
          speaker: mock_turtle
          text: Every word came out differently! I'd like to hear her try to repeat something right now. Tell her to start another lesson.
        - id: ch01-b73
          speaker: narrator
          text: The Mock Turtle looked over at the Gryphon as if he believed the Gryphon had some kind of authority over Alice and could order her to perform.
        - id: ch01-b74
          speaker: gryphon
          text: Stand up and recite “'Tis the Voice of the Sluggard.”
        - id: ch01-b75
          speaker: alice
          text: These creatures are always ordering me around and making me recite lessons. I might as well be back at school.
        - id: ch01-b76
          speaker: narrator
          text: Alice kept that thought to herself. Still, she stood up and began to recite. But her head was so full of the Lobster Quadrille that she hardly knew what she was saying. The words that came out were very strange indeed.
        - id: ch01-b77
          speaker: alice
          text: “'Tis the voice of the Lobster. I heard him declare, ‘You have baked me too brown. I must sugar my hair.’ Like a duck with its eyelids, he uses his nose to trim his belt and his buttons and turn out his toes.”
        - id: ch01-b78
          speaker: alice
          text: “When the sands are all dry, he is gay as a lark, and he talks in contemptuous tones of the Shark. But when the tide rises and sharks are around, his voice has a timid and trembling sound.”
        - id: ch01-b79
          speaker: gryphon
          text: That's not how I used to say it when I was young.
        - id: ch01-b80
          speaker: mock_turtle
          text: Well, I never heard that recitation before. Still, it sounds like the most extraordinary nonsense.
        - id: ch01-b81
          speaker: narrator
          text: Alice did not answer. She sat down with her face buried in her hands, wondering whether anything would ever happen in a natural way again.
        - id: ch01-b82
          speaker: mock_turtle
          text: I want her to explain it.
        - id: ch01-b83
          speaker: gryphon
          text: She can't explain it. Go on to the next verse.
        - id: ch01-b84
          speaker: mock_turtle
          text: But what about his toes? That's the part I want to understand. How could he possibly turn them out with his nose?
        - id: ch01-b85
          speaker: alice
          text: That's the first position in dancing.
        - id: ch01-b86
          speaker: narrator
          text: Alice gave that answer, but the whole thing had her terribly puzzled. More than anything, she wanted them to change the subject.
        - id: ch01-b87
          speaker: gryphon
          text: Next verse. It starts, “I passed by his garden.”
        - id: ch01-b88
          speaker: narrator
          text: Alice did not dare refuse, though she was sure it would all go wrong. Her voice trembled as she continued.
        - id: ch01-b89
          speaker: alice
          text: “I passed by his garden and watched with one eye as the Owl and the Panther were sharing a pie. The Panther took pie crust and gravy and meat, while the Owl got the dish as his share of the treat. When the pie was all finished, the Owl, as a favor, was kindly allowed to put the spoon in his pocket. The Panther received the knife and the fork with a growl, and then he concluded the banquet—”
        - id: ch01-b90
          speaker: mock_turtle
          text: What is the use of repeating all that stuff if you don't explain it as you go along? It's by far the most confusing thing I've ever heard!
        - id: ch01-b91
          speaker: gryphon
          text: Yes, I think you'd better stop.
        - id: ch01-b92
          speaker: narrator
          text: Alice was only too happy to obey.
        - id: ch01-b93
          speaker: gryphon
          text: Should we try another figure of the Lobster Quadrille? Or would you rather hear the Mock Turtle sing?
        - id: ch01-b94
          speaker: alice
          text: Oh, a song, please! That is, if the Mock Turtle would be kind enough to sing one.
        - id: ch01-b95
          speaker: gryphon
          text: Hmph! There's no accounting for people's taste. Sing her “Turtle Soup,” will you, old fellow?
          emotion: angry
        - id: ch01-b96
          speaker: narrator
          text: The Mock Turtle sighed from the bottom of his heart. Then he began to sing. Every so often, a sob caught in his throat and nearly choked off the song.
        - id: ch01-b97
          speaker: mock_turtle
          text: “Beautiful Soup, so rich and green, waiting in a hot tureen! Who would not stoop for a wonderful treat? Soup of the evening, beautiful Soup! Soup of the evening, beautiful Soup! Beau-ootiful Soo-oop! Beau-ootiful Soo-oop! Soo-oop of the e-e-evening, beautiful, beautiful Soup!”
          emotion: sad
        - id: ch01-b98
          speaker: mock_turtle
          text: “Beautiful Soup! Who cares for fish, game, or any other dish? Who would not give up everything else for only two pennies' worth of beautiful Soup? Pennies' worth only of beautiful Soup! Beau-ootiful Soo-oop! Beau-ootiful Soo-oop! Soo-oop of the e-e-evening, beautiful, beauti-ful Soup!”
          emotion: sad
        - id: ch01-b99
          speaker: gryphon
          text: Sing the chorus again!
        - id: ch01-b100
          speaker: narrator
          text: The Mock Turtle had just begun to repeat the chorus when a cry came from somewhere far away.
        - id: ch01-b101
          speaker: distant_voice
          text: The trial is beginning!
        - id: ch01-b102
          speaker: gryphon
          text: Come on!
        - id: ch01-b103
          speaker: narrator
          text: The Gryphon grabbed Alice by the hand and hurried away without waiting for the song to end.
        - id: ch01-b104
          speaker: alice
          text: What trial is it?
        - id: ch01-b105
          speaker: narrator
          text: Alice panted out her question as she ran, but the Gryphon gave her no answer and only went faster. Behind them, the breeze carried the Mock Turtle's sad words along. They sounded fainter and fainter as Alice and the Gryphon hurried away.
        - id: ch01-b106
          speaker: gryphon
          text: Come on!
        - id: ch01-b107
          speaker: mock_turtle
          text: “Soo-oop of the e-e-evening, beautiful, beautiful Soup!”
          emotion: sad
