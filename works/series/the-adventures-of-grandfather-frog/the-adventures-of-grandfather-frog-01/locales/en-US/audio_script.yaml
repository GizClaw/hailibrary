  chapters:
    - id: ch01
      title: Billy Mink Finds Little Joe Otter
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Billy Mink raced along the edge of the Smiling Pool, then turned beside the Laughing Brook. Mischief sparkled in his eyes, and he was moving as fast as only Billy Mink could. Jerry Muskrat spotted him rushing past his house.
        - id: ch01-b02
          speaker: jerry_muskrat
          text: "Hello, Billy Mink! What's making you hurry so on this fine morning?"
        - id: ch01-b03
          speaker: billy_mink
          text: "I'm looking for Little Joe Otter. Have you seen him anywhere?"
        - id: ch01-b04
          speaker: jerry_muskrat
          text: "No. He's likely fishing down at the Big River. Last night, I heard him say he meant to go there."
        - id: ch01-b05
          speaker: billy_mink
          text: "Thank you!"
        - id: ch01-b06
          speaker: narrator
          text: Billy did not wait to say another word. Away he flashed, a little brown streak.
        - id: ch01-b07
          speaker: narrator
          text: Jerry stood watching until Billy had vanished from sight. He could not help wondering what had sent Billy off in such a hurry.
        - id: ch01-b08
          speaker: jerry_muskrat
          text: "Hmph! Billy Mink is in an awful hurry today. Why does he need to find Little Joe so badly? Those two are usually planning mischief whenever they put their heads together."
        - id: ch01-b09
          speaker: narrator
          text: Jerry climbed onto the roof of his house. He looked across the Smiling Pool, back toward the way Billy had come. Right away, he saw Grandfather Frog sound asleep on his big green lily pad. The legs of a foolish green fly still stuck out from one corner of the old frog's wide mouth. Grandfather Frog looked so funny that Jerry had to laugh.
        - id: ch01-b10
          speaker: jerry_muskrat
          text: "He ate a fine breakfast, and now that full stomach has made him drowsy. But he is getting careless as he grows older. Imagine falling asleep right there, where anyone can see him!"
        - id: ch01-b11
          speaker: narrator
          text: Then a new idea came to Jerry.
        - id: ch01-b12
          speaker: jerry_muskrat
          text: "Billy saw Grandfather Frog sleeping. That's why he's in such a rush to find Little Joe. They're surely planning a trick on Grandfather Frog, just as surely as pollywogs have tails!"
        - id: ch01-b13
          speaker: narrator
          text: Jerry's own eyes began to twinkle.
        - id: ch01-b14
          speaker: jerry_muskrat
          text: "Maybe I'll join in the fun."
        - id: ch01-b15
          speaker: narrator
          text: Without saying another word, Jerry slipped quietly into the water and swam across to Grandfather Frog's big green lily pad. Then he smacked the water sharply with his tail. Grandfather Frog's great goggly eyes sprang open. He was just about to make a frightened dive into the Smiling Pool, but then he recognized Jerry.
        - id: ch01-b16
          speaker: jerry_muskrat
          text: "Did you enjoy your nap?"
        - id: ch01-b17
          speaker: narrator
          text: Jerry wore a broad grin.
        - id: ch01-b18
          speaker: grandfather_frog
          text: "I was not asleep! I was only thinking."
          emotion: angry
        - id: ch01-b19
          speaker: jerry_muskrat
          text: "Isn't it a little dangerous to spend so long thinking with your eyes shut?"
        - id: ch01-b20
          speaker: grandfather_frog
          text: "Well, perhaps I dozed for just a moment."
        - id: ch01-b21
          speaker: jerry_muskrat
          text: "Perhaps you did. Now, listen closely."
        - id: ch01-b22
          speaker: narrator
          text: Jerry leaned over and whispered in Grandfather Frog's ear. Soon both friends were chuckling together over their private joke. Then Jerry swam home. Grandfather Frog closed his eyes again and made himself look exactly as he had while sleeping.
        - id: ch01-b23
          speaker: narrator
          text: Meanwhile, Billy Mink was hurrying along the Laughing Brook. Halfway to the Big River, he met Little Joe Otter carrying a big fish home. Little Joe was a wonderful fisherman. Billy quickly told him that Grandfather Frog had fallen fast asleep on his big green lily pad.
        - id: ch01-b24
          speaker: billy_mink
          text: "This is our perfect chance to play a trick on Grandfather Frog and give him a tremendous scare!"
        - id: ch01-b25
          speaker: narrator
          text: Little Joe set down his fish and grinned. He enjoyed a good prank almost as much as he enjoyed fishing.
        - id: ch01-b26
          speaker: little_joe_otter
          text: "What should we do?"
        - id: ch01-b27
          speaker: billy_mink
          text: "I already have a plan. Do you know where we could find Longlegs the Blue Heron?"
        - id: ch01-b28
          speaker: little_joe_otter
          text: "I do. I saw him fishing less than five minutes ago."
        - id: ch01-b29
          speaker: narrator
          text: Billy explained his plan. Laughing and giggling, the two little scamps hurried away to find Longlegs the Blue Heron.
