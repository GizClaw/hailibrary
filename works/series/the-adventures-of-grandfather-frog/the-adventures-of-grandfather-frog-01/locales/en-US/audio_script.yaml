        delivery: warm and lively storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    billy_mink:
      display_name: Billy Mink
      tts:
        delivery: quick and mischievous
        timbre: bright and nimble
        pace: brisk
        pitch: medium-high
    jerry_muskrat:
      display_name: Jerry Muskrat
      tts:
        delivery: curious and playfully knowing
        timbre: friendly and rounded
        pace: moderate
        pitch: medium
