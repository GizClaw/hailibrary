audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    billy_mink:
      display_name: 比利水貂
      tts:
        delivery: 机灵顽皮，说话干脆利落
        timbre: 清脆明亮
        pace: 偏快
        pitch: 中高音
    jerry_muskrat:
      display_name: 杰里麝鼠
      tts:
        delivery: 好奇风趣，打趣时透着机灵
        timbre: 温和清朗
        pace: 中等
        pitch: 中音
    grandfather_frog:
      display_name: 青蛙爷爷
      tts:
        delivery: 年长稳重，受窘时仍爱逞强
        timbre: 浑厚圆润
        pace: 稍慢
        pitch: 低音
    little_joe_otter:
      display_name: 小乔水獭
      tts:
        delivery: 开朗淘气，反应爽快
        timbre: 明快清润
        pace: 中快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第一章　比利水貂找到小乔水獭
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 比利水貂绕着微笑池跑过去，又转到欢笑溪边，顺着溪流匆匆赶路。他眼睛里闪着淘气的光，跑得别提多快了。说到这样赶路，谁也比不过比利。他经过杰里麝鼠家时，杰里一眼瞧见了他。
        - id: ch01-b02
          speaker: jerry_muskrat
          text: 嗨，比利水貂！这么好的早晨，你火急火燎地上哪儿去呀？
        - id: ch01-b03
          speaker: billy_mink
          text: 我去找小乔水獭。你瞧见他了吗？
        - id: ch01-b04
          speaker: jerry_muskrat
          text: 没瞧见。他大概去大河捕鱼了，昨晚我听他说要去。
        - id: ch01-b05
          speaker: billy_mink
          text: 谢啦！
        - id: ch01-b06
          speaker: narrator
          text: 比利连下一句话也没等，马上又跑了起来，像一道棕色的小闪电似的远去了。杰里留在原地，一直望到看不见他，才忍不住哼了一声。
        - id: ch01-b07
          speaker: jerry_muskrat
          text: 比利今天怎么这么急？他非得马上找到小乔，究竟想干什么？这两个家伙一碰头，准是在打淘气主意。
        - id: ch01-b08
          speaker: narrator
          text: 杰里爬到自家屋顶，越过微笑池，仔细望向比利来时的方向。没过一会儿，他就看见青蛙爷爷躺在那片大绿荷叶上，睡得正香。一只傻乎乎的绿苍蝇还露着几条腿，挂在他的大嘴角。青蛙爷爷那模样实在好笑，杰里看着看着，忍不住笑了出来。
        - id: ch01-b09
          speaker: jerry_muskrat
          text: 看来他今天早饭吃得不错。肚子一饱，眼皮就沉了。可他上了年纪，真是越来越粗心。没错，他实在太大意了。居然躺在大家都看得见的地方睡觉！
        - id: ch01-b10
          speaker: narrator
          text: 一个新念头忽然跳进杰里脑子里。
        - id: ch01-b11
          speaker: jerry_muskrat
          text: 比利肯定看见青蛙爷爷了，这才急着去找小乔。他们一定想捉弄青蛙爷爷，就跟蝌蚪一定长着尾巴一样准！瞧我也找点乐子去。
        - id: ch01-b12
          speaker: narrator
          text: 杰里一句话也没说，悄悄滑进水里，游到青蛙爷爷那片大绿荷叶旁。他抡起尾巴，使劲拍了一下水面。青蛙爷爷鼓鼓的大眼睛猛地睁开。他吓了一跳，正要一头扎进微笑池，抬眼却看见了杰里。
        - id: ch01-b13
          speaker: jerry_muskrat
          text: 睡得挺香吧？
        - id: ch01-b14
          speaker: grandfather_frog
          text: 谁说我睡了！我刚才明明是在想事情。
          emotion: angry
        - id: ch01-b15
          speaker: jerry_muskrat
          text: 闭着眼睛想了那么久，你就不怕出危险吗？
        - id: ch01-b16
          speaker: grandfather_frog
          text: 这个嘛……也许我刚才确实打了个小盹儿。
        - id: ch01-b17
          speaker: jerry_muskrat
          text: 也许吧。现在听我说。
        - id: ch01-b18
          speaker: narrator
          text: 杰里凑到青蛙爷爷耳边，压低声音嘀咕起来。他们俩很快都咯咯笑了，仿佛正在享受一个只有彼此明白的玩笑。你要知道，他们本来就是要好的朋友。说完以后，杰里游回了自己家。青蛙爷爷则重新闭上眼睛，故意摆出刚才睡着时一模一样的样子。
        - id: ch01-b19
          speaker: narrator
          text: 这段时候，比利一直沿着欢笑溪往前赶。走到通往大河的一半路程时，他迎面碰见小乔水獭正带着一条大鱼回家。小乔本来就是捕鱼能手。比利赶紧把刚才看到的事告诉他，说青蛙爷爷躺在大绿荷叶上，已经睡得又沉又香。
        - id: ch01-b20
          speaker: billy_mink
          text: 这个机会可太难得了！咱们正好逗逗青蛙爷爷，让他狠狠吓上一跳。
        - id: ch01-b21
          speaker: narrator
          text: 小乔把那条大鱼放到地上，咧开嘴笑了。说起恶作剧，他喜欢得不得了，几乎跟喜欢捕鱼一样。
        - id: ch01-b22
          speaker: little_joe_otter
          text: 那咱们怎么逗他？
        - id: ch01-b23
          speaker: billy_mink
          text: 我有办法。你知道上哪儿能找到长腿苍鹭吗？
        - id: ch01-b24
          speaker: little_joe_otter
          text: 知道。还不到五分钟前，我就看见他在捕鱼。
        - id: ch01-b25
          speaker: narrator
          text: 于是，比利把自己的计划从头到尾说给小乔听。两个小淘气越想越高兴，一路又笑又闹，急急忙忙去找长腿苍鹭了。
