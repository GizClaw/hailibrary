audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    grandfather_frog:
      display_name: 青蛙爷爷
      tts:
        delivery: 年长稳重，受窘时仍爱逞强
        timbre: 浑厚圆润
        pace: 稍慢
        pitch: 低音
    old_mr_toad:
      display_name: 老蟾蜍先生
      tts:
        delivery: 见多识广，直率中带着固执
        timbre: 粗粝厚实
        pace: 中速
        pitch: 中低音
    mr_redwing:
      display_name: 红翼鸫先生
      tts:
        delivery: 机警爽快，报信时干脆响亮
        timbre: 清脆明亮
        pace: 中快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第九章　老蟾蜍先生拜访青蛙爷爷
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 青蛙爷爷和老蟾蜍先生是表兄弟，这件事谁都知道。可你也许不知道，他们都出生在微笑池。没错，先生，真的是这样。小时候，他们都拖着长尾巴，有好一阵子连腿也没有。他们整天一起游，一起玩，从来没到岸上去过。那时候，他们一离开水就活不了。别人看见他们，也分不清谁是谁，只管他们叫蝌蚪，或者小蝌蚪。等到腿长出来，不靠尾巴也能行动了，他们才分开。
        - id: ch01-b02
          speaker: narrator
          text: 青蛙爷爷那时候当然还不是爷爷。他太喜欢微笑池了，怎么也舍不得走。外面的大世界有多奇妙，他听过不少，可他不相信会有哪个地方比微笑池更好。于是，他决定一辈子留在这里。
        - id: ch01-b03
          speaker: narrator
          text: 蟾蜍先生却正好相反。他的尾巴还没完全消失，就恨不得赶快离开微笑池，到大世界去看看。青蛙爷爷说尽了好话，也没能拦住他。蟾蜍先生出发时还小得很，躲在一片三叶草叶子下面，谁也瞧不见。青蛙爷爷以为，这辈子再也见不到他了。
        - id: ch01-b04
          speaker: narrator
          text: 可过了很久很久，蟾蜍先生竟然回来了。他已经长大了许多，青蛙爷爷第一眼差点儿没认出他。就在那次重逢时，两人争了起来。到底是去大世界好，还是留在从小长大的家好？他们都认定自己的选择最好。这场争论从那天一直持续到今天，谁也没有改变主意。
        - id: ch01-b05
          speaker: narrator
          text: 所以，老蟾蜍先生偶尔来微笑池探望表兄，两人准会重提这件事，争来争去没个完。青蛙爷爷险些噎死的那天，也没有例外。老蟾蜍先生听西风婆婆的一阵快乐小微风说起这件事，马上动身赶来问候。他还想告诉青蛙爷爷，幸亏斑点龟及时赶到，从他喉咙里拔出了那条鱼，自己听说以后真是高兴。
        - id: ch01-b06
          speaker: narrator
          text: 可青蛙爷爷从早到晚都在听大家挖苦他贪吃。微笑池周围的居民逮到这么好的机会，谁都不肯放过，都想取笑他几句。起初他还好脾气地听着，后来越听越恼火。等老蟾蜍先生赶到，他早已闷闷不乐。表弟说见他完全康复，心里真高兴，他却只哼了一声。
        - id: ch01-b07
          speaker: narrator
          text: 老蟾蜍先生装作没发现他的坏脾气，继续往下说。
        - id: ch01-b08
          speaker: old_mr_toad
          text: 你要是像我一样在大世界里待过这么久，一眼就能看出来，小乔水獭可不会平白无故送你一条鱼。
        - id: ch01-b09
          speaker: narrator
          text: 青蛙爷爷顿时气得浑身鼓了起来。他压低嗓门，粗声粗气地叫开了。
        - id: ch01-b10
          speaker: grandfather_frog
          text: 呱咕隆！呱咕隆！你回你的大世界去吧，蟾蜍先生。先学会别管旁人的闲事！
          emotion: angry
        - id: ch01-b11
          speaker: narrator
          text: 老蟾蜍先生也气得鼓了起来。他怒冲冲地瞪着青蛙爷爷，足足一分钟没能找回自己的舌头。等他终于说得出话了，冒出来的全是很不中听的句子。两人谁也不肯让谁，就这样吵了起来。
        - id: ch01-b12
          speaker: old_mr_toad
          text: 你从来没见过大世界，也不知道外面出了什么事，更不知道别人都在忙些什么。你这样活着，除了对自己，还有什么用？
          emotion: angry
        - id: ch01-b13
          speaker: grandfather_frog
          text: 我管好自己的事，也不去插手跟我无关的事。你念念不忘的大世界里，大家倒好像都爱多管闲事。聪明人该知道知足。你刚会跳就去了大世界，它到底给了你什么好处？你说呀！你身上连一套像样的衣裳都没有。
          emotion: angry
        - id: ch01-b14
          speaker: narrator
          text: 青蛙爷爷一边说，一边拍了拍自己那件黄白相间的背心。接着，他低头望向微笑池，得意地欣赏水里那件漂亮绿外套的倒影。老蟾蜍先生的衣裳又朴素又粗糙。听见表兄这样嘲笑自己，他的眼睛里立刻迸出了火星。
        - id: ch01-b15
          speaker: old_mr_toad
          text: 靠老实干活养活自己的人，没时间穿着漂亮衣裳坐在那儿看自己。我在大世界里至少学会了两件事。懒惰的人不会有好结果，还有，我知道怎么不把自己噎死。
          emotion: angry
        - id: ch01-b16
          speaker: narrator
          text: 青蛙爷爷听得火冒三丈，差一点儿又噎住。老蟾蜍先生的话句句都冲着他来。谁也不爱听别人当面说自己的难听话，尤其那话偏偏还是真的。青蛙爷爷正拼命琢磨着，要找一句同样刻薄的话顶回去。就在这时，坐在大山核桃树树梢上的红翼鸫先生忽然喊了起来。
        - id: ch01-b17
          speaker: mr_redwing
          text: 布朗农夫家的男孩来了！
        - id: ch01-b18
          speaker: narrator
          text: 青蛙爷爷马上忘了生气，神色紧张起来。他在那片大绿睡莲叶上不安地挪来挪去，做好了随时跳进微笑池的准备。布朗农夫家的男孩往常到这里来时，口袋里总是装满石子。青蛙爷爷想到那些石子，心里就害怕。
        - id: ch01-b19
          speaker: narrator
          text: 老蟾蜍先生却一点儿也不慌。他没有找地方躲，只是坐在那里咧嘴笑。
        - id: ch01-b20
          speaker: grandfather_frog
          text: 你可得小心！不然，以后再也来不了微笑池啦！
        - id: ch01-b21
          speaker: old_mr_toad
          text: 我不怕。布朗农夫家的男孩是我的朋友，我还会在他的菜园里帮忙呢。大世界教会我的另一件事，就是怎么交朋友。
        - id: ch01-b22
          speaker: grandfather_frog
          text: 呱咕隆！我可得让你明白——
        - id: ch01-b23
          speaker: narrator
          text: 青蛙爷爷到底想让他明白什么，老蟾蜍先生永远也没能听到。就在这时，青蛙爷爷已经看见了布朗农夫家的男孩。他连一句再见都顾不上说，便从大绿睡莲叶上一头跳进了微笑池。
