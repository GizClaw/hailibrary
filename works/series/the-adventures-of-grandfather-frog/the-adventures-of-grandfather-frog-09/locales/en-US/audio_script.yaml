  chapters:
    - id: ch01
      title: Old Mr. Toad Visits Grandfather Frog
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Grandfather Frog and old Mr. Toad are cousins. Of course, you probably knew that already. Everybody does. But many people do not know that the two cousins were born in the very same place, the Smiling Pool.
        - id: ch01-b02
          speaker: narrator
          text: Yes, Sir, they were. Both began life with long tails and no legs. They played and swam together, never going ashore. Back then, neither one could live out of the water. Anyone who saw them called them by the same names, tadpoles or pollywogs, because no one could tell them apart. But once their legs grew and their tails disappeared, the two cousins chose different paths.
        - id: ch01-b03
          speaker: narrator
          text: Grandfather Frog was not a grandfather yet, of course. He loved the Smiling Pool so much that he could not imagine leaving at all. He heard wonderful stories about the Great World, but he refused to believe any place could truly be nicer than his own pool. So he decided to stay there forever.
        - id: ch01-b04
          speaker: narrator
          text: Mr. Toad felt quite differently. He could hardly wait for his tail to vanish. Then he turned his back on the Smiling Pool and set out to see the Great World. Nothing Grandfather Frog said could stop him. Away he went, still small enough to hide beneath a clover leaf.
        - id: ch01-b05
          speaker: narrator
          text: Grandfather Frog thought he would never see his cousin again. A long, long time passed before Mr. Toad returned. By then, he had grown so much that Grandfather Frog barely recognized him.
        - id: ch01-b06
          speaker: narrator
          text: Right then and there, they began an argument that has never ended. Is it better to explore the Great World, or to remain in the home where you grew up? Each cousin was certain that he had made the wiser choice. Each one still thinks so today.
        - id: ch01-b07
          speaker: narrator
          text: Whenever old Mr. Toad visits the Smiling Pool, the same old argument soon begins. And that is exactly what happened after Grandfather Frog nearly choked to death.
        - id: ch01-b08
          speaker: narrator
          text: One of the Merry Little Breezes of Old Mother West Wind had told Mr. Toad what happened. At once, he started for the pool. He wanted to pay his respects and say how glad he was that Spotty the Turtle had arrived in time to pull the fish from Grandfather Frog's throat.
        - id: ch01-b09
          speaker: narrator
          text: All day, Grandfather Frog had heard unpleasant remarks about his greediness. Everyone around the pool saw a splendid chance to tease him. At first he took it good-naturedly. But the teasing went on and on, until he became thoroughly cross.
        - id: ch01-b10
          speaker: narrator
          text: By the time Mr. Toad arrived, Grandfather Frog was sulking. When his cousin said how glad he was to see him well again, Grandfather Frog answered with nothing but a grunt.
        - id: ch01-b11
          speaker: narrator
          text: Mr. Toad acted as if he had not noticed the bad temper. He simply kept talking.
        - id: ch01-b12
          speaker: mr_toad
          text: "If you'd spent as much time in the Great World as I have, you'd have known Little Joe Otter wasn't giving you that fish for free."
        - id: ch01-b13
          speaker: narrator
          text: Grandfather Frog puffed himself up with anger. His voice came out deeper and rougher than ever.
        - id: ch01-b14
          speaker: grandfather_frog
          text: "Chugarum! Chugarum! Go back to your Great World, Mr. Toad, and learn to keep your nose out of my business!"
          emotion: angry
        - id: ch01-b15
          speaker: narrator
          text: Now Mr. Toad began to swell with anger too. For a whole minute, he glared at Grandfather Frog. He was too indignant to speak. When his voice finally came back, he said some very unpleasant things, and the cousins plunged straight into their old dispute.
        - id: ch01-b16
          speaker: mr_toad
          text: "What good are you to anyone but yourself? You never see the Great World. You don't know what's happening or what anyone else is doing!"
          emotion: angry
        - id: ch01-b17
          speaker: grandfather_frog
          text: "I look after my own business. I don't meddle in things that have nothing to do with me, the way people seem to do in that Great World you talk about so much. Wise people are content with what they have. You've been hopping around the Great World all your life, and what good has it done you? Answer me that! You don't even have a respectable suit of clothes on your back."
          emotion: angry
        - id: ch01-b18
          speaker: narrator
          text: As he spoke, Grandfather Frog patted his white-and-yellow waistcoat. Then he admired the reflection of his handsome green coat in the Smiling Pool.
        - id: ch01-b19
          speaker: narrator
          text: Mr. Toad's eyes flashed. His own suit, as you know, was plain and rough.
        - id: ch01-b20
          speaker: mr_toad
          text: "People who earn their living by honest work don't have time to sit around in fancy clothes admiring themselves. The Great World has taught me that lazy people come to a bad end. And at least I know better than to choke myself to death!"
          emotion: angry
        - id: ch01-b21
          speaker: narrator
          text: Grandfather Frog was so furious that he almost choked again. Mr. Toad's words were painfully personal. No one likes an unpleasant personal remark, especially when it happens to be true.
        - id: ch01-b22
          speaker: narrator
          text: Grandfather Frog was trying his hardest to think of a sharp reply. Just then, Mr. Redwing called from the top of the big hickory tree.
        - id: ch01-b23
          speaker: mr_redwing
          text: "Farmer Brown's boy is coming!"
        - id: ch01-b24
          speaker: narrator
          text: Grandfather Frog forgot all about his anger. Now he looked worried. He shifted uneasily on his big green lily pad and prepared to dive into the Smiling Pool. He was afraid Farmer Brown's boy had brought a pocketful of stones, as he usually did when he came to the pool.
        - id: ch01-b25
          speaker: narrator
          text: Old Mr. Toad was not troubled at all. He did not even glance around for a hiding place. He stayed where he was and grinned.
        - id: ch01-b26
          speaker: grandfather_frog
          text: "You'd better be careful, or you'll never come visit the Smiling Pool again!"
        - id: ch01-b27
          speaker: mr_toad
          text: "Oh, I'm not afraid. Farmer Brown's boy is my friend. I help him in his garden. The Great World taught me how to make friends."
        - id: ch01-b28
          speaker: grandfather_frog
          text: "Chugarum! I'll have you know that—"
        - id: ch01-b29
          speaker: narrator
          text: But Mr. Toad never learned what Grandfather Frog wanted him to know. At that moment, Grandfather Frog caught sight of Farmer Brown's boy. Without even waiting to say goodbye, he dived into the Smiling Pool.
