audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    grandfather_frog:
      display_name: Grandfather Frog
      tts:
        delivery: dignified with a gruff edge
        timbre: deep and resonant
        pace: unhurried
        pitch: low
    mr_toad:
      display_name: Mr. Toad
      tts:
        delivery: worldly and plain-spoken
        timbre: dry and earthy
        pace: moderate
        pitch: medium-low
    mr_redwing:
      display_name: Mr. Redwing
      tts:
        delivery: alert and clear-calling
