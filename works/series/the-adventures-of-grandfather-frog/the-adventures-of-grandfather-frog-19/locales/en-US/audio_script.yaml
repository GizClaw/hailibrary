audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    grandfather_frog:
      display_name: Grandfather Frog
      tts:
        delivery: hearty and self-important
        timbre: deep and throaty
        pace: unhurried
        pitch: low
  chapters:
    - id: ch01
      title: Grandfather Frog Jumps into More Trouble
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Some people pay no attention and run into trouble. Others are foolish enough to walk right into it. Grandfather Frog was both careless and foolish, and he jumped straight into trouble. Once Striped Chipmunk told him where the spring was, he felt he could not get there soon enough.
        - id: ch01-b02
          speaker: narrator
          text: Grandfather Frog had lived his whole life in the Smiling Pool. Whenever he wanted a drink, he only had to lean over the edge of his big green lily pad. Whenever he grew too warm, he could cry, "Chugarum!" and dive headfirst into the cool water. Going without water for a long time was something he had never learned to bear.
        - id: ch01-b03
          speaker: narrator
          text: Jump, jump, jump! Off he went as fast as he could in the direction Striped Chipmunk had shown him. After every three or four jumps, he paused for one tiny rest. Then away he went again. Jump, jump, jump! Every leap was a long one. If Peter Rabbit had seen those leaps, he certainly would have been envious.
        - id: ch01-b04
          speaker: narrator
          text: At last, the ground beneath him began to feel damp. It grew damper as he went on, until it was truly wet. Soft, cool moss covered the ground there, and it felt wonderfully good beneath Grandfather Frog's tired feet.
        - id: ch01-b05
          speaker: grandfather_frog
          text: I must be almost there.
        - id: ch01-b06
          speaker: narrator
          text: He scrambled onto a large mossy hummock and looked around. At once he spotted a narrow path coming from the Long Lane. It passed right beside the hummock where he sat. Over the softest, wettest ground, someone had laid down old boards. Grandfather Frog could not make sense of them.
        - id: ch01-b07
          speaker: grandfather_frog
          text: This is a real path, all right. But why under the blue, blue sky would anyone spoil it by laying down those boards?
        - id: ch01-b08
          speaker: narrator
          text: You see, Grandfather Frog liked soft, wet mud. He could not imagine why anyone, even Farmer Brown's boy, would rather walk on a hard, dry path. Grandfather Frog had never worn shoes, of course. Why would anyone choose dry feet when wet feet were just as easy to have?
        - id: ch01-b09
          speaker: narrator
          text: He was still trying to understand it when a sound nearly made him lose his balance and tumble from the hummock. Someone was whistling. It was Farmer Brown's boy!
        - id: ch01-b10
          speaker: narrator
          text: Grandfather Frog knew that whistle at once. He had heard it many times near the Smiling Pool. Now it came from the Long Lane. Farmer Brown's boy had finished his dinner and was returning to search for Grandfather Frog where he had dropped him.
        - id: ch01-b11
          speaker: narrator
          text: Grandfather Frog actually grinned. What a surprise the boy would get when he found no sign of him! Then the grin froze on Grandfather Frog's face. The whistling was coming closer.
        - id: ch01-b12
          speaker: narrator
          text: Farmer Brown's boy had left the Long Lane and was following the little path. In truth, he was going to the spring for a drink. Grandfather Frog never thought of that. He felt certain the boy had somehow discovered which way he had gone and was coming to catch him.
        - id: ch01-b13
          speaker: narrator
          text: Grandfather Frog pressed himself as flat as he could against the big hummock and held his breath. Farmer Brown's boy walked straight past him. Just a few steps farther on, the boy stopped and knelt down.
        - id: ch01-b14
          speaker: narrator
          text: Peering through the grass, Grandfather Frog watched him scoop up beautiful clear water in an old cup and drink it. Now Grandfather Frog knew exactly where the spring was.
        - id: ch01-b15
          speaker: narrator
          text: A few minutes later, Farmer Brown's boy passed the hummock again. He was still whistling as he headed back toward the Long Lane. Grandfather Frog waited only until he was sure the boy had truly gone.
        - id: ch01-b16
          speaker: narrator
          text: Then Grandfather Frog bounded toward the spring with longer jumps than ever. After twelve great leaps, he could see the water. Two more jumps brought him close. With one last long leap, he landed in the spring with a splash!
        - id: ch01-b17
          speaker: grandfather_frog
          text: Chugarum! Oh, how good this water feels!
          emotion: happy
        - id: ch01-b18
          speaker: narrator
          text: And all the while, Grandfather Frog had jumped straight into more trouble.
