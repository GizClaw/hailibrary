audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    grandfather_frog:
      display_name: 青蛙爷爷
      tts:
        delivery: 年长稳重，受窘时仍爱逞强
        timbre: 浑厚圆润
        pace: 稍慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 第十九章　青蛙爷爷跳进更大的麻烦
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 有些人不留神，跑着跑着就惹上了麻烦。有些人犯糊涂，走着走着也会惹上麻烦。青蛙爷爷呢，两样都占了，所以他是一路跳进麻烦里去的。花栗鼠条纹才告诉他泉水在哪儿，他就急得一刻也等不了，恨不得马上赶到。
        - id: ch01-b02
          speaker: narrator
          text: 青蛙爷爷一辈子住在微笑池。想什么时候喝水都行，只要从那片碧绿的大睡莲叶边探下身子，随时都能喝个够。身上热了，他喊一声“咕咕隆”，再一头扎进清凉的池水里，也就舒服了。他从来没试过这么久没有水喝。
        - id: ch01-b03
          speaker: narrator
          text: 跳，跳，跳！青蛙爷爷朝花栗鼠条纹指的方向拼命赶。每跳三四下，他就停住，歇上短得不能再短的一小会儿，然后又接着跳，跳，跳。每一下都蹦得老远。兔子彼得要是看见了，准会羡慕得不得了。
        - id: ch01-b04
          speaker: narrator
          text: 地面终于一点点潮起来。青蛙爷爷越往前，泥土就越湿。没过多久，脚下已经湿漉漉的，好大一片地方都长着又软又凉、吸足了水的苔藓。青蛙爷爷那双可怜的脚早就累坏了，踩上去别提多舒服了。
        - id: ch01-b05
          speaker: grandfather_frog
          text: 我准是快到了。
        - id: ch01-b06
          speaker: narrator
          text: 青蛙爷爷费力爬上一座长满苔藓的大土墩，坐在上面朝四周望了望。他马上看见一条小路从长巷那边伸来，正好经过这座土墩。接着他又发现，最松软、最泥泞的那段路上，竟铺了几块旧木板。青蛙爷爷怎么也想不通。
        - id: ch01-b07
          speaker: grandfather_frog
          text: 这明明是一条好好的路。可青天在上，到底是谁非要铺上这些木板，把路糟蹋了呢？
        - id: ch01-b08
          speaker: narrator
          text: 青蛙爷爷最喜欢松软的湿泥。他不明白，怎么会有人宁愿走又硬又干的路，就算是农夫布朗家的男孩也不该这样想呀。青蛙爷爷从没穿过鞋，哪里会懂，明明可以把脚弄湿，为什么还有人偏要脚底干爽。
        - id: ch01-b09
          speaker: narrator
          text: 他还在琢磨，忽然听到一个声音，身子差点失去平衡，从土墩上滚下来。那是口哨声，是农夫布朗家的男孩！青蛙爷爷在微笑池常听见这阵口哨，一下就认出来了。声音正从长巷那边传来。男孩吃过午饭，正往回走，要到青蛙爷爷先前掉下来的地方找他。
        - id: ch01-b10
          speaker: narrator
          text: 青蛙爷爷想到男孩找不到自己的一点踪影，一定会大吃一惊，竟咧开嘴笑了。可下一刻，笑容就像冻住一样僵在了脸上。口哨声越来越近！男孩已经离开长巷，走上了这条小路。
        - id: ch01-b11
          speaker: narrator
          text: 其实，男孩只是来泉边喝水，青蛙爷爷压根没想到这一层。他认定男孩不知用了什么办法，已经查出了他的去向，现在正追过来。他赶紧伏在土墩上，能趴多低就趴多低，连气也不敢喘。男孩径直从他身边走过去，又走了几步，停下来跪在地上。
        - id: ch01-b12
          speaker: narrator
          text: 青蛙爷爷从草叶缝里偷偷看着。男孩拿一只旧杯子，舀起清澈的泉水喝了下去。这一下，青蛙爷爷总算知道泉眼究竟在哪儿了。
        - id: ch01-b13
          speaker: narrator
          text: 几分钟后，男孩又经过这里，一路吹着口哨，朝长巷走去。青蛙爷爷等到确定他真的走远了，立刻用比刚才更大的步子跳向泉眼。长长地跳了十二下，他已经看见水了。再跳两下，最后奋力一跃。扑通！他落进了泉水里。
        - id: ch01-b14
          speaker: grandfather_frog
          text: 咕咕隆！这水泡着可真舒服！
          emotion: happy
        - id: ch01-b15
          speaker: narrator
          text: 可青蛙爷爷一点也不知道，自己这一路跳啊跳，竟又径直跳进了更大的麻烦里。
