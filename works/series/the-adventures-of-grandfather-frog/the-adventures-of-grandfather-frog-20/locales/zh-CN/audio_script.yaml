audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    grandfather_frog:
      display_name: 青蛙爷爷
      tts:
        delivery: 年长稳重，受窘时仍爱逞强
        timbre: 浑厚圆润
        pace: 稍慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 第二十章　青蛙爷爷泄了气
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 起跳之前先看清，水深水浅要当心。这忠告再好不过，可大多数人偏要等到吃了亏，才知道它说得有道理。青蛙爷爷就是这样。这首小诗，他从小听到老。每逢有人来微笑池向他讨教，他还常常把这两句念给对方听。
        - id: ch01-b02
          speaker: narrator
          text: 可青蛙爷爷离开微笑池，动身去闯荡大世界时，好像把自己的智慧全落在了家里。一个人总是给别人出主意，轮到自己听劝，就不那么容易了。所以，这趟糊涂的旅程才刚开始，他已经一回又一回地惹上麻烦。现在，他又掉进了一个新麻烦，还是脑袋朝下，扑通一声栽进去的。
        - id: ch01-b03
          speaker: narrator
          text: 青蛙爷爷刚才看见泉水又清凉又闪亮，哪里还能多等一秒？他又热又干，渴得厉害，浑身都难受极了。于是，哎呀呀，他起跳前连一眼也没看。真的，一眼都没看！他只管纵身一跃，远远地跳进水里。
        - id: ch01-b04
          speaker: narrator
          text: 啊，泡在水里真舒服！头几分钟，青蛙爷爷什么也顾不上想。这里是泉眼，水比微笑池更凉，可越凉越痛快。他干脆闭上眼睛，漂在水面上，别提多快活了。
        - id: ch01-b05
          speaker: narrator
          text: 过了一会儿，青蛙爷爷睁开眼，朝周围看了看。他飞快地眨了一阵眼睛，又使劲揉了揉，生怕自己看错了。可他的一颗心还是直往下沉，像是一直沉到了脚趾头。
        - id: ch01-b06
          speaker: grandfather_frog
          text: 咕咕隆！咕咕隆！
          emotion: surprised
        - id: ch01-b07
          speaker: narrator
          text: 喊完这两声，青蛙爷爷好半天没再开口。原来，他四周全是笔直又光滑的高墙。抬头望去，只能看到正上方一小片蓝蓝的天空，还有树木和灌木丛里沙沙作响的叶子。墙沿上垂着青草，可那些草离他的头顶实在太远，远得吓人。这里根本没有地方能让他爬出去！青蛙爷爷掉进了一座牢狱。他一点也不明白这是怎么回事，可事实就是这样。
        - id: ch01-b08
          speaker: narrator
          text: 农夫布朗家的男孩要是在场，当然能把这件事说清楚。很久以前，农夫布朗发现了这眼泉。泉水清凉又干净，他就把四周的泥土和杂物全清走了。然后，他找来一只干净的木桶，敲掉桶底，又在泉水从沙里冒出来的地方挖了一个坑，把木桶放进去。桶底下铺满了洁白干净的沙，泉水就能透过沙层往上涌。
        - id: ch01-b09
          speaker: narrator
          text: 农夫布朗还在木桶半腰开了一个小孔。底下冒进来多少泉水，就会有多少水从孔里流走。水涨到小孔那里便流出去了，所以永远也装不满木桶。这样一来，小孔上方就留下一大截笔直光滑的桶壁。青蛙爷爷困在里面，无论如何也跳不过这么高的墙。
        - id: ch01-b10
          speaker: narrator
          text: 可怜的青蛙爷爷！他从来没有像现在这样后悔，真不该离开微笑池，跑出来见识什么大世界。他绕着桶里游了一圈又一圈，还是找不到出去的路。水流出去的那个小孔太窄，他挤不过去。为了弄清这一点，他已经试了又试。在青蛙爷爷看来，自己这一辈子都只能困在这里了。
        - id: ch01-b11
          speaker: narrator
          text: 更糟的是，青蛙爷爷知道农夫布朗家的男孩有时会来泉边喝水，因为他亲眼见过。男孩下次再来，一定马上就会发现他，桶里连一个藏身的地方都没有。
        - id: ch01-b12
          speaker: narrator
          text: 想到这里，青蛙爷爷彻底泄了气。真的，他一点希望也没有了。他认定自己再也回不到微笑池。两颗大大的泪珠，从他那双凸鼓鼓的大眼睛里滚了下来。
