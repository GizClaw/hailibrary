audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    grandfather_frog:
      display_name: Grandfather Frog
      tts:
        delivery: dignified with a gruff edge
        timbre: deep and resonant
        pace: unhurried
        pitch: low
  chapters:
    - id: ch01
      title: Grandfather Frog Loses Heart
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Look before you leap. The water may be deep.
        - id: ch01-b02
          speaker: narrator
          text: That is some of the best advice anyone can give. The trouble is, most people do not understand how good it is until too late. That was what happened to Grandfather Frog. He had known that little verse all his life. In fact, he often repeated it when visitors came to the Smiling Pool and asked him what they should do.
        - id: ch01-b03
          speaker: narrator
          text: But when Grandfather Frog left the Smiling Pool to explore the Great World, he seemed to leave all his wisdom behind. When everyone has always come to you for advice, it can be very hard to turn around and follow advice yourself. Ever since he began this foolish trip, Grandfather Frog had stumbled into one scrape after another. Now he had landed headfirst in yet another one, with a tremendous splash.
        - id: ch01-b04
          speaker: narrator
          text: The moment he saw the spring's cool, sparkling water, he felt he could not wait another second to get in. He was hot and dry. He was terribly thirsty and thoroughly uncomfortable. So, dear me, he never stopped to look before he leaped. No, sir! Grandfather Frog took one great, long jump and dived straight in.
        - id: ch01-b05
          speaker: narrator
          text: Oh, how wonderful that water felt! For the first few minutes, he could think of nothing else. Spring water was colder than the water in the Smiling Pool, but that only made it feel better. Grandfather Frog shut his eyes and floated there, perfectly happy.
        - id: ch01-b06
          speaker: narrator
          text: After a while, he opened his eyes and looked around. Then he blinked very fast for a minute. He even rubbed his eyes to make certain he was seeing clearly. As he stared, his heart seemed to sink all the way down toward his toes.
        - id: ch01-b07
          speaker: grandfather_frog
          text: Chugarum! Chugarum!
          emotion: surprised
        - id: ch01-b08
          speaker: narrator
          text: After that, Grandfather Frog did not say another word for a long time.
        - id: ch01-b09
          speaker: narrator
          text: This was what he saw. Smooth, perfectly straight walls rose on every side of him. When he looked directly overhead, he could see one small patch of deep blue sky. He could see the leaves of trees and bushes whispering in the breeze. Grasses bent over the rim of the wall. But all of it was high above his head, dreadfully high. There was nowhere at all for him to climb out. Grandfather Frog was trapped in a prison. He could not understand how it had happened, but there he was.
        - id: ch01-b10
          speaker: narrator
          text: Farmer Brown's boy could have explained everything. Long before this, Farmer Brown had discovered the spring. Its water was so clear, cold, and pure that he cleaned away all the dirt and rubbish around it. Then he took a nice, clean barrel and knocked out its bottom.
        - id: ch01-b11
          speaker: narrator
          text: Farmer Brown dug down to the place where the water bubbled through the sand. He set the open-bottomed barrel into the hole, then covered the bottom with clean white sand. That let the spring water keep bubbling up inside the barrel.
        - id: ch01-b12
          speaker: narrator
          text: About halfway up the barrel, Farmer Brown cut a small opening. Water could flow out through it just as quickly as fresh water bubbled in below. That meant the barrel could never fill to the top. As soon as the water reached the opening, it ran away. Above the water stood a tall, straight, smooth wall. From inside the barrel, it was far too high for Grandfather Frog to jump over.
        - id: ch01-b13
          speaker: narrator
          text: Poor old Grandfather Frog! More than ever, he wished he had never even thought about leaving the Smiling Pool to see the Great World. He swam around and around, searching everywhere, but found no way to escape.
        - id: ch01-b14
          speaker: narrator
          text: He tried the little opening where the water flowed out. It was much too small for him to squeeze through. He tried again and again, but it was no use. As far as Grandfather Frog could tell, he would have to remain inside that barrel for the rest of his life.
        - id: ch01-b15
          speaker: narrator
          text: And there was something even worse. Grandfather Frog knew that Farmer Brown's boy sometimes visited the spring for a drink. He had seen the boy come there before. The next time Farmer Brown's boy arrived, he was certain to discover Grandfather Frog, because the barrel offered no place to hide.
        - id: ch01-b16
          speaker: narrator
          text: When Grandfather Frog thought about that, he lost heart. Yes, sir, he lost heart completely. He gave up every hope of ever seeing the Smiling Pool again. Then two big tears rolled from his great goggly eyes.
