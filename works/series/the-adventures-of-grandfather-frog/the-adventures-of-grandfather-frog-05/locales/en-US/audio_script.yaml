  chapters:
    - id: ch01
      title: Grandfather Frog Jumps Just in Time
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Whitetail the Marsh Hawk sailed back and forth above the Green Meadows. Like Longlegs the Blue Heron, he was hungry. His sharp eyes searched the grass for something to eat. But it seemed as if some good fairy had warned all the little meadow people that Whitetail was hunting. Perhaps one of Old Mother West Wind's children had warned them. The Merry Little Breezes were always darting about, looking for a chance to help someone.
        - id: ch01-b02
          speaker: narrator
          text: From dawn until dusk, they loved to dance, romp, and play through the long day. But they loved something else even more. Whenever they found a chance to do someone a kind favor, they took it.
        - id: ch01-b03
          speaker: narrator
          text: However it happened, little Mr. Green Snake knew enough to stay hidden. Danny Meadow Mouse was nowhere to be seen. Whitetail found only a few foolish grasshoppers. They made him even hungrier. Still, old Whitetail did not give up easily. He kept hunting across the Green Meadows, back and forth, until he had searched everywhere. At last, he decided he was wasting his time.
        - id: ch01-b04
          speaker: whitetail
          text: "I'll check the Smiling Pool. If there's nothing there, I'll circle over the Big River a few times."
        - id: ch01-b05
          speaker: narrator
          text: He headed straight for the Smiling Pool. Long before he arrived, those keen eyes spotted Longlegs the Blue Heron standing perfectly still at the water's edge. From the way Longlegs stared, Whitetail knew he was waiting to catch something.
        - id: ch01-b06
          speaker: whitetail
          text: "If he's watching a fish, that won't help me. I can't fish. But if he's after a frog, well, frogs aren't as tasty as fat meadow mice, but one would certainly fill me up."
        - id: ch01-b07
          speaker: narrator
          text: Whitetail flew a little faster. Then he saw exactly what Longlegs was watching. There sat Grandfather Frog on his big green lily pad. Whitetail sighed with satisfaction. Grandfather Frog would make a very filling meal indeed.
        - id: ch01-b08
          speaker: narrator
          text: Longlegs was watching Grandfather Frog so closely that he noticed nothing else. Grandfather Frog was just as busy watching Longlegs, and he forgot that danger might come from somewhere else. His back was turned toward Whitetail. The marsh hawk could hardly keep from chuckling. He had tried many times to catch Grandfather Frog, but the old frog had always seen him while he was still far away.
        - id: ch01-b09
          speaker: narrator
          text: But even with his wonderful eyesight, Whitetail had missed someone sitting out in plain view. His thoughts were so fixed on Grandfather Frog and Longlegs that he had forgotten to look around as he usually did.
        - id: ch01-b10
          speaker: narrator
          text: Whitetail skimmed over the tops of the bulrushes and swept across the Smiling Pool. He stretched out his great, cruel claws to seize Grandfather Frog. The old frog sat there pretending to sleep. All the while, he watched Longlegs and chuckled deep inside because he thought he was fooling the heron.
        - id: ch01-b11
          speaker: narrator
          text: Slap! Jerry Muskrat's tail struck the water. Grandfather Frog knew that sound meant danger. He did not know what the danger was, and he did not wait to find out. He could do that later. When Jerry slapped the water that way, danger was very close.
        - id: ch01-b12
          speaker: grandfather_frog
          text: "Chugarum!"
          emotion: fearful
        - id: ch01-b13
          speaker: narrator
          text: Grandfather Frog dived headfirst into the Smiling Pool. Whitetail was so close that water splashed right into his face. His claws snatched wildly, but all they caught was a piece of the big green lily pad where Grandfather Frog had been sitting. A piece of lily pad was no use at all to an empty stomach.
        - id: ch01-b14
          speaker: narrator
          text: Whitetail screamed with anger and disappointment. He wheeled around in the air and flew straight at Jerry Muskrat. Jerry only laughed in the most provoking way, then ducked beneath the water.
