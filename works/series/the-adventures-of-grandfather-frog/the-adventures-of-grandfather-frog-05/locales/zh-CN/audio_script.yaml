audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    whitetail_hawk:
      display_name: 白尾泽鹰
      tts:
        delivery: 精明执着，盘算猎物时透着急切
        timbre: 锐利而略显沙哑
        pace: 中快
        pitch: 中音
    grandfather_frog:
      display_name: 青蛙爷爷
      tts:
        delivery: 年长稳重，受窘时仍爱逞强
        timbre: 浑厚圆润
        pace: 稍慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 第五章　青蛙爷爷及时一跳
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 白尾泽鹰在绿草地上空飞来飞去。他和长腿苍鹭一样，也饿着肚子。那双锐利的眼睛不停往草丛里瞧，想找点东西吃。可草地上的小居民似乎都得了信，知道白尾正在打猎，一个个藏得不见踪影。
        - id: ch01-b02
          speaker: narrator
          text: 也许，是哪位好心的仙女给大家报了信。没准儿就是西风婆婆的孩子，那些快乐的小微风。它们总爱到处飞，碰上能帮忙的机会，可从来不会错过。
        - id: ch01-b03
          speaker: narrator
          text: 从清晨一直玩到天黑，它们爱跳爱闹，快活不歇。可要是能把好心送给别人，那才是它们最喜欢的事。
        - id: ch01-b04
          speaker: narrator
          text: 不管是谁送的信，小绿蛇先生反正藏得好好的，丹尼田鼠也找不到。白尾费了半天工夫，只逮住几只傻蚱蜢，吃完反倒更饿。不过，老白尾很有韧劲。运气再坏，他还是一趟又一趟地寻找，直到飞遍整片绿草地，才觉得留在这里是在白费时间。
        - id: ch01-b05
          speaker: whitetail_hawk
          text: 我再去微笑池看看。要是那边也没吃的，我就沿大河飞上几个来回。
        - id: ch01-b06
          speaker: narrator
          text: 白尾打定主意，马上朝微笑池飞去。还离得老远，他就看见长腿苍鹭站在池边，一动也不动。只看长腿的样子，白尾便明白，他一定盯上了什么猎物，正等着下手。
        - id: ch01-b07
          speaker: whitetail_hawk
          text: 要是鱼，那就算了，我可不会捕鱼。可要是青蛙呢？虽然没有肥田鼠香，倒也能把肚子填得满满的。
        - id: ch01-b08
          speaker: narrator
          text: 白尾越想越急，飞得更快了。这一回，他终于看清长腿在盯什么。原来，青蛙爷爷正坐在那片大绿荷叶上。老白尾满意地长出一口气。青蛙爷爷这么大个儿，吃下去一定很顶饱。
        - id: ch01-b09
          speaker: narrator
          text: 长腿苍鹭只顾盯着青蛙爷爷，周围别的东西一概没瞧见。青蛙爷爷呢，又把全部心思放在长腿身上，忘了危险也许会从别处来。偏偏他的后背正朝着老白尾。
        - id: ch01-b10
          speaker: narrator
          text: 白尾看见这个大好机会，几乎笑出了声。从前他一次又一次想捉青蛙爷爷，可每回还没等靠近，对方早就发现他了。今天的情形可不一样。
        - id: ch01-b11
          speaker: narrator
          text: 可白尾也漏看了一个家伙。那家伙明明坐在显眼的地方，他却满脑子只有青蛙爷爷和长腿苍鹭，忘了照平常那样四处查看。
        - id: ch01-b12
          speaker: narrator
          text: 白尾贴着香蒲尖迅速飞过，转眼掠到微笑池上空。他伸出又大又凶的利爪，直抓青蛙爷爷。青蛙爷爷还在荷叶上装睡。他一直偷眼看着长腿，心里正乐呢，只当自己的把戏把长腿骗住了。
        - id: ch01-b13
          speaker: narrator
          text: 啪！杰里麝鼠的尾巴重重拍在水面上。青蛙爷爷一听就懂，这是在说有危险！至于危险是什么，他不知道，也根本没工夫查明白。等逃开了再弄清楚也来得及。杰里这样拍水，准是危险已经到了跟前。
        - id: ch01-b14
          speaker: grandfather_frog
          text: 咕咕隆！
          emotion: fearful
        - id: ch01-b15
          speaker: narrator
          text: 青蛙爷爷吓得叫出声来，一头扎进微笑池。白尾已经逼得太近，池水一溅，正好扑了他满脸。他慌慌张张地挥动大爪子，却只抓下一块绿荷叶。青蛙爷爷刚才还坐在上面，可一片荷叶哪能填饱空肚子呢？
        - id: ch01-b16
          speaker: narrator
          text: 白尾失望极了，也气坏了。他尖叫着在空中转过身，径直扑向杰里麝鼠。杰里却笑得说不出的气人，随即往水下一钻，不见了。
