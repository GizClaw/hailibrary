  chapters:
    - id: ch01
      title: Spotty the Turtle Plays Doctor
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Everyone will agree that greed is a dreadful thing to see.
        - id: ch01-b02
          speaker: narrator
          text: At first, Little Joe Otter nearly laughed himself sick on the bank of the Smiling Pool. Grandfather Frog was trying to swallow a fish almost as big as he was. His white and yellow waistcoat was already stuffed with foolish green flies, and there was no room for another bite. It would have been disgusting if it had not looked so very funny.
        - id: ch01-b03
          speaker: narrator
          text: The fish was stuck, and its tail hung from Grandfather Frog's big mouth. He tried his very best to swallow it. He hitched one way, then the other, all over his big green lily pad. Twice he tumbled into the Smiling Pool with a splash. Each time, he scrambled back up and rolled his great goggly eyes at Little Joe. He could not speak, but those eyes were begging Little Joe to come and help him.
        - id: ch01-b04
          speaker: narrator
          text: But Little Joe had to hold his sides because he was laughing so hard. He did not understand that Grandfather Frog was truly in trouble. Then Billy Mink and Jerry Muskrat came along. The moment they saw him, they laughed too. They laughed and laughed until tears ran down their faces. They rolled over and over on the bank and kicked their heels for the sheer fun of it. They had not seen anything so funny in a long, long time.
        - id: ch01-b05
          speaker: billy_mink
          text: "Have you ever seen anyone so greedy?"
        - id: ch01-b06
          speaker: little_joe_otter
          text: "Pull the fish back out, and try again!"
        - id: ch01-b07
          speaker: narrator
          text: Pulling it out was exactly what Grandfather Frog was trying to do. Starting over was the last thing he wanted. He had no wish at all to swallow that fish again. Just then, he felt he never, never wanted to see another fish for as long as he lived.
        - id: ch01-b08
          speaker: narrator
          text: A frog's hands are not made to grip slippery things, and a fish's tail is very slippery indeed. Grandfather Frog tried first with one hand. Then he tried the other, and at last he used both. It did no good at all. He could not budge that fish, and it had gone too far down for him to cough it up. He kept clawing at the tail while it waved outside his mouth. The funnier he looked, the harder Little Joe, Billy, and Jerry laughed. Their laughter made a tremendous noise beside the Smiling Pool.
        - id: ch01-b09
          speaker: narrator
          text: Their noise reached Spotty the Turtle, who had been taking a sunbath at the end of an old log. He slipped into the water and went to find out what was happening. Spotty is very, very slow on land, but he is a good swimmer. He hurried through the water because he did not want to miss the fun. When he arrived, he could not see Grandfather Frog at first.
        - id: ch01-b10
          speaker: spotty_turtle
          text: "What is everyone laughing about?"
        - id: ch01-b11
          speaker: narrator
          text: Little Joe could not even answer. He had laughed so much that no words would come, so he simply pointed at Grandfather Frog. Spotty looked over at the big green lily pad and began to laugh as well. Then he saw great tears rolling down from Grandfather Frog's eyes. He heard the little choking sounds coming from him. Spotty stopped laughing at once and swam straight toward the lily pad.
        - id: ch01-b12
          speaker: narrator
          text: Spotty went as fast as he could swim. He climbed right up beside Grandfather Frog on the big green lily pad. Then he reached out and caught the end of the fish's tail in his beaklike mouth. Spotty settled back and pulled with all his strength. Grandfather Frog settled back and pulled from the other direction.
        - id: ch01-b13
          speaker: narrator
          text: Splash! Grandfather Frog fell backward into the Smiling Pool on one side of the lily pad. Splash! Spotty fell backward into the water on the other side. The troublesome fish floated between them.
        - id: ch01-b14
          speaker: grandfather_frog
          text: "Thank you! Thank you! Another minute, and I would have choked to death."
        - id: ch01-b15
          speaker: narrator
          text: Grandfather Frog gasped the words as he crawled weakly back onto the lily pad.
        - id: ch01-b16
          speaker: spotty_turtle
          text: "Don't mention it."
        - id: ch01-b17
          speaker: grandfather_frog
          text: "I never, never will."
