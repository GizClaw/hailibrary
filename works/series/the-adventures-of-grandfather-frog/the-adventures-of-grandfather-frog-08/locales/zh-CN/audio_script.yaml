audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    grandfather_frog:
      display_name: 青蛙爷爷
      tts:
        delivery: 年长稳重，受窘时仍爱逞强
        timbre: 浑厚圆润
        pace: 稍慢
        pitch: 低音
    little_joe_otter:
      display_name: 小乔水獭
      tts:
        delivery: 开朗淘气，反应爽快
        timbre: 明快清润
        pace: 中快
        pitch: 中高音
    billy_mink:
      display_name: 比利水貂
      tts:
        delivery: 顽皮爽朗，笑意藏不住
        timbre: 清脆明亮
        pace: 中快
        pitch: 中高音
    jerry_muskrat:
      display_name: 杰里麝鼠
      tts:
        delivery: 随和活泼，反应直率
        timbre: 轻快柔和
        pace: 中速
        pitch: 中音
    spotty_turtle:
      display_name: 斑点龟
      tts:
        delivery: 厚道沉着，遇事立刻认真
        timbre: 温和结实
        pace: 稍慢
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第八章　斑点龟当医生
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 贪吃模样真糟糕，这话人人都说好。
        - id: ch01-b02
          speaker: narrator
          text: 小乔水獭坐在微笑池岸边，看着眼前的一幕，笑得肚子发疼，几乎要笑出病来。青蛙爷爷正坐在大绿睡莲叶上，拼命想吞下一条几乎和自己一样大的鱼。可他那件黄白背心已经被傻乎乎的绿头苍蝇撑得鼓鼓的，哪儿还有地方装别的东西呢？
        - id: ch01-b03
          speaker: narrator
          text: 那副贪吃相本来挺叫人厌恶，可眼前实在太好笑了。至少一开始，小乔只觉得好笑。鱼卡在青蛙爷爷的喉咙里，尾巴还伸在大嘴巴外边。他一会儿挪向这边，一会儿扭向那边，使足了劲往下咽。结果，他接连两次“扑通”掉进池里。每一次，他都手忙脚乱地爬回睡莲叶，再转着一双大鼓眼睛，一声不出地求小乔帮忙。
        - id: ch01-b04
          speaker: narrator
          text: 小乔只顾捂着肚子笑，根本没明白青蛙爷爷真的有危险。比利水貂和杰里麝鼠刚好走来，一看见这个场面，也笑个不停。他们笑啊笑啊，一直笑出了眼泪，还在岸上翻来滚去，快活得两只脚乱蹬。这可是他们好久好久没见过的滑稽事了。
        - id: ch01-b05
          speaker: billy_mink
          text: 你们见过谁贪吃成这个样子吗？
        - id: ch01-b06
          speaker: little_joe_otter
          text: 干吗不把鱼拔出来，再从头吞一遍呀？
        - id: ch01-b07
          speaker: narrator
          text: 青蛙爷爷确实在拔鱼。至于再吞一遍，他可连一丁点儿这样的心思都没有。那一刻，他甚至觉得自己这辈子再也不愿看见鱼。偏偏青蛙的手天生就抓不住滑东西，鱼尾巴又滑得厉害。他先用一只手，再换另一只，最后两只手一起抓。办法全试过了，那条鱼还是一动不动。
        - id: ch01-b08
          speaker: narrator
          text: 鱼已经顺着喉咙下去太远，青蛙爷爷想咳也咳不出来。他越是伸手乱挠那条摇摆的尾巴，样子就越可笑，小乔、比利和杰里也笑得越响。那阵喧闹惊动了斑点龟。他原本趴在一截老木头的末端晒太阳，这会儿滑进水里，游过来瞧瞧究竟出了什么事。
        - id: ch01-b09
          speaker: narrator
          text: 斑点龟在岸上慢得很，游起水来却是一把好手。他赶紧往前游，生怕错过热闹。刚到那里，他还没瞧见青蛙爷爷。
        - id: ch01-b10
          speaker: spotty_turtle
          text: 你们到底在笑什么呀？
        - id: ch01-b11
          speaker: narrator
          text: 小乔已经笑得连一个字也说不出，只能抬手指向青蛙爷爷。斑点龟朝大绿睡莲叶一看，也跟着笑了。可紧接着，他发现大颗的眼泪正从青蛙爷爷眼里滚下来，喉咙里还发出微弱的哽噎声。斑点龟马上收住笑，用自己最快的速度游了过去。
        - id: ch01-b12
          speaker: narrator
          text: 他径直爬上睡莲叶，伸长脖子，用鸟喙一样的嘴牢牢夹住鱼尾巴。然后，斑点龟把身子往后一沉，使劲地拔。青蛙爷爷也向后仰着，使劲地拔。“扑通！”青蛙爷爷仰面掉进睡莲叶这边的池水。“扑通！”斑点龟也仰面掉进了另一边。再看那条惹出所有麻烦的鱼，已经漂在水面上了。
        - id: ch01-b13
          speaker: narrator
          text: 青蛙爷爷已经浑身无力。他好不容易爬回睡莲叶，只能趴在那里大口喘气。
        - id: ch01-b14
          speaker: grandfather_frog
          text: 谢谢！谢谢你！要是再晚一分钟，我就活活噎死了。
        - id: ch01-b15
          speaker: spotty_turtle
          text: 不用谢，别再提了。
        - id: ch01-b16
          speaker: grandfather_frog
          text: 我保证，永远、永远也不再提啦。
