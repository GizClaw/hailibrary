  chapters:
    - id: ch01
      title: Grandfather Frog Keeps On
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Grandfather Frog was old and wise, but even old age can be foolish. I am sure you will agree that his stubbornness was as mulish as could be. He thought he knew best, and once he chose his path, it was very hard to turn him around.
        - id: ch01-b02
          speaker: narrator
          text: Grandfather Frog felt sure his very last day had come. There he was on the Green Meadows, far from his dear, safe Smiling Pool, with Bowser the Hound in charge of him. Whenever Grandfather Frog moved, Bowser flipped him onto his back. Then Bowser danced around him, barking with delight. Grandfather Frog expected those terrible teeth at any moment, and the thought made him cold. At last, he saw that he could not escape. He lay still, too tired and frightened to do anything else.
        - id: ch01-b03
          speaker: narrator
          text: That spoiled Bowser's game. What Bowser liked was watching the old frog leap and kick his long legs. He tossed Grandfather Frog into the air two or three times, but each time the frog landed, he stayed exactly where he fell.
        - id: ch01-b04
          speaker: bowser_the_hound
          text: "Bow, wow, wow!"
        - id: ch01-b05
          speaker: narrator
          text: Grandfather Frog did not even blink his great goggly eyes. Bowser sniffed him from one end to the other.
        - id: ch01-b06
          speaker: bowser_the_hound
          text: "I suppose I scared him to death. I never meant to do that. I only wanted to play with him."
        - id: ch01-b07
          speaker: narrator
          text: Bowser gave him one last sniff. Then he trotted away to look for something more exciting. He had never meant to hurt Grandfather Frog at all.
        - id: ch01-b08
          speaker: narrator
          text: Grandfather Frog stayed perfectly still until he was certain Bowser was nowhere nearby. Then he let out a great sigh of relief. He crawled beneath a big mullein leaf, where he could rest and think about everything that had happened and what he ought to do next.
        - id: ch01-b09
          speaker: grandfather_frog
          text: "Chugarum! That was a dreadful experience. Yes, indeed it was! I shiver just thinking about it. Nothing like that ever happened to me in the Smiling Pool. I've always said the Smiling Pool is a better home than the Great World, and now I'm certain of it. But what should I do next?"
          emotion: fearful
        - id: ch01-b10
          speaker: narrator
          text: Deep down, Grandfather Frog already knew the answer. He ought to head straight back to the Smiling Pool as quickly as he could. But Grandfather Frog was stubborn. Yes, Sir, he was stubborn indeed, and stubbornness is often just foolishness by another name. He had told Jerry Muskrat that he meant to see the Great World. If he returned now, Jerry would laugh at him.
        - id: ch01-b11
          speaker: grandfather_frog
          text: "I won't!"
        - id: ch01-b12
          speaker: danny_meadow_mouse
          text: "What is it you won't do?"
        - id: ch01-b13
          speaker: narrator
          text: The voice was so close that Grandfather Frog jumped before he had time to think. At the Smiling Pool, he always leaped at the smallest hint of danger. One jump took him into the water, and then he was safe. Here there was no water. This jump carried him out into the open, where anyone passing by could easily see him. He turned to find out who had startled him. It was Danny Meadow Mouse.
        - id: ch01-b14
          speaker: grandfather_frog
          text: "I'm not going back to the Smiling Pool until I've had a look at the Great World."
        - id: ch01-b15
          speaker: danny_meadow_mouse
          text: "If every fright makes you jump that way, you won't see much of it. No, Sir, you won't. One of these times, you'll land right in the claws of old Whitetail the Marsh Hawk, his cousin Redtail, or Reddy Fox. Listen to me, Grandfather Frog. Go straight home to the Smiling Pool. You don't know enough about the Great World to keep yourself safe here."
        - id: ch01-b16
          speaker: narrator
          text: But Grandfather Frog was set in his ways. Nothing Danny Meadow Mouse said could change his mind.
        - id: ch01-b17
          speaker: grandfather_frog
          text: "I came out to see the Great World, and I mean to keep going."
        - id: ch01-b18
          speaker: danny_meadow_mouse
          text: "Very well. If you insist on going, then I suppose you will. I'll come along for a little while and help you start out the right way."
        - id: ch01-b19
          speaker: grandfather_frog
          text: "Thank you. Then let's be on our way at once."
