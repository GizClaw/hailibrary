audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    grandfather_frog:
      display_name: 青蛙爷爷
      tts:
        delivery: 年长稳重，受窘时仍爱逞强
        timbre: 浑厚圆润
        pace: 稍慢
        pitch: 低音
    bowser:
      display_name: 猎狗鲍泽
      tts:
        delivery: 直率顽皮，叫声响亮有力
        timbre: 粗厚洪亮
        pace: 中等
        pitch: 中低音
    danny_meadow_mouse:
      display_name: 丹尼草地鼠
      tts:
        delivery: 机灵直率，劝告时认真又干脆
        timbre: 清脆明亮
        pace: 稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第十二章　青蛙爷爷继续前行
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 青蛙爷爷年高又聪明，可年纪再大也会犯糊涂。我敢说，大家一定都同意，他那股固执劲儿，简直跟骡子一模一样。
        - id: ch01-b02
          speaker: narrator
          text: 青蛙爷爷认定，自己的最后一天到了。他一点儿也不怀疑。如今，他远在绿草原上，落进了猎狗鲍泽的爪下，离亲爱的、安全的微笑池不知有多远。他每动一下，鲍泽就把他掀得肚皮朝天，还兴高采烈地围着他又叫又跳。每过一分钟，青蛙爷爷都以为，下一刻鲍泽那口可怕的利齿就会咬下来。光是想想，他身上便冷透了。眼看逃不掉，他索性趴着不动。反正又累又怕，也实在做不了别的。
        - id: ch01-b03
          speaker: narrator
          text: 可他这样一动不动，鲍泽反倒觉得没趣了。鲍泽最爱看的，就是青蛙爷爷蹦起来，乱踢那两条长腿。他把青蛙爷爷抛到半空两三次，青蛙爷爷却落在哪儿就躺在哪儿，还是一动不动。
        - id: ch01-b04
          speaker: bowser
          text: 汪，汪，汪！
          emotion: happy
        - id: ch01-b05
          speaker: narrator
          text: 鲍泽用低沉的大嗓门叫着。青蛙爷爷连那双鼓鼓的大眼睛都没眨一下。鲍泽凑上前，把他从头到脚闻了个遍。
        - id: ch01-b06
          speaker: bowser
          text: 看来我把他吓死了。我可不是故意的呀，我不过想跟他玩一玩。
        - id: ch01-b07
          speaker: narrator
          text: 鲍泽又闻了最后一下，便小跑着离开，去找更有趣的东西了。其实，他从头到尾都没想过真要伤害青蛙爷爷。
        - id: ch01-b08
          speaker: narrator
          text: 青蛙爷爷继续趴着，一动也不动。直到确信鲍泽已经不在附近，他才长长地松了一口气，爬到一片大毛蕊花叶子下面歇息，也好好想想刚才的事和接下来该怎么办。
        - id: ch01-b09
          speaker: grandfather_frog
          text: 呱咕隆，这一遭真是吓人，实在太吓人了！微笑池里可从来没有这种事。我一直都说，住在微笑池比住在大世界好，现在我总算亲自知道了。可眼下该怎么办呢？
          emotion: fearful
        - id: ch01-b10
          speaker: narrator
          text: 青蛙爷爷一想起刚才的经历，身上还直发抖。其实，他心底清清楚楚，最好的办法当然是尽快原路返回微笑池。可他偏偏很固执。对，先生，他就是固执得很。有时候，固执不过是犯糊涂的另一个名字。他已经告诉杰里麝鼠，自己要出来看大世界。现在要是回去，杰里一定会笑话他。
        - id: ch01-b11
          speaker: grandfather_frog
          text: 我才不回去！
        - id: ch01-b12
          speaker: danny_meadow_mouse
          text: 你不做什么？
        - id: ch01-b13
          speaker: narrator
          text: 这个声音近得很。青蛙爷爷还没顾上想，已经猛地蹿出去老远。在微笑池，只要稍有危险的迹象，他总会立刻一跳。这一跳准能让他落进水里，每次都安然无恙。可这里没有水，他反而跳到了空旷处，任谁路过都能看见。他回过头一瞧，把他吓成这样的原来是丹尼草地鼠。青蛙爷爷便粗声粗气地回答。
        - id: ch01-b14
          speaker: grandfather_frog
          text: 不看过大世界，我绝不回微笑池。
        - id: ch01-b15
          speaker: danny_meadow_mouse
          text: 你每回受惊都这么乱跳，那可看不了多少大世界。真的看不了。总有一回，你会直接跳进老白尾泽鹰的爪子里。要不然，就是落到他的表亲红尾鹰或雷迪狐狸手里。青蛙爷爷，听我一句劝，赶快回微笑池吧。你根本不了解大世界，没法照顾好自己。
        - id: ch01-b16
          speaker: narrator
          text: 丹尼说着直摇头。可青蛙爷爷向来认死理。不管丹尼草地鼠怎么劝，他一点儿也不动摇。
        - id: ch01-b17
          speaker: grandfather_frog
          text: 我出来就是为了看大世界，我还要继续往前走。
        - id: ch01-b18
          speaker: danny_meadow_mouse
          text: 好吧。你非走不可，看来谁也拦不住。我先陪你走一小段，至少让你开头别走错路。
        - id: ch01-b19
          speaker: grandfather_frog
          text: 谢谢你。我们马上动身吧。
