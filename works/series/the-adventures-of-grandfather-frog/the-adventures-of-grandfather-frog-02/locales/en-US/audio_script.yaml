audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    billy_mink:
      display_name: Billy Mink
      tts:
        delivery: quick and mischievous
        timbre: bright and nimble
        pace: brisk
        pitch: medium-high
    little_joe_otter:
      display_name: Little Joe Otter
      tts:
        delivery: cheerful and eager
        timbre: smooth and youthful
        pace: lively
        pitch: medium
    longlegs_blue_heron:
      display_name: Longlegs the Blue Heron
      tts:
        delivery: stern and easily ruffled
        timbre: harsh and reedy
        pace: deliberate
        pitch: medium-low
  chapters:
    - id: ch01
      title: Longlegs the Blue Heron Receives Callers
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Longlegs the Blue Heron was in a very bad humor. That seemed strange on such a beautiful morning. It was the very morning when Grandfather Frog had caught so many foolish green flies.
        - id: ch01-b02
          speaker: narrator
          text: Jolly, round, bright Mr. Sun wore his broadest smile. The Merry Little Breezes of Old Mother West Wind danced happily here and there across the Green Meadows, looking for kind things to do for others. All the little feathered singers blessed with music in their throats by Old Mother Nature poured out their sweetest songs.
        - id: ch01-b03
          speaker: narrator
          text: With a morning like that, why should Longlegs feel so cross? His trouble was an empty stomach. Yes, Sir, hunger was what ailed him. It is hard to be hungry and happy at the same time.
        - id: ch01-b04
          speaker: narrator
          text: Longlegs stood grumbling beside a shallow pool in the Laughing Brook. A little earlier, he had watched Little Joe Otter carry home a big fish. That only made Longlegs hungrier and crosser.
        - id: ch01-b05
          speaker: narrator
          text: First, he grew envious, and envy always brings bad feelings with it. Longlegs knew Little Joe had earned that fish. Little Joe could swim faster than a fish, and he had chased this one until he caught it. Still, Longlegs chose to call it luck.
        - id: ch01-b06
          speaker: narrator
          text: He also wanted someone else to blame for his own poor fishing. People who fail often do that. When Little Joe called to him on the way home, Longlegs pretended not to hear a word.
        - id: ch01-b07
          speaker: little_joe_otter
          text: "Hello, Longlegs! How is your luck on this fine morning?"
        - id: ch01-b08
          speaker: narrator
          text: Longlegs waited until Little Joe was too far away to hear him. Then he began complaining aloud.
        - id: ch01-b09
          speaker: longlegs_blue_heron
          text: "How can I catch anything with that fellow racing all through the Laughing Brook? Catching his own fish isn't enough for him. He has to scare away every other fish and leave an honest fisherman like me with no chance at all. Why did Old Mother Nature ever give him a taste for fish? He and Billy Mink are a pair of worthless little scamps. They were born to make trouble for everyone else."
          emotion: angry
        - id: ch01-b10
          speaker: narrator
          text: He was still grumbling when those very two scamps poked their heads through the grass across the pool. Little Joe nudged Billy Mink.
        - id: ch01-b11
          speaker: little_joe_otter
          text: "Why, Longlegs, you look cheerful! You must have had a fine breakfast."
        - id: ch01-b12
          speaker: narrator
          text: Longlegs angrily snapped his great bill.
        - id: ch01-b13
          speaker: longlegs_blue_heron
          text: "What are you two doing here, ruining my fishing? You have the Big River and the whole rest of the Laughing Brook to play in. This pool belongs to me, so stay away from it!"
          emotion: angry
        - id: ch01-b14
          speaker: narrator
          text: Billy chuckled loudly enough for Longlegs to hear. The sound did not improve the heron's temper one bit. Before Longlegs could say anything more, Little Joe spoke.
        - id: ch01-b15
          speaker: little_joe_otter
          text: "Oh, do forgive us. We happen to know that Grandfather Frog is sound asleep. We thought you might want to hear about it, if your fishing had gone badly this morning. But since you think so poorly of us, we'll go tell Blackcap the Night Heron instead."
        - id: ch01-b16
          speaker: narrator
          text: Little Joe turned as though he meant to find Blackcap that very minute.
        - id: ch01-b17
          speaker: longlegs_blue_heron
          text: "Wait just a moment!"
        - id: ch01-b18
          speaker: narrator
          text: Longlegs tried to sound pleasant. That was difficult because his voice was naturally harsh and disagreeable.
        - id: ch01-b19
          speaker: longlegs_blue_heron
          text: "The truth is, I haven't eaten one bite of breakfast. Hunger can make a fellow cross. Now, where did you say Grandfather Frog was?"
        - id: ch01-b20
          speaker: little_joe_otter
          text: "I didn't say where. But if you truly want to know, he is fast asleep on his big green lily pad in the Smiling Pool. He is sitting right out where anyone can see him."
        - id: ch01-b21
          speaker: longlegs_blue_heron
          text: "Thank you. Come to think of it, I have some business up that way. I believe I'll go over and look at him. I've never seen him asleep before."
