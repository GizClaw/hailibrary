audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    billy_mink:
      display_name: 比利水貂
      tts:
        delivery: 机灵顽皮，说话干脆利落
        timbre: 清脆明亮
        pace: 偏快
        pitch: 中高音
    little_joe_otter:
      display_name: 小乔水獭
      tts:
        delivery: 开朗淘气，反应爽快
        timbre: 明快清润
        pace: 中快
        pitch: 中高音
    long_legged_heron:
      display_name: 长腿苍鹭
      tts:
        delivery: 高傲挑剔，恼火时声音尖利生硬
        timbre: 尖锐沙哑
        pace: 中等偏慢
        pitch: 高音
  chapters:
    - id: ch01
      title: 第二章　长腿苍鹭接待来客
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 长腿苍鹭心里很不痛快。可那天早晨偏偏美极了，任谁都不该有这样的心情。没错，这就是青蛙爷爷捉到许多傻乎乎的绿苍蝇的那个早晨。
        - id: ch01-b02
          speaker: narrator
          text: 快活、滚圆又明亮的太阳先生咧着大嘴，笑得格外灿烂。西风老妈妈手下那些快乐的小微风，在绿草地上到处欢舞，四下寻找机会，好替别人做点事。大自然老妈妈赐给好歌喉的小小羽族，也在唱着最甜美的歌。
        - id: ch01-b03
          speaker: narrator
          text: 这么看来，长腿苍鹭实在没有不痛快的道理。其实，他的烦恼全是因为肚子空空。是的，先生，在那个阳光明媚的早晨，他犯的正是这个毛病。你也知道，肚子饿着的时候，还想高高兴兴，可不容易。
        - id: ch01-b04
          speaker: narrator
          text: 长腿苍鹭站在欢笑溪一汪浅浅的小水潭边，一个人嘟嘟囔囔。不久前，他刚看见小乔水獭带着一条大鱼回家。这么一来，他更饿了，心里也更不痛快。
        - id: ch01-b05
          speaker: narrator
          text: 他先是嫉妒起来。你知道，嫉妒总会搅出坏情绪。他明明很清楚，小乔一路勇猛地追赶，才捉到了那条鱼。小乔游起来，甚至比鱼还快呢。可他偏要哄自己说，小乔不过是运气好。
        - id: ch01-b06
          speaker: narrator
          text: 长腿苍鹭还想找个人怪罪，把自己的失败推到别人头上。失败的人大多爱这么做。所以，小乔朝他喊，问这么好的早晨运气怎么样，他只装作没听见。一直等到小乔走远，再也看不见也听不见了，他才对着自己发起牢骚。
        - id: ch01-b07
          speaker: long_legged_heron
          text: 那个家伙在欢笑溪里来来回回地乱窜，我怎么可能有好运！他捉到自己要吃的也就罢了，还把别的鱼全吓跑了。我这样规规矩矩捕鱼，连一点机会都没有。真不知道大自然老妈妈是怎么想的，竟然让他也爱吃鱼。他和比利水貂就是两个没用的小坏蛋，生下来只会给别人添麻烦！
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: 他还在抱怨，那两个“小坏蛋”却从水潭对岸的草丛里探出了脑袋。小乔一边开口，一边用胳膊肘碰了碰比利水貂。
        - id: ch01-b09
          speaker: little_joe_otter
          text: 长腿苍鹭，你瞧着可真高兴。早饭一定吃得特别饱吧？
        - id: ch01-b10
          speaker: narrator
          text: 长腿苍鹭气得把那张大嘴咔嚓一夹，立刻质问起他们。
        - id: ch01-b11
          speaker: long_legged_heron
          text: 你们跑来干什么，又想把我的鱼搅走吗？大河还不够你们玩？欢笑溪别的地方也不够你们闹？这片水潭归我，麻烦你们离远点！
          emotion: angry
        - id: ch01-b12
          speaker: narrator
          text: 比利水貂咯咯笑了起来，还偏偏让长腿苍鹭听得清清楚楚。长腿苍鹭的火气不但没消，反而更大了。可他还没来得及开口，小乔就先说话了。
        - id: ch01-b13
          speaker: little_joe_otter
          text: 哦，那可真对不起。我们碰巧知道，青蛙爷爷正睡得香呢。本来还想，要是你今早运气不好，也许愿意听听这个消息。既然你这么瞧不上我们，那我们去告诉黑冠夜鹭好了。
        - id: ch01-b14
          speaker: narrator
          text: 小乔转过身，装作马上就要去找黑冠夜鹭。长腿苍鹭赶紧叫住他，还拼命想让自己的声音和气一点。可这实在不容易。你也知道，他的嗓音本来就又刺耳又难听。
        - id: ch01-b15
          speaker: long_legged_heron
          text: 等一等！说真的，我早饭一口也没吃。肚子饿了，人难免会发脾气。你刚才说，青蛙爷爷在哪儿？
        - id: ch01-b16
          speaker: little_joe_otter
          text: 我可没说他在哪儿。不过，你要是真想知道，他正坐在微笑池那片大绿荷叶上，睡得特别沉。那地方亮堂堂的，谁都看得见他。
        - id: ch01-b17
          speaker: long_legged_heron
          text: 谢谢你。你这么一说，我才想起那边刚好有件事要办。我还是过去看看他吧，反正我从没见过他睡觉是什么样子。
