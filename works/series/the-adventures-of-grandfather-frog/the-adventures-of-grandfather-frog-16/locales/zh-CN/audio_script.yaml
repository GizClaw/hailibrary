audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    grandfather_frog:
      display_name: 青蛙爷爷
      tts:
        delivery: 年长稳重，受窘时仍爱逞强
        timbre: 浑厚圆润
        pace: 稍慢
        pitch: 低音
    farmer_browns_boy:
      display_name: 农夫布朗家的男孩
      tts:
        delivery: 乡野少年的爽直口吻，兴奋时响亮利落
        timbre: 清朗有力
        pace: 明快
        pitch: 中高音
    merry_breeze_1:
      display_name: 第一阵快乐小微风
      tts:
        delivery: 热心机敏，说话轻快而坚定
        timbre: 清亮轻盈
        pace: 稍快
        pitch: 高音
    merry_breeze_2:
      display_name: 第二阵快乐小微风
      tts:
        delivery: 热情直率，遇到急事语气急切
        timbre: 明亮柔和
        pace: 稍快
        pitch: 中高音
    merry_breeze_3:
      display_name: 第三阵快乐小微风
      tts:
        delivery: 爽快干脆，回答时毫不迟疑
        timbre: 轻柔清脆
        pace: 明快
        pitch: 高音
    merry_breeze_4:
      display_name: 第四阵快乐小微风
      tts:
        delivery: 好奇敏锐，发问时认真急迫
        timbre: 轻细明净
        pace: 稍快
        pitch: 高音
  chapters:
    - id: ch01
      title: 第十六章　快乐小微风辛苦奔忙
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 快乐小微风看见男孩放下青蛙爷爷，伸手去摸手帕，要擦掉眼里的尘土，欢喜得差点儿喊出声来。男孩只好翻过篱笆，满菜园追自己的帽子。每当他眼看就要抓住，小微风便等他认定这次准行，再猛地把帽子夺走。小微风觉得这实在太好玩了。不过，他们这么做可不是为了玩，真的不是。他们是要把男孩从青蛙爷爷身边引开。
        - id: ch01-b02
          speaker: narrator
          text: 危险一过去，小微风便丢下帽子，分头朝四面八方飞奔。有的越过绿草原，有的赶去绿森林，还有的直奔微笑池塘。他们当然是去找青蛙爷爷的朋友，请大家来帮忙。小微风虽能让男孩放下青蛙爷爷，却解不开绳结，也咬不断绳子。偏偏要救青蛙爷爷，就非得做到这件事，因为他的两条后腿还捆在一起。所以，他们得找来一个牙齿锋利、又很关心青蛙爷爷的朋友，请他赶来相救。
        - id: ch01-b03
          speaker: narrator
          text: 第一阵小微风想起花栗鼠条纹，便赶往那道老石墙。第二阵出发去找草原鼠丹尼。第三阵直奔亲爱的老蔷薇丛，去找兔子彼得。第四阵想到了臭鼬吉米，还记得吉米以前救过落入圈套的乌鸦布莱基。第五阵记得松鼠快乐杰克有一口锋利的牙齿，急忙飞向绿森林。第六阵则径直赶往微笑池塘，要把消息告诉麝鼠杰里。每一阵小微风都拼尽了力，飞快地跑着。
        - id: ch01-b04
          speaker: narrator
          text: 就在这段时间里，青蛙爷爷已经不抱希望了。是的，先生，可怜的老青蛙爷爷彻底绝望了。他并不知道，快乐小微风正在想尽办法救他。他吓得魂不守舍，脑子根本转不动。男孩丢下他以后，他就在原地躺了好几分钟。后来，他看见不远处有块旧木板。其实他什么也没想，只觉得木板底下好像能藏身，就试着往那边挪。这可太费劲了。他那两条用来跳跃的长后腿仍捆在一起，只能贴着地面爬一爬，扭一扭，一点点把身子拖过去。等男孩拿着帽子，正要翻过篱笆回到长巷时，青蛙爷爷总算挪到旧木板旁，钻进了下面。
        - id: ch01-b05
          speaker: narrator
          text: 刚才，快乐小微风把尘土吹到男孩脸上，又抢走了他的帽子。男孩匆忙间丢下青蛙爷爷，压根没注意自己把他扔在了哪里，所以现在也说不准该到哪个确切的地方去找。不过，他知道青蛙爷爷就在附近，也毫不怀疑自己肯定找得到。可他才刚开始找，吃饭的号角就响了。男孩犹豫起来。他肚子饿了，要是回去晚了，没准就吃不上饭。反正青蛙爷爷的腿捆着，走不了多远，他过一会儿再回来找也行。于是，男孩最后看了一眼，记住这片地方，转身回家去了。
        - id: ch01-b06
          speaker: narrator
          text: 快乐小微风要是知道男孩已经回家，一定会轻松许多。可他们并不知道，还是拼命赶路，到处寻找青蛙爷爷的朋友。他们一直忙到累得几乎动不了，因为青蛙爷爷的朋友们好像偏偏都在这天出了门。于是，男孩坐下吃饭的时候，青蛙爷爷正藏在长巷的旧木板下面，而快乐小微风仍在竭尽全力，为他寻找救兵。
