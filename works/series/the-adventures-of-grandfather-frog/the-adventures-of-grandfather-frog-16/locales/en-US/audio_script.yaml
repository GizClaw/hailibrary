  chapters:
    - id: ch01
      title: The Merry Little Breezes Work Hard
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The Merry Little Breezes nearly shouted with delight. Farmer Brown's boy had dropped Grandfather Frog so he could find his handkerchief and wipe away the dust they had blown into his eyes. Then the boy climbed the fence and chased his hat through the garden.
        - id: ch01-b02
          speaker: narrator
          text: The Breezes let him come close enough to think he had it. But just as his hands were about to close around the hat, they whisked it away again. Oh, it was great fun! Yet fun was not the reason they were doing it. No, indeed. They meant to draw Farmer Brown's boy away from Grandfather Frog.
        - id: ch01-b03
          speaker: narrator
          text: As soon as it was safe, the Breezes let the hat fall. Then they split up and flew in every direction. Some raced across the Green Meadows, some swept toward the Green Forest, and another hurried down to the Smiling Pool. What were they after? They were hunting for Grandfather Frog's friends, hoping someone would help.
        - id: ch01-b04
          speaker: narrator
          text: The Merry Little Breezes could make Farmer Brown's boy drop Grandfather Frog, but they could not untie a knot or bite through a string. And that was exactly what had to be done. Grandfather Frog's hind legs were tied together. To set him free, they needed a friend with sharp teeth who cared enough to come.
        - id: ch01-b05
          speaker: narrator
          text: One Breeze thought of Striped Chipmunk and rushed toward the old stone wall. Another went looking for Danny Meadow Mouse. A third flew to the dear Old Briar-patch to find Peter Rabbit. A fourth remembered how Jimmy Skunk had once freed Blacky the Crow from a snare.
        - id: ch01-b06
          speaker: narrator
          text: A fifth Breeze remembered Happy Jack Squirrel's sharp teeth and hurried into the Green Forest. A sixth sped straight to the Smiling Pool to tell Jerry Muskrat. Every one of them raced as fast as he could.
        - id: ch01-b07
          speaker: narrator
          text: All that time, Grandfather Frog had no hope at all. Poor old Grandfather Frog was in complete despair. He had no idea what the Merry Little Breezes were trying to do. He was so frightened and confused that he could not think clearly.
        - id: ch01-b08
          speaker: narrator
          text: After Farmer Brown's boy dropped him, Grandfather Frog lay where he had fallen for several minutes. Then he noticed an old board close by. It looked as though there might be enough space beneath it for him to hide, so he tried to reach it without stopping to think.
        - id: ch01-b09
          speaker: narrator
          text: Moving was terribly hard. Grandfather Frog used his long hind legs for jumping, and those legs were tied together. All he could do was crawl, wriggle, and drag himself forward. Just as Farmer Brown's boy climbed back over the fence into the Long Lane with his hat in hand, Grandfather Frog reached the old board and crept underneath it.
        - id: ch01-b10
          speaker: narrator
          text: When the Merry Little Breezes had flung dust into the boy's face and carried off his hat, he had dropped Grandfather Frog so quickly that he never saw the exact spot where the frog landed. Now he did not know precisely where to search. Still, he knew the place was nearby, and he felt sure he would find Grandfather Frog.
        - id: ch01-b11
          speaker: narrator
          text: The boy had only just begun looking when the dinner horn sounded. He stopped for a moment. He was hungry, and if he arrived late, he might miss his dinner. He could always come back for Grandfather Frog. With his legs tied, the old frog could not go far. Farmer Brown's boy took one last look to remember the place, then headed for the house.
        - id: ch01-b12
          speaker: narrator
          text: If the Merry Little Breezes had known that, they would have felt much better. But they did not know. They kept hurrying from place to place, searching for Grandfather Frog's friends. They worked until they were almost too weary to move. It seemed that every one of his friends had chosen that very day to be away from home.
        - id: ch01-b13
          speaker: narrator
          text: So while Farmer Brown's boy ate his dinner, Grandfather Frog stayed hidden beneath the old board in the Long Lane. And the Merry Little Breezes kept doing everything they could to find someone who would help him.
