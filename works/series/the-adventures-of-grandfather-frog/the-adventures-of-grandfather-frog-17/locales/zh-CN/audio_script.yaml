audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    grandfather_frog:
      display_name: 青蛙爷爷
      tts:
        delivery: 年长稳重，受窘时仍爱逞强
        timbre: 浑厚圆润
        pace: 稍慢
        pitch: 低音
    striped_chipmunk:
      display_name: 花栗鼠条纹
      tts:
        delivery: 淘气快活，遇到新鲜事时机灵而好奇
        timbre: 清脆明亮
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第十七章　花栗鼠条纹咬断绳子
      blocks:
        - id: ch01-b01
          speaker: striped_chipmunk
          text: 蹦蹦跳，翻翻倒！夏日里头天气好，妈妈把我赶出门，叫我尽管玩个饱！
          emotion: happy
        - id: ch01-b02
          speaker: narrator
          text: 花栗鼠条纹当然知道，自己唱的全是傻话。不过，他早就发现，心里的快活一旦冒起泡来，说点傻话，做点傻事，也能带来许多乐趣。今天，他正是这么高兴。他沿着长巷一边的旧木栅栏跑去，嘴里说着傻话，脚下做着怪动作。可那双亮晶晶的小眼睛一点儿也没闲着，四周有什么动静，全都逃不过他的眼睛。
        - id: ch01-b03
          speaker: narrator
          text: 花栗鼠条纹和西风妈妈的快乐小微风，向来是最要好的朋友。几乎每天早晨，他们都要一起痛快地玩一场。偏偏这天早晨，小微风没在平常的时间来到老石墙边。花栗鼠条纹等了一会儿，便沿着长巷跑出去，想瞧瞧那里有没有新鲜事。
        - id: ch01-b04
          speaker: narrator
          text: 后来，一阵快乐小微风赶来找他，急着请他去救青蛙爷爷，可老石墙边早已不见他的影子。这一切，花栗鼠条纹还半点儿也不知道。
        - id: ch01-b05
          speaker: narrator
          text: 他飞跑在旧栅栏最上面的横木上，又跳到一根木桩顶端，坐下来洗脸洗手。花栗鼠条纹爱干净，身上沾上一丁点儿脏东西也受不了。洗完以后，他抬起头，朝盘旋在高高蓝天上的秃鹫老爷眨眨眼。接着，他又追着自己的尾巴直转圈，差一点儿就从木桩上掉了下去。
        - id: ch01-b06
          speaker: narrator
          text: 远处的绿草原上，红尾鹰正坐在一棵高树顶端。花栗鼠条纹冲那个方向扮了个鬼脸。猎狗鲍泽恰好沿着长巷跑来，他又对鲍泽大声数落，直到鲍泽走得看不见了才停下。随后，他后腿一蹬，再次沿旧栅栏飞奔起来。
        - id: ch01-b07
          speaker: narrator
          text: 跑到一根摇摇晃晃的横木中间，他忽然停住了。那双亮眼睛发现了一样东西，叫他好奇得不得了，简直跟兔子彼得见了新鲜事一样。那是一截绳子。没错，先生，就是一截绳子。
        - id: ch01-b08
          speaker: narrator
          text: 花栗鼠条纹以前常常捡到绳子，这本来没什么稀奇。可眼前这一截不一样，它竟然一直在动，每隔几秒就轻轻抽动一下。绳子怎么会自己动呢？这种事，他可从来没有听说过，怎么想也想不明白。
        - id: ch01-b09
          speaker: narrator
          text: 他站在栅栏顶上看了好一会儿，然后飞快地溜到地面。每往前跑几步，他就停下来仔细看看。就这样，他一点一点靠近那截古怪的绳子。看见一截绳子自己活动，他心里说不出的别扭，所以格外小心，始终不肯靠得太近。
        - id: ch01-b10
          speaker: narrator
          text: 花栗鼠条纹先从这一边瞧，又绕到另一边瞧。最后，他看见绳子的一头伸进了旧木板下面，这才有点儿明白。木板底下准是藏着谁，绳子正是那个家伙扯动的。
        - id: ch01-b11
          speaker: narrator
          text: 他坐下来，认真地挠了挠头。能钻进那块旧木板底下的家伙，个头一定大不到哪里去。既然这样，他也用不着害怕。想到这里，一丝淘气的亮光在他眼里闪了起来。
        - id: ch01-b12
          speaker: narrator
          text: 花栗鼠条纹一把抓住绳子的另一头，使劲往外拉。绳子马上又抽又拽，闹得可厉害了。可他就是不松手，反而越拉越用力。
        - id: ch01-b13
          speaker: narrator
          text: 紧接着，一双古怪的蹼足从旧木板下面露了出来。那是青蛙爷爷的脚，两只还紧紧捆在一起。花栗鼠条纹吓了一跳，手里的绳子顿时松开，自己也向后一仰，差点儿摔倒。
        - id: ch01-b14
          speaker: striped_chipmunk
          text: 哎呀，青蛙爷爷，你到底在这里做什么？
          emotion: surprised
        - id: ch01-b15
          speaker: narrator
          text: 绳子一松，青蛙爷爷立刻把脚缩回木板下面。不过，听见花栗鼠条纹的声音，他还是忍着疼，慢慢爬了出来。他开始讲起自己的遭遇。他怎样被农夫布朗家的男孩捉住，怎样让男孩捆了起来，最后又怎样被丢在这块旧木板附近。他还讲到自己受了多大的惊吓，两条腿又有多疼。
        - id: ch01-b16
          speaker: narrator
          text: 可是，花栗鼠条纹根本没等他讲完。一眨眼，他已经扑到绳子旁边，用锋利的牙齿忙活起来。青蛙爷爷的故事还没说完，那根害人的绳子就被他咬断了。
