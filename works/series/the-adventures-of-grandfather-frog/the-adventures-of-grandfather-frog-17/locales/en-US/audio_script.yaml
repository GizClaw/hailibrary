audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    grandfather_frog:
      display_name: Grandfather Frog
      tts:
        delivery: dignified with a gruff edge
        timbre: deep and resonant
        pace: unhurried
        pitch: low
    striped_chipmunk:
      display_name: Striped Chipmunk
      tts:
        delivery: playful and quick-witted
        timbre: bright and nimble
        pace: lively
        pitch: high
  chapters:
    - id: ch01
      title: Striped Chipmunk Cuts the String
      blocks:
        - id: ch01-b01
          speaker: striped_chipmunk
          text: "Hippy hop! Flippy flop! All on a summer day, my mother sent me from the house and out to play!"
          emotion: happy
        - id: ch01-b02
          speaker: narrator
          text: Striped Chipmunk knew that was pure nonsense. But long ago, he had learned that when good feelings bubble right over, it can be fun to say and do foolish things. That was exactly how he felt this morning. He raced along the old rail fence beside the Long Lane, calling out nonsense and cutting silly capers. All the while, his bright little eyes took in everything around him.
        - id: ch01-b03
          speaker: narrator
          text: Striped Chipmunk and the Merry Little Breezes of Old Mother West Wind were the best of friends. Almost every morning, they had a grand frolic together. But that day, the Breezes had not come to the old stone wall where he lived. At least, they had not arrived at their usual time.
        - id: ch01-b04
          speaker: narrator
          text: He waited for a while. Then, because he felt so cheerful, he set off down the Long Lane to see if anything new had happened. So when one of the Merry Little Breezes finally came looking for him, anxious to ask him to help Grandfather Frog, Striped Chipmunk was nowhere to be found.
        - id: ch01-b05
          speaker: narrator
          text: Striped Chipmunk knew nothing about any of that. He scampered along the top rails, then sprang onto a fence post and sat up to wash his face and hands. He was very neat and could not stand being even a little dirty.
        - id: ch01-b06
          speaker: narrator
          text: High in the blue sky, Ol' Mistah Buzzard sailed round and round. Striped Chipmunk looked up and winked at him. Then he chased his own tail until he almost tumbled off the post. He spotted Redtail the Hawk sitting in a tall tree far across the Green Meadows and made a sour face at him.
        - id: ch01-b07
          speaker: narrator
          text: Just then, Bowser the Hound came trotting up the Long Lane. Striped Chipmunk scolded him and kept on scolding until Bowser disappeared from sight. Then he kicked up his heels and whisked away along the fence again.
        - id: ch01-b08
          speaker: narrator
          text: Halfway across a shaky old rail, he stopped short. His sharp eyes had caught something that made him every bit as curious as Peter Rabbit would have been. It was a piece of string. Yes, sir, just a piece of string.
        - id: ch01-b09
          speaker: narrator
          text: He had found string many times before, so the string itself was nothing special. But this one kept moving. Every few seconds, it gave a little jerk. Whoever heard of a string moving all by itself? Striped Chipmunk certainly had not, and he could not make sense of it.
        - id: ch01-b10
          speaker: narrator
          text: For several minutes, he watched from the top rail. Then he scurried down to the ground. He crept toward the strange string a few steps at a time, stopping after every little run to watch it closely. Seeing it twitch gave him a funny feeling inside, so he took care not to come too near.
        - id: ch01-b11
          speaker: narrator
          text: First he studied it from one side. Then he ran around and studied it from the other. At last, he found that one end disappeared beneath an old board. Now he began to understand. Someone must be hiding under that board and pulling the string.
        - id: ch01-b12
          speaker: narrator
          text: Striped Chipmunk sat down and thoughtfully scratched his head. Whoever was tugging the string could not be very large. Otherwise, how could they have crawled beneath that old board? There was no reason for him to be afraid.
        - id: ch01-b13
          speaker: narrator
          text: A mischievous gleam danced in his eyes. He grabbed the loose end and pulled. At once, the string began jerking and yanking. What a struggle it was, with one pull after another! Striped Chipmunk held tight and pulled even harder.
        - id: ch01-b14
          speaker: narrator
          text: Then a pair of strange webbed feet slid out from under the board. They were Grandfather Frog's feet, tied together with the string. Striped Chipmunk was so startled that he dropped the string and nearly fell over backward.
        - id: ch01-b15
          speaker: striped_chipmunk
          text: "Grandfather Frog! What in the world are you doing under there?"
          emotion: surprised
        - id: ch01-b16
          speaker: narrator
          text: The moment Striped Chipmunk let go, Grandfather Frog pulled his feet back beneath the board. But when he recognized Striped Chipmunk's voice, he slowly crawled out. Every movement hurt.
        - id: ch01-b17
          speaker: grandfather_frog
          text: "Farmer Brown's boy caught me and tied my legs. Then he dropped me here beside this old board. I was terribly frightened, and my legs are so sore."
          emotion: fearful
        - id: ch01-b18
          speaker: narrator
          text: Grandfather Frog had not even finished telling what happened when Striped Chipmunk sprang to work. In a flash, his sharp teeth were cutting through the cruel string. Before Grandfather Frog could finish his story, the string was cut.
