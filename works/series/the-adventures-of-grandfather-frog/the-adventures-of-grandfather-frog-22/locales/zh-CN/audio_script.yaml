audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    grandfather_frog:
      display_name: 青蛙爷爷
      tts:
        delivery: 年长稳重，受窘时仍爱逞强
        timbre: 浑厚圆润
        pace: 稍慢
        pitch: 低音
    farmer_browns_boy:
      display_name: 农夫布朗家的男孩
      tts:
        delivery: 乡野少年的爽直口吻，兴奋时响亮利落
        timbre: 清朗有力
        pace: 明快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第二十二章　青蛙爷爷的麻烦越来越大
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 一头扎进无路退，动身之前想明白！这句话有多在理，青蛙爷爷已经有的是工夫慢慢体会了。
        - id: ch01-b02
          speaker: narrator
          text: 他被困在泉里，坐在快乐小风儿吹来的旧木瓦上，翻来覆去想着一个小小的词，那就是“要是”。要是自己没离开微笑池，要是没那么固执，总按老习惯办事，要是当时别那么急，要是起跳前先看清落脚的地方……这些“要是”，只要有一个成了真，他也不会落到今天这步田地。
        - id: ch01-b03
          speaker: narrator
          text: 其实，泉里并不算难待。真正叫他害怕的，是农夫布朗家的男孩可能会来喝水，把他发现。青蛙爷爷每回想打个盹，这份担心都会钻进梦里。只要一想到可能再让男孩捉住，他便从头冷到脚。
        - id: ch01-b04
          speaker: narrator
          text: 后来，一阵快乐小风儿匆匆赶来，说那个男孩真的来了。可怜的青蛙爷爷顿时吓懵了。小风儿连说两遍，他才听懂，应该藏到漂在水面的旧木瓦下面。
        - id: ch01-b05
          speaker: narrator
          text: 青蛙爷爷终于回过神，深吸一口气，潜进水里，游到木瓦底下。真是千钧一发。是的，先生，只差一点点！他入水时，水面荡起了一圈圈小波纹。要不是男孩正想着别的事情，肯定早就看见了。
        - id: ch01-b06
          speaker: narrator
          text: 可男孩一直心不在焉，第一次舀水时什么也没发现。直到他第二次把杯子伸进泉里，才瞧见那块旧木瓦。
        - id: ch01-b07
          speaker: farmer_browns_boy
          text: 咦，这块木瓦昨天还不在这儿，准是后来被风吹进来的。泉水这么干净，里头可不能漂着这种东西。
        - id: ch01-b08
          speaker: narrator
          text: 男孩说着就伸手去拿。青蛙爷爷躲在木瓦下面，认定自己这回完了。那阵焦急的小风儿一直盯着男孩，一看出他要做什么，马上使出了那个老掉牙的办法。小风儿一把掀走了他的帽子。说真的，除此以外，小风儿也想不出别的招了。
        - id: ch01-b09
          speaker: narrator
          text: 男孩慌忙去抓帽子。他正赶时间，还有别的事要做，追着追着就走远了，再也没想起泉里的旧木瓦。
        - id: ch01-b10
          speaker: narrator
          text: 青蛙爷爷从木瓦下面游出来，重新爬到上面。
        - id: ch01-b11
          speaker: grandfather_frog
          text: 咕咕隆！刚才真是差一点就完了。再多来几回，我非活活吓死不可。
          emotion: fearful
        - id: ch01-b12
          speaker: narrator
          text: 接下来很长一段时间，什么事也没发生。青蛙爷爷正想着，也许现在可以安心睡一觉了。就在这时，他看见泉沿后面探出两只眼睛。那双眼睛泛着绿黄的光，直勾勾地盯着他。青蛙爷爷也只能盯回去。他不知道那双眼睛属于谁，从前似乎也没见过。
        - id: ch01-b13
          speaker: narrator
          text: 他心里害怕，却怎么也下不了决心跳开。他看得太专心，压根没发现一只毛茸茸的长爪子正朝自己伸来。那只爪子慢极了，一点一点，越靠越近。
        - id: ch01-b14
          speaker: narrator
          text: 突然，爪子像闪电一样扑了下来。尖利的爪尖扎进青蛙爷爷黄白相间的背心。他连嘴都没来得及张开，更别说喊一声“咕咕隆”了，整个人已经飞上半空，仰面摔在草地上。
        - id: ch01-b15
          speaker: narrator
          text: 猛地一扑！两只爪子把他牢牢按住。那双绿黄色的眼睛就在他面前，离他的眼睛还不到一英寸。
        - id: ch01-b16
          speaker: narrator
          text: 现在他终于知道了。那是农夫布朗家的猫，黑咪。
