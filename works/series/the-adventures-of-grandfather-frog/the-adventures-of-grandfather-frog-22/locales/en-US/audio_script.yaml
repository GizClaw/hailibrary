  chapters:
    - id: ch01
      title: Grandfather Frog's Troubles Grow
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Head first in, with no way out. It is best to know what you are about!
        - id: ch01-b02
          speaker: narrator
          text: Grandfather Frog had spent plenty of time learning how true that was. He sat on the old shingle the Merry Little Breezes had blown into the spring and thought about one small word. That word was “if.” If only he had stayed at the Smiling Pool. If only he had not been so stubborn. If only he had slowed down. If only he had looked before he leaped. Any one of those things would have saved him from this trouble.
        - id: ch01-b03
          speaker: narrator
          text: Being trapped in the spring was not so terrible by itself. What frightened him was the thought that Farmer Brown's boy might come for a drink and find him. Whenever Grandfather Frog tried to nap, that fear filled his dreams. The mere thought of being caught by the boy again made him cold all over.
        - id: ch01-b04
          speaker: narrator
          text: At last, one of the Merry Little Breezes rushed up with a warning. Farmer Brown's boy was really coming! Poor Grandfather Frog was so scared that the Little Breeze had to tell him twice to hide beneath the old shingle floating on the water.
        - id: ch01-b05
          speaker: narrator
          text: Finally, Grandfather Frog understood. He drew one very long breath, dived into the spring, and swam under the shingle. He made it just in time. Yes, sir, just in time.
        - id: ch01-b06
          speaker: narrator
          text: His dive had left little rings spreading across the water. Farmer Brown's boy would surely have seen them if his mind had not been somewhere else. But he was thinking about other things. He dipped his cup once without noticing anything. Only when he dipped it a second time did he see the old shingle.
        - id: ch01-b07
          speaker: farmer_browns_boy
          text: “What's this doing here? It wasn't here yesterday. I won't have an old board floating in our clean spring.”
        - id: ch01-b08
          speaker: narrator
          text: The boy reached for the shingle. Underneath it, Grandfather Frog was sure he was lost.
        - id: ch01-b09
          speaker: narrator
          text: The worried Little Breeze had been watching closely. The moment he saw what the boy meant to do, he tried the only trick he could think of. He snatched the hat right off Farmer Brown's boy's head.
        - id: ch01-b10
          speaker: narrator
          text: Farmer Brown's boy grabbed for his hat. He was in a hurry, and he had other things to do, so he started away. The old shingle never entered his mind again.
        - id: ch01-b11
          speaker: grandfather_frog
          text: “Chugarum! That was much too close. A few more scares like that, and I shall surely die of fright.”
          emotion: fearful
        - id: ch01-b12
          speaker: narrator
          text: Grandfather Frog swam out from under the shingle and climbed back on top. For a long while, nothing else happened. He had just begun to wonder whether it might be safe to take a nap when two eyes appeared over the edge of the spring.
        - id: ch01-b13
          speaker: narrator
          text: They were greenish-yellow eyes, and they stared straight at him. Grandfather Frog stared back. He could not help himself. He did not know whose eyes they were, and he could not remember seeing them before.
        - id: ch01-b14
          speaker: narrator
          text: Grandfather Frog was afraid, but somehow he could not make himself jump. He watched those eyes so intently that he never saw the long, furry paw reaching slowly down toward him.
        - id: ch01-b15
          speaker: narrator
          text: The paw crept nearer and nearer. Then it flashed forward. Sharp claws caught Grandfather Frog by his white-and-yellow waistcoat. Before he could even open his mouth to cry “Chugarum,” he flew through the air and landed on his back in the grass.
        - id: ch01-b16
          speaker: narrator
          text: Pounce! Two paws pinned him down. The greenish-yellow eyes were now less than an inch from his own.
        - id: ch01-b17
          speaker: narrator
          text: They belonged to Black Pussy, Farmer Brown's cat.
