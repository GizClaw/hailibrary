  chapters:
    - id: ch01
      title: The Patience of Longlegs the Blue Heron
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Patience often wins the day when too much hurry makes you lose your way.
        - id: ch01-b02
          speaker: narrator
          text: If Longlegs the Blue Heron has one great virtue, it is patience. Yes, sir, Longlegs certainly knows how to wait. When something is worth having, he believes it is worth waiting for. And if he waits long enough, he feels sure he will get it.
        - id: ch01-b03
          speaker: narrator
          text: Perhaps that comes from a lifetime of fishing. Longlegs is a fisherman, and so were his father and grandfather. A fisherman without patience seldom catches anything. Billy Mink and Little Joe Otter laugh and say that cannot be true. But sometimes they go hungry when a little of Longlegs's patience would have found them a meal.
        - id: ch01-b04
          speaker: narrator
          text: Grandfather Frog is also very, very patient. He can sit still for the longest time while he waits for something to come his way. In fact, he can sit perfectly still for so long, and Longlegs can stand perfectly still for so long, that Jerry Muskrat, Billy Mink, and Little Joe Otter often argue about which one can keep still the longest.
        - id: ch01-b05
          speaker: longlegs
          text: "He will make a splendid breakfast."
        - id: ch01-b06
          speaker: narrator
          text: That was what Longlegs thought as he moved with great care along the edge of the Smiling Pool. He went on until he stood directly across from Grandfather Frog. Then he stopped and studied the old frog. Grandfather Frog's eyes were closed. He certainly seemed to be asleep. Without making a sound, Longlegs chuckled deep inside and prepared to wade close enough to reach him.
        - id: ch01-b07
          speaker: narrator
          text: All that time, Grandfather Frog was quietly chuckling too. He was not asleep at all. He was only pretending. Through the corner of one big goggly eye, he watched Longlegs lift a foot. The heron moved very, very slowly and carefully, trying not to make even the tiniest sound as he stepped into the Smiling Pool.
        - id: ch01-b08
          speaker: narrator
          text: Grandfather Frog pretended to yawn and opened his big goggly eyes. At once, Longlegs froze on one foot. Not even a feather moved. Grandfather Frog yawned once more. He nodded as though he could hardly stay awake, then let his eyes fall half shut.
        - id: ch01-b09
          speaker: narrator
          text: Longlegs waited and waited. Then he began to lower his long neck. Little by little, he brought it down so slowly that anyone watching could hardly have seen him move. At last, his head rested on his shoulders.
        - id: ch01-b10
          speaker: longlegs
          text: "I suppose I must wait until he is sound asleep again."
        - id: ch01-b11
          speaker: narrator
          text: But Grandfather Frog did not go to sleep. He would nod and nod. Each time Longlegs decided the old frog truly must be asleep, Grandfather Frog's eyes would pop open again.
        - id: ch01-b12
          speaker: narrator
          text: So Longlegs spent the whole long morning balanced on one foot. He never moved. He only watched and waited, while his hunger grew and grew. Grandfather Frog spent that same long morning on his big green lily pad, acting as if he were oh, so sleepy. In truth, he was enjoying a comfortable sunbath and a good rest. He had eaten a fine breakfast of foolish green flies very early that morning.
        - id: ch01-b13
          speaker: narrator
          text: Across the Smiling Pool, among the bulrushes, two little scamps in brown bathing suits were watching and waiting too. They were Billy Mink and Little Joe Otter. They had sent Longlegs to catch Grandfather Frog because they wanted to give the old frog a terrible fright.
        - id: ch01-b14
          speaker: narrator
          text: At first, Billy and Little Joe laughed quietly and nudged each other, delighted with their trick. But nothing happened. Before long, they felt tired and uneasy. Unlike Longlegs and Grandfather Frog, those two had no patience at all.
        - id: ch01-b15
          speaker: narrator
          text: At last, Billy and Little Joe gave up in disgust. They slipped away to look for a more exciting game. Grandfather Frog watched them leave, and inside, he chuckled harder than ever.
