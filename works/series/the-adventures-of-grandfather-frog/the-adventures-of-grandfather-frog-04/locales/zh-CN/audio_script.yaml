audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    longlegs_heron:
      display_name: 长腿苍鹭
      tts:
        delivery: 沉着耐心，盘算时透着自信
        timbre: 清朗而略显低沉
        pace: 舒缓
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第四章　长腿苍鹭的耐心
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 耐心常常能赢到最后，急匆匆反倒会误入歧途。
        - id: ch01-b02
          speaker: narrator
          text: 要说长腿苍鹭最出众的美德，那准是耐心。不错，先生，他的耐心可足着呢。在他看来，值得要的东西，就值得等。只要等得够久，总会落到手里。也许，这是因为他一辈子都靠捕鱼过活。他的父亲和祖父，也全是渔夫。没耐心的渔夫，很少能捕到东西。比利水貂和小乔水獭听见这话，一定会笑着说不对。可他们有时偏偏会饿肚子。要是能有长腿苍鹭那一点儿耐心，就不会挨饿了。
        - id: ch01-b03
          speaker: narrator
          text: 青蛙爷爷的耐心也大得很。他能安安静静坐上好久，等想要的东西自己来到跟前。青蛙爷爷能这样坐着不动，长腿苍鹭也能那样站着不动。到底谁坚持得更久？杰里麝鼠、比利水貂和小乔水獭为了这件事，已经争过好多回了。
        - id: ch01-b04
          speaker: longlegs_heron
          text: 拿他做早饭，一定美极了。
        - id: ch01-b05
          speaker: narrator
          text: 长腿苍鹭一边盘算，一边贴着微笑池岸，小心得不能再小心地往前走。他一直走到青蛙爷爷对面，停下来仔细盯着。青蛙爷爷两眼紧闭，看来真是睡着了。长腿苍鹭心里直乐，却一点儿声音也没出。他做好了准备，只要蹚进水里，走到伸嘴够得着的地方就行。
        - id: ch01-b06
          speaker: narrator
          text: 可青蛙爷爷也在暗暗发笑。原来他根本没有睡，不过装成睡着的样子。他那只鼓鼓的大眼睛留着一线，从眼角把长腿苍鹭看得清清楚楚。
        - id: ch01-b07
          speaker: narrator
          text: 长腿苍鹭抬起一只脚，准备迈进微笑池。那动作又轻又慢，连最细小的声音都没有。青蛙爷爷偏在这时假装打了个哈欠，睁开两只大眼睛。长腿苍鹭马上单脚定住，别说身子了，连一根羽毛也纹丝不动。
        - id: ch01-b08
          speaker: narrator
          text: 青蛙爷爷又打一个哈欠，脑袋一点一点，好像困得睁不开眼，接着便半闭起眼睛。长腿苍鹭只好等。等了又等，他才一点点收下长脖子。那动作慢得很，要是你当时就在旁边，恐怕也看不出他动过。最后，他的脑袋重新落到了两肩上。
        - id: ch01-b09
          speaker: longlegs_heron
          text: 看来，还得等他再睡熟一点儿。
        - id: ch01-b10
          speaker: narrator
          text: 但青蛙爷爷就是不睡。他点着头，点着头，每逢长腿苍鹭认准他这回真睡着了，他的两只眼睛就会啪地睁开。
        - id: ch01-b11
          speaker: narrator
          text: 就这样，一整个上午，长腿苍鹭始终单脚站着。他一动不动地盯着、等着，也越来越饿。青蛙爷爷呢？他也在大绿荷叶上坐了一上午，始终装出困得不得了的模样。其实，他晒着暖和的太阳，歇得舒舒服服。一大早，他已经吃了好几只傻乎乎的绿苍蝇，肚子饱得很。
        - id: ch01-b12
          speaker: narrator
          text: 微笑池对岸的香蒲丛里，还有两个穿棕色泳衣的小坏蛋。他们一直躲在那里看着、等着。正是这两个家伙把长腿苍鹭引来捉青蛙爷爷，想让青蛙爷爷受一场大惊吓。他们就是比利水貂和小乔水獭。
        - id: ch01-b13
          speaker: narrator
          text: 刚开始，两人想起自己设下的恶作剧，还偷偷发笑，互相碰一碰胳膊肘。可是左等右等，什么也没发生。他们慢慢等烦了，心里也越来越不安。谁叫他们没有耐心呢？
        - id: ch01-b14
          speaker: narrator
          text: 到最后，比利和小乔实在厌倦了，只好悄悄溜走，另找更刺激的游戏。青蛙爷爷看着他们离开，心里笑得比刚才更欢了。
