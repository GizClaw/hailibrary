audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    billy_mink:
      display_name: 比利水貂
      tts:
        delivery: 机灵顽皮，说话干脆利落
        timbre: 清脆明亮
        pace: 偏快
        pitch: 中高音
    jerry_muskrat:
      display_name: 杰里麝鼠
      tts:
        delivery: 好奇风趣，打趣时透着机灵
        timbre: 温和清朗
        pace: 中等
        pitch: 中音
    grandfather_frog:
      display_name: 青蛙爷爷
      tts:
        delivery: 年长稳重，受窘时仍爱逞强
        timbre: 浑厚圆润
        pace: 稍慢
        pitch: 低音
    little_joe_otter:
      display_name: 小乔水獭
      tts:
        delivery: 开朗淘气，反应爽快
        timbre: 明快清润
        pace: 中快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第三章　长腿苍鹭来到微笑池
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 长腿苍鹭看着比利水貂和小乔水獭沿欢笑溪走远，一直等到他们没了踪影。他坐在那里纹丝不动，脑袋缩在两肩中间，好像清早睡一觉才是最要紧的事。可要是你能看清他那双锐利的眼睛，就绝不会以为他真想打盹儿。那两个穿棕外套的小坏蛋一走远，他马上伸直长脖子，身子几乎比刚才高了一倍。他朝这边瞧瞧，又向那边望望，确定附近没有危险，才展开大翅膀，沉沉地扑扇着飞了起来。随后，他把脑袋重新缩回去，两条长腿直拖在身后，越过绿草地。他先兜了一个大圈，这才对准微笑池直飞过去。
        - id: ch01-b02
          speaker: narrator
          text: 可比利和小乔根本没走多远。他们正躲在一个能看见长腿苍鹭的地方。见他展开翅膀，两人立刻掉头，沿欢笑溪赶往微笑池，等着看那里会出什么事。他们很清楚，长腿苍鹭是想抓青蛙爷爷当早饭。他们并不想让青蛙爷爷真的受伤，只打算叫他狠狠吃一惊。比利和小乔就是这样冒冒失失，不替别人想，还觉得吓唬别人很好玩。
        - id: ch01-b03
          speaker: little_joe_otter
          text: 放心，我们一定赶得及叫醒青蛙爷爷。他能逃掉，不过会吓一大跳。等他一睁眼，发现长腿苍鹭就要把他吞下去，那双鼓鼓的大眼睛一定瞪得更大！想想就好玩！还有长腿苍鹭，他认准这顿早饭已经到嘴了。等我们把青蛙爷爷救走，看他气成什么样！
        - id: ch01-b04
          speaker: narrator
          text: 长腿苍鹭特意绕了远路，比利和小乔反倒先到了微笑池。他们钻进池边的香蒲丛，藏在里面既能看见外头，又不会叫别人发现。
        - id: ch01-b05
          speaker: billy_mink
          text: 那个老家伙还在原来的地方，一动也没动，跟我走的时候一样，睡得可香了。
        - id: ch01-b06
          speaker: narrator
          text: 比利把声音压得低低的。青蛙爷爷果然坐在那片大绿荷叶上，双眼紧闭。至少，看起来是紧闭着。池子那边，杰里麝鼠坐在自家大屋顶上，忙着撬一只淡水蛤，仿佛什么都没注意。其实，周围的动静他全看在眼里。杰里早就猜出比利想捉弄青蛙爷爷，所以提前提醒过他。后来一见长腿苍鹭飞向微笑池，杰里又警告了一回。他心里明白，青蛙爷爷现在只是装睡。
        - id: ch01-b07
          speaker: narrator
          text: 长腿苍鹭一直飞到微笑池边，在香蒲丛里落下。他放下两条长腿，脚趾浸在水中，又把长脖子高高伸起，好把整个微笑池望个遍。大绿荷叶上，青蛙爷爷果然睡得正沉，就像小乔说的那样。至少，看上去睡得正沉。
        - id: ch01-b08
          speaker: narrator
          text: 长腿苍鹭饿得两眼发亮。一想到青蛙爷爷能做成一顿多么丰盛的早饭，他眼里的光便更亮了。他沿池岸慢慢向前挪，每一只脚都尽量轻轻放下，一步一步绕到大绿荷叶的对面。
        - id: ch01-b09
          speaker: narrator
          text: 另一边，比利和小乔躲在香蒲丛里，兴奋地碰了碰对方。他们赶紧用双手捂住嘴，生怕忍不住当场笑出声来。
