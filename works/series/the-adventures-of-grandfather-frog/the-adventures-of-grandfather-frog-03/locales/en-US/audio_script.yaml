  chapters:
    - id: ch01
      title: Longlegs Visits the Smiling Pool
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Longlegs the Blue Heron watched Billy Mink and Little Joe Otter vanish down the Laughing Brook. While he could still see them, he did not move at all. His head was tucked between his shoulders, as though a morning nap were the only thing on his mind. But one look at his sharp eyes would have told you that Longlegs was not sleepy. The moment he felt sure the two brown-coated scamps were gone, up went his long neck. Suddenly, he stood almost twice as tall as before.
        - id: ch01-b02
          speaker: narrator
          text: Longlegs glanced one way, then the other, making certain no danger was near. He opened his great wings and beat them heavily until he rose into the air. Then he drew his head back between his shoulders, stretched his long legs straight behind him, and flew across the Green Meadows. He swept around in a wide circle and turned toward the Smiling Pool.
        - id: ch01-b03
          speaker: narrator
          text: Billy and Little Joe were not nearly as far away as Longlegs believed. They had hidden where they could keep watching him. As soon as his wings spread, they hurried back along the Laughing Brook to see what would happen at the Smiling Pool. They knew just what Longlegs hoped to find there. He meant to catch Grandfather Frog for breakfast. Billy and Little Joe did not want Grandfather Frog to be hurt. They only wanted him to have a terrible fright. Like many thoughtless people, they believed frightening someone else was great fun.
        - id: ch01-b04
          speaker: little_joe_otter
          text: "We'll wake Grandfather Frog before Longlegs can catch him. All he'll get is one enormous scare! Just wait until he opens those big goggly eyes and finds Longlegs about to gobble him up. And think how furious Longlegs will be when we snatch away the breakfast he's already counting on!"
        - id: ch01-b05
          speaker: narrator
          text: Little Joe said this as they rushed along. Since Longlegs had flown the long way around, Billy and Little Joe reached the Smiling Pool first. They slipped in among the bulrushes, where they could watch without being seen.
        - id: ch01-b06
          speaker: billy_mink
          text: "There he is, right where I left him. The old fellow is still sound asleep."
        - id: ch01-b07
          speaker: narrator
          text: Billy spoke in a whisper. And sure enough, Grandfather Frog sat on his big green lily pad with his eyes closed. Or at least, they looked closed. Jerry Muskrat was sitting on the roof of his house nearby. He seemed much too busy opening a fresh-water clam to notice anything else. In truth, Jerry was watching everything. He had guessed that Billy meant to play a trick on Grandfather Frog, so he had warned him. When Jerry saw Longlegs heading toward the Smiling Pool, he warned Grandfather Frog once more. Jerry knew that the old frog was only pretending to sleep.
        - id: ch01-b08
          speaker: narrator
          text: Longlegs flew straight to the Smiling Pool. At its very edge, among the bulrushes, he lowered his long legs. His toes settled into the water, and he stretched his neck high so he could see across the whole pool. There was Grandfather Frog, just as Little Joe had said, sitting fast asleep on his big green lily pad. At least, that was how it looked. Longlegs's eyes shone with hunger. What a splendid breakfast Grandfather Frog would make!
        - id: ch01-b09
          speaker: narrator
          text: Ever so slowly, Longlegs began to creep along the shore. He set down each foot with all the care he could manage. Step by step, he moved until he was across from the big green lily pad where Grandfather Frog sat. On the other side of the pool, Billy Mink and Little Joe Otter hid among the bulrushes. They nudged each other and pressed their hands over their mouths, trying desperately not to laugh out loud.
