  chapters:
    - id: ch01
      title: Grandfather Frog Gives Up Hope
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Farmer Brown's boy carried Grandfather Frog across the Green Meadows, though Grandfather Frog had no idea where they were going. His legs were tied tightly together, and he hung headfirst from the end of a string. There was nothing he could do about it. It was dreadful.
        - id: ch01-b02
          speaker: narrator
          text: Halfway across the meadows, the Merry Little Breezes of Old Mother West Wind came dancing by. At first, they didn't notice Grandfather Frog. Then one Breeze rushed up to knock off the boy's hat as a joke and saw him hanging there.
        - id: ch01-b03
          speaker: narrator
          text: The Merry Little Breezes were dear friends of Grandfather Frog. Many, many times, they had blown foolish green flies toward him while he sat on his big green lily pad. They were very fond of him. The Breeze forgot all about teasing Farmer Brown's boy and raced off to tell the others what he had seen. For one whole minute, every Breeze stood perfectly still. They had forgotten how to be merry.
        - id: ch01-b04
          speaker: merry_little_breeze_1
          text: "This is awful. It's simply awful!"
          emotion: fearful
        - id: ch01-b05
          speaker: merry_little_breeze_2
          text: "We have to help Grandfather Frog somehow!"
        - id: ch01-b06
          speaker: merry_little_breeze_3
          text: "Yes, of course we do."
        - id: ch01-b07
          speaker: merry_little_breeze_4
          text: "But what can we possibly do?"
        - id: ch01-b08
          speaker: narrator
          text: No one had an answer. The Breezes stood there, thinking and thinking and thinking. At last, the first Breeze came up with one small thing they might try.
        - id: ch01-b09
          speaker: merry_little_breeze_1
          text: "Maybe we can make him feel a little better."
        - id: ch01-b10
          speakers: [merry_little_breeze_1, merry_little_breeze_2, merry_little_breeze_3, merry_little_breeze_4]
          ensemble: chorus
          text: "Yes! We'll do that!"
        - id: ch01-b11
          speaker: merry_little_breeze_1
          text: "And maybe if we blow dust into the boy's face and carry off his hat, he'll set Grandfather Frog down."
        - id: ch01-b12
          speakers: [merry_little_breeze_2, merry_little_breeze_3, merry_little_breeze_4]
          ensemble: chorus
          text: "That's it!"
          emotion: happy
        - id: ch01-b13
          speaker: narrator
          text: The others danced around, full of excitement.
        - id: ch01-b14
          speaker: merry_little_breeze_1
          text: "Then we'll hurry and tell all his friends what happened and where he is. Maybe one of them will know how to help."
        - id: ch01-b15
          speaker: narrator
          text: That was enough talking. The Breezes raced after Farmer Brown's boy as fast as they could fly. One was quicker than all the rest. He swept ahead and whispered in Grandfather Frog's ear that they were coming to help him.
        - id: ch01-b16
          speaker: narrator
          text: But poor Grandfather Frog could not be comforted. He couldn't imagine anything the Merry Little Breezes could possibly do for him. The string cut painfully into the skin of his legs, and hanging upside down made his head ache. No, sir, he was in a terrible fix. He saw no way out at all, and he had lost every last bit of hope.
        - id: ch01-b17
          speaker: narrator
          text: All the while, Farmer Brown's boy trudged along, whistling merrily. He never stopped to think about Grandfather Frog's pain or how terribly frightened the old frog must be. The boy wasn't cruel. He didn't mean to hurt Grandfather Frog. He was simply thoughtless, as many other boys and girls can be.
        - id: ch01-b18
          speaker: narrator
          text: He kept whistling until he reached the Long Lane that led from the Green Meadows up to Farmer Brown's dooryard. The moment he stepped into the lane, something happened. A great cloud of dust, leaves, and tiny sticks struck him right in the face. It nearly choked him. Dirt filled his eyes, and his hat was snatched from his head and sent sailing into the garden.
        - id: ch01-b19
          speaker: narrator
          text: The boy dropped Grandfather Frog and reached for his handkerchief. He wiped the dirt from his eyes, then went after his hat.
        - id: ch01-b20
          speaker: farmer_browns_boy
          text: "Phew! Where did that wind come from all of a sudden?"
          emotion: surprised
        - id: ch01-b21
          speaker: narrator
          text: But you and I know exactly where it came from. The Merry Little Breezes had all worked together to make that sudden wind. Grandfather Frog should have known it too, but he didn't. Dust had filled his nose and eyes, just as it had the boy's. He was far too frightened and confused to think clearly.
        - id: ch01-b22
          speaker: narrator
          text: So Grandfather Frog stayed right where Farmer Brown's boy had dropped him. He had no more hope than before.
