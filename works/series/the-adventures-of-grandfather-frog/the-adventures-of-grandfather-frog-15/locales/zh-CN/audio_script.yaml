audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    grandfather_frog:
      display_name: 青蛙爷爷
      tts:
        delivery: 年长稳重，受窘时仍爱逞强
        timbre: 浑厚圆润
        pace: 稍慢
        pitch: 低音
    farmer_browns_boy:
      display_name: 农夫布朗家的男孩
      tts:
        delivery: 乡野少年的爽直口吻，兴奋时响亮利落
        timbre: 清朗有力
        pace: 明快
        pitch: 中高音
    merry_breeze_1:
      display_name: 第一阵快乐小微风
      tts:
        delivery: 热心机敏，说话轻快而坚定
        timbre: 清亮轻盈
        pace: 稍快
        pitch: 高音
    merry_breeze_2:
      display_name: 第二阵快乐小微风
      tts:
        delivery: 热情直率，遇到急事语气急切
        timbre: 明亮柔和
        pace: 稍快
        pitch: 中高音
    merry_breeze_3:
      display_name: 第三阵快乐小微风
      tts:
        delivery: 爽快干脆，回答时毫不迟疑
        timbre: 轻柔清脆
        pace: 明快
        pitch: 高音
    merry_breeze_4:
      display_name: 第四阵快乐小微风
      tts:
        delivery: 好奇敏锐，发问时认真急迫
        timbre: 轻细明净
        pace: 稍快
        pitch: 高音
  chapters:
    - id: ch01
      title: 第十五章　青蛙爷爷不再抱希望
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 青蛙爷爷的两条腿被捆在一起，整个人头朝下，吊在绳子末端。农夫布朗家的男孩就这样提着他往前走，他只能一路倒吊着，也不知自己会被带到哪里去。这滋味太可怕了。走到绿草原中途，西风妈妈的快乐小微风舞着跑来了。起先，他们谁也没看见青蛙爷爷。有一阵小微风冲向男孩，本想吹掉他的帽子，好好逗逗他。就在这时，他才发现倒吊着的青蛙爷爷。
        - id: ch01-b02
          speaker: narrator
          text: 快乐小微风跟青蛙爷爷都是好朋友。青蛙爷爷坐在大绿睡莲叶上的时候，他们不知有多少回把傻乎乎的绿头苍蝇吹到他身边。他们都很喜欢这位老朋友。眼下一看他落到这么可怕的境地，那阵小微风哪还顾得上逗男孩。他立刻飞奔回去，把消息告诉伙伴们。听完以后，大家足足安静了一分钟，连快乐都忘了。
        - id: ch01-b03
          speaker: merry_breeze_1
          text: 太可怕了，真是太可怕了！
          emotion: fearful
        - id: ch01-b04
          speaker: merry_breeze_2
          text: 我们一定得想办法救青蛙爷爷！
        - id: ch01-b05
          speaker: merry_breeze_3
          text: 那当然，我们非救他不可。
        - id: ch01-b06
          speaker: merry_breeze_4
          text: 可是，我们能怎么救呢？
        - id: ch01-b07
          speaker: narrator
          text: 谁也答不上来。他们想了又想，想了又想。最后，第一阵小微风终于开口了。
        - id: ch01-b08
          speaker: merry_breeze_1
          text: 我们先去安慰安慰他吧。
        - id: ch01-b09
          speakers: [merry_breeze_1, merry_breeze_2, merry_breeze_3, merry_breeze_4]
          ensemble: chorus
          text: 对，我们当然要去！
        - id: ch01-b10
          speaker: merry_breeze_1
          text: 我们把尘土吹到那个男孩脸上，再把他的帽子抢走。这样，他也许会把青蛙爷爷放下来。
        - id: ch01-b11
          speakers: [merry_breeze_2, merry_breeze_3, merry_breeze_4]
          ensemble: chorus
          text: 对，就这么办！
          emotion: happy
        - id: ch01-b12
          speaker: narrator
          text: 其他小微风兴奋极了，一边大声赞同，一边在四周舞来舞去。
        - id: ch01-b13
          speaker: merry_breeze_1
          text: 接着，我们再四处去报信，告诉青蛙爷爷的朋友，他出了什么事，现在又在哪里。也许他们当中有人能帮我们。
        - id: ch01-b14
          speaker: narrator
          text: 小微风再也不浪费时间说话，立刻使出最快的速度，去追农夫布朗家的男孩。跑得最快的那一阵抢先赶到青蛙爷爷身边，贴着他的耳朵悄声告诉他，大家都来了，这就想办法救他。
        - id: ch01-b15
          speaker: narrator
          text: 可怜的青蛙爷爷还是宽不了心。他实在想不出，快乐小微风能用什么法子救他。绳子深深勒进皮肉，两条腿火辣辣地疼。脑袋也疼得厉害，别忘了，他一直头朝下吊着呢。小微风的话一点儿也没能安慰他。眼下这个困境实在太可怕，他怎么想都看不到逃脱的办法，心里连一丝希望都没有了。
        - id: ch01-b16
          speaker: narrator
          text: 农夫布朗家的男孩却迈着沉重的步子，一路快活地吹口哨。他根本没想到青蛙爷爷有多痛苦，也没想到他吓成了什么样。这个男孩并不残忍。不，他当然不是个残忍的孩子。至少，他不是存心要这样对待青蛙爷爷。他只是没有替别人想，就像许许多多男孩一样，女孩也一样。
        - id: ch01-b17
          speaker: narrator
          text: 男孩一路吹着口哨，终于走进了那条从绿草原通往自家门前院子的长巷。刚一进去，事情就发生了。一大团尘土、树叶和细树枝猛扑到他脸上，差点儿把他呛得喘不过气。泥土钻进了眼睛，帽子也突然从头上飞走，一路飘进菜园。他赶紧丢下青蛙爷爷，伸手去摸手帕，想擦干净眼里的尘土。
        - id: ch01-b18
          speaker: farmer_browns_boy
          text: 呸！真怪，这阵风怎么一下子就刮起来了？
          emotion: surprised
        - id: ch01-b19
          speaker: narrator
          text: 男孩说完，便动身去追自己的帽子。你知道，我也知道，这阵突然刮来的风，正是快乐小微风一起造出来的。青蛙爷爷本来也该知道，可他偏偏没明白。原来，尘土同样钻进了他的鼻子和眼睛。他又害怕，又糊涂，脑子里什么也想不清楚。于是，他仍旧躺在男孩丢下他的地方，跟先前一样，心里一点儿希望也没有。
