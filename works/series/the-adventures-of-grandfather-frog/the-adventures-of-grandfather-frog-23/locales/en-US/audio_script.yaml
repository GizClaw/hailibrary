  chapters:
    - id: ch01
      title: The Dear Old Smiling Pool Once More
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Black Pussy was having a wonderful time, but Grandfather Frog certainly was not. She thought it was great fun to slide one paw beneath him and flip him into the air. Pretending to leave was even better. She would hide nearby and wait. The moment he tried to get away, she would spring on him, bat him with her paw, and roll him over and over.
        - id: ch01-b02
          speaker: narrator
          text: There was no fun in any of this for Grandfather Frog. He was terrified. He had no idea whether Black Pussy ate frogs. Worse still, she did not always keep her claws tucked away. They poked straight through his white-and-yellow waistcoat and hurt the tender skin underneath.
        - id: ch01-b03
          speaker: narrator
          text: At last Black Pussy tired of her game. She picked Grandfather Frog up in her mouth and followed the little path from the spring toward the Long Lane. He did not kick at all. That was wise, because she would only have gripped him harder, and that would have hurt very much indeed.
        - id: ch01-b04
          speaker: grandfather_frog
          text: This is all over. This is the end. Now she is going to eat me. Oh, why did I ever leave the Smiling Pool?
          emotion: fearful
        - id: ch01-b05
          speaker: narrator
          text: Just as Black Pussy entered the Long Lane, Grandfather Frog heard a sound he knew. Someone was coming closer, whistling a merry tune. It was Farmer Brown's boy. For some reason, a tiny bit of hope stirred in Grandfather Frog's heart.
        - id: ch01-b06
          speaker: narrator
          text: He could not have said why that whistle gave him hope, but it did. He had always been terribly afraid of Farmer Brown's boy. But if the boy caught him, perhaps he could escape again, just as he had before. From Black Pussy, he was sure he could never get away.
        - id: ch01-b07
          speaker: narrator
          text: The whistling came closer. Black Pussy stopped and began making a strange, whirring sound deep in her throat.
        - id: ch01-b08
          speaker: farmer_browns_boy
          text: Hello, Black Pussy! Have you been out hunting? Come show me what you found.
        - id: ch01-b09
          speaker: narrator
          text: Black Pussy arched her back and rubbed against the boy's legs. All the while, the whirring in her throat grew louder. Farmer Brown's boy bent down to see what she was carrying.
        - id: ch01-b10
          speaker: farmer_browns_boy
          text: Why, I think this is the same old frog who escaped from me! You don't need him, Puss. I'll put him in my pocket and take him to the house later.
          emotion: surprised
        - id: ch01-b11
          speaker: narrator
          text: He took Grandfather Frog away from Black Pussy and slipped him into his pocket. Then he patted her, told her she was a smart cat, and walked on, whistling merrily.
        - id: ch01-b12
          speaker: narrator
          text: The pocket was dark and close, but Grandfather Frog did not mind. Cramped as it was, this hiding place felt much safer than sharp teeth and claws. He wondered how soon they would reach the house and what would happen there. A long, long time seemed to pass. Then he went swinging through the air and struck the ground with a thump that made him grunt. Farmer Brown's boy had taken off his coat and tossed it down.
        - id: ch01-b13
          speaker: narrator
          text: The whistling stopped, and everything became quiet. Grandfather Frog waited and listened. He could not hear a thing. Then a thin ray of light crept into his little prison. He wriggled and pushed until, all at once, he tumbled out of the pocket.
        - id: ch01-b14
          speaker: narrator
          text: The bright light made him blink. When he could see again, he looked around. Then he rubbed both eyes and looked once more. He was not at Farmer Brown's house. So where do you think he was? Right on the bank of the Smiling Pool, while Farmer Brown's boy fished a short distance away.
        - id: ch01-b15
          speaker: grandfather_frog
          text: Chugarum!
          emotion: happy
        - id: ch01-b16
          speaker: narrator
          text: It was the loudest, happiest chugarum the Smiling Pool had ever heard.
        - id: ch01-b17
          speaker: grandfather_frog
          text: Chugarum!
          emotion: happy
        - id: ch01-b18
          speaker: narrator
          text: With one tremendous leap, Grandfather Frog splashed into the dear old Smiling Pool. The pool seemed to smile more brightly than ever.
        - id: ch01-b19
          speaker: narrator
          text: Grandfather Frog never again tried to see the Great World. He was content to leave it to those who liked living there. After all his own amazing adventures, he was ready to believe anything anyone told him about that world. Nothing could surprise him anymore, not even the astonishing things that happened to Chatterer the Red Squirrel. And it takes a whole book to tell that story.
