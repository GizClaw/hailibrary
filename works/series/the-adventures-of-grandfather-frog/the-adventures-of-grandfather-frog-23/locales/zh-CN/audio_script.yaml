audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    grandfather_frog:
      display_name: 青蛙爷爷
      tts:
        delivery: 年长稳重，受窘时仍爱逞强
        timbre: 浑厚圆润
        pace: 稍慢
        pitch: 低音
    farmer_browns_boy:
      display_name: 农夫布朗家的男孩
      tts:
        delivery: 乡野少年的爽直口吻，兴奋时响亮利落
        timbre: 清朗有力
        pace: 明快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第二十三章　重回亲爱的微笑池
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 黑咪玩得非常开心，青蛙爷爷可一点也不开心。她把爪子伸到他身下，一下将他抛上半空，就觉得很好玩。更有趣的是，她会假装离开，其实悄悄躲在旁边。青蛙爷爷才要逃走，她就猛扑上来，对他又拍又打，拨得他满地打滚。
        - id: ch01-b02
          speaker: narrator
          text: 对黑咪来说，这些把戏有趣极了。青蛙爷爷却怕得要命。第一，他不知道黑咪爱不爱吃青蛙。第二，黑咪并不总把爪尖收起来。尖爪穿过他黄白相间的背心，扎得他生疼，因为那里的皮肉格外娇嫩。
        - id: ch01-b03
          speaker: narrator
          text: 黑咪终于玩腻了，一口衔起青蛙爷爷，沿着泉边的小路朝长巷走去。青蛙爷爷连腿也没蹬一下。这倒是件好事，要是他挣扎，黑咪一定会咬得更紧，那滋味可就太难受了。
        - id: ch01-b04
          speaker: grandfather_frog
          text: 全完了，这回我真没命了。她马上就要吃掉我。唉，我当初为什么非要离开微笑池？为什么呀？
          emotion: fearful
        - id: ch01-b05
          speaker: narrator
          text: 黑咪刚走进长巷，青蛙爷爷忽然听见一个熟悉的声音。那是口哨声，一阵欢快的口哨声，是农夫布朗家的男孩吹的。声音正越来越近，青蛙爷爷心里竟冒出了一丝希望。
        - id: ch01-b06
          speaker: narrator
          text: 他自己也说不清这份希望从哪儿来。从前，他最怕的就是那个男孩。可这会儿他想，要是再被男孩捉住，或许还能像上次一样逃脱。落在黑咪嘴里，他却敢肯定，自己永远、永远也逃不掉。
        - id: ch01-b07
          speaker: narrator
          text: 口哨越来越近，黑咪停下脚步，喉咙深处响起古怪的呼噜声。
        - id: ch01-b08
          speaker: farmer_browns_boy
          text: 嘿，黑咪！你刚才去打猎啦？快过来，让我看看你捉了什么。
        - id: ch01-b09
          speaker: narrator
          text: 黑咪弓起背，在男孩腿边蹭来蹭去，呼噜声也越来越响。男孩弯下腰，瞧了瞧她嘴里衔着的东西。
        - id: ch01-b10
          speaker: farmer_browns_boy
          text: 哎呀，这不就是上次从我手里逃走的那只老青蛙吗！黑咪，你又不想要他。我先把他放进口袋，待会儿带回家。
          emotion: surprised
        - id: ch01-b11
          speaker: narrator
          text: 男孩从黑咪嘴里接过青蛙爷爷，放进自己的口袋。他拍拍黑咪，夸她是只聪明的猫，便快活地吹着口哨继续赶路。口袋里又黑又闷，青蛙爷爷却一点也不在乎。这里怎么也比时时挨着尖牙利爪舒服得多。
        - id: ch01-b12
          speaker: narrator
          text: 他一路猜着，什么时候才会到那所房子，到了以后又会怎么样。仿佛过了好久好久，他突然被抡过半空，砰的一声摔到地上，震得闷哼起来。原来，男孩脱下外套，随手扔在了地上。
        - id: ch01-b13
          speaker: narrator
          text: 口哨停了，周围静悄悄的。青蛙爷爷等了又等，侧耳细听，却连一点声音也没听见。后来，一小缕光钻进了他的口袋牢房。他扭动身子，使劲往外挤，猛地钻了出来。明亮的光晃得他连连眨眼。
        - id: ch01-b14
          speaker: narrator
          text: 等眼睛看清了，他赶紧瞧瞧自己到了哪里。看了一遍，他又用两只手揉揉眼睛，再看一遍。他根本不在农夫布朗家的房子！你猜这是哪儿？原来，他正待在微笑池岸边。离他不远，农夫布朗家的男孩正在钓鱼呢。
        - id: ch01-b15
          speaker: grandfather_frog
          text: 咕咕隆！
          emotion: happy
        - id: ch01-b16
          speaker: narrator
          text: 这一声咕咕隆，是微笑池听过的最响亮、最欢喜的一声。
        - id: ch01-b17
          speaker: grandfather_frog
          text: 咕咕隆！
          emotion: happy
        - id: ch01-b18
          speaker: narrator
          text: 青蛙爷爷纵身一跃，扑通跳进了亲爱的老微笑池。微笑池笑得从来没有这么开心过。
        - id: ch01-b19
          speaker: narrator
          text: 从那以后，青蛙爷爷再也没想过去看看大世界。他很知足，只愿把那里留给喜欢住在大世界的人。经历了自己的这番奇遇，如今别人说大世界里发生了什么，他都肯相信。再没有什么能让他吃惊，就连红松鼠喋喋的那些遭遇也不例外。要讲完喋喋的故事，可得用上整整一本书呢。
