audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    grandfather_frog:
      display_name: 青蛙爷爷
      tts:
        delivery: 年长稳重，受窘时仍爱逞强
        timbre: 浑厚圆润
        pace: 稍慢
        pitch: 低音
    striped_chipmunk:
      display_name: 花栗鼠条纹
      tts:
        delivery: 淘气快活，遇到新鲜事时机灵而好奇
        timbre: 清脆明亮
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第十八章　青蛙爷爷匆匆离开
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 花栗鼠条纹一口咬断绳子，青蛙爷爷那两条长腿总算松开了。他一下子轻松下来，高兴得都不知道该做什么才好，只顾一遍又一遍地向花栗鼠条纹道谢。
        - id: ch01-b02
          speaker: striped_chipmunk
          text: 这没什么，真的一点儿也没什么。能帮上您的忙，我可高兴了。
          emotion: happy
        - id: ch01-b03
          speaker: striped_chipmunk
          text: 我们住在大世界里，就得彼此帮忙，因为谁也说不准，自己什么时候也会需要别人。青蛙爷爷，您还是听我一句劝，赶快回微笑池去吧。大世界不适合您这样的老人家，您在这里还不大会照料自己呢。
        - id: ch01-b04
          speaker: narrator
          text: 这句话，花栗鼠条纹可说错了。上了年纪的人，最不爱听别人说自己老，也不爱听别人说，世上还有自己不懂的事。青蛙爷爷马上挺直身子，竭力摆出一副庄严的样子。
        - id: ch01-b05
          speaker: grandfather_frog
          text: 咕咕隆！花栗鼠条纹，你可要知道，你还没出生的时候，大伙儿就来找我讨主意了。农夫布朗家的男孩能抓到我，只是碰巧。我倒要看看，他还能不能再抓到我。是的，先生，我还真想看看！
        - id: ch01-b06
          speaker: narrator
          text: 哎呀呀，哎呀呀！青蛙爷爷竟吹起牛来了。要是他安稳地待在微笑池的家里，这样夸口或许还情有可原。可他如今远在长巷这边，连回微笑池的路都不认识，这番话说得实在太糊涂了，简直糊涂透顶。
        - id: ch01-b07
          speaker: narrator
          text: 花栗鼠条纹比谁都明白。可他一向很敬重青蛙爷爷，也看得出，青蛙爷爷落进这场麻烦，心里正又恼火又难堪。一想到自己竟然被人捉住，青蛙爷爷更觉得丢脸。于是，花栗鼠条纹用一只手捂住嘴，把笑藏起来，再顺着他的话劝他。
        - id: ch01-b08
          speaker: striped_chipmunk
          text: 他当然不会再抓到您。我知道您又聪明又有见识。可是，您看起来已经累坏了，大世界里又有这么多危险。依我看，眼下最好还是回微笑池去。
        - id: ch01-b09
          speaker: narrator
          text: 可青蛙爷爷就是固执。他出来这一趟，本来是要看看大世界。要是现在回去，绿草原和绿森林里的小居民们说不定会以为他害怕了。说到底，比起四周的危险，他更怕别人笑话自己。聪明人有时候也会这样糊涂。青蛙爷爷摇了摇头。
        - id: ch01-b10
          speaker: grandfather_frog
          text: 咕咕隆！我要先看过大世界，再回微笑池。你知道哪里有水吗？我渴得很。
        - id: ch01-b11
          speaker: narrator
          text: 长巷另一边正好有一眼泉。农夫布朗家的男孩要去玉米地干活，总会在那里灌满一壶清亮又冰凉的泉水带走。花栗鼠条纹去那里喝过许多次水，对那一带熟得很。
        - id: ch01-b12
          speaker: narrator
          text: 他把泉眼在哪里、该怎么走，全都清清楚楚地告诉了青蛙爷爷，甚至还提出要亲自带路。可青蛙爷爷不肯，只想一个人去。
        - id: ch01-b13
          speaker: striped_chipmunk
          text: 青蛙爷爷，您一路当心。千万别掉进泉里，要不然，您可能就爬不上来了。
        - id: ch01-b14
          speaker: narrator
          text: 青蛙爷爷猛地抬头，盯着花栗鼠条纹。他想看看，这小家伙是不是在拿自己开心。他一辈子住在水里，居然有人以为，他想出来时会出不来！
        - id: ch01-b15
          speaker: narrator
          text: 可花栗鼠条纹的神情十分认真。青蛙爷爷只得把冲到嘴边的话咽回去，向他道了谢，便匆匆去找那眼泉。青蛙爷爷渴坏了，身上也热得厉害。一想到找到泉水就能洗个凉快的澡，他赶得更快了。
