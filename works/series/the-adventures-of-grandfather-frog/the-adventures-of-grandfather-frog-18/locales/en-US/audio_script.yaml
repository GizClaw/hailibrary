audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    grandfather_frog:
      display_name: Grandfather Frog
      tts:
        delivery: dignified with a gruff edge
        timbre: deep and resonant
        pace: unhurried
        pitch: low
    striped_chipmunk:
      display_name: Striped Chipmunk
      tts:
        delivery: playful and quick-witted
        timbre: bright and nimble
        pace: lively
        pitch: high
  chapters:
    - id: ch01
      title: Grandfather Frog Hurries Away
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: At last, Striped Chipmunk cut through the string around Grandfather Frog's long legs. What a relief! Grandfather Frog hardly knew what to do. He thanked Striped Chipmunk again and again.
        - id: ch01-b02
          speaker: striped_chipmunk
          text: Oh, it was nothing at all. I was very glad I could help you.
        - id: ch01-b03
          speaker: narrator
          text: Then Striped Chipmunk gave him some advice.
        - id: ch01-b04
          speaker: striped_chipmunk
          text: Those of us who live out in the Great World have to help each other. Any one of us might need help someday. Now, Grandfather Frog, you should get back to the Smiling Pool as fast as you can. The Great World isn't safe for an old fellow who doesn't know how to look after himself out here.
        - id: ch01-b05
          speaker: narrator
          text: That was a great mistake. Old people do not like being told they are old. And they certainly do not like being told there are things they do not know. Grandfather Frog drew himself up and did his best to look dignified.
        - id: ch01-b06
          speaker: grandfather_frog
          text: Chugarum! Listen here, Striped Chipmunk. People were asking me for advice before you were even born. Farmer Brown's boy caught me by accident, that's all. I'd like to see him try it a second time. Yes, sir, just let him try!
          emotion: angry
        - id: ch01-b07
          speaker: narrator
          text: Dear me! Grandfather Frog was boasting. It might have been excusable if he were safe at home in the Smiling Pool. But here he was, far away in the Long Lane, and he did not even know the way home. Boasting now was very foolish indeed. Striped Chipmunk understood that better than anyone. Still, he respected Grandfather Frog. He also knew the old frog felt cross and ashamed after getting himself into such trouble. So Striped Chipmunk covered his smile with one hand and answered him.
        - id: ch01-b08
          speaker: striped_chipmunk
          text: Of course Farmer Brown's boy won't catch you again. I know you're wise and clever. But you look awfully tired, and the Great World is full of danger. Going back to the Smiling Pool really does seem like the best thing for you.
        - id: ch01-b09
          speaker: narrator
          text: But Grandfather Frog could be stubborn. He had set out to see the Great World, and he did not want the little people of the Green Meadows and the Green Forest to think he was afraid. The truth was, he feared their laughter more than all the dangers around him. Even wise people can be very foolish sometimes. Grandfather Frog shook his head.
        - id: ch01-b10
          speaker: grandfather_frog
          text: Chugarum! I'm going to see the Great World before I return to the Smiling Pool. Now, do you know where I can find some water? I'm terribly thirsty.
        - id: ch01-b11
          speaker: narrator
          text: There was a spring across the Long Lane. Farmer Brown's boy used to fill his jug there with clear, cold water whenever he had work to do in the cornfield. Striped Chipmunk knew the spring well. He had gone there for a drink many times. He explained exactly where it was and how Grandfather Frog could reach it. He even offered to lead the way.
        - id: ch01-b12
          speaker: grandfather_frog
          text: Thank you, but I would rather go by myself.
        - id: ch01-b13
          speaker: striped_chipmunk
          text: Be careful, Grandfather Frog. Don't fall into that spring. You might not be able to climb out again.
        - id: ch01-b14
          speaker: narrator
          text: Grandfather Frog glanced up sharply. Was Striped Chipmunk making fun of him? Imagine anyone thinking that Grandfather Frog could not get out of water whenever he pleased! He had lived in water all his life. But Striped Chipmunk looked completely serious. So Grandfather Frog held back the quick answer waiting on his tongue. He thanked Striped Chipmunk and hurried off to find the spring, because he was very, very thirsty.
        - id: ch01-b15
          speaker: narrator
          text: Grandfather Frog was very, very hot too. The thought of a cool bath made him hurry even faster toward the spring.
