  chapters:
    - id: ch01
      title: Danny Meadow Mouse Feels Responsible
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Responsible is a great big word. It looks big, and its meaning is every bit as big. That is how words ought to be, don't you think? And re-spon-sible was exactly how Danny Meadow Mouse felt. He had found Grandfather Frog far out on the Green Meadows, far from the Smiling Pool. The old frog was too stubborn to turn back. He meant to keep going until he saw the Great World, instead of returning to his big green lily pad where he could look after himself.
        - id: ch01-b02
          speaker: narrator
          text: You may remember how Peter Rabbit felt when he brought little Miss Fuzzytail from the Old Pasture to the dear Old Briar-patch. Peter believed it was his job to keep her from harm. Well, Danny felt the same way about Grandfather Frog.
        - id: ch01-b03
          speaker: narrator
          text: Danny knew Grandfather Frog would not get far in the Great World if he jumped every time something scared him. That might work in the Smiling Pool, where the friendly water could hide him from his enemies. Out on the Green Meadows or in the Green Forest, it was the worst thing he could do. When Danny was very tiny, he had learned what to do when danger came near. He must sit perfectly still and hardly breathe.
        - id: ch01-b04
          speaker: narrator
          text: Danny was fond of Grandfather Frog. He could not bear the thought that something dreadful might happen to him. Since he could not persuade the old frog to return to the Smiling Pool, Danny decided he simply had to go with him and try to keep him safe. Yes, sir, he had to. Grandfather Frog's safety was now his responsibility.
        - id: ch01-b05
          speaker: narrator
          text: So off they went. Danny ran ahead, worried and anxious, watching closely for any sign of danger. Grandfather Frog puffed along behind him. He was determined to see the Great World, the place his cousin, old Mr. Toad, claimed was better than the Smiling Pool.
        - id: ch01-b06
          speaker: narrator
          text: Danny had many little private paths beneath the grass, winding all across the Green Meadows. He could race along them without ever showing himself to anyone who might be watching. Of course, he tried to lead Grandfather Frog down one of those paths. But Grandfather Frog did not walk or run. He jumped. They soon discovered there was no room for jumping under the grass. Grandfather Frog simply could not follow Danny that way.
        - id: ch01-b07
          speaker: narrator
          text: Danny sat down to think, his brow puckered with worry. Now he was more anxious than ever. Grandfather Frog would have to cross the open ground, where he had room to jump. But out there, anyone who came along could see him plainly. Danny begged him once again to return to the Smiling Pool. He might as well have spoken to a stick or a stone. Grandfather Frog had set out to see the Great World, and he meant to see it.
        - id: ch01-b08
          speaker: narrator
          text: Danny sighed.
        - id: ch01-b09
          speaker: danny_meadow_mouse
          text: "Well, if you insist on going, I suppose you will. The only place where you can travel comfortably is the Lone Little Path. It's dangerous, very dangerous, but I don't see any other way."
        - id: ch01-b10
          speaker: grandfather_frog
          text: "Chugarum! I'm not scared. Just show me the Lone Little Path, Danny Meadow Mouse. Then you can get back to your own affairs."
        - id: ch01-b11
          speaker: narrator
          text: Danny led him to the Lone Little Path. Grandfather Frog gave a sigh of relief. At last he could jump without getting tangled in the long grass, and the sharp stubble where the grass had been cut no longer hurt his tender feet.
        - id: ch01-b12
          speaker: narrator
          text: Danny, though, was more worried than ever. He would not leave Grandfather Frog because he felt responsible for him. At the same time, he was terribly afraid. He was certain that one of their enemies would spot them. Danny wanted to turn back, but he kept going all the way. And that shows just how brave little Danny Meadow Mouse really was.
