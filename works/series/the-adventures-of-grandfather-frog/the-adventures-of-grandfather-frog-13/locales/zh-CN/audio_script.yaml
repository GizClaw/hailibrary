audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    grandfather_frog:
      display_name: 青蛙爷爷
      tts:
        delivery: 年长稳重，受窘时仍爱逞强
        timbre: 浑厚圆润
        pace: 稍慢
        pitch: 低音
    danny_meadow_mouse:
      display_name: 丹尼草地鼠
      tts:
        delivery: 机灵直率，劝告时认真又干脆
        timbre: 清脆明亮
        pace: 稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第十三章　丹尼草地鼠觉得责任在肩
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: “责任”是个很大的词。它不光看起来大，分量也很重。依我看，词就该是这样，不是吗？丹尼草地鼠在绿草原遇见青蛙爷爷时，心里便担起了这样一份沉甸甸的责任。青蛙爷爷已经离微笑池那么远，却固执地不肯回去，非要接着看大世界。在微笑池那片宽大的绿睡莲叶上，他原本很会照顾自己。还记得彼得兔吗？他把小茸尾姑娘从老牧场带到亲爱的老荆棘丛时，也觉得自己得保护好她，不能让她受到伤害。现在，丹尼对青蛙爷爷也是一样。
        - id: ch01-b02
          speaker: narrator
          text: 丹尼很清楚，青蛙爷爷要是每次受惊都那样乱跳，在大世界里一定走不了多远。在微笑池里，一跳就能躲进友善的池水，当然没错。可在绿草原或绿森林，这么做恰恰最危险。丹尼从很小的时候就懂得，在这些地方，危险一靠近，最安全的办法就是坐着别动，连气也尽量少喘。
        - id: ch01-b03
          speaker: narrator
          text: 丹尼很喜欢青蛙爷爷。一想到青蛙爷爷也许会遇上什么可怕的事，他心里就受不了。既然怎么劝也劝不回去，丹尼只好下定决心，陪青蛙爷爷一起走，尽力帮他避开危险。对，先生，他非这样做不可。青蛙爷爷能不能平安，他觉得自己也有责任。
        - id: ch01-b04
          speaker: narrator
          text: 于是，丹尼在前面跑，一路忧心忡忡，仔细留意危险的迹象。青蛙爷爷气喘吁吁地跟在后面，一门心思要去看大世界。因为他的表亲蟾蜍老先生说过，大世界比微笑池更适合居住。
        - id: ch01-b05
          speaker: narrator
          text: 绿草原到处都有丹尼私家的小径，它们全藏在草丛下面。丹尼沿着小径飞跑时，哪怕有家伙正在四处找他，他也一次都不用露面。他自然想带青蛙爷爷走其中一条。可青蛙爷爷不会走，也不会跑，只会跳。两位很快便发现，那些小径窄得容不下他蹦跳。青蛙爷爷根本跟不上去。
        - id: ch01-b06
          speaker: narrator
          text: 丹尼坐下来，愁得紧紧皱起眉头。他比刚才更担心了。青蛙爷爷只能到空旷处走，那儿有地方让他跳，却也会让每个碰巧路过的家伙看得清清楚楚。丹尼又劝他回微笑池，可青蛙爷爷听了，就跟木棍石头听见了一样。他已经动身去看大世界，就一定要看到。
        - id: ch01-b07
          speaker: narrator
          text: 丹尼无可奈何地叹了一口气。
        - id: ch01-b08
          speaker: danny_meadow_mouse
          text: 你非去不可，那就去吧，我看谁也拦不住你。能让你走得舒服一点儿的地方，恐怕只有孤零零小径。那里很危险，真的非常危险，可你大概也只能走那条路了。
        - id: ch01-b09
          speaker: grandfather_frog
          text: 呱咕隆！我才不怕呢。你只管把孤零零小径指给我看，然后就去忙自己的事吧，丹尼草地鼠。
        - id: ch01-b10
          speaker: narrator
          text: 丹尼便在前面带路，把青蛙爷爷领到孤零零小径。青蛙爷爷总算松了一口气。在这里，他可以尽管蹦跳，不会被长草缠住，也不会再让割过草后留下的尖茬扎痛娇嫩的脚。
        - id: ch01-b11
          speaker: narrator
          text: 可丹尼反而比刚才更担忧。他不愿丢下青蛙爷爷，因为他一直觉得，自己得为青蛙爷爷的安全负责。同时，他又怕得厉害，认定他们一定会被某个敌人发现。丹尼很想回去，却还是一步不停地向前走。你瞧，这正说明丹尼草地鼠是个多么勇敢的小家伙。
