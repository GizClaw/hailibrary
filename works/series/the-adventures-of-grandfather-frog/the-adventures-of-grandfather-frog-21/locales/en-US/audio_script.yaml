  chapters:
    - id: ch01
      title: The Merry Little Breezes Try to Comfort Grandfather Frog
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The Merry Little Breezes of Old Mother West Wind had left Grandfather Frog in the Long Lane, right where Farmer Brown's boy had dropped him. They hurried away as fast as they could to find one of his friends and bring back help. But not one of them had any luck. Nobody was home, and nobody could be found in any of the usual places.
        - id: ch01-b02
          speaker: narrator
          text: The Little Breezes searched and searched. At last, one after another, they sadly turned back toward the Long Lane. They felt so awful about failing that they hated to return to the place where they had left Grandfather Frog.
        - id: ch01-b03
          speaker: narrator
          text: When they arrived, Striped Chipmunk was there. His tongue was flying as he scolded Farmer Brown's boy, who was searching through the grass for some sign of Grandfather Frog.
        - id: ch01-b04
          speakers: [little_breeze_1, little_breeze_2, little_breeze_3, little_breeze_4]
          ensemble: chorus
          text: Where is he?
        - id: ch01-b05
          speaker: narrator
          text: Striped Chipmunk paused his scolding just long enough to point at Farmer Brown's boy.
        - id: ch01-b06
          speakers: [little_breeze_1, little_breeze_2, little_breeze_3, little_breeze_4]
          ensemble: chorus
          text: We don't mean him, silly! We can see him ourselves. Where is Grandfather Frog?
        - id: ch01-b07
          speaker: striped_chipmunk
          text: I don't know. And what's more, I don't care!
        - id: ch01-b08
          speaker: narrator
          text: Of course, that was not true. Striped Chipmunk was not that sort of person. He was mostly talking, and the Little Breezes knew it. He cared a great deal about Grandfather Frog, just as they did. So they paid no attention to his words or to how put out he seemed. They simply waited for him to tell them what he knew.
        - id: ch01-b09
          speaker: narrator
          text: Before long, Striped Chipmunk told them what had happened. He had freed Grandfather Frog, and the old fellow had started toward the spring on the far side of the Long Lane.
        - id: ch01-b10
          speaker: narrator
          text: The Little Breezes were delighted to hear the good news. They said so many kind things to Striped Chipmunk that he forgot all about scolding Farmer Brown's boy. Then they danced merrily toward the spring. They were sure Grandfather Frog would be perfectly fine there, and they expected him to feel quite at home.
        - id: ch01-b11
          speakers: [little_breeze_1, little_breeze_2, little_breeze_3, little_breeze_4]
          ensemble: chorus
          text: Hello, Grandfather Frog! How do you like your new home?
        - id: ch01-b12
          speaker: narrator
          text: They peeped down into the spring. Grandfather Frog did not answer. He only rolled his great goggly eyes up toward them, and those eyes were full of tears.
        - id: ch01-b13
          speakers: [little_breeze_1, little_breeze_2, little_breeze_3, little_breeze_4]
          ensemble: chorus
          text: Why, Grandfather Frog, what is wrong now?
          emotion: surprised
        - id: ch01-b14
          speaker: grandfather_frog
          text: Chugarum. I can't get out.
          emotion: sad
        - id: ch01-b15
          speaker: narrator
          text: His voice sounded choked. Only then did the Little Breezes notice the spring's straight, smooth walls and see how far below them Grandfather Frog was. They knew he had told the truth.
        - id: ch01-b16
          speaker: narrator
          text: First they bent the grasses growing around the edge, but none of them reached the water. Even if the grasses had been long enough, Grandfather Frog could not have climbed them. Next the Little Breezes tried to push a big stick into the spring. It was far too heavy, and they could not budge it.
        - id: ch01-b17
          speaker: narrator
          text: They did manage to blow an old shingle into the spring. Now Grandfather Frog had something to sit on, and that made him feel a little better.
        - id: ch01-b18
          speaker: narrator
          text: Then the Little Breezes said every comforting thing they could think of. They told him he would be safe down there, unless Farmer Brown's boy happened to spot him.
        - id: ch01-b19
          speaker: grandfather_frog
          text: That's exactly what scares me! If he comes here for a drink, he is sure to see me. There is nowhere for me to hide.
          emotion: fearful
        - id: ch01-b20
          speaker: little_breeze_1
          text: Maybe he won't come.
        - id: ch01-b21
          speaker: little_breeze_2
          text: If he does, you can slip under that piece of shingle. Then he won't even know you're here.
        - id: ch01-b22
          speaker: narrator
          text: Grandfather Frog brightened at once.
        - id: ch01-b23
          speaker: grandfather_frog
          text: That's true! It's a good idea, and I'll try it.
          emotion: happy
        - id: ch01-b24
          speaker: narrator
          text: One of the Merry Little Breezes promised to watch for Farmer Brown's boy. All the others set off once more to find someone who could help Grandfather Frog out of this new trouble.
