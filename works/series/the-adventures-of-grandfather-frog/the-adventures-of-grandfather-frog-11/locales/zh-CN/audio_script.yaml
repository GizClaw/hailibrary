audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    grandfather_frog:
      display_name: 青蛙爷爷
      tts:
        delivery: 年长稳重，受窘时仍爱逞强
        timbre: 浑厚圆润
        pace: 稍慢
        pitch: 低音
    bowser:
      display_name: 猎狗鲍泽
      tts:
        delivery: 直率顽皮，叫声响亮有力
        timbre: 粗厚洪亮
        pace: 中等
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第十一章　青蛙爷爷固执己见
      blocks:
        - id: ch01-b01
          speaker: grandfather_frog
          text: 呱，咕，咕隆！呱咕，呱咕，呱咕隆！
        - id: ch01-b02
          speaker: narrator
          text: 青蛙爷爷还真上路了。没错，他背对微笑池往前跳，杰里麝鼠说什么都没法让他回头。青蛙爷爷一旦打定主意，别人再劝也只是白费时间、白费口舌。他就是这么固执。对，说的正是固执。他非得亲眼看看，老蟾蜍先生常挂在嘴边的那个大世界，究竟哪里比自己住了一辈子的微笑池更好。
        - id: ch01-b03
          speaker: narrator
          text: 他一蹦就是老远，就这么跳上了绿草原，一边走，一边在心里给自己鼓劲。
        - id: ch01-b04
          speaker: grandfather_frog
          text: 老蟾蜍先生在大世界能照顾好自己，我当然也能！我看他才没有我聪明。论起灵活劲儿，他更是连我的一半都比不上。我一跳能跳出他三倍远呢。我要亲眼看清大世界到底是什么样。等我看过了，就回微笑池去，余下一辈子都待在那里，再也不出来了。呱咕隆，今天可真热！
        - id: ch01-b05
          speaker: narrator
          text: 这一天确实热。快活、圆滚滚、亮堂堂的太阳先生笑得格外灿烂，把最暖的阳光洒满绿草原。西风妈妈手下那些快乐的小微风，一大早玩得太起劲，这会儿累得全在打盹。没有谁，也没有一丝风来给青蛙爷爷送凉意。他每跳一下，身上就比先前更热一点。后来，他越来越渴，真想马上扎进亲爱的微笑池，泡在清凉的水里。可不管身上多难受，他就是不肯回头。哪怕这趟路会要了他的命，他也非看到大世界不可。于是，他还是一下、一下、又一下地往前跳。
        - id: ch01-b06
          speaker: narrator
          text: 从前，青蛙爷爷沿欢笑溪往上游或下游走，累了可以下水游，热了也能随时泡进水里凉快。可他从来没有离水这么远，这才知道，在草地上赶路完全不是一回事。刚开始，他还仗着一双生来就适合跳远的长腿，跳得又高又远。可长草总来碍事。慢慢地，他越跳越近，越跳越近，最后跳得更近了。每跳一下，他都呼哧呼哧地喘，后来还忍不住哼哼起来。他从前从没一口气跳过太久，最多跳上几下，随后总要休息。没过多久，两条腿便累得不行了。
        - id: ch01-b07
          speaker: narrator
          text: 要是他像常年住在绿草原上的小居民那样熟悉道路，就会走那条好走的僻静小径。可是他根本不知道该往哪儿去，只管一头闯进草丛，路自然难走极了。高高的草挡住视线，他连草顶外面都望不见。地上又坑坑洼洼，硌得那双娇嫩的脚直疼。他的脚早已习惯微笑池边柔软、长着苔藓的泥岸。才走出不远，他就打心眼里盼着自己从没想过去看大世界。可话已经说出口，他非去不可。于是，他跳两下，歇一歇，再跳三下，又歇一歇。后来只跳一下，就得歇上好久。
        - id: ch01-b08
          speaker: narrator
          text: 就在一次歇脚的时候，他忽然听见脚步声。接着，又传来一种可怕的声音，吓得他浑身一阵阵发冷。嗅，嗅，嗅！声音越来越近。青蛙爷爷连忙把身子紧紧贴住地面，恨不得再压低一点。可这样做一点用也没有。嗅鼻子的声音越来越近，越来越近。最后，猎狗鲍泽竟站在了他头顶上！鲍泽看到青蛙爷爷，也像他一样吃惊。他伸出一只前爪，把青蛙爷爷拨了个四脚朝天。青蛙爷爷挣扎着爬起来，吓得慌忙跳了两下。
        - id: ch01-b09
          speaker: bowser
          text: 汪，汪！
          emotion: happy
        - id: ch01-b10
          speaker: narrator
          text: 鲍泽叫着，又把他拨翻在地。鲍泽只觉得这个游戏好玩极了，青蛙爷爷却认定，自己的末日已经到了。
