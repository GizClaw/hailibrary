audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    grandfather_frog:
      display_name: Grandfather Frog
      tts:
        delivery: dignified with a gruff edge
        timbre: deep and resonant
        pace: unhurried
        pitch: low
    bowser_hound:
      display_name: Bowser the Hound
      tts:
        delivery: boisterous and playful
        timbre: full and rough
        pace: lively
        pitch: medium-low
  chapters:
    - id: ch01
      title: Grandfather Frog Is Stubborn
      blocks:
        - id: ch01-b01
          speaker: grandfather_frog
          text: "Fee, fi, fe, fum! Chug, chug, chugarum!"
        - id: ch01-b02
          speaker: narrator
          text: Grandfather Frog really had set off to see the Great World. Yes, sir, he turned his back on the Smiling Pool, and nothing Jerry Muskrat said could stop him. Once Grandfather Frog made up his mind, trying to change it only wasted time and breath. He was stubborn. That was the word for him. Old Mr. Toad, his cousin, was always talking about the Great World and saying it was far better than the Smiling Pool. Grandfather Frog had lived at the pool all his life, and now he meant to see that world for himself.
        - id: ch01-b03
          speaker: grandfather_frog
          text: "If old Mr. Toad can manage in the Great World, then so can I. He's no smarter than I am! Why, he isn't half as spry, and I can jump three times as far. I'll go see what the Great World is really like. Then I'll come back to the Smiling Pool and stay there for the rest of my life. Chugarum, it certainly is warm!"
        - id: ch01-b04
          speaker: narrator
          text: It was warm. Round, jolly Mr. Sun wore his broadest smile and poured his hottest rays across the Green Meadows. The Merry Little Breezes of Old Mother West Wind were asleep. They had played so hard early that morning that they were tired and needed a nap.
        - id: ch01-b05
          speaker: narrator
          text: Nothing was there to cool Grandfather Frog. Each jump left him hotter than the last. Soon he was thirsty, and he longed to plunge into the dear, cool Smiling Pool. Still, he would not turn around, no matter how uncomfortable he became. He meant to see the Great World even if it killed him. On he went. Jump, jump, jump, jump.
        - id: ch01-b06
          speaker: narrator
          text: Grandfather Frog had traveled up and down the Laughing Brook before. There he could swim whenever the bank tired him, and he could cool off whenever he grew too warm. Water had always been close whenever he needed a rest. Out here, there was none. He had never gone far from water, and crossing the Green Meadows was quite another matter.
        - id: ch01-b07
          speaker: narrator
          text: At first he took great leaps. After all, that was what his long legs were for. But the tall grass tangled around him. Before long, his jumps became shorter and shorter. He puffed with every one, and soon he began to grunt. He had never made more than a few jumps without a rest, and his legs quickly grew tired.
        - id: ch01-b08
          speaker: narrator
          text: If Grandfather Frog had known the Green Meadows as well as the little people who lived there all the time, he would have followed the Lone Little Path, where traveling was easy. But he knew nothing about it. He had simply started straight across without knowing where he was going, so his way was hard. Very hard indeed.
        - id: ch01-b09
          speaker: narrator
          text: The grass rose too high for him to see over it. The rough ground hurt his tender feet, which were used to the soft, mossy bank beside the Smiling Pool. He had not gone far before he wished with all his heart that he had never decided to see the Great World.
        - id: ch01-b10
          speaker: narrator
          text: But he had said he would go, and go he would. So he struggled on. Jump, jump, rest. Jump, jump, jump, rest. Then came one long rest.
        - id: ch01-b11
          speaker: narrator
          text: During that rest, Grandfather Frog heard footsteps. Then came a dreadful sound that sent cold chills all over him. Sniff, sniff, sniff! It drew closer and closer.
        - id: ch01-b12
          speaker: narrator
          text: Grandfather Frog pressed himself as flat against the ground as he could get. It did no good at all. The sniffing came nearer and nearer. Then Bowser the Hound stood right over him!
        - id: ch01-b13
          speaker: narrator
          text: Bowser looked every bit as surprised as Grandfather Frog felt. He reached out one paw and rolled the old frog onto his back. Grandfather Frog struggled upright and made two frightened jumps.
        - id: ch01-b14
          speaker: bowser_hound
          text: "Bow, wow!"
          emotion: surprised
        - id: ch01-b15
          speaker: narrator
          text: Bowser rolled him over once more. To Bowser, it was wonderful fun. Grandfather Frog was sure his last day had come.
