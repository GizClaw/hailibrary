audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    grandfather_frog:
      display_name: 青蛙爷爷
      tts:
        delivery: 年长稳重，受窘时仍爱逞强
        timbre: 浑厚圆润
        pace: 稍慢
        pitch: 低音
    jerry_muskrat:
      display_name: 杰里麝鼠
      tts:
        delivery: 好奇风趣，打趣时透着机灵
        timbre: 温和清朗
        pace: 中等
        pitch: 中音
  chapters:
    - id: ch01
      title: 第十章　青蛙爷爷动身去看大世界
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 这天早晨，青蛙爷爷坐在微笑池的大绿睡莲叶上，脸色十分严肃。他心里显然装着一件事。一只糊里糊涂的绿头苍蝇擦过他的鼻子，他居然毫无察觉。从前一天起，他就一直惦记着那场争论。表弟老蟾蜍先生来拜访，两人照例又吵起了那个老问题。是永远留在家里好，还是走进大世界好？
        - id: ch01-b02
          speaker: narrator
          text: 两人正争得起劲，布朗农夫家的男孩出现了。青蛙爷爷一向怕他，马上停住争辩，“扑通”一声跳进池里，藏到一片睡莲叶下面。他从那里望出去，只见老蟾蜍先生咧着嘴笑，那副得意的模样实在招人恼火。表弟不但不怕那个男孩，还夸口说他们是朋友。青蛙爷爷本来只当他在吹牛。
        - id: ch01-b03
          speaker: narrator
          text: 可布朗农夫家的男孩拿草秆挠老蟾蜍先生的下巴时，老蟾蜍先生坐得稳稳的，仿佛还很受用。青蛙爷爷这才明白，表弟没有吹牛。
        - id: ch01-b04
          speaker: narrator
          text: 老蟾蜍先生穿过绿草原回去以后，那个男孩也回家吃晚饭了。直到这时，青蛙爷爷才离开藏身的地方，爬回大绿睡莲叶。他在那里坐了半夜。平常，他总会用浑厚的低音领着微笑池的合唱，可这一晚，他一次也没有领大家唱。他只是想啊，想啊，想得非常认真。阳光明亮的早晨来了，他还在想。
        - id: ch01-b05
          speaker: narrator
          text: 他渐渐觉得，也许老蟾蜍先生说得对。大世界能让表弟学会跟布朗农夫家的男孩交朋友，那儿一定有值得学的东西。不过，他绝不肯对老蟾蜍先生或任何人承认，自己还需要学习。青蛙爷爷年纪很大，朋友们都说他很有智慧。可他心里已经开始怀疑，有些事情留在微笑池里，恐怕永远学不到。
        - id: ch01-b06
          speaker: narrator
          text: 青蛙爷爷坐着想了又想。忽然，他有了决定。
        - id: ch01-b07
          speaker: grandfather_frog
          text: 呱咕隆！我决定了，就这么办！
        - id: ch01-b08
          speaker: narrator
          text: 杰里麝鼠正好从旁边游过，听见这句话，便问他。
        - id: ch01-b09
          speaker: jerry_muskrat
          text: 你要办什么？
        - id: ch01-b10
          speaker: grandfather_frog
          text: 我要亲自出去看看。老蟾蜍先生老在说那个大世界，我倒要瞧瞧，它到底是什么样。
        - id: ch01-b11
          speaker: jerry_muskrat
          text: 你千万别去！这种傻事可做不得。青蛙爷爷，你年纪太大了，真的太大了，不能跑到大世界去呀。
        - id: ch01-b12
          speaker: narrator
          text: 老人家想随自己的心意做点什么，最不爱听别人说自己年纪太大，已经做不了了。青蛙爷爷也不例外。他立刻厉声顶了回去。
        - id: ch01-b13
          speaker: grandfather_frog
          text: 杰里麝鼠，管好你自己的事！不用你来告诉我，我也知道怎样对自己最好。老蟾蜍先生能在大世界里照顾自己，我当然也能。他还没我一半灵活呢。我要去，这事就这么定了！
          emotion: angry
        - id: ch01-b14
          speaker: narrator
          text: 说完，青蛙爷爷跳进微笑池，游到对岸一处低矮的池岸，从那里上了岸。他没有回头，径直走上绿草原，出发去看大世界了。
