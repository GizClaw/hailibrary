  chapters:
    - id: ch01
      title: Grandfather Frog Starts Out to See the Great World
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Grandfather Frog sat on his big green lily pad in the Smiling Pool, looking very solemn. Something was clearly on his mind. A foolish green fly even brushed his nose, and he never noticed. He had been thinking ever since his cousin, old Mr. Toad, visited the day before. As usual, the two had quarreled. Was it better to stay home forever, or to travel out into the Great World?
        - id: ch01-b02
          speaker: narrator
          text: In the middle of their argument, Farmer Brown's boy came along. Grandfather Frog was afraid of him. He stopped arguing, dived into the Smiling Pool with a great splash, and hid beneath a lily pad.
        - id: ch01-b03
          speaker: narrator
          text: Grandfather Frog stayed under the lily pad and watched old Mr. Toad grin in the most provoking way. Mr. Toad was not afraid of Farmer Brown's boy at all. He had even boasted that the two of them were friends. Grandfather Frog had thought that was nothing but an empty boast.
        - id: ch01-b04
          speaker: narrator
          text: Then Farmer Brown's boy tickled old Mr. Toad under the chin with a straw. Mr. Toad sat perfectly still and seemed to enjoy it. When Grandfather Frog saw that, he knew his cousin had told the truth.
        - id: ch01-b05
          speaker: narrator
          text: Grandfather Frog stayed hidden until old Mr. Toad had crossed the Green Meadows toward home and Farmer Brown's boy had gone home for supper. Only then did he climb back onto his big green lily pad. He sat there for half the night. Usually, his great deep bass voice led the chorus of the Smiling Pool. That night, he did not lead it even once. He was thinking as hard as he could. And on the bright, sunny morning that followed, he was still thinking.
        - id: ch01-b06
          speaker: narrator
          text: Perhaps old Mr. Toad was right after all. If the Great World had taught him how to make friends with Farmer Brown's boy, then it must hold some things worth learning. But Grandfather Frog would not have admitted that to Mr. Toad for anything in the world. He would not tell anyone else that he had something left to learn, either. He was very old, and all his friends thought him very wise.
        - id: ch01-b07
          speaker: narrator
          text: But deep in his heart, Grandfather Frog was beginning to believe there were some things he could never learn in the Smiling Pool. He thought and thought. Then, all at once, he made up his mind.
        - id: ch01-b08
          speaker: grandfather_frog
          text: "Chugarum! I'm going to do it!"
        - id: ch01-b09
          speaker: narrator
          text: Jerry Muskrat happened to be swimming past right then.
        - id: ch01-b10
          speaker: jerry_muskrat
          text: "Do what?"
        - id: ch01-b11
          speaker: grandfather_frog
          text: "I'll go see the Great World for myself. Then I'll know what that place my cousin, old Mr. Toad, talks about so much is really like."
        - id: ch01-b12
          speaker: jerry_muskrat
          text: "Please don't go. It would be terribly foolish. You're much too old to travel out into the Great World, Grandfather Frog."
        - id: ch01-b13
          speaker: narrator
          text: Few old people enjoy being told they are too old to do as they please. Grandfather Frog was no different.
        - id: ch01-b14
          speaker: grandfather_frog
          text: "You mind your own business, Jerry Muskrat! I can decide what's best for me without your advice. If old Mr. Toad can look after himself in the Great World, then so can I. Why, he's not nearly as lively as I am. I'm going, and that's final!"
          emotion: angry
        - id: ch01-b15
          speaker: narrator
          text: With that, Grandfather Frog dived into the Smiling Pool. He swam to a low place along the bank, climbed out, and never looked back. Away he went across the Green Meadows to see the Great World.
