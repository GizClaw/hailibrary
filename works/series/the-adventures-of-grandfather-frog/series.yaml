cover_prompt: |-
  A wordless cover scene beside a quiet New England pond in the early twentieth century shows an old green frog with a broad mouth, large goggly eyes, and a white-and-yellow waistcoat perched on a lily pad. A sleek brown mink and a playful brown otter crouch at the reedy bank while a tall blue-gray heron watches from the shallows with its long neck bent. The old frog makes a bold leap from the lily pad toward the grassy shore, beginning his journey into the wider meadow. Make the leap the clear focal action, with the pond, laughing brook, wild grasses, and distant farm lane forming a believable connected landscape. Use a wide child-height view with the animal figures gathered low in the frame and calm open morning sky above. Keep every animal anatomically convincing, expressive but not cartoon-distorted, and independent of any screen adaptation. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
