  chapters:
    - id: ch01
      title: Grandfather Frog Has a Strange Ride
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: A thousand things may happen to a traveler along the way. Ten thousand things may befall one who is careless, or who thinks he knows it all.
        - id: ch01-b02
          speaker: narrator
          text: Grandfather Frog followed Danny Meadow Mouse up the Lone Little Path. As they went, he began to think Danny was the most timid little fellow among all the meadow people he knew. Danny stayed beneath the grass that hung over the path whenever he could. At every perfectly bare stretch, he looked one way, then the other, and his eyes were anxious. After that, he scampered across as fast as his small legs could carry him. Once he was safely over, he stopped and waited for Grandfather Frog. Whenever a shadow crossed the grass, Danny slipped under the nearest leaf and held his breath.
        - id: ch01-b03
          speaker: grandfather_frog
          text: "Foolish! How foolish to be frightened all the time! I wait until I see something worth fearing. Then there will be time enough to worry. Why go looking for trouble? Here I am, out in the Great World, and I'm not afraid. Yet Danny has lived here all his life and acts as though something dreadful might happen at any moment. Pooh! What nonsense!"
        - id: ch01-b04
          speaker: narrator
          text: Grandfather Frog was old, and everyone at the Smiling Pool thought him very wise. But even the wisest can act foolishly when they believe they know everything. This time, Grandfather Frog was the foolish one, not Danny Meadow Mouse.
        - id: ch01-b05
          speaker: narrator
          text: Danny knew every danger of the Green Meadows. He knew how many sharp eyes were watching for him all the time. Long ago, he had learned that feeling afraid was the only way to feel safe. Fear kept him watching for danger every moment, so his hungry enemies were not likely to take him by surprise.
        - id: ch01-b06
          speaker: narrator
          text: So while Grandfather Frog looked down on Danny for being timid, Danny was really doing the wisest thing. More than that, he was very brave. On his own, Danny would never even have thought of traveling anywhere but along his secret little paths. Still, he was leading Grandfather Frog up the open Lone Little Path because the old frog could only jump where the way was fairly clear. Danny feared Grandfather Frog would surely meet a sad end if no one went along to watch for danger.
        - id: ch01-b07
          speaker: narrator
          text: They went farther and farther without any trouble. To Grandfather Frog, Danny's running and hiding looked sillier with every step. He was just about to say so when Danny plunged into the long grass and warned him to follow. Grandfather Frog refused.
        - id: ch01-b08
          speaker: grandfather_frog
          text: "Chugarum! I can't see a thing to fear, so I won't hide until I do."
        - id: ch01-b09
          speaker: narrator
          text: He sat right in the middle of the Lone Little Path. He looked one way and then the other, but saw nothing frightening. At that very moment, someone came around a bend in the path. Can you guess who it was? Farmer Brown's boy!
        - id: ch01-b10
          speaker: narrator
          text: The boy spotted Grandfather Frog and gave a joyful whoop. Then he sprang toward him. Grandfather Frog let out a frightened croak and jumped, but he had waited too long. Before he could leap again, Farmer Brown's boy caught him by his long hind legs.
        - id: ch01-b11
          speaker: farmer_browns_boy
          text: "Ha, ha! I think you're the same old fellow I've tried so many times to catch at the Smiling Pool. Those legs of yours will make mighty fine eating, Mr. Frog. Yes, indeed they will!"
          emotion: happy
        - id: ch01-b12
          speaker: narrator
          text: Farmer Brown's boy tied Grandfather Frog's legs together. Then he continued across the Green Meadows, with the poor old frog dangling from the end of a string. It was the strangest kind of ride, and a terribly uncomfortable one. With all his heart, Grandfather Frog wished he had never decided to go out into the Great World.
