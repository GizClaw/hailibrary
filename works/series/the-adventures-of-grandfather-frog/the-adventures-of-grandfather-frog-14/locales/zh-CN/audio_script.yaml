audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    grandfather_frog:
      display_name: 青蛙爷爷
      tts:
        delivery: 年长稳重，受窘时仍爱逞强
        timbre: 浑厚圆润
        pace: 稍慢
        pitch: 低音
    danny_meadow_mouse:
      display_name: 丹尼草地鼠
      tts:
        delivery: 机灵直率，劝告时认真又干脆
        timbre: 清脆明亮
        pace: 稍快
        pitch: 中高音
    farmer_browns_boy:
      display_name: 农夫布朗家的男孩
      tts:
        delivery: 乡野少年的爽直口吻，兴奋时响亮利落
        timbre: 清朗有力
        pace: 明快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第十四章　青蛙爷爷经历了一趟奇怪的旅行
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 旅人若是太大意，或是自认样样通，一千件事会发生，一万场祸从天降。
        - id: ch01-b02
          speaker: narrator
          text: 青蛙爷爷跟在丹尼草地鼠身后，沿着孤零零小径一路往前跳。他渐渐觉得，自己认识的草原小居民当中，就数丹尼胆子最小，也最容易受惊。只要小径上方垂着草叶，丹尼就躲在下面走。碰上没有遮挡的光秃地段，他先提心吊胆地看看这边，再瞧瞧那边，接着迈开小腿，飞快地冲过去。等安全到了另一头，他才停下来等青蛙爷爷。哪怕只有一道影子掠过草地，丹尼也会立刻钻到最近的叶子底下，屏住呼吸。
        - id: ch01-b03
          speaker: narrator
          text: 青蛙爷爷在后面看着，忍不住嘟囔起来。
        - id: ch01-b04
          speaker: grandfather_frog
          text: 真傻！怕成这样，真是傻透了！我呢，非得看见什么可怕的东西，才会害怕。到时候再怕也来得及。一天到晚总想着会有麻烦，这有什么用？你看，我已经来到大世界了，可我一点儿也不怕。丹尼草地鼠在这里住了一辈子，却像是随时都会大祸临头。呸，实在太傻了！
        - id: ch01-b05
          speaker: narrator
          text: 青蛙爷爷年纪很大，微笑池里的居民都把他看作一位非常聪明的老人家。不过，再聪明的人，要是以为什么事都懂，也会犯傻。这回犯傻的正是青蛙爷爷，不是丹尼。丹尼熟悉绿草原上的每一种危险，也知道一直都有许多双锐利的眼睛盯着他。他早就学会了，要想平安，就得心存戒惧。这样，他时时都留心危险，那些饥饿的敌人便很难让他措手不及。
        - id: ch01-b06
          speaker: narrator
          text: 青蛙爷爷嫌丹尼胆小，可丹尼做的其实才是最明智的事。不光如此，他还真的很勇敢。若不是为了给青蛙爷爷带路，他绝不会离开自己的隐秘小径，到别处旅行。可是青蛙爷爷只会跳，只有孤零零小径这样比较开阔的路才走得了。丹尼担心，要是身边没人替青蛙爷爷留意危险，他一定会落得悲惨的下场。因此，他才陪着青蛙爷爷去看大世界。
        - id: ch01-b07
          speaker: narrator
          text: 两位一路平安，什么也没发生。走得越远，青蛙爷爷越觉得，丹尼一会儿飞跑、一会儿躲藏的样子实在可笑。他正要把心里的看法全说出来，丹尼忽然钻进长草，还警告他赶快躲进去。青蛙爷爷偏偏不肯。
        - id: ch01-b08
          speaker: grandfather_frog
          text: 呱咕隆！我连一样可怕的东西都没瞧见。没看见以前，我才不会躲起来。
        - id: ch01-b09
          speaker: narrator
          text: 青蛙爷爷就那么坐在孤零零小径正中央，一动也不动。他左看看，右瞧瞧，确实没看到什么可怕的东西。可就在这时候，小径的转弯处走来了一个人。你猜是谁？是农夫布朗家的男孩！
        - id: ch01-b10
          speaker: narrator
          text: 男孩一看见青蛙爷爷，高兴得欢呼一声，立刻朝他扑过去。青蛙爷爷吓得呱叫起来，纵身就跳，可惜太迟了。还没等他再跳一次，男孩已经抓住了他的两条长后腿。
        - id: ch01-b11
          speaker: farmer_browns_boy
          text: 哈，哈！我看你就是微笑池里的那个老家伙。我抓了那么多次都没抓着，今天总算逮到你了。青蛙先生，你这两条腿一定特别好吃。对，一定好吃极了！
          emotion: happy
        - id: ch01-b12
          speaker: narrator
          text: 说完，男孩把青蛙爷爷的两条腿捆在一起，继续穿过绿草原赶路。可怜的青蛙爷爷拴在绳子末端，一路晃晃荡荡地吊着。这趟旅行既奇怪，又难受极了。青蛙爷爷用尽全身力气盼望着，但愿自己从来不曾动过去大世界的念头。
