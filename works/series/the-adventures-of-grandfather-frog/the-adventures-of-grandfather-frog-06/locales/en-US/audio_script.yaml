audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    jerry_muskrat:
      display_name: Jerry Muskrat
      tts:
        delivery: curious and playfully knowing
        timbre: friendly and rounded
        pace: moderate
        pitch: medium
    grandfather_frog:
      display_name: Grandfather Frog
      tts:
        delivery: dignified with a gruff edge
        timbre: deep and resonant
        pace: unhurried
        pitch: low
    longlegs:
      display_name: Longlegs the Blue Heron
      tts:
        delivery: proud and sharp-spoken
        timbre: reedy and piercing
        pace: deliberate
        pitch: medium-high
    whitetail:
      display_name: Whitetail the Marsh Hawk
      tts:
        delivery: fierce and quick-tempered
        timbre: hard and cutting
        pace: brisk
        pitch: high
  chapters:
    - id: ch01
      title: A Meal Lost at the Last Moment
      blocks:
        - id: ch01-b01
          speaker: longlegs
          text: "You did!"
          emotion: angry
        - id: ch01-b02
          speaker: whitetail
          text: "I didn't! I didn't!"
          emotion: angry
        - id: ch01-b03
          speaker: longlegs
          text: "You did!"
          emotion: angry
        - id: ch01-b04
          speaker: narrator
          text: What a dreadful fuss they made after Grandfather Frog disappeared!
        - id: ch01-b05
          speaker: narrator
          text: All morning, Longlegs the Blue Heron had waited patiently on one foot. He was watching Grandfather Frog on his big green lily pad, hoping the old frog would fall asleep. Longlegs had missed breakfast, and lunchtime had already come. He was sure Grandfather Frog would make up both meals. He felt so empty that he imagined the sides of his stomach might cave in with nothing inside to hold them up.
        - id: ch01-b06
          speaker: narrator
          text: Then, without a bit of warning, old Whitetail the Marsh Hawk sailed over the Smiling Pool. His great claws reached for Grandfather Frog. But at the very last moment, Grandfather Frog plunged into the water with a tremendous splash.
    - id: ch02
      title: Two Hungry Hunters
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Is anything harder on your temper than losing a fine meal when you are very, very, very hungry? Longlegs had never truly caught that meal, of course. Still, he had been certain Grandfather Frog would be his. When the frog escaped, Longlegs lost his temper completely. Even his yellow eyes seemed to turn yellower.
        - id: ch02-b02
          speaker: longlegs
          text: "You thieving robber!"
          emotion: angry
        - id: ch02-b03
          speaker: narrator
          text: Whitetail was every bit as hungry as Longlegs, and he had come even closer to catching Grandfather Frog. His temper was quicker, too. He had already spun around and rushed at Jerry Muskrat. Jerry only gave a most annoying laugh and ducked beneath the water.
        - id: ch02-b04
          speaker: narrator
          text: That made Whitetail angrier than ever. Then Longlegs called him a robber and a thief. No self-respecting hawk would put up with that. Whitetail shook with rage as he turned through the air and flew straight at Longlegs.
        - id: ch02-b05
          speaker: whitetail
          text: "I'm no more of a robber or thief than you are!"
          emotion: angry
        - id: ch02-b06
          speaker: longlegs
          text: "You scared away the frog I was hunting!"
          emotion: angry
        - id: ch02-b07
          speaker: whitetail
          text: "I did not!"
          emotion: angry
        - id: ch02-b08
          speaker: longlegs
          text: "You did!"
          emotion: angry
        - id: ch02-b09
          speaker: whitetail
          text: "I did not! That frog wasn't yours. He was mine!"
          emotion: angry
    - id: ch03
      title: The Quarrel Becomes a Fight
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Grandfather Frog and Jerry Muskrat peeked out from beneath some lily pads.
        - id: ch03-b02
          speaker: grandfather_frog
          text: "Chugarum! I never knew I belonged to anyone. I truly didn't. Did you know?"
        - id: ch03-b03
          speaker: narrator
          text: Jerry watched Longlegs and Whitetail, his eyes bright with excitement.
        - id: ch03-b04
          speaker: jerry_muskrat
          text: "No. That's news to me."
        - id: ch03-b05
          speaker: whitetail
          text: "You're too lazy to hunt the honest way!"
          emotion: angry
        - id: ch03-b06
          speaker: narrator
          text: Whitetail circled Longlegs, waiting for a chance to strike with his great, cruel claws.
        - id: ch03-b07
          speaker: longlegs
          text: "I'm too honest to snatch food away just as someone else is about to eat it!"
          emotion: angry
        - id: ch03-b08
          speaker: narrator
          text: Longlegs danced around to keep facing Whitetail. He held one broad wing before him like a shield, with his long, strong bill ready to strike. Every feather on Whitetail's head stood straight up with rage. He looked fierce and terrible.
        - id: ch03-b09
          speaker: narrator
          text: At last Whitetail spotted what he thought was an opening and shot down. His claws caught only one feather from the wing Longlegs held before him. Before Whitetail could escape, Longlegs struck him twice with that long bill. Whitetail cried out in pain.
    - id: ch04
      title: Anger Brings Nothing
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: On and on they fought. Feathers covered the ground. At last, both birds were too tired to fight anymore.
        - id: ch04-b02
          speaker: narrator
          text: Old Whitetail flew slowly and painfully over the Green Meadows. Longlegs, his wings torn and ragged, flew heavily down the Laughing Brook toward the Big River. They were both very sore and stiff, and they were still hungry.
        - id: ch04-b03
          speaker: narrator
          text: Grandfather Frog climbed back onto his big green lily pad and settled in the warm sunshine.
        - id: ch04-b04
          speaker: grandfather_frog
          text: "Dear me! What a dreadful thing anger is, and what a useless thing, too."
