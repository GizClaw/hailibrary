audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    whitetail_hawk:
      display_name: 白尾泽鹰
      tts:
        delivery: 精明执着，盘算猎物时透着急切
        timbre: 锐利而略显沙哑
        pace: 中快
        pitch: 中音
    grandfather_frog:
      display_name: 青蛙爷爷
      tts:
        delivery: 年长稳重，受窘时仍爱逞强
        timbre: 浑厚圆润
        pace: 稍慢
        pitch: 低音
    longlegs_heron:
      display_name: 长腿苍鹭
      tts:
        delivery: 沉着耐心，盘算时透着自信
        timbre: 清朗而略显低沉
        pace: 舒缓
        pitch: 中低音
    jerry_muskrat:
      display_name: 杰里麝鼠
      tts:
        delivery: 好奇风趣，打趣时透着机灵
        timbre: 温和清朗
        pace: 中等
        pitch: 中音
  chapters:
    - id: ch01
      title: 第六章　长腿和白尾争吵
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: “就是你干的！”“才不是我！”青蛙爷爷刚藏起来，长腿苍鹭和白尾泽鹰就这样吵翻了天。
        - id: ch01-b02
          speaker: narrator
          text: 长腿单脚站在池边，耐心等了整整一上午。他只盼青蛙爷爷在大绿荷叶上睡着，好把这只青蛙当作早餐和午餐。长腿早饭没吃，如今午饭时候也到了。他饿得觉得肚皮两边都要瘪下去了，里面空空的，什么也撑不住。
        - id: ch01-b03
          speaker: narrator
          text: 谁知老白尾毫无预兆地掠过微笑池，伸出大爪子来抓青蛙爷爷。青蛙爷爷就在最后一刻跳进水里，“扑通”一声，逃掉了。
        - id: ch01-b04
          speaker: narrator
          text: 人饿得厉害时，眼看一顿美餐飞走，还有什么更容易惹出火气呢？其实这顿饭本来也不属于长腿，只是他认定自己吃得到。青蛙爷爷一落水，长腿就彻底发了火，连那双黄眼睛都好像更黄了。
        - id: ch01-b05
          speaker: longlegs_heron
          text: 你这个强盗！你这个小偷！
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: 老白尾同样饿得厉害，而且他离抓住青蛙爷爷只差一点儿。他的脾气比长腿还急。刚才，他闪电般转身扑向杰里麝鼠，杰里却笑得格外气人，一低头钻进了水里。白尾已经气上加气，如今又被骂成强盗和小偷，哪一只有自尊的鹰受得了？没错，先生，绝对受不了！
        - id: ch01-b07
          speaker: narrator
          text: 白尾气得浑身发抖。他在空中再次转身，直扑长腿苍鹭。
        - id: ch01-b08
          speaker: whitetail_hawk
          text: 你骂我是强盗、小偷？你自己也好不到哪儿去！
          emotion: angry
        - id: ch01-b09
          speaker: longlegs_heron
          text: 明明是你把我要吃的青蛙吓跑了！
          emotion: angry
        - id: ch01-b10
          speaker: whitetail_hawk
          text: 这可不是我干的！
          emotion: angry
        - id: ch01-b11
          speaker: longlegs_heron
          text: 就是你干的！
          emotion: angry
        - id: ch01-b12
          speaker: whitetail_hawk
          text: 才不是！那只青蛙又不是你的，他是我的！
          emotion: angry
        - id: ch01-b13
          speaker: narrator
          text: 青蛙爷爷和杰里藏在几片荷叶下面，一起探出头来看热闹。
        - id: ch01-b14
          speaker: grandfather_frog
          text: 咕咕隆！我怎么不知道自己成了谁的东西？这事我真的一点儿也不知道。杰里，你知道吗？
        - id: ch01-b15
          speaker: narrator
          text: 杰里盯着长腿和白尾，两眼兴奋得直发亮。
        - id: ch01-b16
          speaker: jerry_muskrat
          text: 我也不知道。今天可真长见识了。
        - id: ch01-b17
          speaker: whitetail_hawk
          text: 你懒得很，根本不肯像正经人那样自己打猎！
          emotion: angry
        - id: ch01-b18
          speaker: narrator
          text: 白尾一边嘲弄长腿，一边绕着他盘旋，等着机会用那双又大又凶的利爪下手。
        - id: ch01-b19
          speaker: longlegs_heron
          text: 我可比你诚实，绝不会从别人嘴边抢吃的！
          emotion: angry
        - id: ch01-b20
          speaker: narrator
          text: 长腿跟着不停转动，让自己始终面对白尾。他举起一只宽大的翅膀挡在身前，就像举着一面盾牌，细长有力的尖嘴也准备好了，随时都能啄下去。
        - id: ch01-b21
          speaker: narrator
          text: 白尾气得头顶每一根羽毛都竖了起来，看上去又凶又吓人。终于，他发现了一个机会，至少他自己是这么想的。白尾猛冲下来，却只从长腿护在身前的翅膀上抓走一根羽毛。
        - id: ch01-b22
          speaker: narrator
          text: 白尾还没来得及飞开，长腿的尖嘴已经接连啄中他两次，疼得他尖声惨叫。两个家伙打个不停，直到地上落满了羽毛，也都累得再也打不动了。
        - id: ch01-b23
          speaker: narrator
          text: 老白尾缓慢又吃力地飞过绿草地。长腿的翅膀被扯得破破烂烂，他也沉重地沿着笑溪飞向大河。他们浑身酸疼，身子僵硬，肚子却依然空空的。
        - id: ch01-b24
          speaker: narrator
          text: 青蛙爷爷重新爬上那片大绿荷叶，回到温暖的阳光里。
        - id: ch01-b25
          speaker: grandfather_frog
          text: 哎呀，哎呀！发火真是又可怕，又一点儿用也没有啊。
