audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切活泼，带着讲故事的幽默感
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    grandfather_frog:
      display_name: 青蛙爷爷
      tts:
        delivery: 年长稳重，受窘时仍爱逞强
        timbre: 浑厚圆润
        pace: 稍慢
        pitch: 低音
    little_joe_otter:
      display_name: 小乔水獭
      tts:
        delivery: 开朗淘气，反应爽快
        timbre: 明快清润
        pace: 中快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第七章　青蛙爷爷的大嘴巴惹了祸
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 青蛙爷爷有一张特别大的嘴巴。这件事你知道，微笑池、笑溪和绿草地上的大伙儿也都知道。朋友们常拿他的嘴巴开玩笑，可他从来不往心里去，连一点儿也不在乎。
        - id: ch01-b02
          speaker: narrator
          text: 青蛙爷爷早就发现，大嘴巴捉傻乎乎的绿头苍蝇可方便了。要是两只苍蝇一起来，那就更方便。所以，他很为这张嘴巴得意，就像他也很为那双鼓眼睛得意一样。
        - id: ch01-b03
          speaker: narrator
          text: 可大嘴巴偶尔也会给他惹麻烦。大嘴巴好像总有这个毛病。嘴里装得多，他有时就会贪心。明明肚子已经撑满了，他还要把嘴巴塞满，当然怎么也咽不下去。到了这时候，青蛙爷爷看上去又傻又滑稽，一点儿也不庄重。
        - id: ch01-b04
          speaker: narrator
          text: 大家都说，青蛙爷爷年纪这么大，早该懂事了。他这样贪吃，真该害臊。或许他真的觉得害臊，只是从来不肯说。反正下一次有机会，他多半还会照样再来一回。
        - id: ch01-b05
          speaker: narrator
          text: 一天早晨，青蛙爷爷吃了好多傻乎乎的绿头苍蝇，早饭吃得美极了。他明明一口也吃不下了，偏偏小乔水獭就在这时来了。小乔刚去大河捉过鱼。他自己已经吃饱，正沿着笑溪，把剩下的鱼送到一个秘密地方藏起来。
        - id: ch01-b06
          speaker: narrator
          text: 青蛙爷爷偶尔也爱换换口味，吃上几条鱼。一看见小乔带来的那些鱼，他的眼睛立刻亮了。肚子虽然已经很饱，嘴里的口水却还是冒了出来。
        - id: ch01-b07
          speaker: little_joe_otter
          text: 早上好，青蛙爷爷！您吃早饭了吗？
        - id: ch01-b08
          speaker: narrator
          text: 青蛙爷爷很想说没吃，可他向来只说真话。
        - id: ch01-b09
          speaker: grandfather_frog
          text: 吃——过了。早饭倒是吃了，可也没吃到什么好东西。你问这个做什么？
        - id: ch01-b10
          speaker: little_joe_otter
          text: 没什么。我只是想着，您要是还没吃，可能会想来条鱼。不过您既然吃过早饭，那当然不想要了。
        - id: ch01-b11
          speaker: narrator
          text: 小乔的眼睛渐渐闪起调皮的光。他故意把鱼伸到青蛙爷爷面前，让对方把那些肥美诱人的鱼看个清楚。
        - id: ch01-b12
          speaker: grandfather_frog
          text: 咕咕隆！这些鱼可真不错，真的很不错。你还惦记着我这个可怜的老家伙，真是难得。我——呃——这么说吧，要是你舍得，我的肚子里也许还能挤下一条特别小的小鱼。
        - id: ch01-b13
          speaker: narrator
          text: 小乔太清楚青蛙爷爷有多贪吃了。他看看那件黄白相间的背心，里面早已撑得鼓鼓的，眼看就要裂开。小乔眼里的笑意更淘气了。
        - id: ch01-b14
          speaker: little_joe_otter
          text: 我当然舍得。可您是我的老朋友，我哪能只送您一条特别小的鱼呢？
        - id: ch01-b15
          speaker: narrator
          text: 小乔说完，挑出最大的一条鱼，扔到了青蛙爷爷跟前。鱼“哗啦”一声落在他鼻子旁边，几乎有他半个身子那么大。它肥嘟嘟的，看起来实在诱人。青蛙爷爷一下就忘了，自己的肚子已经撑得满满的。
        - id: ch01-b16
          speaker: narrator
          text: 青蛙爷爷连谢谢小乔都忘了。他张开大嘴，一口咬住那条鱼。没错，先生，他真就这么做了。几乎还没等你眨一下眼睛，鱼已经头朝下，滑进了他的喉咙。
        - id: ch01-b17
          speaker: narrator
          text: 青蛙爷爷没有牙齿，不能把东西咬成两截，只能整个吞下去。他正想把这条鱼也整个咽下。起初还很顺利，鱼头一直到了他的胃。可一个已经装满的东西，怎么还能再往里塞呢？他的胃早被傻乎乎的绿头苍蝇挤满了。
        - id: ch01-b18
          speaker: narrator
          text: 那条鱼就这样卡在那里。青蛙爷爷使足了劲，一口接一口地吞，可鱼连一点儿也不肯再往下走。他又想把它弄出来，可鱼已经钻进喉咙太深，怎么也退不回去。
        - id: ch01-b19
          speaker: narrator
          text: 青蛙爷爷喘不过气来了。
