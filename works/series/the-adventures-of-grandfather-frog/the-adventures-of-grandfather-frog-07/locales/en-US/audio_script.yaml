  chapters:
    - id: ch01
      title: Grandfather Frog's Big Mouth Gets Him in Trouble
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Grandfather Frog has a great big mouth. You know that, and so does everyone else. His friends around the Smiling Pool, the Laughing Brook, and the Green Meadows have teased him many times about its size. But Grandfather Frog has never minded, not even a little.
        - id: ch01-b02
          speaker: narrator
          text: Long ago, he learned how useful a big mouth can be when foolish green flies are passing by. It works especially well when two flies come along at once. So Grandfather Frog is quite proud of his big mouth. He is proud of his goggly eyes too.
        - id: ch01-b03
          speaker: narrator
          text: Every now and then, though, that big mouth gets him into trouble. Big mouths tend to do that. His mouth can hold so much that Grandfather Frog sometimes gets greedy. Even after his stomach is full, he crams in more food. Then he cannot swallow it.
        - id: ch01-b04
          speaker: narrator
          text: When that happens, Grandfather Frog looks foolish, silly, and far from dignified. Everyone tells him he is a greedy fellow. They say he is old enough to know better and ought to be ashamed. Perhaps he is ashamed, but he never admits it. And when another chance comes, he nearly always does the very same thing again.
        - id: ch01-b05
          speaker: narrator
          text: One morning, Grandfather Frog ate a very good breakfast of foolish green flies. He had eaten plenty and did not need one more bite. Then Little Joe Otter came along. He had been fishing down at the Big River.
        - id: ch01-b06
          speaker: narrator
          text: Little Joe had eaten all the fish he could hold. Now he was carrying the rest of his catch toward a secret hiding place up the Laughing Brook.
        - id: ch01-b07
          speaker: narrator
          text: Grandfather Frog likes a change from flies, and he is very fond of fish. The moment he saw Little Joe's catch, his eyes began to shine. His stomach was full, but his mouth watered anyway.
        - id: ch01-b08
          speaker: little_joe_otter
          text: "Good morning, Grandfather Frog! Did you eat breakfast already?"
        - id: ch01-b09
          speaker: narrator
          text: Grandfather Frog wished he could say no. But he always tells the truth.
        - id: ch01-b10
          speaker: grandfather_frog
          text: "Ye-e-s. I had a breakfast of sorts. What makes you ask?"
        - id: ch01-b11
          speaker: little_joe_otter
          text: "Oh, no special reason. If you hadn't eaten yet, I thought you might enjoy a fish. Since you have, you surely don't need one."
        - id: ch01-b12
          speaker: narrator
          text: A twinkle appeared in Little Joe's bright eyes. He held out his catch and made sure Grandfather Frog could see how plump and fine the fish looked.
        - id: ch01-b13
          speaker: grandfather_frog
          text: "Chugarum! Those fish do look fine. Yes, very fine indeed. How kind of you to remember a poor old fellow like me. I, er... well, perhaps I could make room for one tiny little fish, if you have one to spare."
        - id: ch01-b14
          speaker: narrator
          text: Little Joe knew all about Grandfather Frog's greedy ways. He glanced at the old frog's white and yellow waistcoat. It was already stuffed until it looked ready to burst. The twinkle in Little Joe's eyes grew even more mischievous.
        - id: ch01-b15
          speaker: little_joe_otter
          text: "I can spare one, of course. But I would never give such an old friend a tiny little fish."
        - id: ch01-b16
          speaker: narrator
          text: Little Joe chose the biggest fish in his catch and tossed it to Grandfather Frog. It struck the water beside the old frog's nose with a mighty splash. The fish was nearly half as big as Grandfather Frog himself.
        - id: ch01-b17
          speaker: narrator
          text: It was plump, and it looked so tempting that Grandfather Frog forgot his stomach was full. He even forgot his manners and never thanked Little Joe. He simply opened that enormous mouth and grabbed the fish.
        - id: ch01-b18
          speaker: narrator
          text: Yes, sir, that is exactly what he did. In less time than it takes to blink, the fish was sliding headfirst down Grandfather Frog's throat.
        - id: ch01-b19
          speaker: narrator
          text: Grandfather Frog has no teeth, as you know. He cannot bite his food into pieces. Whatever he eats must go down whole, and that was how he tried to swallow the fish.
        - id: ch01-b20
          speaker: narrator
          text: At first, everything went well. Then the fish's head reached his stomach. But nothing else will fit inside something that is already full. Grandfather Frog's stomach was packed tight with foolish green flies.
        - id: ch01-b21
          speaker: narrator
          text: The fish stopped right there. Grandfather Frog gulped and swallowed with all his might, but he could not move it any farther. Next he tried to pull it back out. That did no good either, because the fish had gone too far down his throat.
        - id: ch01-b22
          speaker: narrator
          text: Grandfather Frog began to choke.
