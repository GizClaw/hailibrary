  chapters:
    - id: ch01
      title: The Golden Apple Tree
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Before an emperor's palace stood a golden apple tree. Every night it opened its blossoms and ripened its fruit. Yet every morning the apples had vanished, and even the blossoms had been stripped from the branches. No one could discover the thief.
        - id: ch01-b02
          speaker: emperor
          text: If I could only stop these robbers from taking my fruit, I would be happy indeed.
        - id: ch01-b03
          speaker: eldest_prince
          text: I will watch the tree tonight, Father. Then we will soon know who is stealing from it.
        - id: ch01-b04
          speaker: narrator
          text: As soon as darkness fell, the eldest son hid near the tree. The apples had barely begun to ripen when sleep overcame him. At sunrise he woke to find every apple gone. Deeply ashamed, he dragged himself back to his father and confessed his failure.
        - id: ch01-b05
          speaker: narrator
          text: The second son was certain he could do better. He went out cheerfully the next night and settled down beside the tree. But his eyes grew heavy almost at once. When the morning sun woke him, not one apple remained.
        - id: ch01-b06
          speaker: narrator
          text: Then came the youngest son's turn. He made himself a comfortable bed under the tree and settled down to sleep. Near midnight he woke, sat up, and looked into the branches. A marvelous sight met his eyes. The golden apples were just beginning to ripen, and they glowed so brightly that their light spread across the whole palace.
        - id: ch01-b07
          speaker: narrator
          text: Nine golden pea-hens swept through the air. Eight landed among the fruit-heavy branches. The ninth fluttered down beside the prince and changed at once into a maiden more beautiful than any lady at his father's court.
        - id: ch01-b08
          speaker: narrator
          text: The prince fell in love with her at once. They talked until the maiden saw that her sisters had finished gathering the apples.
        - id: ch01-b09
          speaker: empress
          text: My sisters are ready. We must all go home now.
        - id: ch01-b10
          speaker: narrator
          text: The prince begged her to leave him a little fruit. She gave him two golden apples, one for him and one for his father. Then she became a pea-hen again, and all nine flew away.
        - id: ch01-b11
          speaker: narrator
          text: As soon as the sun rose, the prince went into the palace and held out one of the apples to his father. The emperor was delighted to see the fruit at last. He praised his youngest son warmly for being clever enough to succeed where the others had failed. That evening the prince returned to his bed beneath the apple tree. Everything happened just as it had before, and the same thing continued for several nights. Each morning he came home carrying two golden apples.
        - id: ch01-b12
          speaker: narrator
          text: His brothers grew angry and went to an old witch. She promised to spy on him and learn his secret. That evening she hid under his bed beside the tree. The prince soon arrived and fell asleep.
        - id: ch01-b13
          speaker: narrator
          text: Near midnight there came a sudden rush of wings. Eight golden pea-hens settled in the apple tree and busied themselves stripping fruit from the branches. The ninth landed below, changed into the beautiful maiden, and ran to greet the prince. From her hiding place, the witch stretched out one hand and cut away a lock of the maiden's hair. The girl sprang up at once. She became a pea-hen again, spread her wings, and flew away. Her eight sisters left the tree and followed her into the night.
        - id: ch01-b14
          speaker: youngest_prince
          text: What has happened to her?
          emotion: surprised
        - id: ch01-b15
          speaker: narrator
          text: The prince searched around him and found the witch under the bed. Furious, he dragged her out, called his guards, and ordered them to put her to death at once. But that could not bring the pea-hens back.
        - id: ch01-b16
          speaker: narrator
          text: Night after night he returned to the tree and wept for his lost love. At last he could endure it no longer. He decided to search the whole world for her. His father said the search was hopeless and reminded him that other beautiful maidens lived in the world. The prince would not listen. With only one servant, he set out.
    - id: ch02
      title: The Twelfth Cellar
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The prince and his one servant traveled for many days before they reached a great gate. Through the bars the prince could make out the streets of a town, and beyond them stood a palace. He tried to go in, but the gatekeeper blocked the way. The man demanded to know who the stranger was, why he had come, and how he had ever discovered the road to that place. The prince could not pass until the empress herself came to the gate and gave him permission.
        - id: ch02-b02
          speaker: narrator
          text: A message went to the empress. When she came to the gate, the prince could hardly believe his eyes. She was the maiden he had crossed the world to find. She hurried to him, took his hand, and led him into the palace.
        - id: ch02-b03
          speaker: narrator
          text: A few days later they married. The prince forgot his father and brothers and decided he would spend the rest of his life in that castle.
        - id: ch02-b04
          speaker: narrator
          text: One morning the empress prepared to walk alone. She placed the keys to twelve cellars in her husband's care.
        - id: ch02-b05
          speaker: empress
          text: You may enter the first eleven cellars if you wish. But do not even unlock the twelfth. If you do, something terrible will come of it.
        - id: ch02-b06
          speaker: narrator
          text: Left by himself, the prince soon grew restless and looked for some amusement.
        - id: ch02-b07
          speaker: youngest_prince
          text: What could be hidden in that twelfth cellar? Why am I forbidden to see it?
        - id: ch02-b08
          speaker: narrator
          text: He carried the keys downstairs and unlocked the cellar doors one after another. The first eleven were open to him, just as the empress had promised. When he reached the twelfth, he paused with the key in his hand. He knew her warning, but his curiosity was stronger. A moment later he had turned the key and opened the forbidden cellar.
        - id: ch02-b09
          speaker: narrator
          text: The cellar held nothing but a huge cask bound by iron hoops. From inside came a pleading voice.
        - id: ch02-b10
          speaker: dragon
          text: Brother, please bring me water. I am dying of thirst!
        - id: ch02-b11
          speaker: narrator
          text: The tender-hearted prince fetched water at once and poured it through a hole in the cask. One iron hoop burst apart. As he turned to leave, the voice called again.
        - id: ch02-b12
          speaker: dragon
          text: Have pity on me, brother. Bring me more water. I am dying of thirst!
        - id: ch02-b13
          speaker: narrator
          text: The prince went back for another drink. As soon as he pushed the water through the hole, a second hoop sprang apart. For a third time the voice called out that it was dying of thirst. The prince answered its plea once more. When the water entered the barrel, the final iron hoop split, and the whole cask crashed into pieces.
        - id: ch02-b14
          speaker: narrator
          text: A dragon flew out. At that very moment the empress returned from her walk. The dragon seized her and carried her away.
        - id: ch02-b15
          speaker: narrator
          text: Servants who had seen it all rushed to the prince. When he understood what his own foolishness had caused, he nearly lost his senses.
        - id: ch02-b16
          speaker: youngest_prince
          text: I will follow that dragon to the ends of the earth. I will not stop until I have my wife again.
          emotion: sad
    - id: ch03
      title: Three Promises of Help
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: For month after month the prince wandered one way and then another. He found no trace of the dragon or the empress. At last he stopped beside a stream and saw a little fish on the bank. It beat its tail desperately but could not reach the water.
        - id: ch03-b02
          speaker: fish
          text: Please help me, brother! Put me back in the river, and one day I will repay you. Take one of my scales. Whenever danger comes, twist it between your fingers and I will appear.
        - id: ch03-b03
          speaker: narrator
          text: The prince lifted the fish and tossed it into the stream. Then he took one scale, wrapped it carefully in cloth, and put it in his pocket.
        - id: ch03-b04
          speaker: narrator
          text: Several miles farther on, he found a fox caught in a trap.
        - id: ch03-b05
          speaker: fox
          text: Treat me like a brother and set me free. When you need help, twist one of my hairs between your fingers, and I will come to you.
        - id: ch03-b06
          speaker: narrator
          text: The prince opened the trap, took one hair from the fox, and continued on his way. While crossing a mountain, he came upon a wolf tangled in a snare.
        - id: ch03-b07
          speaker: wolf
          text: Save me from death, and you will never regret it. Take a lock of my fur. Twist it between your fingers whenever you need me.
        - id: ch03-b08
          speaker: narrator
          text: The prince undid the snare and let the wolf go. He traveled a long while without another adventure. Then he met a man walking along the same road.
        - id: ch03-b09
          speaker: youngest_prince
          text: Brother, can you tell me where the dragon emperor lives?
        - id: ch03-b10
          speaker: narrator
          text: The traveler knew the answer. He told the prince where the dragon emperor's palace stood and how long it would take to reach it. The prince thanked him and carefully followed every direction. By that same evening, he had reached the town where the dragon lived. He entered the palace and, to his great joy, found his wife sitting alone in a vast hall.
        - id: ch03-b11
          speaker: narrator
          text: Husband and wife hurried to think of a plan. There was no time to waste, because the dragon might come home at any moment. They ran to the stable, took two horses, and rode away at lightning speed.
        - id: ch03-b12
          speaker: narrator
          text: They had hardly vanished from sight when the dragon came home and discovered that his prisoner was gone. He summoned his talking horse.
        - id: ch03-b13
          speaker: dragon
          text: What do you advise? Should I eat my usual supper, or should I chase them now?
        - id: ch03-b14
          speaker: dragons_horse
          text: Eat your supper first and do not trouble yourself. You can follow them afterward.
        - id: ch03-b15
          speaker: narrator
          text: The dragon sat down to his meal and ate until after midday. Only when he could swallow no more did he mount his talking horse and set out after the fugitives. Though they had been riding since morning, the marvelous horse closed the distance in a short time. The dragon caught them, snatched the empress straight out of her saddle, and turned on the prince.
        - id: ch03-b16
          speaker: dragon
          text: I will spare you this once because you gave me water in the cask. But come here again, and you will pay with your life.
          emotion: angry
        - id: ch03-b17
          speaker: narrator
          text: Wild with grief, the prince rode on, barely knowing where he went. Soon he could bear no more. In spite of the threat, he turned back. He found the empress alone once again, and together they searched for some way to escape the dragon's power.
        - id: ch03-b18
          speaker: youngest_prince
          text: When the dragon returns, ask him where he found that marvelous horse. Tell me what you learn, and I will try to find one like it.
        - id: ch03-b19
          speaker: narrator
          text: Afraid the dragon might find him there, the prince slipped out of the castle.
    - id: ch04
      title: The Witch on the Mountain
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Soon the dragon returned. The empress sat beside him and coaxed and flattered him until he was pleased with her.
        - id: ch04-b02
          speaker: empress
          text: Tell me about the wonderful horse you rode yesterday. Surely there cannot be another horse like it anywhere. Where did you find him?
        - id: ch04-b03
          speaker: dragon
          text: No one else can get a horse the way I did. An old woman lives on a high mountain. Her stable holds twelve horses, and each is finer than the one before. In a corner stands a thin, miserable animal that no one would look at twice. But he is the best of them all. He is my horse's twin brother, and he can fly as high as the clouds.
        - id: ch04-b04
          speaker: dragon
          text: To win him, a man must serve the old woman for three full days. She owns a mare and her foal. Her servant must guard them for three nights. If they never escape, he may choose any horse as his reward. If he loses them on even one night, he pays with his head.
        - id: ch04-b05
          speaker: narrator
          text: The next day the prince watched from hiding until the dragon left the palace. Then he crept inside to see the empress. She repeated everything her captor had told her about the mountain, the twelve horses, and the three dangerous nights of service. The prince decided at once to seek the old woman. He wasted no time before setting out.
        - id: ch04-b06
          speaker: narrator
          text: The climb was long and steep. At last he reached the mountain top, found the old woman, and bowed low.
        - id: ch04-b07
          speaker: youngest_prince
          text: Good day to you, little mother.
        - id: ch04-b08
          speaker: mountain_witch
          text: Good day, my son. What has brought you here?
        - id: ch04-b09
          speaker: youngest_prince
          text: I have come to serve you.
        - id: ch04-b10
          speaker: mountain_witch
          text: Then serve me you shall. Guard my mare for three days, and a horse will be your wages. Let her stray, and you will lose your head.
        - id: ch04-b11
          speaker: narrator
          text: She led him into a fenced courtyard. A man's head stood on every post but one. As they passed that empty post, it called out.
        - id: ch04-b12
          speaker: empty_post
          text: Woman, give me the head I am waiting for!
        - id: ch04-b13
          speaker: narrator
          text: The witch ignored it and pointed to the other posts.
        - id: ch04-b14
          speaker: mountain_witch
          text: Every one of those men accepted the same terms as you. Not one of them managed to guard my mare.
        - id: ch04-b15
          speaker: narrator
          text: The prince did not change his mind. He said he would keep his word.
    - id: ch05
      title: The Three Nights
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: That evening the prince led the mare from the stable and climbed onto her back. The foal ran behind as they rode away. The mare struggled and fought beneath him, trying again and again to throw him. For a long time he managed to keep his seat. At last he grew so weary that his eyes closed, and he fell fast asleep without knowing it.
        - id: ch05-b02
          speaker: narrator
          text: When he woke, he was sitting on a log with the halter in his hands. The mare and foal were gone. Terrified, he jumped up and searched, but found no track. Then he reached a little river and remembered the fish he had saved. He took the scale from his pocket and touched it with his fingers. The fish appeared beside him in the stream.
        - id: ch05-b03
          speaker: fish
          text: What is wrong, brother?
        - id: ch05-b04
          speaker: youngest_prince
          text: The old woman's mare escaped last night, and I cannot find her anywhere.
        - id: ch05-b05
          speaker: fish
          text: I know where she is. She became a large fish, and her foal became a little fish. Strike the water with the halter and call, “Come here, mare of the mountain witch!” Then she will come.
        - id: ch05-b06
          speaker: narrator
          text: The prince struck the river with the halter and called the mare exactly as the fish had told him. At once the great fish became the mare and the little fish became her foal. They stood together on the bank before him. He slipped the halter around the mare's neck, mounted her, and rode back to the mountain house, while the foal trotted all the way behind them.
        - id: ch05-b07
          speaker: narrator
          text: The witch met them at the door. She gave the prince food, then led the mare into the stable and struck her with a stick.
        - id: ch05-b08
          speaker: mountain_witch
          text: You should have hidden among the fish.
        - id: ch05-b09
          speaker: mare
          text: I did hide among them. But the fish are no friends of mine. They betrayed me at once.
        - id: ch05-b10
          speaker: mountain_witch
          text: Then hide among the foxes this time.
        - id: ch05-b11
          speaker: narrator
          text: The witch went back to the house, never knowing that the prince had heard her.
        - id: ch05-b12
          speaker: narrator
          text: At dusk on the second night, he mounted the mare and rode into the meadows while the foal followed. Once again he stayed on until midnight. Then a sleep too strong to fight swept over him. He woke on the same log, clutching the empty halter.
        - id: ch05-b13
          speaker: narrator
          text: He cried out and sprang up. Then he remembered the witch's command to the mare. He took out the fox's hair and twisted it between his fingers. The fox appeared immediately.
        - id: ch05-b14
          speaker: fox
          text: What is wrong, brother?
        - id: ch05-b15
          speaker: youngest_prince
          text: The mountain witch's mare has escaped again, and I do not know where to find her.
        - id: ch05-b16
          speaker: fox
          text: She is among us. She became a large fox, and her foal became a little one. Strike the ground with the halter and call, “Come here, mare of the mountain witch!”
        - id: ch05-b17
          speaker: narrator
          text: The prince struck the earth with the halter and called out the words the fox had taught him. In that instant the large fox became the mare, and the little fox at her heels became the foal. The prince caught the mare, mounted her, and rode back to the witch's house with the foal following close behind.
        - id: ch05-b18
          speaker: narrator
          text: The witch put food on the table for him. Then she led the mare back to the stable and struck her.
        - id: ch05-b19
          speaker: mountain_witch
          text: I told you to hide among the foxes.
        - id: ch05-b20
          speaker: mare
          text: I did. But the foxes are no friends of mine. They betrayed me.
        - id: ch05-b21
          speaker: mountain_witch
          text: Next time, hide among the wolves.
        - id: ch05-b22
          speaker: narrator
          text: Again, she did not know the prince was listening.
        - id: ch05-b23
          speaker: narrator
          text: On the third night the prince rode the mare back to the meadows, with the foal behind them. He fought hard to stay awake, but it was useless. Morning found him on the log once more, holding only the halter.
        - id: ch05-b24
          speaker: narrator
          text: He leaped up, then stopped. He remembered what the witch had said and pulled out the gray lock of wolf's fur. The moment he twisted it, the wolf stood before him.
        - id: ch05-b25
          speaker: wolf
          text: What is wrong, brother?
        - id: ch05-b26
          speaker: youngest_prince
          text: The mountain witch's mare has escaped, and I cannot find her.
        - id: ch05-b27
          speaker: wolf
          text: She is among us. She became a she-wolf, and the foal became a cub. Strike the earth with the halter and call, “Come to me, mare of the mountain witch!”
        - id: ch05-b28
          speaker: narrator
          text: The prince struck the earth with the halter and called for the mountain witch's mare. As the lock of fur touched his fingers, the she-wolf changed back into the mare and the cub beside her became the foal. The prince put the halter on her, mounted, and rode both animals safely back to the witch's house for the third time.
        - id: ch05-b29
          speaker: narrator
          text: The witch waited on the steps. She served the prince food, then took the mare to the stable and struck her.
        - id: ch05-b30
          speaker: mountain_witch
          text: You should have gone among the wolves.
        - id: ch05-b31
          speaker: mare
          text: I did go among them. But the wolves are no friends of mine. They betrayed me.
        - id: ch05-b32
          speaker: narrator
          text: The witch had no answer. She left the stable and found the prince waiting at the door.
        - id: ch05-b33
          speaker: youngest_prince
          text: I have served you well. Now give me my reward.
        - id: ch05-b34
          speaker: mountain_witch
          text: I will keep my promise. Choose any one of my twelve horses.
        - id: ch05-b35
          speaker: youngest_prince
          text: I would rather have that half-starved horse in the corner. Give me him instead of the beautiful ones.
        - id: ch05-b36
          speaker: mountain_witch
          text: You cannot truly mean that.
          emotion: surprised
        - id: ch05-b37
          speaker: youngest_prince
          text: I do mean it.
        - id: ch05-b38
          speaker: narrator
          text: The witch had promised him his choice, so she was forced to let him have his way. The prince took leave of her and fastened the halter around the thin horse's neck. He did not mount at once. Instead, he led the animal away into the forest and rubbed him down with care until the dull, neglected skin began to shine like gold.
    - id: ch06
      title: The Flying Horse
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: The prince mounted his new horse, and together they flew straight through the air toward the dragon's palace. The empress had watched for her husband day and night. She slipped outside to meet him, and he lifted her onto his saddle. Then the horse rose into the air again and carried them away.
        - id: ch06-b02
          speaker: narrator
          text: Not long afterward, the dragon returned and found the empress missing. He turned to his horse.
        - id: ch06-b03
          speaker: dragon
          text: What should we do? Shall we eat and drink first, or chase the runaways?
        - id: ch06-b04
          speaker: dragons_horse
          text: Eat or do not eat. Drink or do not drink. Chase them or stay here. It makes no difference now, because you can never catch them.
        - id: ch06-b05
          speaker: narrator
          text: The dragon ignored the warning. He sprang onto his horse and flew after the fugitives. When the prince and empress saw him coming, fear seized them. They urged their horse faster and faster.
        - id: ch06-b06
          speaker: princes_horse
          text: Do not be afraid. No harm can reach us.
          emotion: calm
        - id: ch06-b07
          speaker: narrator
          text: Their fear eased, because they trusted the horse's wisdom.
    - id: ch07
      title: The Last Chase
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: Soon they heard the dragon's horse panting behind them. He called to his twin.
        - id: ch07-b02
          speaker: dragons_horse
          text: Brother, please do not fly so fast! If I keep trying to match your speed, I will fall from the sky.
        - id: ch07-b03
          speaker: princes_horse
          text: Why do you carry a monster like him? Throw him off. Let him shatter on the ground, then come with us.
        - id: ch07-b04
          speaker: narrator
          text: The dragon's horse plunged and reared. The dragon fell onto a rock, and the blow broke him to pieces.
        - id: ch07-b05
          speaker: narrator
          text: With the dragon gone, the empress mounted his horse while her husband remained on the horse he had earned from the mountain witch. Side by side, they rode safely back to her kingdom. There the prince and empress ruled together for many years.
