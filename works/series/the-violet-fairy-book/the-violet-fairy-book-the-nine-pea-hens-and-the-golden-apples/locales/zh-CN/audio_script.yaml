      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清晰的成年男声
        pace: 从容舒展
        pitch: 中低音
    emperor:
      display_name: 皇帝
      tts:
        delivery: 威严中带着父亲的关切
        timbre: 浑厚沉稳的成年男声
        pace: 稍慢
        pitch: 低音
    eldest_prince:
      display_name: 大王子
      tts:
        delivery: 自信爽快，受挫时略显窘迫
        timbre: 明亮有力的年轻男声
        pace: 适中
        pitch: 中音
    youngest_prince:
      display_name: 小王子
      tts:
        delivery: 真诚执着，危急时果断
        timbre: 清朗温厚的年轻男声
        pace: 适中
        pitch: 中高音
    empress:
      display_name: 女皇
      tts:
        delivery: 温柔聪慧，言语端庄自然
        timbre: 清澈柔和的年轻女声
        pace: 适中
        pitch: 中高音
    witch:
      display_name: 老巫婆
      tts:
        delivery: 阴沉刻薄，语气尖利
        timbre: 干涩沙哑的老年女声
        pace: 稍慢
        pitch: 中低音
    dragon:
      display_name: 龙皇
      tts:
        delivery: 狂妄凶狠，不容反驳
        timbre: 粗重压迫的成年男声
        pace: 稍慢
        pitch: 低音
    fish:
      display_name: 小鱼
      tts:
        delivery: 机灵热心，说话轻快
        timbre: 细亮清脆的声音
        pace: 稍快
        pitch: 高音
    fox:
      display_name: 狐狸
      tts:
        delivery: 敏捷爽利，带一点机敏
        timbre: 灵巧清晰的成年男声
        pace: 稍快
        pitch: 中高音
    wolf:
      display_name: 狼
      tts:
        delivery: 直率可靠，口气坚定
        timbre: 粗粝浑厚的成年男声
        pace: 适中
        pitch: 中低音
    traveler:
      display_name: 同路人
      tts:
        delivery: 朴实友善，回答干脆
        timbre: 自然清楚的成年男声
        pace: 适中
        pitch: 中音
    mountain_witch:
      display_name: 山顶老妇人
      tts:
        delivery: 冷硬诡秘，话里带着威胁
        timbre: 苍老低哑的女声
        pace: 缓慢
        pitch: 中低音
    empty_stake:
      display_name: 空木桩
      tts:
        delivery: 诡异急切，像在索取欠下的东西
        timbre: 干枯空洞的声音
        pace: 稍慢
        pitch: 中低音
    mare:
      display_name: 母马
      tts:
        delivery: 委屈戒备，回答简短
        timbre: 沉闷柔韧的女声
        pace: 适中
        pitch: 中音
    dragon_horse:
      display_name: 龙皇的马
      tts:
        delivery: 通晓世事，疲惫时气息急促
        timbre: 深沉厚实的成年男声
        pace: 适中
        pitch: 中低音
    prince_horse:
      display_name: 王子的马
      tts:
        delivery: 镇定勇敢，语气充满把握
        timbre: 明亮坚实的成年男声
        pace: 适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 金苹果树下
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，一位皇帝的宫殿前长着一棵金苹果树。这棵树十分奇异，每到夜里才开花结果。可天一亮，果子就全不见了，枝头的花也被摘得一朵不剩。宫里的人想尽办法，却始终查不出窃贼是谁。皇帝为此烦恼不已，终于把大儿子叫到面前。
        - id: ch01-b02
          speaker: emperor
          text: >-
            要是能拦住那些偷果子的贼，我该有多高兴啊！
        - id: ch01-b03
          speaker: eldest_prince
          text: >-
            今晚让我守着树吧。我不睡觉，一定能看清是谁干的！
        - id: ch01-b04
          speaker: narrator
          text: >-
            天黑以后，大王子来到树旁，找了个地方藏起来守夜。可苹果才刚开始成熟，他就睡着了。日出时，他醒来一看，果子早已被偷光。他羞愧得抬不起头，只好拖着脚步去见父亲。大哥虽然失败，二王子却觉得自己准能做得更好。入夜后，他兴冲冲地去守树，哪知才刚躺下，眼皮就越来越沉。等阳光把他唤醒，树上连一只苹果也没有了。
        - id: ch01-b05
          speaker: narrator
          text: >-
            第三夜轮到小王子。他在树下铺了一张舒适的床，先安心睡下，快到午夜时又醒了。他坐起来向树上望去，只见苹果正在成熟，耀眼的金光照亮了整座宫殿。就在这时，九只金孔雀从空中疾飞而来。八只落到挂满果子的枝头，第九只却轻轻飞到王子身旁的地上，转眼变成一位姑娘。她比宫廷里的任何贵妇都要美，王子一见就爱上了她。两人谈了许久，直到姑娘告诉他，姐姐们已经把苹果摘完，她们全都该回家了。
        - id: ch01-b06
          speaker: youngest_prince
          text: >-
            请你给我留一点果子吧，哪怕只留一点也好。
        - id: ch01-b07
          speaker: narrator
          text: >-
            王子苦苦央求，姑娘便给了他两只苹果，一只送给他，另一只送给皇帝。随后，她又变回孔雀，和八个姐姐一同飞走。太阳刚升起，王子就走进宫殿，把金苹果递到父亲手中。皇帝见了欢喜极了，连声夸奖小儿子聪明。当天晚上，王子仍回到树下，发生的一切和前一夜相同。此后接连几个夜晚，都是这样，王子每次都带回两只苹果。
        - id: ch01-b08
          speaker: narrator
          text: >-
            两个哥哥见他从不空手回来，越看越恼火。他们去找一个老巫婆商量，巫婆答应暗中窥探，弄清王子是怎样得到苹果的。那天夜里，她先藏到树下。王子来了，在床上躺好，很快便睡熟。将近午夜，空中响起急促的振翅声。八只孔雀落到树上，第九只变成姑娘，跑来迎接王子。巫婆忽然从床下伸出手，剪掉她一绺头发。姑娘顿时跳起来，变回孔雀，展翅飞走。她的姐姐们本来正在摘光枝头的苹果，见状也都跟着去了。
        - id: ch01-b09
          speaker: youngest_prince
          text: >-
            这是怎么回事？
          emotion: surprised
        - id: ch01-b10
          speaker: narrator
          text: >-
            王子被姑娘突然消失的事惊呆了。回过神后，他四处寻找，发现了藏在床下的巫婆。他盛怒之下把她拖出来，叫来卫兵，命他们立刻处死她。可这样也唤不回孔雀们。从此，王子夜夜守在树下，为失去的爱人哭得肝肠寸断。过了一段日子，他再也忍受不住，决意走遍天下去找她。父亲劝他说，这件事毫无希望，天下还有别的姑娘和她一样美。王子什么也听不进去，只带一名仆人便上了路。

    - id: ch02
      title: 第十二间地窖
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            许多天后，王子来到一座大城门前。隔着铁栏，他能看见城里的街道，甚至还能望见宫殿。守门人拦住他，盘问他的身份、来意和路线，还说只有女皇亲自准许，他才能进去。消息送进城中，女皇来到门前。王子几乎以为自己神志错乱了，因为她正是他离家寻找的姑娘。她快步奔来，牵住他的手，把他带进宫殿。几天后，两人成了婚。王子忘了父亲和哥哥，只想留在这座城堡，直到老死。
        - id: ch02-b02
          speaker: narrator
          text: >-
            一天早晨，女皇要独自散步，临行前把十二间地窖的钥匙交给丈夫。
        - id: ch02-b03
          speaker: empress
          text: >-
            前十一间，你想进去都可以。可是第十二扇门千万不能开，不然你一定会遭殃。
        - id: ch02-b04
          speaker: narrator
          text: >-
            王子一个人待得无聊，很快就想起了那道禁令。
        - id: ch02-b05
          speaker: youngest_prince
          text: >-
            第十二间地窖里究竟藏着什么，为什么偏偏不许我看？
        - id: ch02-b06
          speaker: narrator
          text: >-
            他下楼打开一扇又一扇门。到了第十二扇门前，他停下来迟疑了一会儿，可好奇心实在太强，还是转动了钥匙。地窖敞开在眼前，里面空空荡荡，只有一只箍着几道铁圈的大木桶。桶中传出一个声音，苦苦向他哀求。
        - id: ch02-b07
          speaker: dragon
          text: >-
            兄弟，看在老天的分上，给我一点水吧，我快渴死了！
        - id: ch02-b08
          speaker: narrator
          text: >-
            王子心软，马上拿来水，从小孔里灌进木桶。一道铁箍应声崩开。他正要走，那声音又叫了起来。
        - id: ch02-b09
          speaker: dragon
          text: >-
            兄弟，求你再可怜我一次，拿点水来吧，我真的快渴死了！
        - id: ch02-b10
          speaker: narrator
          text: >-
            王子只好折回去，又送来一些水，第二道铁箍也随即崩断。那声音第三次讨水。最后一口水刚灌进去，剩下的铁箍便裂开，木桶轰然散成碎片。一条恶龙从中飞了出来。恰好女皇散步归来，恶龙一把抓住她，腾空而去。
        - id: ch02-b11
          speaker: narrator
          text: >-
            几个亲眼看见这一幕的仆人急忙跑来报信。王子得知自己的愚行害了妻子，悔恨得几乎发疯，只能一遍又一遍地喊着，不管恶龙逃到天涯海角，他都要一直追下去，直到把女皇救回来。

    - id: ch03
      title: 三位受助的朋友
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            王子东奔西走了好几个月，一会儿朝这边，一会儿朝那边，却始终找不到恶龙和女皇留下的半点踪迹。一天，他来到一条小河边，停下脚步望着流水，忽然看见一条小鱼躺在岸上。它不停抽动尾巴，拼命想回到水中，却怎么也办不到。
        - id: ch03-b02
          speaker: fish
          text: >-
            兄弟，求你把我放回河里吧！我以后一定报答你。拿走我的一片鳞，遇到危险时用手指捻一捻，我就会来。
        - id: ch03-b03
          speaker: narrator
          text: >-
            王子捡起小鱼，把它放回河里，又依照它的话取下一片鱼鳞。他用布把鳞片仔细包好，放进口袋，这才继续上路。走了几英里以后，他又看见一只狐狸困在陷阱中。
        - id: ch03-b04
          speaker: fox
          text: >-
            把我当作兄弟，放我出去吧！等你有难，我会来帮忙。拔下一根我的毛，危险时在手里捻一捻就行。
        - id: ch03-b05
          speaker: narrator
          text: >-
            王子解开陷阱，拔下一根狐狸毛收好，又继续赶路。翻越山岭时，他遇见一只被套索紧紧缠住的狼。狼也向他求救，请他放自己自由。
        - id: ch03-b06
          speaker: wolf
          text: >-
            救我一命，你绝不会后悔。取走一撮我的毛，需要我时，在手指间捻一捻。
        - id: ch03-b07
          speaker: narrator
          text: >-
            王子解开套索，放走了狼。此后，他又走了很长一段路，一路上再没遇到别的事情。终于，他碰见一个朝同一方向赶路的行人，便上前向对方打听龙皇的住处。
        - id: ch03-b08
          speaker: youngest_prince
          text: >-
            兄弟，你要是知道龙皇住在哪里，请告诉我吧。
        - id: ch03-b09
          speaker: narrator
          text: >-
            那人把宫殿的位置和还要走多久都告诉了他。王子谢过对方，照着指点一路前行，当天晚上便到达龙皇居住的城镇。他走进宫殿，惊喜地看见妻子独自坐在一座宽阔的大厅里。恶龙随时可能回来，两人一刻也不敢耽搁，赶紧商议逃跑的办法。他们从马厩牵出两匹马，骑上去，风驰电掣般离开。
        - id: ch03-b10
          speaker: narrator
          text: >-
            两人刚消失，恶龙就回来了。他发现囚徒逃走，立刻问那匹会说话的马。
        - id: ch03-b11
          speaker: dragon
          text: >-
            你替我拿个主意。我是先照常吃饭，还是马上去追他们？
        - id: ch03-b12
          speaker: dragon_horse
          text: >-
            先安心吃完饭，再去追也来得及。
        - id: ch03-b13
          speaker: narrator
          text: >-
            恶龙听从了马的建议，一直吃到过了正午，实在再也吃不下，才骑马去追。没过多久，他便赶上逃走的两人，从马鞍上一把夺走女皇，对王子发出警告。
        - id: ch03-b14
          speaker: dragon
          text: >-
            你曾在木桶里给我水喝，这一回我饶你不死。要是还敢回来，我就要你的命！
          emotion: angry
        - id: ch03-b15
          speaker: narrator
          text: >-
            王子悲痛得几乎发狂，骑着马失魂落魄地向前走了一小段路，连自己在做什么都不知道。最后，他再也忍受不住，不顾恶龙要取他性命的威胁，又掉头返回宫殿。女皇依旧独自坐在那里。两人再次商议，怎样才能逃出恶龙的掌控。
        - id: ch03-b16
          speaker: youngest_prince
          text: >-
            等他回来，你问清那匹神马是从哪里得来的。把答案告诉我，我会去找另一匹。
        - id: ch03-b17
          speaker: narrator
          text: >-
            交代完这件事，王子怕遇见恶龙，悄悄溜出城堡。不久，恶龙回来了。女皇坐到他身边，又哄又夸，直到他心情大好，才装作随意地开口询问。
        - id: ch03-b18
          speaker: empress
          text: >-
            你昨天骑的那匹马真神奇，天下一定没有第二匹。你究竟是从哪里得到它的？
        - id: ch03-b19
          speaker: dragon
          text: >-
            那个办法，别人可做不到。高山顶上住着一个老妇人，马厩里有十二匹漂亮的马。角落还有一匹饿得半死的瘦马，谁都不肯多看一眼，其实它才是最好的。它是我这匹马的孪生兄弟，能飞到云端。想得到它，必须先替老妇人干三天活。她有一匹母马和一匹小马驹，三个夜晚都得看住它们。一次也不让它们逃掉，最后就能任选一匹马作酬劳。可只要有一晚看守失败，就得把脑袋留下。

    - id: ch04
      title: 山顶老妇人的考验
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            第二天，王子一直等到恶龙离开，才悄悄进入宫殿去见女皇。她把从看守自己的人那里打听到的一切都告诉了丈夫。王子当即决定去找山顶的老妇人，片刻也没有耽搁。那段山路又高又陡，爬起来十分艰难，可他最终还是找到了老妇人，走上前深深行了一礼。
        - id: ch04-b02
          speaker: youngest_prince
          text: >-
            您好，老妈妈！
        - id: ch04-b03
          speaker: mountain_witch
          text: >-
            你好，我的孩子！你到这里来做什么？
        - id: ch04-b04
          speaker: youngest_prince
          text: >-
            我想来给您当仆人。
        - id: ch04-b05
          speaker: mountain_witch
          text: >-
            那就留下吧。替我看守母马三天，我送你一匹马作工钱。可要是让它走失，你就得掉脑袋。
        - id: ch04-b06
          speaker: narrator
          text: >-
            说着，她把王子领进一座栅栏围成的院子。每根木桩上都插着一颗人头，只有一根还是空的。他们从那根木桩旁经过时，木桩突然叫了起来。
        - id: ch04-b07
          speaker: empty_stake
          text: >-
            女人，把我一直等着的那颗脑袋给我！
        - id: ch04-b08
          speaker: narrator
          text: >-
            老妇人根本不作回答，只转身指给王子看。
        - id: ch04-b09
          speaker: mountain_witch
          text: >-
            看见了吧？这些人都按同样的条件来服侍我，可没有一个能看住母马！
        - id: ch04-b10
          speaker: narrator
          text: >-
            王子没有退缩，坚持要信守诺言。傍晚，他把母马牵出马厩，骑到它背上，小马驹跟在后头。母马千方百计想把他甩下去，他仍在马背上坚持了很久，最后实在疲惫不堪，还是沉沉睡着了。醒来时，他竟坐在一截圆木上，手里还握着缰绳。王子吓得跳了起来，可母马和小马驹早已无影无踪。
        - id: ch04-b11
          speaker: narrator
          text: >-
            王子心怦怦直跳，赶忙去寻找。他走出好一段路，却连一丝可以追寻的痕迹也没有。后来来到一条小河边，看见河水，他想起那条被自己救过性命的小鱼，连忙从口袋里取出鱼鳞。鳞片刚碰到手指，小鱼马上出现在身旁的水中。
        - id: ch04-b12
          speaker: fish
          text: >-
            兄弟，出了什么事？
        - id: ch04-b13
          speaker: youngest_prince
          text: >-
            老妇人的母马昨夜逃走了，我不知道该去哪里找。
        - id: ch04-b14
          speaker: fish
          text: >-
            我知道。它变成一条大鱼，小马驹也变成了小鱼。你用缰绳抽打水面，再喊：“高山巫婆的母马，快到这里来！”它就会出现。
        - id: ch04-b15
          speaker: narrator
          text: >-
            王子用缰绳抽打水面，照着小鱼教的话喊了一遍，母马和小马驹立刻站到他面前。他把缰绳套在母马脖子上，骑着它回去，小马驹一路小跑，始终跟在后面。老妇人在门口迎接他们，给王子拿了些食物，自己把母马牵回马厩，举起棍子打它。
        - id: ch04-b16
          speaker: mountain_witch
          text: >-
            你应该躲进鱼群里！
          emotion: angry
        - id: ch04-b17
          speaker: mare
          text: >-
            我去了，可那些鱼不是我的朋友，一下子就把我出卖了。
        - id: ch04-b18
          speaker: mountain_witch
          text: >-
            那么下一回，你就躲到狐狸中间去。
        - id: ch04-b19
          speaker: narrator
          text: >-
            老妇人说完就回了屋，并不知道，这句话被王子听见了。第二夜天色渐暗，王子又骑着母马来到草地，小马驹跟在母亲身后。他设法在马背上坚持到半夜，可一阵无法抵挡的困意再次压了下来。等他醒来，果然又坐在那截圆木上，手里仍握着缰绳。王子惊恐地叫了一声，跳起来寻找逃走的两匹马。走着走着，他忽然记起老妇人的话，便取出狐狸毛，在手指间捻了捻。
        - id: ch04-b20
          speaker: fox
          text: >-
            兄弟，出了什么事？
        - id: ch04-b21
          speaker: youngest_prince
          text: >-
            老巫婆的母马逃走了，我不知道该去哪里找。
        - id: ch04-b22
          speaker: fox
          text: >-
            它就在我们这里，变成了大狐狸，小马驹也变成了小狐狸。你用缰绳抽打地面，再喊：“高山巫婆的母马，快到这里来！”
        - id: ch04-b23
          speaker: narrator
          text: >-
            王子用缰绳抽打地面，照着狐狸的话喊了一声。转眼间，大狐狸便变回母马，站在他面前，小马驹也紧跟在它身后。他骑上母马回去，老妇人照样把食物摆在桌上，自己又把母马带回马厩责打。
        - id: ch04-b24
          speaker: mountain_witch
          text: >-
            我不是叫你躲到狐狸中间去吗？
          emotion: angry
        - id: ch04-b25
          speaker: mare
          text: >-
            我去了，可它们不是我的朋友，又把我出卖了。
        - id: ch04-b26
          speaker: mountain_witch
          text: >-
            那么第三回，你最好躲到狼群里去。

    - id: ch05
      title: 得到飞马
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            这句话同样被王子听见。第三夜，他再次骑着母马来到草地，小马驹仍在后面小跑。王子竭力不让自己睡着，却毫无用处。清晨醒来，他又坐在那截圆木上，手中紧紧握着缰绳。他猛地站起身，随即又停下来，因为他想起老妇人的吩咐。于是，他取出那撮灰色狼毛，在手指间捻了捻。
        - id: ch05-b02
          speaker: wolf
          text: >-
            兄弟，出了什么事？
        - id: ch05-b03
          speaker: youngest_prince
          text: >-
            老巫婆的母马逃走了，我不知道该去哪里找。
        - id: ch05-b04
          speaker: wolf
          text: >-
            它在我们这里，变成了一匹母狼，小马驹也成了狼崽。你用缰绳抽打地面，再喊：“高山巫婆的母马，快到我这里来！”
        - id: ch05-b05
          speaker: narrator
          text: >-
            王子用缰绳抽打地面，依照狼的指点大喊。那撮狼毛刚碰到他的手指，面前的母狼便变回母马，小马驹也出现在它身旁。王子骑上母马回到院子，老妇人已经站在台阶上迎接他们。她给王子摆出一些食物，又把母马牵回马厩责打。
        - id: ch05-b06
          speaker: mountain_witch
          text: >-
            你应该躲到狼群里去！
          emotion: angry
        - id: ch05-b07
          speaker: mare
          text: >-
            我正是去了那里，可狼群也不是我的朋友，还是把我出卖了。
        - id: ch05-b08
          speaker: narrator
          text: >-
            老妇人听完没有回答，转身离开了马厩。王子知道三个夜晚的考验都已经过去，早早站在门外等候她，要领取自己应得的酬劳。
        - id: ch05-b09
          speaker: youngest_prince
          text: >-
            我已经好好服侍了您三天，现在该给我酬劳了。
        - id: ch05-b10
          speaker: mountain_witch
          text: >-
            我答应过的事，一定做到。这十二匹马随你挑，喜欢哪匹就带走哪匹。
        - id: ch05-b11
          speaker: youngest_prince
          text: >-
            请把角落里那匹饿得半死的马给我吧。比起这些漂亮的马，我更喜欢它。
        - id: ch05-b12
          speaker: mountain_witch
          text: >-
            你不会真的想要它吧？
          emotion: surprised
        - id: ch05-b13
          speaker: youngest_prince
          text: >-
            我是认真的，就要它。
        - id: ch05-b14
          speaker: narrator
          text: >-
            老妇人只得由着他。王子向她告辞，把缰绳套在瘦马的脖子上，牵着它走进森林。他在那里把马全身仔细擦洗干净，直到它的皮毛像金子一样发亮。随后，王子翻身上马，他们径直飞过天空，来到恶龙的宫殿。女皇日日夜夜都在盼望丈夫，见他终于回来，便悄悄跑出去迎接。王子一把将她抱上马鞍，飞马载着两人再次腾空而去。

    - id: ch06
      title: 飞马的兄弟
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            没过多久，恶龙回到宫殿，发现女皇再次失踪。他马上叫来自己那匹会说话的马，询问该怎么办。
        - id: ch06-b02
          speaker: dragon
          text: >-
            我们该怎么办？先吃喝一顿，还是去追那两个逃跑的人？
        - id: ch06-b03
          speaker: dragon_horse
          text: >-
            你吃不吃，喝不喝，追不追，如今都一样。你永远也追不上他们了。
        - id: ch06-b04
          speaker: narrator
          text: >-
            恶龙根本不理会马的回答，一跃而上，骑着它追赶逃走的两人。王子和女皇看见他从后面逼近，害怕起来，不停催促飞马再快一点，再快一点。
        - id: ch06-b05
          speaker: prince_horse
          text: >-
            不必害怕，我们不会有事。
          emotion: calm
        - id: ch06-b06
          speaker: narrator
          text: >-
            两人相信飞马的智慧，听它这样说，心也渐渐安定下来。没过多久，后面便传来龙皇那匹马沉重而急促的喘息声，它已经累得快要支撑不住了。
        - id: ch06-b07
          speaker: dragon_horse
          text: >-
            兄弟，别跑得那么快！我要是还这样追下去，会一头栽到地上的。
        - id: ch06-b08
          speaker: prince_horse
          text: >-
            你为什么还服侍那个恶魔？把他踢下去，让他摔在地上，碎成一块一块的。然后来和我们一起走吧。
        - id: ch06-b09
          speaker: narrator
          text: >-
            龙皇的马听从兄弟的话，猛地跳起，又高高扬起前蹄。恶龙从马背上摔下来，正好落在一块岩石上，跌得粉身碎骨。女皇随后骑上龙皇的马，和丈夫一同返回自己的王国。此后，他们在那里平安统治了许多年。
