audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 编者
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清晰的成年男声
        pace: 从容舒展
        pitch: 中低音
    hans:
      display_name: 聪明汉斯
      tts:
        delivery: 大胆自信，幽默中带着几分机敏
        timbre: 清亮有力的年轻男声
        pace: 不疾不徐
        pitch: 中音
    minister:
      display_name: 牧师
      tts:
        delivery: 一本正经又精于盘算，着急时容易慌乱
        timbre: 圆润成熟的成年男声
        pace: 稍缓
        pitch: 中低音
    card_player:
      display_name: 牌客
      tts:
        delivery: 戒备而带着试探
        timbre: 轻薄幽暗的成年男声
        pace: 适中
        pitch: 中低音
    vengeful_dwarf:
      display_name: 记仇的小矮人
      tts:
        delivery: 尖刻愤恨，气势汹汹
        timbre: 沙哑细小的男声
        pace: 急促
        pitch: 高音
    grateful_dwarf:
      display_name: 报恩的小矮人
      tts:
        delivery: 诚恳谦和，话语里带着清醒的智慧
        timbre: 细小清澈的男声
        pace: 适中
        pitch: 高音
    dwarf_companion:
      display_name: 小矮人同伴
      tts:
        delivery: 粗暴激动，怒气冲冲
        timbre: 粗粝细小的男声
        pace: 急促
        pitch: 高音
  chapters:
    - id: ch01
      title: 午夜敲钟人
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前有一位牧师，一直找不到合适的仆人。他要仆人做完白天的差事，半夜还得去敲教堂的钟。其实，答应过这份差事的人并不少。可每个仆人一走向教堂，就像让大地吞了似的，再也没有回来。午夜的钟没有响过一次。
        - id: ch01-b02
          speaker: narrator
          text: >-
            牧师拼命想把这些怪事瞒住，消息还是传遍了村子。从此谁也不肯服侍他，甚至有人悄悄说，失踪的那些人就是让他害死的。牧师每逢星期日都站在讲坛上许诺，谁肯去完成敲钟这项神圣的职责，就能拿双倍工钱。不管他怎样开条件，大家连听都不愿听。牧师简直愁坏了。
        - id: ch01-b03
          speaker: narrator
          text: >-
            一天，他正站在家门口，村里那个绰号叫“聪明汉斯”的年轻人走了过来。
        - id: ch01-b04
          speaker: hans
          text: >-
            我受够原先那个吝啬鬼了，他连饭和酒都不肯给够。您有什么活儿，只管交给我。
        - id: ch01-b05
          speaker: minister
          text: >-
            很好，我的孩子。今晚就让你显显胆量，工钱的事明天再谈。
        - id: ch01-b06
          speaker: narrator
          text: >-
            汉斯很满意，立刻进厨房干活。他哪里知道，新主人和旧主人同样小气。仆人吃饭时，牧师总坐在桌旁盯着，盼他们见了自己能少吃一点。他还不停劝大家喝啤酒，心想肚里酒多了，牛肉便吃得少，而牛肉可比啤酒贵。可是他这回遇上了对手。汉斯喝空了杯子，照样吃空盘子，牧师很快便尝到了苦头。

    - id: ch02
      title: 钟楼里的无头守卫
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            离午夜还有大约一个钟头，汉斯走进教堂，锁上身后的门。他原以为里面又黑又静，谁知四处灯火通明，一群人正围着桌子打牌。面对这番怪景，汉斯一点惧色也没露出来。也许他真的不怕，也许心里怕，却聪明得没有让人看出来。他走到桌边，大大方方坐进牌客中间。
        - id: ch02-b02
          speaker: card_player
          text: >-
            朋友，你到这里来干什么？
        - id: ch02-b03
          speaker: narrator
          text: >-
            汉斯看了那人一会儿，笑了起来。
        - id: ch02-b04
          speaker: hans
          text: >-
            真要问这句话，也该由我来问。连我都没开口，你们最好也别问。
        - id: ch02-b05
          speaker: narrator
          text: >-
            汉斯拿起纸牌，跟陌生人玩得像老朋友一样熟络。好运总站在他这边，赌徒们的钱很快便从他们的口袋跑进了他的口袋。午夜刚到，公鸡叫了一声。灯光、桌子、纸牌和所有牌客一眨眼全都消失了，教堂里只剩下汉斯一个人。
        - id: ch02-b06
          speaker: narrator
          text: >-
            他摸黑找了半天，终于找到钟楼的楼梯。第一处平台旁有一道墙缝，一线微光从那里照进来。光里坐着一个没有脑袋的小人。
        - id: ch02-b07
          speaker: hans
          text: >-
            嗬，小家伙！你坐在这里做什么？
        - id: ch02-b08
          speaker: narrator
          text: >-
            汉斯根本没等他回答，抬脚一踹，就把他踢得滚下楼去。再往上，每层平台都坐着一个默不作声的无头守卫。汉斯照方才的办法，把他们一个个送下了楼梯。
        - id: ch02-b09
          speaker: narrator
          text: >-
            汉斯终于爬到钟楼顶上，停下来向四周看了看。他发现大钟里面还蜷着一个无头小矮人。那家伙正藏在那里，等汉斯拉动钟绳。只要绳子一动，他便能用沉重的钟舌猛撞汉斯，取走汉斯的性命。
        - id: ch02-b10
          speaker: hans
          text: >-
            慢着，小家伙！我们可没约好这一招。你那些同伴怎样下楼，你都看见了吧？你也得跟着去。不过你占了最高的地方，退场就该体面些。你从窗口出去！
        - id: ch02-b11
          speaker: narrator
          text: >-
            汉斯爬上梯子，要把小矮人揪出大钟，真的从窗口扔下去。
        - id: ch02-b12
          speaker: grateful_dwarf
          text: >-
            兄弟，求你饶我一命！我保证，以后我和同伴再也不会打扰你。我虽然又小又弱，说不定将来真能报答你。
          emotion: fearful
        - id: ch02-b13
          speaker: hans
          text: >-
            你这只可怜的小虾米！你的报答能有多大用处？不过我今晚心情不错，就饶了你。以后千万别再落到我手里，下一回你可没这么好运。
        - id: ch02-b14
          speaker: narrator
          text: >-
            小矮人低声谢过汉斯，赶忙顺着钟绳滑下去，又像身后起了火一样飞奔下楼。汉斯这才抓住钟绳，使足力气敲起钟来。
        - id: ch02-b15
          speaker: narrator
          text: >-
            午夜的钟声传到牧师耳中，他简直不敢相信，却又欢喜万分。丢了那么多仆人以后，他总算找到了一个能放心托付这份差事的人。汉斯继续敲了好一会儿，才走进干草棚。他往干草上一躺，很快便睡得不省人事。

    - id: ch03
      title: 汉斯定下工时
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            牧师每天一大早就起来巡视，看仆人们是不是都在干活。这天其他人都守在自己的岗位上，唯独汉斯不见了，谁也不知道他的下落。九点过去了，还是没有汉斯。等到十一点，牧师已经担心他也像从前的敲钟人一样消失了。
        - id: ch03-b02
          speaker: narrator
          text: >-
            直到大家围桌吃午饭，汉斯才伸着懒腰、打着呵欠走进来。
        - id: ch03-b03
          speaker: minister
          text: >-
            你这么久到底去哪里了？
        - id: ch03-b04
          speaker: hans
          text: >-
            我刚才一直在睡觉。
        - id: ch03-b05
          speaker: minister
          text: >-
            睡觉？你是说，你竟能一觉睡到大中午？
          emotion: surprised
        - id: ch03-b06
          speaker: hans
          text: >-
            我说的就是这个。夜里做工的人，白天当然要睡觉，就像白天做工的人夜里要睡一样。您另找一个人半夜敲钟，我就天亮开工。要我敲钟，我至少得睡到正午。
        - id: ch03-b07
          speaker: narrator
          text: >-
            牧师讲了许多道理，汉斯就是不让步。最后两人重新说定，汉斯不再敲钟，跟其他仆人一样，从日出干到日落。不过早餐和午饭以后，他都可以睡一个钟头。
        - id: ch03-b08
          speaker: minister
          text: >-
            当然，偶尔总会有活儿需要多干一会儿。尤其到了冬天，白昼那么短，手头的事情总得做完。
        - id: ch03-b09
          speaker: hans
          text: >-
            不行。我答应的是从天亮干到天黑，一下也不会多干。除非到了夏天，您肯让我提前收工。往后会怎样，您现在已经清楚了。

    - id: ch04
      title: 太阳落山以后
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            几星期后，邻镇有人请牧师参加洗礼。牧师叫汉斯赶车同行。路上不过几个钟头，因此看见汉斯背着一大袋食物出来，他十分惊讶。
        - id: ch04-b02
          speaker: minister
          text: >-
            你带这些吃的做什么？我们天黑以前一定能到。
        - id: ch04-b03
          speaker: hans
          text: >-
            那可难说，路上什么事都可能耽搁我们。别忘了我们的约定，太阳一落山，我就不是您的仆人了。天黑前赶不到镇上，您只好自己想办法。
        - id: ch04-b04
          speaker: narrator
          text: >-
            牧师以为汉斯是在开玩笑，没有理他。离村几英里后，他们发现昨夜下过大雪，风把雪吹成一座座雪丘，横在路上。两人越走越慢。进入村庄与邻镇之间的密林时，太阳已经挨着树梢。马匹吃力地蹚过又深又软的积雪，汉斯总是回头看身后的太阳。
        - id: ch04-b05
          speaker: minister
          text: >-
            后面有什么东西吗？你怎么老是回头？
        - id: ch04-b06
          speaker: hans
          text: >-
            因为我的后脑勺上没有眼睛，只能回头看。
        - id: ch04-b07
          speaker: minister
          text: >-
            别胡说了。你该专心想想，怎样在天黑以前把我们送到镇上。
        - id: ch04-b08
          speaker: narrator
          text: >-
            汉斯一声不响地继续赶车，只是偶尔还要往后瞧。到了森林中央，太阳完全沉了下去。他马上勒住马，拿起背囊，跳下雪橇。
        - id: ch04-b09
          speaker: minister
          text: >-
            你这是在干什么？难道你疯了？
        - id: ch04-b10
          speaker: hans
          text: >-
            太阳落山了，我的活儿也做完了。今晚我就在这里宿营。
        - id: ch04-b11
          speaker: narrator
          text: >-
            牧师一会儿求他，一会儿吓唬他，又答应给他一大笔酬劳，只求他继续赶车。汉斯却一步也不肯动。
        - id: ch04-b12
          speaker: hans
          text: >-
            您叫我违背自己的诺言，难道不觉得害臊吗？今晚非到镇上不可，您就自己去吧。现在我的时间归我自己，我不能再陪您走了。
        - id: ch04-b13
          speaker: minister
          text: >-
            好汉斯，我怎么能把你一个人丢在这里？你想想，这有多危险！那边就是绞刑架，上面还吊着两个恶人。守着这么吓人的邻居，你不可能睡得着。
        - id: ch04-b14
          speaker: hans
          text: >-
            为什么睡不着？那两只绞架鸟挂在半空，我的帐篷搭在地上。我们各待各的，谁也不碍谁。
        - id: ch04-b15
          speaker: narrator
          text: >-
            汉斯说完便转过身，自己走了。牧师要及时赶到洗礼现场，只能独自赶路。朋友们见他没有车夫，还以为路上出了事。听完他和汉斯的争执，大家反倒分不清主人和仆人究竟哪个更傻。

    - id: ch05
      title: 月光下的小矮人
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            别人怎么议论，汉斯就算知道也不会在乎。他用背囊里的食物填饱肚子，悠然点燃烟斗，又在一棵树的枝桠下搭好帐篷。他把自己严严实实裹进皮裘里，很快便安安稳稳睡着了。
        - id: ch05-b02
          speaker: narrator
          text: >-
            几个钟头后，一阵响动惊醒了他。汉斯坐起来一看，明亮的月光照在头顶，近旁站着两个无头小矮人，正气冲冲地说话。他们一看见汉斯，便同时叫起来。
        - id: ch05-b03
          speakers: [vengeful_dwarf, dwarf_companion]
          ensemble: duo
          text: >-
            就是他！就是他！
          emotion: angry
        - id: ch05-b04
          speaker: narrator
          text: >-
            其中一个向汉斯逼近几步。
        - id: ch05-b05
          speaker: vengeful_dwarf
          text: >-
            啊，老朋友，没想到我们会在这里碰上！我从钟楼台阶摔下去以后，骨头到现在还疼。那一晚你肯定没忘吧？现在该让你的骨头疼一疼了。伙计们，快来！都快来！
          emotion: angry
        - id: ch05-b06
          speaker: narrator
          text: >-
            话音刚落，一大群无头小东西像成团的蠓虫，从地下直冒出来。他们个个挥着棍棒，一拥而上。别看他们身子小，架不住数量多，棍子落下来又重，再强壮的人也抵挡不了。汉斯挨着一下又一下，觉得自己的死期已经到了。就在打斗最激烈的时候，又有一个小矮人赶了过来。
        - id: ch05-b07
          speaker: grateful_dwarf
          text: >-
            住手，伙计们！这个人曾经帮过我，我还欠他一份恩情。我落在他手里时，他饶了我的性命。他是把你们踢下了楼，可洗一个热水澡，你们的伤不就好了吗？原谅他吧，都安安静静回家去。
        - id: ch05-b08
          speaker: narrator
          text: >-
            无头小矮人听从了他，顷刻间又全都不见了。汉斯定了定神，仔细看向救命恩人，这才认出他就是躲在教堂大钟里的那个小矮人。
        - id: ch05-b09
          speaker: narrator
          text: >-
            小矮人在树下坐稳，慢慢开了口。
        - id: ch05-b10
          speaker: grateful_dwarf
          text: >-
            我说将来也许能帮你，你那时还笑我。如今你该知道，我的话没有错。以后不论遇见多么弱小的生灵，都别再轻视他了。
        - id: ch05-b11
          speaker: hans
          text: >-
            我真心谢谢你。他们打得我浑身骨头还在疼。你要是没来，我一定已经遭了大难。
        - id: ch05-b12
          speaker: grateful_dwarf
          text: >-
            我欠你的恩情差不多还完了。不过你已经挨了这一顿打，我就再帮你一次，告诉你一件事。你不用再服侍那个吝啬的牧师。明天回家后，马上去教堂北面的墙角。那里砌着一块大石头，别的石头都用灰泥粘牢了，只有它没有。
        - id: ch05-b13
          speaker: grateful_dwarf
          text: >-
            后天是满月。到了午夜，你带一把鹤嘴锄，把那块石头从墙里撬出来。石头下面藏着一大笔财宝，是战乱时埋下的。里面不但有教堂的金银器皿，还有一袋袋的钱，已经在那里放了一百多年，谁也不知道属于哪一家。你必须把三分之一分给穷人，剩下的才可以自己留下。
        - id: ch05-b14
          speaker: narrator
          text: >-
            小矮人刚说完，村里的公鸡便叫了起来。他随即消失得无影无踪。汉斯活动了一下胳膊和腿，发现挨打留下的疼痛已经全都消失。他躺在那里，久久想着那笔藏起来的财宝，直到快天亮时才又睡着。

    - id: ch06
      title: 墙里的宝藏
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            汉斯经历了那样一夜，第二天一直睡到很晚。等牧师终于从镇上回来，太阳早已高高挂在天空。
        - id: ch06-b02
          speaker: minister
          text: >-
            汉斯，你昨天不跟我走，真是傻透了！我在那里吃得好，玩得也痛快，最后口袋里还装了钱。
        - id: ch06-b03
          speaker: narrator
          text: >-
            牧师故意把几枚硬币摇得叮当响，要让汉斯听听自己错过了多少好处。
        - id: ch06-b04
          speaker: hans
          text: >-
            老爷，您挣到这点钱，想必一整夜都没睡。我舒舒服服睡着觉，赚到的却是您那笔钱的一百倍。
        - id: ch06-b05
          speaker: minister
          text: >-
            你究竟是怎么办到的？
        - id: ch06-b06
          speaker: narrator
          text: >-
            牧师急着追问，汉斯却不肯把秘密说出来。
        - id: ch06-b07
          speaker: hans
          text: >-
            只有傻瓜才拿几个小钱四处吹嘘，聪明人会把自己的金币藏好。
        - id: ch06-b08
          speaker: narrator
          text: >-
            两人驾车回到家。汉斯一点也没有耽误该做的差事。他先把马牵进厩里安顿好，又给它们喂足饲料，然后才去教堂北面的墙角。他果然在小矮人所说的位置找到了那块松动的石头。确认无误以后，他又回去接着干活。
        - id: ch06-b09
          speaker: narrator
          text: >-
            到了满月之夜，汉斯等全村人都睡熟了，便带着鹤嘴锄悄悄出门。他费了好大力气，终于把石头从原处撬开。墙上果然露出一个洞，教堂的金银器皿和一袋袋钱就藏在里面，一切都同小矮人说的一模一样。
        - id: ch06-b10
          speaker: narrator
          text: >-
            接下来的星期日，汉斯拿出财宝的三分之一，分给村里的穷人。随后他告诉牧师，自己要解除主仆契约。汉斯连应得的工钱也没有索要，这正合吝啬的牧师心意。牧师没有提出异议，任他照自己的意思离开。
        - id: ch06-b11
          speaker: narrator
          text: >-
            汉斯就这样告别了牧师。他买下一所大房子，娶了一位年轻的妻子，从此过着富足快活的日子，直到生命尽头。
