audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 编者
      tts: {delivery: 亲切而略带诙谐的讲述, timbre: 温暖清晰的成年男声, pace: 从容舒展, pitch: 中低音}
    emperor:
      display_name: 皇帝
      tts: {delivery: 威严深沉，愤怒时声势逼人, timbre: 浑厚苍老的男声, pace: 稍慢, pitch: 低音}
    petru:
      display_name: 彼得鲁
      tts: {delivery: 年轻爽朗，遇险时果断坚韧, timbre: 清亮柔韧的青年男声, pace: 适中, pitch: 中高音}
    florea:
      display_name: 弗洛雷亚
      tts: {delivery: 外表豪迈，内里谨慎退缩, timbre: 宽厚有力的青年男声, pace: 适中, pitch: 中低音}
    costan:
      display_name: 科斯坦
      tts: {delivery: 精干直接，心思转得很快, timbre: 紧实清楚的青年男声, pace: 稍快, pitch: 中音}
    birsa:
      display_name: 老乳母比尔莎
      tts: {delivery: 慈爱机敏，说话笃定而有分寸, timbre: 温暖略沙哑的老年女声, pace: 从容, pitch: 中音}
    brown_horse:
      display_name: 棕马
      tts: {delivery: 忠诚沉着，警告时急切有力, timbre: 稳健清晰的成年男声, pace: 适中, pitch: 中低音}
    copper_flower:
      display_name: 铜林花朵
      tts: {delivery: 甜美诱人，带着殷勤的蛊惑, timbre: 柔亮的年轻女声, pace: 稍快, pitch: 高音}
    silver_flower:
      display_name: 另一朵花
      tts: {delivery: 娇柔热切，争先恐后地劝诱, timbre: 清甜的年轻女声, pace: 稍快, pitch: 中高音}
    first_vylva:
      display_name: 铜森林的维尔娃
      tts: {delivery: 凶狠怪异，疲惫时气息破碎, timbre: 粗粝低沉的女声, pace: 缓慢, pitch: 低音}
    second_vylva:
      display_name: 银森林的维尔娃
      tts: {delivery: 强悍冷峻，解脱后真诚温和, timbre: 冷亮有力的女声, pace: 适中, pitch: 中低音}
    third_vylva:
      display_name: 金森林的维尔娃
      tts: {delivery: 诡秘凌厉，解脱后庄重诚挚, timbre: 深沉多变的女声, pace: 稍慢, pitch: 低音}
    mitwoch:
      display_name: 米特沃赫女神
      tts: {delivery: 古老和善，赞许中带着威严, timbre: 清冷厚实的老年女声, pace: 从容, pitch: 中低音}
    box_voice:
      display_name: 宝匣之声
      tts: {delivery: 准确平静，不带个人情绪, timbre: 清澈中性的声音, pace: 适中, pitch: 中音}
    thunder_goddess:
      display_name: 雷霆女神
      tts: {delivery: 热诚爽朗，告诫时郑重有力, timbre: 明亮饱满的成年女声, pace: 适中, pitch: 中音}
    maiden_1:
      display_name: 花谷少女甲
      tts: {delivery: 轻柔亲昵，带着迷人的诱惑, timbre: 甜润的年轻女声, pace: 舒缓, pitch: 中高音}
    maiden_2:
      display_name: 花谷少女乙
      tts: {delivery: 温柔婉转，带着迷人的诱惑, timbre: 清亮的年轻女声, pace: 舒缓, pitch: 高音}
    maiden_3:
      display_name: 花谷少女丙
      tts: {delivery: 柔美热切，带着迷人的诱惑, timbre: 轻盈的年轻女声, pace: 舒缓, pitch: 中音}
    venus:
      display_name: 维纳斯女神
      tts: {delivery: 喜怒分明，亲切中藏着古老的骄傲, timbre: 苍老而仍有光彩的女声, pace: 从容, pitch: 中音}
    giant:
      display_name: 巨人
      tts: {delivery: 粗暴好斗，认输时慌张急促, timbre: 轰鸣般粗厚的男声, pace: 稍慢, pitch: 低音}
  chapters:
    - id: ch01
      title: 一只眼笑，一只眼哭
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，该发生的事果然发生了。不然，这个故事也不会传到今天。那时有位权势极大的皇帝，疆土辽阔得没人说得清边界。可人人都知道一件怪事：他的右眼总在笑，左眼却总在哭。有一两个勇士壮着胆子问过缘故，皇帝只笑，半个字也不肯说。这个秘密，只有他自己明白。
        - id: ch01-b02
          speaker: narrator
          text: >-
            与此同时，皇帝的三个儿子也一天天长大。那是怎样的三个儿子啊，个个都像天上的晨星。长子弗洛雷亚身材高大，肩膀宽阔，整个国土上没有一个人能比得上他。次子科斯坦恰好相反。他个子矮，身形单薄，胳膊却很有力量，手腕尤其强健。最小的彼得鲁又高又瘦，倒像姑娘多过像少年。他平时很少说话，却从早到晚笑了唱、唱了笑，难得有正经的时候。不过，他一旦开始思考，总爱把头发往额后一捋。看那副模样，他仿佛已经年长得足以坐进父皇的御前会议，同大臣们商议国事了。
        - id: ch01-b03
          speaker: petru
          text: 弗洛雷亚，你已经长大了。去问父皇吧，他为什么一只眼睛笑，另一只眼睛哭？
        - id: ch01-b04
          speaker: narrator
          text: 弗洛雷亚早吃过这问题的苦头，知道父亲听见准会发怒，怎么也不肯去。彼得鲁又去劝科斯坦，也没能说动他。
        - id: ch01-b05
          speaker: petru
          text: 好吧，既然你们都怕，那就让我自己去问。
        - id: ch01-b06
          speaker: narrator
          text: 他当真走到父亲面前，问出了那个问题。
        - id: ch01-b07
          speaker: emperor
          text: 愿你瞎了眼！这件事跟你有什么关系？
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: 皇帝怒气冲冲，狠狠扇了彼得鲁几个耳光。彼得鲁回去把经过告诉哥哥们。没过多久，他却发现，父亲左眼流的泪好像少了，右眼笑得更欢。
        - id: ch01-b09
          speaker: petru
          text: 难道是因为我问了那句话？那我再试一次。无非再挨几个耳光！
        - id: ch01-b10
          speaker: narrator
          text: 第二次，他问了同样的问题，又得到同样的怒斥和耳光。可是皇帝的左眼如今只偶尔落泪，右眼看着竟年轻了十岁。
        - id: ch01-b11
          speaker: petru
          text: 果然是这样。我就一直问，一直挨打，直到父皇的两只眼睛都笑起来。
        - id: ch01-b12
          speaker: narrator
          text: 彼得鲁发过的誓，从不会违背。他果真一次次去问。终于，皇帝的两只眼睛一起笑了。
        - id: ch01-b13
          speaker: emperor
          text: >-
            彼得鲁，我的好孩子，这件事看来已经牢牢占住了你的心。那我就把秘密告诉你。我看见三个儿子这样强壮俊美，右眼自然欢喜。左眼却在担心，等我死后，你们守不住帝国，也挡不住仇敌。要是你们能取回黎明仙女泉中的水，为我洗眼，我的两只眼睛就会永远欢笑。到那时，我也会知道，我的儿子有勇气战胜任何敌人。
        - id: ch01-b14
          speaker: narrator
          text: 彼得鲁听完，拿起帽子就去找哥哥。三兄弟认真商量了一番。弗洛雷亚是长子，便先去马厩选中最漂亮、最出色的马，备好鞍具，向宫廷众人辞行。
        - id: ch01-b15
          speaker: florea
          text: 我现在出发。要是过了一年、一个月、一个星期又一天，我还没带泉水回来，科斯坦，你就接着来找我。
        - id: ch01-b16
          speaker: narrator
          text: >-
            弗洛雷亚转过宫殿拐角，很快不见了。他三天三夜不曾勒缰，骏马像精灵一样飞过高山和低谷，直奔帝国边境。那里有一道深不见底的壕沟，绕着整个国土，只有一座桥可以通行。他来到桥头，停下来最后环顾故土，默默向它告别。可等他转过身，面前竟站着一条三头龙。那是怎样一条龙啊！三个脑袋都长着狰狞的脸，三张大嘴一起张开，上颚像顶着天，下颚像碰着地。
        - id: ch01-b17
          speaker: narrator
          text: >-
            弗洛雷亚一见这个可怕景象，根本没有迎战的念头。他猛踢马腹，拨转坐骑就飞奔而去。自己究竟要逃往哪里，他不知道，也完全顾不得了。三头龙望着他逃远，只叹了一口气，随即消失得无影无踪。一个星期过去，弗洛雷亚没有回家。两个星期过去，还是杳无音信。到了一个月以后，科斯坦开始一天又一天往马厩里跑，为自己仔细物色一匹合适的坐骑。
        - id: ch01-b18
          speaker: narrator
          text: 一年、一个月、一个星期又一天刚满，科斯坦跨上马，向弟弟告别。
        - id: ch01-b19
          speaker: costan
          text: 要是我也没能回来，下一次就轮到你了。
        - id: ch01-b20
          speaker: narrator
          text: 科斯坦说完便沿着弗洛雷亚走过的路去了。他也一路来到边境的桥前。桥上的三头龙比从前更加可怕，三个脑袋也显得更加骇人。这位年轻英雄看清怪物以后，同样没有交战，转身逃得甚至比哥哥还快。从此，科斯坦也像弗洛雷亚一样音讯全无，宫中只剩下彼得鲁独自陪在父亲身边。
        - id: ch01-b21
          speaker: petru
          text: 父皇，我必须去找两位哥哥。
        - id: ch01-b22
          speaker: emperor
          text: 去吧。愿你的运气比他们好。
        - id: ch01-b23
          speaker: narrator
          text: 父子就此告别，彼得鲁跨上坐骑，径直向帝国边境赶去。他沿着两位哥哥走过的道路，越过同样的高山低谷，终于来到那座桥前。可桥上这回出现的不是三头龙，而是一条更加恐怖的七头龙。七颗脑袋一齐挡住去路，每一颗都比两位兄长见过的龙头更狰狞。彼得鲁瞧见这个可怕怪物，没有立刻逃走。他在马背上停顿片刻，盯着前方，终于发出了声音。
        - id: ch01-b24
          speaker: petru
          text: 让开！让开！我说最后一次，让开！
        - id: ch01-b25
          speaker: narrator
          text: 龙纹丝不动。彼得鲁第三次喝令以后，拔剑直冲过去。刹那间，四周的天空仿佛暗了下来，他整个人陷进火海。右边是火，左边是火，前面是火，后面还是火。不管望向哪里，除了烈焰什么也看不见，因为七个龙头都在喷火。坐骑被这景象吓得嘶鸣直立，彼得鲁早已备好的长剑，竟连一下也使不出来。
        - id: ch01-b26
          speaker: petru
          text: 安静！这样可不行！
        - id: ch01-b27
          speaker: narrator
          text: 他赶紧下马，左手攥紧缰绳，右手握剑，可眼前还是只有火和浓烟。
        - id: ch01-b28
          speaker: petru
          text: 没有别的办法，我得回去换一匹更好的马。
    - id: ch02
      title: 父皇年轻时的坐骑
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 彼得鲁往家赶去，老乳母比尔莎正在宫门口焦急地等他。
        - id: ch02-b02
          speaker: birsa
          text: 彼得鲁，我的孩子，我早知道你会回来。你从一开始就用错了法子。
        - id: ch02-b03
          speaker: petru
          text: 那我究竟该怎么办？
          emotion: sad
        - id: ch02-b04
          speaker: birsa
          text: 听着，孩子。你不骑上父皇年轻时的坐骑，就永远到不了黎明仙女的泉边。去问那匹马在哪里。找到它，再重新出发。
        - id: ch02-b05
          speaker: narrator
          text: 彼得鲁真心谢过乳母，立刻去向父亲打听。
        - id: ch02-b06
          speaker: emperor
          text: >-
            凭我眼中的光发誓！是谁告诉你的？准是比尔莎那个老巫婆！你疯了吗？我年轻到现在已有五十年，谁知道那匹马的骨头烂在什么地方？马厩里有没有剩下一小截缰绳都难说。我早把它忘光了！
          emotion: angry
        - id: ch02-b07
          speaker: narrator
          text: 彼得鲁气冲冲地转身，又去找比尔莎。
        - id: ch02-b08
          speaker: birsa
          text: 别灰心。要真是这样，事情反而好办。把那截缰绳找来，我自有办法。
        - id: ch02-b09
          speaker: narrator
          text: >-
            存放鞍具的地方堆满了马鞍、笼头和皮革碎片。彼得鲁从中挑出最旧、最黑、烂得最厉害的一副缰绳。比尔莎对着它低声念了几句，又撒上香料，再把它递回去。
        - id: ch02-b10
          speaker: birsa
          text: 拿好缰绳，使劲朝屋柱抽一下。
        - id: ch02-b11
          speaker: narrator
          text: >-
            缰绳刚碰到柱子，奇事就发生了。它究竟怎么发生的，连讲故事的人也说不清。彼得鲁站在那里，惊得目瞪口呆。一匹举世无双的骏马忽然出现在眼前。它背上的鞍由黄金和宝石制成，笼头更是光华夺目，亮得叫人几乎不敢直视，生怕把眼睛看瞎。好一匹骏马，好一副鞍具，好一条笼头，每一样都已经替这位英俊的王子准备妥当。
        - id: ch02-b12
          speaker: birsa
          text: 跳上这匹棕马吧。
        - id: ch02-b13
          speaker: narrator
          text: 老妇人转身进屋。彼得鲁刚坐上马背，就觉得手臂比从前强了三倍，胆气也壮了许多。
        - id: ch02-b14
          speaker: brown_horse
          text: 大人，请在鞍上坐稳。前路还长，我们不能耽搁。
        - id: ch02-b15
          speaker: narrator
          text: 棕马奔驰起来，彼得鲁很快发现，那速度是世上任何人、任何马都不曾有过的。到了桥前，那里又站着一条龙，却不是他先前交手的那条。这一回，龙长着十二个脑袋，一个比一个丑恶，喷出的火焰也一道比一道凶猛。可不管它有多可怕，这回总算遇上了对手。彼得鲁毫无惧色，卷起袖子，让两条手臂能自由挥动。他喝令龙让开，十二个脑袋却只喷出更多火焰和浓烟。他不再多说，拔出剑，准备冲上桥去。
        - id: ch02-b16
          speaker: brown_horse
          text: >-
            等一等，大人，千万照我的话做。把马刺一直扎进我的身体，让齿轮没入肉里。拔剑准备好，我们要从桥和龙的上方跳过去。到了龙头正上方，就砍下最大的那颗头。重新落地以前，擦掉剑上的血，把干净的剑收回鞘里。
        - id: ch02-b17
          speaker: narrator
          text: 彼得鲁扎下马刺，拔出长剑。他们凌空跃起时，他砍掉最大的龙头，擦净剑上的血，在马蹄落地前将剑收入鞘中。就这样，他们越过了桥。
        - id: ch02-b18
          speaker: petru
          text: 故乡已经在身后了，我们还得继续往前。
        - id: ch02-b19
          speaker: brown_horse
          text: 是啊，大人。可您想走多快？像风，像思想，像欲望，还是像诅咒？
        - id: ch02-b20
          speaker: narrator
          text: 彼得鲁抬头看看天，又低头看看地。前方是一片无边荒漠，看得他头发直竖。
        - id: ch02-b21
          speaker: petru
          text: 每种速度都试一回吧。别快得把我们累坏，也别慢得白费时间。
        - id: ch02-b22
          speaker: narrator
          text: 于是，他们在荒漠上一路奔驰。第一天像风，第二天像思想，第三天和第四天又像欲望与诅咒。那片荒漠仿佛永远走不到头，可四种速度全试过一回后，他们终于来到尽头。
        - id: ch02-b23
          speaker: petru
          text: 现在慢一点，让我看看这些从未见过的景象。
        - id: ch02-b24
          speaker: narrator
          text: >-
            他揉揉眼睛，像刚从梦中醒来，也像见到了一件奇异得无法相信的东西。眼前竟立着一片铜铸的森林。树干是铜的，枝叶是铜的，就连灌木和花朵也全是铜的。彼得鲁站在那里看呆了，活像一个人忽然见到从未看过、也从未听人提过的景象。过了好一会儿，他才径直骑进树林。道路两旁，一排排花朵全都开口赞美他，劝他摘下几朵，亲手给自己编一顶花冠。
    - id: ch03
      title: 铜、银与金的森林
      blocks:
        - id: ch03-b01
          speaker: copper_flower
          text: 摘下我吧！我这样美，谁摘了我，我就赐给谁力量。
        - id: ch03-b02
          speaker: silver_flower
          text: 不，摘我！把我戴在帽子上，世上最美的女子就会爱上你。
        - id: ch03-b03
          speaker: narrator
          text: 更多花朵争着用甜美的声音许诺奇迹。彼得鲁弯腰正要摘，棕马忽然跳到一旁。
        - id: ch03-b04
          speaker: petru
          text: 你怎么连站都站不稳？
        - id: ch03-b05
          speaker: brown_horse
          text: 别摘。那些花会给您招来灾祸。
        - id: ch03-b06
          speaker: petru
          text: 为什么？
        - id: ch03-b07
          speaker: brown_horse
          text: 花上有诅咒。谁摘了，就得跟林中的维尔娃交战。
        - id: ch03-b08
          speaker: petru
          text: 维尔娃是什么样的妖怪？
        - id: ch03-b09
          speaker: brown_horse
          text: 让我清静一会儿吧。您尽管看，可一朵也不要摘。
        - id: ch03-b10
          speaker: narrator
          text: >-
            彼得鲁明知忠告该听，也费力忍住了。可是花朵不停哀求，他的心越来越软。一个人若注定倒霉，霉运总会找到他。
        - id: ch03-b11
          speaker: petru
          text: >-
            该来的总会来。我至少要看看维尔娃是什么样，又该怎样跟她打。要是命中注定死在她手里，我躲也没用。要不是这样，就算她有一千二百个维尔娃的本领，我也能赢。
        - id: ch03-b12
          speaker: narrator
          text: 他弯腰采花，很快编好了花冠。
        - id: ch03-b13
          speaker: brown_horse
          text: 您做得太错了。可现在已经来不及，准备战斗吧，维尔娃来了！
          emotion: sad
        - id: ch03-b14
          speaker: narrator
          text: >-
            彼得鲁刚把花冠编好，四面八方便同时吹起轻风。风越刮越猛，转眼成了呼号的暴风，直到周围所有东西都被黑暗吞没。那黑暗像一件沉重的斗篷，把彼得鲁、棕马和整片森林紧紧罩住。就连他们脚下的大地，也跟着狂风摇晃震颤。棕马在黑暗中抖了抖鬃毛。
        - id: ch03-b15
          speaker: brown_horse
          text: 您害怕吗？
        - id: ch03-b16
          speaker: petru
          text: 现在还不怕。不管来什么，该来的总会来。
        - id: ch03-b17
          speaker: brown_horse
          text: 别怕，我会帮您。取下我颈上的笼头，想办法套住她。
          emotion: calm
        - id: ch03-b18
          speaker: narrator
          text: >-
            话才说完，维尔娃已经出现，彼得鲁甚至不敢看她。说她有头，又不像真有。说她无头，却也不是。她不在空中飞，也不在地上走。她有马鬃、鹿角、熊脸、臭鼬的眼睛，身子像把各种东西都拼在了一起。彼得鲁稳住身形，四下挥剑，却什么也砍不到。
        - id: ch03-b19
          speaker: narrator
          text: 一天一夜过去，仍没分胜负。维尔娃终于喘起粗气。
        - id: ch03-b20
          speaker: first_vylva
          text: 停一下，让我们歇一会儿。
        - id: ch03-b21
          speaker: narrator
          text: 彼得鲁放低了剑。
        - id: ch03-b22
          speaker: brown_horse
          text: 一刻也不能停！
        - id: ch03-b23
          speaker: narrator
          text: >-
            彼得鲁重新猛攻。维尔娃一会儿像马嘶鸣，一会儿像狼长嚎，又扑了上来。第二个昼夜的战斗更加激烈，彼得鲁累得几乎抬不起手臂。
        - id: ch03-b24
          speaker: first_vylva
          text: 再停一下吧。你和我一样，都已经累坏了。
        - id: ch03-b25
          speaker: brown_horse
          text: 不能停！
        - id: ch03-b26
          speaker: narrator
          text: >-
            彼得鲁继续挥剑，维尔娃却不再猛扑，出手也谨慎起来。第三天晨空泛红时，他终于把笼头套在筋疲力尽的维尔娃头上。一匹世上最美的马立刻从妖怪身上跃了出来。
        - id: ch03-b27
          speaker: first_vylva
          text: 愿你一生甜美。是你解除了我的魔咒。
          emotion: happy
        - id: ch03-b28
          speaker: narrator
          text: >-
            她用鼻子蹭了蹭自己兄弟，又把身世和多年受魔法束缚的遭遇告诉彼得鲁。彼得鲁把她系在棕马后面，一路飞驰，直到离开铜森林。前方又出现一片闪闪发亮的银森林。
        - id: ch03-b29
          speaker: petru
          text: 停一停，让我再看看从未见过的景象。
        - id: ch03-b30
          speaker: narrator
          text: 银花也纷纷求他采摘。
        - id: ch03-b31
          speaker: first_vylva
          text: 别摘！我兄弟的力量是我的七倍。
        - id: ch03-b32
          speaker: narrator
          text: >-
            彼得鲁明明知道这话有多重，犹豫片刻，还是采花编起银冠。暴风更响，大地震得更凶，黑夜也更浓。银森林的维尔娃冲来，速度是第一个的七倍。他们大战三天三夜，彼得鲁才把笼头套到她头上。
        - id: ch03-b33
          speaker: second_vylva
          text: 愿你一生甜美。是你解除了我的魔咒。
          emotion: happy
        - id: ch03-b34
          speaker: narrator
          text: >-
            第二匹马也加入同行，他们照先前一样继续赶路。没过多久，一片金森林出现在前方，比铜森林和银森林都美得多。同行的伙伴再次央求彼得鲁赶快骑过去，千万别碰那些花。可这一次，他对所有劝告都充耳不闻，又俯身采起花来。金冠还没有编好，他就觉得有一种看不见的可怕东西正在地下移动，而且越来越近，仿佛下一刻就会从脚边钻出来。
        - id: ch03-b35
          speaker: petru
          text: 不是我死，就是它的头钻进我的笼头！
        - id: ch03-b36
          speaker: narrator
          text: >-
            浓雾猛地裹住他。他看不见手，也听不见自己的声音，只能挥剑苦战。一天一夜后，雾才变薄。第二天黎明，太阳重新出现，彼得鲁仿佛又活了一回，维尔娃却不见了。
        - id: ch03-b37
          speaker: brown_horse
          text: 趁还能喘气，快歇一会儿。战斗马上又要开始。
        - id: ch03-b38
          speaker: petru
          text: 刚才那究竟是什么？
        - id: ch03-b39
          speaker: brown_horse
          text: 那就是维尔娃，她变成了雾。听，她又来了！
        - id: ch03-b40
          speaker: narrator
          text: >-
            彼得鲁刚吸进一口气，就感觉有什么东西从侧面直逼过来，却说不清那究竟是什么。它看着像一条河，却又不是河，因为它并不在大地上流淌。那股水仿佛能随自己的心意来去，涌过之后，地面上连半点痕迹也不会留下。面对这样无形无迹的敌人，彼得鲁终于真正害怕了。
        - id: ch03-b41
          speaker: petru
          text: 这一次，我恐怕活不成了！
          emotion: fearful
        - id: ch03-b42
          speaker: brown_horse
          text: 小心，千万别停！
        - id: ch03-b43
          speaker: narrator
          text: >-
            水堵住棕马的喉咙，战斗又持续了一天一夜。彼得鲁不知道自己砍的是谁，也不知道砍中了什么。第二天破晓，他觉得两条腿都跛了。
        - id: ch03-b44
          speaker: petru
          text: 这下我真完了。
          emotion: sad
        - id: ch03-b45
          speaker: narrator
          text: >-
            绝望反让他的剑挥得更快更猛。太阳升起，水也消失了。棕马让他喘口气，提醒维尔娃转眼又会回来。彼得鲁累得不知怎样再打，却还是坐稳马鞍，握剑等待。
        - id: ch03-b46
          speaker: narrator
          text: >-
            接着，又有某种东西朝他而来，究竟是什么，连讲故事的人也说不清。或许人只有在梦里，才会见到这种怪物。她偏偏有着自己本不该有的东西，又偏偏没有自己本该有的东西。她用脚飞，用翅膀走，脑袋长在背上，尾巴翘在身顶，眼睛生在脖子里，脖子又长在额头上。要再说她是什么模样，实在没人说得出来。恐惧像一件衣裳裹住彼得鲁。可只过了一会儿，他便抖擞精神，重新鼓起勇气，打得比以往任何一次都更加勇猛。
        - id: ch03-b47
          speaker: narrator
          text: >-
            白昼过去，他的力气越来越少。入夜时，眼睛几乎睁不开。到了午夜，他已经离开马背，站在地上。清晨泛起灰光时，他连站也站不住，只能跪着继续战斗。
        - id: ch03-b48
          speaker: brown_horse
          text: 再拼最后一次，马上就结束了！用笼头抽她的嘴！
        - id: ch03-b49
          speaker: narrator
          text: >-
            彼得鲁擦去汗水，拼尽最后一点力气站起来，用笼头抽中维尔娃的嘴。她的嘶鸣震耳欲聋，随后精疲力竭地猛扑过来。彼得鲁早有准备，趁机把笼头套上她的头。天亮时，已有三匹马跟在身边。
        - id: ch03-b50
          speaker: third_vylva
          text: 愿你的妻子成为世上最美的女子。是你解除了我的魔咒。
          emotion: happy
        - id: ch03-b51
          speaker: narrator
          text: >-
            四匹马一同飞驰，到了夜里，总算来到金森林边缘。这时，彼得鲁想起自己先后戴过的三顶花冠，也想起每一顶花冠让他付出了多大的代价。他越想越觉得，这么多花冠带在身边根本没有用。既然金冠最好，留下它一顶也就够了。于是，他先摘下铜冠，又摘下银冠，把两顶花冠都扔在路边。
        - id: ch03-b52
          speaker: brown_horse
          text: 停下！别扔，说不定以后用得着。请下马把它们捡回来。
        - id: ch03-b53
          speaker: narrator
          text: 彼得鲁捡回花冠，大家继续上路。傍晚太阳西沉，蠓虫出来叮人时，一片辽阔荒原横在前方，棕马忽然自己停住了。
    - id: ch04
      title: 严寒与酷热的国度
      blocks:
        - id: ch04-b01
          speaker: petru
          text: 怎么了？
        - id: ch04-b02
          speaker: brown_horse
          text: 我怕前面会有祸事。我们要进入米特沃赫女神的国度，越往里越冷。路旁到处都是大火，我担心您会停下来取暖。
        - id: ch04-b03
          speaker: petru
          text: 为什么不能取暖？
        - id: ch04-b04
          speaker: brown_horse
          text: 您只要靠近火堆，可怕的灾祸就会落到头上。
          emotion: sad
        - id: ch04-b05
          speaker: petru
          text: 那就向前！非得挨冻，我就挨着！
          emotion: happy
        - id: ch04-b06
          speaker: narrator
          text: >-
            他们进入的是米特沃赫的国度。这个名字在德语里是星期三，在故事中却成了墨丘利的女性化身。他们每前进一步，空气就更冷、更冰，最后连骨髓都像要冻住。彼得鲁不是懦夫，先前几场恶战磨炼了他的忍耐力。他硬是没有退缩。道路两旁燃着一堆堆熊熊大火，火边站着许多人，个个亲切地同他说话，招呼他加入。彼得鲁呼出的气刚到嘴边就结了冰，他却丝毫不理会，只是一遍遍催棕马跑得更快。
        - id: ch04-b07
          speaker: narrator
          text: >-
            谁也不知道他默默同严寒搏斗了多久，因为人人都明白，米特沃赫的国度绝不是一天能穿过的。他一路咬紧牙关，任凭冻裂的岩石在身边轰然迸开。到后来，他的牙齿格格打战，连眼皮都冻住了，可他始终没有靠近一堆火。终于，他们来到女神本人的住处。彼得鲁跳下马，把缰绳搭在棕马颈上，独自走进小屋。
        - id: ch04-b08
          speaker: petru
          text: 您好，小妈妈！
        - id: ch04-b09
          speaker: mitwoch
          text: 我很好，多谢你，我这位冻僵的朋友！
        - id: ch04-b10
          speaker: narrator
          text: 彼得鲁笑了笑，等她继续说。
        - id: ch04-b11
          speaker: mitwoch
          text: >-
            你很勇敢，该得到奖赏了。这个小盒子在铁箱里躺了无数年，一直等着能穿过冰雪王国的人。把它收好吧，终有一天会有用。你只要打开，它就能回答任何问题，也能告诉你故乡的消息。
        - id: ch04-b12
          speaker: narrator
          text: 彼得鲁感激地道了谢，骑马离开。走出一段路，他打开小匣子。
        - id: ch04-b13
          speaker: box_voice
          text: 您有什么吩咐？
        - id: ch04-b14
          speaker: petru
          text: 告诉我父亲怎么样了。
        - id: ch04-b15
          speaker: box_voice
          text: 他正在和贵族们议事。
        - id: ch04-b16
          speaker: petru
          text: 他的身体还好吗？
        - id: ch04-b17
          speaker: box_voice
          text: 不太好。他此刻正在大发雷霆。
        - id: ch04-b18
          speaker: petru
          text: 谁惹怒了他？
        - id: ch04-b19
          speaker: box_voice
          text: 是科斯坦和弗洛雷亚。他们想管束父亲，也想统治王国。可老人说，他们根本没有这个本事。
        - id: ch04-b20
          speaker: petru
          text: 快走，好马儿！我们没时间浪费了！
        - id: ch04-b21
          speaker: narrator
          text: >-
            他合上匣子，装进口袋。他们疾驰得像鬼魂，像旋风，也像午夜出猎的吸血鬼。路途实在太远，没人知道他们骑了多久。终于，棕马喊他停下。
        - id: ch04-b22
          speaker: brown_horse
          text: >-
            我得再给您几句忠告。您刚尝过严寒，接下来还得忍受想也想不到的酷热。到那时也要一样勇敢。不论谁来引诱，都不能去阴凉处，否则必有灾祸。
        - id: ch04-b23
          speaker: petru
          text: 往前走吧，不用替我担心。既然没有冻僵，我也不会融化。
        - id: ch04-b24
          speaker: brown_horse
          text: 真会融化。那股热能把骨髓都熔掉，只有雷霆女神的国度才会这样热。
        - id: ch04-b25
          speaker: narrator
          text: >-
            他们走进雷霆女神的国度。这个名字在德语里也是星期四，正是雷神与朱庇特之日。天气果然热得可怕，连马蹄铁都开始融化，彼得鲁却不肯理会。汗水顺着脸不停往下淌，他便抬起铁手套，一次次擦去。路旁不到一箭远的地方，却是一座接一座的美丽山谷。那里树荫浓密，清泉汩汩流淌。彼得鲁只看一眼，心里便像着了火，嘴唇也干裂起来。花丛中站着美丽的少女，用最柔软的声音呼唤他。那声音魔力十足，逼得他不得不闭紧双眼，才没有转向她们。
        - id: ch04-b26
          speakers: [maiden_1, maiden_2, maiden_3]
          ensemble: chorus
          text: 来吧，我们的英雄。到树荫下歇一歇，这酷热会要了你的命。
        - id: ch04-b27
          speaker: narrator
          text: >-
            彼得鲁只是摇头，半句话也没有回答，因为他的喉咙已经干得说不出话。他在这可怕的境地里骑了很久，究竟多久，谁也说不清。忽然，暑气似乎稍稍退了一点。远处的小山上出现一间小屋，那正是雷霆女神的住处。彼得鲁在门前勒住马，女神亲自出来迎接。她热情地请他进屋，让他从头讲起全部历险，也说明此行的来意。彼得鲁一一讲完，马上起身告辞，因为他心里始终记着，路上不能耽搁片刻。
        - id: ch04-b28
          speaker: petru
          text: 我一刻也不能耽搁。谁知道黎明仙女离这里还有多远？
        - id: ch04-b29
          speaker: thunder_goddess
          text: >-
            再留片刻，听我一句。你马上要进入维纳斯女神的国度。替我告诉她，请她别引诱你留下。回来时再来这里，我会送你一件也许用得上的东西。
        - id: ch04-b30
          speaker: narrator
          text: >-
            彼得鲁跨上马，只走三步，就进入了另一个国度。这里像春天一样温软，不冷也不热，脚下的路却穿过满是沙土和蒺藜的荒原。荒原尽头隐约有一座房屋。
        - id: ch04-b31
          speaker: petru
          text: 远处那是什么？
        - id: ch04-b32
          speaker: brown_horse
          text: 是维纳斯女神的住所。快些走，天黑前就能赶到。
        - id: ch04-b33
          speaker: narrator
          text: >-
            棕马听完就像离弦的箭一样蹿出去。暮色降临时，他们已经接近那座屋子。彼得鲁刚一看见它，心便猛地跳了一下。原来一路始终有一群影影绰绰的身形跟着他，围着他不停舞动。她们忽然出现在左边，忽然又到了右边，一会儿挡在前头，一会儿追到身后。彼得鲁虽然勇敢，偶尔也免不了一阵恐惧，不知道这些飘忽的身影会做什么。
        - id: ch04-b34
          speaker: brown_horse
          text: 她们不会伤害您。那是旋风的女儿们在玩耍，等着月亮妖怪。
    - id: ch05
      title: 维纳斯的魔笛
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 棕马停在屋前，彼得鲁正要走向门口，又被叫住。
        - id: ch05-b02
          speaker: brown_horse
          text: >-
            别急！维纳斯的屋子不能直接进去，旋风一直守在她身边。请带着铜花冠走上小山，夸那里有美丽的姑娘、圣洁的天使和可爱的仙灵。再高高举起花冠，问有没有谁愿意收下，接着把它扔出去。
        - id: ch05-b03
          speaker: petru
          text: 为什么要这样？
        - id: ch05-b04
          speaker: brown_horse
          text: 别问，只管照做。
        - id: ch05-b05
          speaker: narrator
          text: 彼得鲁照办。铜冠刚抛出去，旋风便一齐扑上去，把它撕得粉碎。他回到棕马身边，棕马又叫他等一等。
        - id: ch05-b06
          speaker: brown_horse
          text: >-
            再拿银花冠去敲窗。她要是问谁在外面，就说您徒步而来，在荒原迷路了。她会赶您回去，可您一步也别动。告诉她，您从小听说她的美貌，为此穿着钢底皮鞋走了九年零九个月，又从战斗中赢来银冠，只想献给她。往后怎么办，就得靠您自己了。
        - id: ch05-b07
          speaker: narrator
          text: >-
            彼得鲁走向屋子。四周漆黑，只有窗中流出的光为他引路。脚步声一响，两条狗立刻狂吠。
        - id: ch05-b08
          speaker: venus
          text: 是哪条狗在叫？它活腻了吗？
          emotion: angry
        - id: ch05-b09
          speaker: petru
          text: 是我，女神。我在荒原迷了路，不知道今晚能睡在哪里。
          emotion: fearful
        - id: ch05-b10
          speaker: venus
          text: 你的马留在什么地方？
        - id: ch05-b11
          speaker: narrator
          text: 彼得鲁不知道该撒谎还是说真话，没有回答。女神离开窗边。
        - id: ch05-b12
          speaker: venus
          text: 走吧，孩子。这里没有你的住处。
        - id: ch05-b13
          speaker: petru
          text: >-
            不，我不会回去。我从小就听人说起您的美貌。为此，我特意做了钢底皮鞋，走了九年零九个月，又在战斗中赢得这顶银冠。我经受这一切，终于到了这里，只盼您准许我把花冠献给您。
        - id: ch05-b14
          speaker: venus
          text: 把花冠给我看看，孩子。
        - id: ch05-b15
          speaker: narrator
          text: 彼得鲁把银冠举到窗前。
        - id: ch05-b16
          speaker: venus
          text: 进来吧。别怕那些狗，它们总明白我的心意。
        - id: ch05-b17
          speaker: narrator
          text: >-
            彼得鲁从两条狗身边经过时，它们果然都向他摇起尾巴。他进屋道了晚安，在火边舒舒服服坐下，听维纳斯谈她愿意谈的事。她说得最多的，是男人做过的种种邪恶。她显然对世上的男人极其恼怒，一桩接一桩说个不停。彼得鲁没有同她争辩。为了不失礼数，不论她说什么，他都点头表示赞同。
        - id: ch05-b18
          speaker: narrator
          text: >-
            世上真有比她更老的人吗？谁也不知道。彼得鲁一直望着她，也许想数清她脸上的皱纹。可真要数完，他得活上七辈子，每一辈子还要比普通人的一生长七倍。维纳斯见他目不转睛，心里倒很高兴。
        - id: ch05-b19
          speaker: venus
          text: >-
            我出生时，现在的一切都还不存在，世界也还不是世界。后来我长大了，世界才开始形成。人人都说我是他们见过的最美女子，虽说许多人因此恨我。可每过一百年，我脸上就多一道皱纹。如今，我已经老了。
        - id: ch05-b20
          speaker: narrator
          text: >-
            她接着讲起自己的身世，说自己原本也是一位皇帝的女儿，而离她最近的邻居，正是彼得鲁要找的黎明仙女。她和黎明仙女不久前曾经大吵一场。说到那场争吵，她越来越生气，索性高声辱骂起黎明仙女。彼得鲁不知道该怎么应付。他大多时候默默听着，只偶尔为了礼貌附和一句。除此以外，他还能怎么办呢？
        - id: ch05-b21
          speaker: petru
          text: 是啊，是啊，她一定亏待您了。
        - id: ch05-b22
          speaker: venus
          text: >-
            我要请你办一件事。你这样勇敢，一定能做到。黎明仙女屋旁有口井，谁喝了井水，谁就会像玫瑰一样重新绽放。替我带一瓶回来，我什么都愿意拿来报答你。她的国度四周有猛兽和恶龙守卫，可我有东西能帮你。
        - id: ch05-b23
          speaker: narrator
          text: 女神打开一只铁箍箱子，取出一支极小的笛子。
        - id: ch05-b24
          speaker: venus
          text: >-
            这支笛子是我年轻时一位老人送的。谁听见笛声，谁就会睡着，怎么也叫不醒。拿去吧。只要还在黎明仙女的国度，就不停地吹，这样才安全。
        - id: ch05-b25
          speaker: narrator
          text: >-
            彼得鲁这才说明，自己本来就是为泉水而来。维纳斯听完更加欢喜。他向她道过晚安，把笛子放回盒中，在最下面的房间睡下。天还没亮，他就醒了。他喂饱四匹马，又牵它们去井边喝水，随后穿好衣服，准备上路。
        - id: ch05-b26
          speaker: venus
          text: >-
            等等，还有一条忠告。留下一匹马，只带三匹走。到了仙女的国度，要下马步行。回来时也把三匹马都留在路上，自己走回来。最要紧的是，千万别看黎明仙女的脸。她的眼睛会迷住你，让你神魂颠倒。她丑得难以想象，长着猫头鹰的眼、狐狸的脸和猫爪。听见了吗？无论怎样都别看她！
        - id: ch05-b27
          speaker: narrator
          text: 彼得鲁谢过女神，费了好一番工夫，才终于脱身。
    - id: ch06
      title: 黎明仙女的泉水
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            在极远的地方，天空和大地相接，星星亲吻花朵。那里透着一抹柔和红光，像春日天边的霞色，却更加美丽奇妙。光芒就在黎明仙女的宫殿后面。彼得鲁穿过开满鲜花的草地，整整走了两天两夜。一路不冷也不热，不明也不暗，却又像是冷热明暗都在其中。他丝毫不觉得路长。
        - id: ch06-b02
          speaker: narrator
          text: >-
            又走了一阵，彼得鲁看见红色天光里渐渐升起一片白色。起先他分辨不出那是什么，走近以后，才看清是一座耀眼的城堡。宫墙在柔和的红光中白得发亮，华美得让人无法直视。他从不知道世上还有这样美的宫殿，很想停下来看个明白。可他没有时间耽搁，只得振作精神，跳下马来，把坐骑留在沾满露水的草地上，自己取出维纳斯送的魔笛，一边不停吹奏，一边向城堡走去。
        - id: ch06-b03
          speaker: narrator
          text: >-
            没走几步，他忽然被什么东西绊了一跤。低头一看，原来是一个沉睡的巨人，也是城堡的一名守卫。巨人仰面躺着，身躯大得惊人，简直像横在路上的一座小山。彼得鲁明明急着赶路，还是忍不住停下脚步，量了量他到底有多大。再往前走，眼前的景象越来越奇异，也越来越可怕。狮子、老虎、七头龙，全都横七竖八地躺在阳光下酣睡。龙是什么模样，本来就不必细说，因为如今人人都知道。何况龙绝不是能拿来开玩笑的东西。彼得鲁一刻也不敢放慢，像风一样从这些猛兽中间穿过。催着他飞跑的，究竟是寻找泉水的焦急，还是见到守卫的恐惧呢？
        - id: ch06-b04
          speaker: narrator
          text: >-
            他终于来到一条河边。可谁也别把它当作普通河流。河里流的不是水，而是洁白的乳汁。河底铺的不是泥沙和石子，而是一颗颗宝石与珍珠。河水流得既不快也不慢，却又仿佛同时很快很慢。整条河绕着城堡流淌，把宫殿严严实实围在中央。岸边睡着长有铁牙铁爪的狮子。再往后，才是只有黎明仙女配得上的花园，盛开的花丛上还睡着一位仙子。彼得鲁站在河对岸，把这一切全看在眼里。
        - id: ch06-b05
          speaker: narrator
          text: >-
            可他究竟该怎样过去？他无论如何都必须过河。那里虽有一座桥，沉睡的狮子却正守在桥上。就算先不管狮子，只看桥面，也显然不是给人行走的。谁能说清它是什么做成的呢？远远望去，只像一团接一团柔软蓬松的小云。彼得鲁站在岸边想了很久，找不到更稳妥的办法。最后，他决定冒一次险，迈开大步回到沉睡的巨人身旁，抓住巨人用力摇晃。
        - id: ch06-b06
          speaker: petru
          text: 醒醒，好汉！
        - id: ch06-b07
          speaker: narrator
          text: 巨人醒来，伸手来捉彼得鲁，就像人伸手捉苍蝇。彼得鲁吹响笛子，巨人立刻又睡倒。他试了三次，确定笛声能控制巨人，便用手帕绑住巨人的两根小指。第四次，他拔出剑，再把巨人唤醒。
        - id: ch06-b08
          speaker: giant
          text: 这也算公平决斗吗？你要真是英雄，就按规矩跟我打！
          emotion: angry
        - id: ch06-b09
          speaker: petru
          text: >-
            待会儿我会公平地打。可你先回答我，要是我堂堂正正与你交战，你肯发誓送我过河吗？
        - id: ch06-b10
          speaker: narrator
          text: 巨人发了誓。双手一自由，他就朝彼得鲁扑去，想靠体重把王子压扁。可彼得鲁经过那么多战斗，早已不是从前的他。他勇猛地迎了上去。
        - id: ch06-b11
          speaker: narrator
          text: >-
            两人整整打了三天三夜，一会儿巨人占上风，一会儿彼得鲁占上风。最后，他们倒在地上扭打。彼得鲁压在上面，剑尖抵住巨人的咽喉。
        - id: ch06-b12
          speaker: giant
          text: 放了我！我认输！
          emotion: fearful
        - id: ch06-b13
          speaker: petru
          text: 你肯送我过河吗？
        - id: ch06-b14
          speaker: giant
          text: 我肯。
        - id: ch06-b15
          speaker: petru
          text: 要是违背诺言，我该怎样处置你？
        - id: ch06-b16
          speaker: giant
          text: 随你用什么办法杀我！只求你现在饶我一命。
        - id: ch06-b17
          speaker: petru
          text: 很好。
        - id: ch06-b18
          speaker: narrator
          text: >-
            彼得鲁把巨人的左手绑到右脚上，又堵住他的嘴，蒙住他的眼，领到河边。巨人一条腿跨过河，把彼得鲁托在掌心，送到对岸。
        - id: ch06-b19
          speaker: petru
          text: 这才对。
        - id: ch06-b20
          speaker: narrator
          text: >-
            他吹响笛子，巨人再次睡着。下游沐浴的仙女们也听见笛声，纷纷睡倒在花丛中。彼得鲁经过时看见她们，心里不禁疑惑：她们个个这样美，黎明仙女怎么会那样丑？他不敢逗留，继续向前。
        - id: ch06-b21
          speaker: narrator
          text: >-
            这时，他已经走进那座奇妙花园。近看之下，花园比隔河远望时还要神奇。他匆匆穿过一条条小路，沿途没有见到一朵凋谢的花，也没有看见一只飞动的鸟。没有谁出来拦住他，因为园中的一切都被笛声催眠了，连最轻的叶片也停止摆动。彼得鲁穿过庭院，终于走进城堡。里面的景象无需细说，因为全世界都知道，黎明仙女的宫殿绝不是寻常地方。黄金和宝石在这里，就像人间的木头一样普通。就连太阳骏马居住的马厩，也比世上最伟大皇帝的宫殿更加华丽。
        - id: ch06-b22
          speaker: narrator
          text: >-
            彼得鲁登上楼梯，飞快穿过一间又一间房。整整四十八间房里都挂满丝绸，却连一个人影也没有。到了第四十九间，他终于找到了自己跋涉万里寻找的黎明仙女。这间屋子大得像一座教堂，正中央就是那口著名的泉。它看起来与普通水井没有两样。黎明仙女竟把井安在自己的寝室里，似乎十分奇怪，可谁都看得出来，它已经在那里存在了几百年。井边的丝垫上，睡着黎明仙女本人。
        - id: ch06-b23
          speaker: narrator
          text: >-
            彼得鲁一看见她，手里的魔笛便垂了下去，连呼吸也停住了。井旁桌上放着母鹿奶做的力量之面包，还有一壶青春之酒。他很想尝尝，便看看面包，看看酒，又望向睡在丝垫上的仙女。
        - id: ch06-b24
          speaker: narrator
          text: >-
            彼得鲁望着她，神志渐渐像蒙上一层迷雾。仙女慢慢睁开双眼，目光落到彼得鲁身上。他顿时更加失魂落魄，几乎忘了自己是谁，又为何来到这里。好在最后关头，他及时想起手里的魔笛。几声笛音响过，仙女重新沉沉睡去。彼得鲁俯身吻了她三次，随后把最好的金冠轻轻放到她额上。他拿起一块力量之面包吃下，又喝了一杯青春之酒。吻、面包和酒，他如此一共做了三遍。最后，他取出瓶子，灌满父亲需要的泉水，转身飞快离去。
        - id: ch06-b25
          speaker: narrator
          text: >-
            彼得鲁再次穿过花园时，眼前的一切似乎都与来时不同。每一朵花都比先前更加娇美，园中的溪流也奔得更欢，连阳光都仿佛比刚才明亮了许多。那些被魔笛催眠的仙女们虽然还在沉睡，脸上的神情却像是格外快乐。为什么会有这些变化呢？故事说得很明白，这全是彼得鲁送给黎明仙女的三个吻带来的。
        - id: ch06-b26
          speaker: narrator
          text: >-
            他一路不停地吹奏魔笛，平安穿过所有险地，很快又坐回马鞍。他催着马飞驰，速度比风更快，比思想更快，比渴望更快，也比仇恨更快。经过漫长的归途，他终于照维纳斯的吩咐下了马，把带去的三匹坐骑全留在路边，只由自己徒步走向她的屋子。维纳斯早已知道他正赶回来。还没等彼得鲁走到门前，她就拿着白面包和红葡萄酒，亲自出门迎接。
        - id: ch06-b27
          speaker: venus
          text: 欢迎回来，我的王子。
          emotion: happy
        - id: ch06-b28
          speaker: petru
          text: 您好，多谢您。
        - id: ch06-b29
          speaker: narrator
          text: >-
            彼得鲁递上装着魔法泉水的瓶子，维纳斯欢喜地收下。他只歇了一会儿便再次启程，因为一刻也不能耽误。
    - id: ch07
      title: 带着泉水回家
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: 彼得鲁依约在雷霆女神那里停留了几分钟。正匆匆告别时，女神又叫住他。
        - id: ch07-b02
          speaker: thunder_goddess
          text: >-
            等等，听我警告。珍惜自己的性命。不要和任何人结交，也别骑得太快。泉水绝不能离手。不要相信任何人，要避开甜言蜜语。路还很长，世道人心险恶，你手里的东西又珍贵。再拿上这块魔布吧。带着它，雷劈不中你，长矛刺不穿你，刀剑砍不伤你，箭射过来也会滑到一边。
        - id: ch07-b03
          speaker: narrator
          text: 彼得鲁谢过女神，骑马离去。他取出宝匣，询问家中情形。
        - id: ch07-b04
          speaker: box_voice
          text: >-
            家里的情形很糟。皇帝已经双目失明。弗洛雷亚和科斯坦请求父亲把王国交给他们，他却不肯，说在用黎明仙女的泉水洗眼以前，绝不交出政权。
        - id: ch07-b05
          speaker: box_voice
          text: >-
            两位兄长去找老比尔莎出主意。她告诉他们，您已经带着泉水回来。他们便动身迎接，打算夺走泉水，再用它邀功，请皇帝把王国交给自己。
        - id: ch07-b06
          speaker: petru
          text: 你在撒谎！
          emotion: angry
        - id: ch07-b07
          speaker: narrator
          text: 彼得鲁把匣子摔到地上，碎成了千百片。不久，故国的景物已经隐约可见。他在一座桥边勒马，想看得更清楚。远处忽然有人像是在喊他的名字。
        - id: ch07-b08
          speaker: florea
          text: 彼得鲁，是你吗？
        - id: ch07-b09
          speaker: brown_horse
          text: 走！快走！您只要停下，就一定会遭殃！
        - id: ch07-b10
          speaker: petru
          text: 不，我们停下来看看是谁，也看看出了什么事。
        - id: ch07-b11
          speaker: narrator
          text: >-
            彼得鲁不肯听棕马的劝，拨转马头，迎面看见两位失踪已久的哥哥。就在这一刻，他把雷霆女神关于陌生人与甜言蜜语的告诫全忘了。科斯坦和弗洛雷亚满口温柔奉承的话，一步步向他走来。彼得鲁见到亲人，立刻跳下马，冲过去紧紧拥抱他们。他有千百个问题想问，又有千百件一路经历的事情想讲，一时根本不知道该从哪里开口。只有棕马看出了危险。它孤零零站在一旁，悲伤地垂着头。
        - id: ch07-b12
          speaker: florea
          text: 好弟弟，让我们替你拿着泉水，不是更稳妥吗？路上也许有人来抢。若是我们拿着，谁也不会怀疑。
        - id: ch07-b13
          speaker: costan
          text: 正是这样。弗洛雷亚说得有道理。
        - id: ch07-b14
          speaker: narrator
          text: >-
            彼得鲁听了哥哥们的话，却摇头不肯交出瓶子。他没有防备，竟把雷霆女神的每一句警告都告诉了他们，还把那块魔布怎样抵挡雷电、长矛、刀剑和箭矢的秘密说得一清二楚。两个哥哥听完，立刻明白普通办法已经杀不死他，只剩下一种手段。离三兄弟站立的地方不到一箭远，有一条急流奔过。河中清澈的深潭一个接着一个，看不出究竟有多深。弗洛雷亚朝科斯坦使了个眼色，科斯坦马上领会了他的用意。
        - id: ch07-b15
          speaker: florea
          text: 科斯坦，你不觉得口渴吗？
        - id: ch07-b16
          speaker: costan
          text: >-
            我当然渴。彼得鲁，来吧，趁这里有水，我们喝个痛快，再一起回家。有我们两个保护你，再好不过了。
        - id: ch07-b17
          speaker: narrator
          text: >-
            棕马立刻高声嘶鸣，声音里全是警告。彼得鲁总算听懂了它的意思，也想起一路上那些忠告。他没有跟两个哥哥走向急流，更没有把装泉水的瓶子交出去。不，他避开了这场祸事，带着泉水回到父亲身边。他亲手用黎明仙女泉中的水洗过父亲的双眼，治好了皇帝的眼睛。那双眼睛从此终于能一同欢笑。至于弗洛雷亚和科斯坦，他们留在了来路上，从此再也没有回来。
