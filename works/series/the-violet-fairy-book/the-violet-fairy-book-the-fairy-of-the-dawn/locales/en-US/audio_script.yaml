  chapters:
    - id: ch01
      title: The Emperor's Two Eyes
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, what was meant to happen did happen. If it had not, this tale could never have been told. There lived a mighty emperor whose lands were so vast that no one knew where they began or ended. Everyone did know one strange thing about him. His right eye laughed while his left eye wept. A few brave men asked him why, but the emperor only laughed. The secret quarrel between his eyes was known to him alone.
        - id: ch01-b02
          speaker: narrator
          text: Meanwhile, his three sons were growing up, and all three shone like morning stars. Florea, the eldest, was so tall and broad that no man in the kingdom could match him. Costan, the second, was smaller and lightly built, but his arm was strong and his wrist stronger still. Petru, the youngest, was tall and slender. He spoke little, yet laughed and sang from morning to night. Only when he swept the hair back from his forehead and fell into thought did he look old enough to sit in his father's council.
        - id: ch01-b03
          speaker: petru
          text: Florea, you're grown now. Please ask Father why one of his eyes laughs while the other one cries.
        - id: ch01-b04
          speaker: narrator
          text: Florea refused. He had learned that this question always sent the emperor into a rage. Petru tried Costan next, but his second brother would not ask either.
        - id: ch01-b05
          speaker: petru
          text: Well, if everyone else is afraid, I suppose I'll have to ask him myself.
        - id: ch01-b06
          speaker: narrator
          text: Petru went straight to his father and put the question to him.
        - id: ch01-b07
          speaker: emperor
          text: May you go blind! What concern is that of yours?
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: The emperor boxed Petru soundly on the ears. Petru told his brothers what had happened. Not long afterward, though, he noticed that his father's left eye seemed to weep less, while the right eye laughed more.
        - id: ch01-b09
          speaker: petru
          text: Could my question have done that? I'll ask again. After all, what do two boxes on the ears matter?
        - id: ch01-b10
          speaker: narrator
          text: He asked a second time and received the same answer. But now the left eye wept only now and then, and the right eye looked ten years younger.
        - id: ch01-b11
          speaker: petru
          text: Then it is true. I know what I must do. I'll keep asking and keep taking those blows until both eyes laugh together.
        - id: ch01-b12
          speaker: narrator
          text: Once Petru said a thing, he never went back on it. At last, both of the emperor's eyes laughed together.
        - id: ch01-b13
          speaker: emperor
          text: My dear Petru, I see this question has taken hold of your mind. So I will tell you the secret. My right eye laughs when I see my three sons, so strong and handsome. My left eye weeps because I fear that after my death you will not hold the empire together or defend it from its enemies. Bring me water from the spring of the Fairy of the Dawn so I may bathe my eyes in it. Then they will laugh forever, because I will know my sons are brave enough to overcome any foe.
        - id: ch01-b14
          speaker: narrator
          text: Petru picked up his hat and found his brothers. The three young men talked everything over as brothers should. In the end, Florea went to the stables. He chose the finest horse there, saddled it, and said farewell to the court.
        - id: ch01-b15
          speaker: florea
          text: I leave at once. If I haven't returned with the Fairy's water after a year, a month, a week, and a day, Costan, you must follow me.
        - id: ch01-b16
          speaker: narrator
          text: Florea vanished around a corner of the palace. For three days and nights, he never drew rein. His horse flew over mountains and valleys like a spirit until he reached the edge of the empire. A trench, deep beyond measure, encircled the whole land. Only one bridge crossed it.
        - id: ch01-b17
          speaker: narrator
          text: Florea made straight for the only bridge. There he drew rein and looked around one last time, taking leave of his homeland before he crossed beyond the emperor's rule. When he turned back toward the road, a dragon stood before him. And what a dragon it was. Three heads rose above three dreadful faces. Every mouth gaped wide, with one jaw reaching toward heaven and the other toward earth. The sight was enough for Florea. He did not draw his sword or wait for the monster to attack. He drove his spurs into the horse and fled at full speed, neither knowing nor caring where the road might carry him. Behind him, the dragon gave a great sigh. Then it vanished without leaving so much as a mark.
        - id: ch01-b18
          speaker: narrator
          text: One week passed, then two, and Florea did not return. After a month, Costan began visiting the stables and choosing a horse. The very moment the year, the month, the week, and the day had passed, he mounted and said goodbye to Petru.
        - id: ch01-b19
          speaker: costan
          text: If I fail too, then you must come after us.
        - id: ch01-b20
          speaker: narrator
          text: Costan followed Florea's road. The dragon on the bridge looked fiercer than before, and its three heads were more terrible. Costan wheeled away even faster than his brother had. Nothing more was heard of either of them, and Petru was left alone.
        - id: ch01-b21
          speaker: petru
          text: Father, I must go after my brothers.
        - id: ch01-b22
          speaker: emperor
          text: Then go, and may your luck be better than theirs.
        - id: ch01-b23
          speaker: narrator
          text: The emperor said farewell, and Petru rode straight to the border. A dragon waited on the bridge, but this one was worse than the others. It had seven heads.
        - id: ch01-b24
          speaker: narrator
          text: Petru stopped when he saw the creature. Then he found his voice.
        - id: ch01-b25
          speaker: petru
          text: Out of my way! Move aside, I tell you! This is your last warning. Get out of my way!
        - id: ch01-b26
          speaker: narrator
          text: Petru drew his sword and charged. At once the sky seemed to darken. Fire surrounded him on every side as all seven heads poured out flame. His horse neighed and reared, leaving Petru unable to use his waiting sword.
        - id: ch01-b27
          speaker: petru
          text: Easy! This will never do.
        - id: ch01-b28
          speaker: narrator
          text: He jumped down, holding the bridle firmly in his left hand and his sword in his right. It did no good. He could see nothing except fire and smoke.
        - id: ch01-b29
          speaker: petru
          text: There's no help for it. I must go home and find a better horse.
        - id: ch01-b30
          speaker: narrator
          text: Petru mounted again and rode back. At the palace gate, his old nurse Birscha was waiting eagerly.
        - id: ch01-b31
          speaker: birscha
          text: Ah, Petru, my son. I knew you would have to return. You went about this the wrong way.
        - id: ch01-b32
          speaker: petru
          text: Then how should I have done it?
          emotion: sad
        - id: ch01-b33
          speaker: birscha
          text: Listen, my boy. You will never reach the Fairy of the Dawn unless you ride the horse your father rode when he was young. Ask him where that horse can be found. Then mount it and be on your way.
        - id: ch01-b34
          speaker: narrator
          text: Petru thanked her from his heart and questioned the emperor at once.
        - id: ch01-b35
          speaker: emperor
          text: By the light of my eyes! Who told you about that horse? It must have been that old witch Birscha. Have you lost your senses? Fifty years have gone by since I was young. Who knows where my horse's bones are rotting, or whether even a scrap of his reins remains in the stall? I forgot him long ago.
          emotion: surprised
        - id: ch01-b36
          speaker: narrator
          text: Petru turned away angrily and went back to his nurse.
        - id: ch01-b37
          speaker: birscha
          text: Don't lose heart. If that is how matters stand, everything will go well. Bring me the scrap of those reins. I'll soon know what to do.
          emotion: calm
        - id: ch01-b38
          speaker: narrator
          text: The old storage place was crowded with saddles, bridles, and pieces of leather. Petru chose the oldest, blackest, most decayed reins and carried them to Birscha. She murmured over them, sprinkled them with incense, and handed them back.
        - id: ch01-b39
          speaker: birscha
          text: Take these reins and strike them hard against the pillars of the house.
        - id: ch01-b40
          speaker: narrator
          text: Petru obeyed. He swung the ruined old reins against the pillars with all his force. The instant they touched, something happened that made him stare. How it happened, no one can say. One moment there was nothing before him but the old house, and the next there stood a horse more beautiful than any in the world. It already wore a saddle made of gold and precious stones. Its bridle flashed so fiercely that anyone looking at it feared the light might steal his sight. The cracked black reins were gone. In their place waited a splendid horse, a splendid saddle, and a splendid bridle, all ready for the splendid young prince. Petru needed no further sign that this was the horse his father had ridden in his youth.
        - id: ch01-b41
          speaker: birscha
          text: Jump onto the brown horse's back.
        - id: ch01-b42
          speaker: narrator
          text: Birscha turned and went indoors. As soon as Petru sat in the saddle, his arm felt three times stronger, and even his heart grew braver.
        - id: ch01-b43
          speaker: brown_horse
          text: Sit firmly, my lord. We have a long road ahead and no time to waste.
        - id: ch01-b44
          speaker: narrator
          text: Then Petru learned what it meant to ride as no man and horse had ever ridden before.
    - id: ch02
      title: The Dragon and the Copper Wood
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: A dragon stood on the bridge, but it was not the one Petru had faced before. This monster had twelve heads. Each was uglier than the last, and each sent out more terrible flames. Yet this time the dragon had met its match. Petru showed no fear. He rolled up his sleeves to free his arms.
        - id: ch02-b02
          speaker: petru
          text: Get out of my way!
        - id: ch02-b03
          speaker: narrator
          text: The twelve heads answered with more fire and smoke. Petru wasted no more words. He drew his sword and prepared to rush onto the bridge.
        - id: ch02-b04
          speaker: brown_horse
          text: Wait, my lord, and be careful. Do exactly as I say. Drive your spurs into me all the way to the rowels. Draw your sword and be ready. We must leap over the bridge and the dragon together. When we are directly above him, cut off his largest head. Wipe your sword clean and return it to its sheath before my hooves touch the earth.
        - id: ch02-b05
          speaker: narrator
          text: Petru obeyed every word. He gripped the saddle, drove both spurs in to the rowels, and drew his sword as the brown horse sprang forward. Horse and rider rose over the bridge in one tremendous leap. Fire streamed from the twelve open mouths below them. When they passed directly above the dragon, Petru swung once and cut away the largest head. There was no time for a second blow. While they were still flying through the air, he wiped the dragon's blood from the blade and slid it cleanly back into its sheath. Only then did the brown horse's hooves strike earth beyond the trench. In that fashion, they passed the bridge and left the twelve-headed dragon behind.
        - id: ch02-b06
          speaker: petru
          text: But we still have farther to go.
        - id: ch02-b07
          speaker: narrator
          text: He took one last look at his native land.
        - id: ch02-b08
          speaker: brown_horse
          text: Yes, onward. But tell me, my lord, how fast shall we travel? Like the wind? Like thought? Like desire? Or like a curse?
        - id: ch02-b09
          speaker: narrator
          text: Petru looked up at the heavens and down at the earth. Before him spread a desert so dreadful that his hair stood on end.
        - id: ch02-b10
          speaker: petru
          text: We will change our speed as we go. Not fast enough to exhaust ourselves, and not slow enough to waste time.
        - id: ch02-b11
          speaker: narrator
          text: One day they rode like the wind, the next like thought, and on the third and fourth like desire and like a curse. At last they reached the far side of the desert.
        - id: ch02-b12
          speaker: petru
          text: Walk now. I want to look around and see what I have never seen before.
        - id: ch02-b13
          speaker: narrator
          text: Petru rubbed his eyes like someone waking from sleep. Before him stood a forest made entirely of copper. Its trees and leaves were copper, and so were its bushes and flowers. He stared like a man looking upon something he had never seen or even heard of. Then he rode into the wood.
        - id: ch02-b14
          speaker: narrator
          text: Along both sides of the road, rows of flowers praised Petru and begged him to pick them for a wreath.
        - id: ch02-b15
          speaker: flower_one
          text: Choose me! I am beautiful, and whoever picks me will be given strength.
        - id: ch02-b16
          speaker: flower_two
          text: No, take me. Wear me in your hat, and the loveliest woman in the world will love you.
        - id: ch02-b17
          speaker: narrator
          text: One flower after another called in a soft, sweet voice. Each seemed lovelier than the one before, and each promised Petru some wonder if he would only pick it. He listened. Just as he bent toward a flower, the horse sprang aside.
        - id: ch02-b18
          speaker: petru
          text: Why won't you stand still?
          emotion: angry
        - id: ch02-b19
          speaker: brown_horse
          text: Do not pick those flowers. They will bring you bad luck.
        - id: ch02-b20
          speaker: petru
          text: Why should they?
        - id: ch02-b21
          speaker: brown_horse
          text: They are cursed. Anyone who plucks them must fight the Welwa of this wood.
        - id: ch02-b22
          speaker: petru
          text: And what sort of goblin is this Welwa?
        - id: ch02-b23
          speaker: brown_horse
          text: Oh, let me be! Just listen. Look at the flowers all you please, but do not pick a single one.
        - id: ch02-b24
          speaker: narrator
          text: The horse walked slowly on. Petru had learned that its advice was worth following, so he struggled to tear his thoughts away from the flowers. He could not. When a man is fated for trouble, trouble will find him whatever he does. The flowers kept pleading, and Petru's resolve grew weaker and weaker.
        - id: ch02-b25
          speaker: petru
          text: What must come will come. At least I will see what this Welwa looks like and learn how to fight her. If she is meant to kill me, then so be it. If she is not, I will defeat her even if she is as strong as twelve hundred Welwas.
        - id: ch02-b26
          speaker: narrator
          text: Petru bent down again and gathered the flowers.
        - id: ch02-b27
          speaker: brown_horse
          text: You have done a very foolish thing. Nothing can change it now. Prepare yourself, because the Welwa is here.
          emotion: sad
        - id: ch02-b28
          speaker: narrator
          text: Petru had barely twisted the flowers into a wreath when a soft breeze rose from every side. It swelled into a storm. The darkness grew until it covered everything like a heavy cloak, and the ground rocked beneath them.
        - id: ch02-b29
          speaker: brown_horse
          text: Are you afraid?
        - id: ch02-b30
          speaker: narrator
          text: The horse shook its mane. Cold shivers ran down Petru's back.
        - id: ch02-b31
          speaker: petru
          text: Not yet. Whatever it is, what must come will come.
        - id: ch02-b32
          speaker: brown_horse
          text: Do not be afraid. I will help you. Take the bridle from my neck and try to catch the Welwa with it.
          emotion: calm
        - id: ch02-b33
          speaker: narrator
          text: The warning came too late for Petru to prepare. Before he could even unbuckle the bridle, the Welwa stood before him. She was so horrible that his eyes could hardly endure the sight. She was not exactly headless, yet what rose above her body could not quite be called a head. She did not fly through the air, but neither did she walk upon the ground. A horse's mane streamed from her. Deer's horns branched above a bear's face, and the eyes in that face were the eyes of a polecat. The rest of her body seemed to borrow a piece from one creature and another piece from the next. Nothing fitted, yet somehow everything belonged to the same dreadful being. That was the Welwa of the copper wood.
        - id: ch02-b34
          speaker: narrator
          text: Petru braced himself in the stirrups and struck with his sword, but his blade seemed to touch nothing. A day and a night passed without deciding the fight. At last the Welwa began to gasp for breath.
        - id: ch02-b35
          speaker: copper_welwa
          text: Let us stop for a little while and rest.
        - id: ch02-b36
          speaker: narrator
          text: Petru lowered his sword.
        - id: ch02-b37
          speaker: brown_horse
          text: Do not stop, not even for an instant!
        - id: ch02-b38
          speaker: narrator
          text: Petru gathered all his strength and struck harder. The Welwa neighed like a horse and howled like a wolf, then hurled herself at him again. They fought more fiercely for another day and night. Petru grew so tired that he could barely move his arm.
        - id: ch02-b39
          speaker: copper_welwa
          text: Let us rest now. I can see you are just as weary as I am.
        - id: ch02-b40
          speaker: brown_horse
          text: You must not stop for an instant.
        - id: ch02-b41
          speaker: narrator
          text: Petru fought on with the little strength he had left. The Welwa no longer threw herself at him. She struck cautiously, as though she too had lost her power. They were still fighting on the third day. As the morning sky turned red, Petru somehow managed to cast the bridle over her tired head.
        - id: ch02-b42
          speaker: narrator
          text: In that instant, the Welwa became a horse, the most beautiful horse in the world.
        - id: ch02-b43
          speaker: copper_welwa
          text: May your life be sweet. You have freed me from my enchantment.
        - id: ch02-b44
          speaker: narrator
          text: The freed horse rubbed its nose against the brown horse's nose. Then it told Petru how it had been bewitched for many years. Petru tied the new horse to his own and rode quickly onward until the copper wood lay behind them.
    - id: ch03
      title: The Silver and Golden Woods
      blocks:
        - id: ch03-b01
          speaker: petru
          text: Stand still again. Let me look around and see what I have never seen before.
        - id: ch03-b02
          speaker: narrator
          text: Ahead stretched an even more wonderful forest, filled with gleaming trees and shining flowers. This was the silver wood. As before, the flowers begged Petru to gather them.
        - id: ch03-b03
          speaker: copper_welwa
          text: Do not pick them. My brother here is seven times stronger than I was.
        - id: ch03-b04
          speaker: narrator
          text: Petru knew exactly what the warning meant. Still, it did no good. After a moment of hesitation, he gathered silver flowers and began making a wreath. The storm wind howled louder than it had before. The earth shook more violently, and the darkness became deeper. The Welwa of the silver wood rushed upon him with seven times the speed of the first.
        - id: ch03-b05
          speaker: narrator
          text: Petru and the silver Welwa fought for three days and three nights. At last he cast the bridle over the creature's head, and another splendid horse stood before him.
        - id: ch03-b06
          speaker: silver_welwa
          text: May your life be sweet. You have freed me from enchantment.
        - id: ch03-b07
          speaker: narrator
          text: Petru and the horses journeyed on. Soon they came to a golden wood, far lovelier than the other two. Once more his companions begged him to hurry through and leave the flowers untouched. Petru would not listen. Before he had finished weaving a golden crown, he felt some unseen terror rising toward him out of the earth. He drew his sword.
        - id: ch03-b08
          speaker: petru
          text: Either I will die, or this creature will wear my bridle!
        - id: ch03-b09
          speaker: narrator
          text: Petru had barely spoken when a thick fog closed around him. It pressed so tightly against horse and rider that he could not see his own hand before his face. Even the sound of his own voice seemed lost inside it. Still, he swung his sword toward every movement he sensed. For one whole day and one whole night, he fought that way without seeing his enemy even once. At last the darkness inside the fog began to pale. It thinned little by little through the second morning until, at dawn, it vanished altogether. The sun shone clear and bright above him. After so long without sight or sound, Petru felt as though he had just been born into the world. He searched the golden wood in every direction, but the Welwa was gone.
        - id: ch03-b10
          speaker: brown_horse
          text: Catch your breath while you can. The battle will begin again.
        - id: ch03-b11
          speaker: petru
          text: What was that thing?
        - id: ch03-b12
          speaker: brown_horse
          text: It was the Welwa, changed into fog. Listen. She is coming back!
        - id: ch03-b13
          speaker: narrator
          text: Petru had barely drawn one deep breath when he felt something approach from the side. It was like a river, yet no true river. It did not flow over the earth. It went wherever it wished and left no mark behind.
        - id: ch03-b14
          speaker: petru
          text: Woe is me!
          emotion: fearful
        - id: ch03-b15
          speaker: brown_horse
          text: Take care, and never stand still!
        - id: ch03-b16
          speaker: narrator
          text: The horse could say no more because the water was choking him. The battle began again. For a day and a night, Petru fought without knowing what he struck. At dawn on the second day, both his feet went lame.
        - id: ch03-b17
          speaker: petru
          text: Now I am finished.
          emotion: fearful
        - id: ch03-b18
          speaker: narrator
          text: In desperation, Petru struck faster and harder. Then the sun came out, and the water disappeared before he knew how or when.
        - id: ch03-b19
          speaker: brown_horse
          text: Breathe while you can. There is no time to lose. The Welwa will be back in a moment.
        - id: ch03-b20
          speaker: narrator
          text: Petru said nothing. He could not imagine how, exhausted as he was, he could keep fighting. Even so, he settled into the saddle, gripped his sword, and waited.
        - id: ch03-b21
          speaker: narrator
          text: Then something came toward him, though no one could properly say what it was. In a dream, perhaps, a man might see a creature that has what it lacks and lacks what it has. So it was with the Welwa. She flew with her feet and walked with her wings. Her head was in her back, her tail above her body, her eyes in her neck, and her neck in her forehead. No one could describe her further.
        - id: ch03-b22
          speaker: narrator
          text: For one moment, fear wrapped Petru like a heavy garment. The creature before him seemed to break every rule of the living world, and he could not tell where to aim. Then he shook himself, took heart, and attacked as fiercely as he had ever fought. The hours dragged on. As daylight faded, so did his strength. When darkness fell, his eyelids were so heavy that he could hardly keep them open, yet his sword still rose and fell. By midnight, he suddenly knew that he was no longer sitting on the brown horse. He stood on the earth, though he could not remember falling or dismounting. The fight continued through the blackest hours. When the first gray morning light appeared, his legs would no longer hold him. Petru sank to his knees and fought from there, refusing to release his sword.
        - id: ch03-b23
          speaker: brown_horse
          text: Make one more effort. The battle is nearly over.
        - id: ch03-b24
          speaker: narrator
          text: Petru wiped his brow with his gauntlet. With one desperate effort, he rose.
        - id: ch03-b25
          speaker: brown_horse
          text: Strike the Welwa across the mouth with the bridle!
        - id: ch03-b26
          speaker: narrator
          text: Petru obeyed. The Welwa neighed so loudly that he thought he would be deaf forever. Though she too was nearly spent, she flung herself at him. Petru was ready. As she rushed forward, he threw the bridle over her head. When day broke, three freed horses trotted beside him.
        - id: ch03-b27
          speaker: golden_welwa
          text: May your wife be the most beautiful of women. You have freed me from my enchantment.
        - id: ch03-b28
          speaker: narrator
          text: The four horses galloped away. By nightfall, they reached the edge of the golden wood. Petru thought about the three crowns he wore and what they had cost him.
        - id: ch03-b29
          speaker: petru
          text: What use are all these crowns? I will keep only the finest.
        - id: ch03-b30
          speaker: narrator
          text: He took off the copper crown and then the silver one, and threw them away.
        - id: ch03-b31
          speaker: brown_horse
          text: Stop! Do not leave them behind. We may need them later. Get down and pick them up.
        - id: ch03-b32
          speaker: narrator
          text: Petru dismounted, recovered both crowns, and rode onward with all four horses.
    - id: ch04
      title: Through Ice and Fire
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: One evening, as the sun sank and the midges began to bite, Petru saw a broad heath ahead. At that very moment, the brown horse stopped by itself.
        - id: ch04-b02
          speaker: petru
          text: What is wrong?
        - id: ch04-b03
          speaker: brown_horse
          text: I fear that something evil may happen to us.
        - id: ch04-b04
          speaker: petru
          text: Why should it?
        - id: ch04-b05
          speaker: brown_horse
          text: We are entering the kingdom of the goddess Mittwoch. The farther we go, the colder it will become. Great fires burn all along the road, and I fear you may stop to warm yourself.
        - id: ch04-b06
          speaker: petru
          text: Why shouldn't I warm myself?
        - id: ch04-b07
          speaker: brown_horse
          text: Because something terrible will happen if you do.
          emotion: sad
        - id: ch04-b08
          speaker: petru
          text: Then forward! If I must bear the cold, I will bear it.
        - id: ch04-b09
          speaker: narrator
          text: With every step into Mittwoch's kingdom, the air grew colder. Soon even the marrow in their bones seemed frozen. Petru was no coward. His battles had taught him to endure, and he faced the trial bravely.
        - id: ch04-b10
          speaker: narrator
          text: Great fires burned all along both sides of the road. Men stood close to the flames, smiling at Petru and speaking as pleasantly as old friends. Again and again they invited him to stop, stretch out his hands, and warm himself. The cold made every fire look more welcome than the last. Petru's breath froze almost as soon as it left his mouth, but he would not answer. He kept his face toward the road and told the brown horse to go faster. No one can say how long he fought that silent battle against the cold and the tempting flames. Everyone knows that Mittwoch's kingdom cannot be crossed in a day, and every mile carried Petru deeper into its ice.
        - id: ch04-b11
          speaker: narrator
          text: Petru pressed on while frozen rocks split around him. His teeth chattered, and even his eyelids froze. At last, they reached Mittwoch's dwelling. Petru jumped down, tossed the reins over the horse's neck, and entered the hut.
        - id: ch04-b12
          speaker: petru
          text: Good day, little mother.
        - id: ch04-b13
          speaker: mittwoch
          text: Very well, thank you, my frozen friend.
        - id: ch04-b14
          speaker: narrator
          text: Petru laughed and waited for her to continue. The goddess tapped him on the shoulder.
        - id: ch04-b15
          speaker: mittwoch
          text: You have carried yourself bravely, and now you shall have a reward. Look at this little box. It has waited here for ages for the man who could win his way through the Ice Kingdom. Take good care of it, because one day it may help you. Open it, and it will tell you anything you wish to know. It can even bring you news from your homeland.
        - id: ch04-b16
          speaker: narrator
          text: Mittwoch had opened an iron chest and taken out a small casket. Petru thanked her for the gift, mounted his horse, and rode away. Once he was some distance from the hut, he opened it.
        - id: ch04-b17
          speaker: casket_voice
          text: What do you command?
        - id: ch04-b18
          speaker: petru
          text: Tell me how my father is.
        - id: ch04-b19
          speaker: narrator
          text: Petru spoke a little nervously.
        - id: ch04-b20
          speaker: casket_voice
          text: He is sitting in council with his nobles.
        - id: ch04-b21
          speaker: petru
          text: Is he well?
        - id: ch04-b22
          speaker: casket_voice
          text: Not especially. He is furiously angry.
        - id: ch04-b23
          speaker: petru
          text: Who has angered him?
        - id: ch04-b24
          speaker: casket_voice
          text: Your brothers, Costan and Florea. They are trying to rule both him and his kingdom. The old emperor says they are not fit to do it.
        - id: ch04-b25
          speaker: petru
          text: Hurry, good horse! We have no time to lose.
        - id: ch04-b26
          speaker: narrator
          text: Petru closed the box and put it in his pocket. The company raced onward like ghosts, like whirlwinds, like vampires hunting at midnight. No man can say how long they traveled, for the road was very far. At last the brown horse called a halt.
        - id: ch04-b27
          speaker: brown_horse
          text: Stop. I have advice for you.
        - id: ch04-b28
          speaker: petru
          text: What is it?
        - id: ch04-b29
          speaker: brown_horse
          text: You know what it means to suffer cold. Now you must endure heat beyond anything you have imagined. Be as brave as you were before. Let no one tempt you to cool yourself, or evil will follow.
        - id: ch04-b30
          speaker: petru
          text: Forward. Don't trouble yourself. If I escaped without freezing, I certainly won't melt.
        - id: ch04-b31
          speaker: brown_horse
          text: You may. This heat can melt the marrow in your bones. Such heat exists only in the kingdom of the Goddess of Thunder.
        - id: ch04-b32
          speaker: narrator
          text: The brown horse had spoken truly. The heat was unlike anything Petru had known. It rose from the road and pressed down from the sky until there seemed to be no cooler place to breathe. Even the iron shoes beneath the horses began to soften and melt. Petru gave no sign that he noticed. Sweat streamed over his forehead and into his eyes, and each time he wiped it away with his gauntlet. His clothes clung to him, his throat burned, and the reins grew hot in his hands. Still, he kept to the road. He had survived the cold without touching a fire, and now he meant to survive the heat without turning toward water or shade.
        - id: ch04-b33
          speaker: narrator
          text: Less than a stone's throw from the road lay cool valleys filled with shade trees and bubbling streams. Looking at them made Petru's heart burn and his mouth go dry. Lovely maidens stood among the flowers and called so sweetly that he had to close his eyes against their spell.
        - id: ch04-b34
          speakers: [maiden_one, maiden_two, maiden_three]
          ensemble: chorus
          text: Come, brave hero. Come and rest. This heat will kill you.
        - id: ch04-b35
          speaker: narrator
          text: Petru shook his head. He could not answer because the heat had taken away his voice. He rode in that misery for a time no one could measure. Then the air began to cool, and he saw a small hut on a distant hill.
        - id: ch04-b36
          speaker: narrator
          text: It was the home of the Goddess of Thunder. When Petru stopped at her door, she came out to welcome him. She invited him inside and asked for the story of his journey. Petru told her everything that had happened and why he had come so far. Then he prepared to leave, for he could not waste time.
        - id: ch04-b37
          speaker: petru
          text: Who knows how far away the Fairy of the Dawn may still be?
        - id: ch04-b38
          speaker: thunder_goddess
          text: Stay only a moment and hear my advice. You are about to enter the kingdom of Venus. Give her a message from me. Tell her I hope she will not tempt you to delay. On your return, visit me again, and I will give you something that may help you.
        - id: ch04-b39
          speaker: narrator
          text: Petru mounted. After barely three steps, he found himself in another country. Here the air was neither hot nor cold. It was as soft and warm as spring, though the road crossed a heath of sand and thistles.
        - id: ch04-b40
          speaker: petru
          text: What can that be, so far away at the very end of the heath?
        - id: ch04-b41
          speaker: brown_horse
          text: That is Venus's house. If we ride hard, we may reach it before dark.
        - id: ch04-b42
          speaker: narrator
          text: The horse shot forward like an arrow. As twilight fell, the house drew near. Petru's heart leaped with relief. All across the heath, shadowy shapes had danced around him from side to side and front to back. Brave as he was, their presence sometimes made him shiver.
        - id: ch04-b43
          speaker: brown_horse
          text: They will not harm you. They are the daughters of the whirlwind, amusing themselves while they wait for the ogre of the moon.
        - id: ch04-b44
          speaker: narrator
          text: The horse stopped before the house, and Petru jumped down.
        - id: ch04-b45
          speaker: brown_horse
          text: Do not rush in. There are things you must know. You cannot enter Venus's house as you are. The whirlwind always watches and guards her.
        - id: ch04-b46
          speaker: petru
          text: Then what must I do?
        - id: ch04-b47
          speaker: brown_horse
          text: Take the copper wreath to that little hill. Once you are there, praise the maidens as lovely angels with fairy souls. Hold the wreath high and call out that you wish you knew whether someone would accept it from you. Then throw it away.
        - id: ch04-b48
          speaker: petru
          text: Why should I do that?
        - id: ch04-b49
          speaker: brown_horse
          text: Ask no questions. Go and do it.
        - id: ch04-b50
          speaker: narrator
          text: Petru obeyed. The moment he threw down the copper wreath, the whirlwind pounced on it and tore it to pieces. Petru returned to the horse.
        - id: ch04-b51
          speaker: brown_horse
          text: Wait. There is more. Take the silver wreath and knock on Venus's window. When she asks who is there, say you came on foot and lost your way on the heath. She will order you to turn back, but do not move. Tell her this instead. Say that since childhood you have heard of her beauty. Say you wore leather shoes with steel soles and traveled for nine years and nine months. Tell her you won the silver wreath in battle and hope she will accept it, and that you have done and suffered everything to reach her. Remember every part. Whatever follows will be your affair.
        - id: ch04-b52
          speaker: narrator
          text: Petru asked nothing more and approached the house. Night had fallen. Only a beam from the window showed his way. At his footsteps, two dogs began barking loudly.
        - id: ch04-b53
          speaker: venus
          text: Which dog is making that noise? Has it grown tired of living?
        - id: ch04-b54
          speaker: petru
          text: It is I, goddess. I lost my way on the heath, and I do not know where I can sleep tonight.
        - id: ch04-b55
          speaker: narrator
          text: Petru's voice was timid.
        - id: ch04-b56
          speaker: venus
          text: Where did you leave your horse?
        - id: ch04-b57
          speaker: narrator
          text: Petru did not answer. He could not decide whether to lie or tell the truth.
        - id: ch04-b58
          speaker: venus
          text: Go away, my son. There is no place for you here.
        - id: ch04-b59
          speaker: narrator
          text: Venus drew back from the window. Petru quickly repeated everything the horse had taught him about her beauty, his steel-soled shoes, the nine years and nine months, his battles, his suffering, and the silver wreath.
        - id: ch04-b60
          speaker: venus
          text: Let me see this wreath, my son.
        - id: ch04-b61
          speaker: narrator
          text: Petru held it up.
        - id: ch04-b62
          speaker: venus
          text: Come inside. Do not fear the dogs. They always know what I wish.
        - id: ch04-b63
          speaker: narrator
          text: The dogs wagged their tails as Petru passed.
        - id: ch04-b64
          speaker: petru
          text: Good evening.
        - id: ch04-b65
          speaker: narrator
          text: Petru sat comfortably by the fire and listened while Venus talked. Most of her words concerned the wickedness of men, with whom she was plainly furious. Petru agreed with everything because he had been taught that this was polite.
        - id: ch04-b66
          speaker: narrator
          text: As Venus talked, Petru studied her face. No one had ever seemed so old. Perhaps he stared because he was trying to count the wrinkles. If that was his purpose, one ordinary lifetime would never have been enough. He would have needed seven lives, with every one of those lives lasting seven times as long as a man's, before he could have counted them all. Petru said nothing about her age. He simply kept his eyes upon her while she spoke. Venus mistook his wonder for admiration, and the sight of the young prince gazing at her filled her heart with joy.
        - id: ch04-b67
          speaker: venus
          text: Nothing that exists now existed when I was born, and the world was not yet a world. By the time I grew up and the world came into being, everyone called me the most beautiful girl ever seen, though many hated me for it. Every hundred years brought another wrinkle to my face. Now I am old.
        - id: ch04-b68
          speaker: narrator
          text: Venus told Petru that she was an emperor's daughter. Her nearest neighbor was the Fairy of the Dawn, and the two had quarreled bitterly. Venus began loudly abusing the Fairy. Petru did not know what to do. Most of the time he listened in silence. Now and then, politeness made him answer.
        - id: ch04-b69
          speaker: petru
          text: Yes, yes. She must have treated you very badly.
        - id: ch04-b70
          speaker: venus
          text: You are brave, so I will give you a task I know you can finish. Near the Fairy's house stands a well. Anyone who drinks from it blossoms again like a rose. Bring me a flagon of that water, and I will prove how grateful I am. The journey is not easy. Her kingdom is guarded on every side by wild beasts and dreadful dragons. I will tell you more, and I have something for you.
        - id: ch04-b71
          speaker: narrator
          text: Venus rose, opened an iron-bound chest, and took out a tiny flute.
        - id: ch04-b72
          speaker: venus
          text: Look closely. An old man gave me this when I was young. Anyone who hears it falls asleep, and nothing can wake them. Take it. Play it for as long as you remain in the Fairy's kingdom, and you will be safe.
        - id: ch04-b73
          speaker: narrator
          text: Petru explained that he too had a task at the Fairy's well. Venus was even more pleased. Petru wished her good night, put the flute into its case, and lay down to sleep in the lowest chamber.
        - id: ch04-b74
          speaker: narrator
          text: He woke before dawn. First, he gave each horse all the corn it could eat. Then he led them to the well for water, dressed, and prepared to leave.
        - id: ch04-b75
          speaker: venus
          text: Stop! I still have advice for you. Leave one horse here and take only three. Ride slowly until you reach the Fairy's kingdom. Then dismount and continue on foot. On your return, you must walk again and keep all three horses on the road. Above everything else, never look the Fairy of the Dawn in the face. Her eyes will bewitch you, and her glance will steal your sense. She is hideous beyond imagining, with owl's eyes, a fox's face, and a cat's claws. Do you hear me? Never look at her.
        - id: ch04-b76
          speaker: narrator
          text: Petru thanked her and at last managed to leave.
    - id: ch05
      title: The Fairy of the Dawn
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Far away, where heaven touches earth and the stars kiss the flowers, a soft red glow shone in the distance. It was like the color of a spring sky, only lovelier and more wonderful. The light rose behind the palace of the Fairy of the Dawn.
        - id: ch05-b02
          speaker: narrator
          text: Petru traveled for two days and nights through meadows of flowers before he reached it. The country was neither hot nor cold, neither bright nor dark, yet somehow it was all of these together. Petru did not find the road one step too long.
        - id: ch05-b03
          speaker: narrator
          text: In time, he saw something white rising from the red horizon. As he came closer, he saw a castle so magnificent that its brightness dazzled his eyes. He had never known such a beautiful place existed. But he could not waste time. He shook himself awake, jumped from the saddle, and left his horse on the grass wet with dew. Then he began playing the flute and walked on.
        - id: ch05-b04
          speaker: narrator
          text: He had gone only a few steps when he stumbled over an enormous giant. The music had put one of the castle guards to sleep. The giant lay on his back and looked so immense that, hurried as he was, Petru stopped to measure him.
        - id: ch05-b05
          speaker: narrator
          text: The farther Petru went, the stranger and more terrible the sights became. Lions, tigers, and seven-headed dragons lay sleeping in the sun. There is no need to explain what the dragons looked like. Everyone knows about dragons, and no one should joke about them. Petru ran among the beasts like the wind. Whether haste or fear drove him, no one could say.
        - id: ch05-b06
          speaker: narrator
          text: At last, he reached a river unlike any other river in the world. Milk flowed in its channel instead of water. Beneath that pale current, precious stones and round pearls covered the bottom where common rivers hold sand and pebbles. It seemed to run quickly and slowly at the same time. The strange river curved all the way around the castle, shutting the palace inside its circle. Along the bank slept lions armed with iron teeth and iron claws. Beyond them spread gardens such as only the Fairy of the Dawn could possess. Their flowers covered the ground in color, and among those flowers a fairy lay asleep. From the opposite shore, Petru could see the river, the guards, the gardens, and the palace he still had to enter.
        - id: ch05-b07
          speaker: narrator
          text: How could he cross? There was a bridge, but even without its sleeping lions, it did not seem made for human feet. No one could tell what it was made of. It looked like small, soft, woolly clouds. Petru stood thinking. Somehow, he had to reach the other side.
        - id: ch05-b08
          speaker: narrator
          text: At last, he decided to risk a plan. He strode back to the sleeping giant and shook him.
        - id: ch05-b09
          speaker: petru
          text: Wake up, brave fellow!
        - id: ch05-b10
          speaker: narrator
          text: The giant woke and reached for Petru as easily as a man might catch a fly. Petru played the flute, and the giant dropped back into sleep. Petru tried this three times. Once he knew the flute truly held the giant in his power, he bound the giant's two little fingers together with a handkerchief. Then he drew his sword and woke him for the fourth time.
        - id: ch05-b11
          speaker: giant
          text: Do you call this a fair fight? If you are truly a hero, fight me by the rules!
          emotion: angry
        - id: ch05-b12
          speaker: petru
          text: I will fight you soon enough, but first answer me. Will you swear to carry me across the river if I meet you honorably in battle?
        - id: ch05-b13
          speaker: narrator
          text: The giant swore that he would.
        - id: ch05-b14
          speaker: narrator
          text: Once his hands were free, the giant threw himself upon Petru, hoping to crush him under his weight. But Petru was his match. He had fought many battles before this one, and he fought bravely now. The struggle lasted three days and three nights. First one gained the advantage, then the other. At last, both wrestled on the ground. Petru was on top, with his sword point at the giant's throat.
        - id: ch05-b15
          speaker: giant
          text: Let me go! Please let me go! I admit you have beaten me!
          emotion: fearful
        - id: ch05-b16
          speaker: petru
          text: Will you carry me across the river?
        - id: ch05-b17
          speaker: giant
          text: I will.
        - id: ch05-b18
          speaker: petru
          text: And what should I do if you break your promise?
        - id: ch05-b19
          speaker: giant
          text: Kill me in any way you choose. Only let me live now.
          emotion: fearful
        - id: ch05-b20
          speaker: petru
          text: Very well.
        - id: ch05-b21
          speaker: narrator
          text: Petru tied the giant's left hand to his right foot. He bound one cloth over the giant's mouth so he could not cry out and another over his eyes, then led him to the river. At the bank, the giant stretched one leg all the way to the other side. He lifted Petru in his palm and set him safely on the far shore.
        - id: ch05-b22
          speaker: petru
          text: That will do.
        - id: ch05-b23
          speaker: narrator
          text: Petru played a few notes, and the giant fell asleep again. Fairies bathing farther down the river heard the music too and slept among the flowers on the bank. As Petru passed, he wondered how the Fairy of the Dawn could be so ugly if these fairies were so beautiful. He did not dare linger.
        - id: ch05-b24
          speaker: narrator
          text: Now he stood inside the wondrous gardens. They looked even more marvelous nearby. As he hurried toward the castle, he saw no faded flower and no bird. Nothing blocked his way because everyone was asleep. Even the leaves had stopped moving.
        - id: ch05-b25
          speaker: narrator
          text: Petru crossed the silent courtyard and entered the castle itself. What he saw inside hardly needs telling, for all the world knows that the Fairy of the Dawn lives in no ordinary place. Yet even Petru, after copper, silver, and golden woods, had never seen splendor like this. Gold and precious stones were used as freely as ordinary people use wood. Every doorway and chamber seemed richer than an emperor's treasure room. The stables that housed the horses of the sun were grander than the palace of the mightiest ruler in the world. Petru could have stopped at every step to stare, but the water for his father lay somewhere above, and he forced himself onward.
        - id: ch05-b26
          speaker: narrator
          text: He climbed the stairs and hurried through forty-eight empty rooms draped in silk. In the forty-ninth room, he found the Fairy of the Dawn herself.
        - id: ch05-b27
          speaker: narrator
          text: The room was as large as a church. At its center stood the famous well Petru had traveled so far to find. It looked like any other well, and it seemed strange to see it inside the Fairy's own chamber. Still, anyone could tell that it had stood there for hundreds of years. Beside it, the Fairy of the Dawn slept upon silk cushions.
        - id: ch05-b28
          speaker: narrator
          text: Petru looked at her. The magic flute dropped to his side, and he held his breath. Near the well stood a table with bread made from the milk of does and a flagon of wine. This was the bread of strength and the wine of youth, and Petru longed to taste them. He looked at the bread, then the wine, and then at the sleeping Fairy.
        - id: ch05-b29
          speaker: narrator
          text: A mist passed over Petru's senses. The Fairy slowly opened her eyes and looked at him. At once, he lost still more control of himself. He barely remembered the flute in time. A few notes sent her back to sleep.
        - id: ch05-b30
          speaker: narrator
          text: With the Fairy asleep once more, Petru moved quickly. He bent down and kissed her three times. Then he took the golden wreath he had won at such cost and laid it across her forehead. He went to the table, broke off a piece of the bread made with does' milk, and ate it. He poured one cup of the wine of youth and drank. Then he returned to the Fairy and repeated everything. Three kisses, three pieces of the bread of strength, and three cups of the wine of youth marked his visit. Only after the third time did he turn to the reason for his journey. He lowered his flask into the ancient well, filled it with the water that could heal his father's eyes, secured it, and fled from the room as swiftly as he could.
        - id: ch05-b31
          speaker: narrator
          text: The garden seemed changed as he passed through it. The flowers were lovelier, the streams moved faster, the sunlight shone brighter, and the fairies looked happier. The three kisses Petru had given the Fairy of the Dawn had caused it all.
        - id: ch05-b32
          speaker: narrator
          text: Petru passed every danger safely and soon sat in his saddle again. He rode faster than wind, faster than thought, faster than longing, and faster than hatred.
    - id: ch06
      title: The Road Home
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: When Petru neared Venus's house, he dismounted. He left the horses beside the road and continued on foot, just as he had been told. Venus knew he was coming. She went out to meet him carrying white bread and red wine.
        - id: ch06-b02
          speaker: venus
          text: Welcome back, my prince.
        - id: ch06-b03
          speaker: petru
          text: Good day, and many thanks to you.
        - id: ch06-b04
          speaker: narrator
          text: Petru held out the flask of water from the Fairy's well. Venus took it joyfully. After a short rest, he continued on his way, for he still had no time to lose.
        - id: ch06-b05
          speaker: narrator
          text: As he had promised, Petru stopped for a few minutes with the Goddess of Thunder. He was already saying a hurried farewell when she called him back.
        - id: ch06-b06
          speaker: thunder_goddess
          text: Wait. I must warn you. Guard your life. Make friends with no man. Do not ride quickly, and never let the water leave your hand. Trust no one, and flee from flattering words. Go carefully. The road is long, the world is wicked, and you carry something precious.
        - id: ch06-b07
          speaker: thunder_goddess
          text: Take this cloth as well. It may look like little, but it is enchanted. Lightning will not strike the person who carries it. No lance or sword can pierce him, and arrows will glance from his body.
        - id: ch06-b08
          speaker: narrator
          text: Petru thanked the goddess and rode away. He took out the little casket and asked for news from home.
        - id: ch06-b09
          speaker: casket_voice
          text: Matters are going badly. Your father is now completely blind. Florea and Costan asked him to place the government in their hands. He refused. He said he would not give up the rule of the empire until he had washed his eyes with water from the Fairy of the Dawn.
        - id: ch06-b10
          speaker: casket_voice
          text: Your brothers then went to old Birscha for advice. She told them that you were already returning with the water. They have ridden out to meet you. They mean to take the water and claim the government of the empire as their reward.
        - id: ch06-b11
          speaker: petru
          text: You are lying!
          emotion: angry
        - id: ch06-b12
          speaker: narrator
          text: Petru hurled the casket to the ground. It broke into a thousand pieces. Soon afterward, he began to glimpse his native land. Near a bridge, he reined in so he could see it better. While he was still gazing, a distant voice seemed to call his name.
        - id: ch06-b13
          speaker: florea
          text: Petru! You there, Petru!
        - id: ch06-b14
          speaker: brown_horse
          text: Ride on! If you stop, evil will come to you.
        - id: ch06-b15
          speaker: petru
          text: No. Let us wait and see who is calling and what they want.
        - id: ch06-b16
          speaker: narrator
          text: Petru turned the horse and came face to face with his brothers. He had forgotten the Goddess of Thunder's warning. Florea and Costan approached with gentle, flattering words. Petru leaped from his horse and rushed to embrace them. He had a thousand questions to ask and a thousand things to tell. The brown horse stood nearby with its head hanging sadly.
    - id: ch07
      title: The Brothers by the Stream
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: At last, Florea spoke.
        - id: ch07-b02
          speaker: florea
          text: Dear Petru, wouldn't it be safer if we carried the water for you? Someone might try to steal it on the road, while no one would ever suspect us.
        - id: ch07-b03
          speaker: costan
          text: Yes, that makes sense. Florea is right.
        - id: ch07-b04
          speaker: narrator
          text: Petru shook his head. He told them what the Goddess of Thunder had warned him and showed them the enchanted cloth she had given him. Both brothers understood that only one kind of plan could kill him.
        - id: ch07-b05
          speaker: narrator
          text: A stone's throw away, a swift stream ran through deep, clear pools. Florea winked at Costan.
        - id: ch07-b06
          speaker: florea
          text: Aren't you thirsty, Costan?
        - id: ch07-b07
          speaker: costan
          text: I am. Come with us, Petru. We should drink while we have the chance, and then we can all go home. It is fortunate that you have us here to protect you.
        - id: ch07-b08
          speaker: narrator
          text: The brown horse neighed. Petru understood the warning and did not follow his brothers.
        - id: ch07-b09
          speaker: narrator
          text: Petru went home to his father and cured his blindness.
        - id: ch07-b10
          speaker: narrator
          text: As for his brothers, they never returned again.
