audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 编者
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清晰的成年男声
        pace: 从容舒展
        pitch: 中低音
    boy:
      display_name: 男孩
      tts:
        delivery: 聪明大胆，机敏中带着少年人的爽朗
        timbre: 清亮自然的少年男声
        pace: 适中稍快
        pitch: 中高音
    mogarzea:
      display_name: 莫加尔泽亚
      tts:
        delivery: 起初低沉忧郁，重获灵魂后豪爽热烈
        timbre: 浑厚有力的成年男声
        pace: 稍慢
        pitch: 低音
    elf_1:
      display_name: 第一个妖精
      tts:
        delivery: 美丽诱人，受骗后尖厉慌乱
        timbre: 明亮清脆的年轻女声
        pace: 适中
        pitch: 中高音
    elf_2:
      display_name: 第二个妖精
      tts:
        delivery: 甜美狡黠，受困后急切哀求
        timbre: 柔亮轻盈的年轻女声
        pace: 适中稍快
        pitch: 高音
    elf_3:
      display_name: 第三个妖精
      tts:
        delivery: 冷傲强硬，失算后惊惶不安
        timbre: 清冷利落的年轻女声
        pace: 适中
        pitch: 中音
    lake_fairy:
      display_name: 湖中仙女
      tts:
        delivery: 空灵优雅，恳求时真挚柔婉
        timbre: 柔美澄澈的年轻女声
        pace: 舒缓
        pitch: 中高音
  chapters:
    - id: ch01
      title: 篝火旁的父亲
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前有个小男孩。父母临终时，把他交给一位监护人照料。谁知那人心肠很坏，竟把家里的钱全花光了。男孩只好离开那里，打算凭自己闯出一条生路。他穿过树林和草地，一路走到天黑，累得再也走不动，却连个过夜的地方都找不到。男孩爬上一座小山，想看看远处有没有窗灯。四下本来一片漆黑，后来，他终于望见极远的地方闪着一点微光，便打起精神朝那里赶去。
        - id: ch01-b02
          speaker: narrator
          text: >-
            将近半夜，他才发现那点微光原来是一堆大火。火旁睡着一个高大得像巨人的男人。男孩迟疑了一会儿，还是悄悄走过去，挨着男人的腿躺下。清晨，男人醒来，见身边依偎着一个孩子，吃惊极了。
        - id: ch01-b03
          speaker: mogarzea
          text: 哎呀，你是从哪里来的？
          emotion: surprised
        - id: ch01-b04
          speaker: boy
          text: 我是您的儿子，昨夜才生下来的。
        - id: ch01-b05
          speaker: mogarzea
          text: >-
            这话如果是真的，你就替我放羊，我管你吃饭。可是记住，绝不能跨过我领地的边界，不然你准会后悔。
        - id: ch01-b06
          speaker: narrator
          text: >-
            男人还特意指给男孩看，那道不可越过的边界究竟在哪里，随后就叫他马上干活。小牧羊人把羊赶到最肥美的草地，守了整整一天。傍晚，他赶羊回家，又帮男人一只只挤了奶。忙完以后，两人才坐下一起吃晚饭。男孩边吃边问起大个子的姓名。
        - id: ch01-b07
          speaker: boy
          text: 父亲，您叫什么名字？
        - id: ch01-b08
          speaker: mogarzea
          text: 我叫莫加尔泽亚。
        - id: ch01-b09
          speaker: boy
          text: 您独自住在这么荒凉的地方，怎么会不厌倦呢？
        - id: ch01-b10
          speaker: mogarzea
          text: 这有什么奇怪的？你难道不知道，从来没有熊会心甘情愿地跳舞吗？
        - id: ch01-b11
          speaker: boy
          text: 说得也是。可是您为什么总这么伤心？父亲，把您的故事讲给我听吧。
        - id: ch01-b12
          speaker: mogarzea
          text: 那些事说出来，只会让你也跟着难过，又有什么用？
        - id: ch01-b13
          speaker: boy
          text: 我不怕难过，我就是想听。您是我的父亲，我是您的儿子，不是吗？
        - id: ch01-b14
          speaker: mogarzea
          text: >-
            好吧。我叫莫加尔泽亚，我的父亲是一位皇帝。我本来要去附近的甜奶湖，娶住在那里的三位仙女中的一位。半路上，三个恶毒的妖精袭击了我，抢走了我的灵魂。从那以后，我只能守着这群羊。我不想去别处，也感觉不到一点快乐，再没有笑过一次。那些妖精心肠很坏，谁只要踏上她们的土地，立刻就会受罚。所以我才警告你小心，免得也落到这个地步。
        - id: ch01-b15
          speaker: boy
          text: 我明白了，一定会万分小心。父亲，放心让我去吧。
        - id: ch01-b16
          speaker: narrator
          text: 两人伸直身子睡下了。太阳一升起，男孩就出去放羊。他一点也不想踏进妖精那片青翠的牧场，只让羊群在莫加尔泽亚的干地上寻找能吃的草。

    - id: ch02
      title: 妖精的樱桃树
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            第三天，男孩坐在树荫下吹笛子。他的笛声举世无双。一只羊从篱笆那边钻进妖精的花田，别的羊也一只接一只跟了过去。男孩听自己的笛声听得入迷，直到半群羊都越过边界，才猛然察觉。他边吹边追，正想把羊赶回来，三个美丽的少女突然挡在面前，随着曲子跳起舞来。男孩立刻明白该怎么办，便使出全副本领继续吹奏。三个少女也不停地舞着，一直跳到傍晚。
        - id: ch02-b02
          speaker: boy
          text: >-
            现在放我走吧。可怜的莫加尔泽亚还在等我，他一定快饿坏了。明天我再来给你们吹。
        - id: ch02-b03
          speakers: [elf_1, elf_2, elf_3]
          ensemble: chorus
          text: 好，你可以走。不过别忘了，就算你不守约，也别想逃出我们的手掌心。
        - id: ch02-b04
          speaker: narrator
          text: >-
            双方说定，第二天男孩要直接把羊赶来，一直吹到日落，这才各自回家。莫加尔泽亚发现羊群挤出的奶比平常多了许多，心里很是惊讶。可男孩坚称自己没有越界，大个子便不再费心追问，只管饱饱地吃了晚饭。
        - id: ch02-b05
          speaker: narrator
          text: >-
            第二天刚见晨光，男孩就赶着羊来到妖精的草地。他才吹出几个音符，少女们就现身跳舞，一直跳到天黑。这时，男孩装作失手，让笛子落到地上，又一脚踩断了它。他绞着双手，又哭又喊，说自己失去了唯一的伙伴。那动静听起来实在可怜，三个妖精全都软了心，忙着安慰他。
        - id: ch02-b06
          speaker: boy
          text: >-
            我再也找不到这样的笛子了！从没有哪支笛子的声音像它这么甜美。它是用七岁樱桃树最中心的木料做成的。
          emotion: sad
        - id: ch02-b07
          speakers: [elf_1, elf_2, elf_3]
          ensemble: chorus
          text: 我们园子里正好有一棵七岁的樱桃树。跟我们来，你再做一支就是了。
        - id: ch02-b08
          speaker: narrator
          text: >-
            她们把男孩带到树下。男孩说，用斧头砍树很可能劈坏树心，可笛子偏偏要用那部分木料。他打算只在树皮上劈一道小口，让她们把手指伸进去帮忙，这样就能撕开树干，不会伤到树心。三个妖精想也没想，照他说的把手指伸进裂缝。男孩立刻拔出卡在里面的斧头。树干一下合拢，把她们的手指夹得死死的。
        - id: ch02-b09
          speaker: narrator
          text: >-
            妖精们痛得尖叫，怎么挣扎也脱不了身。她们苦苦哀求，男孩却像大理石一样不为所动。他只提出一个要求，要她们交出莫加尔泽亚的灵魂。
        - id: ch02-b10
          speakers: [elf_1, elf_2, elf_3]
          ensemble: chorus
          text: 好吧，你非拿不可的话，它就在窗台上的瓶子里。
        - id: ch02-b11
          speaker: narrator
          text: 妖精们以为交出灵魂，马上就能获救。可是男孩并没放开她们。
        - id: ch02-b12
          speaker: boy
          text: >-
            你们让那么多人受过苦，现在自己也该尝尝苦头。明天我才会来放你们。
        - id: ch02-b13
          speaker: narrator
          text: 说完，男孩取走莫加尔泽亚的灵魂，赶着羊群回家了。

    - id: ch03
      title: 莫加尔泽亚重获灵魂
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            莫加尔泽亚一直等在门口。见男孩这么晚才回来，他开口便责骂起来。可男孩刚解释一句，他立刻欢喜得忘了自己，一跃蹦上半空。妖精塞进他身体的假灵魂顿时从嘴里飞了出去，那个一直严严实实封在水瓶里的真灵魂随即回到原来的位置。等激动稍稍平息，莫加尔泽亚大声问男孩。
        - id: ch03-b02
          speaker: mogarzea
          text: >-
            你到底是不是我的亲生儿子，已经一点也不重要了。你救了我，我该拿什么报答你？
          emotion: happy
        - id: ch03-b03
          speaker: boy
          text: >-
            告诉我甜奶湖在哪里，也告诉我怎样才能娶到湖边的三位仙女中的一位。还有，请让我永远做您的儿子。
        - id: ch03-b04
          speaker: narrator
          text: >-
            当晚，莫加尔泽亚和儿子又唱歌又欢宴，高兴得谁也睡不着。天亮以后，两人一同去给妖精们松绑。莫加尔泽亚到了树下，干脆把樱桃树连同三个妖精一并扛到背上，带回父亲的王国。人人都为他归来而欢呼，他自己却只指着救命恩人。那男孩正赶着羊群，跟在他的身后。
        - id: ch03-b05
          speaker: narrator
          text: >-
            男孩在宫里住了三天，满朝的人都来感谢他，称赞他。三天一过，他便向莫加尔泽亚告辞。
        - id: ch03-b06
          speaker: boy
          text: >-
            我该走了。请您告诉我，怎样才能找到甜奶湖。我会再回来，也会把我的妻子带回来。
        - id: ch03-b07
          speaker: narrator
          text: >-
            莫加尔泽亚想尽办法挽留，男孩还是坚持要走。他只好把自己所知道的一切全告诉儿子。至于那座湖，连他自己也从来没有见过。

    - id: ch04
      title: 甜奶湖边的仙女
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            男孩带着笛子，走了整整三个夏日。一天傍晚，他终于来到甜奶湖。这里属于一位法力强大的仙女所统治的王国。第二天清晨，天才刚亮，年轻人便走到岸边吹起笛子。头几个音符一响，一位美丽的仙女出现在眼前。她的头发和衣裙像黄金一样闪亮。年轻人惊奇地望着她，仙女忽然随着笛声起舞。她跳得太优美了，年轻人竟忘记继续吹笛。曲声一断，仙女马上消失不见。
        - id: ch04-b02
          speaker: narrator
          text: >-
            第二天，他又来到湖边，事情和前一天一模一样。笛声一停，仙女便再次消失。到了第三天，年轻人终于鼓足勇气。他一面不停吹奏，一面慢慢走近仙女，然后猛地扑上前，把她抱进怀里吻了一下，又从她的发间摘下一朵玫瑰。
        - id: ch04-b03
          speaker: narrator
          text: 仙女惊叫起来，求他归还玫瑰。可年轻人把花插在帽子上，无论她怎样哀求，就是不肯交还。
        - id: ch04-b04
          speaker: lake_fairy
          text: 求求你，把我的玫瑰还给我吧！
        - id: ch04-b05
          speaker: narrator
          text: >-
            最后，仙女明白再求下去也没有用，只得答应年轻人的愿望，嫁给他做妻子。两人一起回到宫殿，莫加尔泽亚还在那里等着他们。

    - id: ch05
      title: 皇帝主持的婚礼
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            皇帝亲自为年轻人和仙女举行了婚礼。从此以后，每到五月，夫妻二人都会带着孩子们回到甜奶湖，在那片神奇的湖水中沐浴。
        - id: ch05-b02
          speaker: narrator
          text: 这个故事，来自罗马尼亚民间。
