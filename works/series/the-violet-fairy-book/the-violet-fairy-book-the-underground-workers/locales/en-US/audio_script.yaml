audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, steady, and quietly mysterious
        timbre: clear and resonant
        pace: measured
        pitch: medium
    hans:
      display_name: Hans
      tts:
        delivery: plainspoken, earnest, and thoughtful
        timbre: sturdy and open
        pace: measured
        pitch: medium
    underworld_lord:
      display_name: Lord of the Underworld
      tts:
        delivery: assured, knowing, and lightly amused
        timbre: deep and ringing
        pace: deliberate
        pitch: low
  chapters:
    - id: ch01
      title: The Underground Workers
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: On a bitter night between Christmas and the New Year, a man set out on foot for a nearby village. It was only a few miles away. But the snow lay so deep that roads, walls, and hedges had all vanished beneath it. Before long, the man was completely lost. At last he found a thick juniper bush that sheltered him from the wind. He decided to stay there until sunrise, when he hoped he would see his path again.
        - id: ch01-b02
          speaker: narrator
          text: He drew his legs up like a hedgehog, wrapped his sheepskin around himself, and fell asleep. No one can say how long he slept. After a while, though, someone began to shake him gently, and a stranger whispered in his ear.
        - id: ch01-b03
          speaker: underworld_lord
          text: Wake up, my good man. If you stay here any longer, the snow will bury you. No one will ever know what happened to you.
        - id: ch01-b04
          speaker: narrator
          text: The sleeper slowly lifted his head from the fur and opened his heavy eyes. A tall, thin man stood beside him. In one hand he held a young fir tree that was taller than he was.
        - id: ch01-b05
          speaker: underworld_lord
          text: Come along with me. We have a great fire not far from here. You will rest much better beside it than you will out on this moor.
        - id: ch01-b06
          speaker: narrator
          text: The sleeper needed no second invitation. He got up at once and followed. Snow fell so thickly that he could not see three steps ahead. Then the stranger waved his fir-tree staff, and the drifts opened before them. Soon they reached a wood, where a welcoming fire glowed through the storm.
        - id: ch01-b07
          speaker: underworld_lord
          text: Tell me, what is your name?
        - id: ch01-b08
          speaker: hans
          text: My name is Hans. I am the son of Long Hans.
        - id: ch01-b09
          speaker: narrator
          text: Three men dressed all in white sat before the fire, as though it were summer. And for thirty feet around them, winter truly had disappeared. The moss was dry, the plants were green, and bees and cockchafers hummed through the grass. Beyond that warm circle, Hans could still hear the wind whistle and snow-laden branches crack.
        - id: ch01-b10
          speaker: underworld_lord
          text: Well, son of Long Hans, this is more comfortable than your juniper bush, isn't it?
        - id: ch01-b11
          speaker: narrator
          text: The stranger laughed, and Hans answered that he could never thank his new friend enough for bringing him there. He took off his sheepskin, rolled it into a pillow, and drank something hot that warmed them both. Then they lay down. The stranger spoke for a while to the three men in words Hans could not understand. Hans listened briefly and fell asleep again.
        - id: ch01-b12
          speaker: narrator
          text: When he woke, the wood and the fire were gone. Hans had no idea where he was. He rubbed his eyes and remembered the night before. It must have been a dream, he thought. Yet he still could not explain how he had come to this strange place.
        - id: ch01-b13
          speaker: narrator
          text: All at once, a tremendous noise rang out, and the ground shook under his feet. Hans listened, then walked toward the sound. Perhaps he would find another person there. In time, he came to the mouth of a rocky cave. Firelight shone from within.
        - id: ch01-b14
          speaker: narrator
          text: Hans stepped inside and found an enormous forge. A crowd of men worked before it, pumping bellows and swinging hammers. Seven men stood at every anvil, and no stranger band of smiths could have been found anywhere in the world. Their heads were larger than their little bodies, and their hammers were twice as large as they were. Even so, they swung those iron clubs as boldly as the strongest men on earth and struck blow after mighty blow.
        - id: ch01-b15
          speaker: narrator
          text: The little smiths wore leather aprons. These covered them from neck to foot in front but left their backs bare. Against the wall, high on a stool, sat the man with the fir-tree staff. He watched every movement the workers made. A large drinking can stood near him, and now and then one of the smiths came over for a drink. The master had put away his white clothes. Now he wore a black jerkin, fastened by a leather belt with enormous clasps.
        - id: ch01-b16
          speaker: narrator
          text: From time to time, the master signaled to his workers with the staff. There was no use trying to speak over such a din. If any of the smiths noticed Hans, they paid him no attention. They simply kept working. Hours passed before it was time to rest. Then every hammer thudded to the ground, and all the workers streamed out of the cave.
        - id: ch01-b17
          speaker: narrator
          text: The master climbed down from his stool and turned to Hans.
        - id: ch01-b18
          speaker: underworld_lord
          text: I saw you come in, but the work could not wait, so I had no time to speak. You will be my guest today, and I will show you how I live. Wait here while I change out of these dirty clothes.
        - id: ch01-b19
          speaker: narrator
          text: He unlocked a door inside the cave and told Hans to go through first. Hans stepped inside, and his eyes widened at the treasures before him. Bars of gold and silver covered the floor in shining heaps. They glittered so fiercely that he could hardly look at them. For amusement, Hans began to count. He had reached five hundred and seventy when his host returned, laughing.
        - id: ch01-b20
          speaker: underworld_lord
          text: You had better stop counting. You would be here far too long. Choose a few bars from the pile. I would like you to have them as a gift.
        - id: ch01-b21
          speaker: narrator
          text: Hans bent down at once and took hold of a gold bar. He pulled with all his strength, using both hands. The bar did not move at all. He could not even shift it, much less raise it from the floor.
        - id: ch01-b22
          speaker: underworld_lord
          text: Why, you have no more strength than a flea! I am afraid you will have to enjoy the sight of the treasure and leave it at that.
        - id: ch01-b23
          speaker: narrator
          text: His host laughed again and led him through room after room. At last they entered a chamber larger than a church, and it too was filled with gold and silver. Hans stared at the wealth. It seemed enough to buy every kingdom in the world. Yet here it all lay underground, doing no one any good, or so he thought.
        - id: ch01-b24
          speaker: hans
          text: Why do you collect all this treasure in a place where it cannot help anyone? If people had it, everyone could be rich. No one would have to work or go hungry.
        - id: ch01-b25
          speaker: underworld_lord
          text: That is the very reason I must keep it away from them. If people did not have to earn their daily bread, the whole world would become idle. Only work and care can make a person worth anything.
        - id: ch01-b26
          speaker: narrator
          text: Hans stared at him. After a while, he asked what good the gold and silver did by lying there and gathering mold. Why should its owner keep adding to a treasure that already overflowed every storeroom?
        - id: ch01-b27
          speaker: underworld_lord
          text: I may look like a man, but I am not truly one. I am one of the beings entrusted with the care of the world. My workers and I prepare gold and silver beneath the earth. A small amount reaches the world above each year, but only enough for people to carry on their business.
        - id: ch01-b28
          speaker: underworld_lord
          text: Wealth comes to no one without trouble. First we dig out the gold. Then we mix its grains with earth, clay, and sand. People must search long and hard before they find it. Some succeed through good luck, and others through great patience. But now, my friend, dinner is almost ready. Stay here and look at the gold as long as you like. I will call you when it is time to eat.
        - id: ch01-b29
          speaker: narrator
          text: While his host was gone, Hans wandered from one treasure chamber to the next. Sometimes he tried to break a small piece from a bar of gold, but he never managed it. After a while, his host returned so completely changed that Hans could hardly believe he was the same person.
        - id: ch01-b30
          speaker: narrator
          text: The man's silk clothes shone a brilliant flame color, with rich gold fringe and lace around them. A golden belt circled his waist, and a crown of gold rested on his head. Precious stones sparkled over him like stars on a winter night. Instead of the wooden staff, he now carried one made of finely worked gold.
        - id: ch01-b31
          speaker: narrator
          text: The lord of the treasure locked every door and slipped the keys into his pocket. Then he led Hans to another chamber, where their dinner waited. The table and chairs were silver, while every plate and serving dish was solid gold.
        - id: ch01-b32
          speaker: narrator
          text: As soon as the two men sat down, twelve little servants appeared. They waited on the table so swiftly and skillfully that Hans wondered whether they had wings. They were not tall enough to reach the tabletop, so they often had to jump and hop right onto it to get to the dishes. Everything Hans saw was new to him. He felt rather bewildered, but he enjoyed himself greatly, especially when the crowned lord began telling him things he had never heard before.
        - id: ch01-b33
          speaker: underworld_lord
          text: Between Christmas and the New Year, I often wander over the earth for amusement. I watch what people do and try to learn about them. But from all I have seen and heard, I cannot say much in their favor. Most people are forever quarreling and pointing out one another's faults. No one thinks about his own.
        - id: ch01-b34
          speaker: narrator
          text: Hans wanted to deny it, but he could not. He sat without a word and soon stopped paying much attention to his friend. Then he fell asleep in his chair and knew nothing more of what went on around him.
        - id: ch01-b35
          speaker: narrator
          text: Wonderful dreams filled his sleep. Bars of gold floated endlessly before his eyes. In the dream, Hans felt stronger than he had ever been while awake. He easily lifted two bars onto his back. Again and again he carried more, until all his strength seemed spent and he sank to the ground, gasping for breath.
        - id: ch01-b36
          speaker: narrator
          text: Then cheerful voices reached him. He heard the blacksmiths singing as they pumped their bellows, and sparks seemed to flash before his eyes. Hans stretched and slowly woke. He was sitting in the green forest. The fire of the underworld was gone, and sunlight streamed over him. He sat up, wondering why he felt so strange.
        - id: ch01-b37
          speaker: narrator
          text: Little by little, his memory returned. He recalled everything he had seen, but none of it seemed to fit with the ordinary world. Hans thought until he nearly drove himself mad. At last he tried to settle on a sensible explanation. On a night between Christmas and the New Year, he had met a stranger in the forest and slept beside a great fire. The next day, they had eaten dinner together and drunk far more than was wise. That was all. He had simply spent two days feasting with another man.
        - id: ch01-b38
          speaker: narrator
          text: Yet summer now surrounded him in full bloom, and even his sensible explanation was hard to believe. Perhaps some magician had used him for sport.
        - id: ch01-b39
          speaker: narrator
          text: Nearby, in the bright sunshine, Hans saw the remains of a dead fire. He went closer. What he had taken for ashes was fine silver dust, and the half-burned pieces of firewood were solid gold.
        - id: ch01-b40
          speaker: narrator
          text: Hans could hardly believe his good fortune. But how could he carry the treasure home before someone else found it? He had no sack. Necessity soon gave him an answer. Hans pulled off his fur coat and carefully swept every bit of silver dust into it. He laid the golden sticks on top, then bound the bundle with his belt so nothing could spill out.
        - id: ch01-b41
          speaker: narrator
          text: In truth, the bundle was not very heavy, though Hans imagined that it was. He walked slowly until he found a safe place to hide it.
        - id: ch01-b42
          speaker: narrator
          text: And so Hans became rich all at once, rich enough to buy land of his own. He was a cautious man, and he decided to leave his old neighborhood. He would make his home far away, where no one knew anything about him. It did not take long to find the place he wanted. Even after he paid for it, he had plenty of money left.
        - id: ch01-b43
          speaker: narrator
          text: Once Hans was settled, he married a pretty young woman who lived nearby, and they had children. As he lay dying, he told those children about the lord of the underworld and how that strange lord had made him rich.
