audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 编者
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清晰的成年男声
        pace: 从容舒展
        pitch: 中低音
    hans:
      display_name: 汉斯
      tts:
        delivery: 朴实坦率，惊奇中带着农人的实在
        timbre: 结实温厚的成年男声
        pace: 适中
        pitch: 中音
    underground_lord:
      display_name: 地下世界的主人
      tts:
        delivery: 神秘从容，带着温和的威严和淡淡幽默
        timbre: 清朗深沉的成年男声
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 雪夜里的陌生人
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            圣诞节刚过，新年还没到。就在这几天里，一个冷得刺骨的夜晚，有个男人出门去邻村。路本来不远，可大雪把道路、矮墙和树篱都盖住了，四下一点标记也看不见。他很快就迷失了方向，只好躲到一棵茂密的杜松树后面避风。他打算在那里过夜，等太阳出来以后再找路。
        - id: ch01-b02
          speaker: narrator
          text: >-
            他把腿紧紧缩在身下，像一只蜷起来的刺猬，又拿羊皮袄裹住全身，没多久就睡着了。他睡了多久，谁也说不准。后来，有个人轻轻摇他，他迷迷糊糊地听见一个陌生人在耳边低声说话。
        - id: ch01-b03
          speaker: underground_lord
          text: >-
            好心人，快醒醒吧！再躺下去，大雪就要把你埋住了。到那时候，谁也不会知道你去了哪里。
        - id: ch01-b04
          speaker: narrator
          text: >-
            睡着的人从皮毛里慢慢抬起头，费力睁开眼睛。身边站着一个又高又瘦的男人，手里握着一棵小冷杉，那棵树甚至比他本人还高。
        - id: ch01-b05
          speaker: underground_lord
          text: >-
            跟我来吧。离这儿不远，我们生了一大堆火。你到那里休息，总比睡在荒原上舒服。
        - id: ch01-b06
          speaker: narrator
          text: >-
            男人立刻爬起来，跟着陌生人走进风雪。雪下得又急又密，他连三步以外都看不清。可陌生人一挥手杖，挡路的雪堆便朝两旁分开了。两人很快走进一片树林，看见前方亮着温暖的火光。陌生人忽然回过头来。
        - id: ch01-b07
          speaker: underground_lord
          text: >-
            你叫什么名字？
        - id: ch01-b08
          speaker: hans
          text: >-
            我叫汉斯，是大汉斯的儿子。
        - id: ch01-b09
          speaker: narrator
          text: >-
            火堆前坐着三个男人。他们全穿着白衣，仿佛眼下正是夏天。火堆周围大约三十英尺以内，冬天真的消失了。苔藓干爽，草木青绿，蜜蜂和金龟子在草丛间嗡嗡飞舞。可越过这些声音，汉斯仍能听见远处的风在尖叫，也听见树枝被积雪压断时发出的噼啪声。
        - id: ch01-b10
          speaker: underground_lord
          text: >-
            怎么样，大汉斯的儿子？这里可比那棵杜松树后面舒服吧？
          emotion: happy
        - id: ch01-b11
          speaker: hans
          text: >-
            你把我带到这里，救了我一命。我真不知道该怎么谢你才好。
        - id: ch01-b12
          speaker: narrator
          text: >-
            汉斯脱下羊皮袄，卷成枕头。两人各喝了一杯热饮，身上暖了，心里也暖了，随后便躺到地上。陌生人用一种汉斯听不懂的语言，跟另外三人说了一会儿话。汉斯听着听着，又睡了过去。

    - id: ch02
      title: 岩洞里的铁匠
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            再次醒来时，树林和火堆都不见了。汉斯完全不知道自己在哪里。他揉着眼睛，想起昨夜发生的一切，觉得那多半是场梦。可要真是梦，自己怎么会来到这个陌生地方？他正怎么也想不通，耳边忽然传来一阵巨响，连脚下的大地都在颤动。
        - id: ch02-b02
          speaker: narrator
          text: >-
            汉斯听了一会儿，便朝声音传来的方向走去，希望能在那里找到人。最后，他来到一座岩洞前，里面透出火光。他走进洞去，只见眼前立着一座巨大的锻炉。一群人围在炉边，有的拉风箱，有的抡铁锤，每座铁砧旁都有七个人。这样的铁匠，恐怕找遍全世界也找不出第二群。他们的脑袋比小小的身体还大，锤子又比自己高出一倍。可就算世上最强壮的人，也不能把沉重的铁锤挥得比他们更稳，落得比他们更有力。
        - id: ch02-b03
          speaker: narrator
          text: >-
            小铁匠们都系着皮围裙，胸前从脖子一直遮到脚，后背却光着。昨夜那个拿冷杉木杖的男人正坐在墙边的高凳上，锐利的目光一直盯着他们干活。他身旁摆着一只大罐，工匠们隔一阵便过来喝上一口。他已经脱掉白衣，换上黑色紧身上衣，腰间的皮带扣大得惊人。洞里太吵，喊话也没人听得见，所以他只用手杖打手势，下达号令。
        - id: ch02-b04
          speaker: narrator
          text: >-
            小铁匠们就算看见了汉斯，也没有理会。他们不停手地干了几个钟头，直到休息时间来临，才把锤子纷纷扔在地上，一起走出岩洞。主人这才从高凳上下来，走到汉斯面前。
        - id: ch02-b05
          speaker: underground_lord
          text: >-
            你进来时，我就看见了。可刚才活儿太紧，我没法停下来招呼你。今天你要做我的客人，我也带你看看我平常怎样生活。请在这里等一等，让我先换掉这身脏衣服。
        - id: ch02-b06
          speaker: narrator
          text: >-
            他说着打开岩洞里的一扇门，请汉斯先进去。汉斯一跨过门槛，便惊得睁大了眼睛。金条银锭在地面上堆成一片，闪得人几乎睁不开眼。他一时兴起，开始数这些金银，刚数到第五百七十块，主人就回来了。
        - id: ch02-b07
          speaker: underground_lord
          text: >-
            别再数了，那得数到什么时候？你从这堆里挑几块吧，我想送你一份礼物。
          emotion: happy
        - id: ch02-b08
          speaker: narrator
          text: >-
            汉斯立刻弯下腰，伸手去拿一根金条。他使出全身力气，又把两只手都用上，那根金条却连动也没动一下，更别说让它离开地面了。主人见了，笑出声来。
        - id: ch02-b09
          speaker: underground_lord
          text: >-
            哎呀，你的力气连跳蚤都不如。看来这些金子，你只能看看了！
          emotion: happy

    - id: ch03
      title: 地下世界的秘密
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            主人领着汉斯穿过一间又一间屋子，最后进了一座比教堂还大的厅堂。这里同样装满金银。眼前的财富足以买下世上所有王国，却全埋在地下。汉斯怎么想也不明白，这些宝物放在这里，对谁能有用。
        - id: ch03-b02
          speaker: hans
          text: >-
            你为什么把这些财宝全聚在这里，不让它们帮到任何人？要是把金银交给地面上的人，大家都会富起来。到那时，谁也不必工作，更不会挨饿了。
        - id: ch03-b03
          speaker: underground_lord
          text: >-
            正因为这样，我才不能让人们得到这些财富。要是谁都不用辛苦挣取每天的食物，整个世界就会陷进懒惰里。人只有经历劳作和忧患，才能让自己成为有用的人。
        - id: ch03-b04
          speaker: narrator
          text: >-
            汉斯瞪着眼睛，半天说不出话。可他还是不明白。金银放在地底蒙尘，明明对谁都没好处，库房也早就装不下了，主人为什么还要不停地增加财宝？他把这些疑问全问了出来。
        - id: ch03-b05
          speaker: underground_lord
          text: >-
            我其实不是人，只是有一副人的模样。我属于那些受命照管世界的精灵。我和手下的工匠要在地下炼制金银。每年会有很少一部分去到地面，那点数量刚好够人们做生意、过日子。没有谁能轻轻松松得到财富。我们先挖出金子，再把细小的金粒混进泥土、黏土和沙子里。此后，只有运气好的人，或者肯长久耐心寻找的人，才会发现它们。好了，我的朋友，晚餐时间快到了。你要是还想留在这里看金子，就等我来叫你吧。

    - id: ch04
      title: 金冠主人的宴席
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            主人走后，汉斯独自在一间间宝库里闲逛。他有时想从金块上掰下一小块，却怎么也掰不动。过了一阵，主人回来了，可他的模样已经完全变了，汉斯几乎不敢认他。主人穿着最鲜亮的火焰色丝衣，衣上缀满华美的金流苏和金蕾丝。腰间是一条金腰带，头上是一顶金王冠，周身的宝石像冬夜群星一样闪烁。他手中原来的木杖，也换成了一根精雕细刻的金杖。
        - id: ch04-b02
          speaker: narrator
          text: >-
            这位财宝之主锁好一扇扇门，把钥匙放进口袋，又带汉斯来到摆好晚餐的房间。桌椅全用银子制成，餐盘和碗碟却都是纯金的。两人刚刚坐下，十二个小仆人便赶来服侍。他们动作又快又灵巧，汉斯简直怀疑他们背上长着翅膀。可小仆人还没有桌子高，每次要够盘碟，都得蹦蹦跳跳地跃上桌面。
        - id: ch04-b03
          speaker: narrator
          text: >-
            这里的一切，汉斯都从没见过。虽然看得眼花缭乱，他却快活极了。头戴金冠的主人又跟他讲起许多从未听闻的事情，汉斯更是听得入迷。
        - id: ch04-b04
          speaker: underground_lord
          text: >-
            每逢圣诞节到新年之间的日子，我常去地面四处走走，看看人类怎样行事，也多了解他们一些。可是照我的所见所闻，我实在说不出人类有多少好话。大多数人总在互相争吵，只顾抱怨别人有什么错，却没有谁肯看看自己的毛病。
        - id: ch04-b05
          speaker: narrator
          text: >-
            汉斯很想说主人讲得不对，可他找不到一句话来反驳。于是，他默默坐在那里，后来连朋友说些什么也听不进去了。没过多久，他坐在椅子上睡着了，身边再发生什么，他一概不知。

    - id: ch05
      title: 盛夏里的黄金
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            汉斯做起了奇妙的梦。一根根金条不停地在眼前飘荡，梦里的他比清醒时强壮得多，轻轻松松便能把两根金条扛上背。他扛了一次又一次，直到力气终于耗尽，几乎喘不过气来，一下倒在地上。
        - id: ch05-b02
          speaker: narrator
          text: >-
            就在这时，他听见欢快的说话声，还听见小铁匠们一边拉风箱，一边唱歌。火星仿佛也在眼前不停飞闪。汉斯伸了伸四肢，慢慢醒来。他发现自己正躺在一片碧绿的树林里。照在身上的不是地下世界的炉火，而是明亮的太阳。他坐起身，怎么也不明白，自己为什么会有这样奇怪的感觉。
        - id: ch05-b03
          speaker: narrator
          text: >-
            记忆终于一点点回来了。汉斯想起那些奇妙的事，可无论怎样努力，也不能把它们同每天都会发生的寻常事拼到一起。他越想越糊涂，几乎要发疯。最后，他勉强给自己找出一种解释。也许在圣诞节和新年之间的那个夜晚，他只是在森林里碰见一个陌生人，同对方守着大火睡了一夜。第二天，两人又一起吃饭，喝的酒远远超过了分量。说到底，他不过是跟另一个男人纵情作乐，一连过了两天。
        - id: ch05-b04
          speaker: narrator
          text: >-
            可汉斯一抬头，四周分明已是最茂盛的夏天。连他自己也没法相信刚才那套说法。他只觉得，自己准是落进某个魔法师手里，被当作玩物好好捉弄了一场。
        - id: ch05-b05
          speaker: narrator
          text: >-
            身边的阳光下，还留着一堆熄灭的火。汉斯走近一看，原先以为是灰烬的东西，竟是细细的银粉。那些烧了半截的木柴，竟然全是金子。
        - id: ch05-b06
          speaker: narrator
          text: >-
            汉斯觉得自己交了天大的好运，可趁别人还没发现，他去哪里找一只口袋，把财宝运回家呢？人到了急处，自然会想出办法。他脱下皮袄，把银灰小心拢进去，连一点也没有留下，又将金木柴放在上面，用腰带把皮袄扎紧，免得财宝掉出来。这担子其实不算太重，不过汉斯心里认定它装满珍宝，走起来便觉得沉甸甸的。他一路慢慢挪动，直到找到一个安全地方，把包裹藏好。
        - id: ch05-b07
          speaker: narrator
          text: >-
            就这样，汉斯忽然成了富人。他的钱已经足够买下一份自己的产业。可他为人谨慎，最后决定离开旧日住处，到遥远的地方另找一个家，在那里，没人知道他的来历。汉斯很快便找到了合意的产业。付过钱以后，他手里还剩下不少财富。
        - id: ch05-b08
          speaker: narrator
          text: >-
            安顿下来以后，汉斯娶了附近一位美丽的姑娘，后来又有了几个孩子。直到临终那天，他才把这个故事讲给孩子们听。他告诉他们，自己曾见过地下世界的主人，也告诉他们，那位神秘的主人怎样使汉斯成了富人。
