audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, steady, and quietly mysterious
        timbre: clear and resonant
        pace: measured
        pitch: medium
    osaka_frog:
      display_name: Osaka Frog
      tts:
        delivery: friendly, curious, and quick to decide
        timbre: bright and rounded
        pace: moderate
        pitch: medium
    kioto_frog:
      display_name: Kioto Frog
      tts:
        delivery: thoughtful, eager, and cheerfully practical
        timbre: light and clear
        pace: moderate
        pitch: medium-high
  chapters:
    - id: ch01
      title: Two Frogs Set Out
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time in Japan, there lived two frogs. One made his home in a ditch near Osaka, a town on the seacoast. The other lived in a clear little stream that ran through the city of Kioto. They were so far apart that neither had ever heard of the other.
        - id: ch01-b02
          speaker: narrator
          text: Yet, strangely enough, both frogs had the same idea at the very same time. Each wanted to see a little more of the world. The Kioto frog longed to visit Osaka, while the Osaka frog wished to see Kioto, where the great Mikado had his palace.
        - id: ch01-b03
          speaker: narrator
          text: So, on a fine spring morning, they both started down the road between the two cities. One came from Kioto, and the other came from Osaka.
    - id: ch02
      title: A Meeting on the Mountain
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The journey tired them far more than they had expected. Neither frog knew much about traveling, and halfway between the cities stood a mountain they had to climb. It took a long time and a great many hops, but at last they reached the top.
        - id: ch02-b02
          speaker: narrator
          text: Each frog was amazed to find another frog standing there at the top. For a moment, they only stared at each other without a word. Then they began to talk and explained why they had come so far from home.
        - id: ch02-b03
          speaker: narrator
          text: What a pleasure it was to learn that they shared the same wish. Both wanted to know more of their own native country. Since neither was in a hurry, they stretched out in a cool, damp spot. They agreed to rest well before going their separate ways.
    - id: ch03
      title: A View from the Top
      blocks:
        - id: ch03-b01
          speaker: osaka_frog
          text: If only we were bigger! Then we could see both cities from up here and decide whether going on is worth the trouble.
        - id: ch03-b02
          speaker: kioto_frog
          text: Oh, we can manage that easily. We just need to stand on our hind legs and hold on to each other. Then each of us can look toward the city he wants to visit.
        - id: ch03-b03
          speaker: narrator
          text: The Osaka frog liked this plan very much. He jumped up at once and rested his front paws on his new friend's shoulders. The Kioto frog stood up too. They stretched as high as they could and held each other tightly so they would not fall.
        - id: ch03-b04
          speaker: narrator
          text: The Kioto frog pointed his nose toward Osaka, and the Osaka frog pointed his nose toward Kioto. But the foolish creatures forgot something. When frogs stand upright, their great eyes face backward. Their noses pointed toward the cities they meant to visit, but their eyes saw the homes they had just left.
    - id: ch04
      title: Home Again
      blocks:
        - id: ch04-b01
          speaker: osaka_frog
          text: Well, look at that! Kioto is exactly like Osaka. It certainly isn't worth such a long trip. I'm going home!
          emotion: surprised
        - id: ch04-b02
          speaker: kioto_frog
          text: If I'd known Osaka was only a copy of Kioto, I never would have come all this way.
        - id: ch04-b03
          speaker: narrator
          text: As the Kioto frog spoke, he took his paws from his friend's shoulders. Both frogs tumbled down onto the grass. Then they politely said goodbye to each other and started back toward their own homes.
        - id: ch04-b04
          speaker: narrator
          text: For the rest of their lives, they believed Osaka and Kioto were as alike as two peas. In truth, the two cities looked as different as any two cities could be.
