audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 编者
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清晰的成年男声
        pace: 从容舒展
        pitch: 中低音
    osaka_frog:
      display_name: 大阪青蛙
      tts:
        delivery: 爽直好奇，想到什么便说什么
        timbre: 明亮浑厚的成年男声
        pace: 适中
        pitch: 中音
    kyoto_frog:
      display_name: 京都青蛙
      tts:
        delivery: 热心自信，语气轻快利落
        timbre: 清朗柔和的成年男声
        pace: 适中
        pitch: 中高音
  chapters:
    - id: ch01
      title: 两端的旅行者
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，日本住着两只青蛙。一只住在海滨城市大阪附近的水沟里，另一只住在流经京都城的清澈小溪中。两地离得很远，它们从没听说过对方。
        - id: ch01-b02
          speaker: narrator
          text: >-
            可巧的是，两只青蛙同时想出去见见世面。京都青蛙想游览大阪，大阪青蛙则想去京都看看天皇的宫殿。
        - id: ch01-b03
          speaker: narrator
          text: >-
            一个晴朗的春日清晨，它们一同上路了。一只从京都出发，一只从大阪出发，沿着同一条路迎面走来。它们不懂旅行，走了一阵才发现，这趟路比想象中累得多。
        - id: ch01-b04
          speaker: narrator
          text: >-
            两城中间还横着一座山，非翻过去不可。两只青蛙跳了一下又一下，费了好长时间，终于登上山顶。

    - id: ch02
      title: 山顶相逢
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            一到山顶，它们都愣住了。眼前竟然站着另一只青蛙！它们默默对望片刻，这才聊起来，各自说出自己为什么离家，又为什么来到这里。
        - id: ch02-b02
          speaker: narrator
          text: >-
            原来，它们都想多看看自己的国家。两只青蛙别提多高兴了。反正不用赶路，它们便找了一处阴凉潮湿的地方，舒展开身子躺下，约好歇够了再分头走。
        - id: ch02-b03
          speaker: osaka_frog
          text: >-
            唉，咱们要是再高一些就好了。站在这里就能望见两座城，也能先瞧瞧，前面的路到底值不值得走。
        - id: ch02-b04
          speaker: kyoto_frog
          text: >-
            这好办呀！咱们用后腿站起来，再互相扶稳，不就都能看见自己要去的那座城了吗？
        - id: ch02-b05
          speaker: narrator
          text: >-
            大阪青蛙一听，马上跳了起来，把前爪搭在朋友肩上。京都青蛙也站直了。它们紧紧扶着对方，身子使劲往高处伸，免得摔下去。

    - id: ch03
      title: 看反了的城市
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            京都青蛙把鼻尖对着大阪，大阪青蛙也把鼻尖对着京都。可这两个傻家伙忘了，青蛙一站起来，大眼睛就落在脑袋后面。它们的鼻尖朝着前方，眼睛瞧见的却是各自来时的城市。
        - id: ch03-b02
          speaker: osaka_frog
          text: >-
            哎呀，京都怎么和大阪一模一样？为了看这样的地方走那么远，太不值了。我还是回家吧！
          emotion: surprised
        - id: ch03-b03
          speaker: kyoto_frog
          text: >-
            原来大阪只是京都的翻版！我要是早知道，根本不会大老远跑到这儿来。
          emotion: surprised
        - id: ch03-b04
          speaker: narrator
          text: >-
            京都青蛙说着，松开了搭在朋友肩上的前爪。两只青蛙一起跌到草地上。它们爬起来，客客气气地道了别，随后各走各的路，回家去了。
        - id: ch03-b05
          speaker: narrator
          text: >-
            它们就这样过完了一生，始终认定大阪和京都像两颗豌豆一样相像。其实呀，世上很难找到两座模样如此不同的城市。
