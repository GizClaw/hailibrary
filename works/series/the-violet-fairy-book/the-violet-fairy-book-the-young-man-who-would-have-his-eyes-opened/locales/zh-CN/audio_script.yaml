audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 编者
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清晰的成年男声
        pace: 从容舒展
        pitch: 中低音
    mana:
      display_name: 玛纳
      tts:
        delivery: 睿智郑重，告诫中带着关切
        timbre: 沉稳苍老的男声
        pace: 徐缓
        pitch: 低音
  chapters:
    - id: ch01
      title: 玛纳的告诫
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前有个年轻人，最爱打听别人不知道的事。凡是有什么秘密没弄明白，他就怎么也快活不起来。他后来学会了鸟兽的语言，无意中又发现，夜色掩盖着许多凡人从来没见过的事。从那以后，他一心要把这些秘密全看清楚，再也静不下来了。
        - id: ch01-b02
          speaker: narrator
          text: >-
            他整日四处奔走，从一个巫师找到另一个巫师，请他们替自己打开双眼。可是谁也不肯帮他。最后，他找到了老术士玛纳。玛纳比其他术士更有学问，年轻人想知道的事，他全都知道。老人仔细听完了来意，郑重地劝他。
        - id: ch01-b03
          speaker: mana
          text: >-
            孩子，别再追求这些空洞的知识了。它们不会给你幸福，只会给你带来灾祸。有许多事不让人看见，正是为了叫人的心能安宁。要是什么都知道了，欢乐也就没有了。你好好想一想，免得日后后悔。你若还是不肯听，我确实可以让你看见黑夜的秘密。不过，那些景象不是普通人的胆量承受得住的。
        - id: ch01-b04
          speaker: narrator
          text: >-
            玛纳停下来，看着年轻人。年轻人点了点头，老人只得继续说下去。
        - id: ch01-b05
          speaker: mana
          text: >-
            明天夜里，你去找蛇王举行宴会的地方。那场宴会每七年才有一次，蛇王会把群臣全都召来。他面前放着一只金碗，里面装满山羊奶。你拿一片面包蘸了奶，赶在逃命以前吃下去，就能明白别人不知道的暗夜秘密。你很走运，宴会恰好就在今年。动作一定要快，胆子也要大，不然你会吃大亏。

    - id: ch02
      title: 蛇王的宴会
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            年轻人谢过玛纳，便动身了。哪怕赔上性命，他也非达到目的不可。入夜以后，他来到一片辽阔荒凉的旷野。月光下面只有无数小丘，一动不动地伏在那里。他藏在灌木后面，等了很久，估摸着午夜快到了。
        - id: ch02-b02
          speaker: narrator
          text: >-
            忽然，旷野中央亮起灿烂的光，像一颗星悬在一座小丘上空。就在这时，所有小丘都扭动着爬了起来。原来每座丘里都藏着成百上千条蛇。它们径直游向亮光，因为蛇王就住在那里。
        - id: ch02-b03
          speaker: narrator
          text: >-
            蛇王的小丘比别处更高更宽，丘顶还悬着一团明亮的光。群蛇来到那里，一条条盘起身体，等候开宴。四周的蛇穴里响起一片窸窸窣窣的声音，乱成一团。年轻人吓得不敢再走，只能留在原地仔细窥看。过了好一阵，他才鼓起一点勇气，悄悄向前挪去。
        - id: ch02-b04
          speaker: narrator
          text: >-
            眼前的景象比他最可怕的梦还要阴森。大蛇、小蛇，各种颜色的蛇，足足有几千条，全挤在一条巨蛇周围。那条巨蛇身粗如梁，头上戴着金冠，耀眼的光正从冠上射出来。群蛇一边嘶叫，一边吐着信子。年轻人的心直往下沉，他觉得再向前就是送死。
        - id: ch02-b05
          speaker: narrator
          text: >-
            可他忽然看见蛇王面前的金碗，又想到错过这一次，机会便永远不会回来。他吓得头发直竖，血都像冻住了，还是伏下身，一点点爬过去。蛇群顿时骚动起来。几千只蛇头高高昂起，一条条信子伸向闯入者，要把他活活蜇死。幸好它们彼此缠得太紧，没法立刻解开。
        - id: ch02-b06
          speaker: narrator
          text: >-
            年轻人一把抓起面包，在金碗里蘸了奶，塞进嘴中，转身就跑。他快得像背后有火在烧，又像有一支大军追在脚后。那片逼近的声响越来越近，他只顾拼命飞奔。最后实在喘不过气，才一头栽倒在草地上，几乎失去了知觉。

    - id: ch03
      title: 凡人未见的舞蹈
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            可怕的梦立刻缠住了他。他梦见蛇王戴着火焰般的金冠，用身躯紧紧盘住自己，正一点点挤出他的性命。年轻人尖叫着跳起来，要跟仇敌拼命。可唤醒他的不是蛇王，而是清晨的阳光。
        - id: ch03-b02
          speaker: narrator
          text: >-
            他揉揉眼睛，环顾四周。昨夜的敌人一个也不见了，那片险些要了他性命的旷野，至少还在一英里以外。不过，自己确实跑了很远，也确实尝到了有魔力的山羊奶。他摸了摸四肢，发现全都完好无损，心里别提多高兴。经历了那么多危险，他竟然连皮也没擦破。
        - id: ch03-b03
          speaker: narrator
          text: >-
            这一夜实在太累，也太吓人了。年轻人一直躺到正午。他决定傍晚就去森林，试试山羊奶到底有什么魔力，看看自己能不能弄懂从前的那些秘密。
        - id: ch03-b04
          speaker: narrator
          text: >-
            一走进森林，他就不再怀疑了。树下立着一座座金色帐篷，银旗在灯火中闪闪发亮。这是凡人的眼睛从来没见过的景象。他还在纳闷帐篷为什么会在这里，树林里忽然响起一阵声息，像是风一下子刮了起来。
        - id: ch03-b05
          speaker: narrator
          text: >-
            美丽的少女们从四面的树中走出，踏进明亮的月光。她们是大地母亲的女儿，是林中的仙女，每天夜里都到这里跳舞。年轻人躲着看得入了迷，只恨自己没有一百只眼睛。眼前的奇景，哪里是两只眼睛看得尽的呢？
        - id: ch03-b06
          speaker: narrator
          text: >-
            仙女一直舞到天边露出第一缕晨光。接着，一层银色轻纱仿佛罩住了她们，她们就从年轻人眼前消失了。他仍舍不得离开，一直等到太阳高高升上天空，才起身回家。

    - id: ch04
      title: 再也见不到的幻景
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            接下来的一天，仿佛永远也过不完。年轻人数着每一分钟，只盼黑夜快点到来，好让他重返森林。可他终于赶到那里时，金色帐篷不见了，林中仙女也不见了。
        - id: ch04-b02
          speaker: narrator
          text: >-
            后来，他又去了许多个夜晚，却再也没有看见她们。他从早到晚都在思念那群仙女，对世上的其他事情再也提不起兴趣。那一幕美丽的幻景叫他怀念成疾，直到生命尽头也没有解脱。
        - id: ch04-b03
          speaker: narrator
          text: >-
            到这时，他终于明白，玛纳的告诫一点也没有错。人最大的福分，莫过于双眼有所不见。
        - id: ch04-b04
          speaker: narrator
          text: >-
            这个故事来自爱沙尼亚。
