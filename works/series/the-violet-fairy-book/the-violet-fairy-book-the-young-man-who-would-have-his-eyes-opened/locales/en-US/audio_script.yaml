audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, steady, and quietly mysterious
        timbre: clear and resonant
        pace: measured
        pitch: medium
    mana:
      display_name: Mana
      tts:
        delivery: grave, patient, and warning
        timbre: old and resonant
        pace: unhurried
        pitch: low
  chapters:
    - id: ch01
      title: The Search for Hidden Knowledge
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a young man who could never be happy unless he was uncovering things that no one else knew. He learned the language of birds and beasts. Then, quite by chance, he discovered that much went on beneath the cover of night that human eyes never saw.
        - id: ch01-b02
          speaker: narrator
          text: From then on, he could think of nothing but those hidden secrets. He wandered from wizard to wizard, begging each one to open his eyes. None would help him. At last he came to an old magician named Mana. Mana knew more than all the others and could tell him everything he wished to learn.
        - id: ch01-b03
          speaker: narrator
          text: The old man listened carefully. Then he gave the young man a warning.
        - id: ch01-b04
          speaker: mana
          text: My son, do not chase after useless knowledge. It will bring you evil, not happiness. Many things are hidden from human eyes because no heart could stay peaceful after seeing everything. Knowledge kills joy. Think hard about what you are doing, or one day you will be sorry. But if you refuse my advice, I can show you the secrets of the night. You will need more than a man's courage to bear what you see.
        - id: ch01-b05
          speaker: narrator
          text: Mana stopped and looked at him. The young man nodded, so the magician went on.
        - id: ch01-b06
          speaker: mana
          text: Tomorrow night, go to the place where the serpent-king holds a great feast for his whole court once every seven years. A golden bowl filled with goats' milk stands before him. Dip a piece of bread into that milk and eat it before you have to flee. Then you will understand every secret of the night that other men cannot see. You are fortunate that the feast falls this year, or you would have waited a long time. Be quick and bold, or you will suffer for it.
        - id: ch01-b07
          speaker: narrator
          text: The young man thanked Mana for his advice and left. He meant to carry out his plan even if it cost him his life.
    - id: ch02
      title: The Serpent-King's Feast
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: When night fell, he went to the wide, lonely moor where the serpent-king held his feast. He stared eagerly around, but saw only countless little hillocks lying still in the moonlight. He crouched behind a bush and waited until midnight must have been near.
        - id: ch02-b02
          speaker: narrator
          text: Suddenly a brilliant glow rose in the middle of the moor. It looked as though a star were shining above one of the hillocks. At once, every hillock began to writhe and crawl. Hundreds of serpents poured from each one and headed straight toward the light, where their king was waiting.
        - id: ch02-b03
          speaker: narrator
          text: His hillock was taller and broader than all the rest, and a bright light hung over its top. The serpents reached it, coiled themselves up, and waited. Such a whirring confusion rose from all those serpent homes that the young man dared not take a single step. He stayed behind the bush and watched. At last his courage began to return, and he crept forward, one soft step at a time.
        - id: ch02-b04
          speaker: narrator
          text: What he saw was more dreadful than anything he had imagined. Thousands of snakes, large and small and of every color, crowded around one enormous serpent. They made one great, tangled cluster around him. His body was as thick as a beam. A golden crown rested on his head, and all the light came from it.
        - id: ch02-b05
          speaker: narrator
          text: The snakes hissed and flicked their tongues. The sight frightened the young man so badly that his courage failed. He could not make himself go on toward certain death. Then he saw the golden bowl before the serpent-king. If he missed this chance, it would never return.
        - id: ch02-b06
          speaker: narrator
          text: His hair stood on end, and his blood seemed to freeze. Still, he crept nearer. A fresh roar of hissing and whirring burst from the serpents. Thousands of heads rose, and thousands of tongues reached out to sting him to death. But the snakes were wound so tightly around one another that they could not quickly pull themselves free.
        - id: ch02-b07
          speaker: narrator
          text: Quick as lightning, the young man snatched up a piece of bread, dipped it in the bowl, and put it into his mouth. Then he raced away as though fire were chasing him.
    - id: ch03
      title: Flight Across the Moor
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: He flew over the moor as if an army were at his heels. The sound behind him seemed to draw nearer and nearer. At last he could run no farther. He fell onto the grass, almost senseless.
        - id: ch03-b02
          speaker: narrator
          text: Terrible dreams came while he lay there. The serpent-king with the fiery crown wrapped himself around the young man and began to crush the life from him. With a loud cry, the young man leaped up to fight. Then he saw that rays of sunlight, not the serpent-king, had awakened him.
        - id: ch03-b03
          speaker: narrator
          text: He rubbed his eyes and looked everywhere. Nothing remained of the enemies from the night before. The dangerous moor was at least a mile away. Yet his long flight had been real, and so had the magic goats' milk. He felt his arms and legs and found them whole. His joy was great, for he had escaped all those dangers without a wound.
    - id: ch04
      title: The Dance in the Forest
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Exhausted and shaken, the young man stayed where he was until noon. Even so, he decided to enter the forest that very evening. There he would test the goats' milk and learn whether he could truly understand all that had once been hidden from him.
        - id: ch04-b02
          speaker: narrator
          text: As soon as he entered the forest, every doubt vanished. He saw what no mortal eyes had ever seen before. Golden pavilions stood beneath the trees. Silver flags flew above them, and everything shone with light.
        - id: ch04-b03
          speaker: narrator
          text: He was still wondering why the pavilions were there when a sound stirred among the trees, like a wind suddenly rising. Beautiful maidens stepped out from every side and entered the bright moonlight. They were wood-nymphs, daughters of the earth-mother, and they came each night to dance in the forest.
        - id: ch04-b04
          speaker: narrator
          text: The young man watched from his hiding place. He wished he had a hundred eyes, because two could never take in such a sight. The dancing lasted until the first streaks of dawn. Then something like a silver veil passed over the maidens, and they vanished. The young man stayed there until the sun stood high. Only then did he go home.
    - id: ch05
      title: The Vision Lost
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: That day seemed endless. He counted every minute until night returned and he could hurry back to the forest.
        - id: ch05-b02
          speaker: narrator
          text: But when he arrived, there were no golden pavilions and no wood-nymphs. He returned night after night, yet he never saw them again.
        - id: ch05-b03
          speaker: narrator
          text: Still, he thought of them through every day and every night. Nothing else in the world mattered to him anymore. For the rest of his life, he was sick with longing for that beautiful vision.
    - id: ch06
      title: Mana's Warning Fulfilled
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: And so he learned that Mana had spoken the truth when he said, "Blindness is man's highest good."
