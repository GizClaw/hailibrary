audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 编者
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清晰的成年男声
        pace: 从容舒展
        pitch: 中低音
    sultan:
      display_name: 苏丹
      tts:
        delivery: 威严自负，判断急切
        timbre: 低沉有力的成年男声
        pace: 沉稳
        pitch: 低音
    eldest_son:
      display_name: 长子
      tts:
        delivery: 起初自信，后来坦白羞愧
        timbre: 强健清朗的青年男声
        pace: 适中
        pitch: 中低音
    second_son:
      display_name: 次子
      tts:
        delivery: 自以为是，失败后惊慌躲闪
        timbre: 清晰年轻的男声
        pace: 适中
        pitch: 中音
    youngest_son:
      display_name: 小儿子
      tts:
        delivery: 直率勇敢，沉着坚定
        timbre: 明亮年轻的男声
        pace: 从容
        pitch: 中高音
    mother:
      display_name: 母亲
      tts:
        delivery: 慈爱恳切，处处护着孩子
        timbre: 温暖成熟的女声
        pace: 舒缓
        pitch: 中音
    slave:
      display_name: 奴仆
      tts:
        delivery: 恭敬警醒，说话朴实
        timbre: 清晰结实的成年男声
        pace: 适中
        pitch: 中音
    headman:
      display_name: 总管
      tts:
        delivery: 豪爽激动，带着庆典般的热烈
        timbre: 洪亮饱满的成年男声
        pace: 明快
        pitch: 中低音
    bird:
      display_name: 神鸟
      tts:
        delivery: 机敏急切，善于劝诱
        timbre: 尖细轻盈
        pace: 稍快
        pitch: 高音
    townsman:
      display_name: 城中男子
      tts:
        delivery: 恭敬焦急，言辞诚恳
        timbre: 朴实清楚的成年男声
        pace: 适中
        pitch: 中低音
    townswoman:
      display_name: 城中女子
      tts:
        delivery: 好奇活泼，真诚热切
        timbre: 明亮清晰的成年女声
        pace: 明快
        pitch: 中高音
    child:
      display_name: 孩子
      tts:
        delivery: 好奇兴奋，毫不掩饰
        timbre: 轻快清脆的童声
        pace: 稍快
        pitch: 高音
    soldier:
      display_name: 士兵
      tts:
        delivery: 忠诚强硬，敢于直言
        timbre: 坚实洪亮的成年男声
        pace: 适中
        pitch: 中低音
  chapters:
    - id: ch01
      title: 苏丹的椰枣
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前有一位苏丹，最爱自己的花园。他从世界各地找来树木、花草和果子，种得满园都是。每天清早七点起床以后，他先去看一次，下午三点再看一次，到了五点半还要去一次。园中不管哪一株花木、哪一种菜蔬，都逃不过他的眼睛。可他停留最久、最牵挂的，还是那棵独一无二的椰枣树。
        - id: ch01-b02
          speaker: narrator
          text: >-
            苏丹有七个儿子。前六个身强体壮，很有男子气概，叫他十分得意。小儿子却整天待在家里的女人们中间，父亲怎么看都不顺眼。苏丹找他谈过，他不理会。父亲打过他，他不理会。后来连捆也捆过，他还是不理会。到最后，苏丹实在厌倦了逼他改变，只好不再管他。
        - id: ch01-b03
          speaker: narrator
          text: >-
            日子一天天过去，椰枣树终于有了结果的迹象。苏丹高兴极了，先去告诉维齐尔，又去告诉官员和法官，最后连城里的富人也全都知道，他的椰枣树结果了。他耐心等了好几天，眼看果子快熟时，才把六个年长的儿子叫来。
        - id: ch01-b04
          speaker: sultan
          text: >-
            你们得有一个人守着这棵树，直到椰枣熟透。要是没人看守，奴仆准会偷走果子，我又得等上一年。
        - id: ch01-b05
          speaker: eldest_son
          text: >-
            父亲，我去。
        - id: ch01-b06
          speaker: narrator
          text: >-
            长子到了树下，第一件事就是召来奴仆，叫他们整夜敲鼓，好让自己保持清醒。鼓声不停，他也跟着不停地跳舞，一直跳到凌晨四点。后来夜里越来越冷，他冻得再也跳不动了。
        - id: ch01-b07
          speaker: slave
          text: >-
            主人，天快亮了，树不会有事。您躺下睡吧。
        - id: ch01-b08
          speaker: narrator
          text: >-
            长子躺下了，奴仆们也一个接一个睡着了。才过几分钟，一只鸟就从附近的灌木丛里飞来。它落到树上，把椰枣吃得一颗不剩。等树上光秃秃的，它又照着来路飞走了。没多久，一个奴仆醒来，抬头怎么也找不到椰枣，赶紧跑去摇醒主人。
        - id: ch01-b09
          speaker: slave
          text: >-
            你父亲叫你守树，你却没守住。椰枣全叫一只鸟吃光了！
        - id: ch01-b10
          speaker: narrator
          text: >-
            长子跳起来亲眼一看，果然半颗也没了。他想说有人偷了果子，又想说是暴雨狂风打落的，可父亲一定会叫他捡回来。他也想怪罪贝都因人，可父亲又会问，奴仆们为什么不抵抗。想来想去，他决定还是说实话。
        - id: ch01-b11
          speaker: narrator
          text: >-
            他径直回到王宫。苏丹正坐在游廊上，其余五个儿子围在父亲身旁。长子走过去，低着头站在众人面前，等候父亲发问。
        - id: ch01-b12
          speaker: sultan
          text: >-
            花园里有什么消息？
        - id: ch01-b13
          speaker: eldest_son
          text: >-
            一只鸟吃光了椰枣，一颗也没留下。
        - id: ch01-b14
          speaker: narrator
          text: >-
            苏丹沉默了一会儿，问他鸟来时人在何处。
        - id: ch01-b15
          speaker: eldest_son
          text: >-
            我守到公鸡叫，天也快亮了，才躺下一小会儿，没想到睡着了。奴仆把我叫醒，说树上已经空了。我去看过，确实如此。父亲，这就是全部实情。
        - id: ch01-b16
          speaker: sultan
          text: >-
            你这样的儿子只会吃饭睡觉，我留着你没有用。走吧！等椰枣树再结果，我会换个儿子去守，也许他比你强。
          emotion: angry

    - id: ch02
      title: 五年的失败
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            过了许多个月，树上再次结满椰枣，比任何一棵树结过的都多。果子将熟时，苏丹派另一个儿子去看守。
        - id: ch02-b02
          speaker: sultan
          text: >-
            儿啊，我真想尝尝这些椰枣。你今晚守住它们，再晒一天太阳，明天就熟透了。
        - id: ch02-b03
          speaker: second_son
          text: >-
            父亲，我这就去。明天七点以后，您派个奴仆来采吧。
        - id: ch02-b04
          speaker: sultan
          text: >-
            好，就这么办。
        - id: ch02-b05
          speaker: narrator
          text: >-
            次子到了树下，先躺下来睡了一觉。大约半夜，他起身察看，满树椰枣还在，一串串迎风摇摆，长得十分漂亮。他心想，父亲明天可真有口福。哥哥那么不留神，落到失宠被逐的下场，实在愚蠢，如今家里也不再认他了。自己一定要守到那只鸟出现，亲眼看看它究竟是什么模样。
        - id: ch02-b06
          speaker: narrator
          text: >-
            他坐着读书，直到鸡啼天亮，椰枣依然安然无恙。他觉得危险已经过去，便舒服地靠上树干。睡意才一袭来，鸟就落下，把椰枣吃了个精光。
        - id: ch02-b07
          speaker: narrator
          text: >-
            日出以后，总管来采果子，只看见一棵空树。他把次子叫醒。
        - id: ch02-b08
          speaker: headman
          text: >-
            看看这棵树吧。
        - id: ch02-b09
          speaker: narrator
          text: >-
            次子一看，耳朵里嗡嗡作响，两腿发抖，舌头也僵了。身旁的奴仆见他这样，也害怕起来。
        - id: ch02-b10
          speaker: slave
          text: >-
            主人，您怎么了？
        - id: ch02-b11
          speaker: second_son
          text: >-
            我哪儿也不疼，却浑身难受。我明明答应父亲，明早七点让他尝到椰枣。如今他一定会像赶走哥哥那样赶走我。不等他开口，我自己先走。
          emotion: fearful
        - id: ch02-b12
          speaker: narrator
          text: >-
            他从王宫前经过，遇见一个人捧着蒙有白布的大银盘，正要去装椰枣。
        - id: ch02-b13
          speaker: second_son
          text: >-
            椰枣还没熟，明天再来吧。
        - id: ch02-b14
          speaker: narrator
          text: >-
            那奴仆便跟他一起回到王宫。苏丹正与余下的四个儿子坐在一起。次子上前向父亲问安。苏丹问他有没有见到自己派去的人，他说见到了，只是椰枣还没有熟。苏丹听完，根本不信他的话。
        - id: ch02-b15
          speaker: sultan
          text: >-
            因为你们，我已经第二年没吃到椰枣了。走吧，从今往后，你不再是我的儿子！
          emotion: angry
        - id: ch02-b16
          speaker: narrator
          text: >-
            苏丹望着余下的四个儿子，答应重赏能把椰枣带回来的那一个。可是年复一年，他始终没能尝到果子。一个儿子靠打牌提神，另一个骑着马绕树一圈圈打转。最后两个是父亲仅存的希望，苏丹让他们一同去守，他们便在树旁点起一堆堆篝火。可无论他们想什么办法，一到黎明都会睡着，那只鸟也总会趁机吃光椰枣。
        - id: ch02-b17
          speaker: narrator
          text: >-
            到了第六年，树上的椰枣长得比往年任何时候都稠密。总管亲眼看过以后，赶紧进宫向苏丹报信。可苏丹想起前五年的失望，只是伤心地摇了摇头。
        - id: ch02-b18
          speaker: sultan
          text: >-
            这跟我还有什么关系？我本来有七个儿子，可一连五年，椰枣都叫鸟吃了。今年也不会两样。

    - id: ch03
      title: 厨房呆子与神鸟
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            小儿子照旧坐在厨房里，听见了父亲的话。他走过去跪在父亲面前。
        - id: ch03-b02
          speaker: youngest_son
          text: >-
            父亲，今年您一定能吃到椰枣！树上有五大串，城里也有五个民族，我要每个民族送一串。这一回，我自己去守树。
        - id: ch03-b03
          speaker: narrator
          text: >-
            父亲和母亲都大笑起来，只当他在说空话。后来果子熟了，苏丹还是命一个手下去守。小儿子正好听见。
        - id: ch03-b04
          speaker: youngest_son
          text: >-
            您的亲儿子就在这里，为什么反倒叫别人去守？
        - id: ch03-b05
          speaker: sultan
          text: >-
            六个哥哥都不中用。他们办不到的事，你能办到吗？
        - id: ch03-b06
          speaker: youngest_son
          text: >-
            今天请您耐心等一等，让我去。到了明天，您就知道我能不能带回椰枣了。
        - id: ch03-b07
          speaker: mother
          text: >-
            老爷，让孩子试试吧。我们也许吃得着，也许还是吃不着，可总该让他去。
        - id: ch03-b08
          speaker: sultan
          text: >-
            我不是不许，只是信不过他。几个哥哥当初也说得好听，后来做成了什么？
        - id: ch03-b09
          speaker: youngest_son
          text: >-
            父亲，只要明天您、母亲和我都还活着，您一定能吃上椰枣。
        - id: ch03-b10
          speaker: sultan
          text: >-
            那你去吧。
        - id: ch03-b11
          speaker: narrator
          text: >-
            男孩到了花园，叫奴仆们都离开，自己回家睡觉。他独自躺下，沉沉睡到一点钟，醒来后便坐到椰枣树对面。他从衣服的一道褶缝里拿出玉米，又从另一道褶缝里拿出沙砾。他先嚼玉米，一觉得眼皮发沉，就往嘴里放些沙砾。靠着这个办法，他硬是清醒到了鸟来的时候。
        - id: ch03-b12
          speaker: narrator
          text: >-
            鸟四下看了看，没有发现男孩。
        - id: ch03-b13
          speaker: bird
          text: >-
            这里一个人也没有。
        - id: ch03-b14
          speaker: narrator
          text: >-
            它轻轻拍着翅膀落到树上，伸长嘴巴去啄椰枣。男孩一步步悄悄靠近，突然伸手，一把抓住它的翅膀。鸟立刻转身，猛地飞上天空，男孩的双脚也离开了地面，可他始终死死不放。等他们飞得连脚下的山峰都显得小小的时候，鸟终于开口了。
        - id: ch03-b15
          speaker: bird
          text: >-
            亚当的子孙，你要是掉下去，还没落地就会死。你走你的路，也放我走我的路吧。
        - id: ch03-b16
          speaker: youngest_son
          text: >-
            你去哪里，我就去哪里。你甩不掉我。
        - id: ch03-b17
          speaker: bird
          text: >-
            你的椰枣不是我吃的，天也快亮了。放我走吧。
        - id: ch03-b18
          speaker: youngest_son
          text: >-
            正因为你来偷椰枣，我六个哥哥才惹得父亲厌恶。今天，我要让父亲、哥哥和全城所有人都看见你。父亲见了一定高兴。
        - id: ch03-b19
          speaker: bird
          text: >-
            你再不松手，我就把你甩下去！
          emotion: angry
        - id: ch03-b20
          speaker: narrator
          text: >-
            鸟又往上飞，飞得大地也像别的星辰一样在远处闪亮。
        - id: ch03-b21
          speaker: bird
          text: >-
            从这里掉下去，你还能剩下多少？
        - id: ch03-b22
          speaker: youngest_son
          text: >-
            死便死吧，我决不放开你。
        - id: ch03-b23
          speaker: narrator
          text: >-
            鸟知道劝说无用，只好落回地面。它又求男孩放自己走，至少也要跟它立个约。
        - id: ch03-b24
          speaker: youngest_son
          text: >-
            什么约？
        - id: ch03-b25
          speaker: bird
          text: >-
            你救我免遭烈日，我救你免受风雨。
        - id: ch03-b26
          speaker: youngest_son
          text: >-
            你怎么救我？我又凭什么相信你？
        - id: ch03-b27
          speaker: bird
          text: >-
            从我尾巴上拔一根羽毛，放进火里烧。以后只要你需要我，不管我在哪里，都会赶来。
        - id: ch03-b28
          speaker: youngest_son
          text: >-
            好，我答应。你走吧。
        - id: ch03-b29
          speaker: bird
          text: >-
            再会了，我的朋友。你一召唤，就算我在海底深处，也一定赶来。
        - id: ch03-b30
          speaker: narrator
          text: >-
            男孩一直望着鸟，直到再也看不见它，随后径直回到椰枣树下。看见满树果实一颗不少，他心里顿时充满欢喜，仿佛浑身比从前更有力气，双眼也变得更加明亮。他快活得放声笑起来。
        - id: ch03-b31
          speaker: youngest_son
          text: >-
            这是我的好运，是我这个“厨房呆子”的好运！椰枣树，再会啦，我要睡觉了。从前吃你果子的家伙，再也不会来了。
          emotion: happy

    - id: ch04
      title: 椰枣的庆典
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            太阳升得老高，总管才来察看。他本以为树上又会空空如也，谁知密密麻麻的椰枣几乎遮住了叶子。他跑回家敲响大鼓，大人孩子全都赶来。
        - id: ch04-b02
          speakers: [townsman, townswoman, child]
          ensemble: chorus
          text: >-
            总管，出什么事啦？
        - id: ch04-b03
          speaker: headman
          text: >-
            老爷养的不是儿子，是一头雄狮！今天，“厨房呆子”终于在父亲面前露脸了！
          emotion: happy
        - id: ch04-b04
          speaker: townsman
          text: >-
            他究竟做了什么？
        - id: ch04-b05
          speaker: headman
          text: >-
            今天，大家都能吃到椰枣。
        - id: ch04-b06
          speaker: child
          text: >-
            真的吗？
          emotion: surprised
        - id: ch04-b07
          speaker: headman
          text: >-
            当然是真的！先让他睡一会儿，等大家把礼物带来。有鸡的拿鸡，有山羊的拿山羊，有米的拿米。
        - id: ch04-b08
          speaker: narrator
          text: >-
            众人全照总管说的做了。等礼物备好，他们带着大鼓来到椰枣树下。男孩还睡在那里，众人便把他高高抬起。号角、单簧管和鼓一齐奏响，人们一路拍手，一路发出欢喜的呼喊，就这样把他送回父亲家中。
        - id: ch04-b09
          speaker: narrator
          text: >-
            苏丹听见外面的喧闹，走出来一看，只见青叶编成的篮子里盛满椰枣，儿子也被奴仆们高高扛在肩头。他的心一下雀跃起来，暗自庆幸今天终于能吃到果子了。他赶紧叫妻子出来看看儿子的功劳，又命士兵把孩子带到自己面前。
        - id: ch04-b10
          speaker: sultan
          text: >-
            儿啊，你带回了什么消息？
        - id: ch04-b11
          speaker: youngest_son
          text: >-
            我没有什么消息。您张开嘴，就知道椰枣是什么滋味了。
        - id: ch04-b12
          speaker: narrator
          text: >-
            男孩摘下一颗椰枣，放进父亲嘴里。
        - id: ch04-b13
          speaker: sultan
          text: >-
            啊，你果然是我的儿子！你一点也不像那群没用的蠢货。快说，那只鸟怎么样了？只有你守住了它，也只有你见过它。
          emotion: happy
        - id: ch04-b14
          speaker: youngest_son
          text: >-
            是我守着，也是我亲眼见到的。它不会再来了，不会拿自己的命冒险，也不会拿您和您孩子们的命冒险。
        - id: ch04-b15
          speaker: sultan
          text: >-
            从前我有六个儿子，如今只剩一个。偏偏是你这个被我叫作傻瓜的孩子，给我带来了椰枣。其他人，我一个也不要。
        - id: ch04-b16
          speaker: narrator
          text: >-
            母亲听了，立刻站起身走到苏丹面前，求他千万不要抛弃那六个儿子。她苦苦哀求了很久，因为在七个孩子当中，她爱那六个年长的儿子，胜过爱最小的一个。苏丹终于答应了她，一家人又安安静静地住在一起。

    - id: ch05
      title: 苏丹的猫
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            后来，苏丹的猫抓走了一头小牛。小牛的主人来到苏丹面前告状，苏丹只说，猫是他的，小牛也是他的。那人听了，再也不敢抱怨。两天以后，猫又抓走一头母牛。有人来禀告，苏丹仍不在意，只说那是他的母牛，也是他的猫。
        - id: ch05-b02
          speaker: narrator
          text: >-
            又过几天，猫抓走一头驴。有人来报，苏丹只说，那是他的猫，也是他的驴。下一回，被抓的是一匹马，再下一回又是一头骆驼。每一次都有人前来禀报，每一次苏丹都不肯处置它。
        - id: ch05-b03
          speaker: sultan
          text: >-
            你们不喜欢这只猫，一心想让我杀掉它。我偏不杀。让它吃骆驼吧，哪怕吃个人也由它！
        - id: ch05-b04
          speaker: narrator
          text: >-
            那只猫一直等到第二天，果真抓走了别人家的孩子。有人来报，苏丹仍说，猫是他的，孩子也是他的。后来，它又抓走一个成年人。再往后，它索性离开城镇，住进路旁的灌木丛。有人沿路去打水，它就吃人。母牛沿路去吃草，它就吃牛。山羊从那里经过，它也照吃不误。只要走上那条路，不管是什么，都逃不过它。
        - id: ch05-b05
          speaker: narrator
          text: >-
            百姓一起向苏丹禀报猫的恶行，他却照旧回答，猫是他的，百姓也是他的。无人敢杀它，它的胆子越来越大，最后竟进城寻找猎物。
        - id: ch05-b06
          speaker: narrator
          text: >-
            一天，苏丹带着六个儿子到乡间察看麦子。他们有说有笑地来到一片灌木丛旁，那只猫突然跃出，一口气杀死了三个儿子。
        - id: ch05-b07
          speakers: [soldier, slave]
          ensemble: duo
          text: >-
            那只猫！那只猫！
          emotion: fearful
        - id: ch05-b08
          speaker: sultan
          text: >-
            找到它，杀了它！它已经不是猫，是个恶魔！
          emotion: fearful
        - id: ch05-b09
          speaker: soldier
          text: >-
            老爷，我们不是早就禀报过它的所作所为吗？您当时不是说，猫是您的，百姓也是您的吗？
        - id: ch05-b10
          speaker: sultan
          text: >-
            不错，我说过。
        - id: ch05-b11
          speaker: narrator
          text: >-
            小儿子没有跟父亲出门，而是留在家中陪伴母亲。听说三个哥哥被猫咬死，他立刻站起身来。
        - id: ch05-b12
          speaker: youngest_son
          text: >-
            让我去吧，也让它把我杀掉。
          emotion: sad
        - id: ch05-b13
          speaker: narrator
          text: >-
            母亲苦苦哀求，叫他不要离开，可他怎么也不肯听。他带上一把剑、一支长矛和一些米饼，追着那只已经逃到很远地方的猫出发了。年轻人一连追猎了许多天。那只猫如今有了一个人人害怕的名字，叫“吃人兽努恩达”。一路上，他杀死过许多野兽，却始终看不见真正仇敌的踪迹。无论迎面遇上多么凶猛的野兽，他也从不害怕，更不肯回头。日子越拖越久，父亲和母亲都担心起来，最后一同求他放弃追捕努恩达。
        - id: ch05-b14
          speaker: youngest_son
          text: >-
            我说出口的话不能收回。我若该死，死便死吧，可我每天都要去寻找努恩达。
        - id: ch05-b15
          speaker: narrator
          text: >-
            父亲许诺，只要他留下，要什么都给，连王位也可以。男孩仍旧不听，继续赶路。

    - id: ch06
      title: 追猎努恩达
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            奴仆们多次跑来报告，说发现了脚印，当天一定能见到努恩达，可那些足迹每次都属于别的野兽。他们走了很远，穿过一片又一片沙漠和森林，终于来到一座大山脚下。男孩心里有个声音悄悄告诉他，漫长的寻找就要在这里结束，今天，他们一定能找到努恩达。
        - id: ch06-b02
          speaker: narrator
          text: >-
            登山以前，男孩叫奴仆摩擦木棍生火，先煮米饭吃。填饱肚子以后，他们才开始爬山。快到山顶时，走在最前面的奴仆突然大叫。
        - id: ch06-b03
          speaker: slave
          text: >-
            主人！主人！快来看！
          emotion: surprised
        - id: ch06-b04
          speaker: narrator
          text: >-
            男孩赶到他身旁。
        - id: ch06-b05
          speaker: slave
          text: >-
            请往山脚下看。
        - id: ch06-b06
          speaker: narrator
          text: >-
            男孩低头一望，心里立刻认定那就是努恩达。他握着长矛悄悄下山，停下来仔细观察。
        - id: ch06-b07
          speaker: youngest_son
          text: >-
            这一定是真正的努恩达。母亲说它耳朵很小，这一只正是小耳朵。她说它身宽体短，这一只也正是这样。她还说它身上有灵猫似的斑点，这一只果然也有。
        - id: ch06-b08
          speaker: narrator
          text: >-
            努恩达还在山脚熟睡，男孩先回到奴仆们身边。
        - id: ch06-b09
          speaker: youngest_son
          text: >-
            今天先吃个痛快。做些面糊饼，再拿水来。
        - id: ch06-b10
          speaker: narrator
          text: >-
            奴仆们做好面糊饼，取来清水，众人先吃饱喝足。吃完以后，男孩叫他们把剩下的食物藏进灌木丛。这样一来，等他们杀掉努恩达，就能先回这里吃饭，再睡上一觉，然后才返回城里。奴仆们听明白了，全照他的吩咐办好。
        - id: ch06-b11
          speaker: narrator
          text: >-
            下午到了，男孩领着他们下到山底，来到横在众人与努恩达之间的大森林。
        - id: ch06-b12
          speaker: youngest_son
          text: >-
            这片树林可不小。裹着两块布的人，扔掉一块，把另一块从两腿间掖紧。我们也许会被荆棘钩住，也许得从努恩达面前逃命。布要是缠住腿，人就会在它面前摔倒。
        - id: ch06-b13
          speaker: slave
          text: >-
            是，主人。
        - id: ch06-b14
          speaker: narrator
          text: >-
            众人答应一声，照他的吩咐收拾妥当，随后手脚并用地爬向努恩达熟睡的地方。他们一点声音也不发，慢慢靠近，直到已经离它很近。男孩打出手势，所有人同时举臂，一齐掷出长矛。努恩达没有动弹，那些长矛已经取了它的性命。可一阵巨大的恐惧忽然攫住众人，他们谁也不敢上前查验，转身便逃，一直爬回山顶。
        - id: ch06-b15
          speaker: narrator
          text: >-
            等他们重新登上山顶，太阳已经开始落下。看见先前藏好的果子、面糊饼和清水还在那里，众人都十分庆幸。他们坐下来歇息，把食物和水取出来，饱饱吃了一顿。等肚子填满，紧绷的心也放下来，他们便躺在山顶，一直睡到第二天清晨。
        - id: ch06-b16
          speaker: narrator
          text: >-
            破晓时，大家起身又煮了些米饭，也喝了些水。随后他们绕过整座大山的背面，回到留下努恩达的地方。它依旧直挺挺地躺在原处，身子已经僵硬，果然死透了。众人这才走上前，一同抬起努恩达，踏上回城的路，边走边放声歌唱。
        - id: ch06-b17
          speakers: [youngest_son, slave, soldier]
          ensemble: chorus
          text: >-
            他杀死了努恩达，杀死了吃人的恶兽！
          emotion: happy
        - id: ch06-b18
          speaker: narrator
          text: >-
            苏丹听到消息，知道儿子已经归来，还把努恩达一同带回了城，只觉得世上再没有谁比自己更快活。百姓们纷纷向男孩俯身行礼，又送给他许多礼物，从此人人都爱戴他。因为正是这个曾被父亲轻视的男孩，让大家摆脱了长久以来恐惧的奴役，亲手杀死了吃人兽努恩达。
        - id: ch06-b19
          speaker: narrator
          text: >-
            这个故事据《斯瓦希里故事集》改写。
