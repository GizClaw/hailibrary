  chapters:
    - id: ch01
      title: The Sultan's Dates
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, there was a sultan who dearly loved his garden. He filled it with trees, flowers, and fruits from every part of the world. Three times a day he walked among them, at seven in the morning, again at three, and once more at half past five. He noticed every plant and vegetable, but the one he loved best was his single date tree.
        - id: ch01-b02
          speaker: narrator
          text: The sultan had seven sons. He was proud of the six eldest because they were strong and manly. But he disliked the youngest, who spent all his time among the women of the household. His father talked to him, beat him, and even tied him up, but nothing changed. At last, the sultan stopped trying and left the boy alone.
        - id: ch01-b03
          speaker: narrator
          text: In time, the sultan saw the first signs of fruit on his date tree. He was so delighted that he told his vizier, his officers, his judges, and every rich man in town.
        - id: ch01-b04
          speaker: sultan
          text: My date tree is bearing fruit!
          emotion: happy
        - id: ch01-b05
          speaker: narrator
          text: He waited until the dates were almost ripe. Then he called his six elder sons.
        - id: ch01-b06
          speaker: sultan
          text: One of you must guard the tree until the dates ripen. If no one watches it, the slaves will steal them, and I will have to wait another year.
        - id: ch01-b07
          speaker: eldest_son
          text: I will go, Father.
        - id: ch01-b08
          speaker: narrator
          text: At the tree, the eldest son ordered his slaves to beat drums all night so he would not fall asleep. They played, and he danced until four in the morning. Then the cold grew too sharp for dancing.
        - id: ch01-b09
          speaker: slave
          text: Dawn is coming, master. The tree is safe now. Lie down and get some sleep.
        - id: ch01-b10
          speaker: narrator
          text: The young man lay down, and soon he and all his slaves were asleep. A few minutes later, a bird flew out of a nearby thicket. It landed on the tree and ate every date. Not one remained. Then it flew away as quietly as it had come.
        - id: ch01-b11
          speaker: narrator
          text: A slave woke soon afterward. When he saw the bare tree, he ran to his master and shook him awake.
        - id: ch01-b12
          speaker: slave
          text: Your father sent you to guard this tree, but you did not guard it. A bird has eaten every date!
        - id: ch01-b13
          speaker: narrator
          text: The eldest son sprang up and searched the tree. There was nothing there. He wondered what he could possibly tell his father. He might claim that thieves had taken the dates, or that rain and wind had knocked them down. But his father would order him to gather them, and there were none to gather. He might blame Bedouins, but his father would ask why the slaves had not fought them. In the end, he decided that the truth was best.
        - id: ch01-b14
          speaker: narrator
          text: He went straight to the palace. The sultan sat on the veranda with the other five elder sons around him. The young man bowed his head.
        - id: ch01-b15
          speaker: sultan
          text: What news do you bring from the garden?
        - id: ch01-b16
          speaker: eldest_son
          text: A bird ate all the dates. There is not a single one left.
        - id: ch01-b17
          speaker: narrator
          text: The sultan said nothing for a moment.
        - id: ch01-b18
          speaker: sultan
          text: Where were you when this bird came?
        - id: ch01-b19
          speaker: eldest_son
          text: I watched until the cocks began to crow and the sky grew light. Then I lay down for just a little while, and I fell asleep. A slave woke me and said the tree was bare. I went to see, and it was true. That is the whole truth, Father.
        - id: ch01-b20
          speaker: sultan
          text: A son like you is good for nothing but eating and sleeping. I have no use for you. Go away. When the tree bears again, I will send another son who may guard it better.
          emotion: angry
        - id: ch01-b21
          speaker: narrator
          text: Many months passed before the tree bore fruit again. This time, it carried more dates than any tree had ever borne before. The sultan watched them grow until they were almost ripe. Then he chose another of his sons and sent him into the garden to guard them through the final night.
        - id: ch01-b22
          speaker: sultan
          text: My son, I long to taste those dates. Watch them tonight. One more day of sun will ripen them perfectly.
        - id: ch01-b23
          speaker: second_son
          text: I am leaving now, Father. Tomorrow, after seven, send a slave to gather them.
        - id: ch01-b24
          speaker: sultan
          text: Good.
    - id: ch02
      title: Five Years of Failure
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The second son reached the garden, lay down, and slept. Around midnight, he rose and examined the tree. Every beautiful date still swung there in its bunch.
        - id: ch02-b02
          speaker: second_son
          text: Father will feast tomorrow. My brother was a fool not to watch more carefully. Now he has been cast out, and we no longer count him among us. I will stay awake until this bird comes. I want to see what kind of bird it is.
        - id: ch02-b03
          speaker: narrator
          text: He sat reading until the cocks crowed and daylight began. The dates were still safe.
        - id: ch02-b04
          speaker: second_son
          text: Father will have his dates after all. They are safe now. I can rest against the trunk for a while.
        - id: ch02-b05
          speaker: narrator
          text: He leaned back, sleep overcame him, and the bird flew down and ate every date.
        - id: ch02-b06
          speaker: narrator
          text: At sunrise, the headman came to collect the fruit. He found the tree bare and woke the young man.
        - id: ch02-b07
          speaker: headman
          text: Look at the tree.
        - id: ch02-b08
          speaker: narrator
          text: The son stared. His ears seemed blocked, his legs shook, and his tongue felt heavy when he thought of facing the sultan. The slave beside him grew frightened too.
        - id: ch02-b09
          speaker: slave
          text: Master, what is wrong?
        - id: ch02-b10
          speaker: second_son
          text: Nothing hurts, yet I feel sick all over. I promised Father that he would taste the dates at seven. Now he will drive me away like my brother. I will leave before he can send me off.
          emotion: fearful
        - id: ch02-b11
          speaker: narrator
          text: He took the road past the palace. Before he had gone far, he met a man carrying a great silver dish covered with a white cloth, ready for the dates.
        - id: ch02-b12
          speaker: second_son
          text: The dates are not ripe yet. Come back tomorrow.
        - id: ch02-b13
          speaker: narrator
          text: The slave returned with him to the palace, where the sultan sat with his four remaining elder sons.
        - id: ch02-b14
          speaker: second_son
          text: Greetings, master.
        - id: ch02-b15
          speaker: sultan
          text: Did you meet the man I sent?
        - id: ch02-b16
          speaker: second_son
          text: Yes, master, but the dates are not ripe yet.
        - id: ch02-b17
          speaker: narrator
          text: The sultan did not believe him.
        - id: ch02-b18
          speaker: sultan
          text: For a second year, my own sons have kept me from tasting my dates. Go away. You are no longer my son!
          emotion: angry
        - id: ch02-b19
          speaker: narrator
          text: The sultan turned to the four sons who remained and promised rich gifts to whichever one brought him the dates. Year after year, they tried. One son played cards all night to keep his eyes open. Another mounted a horse and rode round and round the tree. At last, the sultan sent the final two sons together, and they lit great bonfires beside the tree. Nothing helped. Near dawn, each watcher fell asleep. Each time, the bird flew down and ate every date before anyone woke.
        - id: ch02-b20
          speaker: narrator
          text: In the sixth year, the tree bore more dates than ever. The headman went to tell the sultan, but the sultan only shook his head sadly.
        - id: ch02-b21
          speaker: sultan
          text: What does it matter? I have had seven sons, yet a bird has eaten my dates for five years. This year will be no different.
          emotion: sad
        - id: ch02-b22
          speaker: narrator
          text: The youngest son was sitting in the kitchen, as he often did, and heard those words. He rose, went to his father, and knelt before him.
        - id: ch02-b23
          speaker: youngest_son
          text: Father, this year you will eat dates. There are five great bunches on the tree. I will give one bunch to each of the five nations in our town. This time, I will guard the tree myself.
        - id: ch02-b24
          speaker: narrator
          text: His father and mother laughed heartily. They thought he was merely talking.
        - id: ch02-b25
          speaker: narrator
          text: Then word came that the dates were ripe. The sultan ordered one of his men to guard them. The youngest son was nearby and heard him.
        - id: ch02-b26
          speaker: youngest_son
          text: Why send that man when your own son is still here?
        - id: ch02-b27
          speaker: sultan
          text: Six sons have already failed me. Do you think you can succeed where all of them failed?
        - id: ch02-b28
          speaker: youngest_son
          text: Be patient for one day and let me try. Tomorrow you will see whether I bring you dates.
        - id: ch02-b29
          speaker: mother
          text: Let the child go, master. Perhaps we will eat the dates, and perhaps we will not. Either way, let him try.
        - id: ch02-b30
          speaker: sultan
          text: I will not forbid him, but I do not trust him. His brothers made fine promises too. What came of them?
        - id: ch02-b31
          speaker: youngest_son
          text: Father, if you, Mother, and I are alive tomorrow, you will eat those dates.
        - id: ch02-b32
          speaker: sultan
          text: Then go.
    - id: ch03
      title: The Boy and the Bird
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: At the garden, the boy sent all the slaves home to sleep. Alone, he lay down and slept soundly until one o'clock. Then he rose and sat facing the date tree. From one fold of his clothes he took some Indian corn, and from another he took a little sandy grit.
        - id: ch03-b02
          speaker: narrator
          text: He chewed the corn until drowsiness came over him. Then he put grit in his mouth, and its roughness kept him awake until the bird arrived.
        - id: ch03-b03
          speaker: narrator
          text: The bird looked around but did not see him.
        - id: ch03-b04
          speaker: bird
          text: No one is here.
        - id: ch03-b05
          speaker: narrator
          text: It fluttered lightly onto the tree and reached its beak toward the dates. The boy slipped forward and seized it by one wing. The bird wheeled around and flew swiftly away, but the boy held on. Even when they rose high into the air, he would not release it.
        - id: ch03-b06
          speaker: bird
          text: Son of Adam, look how small the mountaintops are below us. If you fall, you will die long before you reach the earth. Let go of me, and each of us can go his own way.
        - id: ch03-b07
          speaker: youngest_son
          text: Wherever you go, I am going too. You will not shake me off.
        - id: ch03-b08
          speaker: bird
          text: I never ate your dates. Morning is coming. Let me be on my way.
        - id: ch03-b09
          speaker: youngest_son
          text: You stole the dates, and now my six brothers are hated by our father. Today my father will see you. My brothers will see you. Everyone in town, great and small, will see you, and my father's heart will be glad.
        - id: ch03-b10
          speaker: bird
          text: If you refuse to let go, I will throw you off.
        - id: ch03-b11
          speaker: narrator
          text: The bird climbed higher and higher until the earth shone below them like another star.
        - id: ch03-b12
          speaker: bird
          text: If you fall from here, how much of you do you think will be left?
        - id: ch03-b13
          speaker: youngest_son
          text: If I die, I die. I still will not let you go.
        - id: ch03-b14
          speaker: narrator
          text: The bird saw that talking was useless, so it carried him back down to earth.
        - id: ch03-b15
          speaker: bird
          text: You are home now. Please let me go. Or at least make a covenant with me.
        - id: ch03-b16
          speaker: youngest_son
          text: What sort of covenant?
        - id: ch03-b17
          speaker: bird
          text: Save me from the sun, and I will save you from the rain.
        - id: ch03-b18
          speaker: youngest_son
          text: How could you do that? And how would I know I could trust you?
        - id: ch03-b19
          speaker: bird
          text: Pull out one feather from my tail. Whenever you need me, put it in the fire. No matter where I am, I will come to you.
        - id: ch03-b20
          speaker: youngest_son
          text: Very well. I agree. You may go.
        - id: ch03-b21
          speaker: bird
          text: Farewell, my friend. When you call, I will come, even if I am in the deepest sea.
        - id: ch03-b22
          speaker: narrator
          text: The boy watched until the bird vanished. Then he hurried to the date tree. The fruit was still there. His heart lifted, his strength returned, and his eyes shone brighter than before. He laughed aloud.
        - id: ch03-b23
          speaker: youngest_son
          text: This is my own good fortune, mine, Sit-in-the-kitchen! Farewell, date tree. I am going to sleep now. The creature that ate your fruit will never eat it again.
          emotion: happy
    - id: ch04
      title: Sit-in-the-kitchen Triumphs
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The sun was high before the headman came to inspect the tree. He expected to find it bare. Instead, the dates hung so thickly that they almost covered the leaves. He raced home and beat a great drum. Everyone came running, and even the little children wanted to know what had happened.
        - id: ch04-b02
          speakers: [townsman, townswoman, child]
          ensemble: chorus
          text: What is it, headman? What happened?
        - id: ch04-b03
          speaker: headman
          text: Our master does not have a mere son. He has a lion! Today Sit-in-the-kitchen has shown his true face to his father!
          emotion: happy
        - id: ch04-b04
          speaker: townsman
          text: What did he do, headman?
        - id: ch04-b05
          speaker: headman
          text: Today everyone may eat the dates.
        - id: ch04-b06
          speaker: child
          text: Is it really true?
          emotion: surprised
        - id: ch04-b07
          speaker: headman
          text: Yes, every word is true. But let the boy sleep until each person has brought him a gift. Whoever owns chickens should bring chickens. Whoever owns a goat should bring a goat. Whoever has rice should bring rice. Let no one come empty-handed.
        - id: ch04-b08
          speaker: narrator
          text: The people went home and returned with the gifts the headman had named. Then they took up the drum and marched to the date tree, where the boy still slept after his long watch. They lifted him without waking him and carried him toward his father's house. Horns and clarinets sounded around him. Drums beat, hands clapped, and the people gave shrill cries of joy all along the way.
        - id: ch04-b09
          speaker: narrator
          text: At the palace, the sultan heard the celebration coming. Then he saw baskets woven from green leaves, all brimming with dates. Above them, his youngest son rode high on the slaves' shoulders. The sultan's heart leaped at the sight. Today, at last, he would taste the fruit he had waited for so long. He called his wife to come and see what her son had done. Then he ordered the soldiers to take the boy from the crowd and bring him to his father.
        - id: ch04-b10
          speaker: sultan
          text: What news do you bring, my son?
        - id: ch04-b11
          speaker: youngest_son
          text: News? I have no news. Just open your mouth, and you will finally learn what a date tastes like.
        - id: ch04-b12
          speaker: narrator
          text: The boy plucked a date and placed it in his father's mouth.
        - id: ch04-b13
          speaker: sultan
          text: You truly are my son! You are nothing like those useless fools. But tell me, what happened to the bird? You were the one who waited for it, and no one else.
          emotion: happy
        - id: ch04-b14
          speaker: youngest_son
          text: Yes, I waited, and I saw it. It will never come back, not to save its own life, your life, or the lives of your children.
        - id: ch04-b15
          speaker: sultan
          text: Once I had six sons, and now I have only one. The boy I called a fool is the one who brought me my dates. I want nothing more to do with the others.
        - id: ch04-b16
          speaker: narrator
          text: His wife rose and went to him.
        - id: ch04-b17
          speaker: mother
          text: Master, please do not cast them away.
        - id: ch04-b18
          speaker: narrator
          text: She pleaded for a long time, because she loved the six elder sons more than the youngest. At last, the sultan granted her request, and the whole family lived quietly at home.
    - id: ch05
      title: The Cat Becomes the Nunda
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: For a while, everyone lived quietly at home. Then the sultan's cat went out and caught a calf. The animal belonged to another man, so its owner came before the sultan and complained.
        - id: ch05-b02
          speaker: townsman
          text: Master, your cat has caught my calf.
        - id: ch05-b03
          speaker: sultan
          text: The cat belongs to me, and so does the calf.
        - id: ch05-b04
          speaker: narrator
          text: The man dared say no more. Two days later, the cat caught a cow.
        - id: ch05-b05
          speaker: townsman
          text: Master, the cat has caught a cow.
        - id: ch05-b06
          speaker: sultan
          text: It was my cow and my cat.
        - id: ch05-b07
          speaker: narrator
          text: After a few more days, the cat caught a donkey.
        - id: ch05-b08
          speaker: townsman
          text: Master, the cat has caught a donkey.
        - id: ch05-b09
          speaker: sultan
          text: My cat, and my donkey.
        - id: ch05-b10
          speaker: narrator
          text: The cat's prey kept growing larger. Next it caught a horse, and after the horse it brought down a camel. The owners went to the sultan each time and told him what had happened, but he refused to hear the warning behind their words.
        - id: ch05-b11
          speaker: sultan
          text: You dislike this cat and want me to kill it. I will not. Let it eat the camel. Let it even eat a man.
        - id: ch05-b12
          speaker: narrator
          text: The very next day, the cat caught someone's child.
        - id: ch05-b13
          speaker: townswoman
          text: Master, the cat has caught a child!
          emotion: fearful
        - id: ch05-b14
          speaker: sultan
          text: The cat is mine, and the child is mine.
        - id: ch05-b15
          speaker: narrator
          text: Soon afterward, the cat caught a grown man as well. Then it left the town and settled in a thicket beside the road. From there, it waited for anything that passed. If a person walked along the road to fetch water, the cat devoured that person. If a cow went by on its way to feed, the cat devoured the cow. If a goat appeared, it ate the goat. Nothing could travel down that road without being caught.
        - id: ch05-b16
          speaker: narrator
          text: The townspeople went to the sultan together and told him everything the cat had done.
        - id: ch05-b17
          speaker: townsman
          text: Master, this cat has eaten people and animals all along the road.
        - id: ch05-b18
          speaker: sultan
          text: The cat is mine, and the people are mine.
        - id: ch05-b19
          speaker: narrator
          text: Still, no one dared raise a weapon against the sultan's cat. With no one to stop it, the beast grew bolder every day. At last, it no longer waited beside the road. It came straight into the town itself whenever it wanted prey.
        - id: ch05-b20
          speaker: narrator
          text: One day, the sultan called his six elder sons.
        - id: ch05-b21
          speaker: sultan
          text: I am going into the countryside to see how the wheat is growing. All of you will come with me.
        - id: ch05-b22
          speaker: narrator
          text: They went merrily down the road until they reached a thicket. Suddenly, the cat sprang out and killed three of the sons.
        - id: ch05-b23
          speakers: [soldier, townsman]
          ensemble: duo
          text: The cat! The cat!
          emotion: fearful
        - id: ch05-b24
          speaker: sultan
          text: Hunt it down and kill it! That creature is no cat now. It is a demon!
          emotion: fearful
        - id: ch05-b25
          speaker: soldier
          text: Master, did we not warn you what the cat was doing? Did you not answer, "My cat and my people"?
        - id: ch05-b26
          speaker: sultan
          text: Yes. I said it.
        - id: ch05-b27
          speaker: narrator
          text: The youngest son had stayed home with his mother. When he heard that the cat had killed his brothers, he made up his mind to follow it.
        - id: ch05-b28
          speaker: youngest_son
          text: Let me go, so it can kill me too.
          emotion: sad
        - id: ch05-b29
          speaker: narrator
          text: His mother pleaded with him not to leave her. The boy would not be turned aside. He armed himself with a sword and a spear, took rice cakes for the journey, and went after the cat. By that time, the creature had already run far from the town.
        - id: ch05-b30
          speaker: narrator
          text: The boy hunted for many days. By now, people had given the creature a new name. They called it the Nunda, Eater of People. As he searched, the boy met and killed many wild animals, but none was the enemy he had come to find. However fierce a beast might be, he showed no fear of it. The search went on so long that his father and mother begged him to stop chasing the Nunda and come home.
        - id: ch05-b31
          speaker: youngest_son
          text: I cannot take back what I have said. If I am to die, then I die. But every day, I must keep searching for the Nunda.
        - id: ch05-b32
          speaker: narrator
          text: His father offered him anything he wished, even the crown. The boy refused and continued on his way.
    - id: ch06
      title: The Nunda, Eater of People
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Many times, the slaves ran to the boy and announced that they had found footprints. Each time, they were certain that the Nunda must be close and that they would see it before the day was over. But every trail proved false. The searchers wandered far across deserts and through forests. At last, they came to the foot of a great mountain. Something in the boy's own soul told him that their long search would end there. On that day, they would finally find the Nunda.
        - id: ch06-b02
          speaker: narrator
          text: Before climbing, he ordered the slaves to cook rice. They rubbed a stick until they made a fire, cooked the rice, and ate. Then the whole party began to climb.
        - id: ch06-b03
          speaker: narrator
          text: They had almost reached the top when the slave in front called out.
        - id: ch06-b04
          speaker: slave
          text: Master! Master!
        - id: ch06-b05
          speaker: narrator
          text: The boy hurried to him.
        - id: ch06-b06
          speaker: slave
          text: Look down there, at the foot of the mountain.
        - id: ch06-b07
          speaker: narrator
          text: The boy looked, and his heart told him that he was seeing the Nunda. Spear in hand, he crept partway down the slope and stopped to study it.
        - id: ch06-b08
          speaker: youngest_son
          text: This must be the real Nunda. Mother said its ears were small, and these ears are small. She said its body was broad, not long, and this one is broad and short. She said it had spots like a civet cat, and there are the spots.
        - id: ch06-b09
          speaker: narrator
          text: The Nunda lay asleep below. The boy left it there and climbed back to his slaves.
        - id: ch06-b10
          speaker: youngest_son
          text: Today we will feast. Make batter cakes and bring water.
        - id: ch06-b11
          speaker: narrator
          text: They ate and drank. When they had finished, the boy told them to hide the remaining food in the thicket. If they killed the Nunda, they could return, eat, and sleep before starting home. The slaves obeyed.
        - id: ch06-b12
          speaker: narrator
          text: Afternoon came.
        - id: ch06-b13
          speaker: youngest_son
          text: It is time to go after the Nunda.
        - id: ch06-b14
          speaker: narrator
          text: They descended to the bottom of the mountain. A vast forest stood between them and the sleeping beast. There the boy stopped them.
        - id: ch06-b15
          speaker: youngest_son
          text: Any man wearing two cloths must throw one away and tuck the other between his legs. This forest is no little patch of trees. Thorns may catch us, or we may have to run from the Nunda. A loose cloth could bind our legs and make us fall before it.
        - id: ch06-b16
          speakers: [slave, soldier]
          ensemble: duo
          text: Good, master.
        - id: ch06-b17
          speaker: narrator
          text: They did as he ordered. Then they dropped to their hands and knees and crawled toward the Nunda. Without a sound, they moved closer and closer until they were almost beside it. At the boy's signal, they hurled their spears.
        - id: ch06-b18
          speaker: narrator
          text: The Nunda never moved. Their spears had done their work. Still, terror seized every one of them. They fled back up the mountain.
        - id: ch06-b19
          speaker: narrator
          text: Sunset found them at the summit. They brought out the fruit, cakes, and water they had hidden, and they rested. Once they had eaten their fill, they lay down and slept until morning.
        - id: ch06-b20
          speaker: narrator
          text: At dawn, they rose, cooked more rice, and drank more water. Then they walked around the far side of the mountain to the place where they had left the Nunda. It still lay there, stiff and dead.
        - id: ch06-b21
          speaker: narrator
          text: Now there could be no doubt. They lifted the great body together and began the long journey back to town. As they carried it, their fear fell away, and they sang the same words over and over.
        - id: ch06-b22
          speakers: [youngest_son, slave, soldier]
          ensemble: chorus
          text: He has killed the Nunda, the Eater of People!
          emotion: happy
        - id: ch06-b23
          speaker: narrator
          text: Word reached the sultan that his youngest son was returning and that the dead Nunda was being carried with him. The sultan's joy was greater than that of any other man on earth. All through the town, people bowed down before the boy and brought him gifts. They loved him because he had ended the fear that had held them captive. The Nunda, Eater of People, was dead.
