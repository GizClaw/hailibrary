        delivery: 沉痛激昂
        timbre: 浑厚的成年男声
        pace: 适中
        pitch: 中低音
  chapters:
    - id: ch01
      title: 一枚八分币
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前有个男人，把钱全挥霍光了。他一天比一天穷，最后连一顿饭也吃不上，只能蹲在垃圾堆旁，用手在尘土里刨来刨去，像鸡找食那样找几粒玉米。有一天，他照例来到街边的垃圾堆，正盼着从土里翻出一点早饭，眼前忽然闪过银光。那是一枚叫作八分币的小银币。他生怕被别人抢走，赶紧伸手捡起来，牢牢攥住，心想，总算能好好吃一顿了。
        - id: ch01-b02
          speaker: narrator
          text: >-
            可他并没有马上拿钱去买饭，只到井边喝了些水，接着便躺下来睡觉。这一觉睡得太沉，再睁开眼睛时，太阳已经升起，又是一个清晨。他连忙跳起来，重新朝那个垃圾堆走去。
        - id: ch01-b03
          speaker: poor_man
          text: >-
            谁知道呢？说不定我今天还能走一次好运。
        - id: ch01-b04
          speaker: narrator
          text: >-
            路上，一个人迎面走来，手里提着树枝编成的笼子。穷汉叫住了他，问笼里装着什么。
        - id: ch01-b05
          speaker: gazelle_seller
          text: >-
            是瞪羚。
        - id: ch01-b06
          speaker: poor_man
          text: >-
            拿过来让我看看。你卖多少钱？我用一枚八分币买一只，行不行？
        - id: ch01-b07
          speaker: bystander
          text: >-
            你可别糊里糊涂跟他做买卖！他除了从垃圾堆里捡来的东西，什么也没有。自己都吃不饱，哪养得活瞪羚？
        - id: ch01-b08
          speaker: gazelle_seller
          text: >-
            我从乡下出来，一路上少说有五十个人叫我把瞪羚拿给他们看，可谁真买了？做买卖就是要东奔西走。不到最后，谁知道会在哪儿遇上买主？这一只您拿去吧，老爷。
        - id: ch01-b09
          speaker: narrator
          text: >-
            商人当真从笼里取出一只瞪羚，交到穷汉手中。穷汉也当真拿出了全部家当。那枚刚捡来的八分币，就这样换成了瞪羚。他把新伙伴带回垃圾堆旁，弯下腰，一点点翻找，好不容易才凑出几粒玉米。他没有独自吃掉，而是分成两份，自己一份，瞪羚一份。每天早晚，他都这样寻找，也这样分食。五天过去，一天夜里，瞪羚忽然叫醒了熟睡的主人。
        - id: ch01-b10
          speaker: gazelle
          text: >-
            主人，醒一醒。
        - id: ch01-b11
          speaker: poor_man
          text: >-
            真是奇了！我父母，还有世上那么多人，从没谁告诉我瞪羚也能讲话。
        - id: ch01-b12
          speaker: gazelle
          text: >-
            先别管这个，请听我说。您是我的主人，还用世上所有的钱买了我，我不会逃走。可您找到的玉米不够我们两个吃。请准我每天早晨自己出去觅食，到了晚上，我一定回来。
        - id: ch01-b13
          speaker: poor_man
          text: >-
            那就去吧，我的孩子。
        - id: ch01-b14
          speaker: narrator
          text: >-
            瞪羚得到准许，独自走了。太阳落山时，它果然回到主人身边。穷汉又惊又喜，和它并排躺下，一同睡了一夜。第二天早晨，瞪羚说自己还要出去吃草。主人虽然答应，心里却舍不得。他独自待着，只觉得空落落的，于是比平时更早出门，走向那个最容易找到玉米的垃圾堆。他在那里一边翻找，一边等候，好不容易才挨到傍晚。回家以后，他躺在草地上嚼烟草。没过多久，熟悉的蹄声响起，瞪羚轻快地跑到了眼前。
        - id: ch01-b15
          speaker: gazelle
          text: >-
            主人，晚上好。您今天过得好吗？我在森林深处找到了一个清凉地方，那里有甜草、清水，还有柔风。除了我，谁也不知道。明天我还去那里。
        - id: ch01-b16
          speaker: narrator
          text: >-
            此后五天，瞪羚天天黎明出发，去享用那片甜草和清水。第五天，它走着走着，来到一片草地。这里的草一入口便又苦又涩，它很不喜欢，便用蹄子使劲刨地，想把坏草连根拨开。草根下面却露出了一样东西。瞪羚低头细看，发现那不是石块，而是一颗钻石。那钻石个头极大，光芒耀眼，在泥土中也遮不住亮光。
        - id: ch01-b17
          speaker: gazelle
          text: >-
            主人拿出全部钱买了我，现在我也许能报答他。不过得当心，要是交给他，别人会说是他偷的。还是由我送给一位有权有势的富人，看看能替主人换来什么吧。

    - id: ch02
      title: 达赖苏丹
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            瞪羚衔起钻石，在森林里不停地向前走。它走了很远，始终没有看见哪一处像是富人的住所。接下来的两天，它每天从黎明跑到天黑。第三天清晨，一座大城终于出现在远处，瞪羚顿时恢复了精神。城里的人站在街头，有的买，有的卖。瞪羚从人群旁飞奔而过，嘴里的钻石随着脚步一闪一闪。众人觉得稀奇，在后面大声呼喊，它连头也不回，一直奔到王宫。苏丹正在那里乘凉。瞪羚跑到他面前，低下头，把钻石轻轻放在他的脚边。
        - id: ch02-b02
          speaker: narrator
          text: >-
            苏丹先低头看钻石，又抬眼打量瞪羚。他没有立刻追问，反而吩咐侍从拿来地毯和软垫，好让这位长途跋涉的客人躺下休息。他还命人端来牛奶和米饭，让瞪羚慢慢吃喝，恢复力气。一直等它吃饱，也歇够了，苏丹才开口询问，它此行究竟带来了什么消息。
        - id: ch02-b03
          speaker: gazelle
          text: >-
            这颗钻石是我主人达赖苏丹送来的信物。他听说您有一位女儿，特地奉上薄礼，求您把女儿嫁给他。
        - id: ch02-b04
          speaker: sultan
          text: >-
            我答应这门婚事。我的女儿就是他的妻子，我的家就是他的家，我的奴仆也是他的奴仆。哪怕他空着手来，我也欢迎。
        - id: ch02-b05
          speaker: gazelle
          text: >-
            大人，告辞了。我回我们的城去。八天以后，也许十一天以后，我们会来做客。
        - id: ch02-b06
          speaker: narrator
          text: >-
            瞪羚离开的这些日子里，远方的穷汉一直守着家。他等过一个黄昏，又等过一个清晨，可怎么也等不到瞪羚回来。他认定瞪羚已经逃走，从此再也不会出现，便天天伤心，天天哭泣。直到瞪羚终于跨进家门，他才猛地站起身，扑上去紧紧抱住它。他只顾着亲近失而复得的伙伴，欢喜得根本不给瞪羚开口的机会。
        - id: ch02-b07
          speaker: gazelle
          text: >-
            主人，别哭了，先安静下来。今晚好好睡觉。天一亮，我出门时，您跟着我走。
        - id: ch02-b08
          speaker: narrator
          text: >-
            第二天，第一道曙光刚刚照亮大地，他们就起身走进森林。两人一连赶了五天路。第五天，他们在一条溪边坐下休息，瞪羚突然对主人一阵痛打，直打得他满身是伤。接着，它吩咐主人留在原地，等自己回来。瞪羚独自飞奔而去，上午十点左右来到王宫附近。通往宫门的大路两旁站满士兵，他们全是奉命来向达赖苏丹致敬的。远处刚出现瞪羚的身影，就有一名士兵脱离队伍，飞快跑去报信。
        - id: ch02-b09
          speaker: soldier
          text: >-
            达赖苏丹来了！我已经看见他的瞪羚！
        - id: ch02-b10
          speaker: narrator
          text: >-
            苏丹带着满朝人马出宫迎接。瞪羚上前行礼，他客气地还礼，又问它，那位答应带来的主人在哪里。
        - id: ch02-b11
          speaker: gazelle
          text: >-
            唉，我们半路遇上强盗。主人挨了打，财物和衣裳也全被抢走。如今他赤身裸体地躲在森林的灌木下面，不敢让过路人看见。
        - id: ch02-b12
          speaker: narrator
          text: >-
            苏丹一听未来的女婿遭了难，马上掉转马头，赶回王宫。他先吩咐马夫给马厩里最好的马套好鞍具，又叫一名女奴打开箱子，取出一整袋男人穿戴的衣物。他自己也没有闲着，亲手挑出一件长袍、一顶头巾和一条腰带，又找来一双凉鞋、一根散发香气的木杖、一柄金把长剑，还有一把匕首。该用的东西，一样也不肯少。
        - id: ch02-b13
          speaker: sultan
          text: >-
            带上这些东西，再带几名士兵，把那位苏丹接来吧。
        - id: ch02-b14
          speaker: gazelle
          text: >-
            主人正赤身躺在那里，若带士兵去，岂不是叫他羞愧？我独自去就够了。请把马拴在我脖子上，再把衣物牢牢绑在马背上。我跑得比马还快，可别让东西掉下来。
        - id: ch02-b15
          speaker: narrator
          text: >-
            众人依照瞪羚的办法，把马拴在它脖子上，又将衣物牢牢绑在马背。瞪羚向苏丹告辞。苏丹问它何时再来，它说大约是明天五点。说完，它猛地一扯缰绳，领着马飞奔起来。苏丹留在原地，一直望到它们彻底消失，才回头对侍从感叹，那瞪羚必定是在尊贵人家、在苏丹府中养大的，所以才和普通瞪羚完全不同。从这一刻起，瞪羚在他眼里成了一位真正举足轻重的人物。
        - id: ch02-b16
          speaker: narrator
          text: >-
            瞪羚带着马一路奔跑，终于回到主人坐着等候的溪边。主人远远看见它，心里顿时乐开了花。瞪羚叫他站起来，先到溪水中把身体洗净。等他洗好，又叫他拿泥土仔细搓遍全身，再用沙子用力擦牙，把牙齿擦得又白又亮。主人一样样照做。忙完以后，太阳已经落到群山背后。瞪羚这才从马背上取下衣物，帮主人从头到脚穿戴妥当。穷汉看着自己焕然一新的模样，满意极了。
        - id: ch02-b17
          speaker: gazelle
          text: >-
            到了那里，除了问候和打听近况，您什么也别说。话都由我来说。我已经替您找好了妻子，还送过她衣裳、头巾和珍宝。您只管保持沉默。
        - id: ch02-b18
          speaker: poor_man
          text: >-
            我听你的。这一切都是你给的，你才像主人，我倒像奴仆。无论什么事，我都照办。
        - id: ch02-b19
          speaker: narrator
          text: >-
            他们继续赶路。远远看见王宫时，瞪羚告诉穷汉，他不再是穷人，连名字也已经换了。
        - id: ch02-b20
          speaker: poor_man
          text: >-
            那我现在叫什么，我的父亲？
        - id: ch02-b21
          speaker: gazelle
          text: >-
            您叫达赖苏丹。
        - id: ch02-b22
          speaker: narrator
          text: >-
            没过多久，士兵们迎面而来，另一些士兵则掉头回去报信。苏丹得到消息，立即动身。城里的维齐尔、大臣、法官和富人，全都跟随在他身后。瞪羚看见浩浩荡荡的人群，便指给主人看，走在正中、身披天蓝色斗篷的那一位，正是他的岳父。它提醒主人立刻下马，上前问候。达赖苏丹纵身跳下马，另一位苏丹也同时落地。两人彼此伸出手，又亲吻对方，随后肩并肩走进王宫。

    - id: ch03
      title: 七头蛇的宅院
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            第二天早晨，瞪羚来到苏丹的房间，请他为达赖苏丹和女儿主持婚礼，还说新郎的心已经等得焦急。苏丹答道，新娘早已准备好了，只需把祭司请来。仪式完成后，大炮发出轰鸣，乐声响遍王宫，宾客们欢宴庆贺。又过一夜，瞪羚告诉主人，自己要出一趟远门，七天以内不会回来，甚至七天以后也未必能归。它再三嘱咐主人，在自己回来以前，千万不要离开王宫。随后，它又去见苏丹，解释说自己奉达赖苏丹之命，要赶回他的城里收拾宅院。若七日不归，主人会继续住在这里等候。苏丹听完，答应了。
        - id: ch03-b02
          speaker: narrator
          text: >-
            瞪羚再次上路，穿过一片又一片森林，也越过荒无人烟的野地。它走了很久，终于来到一座城。城中到处都是华美的房屋，却听不见人声，也看不见行人。顺着最宽的大路向前望，尽头耸立着一座极其宏伟的宅院。墙壁由蓝宝石、绿松石和大理石砌成，光彩夺目，美得几乎叫人不敢相信。
        - id: ch03-b03
          speaker: gazelle
          text: >-
            这宅子正配我的主人。城里不见一个人，我也想不出别的办法，只能进去看看。该死便死，能活便活。有什么东西要杀我，就让它来吧。
        - id: ch03-b04
          speaker: narrator
          text: >-
            它敲了两遍门，高声叫人开门。过了一会儿，门内终于响起一个苍老的声音，问外面是谁。
        - id: ch03-b05
          speaker: gazelle
          text: >-
            尊贵的太太，是您的孙儿。请开门，我有话要说。
        - id: ch03-b06
          speaker: old_woman
          text: >-
            你若真是我的孙儿，就快回去！别来这里送死，还把我也害死。我怕开门会丢掉我们两条命。
          emotion: fearful
        - id: ch03-b07
          speaker: gazelle
          text: >-
            您不会丧命，我也不会。求您开门吧。
        - id: ch03-b08
          speaker: narrator
          text: >-
            老妇人终于开门。她问瞪羚从哪里来，那里可好。瞪羚说自己来的地方安好，也盼她这里安好。
        - id: ch03-b09
          speaker: old_woman
          text: >-
            我的孩子，这里一点也不好。你若还没见过死亡，今天就会知道死是什么滋味。
          emotion: fearful
        - id: ch03-b10
          speaker: gazelle
          text: >-
            若该见识，我自然会见识。您先告诉我，这座宅子的主人是谁？
        - id: ch03-b11
          speaker: old_woman
          text: >-
            这里财宝无数，粮食充足，有许多奴仆和马匹。可这一切都属于一条大得吓人、怪得出奇的蛇。
        - id: ch03-b12
          speaker: gazelle
          text: >-
            那您告诉我，怎样才能靠近它，把它杀掉？
        - id: ch03-b13
          speaker: old_woman
          text: >-
            千万别这么说！它把我独自留在这里，要我做饭。它来以前总会刮起大风，尘土飞扬。随后它滑进院子，吃光大锅里的食物，再喝光一水池的水。它每隔一天来一次，总在太阳正照屋顶时出现。它足足有七个脑袋，你怎么斗得过它？
          emotion: fearful
        - id: ch03-b14
          speaker: gazelle
          text: >-
            妈妈，别替别人操心。它有没有剑？
        - id: ch03-b15
          speaker: old_woman
          text: >-
            有一柄锋利的剑，落下去快得像闪电。
        - id: ch03-b16
          speaker: gazelle
          text: >-
            把剑给我，妈妈！
        - id: ch03-b17
          speaker: narrator
          text: >-
            老妇人照它的话，从墙上取下那柄长剑。她忽然听见外面风声越来越响，便催瞪羚一定要快，大蛇随时都会出现。话音刚落，风已经卷起尘土。两人立刻安静下来。老妇人藏到帘子后面，悄悄朝院里张望。七头蛇果然滑进来了。它先扑到那些早已预备好的大锅旁，把里面的食物一扫而空。吃饱之后，它又来到水池边，一口气把整池水喝干。直到这时，它才慢慢靠近屋门。
        - id: ch03-b18
          speaker: snake
          text: >-
            老婆子！屋里是什么气味？怎么和平日不一样？
        - id: ch03-b19
          speaker: old_woman
          text: >-
            主人，我一直独自在这里，和平常没有两样。只是隔了许多天，今天我往身上洒了新香料。您闻见的一定是它，还能是什么呢？
          emotion: fearful
        - id: ch03-b20
          speaker: narrator
          text: >-
            瞪羚一直紧贴门边站着，一只前蹄牢牢握住长剑。蛇为了方便进出，早在门上开了一个洞。第一个脑袋穿过洞口，瞪羚挥剑就砍。这一剑干净利落，脑袋已经落地，蛇竟一点也没有察觉。第二个脑袋伸进来时，瞪羚又是一剑，可这次没有砍得那么直。蛇觉得脖子上像被什么挠了一下，心里起疑，便把第三个脑袋探出来察看。谁知那条脖子才穿过洞口，瞪羚的剑又落下了。第三个脑袋骨碌碌滚到地上，和前两个凑在一处。
        - id: ch03-b21
          speaker: narrator
          text: >-
            瞪羚守在洞旁，一次又一次挥剑。等第六个脑袋也掉下来，大蛇终于明白自己遭到了袭击。它暴怒地甩动巨尾，打得地面震动，尘土腾空而起，屋里屋外一片昏暗。瞪羚和老妇人近在咫尺，却连对方的身影也看不清。就在漫天尘土中，大蛇仅剩的第七个脑袋猛然朝洞口冲来。
        - id: ch03-b22
          speaker: gazelle
          text: >-
            各种树你都爬过，可这一棵，你永远爬不上去！
        - id: ch03-b23
          speaker: narrator
          text: >-
            最后一个脑袋也滚落下来，和另外六个躺在一起。紧接着，长剑哐啷一声掉到地上。瞪羚耗尽了力气，昏倒在门边。老妇人见多年的仇敌终于死去，忍不住发出欢喜的尖叫。她赶忙跑去取水，洒在瞪羚身上，又不停为它扇风，还把它移到窗口，让外面的风吹过来。过了许久，瞪羚总算有了动静，忽然打了一个喷嚏。老妇人心中大喜，又一点点喂它喝水。瞪羚慢慢恢复精神，最后终于重新站了起来。
        - id: ch03-b24
          speaker: gazelle
          text: >-
            现在带我看遍这座宅子。从头到尾，从上到下，从里到外，一处也不要漏。
        - id: ch03-b25
          speaker: narrator
          text: >-
            老妇人领着瞪羚，从宅子的这一头走到另一头，又从楼上看到楼下。她打开一扇扇门，里面有的堆满黄金，有的收藏着稀世珍宝，还有一些房间关着大批奴仆。她告诉瞪羚，无论财物还是奴仆，现在都归它所有。瞪羚没有占为己有，只请老妇人把一切看守妥当，等自己把主人叫来。大战让它十分疲惫，它便在宅中休养两天，每天吃些牛奶和米饭。第三天，体力恢复以后，它向老妇人告别，再次踏上归途。

    - id: ch04
      title: 富丽的新家
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            主人听说瞪羚来到门口，像是等到了所有祈祷都会应验的时刻。他站起来亲吻瞪羚，说自己这些天吃不下、喝不下，也笑不出来，心里只有忧愁。
        - id: ch04-b02
          speaker: gazelle
          text: >-
            我很好，我去的地方也一切安好。请您在四天以后带着妻子回家。
        - id: ch04-b03
          speaker: poor_man
          text: >-
            一切由你安排。你到哪里，我就跟到哪里。
        - id: ch04-b04
          speaker: narrator
          text: >-
            瞪羚去向岳父禀报，说达赖苏丹四天后要带妻子回家。苏丹很舍不得。他说女婿来到这里十四天，两人还没好好坐过、谈过、骑马出游，也没一同吃过饭。瞪羚却说，主人去意已决，谁也拦不住。苏丹只好召集全城，命贵妇和卫兵一路护送女儿。
        - id: ch04-b05
          speaker: narrator
          text: >-
            四天后，许多贵妇、奴仆和马匹在宫外集合，组成一支长长的队伍，护送达赖苏丹夫人前往新家。他们从早到晚都在马背上赶路。太阳沉到山后，瞪羚才带大家停下，把沿途所需的食物分给众人。所有人吃饱以后，就在野外躺下睡觉。第二天，他们再次启程。这样的日子持续了许久。无论贵族还是奴仆，都看见瞪羚怎样引路、怎样照料队伍，也一天比一天更爱它。到后来，他们爱瞪羚甚至胜过爱达赖苏丹。
        - id: ch04-b06
          speaker: townsman_1
          text: >-
            瞪羚！远处有房子了！
        - id: ch04-b07
          speaker: gazelle
          text: >-
            各位太太，那就是达赖苏丹的宅子。
        - id: ch04-b08
          speaker: narrator
          text: >-
            女人和奴仆们欢呼起来。两小时后，他们到了门前。瞪羚叫队伍留在后面，先领主人进入院子。老妇人看见他们，高兴得又跳又叫，一把抱住瞪羚，不住地亲它。
        - id: ch04-b09
          speaker: gazelle
          text: >-
            老婆婆，快放开我。该抱的是我的主人，该亲的也是我的主人。
        - id: ch04-b10
          speaker: old_woman
          text: >-
            原谅我，我的孩子。我不知道这位就是我们的主人。
        - id: ch04-b11
          speaker: narrator
          text: >-
            她把所有房门敞开，让达赖苏丹看清房间和库房里的财物。他看了许久，终于吩咐众人做事。
        - id: ch04-b12
          speaker: poor_man
          text: >-
            把拴着的马解开，把被捆的人放了。一些人打扫，一些人铺床，一些人做饭，一些人打水，其余的人出去迎接女主人。
        - id: ch04-b13
          speaker: narrator
          text: >-
            苏丹夫人和随行众人走进宅院，看见四壁华美的织物，还有为他们煮好的上等米饭，无不惊叹。
        - id: ch04-b14
          speakers: [wife, escort_lady, escort_servant]
          ensemble: chorus
          text: >-
            瞪羚啊，我们见过豪宅，见过世面，也听过许多奇事，可这样的宅子、这样的你，我们从没见过，也没听说过！
        - id: ch04-b15
          speaker: narrator
          text: >-
            迎亲队伍在宅子里住了几天。贵妇们惦记故乡，提出要回去。瞪羚舍不得这些客人，一遍又一遍地请她们多住些日子，可她们已经拿定主意。瞪羚只好打开库房，取出许多礼物。贵妇们每人得到一份，随行的奴仆也没有被遗漏。众人带着礼物离去时，都在心里认定，这只瞪羚比它的主人达赖苏丹伟大一千倍。

    - id: ch05
      title: 恩情的试验
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            瞪羚陪主人在宅子里住了许多星期。一天，它把老妇人叫到身旁，说出了压在心里的话。
        - id: ch05-b02
          speaker: gazelle
          text: >-
            我替主人做了这么多好事，他却从没问过，这座宅子从哪里来，原来的主人是谁，城里的人又去了哪里。他一天也没为我做过一件好事。人们说，只给一个人好处还不够，也得给他一点苦头，两人才会相安无事。所以，妈妈，我要试试看，我给过他的恩惠，能不能换来他的回报。
        - id: ch05-b03
          speaker: narrator
          text: >-
            老妇人听完，答应照它的意思办，两人便各自睡下。第二天天一亮，瞪羚果然病了。它肚子疼，身上发烧，两条腿也酸痛难忍。它叫来老妇人，请她上楼禀告主人，说瞪羚病得很重，从头到脚没有一处不痛。老妇人走上楼梯，来到主人房中。达赖苏丹和妻子正并肩坐在一张大理石长榻上，身边铺满柔软的靠垫。两人看见老妇人进来，便问她有什么事。
        - id: ch05-b04
          speaker: old_woman
          text: >-
            主人，瞪羚病得很重。它全身都疼，没有一处不痛。
        - id: ch05-b05
          speaker: poor_man
          text: >-
            那能怎么办？煮一碗红小米粥给它就是了。
        - id: ch05-b06
          speaker: wife
          text: >-
            主人，您怎么能给它吃连马都不肯吃的红小米？它不是普通的瞪羚，它是您的掌上明珠。眼睛里落一粒沙，都会叫您难受呀。
        - id: ch05-b07
          speaker: poor_man
          text: >-
            你疯了吗？米是留给人吃的。别再啰唆了。
        - id: ch05-b08
          speaker: narrator
          text: >-
            男人离开了房间。老妇人知道自己说什么都没用，哭着下楼。瞪羚请她无论消息是好是坏，都如实说出来。她只得把主人的话一一转述，也告诉它，女主人曾为它求情，说它虽有瞪羚的外表，心却胜过任何体面的绅士。
        - id: ch05-b09
          speaker: old_woman
          text: >-
            可主人说，他知道你的价钱。一枚八分币就买来了，失去你又算什么损失？
        - id: ch05-b10
          speaker: narrator
          text: >-
            瞪羚沉默了片刻。老人们常说：“待人像母亲一样好的人——”它如今终于明白了那句话的滋味。它请老妇人再上楼，说自己病得厉害，一口红小米粥也没喝。
        - id: ch05-b11
          speaker: poor_man
          text: >-
            老婆婆，闭上嘴，停住脚，闭紧眼睛，再用蜡堵上耳朵！它若叫你来，你就说腿弯了，走不动。它若叫你听，你就说耳朵堵死了。它若要讲话，你就说舌头被钩子钩住了。
          emotion: angry
        - id: ch05-b12
          speaker: narrator
          text: >-
            老妇人听到这些无情的话，眼里没有落泪，心里却哭了。她记得瞪羚最初来到这座空城时，明知可能丧命，仍肯拿自己的性命冒险，只为给主人换来财富。命运让它杀死大蛇，既保住了性命，也赢得整座宅院。可主人享受着这一切，如今却连最起码的敬重也不肯给它。坐在一旁的苏丹夫人同样泪流满面。她对丈夫说，看见他这样恶待瞪羚，自己实在替他感到难过。
        - id: ch05-b13
          speaker: poor_man
          text: >-
            别听女主人胡说。叫那只瞪羚滚到一边死去！它烦得我不能睡、不能吃，也不能喝。一只八分币买来的畜生，难道要从早到晚搅得我不得安宁？
          emotion: angry
        - id: ch05-b14
          speaker: narrator
          text: >-
            老妇人带着这番回答下楼。瞪羚仍躺在原处，病得比先前更重，鲜血正从两个鼻孔里流出来。老妇人心疼极了，俯身把它抱进怀中。她告诉瞪羚，它从前为主人做过的所有好事，如今看来全都白费了。到了这个地步，世上再没有别的办法，剩下的只有耐心忍受。
        - id: ch05-b15
          speaker: gazelle
          text: >-
            妈妈，我就要死了。心里的愤怒和苦涩快把我填满。我为主人做尽好事，他却用恶意回报，叫我羞得没脸见人。这宅子里的东西，我吃过什么？哪怕每天只吃半盆，他会因此变穷吗？老人们说过：“待人像母亲一样好的人——”请再告诉主人，瞪羚离死比离生更近了。
          emotion: sad
        - id: ch05-b16
          speaker: narrator
          text: >-
            老妇人又去传话，主人只叫她别再来烦他。妻子听得心如刀割。
        - id: ch05-b17
          speaker: wife
          text: >-
            瞪羚哪里得罪了您？有什么事没替您办好？它受到全城男女老幼的爱戴。您这样对它，只会招来众人的憎恨。我原以为您很有智慧，原来您连一点智慧也没有！
          emotion: angry
        - id: ch05-b18
          speaker: poor_man
          text: >-
            我的妻子，你疯了。
        - id: ch05-b19
          speaker: narrator
          text: >-
            老妇人转身下楼，女主人偷偷跟在后面。她唤来女仆，要她用牛奶和米饭给瞪羚做吃的。
        - id: ch05-b20
          speaker: wife
          text: >-
            再拿一块布给它盖上，把这个枕头垫在它头下。它若还需要什么，只管来问我，不要问主人。只要它愿意，我就用轿子送它去父亲那里，请父亲照料到它康复。
        - id: ch05-b21
          speaker: narrator
          text: >-
            女仆按照女主人的吩咐，用牛奶和米饭做好食物，又拿来布和枕头。她把东西一一安置妥当，也把女主人愿意照料它、愿意送它回父亲家的话完整说了一遍。瞪羚始终没有回答。它只是慢慢翻过身体，侧身躺下，随后安安静静地停止了呼吸。

    - id: ch06
      title: 梦醒以后
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            死讯传开，全城都哭了。达赖苏丹听着哭声，怒气冲冲地站起来。
        - id: ch06-b02
          speaker: poor_man
          text: >-
            你们哭那只瞪羚，竟像在哭我！说到底，它不过是一只我花八分币买来的瞪羚！
          emotion: angry
        - id: ch06-b03
          speaker: wife
          text: >-
            主人，我们怎样看您，也怎样看它。是它到父亲那里替您求婚，也是它把我从父亲家接来。父亲把我托付的人，正是它。
          emotion: sad
        - id: ch06-b04
          speaker: narrator
          text: >-
            百姓听了苏丹夫人的话，再也忍不住，一齐扬起声音。
        - id: ch06-b05
          speakers: [townsman_1, townsman_2]
          ensemble: duo
          text: >-
            我们从没见过您，我们见到的是瞪羚。在这里遭难的是它，在这里享受安乐的也是它。这样的一位离开人世，我们是在为自己哭，不是在为瞪羚哭。
          emotion: sad
        - id: ch06-b06
          speakers: [townsman_1, townsman_2]
          ensemble: duo
          text: >-
            它为您做了数不清的好事，谁说自己还能做得更多，谁就是骗子！我们从没为您做过好事，又会受到什么对待？它含恨死去，您还命人把它扔进井里。别管我们，让我们哭吧！
          emotion: angry
        - id: ch06-b07
          speaker: narrator
          text: >-
            百姓说了这么多，达赖苏丹一句也不肯听。他仍旧命令奴仆抬走瞪羚，把它扔进井里。妻子得知瞪羚受到了这样的对待，立即写信给父亲，又派出三个奴仆，让他们骑驴赶去送信。苏丹展开女儿的信，一字一句读完，便垂下头哭泣。他哭得那样伤心，就像刚刚失去了自己的母亲。哭过以后，他命人给马匹备好鞍具，又把总督、法官和城里所有富人召集到面前。
        - id: ch06-b08
          speaker: sultan
          text: >-
            都跟我来，我们去安葬它。
          emotion: sad
        - id: ch06-b09
          speaker: narrator
          text: >-
            一行人立刻动身。他们白天不停，夜里也不停，用最快的速度赶往达赖苏丹的城。终于，那口抛下瞪羚的井出现在他们眼前。这是一口围着巨大岩石修成的深井，里面十分宽阔，足以容纳许多人。苏丹亲自走进井里，法官和富人们紧随其后。瞪羚就躺在那里，一动不动。苏丹一看见它，眼泪再次涌出。他弯下腰，用双臂抱起瞪羚，亲自把它带离井底。
        - id: ch06-b10
          speaker: narrator
          text: >-
            三个奴仆把这件事告诉女主人，也说起众人怎样为瞪羚哭泣。
        - id: ch06-b11
          speaker: wife
          text: >-
            从瞪羚死去那天起，我没有吃过东西，也没有喝过水。我一句话都没说，一次也没笑过。
          emotion: sad
        - id: ch06-b12
          speaker: narrator
          text: >-
            苏丹带走瞪羚，亲自安排它的葬礼。他又下令，要全城百姓为瞪羚穿上丧服。于是接下来的许多天里，整座城都沉浸在深深的悲痛中。后来，服丧的日子终于结束。一天夜里，达赖苏丹的妻子睡在丈夫身旁。梦中，她发现自己离开了这座宅院，又回到父亲的王宫。等她睁开眼睛，眼前竟真是父亲的家。刚才发生的一切并不是梦。
        - id: ch06-b13
          speaker: narrator
          text: >-
            那个男人也梦见自己又蹲在垃圾堆旁，伸手翻找。他醒来一看，啊，那也不是梦，而是真的。
