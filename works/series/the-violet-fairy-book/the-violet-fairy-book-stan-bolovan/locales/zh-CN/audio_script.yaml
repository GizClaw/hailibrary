audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 编者
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清晰的成年男声
        pace: 从容舒展
        pitch: 中低音
    stan:
      display_name: 斯坦·博洛万
      tts:
        delivery: 机敏大胆，诓骗恶龙时沉着而带几分戏谑
        timbre: 温厚结实的成年男声
        pace: 适中
        pitch: 中低音
    wife:
      display_name: 斯坦的妻子
      tts:
        delivery: 真挚柔和，情绪坦率
        timbre: 温暖柔润的成年女声
        pace: 适中
        pitch: 中音
    wise_man:
      display_name: 智者
      tts:
        delivery: 郑重深思，劝诫时不疾不徐
        timbre: 低沉沧桑的老年男声
        pace: 舒缓
        pitch: 低音
    child_1:
      display_name: 孩子甲
      tts:
        delivery: 活泼直接，急不可耐
        timbre: 清亮稚嫩的童声
        pace: 较快
        pitch: 高音
    child_2:
      display_name: 孩子乙
      tts:
        delivery: 精神十足，热切执拗
        timbre: 明亮稚嫩的童声
        pace: 较快
        pitch: 高音
    child_3:
      display_name: 孩子丙
      tts:
        delivery: 大胆吵闹，顽皮爽快
        timbre: 轻快稚嫩的童声
        pace: 较快
        pitch: 中高音
    shepherd:
      display_name: 牧人
      tts:
        delivery: 疲惫朴实，直来直去
        timbre: 粗粝成熟的男声
        pace: 适中
        pitch: 中低音
    dragon:
      display_name: 恶龙
      tts:
        delivery: 得意时虚张声势，受挫时慌张畏缩
        timbre: 厚重洪亮的成年男声
        pace: 适中
        pitch: 低音
    dragon_mother:
      display_name: 恶龙的母亲
      tts:
        delivery: 尖刻贪婪，威吓时阴沉狠厉
        timbre: 苍老沙哑的女声
        pace: 稍慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 一百个孩子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，发生过的事就是发生过。要是没有发生，也就没有这个故事可讲了。村子边上有间小屋，门外是牛群被赶去吃草的地方，猪群也整天在那里游荡，用鼻子拱着树根。斯坦和妻子住在小屋里，日子本来很富足，妻子却从早到晚都愁眉不展。
        - id: ch01-b02
          speaker: stan
          text: >-
            好妻子，你这是怎么了？为什么总像低垂的玫瑰花苞一样耷拉着头？家里什么都不缺，你就不能像别的女人那样快活吗？
        - id: ch01-b03
          speaker: wife
          text: >-
            别管我，也别再问为什么。
          emotion: sad
        - id: ch01-b04
          speaker: narrator
          text: >-
            她说着便哭了。斯坦知道这时不该再问，只好去干活。可这件事一直压在他心里。几天后，他又问一次，妻子还是那句话。等他第三次开口，她终于转过身来。
        - id: ch01-b05
          speaker: wife
          text: >-
            天哪，你为什么不能让这件事过去呢？我一说出来，你就会和我一样难过。相信我吧，你不知道反而更好。
          emotion: sad
        - id: ch01-b06
          speaker: narrator
          text: >-
            可越是不让一个男人问，他越想把事情弄清楚。斯坦当然也不肯罢休。
        - id: ch01-b07
          speaker: wife
          text: >-
            好吧，你非知道不可，我就告诉你。这个家没有福气，一点也没有！
        - id: ch01-b08
          speaker: stan
          text: >-
            没有福气？咱家的母牛产奶最多，树上的果子和蜂箱里的蜜蜂一样满，谁家的麦田又比得上咱们？你怎么能说这种没道理的话？
        - id: ch01-b09
          speaker: wife
          text: >-
            这些都没错。可我们没有孩子。
          emotion: sad
        - id: ch01-b10
          speaker: narrator
          text: >-
            斯坦这才明白。有些事看明白以后，心里就再也安宁不了。从那天起，村边那间小屋里不再只有一个不快活的女人，又多了一个不快活的男人。妻子每天看着丈夫受苦，自己比从前更加难过。日子就这样过了一阵。
        - id: ch01-b11
          speaker: narrator
          text: >-
            几个星期后，斯坦去找一位智者。他走了整整一天，赶到时，那人正坐在门前。斯坦扑通跪下。
        - id: ch01-b12
          speaker: stan
          text: >-
            大人，请赐给我孩子吧！求您赐给我孩子！
        - id: ch01-b13
          speaker: wise_man
          text: >-
            你可要想清楚自己求的是什么。孩子会不会成为重担？你有钱给他们吃饭穿衣吗？
        - id: ch01-b14
          speaker: stan
          text: >-
            只要让我有孩子，我总会想出办法养活他们！
        - id: ch01-b15
          speaker: narrator
          text: >-
            智者抬手示意，斯坦便回家去了。傍晚，他满身尘土，累得两腿发沉，心里却充满希望。还没走到小屋，一大片人声就传进耳中。他抬头一看，花园里有孩子，院子里有孩子，每一扇窗户后面还有孩子。整座房子都被他们占满了，简直像全世界的孩子都挤到了他家。
        - id: ch01-b16
          speaker: narrator
          text: >-
            没有哪个孩子显得比另一个大，可他们偏偏又像一个比一个小。个个都比别人更吵、更放肆、更大胆。斯坦看着看着，终于明白这些全是自己的孩子，顿时吓得浑身发冷。
        - id: ch01-b17
          speaker: stan
          text: >-
            天哪！怎么有这么多，这么多！
          emotion: surprised
        - id: ch01-b18
          speaker: wife
          text: >-
            可一个也不算多呀。
          emotion: happy
        - id: ch01-b19
          speaker: narrator
          text: >-
            妻子笑着迎过来，裙边还攀着一大群孩子。没过几天，连她也发现，照顾一百个孩子真不容易。家里的食物很快就吃光了，孩子们不停地围着斯坦喊饿。
        - id: ch01-b20
          speakers: [child_1, child_2, child_3]
          ensemble: chorus
          text: >-
            爸爸，我们饿！我们饿！
        - id: ch01-b21
          speaker: narrator
          text: >-
            孩子们一声接一声地喊，斯坦抓着头皮，不知下一步该怎么办。他并不是嫌孩子太多，也从没想过少掉哪一个。自从他们来到家里，他的日子比从前快乐得多。可快乐填不饱一百个肚子。母牛已经没奶，果树又还远没到成熟的时候，他到哪里去找食物呢？
        - id: ch01-b22
          speaker: stan
          text: >-
            老伴儿，我得出去闯一闯，无论如何带些吃的回来。我还不知道上哪儿去找，可总得试试看。
        - id: ch01-b23
          speaker: narrator
          text: >-
            饥饿的人走哪条路都觉得远。斯坦还得想着，家里除他以外，另有一百个馋嘴的孩子。他走啊走，一直走到世界尽头。那里，存在的和不存在的混在一起。不远处有座羊圈，里面关着七只羊，其余羊群卧在树荫下。

    - id: ch02
      title: 石头里的酪乳
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            斯坦悄悄靠近，想趁人不注意诱走几只羊，再赶回家给孩子们充饥。可到了半夜，空中忽然响起一阵呼啸。一条恶龙飞下来，从羊群中赶走一只公羊、一只母羊和一只羊羔，又带走卧在旁边的三头肥牛。它还挤走七十七只羊的奶，送回家给年迈的母亲沐浴，好让她重新年轻。这样的事每晚都发生。
        - id: ch02-b02
          speaker: narrator
          text: >-
            牧人眼看自己的牲畜夜夜被抢走，只会徒劳地哀叹，恶龙却把他的痛苦当作笑话。斯坦看出，这地方根本不能让他安安稳稳地弄到食物。他知道自己几乎不可能打赢这么强大的怪物，可孩子们饥饿的模样像蒺藜一样黏在心头，怎么也甩不掉。最后，他还是转向了牧人。
        - id: ch02-b03
          speaker: stan
          text: >-
            我要是替你除掉那条恶龙，你肯给我什么？
        - id: ch02-b04
          speaker: shepherd
          text: >-
            每三只公羊给你一只，每三只母羊给你一只，每三只羊羔也给你一只。
        - id: ch02-b05
          speaker: stan
          text: >-
            好，一言为定。
        - id: ch02-b06
          speaker: narrator
          text: >-
            斯坦答应下来，却不知道即使打赢，自己怎么赶得动这么多羊。那件事可以以后再说，天已经快黑了，他得先想出对付恶龙的办法。正到半夜，一种从来没有过的恐惧突然抓住他。他连自己都说不清那是什么感觉，只觉得它逼着自己放弃争斗，沿最近的路逃回家。可刚转过半边身子，他又想起那一百个孩子。
        - id: ch02-b07
          speaker: stan
          text: >-
            不是你死，就是我亡。
        - id: ch02-b08
          speaker: narrator
          text: >-
            斯坦守在羊群边上。空中又响起呼啸声，恶龙正飞驰而过。
        - id: ch02-b09
          speaker: stan
          text: >-
            给我站住！
        - id: ch02-b10
          speaker: dragon
          text: >-
            哎呀！你是谁？从哪儿来的？
          emotion: surprised
        - id: ch02-b11
          speaker: stan
          text: >-
            我是斯坦·博洛万。夜里吃石头，白天嚼山花。你敢碰那些羊，我就在你背上刻个十字！
        - id: ch02-b12
          speaker: narrator
          text: >-
            恶龙直挺挺地停在路中间，以为自己遇上了真正的对手。
        - id: ch02-b13
          speaker: dragon
          text: >-
            那你得先打赢我。
          emotion: fearful
        - id: ch02-b14
          speaker: narrator
          text: >-
            它的声音都在发抖。别看恶龙有一身力气，只要真有人敢和它对面相持，它就一点也不勇敢。
        - id: ch02-b15
          speaker: stan
          text: >-
            我还用得着跟你打？一口气就能要你的命！去河里找块和这个一样的石头来，咱们马上比比谁才是真正的好汉。
        - id: ch02-b16
          speaker: narrator
          text: >-
            斯坦俯身拾起脚边一大块奶酪。恶龙当真跑到溪里，搬回一块石头。
        - id: ch02-b17
          speaker: stan
          text: >-
            你能从这块石头里挤出酪乳吗？
        - id: ch02-b18
          speaker: narrator
          text: >-
            恶龙单手抓起石头，使劲一捏，石头化成了粉末，却没有流出一滴酪乳。
        - id: ch02-b19
          speaker: dragon
          text: >-
            我当然挤不出来！
          emotion: angry
        - id: ch02-b20
          speaker: stan
          text: >-
            你办不到，我可办得到。
        - id: ch02-b21
          speaker: narrator
          text: >-
            他用力一捏奶酪，酪乳立刻从指缝里淌下来。恶龙见了，转身就想回家，斯坦却拦住它。
        - id: ch02-b22
          speaker: stan
          text: >-
            别急。你在这里干过的那些事，我们还没算账呢。
        - id: ch02-b23
          speaker: narrator
          text: >-
            可怜的恶龙吓得不敢动，唯恐斯坦一口气杀了它，再埋进山间牧场的花丛里。
        - id: ch02-b24
          speaker: dragon
          text: >-
            听我说，你很有本事，我母亲正缺你这样的人。到她手下干三天怎么样？这三天抵得上你们的一年，她每天付你满满七袋金币。
        - id: ch02-b25
          speaker: narrator
          text: >-
            三天，每天七袋，那就是整整二十一袋金币！斯坦抵挡不住这样的诱惑。他一句废话也没说，只朝恶龙点了点头，便跟它一同上路。前面的路很长很长，他们走了许久，才终于到达恶龙的家。

    - id: ch03
      title: 三场力气比试
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            恶龙的母亲早就在等他们。她老得和岁月一样，眼睛从远处望去像两盏灯。斯坦跟着恶龙走进屋，看见火上架着一口巨锅，里面装满了牛奶。老母亲发现儿子竟然空着手回来，顿时大发雷霆，鼻孔里又喷火又冒焰。可她还没来得及说话，恶龙已经转向斯坦，叫他留在原处等着，自己要去向母亲解释。
        - id: ch03-b02
          speaker: dragon
          text: >-
            母亲，我把这个人带回来，就是想除掉他。他厉害极了，不光会吃石头，还能从石头里挤出酪乳。
        - id: ch03-b03
          speaker: narrator
          text: >-
            恶龙把前一夜的事全讲了一遍。
        - id: ch03-b04
          speaker: dragon_mother
          text: >-
            把他交给我！还从没有哪个男人能逃出我的手掌心。
        - id: ch03-b05
          speaker: narrator
          text: >-
            斯坦就这样被留下来服侍老母亲。他早已后悔来到这种地方，可既然走不了，也只能把一切都平静地接下来，决不能让它们看出自己害怕。第二天，老母亲要他和儿子比比谁的力气大，还从墙上取下一根缠着整整七道铁箍的巨棒。恶龙拿起它，就像捻起一根羽毛。它把棒子在头顶转了几圈，轻轻抛出三英里远，又得意地叫斯坦有本事就超过它。
        - id: ch03-b06
          speaker: narrator
          text: >-
            他们走到巨棒落下的地方。斯坦俯身摸了摸，心里顿时害怕起来。他知道，就算自己和所有孩子一起动手，也休想把它抬离地面。
        - id: ch03-b07
          speaker: dragon
          text: >-
            你在那里做什么？
        - id: ch03-b08
          speaker: stan
          text: >-
            我在想，这棒子真漂亮，可惜马上就要害你丢掉性命了。
        - id: ch03-b09
          speaker: dragon
          text: >-
            它怎么会害我丢命？
        - id: ch03-b10
          speaker: stan
          text: >-
            我怕一扔出去，你就再也见不到明天的太阳。你根本不知道我的力气有多大！
        - id: ch03-b11
          speaker: dragon
          text: >-
            别说那些了，快扔吧。
        - id: ch03-b12
          speaker: stan
          text: >-
            你要真想看，那咱们先吃喝三天。这样至少能让你多活三天。
        - id: ch03-b13
          speaker: narrator
          text: >-
            斯坦说得那么平静，恶龙这回真有些发慌，却还不完全相信事情会有他说的那么严重。两人回到屋里，把老母亲储藏室里能找到的食物全拿出来，又一起搬回巨棒落下的地方。斯坦往装食物的口袋上一坐，一声不出，只管望着渐渐西沉的月亮。
        - id: ch03-b14
          speaker: dragon
          text: >-
            你又在做什么？
        - id: ch03-b15
          speaker: stan
          text: >-
            等月亮从前面让开。
        - id: ch03-b16
          speaker: dragon
          text: >-
            什么意思？我听不明白。
        - id: ch03-b17
          speaker: stan
          text: >-
            你没看见月亮正挡着我吗？你要是愿意，我也可以把巨棒直接扔到月亮上。
        - id: ch03-b18
          speaker: narrator
          text: >-
            恶龙又不安起来。这根棒子是祖父留下的，它可不想让宝贝丢在月亮上。
        - id: ch03-b19
          speaker: dragon
          text: >-
            要不这样，棒子你别扔了。让我再扔一次，也一样能比出高下。
        - id: ch03-b20
          speaker: stan
          text: >-
            那可不行。等月亮落下去再说。
        - id: ch03-b21
          speaker: narrator
          text: >-
            恶龙怕他来真的，只好答应送七袋金币，斯坦才让它自己把棒子扔回去。
        - id: ch03-b22
          speaker: dragon
          text: >-
            母亲，那个人的力气真大！我费了好大工夫，才没让他把巨棒扔到月亮上去！
        - id: ch03-b23
          speaker: narrator
          text: >-
            老母亲也不安了。能把东西扔到月亮上，可不是闹着玩的。于是，谁也不再提巨棒。第二天一早，老母亲又命令他们去打水，还交出十二张水牛皮，要他们不停灌到天黑。
        - id: ch03-b24
          speaker: narrator
          text: >-
            恶龙眨眼间就把十二张皮囊灌满，搬回屋里，又把空皮囊拿给斯坦。斯坦连空的都快提不动，想到装满水的分量，心里直打寒战。可他只掏出一把旧刀，在溪边刨起土来。
        - id: ch03-b25
          speaker: dragon
          text: >-
            你刨土干什么？水要怎么搬进屋？
        - id: ch03-b26
          speaker: stan
          text: >-
            这还不容易？我把整条溪搬走就是了！
        - id: ch03-b27
          speaker: narrator
          text: >-
            恶龙惊得下巴都垂了下来。从它祖父的时代起，这条溪就在这里，它从没想过有人要把溪搬走。
        - id: ch03-b28
          speaker: dragon
          text: >-
            这样吧，让我替你搬皮囊。
        - id: ch03-b29
          speaker: stan
          text: >-
            绝对不行。
        - id: ch03-b30
          speaker: narrator
          text: >-
            斯坦继续挖土。恶龙害怕他真搬走小溪，又拿好处求他。它答应再送七袋金币，斯坦才收起旧刀，让恶龙替自己把水搬回去。
        - id: ch03-b31
          speaker: narrator
          text: >-
            第三天，老母亲派斯坦进森林砍柴，恶龙照例跟着。还没数到三，恶龙已经连根拔起一大片树。那数量之多，斯坦砍一辈子也砍不完。恶龙还把树木整整齐齐排成一行。等它忙完，斯坦先朝四周仔细看了看，然后挑中最大的一棵树爬上去，扯下一根长长的野藤，把它的树梢和旁边那棵绑在一起，接着又去绑整排树木。
        - id: ch03-b32
          speaker: dragon
          text: >-
            你在那里做什么？
        - id: ch03-b33
          speaker: stan
          text: >-
            你自己不会看吗？
        - id: ch03-b34
          speaker: dragon
          text: >-
            为什么把树全绑在一起？
        - id: ch03-b35
          speaker: stan
          text: >-
            免得多费力气。我拔起一棵，其余的自然一起出来。
        - id: ch03-b36
          speaker: dragon
          text: >-
            可你怎么把它们搬回家？
        - id: ch03-b37
          speaker: stan
          text: >-
            你还不明白？我要把整座森林一块儿带回去！
        - id: ch03-b38
          speaker: narrator
          text: >-
            斯坦说着，又把两棵树绑在了一起。恶龙想到整座森林被搬走，吓得浑身发抖。
        - id: ch03-b39
          speaker: dragon
          text: >-
            让我替你搬木头吧！我给你七七四十九袋金币！
          emotion: fearful
        - id: ch03-b40
          speaker: stan
          text: >-
            你真是个好家伙，那就照你说的办。
        - id: ch03-b41
          speaker: narrator
          text: >-
            于是，恶龙替斯坦搬走了木头。三天的差事到此结束，算起来正好一年。斯坦眼下只担心一件事，他怎样才能把这么多金币带回家呢？

    - id: ch04
      title: 一只厉害的跳蚤
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            那天晚上，恶龙和母亲谈了很久。它们不知道，斯坦正隔着天花板上的裂缝，把每个字都听进耳里。
        - id: ch04-b02
          speaker: dragon
          text: >-
            母亲，我们要大祸临头了。这个人很快就会把咱们制住。把钱给他，让他走吧。
          emotion: fearful
        - id: ch04-b03
          speaker: narrator
          text: >-
            老母亲舍不得自己的钱。
        - id: ch04-b04
          speaker: dragon_mother
          text: >-
            你听着，今晚一定要杀了他。
        - id: ch04-b05
          speaker: dragon
          text: >-
            我害怕。
          emotion: fearful
        - id: ch04-b06
          speaker: dragon_mother
          text: >-
            没什么可怕的。等他睡着，拿巨棒朝他脑袋砸下去，这还不容易？
        - id: ch04-b07
          speaker: narrator
          text: >-
            要是斯坦没听见，这个办法确实会奏效。等恶龙母子熄了灯，他搬来猪食槽，往里装满泥土，摆在床上，再盖好被子。自己却钻到床底下，故意大声打鼾。
        - id: ch04-b08
          speaker: narrator
          text: >-
            没过多久，恶龙轻手轻脚地溜进来，朝斯坦脑袋本该躺着的地方狠狠砸了一棒。斯坦躲在床下故意发出一声响亮的呻吟，恶龙以为事情办成，又像来时那样悄悄退了出去。门刚关上，斯坦立刻搬走装满泥土的猪食槽，把床铺和房间收拾得干干净净，自己躺了回去。可他知道危险还没过去，那一夜始终睁着眼睛，一刻也没有睡。
        - id: ch04-b09
          speaker: narrator
          text: >-
            第二天早晨，恶龙和母亲正在吃饭，斯坦走进屋里。
        - id: ch04-b10
          speaker: stan
          text: >-
            早上好。
        - id: ch04-b11
          speaker: dragon
          text: >-
            早上好。昨晚睡得怎么样？
        - id: ch04-b12
          speaker: stan
          text: >-
            睡得好极了。不过我梦见被跳蚤咬了一口，到现在好像还有感觉。
        - id: ch04-b13
          speaker: narrator
          text: >-
            恶龙和母亲互相看了一眼。
        - id: ch04-b14
          speaker: dragon
          text: >-
            听见了吗？他居然说是跳蚤。我明明把巨棒都砸断在他脑袋上了。
          emotion: fearful
        - id: ch04-b15
          speaker: narrator
          text: >-
            老母亲这下也怕得和儿子一样。碰上这样一个连巨棒砸头都只当跳蚤咬的人，它们根本没有办法。她赶紧把金币装进口袋，只盼尽快送走斯坦。可斯坦站在一旁，也抖得像片杨树叶。他不是舍不得走，而是发现自己连一袋金币都提不离地面。眼前摆着这么多财宝，他只能一动不动地望着。
        - id: ch04-b16
          speaker: dragon
          text: >-
            你站在那里干什么？
        - id: ch04-b17
          speaker: stan
          text: >-
            我刚刚想到，还是留下来再替你们干一年吧。我只带这么点东西回家，实在丢脸。人们准会喊：“快看斯坦·博洛万！才干了一年，他就弱得和恶龙一样了！”
        - id: ch04-b18
          speaker: narrator
          text: >-
            恶龙和母亲听说他还要留下，同时发出一声惊恐的尖叫。它们宁可舍掉更多财宝，也不愿再让这个可怕的人住上一夜。只要斯坦肯马上离开，别说把口袋数加到七倍，哪怕七倍以后再乘七倍，它们都愿意答应。
        - id: ch04-b19
          speaker: stan
          text: >-
            好吧，我看得出你们不愿留我，我也不想惹人厌烦。我马上就走。不过，你得亲自把钱送到我家，免得我在朋友面前丢脸。
        - id: ch04-b20
          speaker: narrator
          text: >-
            话音还没落，恶龙已经抓起口袋，一袋袋摞到背上。它和斯坦就这样上路了。

    - id: ch05
      title: 恶龙肉
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            从恶龙家到村子其实不算远，对又饿又累的斯坦来说，这段路却长得走不完。终于，他听见孩子们的声音，赶紧停住脚步。他不能让恶龙知道自己住在哪里。万一怪物哪天后悔，又回来讨还财宝呢？眼看家就在前面，他却必须先甩掉身后的恶龙。该说什么才好？斯坦忽然有了主意，转过身去。
        - id: ch05-b02
          speaker: stan
          text: >-
            我真不知道怎么办才好。我有一百个孩子，个个都爱打架，只怕他们会伤到你。不过，我一定尽力保护你。
        - id: ch05-b03
          speaker: narrator
          text: >-
            一百个孩子！那可不是闹着玩的。恶龙吓得浑身一抖，背上的金币全掉在地上。它慌忙把口袋一只只捡起来，重新背好。可孩子们自从父亲离开后一直没有东西吃，早就饿坏了。他们一看见斯坦，立刻一窝蜂地冲过来，右手挥着刀，左手高举着叉。
        - id: ch05-b04
          speakers: [child_1, child_2, child_3]
          ensemble: chorus
          text: >-
            给我们恶龙肉！我们要吃恶龙肉！
        - id: ch05-b05
          speaker: narrator
          text: >-
            恶龙看到这一幕，再也不敢多停一刻。它连背上的财宝也顾不得了，把所有口袋扔在原地，转身使出全身力气逃命。想到那些刀叉和等待自己的下场，它一路吓得魂飞魄散。从那天起，这条恶龙再也不敢到世上露面。
        - id: ch05-b06
          speaker: narrator
          text: >-
            这个故事改编自《罗马尼亚童话》。
