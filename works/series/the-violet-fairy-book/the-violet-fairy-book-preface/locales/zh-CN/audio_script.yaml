audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 编者
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清晰的成年男声
        pace: 从容舒展
        pitch: 中低音
    lady:
      display_name: 女士
      tts:
        delivery: 礼貌而好奇的询问
        timbre: 清亮自然的成年女声
        pace: 适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 这些故事是谁写的
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            我想借这个机会，把从前说过许多遍的话再讲一遍。《彩色童话集》里的故事不是我写的，更不是我凭空想出来的。可是，常有女士这样问我。
        - id: ch01-b02
          speaker: lady
          text: >-
            除了《彩色童话集》，您还写过别的东西吗？
        - id: ch01-b03
          speaker: narrator
          text: >-
            每到这时候，我只好解释，这些童话并非出自我的手笔。除了童话，我几乎什么都写过，只是没写过赞美诗、布道词和戏剧。
    - id: ch02
      title: 古老的民间故事
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            这本《紫色童话集》和本系列的其他书一样，收的都是从许多种语言流传下来的民间故事。它们古老极了。赤身裸体的蛮荒妇女曾把它们讲给赤身裸体的蛮荒孩子听，我们最早开化的祖先也把它们一代代传下来。那时的人真心相信，野兽、树木和石头只要愿意，就能说话，也会对人和善，或对人不怀好意。
        - id: ch02-b02
          speaker: narrator
          text: >-
            那是科学还不存在、魔法代替科学的年代，所以这些故事里处处都是最古老的观念。要是你有兴趣，不妨读读《澳大利亚传说故事》。兰洛·帕克夫人从澳大利亚原住民口中采集了那些故事，你会发现，它们和我们自己的童话十分相像。
        - id: ch02-b03
          speaker: narrator
          text: >-
            最早是谁编出这些故事的，没有人知道，大概就是最早的男人和女人吧。也许夏娃还曾讲给该隐和亚伯听，逗他们开心。后来，人渐渐开化，有了国王、王后、王子和公主，这些尊贵人物往往就成了故事的主角。可在起初，人物只是一个男人、一个女人、一个男孩和一个女孩。他们身边还有成群的走兽、飞鸟和游鱼，个个像人一样行事。
        - id: ch02-b04
          speaker: narrator
          text: >-
            等贵族和其他人富裕起来，又受了教育，他们便忘了老故事。乡下人却一直记得，还随自己的心意改动，再一代代讲下去。后来，学者把这些故事搜集起来，印成了书，我们又把它们译出来，给孩子们消遣。孩子的趣味似乎还和几千年前那些赤身裸体的祖先相仿。比起历史、诗歌、地理和算术，他们还是更爱童话，就像大人总把小说看得比别的书更有趣。
        - id: ch02-b05
          speaker: narrator
          text: >-
            事情的真相就是这样。我以前说过，现在再说一次。可不管怎样解释，孩子们还是会认定故事是我编的，有些女士也照样这么想。真正编出这些故事的人，谁也说不清。那实在是太久以前的事了，比读书写字出现的年代还早。最早真正写下来的故事，有的用了埃及象形文字，有的刻在巴比伦泥板上，离我们已有三四千年。
    - id: ch03
      title: 本书的译者与来源
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            本书当中，《长鼻子小矮人》《神奇的乞丐》《琵琶手》《一袋装两个》和《在空中游泳的鱼》是布莱克利小姐翻译的。W. A. 克雷吉先生从斯堪的纳维亚语译出了《牧兔人贾斯珀》，剩下的故事都由兰夫人翻译。
        - id: ch03-b02
          speaker: narrator
          text: >-
            书里有几篇格外有趣的故事来自罗马尼亚。还有三篇，先前曾收入已故斯蒂尔博士的《斯瓦希里故事》。得到他的继承人许可后，我们把这三篇非洲故事略作删节，也写得简明一些，好让孩子们阅读。
