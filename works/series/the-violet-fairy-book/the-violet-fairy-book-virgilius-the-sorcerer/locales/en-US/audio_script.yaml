  chapters:
    - id: ch01
      title: The Voice Beneath the Mountain
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long, long ago, a son was born to a Roman knight and his wife, Maja. They named him Virgilius. His father died while he was still very young. The family's kinsmen should have helped and protected the widow and her child. Instead, they stole their land and money. Maja feared they might take her son's life next, so she sent him far away to study at the great university in Toledo, Spain.
        - id: ch01-b02
          speaker: narrator
          text: Virgilius loved books and spent whole days bent over them. Then one afternoon, the students were given a holiday. He went out for a long walk and wandered into a place he had never seen. A cave opened before him, and what boy can see a cave without going in? Virgilius stepped inside.
        - id: ch01-b03
          speaker: narrator
          text: The passage seemed to run deep into the heart of the mountain. Virgilius wondered whether it came out on the other side, so he kept walking through pitch darkness. At last, a faint light crossed the floor. From somewhere nearby, a voice called his name.
        - id: ch01-b04
          speaker: evil_spirit
          text: Virgilius! Virgilius!
        - id: ch01-b05
          speaker: virgilius
          text: Who is calling me?
        - id: ch01-b06
          speaker: evil_spirit
          text: Look at the ground where you stand. Do you see a sliding bolt there?
        - id: ch01-b07
          speaker: virgilius
          text: Yes, I see it.
        - id: ch01-b08
          speaker: evil_spirit
          text: Then pull it back and let me out.
        - id: ch01-b09
          speaker: virgilius
          text: First tell me who you are.
        - id: ch01-b10
          speaker: evil_spirit
          text: I am an evil spirit, and I must stay shut in here until Doomsday unless a man frees me. Let me out, and I will give you books of magic. They will make you wiser than any man alive.
        - id: ch01-b11
          speaker: narrator
          text: Virgilius longed for wisdom, and the promise tempted him. But his usual caution came to his aid. Before he would touch the bolt, he demanded the books and made the spirit explain how to use their magic. The spirit was helpless inside the hole, so it had to obey. Only then did Virgilius draw back the bolt.
        - id: ch01-b12
          speaker: narrator
          text: Beneath it was a tiny opening. The spirit slowly wriggled out, twisting and squeezing until it stood on the ground. It was black as coal and almost three times as large as Virgilius.
        - id: ch01-b13
          speaker: virgilius
          text: You could not possibly have been that big while you were inside that hole!
          emotion: surprised
        - id: ch01-b14
          speaker: evil_spirit
          text: But I was!
        - id: ch01-b15
          speaker: virgilius
          text: I do not believe you.
        - id: ch01-b16
          speaker: evil_spirit
          text: Then I will climb back in and prove it.
        - id: ch01-b17
          speaker: narrator
          text: The spirit turned and twisted and curled itself tight. Soon it lay neatly packed inside the hole once more. Virgilius slid the bolt into place, tucked the magic books under his arm, and walked out of the cave.
        - id: ch01-b18
          speaker: narrator
          text: For the next few weeks, he scarcely ate or slept. He was too busy mastering the magic in those books.
    - id: ch02
      title: Virgilius Returns to Rome
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Then a messenger arrived from Maja. She had been ill and could no longer manage their affairs, so she begged her son to return to Rome at once. Virgilius was sorry to leave Toledo. The people there thought highly of him and expected him to become a great scholar. He would gladly have left at once, but first he had many things to arrange.
        - id: ch02-b02
          speaker: narrator
          text: He sent four packhorses loaded with treasures ahead with the messenger, as well as a white palfrey for his mother to ride each day. After making his own preparations, Virgilius set out with a great company of scholars. He had been away from Rome for twelve years.
        - id: ch02-b03
          speaker: narrator
          text: His mother welcomed him with tears. His poorer kinsmen crowded around, but the rich ones stayed away. They feared he would stop them from robbing him as they had for years. Virgilius said nothing about their behavior, though he saw their envy when he gave rich presents to his poor relations and to everyone who had treated his mother kindly.
        - id: ch02-b04
          speaker: narrator
          text: Soon it was time to collect taxes, and every landowner had to appear before the emperor. Virgilius went to court with the others and asked for justice against the men who had stolen from him. Those men were related to the emperor, however. The emperor said he would consider the matter for four years before giving judgment.
        - id: ch02-b05
          speaker: narrator
          text: That answer did not satisfy Virgilius. He turned away, went home, gathered his harvest, and stored it in his houses. When his enemies heard, they joined forces and surrounded his castle.
        - id: ch02-b06
          speaker: narrator
          text: Virgilius came out to face them. With one spell, he held every attacker so still that no one could move. He defied them, then released them. The defeated army crept back to Rome and carried his words to the emperor.
        - id: ch02-b07
          speaker: narrator
          text: The emperor was used to seeing his smallest command obeyed almost before he spoke it. He could hardly believe the report his defeated soldiers brought him. He gathered a second army himself and marched straight to Virgilius's castle. As soon as the soldiers took their places around it, Virgilius made a broad river circle them. They could not move hand or foot.
        - id: ch02-b08
          speaker: narrator
          text: Virgilius called to the emperor, offering peace and asking for his friendship. The emperor was too angry to listen. At last Virgilius lost patience. He gave a feast to his own followers while the trapped army watched, hungry and unable to stir.
        - id: ch02-b09
          speaker: narrator
          text: Just when matters seemed desperate, another magician entered the camp and offered his help to the emperor. The offer was gladly accepted. In a moment, everyone inside the castle dropped as if dead. Even Virgilius could barely keep his eyes open.
        - id: ch02-b10
          speaker: narrator
          text: He did not know how to fight this magic. With a tremendous effort, he opened his Black Book and found the spell he needed. At once, all his enemies became as still as stone. Some froze halfway up their ladders. Others stopped with one foot already over the wall. The emperor and his magician were caught with the rest. Wherever each man happened to be, there he stayed.
        - id: ch02-b11
          speaker: narrator
          text: All day they clung there like flies on a wall. After nightfall, Virgilius slipped quietly over to the emperor. He offered to free him if the emperor would finally give him justice. Thoroughly frightened, the emperor promised to grant whatever Virgilius asked.
        - id: ch02-b12
          speaker: narrator
          text: Virgilius removed the spells. Then he fed the whole army, gave every man a present, and sent them back to Rome. He even built the emperor a square tower. From any corner, a listener could hear everything said in that quarter of the city. Anyone standing in the center could hear every whisper throughout Rome.
    - id: ch03
      title: The Basket Above the Market
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Once his quarrel with the emperor and his enemies was settled, Virgilius could think about other things. The first thing he did was fall in love. The lady was named Febilla. She came from a noble family and was said to have the fairest face in Rome. But she only mocked Virgilius and delighted in playing tricks on him.
        - id: ch03-b02
          speaker: narrator
          text: One day, Febilla invited him to visit her in the tower where she lived. She promised to lower a basket and pull him all the way up to the roof. Virgilius was enchanted by this unexpected favor. He happily stepped into the basket, and it began to rise very slowly.
        - id: ch03-b03
          speaker: narrator
          text: Halfway up, the basket stopped. Virgilius was left dangling high above the marketplace. Then Febilla's voice rang down from the tower.
        - id: ch03-b04
          speaker: febilla
          text: You rogue of a sorcerer! That is where you shall hang!
        - id: ch03-b05
          speaker: narrator
          text: And there he hung. The marketplace filled with people, and they laughed at him until he was wild with rage. At last, the emperor heard what had happened and ordered Febilla to lower him. Virgilius returned home, swearing revenge.
        - id: ch03-b06
          speaker: narrator
          text: The next morning, every fire in Rome went out. There were no matches in those days, so the whole city was in serious trouble. The emperor guessed whose magic had done it and begged Virgilius to end the spell.
        - id: ch03-b07
          speaker: narrator
          text: Virgilius ordered a platform built in the marketplace. Febilla was brought there wearing only a single white garment. He commanded each person to take fire from her, and forbade anyone to light a neighbor's flame.
        - id: ch03-b08
          speaker: narrator
          text: When Febilla appeared in her white smock, flames curled around her. The Romans came with torches, straw, and wood shavings. One by one, the fires of Rome began to burn again.
        - id: ch03-b09
          speaker: narrator
          text: Febilla stood there for three days, until every hearth in the city was alight. Only then was she allowed to leave.
        - id: ch03-b10
          speaker: narrator
          text: The emperor was furious at Virgilius for taking such revenge. He threw the sorcerer into prison and swore that he would die. When all was ready, the guards led Virgilius to the Viminal Hill for his execution.
        - id: ch03-b11
          speaker: narrator
          text: Virgilius walked quietly beside them. The day was hot, and when they reached the place where he was to die, he asked for water. Someone brought him a pail.
        - id: ch03-b12
          speaker: virgilius
          text: Hail, Emperor! If you want me, look for me in Sicily!
        - id: ch03-b13
          speaker: narrator
          text: Virgilius plunged headfirst into the pail and vanished before their eyes.
    - id: ch04
      title: The Preservation of Rome
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: For a while, the stories say nothing more about Virgilius or how he made peace with the emperor. The next thing we hear is that the emperor summoned him to the palace. Rome needed protection from enemies both inside and outside its walls, and the emperor wanted his advice.
        - id: ch04-b02
          speaker: narrator
          text: Virgilius thought for many days. At last, he devised a wonder that everyone called the Preservation of Rome. On the roof of the Capitol, the city's most famous public building, he placed statues of the gods worshipped by every nation under Roman rule. In their midst stood the goddess of Rome herself.
        - id: ch04-b03
          speaker: narrator
          text: Each conquered god held a bell. If anyone in its country so much as thought of treason, that statue turned its back on Rome's goddess and rang the bell furiously. Senators would come hurrying to the roof to discover which nation dared rebel against the empire. Then they could ready their armies and march against the enemy.
        - id: ch04-b04
          speaker: narrator
          text: One country had long been bitterly jealous of Rome and wanted to destroy it. Its people chose three men they could trust, loaded them with money, and sent them to the city. The men were to pretend they could read the meaning of dreams.
        - id: ch04-b05
          speaker: narrator
          text: As soon as the three reached Rome, they slipped out at night. They buried one pot of gold deep beneath the foot of a hill. They lowered another into the Tiber, close to a bridge across the river.
        - id: ch04-b06
          speakers: [diviner_one, diviner_two, diviner_three]
          ensemble: chorus
          text: Noble lords, we dreamed last night that a pot of gold lies buried at the foot of a hill. Will you permit us to dig for it?
        - id: ch04-b07
          speaker: narrator
          text: The senators gave permission in the senate house, where the laws of Rome were made. The three men hired workers, dug up the gold, and celebrated with it.
        - id: ch04-b08
          speakers: [diviner_one, diviner_two, diviner_three]
          ensemble: chorus
          text: Noble lords, please let us search for another treasure. A dream showed us that it lies beneath the bridge over the river.
        - id: ch04-b09
          speaker: narrator
          text: Again, the senators agreed. The messengers hired boats and men. They dropped ropes fitted with hooks into the water and finally hauled up the second pot. They gave some of its gold to the senators as presents.
        - id: ch04-b10
          speaker: narrator
          text: A week or two passed. Then the three supposed diviners returned to the senate house one last time.
        - id: ch04-b11
          speakers: [diviner_one, diviner_two, diviner_three]
          ensemble: chorus
          text: Noble lords, last night we saw twelve casks of gold beneath the foundation stone of the Capitol, right under the statue that preserves Rome. Your kindness has made us rich through our earlier dreams. To thank you, we wish to give this third treasure entirely to you. Give us workers, and we will begin at once.
        - id: ch04-b12
          speaker: narrator
          text: The senators granted their request. The men began digging. When they had almost hollowed out the ground beneath the Capitol, they secretly fled the city.
        - id: ch04-b13
          speaker: narrator
          text: The next morning, the foundation stone gave way. The sacred statue fell face-first and shattered. The senators understood that their own greed had ruined them.
        - id: ch04-b14
          speaker: narrator
          text: From that day, Rome went from bad to worse. Every morning, crowds came before the emperor with reports of robberies, murders, and other crimes committed in the streets at night. More than anything, the emperor wanted his subjects safe. He asked Virgilius how the violence could be stopped.
        - id: ch04-b15
          speaker: narrator
          text: Virgilius considered the problem for a long while. Then he gave his answer.
        - id: ch04-b16
          speaker: virgilius
          text: Great prince, have a copper horse and rider made and set them before the Capitol. Proclaim that a bell will ring at ten each night. At that hour, every man must enter his home and stay there.
        - id: ch04-b17
          speaker: narrator
          text: The emperor followed his advice. The thieves and murderers only laughed at the copper horse, and they carried on as before. But when the bell struck its final note, the horse charged through the streets at full gallop. At dawn, more than two hundred bodies lay beneath its hoofs.
        - id: ch04-b18
          speaker: narrator
          text: Many thieves still remained. Instead of giving up their crimes, they made rope ladders with hooks. Whenever they heard the horse coming, they fastened the ladders to the walls and climbed beyond the reach of horse and rider.
        - id: ch04-b19
          speaker: narrator
          text: The emperor then ordered two copper dogs to be made. They ran behind the horse. When thieves hanging from the walls mocked Virgilius and the emperor, the dogs leaped up, dragged them down, and bit them to death.
        - id: ch04-b20
          speaker: narrator
          text: In this way, Virgilius brought peace and order back to Rome.
    - id: ch05
      title: The Airy Bridge to Babylon
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Around this time, stories began to spread about the daughter of the sultan who ruled the province of Babylon. People said she was the most beautiful princess in the world. Virgilius heard the same tales as everyone else. He fell so deeply in love with what he heard that he built a bridge through the air, stretching all the way from Rome to Babylon.
        - id: ch05-b02
          speaker: narrator
          text: Virgilius crossed his bridge and visited the princess. She was rather surprised to see him, but she welcomed him. As they talked, she grew eager to see the faraway country where this stranger lived. Virgilius promised to carry her there himself without letting the soles of his feet touch water.
        - id: ch05-b03
          speaker: narrator
          text: The princess spent several days in Virgilius's palace. She saw wonders she had never dreamed of, though she refused all the presents he wished to shower upon her. The hours seemed to pass like minutes. At last, she said she could not stay away from her father any longer.
        - id: ch05-b04
          speaker: narrator
          text: Virgilius carried her back across the bridge in the air. He gently laid her on her own bed, and her father found her there the following morning.
        - id: ch05-b05
          speaker: narrator
          text: The princess told the sultan everything that had happened. He pretended to be deeply interested. He asked her to introduce him the next time Virgilius came.
        - id: ch05-b06
          speaker: narrator
          text: Before long, the sultan received word from his daughter that the stranger had returned. He ordered servants to prepare a feast. Then he called for the princess and placed a cup in her hands. He told her to present it to Virgilius herself as a mark of honor.
        - id: ch05-b07
          speaker: narrator
          text: When everyone was seated at the feast, the princess rose and offered Virgilius the cup. The moment he drank from it, he fell into a deep sleep. The sultan ordered his guards to tie him up and leave him there until the next day.
        - id: ch05-b08
          speaker: narrator
          text: Early the following morning, the sultan summoned his lords and nobles to the great hall. He had the ropes removed and Virgilius brought before him. As soon as the prisoner appeared, the sultan burst into a rage. He accused Virgilius of carrying the princess to a distant land without her father's permission.
        - id: ch05-b09
          speaker: virgilius
          text: If I carried her away, I also brought her home. I could have kept her, but I did not. Set me free to return to my own country, and I will never come here again.
        - id: ch05-b10
          speaker: sultan
          text: No! You will die, and your death will be a shameful one!
          emotion: angry
        - id: ch05-b11
          speaker: narrator
          text: The princess fell to her knees and begged to die beside Virgilius.
        - id: ch05-b12
          speaker: virgilius
          text: You have counted badly, Sir Sultan!
        - id: ch05-b13
          speaker: narrator
          text: Virgilius had lost all patience. He cast a spell over the sultan and his lords. Suddenly they believed that Babylon's great river was rushing through the hall and that they must swim for their lives. While they plunged and leaped like frogs and fishes, Virgilius lifted the princess into his arms. He carried her across the airy bridge and brought her safely to Rome.
    - id: ch06
      title: The Wonder of Naples
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Virgilius decided that neither his palace nor even Rome itself was good enough to hold such a pearl as the princess. So he built an entire city for her. Its foundations rested on eggs buried far below, in the depths of the sea.
        - id: ch06-b02
          speaker: narrator
          text: Within the city stood a square tower. On its roof rose an iron rod. Across the rod, Virgilius laid a bottle. On the bottle he balanced an egg, and from that egg an apple hung by a chain.
        - id: ch06-b03
          speaker: narrator
          text: The apple hangs there to this day. Whenever the egg shakes, the city quakes. When the egg finally breaks, the city will be destroyed.
        - id: ch06-b04
          speaker: narrator
          text: Virgilius filled the city with wonders unlike anything the world had seen before. And he named that city Naples.
