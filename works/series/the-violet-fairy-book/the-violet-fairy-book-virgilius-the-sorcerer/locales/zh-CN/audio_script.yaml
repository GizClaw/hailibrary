audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 编者
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清晰的成年男声
        pace: 从容舒展
        pitch: 中低音
    virgilius:
      display_name: 维吉利乌斯
      tts:
        delivery: 沉着机敏，受挑衅时锋芒毕露
        timbre: 清朗坚定的年轻男声
        pace: 适中
        pitch: 中音
    evil_spirit:
      display_name: 恶灵
      tts:
        delivery: 阴沉狡猾，逞强时急于自辩
        timbre: 粗哑幽深的成年男声
        pace: 稍慢
        pitch: 低音
    emperor:
      display_name: 皇帝
      tts:
        delivery: 威严傲慢，受挫时色厉内荏
        timbre: 浑厚有力的成年男声
        pace: 稍慢
        pitch: 低音
    febilla:
      display_name: 费比拉
      tts:
        delivery: 高傲轻佻，捉弄人时尖刻得意
        timbre: 明亮清脆的年轻女声
        pace: 稍快
        pitch: 中高音
    envoy_1:
      display_name: 第一名使者
      tts:
        delivery: 恭敬圆滑，言辞极有蛊惑力
        timbre: 平稳清晰的成年男声
        pace: 适中
        pitch: 中音
    envoy_2:
      display_name: 第二名使者
      tts:
        delivery: 恭敬圆滑，附和得自然可信
        timbre: 轻柔沉着的成年男声
        pace: 适中
        pitch: 中音
    envoy_3:
      display_name: 第三名使者
      tts:
        delivery: 恭敬圆滑，语气诚恳从容
        timbre: 略显沙哑的成年男声
        pace: 适中
        pitch: 中低音
    princess:
      display_name: 公主
      tts:
        delivery: 温柔端庄，危急时真挚勇敢
        timbre: 柔美清澈的年轻女声
        pace: 适中
        pitch: 中高音
    sultan:
      display_name: 苏丹
      tts:
        delivery: 表面亲切，发怒时威严狠厉
        timbre: 深沉厚重的成年男声
        pace: 稍慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 山洞里的魔法书
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            很久以前，罗马骑士和妻子玛雅生下一个儿子，叫维吉利乌斯。孩子还小，父亲就去世了。亲族不但不保护母子，反倒抢走他们的土地和钱财。玛雅怕儿子连命也保不住，只好送他远赴西班牙，到著名的托莱多大学求学。
        - id: ch01-b02
          speaker: narrator
          text: >-
            维吉利乌斯爱书如命，整日埋头苦读。一个放假的下午，他散步来到陌生的地方，看见一座山洞。男孩子见了山洞，哪里忍得住不进去？他便一路走进漆黑的山腹，想看看有没有另一处出口。走了很久，地面忽然闪过微光，一个声音叫起他的名字。
        - id: ch01-b03
          speaker: virgilius
          text: 谁在叫我？
        - id: ch01-b04
          speaker: evil_spirit
          text: 维吉利乌斯，看看你脚下，地上是不是有一道插闩？
        - id: ch01-b05
          speaker: virgilius
          text: 是有一道。
        - id: ch01-b06
          speaker: evil_spirit
          text: 那就拉开它，放我出去。
        - id: ch01-b07
          speaker: virgilius
          text: 先告诉我，你是谁？
        - id: ch01-b08
          speaker: evil_spirit
          text: 我是个恶灵。没人搭救，我就得关到世界末日。你若放我出来，我便送你几本魔法书，让你比世上任何人都聪明。
        - id: ch01-b09
          speaker: narrator
          text: >-
            维吉利乌斯渴求智慧，听了难免动心，却没有因此失去谨慎。他要恶灵先交出书，再教他使用的方法。恶灵无计可施，只能照办。维吉利乌斯这才拉开插闩。下面露出一个小洞，恶灵慢慢扭了出来，最后站到地上，竟有维吉利乌斯三倍高，浑身黑得像煤。
        - id: ch01-b10
          speaker: virgilius
          text: 你这么大，刚才怎么可能塞在那个洞里？
          emotion: surprised
        - id: ch01-b11
          speaker: evil_spirit
          text: 我刚才本来就在里面！
        - id: ch01-b12
          speaker: virgilius
          text: 我才不信。
        - id: ch01-b13
          speaker: evil_spirit
          text: 那我再钻一次，叫你亲眼看看。
        - id: ch01-b14
          speaker: narrator
          text: >-
            恶灵果真又转又扭，把身体蜷成一团，严严实实地塞回小洞。维吉利乌斯马上插好门闩，把那几本魔法书夹在腋下，头也不回地离开了山洞。此后几个星期，他忙着钻研书中的法术，几乎顾不上吃饭睡觉。直到母亲的使者赶来托莱多，说玛雅已经病倒，再也无力照管家中的事务，请他立刻回罗马。
        - id: ch01-b15
          speaker: narrator
          text: >-
            他舍不得离开托莱多。这里的人都很看重他，认为他将来必定学问非凡。不过他还是愿意马上回家，只是临行前有许多事情要办。他托使者先带回四匹驮满珍宝的马，还送母亲一匹白色小马，供她每日骑着出门。等自己的行装也准备停当，大群学者跟随在他身后，他终于启程，回到了阔别十二年的罗马。

    - id: ch02
      title: 与皇帝较量
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            母亲流着泪迎接儿子。穷亲戚都围拢过来，那些曾侵吞他家产的富亲戚却躲得远远的。他们害怕从今以后，再也不能像过去许多年那样欺负这个亲族。维吉利乌斯没有理会他们，不过他看得清清楚楚，当自己把贵重礼物送给穷亲戚和善待过玛雅的人时，那些人个个满心嫉妒。不久到了征税的日子，凡有土地的人都要亲自去见皇帝。维吉利乌斯也来到宫廷，请皇帝主持公道，惩治抢走他财产的人。
        - id: ch02-b02
          speaker: narrator
          text: >-
            可那些人偏偏是皇帝的亲族，维吉利乌斯根本讨不到公道。皇帝只说要再考虑四年，到时才会裁决。维吉利乌斯当然不能满意。他转身回家，收下田里的庄稼，分别存进自己的房屋。仇人听说后聚兵围攻他的城堡。他毫不畏缩，径直走到阵前同他们面对面，施下一道厉害的咒语，把所有人定在原地，然后当面发出挑战。等话说完，他才解开魔法。敌军只好灰溜溜地退回罗马，把他的每句话都禀报给皇帝。
        - id: ch02-b03
          speaker: narrator
          text: >-
            皇帝平时随口一句话，也有人抢在话音落下前照办。如今听说有人敢抗命，他简直不信自己的耳朵。他另召一支大军，亲自领兵直奔城堡。军队刚扎下阵脚，维吉利乌斯便变出一条大河，把他们团团围住，叫众人手脚都无法动弹。他隔着河高声向皇帝求和，想与他结为朋友。皇帝正在盛怒中，什么也听不进去。维吉利乌斯也没了耐性，索性在饥饿的大军面前摆下宴席，让自己的部下尽情吃喝，而敌军连一只手都抬不起来。
        - id: ch02-b04
          speaker: narrator
          text: >-
            局面正无比危急，一名魔法师来到军营，表示愿意收钱为皇帝效劳。皇帝欣然接受。转眼间，城堡里的守军全都像死去一样倒下，连维吉利乌斯也困得睁不开眼。他不知道该怎样迎战这个对手，只能拼尽力气翻开《黑魔法书》，查到该用的咒语。刹那之间，敌军仿佛全成了石头。有人挂在梯子中央，有人才把一只脚跨过城墙，不管当时在哪里，谁也不能再动。皇帝和他的魔法师也僵在原处。他们像墙上的苍蝇，在那里整整挂了一天。
        - id: ch02-b05
          speaker: narrator
          text: >-
            夜里，维吉利乌斯悄悄来到皇帝身边，说只要皇帝肯还他公道，就让他恢复自由。皇帝早已彻底吓坏，维吉利乌斯提出什么，他都连声答应。于是维吉利乌斯解开魔法，让全军饱餐一顿，又送给每个人一件礼物，才叫他们返回罗马。不仅如此，他还为皇帝修了一座方塔。站在任何一个塔角，都能听见城里相应一带说出的每句话。要是站在塔心，整个罗马的每声耳语都会传进耳朵。
        - id: ch02-b06
          speaker: narrator
          text: >-
            同皇帝和仇人的纠纷都解决以后，维吉利乌斯总算能想想别的事情。谁知他做的头一件事，竟是坠入情网。费比拉出身高贵，容貌胜过罗马所有女子，可她只爱嘲弄维吉利乌斯，总想办法捉弄他。一天，她请他到自己居住的高塔，说会从楼顶放下一只篮子，把他吊上去相会。维吉利乌斯得到这份意外的青睐，喜出望外，兴冲冲跨进篮子。篮子慢慢升起，最后却停在市集上空，再也不动了。
        - id: ch02-b07
          speaker: febilla
          text: 你这个无赖魔法师，就挂在那里吧！
        - id: ch02-b08
          speaker: narrator
          text: >-
            市集很快挤满了人，大家仰头看着悬在半空的魔法师，尽情取笑。维吉利乌斯越听越气，最后简直怒火冲天。皇帝终于听说了他的困境，命费比拉放他下来。他回家时发誓要报仇。第二天，全罗马的炉火都熄灭了。那时没有火柴，这可不是小事。皇帝猜到是谁施法，只得求他解除咒语。
        - id: ch02-b09
          speaker: narrator
          text: >-
            维吉利乌斯命人在市集搭起高台，让费比拉只穿一件白色单衣站在上面。他规定人人都必须亲自从她身上取火，而且绝不许替邻居引燃。费比拉一出现，火焰便缠绕着她升腾起来。罗马人纷纷带来火把、麦秆和刨花，从她身上取走火种，城中的炉火这才一处一处重新燃起。她在台上站了整整三天，等罗马每一座炉膛都有了火，才获准离开，爱去哪里便去哪里。
        - id: ch02-b10
          speaker: narrator
          text: >-
            皇帝恼怒维吉利乌斯报复得这样狠，把他投入监牢，准备处死。卫兵押着他来到维米纳尔山。天气很热，维吉利乌斯在刑场讨了一桶水。
        - id: ch02-b11
          speaker: virgilius
          text: 皇帝万岁！到西西里去找我吧！
        - id: ch02-b12
          speaker: narrator
          text: >-
            话音一落，他头朝下跳进水桶，从众人眼前消失了。

    - id: ch03
      title: 罗马守护像
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            此后有一阵子，传说没有再提维吉利乌斯，也没告诉我们，他究竟怎样同皇帝讲和。等他的事迹再次出现时，皇帝已经召他入宫，请他出谋划策，既要抵御城外的敌人，也要防范城内的祸患。维吉利乌斯整整思索了许多天，终于想出一个办法，世人都把它称作“罗马守护像”。
        - id: ch03-b02
          speaker: narrator
          text: >-
            卡庇托尔是全城最著名的公共建筑。维吉利乌斯在它的屋顶摆下许多神像，罗马统治下每个民族崇拜的神祇都在其中，正中央站着罗马女神。每一尊战败民族的神像，手里都握着一只铃铛。只要那个国家生出一丝叛意，它的神像便转过身，背向罗马女神，拼命摇响铃铛。元老们听见声音，马上赶来查明谁要反抗帝国的威严，再调集军队，出征讨伐。
        - id: ch03-b03
          speaker: narrator
          text: >-
            有个国家嫉恨罗马已久，始终想找机会毁掉它。那里的人选出三名可靠的使者，给他们带上许多钱，派往罗马，叫他们假装成会解梦的占卜师。三人一到城里，便趁夜溜出去。他们把一罐金子深深埋进土中，又把另一罐沉到台伯河的河床，地点就在一座跨河大桥下面。次日，三人走进制定法律的元老院，恭恭敬敬地行礼。
        - id: ch03-b04
          speakers: [envoy_1, envoy_2, envoy_3]
          ensemble: chorus
          text: 各位尊贵的大人，我们昨夜梦见山脚埋着一罐金子。请准许我们去挖吧。
        - id: ch03-b05
          speaker: narrator
          text: >-
            元老们准了。使者带工人挖出金子，尽情享用。几天以后，他们再次求见。
        - id: ch03-b06
          speakers: [envoy_1, envoy_2, envoy_3]
          ensemble: chorus
          text: 各位尊贵的大人，梦里又有一份宝藏，就在河上那座桥下面。请准许我们寻找。
        - id: ch03-b07
          speaker: narrator
          text: >-
            元老们又答应了。使者雇船请人，放下带钩的绳索，捞出第二罐金子，还分出一些送给元老。又过了一两个星期，他们第三次来到元老院。
        - id: ch03-b08
          speakers: [envoy_1, envoy_2, envoy_3]
          ensemble: chorus
          text: >-
            各位尊贵的大人，我们昨夜看见十二桶金子，就埋在卡庇托尔的基石下，罗马守护像正立在上面。多亏各位恩准，前两场梦已让我们十分富有。我们愿把第三份宝藏送给各位。请派些工人，我们马上开挖。
        - id: ch03-b09
          speaker: narrator
          text: >-
            得到允许后，他们马上带人开挖，一直挖到卡庇托尔的地基几乎被掏空，随后又像来时一样，神不知鬼不觉地逃走。第二天早晨，基石终于塌了。神圣的守护像面朝下摔落，碎成了几块。元老们这才知道，正是自己的贪心毁了一切。从此城里的情形一天比一天混乱。每天早晨都有大群百姓来向皇帝控诉，街头夜夜发生抢劫、谋杀和其他罪行。

    - id: ch04
      title: 铜马与铜狗
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            皇帝最盼望臣民平安，便请维吉利乌斯想办法制止暴行。他苦思许久，终于开了口。
        - id: ch04-b02
          speaker: virgilius
          text: >-
            伟大的君王，请铸造一匹铜马和一名铜骑手，放在卡庇托尔前。再颁下命令，十点钟声一响，所有人都得回家，不准再出门。
        - id: ch04-b03
          speaker: narrator
          text: >-
            皇帝依计行事，盗贼和杀人犯却嘲笑那匹铜马，照旧在夜里四处作恶。十点钟的最后一记钟声落下，铜马忽然放开四蹄，沿着罗马的大街小巷飞奔。天亮以后，人们数出两百多具被它踩死的尸体。剩下的盗贼依然不少。他们没有像维吉利乌斯期望的那样，吓得从此改邪归正，反倒备好一架架带钩的绳梯。一听见铜马的蹄声，他们就把梯钩扣上墙头，飞快爬到铜马和骑手够不到的高处。
        - id: ch04-b04
          speaker: narrator
          text: >-
            皇帝于是下令铸造两只铜狗，让它们跟着铜马奔跑。盗贼吊在墙上，自以为安全，便放声嘲弄维吉利乌斯和皇帝。铜狗却能高高跃起，把他们从墙上扯落地面，再活活咬死。维吉利乌斯就用这个办法，让城里重新有了和平与秩序。

    - id: ch05
      title: 空中长桥与那不勒斯
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            也就在这个时候，巴比伦行省的苏丹有一位女儿，她的美名传遍远近，据说是全世界最美丽的公主。维吉利乌斯和别人一样，听了许多关于她的传闻，竟然爱一个尚未谋面的姑娘爱得无法自拔。他索性在空中架起一座长桥，一头连着罗马，另一头直达巴比伦，然后踏过长桥，亲自去拜访公主。
        - id: ch05-b02
          speaker: narrator
          text: >-
            公主见他突然出现，虽然有些惊讶，仍然热情欢迎。两人交谈一番以后，她也很想看看这个陌生人居住的遥远国度。维吉利乌斯答应亲自带她去，还保证不让她的鞋底沾上一滴水。公主在他的宫殿住了好几天，看尽梦中都不曾有过的奇观。维吉利乌斯恨不得把礼物堆在她面前，她却一件也不肯收。时光过得飞快，仿佛一小时只剩一分钟。最后，公主说不能再离开父亲。维吉利乌斯便亲自送她走过空中长桥，轻轻放回她自己的床上。
        - id: ch05-b03
          speaker: narrator
          text: >-
            第二天早晨，苏丹在床上发现女儿。公主把全部经过讲给父亲听，他装作听得兴致勃勃，请她下次一定介绍维吉利乌斯。没过多久，公主传来消息，说那位陌生人又到了。苏丹立即命人备下宴席，又把女儿叫来，将一杯酒交到她手中。他说，为了向客人表示敬意，必须由她亲自献上。宴席上众人落座以后，公主起身递出酒杯。维吉利乌斯刚喝下杯中之物，马上沉沉睡去。苏丹叫卫兵把他捆住，让他躺在那里，直到第二天。
        - id: ch05-b04
          speaker: narrator
          text: >-
            第二天一早，苏丹召集所有领主和贵族来到大殿，命人解开绳索，把维吉利乌斯押到面前。一见到俘虏，他便怒不可遏，指控维吉利乌斯未经自己的准许，竟把公主带去了遥远的异国。维吉利乌斯回答，自己虽然带走了公主，却也把她平安送了回来。他原本大可以把她永远留下。只要苏丹释放他，让他返回自己的国土，他保证以后再也不会踏进这里。
        - id: ch05-b05
          speaker: sultan
          text: 休想！我要叫你受尽羞辱而死！
          emotion: angry
        - id: ch05-b06
          speaker: narrator
          text: >-
            公主跪倒在父亲面前，请求和维吉利乌斯一起死。
        - id: ch05-b07
          speaker: princess
          text: 求您准许我同他一同赴死。
          emotion: sad
        - id: ch05-b08
          speaker: virgilius
          text: 苏丹大人，您的算盘打错了！
        - id: ch05-b09
          speaker: narrator
          text: >-
            维吉利乌斯已经忍无可忍。他施下一道魔法，让苏丹和众领主以为巴比伦的大河正在殿堂里奔涌而过，他们若不拼命游水，就会丢掉性命。那些人信以为真，一个个像青蛙和鱼儿一样，在大殿中扑腾跳跃。维吉利乌斯任凭他们挣扎，自己抱起公主，越过空中长桥，一路回到罗马。
        - id: ch05-b10
          speaker: narrator
          text: >-
            他觉得自己的宫殿配不上公主这颗明珠，就连整个罗马也不够好。于是，他专为公主造了一座城。城的地基立在一枚枚鸡蛋上，而那些鸡蛋深埋在遥远的海底。城中有座方塔，塔顶竖着一根铁棍。铁棍上横放一只瓶子，瓶子上安着一枚鸡蛋，鸡蛋下面又用锁链悬着一只苹果。传说直到今天，那只苹果还挂在那里。
        - id: ch05-b11
          speaker: narrator
          text: >-
            那枚鸡蛋只要稍稍摇晃，整座城便会跟着震颤。等到鸡蛋破裂的那一天，这座城也会随之毁灭。维吉利乌斯又让城里充满种种从未有人见过的奇观，最后为它取名那不勒斯。这个故事，就改编自《魔法师维吉利乌斯》。
