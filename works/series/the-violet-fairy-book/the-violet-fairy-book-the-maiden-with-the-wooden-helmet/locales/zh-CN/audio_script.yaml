audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 编者
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清晰的成年男声
        pace: 从容舒展
        pitch: 中低音
    maiden:
      display_name: 木盔姬
      tts:
        delivery: 温柔坚韧，话不多却很有主见
        timbre: 清澈柔和的年轻女声
        pace: 舒缓
        pitch: 中高音
    mother:
      display_name: 母亲
      tts:
        delivery: 慈爱忧切，临终叮嘱时沉静郑重
        timbre: 温暖微弱的成熟女声
        pace: 徐缓
        pitch: 中音
    master:
      display_name: 田庄主人
      tts:
        delivery: 稳重直接，待人宽厚
        timbre: 厚实的成年男声
        pace: 适中
        pitch: 中低音
    young_man:
      display_name: 年轻人
      tts:
        delivery: 坦率坚定，喜悦时明朗热诚
        timbre: 清朗的年轻男声
        pace: 适中
        pitch: 中音
    mistress:
      display_name: 女主人
      tts:
        delivery: 矜持审慎，谈起怪事时略带不解
        timbre: 柔和成熟的女声
        pace: 从容
        pitch: 中音
  chapters:
    - id: ch01
      title: 木盔下的容貌
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            很久以前，日本乡间的小村里住着一对夫妻。他们多年平安富足，后来却接连遭逢厄运，家业一点点败落，最后只剩下一个美得像清晨的女儿。邻居都很厚道，愿意尽力帮助这两个可怜的朋友。可夫妻俩觉得，既然一切都变了，还是换个地方生活吧。于是，他们带着女儿搬到偏僻的乡下。
        - id: ch01-b02
          speaker: narrator
          text: >-
            母女每天忙着收拾屋子、照料园子，总有做不完的活。父亲却一坐就是几个钟头，只管呆呆望着前方，想着从前拥有的财富。他一天比一天愁苦，终于一病不起，再也没能下床。父亲死后，母女伤心痛哭。过了好几个月，她们才又能从生活中感到一点欢喜。
        - id: ch01-b03
          speaker: narrator
          text: >-
            一天早晨，母亲忽然发现，女儿长得比以前更美了。从前，她看了只会欢喜。如今世上只剩母女俩相依为命，这份美貌反而叫她害怕，生怕它会给女儿惹来祸事。她把自己懂得的事全教给女儿，也让女儿养成勤劳的习惯，免得闲下来只顾想着自己。女儿善良懂事，把母亲的每一句教诲都记在心里。日子就这样一年年过去。
        - id: ch01-b04
          speaker: narrator
          text: >-
            一个阴雨连绵的春天，母亲受寒病倒。病情越来越重，她知道自己陪不了女儿多久了，便把女儿叫到床前。
        - id: ch01-b05
          speaker: mother
          text: >-
            我很快就要走了，到那时，你便独自留在世上。没有人再照看你，你一定得保护好自己。美貌的女子走到哪里都惹人注意。你去隔壁取来那顶木盔，戴在头上，把盔沿压到眉间，让大半张脸都藏进阴影里。
          emotion: sad
        - id: ch01-b06
          speaker: narrator
          text: >-
            女儿戴上木盔。头发遮住了，大半张脸也藏了起来，就算穿过人群，也不会有人回头看她。母亲这才放心，躺回床上离开了人世。

    - id: ch02
      title: 戴着木盔的女佣
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            姑娘一连哭了许多天。后来，她想到世上只剩自己一个，凡事只能靠自己，必须出去找份活干。留在原地没有生计，她便把衣物包成包袱，翻过一座座山岭，来到当地一位田庄主人家做工。她每天总是从早忙到晚。每天夜里躺下时，心里都很安宁，因为答应母亲的事，她一件也没有忘。无论太阳多热，她都不摘下木盔。人们因此叫她“木盔姬”。
        - id: ch02-b02
          speaker: narrator
          text: >-
            可她的美貌还是传开了。一些无礼的年轻人趁她干活，从背后悄悄靠近，想掀掉木盔。
        - id: ch02-b03
          speaker: maiden
          text: >-
            走开，别来打扰我。
        - id: ch02-b04
          speaker: narrator
          text: >-
            那些人又同她搭话，她便一句也不回答，只管低头做手里的活。工钱虽少，食物也不充足，好歹还能过活，对她来说这便够了。一天，主人偶然经过她干活的田地，看见她这样勤快，不由得停下来观察了很久，又问了她几句话，随后把她领进家门。
        - id: ch02-b05
          speaker: master
          text: >-
            从今天起，你不必再下田了。到屋里去，好好照料我生病的妻子吧。
        - id: ch02-b06
          speaker: narrator
          text: >-
            姑娘以为苦日子总算到头了。她不知道，最难熬的事还没有来。

    - id: ch03
      title: 年轻人的求婚
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            木盔姬做了女主人的侍女以后不久，这家的长子从京都求学归来。他在那里学过各种知识，后来厌倦了城里的繁华享乐。如今又回到青翠的乡野，见到桃花和芬芳的花朵，他心里十分欢喜。一天清早，他出去散步，看见了头戴木盔的姑娘，马上去问母亲。
        - id: ch03-b02
          speaker: young_man
          text: >-
            那个姑娘是谁？她从哪儿来？为什么用那么奇怪的东西遮住脸？
        - id: ch03-b03
          speaker: mistress
          text: >-
            那是她的怪脾气。谁劝也没用，她就是不肯摘下来。
        - id: ch03-b04
          speaker: narrator
          text: >-
            年轻人笑了，却没说出心里的想法。后来一个炎热的日子，他回家时看见姑娘跪在花园的小溪边，用水洗脸。木盔推到一旁，他从树后望去，第一次看清她有多美。他当场下定决心，这一生除了她，谁也不娶。
        - id: ch03-b05
          speaker: narrator
          text: >-
            他把娶姑娘的决定告诉家人。家里人听了十分生气，编出许多恶毒的话诋毁她。年轻人知道那全是胡说，根本没有放在心上。
        - id: ch03-b06
          speaker: young_man
          text: >-
            我只要坚持到底，他们总会答应。
        - id: ch03-b07
          speaker: narrator
          text: >-
            这门亲事对姑娘来说好得出奇，谁都以为她一定会接受，她却拒绝了。她觉得自己不该让这一家人为她争吵。虽然暗地里哭得十分伤心，可很长一段时间里，无论别人怎样劝说，她都不肯改变主意。年轻人几乎每天都来求婚，她还是不答应。
        - id: ch03-b08
          speaker: narrator
          text: >-
            终于有一晚，母亲来到姑娘梦中，叫她嫁给年轻人。第二天，年轻人又来问她。
        - id: ch03-b09
          speaker: maiden
          text: >-
            我愿意嫁给你。
          emotion: happy
        - id: ch03-b10
          speaker: narrator
          text: >-
            年轻人又惊又喜。他的父母见事情已经不能改变，只能尽量把婚事办好，于是认真筹备起一场与这门亲事相称的盛大庆典。邻人免不了拿木盔说许多刻薄话，新郎太幸福了，根本不放在心上，只是一笑而过。

    - id: ch04
      title: 婚礼上的奇迹
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            喜宴的一切都准备好了。新娘穿上全日本所能找到的最华美的绣衣。侍女们握住木盔，想替她摘下来，再梳一个最时兴的发式。可木盔纹丝不动。她们越用力，木盔箍得越紧，姑娘疼得放声大叫。新郎听见叫声，急忙跑来安慰她。
        - id: ch04-b02
          speaker: young_man
          text: >-
            别再拉了。既然摘不下来，她就戴着木盔和我成婚。
        - id: ch04-b03
          speaker: narrator
          text: >-
            婚礼随即开始。新郎新娘并肩坐下，有人端来一只酒杯，两人按礼节共饮杯中酒。酒刚刚喝完，杯子才空，奇事就发生了。木盔突然轰的一声裂开，碎片纷纷落在地上。大家转头一看，从盔里掉出的珍贵宝石竟铺满了地面。
        - id: ch04-b04
          speaker: narrator
          text: >-
            可宾客们顾不上惊叹钻石有多耀眼，因为新娘的美貌更叫他们吃惊。那样的美，他们从没见过，也从没听说过。人们唱歌跳舞，欢庆了一整夜。
        - id: ch04-b05
          speaker: narrator
          text: >-
            那一夜，人们始终唱歌跳舞。等到庆典结束，新郎新娘搬进自己的家，从此相伴一生。他们有许多孩子，个个品德高尚、容貌出众，因此名扬日本。
