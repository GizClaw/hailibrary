  chapters:
    - id: ch01
      title: A Family's Hard Times
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long, long ago, a man and his wife lived in a small village in Japan. For years, they had been happy and prosperous. Then hard times came. Little by little, they lost everything except their daughter, who was as beautiful as the morning.
        - id: ch01-b02
          speaker: narrator
          text: Their neighbors were kind and would gladly have helped. But life had changed so completely that the old couple chose to leave. One day, they took their daughter and went deep into the country to live quietly by themselves.
        - id: ch01-b03
          speaker: narrator
          text: The mother and daughter stayed busy cleaning the house and tending the garden. The father did not. For hours, he sat staring ahead, thinking of the riches he once had. He became more miserable every day. At last, he took to his bed and never rose again.
        - id: ch01-b04
          speaker: narrator
          text: His wife and daughter wept bitterly when he died. Many months passed before anything could bring them pleasure again.
        - id: ch01-b05
          speaker: narrator
          text: Then one morning, the mother looked closely at her daughter. The girl had grown lovelier than ever. Once, that sight would have made her mother glad. Now the two of them were alone, and she feared such beauty might bring her daughter harm.
        - id: ch01-b06
          speaker: narrator
          text: So the mother taught the girl everything she knew. She kept her busy, too, leaving her no time to think about herself. The daughter was good and listened carefully to every lesson. In this way, the years went by.
    - id: ch02
      title: The Wooden Helmet
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: One rainy spring, the mother caught a cold. At first, she paid little attention to it. But she grew steadily worse, and soon she knew she did not have long to live. She called her daughter to her bedside.
        - id: ch02-b02
          speaker: mother
          text: My child, very soon you will be alone in the world. You must look after yourself, because no one else will be here to do it. A beautiful woman cannot pass unnoticed as easily as others can. Go into the next room and bring me the wooden helmet you will find there.
        - id: ch02-b03
          speaker: narrator
          text: The girl fetched the helmet and brought it to her mother.
        - id: ch02-b04
          speaker: mother
          text: Put it on, and pull it low over your forehead. Let its shadow hide nearly all your face.
        - id: ch02-b05
          speaker: narrator
          text: Her daughter obeyed. The wooden cap covered all her hair and hid her beauty so completely that she could have walked through a crowd without anyone looking twice. When the mother saw that, her heart was at rest. She lay back upon her bed and died.
        - id: ch02-b06
          speaker: narrator
          text: For many days, the girl wept. In time, she understood that she must find work. She was alone now and had only herself to depend on. There was no work where she lived, so she tied her clothes into a bundle and walked over the hills.
        - id: ch02-b07
          speaker: narrator
          text: At last, she reached the home of the man who owned the fields in that part of the country. He took her into his service. From then on, she worked for him from early morning until late at night.
        - id: ch02-b08
          speaker: narrator
          text: Each night, she went to bed with a peaceful heart, because she had kept every promise she made to her mother. No matter how fiercely the sun beat down, the wooden helmet stayed on her head. The people began calling her Hatschihime, the maiden with the wooden helmet.
    - id: ch03
      title: Hatschihime at Work
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Even with all her care, stories of Hatschihime's beauty began to spread. Some shameless young men would creep up behind her while she worked and try to lift away the wooden helmet. She would have nothing to do with them.
        - id: ch03-b02
          speaker: hatschihime
          text: Go away. Leave me to my work.
        - id: ch03-b03
          speaker: narrator
          text: After she sent them away, they tried talking to her. Hatschihime gave them no answer. She simply went on with her work. Her pay was small and food was scarce, but she could live on what she earned, and that was enough for her.
        - id: ch03-b04
          speaker: narrator
          text: One day, her master crossed the field where she was working. He noticed how hard she worked and stopped to watch. After asking her a few questions, he led her into the house.
        - id: ch03-b05
          speaker: master
          text: From now on, you will leave the fieldwork behind. Your only duty will be to care for my wife while she is ill.
        - id: ch03-b06
          speaker: narrator
          text: Hatschihime felt as though all her troubles had ended. But the worst of them was still ahead.
        - id: ch03-b07
          speaker: narrator
          text: Not long after she became the sick woman's maid, the family's eldest son returned from Kioto. He had been studying many different subjects there. Now he was tired of the city's splendor and pleasures, and he was glad to be among the green fields, peach blossoms, and sweet flowers again.
        - id: ch03-b08
          speaker: narrator
          text: Early one morning, he went walking and saw a girl wearing a strange wooden helmet. At once, he went to his mother.
        - id: ch03-b09
          speaker: eldest_son
          text: Mother, who is that girl? Where did she come from? And why does she wear that odd thing over her face?
        - id: ch03-b10
          speaker: mistress
          text: It is only a fancy of hers. No one has ever been able to persuade her to take it off.
        - id: ch03-b11
          speaker: narrator
          text: The young man laughed at that, but he kept his thoughts to himself.
    - id: ch04
      title: A Glimpse by the Stream
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Then, on a hot day, the young man was walking home when he saw his mother's maid kneeling beside a little stream in the garden. She was splashing cool water over her face, and the helmet had slipped to one side.
        - id: ch04-b02
          speaker: narrator
          text: From behind a tree, he caught one glimpse of her great beauty. In that moment, he decided that no one else would ever be his wife.
        - id: ch04-b03
          speaker: narrator
          text: When he told his family that he meant to marry Hatschihime, they became very angry. They invented one wicked story after another about her. He knew their tales were only empty talk, so all their trouble was wasted.
        - id: ch04-b04
          speaker: eldest_son
          text: I need only stand firm. In the end, they will have to give way.
        - id: ch04-b05
          speaker: narrator
          text: Everyone thought the match was so fortunate for Hatschihime that she could never refuse him. Yet she did. She believed it would be wrong to cause a quarrel in the household. Though she wept bitterly in secret, for a long time nothing could change her answer.
        - id: ch04-b06
          speaker: eldest_son
          text: Hatschihime, will you marry me?
        - id: ch04-b07
          speaker: hatschihime
          text: I cannot. I will not be the cause of strife in your family.
          emotion: sad
        - id: ch04-b08
          speaker: narrator
          text: At last, one night, her mother came to her in a dream and told her to marry the young man. He asked again the next day, just as he had asked nearly every day.
        - id: ch04-b09
          speaker: eldest_son
          text: Will you be my wife?
        - id: ch04-b10
          speaker: hatschihime
          text: Yes. I will marry you.
        - id: ch04-b11
          speaker: narrator
          text: Her answer filled him with surprise and joy. His parents saw that they had better accept what they could not prevent, and they began making the grand preparations the wedding required.
        - id: ch04-b12
          speaker: narrator
          text: Of course, the neighbors had many unkind things to say about the bride and her wooden helmet. The bridegroom was far too happy to care. He only laughed at them.
    - id: ch05
      title: The Wedding Miracle
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: At last, everything was ready for the feast. Hatschihime wore the most beautiful embroidered wedding dress that could be found in all Japan. Her maids reached for the wooden helmet, meaning to remove it and arrange her hair in the newest fashion. But the helmet would not move. The harder they pulled, the more firmly it seemed to cling to her head.
        - id: ch05-b02
          speaker: narrator
          text: They pulled again until the poor girl cried out in pain. The bridegroom heard her and ran into the room. He soothed her and told the maids to stop.
        - id: ch05-b03
          speaker: eldest_son
          text: Do not hurt her. She cannot be married without the helmet, so she shall be married in it.
          emotion: calm
        - id: ch05-b04
          speaker: narrator
          text: The wedding ceremonies began. Bride and bridegroom sat side by side, and they were given the cup of wine from which they both had to drink.
        - id: ch05-b05
          speaker: narrator
          text: They drank until the cup was empty. Then a wonderful thing happened. With a great crack, the wooden helmet burst apart and tumbled in pieces to the ground.
        - id: ch05-b06
          speaker: narrator
          text: Everyone turned to look. Precious stones had spilled from inside the helmet and covered the floor. Yet even the shining diamonds amazed the guests less than the bride herself. Her beauty was greater than anything they had ever seen or heard of.
        - id: ch05-b07
          speaker: narrator
          text: The rest of the night passed in singing and dancing. Afterward, the bride and bridegroom went to a home of their own. They lived there together for the rest of their lives and had many children, who became famous throughout Japan for their goodness and beauty.
