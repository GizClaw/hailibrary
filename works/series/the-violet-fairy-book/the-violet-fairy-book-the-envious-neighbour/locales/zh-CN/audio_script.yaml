audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 编者
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清晰的成年男声
        pace: 从容舒展
        pitch: 中低音
    old_man:
      display_name: 老头儿
      tts:
        delivery: 老实沉着，盘算时透着机敏
        timbre: 温厚略沙哑的老年男声
        pace: 适中
        pitch: 中低音
    wife:
      display_name: 老太婆
      tts:
        delivery: 嘴快性急，自信又爱声张
        timbre: 响亮爽利的老年女声
        pace: 稍快
        pitch: 中高音
    dog:
      display_name: 小狗
      tts:
        delivery: 忠诚温柔，话语简短而笃定
        timbre: 清亮柔和的少年男声
        pace: 稍慢
        pitch: 中高音
    envious_neighbour:
      display_name: 邻居
      tts:
        delivery: 贪婪急躁，装腔时故作可怜
        timbre: 偏尖而粗涩的成年男声
        pace: 稍快
        pitch: 中音
  chapters:
    - id: ch01
      title: 小狗找到宝藏
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            很久很久以前，村里住着一对老夫妻。他们没有儿女可以疼爱照料，就把满腔爱意都给了一只小狗。小狗长得十分可爱。虽然老人宠着它，它却没有因为不能事事如愿就变得娇纵讨厌，连孩子有时也免不了这样。它懂得感恩。不论两位老人在屋里还是出门，它总守在身边，一步也不离开。
        - id: ch01-b02
          speaker: narrator
          text: >-
            一天早晨，天气很热。老头儿在园子里干活，小狗照旧陪在近旁。干了一阵，他放下铁锹，擦去额上的汗，忽然看见小狗在稍远处又嗅又刨。狗都爱刨土，他起初没放在心上，只管继续挖地。可小狗跑过来大声叫，又跑回那块地。来来回回好几趟以后，老头儿不由得纳闷，这才拿起铁锹，跟着它走了过去。小狗见主人终于明白，高兴得围着那地方又跳又叫，连老太婆也被引出了屋。
        - id: ch01-b03
          speaker: narrator
          text: >-
            老头儿想看看小狗是不是真发现了什么，便动手挖起来。没挖多久，铁锹就碰到一样东西。他弯腰一拉，竟拖出一只装满闪亮金币的大箱子。箱子太沉，老太婆也来搭手，两人才把它搬回家。那天晚上，小狗吃了一顿多么丰盛的美餐，你一定猜得到。它让老人富了起来，从此每天都能吃到狗儿最爱吃的东西，连睡觉的垫子也配得上王子。
        - id: ch01-b04
          speaker: narrator
          text: >-
            小狗找到宝藏的消息很快传开。隔壁邻居家的园子紧挨着老人家的园子。他听说老人交了好运，嫉妒得吃不下饭，也睡不着觉。这个糊涂人想，小狗找得到一次宝藏，就一定每次都找得到。于是，他来央求老夫妻把爱犬借给他几天，也让他发一笔财。
        - id: ch01-b05
          speaker: old_man
          text: >-
            你怎么能开这个口？你明知道我们有多疼它，连五分钟都舍不得让它离开眼前。
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: >-
            邻居根本不肯听，还是每天来提同一个请求。两位老人又不忍心拒绝任何人，最后只好答应把小狗借给他一两个晚上。邻居一带走它，马上赶进自家园子。可小狗只顾四处奔跑，什么也不做。他再心急，也只能勉强耐着性子等下去。

    - id: ch02
      title: 贪心害死小狗
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            第二天一早，邻居打开屋门。小狗欢快地蹿进园子，跑到一棵树下拼命刨土。他赶紧大声叫妻子拿铁锹来，自己紧跟着小狗，只想第一个看见盼望已久的宝藏。可是泥土挖开以后，下面只有一包臭气熏人的旧骨头，害得他一刻也待不下去。
        - id: ch02-b02
          speaker: narrator
          text: >-
            邻居认定小狗是在捉弄他，心里顿时满是怒火。他抓起鹤嘴锄，当场把小狗打死了，动手时连自己在做什么都不知道。等回过神来，他才想起还得把这件事告诉老头儿和老太婆，心里不免害怕。可拖延也没有用，他只好拉长了脸，装出愁眉苦脸的样子，走进老人家的园子。
        - id: ch02-b03
          speaker: envious_neighbour
          text: >-
            你家的狗忽然倒在地上死了。我一直尽心照料它，它想要什么，我就给什么。我觉得还是马上来告诉你们才好。
        - id: ch02-b04
          speaker: narrator
          text: >-
            邻居说着，还假装哭了起来。老头儿却真的伤心落泪。他走去抱回爱犬的尸体，把它带回家，埋在发现宝藏的那棵无花果树下。从早到晚，老夫妻一直哀悼失去的爱犬，任什么话也安慰不了他们。

    - id: ch03
      title: 木臼变出金币
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            一天夜里，小狗来到老头儿梦中。
        - id: ch03-b02
          speaker: dog
          text: >-
            请砍倒我坟上的无花果树，用树木做一只臼。
        - id: ch03-b03
          speaker: narrator
          text: >-
            老头儿醒来以后，想起这个梦，却怎么也舍不得砍树，因为这棵树年年都结许多果子。他拿不定主意，便去问妻子该怎么办。
        - id: ch03-b04
          speaker: wife
          text: >-
            从前的事已经证明，小狗的话一定得听。我们照它说的做吧。
        - id: ch03-b05
          speaker: narrator
          text: >-
            老太婆半点也没有迟疑。于是，他们砍倒无花果树，用树干做成一只漂亮的臼。等到稻谷收割的季节，两位老人从架上取下木臼，把谷粒倒进去舂。说时迟，那时快，所有谷粒眨眼间全变成了金币。两位老人望着眼前这许多金币，心里又惊又喜，再一次打心底里为忠诚的小狗祝福。
        - id: ch03-b06
          speaker: narrator
          text: >-
            这件事很快也传到邻居耳中。他片刻也不耽搁，立刻跑来问老人是不是正好有一只臼可以借给他。老头儿实在舍不得这件宝物，可他从来不会拒绝别人，还是让邻居把木臼夹在胳膊下带走了。
        - id: ch03-b07
          speaker: narrator
          text: >-
            邻居一进屋，就和妻子抓来一大把稻谷，在臼里舂去谷壳。他们没等到金币，稻谷反而变成一颗颗奇臭无比的浆果，熏得两人逃出屋去。他们气得砸碎木臼，又放火烧掉了碎片。
        - id: ch03-b08
          speaker: narrator
          text: >-
            隔壁的老夫妻得知木臼落得这样的下场，自然十分难过。邻居不管怎样解释，怎样找借口，也安慰不了他们。

    - id: ch04
      title: 枯树开满樱花
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            当天夜里，小狗又来到老头儿梦中。
        - id: ch04-b02
          speaker: dog
          text: >-
            去把烧毁木臼留下的灰收回来。等统辖这一带的大名去都城时，你就把灰带到仪仗队经过的大路上。队伍一出现，爬上沿路的樱花树，把灰撒出去。花会盛开，开得比从前任何时候都美。
        - id: ch04-b03
          speaker: narrator
          text: >-
            这一回，老头儿没有再和妻子商量。他一起床就去邻居家收集灰烬，小心装进瓷瓶，带到大路边坐着等候。那时，露天的樱花树还光秃秃的。富人们得买来盆栽樱花，放在暖和的屋里催它早开，好装点房间。路边这些树呢，再过一个多月，枝头也未必找得到一颗小花苞。
        - id: ch04-b04
          speaker: narrator
          text: >-
            不久，远处扬起一片尘土。老头儿知道，大名的仪仗队来了。队伍里人人穿着最华美的衣裳，夹道的人群全把脸伏到地上。唯独老头儿没有下拜。大名见了十分生气，派一名侍从来问他为什么不守古老的礼数。
        - id: ch04-b05
          speaker: narrator
          text: >-
            侍从还没走到跟前，老头儿已经爬上最近的一棵树，把灰四处撒开。霎时间，洁白的花朵闪现枝头，像是忽然有了生命。大名看得心中大喜，把老头儿请进城堡，还赏给他许多贵重的礼物。

    - id: ch05
      title: 嫉妒者的下场
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            嫉妒的邻居很快又听说了这件事，心里满是怨恨。他跑到烧木臼的地方，收集了一点老头儿没拿走的灰，也带到大路上去。他巴望自己的运气和老头儿一样好，最好还能胜过他。
        - id: ch05-b02
          speaker: narrator
          text: >-
            刚看见大名的队伍，邻居就欢喜得心怦怦直跳，只等合适的时机。大名来到近前，他抓起一大把灰，朝树上猛撒。可树上既没长花苞，也没开花。风把灰全吹了回来，扑进大名和武士们的眼睛，疼得他们连声叫喊。
        - id: ch05-b03
          speaker: narrator
          text: >-
            大名立刻命人抓住这个恶徒，捆起来投入监牢，一关就是好几个月。等邻居获释，村里人人都知道了他的恶行，再也不肯让他住在那里。可他始终不肯改掉恶习，日子越过越坏，最后落得悲惨的下场。
