  chapters:
    - id: ch01
      title: The Faithful Dog's Treasure
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long, long ago, an old couple lived in a village. They had no children to care for, so they gave all their love to a little dog. He was a pretty creature. Though he did not always get everything he wanted, their kindness never made him spoiled or disagreeable, as kindness sometimes does even with children. He was grateful and stayed beside them wherever they went, indoors or out.
        - id: ch01-b02
          speaker: narrator
          text: One hot morning, the old man was digging in his garden. As always, the dog was nearby. The old man stopped to wipe his wet forehead and noticed the dog sniffing and scratching at the ground a short distance away. Dogs often scratch, so he quietly went on with his work.
        - id: ch01-b03
          speaker: narrator
          text: Then the dog ran to his master, barking loudly, and dashed back to the same spot. He did this again and again. At last the old man wondered what was wrong. He picked up his spade and followed. The delighted dog jumped around him and barked until the old woman came out to see what all the noise was about.
        - id: ch01-b04
          speaker: narrator
          text: The husband began to dig, curious to learn whether the dog had truly found something. Before long, his spade struck a solid object. He bent down and pulled out a large box packed with shining gold coins. It was so heavy that his wife had to help him carry it home.
        - id: ch01-b05
          speaker: narrator
          text: You can imagine the supper their dog enjoyed that night. Now that he had made the couple rich, they fed him every day with all the things a dog loves best. Even the cushions he slept on were fit for a prince.
        - id: ch01-b06
          speaker: narrator
          text: Soon everyone heard about the dog and his treasure. In the next garden lived a neighbour who became so envious of the old couple's good fortune that he could neither eat nor sleep. Foolishly, he decided that a dog who found treasure once must be able to find treasure every time. He begged the couple to lend him their pet for a little while so that he could become rich as well.
        - id: ch01-b07
          speaker: old_man
          text: How can you ask us for that? You know how dearly we love him. We never let him out of our sight for even five minutes.
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: The neighbour ignored him. He came back each day with the very same request. The old couple could never bear to refuse anyone, and in the end they agreed to lend him the dog for one or two nights. As soon as the neighbour had the dog, he turned him loose in his garden. But the animal only raced about, and the man had to wait as patiently as he could.
    - id: ch02
      title: The Neighbour's Cruel Trick
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The next morning, the neighbour opened his door. The dog bounded happily into the garden, ran to the foot of a tree, and began scratching wildly. The man shouted for his wife to bring a spade. Eager to be the first to see the treasure, he hurried after the dog.
        - id: ch02-b02
          speaker: narrator
          text: He dug up the earth, but what did he find? Nothing except a bundle of old bones, and they smelled so foul that he could not remain there another moment. Rage filled him. He thought the dog had played a trick on him, so he seized a pickaxe and killed the animal on the spot, before he even knew what he was doing.
        - id: ch02-b03
          speaker: narrator
          text: Then he remembered that he would have to tell the old man and his wife what had happened, and fear crept over him. Still, delaying would do no good. He pulled a very long face and walked into his neighbour's garden.
        - id: ch02-b04
          speaker: envious_neighbour
          text: Your dog suddenly fell down dead. I took the greatest care of him and gave him everything he could possibly want. I thought I should come and tell you at once.
        - id: ch02-b05
          speaker: narrator
          text: He pretended to weep as he spoke. The old man truly wept. He went to fetch his beloved dog's body, carried it home, and buried it beneath the fig tree where the treasure had been found. From morning until night, he and his wife mourned their loss. Nothing could console them.
        - id: ch02-b06
          speaker: narrator
          text: At last, one night, the dog came to the old man in a dream. He told his master to cut down the fig tree above his grave and make a mortar from its wood.
        - id: ch02-b07
          speaker: narrator
          text: When the old man awoke, he did not want to cut down a tree that bore fruit so well each year. He asked his wife what she thought.
        - id: ch02-b08
          speaker: old_woman
          text: We must do what our dog told you. After all that has happened, we can trust his advice.
        - id: ch02-b09
          speaker: narrator
          text: So they felled the fig tree and made a beautiful mortar from the wood. When the rice harvest came, they took the mortar from its shelf and poured in the grain for pounding. In a single blink, every grain turned into a gold coin. The old couple's hearts were glad, and once again they blessed their faithful dog.
    - id: ch03
      title: The Mortar and the Ashes
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Before long, the envious neighbour heard about the mortar. He wasted no time. He went straight to the old couple and asked whether they had one he might borrow. The old man hated to part with such a treasure, but he could never say no. The neighbour walked away with the mortar tucked under his arm.
        - id: ch03-b02
          speaker: narrator
          text: The instant he reached home, he grabbed a great handful of rice. He and his wife began removing the husks. They watched for gold, but instead the rice changed into berries with a sickening smell. The stench drove them from the house. In their fury, they smashed the mortar and set the broken pieces on fire.
        - id: ch03-b03
          speaker: narrator
          text: The old couple next door were deeply upset when they learned what had happened to their mortar. None of the neighbour's excuses made them feel any better.
        - id: ch03-b04
          speaker: narrator
          text: That night, the dog appeared to his master in another dream. He said the old man must go to the neighbour's house, gather the ashes of the burned mortar, and carry them home. Then he was to listen for news that the Daimio, the great lord who ruled that region, would be traveling to the capital.
        - id: ch03-b05
          speaker: narrator
          text: When the Daimio was expected, the old man must take the ashes to the high road where the procession would pass. As soon as it came into view, he must climb the cherry trees and scatter the ashes over them. Then the trees would bloom as they had never bloomed before.
    - id: ch04
      title: The Cherry Trees Bloom
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: This time, the old man did not stop to ask his wife's advice. The moment he got up, he went to his neighbour's house and gathered the ashes of the burned mortar. He placed them carefully in a china vase and carried it to the high road. There he sat down to wait for the Daimio.
        - id: ch04-b02
          speaker: narrator
          text: The cherry trees stood bare. At that season, rich people bought small potted trees and kept them in warm rooms, forcing them to flower early as decorations. But the outdoor trees would not show even the smallest bud for more than a month.
        - id: ch04-b03
          speaker: narrator
          text: The old man had not waited long when a cloud of dust appeared far down the road. He knew the Daimio's procession was coming. On it came. Every man wore his finest clothes, and the people lining the road bowed with their faces to the ground.
        - id: ch04-b04
          speaker: narrator
          text: The old man alone did not bow. The great lord noticed him and angrily ordered a courtier to find out why he had disobeyed the ancient custom.
        - id: ch04-b05
          speaker: daimio
          text: Go and ask that man why he refuses to bow as our customs require.
          emotion: angry
        - id: ch04-b06
          speaker: narrator
          text: Before the messenger could reach him, the old man climbed the nearest tree and scattered his ashes far and wide. In an instant, white blossoms flashed into life across branches that should have remained bare for another month. The Daimio's heart filled with joy. He sent for the old man, welcomed him at the castle, and gave him rich gifts.
    - id: ch05
      title: Envy's End
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Of course, the envious neighbour soon heard what had happened. Hatred filled him. He hurried to the place where he had burned the mortar and scraped together the few ashes the old man had left. Then he took them to the road, hoping his own luck would be just as good, or perhaps even better.
        - id: ch05-b02
          speaker: narrator
          text: His heart beat with delight when he first saw the Daimio's procession. He made himself ready and waited for exactly the right moment.
        - id: ch05-b03
          speaker: narrator
          text: As the Daimio came near, the neighbour hurled a great handful of ashes over the trees. Not one bud or blossom appeared. Instead, the ashes blew straight back into the eyes of the Daimio and his warriors, making them cry out in pain.
        - id: ch05-b04
          speaker: daimio
          text: Seize that wicked man! Bind him and throw him into prison!
          emotion: angry
        - id: ch05-b05
          speaker: narrator
          text: The neighbour remained in prison for many months. By the time he was released, everyone in his village knew about his wickedness. They refused to let him live among them any longer. He still would not give up his evil ways, so he went from bad to worse and came to a miserable end.
