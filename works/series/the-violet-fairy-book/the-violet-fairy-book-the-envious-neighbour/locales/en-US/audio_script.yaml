audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, steady, and quietly mysterious
        timbre: clear and resonant
        pace: measured
        pitch: medium
    old_man:
      display_name: Old Man
      tts:
        delivery: gentle, earnest, and plainspoken
        timbre: soft and weathered
        pace: unhurried
        pitch: low
    old_woman:
      display_name: Old Woman
      tts:
        delivery: warm, sensible, and quietly trusting
        timbre: mellow and clear
        pace: measured
        pitch: medium-low
    envious_neighbour:
      display_name: Envious Neighbour
      tts:
        delivery: impatient, grasping, and falsely pleasant when needed
        timbre: dry and tense
        pace: moderately quick
        pitch: medium
    daimio:
      display_name: Daimio
      tts:
        delivery: dignified, commanding, and responsive
