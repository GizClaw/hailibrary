audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 编者
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清晰的成年男声
        pace: 从容舒展
        pitch: 中低音
    older_boy:
      display_name: 大男孩
      tts:
        delivery: 直率而急促的呼喊
        timbre: 清亮有力的少年声
        pace: 偏快
        pitch: 中高音
    elsa:
      display_name: 埃尔莎
      tts:
        delivery: 温顺真挚，情绪自然流露
        timbre: 清澈柔和的年轻女声
        pace: 适中
        pitch: 中高音
    kisika:
      display_name: 基西卡
      tts:
        delivery: 天真活泼而亲切
        timbre: 明亮轻盈的少女声
        pace: 轻快
        pitch: 高音
    hostess:
      display_name: 通特拉森林的女主人
      tts:
        delivery: 威严慈爱，言语从容
        timbre: 沉静温润的成年女声
        pace: 舒缓
        pitch: 中音
    calling_voice:
      display_name: 林中的声音
      tts:
        delivery: 清楚而遥远的召唤
        timbre: 柔和空灵的成年女声
        pace: 适中
        pitch: 中高音
    old_man:
      display_name: 长胡子小老头
      tts:
        delivery: 简短沉着而神秘
        timbre: 沙哑低沉的老年男声
        pace: 缓慢
        pitch: 低音
    prince:
      display_name: 王子
      tts:
        delivery: 诚恳热切而有礼
        timbre: 清朗稳重的年轻男声
        pace: 适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 无人敢进的森林
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            很久很久以前，有个湖泊遍布的国度。国土中央是一大片荒原，名叫通特拉森林，谁也不敢走进去。偶尔有几个胆大的人来到边缘，回去后说，他们在密林里看见一幢破房子。房子四周挤满人形怪物，像蜂群一样在草地上乱窜。男人个个肮脏褴褛，旁边还有许多老妇和衣不蔽体的孩子。
        - id: ch01-b02
          speaker: narrator
          text: >-
            有天夜里，一个农夫从宴席回家，无意间又往森林里走了一程。他回来以后，也说那里有数不清的女人和孩子围着一堆熊熊大火。有人坐在地上，有人在平坦的草地上跳古怪的舞。一个老妪手握宽大的铁勺，不时拨弄火堆。铁勺一碰通红的灰烬，孩子们便像夜枭那样尖叫着逃开，过了很久才敢偷偷溜回来。
        - id: ch01-b03
          speaker: narrator
          text: >-
            还有人一两次见过一个长胡子小老头从树林里爬出来，背上的口袋比他本人还大。女人和孩子跟在旁边哭，一路想把口袋从他背上扯下来，他却甩开她们，只管往前走。传闻中还有一只马驹般大的华丽黑猫。农夫说得太离奇，旁人不能全信，谁也分不清真假。不过有一点不会错，通特拉森林确实怪事不断。
        - id: ch01-b04
          speaker: narrator
          text: >-
            这片地方属于瑞典国王。他不止一次下令，要人砍掉那片闹鬼的树林，可臣民中没有一个敢服从。后来终于有个格外大胆的伐木人，一斧砍进树干。树上立刻涌出鲜血，还响起人受伤时那样的惨叫。伐木人吓得魂飞魄散，两条腿能跑多快便跑多快。从此，不管国王怎样命令、威吓，也休想再赶一个人到那片魔法荒原去。
        - id: ch01-b05
          speaker: narrator
          text: >-
            离森林几英里远，有一座大村庄。村里一个农夫刚娶了年轻妻子，那女人便把家里搅得天翻地覆，夫妻俩从早到晚争吵打斗。农夫和前妻有个女儿，叫埃尔莎。她是个温顺安静的好姑娘，只想平平和和地过日子，继母却偏不许，从早到晚对她又打又骂。偏偏父亲也被妻子拿捏得死死的，谁也救不了这个可怜的孩子。
        - id: ch01-b06
          speaker: narrator
          text: >-
            埃尔莎这样熬了两年。一天，她跟村里的孩子出去摘草莓。大家一路走到通特拉森林边缘，那里尽是最好的草莓，红艳艳的果子仿佛染红了草地。孩子们先趴下吃个痛快，再往篮子里装。忽然，一个大男孩喊了起来。
        - id: ch01-b07
          speaker: older_boy
          text: >-
            快跑！拼命跑！我们已经进了通特拉森林！
          emotion: fearful
        - id: ch01-b08
          speaker: narrator
          text: >-
            孩子们一下跳起，发疯似的逃了。只有埃尔莎还留在树下。她走得比别人远，刚发现一大片最好的草莓，实在舍不得离开。
        - id: ch01-b09
          speaker: elsa
          text: >-
            有什么要紧呢？这里的人再坏，也坏不过我的继母。
        - id: ch01-b10
          speaker: narrator
          text: >-
            她抬起头。一条颈上挂着银铃的小黑狗正汪汪叫着朝她跑来，后面跟着一位从头到脚都穿着绫罗的少女。
        - id: ch01-b11
          speaker: kisika
          text: >-
            安静。你没有跟他们一起逃走，我真高兴。留下来做我的朋友吧！我们每天都能玩好玩的游戏，还能来摘草莓。只要我不准，谁也不敢打你。走，我带你去见母亲。
        - id: ch01-b12
          speaker: narrator
          text: >-
            少女牵起埃尔莎的手，带她往森林深处走，小黑狗在两人身边欢喜地蹦跳。很快，无数奇景展现在埃尔莎惊讶的眼前，她简直以为自己真的到了天堂。果树和灌木挂满果实，比最鲜艳的蝴蝶还绚丽的鸟儿停在枝头，歌声充满了四周。它们一点也不怕人，任两个女孩捧在手里，抚摸金银闪耀的羽毛。花园中央有一幢玻璃与宝石灿然生辉的房子，门口坐着一位衣饰华贵的妇人。
        - id: ch01-b13
          speaker: hostess
          text: >-
            你带来的这位客人是谁？
        - id: ch01-b14
          speaker: kisika
          text: >-
            我看见她独自在树林里，就带回来给我做伴。您会答应让她留下吧？
        - id: ch01-b15
          speaker: narrator
          text: >-
            母亲笑了笑，没有回答，只用锐利的目光把埃尔莎从头到脚仔细打量一遍。接着，她叫女孩走近，摸摸她的脸，温和地问她父母是否还活着，是不是真心想留在这里。埃尔莎俯身吻了她的手，又跪下来，把脸埋进她膝头，抽泣着开口。
        - id: ch01-b16
          speaker: elsa
          text: >-
            我的母亲去世许多年了。父亲还活着，可他心里没有我，继母整天打我。我做什么都不对。求您让我留下吧。我能照料牲畜，也肯做您吩咐的任何活。您说什么，我都听。千万别送我回去。我没跟其他孩子一起回家，继母非把我打个半死不可。
          emotion: sad
        - id: ch01-b17
          speaker: hostess
          text: >-
            好吧，让我想想能为你做些什么。
        - id: ch01-b18
          speaker: narrator
          text: >-
            女主人起身进屋以后，基西卡安慰埃尔莎，说自己从母亲方才的神色就看得出来，等她考虑好了，一定会答应。基西卡也进屋找母亲去了，留下埃尔莎一会儿满怀希望，一会儿又害怕起来，只觉得少女仿佛永远也不会回来。终于，她看见基西卡拿着一只盒子穿过草地走来。

    - id: ch02
      title: 盒子里的海
      blocks:
        - id: ch02-b01
          speaker: kisika
          text: >-
            母亲还要想想怎样安置你，所以今天准我们一起玩。我真希望你永远留下，我可舍不得你走。你到过海上吗？
        - id: ch02-b02
          speaker: elsa
          text: >-
            海？那是什么？我从来没听说过！
          emotion: surprised
        - id: ch02-b03
          speaker: kisika
          text: >-
            我马上让你看看。
        - id: ch02-b04
          speaker: narrator
          text: >-
            她揭开盒盖。盒底放着一小片斗篷、一枚贻贝壳和两片鱼鳞。斗篷碎片上闪着两滴水珠，她把水珠抖到地上。转眼之间，花园、草坪和四周的一切都彻底消失了，仿佛大地裂开，把它们一口吞没。放眼望去只剩下一片无边的水，远处似乎与天空相接，她们脚下仅有一小块干地。
        - id: ch02-b05
          speaker: narrator
          text: >-
            基西卡把贻贝壳放到水上，又拿起两片鱼鳞。贝壳越变越大，化成一艘漂亮的小船，足够坐下十二个孩子。两个女孩登上船，埃尔莎每一步都小心得不得了，惹来朋友一阵笑。基西卡拿鱼鳞当舵，波浪像摇篮一样轻轻摇着她们。她们一路漂去，遇见了别的船，船里坐满纵情歌唱、欢笑作乐的男人。
        - id: ch02-b06
          speaker: kisika
          text: >-
            他们唱了歌，我们也该唱一首回敬。
        - id: ch02-b07
          speaker: narrator
          text: >-
            埃尔莎一首歌也不会，只能由基西卡独自唱给他们听。男人们唱的歌，她一句也没听懂，却留意到“基西卡”这个词反复出现。她问那是什么意思，才知道这正是少女的名字。海上的一切实在太快活了，要不是远处传来召唤，她们简直会永远留在那里。
        - id: ch02-b08
          speaker: calling_voice
          text: >-
            孩子们，该回家了！
        - id: ch02-b09
          speaker: narrator
          text: >-
            基西卡取出盒里的布片，在水中一蘸。眨眼间，她们又站在花园中央的房子旁，四周干燥坚实，一滴水也没有。贻贝壳和鱼鳞收回盒里，她们一起进了屋。
        - id: ch02-b10
          speaker: narrator
          text: >-
            她们走进宽敞的大厅。二十四位衣着华贵的妇人围桌而坐，看起来都要去参加婚礼。女主人坐在上首的金椅上。埃尔莎不知道该往哪里看，因为目光碰到的每一样东西，都美得超出她最奇丽的梦。她跟大家坐在一起，吃着鲜美水果，再次觉得自己一定到了天堂。
        - id: ch02-b11
          speaker: narrator
          text: >-
            宾客们轻声交谈，说的却是埃尔莎从未听过的语言，她完全不懂大家在谈什么。女主人回头向椅子后面的女仆低声吩咐几句。女仆离开大厅，回来时带着一个胡子比身子还长的小老头。他先向女主人深深鞠了一躬，随后静静站在门边。
        - id: ch02-b12
          speaker: hostess
          text: >-
            看见这个女孩了吗？我要收她做女儿。你照她的样子做一个一模一样的替身，送回她原来的村子。
        - id: ch02-b13
          speaker: narrator
          text: >-
            小老头像量尺寸一样，把埃尔莎从头看到脚，又向女主人鞠了一躬，离开大厅。饭后，女主人亲切地问埃尔莎，基西卡求自己把她留下，而她也说愿意住在这里，这是否当真。埃尔莎顿时跪倒在地，亲吻女主人的手和脚，感谢她让自己逃离狠毒的继母。
        - id: ch02-b14
          speaker: hostess
          text: >-
            起来吧。只要你听话懂事，一切都会顺利。我会照料你，让你什么都不缺，直到你长大，能照顾自己。我的贴身女仆教基西卡各种精巧手艺，也会教你。
        - id: ch02-b15
          speaker: narrator
          text: >-
            不久，小老头扛着装满黏土的模具回来，左手还提着一只有盖的小篮子。他把模具和篮子放在地上，抓起一把黏土，捏成真人大小的偶人。做完以后，他在偶人胸口钻出一个洞，塞进一小块面包。随后，他从篮中抽出一条蛇，硬把蛇塞进那具空洞的身体。
        - id: ch02-b16
          speaker: old_man
          text: >-
            现在只差这个姑娘的一滴血。
        - id: ch02-b17
          speaker: narrator
          text: >-
            埃尔莎脸色煞白，以为自己要把灵魂卖给恶魔。
        - id: ch02-b18
          speaker: hostess
          text: >-
            别怕！我们取你的血不是为了害你，是为了让你得到自由和幸福。
          emotion: calm
        - id: ch02-b19
          speaker: narrator
          text: >-
            女主人拿出细小的金针，在埃尔莎手臂上刺了一下，再把沾血的针交给小老头。小老头将针扎进偶人心口。事情做完，他把偶人装进篮子，答应第二天让大家看看，他究竟完成了一件多漂亮的作品。

    - id: ch03
      title: 第十三道菜
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            第二天清晨，埃尔莎从丝绸床上醒来，头下还枕着柔软洁白的枕头。椅背上搭着一件美丽的新衣，已经备好等她穿上。女仆进来替她梳理长发，还带来最上等的贴身衣物。可最让她高兴的，还是手里那双绣花小鞋，因为狠心的继母从前总逼她赤脚四处奔走。
        - id: ch03-b02
          speaker: narrator
          text: >-
            她兴奋得没有留意，昨天穿过的粗布衣服已经在夜里神奇地消失。是谁拿走的呢？她过些时候自然会知道，我们却已经猜得到。那些衣服穿到了替她回村的偶人身上。太阳升起时，偶人已经长成和她一样大小，谁也分不出两个女孩。埃尔莎迎面看见昨天模样的自己，吓得连忙后退。
        - id: ch03-b03
          speaker: hostess
          text: >-
            不用怕，这个泥人伤不了你。它会回到你继母身边，替你挨打。无论她打得多狠，它也不会疼。要是那个恶毒的女人始终不悔改，你的替身终会给她应得的惩罚。
          emotion: calm
        - id: ch03-b04
          speaker: narrator
          text: >-
            从此，埃尔莎过上了寻常幸福孩子的生活，仿佛从婴儿时起，就在一只可爱的金摇篮里被人哄着入睡。她再没有任何忧虑和烦恼，功课也一天比一天容易，过去的岁月渐渐像一场越来越遥远的噩梦。可她越幸福，就越惊奇于身边的一切，也越深信背后藏着一种未知而强大的力量。
        - id: ch03-b05
          speaker: narrator
          text: >-
            院子里有块巨大的花岗岩，离房子约二十步。每到吃饭时，长胡子小老头便走到石旁，拿出银色短杖，在岩石上敲三下，响声远处都能听见。第三下刚响，一只大金公鸡就跳到石顶。它一面啼叫一面拍翅膀，岩石随即打开，里面总会出来一样东西。最先飞出的是一张摆满菜肴的长桌，桌上的份数正好够所有人享用，它不用人搬，自己便飞进屋里。
        - id: ch03-b06
          speaker: narrator
          text: >-
            金公鸡再叫一遍，许多椅子也显现出来，跟着桌子飞进屋。随后又有葡萄酒、苹果和别的水果，一切都不用任何人操劳。众人吃饱后，小老头再次敲响岩石。金公鸡重新啼叫，菜肴、桌子、椅子和盘子便全都依次飞回岩石中央。
        - id: ch03-b07
          speaker: narrator
          text: >-
            只有第十三道菜从来没人肯吃。轮到它时，一只巨大的黑猫便跑到石顶，站在金公鸡旁边，菜盘留在另一边。它们一同等着小老头。他来了，一手端菜，把猫夹在腋下，又让公鸡跳上肩头，四个一起消失在石中。这块神奇岩石不光藏着食物，还藏着衣服和家里需要的一切。
        - id: ch03-b08
          speaker: narrator
          text: >-
            起初，大家吃饭时常说一种埃尔莎从未听过的语言。女主人和基西卡一点点帮助她，她才慢慢听懂，可又过了许多年，才终于能亲口说出来。一天，她问基西卡，为什么第十三道菜天天送来，又天天原样送走。基西卡知道的并不比她多，不过大概把这个问题告诉了母亲。几天后，女主人郑重地找埃尔莎谈话。
        - id: ch03-b09
          speaker: hostess
          text: >-
            别再为无益的好奇心烦恼了。你想知道我们为什么不吃第十三道菜，对吗？那是蕴藏福泽的菜。只要尝上一口，我们在这里的幸福生活就会结束。人若不贪心地把每一样东西都抢走，肯留下一份，感谢赐福的人，这个世界就会好得多。贪婪是人最大的过错。
        - id: ch03-b10
          speaker: narrator
          text: >-
            岁月像风一样从埃尔莎身边掠过。她长成了美丽的女子，也学会许多在故乡村庄里永远学不到的事。基西卡却还是初见那天的少女模样。每天早晨，两人照旧用一个小时读书写字。埃尔莎总想把能学的全都学会，基西卡却更爱孩子的游戏。兴致一来，她就把功课丢在一边，带着宝贝盒子去海上玩，而在那里，从来不会有什么伤害她。
        - id: ch03-b11
          speaker: kisika
          text: >-
            真可惜，你已经长这么大，再也不能陪我玩了。
          emotion: sad

    - id: ch04
      title: 必须到来的分别
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            这样的日子一晃过去九年。一天，女主人把埃尔莎叫进自己的房间。她平时很少这样召见埃尔莎，姑娘既惊讶又害怕，心一下沉了下去，只怕有什么祸事将要临头。跨过门槛时，她看见女主人双颊发红，眼里含满泪水，又连忙把泪擦掉，像是不愿让她发现。
        - id: ch04-b02
          speaker: hostess
          text: >-
            我最亲爱的孩子，我们分别的时候到了。
          emotion: sad
        - id: ch04-b03
          speaker: elsa
          text: >-
            分别？不，只要我们还活着，就绝不能分开！您曾经张开双臂收留我，现在怎么能把我推走？
          emotion: sad
        - id: ch04-b04
          speaker: narrator
          text: >-
            埃尔莎说着，把头埋进女主人的膝上。
        - id: ch04-b05
          speaker: hostess
          text: >-
            安静些，孩子。你不知道，为了让你幸福，我什么都肯做。如今你已经长大，我没有权利再把你留下。你必须回到凡人的世界，那里有幸福等着你。
          emotion: calm
        - id: ch04-b06
          speaker: elsa
          text: >-
            求您千万别赶我走。我不要别的幸福，只想守在您身边，直到生命终结。让我做您的贴身女仆，什么活我都肯干，只求别把我丢到外面的世界。您先带我来到天堂，又把我送回更坏的地方，那还不如当初让我留在继母身边。
          emotion: sad
        - id: ch04-b07
          speaker: hostess
          text: >-
            亲爱的孩子，别这么说。为了让你幸福，有些事无论让我多么难受，也非做不可。你是普通凡人，终有一天会死，不能继续住在这里。我们虽然有人的身体，却并不是人，这缘故你很难明白。将来，你会遇到一位天生与你相配的丈夫，和他幸福生活，直到死亡把你们分开。要送你走，我也非常痛苦，可你必须接受。
          emotion: sad
        - id: ch04-b08
          speaker: narrator
          text: >-
            说完，她拿起金梳，轻轻梳过埃尔莎的头发，又让姑娘回去睡觉。可怜的埃尔莎哪里睡得着！她只觉得往后的一生横在自己眼前，就像一个没有半点星光的漫漫黑夜。
        - id: ch04-b09
          speaker: narrator
          text: >-
            现在，让我们回头看看埃尔莎的故乡，瞧瞧这些年里，她的替身过得怎样。恶毒的女人很少会随着年纪增长而变得善良，埃尔莎的继母自然也不例外。好在代替女孩的泥人不会觉得疼，所以日夜落在它身上的毒打都毫无作用。父亲偶尔想来帮女儿，妻子便立刻转过来攻击他，结果只会比原先更糟。
        - id: ch04-b10
          speaker: narrator
          text: >-
            一天，继母把女孩狠毒地打了一顿，还威胁说要把她活活杀死。她气得发狂，伸出双手掐住泥人的喉咙。就在这时，一条黑蛇突然从泥人口中钻出，一口咬中女人的舌头。她连一点声音也没能发出，便倒在地上死了。
        - id: ch04-b11
          speaker: narrator
          text: >-
            夜里，丈夫回到家，只见妻子横在地上，尸体肿胀变形，女儿却不见了。他的惨叫把邻居们从各自的屋里引来，可谁也解释不了事情的来龙去脉。大家只知道中午听过一阵很大的动静，但这样的吵闹天天都有，谁也没放在心上。此后整整半天，四周一直安安静静，也没人看见女儿去了哪里。
        - id: ch04-b12
          speaker: narrator
          text: >-
            邻居替女人收殓了遗体。疲惫的丈夫上床时，心里还暗暗庆幸，总算摆脱这个把家里搅得不得安宁的泼妇。他看见桌上有一片面包，正好肚子饿，便吃了下去。
        - id: ch04-b13
          speaker: narrator
          text: >-
            第二天早晨，人们发现他也死了，尸体肿胀变形，和妻子的一模一样。原来那片面包，正是造出泥人的小老头当初亲手放进偶人身体里的。几天后，人们把他也葬进坟墓，埋在妻子身旁。从此，再也没人听到他们女儿的消息。
        - id: ch04-b14
          speaker: narrator
          text: >-
            而在通特拉森林里，埃尔莎一整夜都在哭，悲叹自己要被赶出深爱的家园。

    - id: ch05
      title: 鹰与王后
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            第二天早晨，埃尔莎起床后，女主人把一枚金印戒戴到她手指上，又用丝带穿起一只小金盒，挂到她颈间。随后，她叫来长胡子小老头，强忍着眼里的泪水向埃尔莎告别。姑娘想要说话，可还没来得及哭着说出感谢，小老头已经用银杖在她头上轻轻点了三下。
        - id: ch05-b02
          speaker: narrator
          text: >-
            埃尔莎立刻知道自己正在变成一只鸟。翅膀从手臂下面伸了出来，双脚变成鹰足，趾上长着长长的利爪。她的鼻子弯成了尖锐的鸟喙，羽毛也覆盖了全身。接着，她直冲高空，向云端飞去，仿佛真是一只刚刚破壳而出的鹰。
        - id: ch05-b03
          speaker: narrator
          text: >-
            她连续几天向南方飞去，翅膀疲累时，才偶尔停下来休息一阵，肚子却从来不知道饥饿。一天，她正飞过一片茂密的森林。下方的猎犬对着她凶猛狂吠，可它们自己没有翅膀，无论怎样叫，也够不着高空的鹰。忽然，一阵尖锐的剧痛穿透全身。一支箭射中了她，她从空中坠落下来。
        - id: ch05-b04
          speaker: narrator
          text: >-
            埃尔莎恢复知觉时，发现自己躺在一丛灌木下，已经恢复了原来的身体。方才究竟发生了什么，自己又怎样落到这里，全像一场已经远去的噩梦。她正疑惑下一步该怎么办，国王的儿子骑马经过这里。他一看见埃尔莎，立刻从马背上跳下来，走上前握住她的手。
        - id: ch05-b05
          speaker: prince
          text: >-
            啊，今天早晨，真是幸运的机缘把我带到了这里！亲爱的姑娘，整整半年，我每晚都梦见自己有一天会在这片树林找到你。我已经无数次从这里经过，每次都空手而归，可从没放弃希望。今天，我本来要找一只被我射中的大鹰。没想到，我没有找到鹰，却找到了你。
          emotion: happy
        - id: ch05-b06
          speaker: narrator
          text: >-
            王子把埃尔莎扶上自己的马，和她一同骑回城里。到了王宫，老国王也十分亲切地接待了她。几天后，王子与埃尔莎举行了婚礼。就在新娘把面纱仔细理到头发上时，五十辆大车忽然来到城中。每一辆车都满载美丽的东西，那全是通特拉森林的女主人送给埃尔莎的礼物。
        - id: ch05-b07
          speaker: narrator
          text: >-
            后来，老国王去世了，埃尔莎继承王位，成了王后。她一直活到年老，才亲口把自己的这段经历讲成这个故事。可从那以后，世上再也没有人见过通特拉森林里的人，也再没有人听到过关于那片神奇森林的任何消息。
        - id: ch05-b08
          speaker: narrator
          text: >-
            这个故事选自《爱沙尼亚童话》。
