  chapters:
    - id: ch01
      title: The Forbidden Moor
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long, long ago, in a land filled with lakes, there lay a vast moor called the Tontlawald. No one dared to set foot there. Now and then, curiosity drew a few bold people as far as its borders. When they returned, they told of a ruined house hidden in a grove of thick trees. Around it, beings shaped like men swarmed over the grass like bees. They were as dirty and ragged as wandering gipsies, and among them were many old women and half-dressed children.
        - id: ch01-b02
          speaker: narrator
          text: One night, a peasant returning home from a feast wandered a little farther into the moor. He came back with much the same tale. A countless number of women and children had gathered around a huge fire. Some sat on the ground, while others danced strange dances across the smooth grass. An old crone held a broad iron ladle. Whenever she touched the glowing ashes with it, the children rushed away, shrieking like night owls. It took them a long while to venture back.
        - id: ch01-b03
          speaker: narrator
          text: Once or twice, people had also seen a little old man come creeping out of the forest. His beard was long, and he carried a sack bigger than himself. Women and children ran beside him, weeping and trying to drag the sack from his back. He shook them away and went on. There was even talk of a magnificent black cat as large as a foal. But no one could believe every wonder the peasant described, and it was hard to tell which parts of his story were true.
        - id: ch01-b04
          speaker: narrator
          text: Yet strange things certainly happened in the Tontlawald. This part of the country belonged to the King of Sweden, and more than once he ordered the haunted wood cut down. No one had the courage to obey. At last, one man, bolder than all the rest, struck his axe into a tree. A stream of blood followed the blow, and shrieks rang out as if a human being were in pain. The terrified woodcutter ran as fast as his legs could carry him. After that, neither orders nor threats could drive anyone onto the enchanted moor.
        - id: ch01-b05
          speaker: narrator
          text: A few miles away stood a large village. A peasant there had recently married a young woman, and from then on the house knew no peace. The two of them fought and quarreled all day.
        - id: ch01-b06
          speaker: narrator
          text: The peasant had a daughter from his first marriage. Her name was Elsa. She was a quiet, good-hearted girl who wanted only to live peacefully, but her stepmother beat and cuffed her from morning until night. The woman ruled Elsa's father as well, so he did nothing to stop her.
        - id: ch01-b07
          speaker: narrator
          text: Elsa endured this for two years. Then one day she went strawberry picking with the other village children. They wandered farther and farther until they reached the edge of the Tontlawald. The finest berries grew there, turning the grass red. The children ate their fill and began heaping berries into their baskets. Then an older boy suddenly cried out.
        - id: ch01-b08
          speaker: older_boy
          text: Run! Run as fast as you can! We're inside the Tontlawald!
          emotion: fearful
        - id: ch01-b09
          speaker: narrator
          text: The children leaped up and raced away. Only Elsa stayed behind. She had wandered beneath the trees and found the best patch of all. She heard the warning, but she could not bring herself to leave the strawberries.
        - id: ch01-b10
          speaker: elsa
          text: Why should it matter? Whoever lives here cannot be worse than my stepmother.
        - id: ch01-b11
          speaker: narrator
          text: Just then a little black dog came barking toward her. A silver bell hung from its neck, and behind it walked a maiden dressed entirely in silk.
        - id: ch01-b12
          speaker: kisika
          text: Hush now. I am glad you stayed when the others ran away. Come and be my friend. We can play together and gather strawberries every day. If I forbid it, no one will dare beat you. Come. I'll take you to my mother.
        - id: ch01-b13
          speaker: narrator
          text: The maiden took Elsa's hand and led her deeper into the forest. The little dog bounded beside them, barking happily.
        - id: ch01-b14
          speaker: narrator
          text: Wonders and splendors opened before Elsa's astonished eyes. She truly thought she must have reached Heaven. Fruit trees and bushes stood everywhere, their branches heavy with fruit. Birds gayer than the brightest butterflies filled the air with song. They were not shy. They let the girls take them in their hands and stroke their gold and silver feathers. In the middle of the garden stood a dwelling that shone with glass and precious stones. A woman in rich clothes sat in the doorway.
        - id: ch01-b15
          speaker: lady
          text: What sort of guest have you brought me?
        - id: ch01-b16
          speaker: kisika
          text: I found her alone in the forest, so I brought her home to be my companion. May she stay with us?
        - id: ch01-b17
          speaker: narrator
          text: The woman laughed without answering and looked Elsa over carefully. Then she called her closer, stroked her cheeks, and spoke kindly. She asked whether Elsa's parents were alive and whether she truly wished to remain there.
        - id: ch01-b18
          speaker: narrator
          text: Elsa bent down and kissed the woman's hand. Then she sank to her knees, buried her face in the lady's lap, and poured out her sorrow through her sobs.
        - id: ch01-b19
          speaker: elsa
          text: My mother has been under the ground for many years. My father is alive, but I mean nothing to him. My stepmother beats me all day, and nothing I do is ever right. Please let me stay. I'll tend your flocks or do any work you give me. I'll obey every word. Only don't send me back. She may half kill me because I did not return with the others.
          emotion: sad
        - id: ch01-b20
          speaker: lady
          text: Well, we shall see what can be done with you.
        - id: ch01-b21
          speaker: narrator
          text: Smiling, the lady rose and entered the house.
        - id: ch01-b22
          speaker: kisika
          text: Don't be afraid. My mother will be your friend. I could tell from her face that she means to grant your wish once she has thought it over.
          emotion: calm
        - id: ch01-b23
          speaker: narrator
          text: Kisika told Elsa to wait and went into the house to find her mother. Left alone, Elsa was tossed back and forth between hope and fear. Every moment seemed to stretch, until she felt as if Kisika would never return.
    - id: ch02
      title: The Sea in the Little Box
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: At last Kisika crossed the grass, carrying a box.
        - id: ch02-b02
          speaker: kisika
          text: Mother says we may play today while she decides what to do with you. I hope you can stay forever. I could not bear to see you go. Have you ever been to sea?
        - id: ch02-b03
          speaker: elsa
          text: The sea? What is that? I have never even heard of it!
          emotion: surprised
        - id: ch02-b04
          speaker: kisika
          text: Then I will show you.
        - id: ch02-b05
          speaker: narrator
          text: Kisika lifted the lid. At the very bottom of the box lay a scrap from a cloak, one mussel shell, and two fish scales. Two drops of water sparkled on the cloth. She shook those drops onto the ground. In an instant, the garden, the lawn, and everything around them vanished as completely as if the earth had opened and swallowed it all. Water stretched as far as Elsa could see and seemed to touch Heaven itself. Only a tiny patch beneath the girls' feet remained dry.
        - id: ch02-b06
          speaker: narrator
          text: Kisika set the mussel shell on the water and took the fish scales in her hand. The shell grew larger and larger until it became a pretty little boat, roomy enough for twelve children. The girls climbed in. Elsa stepped very cautiously, and Kisika laughed at her for it. Using the scales as a rudder, Kisika guided the boat onward. The waves rocked them softly, as though they lay in a cradle. At last they met other boats filled with men who were singing and making merry.
        - id: ch02-b07
          speaker: kisika
          text: We should sing them a song in return.
        - id: ch02-b08
          speaker: narrator
          text: Elsa did not know a single song, so Kisika had to sing by herself. Elsa could not understand the words sung by the men in the other boats. Still, she noticed one word that came back again and again. The word was “Kisika.” Elsa asked her companion what it meant, and the girl explained that Kisika was her own name.
        - id: ch02-b09
          speaker: narrator
          text: The time passed so pleasantly that they might have stayed forever. Then a voice called across the water.
        - id: ch02-b10
          speaker: calling_voice
          text: Children, it is time to come home!
        - id: ch02-b11
          speaker: narrator
          text: Kisika drew the little box from her pocket and took out the scrap of cloth. She dipped the cloth into the water. In a flash, both girls were standing close to the splendid house in the middle of the garden. Everything around them was dry and firm, and not a trace of water remained anywhere. Kisika placed the mussel shell, the two fish scales, and the cloth safely back in the box. Then the girls went inside.
        - id: ch02-b12
          speaker: narrator
          text: They entered a great hall. Twenty-four richly dressed women sat around a table, looking as though they were about to attend a wedding. The lady of the house occupied a golden chair at its head. Elsa hardly knew where to look, because everything her eyes found was lovelier than anything she had imagined. She sat with the others and ate delicious fruit, certain once more that she must be in Heaven. The guests spoke softly among themselves, but their words were strange to her, and she understood nothing.
        - id: ch02-b13
          speaker: narrator
          text: The lady whispered to a maid, who soon returned with a little old man. His beard was longer than his whole body. He bowed deeply and waited by the door.
        - id: ch02-b14
          speaker: lady
          text: Look at this girl. I intend to adopt her as my daughter. Make an exact copy of her and send it back to her village in her place.
        - id: ch02-b15
          speaker: narrator
          text: The old man studied Elsa as if measuring her. Then he bowed and left.
        - id: ch02-b16
          speaker: lady
          text: Kisika has asked me to let you remain with her. You told her that you want to live here. Is that true?
        - id: ch02-b17
          speaker: narrator
          text: At those words, Elsa fell to her knees. In her gratitude at escaping her cruel stepmother, she kissed the lady's hands and feet. Her hostess raised her gently from the floor and patted her on the head.
        - id: ch02-b18
          speaker: lady
          text: If you are good and obedient, all will be well. I will care for you and give you everything you need until you are grown and can care for yourself. My waiting-maid teaches Kisika fine handiwork, and she will teach you too.
        - id: ch02-b19
          speaker: narrator
          text: Before long the old man returned. A mould full of clay rested on his shoulders, and in his left hand he carried a small covered basket. He set both on the ground, took up a handful of clay, and shaped a doll as large as a living girl. When it was finished, he bored a hole in its breast and put a piece of bread inside. Then he opened the basket, drew out a snake, and forced it into the hollow body.
        - id: ch02-b20
          speaker: old_man
          text: It needs only one drop of the maiden's blood.
        - id: ch02-b21
          speaker: narrator
          text: Elsa turned white with horror. She feared she was selling her soul to the evil one.
        - id: ch02-b22
          speaker: lady
          text: Do not fear. Your blood will serve no evil purpose. It will bring you freedom and happiness.
          emotion: calm
        - id: ch02-b23
          speaker: narrator
          text: The lady took out a tiny golden needle and pricked Elsa's arm. Then she handed the needle to the old man. He stuck it into the heart of the clay doll. Once that was done, he lifted the figure, laid it in the basket, and covered it. He promised them all that by the next day they would see what a beautiful piece of work he had finished.
    - id: ch03
      title: Nine Years in the Tontlawald
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The next morning Elsa woke in a silken bed with soft white pillows. A beautiful dress lay ready across the back of a chair. A maid came in to comb Elsa's long hair and brought the finest linen for her to wear. Yet nothing delighted Elsa as much as the little pair of embroidered shoes she held in her hands. Until then, her cruel stepmother had forced her to run everywhere barefoot.
        - id: ch03-b02
          speaker: narrator
          text: In all her excitement, Elsa never wondered where the rough clothes from the day before had gone. They had vanished during the night. Someone, of course, had dressed the doll in them so it could return to the village in her place. By sunrise the figure had grown to Elsa's full size. No one could have told one girl from the other. Elsa started backward in fright when she suddenly met herself exactly as she had looked the day before.
        - id: ch03-b03
          speaker: lady
          text: You need not be frightened. This clay figure cannot hurt you. It will go to your stepmother and take the beatings meant for you, but it can feel no pain. If that wicked woman never changes, your double may one day give her the punishment she deserves.
          emotion: calm
        - id: ch03-b04
          speaker: narrator
          text: From that moment, Elsa lived the life of an ordinary happy child, one who might have been rocked to sleep as a baby in a lovely golden cradle. She had no cares or troubles of any kind. Each day her work seemed easier, while the painful years behind her faded more and more into a bad dream. Yet her happiness only made her wonder more deeply at everything around her. She became certain that some great and unknown power must lie behind all these marvels.
        - id: ch03-b05
          speaker: narrator
          text: In the courtyard, twenty steps from the house, stood a huge block of granite. At mealtimes the old man struck it three times with a small silver staff. At the third blow, a golden cock sprang onto the stone.
        - id: ch03-b06
          speaker: narrator
          text: Each time the golden cock crowed and beat its wings, the rock opened and sent something out. First came a long table. It was already covered with dishes, exactly enough for all the people who would sit around it, and it flew into the house by itself. At the cock's second crow, a number of chairs appeared and flew after the table. Then came wine, apples, and other fruit, all without any work from anyone. When everybody had eaten enough, the old man struck the rock once more. The cock crowed again, and dishes, plates, chairs, and table all flew back into the heart of the stone.
        - id: ch03-b07
          speaker: narrator
          text: One dish was different. It was the thirteenth, and no one ever wished to eat what it held. When its turn came, a huge black cat ran up and stood on the rock beside the cock. The untouched dish waited on the cock's other side. Cat, cock, and dish stayed there until the old man arrived. He lifted the dish in one hand, tucked the great cat beneath his arm, and told the cock to climb onto his shoulder. Then all four vanished into the stone. And food was not the only wonder hidden there. The rock also contained clothes and everything else anyone in the house could want.
        - id: ch03-b08
          speaker: narrator
          text: At first, the people at the table often spoke a language that sounded completely strange to Elsa. The lady and Kisika helped her, and little by little she began to understand what she heard. Even so, years passed before Elsa was able to speak that language herself.
        - id: ch03-b09
          speaker: narrator
          text: One day Elsa asked Kisika why the thirteenth dish always appeared and always went away untouched. Kisika knew no more than Elsa. But she must have repeated the question to her mother, because a few days later the lady spoke seriously to Elsa.
        - id: ch03-b10
          speaker: lady
          text: Do not trouble yourself with useless questions. You want to know why we never eat from the thirteenth dish. It is the dish of hidden blessings. If we tasted it, our happy life here would end. The world would be better if people did not greedily seize everything for themselves, but left something in thanks to the giver. Greed is humankind's worst fault.
        - id: ch03-b11
          speaker: narrator
          text: The years passed like the wind. Elsa grew from a child into a beautiful woman. She gained knowledge of many things that she could never have learned in her native village. Yet Kisika did not seem to grow at all. She remained the same young girl she had been on the day when she first found Elsa among the strawberries.
        - id: ch03-b12
          speaker: narrator
          text: Each morning they spent an hour reading and writing. Elsa wanted to learn all she could. Kisika preferred children's games. Whenever the mood took her, she cast aside her lessons, fetched the treasure box, and went to play on the sea, where no harm ever reached her.
        - id: ch03-b13
          speaker: kisika
          text: It is such a shame that you have grown too big to play with me now.
          emotion: sad
        - id: ch03-b14
          speaker: narrator
          text: In this way, nine years slipped by.
    - id: ch04
      title: The Time to Part
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: After nine years, the lady summoned Elsa to her room one day. Such a summons was unusual, and Elsa wondered why she had been called. Her heart sank because she feared that some evil must be threatening her. As she crossed the threshold, she saw color in the lady's cheeks and tears filling her eyes. The lady dried them quickly, as though she hoped to hide them from Elsa.
        - id: ch04-b02
          speaker: lady
          text: Dearest child, the time has come for us to part.
          emotion: sad
        - id: ch04-b03
          speaker: elsa
          text: Part? No, dear lady. We cannot part until death divides us. You once opened your arms to me. You cannot send me away now.
          emotion: sad
        - id: ch04-b04
          speaker: narrator
          text: Elsa buried her head in the lady's lap.
        - id: ch04-b05
          speaker: lady
          text: Hush, child. You do not know what I would do for your happiness. You are a woman now, and I have no right to keep you here. You must return to the world of men, where joy is waiting for you.
          emotion: sad
        - id: ch04-b06
          speaker: elsa
          text: Please do not send me away. I want no happiness except to live and die beside you. Make me your waiting-maid. Give me any work you please, but do not cast me into the world. It would have been kinder to leave me with my stepmother than to bring me to Heaven first and then send me somewhere worse.
          emotion: sad
        - id: ch04-b07
          speaker: lady
          text: Do not speak that way, dear child. You cannot know all that must be done for your happiness, no matter what it costs me. But this must happen. You are mortal, and one day you will die. You cannot remain here. We may have human bodies, but we are not human, though you cannot easily understand that. One day you will find the husband made especially for you, and you will live happily together until death separates you. Leaving you will hurt me deeply, but you must accept it.
          emotion: sad
        - id: ch04-b08
          speaker: narrator
          text: The lady gently drew her golden comb through Elsa's hair and sent her to bed. Elsa scarcely slept. The life ahead seemed like a dark, starless night.
        - id: ch04-b09
          speaker: narrator
          text: While Elsa lived in the Tontlawald, her clay double had remained in her native village. A cruel woman seldom grows kinder as she grows older, and Elsa's stepmother did not change. Yet the figure that had taken the girl's place could feel no pain. The blows that rained on it night and day made no difference at all. If Elsa's father ever tried to come to his daughter's aid, his wife turned her fury on him, and afterward things were worse than before.
        - id: ch04-b10
          speaker: narrator
          text: One day the stepmother beat the girl terribly and threatened to kill her. Wild with rage, she seized the figure's throat in both hands. A black snake shot from the figure's mouth and stung the woman's tongue. She dropped dead without a sound.
        - id: ch04-b11
          speaker: narrator
          text: That night the husband came home and found his wife dead on the ground. Her body was swollen and disfigured, and the girl was nowhere to be seen. His screams brought the neighbors from their cottages, but none could explain what had happened. They admitted that around midday they had heard a terrible noise. Such disturbances happened every day in that house, so they had paid little attention. For the rest of the day everything had been still, and not one of them had seen the daughter leave.
        - id: ch04-b12
          speaker: narrator
          text: The neighbors prepared the dead woman's body for burial. Her exhausted husband went to bed. In his heart he was glad to have been delivered from the firebrand who had made his home so unhappy. Before lying down, he noticed a slice of bread on the table. He was hungry, so he ate it.
        - id: ch04-b13
          speaker: narrator
          text: In the morning the husband too was found dead, his body as swollen as his wife's. The bread he had eaten was the same piece the old man had placed inside the clay figure while making it. A few days later the peasant was laid in the grave beside his wife. But nothing more was ever heard in the village about their missing daughter.
        - id: ch04-b14
          speaker: narrator
          text: Back in the Tontlawald, Elsa spent the whole night weeping because she was being driven from the home she loved.
    - id: ch05
      title: The Eagle and the Prince
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The next morning the lady slipped a gold seal ring onto Elsa's finger. She hung a little golden box from a ribbon around Elsa's neck, then called for the old man. Holding back her tears, she said farewell.
        - id: ch05-b02
          speaker: narrator
          text: Elsa tried to speak, but before she could sob out her thanks, the old man softly touched her head three times with his silver staff. At once Elsa knew she was changing into a bird. Wings sprang from beneath her arms. Her feet became the feet of an eagle, armed with long claws. Her nose curved itself into a sharp beak, and feathers spread over her whole body. Then she soared high into the air and floated toward the clouds as naturally as though she had truly been hatched an eagle.
        - id: ch05-b03
          speaker: narrator
          text: For several days Elsa flew steadily toward the south. From time to time, when her wings grew tired, she stopped to rest. She never felt any hunger. At last, one day, she found herself flying above a dense forest. Far below, hunting hounds barked fiercely at her. Without wings of their own, they could not come near her. Then, all at once, a sharp pain quivered through her body. An arrow had pierced her, and she tumbled from the sky to the ground.
        - id: ch05-b04
          speaker: narrator
          text: When Elsa came back to her senses, she found herself lying beneath a bush. Her wings, claws, beak, and feathers were gone. She had returned to her own proper human form. Everything that had happened to her, and even the way she had reached that place, lay behind her like a confused and terrible dream.
        - id: ch05-b05
          speaker: narrator
          text: As she wondered what to do, the king's son rode past. He saw her, sprang from his horse, and took her hand.
        - id: ch05-b06
          speaker: prince
          text: What a happy chance brought me here today! For half a year, dear lady, I have dreamed every night that I would find you in this forest. I have ridden through it hundreds of times without success, but I never lost hope. Today I came looking for a great eagle I had shot. Instead of the eagle, I have found you.
          emotion: happy
        - id: ch05-b07
          speaker: narrator
          text: The prince helped Elsa onto his horse and rode with her all the way to the town. There he brought her before his father, the old king, who received the unknown young woman with kindness and grace.
        - id: ch05-b08
          speaker: narrator
          text: Only a few days later, the wedding took place. As Elsa stood arranging the veil over her hair, fifty carts arrived in the town. Every one of them was loaded with beautiful things. They were wedding gifts sent to Elsa by the lady of the Tontlawald.
        - id: ch05-b09
          speaker: narrator
          text: After the old king died, Elsa became queen. When she herself was old, she told this story.
        - id: ch05-b10
          speaker: narrator
          text: And that was the last anyone ever heard of the Tontlawald.
