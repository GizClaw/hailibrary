        pitch: medium-high
  chapters:
    - id: ch01
      title: The Prince's Wager
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a king with only one son. From morning until night, the prince begged to travel through distant countries. His father refused for a long time. At last the king grew tired of saying no. He gave his permission and ordered the treasurer to provide plenty of money for the journey. The prince embraced his father tenderly and set out, overjoyed that he would truly see the world.
        - id: ch01-b02
          speaker: narrator
          text: For several weeks he rode on without an adventure. Then, while resting at an inn one night, he met another traveler. They began to talk, and the stranger asked whether the prince ever played cards.
        - id: ch01-b03
          speaker: prince
          text: Yes, I am very fond of cards.
        - id: ch01-b04
          speaker: narrator
          text: Cards were brought out. Before long, the prince had lost every penny to his new acquaintance. When his bag was completely empty, the stranger offered one last game. If the prince won, all his money would be returned. If he lost, he must stay at the inn for three years, then serve the stranger for three more. The prince accepted, played, and lost.
        - id: ch01-b05
          speaker: narrator
          text: The stranger hired rooms for him and allowed him only bread and water each day. For three years the prince mourned his fate, but nothing could change it. When the time was over, he was released. Now he had to serve the stranger for three more years, so he set off for the man's home. Only then did he learn that his new master was the king of a neighboring country.
        - id: ch01-b06
          speaker: narrator
          text: Before he had gone far, the prince met a woman carrying a child who was crying with hunger. He took the child and fed it with his last crust of bread and his last drop of water. Then he returned the child to its mother. She thanked him with all her heart and gave him this advice.
        - id: ch01-b07
          speaker: woman
          text: Listen, my lord. Walk straight ahead until you smell a powerful scent from a garden beside the road. Go inside and hide near a tank. Three doves will come there to bathe. When the last dove flies past, seize her robe of feathers. Do not return it until she has promised you three things.
        - id: ch01-b08
          speaker: narrator
          text: The prince walked on until the strong fragrance led him to the garden. He hid beside the tank and waited. Three doves came to bathe, just as the woman had promised. When the last one flew past, he caught her feather robe and refused to return it. In exchange, the dove gave him a ring, a collar, and one of her own plumes.
        - id: ch01-b09
          speaker: dove_princess
          text: Whenever trouble comes, call, "Come to my aid, O dove!" I am the daughter of the king you must serve. He hates your father, and he made you gamble because he meant to ruin you.
    - id: ch02
      title: Three Impossible Tasks
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: In time the prince reached the king's palace. The moment his master heard of his arrival, he summoned him and placed three bags in his hands.
        - id: ch02-b02
          speaker: rival_king
          text: Here are wheat, millet, and barley. Sow them at once, and bring me a loaf made from each grain tomorrow.
        - id: ch02-b03
          speaker: narrator
          text: The prince could not speak. The king offered no explanation and dismissed him. He hurried to the room prepared for him, drew out the plume, and called for the dove.
        - id: ch02-b04
          speaker: prince
          text: Dove, dove! Please hurry and come to me!
        - id: ch02-b05
          speaker: dove_princess
          text: What has happened?
        - id: ch02-b06
          speaker: narrator
          text: She flew through the open window. The prince told her about the task and said he could never finish it.
        - id: ch02-b07
          speaker: dove_princess
          text: Do not be afraid. Everything will be ready.
        - id: ch02-b08
          speaker: narrator
          text: She flew away. When the prince woke the next morning, three loaves stood beside his bed. He dressed quickly. A page soon came to take him to the king. The prince carried in the loaves, bowed low, and set them down. The king studied them in silence before giving him another task.
        - id: ch02-b09
          speaker: rival_king
          text: Good. A man who can manage this can also recover the ring my eldest daughter dropped into the sea.
        - id: ch02-b10
          speaker: narrator
          text: Back in his room, the prince summoned the dove again.
        - id: ch02-b11
          speaker: dove_princess
          text: Listen carefully. Tomorrow, take a knife and a basin to the shore. You will find a boat there. Get into it.
        - id: ch02-b12
          speaker: narrator
          text: The prince did not know where to sail or what to do aboard the boat. Still, the dove had saved him once, so he trusted her completely. At the shore he found her perched on a mast. At her signal he put out to sea. The wind carried them on until the land disappeared. Only then did she speak.
        - id: ch02-b13
          speaker: dove_princess
          text: Take your knife and cut off my head. Do not let one drop of blood fall outside the basin. Then throw my head into the sea.
        - id: ch02-b14
          speaker: narrator
          text: Though amazed by the order, the prince cut off her head with one stroke. Soon a dove rose from the water with a ring in her beak. She placed it in his hand and dipped herself in the blood inside the basin. Her head became the head of a beautiful girl. A moment later she vanished altogether. The prince returned to the palace with the ring.
        - id: ch02-b15
          speaker: narrator
          text: The king stared at it in surprise. Then he chose a third plan, one he believed could not fail.
        - id: ch02-b16
          speaker: rival_king
          text: This evening, mount my colt. Ride him into the field and break him properly.
        - id: ch02-b17
          speaker: narrator
          text: Again the prince said nothing. As soon as he reached his room, he called the dove.
        - id: ch02-b18
          speaker: dove_princess
          text: Pay attention. My father wants you dead, and this is how he means to kill you. He will be the colt. My mother will be the saddle, my two sisters the stirrups, and I will be the bridle. Take a stout club. You will need it against them.
    - id: ch03
      title: The Escape
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The prince mounted the colt and used his club so thoroughly that the animal was soon broken in. Later he returned to report that the colt had grown so gentle that the smallest child could ride it. At the palace, he found the king covered in bruises and wrapped in cloths soaked with vinegar. The queen was too stiff to move, and several of the daughters had broken ribs. Only the youngest daughter, who had been the bridle, was unharmed.
        - id: ch03-b02
          speaker: narrator
          text: That night she slipped into the prince's room and whispered to him.
        - id: ch03-b03
          speaker: dove_princess
          text: They are all in too much pain to move. This is our chance to escape. Go to the stable and saddle the leanest horse you can find.
        - id: ch03-b04
          speaker: narrator
          text: Foolishly, the prince chose the fattest horse instead. When the princess saw it, she was deeply sorry. The fat horse could run like the wind, but the lean one flashed along as fast as thought. It was too dangerous to turn back, so they rode away as quickly as their horse could carry them.
        - id: ch03-b05
          speaker: narrator
          text: During the night, the king sent for his youngest daughter. She did not come, so he sent for her again, but she still did not appear. The queen was a witch, and she discovered that the girl had fled with the prince. She told her husband that he must leave his bed and chase them. Groaning with pain, he slowly got up, dragged himself to the stable, and saw the lean horse still waiting in its stall.
        - id: ch03-b06
          speaker: narrator
          text: The king leaped onto its back and shook the reins. His daughter was watching for him. The instant his horse sprang forward, she changed their own horse into a cell, the prince into a hermit, and herself into a nun.
        - id: ch03-b07
          speaker: narrator
          text: The king stopped at the little chapel and questioned the hermit.
        - id: ch03-b08
          speaker: rival_king
          text: Have a young man and a girl passed this way?
        - id: ch03-b09
          speaker: prince
          text: I have not seen a single living creature.
        - id: ch03-b10
          speaker: narrator
          text: Disgusted and uncertain, the king rode home. He told his wife that after miles of searching he had found only a hermit and a nun in a cell.
        - id: ch03-b11
          speaker: queen
          text: Those were the runaways, you fool! If you had brought me one scrap of the nun's dress or one chip from the wall, they would have been in my power.
          emotion: angry
    - id: ch04
      title: The Queen's Curse
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The king hurried back to the stable, brought out the lean horse, and raced away faster than thought. His daughter saw him coming. She turned their own horse into a patch of ground, herself into a rose-tree covered with blossoms, and the prince into a gardener. When the king drew near, the gardener bent over the tree as though he had been trimming it all along.
        - id: ch04-b02
          speaker: narrator
          text: When the king arrived, the gardener looked up from trimming the tree and asked whether anything was wrong.
        - id: ch04-b03
          speaker: rival_king
          text: Have you seen a girl and a young man pass by?
        - id: ch04-b04
          speaker: prince
          text: No one has gone this way since I began working here.
        - id: ch04-b05
          speaker: narrator
          text: The king returned home once more and told the queen what he had seen.
        - id: ch04-b06
          speaker: queen
          text: Idiot! One rose or a handful of earth would have put them in my power. We cannot waste another moment. This time I am coming with you.
          emotion: angry
        - id: ch04-b07
          speaker: narrator
          text: The princess saw them far away and was seized by fear, for she knew how powerful her mother's magic was. Still, she meant to fight to the end. She changed the horse into a deep pool, herself into an eel, and the prince into a turtle.
        - id: ch04-b08
          speaker: narrator
          text: This time the disguise was no use. The queen recognized the pool, the eel, and the turtle at once. She stopped beside the water and asked whether her daughter had repented and wished to return home. The eel answered no by wagging her tail. Then the queen told the king to put one drop of water from the pool into a bottle. That was the only way she could seize her daughter and bring her back.
        - id: ch04-b09
          speaker: narrator
          text: The king obeyed. He filled the bottle and was just lifting it from the water when the turtle knocked against it and spilled every drop. The king filled the bottle a second time, but once again the turtle was too quick for him.
        - id: ch04-b10
          speaker: narrator
          text: The queen knew she had lost. She cursed her daughter, declaring that the prince would forget her completely. Once her anger was spent, she and the king rode back to the palace.
    - id: ch05
      title: The Forgotten Bride
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The prince and princess took their true shapes and continued on. The princess became so quiet that at last he asked what troubled her.
        - id: ch05-b02
          speaker: dove_princess
          text: I know that very soon you will forget me.
          emotion: sad
        - id: ch05-b03
          speaker: narrator
          text: The prince laughed and told her that could never happen, but she still believed the curse would come true. They rode on and on until they reached the end of the world, where the prince's father lived.
        - id: ch05-b04
          speaker: narrator
          text: The prince left the princess at an inn and went to the palace. He meant to ask his father for permission to present her as his bride. But he was so joyful to see his family again that he forgot her entirely. He even listened while the king discussed finding him a wife.
        - id: ch05-b05
          speaker: narrator
          text: When the poor princess heard what had happened, she wept bitterly and called to her sisters.
        - id: ch05-b06
          speaker: dove_princess
          text: Come to me, my sisters. I need you badly!
          emotion: sad
        - id: ch05-b07
          speaker: narrator
          text: In an instant they stood beside her.
        - id: ch05-b08
          speaker: elder_sister
          text: Do not grieve. Everything will come right.
          emotion: calm
        - id: ch05-b09
          speaker: narrator
          text: The sisters told the innkeeper that they had three doves for sale. If any royal servant came looking for birds, the servant should be sent upstairs to them.
    - id: ch06
      title: Memory Restored
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: That is exactly what happened. A royal servant came looking for birds, and the innkeeper sent him upstairs. The three doves were so beautiful that he bought them for the king. The king admired them and called his son to see them. The prince was delighted with the birds and tried to coax them toward him. Then one fluttered to the top of the window and spoke.
        - id: ch06-b02
          speaker: elder_sister
          text: If only you could hear us talk, you would admire us even more.
        - id: ch06-b03
          speaker: narrator
          text: The second dove settled on a table.
        - id: ch06-b04
          speaker: middle_sister
          text: Then keep talking. It may help him remember.
        - id: ch06-b05
          speaker: narrator
          text: The third flew onto the prince's shoulder and whispered in his ear.
        - id: ch06-b06
          speaker: dove_princess
          text: Put on this ring, Prince, and see whether it fits.
        - id: ch06-b07
          speaker: narrator
          text: It fit. Then the doves fastened a collar around his neck and held up a feather bearing the dove's name. At last the prince remembered everything. He declared that he would marry the princess and no one else.
        - id: ch06-b08
          speaker: narrator
          text: The wedding took place the next day, and they lived happily until they died.
