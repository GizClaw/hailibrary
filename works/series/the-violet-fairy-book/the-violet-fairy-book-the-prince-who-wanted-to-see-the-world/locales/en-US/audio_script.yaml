audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, steady, and quietly mysterious
        timbre: clear and resonant
        pace: measured
        pitch: medium
    prince:
      display_name: Prince
      tts:
        delivery: earnest, youthful, and impulsive
        timbre: clear and bright
        pace: lively
        pitch: medium
    rival_king:
      display_name: Rival King
      tts:
        delivery: cold, commanding, and quick to anger
        timbre: hard and weighty
        pace: deliberate
        pitch: low
    woman:
      display_name: Woman
      tts:
        delivery: grateful, grave, and helpful
        timbre: gentle and mature
        pace: measured
        pitch: medium
    dove_princess:
      display_name: Dove Princess
      tts:
        delivery: brave, clear-minded, and tender
        timbre: light and warm
