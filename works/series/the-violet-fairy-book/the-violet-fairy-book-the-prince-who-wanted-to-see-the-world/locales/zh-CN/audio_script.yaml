audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 编者
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清晰的成年男声
        pace: 从容舒展
        pitch: 中低音
    prince:
      display_name: 王子
      tts:
        delivery: 真诚率直，经历磨难后更显坚定
        timbre: 清朗温厚的年轻男声
        pace: 适中
        pitch: 中音
    king:
      display_name: 国王
      tts:
        delivery: 威严强硬，动怒时仍保持王者气势
        timbre: 浑厚低沉的成年男声
        pace: 稍慢
        pitch: 低音
    woman:
      display_name: 抱孩子的女人
      tts:
        delivery: 诚恳感激，叮嘱时清楚郑重
        timbre: 朴实柔和的成年女声
        pace: 适中
        pitch: 中音
    princess:
      display_name: 公主
      tts:
        delivery: 聪慧柔和，关键时刻机敏利落
        timbre: 明净柔美的年轻女声
        pace: 适中
        pitch: 中高音
    queen:
      display_name: 王后
      tts:
        delivery: 冷厉专横，盛怒时尖锐逼人
        timbre: 深沉凌厉的成年女声
        pace: 稍快
        pitch: 中低音
    elder_sister:
      display_name: 大姐
      tts:
        delivery: 沉着体贴，说话温和笃定
        timbre: 柔润清晰的年轻女声
        pace: 适中
        pitch: 中音
    middle_sister:
      display_name: 二姐
      tts:
        delivery: 机灵爽快，语气轻快直接
        timbre: 明亮轻盈的年轻女声
        pace: 稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 代价高昂的旅程
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前有位国王，膝下只有一个儿子。王子从早到晚缠着父亲，求他准许自己到遥远的国家走一走。国王起初怎么也不答应，最后实在拗不过他，只得点头，还命财务大臣拿出一大笔旅费。想到自己真的能去看这个世界，王子高兴极了。他深情地抱过父亲，便出发了。
        - id: ch01-b02
          speaker: narrator
          text: >-
            他骑马走了几个星期，路上一直平安无事。一天夜里，他住进一家客店，结识了另一名旅客。那人问他爱不爱打牌，王子说自己最喜欢。牌一拿来，他很快就把钱输得精光。
        - id: ch01-b03
          speaker: narrator
          text: >-
            钱袋里再也找不出半个钱时，陌生人提出赌最后一局。王子若赢，便能拿回所有钱。王子若输，就要在客店里待三年，再给他当三年仆人。王子答应了，却又输了。此后三年，那人租了房间关着他，每天只送来面包和清水。
        - id: ch01-b04
          speaker: narrator
          text: >-
            王子再怎么悲叹也无济于事。三年期满，他虽然能离开客店，却还得履行赌约，前去服侍那位陌生人。直到这时，他才知道对方原来是邻国国王。半路上，他遇见一个抱着孩子的女人，孩子已经饿得直哭。王子从母亲怀里接过孩子，把自己最后一小块面包和最后一口水都喂给他，才把孩子送回母亲怀里。女人感激不尽，这才告诉他该怎样走。
        - id: ch01-b05
          speaker: woman
          text: >-
            大人，请您一直往前走。闻见浓浓的花香以后，就到路边的花园里，藏在水池旁。会有三只鸽子来洗澡。最后一只飞过时，您要抓住她的羽衣。等她答应给您三样东西，才能还给她。
        - id: ch01-b06
          speaker: narrator
          text: >-
            王子一一照办，事情果然和女人说的一样。三只鸽子来到池中洗澡，最后一只从他身边经过时，他取走了她的羽衣。为了换回羽衣，鸽子给了他一枚戒指、一条项圈和一根自己的羽毛。
        - id: ch01-b07
          speaker: princess
          text: >-
            以后遇到麻烦，就喊“鸽子啊，快来帮我”，我会来救你。我正是你要去服侍的国王的女儿。他恨你的父亲，故意骗你赌钱，就是想毁掉你。

    - id: ch02
      title: 三件不可能的差事
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            王子继续赶路，终于到了王宫。国王立刻召见他，递给他三只袋子。
        - id: ch02-b02
          speaker: king
          text: >-
            这里有小麦、小米和大麦。马上种下去，明天我要吃到三样粮食做成的面包。
        - id: ch02-b03
          speaker: narrator
          text: >-
            王子惊得说不出话，国王却不肯多解释，直接让他退下。他跑回自己的房间，拿出那根羽毛。
        - id: ch02-b04
          speaker: prince
          text: >-
            鸽子，鸽子！快快来！
        - id: ch02-b05
          speaker: princess
          text: >-
            出什么事了？
        - id: ch02-b06
          speaker: narrator
          text: >-
            鸽子从窗口飞进来。王子把国王的命令告诉她，说自己根本做不到。
        - id: ch02-b07
          speaker: princess
          text: >-
            别怕，明天一切都会办好。
        - id: ch02-b08
          speaker: narrator
          text: >-
            第二天醒来，王子看见三只面包摆在床边。他连忙起身穿衣，才刚收拾妥当，侍童就来催他立刻进宫。王子把面包抱在怀里，跟着侍童来到国王面前。他深深行了一礼，把面包一只只放下。国王默默看了一阵。
        - id: ch02-b09
          speaker: king
          text: >-
            很好。既然你能做到这件事，也能找回我大女儿掉进海里的戒指。
        - id: ch02-b10
          speaker: narrator
          text: >-
            王子赶回房间，再次召来鸽子。
        - id: ch02-b11
          speaker: princess
          text: >-
            明天带上一把刀和一只盆，到海边去。那里有条小船，你上船等我。
        - id: ch02-b12
          speaker: narrator
          text: >-
            王子不知道船会去哪里，也不知道自己要做什么。不过鸽子已经救过他，他愿意完全听从她。到了海边，他看见鸽子停在桅杆上。鸽子发出信号，他便驾船出海。顺风把小船送得很远，陆地很快就看不见了。
        - id: ch02-b13
          speaker: princess
          text: >-
            用那把刀砍下我的头，一滴血也不能落在地上。砍下以后，再把头扔进海里。
        - id: ch02-b14
          speaker: narrator
          text: >-
            这道命令实在古怪，王子满心惊疑，还是拿起刀，一刀砍下了鸽子的头。过了一会儿，一只鸽子从海里飞出来，嘴里衔着戒指。她把戒指放进王子手中，再用盆中的血沾遍身体，头立刻变成了美丽姑娘的模样。转眼之间，她又消失不见。王子拿着戒指，独自驾船回宫。
        - id: ch02-b15
          speaker: narrator
          text: >-
            国王见他真的带回戒指，惊讶得两眼圆睁，随即又想出一个自认为更稳妥的杀人办法。
        - id: ch02-b16
          speaker: king
          text: >-
            今晚骑上我的小公马，把它带到田野里，给我彻底驯服。
        - id: ch02-b17
          speaker: narrator
          text: >-
            王子仍旧没有争辩。一回到房间，他就唤来鸽子。
        - id: ch02-b18
          speaker: princess
          text: >-
            你要听清楚。父王一心想杀你。小公马是他，马鞍是母后，两只马镫是我的姐姐们，我则是马笼头。记得带一根结实的棍子，好对付他们。

    - id: ch03
      title: 骑马逃亡
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            王子骑上小公马，举起棍子狠狠打了一顿。回宫以后，他报告说那匹马已经温顺得连最小的孩子都能骑。再看宫里，国王遍体青肿，只能用浸过醋的布裹住全身。王后浑身僵硬，完全动不了，几个女儿也断了好几根肋骨，只有最小的公主毫发无伤。当天夜里，她悄悄来找王子。
        - id: ch03-b02
          speaker: princess
          text: >-
            他们全都疼得起不了身，我们趁现在逃走吧。快去马厩，把最瘦的那匹马备好。
        - id: ch03-b03
          speaker: narrator
          text: >-
            王子却犯了糊涂，偏偏挑中最肥的马。出发后，公主一眼看出他选错了，心里十分懊恼。肥马跑起来虽然像风，瘦马却快得像一道闪念。可这时回头已经太危险，两人只能催着胯下的马，能跑多快就跑多快。
        - id: ch03-b04
          speaker: narrator
          text: >-
            到了夜里，国王派人去叫小女儿，她没有来。国王又派人去叫，她仍旧没有出现。身为女巫的王后发现女儿已经和王子逃跑，逼着丈夫离开病床，马上去追。国王疼得一路呻吟，还是慢慢爬起来，拖着身子来到马厩。看见瘦马仍在栏里，他立刻跨上马背，抖动缰绳。
        - id: ch03-b05
          speaker: narrator
          text: >-
            公主知道父亲会追来，一路睁大眼睛，时刻望着身后。见那匹快马突然冲来，她眨眼间把坐骑变成一间小小的修道室，把王子变成隐士，自己则变成修女。国王赶到小礼拜堂前，勒住马，问隐士有没有看见一对年轻男女。
        - id: ch03-b06
          speaker: prince
          text: >-
            我连一个活物也没见过。
        - id: ch03-b07
          speaker: narrator
          text: >-
            国王听说连一个活物也没经过，十分懊丧，又想不出别的办法。他只得回家告诉王后，自己追了好几英里，却只遇到修道室里的一名隐士和一名修女。
        - id: ch03-b08
          speaker: queen
          text: >-
            他们当然就是逃跑的两个人！你哪怕带回一片修女的衣服，或是一小块墙石，我也能抓住他们！
          emotion: angry
        - id: ch03-b09
          speaker: narrator
          text: >-
            国王连忙骑上那匹跑得比念头还快的瘦马，再次追去。公主看见他，便把马变成一块园地，自己变成开满玫瑰的花树，王子变成修剪花枝的园丁。国王来到跟前，问园丁有没有年轻男女从这里经过。
        - id: ch03-b10
          speaker: prince
          text: >-
            我在这里干活以后，一个人也没有经过。
        - id: ch03-b11
          speaker: narrator
          text: >-
            国王又空手而回，把见到园丁和玫瑰树的事告诉了妻子。
        - id: ch03-b12
          speaker: queen
          text: >-
            你这个蠢货！只要拿回一朵玫瑰或一把泥土，我就能制住他们。不能再耽搁了，这回我亲自跟你去！
          emotion: angry

    - id: ch04
      title: 女巫的诅咒
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            公主远远看见父母一同追来，心里充满恐惧。她深知母亲精通各种魔法，绝不是父亲那样容易骗过，可她仍决定抵抗到底。她把马变成一口深潭，把自己变成水中的鳗鱼，把王子变成乌龟。可这一回，王后一眼就认出了他们。
        - id: ch04-b02
          speaker: queen
          text: >-
            你还不后悔吗？愿不愿意跟我们回家？
        - id: ch04-b03
          speaker: princess
          text: >-
            我不后悔，也绝不跟你们回去！
        - id: ch04-b04
          speaker: narrator
          text: >-
            鳗鱼一边回答，一边用尾巴摆出了拒绝的意思。王后叫国王从潭里取一滴水装进瓶子，说只有这样才能抓住女儿。国王装满瓶子，刚要把它提出水面，乌龟便猛地撞过去，将水全部泼掉。国王又装了一次，乌龟还是抢先撞翻了瓶子。
        - id: ch04-b05
          speaker: narrator
          text: >-
            王后看见丈夫两次失败，明白自己已经输了。她只好向女儿降下一道诅咒，要王子把她彻底忘掉。这样发泄完怒火，王后才和国王返回宫殿。公主和王子恢复原形，继续赶路，可公主一路沉默不语。王子终于忍不住，问她究竟出了什么事。
        - id: ch04-b06
          speaker: princess
          text: >-
            因为我知道，你很快就会忘记我。
          emotion: sad
        - id: ch04-b07
          speaker: narrator
          text: >-
            王子笑着说，这种事绝不可能发生。公主却始终相信诅咒会应验。他们骑呀，骑呀，骑了很久，终于来到世界的尽头，那里正是王子的故乡。王子让公主留在客店，自己进宫，请求父亲准许他带新娘来拜见。
        - id: ch04-b08
          speaker: narrator
          text: >-
            可他回到宫里，重见父亲和家人，心里一高兴，竟把还在客店等候的公主忘得一干二净。后来父亲提出替他安排另一桩婚事，他甚至也听了进去。

    - id: ch05
      title: 三只会说话的鸽子
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            公主听到消息，伤心地哭了起来。
        - id: ch05-b02
          speaker: princess
          text: >-
            姐姐们，快来吧！我现在太需要你们了！
          emotion: sad
        - id: ch05-b03
          speaker: narrator
          text: >-
            两位姐姐立刻出现在她身边。
        - id: ch05-b04
          speaker: elder_sister
          text: >-
            别难过，事情一定会好起来。
          emotion: calm
        - id: ch05-b05
          speaker: narrator
          text: >-
            三姐妹告诉客店老板，要是国王的仆人想替主人买鸟，就让他上楼，因为她们有三只鸽子出售。事情果然照计划发生了。仆人来到客店，看见三只鸽子美丽非凡，便全都买下，带回宫里献给国王。国王喜欢得不得了，又把儿子叫来，要他也看看这些美丽的鸟儿。
        - id: ch05-b06
          speaker: narrator
          text: >-
            王子也很喜欢这三只鸽子，正哄着她们飞到自己身边。大姐忽然飞上窗顶。
        - id: ch05-b07
          speaker: elder_sister
          text: >-
            你若能听见我们讲话，一定会更喜欢我们。
        - id: ch05-b08
          speaker: narrator
          text: >-
            二姐停在桌上，催她继续。
        - id: ch05-b09
          speaker: middle_sister
          text: >-
            接着说呀，说不定这样能让他想起来！
        - id: ch05-b10
          speaker: narrator
          text: >-
            最后一只鸽子飞到王子肩上，在他耳边低声说话。
        - id: ch05-b11
          speaker: princess
          text: >-
            王子，戴上这枚戒指，看看是不是正合适。
        - id: ch05-b12
          speaker: narrator
          text: >-
            王子把戒指戴在手上，果然严丝合缝。鸽子们接着把项圈挂在他颈上，又举起那根写有公主名字的羽毛。这三件信物终于唤回了王子的全部记忆。他想起两人一路经历的事，也想起仍在等候自己的公主，当即宣布自己只会迎娶她，绝不娶别人。

    - id: ch06
      title: 想起真正的新娘
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            第二天，王子和公主举行了婚礼，公主终于成了他真正的新娘。王子也兑现了只娶她一人的宣言。从那以后，他们幸福地生活在一起，直到生命的最后一天。
        - id: ch06-b02
          speaker: narrator
          text: >-
            这个故事来自葡萄牙。
