audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, steady, and quietly mysterious
        timbre: clear and resonant
        pace: measured
        pitch: medium
    king:
      display_name: The King
      tts:
        delivery: noble, earnest, and sometimes quick-tempered
        timbre: rich and commanding
        pace: measured
        pitch: medium-low
    queen:
      display_name: The Queen
      tts:
        delivery: clever, devoted, and quietly confident
        timbre: warm and clear
        pace: moderate
        pitch: medium
    heathen_king:
      display_name: The Foreign King
      tts:
        delivery: imperious, self-satisfied, and easily captivated
        timbre: deep and resonant
        pace: deliberate
        pitch: low
    councilor_1:
      display_name: First Councilor
      tts:
        delivery: formal and loyal
        timbre: mature and steady
        pace: measured
        pitch: medium-low
    councilor_2:
      display_name: Second Councilor
      tts:
        delivery: formal and attentive
        timbre: clear and restrained
        pace: measured
        pitch: medium
    councilor_3:
      display_name: Third Councilor
      tts:
        delivery: dignified and sincere
        timbre: firm and rounded
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: The King Goes to War
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a king and queen who lived together in happiness and comfort. They loved each other dearly, and they had no troubles. But after a time, the king became restless. He wanted to test his strength in battle, defeat an enemy, and return with honor and glory.
        - id: ch01-b02
          speaker: narrator
          text: He gathered his army and ordered them to march against a distant country. Its ruler was a cruel foreign king who mistreated everyone he could seize. Before leaving, the king gave his ministers their orders and his wisest advice. Then he said a tender farewell to his wife and sailed away with his army.
        - id: ch01-b03
          speaker: narrator
          text: Whether the voyage was long or short, no one can say. At last, the king reached that distant land. He marched forward and defeated everyone who stood against him. His victories did not last. At a mountain pass, a great army lay waiting. It scattered his soldiers and captured the king.
        - id: ch01-b04
          speaker: narrator
          text: The enemy carried him to the prison where the foreign king kept his captives. There the poor king suffered terribly. Every night, the prisoners were locked in chains. Each morning, they were yoked together like oxen and forced to plow until nightfall.
        - id: ch01-b05
          speaker: narrator
          text: Three years passed before the king found a way to send word to his dear queen. At last, he managed to send her a letter.
        - id: ch01-b06
          speaker: king
          text: Sell every castle and palace we own. Pawn all our treasure, and come rescue me from this dreadful prison.
        - id: ch01-b07
          speaker: narrator
          text: The queen read the letter and wept bitterly. She wondered how she could possibly save the husband she loved.
        - id: ch01-b08
          speaker: queen
          text: If I go there myself and that cruel king sees me, he will make me one of his wives. I could send a minister, but how can I be sure any of them can be trusted?
          emotion: sad
        - id: ch01-b09
          speaker: narrator
          text: She thought and thought. Then an idea came to her. She cut off her beautiful long brown hair and dressed as a boy. Taking only her lute, and telling no one what she meant to do, she set out into the wide world.
    - id: ch02
      title: The Song at the Palace
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The queen crossed many countries and passed through many cities. She endured one hardship after another before she finally reached the town where the foreign king lived. She walked around his palace and found the prison behind it. Then she entered the great courtyard at the front, lifted her lute, and began to play. The music was so beautiful that anyone who heard it wanted it to go on forever.
        - id: ch02-b02
          speaker: narrator
          text: After a while, she began to sing, and her voice was sweeter than a lark's.
        - id: ch02-b03
          speaker: queen
          text: Far from my home, I crossed the sea and came to this foreign land. Of everything I once possessed, I carry only my sweet lute in my hand.
        - id: ch02-b04
          speaker: queen
          text: Who will thank me for my song and reward this simple tune? Like a lover's sigh, it will rise each day and greet you.
        - id: ch02-b05
          speaker: queen
          text: I sing of flowers in bloom, made sweet by rain and sun. I sing of the joy in love's first kiss, and the pain when two must part.
        - id: ch02-b06
          speaker: queen
          text: I sing of a sad captive longing behind his prison wall, and of hearts that call when no one is near to answer.
        - id: ch02-b07
          speaker: queen
          text: My song asks for your pity and for a gift from your store. As I play this gentle tune, I wait here by your door.
        - id: ch02-b08
          speaker: queen
          text: If my singing reaches you inside your palace, sire, then please grant me, on this happy day, my heart's desire.
        - id: ch02-b09
          speaker: narrator
          text: The moment the foreign king heard that touching song in such a lovely voice, he ordered the singer brought before him.
        - id: ch02-b10
          speaker: heathen_king
          text: Welcome, lute player. Tell me, where have you come from?
        - id: ch02-b11
          speaker: queen
          text: My home lies far across many seas, sire. I have wandered the world for years, earning my living with my music.
        - id: ch02-b12
          speaker: heathen_king
          text: Then stay in my palace for a few days. When you are ready to leave, I will grant the reward you sang about. You shall have your heart's desire.
        - id: ch02-b13
          speaker: narrator
          text: So the lute player remained at the palace. Nearly all day long, she played and sang for the foreign king. He never tired of listening. He almost forgot to eat and drink, and even to torment people. Nothing mattered to him but the music. He nodded along and praised it.
        - id: ch02-b14
          speaker: heathen_king
          text: Now that is true playing and singing! It feels as though a gentle hand has lifted every care and sorrow away from me.
    - id: ch03
      title: The Prisoner's Freedom
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: After three days, the lute player came to say farewell. The foreign king reminded her of his promise and asked what reward she wanted.
        - id: ch03-b02
          speaker: queen
          text: Sire, give me one prisoner. Your prison holds so many, and I would be glad to have a companion on my travels. When I hear his cheerful voice beside me, I will remember you and give you thanks.
        - id: ch03-b03
          speaker: heathen_king
          text: Come with me, then. You may choose anyone you like.
        - id: ch03-b04
          speaker: narrator
          text: The foreign king himself led the lute player through the prison. She moved among the captives until she found her husband. She chose him and took him away on her journey.
        - id: ch03-b05
          speaker: narrator
          text: They traveled together for a long time, yet the king never discovered who his rescuer truly was. Still disguised as a boy, the queen guided him closer and closer to his own country. When they reached the frontier, the freed prisoner spoke.
        - id: ch03-b06
          speaker: king
          text: Kind lad, you may let me go now. I am not an ordinary prisoner. I am the king of this country. Set me free, and name whatever reward you wish.
        - id: ch03-b07
          speaker: queen
          text: Say nothing of rewards. Go on your way in peace.
        - id: ch03-b08
          speaker: king
          text: Then come with me, dear boy, and stay at my palace as my guest.
        - id: ch03-b09
          speaker: queen
          text: When the right time comes, I will be there.
        - id: ch03-b10
          speaker: narrator
          text: With that, they parted. The queen knew a shorter road home. She reached the palace before the king and changed back into her own clothes.
    - id: ch04
      title: The Lute Player Returns
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: An hour later, everyone in the palace was rushing back and forth with joyful cries.
        - id: ch04-b02
          speakers: [councilor_1, councilor_2, councilor_3]
          ensemble: chorus
          text: Our king has come home! Our king has returned to us!
          emotion: happy
        - id: ch04-b03
          speaker: narrator
          text: The king greeted everyone kindly, but he would not even look at the queen. Instead, he summoned his whole council and all his ministers. Before them, he accused his wife.
        - id: ch04-b04
          speaker: king
          text: Look at the wife I have! Now she throws her arms around me. But when I was suffering in prison and sent her news, she did nothing to save me.
          emotion: angry
        - id: ch04-b05
          speaker: narrator
          text: The council answered him with one voice.
        - id: ch04-b06
          speakers: [councilor_1, councilor_2, councilor_3]
          ensemble: chorus
          text: Sire, when your message arrived, the queen disappeared. No one knew where she had gone, and she did not return until today.
        - id: ch04-b07
          speaker: narrator
          text: This made the king furious.
        - id: ch04-b08
          speaker: king
          text: Judge my faithless wife! You would never have seen your king again if a young lute player had not freed me. I will love him and thank him for as long as I live.
          emotion: angry
        - id: ch04-b09
          speaker: narrator
          text: While the king sat with his council, the queen found time to put on her disguise once more. She took her lute, slipped into the courtyard before the palace, and sang in a voice that rang clear and sweet.
        - id: ch04-b10
          speaker: queen
          text: I sing of a sad captive longing behind his prison wall, and of hearts that call when no one is near to answer.
        - id: ch04-b11
          speaker: queen
          text: My song asks for your pity and for a gift from your store. As I play this gentle tune, I wait here by your door.
        - id: ch04-b12
          speaker: queen
          text: If my singing reaches you inside your palace, sire, then please grant me, on this happy day, my heart's desire.
        - id: ch04-b13
          speaker: narrator
          text: As soon as the king heard the song, he ran out to meet the lute player. He took the young musician by the hand and led him into the palace.
        - id: ch04-b14
          speaker: king
          text: Here is the boy who freed me from prison! My true friend, this time I really will give you your heart's desire.
          emotion: happy
        - id: ch04-b15
          speaker: queen
          text: I am certain you will be no less generous than the foreign king, sire. I ask you for the same reward I asked of him. But this time, I will not let my prize go. I want you. I want the king himself!
        - id: ch04-b16
          speaker: narrator
          text: As she spoke, she threw off her long cloak. Everyone saw that the lute player was the queen.
        - id: ch04-b17
          speaker: narrator
          text: Who could describe the king's happiness? His heart was so full of joy that he gave a great feast for the whole world. The whole world came, and everyone celebrated with him for an entire week.
        - id: ch04-b18
          speaker: narrator
          text: I was there too. I ate and drank all kinds of good things, and I will remember that feast for as long as I live.
