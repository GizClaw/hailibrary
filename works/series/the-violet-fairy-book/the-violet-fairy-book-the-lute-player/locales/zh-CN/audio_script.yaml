audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 编者
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清晰的成年男声
        pace: 从容舒展
        pitch: 中低音
    king:
      display_name: 国王
      tts:
        delivery: 率直重情，受苦后带着疲惫与愤懑
        timbre: 浑厚沉稳的成年男声
        pace: 适中
        pitch: 中低音
    queen:
      display_name: 王后
      tts:
        delivery: 聪慧坚定，乔装时爽朗而克制
        timbre: 清澈柔韧的成年女声
        pace: 适中
        pitch: 中高音
    heathen_king:
      display_name: 异教国王
      tts:
        delivery: 专横自负，听琴时兴致盎然
        timbre: 粗厚有力的成年男声
        pace: 稍慢
        pitch: 低音
    councilor_1:
      display_name: 大臣甲
      tts:
        delivery: 恭谨坦率
        timbre: 清楚稳重的成年男声
        pace: 适中
        pitch: 中音
    councilor_2:
      display_name: 大臣乙
      tts:
        delivery: 恭谨坦率
        timbre: 略显苍老的成年男声
        pace: 适中
        pitch: 中低音
    councilor_3:
      display_name: 大臣丙
      tts:
        delivery: 恭谨坦率
        timbre: 明朗清晰的成年男声
        pace: 适中
        pitch: 中音
    palace_person_1:
      display_name: 宫人甲
      tts:
        delivery: 欢欣激动，呼喊清亮
        timbre: 明亮的年轻女声
        pace: 稍快
        pitch: 高音
    palace_person_2:
      display_name: 宫人乙
      tts:
        delivery: 欢欣激动，呼喊有力
        timbre: 清朗的年轻男声
        pace: 稍快
        pitch: 中高音
    palace_person_3:
      display_name: 宫人丙
      tts:
        delivery: 欢欣激动，呼喊热切
        timbre: 温暖的成年女声
        pace: 稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 国王远征
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，一位国王和王后过着安稳快活的日子。他们彼此恩爱，从来没有什么烦恼。可时间一久，国王心里渐渐不安分了。他想到远方去，想在战场上和敌人较量，也想赢得荣耀和威名。
        - id: ch01-b02
          speaker: narrator
          text: >-
            国王召集军队，决定攻打一片遥远的国土。统治那里的是一位异教国王，落到他手中的人，都会遭到虐待和折磨。临行前，国王向大臣们交代好国事，还留下许多明智的嘱咐。他依依不舍地告别妻子，带着大军渡海去了。
        - id: ch01-b03
          speaker: narrator
          text: >-
            这一路在海上走了多久，谁也说不清。国王终于登上那片国土，一路打败拦阻他的敌人。可是到了一个山口，早已等在那里的大军突然杀来。他的士兵四散逃命，连国王本人也被捉住了。
        - id: ch01-b04
          speaker: narrator
          text: >-
            国王被关进俘虏的监牢，受尽苦楚。夜里，所有人都锁着铁链。天一亮，他们又被像耕牛那样套在一起，整日犁地，直到天黑。这样的日子过了整整三年，国王才终于找到机会，给亲爱的王后送出一封信。
        - id: ch01-b05
          speaker: king
          text: >-
            把我们所有的城堡和宫殿都卖掉，再把全部财宝拿去抵押。带着这些来救我，让我离开这座可怕的监牢。
        - id: ch01-b06
          speaker: narrator
          text: >-
            王后读完信，伤心得流下泪来。她独自盘算着营救丈夫的办法。
        - id: ch01-b07
          speaker: queen
          text: >-
            我究竟怎么才能救他？我若亲自去，异教国王见了我，准会把我收作妻子。派一位大臣去吗？可我又不知道他们靠不靠得住。
          emotion: sad
        - id: ch01-b08
          speaker: narrator
          text: >-
            王后想了又想，终于有了主意。她剪掉美丽的棕色长发，换上男孩子的衣裳，再抱起一把鲁特琴。她没有告诉任何人，就这样独自踏进了茫茫人世。

    - id: ch02
      title: 宫门前的歌
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            王后走过许多国家，也见过许多城市。一路上，她不知吃了多少苦，才来到异教国王居住的城里。她先绕着宫殿走了一圈，看见监牢就在宫殿后面。随后，她走进宫殿前的大院，抱琴弹奏起来。琴声美妙极了，叫人听了还想再听。
        - id: ch02-b02
          speaker: narrator
          text: >-
            弹了一阵，王后开口歌唱。那声音比云雀的啼鸣还要甜美。
        - id: ch02-b03
          speaker: queen
          text: >-
            我从遥远故乡来，漂泊异国他乡。身外之物都不带，唯有爱琴在手上。谁肯为我的歌声，酬谢这朴素曲调？琴音如恋人的叹息，日日来将你问好。
        - id: ch02-b04
          speaker: queen
          text: >-
            我唱那盛放的鲜花，沐浴阳光雨露芬芳。我唱初吻的甜蜜，也唱离别的凄凉。我唱悲苦俘虏的思念，困在牢狱高墙。我唱无人相伴的心儿，叹息却得不到回响。
        - id: ch02-b05
          speaker: queen
          text: >-
            歌声恳求你的怜悯，也求你慷慨赐赏。我拨着温柔的琴弦，久久徘徊在你门旁。陛下若在宫殿里，听见我把歌儿唱，求你就在这快乐的一天，赐我心中所望。
        - id: ch02-b06
          speaker: narrator
          text: >-
            异教国王听见这动人的歌声，马上命人把琴师带到面前。
        - id: ch02-b07
          speaker: heathen_king
          text: >-
            琴师，欢迎你。你是从什么地方来的？
        - id: ch02-b08
          speaker: queen
          text: >-
            陛下，我的家乡远在重洋之外。我这些年一直四处漂泊，全靠弹琴唱歌过日子。
        - id: ch02-b09
          speaker: heathen_king
          text: >-
            那就在宫里住几天。等你要走时，你歌里求的赏赐，我会给你。你心里最想要什么，到时只管说。
        - id: ch02-b10
          speaker: narrator
          text: >-
            琴师留了下来，几乎整天都为异教国王弹唱。他怎么也听不厌，吃饭喝水都快忘了，甚至连折磨别人也顾不上。
        - id: ch02-b11
          speaker: heathen_king
          text: >-
            这才是真正的弹唱！听着你的琴声，我就像被一只温柔的手拂去了所有忧愁和烦恼。
        - id: ch02-b12
          speaker: narrator
          text: >-
            三天后，琴师来向他辞行。
        - id: ch02-b13
          speaker: heathen_king
          text: >-
            好吧，你想拿什么作赏赐？
        - id: ch02-b14
          speaker: queen
          text: >-
            陛下，请赐给我一个俘虏吧。您的监牢里有那么多人，我正好想找个旅伴。以后赶路时，听见他快活的声音，我就会想起您，也会感激您。
        - id: ch02-b15
          speaker: heathen_king
          text: >-
            跟我来，你想选谁都可以。
        - id: ch02-b16
          speaker: narrator
          text: >-
            异教国王亲自带琴师走遍监牢。王后在俘虏中仔细寻找，终于选中了丈夫，带着他一起上路。两个人走了很久，国王始终没认出身旁的人就是妻子。王后一路领着他，离自己的国土越来越近。

    - id: ch03
      title: 回到自己的国土
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            到了边境，被救出来的国王停下脚步，对琴师说出了自己的身份。
        - id: ch03-b02
          speaker: king
          text: >-
            好心的小伙子，现在让我走吧。我不是普通的俘虏，我正是这个国家的国王。只要你还我自由，想要什么赏赐，我都答应。
        - id: ch03-b03
          speaker: queen
          text: >-
            不必提赏赐。您安心回去吧。
        - id: ch03-b04
          speaker: king
          text: >-
            那你也跟我来吧，亲爱的孩子，到我的宫殿做客。
        - id: ch03-b05
          speaker: queen
          text: >-
            等时机到了，我自然会去您的宫殿。
        - id: ch03-b06
          speaker: narrator
          text: >-
            两人就此分别。王后抄近路赶回家，抢先回到宫中，换回原来的衣裳。一个钟头以后，整座宫殿忽然热闹起来。宫人们奔来跑去，欢喜地大声呼喊。
        - id: ch03-b07
          speakers: [palace_person_1, palace_person_2, palace_person_3]
          ensemble: chorus
          text: >-
            国王回来了！我们的国王回来了！
          emotion: happy
        - id: ch03-b08
          speaker: narrator
          text: >-
            国王亲切地问候众人，却连王后一眼也不肯看。他召来所有枢密大臣和朝臣，当众诉说心里的怨气。
        - id: ch03-b09
          speaker: king
          text: >-
            你们看看，我娶的是个怎样的妻子！现在她倒来搂我的脖子。我在牢里受苦，还把消息送了回来，她却什么也没做，根本没有救我。
          emotion: angry
        - id: ch03-b10
          speakers: [councilor_1, councilor_2, councilor_3]
          ensemble: chorus
          text: >-
            陛下，您的消息送来以后，王后就不见了。没有人知道她去了哪里，她也是今天才回来的。
        - id: ch03-b11
          speaker: narrator
          text: >-
            国王一听，怒火更盛。
        - id: ch03-b12
          speaker: king
          text: >-
            那就由你们审判我这个不忠的妻子！若不是一位年轻琴师救了我，你们再也见不到自己的国王。我这一生都会爱他，也会永远感激他。
          emotion: angry

    - id: ch04
      title: 琴师的心愿
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            国王和大臣们还在议事，王后已经悄悄离开，重新穿上男装。她带着鲁特琴溜进宫殿前的院子，清清楚楚地唱起那支熟悉的歌。
        - id: ch04-b02
          speaker: queen
          text: >-
            我唱悲苦俘虏的思念，困在牢狱高墙。我唱无人相伴的心儿，叹息却得不到回响。
        - id: ch04-b03
          speaker: queen
          text: >-
            歌声恳求你的怜悯，也求你慷慨赐赏。我拨着温柔的琴弦，久久徘徊在你门旁。陛下若在宫殿里，听见我把歌儿唱，求你就在这快乐的一天，赐我心中所望。
        - id: ch04-b04
          speaker: narrator
          text: >-
            国王刚听见歌声，就跑出去迎接琴师。他拉住这位恩人的手，把人领进宫殿。
        - id: ch04-b05
          speaker: king
          text: >-
            就是这个小伙子救我出了监牢！我忠实的朋友，这一次，我一定把你最想要的东西给你。
          emotion: happy
        - id: ch04-b06
          speaker: queen
          text: >-
            陛下，我相信您不会比异教国王吝啬。我要的，正是我向他讨过，也已经得到过的东西。可这一回，我不会再放走我的赏赐。我要您，我要的就是您本人！
        - id: ch04-b07
          speaker: narrator
          text: >-
            她说完便脱下长斗篷。大家这才看清，站在眼前的琴师，原来就是王后。
        - id: ch04-b08
          speaker: narrator
          text: >-
            谁能说得清国王有多欢喜呢？他高兴得为全世界摆下盛宴，而全世界的人果真都来了，陪着他庆祝了整整一个星期。
        - id: ch04-b09
          speaker: narrator
          text: >-
            我也参加了那场宴会，吃过许多美味，喝过许多好饮料。只要我还活着，就绝不会把它忘记。
