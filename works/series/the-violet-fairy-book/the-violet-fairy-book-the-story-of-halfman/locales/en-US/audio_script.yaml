  chapters:
    - id: ch01
      title: Twelve Apples and Twelve Sons
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: In a certain town there lived a judge. He was married, but he and his wife had no children. One day he stood outside his house, so deep in troubled thought that he hardly noticed an old man passing by.
        - id: ch01-b02
          speaker: old_man
          text: What troubles you, sir? You look unhappy.
        - id: ch01-b03
          speaker: judge
          text: Oh, please leave me alone, good man.
        - id: ch01-b04
          speaker: old_man
          text: But tell me. What is wrong?
        - id: ch01-b05
          speaker: judge
          text: I have succeeded in my work, and people think me important. None of it matters to me, because I have no children.
        - id: ch01-b06
          speaker: old_man
          text: Then take these twelve apples. If your wife eats them, she will bear twelve sons.
        - id: ch01-b07
          speaker: narrator
          text: The judge thanked the old man joyfully and took all twelve apples. Then he hurried into the house to find his wife and tell her what the stranger had promised.
        - id: ch01-b08
          speaker: judge
          text: Eat these apples at once! They will give us twelve sons.
        - id: ch01-b09
          speaker: narrator
          text: His wife sat down and ate eleven apples. She was halfway through the twelfth when her sister came in, so she gave her sister the half that remained. In time, eleven strong, handsome boys were born. But when the twelfth son came into the world, there was only half of him.
        - id: ch01-b10
          speaker: narrator
          text: As the years passed, all twelve sons grew to manhood. One day they went to their father together. They told him they were old enough to marry and said it was high time he found wives for them.
        - id: ch01-b11
          speaker: judge
          text: I have a brother who lives far away in the East, and he has twelve daughters. Go to him and marry them.
        - id: ch01-b12
          speaker: narrator
          text: The twelve sons saddled their horses and rode for twelve days. Then they met an old woman on the road.
        - id: ch01-b13
          speaker: ogress
          text: Welcome, young men! Your uncle and I have waited a long time for you. His daughters are grown women now, and many men want to marry them. But I knew you would come, so I kept the girls for you. Come into my house.
        - id: ch01-b14
          speaker: narrator
          text: The brothers gladly followed the old woman to her house. A man stood waiting in the doorway and pretended to be their father's brother. He welcomed the travelers inside and set food and drink before them. The brothers ate, and when night came, everyone settled down to sleep. Only Halfman remained uneasy. He crept softly over to his brothers.
        - id: ch01-b15
          speaker: halfman
          text: Listen to me. That man is not our uncle. He is an ogre.
        - id: ch01-b16
          speakers: [eldest_brother, brother_2, brother_3, brother_4]
          ensemble: chorus
          text: Nonsense! Of course he is our uncle.
        - id: ch01-b17
          speaker: halfman
          text: You will see the truth before this night is over.
        - id: ch01-b18
          speaker: narrator
          text: Halfman did not go to bed. He hid himself and watched.
    - id: ch02
      title: The Red Cloth and the White
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Before long, the ogress slipped into the room on tiptoe. She spread a red cloth over the brothers, then covered her own daughters with a white one. After that she lay down, and soon she was snoring loudly.
        - id: ch02-b02
          speaker: narrator
          text: Once Halfman was sure she slept soundly, he exchanged the cloths. The red one went over the girls, and the white one over his brothers. Then he took the brothers' scarlet caps and traded them for the veils worn by the ogress's daughters.
        - id: ch02-b03
          speaker: narrator
          text: He had barely finished when he heard footsteps. He quickly hid inside the folds of a curtain. There was only half of him, so he fit.
        - id: ch02-b04
          speaker: narrator
          text: The ogress moved slowly and carefully through the darkness, stretching both hands ahead so that she would not stumble into anything. A tiny lantern hung at her waist, but its glow hardly reached beyond her feet. When she came to the sleeping girls, she bent down and lifted one corner of their cloth to the lantern. It was certainly red. Still, she wanted to be sure. She passed her hands lightly over their heads and felt the scarlet caps. Now she had no doubt that the brothers lay before her, and she began killing them one by one.
        - id: ch02-b05
          speaker: halfman
          text: Brothers, get up and run for your lives. The ogress is killing her own daughters.
        - id: ch02-b06
          speaker: narrator
          text: The brothers needed no second warning. In a moment, they were out of the house.
        - id: ch02-b07
          speaker: narrator
          text: The ogress had killed every daughter but the youngest when that girl suddenly woke and saw what had happened.
        - id: ch02-b08
          speaker: youngest_ogre_daughter
          text: Mother, what are you doing? You have killed my sisters!
          emotion: fearful
        - id: ch02-b09
          speaker: ogress
          text: Woe is me! Halfman has tricked me after all!
          emotion: sad
        - id: ch02-b10
          speaker: narrator
          text: She turned to take revenge, but Halfman and his brothers were already far away. They rode all day until they reached the town where their true uncle lived, then asked the way to his house.
        - id: ch02-b11
          speaker: uncle
          text: Why has it taken you so long to come?
        - id: ch02-b12
          speakers: [eldest_brother, brother_2, brother_3, brother_4]
          ensemble: chorus
          text: Dear uncle, we nearly never arrived. An ogress took us home and meant to kill us, but Halfman understood her plan and saved us. Now please give each of us a daughter for a wife, and let us return home.
        - id: ch02-b13
          speaker: uncle
          text: Take them. The eldest shall marry the eldest, the second shall marry the second, and so on, down to the youngest.
        - id: ch02-b14
          speaker: narrator
          text: Halfman's bride was the youngest, and she was the prettiest of them all. His brothers grew jealous.
        - id: ch02-b15
          speaker: eldest_brother
          text: Why should someone who is only half a man get the best bride? Let us kill him and give his wife to our eldest brother.
        - id: ch02-b16
          speaker: narrator
          text: The brothers agreed and waited for their chance.
    - id: ch03
      title: Betrayal at the Brook
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The brothers rode homeward with their brides. After they had traveled some distance, they came to a brook.
        - id: ch03-b02
          speaker: brother_2
          text: Who will fetch water from the brook?
        - id: ch03-b03
          speaker: eldest_brother
          text: Halfman is the youngest. He must go.
        - id: ch03-b04
          speaker: narrator
          text: Halfman climbed down and filled a skin with water. His brothers pulled it up with a rope and drank. Halfman stood in the middle of the stream below them.
        - id: ch03-b05
          speaker: halfman
          text: Throw down the rope and pull me up. I cannot climb out by myself.
        - id: ch03-b06
          speaker: narrator
          text: His brothers threw down the rope and began hauling him up the steep bank. Halfman rose above the water, hand over hand. But when he was only halfway to the top, they cut the rope without warning. He plunged back into the stream, while the brothers mounted and galloped away as fast as they could, taking his bride with them.
        - id: ch03-b07
          speaker: narrator
          text: The force of the fall drove Halfman beneath the water. Before he reached the bottom, a fish swam to him.
        - id: ch03-b08
          speaker: fish
          text: Do not be afraid, Halfman. I will help you.
          emotion: calm
        - id: ch03-b09
          speaker: narrator
          text: The fish led him to shallow water, where he managed to scramble out.
        - id: ch03-b10
          speaker: fish
          text: Do you understand what your brothers have done, after you saved them from death?
        - id: ch03-b11
          speaker: halfman
          text: I understand. But what can I do now?
        - id: ch03-b12
          speaker: fish
          text: Take one of my scales. Whenever danger finds you, throw it into the fire. I will come to you then.
        - id: ch03-b13
          speaker: halfman
          text: Thank you.
        - id: ch03-b14
          speaker: narrator
          text: Halfman continued on alone, and the fish swam home. The land was strange to him. He wandered without knowing where he was going until the ogress suddenly stood in his path.
        - id: ch03-b15
          speaker: ogress
          text: So I have caught you at last, Halfman. You killed my daughters and helped your brothers escape. What do you think I will do to you?
          emotion: angry
        - id: ch03-b16
          speaker: halfman
          text: Whatever you please.
        - id: ch03-b17
          speaker: ogress
          text: Then come into my house.
        - id: ch03-b18
          speaker: narrator
          text: Halfman followed her.
    - id: ch04
      title: The Ogre's Feast
      blocks:
        - id: ch04-b01
          speaker: ogress
          text: Look what I caught! I have Halfman. I mean to roast him, so hurry and build up the fire.
        - id: ch04-b02
          speaker: narrator
          text: The ogre piled up wood until the flames roared into the chimney.
        - id: ch04-b03
          speaker: ogre
          text: The fire is ready. Let us put him over it.
        - id: ch04-b04
          speaker: halfman
          text: Why hurry, good ogre? You have me in your power, and I cannot get away. But I am so thin that I would hardly make one mouthful. Fatten me first, and you will enjoy eating me much more.
        - id: ch04-b05
          speaker: ogre
          text: That makes good sense. What food will fatten you fastest?
        - id: ch04-b06
          speaker: halfman
          text: Butter, meat, and red wine.
        - id: ch04-b07
          speaker: ogre
          text: Very well. We will lock you in this room until you are ready to eat.
        - id: ch04-b08
          speaker: narrator
          text: The ogre and ogress shut Halfman inside the room and locked the door. Every day they brought him butter, meat, and red wine, just as he had requested. They watched him eat and waited for him to grow fat enough for their feast. Three full months passed before Halfman finally called to his keepers.
        - id: ch04-b09
          speaker: halfman
          text: I am quite fat now. You may take me out and kill me.
        - id: ch04-b10
          speaker: ogre
          text: Then come out!
        - id: ch04-b11
          speaker: halfman
          text: First, you and your wife should invite your friends to the feast. Your daughter can stay here and watch me.
        - id: ch04-b12
          speakers: [ogre, ogress]
          ensemble: duo
          text: Yes, that is a good idea.
        - id: ch04-b13
          speaker: halfman
          text: Bring the wood in here too. I will split it into small pieces, so cooking me will not be delayed.
        - id: ch04-b14
          speaker: narrator
          text: The ogress gave him a heap of wood and an axe. Then she and her husband left to gather their guests, while Halfman and the ogress's remaining daughter stayed in the house.
        - id: ch04-b15
          speaker: narrator
          text: Halfman chopped for a while, then called to the girl.
        - id: ch04-b16
          speaker: halfman
          text: Come help me, or I will never finish before your mother returns.
        - id: ch04-b17
          speaker: youngest_ogre_daughter
          text: All right.
        - id: ch04-b18
          speaker: narrator
          text: She held a piece of wood for him. Halfman raised the axe, cut off her head, and ran away like the wind.
        - id: ch04-b19
          speaker: narrator
          text: When the ogre and his wife returned, they found their daughter lying there without her head. They wept and sobbed together.
        - id: ch04-b20
          speakers: [ogre, ogress]
          ensemble: duo
          text: Halfman did this! Why did we ever listen to him?
          emotion: sad
        - id: ch04-b21
          speaker: narrator
          text: But Halfman was already far away.
    - id: ch05
      title: The Iron Tower
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Halfman ran straight on, searching for shelter. He knew the ogre's legs were much longer than his, so reaching safety quickly was his only hope. At last he saw an iron tower and climbed to the top.
        - id: ch05-b02
          speaker: narrator
          text: Soon the ogre appeared. He looked behind every rock and tree, never guessing that Halfman was so close. Then a voice called down from above.
        - id: ch05-b03
          speaker: halfman
          text: Come up! Come up! You will find me here!
        - id: ch05-b04
          speaker: ogre
          text: How can I get up there? I see no door, and I cannot climb that tower.
        - id: ch05-b05
          speaker: halfman
          text: There is no door.
        - id: ch05-b06
          speaker: ogre
          text: Then how did you climb it?
        - id: ch05-b07
          speaker: halfman
          text: A fish carried me up on its back.
        - id: ch05-b08
          speaker: ogre
          text: What should I do?
        - id: ch05-b09
          speaker: halfman
          text: Fetch every one of your relations and tell them to bring plenty of sticks. Build a fire around the tower and keep it burning until the iron is red-hot. Then all of you can knock the tower down.
        - id: ch05-b10
          speaker: ogre
          text: Very good.
        - id: ch05-b11
          speaker: narrator
          text: The ogre went from one relation to the next and told every man to gather sticks and carry them to the tower where Halfman sat. They heaped the wood around its base and set it alight. The fire burned hotter and hotter until the whole iron tower glowed red like coral. Then the men rushed forward together and flung themselves against it, trying to knock it down. The burning iron set them alight instead, and every one of them burned to death. High overhead, Halfman watched them and laughed heartily.
        - id: ch05-b12
          speaker: narrator
          text: The ogress had not helped light the fire, so she alone remained alive.
        - id: ch05-b13
          speaker: ogress
          text: You killed my daughters, my husband, and every man of my family! How can I reach you and take my revenge?
          emotion: angry
        - id: ch05-b14
          speaker: halfman
          text: That is easy. I will lower a rope. Tie it tightly around yourself, and I will pull you up.
        - id: ch05-b15
          speaker: ogress
          text: All right. I have fastened it. Pull me up now.
        - id: ch05-b16
          speaker: halfman
          text: Are you sure the rope is secure?
        - id: ch05-b17
          speaker: ogress
          text: Yes, I am certain.
        - id: ch05-b18
          speaker: halfman
          text: Do not be afraid.
        - id: ch05-b19
          speaker: ogress
          text: I am not afraid at all!
        - id: ch05-b20
          speaker: narrator
          text: Halfman slowly hauled her upward. When she was almost at the top, he released the rope. The ogress fell and broke her neck.
        - id: ch05-b21
          speaker: halfman
          text: That was hard work. The rope has hurt my hands badly, but at last I am rid of her forever.
        - id: ch05-b22
          speaker: narrator
          text: Halfman climbed down and went on until he reached a lonely place. He was exhausted, so he lay down and slept.
        - id: ch05-b23
          speaker: narrator
          text: While it was still dark, another ogress passed that way. She woke him.
        - id: ch05-b24
          speaker: second_ogress
          text: Halfman, tomorrow your brother will marry your wife.
        - id: ch05-b25
          speaker: halfman
          text: How can I stop it? Will you help me?
        - id: ch05-b26
          speaker: second_ogress
          text: Yes, I will.
        - id: ch05-b27
          speaker: halfman
          text: Thank you! Thank you! My wife is dearer to me than anything in the world. And it is not my brother's fault that I did not die long ago.
        - id: ch05-b28
          speaker: second_ogress
          text: Very well. I will remove him, but only on one condition. If you have a son, you must give the boy to me.
        - id: ch05-b29
          speaker: halfman
          text: I will promise anything, if you free me from my brother and restore my wife.
        - id: ch05-b30
          speaker: second_ogress
          text: Climb onto my back. We will be there in a quarter of an hour.
        - id: ch05-b31
          speaker: narrator
          text: Halfman climbed onto her back, and the ogress kept her word. She carried him with such speed that within a few minutes they reached the outskirts of the town where Halfman and his brothers lived. There she put him down and left him waiting outside, while she went on into the town alone.
    - id: ch06
      title: Halfman Comes Home
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: The wedding guests were just leaving the eldest brother's house when the ogress arrived. She passed among them without being noticed, crept into the folds of a curtain, and changed herself into a scorpion. Later, as the bridegroom was about to get into bed, the scorpion darted out and stung him behind the ear. He fell dead on the spot.
        - id: ch06-b02
          speaker: narrator
          text: The ogress returned to Halfman and told him to claim his bride. He sprang up and hurried toward his father's house. As he drew near, he heard weeping and cries of grief. He stopped a man on the road.
        - id: ch06-b03
          speaker: halfman
          text: What has happened?
        - id: ch06-b04
          speaker: passerby
          text: The judge's eldest son married yesterday, and before night came, he suddenly died.
        - id: ch06-b05
          speaker: halfman
          text: My conscience is clear. He wanted my wife, and that is why he tried to drown me.
        - id: ch06-b06
          speaker: narrator
          text: Halfman went straight to his father's room. The judge sat on the floor in tears.
        - id: ch06-b07
          speaker: halfman
          text: Dear father, are you not glad to see me? You mourn my brother, but I am your son too. He stole my bride and tried to drown me in the brook. He is dead, but I am alive.
        - id: ch06-b08
          speaker: judge
          text: No, no. He was better than you.
          emotion: sad
        - id: ch06-b09
          speaker: halfman
          text: Why do you say that, Father?
        - id: ch06-b10
          speaker: judge
          text: He told me that you had behaved very badly.
        - id: ch06-b11
          speaker: halfman
          text: Call my brothers here. I have a story they must hear.
        - id: ch06-b12
          speaker: narrator
          text: The judge sent for the surviving sons, and they all came into his presence. Halfman stood before his father and brothers and began his account from the day their journey had led them to the false uncle's house.
        - id: ch06-b13
          speaker: halfman
          text: Twelve days after leaving home, we met an ogress. She claimed our uncle and his daughters had been waiting for us and led us to her house. I warned my brothers that the man there was an ogre, not our uncle.
        - id: ch06-b14
          speaker: halfman
          text: That night she covered us with a red cloth and her daughters with a white one. I exchanged the cloths. When she returned in the darkness, she mistook her daughters for us and killed all but the youngest. I woke my brothers, and together we escaped to our real uncle.
        - id: ch06-b15
          speaker: halfman
          text: Our uncle welcomed us and married us to his twelve daughters, from the eldest down to me. My bride was the youngest and the prettiest. My brothers envied me, so they left me to drown in a brook. A fish saved me and showed me the way out.
        - id: ch06-b16
          speaker: halfman
          text: Father, you are a judge. Tell us who did right and who did wrong. Was it my brothers, or was it me?
        - id: ch06-b17
          speaker: judge
          text: Sons, is his story true?
        - id: ch06-b18
          speakers: [brother_2, brother_3, brother_4]
          ensemble: chorus
          text: It is true, Father. Everything happened as Halfman said, and the young woman belongs to him.
        - id: ch06-b19
          speaker: narrator
          text: The judge embraced Halfman.
        - id: ch06-b20
          speaker: judge
          text: You have done well, my son. Take your bride, and may the two of you live long and happily together.
    - id: ch07
      title: The Ogress's Forfeit
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: At the end of a year, Halfman's wife gave birth to a son. Not long afterward, she hurried into a room and found her husband weeping.
        - id: ch07-b02
          speaker: halfmans_wife
          text: What is the matter?
        - id: ch07-b03
          speaker: halfman
          text: What is the matter?
        - id: ch07-b04
          speaker: halfmans_wife
          text: Yes. Why are you crying?
        - id: ch07-b05
          speaker: halfman
          text: Because the baby is not truly ours. He belongs to an ogress.
          emotion: sad
        - id: ch07-b06
          speaker: halfmans_wife
          text: Have you lost your senses? What do you mean?
          emotion: surprised
        - id: ch07-b07
          speaker: halfman
          text: When the ogress agreed to kill my brother and return you to me, I promised that our first son would be hers.
        - id: ch07-b08
          speaker: halfmans_wife
          text: Will she take him from us now?
          emotion: fearful
        - id: ch07-b09
          speaker: halfman
          text: Not yet. She will wait until he is bigger.
        - id: ch07-b10
          speaker: halfmans_wife
          text: Must she have every child we bear?
        - id: ch07-b11
          speaker: halfman
          text: No. Only this one.
        - id: ch07-b12
          speaker: narrator
          text: The boy grew bigger day by day. One afternoon, while he played in the street with the other children, the ogress approached him.
        - id: ch07-b13
          speaker: second_ogress
          text: Go to your father and tell him this. I want the forfeit he owes me. When will he give it to me?
        - id: ch07-b14
          speaker: mohammed
          text: All right.
        - id: ch07-b15
          speaker: narrator
          text: The child went home and forgot the message completely. The next day, the ogress found him again.
        - id: ch07-b16
          speaker: second_ogress
          text: What answer did your father give you?
        - id: ch07-b17
          speaker: mohammed
          text: I forgot to tell him.
        - id: ch07-b18
          speaker: second_ogress
          text: Then wear this ring on your finger. It will keep you from forgetting.
        - id: ch07-b19
          speaker: mohammed
          text: Very well.
        - id: ch07-b20
          speaker: narrator
          text: He put on the ring and went home. At breakfast the next morning, his mother noticed it.
        - id: ch07-b21
          speaker: halfmans_wife
          text: Child, where did that ring come from?
        - id: ch07-b22
          speaker: mohammed
          text: A woman gave it to me yesterday. Father, she said she wants her forfeit. She wants to know when she can have it.
        - id: ch07-b23
          speaker: narrator
          text: Halfman burst into tears.
        - id: ch07-b24
          speaker: halfman
          text: If she comes again, tell her that your parents say she may take her forfeit at once and go.
          emotion: sad
        - id: ch07-b25
          speaker: narrator
          text: Both parents began weeping again. His mother kissed him and dressed him in new clothes.
        - id: ch07-b26
          speaker: halfmans_wife
          text: If the woman tells you to follow her, you must go with her.
          emotion: sad
        - id: ch07-b27
          speaker: narrator
          text: The boy hardly noticed her grief because his fine new clothes delighted him. He ran outside to his playfellows.
        - id: ch07-b28
          speaker: mohammed
          text: Look how smart I am! I am going away with my aunt to foreign lands.
          emotion: happy
        - id: ch07-b29
          speaker: narrator
          text: Just then, the ogress came up to him.
        - id: ch07-b30
          speaker: second_ogress
          text: Did you give my message to your father and mother?
        - id: ch07-b31
          speaker: mohammed
          text: Yes, dear aunt.
        - id: ch07-b32
          speaker: second_ogress
          text: What did they say?
        - id: ch07-b33
          speaker: mohammed
          text: They said to take it away at once.
        - id: ch07-b34
          speaker: narrator
          text: So the ogress took the boy with her.
        - id: ch07-b35
          speaker: narrator
          text: Dinnertime came, but the child did not return. His father and mother waited, and as the hours passed they understood that the ogress had taken him and that he would never come home. They sat together and wept through the rest of the day. At last Halfman rose and spoke to his wife.
        - id: ch07-b36
          speaker: halfman
          text: Take comfort. We will wait one year. Then I will find the ogress and see our boy for myself, and learn how she cares for him.
          emotion: calm
        - id: ch07-b37
          speaker: halfmans_wife
          text: Yes. That will be best.
        - id: ch07-b38
          speaker: narrator
          text: A year passed. Halfman saddled his horse and rode to the place where the ogress had once found him asleep. She was not there. He did not know where else to go, so he dismounted and waited. At about midnight, she suddenly appeared before him.
        - id: ch07-b39
          speaker: second_ogress
          text: Halfman, why have you come here?
        - id: ch07-b40
          speaker: halfman
          text: I have a question for you.
        - id: ch07-b41
          speaker: second_ogress
          text: Ask it, then. But I already know. Your wife wants to know whether I will take your second son as I took the first.
        - id: ch07-b42
          speaker: halfman
          text: Yes, that is my question. Oh, please let me see my son. I want to know how he looks and what he is doing.
        - id: ch07-b43
          speaker: narrator
          text: Halfman seized her hand as he begged. The ogress said nothing. She drove her staff hard into the ground. The earth opened, and the boy appeared.
        - id: ch07-b44
          speaker: mohammed
          text: Dear father, have you come here too?
        - id: ch07-b45
          speaker: narrator
          text: Halfman clasped his child in his arms and began to cry. But the boy struggled to get free.
        - id: ch07-b46
          speaker: mohammed
          text: Dear father, put me down. I have a new mother who is better than my old mother, and a new father who is better than you.
        - id: ch07-b47
          speaker: narrator
          text: Halfman set him down.
        - id: ch07-b48
          speaker: halfman
          text: Go in peace, my boy. But first tell your ogre father and your ogress mother that they shall never have another child of mine.
        - id: ch07-b49
          speaker: mohammed
          text: All right. Mother!
        - id: ch07-b50
          speaker: second_ogress
          text: What is it?
        - id: ch07-b51
          speaker: mohammed
          text: You must never take any more of my father's and mother's children.
        - id: ch07-b52
          speaker: second_ogress
          text: Now that I have you, I do not want any more.
        - id: ch07-b53
          speaker: mohammed
          text: Go in peace, dear father. Give my mother my love, and tell her not to worry anymore. She may keep all her other children.
        - id: ch07-b54
          speaker: narrator
          text: Halfman mounted his horse and rode home. He told his wife everything he had seen and delivered the message sent by Mohammed, son of Halfman, son of the judge.
