        pitch: 中音
  chapters:
    - id: ch01
      title: 森林里的诺言
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，金国的国王在森林里迷了路。他想了种种办法，还是找不到出口。后来，他挑了一条看着最有希望的小径走去，迎面遇见一个陌生人。
        - id: ch01-b02
          speaker: stranger
          text: >-
            朋友，你在这里做什么？天马上就黑了，野兽也快要出洞找吃的了。
        - id: ch01-b03
          speaker: king
          text: >-
            我迷了路，正在找回家的路。
        - id: ch01-b04
          speaker: stranger
          text: >-
            那你答应我一件事。回家以后，第一个出来迎接你的东西，要送给我。只要你肯答应，我就领你出去。
        - id: ch01-b05
          speaker: narrator
          text: >-
            国王没有立刻回答。他想，最先跑出来的多半是自己最好的猎犬。难道没有这个人，他就真走不出去吗？陌生人等不到回答，转身走了。
        - id: ch01-b06
          speaker: narrator
          text: >-
            国王一条路接一条路地寻找。三天过去，他仍旧困在森林里。就在他快要绝望时，陌生人忽然又挡在前面。
        - id: ch01-b07
          speaker: stranger
          text: >-
            怎么样？把第一个出来迎接你的东西送给我，你答不答应？
        - id: ch01-b08
          speaker: narrator
          text: >-
            国王还是不肯。他又转了好几天，这条路试试，那条路走走，最后连勇气也耗光了。他累得倒在一棵树下，以为自己就要死在这里。陌生人第三次出现了。
        - id: ch01-b09
          speaker: stranger
          text: >-
            你怎么这么糊涂？不过是一条狗，值得拿命去换吗？答应给我报酬，我就带你离开森林。
        - id: ch01-b10
          speaker: king
          text: >-
            好吧。我的命总比一千条狗要紧，整个王国还指望着我。我答应你的条件，你带我回宫吧。
        - id: ch01-b11
          speaker: narrator
          text: >-
            话刚说完，国王就发现自己站在森林边上。暮色已经笼罩四野，远处的宫殿只能看见模糊的轮廓。他拼命向那里赶去，才到宫门，乳母便抱着小王子出来迎接。孩子一看见父亲，立刻伸开双臂，国王却猛地向后一退。
        - id: ch01-b12
          speaker: king
          text: >-
            快把孩子抱走！马上！
          emotion: fearful
        - id: ch01-b13
          speaker: narrator
          text: >-
            接着，那条高大的猎犬欢蹦乱跳地扑了过来。国王没有抚摸它，反而狠狠把它推开。等心里的怒气过去，他才静下来盘算，最后把漂亮的小王子和一个农夫的女儿调换了。
        - id: ch01-b14
          speaker: narrator
          text: >-
            从此，王子穿着粗衣，吃着淡饭，被当作农家的孩子养大。那个小姑娘却睡进金摇篮，盖上丝绸被单。一年以后，陌生人来拿走约定中的孩子。他把小姑娘带走了，还以为她真是国王的女儿。
        - id: ch01-b15
          speaker: narrator
          text: >-
            国王见计谋成功，欢喜得命人摆下盛宴，又送给王子的养父母许多贵重礼物，让儿子什么也不缺。可他害怕骗局败露，始终不敢把王子接回宫。农夫夫妻也很满意这样的安排，因为从此钱财够用，食物也从不短缺。
        - id: ch01-b16
          speaker: narrator
          text: >-
            日子一天天过去，男孩渐渐长得高大强壮，在养父母家似乎也过得很快活。可他的快乐总罩着一层阴影，几乎被这阴影全毁了。养父偷偷告诉他，他其实是国王的儿子。从那以后，只要想到那个无辜的可怜姑娘正在替自己受苦，他的心便再也安宁不了。
        - id: ch01-b17
          speaker: narrator
          text: >-
            王子下定决心，等年纪一到，就走遍天下去救她。拿一个姑娘的性命换王位，这个代价太沉重了。十八年后的一天，他穿上农家雇工的衣裳，背起一袋豌豆，走进父亲当年迷路的森林。
        - id: ch01-b18
          speaker: prince
          text: >-
            唉，我可真倒霉！这是什么地方？难道没人能带我走出森林吗？

    - id: ch02
      title: 地下的寂静世界
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            一个怪人走了出来。他留着灰色长胡子，腰间挂着皮袋，笑眯眯地向王子点头。
        - id: ch02-b02
          speaker: stranger
          text: >-
            这一带我熟得很。只要你肯给我一份好报酬，我就领你出去。
        - id: ch02-b03
          speaker: prince
          text: >-
            我这样的穷人能给你什么？除了这条命，我什么也没有。连这身衣服，都是主人供我吃穿才借给我的。
        - id: ch02-b04
          speaker: stranger
          text: >-
            总不会真的一无所有吧？你背上那个袋子，看着可不轻。
        - id: ch02-b05
          speaker: prince
          text: >-
            袋里是豌豆。我老姑妈昨夜去世了，留下的钱连守灵要用的豌豆都买不起。我们全国都有这个风俗，少了可不行。我只好向主人借来一袋，本想抄近路穿过森林，谁知竟迷了路。
        - id: ch02-b06
          speaker: stranger
          text: >-
            原来你是个孤儿。要不到我家做工？我正缺一个机灵的小伙子，你倒很合我的心意。
        - id: ch02-b07
          speaker: prince
          text: >-
            条件合适，我当然愿意。我生来就是农民，吃谁家的饭都一样辛苦，侍候谁也没什么分别。你打算给我多少工钱？
        - id: ch02-b08
          speaker: stranger
          text: >-
            每天有新鲜饭菜，每周吃两回肉，还有黄油和蔬菜。夏衣冬衣都由我出，另外给你一块地自己用。
        - id: ch02-b09
          speaker: prince
          text: >-
            这就够了。姑妈只好请别人安葬，我跟你走。
        - id: ch02-b10
          speaker: narrator
          text: >-
            老家伙一听，高兴得像陀螺似的原地打转，还放声唱起歌来，声音传遍整座森林。随后两人一同上路。他一路说个不停，根本没发现新仆人正从袋里不断撒下豌豆。
        - id: ch02-b11
          speaker: narrator
          text: >-
            夜里，他们睡在一棵无花果树下。太阳升起后，两人继续赶路。大约到了正午，他们来到一块巨石前。灰胡子四下看了看，尖声吹个口哨，又用左脚在地上跺了三下。巨石下面顿时露出一道暗门，里面像是洞穴的入口。老人抓住王子的胳膊，粗声命令他。
        - id: ch02-b12
          speaker: stranger
          text: >-
            跟我来！
        - id: ch02-b13
          speaker: narrator
          text: >-
            黑暗一下包住了他们。脚下的路越走越深，仿佛一直通向地底。过了很久，王子终于看到一点微光。那不是日光，也不是月光，只是一团苍白的雾，却是这个古怪世界里唯一的亮光。
        - id: ch02-b14
          speaker: narrator
          text: >-
            这里的泥土、流水、花木和飞禽走兽，没有一样是他从前见过的。更叫人害怕的是，四周安静得没有一点声音。鸟儿挺着头、鼓着喉咙，王子却听不见鸣叫。狗张嘴像在吠，拉犁的牛也像在长鸣，可犬吠和牛叫全都传不过来。
        - id: ch02-b15
          speaker: narrator
          text: >-
            水流过石子，没有水声。风压弯树梢，也听不见风声。苍蝇和金龟子飞来飞去，照样划不破这片沉寂。灰胡子一句话也不说。王子想问这是怎么回事，声音却刚到喉咙就死去了。
        - id: ch02-b16
          speaker: narrator
          text: >-
            谁也不知道这可怕的寂静持续了多久。王子的心渐渐冻得像冰，头发根根竖起，寒意顺着脊背往下爬。终于，他听见了一丝微弱的声响。那声音仿佛有一队马，正在荒野上一边犁地一边前进。只有影子的世界一下活了过来。
        - id: ch02-b17
          speaker: stranger
          text: >-
            水壶烧开了，家里正在等我们。
        - id: ch02-b18
          speaker: narrator
          text: >-
            又走了一段，王子听见锯木厂磨锯似的巨响，像有几十把锯子一齐开动。
        - id: ch02-b19
          speaker: stranger
          text: >-
            祖母睡得正香。听，她的鼾声多响。
        - id: ch02-b20
          speaker: narrator
          text: >-
            翻过小山，主人的住宅远远出现在眼前。周围房屋多得数不清，看着不像一户人家，倒像一座村庄，甚至一座小镇。两人来到门前，那里摆着一只空狗窝。
        - id: ch02-b21
          speaker: stranger
          text: >-
            你先爬进去等着。我进去见祖母。上了年纪的人都很固执，她受不了家里突然来了生人。
        - id: ch02-b22
          speaker: narrator
          text: >-
            王子浑身发抖地钻进狗窝，开始后悔自己胆子太大，竟招来这样的麻烦。过了一会儿，主人回来叫他出来。看来有什么事惹恼了老人，他紧皱着眉，先把规矩说得明明白白。
        - id: ch02-b23
          speaker: stranger
          text: >-
            我家的规矩，你给我看清楚，千万别犯错，不然有你好受。眼睛和耳朵都要张开，嘴却必须闭紧。只准服从，不许提问。想感恩随你的便，可只要没人问你，就绝不能开口。
        - id: ch02-b24
          speaker: narrator
          text: >-
            王子跨进门，第一眼便看见一位美得惊人的姑娘。她有棕色的眼睛，淡金色的鬈发。王子心想，老头若有许多这样的女儿，自己倒很愿意做他的女婿，这一位就正合心意。
        - id: ch02-b25
          speaker: narrator
          text: >-
            姑娘摆好桌子，端来一道又一道饭菜，然后在炉火旁坐下，取出针线缝补自己的长袜。她仿佛根本没看见屋里多了一个陌生人。主人独自坐到桌边，既不招呼新仆人同吃，也不叫姑娘入座，老祖母更是一直没有露面。他胃口大得吓人，很快便扫光了所有菜肴，那些东西本来足够十二个人填饱肚子。
        - id: ch02-b26
          speaker: stranger
          text: >-
            可以收拾了。铁锅里剩下的就是你的晚饭，骨头拿去喂狗。
        - id: ch02-b27
          speaker: narrator
          text: >-
            王子不喜欢把残羹剩饭当正餐，但还是帮姑娘收拾起来。尝过以后，他才发现饭菜不但够吃，味道也很好。席间，他一次次偷看姑娘，还想和她说话。每次他刚要张嘴，姑娘就严厉地瞪他一眼，像在叫他安静。于是，他只好让眼睛替自己说话。主人吃饱以后正躺在炉边的长凳上，他们说什么都逃不过他的耳朵。
        - id: ch02-b28
          speaker: stranger
          text: >-
            你一路辛苦，可以休息两天，也可以四处看看。后天跟我去干活，到时我会告诉你该做什么。女仆会领你去睡觉的地方。
        - id: ch02-b29
          speaker: narrator
          text: >-
            王子以为主人准许自己回答，谁知老人立刻大发雷霆，转过身吼了起来。
        - id: ch02-b30
          speaker: stranger
          text: >-
            你这狗奴才！竟敢坏我的规矩。再开口，你很快就会少掉脑袋！把嘴闭上，别来烦我！
          emotion: angry
        - id: ch02-b31
          speaker: narrator
          text: >-
            姑娘示意王子跟上，推开一扇门，点头叫他进去。姑娘看起来很忧伤，王子本想再停一会儿，又怕老人发火，只得走进房间。
        - id: ch02-b32
          speaker: narrator
          text: >-
            他认定，这样善良的姑娘绝不会是老人的女儿。她准是当年替自己被带走的那个孩子。为了救她，哪怕拿脑袋冒险，他也要把这件疯狂的事做到底。王子躺上床，很久才睡着。可就算睡着了，梦也不让他安宁。重重危险一次次围住他，每到最要紧的时候，都是姑娘施展力量，帮助他平安闯过去。
        - id: ch02-b33
          speaker: narrator
          text: >-
            醒来以后，王子首先想到了姑娘。他找到她时，她正在辛苦干活。王子从井里打水，替她提回屋，又点起铁锅下面的火。凡是能帮上忙的，他都动手做了。
        - id: ch02-b34
          speaker: narrator
          text: >-
            下午，王子走出屋子，想熟悉这个新住处。他四处闲逛，始终没见到老祖母，心里十分奇怪。走到农院，他看见一匹漂亮的白马独占一间马厩。另一间厩里养着一头黑母牛和两头白脸小牛，远处还能听见鹅、鸭和母鸡的咯咯叫声。
        - id: ch02-b35
          speaker: narrator
          text: >-
            三顿饭都像头一天那么可口。要不是在姑娘面前也不能说话，王子对这里倒还满意。第二天傍晚，他按照吩咐去领次日的任务。

    - id: ch03
      title: 四件不可能的差事
      blocks:
        - id: ch03-b01
          speaker: stranger
          text: >-
            明天的活很容易。拿这把镰刀，割够白马一天吃的草，再把它的马厩打扫干净。等我回来，食槽若是空了，你就要倒大霉。给我小心些！
        - id: ch03-b02
          speaker: narrator
          text: >-
            王子心里很高兴，以为这点活一会儿就能干完。他虽没用过犁和镰刀，却常看乡下人干活，觉得一点也不难。就在他要开房门时，姑娘轻轻走过来，贴着他的耳朵低声询问。
        - id: ch03-b03
          speaker: girl
          text: >-
            他叫你做什么？
        - id: ch03-b04
          speaker: prince
          text: >-
            明天的活根本不值一提，只要给马割草，再把马厩扫干净。
        - id: ch03-b05
          speaker: girl
          text: >-
            唉，你真倒霉！那匹白马就是主人的祖母，永远也吃不饱。二十个人不停割草，才够它吃一天，还得再有二十个人打扫马厩。你一个人怎么做得完？
        - id: ch03-b06
          speaker: girl
          text: >-
            你要活命，就仔细听我说。把食槽塞得再也装不下以后，从干草里挑出灯心草，编成一条结实的辫绳，再削一根粗硬的木桩，一定要让白马看见。它问你拿这些做什么，你就说，要用绳子捆住它的嘴，不让它再吃，还要用木桩把它钉在原地，免得它把谷物和水弄得到处都是。
        - id: ch03-b07
          speaker: narrator
          text: >-
            姑娘说完，像来时一样悄悄离去。第二天一早，王子便开始割草。镰刀轻快地扫过草丛，比他预想得还容易。不一会儿，食槽便装满了。可等他带着第二批草回来，食槽竟已经空了。
        - id: ch03-b08
          speaker: narrator
          text: >-
            这下王子明白了，没有姑娘指点，自己必定会丢掉性命。他马上从干草里挑出不知怎么混进去的灯心草，飞快地编起来。
        - id: ch03-b09
          speaker: white_mare
          text: >-
            孩子，你在编什么？
        - id: ch03-b10
          speaker: prince
          text: >-
            没什么。我编条绳子勒住你的下巴，把你的嘴捆起来，省得你还要吃个没完。
        - id: ch03-b11
          speaker: narrator
          text: >-
            白马深深叹了口气，决定只吃已经进肚的那些。王子接着清扫马厩，白马这才知道，自己碰上了一个厉害的主人。到了中午，食槽里还剩着不少草料，马厩也打扫得一尘不染。王子刚把最后一点活做完，老人便走进来，站在门口惊得说不出话。
        - id: ch03-b12
          speaker: stranger
          text: >-
            这些真是你一个人做的？是你自己这么聪明能干，还是有人教了你？
        - id: ch03-b13
          speaker: prince
          text: >-
            没人帮我，只有我这颗又可怜又不灵光的脑袋。
        - id: ch03-b14
          speaker: narrator
          text: >-
            老人皱着眉走了。王子见事情顺利，暗暗高兴。傍晚，主人又叫住他。
        - id: ch03-b15
          speaker: stranger
          text: >-
            明天没什么特别的活。姑娘家务太多，你去替她挤黑母牛的奶。一定要挤得一滴不剩，否则有你好受。
        - id: ch03-b16
          speaker: narrator
          text: >-
            王子一边走一边想，只要没有圈套，这事听着并不难。他没挤过奶，可自己的手指又结实又有力。困意正浓时，姑娘走来问他。
        - id: ch03-b17
          speaker: girl
          text: >-
            你明天要做什么？
        - id: ch03-b18
          speaker: prince
          text: >-
            是帮你的忙。别的都不用做，只要把黑母牛的奶挤干净。
        - id: ch03-b19
          speaker: girl
          text: >-
            唉，你又要倒霉了！就算从早挤到晚，那头牛也挤不干净。想躲过这一关，只有一个办法。带一盆燃烧的炭和一把火钳去牛厩。把火钳插进炭里，使劲吹，直到烧得通红。母牛问你在做什么，你就按我告诉你的话回答。
        - id: ch03-b20
          speaker: narrator
          text: >-
            姑娘踮起脚，在他耳边悄悄说了几句。天边刚泛红，王子便跳下床，一手端炭盆，一手提奶桶，走进牛厩。他照姑娘的话，把火钳烧得通红。
        - id: ch03-b21
          speaker: black_cow
          text: >-
            小伙子，你这是在做什么？
        - id: ch03-b22
          speaker: prince
          text: >-
            没什么。我把火钳烧热，免得你不肯给我足够的奶。
        - id: ch03-b23
          speaker: narrator
          text: >-
            母牛深深叹气，害怕地望着挤奶的人。王子不理会它，飞快地把奶挤进桶里，直到一滴也挤不出来。老人恰好走进牛厩，坐下亲自去挤，果然连一滴奶也没得到。
        - id: ch03-b24
          speaker: stranger
          text: >-
            真是你独自做成的，还是有人帮你？
        - id: ch03-b25
          speaker: prince
          text: >-
            没人能帮我，还是靠我这颗可怜的脑袋。
        - id: ch03-b26
          speaker: narrator
          text: >-
            老人起身走了。当天夜里，王子去问第二天的工作。
        - id: ch03-b27
          speaker: stranger
          text: >-
            草地上有一小垛干草，要搬进棚里晾干。明天把它全部堆进棚中。你若还想活命，地上连一根草也不准留下。
        - id: ch03-b28
          speaker: narrator
          text: >-
            王子听说没有更难的差事，高兴极了。他以为一小垛干草不用多少本事，又有马拉车，根本不费力，自己可不会心疼那位老祖母。过了一会儿，姑娘偷偷来了。
        - id: ch03-b29
          speaker: girl
          text: >-
            明天又是什么任务？
        - id: ch03-b30
          speaker: prince
          text: >-
            看来我得把农活全学一遍。明天搬走一垛干草，地上不能剩下一根。这就是整天的活！
        - id: ch03-b31
          speaker: girl
          text: >-
            唉，你以为自己真做得到吗？就是全天下的人来帮忙，一个星期也搬不完。你把上面的草扔下来，下面的草马上又会扎根。
        - id: ch03-b32
          speaker: girl
          text: >-
            听我的。天亮前偷偷出去，牵来白马，再拿几条结实的绳子。爬上草垛，把整垛草捆起来，然后把白马套在绳上。全都准备好，你就坐到垛顶，从一、二、三往下数。白马问你数什么，你一定照我教你的话回答。
        - id: ch03-b33
          speaker: narrator
          text: >-
            姑娘又在他耳边低语几句。王子想不出更好的办法，便上床熟睡。醒来时天还很暗，他挑好粗绳，牵出白马，骑到草垛旁。那垛草足足装得下五十车，哪里能算一小垛。
        - id: ch03-b34
          speaker: narrator
          text: >-
            王子照姑娘吩咐的全部做好，坐在草垛顶上数起来。一直数到二十，白马终于忍不住了。
        - id: ch03-b35
          speaker: white_mare
          text: >-
            孩子，你坐在上面数什么？
        - id: ch03-b36
          speaker: prince
          text: >-
            没什么。我闲着无聊，数森林里有多少群狼。可狼群太多，只怕永远也数不完。
        - id: ch03-b37
          speaker: narrator
          text: >-
            “狼”字才出口，白马便像风一样冲了出去。眨眼之间，它已经到了棚前，身后还拖着整座草垛。早饭后，主人过来看见一天的活全做完了，惊得一句话也说不出。
        - id: ch03-b38
          speaker: stranger
          text: >-
            这也是你独自做的？到底是你聪明，还是有人给你出了好主意？
        - id: ch03-b39
          speaker: prince
          text: >-
            我只能同自己商量。
        - id: ch03-b40
          speaker: narrator
          text: >-
            老人摇着头离开了。夜深后，王子又去问次日的差事。
        - id: ch03-b41
          speaker: stranger
          text: >-
            明天把白头小牛带到草地上。你若还珍惜性命，就千万别让它跑掉。
        - id: ch03-b42
          speaker: narrator
          text: >-
            王子没有回答，只在心里想，十九岁的农家小伙大多能照看整群牲口，自己难道还管不住一头小牛？他往房间走去，姑娘在那里等着。
        - id: ch03-b43
          speaker: prince
          text: >-
            明天给我的活，简直连傻子都会做，只要把白头小牛带到草地上。
        - id: ch03-b44
          speaker: girl
          text: >-
            唉，你可知道它跑得有多快？一天之内，它能绕世界三圈。牢牢记住，把这根丝线的一头系在小牛左前腿上，另一头系住你左脚的小脚趾。不论你走着、站着还是躺着，它都别想离开你。
        - id: ch03-b45
          speaker: narrator
          text: >-
            王子上床睡了个好觉。第二天清早，他把丝线两头系好，牵小牛来到草地。小牛像忠实的狗一样，始终贴在他身旁。太阳落山时，它已经回到厩中。主人走来，皱着眉发问。
        - id: ch03-b46
          speaker: stranger
          text: >-
            这也是你自己的聪明，还是有人教了你办法？
        - id: ch03-b47
          speaker: prince
          text: >-
            我只有自己这颗可怜的脑袋。
        - id: ch03-b48
          speaker: narrator
          text: >-
            老人一边离开，一边低声咆哮。
        - id: ch03-b49
          speaker: stranger
          text: >-
            一个字我也不信！你一定找到了什么聪明的朋友！
          emotion: angry
        - id: ch03-b50
          speaker: narrator
          text: >-
            到了傍晚，老人又把王子叫去。
        - id: ch03-b51
          speaker: stranger
          text: >-
            明天不用干活。不过，我醒来时，你必须站到床前，伸手向我问早。
        - id: ch03-b52
          speaker: narrator
          text: >-
            王子觉得这个念头莫名其妙，笑着去找姑娘。姑娘却一点也笑不出来。
        - id: ch03-b53
          speaker: girl
          text: >-
            这不是好笑的事，他想吃掉你。只有一个办法能救你。把一把铁铲烧得通红，别伸自己的手，把铁铲递给他。
        - id: ch03-b54
          speaker: narrator
          text: >-
            第二天，王子早早醒来，赶在老人起床前把铁铲烧红。终于，屋里传来呼喊。
        - id: ch03-b55
          speaker: stranger
          text: >-
            你这个懒鬼，跑到哪里去了？快来向我问早！
          emotion: angry
        - id: ch03-b56
          speaker: narrator
          text: >-
            王子拿着通红的铁铲走进去，老人一看，马上改了口。
        - id: ch03-b57
          speaker: stranger
          text: >-
            我今天病得很重，虚弱得连你的手也碰不了。今晚再来吧，到时说不定会好些。
        - id: ch03-b58
          speaker: narrator
          text: >-
            王子在外面游荡了一整天，傍晚又来到老人房里。这一回，主人对他亲热得出奇。
        - id: ch03-b59
          speaker: stranger
          text: >-
            我对你很满意。明天天一亮，你和姑娘一起来见我。我知道你们早就彼此相爱，我要让你们结成夫妻。
        - id: ch03-b60
          speaker: narrator
          text: >-
            王子高兴得差点跳起来，想到家规，才勉强站着没动。可等他把消息告诉姑娘，姑娘的脸却白得像纸，半句话也说不出来。过了好一会儿，她终于开口。

    - id: ch04
      title: 红球照亮逃路
      blocks:
        - id: ch04-b01
          speaker: girl
          text: >-
            老人已经知道是谁在教你。他想把我们两个一起害死。我们必须逃走，不然就完了。你拿一把斧头，第一斧砍掉小牛的脑袋，第二斧把头劈开。它脑子里藏着一颗鲜红发亮的球，把球取来给我。我留在这里做该做的准备。
        - id: ch04-b02
          speaker: narrator
          text: >-
            王子心想，与其两个人都被杀，不如杀掉小牛。只要能够逃出去，他们就能回家。他一路撒下的豌豆应该已经发芽，不会找不到路。
        - id: ch04-b03
          speaker: narrator
          text: >-
            他走进牛厩，第一斧砍死小牛，第二斧劈开它的脑袋。一颗鲜红发亮的球从牛脑里滚出来，刹那间照亮了整间牛厩。王子赶紧捡起红球，用厚布一层又一层包严，藏进怀里。幸好母牛始终沉睡，不然它一叫，主人马上就会被惊醒。
        - id: ch04-b04
          speaker: narrator
          text: >-
            王子转身时，姑娘已经抱着一个小包袱站在门口。
        - id: ch04-b05
          speaker: girl
          text: >-
            红球拿到了吗？
        - id: ch04-b06
          speaker: prince
          text: >-
            就在这里。
        - id: ch04-b07
          speaker: girl
          text: >-
            那就快走，逃命一点也不能耽搁。
        - id: ch04-b08
          speaker: narrator
          text: >-
            姑娘揭开包裹红球的布，只露出一丁点光，正好照亮前路。果然，沿途撒下的豌豆全都生了根，长成一道矮篱笆。他们沿着它走，确信自己不会迷路。
        - id: ch04-b09
          speaker: narrator
          text: >-
            奔逃中，姑娘告诉王子，她无意间听见老人和祖母说话，这才知道自己原本也是国王的女儿。老家伙使了诡计，从她父母手中把她骗来。王子早已知道全部真相，却一句也没说。他想到自己终于有机会还姑娘自由，心里十分欢喜。两人一刻不停地走，直到天边开始发白。
        - id: ch04-b10
          speaker: narrator
          text: >-
            那天早晨，老人睡到很晚。他揉了半天眼睛，才彻底清醒。想到两个年轻人很快该来见他，他便等了起来。左等右等，始终不见人影，他咧嘴自言自语。
        - id: ch04-b11
          speaker: stranger
          text: >-
            嘿，他们倒是一点也不急着结婚。
        - id: ch04-b12
          speaker: narrator
          text: >-
            他又等了一阵，渐渐不安起来，扯开嗓子大喊。
        - id: ch04-b13
          speaker: stranger
          text: >-
            男仆！女仆！你们都到哪里去了？
        - id: ch04-b14
          speaker: narrator
          text: >-
            喊了许多遍，老人真的害怕了。不论他怎么叫，两人都不出现。他怒气冲冲地跳下床，到处搜寻，只找到一间空屋和两张根本没人睡过的床。
        - id: ch04-b15
          speaker: narrator
          text: >-
            老人径直冲进牛厩，看见小牛的尸体，立刻全明白了。他高声咒骂，猛地拉开第三间厩舍，放出锁在里面的妖怪仆从。
        - id: ch04-b16
          speaker: stranger
          text: >-
            给我追！不管他们变成什么样，都要带回来。我非抓到他们不可！
          emotion: angry
        - id: ch04-b17
          speaker: narrator
          text: >-
            妖怪们像风一样飞走了。

    - id: ch05
      title: 三次变化
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            两个逃亡的人正在穿过一片辽阔的平原，姑娘忽然停住脚步。
        - id: ch05-b02
          speaker: girl
          text: >-
            不好了！红球在我手里动起来，我们一定被追上了！
          emotion: fearful
        - id: ch05-b03
          speaker: narrator
          text: >-
            他们回头一看，只见一团乌云乘着风追来。姑娘把红球在手中转了三圈，高声念道。
        - id: ch05-b04
          speaker: girl
          text: |-
            红球红球，听我号令，
            快把我变作一道溪流，
            把我的爱人变作小鱼。
        - id: ch05-b05
          speaker: narrator
          text: >-
            转眼之间，平原上只剩一条溪流，一尾小鱼在水里游动。妖怪们随后赶到，半个人影也没看见。它们等了一会儿，便匆匆回去，没有惊动溪水和游鱼。等它们走远，溪流和小鱼恢复人形，继续赶路。
        - id: ch05-b06
          speaker: narrator
          text: >-
            妖怪们累得筋疲力尽，两手空空地回到主人面前。老人追问它们究竟见过什么，路上有没有怪事。
        - id: ch05-b07
          speakers: [demon_1, demon_2, demon_3]
          ensemble: chorus
          text: >-
            什么也没见到。平原上空空的，只有一条溪流，水里游着一尾鱼。
        - id: ch05-b08
          speaker: stranger
          text: >-
            蠢货！那当然就是他们！
          emotion: angry
        - id: ch05-b09
          speaker: narrator
          text: >-
            老人拉开第五间厩舍，命里面的妖怪去喝干溪流，捉住小鱼。妖怪们跳起来，又像风一样飞走了。
        - id: ch05-b10
          speaker: narrator
          text: >-
            两个年轻人快到森林边缘时，姑娘再次停下。
        - id: ch05-b11
          speaker: girl
          text: >-
            不好了，红球又在我手里动了。
          emotion: fearful
        - id: ch05-b12
          speaker: narrator
          text: >-
            她回头望去，只见一团比先前更大、更黑，还夹着红纹的乌云飞来。
        - id: ch05-b13
          speaker: girl
          text: >-
            追兵来了！
          emotion: fearful
        - id: ch05-b14
          speaker: narrator
          text: >-
            姑娘把红球转了三圈，对它念道。
        - id: ch05-b15
          speaker: girl
          text: |-
            红球红球，听我号令，
            快把我们双双变形。
            把我变作野蔷薇丛，
            把他变作枝头花红。
        - id: ch05-b16
          speaker: narrator
          text: >-
            话音落下，他们正好赶在妖怪到来前变成一丛蔷薇和枝头的一朵花。追兵到处寻找溪流和小鱼，可眼前只有蔷薇，只得垂头丧气地回去。等它们走远，蔷薇和花恢复了人形。这一小段休息给了两人力气，他们走得更快了。
        - id: ch05-b17
          speaker: stranger
          text: >-
            怎么样，找到他们了吗？
        - id: ch05-b18
          speaker: demon_1
          text: >-
            没有。荒野上既没有溪流，也没有小鱼。
        - id: ch05-b19
          speaker: stranger
          text: >-
            除了这些，你们真的什么都没看见？
        - id: ch05-b20
          speaker: demon_1
          text: >-
            什么也没有。森林边上只有一丛蔷薇，上面开着一朵花。
        - id: ch05-b21
          speaker: stranger
          text: >-
            蠢货！那就是他们！
          emotion: angry
        - id: ch05-b22
          speaker: narrator
          text: >-
            老人打开第七间厩舍，里面锁着法力最强的妖怪。他的吼声像雷一样响。
        - id: ch05-b23
          speaker: stranger
          text: >-
            不管他们变成什么，死的活的都给我带回来！我非抓住他们不可！见到蔷薇就连根拔起，一点也别留下。无论看到多古怪的东西，都不要放过！
          emotion: angry
        - id: ch05-b24
          speaker: narrator
          text: >-
            这时，逃亡的两人正在树林阴影下休息，吃喝一点东西恢复体力。姑娘忽然抬起头。
        - id: ch05-b25
          speaker: girl
          text: >-
            不好了，红球简直要从我怀里跳出来！一定又有人来追，而且已经非常近了，只是树木挡住了他们。
          emotion: fearful
        - id: ch05-b26
          speaker: narrator
          text: >-
            她取出红球，念动咒语。
        - id: ch05-b27
          speaker: girl
          text: |-
            红球红球，听我号令，
            快把我变作一阵微风，
            把我的爱人变作小虫。
        - id: ch05-b28
          speaker: narrator
          text: >-
            一瞬间，姑娘消散在薄薄的空气里，王子则成了一只四处疾飞的小虫。紧接着，一群妖怪冲了过来。它们知道该留心所有古怪的东西，便在四周到处搜寻。可这里既没有蔷薇丛，也没有任何别的异样。它们才转身准备空手回去，王子和姑娘便重新站在地上。
        - id: ch05-b29
          speaker: girl
          text: >-
            我们得拼尽全力赶路，不能等老人亲自追来。他不管看见我们变成什么，都认得出来。
        - id: ch05-b30
          speaker: narrator
          text: >-
            两人一路奔跑，来到森林里一片黑得伸手不见五指的地方。要不是红球照着，他们连一步也走不了。最后，两人精疲力竭，喘着粗气来到一块巨石前，红球又焦躁地动起来。姑娘看见了，立刻高声念道。
        - id: ch05-b31
          speaker: girl
          text: |-
            红球红球，听我号令，
            快把巨石滚到一旁，
            让我们找到出去的门。
        - id: ch05-b32
          speaker: narrator
          text: >-
            巨石顷刻滚开。他们穿过门，终于回到了地上的世界。

    - id: ch06
      title: 回到金国
      blocks:
        - id: ch06-b01
          speaker: girl
          text: >-
            我们安全了！老巫师到了这里就不能再支配我们，他的魔法也伤不了我们。可是，我的朋友，现在必须分开。你回去找父母，我也该去寻找自己的父母。
          emotion: happy
        - id: ch06-b02
          speaker: prince
          text: >-
            不！我绝不和你分开。跟我走，做我的妻子吧。我们一起熬过了这么多苦难，以后的快乐也该一起分享。
        - id: ch06-b03
          speaker: narrator
          text: >-
            姑娘推辞了很久，最后还是答应跟他走。两人在森林里碰见一个樵夫，便向他打听这些年发生的事。
        - id: ch06-b04
          speaker: woodcutter
          text: >-
            自从王子失踪，宫里和全国一直都很悲伤。过去这么多年，大家四处寻找，可谁也没有找到他的一点踪迹，他也始终没有回来。
        - id: ch06-b05
          speaker: narrator
          text: >-
            姑娘借助红球的魔法，让王子重新穿上失踪那天穿过的那身衣服，好叫父亲见面时更快认出他。她自己没有跟进王宫，而是留在一间农舍里，想让久别的父子先单独相见。
        - id: ch06-b06
          speaker: narrator
          text: >-
            可王子的父亲已经不在人世了。失去儿子的悲痛夺走了他的性命。临终前，国王向臣民说出真相，承认自己当年设下骗局，让老巫师把农夫的女儿当成王子带走。他知道，这场惩罚正是因此落到了自己头上。
        - id: ch06-b07
          speaker: narrator
          text: >-
            王子听到这个消息，忍不住放声痛哭，因为他一直深深爱着父亲。他整整三天不吃东西，也一口水都没有喝。

    - id: ch07
      title: 知恩图报的王子
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: >-
            到了第四天，王子以新国王的身份站到臣民面前。他召来大臣，把自己一路经历的所有奇事从头讲给他们听，也仔细说起姑娘怎样一次次保护他，终于带着他平安回来。
        - id: ch07-b02
          speakers: [councilor_1, councilor_2, councilor_3]
          ensemble: chorus
          text: >-
            请让她做您的妻子，也做我们的王后吧！
          emotion: happy
        - id: ch07-b03
          speaker: narrator
          text: >-
            故事到这里就结束了。
        - id: ch07-b04
          speaker: narrator
          text: >-
            这是一个爱沙尼亚童话。
