  chapters:
    - id: ch01
      title: The King's Promise
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, the king of Goldland lost his way in a forest. He tried every path he could find, but none led him out. At last, on a path that had seemed more hopeful than the others, he saw a man coming toward him.
        - id: ch01-b02
          speaker: wizard
          text: What brings you here, friend? Darkness is falling fast. Soon the wild beasts will leave their lairs to hunt for food.
        - id: ch01-b03
          speaker: king
          text: I have lost my way, and I am trying to get home.
        - id: ch01-b04
          speaker: wizard
          text: Promise me the first thing that comes out of your house, and I will lead you out.
        - id: ch01-b05
          speaker: narrator
          text: The king did not answer at once. He was certain the first thing from his house would be his finest sporting dog. That dog always rushed out to meet him when he came home. Why should he give away such a favorite? Besides, he told himself, he was a king and an experienced hunter. Surely he could find the way without owing anything to this stranger.
        - id: ch01-b06
          speaker: narrator
          text: The stranger left him. For three whole days, the king followed one path after another, but every path failed him. Just as despair began to overtake him, the stranger appeared again and blocked his way.
        - id: ch01-b07
          speaker: wizard
          text: Will you promise me the first thing that comes out of your house to meet you?
        - id: ch01-b08
          speaker: narrator
          text: The king remained stubborn and promised nothing. For several more days he wandered up and down through the forest, trying first one path and then another. None brought him any nearer to home. His food was gone, his strength was failing, and at last his courage failed too. He sank wearily beneath a tree, certain that his final hour had come. For the third time, the stranger stood before him.
        - id: ch01-b09
          speaker: wizard
          text: Why be such a fool? Is one dog worth dying for? Give me the reward I asked for, and I will guide you home.
        - id: ch01-b10
          speaker: king
          text: My life is worth more than a thousand dogs, and my kingdom depends on me. I accept. Now take me to my palace.
        - id: ch01-b11
          speaker: narrator
          text: The moment he spoke, the king found himself at the edge of the forest. His palace stood dimly in the distance. He hurried toward it. Just as he reached the great gates, the nurse came out carrying the royal baby. The child stretched his arms toward his father. The king recoiled and ordered the nurse to take him away.
        - id: ch01-b12
          speaker: narrator
          text: Then the king's great boarhound bounded up to welcome him, only to receive a violent shove. When the king's anger had passed and he could think clearly, he exchanged his beautiful baby boy for a peasant's daughter. The prince began a rough life as the child of poor people, while the little girl slept beneath silk sheets in a golden cradle.
        - id: ch01-b13
          speaker: narrator
          text: A year later, the stranger came to claim what he had been promised. He found the peasant girl in the palace and carried her away, believing she was the king's true child. The king was delighted that his trick had worked. He ordered a great feast and sent splendid gifts to the people raising his son. The prince would have good food, warm clothes, and everything else he needed. Even so, the king did not dare bring the child back to the palace. If the stranger returned or learned of the exchange, the whole trick might be discovered. The foster parents were quite content with the arrangement, for it gave them food and money in abundance.
        - id: ch01-b14
          speaker: narrator
          text: The boy grew tall and strong and seemed happy in his foster parents' house. Yet one thought poisoned much of his happiness. His foster father had secretly told him he was the king's son, and he could not forget the innocent girl who had suffered in his place.
        - id: ch01-b15
          speaker: narrator
          text: He decided that when he was old enough, he would travel the whole world and never rest until he had freed her. Becoming king at the cost of a maiden's life was too high a price.
    - id: ch02
      title: The Silent Underworld
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: One day, the prince dressed himself as a farm servant, put a sack of peas on his back, and walked straight into the forest where his father had been lost eighteen years before. After going some distance, he began to call out loudly.
        - id: ch02-b02
          speaker: prince
          text: What terrible luck! Where am I? Is there no one who can show me out of this forest?
        - id: ch02-b03
          speaker: narrator
          text: A strange man appeared. He had a long gray beard and a leather bag at his belt. He nodded cheerfully to the prince.
        - id: ch02-b04
          speaker: wizard
          text: I know this forest well. Promise me a good reward, and I can lead you out.
        - id: ch02-b05
          speaker: prince
          text: What can a beggar like me promise? I own nothing but my life. Even this coat belongs to the master who feeds and clothes me.
        - id: ch02-b06
          speaker: wizard
          text: You must own something. That sack you are carrying looks very heavy.
        - id: ch02-b07
          speaker: prince
          text: It is only peas. My old aunt died last night without enough money for the peas our people give to those who keep watch over the dead. I borrowed these from my master and tried to take a shortcut through the forest. Now, as you see, I am lost.
        - id: ch02-b08
          speaker: wizard
          text: So you are an orphan. Why not work for me? I need a sharp fellow in my house, and I like the look of you.
        - id: ch02-b09
          speaker: prince
          text: Why not, if we can agree on terms? I was born a peasant, and another man's bread is always bitter. One master is much like another to me. What wages will you pay?
        - id: ch02-b10
          speaker: wizard
          text: Fresh food every day, meat twice a week, butter and vegetables, clothes for summer and winter, and a piece of land for your own use.
        - id: ch02-b11
          speaker: prince
          text: That will satisfy me. Someone else can bury my aunt. I will go with you.
        - id: ch02-b12
          speaker: narrator
          text: The bargain pleased the old man so much that he spun like a top and sang until the whole forest rang with his voice. Then the two set off together. The wizard chattered without stopping, pleased with himself and his new servant. He never once looked behind them, so he did not notice that the prince was dropping peas from the sack, one after another, to mark their path. When night came, they lay down beneath a fig tree. At sunrise, they rose and continued on their way.
        - id: ch02-b13
          speaker: narrator
          text: Around noon they reached a great stone. The wizard looked carefully in every direction, whistled sharply, and stamped his left foot three times. A hidden door appeared beneath the stone, opening into what looked like the mouth of a cave. The wizard seized the prince's arm.
        - id: ch02-b14
          speaker: wizard
          text: Follow me.
        - id: ch02-b15
          speaker: narrator
          text: Thick darkness closed around them as the path sank deeper and deeper. After a long while, the prince saw a glimmer ahead. It came from neither sun nor moon, but from a pale cloud that gave this strange underworld all the light it had.
        - id: ch02-b16
          speaker: narrator
          text: Everything there was unlike the world above. The earth beneath his feet looked strange, and so did the water. The trees and plants grew in unfamiliar shapes, while birds and beasts unlike any he knew watched from the shadows. Most frightening of all was the perfect silence. Here and there, a bird perched with its head raised and its throat swelling as if it were singing, yet the prince heard no song. Dogs opened their mouths as though they meant to bark, and weary oxen seemed ready to bellow, but neither bark nor bellow reached him. Water flowed over the pebbles without a murmur. Wind bent the tops of the trees without a rustle. Flies and beetles darted past him without the faintest hum.
        - id: ch02-b17
          speaker: narrator
          text: The graybeard said nothing. When the prince tried to question him, his own voice died in his throat. No one could say how long that fearful silence lasted. The prince's heart seemed to turn to ice. His hair rose, and a cold shiver crept down his back. Then, at last, a faint noise reached his straining ears, and the shadowy world suddenly felt real. It sounded like a troop of horses forcing its way across open moorland.
        - id: ch02-b18
          speaker: wizard
          text: The kettle is boiling. They are expecting us at home.
        - id: ch02-b19
          speaker: narrator
          text: A little farther on, the prince heard what seemed to be dozens of saws grinding together in a mill.
        - id: ch02-b20
          speaker: wizard
          text: Grandmother is sleeping soundly. Hear how she snores.
        - id: ch02-b21
          speaker: narrator
          text: They climbed a hill, and the prince saw his master's house in the distance. So many buildings surrounded it that the place looked like a village, or even a small town. At the gate stood an empty kennel.
        - id: ch02-b22
          speaker: wizard
          text: Crawl inside and wait while I speak to my grandmother. Like most very old people, she is stubborn and cannot bear new faces.
        - id: ch02-b23
          speaker: narrator
          text: Trembling, the prince crept into the kennel. He was already beginning to regret the daring plan that had brought him there.
    - id: ch03
      title: The Maiden in the Wizard's House
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: After a while, the wizard returned and called him out. Something had soured the old man's temper. He frowned as he warned his new servant.
        - id: ch03-b02
          speaker: wizard
          text: Watch how we do things in this house, and make no mistakes, or you will suffer for them. Keep your eyes and ears open and your mouth shut. Obey without questions. Be grateful if you like, but speak only when someone speaks to you.
          emotion: angry
        - id: ch03-b03
          speaker: narrator
          text: As the prince crossed the threshold, he saw a wonderfully beautiful maiden with brown eyes and fair, curling hair. He thought that if the wizard had many daughters like her, he would gladly become the old man's son-in-law. She was exactly the kind of girl he admired.
        - id: ch03-b04
          speaker: narrator
          text: He watched her set the table, bring the food, and sit by the fire as though no stranger had entered. She took up a needle and began darning her stockings. The wizard ate alone. He invited neither servant to join him, and the old grandmother was nowhere to be seen. His appetite was enormous. He emptied every dish and ate enough for twelve men.
        - id: ch03-b05
          speaker: wizard
          text: Pick up the scraps now. You may have whatever remains in the iron pot for your dinner, but give the bones to the dog.
        - id: ch03-b06
          speaker: narrator
          text: The prince did not like the thought of dining on another man's scraps. Still, he helped the maiden gather everything from the table. Once they looked into the iron pot and divided what remained, he found there was plenty for both of them and that the food was very good. As they ate, he stole glance after glance at her. More than once he opened his mouth, hoping to say a few words. Each time, she looked at him so sternly that her eyes plainly ordered him to be silent. He could only let his own eyes answer. Besides, after his enormous meal, the wizard had stretched himself on a bench beside the oven. He was close enough to hear every whisper.
        - id: ch03-b07
          speaker: wizard
          text: You may rest for two days after your journey and look around the house. The day after tomorrow, come with me and I will show you your work. The maid will take you to your bed.
        - id: ch03-b08
          speaker: narrator
          text: The prince thought he now had permission to answer, but the wizard turned on him with a terrible face.
        - id: ch03-b09
          speaker: wizard
          text: You dog of a servant! Break the laws of this house, and you will soon be a head shorter. Hold your tongue and leave me in peace.
          emotion: angry
        - id: ch03-b10
          speaker: narrator
          text: The maiden motioned for the prince to follow. She opened a door and nodded for him to enter. He wanted to linger because she looked sad, but fear of the wizard drove him inside.
        - id: ch03-b11
          speaker: prince
          text: She cannot be his daughter. Her heart is too kind. I am sure she is the girl who was taken in my place, and I must risk my head to save her.
        - id: ch03-b12
          speaker: narrator
          text: He climbed into bed, but sleep would not come for a long time. He kept thinking about the sad maiden and the danger that waited in this silent house. Even when he finally slept, his dreams gave him no rest. In them, dangers closed around him from every side. Again and again he seemed certain to be lost, and each time it was the maiden and her strange power that helped him pass safely through.
        - id: ch03-b13
          speaker: narrator
          text: When he woke, his first thought was of the maiden. He found her already hard at work and began doing everything that came into his head to help her. He drew water from the well and carried it to the house. He gathered what she needed and kindled the fire beneath the iron pot. Since she still would not let him speak, he worked beside her in silence. That afternoon, he went outside to learn something about his strange new home. He walked among the many buildings and wondered more than ever why he never came across the wizard's grandmother.
        - id: ch03-b14
          speaker: narrator
          text: In the farmyard, he found a beautiful white horse alone in one stall. A black cow and two white-faced calves occupied another. Farther away, he could hear geese, ducks, and hens. The three meals were as tasty as before. He might have been content there, if keeping silent beside the maiden had not been so difficult.
        - id: ch03-b15
          speaker: narrator
          text: On the second evening, the prince went to receive his first orders.
        - id: ch03-b16
          speaker: wizard
          text: Tomorrow's task is very easy. Take this scythe, cut enough grass to feed the white horse all day, and clean its stall. If I return and find the manger empty, you will regret it. Remember that.
        - id: ch03-b17
          speaker: narrator
          text: The prince left rejoicing. Though he had never used a plow or scythe, he had often watched country people work and believed the job would be simple. Just as he reached his door, the maiden slipped quietly past him and whispered.
        - id: ch03-b18
          speaker: maiden
          text: What task did he give you?
        - id: ch03-b19
          speaker: prince
          text: Almost nothing. I only have to cut hay for the horse and clean its stall.
        - id: ch03-b20
          speaker: maiden
          text: Oh, you poor unlucky man! The white horse is our master's grandmother, and she is always hungry. Twenty men must mow all day to feed her, and twenty more must clean her stall. You cannot do it alone. Listen carefully, because this is your only chance.
        - id: ch03-b21
          speaker: maiden
          text: Fill the manger as full as it will hold. Then braid a strong rope from the rushes among the hay and cut a thick peg from sturdy wood. Make sure the horse sees you. When she asks what they are for, tell her you will tie her mouth shut so she cannot eat more, and peg her in one place so she cannot scatter her corn and water everywhere.
        - id: ch03-b22
          speaker: narrator
          text: The maiden slipped away as quietly as she had come.
    - id: ch04
      title: The Impossible Tasks
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Early next morning, the prince began to mow. The scythe moved through the grass more easily than he expected, and he soon filled the manger. But when he returned with another load, the manger was already empty.
        - id: ch04-b02
          speaker: narrator
          text: Now he knew the maiden's warning had saved him. He pulled rushes from the hay and quickly began to braid them.
        - id: ch04-b03
          speaker: white_horse
          text: My son, what are you making?
          emotion: surprised
        - id: ch04-b04
          speaker: prince
          text: Oh, nothing much. It is a strap for your chin. If you decide to eat any more, I will bind your jaws together.
        - id: ch04-b05
          speaker: narrator
          text: The white horse gave a deep sigh. She understood what the braided strap was meant to do and decided she had better be content with what she had already eaten. The prince then turned to the stall. He cleaned away everything the horse had scattered and put the place in perfect order. The horse knew she had finally met someone who could master her. By midday, fodder still lay in the manger, and the stall was as clean as a new pin. The prince had barely put down his tools when the wizard entered. The old man stopped in the doorway and stared in astonishment.
        - id: ch04-b06
          speaker: wizard
          text: Did you truly manage all this by yourself, or did someone give you a hint?
        - id: ch04-b07
          speaker: prince
          text: No one helped me. I had only my own poor, weak head.
        - id: ch04-b08
          speaker: narrator
          text: The wizard frowned and went away. The prince rejoiced that everything had ended so well. That evening, his master gave him another order.
        - id: ch04-b09
          speaker: wizard
          text: I have no special task for you tomorrow. The girl has too much housework, so milk the black cow for her. Be sure you milk her dry, or things may go badly for you.
        - id: ch04-b10
          speaker: narrator
          text: Unless there was some trick in it, the prince thought, the work sounded easy. He had never milked a cow, but his fingers were strong. Sleepily, he headed toward his room and met the maiden.
        - id: ch04-b11
          speaker: maiden
          text: What must you do tomorrow?
        - id: ch04-b12
          speaker: prince
          text: I am helping you. All I have to do is milk the black cow completely dry.
        - id: ch04-b13
          speaker: maiden
          text: Oh, what bad luck! You could work from morning until night and never do it. Take a pan of burning coals and a pair of tongs into the stall. Put the pan on the floor, lay the tongs in the fire, and blow until the coals glow brightly. When the cow asks what you mean to do, answer exactly as I tell you.
        - id: ch04-b14
          speaker: narrator
          text: She rose on tiptoe, whispered in his ear, and went away. Before dawn had fully reddened the sky, the prince jumped from bed. Carrying the coals in one hand and a milk pail in the other, he went straight to the cow's stall and followed her instructions.
        - id: ch04-b15
          speaker: narrator
          text: For some time, the black cow watched in surprise.
        - id: ch04-b16
          speaker: black_cow
          text: What are you doing there, sonny?
          emotion: surprised
        - id: ch04-b17
          speaker: prince
          text: Nothing much. I am heating these tongs in case you refuse to give all the milk I want.
        - id: ch04-b18
          speaker: narrator
          text: The cow sighed deeply. She watched the tongs heating among the bright coals and looked at her milkman with fear. The prince pretended not to notice. He set the pail beneath her and milked briskly, without stopping, until the cow had given every drop. At that very moment, the wizard entered the stable. He pushed the prince aside, took the pail, and sat down to test the cow for himself. He pulled and squeezed, but he could not get a single drop of milk.
        - id: ch04-b19
          speaker: wizard
          text: Did you really do this alone, or did somebody help you?
        - id: ch04-b20
          speaker: prince
          text: I have no helper but my own poor head.
        - id: ch04-b21
          speaker: narrator
          text: The wizard rose and walked away. That night he set the prince's next task.
        - id: ch04-b22
          speaker: wizard
          text: There is a little haystack in the meadow that must be brought under cover. Tomorrow, move every bit of it into the shed. If you value your life, do not leave behind a single strand.
        - id: ch04-b23
          speaker: narrator
          text: The prince was overjoyed. Carrying one little stack could not require much skill, and the horse would pull it. He certainly did not intend to spare the old grandmother. Soon the maiden stole up to him.
        - id: ch04-b24
          speaker: maiden
          text: What is tomorrow's task?
        - id: ch04-b25
          speaker: prince
          text: It seems I must learn every kind of farm work. Tomorrow I move one haystack and leave no stalk in the meadow. That is the whole day's work.
        - id: ch04-b26
          speaker: maiden
          text: Oh, you unlucky creature! Every time you throw hay from the top, it takes root again underneath. Even every man in the world could not clear that little stack in a week. At daybreak, take out the white horse and some strong ropes. Fasten the ropes around the haystack and harness the horse to them. Climb onto the stack, then begin counting.
        - id: ch04-b27
          speaker: maiden
          text: The horse will ask what you are counting. Be certain you give her the answer I am about to whisper.
        - id: ch04-b28
          speaker: narrator
          text: She whispered the answer in his ear and left. With nothing else to do, the prince went to bed.
        - id: ch04-b29
          speaker: narrator
          text: He slept soundly and rose while it was still nearly dark. First he searched out the strongest ropes he could find. Then he led the white horse from her stall and rode across the meadow to the haystack. The wizard had called it little, but it held fifty full cartloads and rose high above the prince. He wrapped the ropes all the way around it, fastened them firmly, and harnessed the horse to the ends. When everything was ready, he climbed to the top of the stack and began counting aloud. He counted slowly from one all the way to twenty. At last, the horse called up in amazement.
        - id: ch04-b30
          speaker: white_horse
          text: What are you counting up there, my son?
          emotion: surprised
        - id: ch04-b31
          speaker: prince
          text: Oh, nothing. I am amusing myself by counting the packs of wolves in the forest. There are so many that I may never finish.
        - id: ch04-b32
          speaker: narrator
          text: The word wolves had scarcely left his mouth when the white horse flew off like the wind. In the blink of an eye, she reached the shed with the entire haystack dragging behind. After breakfast, the wizard came in and stared, speechless, at the finished work.
        - id: ch04-b33
          speaker: wizard
          text: Were you truly clever enough to do this, or did someone advise you?
        - id: ch04-b34
          speaker: prince
          text: I have no one to consult but myself.
        - id: ch04-b35
          speaker: narrator
          text: The wizard went away, shaking his head.
    - id: ch05
      title: The Wizard Learns the Truth
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Late that evening, the prince came for his next order.
        - id: ch05-b02
          speaker: wizard
          text: Tomorrow, take the white-headed calf to the meadow. Guard it with your life, and do not let it escape.
        - id: ch05-b03
          speaker: narrator
          text: The prince said nothing. Most peasant boys of nineteen watched entire herds, he thought, so surely he could manage one calf. As he approached his room, the maiden met him.
        - id: ch05-b04
          speaker: prince
          text: Tomorrow I have an idiot's task. I only need to take the white-headed calf to the meadow.
        - id: ch05-b05
          speaker: maiden
          text: Oh, you unlucky man! That calf can run around the whole world three times in a single day. Tie one end of this silk thread to its left front leg and the other to the little toe of your left foot. Then it cannot leave your side, whether you walk, stand, or lie down.
        - id: ch05-b06
          speaker: narrator
          text: The prince went to bed and slept soundly. Next morning, he followed the maiden's instructions. He led the calf to the meadow on the silk thread, and it stayed beside him like a faithful dog. By sunset, it was safely back in its stall. The wizard arrived with a frown.
        - id: ch05-b07
          speaker: wizard
          text: Did you think of this yourself, or did somebody tell you what to do?
        - id: ch05-b08
          speaker: prince
          text: I had only my own poor head to help me.
        - id: ch05-b09
          speaker: narrator
          text: The wizard went away growling.
        - id: ch05-b10
          speaker: wizard
          text: I do not believe one word. You have found a clever friend. I am certain of it.
          emotion: angry
        - id: ch05-b11
          speaker: narrator
          text: That evening, he called the prince again.
        - id: ch05-b12
          speaker: wizard
          text: There is no work for you tomorrow. When I wake, come to my bedside and offer me your hand in greeting.
        - id: ch05-b13
          speaker: narrator
          text: The strange request amused the prince. He went laughing to find the maiden.
        - id: ch05-b14
          speaker: maiden
          text: This is no matter for laughter. He intends to eat you. There is only one way I can save you. Heat an iron shovel until it is red hot, and offer that instead of your hand.
        - id: ch05-b15
          speaker: narrator
          text: The prince woke very early and heated the shovel before the wizard stirred. At last, the old man called from his bed.
        - id: ch05-b16
          speaker: wizard
          text: Lazy fellow! Where are you? Come wish me good morning.
        - id: ch05-b17
          speaker: narrator
          text: The prince entered holding the red-hot shovel. The wizard took one look at it.
        - id: ch05-b18
          speaker: wizard
          text: I am very ill today, too weak even to touch your hand. Come back this evening. Perhaps I will feel better then.
        - id: ch05-b19
          speaker: narrator
          text: The prince wandered about all day. That evening he returned to the wizard's room and received the friendliest welcome.
        - id: ch05-b20
          speaker: wizard
          text: I am very pleased with you. At dawn, come here and bring the maiden. I know you have loved each other for a long time, and I mean to make you husband and wife.
        - id: ch05-b21
          speaker: narrator
          text: The prince nearly leaped for joy, but he remembered the house rules and kept still. When he told the maiden, she turned as white as a sheet and could not speak. At last, she found her voice.
        - id: ch05-b22
          speaker: maiden
          text: The old man has discovered who advised you. He means to destroy us both. We must escape or we are lost. Take an ax and cut off the calf's head with one stroke. Split the head with a second stroke. Inside its brain you will find a bright red ball. Bring it to me while I prepare everything here.
          emotion: fearful
        - id: ch05-b23
          speaker: narrator
          text: Better to kill the calf than let both of them die, the prince thought. If they escaped, the peas he had scattered should have sprouted and would guide them home.
        - id: ch05-b24
          speaker: narrator
          text: He entered the stall carrying the ax. With the first blow he killed the calf, and with the second he split its head apart. A bright red ball fell from its brain. The instant it appeared, its glow filled the whole stall with light. The prince snatched it up, wrapped it again and again in thick cloth to hide the brightness, and tucked it safely against his chest. All the while, the black cow remained asleep. That was a great mercy, for if she had seen what happened, her cries would surely have awakened the wizard.
        - id: ch05-b25
          speaker: narrator
          text: The maiden stood in the doorway with a small bundle in her arms.
        - id: ch05-b26
          speaker: maiden
          text: Where is the ball?
        - id: ch05-b27
          speaker: prince
          text: Here it is.
        - id: ch05-b28
          speaker: maiden
          text: We cannot waste a moment. We must go now.
        - id: ch05-b29
          speaker: narrator
          text: She uncovered a tiny part of the shining ball to light their path. Just as the prince had hoped, the peas had rooted and grown into a little hedge. They could not lose the way.
        - id: ch05-b30
          speaker: narrator
          text: As they fled, the maiden told him what she had learned in the wizard's house. She had overheard the old man speaking with his grandmother and discovered that she was a king's daughter. Long ago, the wizard had used a trick to get her from her parents and carry her into his underground country. The prince already knew how that trick had worked and why she had been taken, but he kept the truth to himself. In his heart, he was deeply glad that the task of setting her free had fallen to him. Side by side, they followed the living trail of peas until the darkness thinned and the day began to dawn.
    - id: ch06
      title: The Three Pursuits
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: The wizard slept very late that morning. When he had rubbed the sleep from his eyes, he remembered that the young couple should soon appear before him. He waited a long while, then grinned to himself.
        - id: ch06-b02
          speaker: wizard
          text: Well, they seem in no hurry to be married.
        - id: ch06-b03
          speaker: narrator
          text: He waited again. At last, uneasiness crept over him, and he shouted through the house.
        - id: ch06-b04
          speaker: wizard
          text: Man and maid! Where are you?
        - id: ch06-b05
          speaker: narrator
          text: He called again and again, louder each time. No man or maid appeared. Now truly alarmed, he jumped angrily from bed and began searching for the two culprits. Every room in the house was empty. When he reached their beds, he saw at once that neither had been slept in. He rushed from the house and went straight to the stable. The dead calf lay where the prince had left it, and one look told the wizard everything. Swearing loudly, he flung open the door of the third stall and summoned the goblin servants imprisoned inside.
        - id: ch06-b06
          speaker: wizard
          text: Chase those runaways! Find them wherever they are and bring them back to me. I must have them.
          emotion: angry
        - id: ch06-b07
          speaker: narrator
          text: The goblins flew away like the wind. Far ahead, the fugitives were crossing a great plain when the maiden suddenly stopped.
        - id: ch06-b08
          speaker: maiden
          text: Something has happened. The ball is moving in my hand. I am sure someone is following us.
        - id: ch06-b09
          speaker: narrator
          text: Behind them, a black cloud raced before the wind. The maiden turned the ball three times in her hand and called to it.
        - id: ch06-b10
          speaker: maiden
          text: Listen to me, my ball, my ball. Be quick and change me into a brook, and my lover into a little fish.
        - id: ch06-b11
          speaker: narrator
          text: In an instant, a brook flowed across the plain with a fish swimming in its water. The goblins arrived moments later. They saw no one, waited briefly, and hurried home without disturbing the brook or the fish. Once they were out of sight, the two fugitives returned to their own shapes and continued their journey.
        - id: ch06-b12
          speaker: narrator
          text: The goblins came back weary and empty-handed. Their master demanded to know what they had seen and whether anything strange had happened.
        - id: ch06-b13
          speakers: [goblin_1, goblin_2, goblin_3]
          ensemble: chorus
          text: Nothing happened. The plain was empty except for a brook with a fish swimming in it.
        - id: ch06-b14
          speaker: wizard
          text: Idiots! The brook and the fish were the very people you were chasing.
          emotion: angry
        - id: ch06-b15
          speaker: narrator
          text: He tore open the fifth stall and ordered the goblins inside to drink the brook dry and catch the fish. They sprang up and flew off like the wind.
        - id: ch06-b16
          speaker: narrator
          text: The young pair had almost reached the edge of the woods when the maiden stopped again.
        - id: ch06-b17
          speaker: maiden
          text: Something has happened. The ball is moving again.
        - id: ch06-b18
          speaker: narrator
          text: She looked back and saw another cloud racing toward them. It was larger and blacker than the first, with red streaks running through it.
        - id: ch06-b19
          speaker: maiden
          text: Those are our pursuers. Listen to me, my ball, my ball. Be quick and change us both. Make me a wild rosebush, and make him a rose upon my stem.
        - id: ch06-b20
          speaker: narrator
          text: The change happened in the blink of an eye, and only just in time. The goblins rushed up and searched eagerly in every direction. They expected to find a stream and a fish, but there was no water anywhere and no fish to catch. The only thing near the forest's edge was a wild rosebush with one rose upon its stem. Seeing nothing they had been ordered to seize, the goblins turned sorrowfully toward home. Once they were well out of sight, the rosebush became the maiden and the rose became the prince. The disguise had given them a little rest, and now they walked faster than before.
        - id: ch06-b21
          speaker: narrator
          text: Back at the house, the wizard questioned the returning goblins.
        - id: ch06-b22
          speaker: wizard
          text: Well? Did you find them?
        - id: ch06-b23
          speaker: goblin_1
          text: No. We found neither a brook nor a fish in the wilderness.
        - id: ch06-b24
          speaker: wizard
          text: Did you see nothing else at all?
        - id: ch06-b25
          speaker: goblin_1
          text: Only a rosebush at the forest's edge, with one rose hanging from it.
        - id: ch06-b26
          speaker: wizard
          text: Idiots! That was them.
          emotion: angry
        - id: ch06-b27
          speaker: narrator
          text: The wizard threw open the seventh stall, where his mightiest goblins were locked away.
        - id: ch06-b28
          speaker: wizard
          text: Bring them to me, dead or alive. I will have them! Tear up the rosebush, roots and all. Whatever strange thing you find, leave nothing behind.
          emotion: angry
        - id: ch06-b29
          speaker: narrator
          text: Meanwhile, the fugitives rested in the shade of a wood and refreshed themselves with food and drink. Suddenly, the maiden looked up.
        - id: ch06-b30
          speaker: maiden
          text: Something has happened. The ball nearly jumped out of my clothes. Someone is following us, and the danger is close, but the trees hide our enemies.
          emotion: fearful
        - id: ch06-b31
          speaker: narrator
          text: She took the ball in her hand and spoke once more.
        - id: ch06-b32
          speaker: maiden
          text: Listen to me, my ball, my ball. Be quick and change me into a breeze, and make my lover into a midge.
        - id: ch06-b33
          speaker: narrator
          text: At once, the maiden dissolved into thin air and moved through the wood as a breeze. The prince became a tiny midge and darted about where she had stood. A moment later, a crowd of the wizard's mightiest goblins burst into the clearing. They had been warned about the rosebush, so they searched the ground, the trees, and the shadows for anything strange. There was no rosebush to uproot and nothing else they knew how to seize. They had barely turned their backs to go home empty-handed when the breeze and the midge vanished, and the prince and maiden stood on the earth again.
        - id: ch06-b34
          speaker: maiden
          text: We must hurry before the old man comes after us himself. He will recognize us in any disguise.
        - id: ch06-b35
          speaker: narrator
          text: They ran until the forest grew so dark that only the ball's light showed them the way. Worn out and breathless, they finally reached a great stone. The ball began moving restlessly, and the maiden understood.
        - id: ch06-b36
          speaker: maiden
          text: Listen to me, my ball, my ball. Quickly roll the stone aside, so we may find the door.
        - id: ch06-b37
          speaker: narrator
          text: The stone rolled away at once. They passed through the doorway and returned to the world above.
    - id: ch07
      title: The Prince Comes Home
      blocks:
        - id: ch07-b01
          speaker: maiden
          text: We are safe now. The old wizard has no power here, and we can protect ourselves from his spells. But, my friend, we must part. You will return to your parents, and I must search for mine.
        - id: ch07-b02
          speaker: prince
          text: No, no! I will never leave you. Come with me and be my wife. We have shared so much trouble. Now we will share our happiness.
        - id: ch07-b03
          speaker: narrator
          text: For some time, the maiden resisted. At last, she agreed to go with him.
        - id: ch07-b04
          speaker: narrator
          text: In the forest, they met a woodcutter who brought them news from Goldland. He said there had been deep sorrow at the palace and throughout the kingdom when the prince disappeared. Searchers had found no trace of him, though many years had now passed. The maiden used the magic ball to dress the prince in the very clothes he had worn on the day he vanished. She hoped his father would recognize him at once when he entered the palace. The maiden herself stayed behind in a peasant's hut. She wanted the long-awaited meeting between father and son to happen with no stranger present.
        - id: ch07-b05
          speaker: narrator
          text: But there could be no meeting. The prince's father was no longer alive. Grief over his lost son had worn him down and finally killed him. Before his death, the king had confessed everything to his people. He told them how he had exchanged the royal baby for a peasant's daughter and tricked the old wizard into carrying away the innocent girl. As he lay dying, he declared that the later loss of his own son was the punishment that had fallen on him for that deceit.
        - id: ch07-b06
          speaker: narrator
          text: When the prince heard the news, he wept bitterly, for he had dearly loved his father. For three days, he would neither eat nor drink.
        - id: ch07-b07
          speaker: narrator
          text: On the fourth day, the prince ended his mourning fast and stood before the people as their new king. He called all his councillors into his presence. Then he told them the whole strange history, from the secret of his childhood to his journey into the forest and his years in the wizard's service. He described the impossible tasks, their flight with the red ball, and the goblins who had chased them. Above all, he told them how the maiden's wisdom and courage had carried him safely through every danger and brought him home alive.
        - id: ch07-b08
          speakers: [councillor_1, councillor_2, councillor_3]
          ensemble: chorus
          text: Let her be your wife and our queen.
        - id: ch07-b09
          speaker: narrator
          text: And that is the end of the story.
