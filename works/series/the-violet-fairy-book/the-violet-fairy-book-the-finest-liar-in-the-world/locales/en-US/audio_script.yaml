  chapters:
    - id: ch01
      title: Four Beardless Millers
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: At the edge of a wood lived an old man with his only son. One day, the old man called the boy over. He had corn that needed grinding, but he gave his son one strict warning.
        - id: ch01-b02
          speaker: father
          text: Take this corn to a mill, but listen carefully. Never go into a mill if the miller has no beard.
        - id: ch01-b03
          speaker: narrator
          text: The boy set off with the corn. He had not gone far when he came to a large mill. A beardless man stood in the doorway.
        - id: ch01-b04
          speaker: boy
          text: Good day to you, beardless man!
        - id: ch01-b05
          speaker: beardless_man
          text: And a good day to you, sonny.
        - id: ch01-b06
          speaker: boy
          text: May I grind some corn here?
        - id: ch01-b07
          speaker: beardless_man
          text: Of course. Let me finish my work, and then you may grind as much as you please.
        - id: ch01-b08
          speaker: narrator
          text: Just then, the boy remembered his father's warning. He said goodbye and followed the river toward another mill. He did not know that the beardless man had snatched up a sack of corn and hurried there by a different road.
        - id: ch01-b09
          speaker: narrator
          text: When the boy reached the second mill, another beardless man seemed to be waiting for him. The boy walked straight on. But once again, it was the same man, and once again he raced ahead by another road. The boy found him at the third mill, and then at a fourth.
        - id: ch01-b10
          speaker: narrator
          text: By now the boy was cross. He stopped and spoke to himself.
        - id: ch01-b11
          speaker: boy
          text: There is no point in walking any farther. Every mill seems to have a beardless man in it. I might as well grind my corn here.
        - id: ch01-b12
          speaker: narrator
          text: He lowered the sack from his back and went inside.
    - id: ch02
      title: The Cake and the Contest
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The beardless man finished grinding his own corn. The boy had just begun his work when the man made a suggestion.
        - id: ch02-b02
          speaker: beardless_man
          text: Sonny, why don't we make a cake with the flour you have there?
        - id: ch02-b03
          speaker: narrator
          text: The boy felt uneasy when he thought of his father's warning. Still, he had already entered the mill, and there was no undoing that.
        - id: ch02-b04
          speaker: boy
          text: All right. Let us make one.
        - id: ch02-b05
          speaker: narrator
          text: The beardless man poured the flour into a tub and made a hollow in the middle. He sent the boy to the river to carry back water in his cupped hands. They mixed the dough, laid the great cake on the fire, and buried it under hot ashes until it was baked through.
        - id: ch02-b06
          speaker: narrator
          text: The cake was far too big for a cupboard, so they propped it against the wall. Then the beardless man turned to the boy.
        - id: ch02-b07
          speaker: beardless_man
          text: Look here, sonny. If we divide this cake, neither of us will get enough. Let us each tell a lie. Whoever tells the biggest and best lie wins the whole cake.
        - id: ch02-b08
          speaker: narrator
          text: The boy could see no other way out.
        - id: ch02-b09
          speaker: boy
          text: Very well. You go first.
        - id: ch02-b10
          speaker: narrator
          text: So the beardless man lied with all his might. He invented one tale after another until at last he ran out of lies. Then the boy looked at him.
        - id: ch02-b11
          speaker: boy
          text: My good fellow, if that is your best, it is not much. Now listen, and I will tell you a true story.
    - id: ch03
      title: The Bee Across the Sea
      blocks:
        - id: ch03-b01
          speaker: boy
          text: When I was young and already an old man, we owned a great many beehives. Each morning I counted them. Counting the bees was easy, but somehow I could never count the hives properly.
        - id: ch03-b02
          speaker: boy
          text: One morning, I discovered that my finest bee was missing. I wasted no time. I saddled a cock and rode off to find him. His trail led me to the shore. He had crossed the sea, so I crossed after him.
        - id: ch03-b03
          speaker: boy
          text: On the far side, I found a farmer who had harnessed my bee to a plough and was using him to sow millet.
        - id: ch03-b04
          speaker: boy
          text: That bee belongs to me! Where did you get him?
        - id: ch03-b05
          speaker: farmer
          text: Brother, if he is yours, you may take him.
        - id: ch03-b06
          speaker: boy
          text: The farmer gave back my bee. Since he had used him, he also gave me a sack of millet seed. I slung the sack over my shoulders, took the saddle off the cock, and strapped it onto the bee. Then I mounted the bee and led the cock by a string so the poor bird could rest.
        - id: ch03-b07
          speaker: boy
          text: We were flying home across the sea when one of the cords around my sack snapped. The millet plunged straight into the ocean. It was gone, and there was nothing I could do.
        - id: ch03-b08
          speaker: boy
          text: Night had fallen by the time we reached land. I climbed down from my bee and let him find his supper. I gave the cock some hay, and then I went to sleep.
        - id: ch03-b09
          speaker: boy
          text: At sunrise, what a sight met my eyes! Wolves had come in the night and eaten my bee. Honey lay ankle-deep in the valley and knee-deep over the hills. I began wondering how I could gather enough to carry home.
        - id: ch03-b10
          speaker: boy
          text: I happened to have a small hatchet, so I took it into the forest. I hoped to kill some animal and make a bag from its skin. There I saw two roe deer, both hopping on one foot. I killed the pair with a single blow and made three bags from their hides.
        - id: ch03-b11
          speaker: boy
          text: I filled all three bags with honey and loaded them onto the cock. At last I reached home, only to hear that my father had just been born. I had to hurry away and fetch holy water to sprinkle over him.
    - id: ch04
      title: The Lost Millet Cake
      blocks:
        - id: ch04-b01
          speaker: boy
          text: As I went, I kept thinking about the millet that had fallen into the sea. Was there any way to get it back? When I reached the place where the holy water was kept, I saw that the seed had landed on rich soil. It was growing right before my eyes.
        - id: ch04-b02
          speaker: boy
          text: That was not all. An invisible hand cut the millet and baked it into a cake. I took the cake along with the holy water and started flying home across the sea.
        - id: ch04-b03
          speaker: boy
          text: Then a great rain poured down. The sea rose and washed away my millet cake. I was terribly annoyed when I reached dry land without it.
        - id: ch04-b04
          speaker: boy
          text: Suddenly I remembered how long my hair was. When I stood up, it touched the ground. When I sat down, it reached only to my ears. I cut off a thick lock with my knife and braided it. When night came, I knotted the braid into a pillow.
        - id: ch04-b05
          speaker: boy
          text: But how could I make a fire? I had a tinderbox, but no wood. Then I remembered the needle stuck in my clothes. I pulled it out, split it into pieces, and set them alight. I lay beside the fire and fell asleep.
        - id: ch04-b06
          speaker: boy
          text: Bad luck still followed me. A spark landed on my hair pillow and burned it up in an instant. I threw myself onto the ground in despair, and at once I sank to my waist.
        - id: ch04-b07
          speaker: boy
          text: I struggled to pull free, but that only made me sink deeper. So I ran to the house, fetched a spade, dug myself out, and carried the holy water home.
    - id: ch05
      title: The Head in the Well
      blocks:
        - id: ch05-b01
          speaker: boy
          text: Along the way, I saw reapers working in fields of ripe grain. The air suddenly grew so hot that every one of them fainted.
        - id: ch05-b02
          speaker: boy
          text: Why don't you bring out our mare? She is as tall as two days and as broad as half a day. You can work in her shade.
        - id: ch05-b03
          speaker: boy
          text: My father heard me and quickly jumped onto the mare. With that great shadow over them, the reapers went eagerly back to work. I grabbed a wooden pail and hurried off to bring them water.
        - id: ch05-b04
          speaker: boy
          text: When I reached the well, I found it frozen solid. To break the ice, I had to take off my head and strike the ice with it. Then I drew the water and carried it toward the fields.
        - id: ch05-b05
          speakers: [reaper_1, reaper_2, reaper_3]
          ensemble: chorus
          text: What happened to your head?
          emotion: surprised
        - id: ch05-b06
          speaker: boy
          text: I raised my hand and discovered that they were right. I had no head. I must have left it at the well, so I ran back to look for it.
        - id: ch05-b07
          speaker: boy
          text: While I was away, a passing fox had pulled my head from the water and begun tearing at my brains. I crept up behind him and kicked him so hard that he screamed and dropped a piece of parchment.
        - id: ch05-b08
          speaker: boy
          text: The parchment said, “The cake belongs to me, and the beardless man gets nothing.”
        - id: ch05-b09
          speaker: narrator
          text: With that, the boy stood up, took the whole cake, and went home. The beardless man stayed behind and swallowed his disappointment.
