audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 编者
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清晰的成年男声
        pace: 从容舒展
        pitch: 中低音
    boy:
      display_name: 男孩
      tts:
        delivery: 机灵大胆，越讲越神气
        timbre: 清亮自然的少年声
        pace: 明快
        pitch: 中高音
    beardless_man:
      display_name: 没胡子的男人
      tts:
        delivery: 圆滑自信，口气亲昵
        timbre: 略显粗厚的成年男声
        pace: 适中
        pitch: 中音
    ploughman:
      display_name: 耕地的人
      tts:
        delivery: 爽快随和
        timbre: 朴实清晰的成年男声
        pace: 适中
        pitch: 中音
    reaper_1:
      display_name: 收割人甲
      tts:
        delivery: 吃惊而直率
        timbre: 响亮的成年男声
        pace: 稍快
        pitch: 中音
    reaper_2:
      display_name: 收割人乙
      tts:
        delivery: 吃惊而直率
        timbre: 清脆的年轻男声
        pace: 稍快
        pitch: 中高音
    reaper_3:
      display_name: 收割人丙
      tts:
        delivery: 吃惊而直率
        timbre: 低厚的成年男声
        pace: 稍快
        pitch: 中低音
  chapters:
    - id: ch01
      title: 没胡子的磨坊主
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            森林边上住着一位老人，只有一个儿子。有一天，他要儿子去磨谷子，临走再三叮嘱，千万别进主人没有胡子的磨坊。
        - id: ch01-b02
          speaker: narrator
          text: >-
            男孩背着谷子上路。走了没多远，他就看见一座大磨坊，门口偏偏站着一个没胡子的男人。
        - id: ch01-b03
          speaker: boy
          text: >-
            没胡子的，您好啊！
        - id: ch01-b04
          speaker: beardless_man
          text: >-
            你好，小伙子。
        - id: ch01-b05
          speaker: boy
          text: >-
            我能在这里磨点谷子吗？
        - id: ch01-b06
          speaker: beardless_man
          text: >-
            当然。等我忙完，你爱磨多久就磨多久。
        - id: ch01-b07
          speaker: narrator
          text: >-
            男孩忽然记起父亲的话，赶紧告辞，沿河去找下一座磨坊。可他刚转过身，那人就抄起一袋谷子，从另一条路赶往同一座磨坊，抢到了前面。男孩来到第二座磨坊，又看见一个没胡子的坐在那里。他没停，接着走到第三座，可那人换了条路，还是先到了。第四回依旧如此，男孩终于恼了。
        - id: ch01-b08
          speaker: boy
          text: >-
            走下去也白费力气，怎么每座磨坊都有个没胡子的！我就在这儿磨吧。
        - id: ch01-b09
          speaker: narrator
          text: >-
            他卸下口袋。没胡子的男人磨完自己的谷子，瞧着男孩开了工，便凑过来提议。
        - id: ch01-b10
          speaker: beardless_man
          text: >-
            小伙子，咱们用你的谷子做一张饼，怎么样？
        - id: ch01-b11
          speaker: narrator
          text: >-
            男孩心里不大踏实，可事情已经到了这一步，再后悔也晚了。
        - id: ch01-b12
          speaker: boy
          text: >-
            好，那就做吧。

    - id: ch02
      title: 谁的谎话最大
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            男人把面粉倒进木盆，在中间挖个坑，叫男孩一次次用双手从河里捧水回来和面。饼坯做好以后，两人把它放在火上，盖满滚烫的灰，一直烤到里外熟透。那饼实在太大，柜子里根本放不下，只能靠墙立着。
        - id: ch02-b02
          speaker: beardless_man
          text: >-
            这么大的饼，分开以后咱们两个还是吃不饱。咱们比比谁的谎话最大、说得最妙。谁赢，整张饼就归谁。
        - id: ch02-b03
          speaker: boy
          text: >-
            那就请你先说吧。
        - id: ch02-b04
          speaker: narrator
          text: >-
            没胡子的男人使足了劲，一个谎接一个谎，直到再也编不出来。男孩听完，满不在乎地开了口。
        - id: ch02-b05
          speaker: boy
          text: >-
            老兄，你只有这点本事吗？那可差得远了。听好了，我给你讲一件千真万确的事。
        - id: ch02-b06
          speaker: boy
          text: >-
            我年轻的时候，已经是个老头了。那时家里有许多蜂窝。我每天早晨一起床，都要把它们数上一遍。蜜蜂有多少只，很容易数清，蜂窝有多少个，我却怎么也数不明白。有一回，我数着数着，发现最好的那只蜜蜂丢了。我片刻也没耽搁，立刻给公鸡备上鞍，骑着它去追。
        - id: ch02-b07
          speaker: boy
          text: >-
            我顺着踪迹一直追到海边，看出蜜蜂已经渡过大海，自己也非跟过去不可。到了对岸，我一眼就瞧见，有个人把我的蜜蜂套在犁上，正借它的力气耕地播小米。
        - id: ch02-b08
          speaker: boy
          text: >-
            喂，那是我的蜜蜂！你从哪儿弄来的？
        - id: ch02-b09
          speaker: ploughman
          text: >-
            兄弟，既然蜜蜂是你的，你就牵回去吧。
        - id: ch02-b10
          speaker: boy
          text: >-
            他用过我的蜜蜂，不光把它还给我，还赔了一袋小米种。我把口袋扛到肩上，再把鞍从公鸡背上卸下来，安到蜜蜂背上。然后我骑着蜜蜂，用绳子牵着公鸡，让它一路跟在后面，好好歇一歇。

    - id: ch03
      title: 蜂蜜与小米饼
      blocks:
        - id: ch03-b01
          speaker: boy
          text: >-
            我们飞过大海时，捆口袋的一根绳子忽然断成两截，整袋小米种直落进海里，再也捞不回来。我只好不再想它。等我们平安上岸，天已经黑了。我从蜜蜂背上下来，放它自己去吃晚饭，又给公鸡喂了些干草，自己才睡下。
        - id: ch03-b02
          speaker: boy
          text: >-
            第二天太阳一升，我睁眼一看，眼前真是好一番景象！夜里来了狼，把我的蜜蜂吃掉了。蜂蜜流得满地都是，山谷里没到脚踝，山坡上竟没到膝盖。我站在那里琢磨，该用什么办法收起一些，带回家去。
        - id: ch03-b03
          speaker: boy
          text: >-
            我正好带着一把小斧头，便进森林找野兽，想杀一只，用兽皮做口袋。迎面来了两只狍子，共用一条腿蹦跳。我只砍一斧，就把它们一同放倒，还用两张皮做成三只口袋。三个口袋都装满蜂蜜，全驮在公鸡背上，我这才回到家。
        - id: ch03-b04
          speaker: boy
          text: >-
            家里人告诉我，父亲刚刚出生，要我马上去取圣水洒在他身上。我边走边想，怎样才能找回海里的小米。等我到了圣水所在的地方，原来种子落在沃土上，正在我眼前生长。不光如此，还有一只看不见的手，把成熟的小米割下来，做成了一张饼。
        - id: ch03-b05
          speaker: boy
          text: >-
            我把小米饼和圣水都带上，再次飞过大海。谁知半路下起倾盆大雨，海水越涨越高，一下冲走了小米饼。等我重新平安落到地上，想起丢掉的那张饼，心里真是懊恼极了。

    - id: ch04
      title: 羊皮纸上的判词
      blocks:
        - id: ch04-b01
          speaker: boy
          text: >-
            这时我想起，自己的头发长得很。站起来能拖到地面，坐下却只到耳边。我拿刀割下一大绺，编成发辫。天黑后，我把它挽成一个结，准备拿来当枕头。可我只有火绒匣，没有木柴。幸好衣服上别着一根针，我取下针，劈成一片片，终于点起火来。
        - id: ch04-b02
          speaker: boy
          text: >-
            我躺在火边睡着了，霉运却还追着我不放。偏偏一颗火星落到发辫上，转眼把它烧得精光。我绝望地扑倒在地，身子立刻陷进土里，直没到腰。越挣扎，反而陷得越深。我只好跑回屋里拿来铁锹，亲手把自己从土里挖出来，才把圣水送回家。
        - id: ch04-b03
          speaker: boy
          text: >-
            路过成熟的田野时，我看见到处都是收割庄稼的人。天气忽然热得吓人，他们一个个都昏倒了。我赶紧朝他们喊，为什么不把我家那匹母马牵来？它足有两天那么高、半天那么宽，正好让大家躲到影子底下。
        - id: ch04-b04
          speaker: boy
          text: >-
            父亲听见以后，马上跳上母马的背。收割的人有了阴凉，又起劲地干活。我提起一只木桶，去给他们打水喝。到了井边，却发现那里全冻得硬邦邦的。为了取水，我只好摘下自己的脑袋，用它砸开冰层。
        - id: ch04-b05
          speaker: boy
          text: >-
            我提着水回到田边，刚走近他们，大家就一齐喊起来。
        - id: ch04-b06
          speakers: [reaper_1, reaper_2, reaper_3]
          ensemble: chorus
          text: >-
            咦，你的脑袋跑到哪儿去了？
          emotion: surprised
        - id: ch04-b07
          speaker: boy
          text: >-
            我伸手一摸，脑袋果然没了，一定落在井里。我赶回去，看见一只路过的狐狸已经把脑袋拖出水面，正在撕扯我的脑子。我蹑手蹑脚地靠近，抬脚狠狠一踢。狐狸惨叫一声，丢下一张羊皮纸。
        - id: ch04-b08
          speaker: boy
          text: >-
            纸上明明白白写着：饼归我，没胡子的两手空空。
        - id: ch04-b09
          speaker: narrator
          text: >-
            故事说完，男孩站起身，拿走大饼，回家去了。没胡子的男人只好留在磨坊里，把满肚子的失望咽下去。
        - id: ch04-b10
          speaker: narrator
          text: >-
            这个故事选自《塞尔维亚民间故事》。
