cover_prompt: |-
  A wordless cover gathers strange and wondrous motifs from The Violet Fairy Book around a moonlit crossroads. A golden apple hangs above nine pale birds, a young lute player sits near a fountain, a gazelle guides a traveler, and small underground workers carry lanterns from a hillside door. At the center, a girl in a simple wooden helmet raises a violet flower that casts a gentle path of light toward three branching roads. Her choice of path is the focal action, linking the varied tales while leaving each cultural setting visually distinct. Use a gently elevated composition with layered woods, desert edge, and distant towers, plus generous violet night sky at the top. Keep all costumes respectful and premodern, every creature friendly, and every design original rather than derived from adaptations. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
