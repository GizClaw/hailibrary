  chapters:
    - id: ch01
      title: 草莓地旁的诺言
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前发生过的事，就是真的发生过。若是没有发生，你今天也听不到这个故事。那时有位年轻的皇帝，独自统治着半个世界。国中住着一对年老的牧人夫妇，膝下有三个女儿，名叫安娜、斯塔娜和拉普蒂察。
        - id: ch01-b02
          speaker: narrator
          text: >-
            大姐安娜美得让羊群忘了吃草。只要她还陪着羊儿在草地上走，它们便一味看她，连嘴边的青草也顾不上。二姐斯塔娜也美得出奇。她赶羊时，就连狼也会替她看守羊群。小妹拉普蒂察的肌肤白得像牛奶上的泡沫，头发软得像最细的羊羔绒。两个姐姐的美仿佛全合在了她身上，可她自己的美，又是谁也比不了的。
        - id: ch01-b03
          speaker: narrator
          text: >-
            一个夏日，阳光直泻到大地上。姐妹三人去山脚的树林采草莓，正四下寻找哪一处的果子最大，忽然听见马蹄声越来越近，响得像一整支军队正从旁边经过。来的其实只是皇帝，他带着朋友和侍从出门打猎。他们个个年轻英俊，骑在马上就像同坐骑长在一起，而其中最俊美、最气派的还是皇帝本人。
        - id: ch01-b04
          speaker: narrator
          text: >-
            年轻人看见三姐妹的美貌，都勒住马，慢慢从她们面前走过。等他们一过去，安娜便低声开了口。
        - id: ch01-b05
          speaker: anna
          text: >-
            姐妹们，听我说。那些年轻人要是有一个娶了我，我就给他烤一只面包，让他一辈子年轻勇敢。
        - id: ch01-b06
          speaker: stana
          text: >-
            要是选中了我，我就给丈夫织件衬衫。他穿着去斗恶龙，不会受一点伤。走进水里，连衣角也不会湿。走进火里，烈焰也烧不到他。
        - id: ch01-b07
          speaker: laptitza
          text: >-
            谁要是选我，我就给他生一对孪生男孩。他们额头上各有一颗金星，亮得就像天上的星星。
        - id: ch01-b08
          speaker: narrator
          text: >-
            姐妹们说得很轻，那些年轻人却全听见了，立刻调转马头。
        - id: ch01-b09
          speaker: emperor
          text: >-
            我信你的诺言！最美丽的皇后，你就是我的妻子！
          emotion: happy
        - id: ch01-b10
          speaker: narrator
          text: >-
            皇帝把拉普蒂察连同她采的草莓一起抱上马，放在自己身前。
        - id: ch01-b11
          speaker: friend_one
          text: >-
            那我要娶你！
          emotion: happy
        - id: ch01-b12
          speaker: friend_two
          text: >-
            我就娶你！
          emotion: happy
        - id: ch01-b13
          speaker: narrator
          text: >-
            众人一起骑马回宫，第二天一早就举行了婚礼。此后整整三天三夜，全国上下除了欢宴，再没有别的事。喜庆刚过，人人都听说安娜要来麦子，照着草莓地旁的诺言烤出了那只面包。又过了些日子，另一个消息也传开了。斯塔娜弄来亚麻，亲手把它晒干、梳理，再纺成麻线，最后缝成了她在草莓地旁答应过的衬衫。

    - id: ch02
      title: 被调换的孪生子
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            皇帝有位继母，带着前夫所生的女儿住在宫里。她一直认定自己的女儿才会成为皇后，没想到皇帝娶的竟是牧羊人的女儿，那个“牛奶白姑娘”。她从心底恨透了拉普蒂察，只等着机会害她。可皇帝日日夜夜守着妻子，她一直无从下手，只能不停盘算怎样把皇帝支开。
        - id: ch02-b02
          speaker: narrator
          text: >-
            别的办法都失败以后，继母终于怂恿自己的兄弟，也就是邻国国王，向皇帝宣战。邻国国王率领大军围住几座边城，这条计策果然把皇帝引开了。年轻的皇帝听到消息，立刻怒火冲天，发誓谁也不能拦他迎战，连妻子也不能。他匆匆召集当时能找到的所有士兵，马上出发去迎击敌军。
        - id: ch02-b03
          speaker: narrator
          text: >-
            邻国国王没想到他行动这样快，还没做好迎战的准备，就被皇帝乘其不备发动猛攻，全军大败。胜利以后，双方匆匆议定了和约。皇帝一刻也不耽搁，骑着马飞快往家赶，第三天便回到了宫中。
        - id: ch02-b04
          speaker: narrator
          text: >-
            可就在那天清早，天空中的群星渐渐变淡时，拉普蒂察生下了两个小男孩。两个孩子都有金色头发，额上各带一颗金星。一直守在一旁的继母立刻将他们抱走，在宫殿的一角、皇帝窗户下面挖了一个坑，把两个婴儿放了进去。然后，她又抱来两只小狗崽，放到孩子们原先的位置上。
        - id: ch02-b05
          speaker: narrator
          text: >-
            皇帝一进宫，听到消息便直奔妻子的房间。什么话也不需要说了。他亲眼看见，拉普蒂察没有实现草莓地旁的诺言。虽然这几乎让他的心碎了，他还是觉得自己必须下令惩罚她。他悲伤地走出房间，叫卫兵把皇后埋进土中，只露出脖子以上，让所有人都知道，胆敢欺骗皇帝会有什么结果。
        - id: ch02-b06
          speaker: narrator
          text: >-
            没过几天，继母便如愿了。皇帝娶了她的女儿，全国又欢宴了三天三夜。可是那两个小男孩后来怎样了呢？可怜的婴儿就连在坟墓里也没有得到安息。他们被埋的地方，竟长出了两株漂亮的小白杨。
        - id: ch02-b07
          speaker: narrator
          text: >-
            继母看见树就想起自己的罪行，便下令连根拔掉。皇帝听说了，却不准任何人碰它们。
        - id: ch02-b08
          speaker: emperor
          text: >-
            让它们留着吧，我喜欢看见它们。我从没见过这么漂亮的白杨！
        - id: ch02-b09
          speaker: narrator
          text: >-
            世上没有哪棵白杨像它们这样生长。每过一个白天，它们长上一年。每过一个夜晚，又长上一年。到了黎明，星星淡出天空时，它们眨眼间还要再长三年。伸展的枝条一直拂过宫殿的窗户。微风轻轻摇动它们时，皇帝会坐在那里，整整一天都听着树叶的声音。

    - id: ch03
      title: 白杨木床与金鳞鱼
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            继母知道两棵树究竟意味着什么，心里一刻也没有停止寻找毁掉它们的办法。这件事可不容易。不过，女人若执意要做一件事，石头里也能挤出奶来。她若施展心计，就连英雄也敌不过。诡计办不到的，软话也许能办到。软话要是仍不管用，她还有眼泪。
        - id: ch03-b02
          speaker: narrator
          text: >-
            一天早晨，新皇后坐在丈夫床沿，百般娇柔地哄他。过了好一阵，诱饵才起作用。唉，就算是皇帝，终究也只是个男人！
        - id: ch03-b03
          speaker: emperor
          text: >-
            好吧，好吧，就照你的意思砍掉吧。不过，一棵要给我做床，另一棵给你做床。
        - id: ch03-b04
          speaker: narrator
          text: >-
            新皇后虽然没有完全如愿，也只好答应。第二天早晨，两株白杨被砍倒了。天黑以前，做好的新床已经摆进皇帝的寝宫。皇帝往自己的床上一躺，仿佛一下比平日重了百倍，心中却有了从未感受过的安宁。新皇后躺在另一张床上，只觉得身下全是扎人的荆棘和荨麻，眼睛怎么也合不上。
        - id: ch03-b05
          speaker: narrator
          text: >-
            等皇帝完全睡熟以后，两张床忽然大声吱嘎起来。每一声吱嘎，在新皇后听来都有自己的意思。她觉得自己正在听一种世上只有她才懂的语言。
        - id: ch03-b06
          speaker: elder_twin
          text: >-
            小弟弟，压在你身上的人很重吗？
        - id: ch03-b07
          speaker: younger_twin
          text: >-
            一点也不重。亲爱的父亲睡在我身上，我现在只有欢喜。
          emotion: happy
        - id: ch03-b08
          speaker: elder_twin
          text: >-
            压在我身上的人可太重了，因为她有一个邪恶的灵魂。
        - id: ch03-b09
          speaker: narrator
          text: >-
            两张床就这样一直交谈到天亮，新皇后也从头到尾听着。天刚亮，她便拿定主意，一定要除掉它们。她叫人另做两张一模一样的床，等皇帝出门打猎，就把新床换进寝宫。这一切都照她的吩咐办好了。两张白杨木床被扔进一堆熊熊烈火，烧到最后，只剩下一小堆灰。
        - id: ch03-b10
          speaker: narrator
          text: >-
            可白杨木床在火中燃烧时，新皇后仿佛仍听见先前的那些话，那些世上只有她一人才能听懂的话。她弯下腰，把灰烬全都收起来，再撒向四面八方。她要让风把灰吹过陌生的陆地和海洋，什么也不要留下。
        - id: ch03-b11
          speaker: narrator
          text: >-
            她没有看见，火焰烧得最旺时飞出了两点火星。火星在空中飘浮了一会儿，落进那条贯穿整个国家的大河里。它们一碰到河水，便变成了两条披着金鳞的小鱼。两条鱼长得一模一样，谁只要看上一眼，都会知道它们准是一对孪生兄弟。
        - id: ch03-b12
          speaker: narrator
          text: >-
            一天清早，皇帝的渔夫们到河边捕鱼，要给主人做早饭。他们把渔网撒进河里。等天上最后一颗星隐去时，众人收起网来，发现许许多多的鱼儿中躺着两条全身金鳞的小鱼。这样的鱼，从来没有人见过。渔夫们全围了过来，惊叹了好一阵。大家商量以后，决定让两条小鱼活着，把它们当作礼物献给皇帝。
        - id: ch03-b13
          speaker: elder_twin
          text: >-
            别带我们去那里。我们就是从那里来的，回去只有死路一条。
        - id: ch03-b14
          speaker: fisherman
          text: >-
            那我们该怎么安置你们？
        - id: ch03-b15
          speaker: younger_twin
          text: >-
            请把叶子上的露水都收来，让我们在里面游一会儿。再把我们放在阳光下，等露水晒干以前，千万别靠近。
        - id: ch03-b16
          speaker: narrator
          text: >-
            渔夫照它们的话去做。他从叶子上收集露水，让两条鱼在露水中游了一会儿，再把它们放在太阳底下，直到露水全被晒干。等他回来时，你猜看见了什么？嗬，是两个俊美的少年，两位小王子！他们的头发像额上的金星一样灿烂，模样又分毫不差。任谁看上一眼，都能认出他们是孪生兄弟。

    - id: ch04
      title: 两位少年闯宫
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            男孩们长得飞快。每过一个白天，他们便长上一岁。每过一个夜晚，又长一岁。到了黎明，天上的星星渐渐隐去时，眨眼间还要再长三岁。他们长进的可不只是身量。年龄长了三倍，力气长了三倍，智慧和见识也长了三倍。三天三夜以后，他们有了十二岁的年纪、二十四岁的力量和三十六岁的智慧。
        - id: ch04-b02
          speakers: [elder_twin, younger_twin]
          ensemble: duo
          text: >-
            现在，请带我们去见父亲吧。
        - id: ch04-b03
          speaker: narrator
          text: >-
            渔夫给他们一人一顶羊皮帽。帽子盖住了每个人的半张脸，也把金色的头发和额上的金星藏得严严实实。随后，他领着兄弟俩来到宫廷。等他们到达时，已经是正午了。渔夫带着两个孩子，走向一名站在那里的宫廷官员。
        - id: ch04-b04
          speaker: elder_twin
          text: >-
            我们要见皇帝。
        - id: ch04-b05
          speaker: porter
          text: >-
            等皇帝吃完午饭再说。
        - id: ch04-b06
          speaker: younger_twin
          text: >-
            不，我们就在他吃饭时进去。
        - id: ch04-b07
          speaker: narrator
          text: >-
            弟弟说着，一步跨过门槛。侍从们全都冲上来，要把这两个无礼的小家伙赶出宫去。兄弟俩却像水银一样从他们指间滑脱，闯进一座宽阔的大厅。皇帝正在那里吃饭，整个朝廷的人都围坐在他身边。走到大厅门边，哥哥厉声对近旁的仆人开了口。
        - id: ch04-b08
          speaker: elder_twin
          text: >-
            我们要进去。
        - id: ch04-b09
          speaker: servant
          text: >-
            绝对不行。
        - id: ch04-b10
          speaker: younger_twin
          text: >-
            是吗？那就试试看！
        - id: ch04-b11
          speaker: narrator
          text: >-
            弟弟把仆人向两边推开。可仆人太多，小王子只有两个。扭打的喧闹声传到了皇帝耳中。
        - id: ch04-b12
          speaker: emperor
          text: >-
            出了什么事？
          emotion: angry
        - id: ch04-b13
          speaker: narrator
          text: >-
            兄弟俩听见父亲的声音，马上停了手。一个仆人走近皇帝禀报。
        - id: ch04-b14
          speaker: servant
          text: >-
            有两个男孩非要闯进来。
        - id: ch04-b15
          speaker: emperor
          text: >-
            强闯？谁敢在我的宫里动武？他们到底是什么人？
          emotion: angry
        - id: ch04-b16
          speaker: servant
          text: >-
            尊贵的陛下，我们不知道。不过，他们一定和您有亲缘。他们有雄狮一般的力气，已经冲散了门口的卫兵。他们也骄傲得很，连帽子都不肯摘。
        - id: ch04-b17
          speaker: narrator
          text: >-
            皇帝越听越气，脸都红了。
        - id: ch04-b18
          speaker: emperor
          text: >-
            把他们赶出去！再放狗追他们！
          emotion: angry
        - id: ch04-b19
          speakers: [elder_twin, younger_twin]
          ensemble: duo
          text: >-
            不必赶，我们会安静地离开。
          emotion: sad
        - id: ch04-b20
          speaker: narrator
          text: >-
            父亲的话这样严酷，兄弟俩默默流着眼泪，一步一步向后退去。他们没有再同任何人争斗，就这样倒退着离开了大厅。两人已经快要走到宫门时，一个仆人忽然从后面追了上来。
        - id: ch04-b21
          speaker: servant
          text: >-
            皇帝命你们回去。皇后想见你们。
        - id: ch04-b22
          speaker: narrator
          text: >-
            兄弟俩想了一会儿，便原路返回，径直走到皇帝面前，仍旧戴着帽子。

    - id: ch05
      title: 金星照亮真相
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            皇帝坐在一张长桌的上首，桌上铺满鲜花，宾客也坐满了整张桌子。新皇后坐在他的身边，身后整整垫着十二只靠垫。两位小王子刚一走进大厅，其中一只靠垫便掉到了地上，新皇后身后只剩下十一只。
        - id: ch05-b02
          speaker: courtier
          text: >-
            把帽子摘下来。
        - id: ch05-b03
          speaker: elder_twin
          text: >-
            人们戴着帽子，是为了表明自己身份尊贵。我们是什么身份，外表就该是什么模样。
        - id: ch05-b04
          speaker: emperor
          text: >-
            算了，就让他们这样戴着吧。不过，你们得告诉我，你们究竟是谁？从什么地方来？到这里又想要什么？
        - id: ch05-b05
          speaker: narrator
          text: >-
            男孩银铃般的声音已经消去了皇帝的怒气。哥哥便开口回答。
        - id: ch05-b06
          speaker: elder_twin
          text: >-
            我们是孪生兄弟，是同一根茎长出的两株嫩芽。那根茎已经折断，一半埋在地下，一半坐在这张长桌的上首。我们走过很远的路。风吹树叶时，我们在沙沙声里说过话。在树林里，我们低声诉说。到了水中，我们又放声歌唱。现在，我们要用人的语言给您讲一个故事。这个故事，您明明知道，却不知道自己知道。
        - id: ch05-b07
          speaker: narrator
          text: >-
            第二只靠垫落到了地上。
        - id: ch05-b08
          speaker: new_empress
          text: >-
            让他们把这些傻话带回家去吧。
        - id: ch05-b09
          speaker: emperor
          text: >-
            不，让他们继续。是你想见他们，我却想听他们讲。说下去吧，孩子们，把故事唱给我听。
        - id: ch05-b10
          speaker: narrator
          text: >-
            新皇后不再出声。小王子们唱起了自己的身世。
        - id: ch05-b11
          speakers: [elder_twin, younger_twin]
          ensemble: duo
          text: >-
            从前有一位皇帝……
        - id: ch05-b12
          speaker: narrator
          text: >-
            他们才唱出第一句，第三只靠垫便掉了下来。兄弟俩继续唱着自己一生的故事。唱到皇帝领兵出征时，又有三只靠垫同时落地。等整个故事终于唱完，新皇后身下一只靠垫也没有了。
        - id: ch05-b13
          speaker: narrator
          text: >-
            就在这时，兄弟俩终于摘下帽子，露出了灿烂的金色头发，还有额头上的两颗金星。皇帝和桌边所有宾客的目光，一下全落在了他们身上。那么多道目光沉沉压来，兄弟俩几乎承受不住。
        - id: ch05-b14
          speaker: narrator
          text: >-
            最后，终于发生了本该在开头就发生的事。拉普蒂察回到丈夫身边，同他一起坐在长桌上首。继母的女儿成了宫里地位最低的缝衣女仆，继母则被绑在一匹野马上。所有人从此都明白了，也再没有忘记。谁要是把心思全用来作恶，最后一定没有好下场。
        - id: ch05-b15
          speaker: narrator
          text: >-
            这个故事来自罗马尼亚。
