  chapters:
    - id: ch01
      title: Promises in the Strawberry Wood
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, what happened truly happened. If it had not, you would never have heard this story. An emperor ruled half the world, and in that world lived an old shepherd, his wife, and their three daughters, Anna, Stana, and Laptitza.
        - id: ch01-b02
          speaker: narrator
          text: Anna was so beautiful that when she led the sheep to pasture, they forgot to eat while she walked among them. Stana was so beautiful that even the wolves guarded her flock. Laptitza, the youngest, had skin as white as milk foam and hair as soft as the finest lamb's wool. She was as lovely as both sisters together, and as lovely as only Laptitza could be.
        - id: ch01-b03
          speaker: narrator
          text: One hot summer day, the sisters went to pick strawberries in a wood at the foot of the mountain. As they searched for the largest berries, they heard horses pounding toward them. The sound was loud enough for an army, but it was the emperor riding to the hunt with his friends and attendants. All were handsome young horsemen, and the young emperor was the finest of them. When they saw the sisters, they slowed their horses.
        - id: ch01-b04
          speaker: anna
          text: Listen, sisters. If one of those young men chose me for his wife, I would bake him bread that would keep him young and brave forever.
        - id: ch01-b05
          speaker: stana
          text: If one of them chose me, I would weave him a shirt that no dragon could tear. Water would never wet it, and fire would never burn it.
        - id: ch01-b06
          speaker: laptitza
          text: And I would give the man who chose me twin sons. Each boy would have a golden star on his forehead, as bright as a star in the sky.
        - id: ch01-b07
          speaker: narrator
          text: The sisters spoke softly, but the young men heard every word and turned their horses around.
        - id: ch01-b08
          speaker: emperor
          text: I hold you to your promise. You shall be mine, loveliest of empresses!
          emotion: happy
        - id: ch01-b09
          speaker: narrator
          text: He lifted Laptitza, strawberries and all, onto his horse before him.
        - id: ch01-b10
          speaker: first_friend
          text: Then I choose you, Anna!
          emotion: happy
        - id: ch01-b11
          speaker: second_friend
          text: And I choose you, Stana!
          emotion: happy
        - id: ch01-b12
          speaker: narrator
          text: They all rode back to the palace. The weddings took place the next morning, and for three days and three nights there was nothing but feasting across the kingdom. When the celebrations ended, news of the sisters' promises was on everyone's lips. Anna sent for corn and baked the bread she had described at the strawberry beds. More days and nights passed. Then a new report went around. Stana had found flax, dried it, combed it, and spun it into linen. With her own hands, she had sewn the shirt she had promised.
    - id: ch02
      title: The Stepmother's Deception
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The emperor had a stepmother whose daughter by her first husband lived at the palace. The stepmother had always expected her own daughter to become empress. Instead, the emperor had married the shepherd's child people called the Milkwhite Maiden. The stepmother hated Laptitza and waited for a chance to harm her.
        - id: ch02-b02
          speaker: narrator
          text: As long as the emperor stayed beside his wife day and night, the stepmother could do nothing. She tried one scheme after another, always searching for a way to draw him away. At last she persuaded her brother, the king of a neighboring country, to declare war. He led a great army against the frontier towns. The instant the emperor heard, he sprang up in anger. He vowed that nothing, not even his wife, would stop him from meeting the enemy in battle. He gathered whatever soldiers were close at hand and rode out at once.
        - id: ch02-b03
          speaker: narrator
          text: The neighboring king had never expected him to move so quickly and was not ready to face him. The emperor attacked while the enemy was off guard and routed the whole army. As soon as victory was won, the two sides hurriedly drew up the terms of peace. Then the emperor rode for home as fast as his horse could carry him. He reached the palace on the third day.
        - id: ch02-b04
          speaker: narrator
          text: Early that same morning, as the stars faded, Laptitza had given birth to two little boys. Both had golden hair and a golden star on the forehead. The watching stepmother stole the babies away. Beneath the emperor's windows, in a corner of the palace grounds, she dug a hole and buried them. Then she put two little puppies in their place.
        - id: ch02-b05
          speaker: narrator
          text: When the emperor arrived, he went straight to Laptitza's room. What he saw seemed to prove that she had broken her promise at the strawberry beds. His heart nearly broke, yet he believed he had to punish her.
        - id: ch02-b06
          speaker: narrator
          text: With great sorrow, he ordered his guards to bury the empress up to her neck. Everyone would see what happened, he said, to anyone who dared deceive the emperor. A few days later, the stepmother got what she wanted. The emperor married her daughter, and once again the kingdom feasted for three days and three nights.
    - id: ch03
      title: The Aspens and the Speaking Beds
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: But the two babies found no rest beneath the ground. From the place where they lay, two beautiful young aspens sprang up. The stepmother could not bear the sight of them, for they reminded her of her crime. She ordered them torn out, but the emperor stopped her.
        - id: ch03-b02
          speaker: emperor
          text: Leave them alone. I like seeing them there. They are the finest aspens I have ever seen.
        - id: ch03-b03
          speaker: narrator
          text: No aspens had ever grown so fast. Each day they grew as much as other trees grew in a year, and each night they grew another year. At dawn, when the stars faded, three years of growth passed through them in the blink of an eye. Soon their branches swept across the palace windows. Whenever the wind stirred the leaves, the emperor sat listening for hours.
        - id: ch03-b04
          speaker: narrator
          text: The stepmother understood what the trees were. Her mind never rested as she searched for some way to destroy them. It was not easy. But a stubborn will can press milk from a stone, and cunning can overcome heroes. When craft failed, she turned to soft words. If soft words did not work, she still had tears. One morning, the new empress sat on the edge of her husband's bed. She coaxed him in every pretty way she knew. It took a long time, but at last even the emperor gave in.
        - id: ch03-b05
          speaker: emperor
          text: Very well. Have the trees cut down. But one must be made into a bed for me, and the other into a bed for you.
        - id: ch03-b06
          speaker: narrator
          text: The new empress had to accept that bargain. The aspens were felled the next morning, and before night the two new beds stood in the emperor's room. When the emperor lay down, he seemed a hundred times heavier than before, yet a new peace settled over him. The empress felt as though she lay on thorns and nettles. She could not sleep.
        - id: ch03-b07
          speaker: narrator
          text: Once the emperor was fast asleep, the beds began to crack. To the empress, each crack became a word in a language that only she understood.
        - id: ch03-b08
          speaker: elder_twin
          text: Is the weight on you too heavy, little brother?
        - id: ch03-b09
          speaker: younger_twin
          text: No, not at all. I feel only joy, because our beloved father is resting above me.
          emotion: happy
        - id: ch03-b10
          speaker: elder_twin
          text: The weight on me is terrible. An evil soul is lying above me.
        - id: ch03-b11
          speaker: narrator
          text: The beds spoke until morning, and the empress listened to everything. By daybreak, she had formed another plan. While the emperor was hunting, she replaced the aspen beds with two beds that looked exactly the same. Then she burned the originals in a great fire until only ashes remained. Even as they burned, she seemed to hear those same words.
        - id: ch03-b12
          speaker: narrator
          text: She gathered the ashes and scattered them to the four winds. They would blow across strange lands and seas, and nothing would remain. But she did not see two sparks leap from the brightest part of the fire. They floated in the air, then fell into the great river that ran through the heart of the country.
    - id: ch04
      title: The Golden Fish Become Princes
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: In the river, the sparks became two little fish with golden scales. They looked so exactly alike that anyone could see they were twins. Early one morning, the emperor's fishermen cast their nets for fish to serve at his breakfast. As the final star vanished, they hauled in the nets. Among all the other fish lay the two golden ones, unlike anything the men had ever seen.
        - id: ch04-b02
          speaker: narrator
          text: The fishermen crowded around in wonder. After talking it over, they decided to keep the golden fish alive and present them to the emperor.
        - id: ch04-b03
          speaker: elder_twin
          text: Do not carry us there. That is where we came from, and destruction is waiting for us there.
        - id: ch04-b04
          speaker: fisherman
          text: Then what should we do with you?
        - id: ch04-b05
          speaker: younger_twin
          text: Gather the dew from the leaves and let us swim in it. Then place us in the sun. Do not come back until the sunlight has dried every drop.
        - id: ch04-b06
          speaker: narrator
          text: The fisherman did exactly as they told him. He moved from leaf to leaf, gathering all the dew he could find. He let the two fish swim in it, then placed them in the sun and stayed away until every drop had dried. When he returned, what do you think he found? Two beautiful young princes stood where the fish had been. Their hair was as golden as the stars on their foreheads. They looked so exactly alike that anyone could tell at once they were twins.
        - id: ch04-b07
          speaker: narrator
          text: The boys grew just as the aspens had grown. Each day added a year to their age, and each night added another. At dawn, as the stars faded, they grew three years in a single moment. Their wisdom and knowledge grew with their bodies. After three days and three nights, they had the age of twelve-year-olds, the strength of men of twenty-four, and the wisdom of men of thirty-six.
        - id: ch04-b08
          speakers: [elder_twin, younger_twin]
          ensemble: duo
          text: Now take us to our father.
        - id: ch04-b09
          speaker: narrator
          text: The fisherman gave each boy a lambskin cap before they set out. Pulled low, the caps covered half their faces. They hid every strand of golden hair and both stars from sight. Once the twins were safely disguised, the fisherman led them to their father's court.
    - id: ch05
      title: The Princes at the Palace Gate
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: By the time they reached the palace, it was midday. The court was gathered for dinner, and the halls were busy with attendants. The fisherman led his two charges up to an official who was standing nearby.
        - id: ch05-b02
          speaker: elder_twin
          text: We have come to speak with the emperor.
        - id: ch05-b03
          speaker: porter
          text: You will have to wait until he has finished dinner.
        - id: ch05-b04
          speaker: younger_twin
          text: No. We will speak to him while he is eating.
        - id: ch05-b05
          speaker: narrator
          text: The younger twin stepped across the threshold. Attendants rushed forward to throw the bold strangers out, but the boys slipped through their hands like quicksilver. They reached the great hall, where the emperor was dining with his entire court.
        - id: ch05-b06
          speaker: elder_twin
          text: Stand aside. We mean to go in.
        - id: ch05-b07
          speaker: palace_servant
          text: You cannot possibly enter.
        - id: ch05-b08
          speaker: younger_twin
          text: Cannot we? Let us find out.
        - id: ch05-b09
          speaker: narrator
          text: He pushed the servants away on both sides. The twins were as strong as the lions the servant would soon compare them to, but there were many servants and only two princes. Hands reached for them from every direction. The noise of the struggle rolled through the hall until it reached the emperor at his table.
        - id: ch05-b10
          speaker: emperor
          text: What is happening out there?
          emotion: angry
        - id: ch05-b11
          speaker: narrator
          text: At their father's voice, the princes stopped moving. One servant hurried to the emperor.
        - id: ch05-b12
          speaker: palace_servant
          text: Two boys are trying to force their way into the hall.
        - id: ch05-b13
          speaker: emperor
          text: Force their way into my palace? Who would dare? What boys are these?
          emotion: angry
        - id: ch05-b14
          speaker: palace_servant
          text: We do not know, mighty emperor. But they must be your kin. They have the strength of lions and scattered the guards at the gate. They are proud as well as strong, for they refuse to uncover their heads.
        - id: ch05-b15
          speaker: narrator
          text: The emperor's face reddened as he listened.
        - id: ch05-b16
          speaker: emperor
          text: Throw them out! Set the dogs on them!
          emotion: angry
        - id: ch05-b17
          speakers: [elder_twin, younger_twin]
          ensemble: duo
          text: Leave us alone. We will go peacefully.
        - id: ch05-b18
          speaker: narrator
          text: The twins walked backward toward the gates, silently weeping at those cruel words. They had almost left when a servant ran after them.
        - id: ch05-b19
          speaker: palace_servant
          text: Come back. The emperor commands it. The empress wishes to see you.
        - id: ch05-b20
          speaker: narrator
          text: The princes paused to think. Then they retraced their steps and walked straight to the emperor, still wearing their caps.
    - id: ch06
      title: The Story the Emperor Knew
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: The emperor sat at the head of a long table. Flowers covered it, and guests filled every place. Beside him sat the new empress, raised high upon twelve cushions. The twins walked into that crowded room with their caps still firmly on their heads. At that very moment, one cushion slipped from beneath the empress. Eleven remained.
        - id: ch06-b02
          speaker: courtier
          text: Take off your caps.
        - id: ch06-b03
          speaker: elder_twin
          text: Among men, a covered head is a mark of honor. We want to appear as we truly are.
        - id: ch06-b04
          speaker: emperor
          text: Never mind the caps. Stay as you are. But tell me who you are, where you came from, and what you want.
        - id: ch06-b05
          speaker: narrator
          text: The emperor's anger had faded when he heard the boy's silvery voice.
        - id: ch06-b06
          speaker: younger_twin
          text: We are twins, two shoots from one broken stem. Half of that stem lies in the ground, and half sits at the head of this table. We have come a long way. We spoke in the rustling wind, whispered in the wood, and sang in the water. Now, in human speech, we want to tell you a story that you know without knowing it.
        - id: ch06-b07
          speaker: narrator
          text: A second cushion dropped from beneath the empress.
        - id: ch06-b08
          speaker: new_empress
          text: Send them home with their foolish talk.
        - id: ch06-b09
          speaker: emperor
          text: No, let them continue. You wanted to see them, and now I want to hear them. Go on, boys. Sing me your story.
        - id: ch06-b10
          speaker: narrator
          text: The empress said nothing. The princes began to sing the story of their lives.
        - id: ch06-b11
          speakers: [elder_twin, younger_twin]
          ensemble: duo
          text: Once there was an emperor.
        - id: ch06-b12
          speaker: narrator
          text: A third cushion fell. The song told of three sisters picking strawberries, and of three promises overheard by riders in the wood. It told of Laptitza's wedding, the stepmother's hatred, and the war that drew the emperor away. When the song reached his ride to battle, three cushions fell at once.
        - id: ch06-b13
          speaker: narrator
          text: The princes sang of their birth beneath fading stars and how two puppies were put in their place. They sang of their mother buried to the neck and of themselves beneath the palace windows. They told how they had lived as aspens, how the trees became speaking beds, and how fire changed them into two golden sparks. They sang of the river, the fishermen's net, the morning dew, and the sunlight that gave them human form again. As the whole truth unfolded, cushion after cushion slipped away.
        - id: ch06-b14
          speaker: narrator
          text: When the song ended, not one cushion remained beneath the empress. Then the twins lifted their caps. Their golden hair shone, and the golden stars gleamed on their foreheads. The emperor and every guest stared at them with such force that the boys could scarcely bear all those eyes.
        - id: ch06-b15
          speaker: narrator
          text: In the end, what should have happened at the beginning finally came to pass. Laptitza took her rightful place beside her husband at the head of the table. The stepmother's daughter became the lowliest sewing maid in the palace, and the stepmother was tied to a wild horse. From that day on, no one forgot that a mind bent on wickedness is certain to meet a bitter end.
