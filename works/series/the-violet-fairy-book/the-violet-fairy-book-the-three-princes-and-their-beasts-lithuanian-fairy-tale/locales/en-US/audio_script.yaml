  chapters:
    - id: ch01
      title: The Three Roads
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there were three princes and their step-sister. One day, all four went hunting in a thick wood. Deep among the trees they found a great grey wolf with three cubs. The princes raised their weapons, but before they could shoot, the wolf spoke.
        - id: ch01-b02
          speaker: grey_wolf
          text: Spare me, and I will give each of you a cub. They will be faithful friends to you.
        - id: ch01-b03
          speaker: narrator
          text: The princes let her live and went on, each with a young wolf at his heels. Soon they met a lioness with three cubs. She also begged for her life and gave them one cub apiece. The same thing happened with a fox, a hare, a boar, and a bear. Before long, every prince had a whole company of young beasts padding along behind him.
        - id: ch01-b04
          speaker: narrator
          text: Evening drew near. The hunters reached a clearing where three roads crossed and three birches stood. The eldest prince shot an arrow into the trunk of one tree, then turned to his brothers.
        - id: ch01-b05
          speaker: eldest_prince
          text: Before we take separate roads, each of us should mark one of these birches. Whenever one of us returns, he must look at the other two trees. If blood runs from a mark, that brother is dead. If milk runs from it, he is alive.
        - id: ch01-b06
          speaker: narrator
          text: His brothers agreed. Each marked a birch with an arrow. Then they asked their step-sister which brother she wished to live with.
        - id: ch01-b07
          speaker: step_sister
          text: I will go with the eldest.
        - id: ch01-b08
          speaker: narrator
          text: So the three brothers parted. Each chose a different road with his beasts behind him, while the step-sister followed the eldest prince.
        - id: ch01-b09
          speaker: narrator
          text: Their road led into another forest. In one of its deepest glades they came upon a castle where a band of robbers lived. The prince knocked at the door. As soon as it opened, his beasts rushed inside. Each beast seized a robber, killed him, and dragged him down to the cellar. But one robber was only badly wounded. He lay still and pretended to be dead. The prince and his step-sister knew nothing of this, and made the castle their home.
    - id: ch02
      title: The Robber in the Cellar
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The next morning the prince went hunting. He told his step-sister that she could enter every room except the cellar where the robbers lay. As soon as he was gone, she wandered through the castle. After seeing all the other rooms, she forgot his warning, went down to the cellar, and opened the door. The wounded robber sat up at once.
        - id: ch02-b02
          speaker: robber
          text: Do not be frightened. Follow my directions, and I will be your friend. Marry me, and you will be far happier than you are with your brother. First, look in the sitting-room cupboard. You will find three bottles. Rub the ointment from the first on my chin to heal my wound. The second will make me well when I drink it, and the third will make me stronger than ever.
        - id: ch02-b03
          speaker: robber
          text: When your brother comes home with his beasts, tell him how strong he is. Ask whether he could break a stout silk cord if you tied his thumbs behind his back. Once you discover that he cannot get free, call me.
        - id: ch02-b04
          speaker: narrator
          text: The step-sister went to the cupboard and found the three bottles. She spread the healing ointment on the robber's chin. He drank from the second bottle and became well, then drank from the third and grew stronger than he had ever been. When her brother returned with his beasts, she praised his strength and persuaded him to let her tie his thumbs behind his back. One sharp pull snapped the cord.
        - id: ch02-b05
          speaker: eldest_prince
          text: Sister, that cord could never hold me.
        - id: ch02-b06
          speaker: narrator
          text: The prince returned to the wood with his beasts the next day. While he was away, the robber told the step-sister to find a much thicker cord for the second test. That evening she bound her brother's thumbs again. He did not escape as easily as before, but after a hard struggle he still tore himself free.
        - id: ch02-b07
          speaker: eldest_prince
          text: That one was not strong enough either.
        - id: ch02-b08
          speaker: narrator
          text: On the third day he agreed to one last test. Following the robber's advice, his step-sister had prepared an extremely strong silk cord. The prince pulled and tugged with all his strength, but this cord would not break.
        - id: ch02-b09
          speaker: eldest_prince
          text: Sister, you have found a cord too strong for me. Come and untie it.
        - id: ch02-b10
          speaker: narrator
          text: She did not come. Instead, she called the robber. He charged into the room, waving a knife and ready to strike. The prince asked him to wait.
        - id: ch02-b11
          speaker: eldest_prince
          text: Give me one minute. Before I die, let me sound my hunting horn three times. I will blow it here, once more on the stairs, and once in the courtyard.
        - id: ch02-b12
          speaker: narrator
          text: The robber allowed it. At the first blast, the fox woke inside the courtyard cage and knew his master needed help. He brushed his tail across the wolf's eyes to wake him. Together they roused the lion. The lion hurled himself against the cage door until it broke into splinters. All the beasts raced through the courtyard. The fox gnawed through the cord around the prince's thumbs. The lion sprang upon the robber and killed him, tearing him apart. Then every beast carried away a bone.
        - id: ch02-b13
          speaker: narrator
          text: The prince faced his step-sister.
        - id: ch02-b14
          speaker: eldest_prince
          text: I will not kill you. I will leave you here to repent. You will not see me again until your tears have filled this bowl.
        - id: ch02-b15
          speaker: narrator
          text: He chained her to the wall and placed a great bowl before her. Then he called his beasts and left the castle to continue his travels.
    - id: ch03
      title: The Nine-Headed Dragon
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: After traveling a little way, the prince reached an inn. Everyone inside looked miserable, so he asked what had happened.
        - id: ch03-b02
          speaker: inn_guest
          text: Our king's daughter will die today. They are giving her to a terrible dragon with nine heads.
          emotion: sad
        - id: ch03-b03
          speaker: eldest_prince
          text: Why should the princess die? I have great strength. I will rescue her.
        - id: ch03-b04
          speaker: narrator
          text: He went straight to the seashore, where the dragon was meant to take the princess. While he waited with his beasts, a great procession came toward them. It escorted the unfortunate princess to the shore. Then all the people sadly went home and left her there. Only the prince stayed.
        - id: ch03-b05
          speaker: narrator
          text: Far out at sea, something moved. It swept quickly over the water and drew closer. Then the prince saw a monstrous dragon skimming across the waves, all nine of its heads rising above the water. He took counsel with his beasts and waited for it to reach the shore. The fox dipped his brush in the sea and flung salt water into the dragon's eyes. At the same time, the bear and lion threw up still more water with their paws. The creature was so blinded and confused that it could see nothing. The prince rushed forward with his sword and killed it. Then his beasts tore the dragon's body apart.
        - id: ch03-b06
          speaker: narrator
          text: The princess thanked the prince for saving her. She gave him a ring and one half of her handkerchief.
        - id: ch03-b07
          speaker: princess
          text: Come into my carriage. We will ride back to my father's palace together.
        - id: ch03-b08
          speaker: narrator
          text: On the road, the coachman and footman began plotting together.
        - id: ch03-b09
          speakers: [coachman, footman]
          ensemble: duo
          text: Why take this stranger to the palace? We can kill him and tell the king that we slew the dragon and saved his daughter. Then one of us can marry her.
        - id: ch03-b10
          speaker: narrator
          text: The coachman and footman killed the prince and abandoned his body beside the road. His faithful beasts gathered around him. They wept over their dead master and wondered what they could possibly do. Then the wolf thought of a plan. He ran into the wood, found an ox, and killed it. Next he called the fox and set him to guard the carcass. If any bird flew down and tried to peck at the flesh, the fox was to catch it and carry it to the lion.
        - id: ch03-b11
          speaker: narrator
          text: Before long a crow flew down and pecked at the ox. The fox seized her and carried her to the lion.
        - id: ch03-b12
          speaker: lion
          text: We will spare you if you fly to the town with the three healing wells. Bring water from them in your beak, and make this dead man live again.
        - id: ch03-b13
          speaker: narrator
          text: The crow flew to the town. She filled her beak at the well of healing, the well of strength, and the well of swiftness. Then she returned and let the water fall upon the prince's lips. His wound healed. He sat up, stood, and found that he could walk.
    - id: ch04
      title: The True Dragon Slayer
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: With his beasts beside him, the prince set off for town. At the king's palace, servants were preparing a magnificent feast. The princess was about to marry the coachman.
        - id: ch04-b02
          speaker: narrator
          text: The prince entered the palace and walked straight up to the coachman.
        - id: ch04-b03
          speaker: eldest_prince
          text: What proof do you have that you killed the dragon and earned the princess's hand? I carry her true tokens, this ring and the other half of her handkerchief.
        - id: ch04-b04
          speaker: narrator
          text: The king examined the ring and the torn handkerchief. They proved that the stranger before him was the man who had truly saved his daughter. He knew at once that the prince had told the truth and the coachman had lied. The coachman was bound in chains and thrown into prison. Then the prince married the princess, and the king rewarded him with half the kingdom.
        - id: ch04-b05
          speaker: narrator
          text: Soon after the wedding, the prince went walking through the woods one evening with his faithful beasts. Night fell, and he lost the path back to the palace. As he searched among the trees, he noticed a fire. Beside it, an old woman was raking dry leaves and sticks together in a forest glade.
        - id: ch04-b06
          speaker: narrator
          text: The prince was tired, and the darkness was deep. He decided to go no farther and asked whether he could sleep beside her fire.
        - id: ch04-b07
          speaker: old_woman
          text: You are welcome to stay. But your beasts frighten me. Let me strike them with my rod, and then I will feel safe.
        - id: ch04-b08
          speaker: eldest_prince
          text: Very well. I have no objection.
        - id: ch04-b09
          speaker: narrator
          text: The old woman reached out with her rod and touched the beasts. In a single moment, every one of them turned to stone. Then the prince became stone as well.
    - id: ch05
      title: The Witch's Rod
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Not long afterward, the youngest brother returned from his travels to the crossroads and the three marked birches. He remembered the promise they had made when they parted. He walked around the other two trees and carefully studied their marks. Blood was oozing from the cut in the eldest prince's birch, so the youngest knew his brother must be dead. With his own faithful beasts following behind, he took the road that led to the town his brother had ruled and where his brother's princess lived.
        - id: ch05-b02
          speaker: narrator
          text: The whole town was grieving because its prince had vanished. When the people saw the youngest brother and his company of beasts, they mistook him for the missing prince. They rejoiced and told him how they had searched everywhere. The king also believed his son-in-law had returned. But the princess knew this man was not her husband.
        - id: ch05-b03
          speaker: princess
          text: Please go into the woods with your beasts. Search for your brother, and do not stop until you find him.
        - id: ch05-b04
          speaker: narrator
          text: The youngest prince obeyed. He searched the woods until he too lost his way and night overtook him. At last he entered the clearing where the old woman tended her fire. Since it was too dark and late to return to town, he asked to stay beside the flames.
        - id: ch05-b05
          speaker: old_woman
          text: Certainly, you may stay. But I am afraid of your beasts. May I touch each one with my rod? Then I will no longer fear them.
        - id: ch05-b06
          speaker: narrator
          text: The youngest prince did not know she was a witch, so he gave her permission. She stretched out the rod. In an instant, the prince and all his beasts were stone.
        - id: ch05-b07
          speaker: narrator
          text: Soon the second brother finished his own travels and came to the crossroads. Blood poured from the cuts in both of his brothers' trees. He began to weep.
        - id: ch05-b08
          speaker: second_prince
          text: Alas, both my brothers are dead.
          emotion: sad
        - id: ch05-b09
          speaker: narrator
          text: He set out toward the town where his eldest brother had ruled, and his faithful beasts followed. When he entered the streets, the people mistook him for their lost prince, just as they had mistaken the youngest brother. They crowded around him, asking where he had been and why he had not returned. Then they led him to the king's palace. The king could not tell the difference, but the princess knew this was not her husband. When the two were alone, she begged him to go back into the woods, find his brother, and bring him home.
        - id: ch05-b10
          speaker: narrator
          text: The second prince gathered his beasts and entered the woods. He wandered among the trees, then laid his ear against the ground to listen for his brothers' animals. A faint sound seemed to come from far away, but he could not tell where it was. He blew his hunting horn and listened once more. Again he heard the sound. This time it seemed to come from a fire glowing through the trees.
        - id: ch05-b11
          speaker: narrator
          text: He followed it and found the old woman raking leaves and sticks into the embers. He asked to spend the night beside her fire. She said she feared his beasts and demanded permission to strike each of them with her rod.
        - id: ch05-b12
          speaker: second_prince
          text: No. I am their master, and no one else may strike them. Give that rod to me.
        - id: ch05-b13
          speaker: narrator
          text: The old woman handed it over. The prince touched his fox with the rod, and the animal turned to stone at once. Now he knew the woman was a witch.
        - id: ch05-b14
          speaker: second_prince
          text: Bring my brothers and all their beasts back to life this instant, or my lion will tear you to pieces.
          emotion: angry
        - id: ch05-b15
          speaker: narrator
          text: The witch was terrified by his threat. She took a young oak tree and burned it until nothing remained but white ashes. Then she gathered the ashes and sprinkled them over all the stones that stood around the clearing. In a moment the stones changed. The eldest and youngest princes stood alive before their brother, and both companies of faithful beasts gathered around them.
        - id: ch05-b16
          speaker: narrator
          text: The three brothers and all their beasts returned to town together. When they entered the palace, the king could not tell which prince was his son-in-law. The princess knew her husband at once, and great rejoicing spread throughout the land.
