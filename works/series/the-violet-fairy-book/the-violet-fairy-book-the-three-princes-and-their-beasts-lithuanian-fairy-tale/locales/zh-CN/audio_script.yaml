audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 编者
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清晰的成年男声
        pace: 从容舒展
        pitch: 中低音
    grey_wolf:
      display_name: 灰狼
      tts:
        delivery: 警觉恳切，语气沉着
        timbre: 粗粝低沉的成年女声
        pace: 适中
        pitch: 低音
    eldest_prince:
      display_name: 大王子
      tts:
        delivery: 勇敢直率，果断而有威严
        timbre: 清朗坚定的年轻男声
        pace: 适中
        pitch: 中低音
    step_sister:
      display_name: 继妹
      tts:
        delivery: 克制谨慎，心思深藏
        timbre: 轻柔平滑的年轻女声
        pace: 适中
        pitch: 中高音
    robber:
      display_name: 强盗
      tts:
        delivery: 狡猾阴狠，带着威逼的口气
        timbre: 粗哑阴沉的成年男声
        pace: 稍慢
        pitch: 低音
    inn_guest:
      display_name: 客店旅客
      tts:
        delivery: 悲伤沉重，口气朴实
        timbre: 疲惫低沉的成年男声
        pace: 缓慢
        pitch: 中低音
    princess:
      display_name: 公主
      tts:
        delivery: 温和端庄，清醒而坚定
        timbre: 明亮柔和的年轻女声
        pace: 适中
        pitch: 中高音
    coachman:
      display_name: 车夫
      tts:
        delivery: 冷酷贪婪，语气强硬
        timbre: 厚重生硬的成年男声
        pace: 适中
        pitch: 低音
    footman:
      display_name: 随从
      tts:
        delivery: 急切贪婪，透着阴险
        timbre: 尖细干涩的成年男声
        pace: 稍快
        pitch: 中音
    lion:
      display_name: 狮子
      tts:
        delivery: 威严有力，毫不迟疑
        timbre: 浑厚洪亮的成年男声
        pace: 适中
        pitch: 低音
    old_woman:
      display_name: 老妇人
      tts:
        delivery: 温吞诱哄，暗藏诡秘
        timbre: 干涩苍老的女声
        pace: 从容缓慢
        pitch: 中低音
    youngest_prince:
      display_name: 小王子
      tts:
        delivery: 诚恳热心，容易信任他人
        timbre: 清澈年轻的男声
        pace: 适中
        pitch: 中音
    second_prince:
      display_name: 二王子
      tts:
        delivery: 沉着谨慎，意志坚定
        timbre: 温厚稳定的年轻男声
        pace: 稍慢
        pitch: 中低音
  chapters:
    - id: ch01
      title: 三条路
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前有三位王子，还有一个继妹。一天，兄妹四人结伴去打猎。他们穿过茂密的森林，遇见一头带着三只幼崽的大灰狼。三位王子正要放箭，灰狼突然开了口。
        - id: ch01-b02
          speaker: grey_wolf
          text: >-
            请别射我。你们饶我一命，我就把三只幼崽送给你们，一人一只。它们会忠心陪着你们。
        - id: ch01-b03
          speaker: narrator
          text: >-
            王子们放下武器，继续往前走，每人身后都跟上了一只小狼。不久，他们又碰见带着三只幼崽的母狮。母狮也求他们放过自己，把幼崽一只只送给了他们。后来遇见狐狸、野兔、野猪和熊时，事情也是一样。到最后，每位王子身后都跟了一大群小兽，一路踩着轻轻的脚步。
        - id: ch01-b04
          speaker: narrator
          text: >-
            傍晚，他们来到林中的一片空地。三条路在这里交会，路口长着三棵白桦树。大王子取出一支箭，射进一棵树的树干，又转身招呼两个弟弟。
        - id: ch01-b05
          speaker: eldest_prince
          text: >-
            我们马上要分头走了，先一人选一棵树，留下记号。以后谁回到这里，都要看看另外两棵树。箭痕里流出血，就说明那位兄弟已经死了。流出奶，就说明他还活着。
        - id: ch01-b06
          speaker: narrator
          text: >-
            两个弟弟都赞成。三个人各用箭在一棵白桦树上留下痕迹，随后问继妹，她愿意跟哪位哥哥一起生活。
        - id: ch01-b07
          speaker: step_sister
          text: >-
            我跟大哥走。
        - id: ch01-b08
          speaker: narrator
          text: >-
            三兄弟就此分手，各自带着兽伙伴走上一条路。继妹跟在大王子身边。他们走进另一片森林，在最幽深的空地上发现了一座城堡。那里面住着一伙强盗。
        - id: ch01-b09
          speaker: narrator
          text: >-
            王子上前敲门。门一开，群兽立刻冲进去。每只野兽都咬住一个强盗，把他杀死，再拖进地窖。可其中一个强盗只是受了重伤。他躺着一动不动，装得和死人没有两样。王子与继妹毫不知情，就在城堡里住了下来。

    - id: ch02
      title: 地窖里的强盗
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            第二天早晨，王子出门打猎。临走前，他嘱咐继妹，城堡里的房间都能进，只有堆着强盗尸体的地窖不能去。可他刚走，继妹就把警告忘了。她逛完别处，还是下到地窖，推开了门。那个受伤的强盗马上坐起身来。
        - id: ch02-b02
          speaker: robber
          text: >-
            别怕，只要听我的话，我就是你的朋友。嫁给我吧，你跟我在一起，会比跟着哥哥幸福得多。先去起居室的橱柜里拿三只瓶子。把第一瓶的药膏抹在我下巴上，我的伤就会好。再让我喝下第二瓶，我的身体就能复原。喝下第三瓶，我会变得比从前更强壮。
        - id: ch02-b03
          speaker: robber
          text: >-
            等你哥哥带着群兽回来，就夸他力气大，再问问他，要是你用结实的丝绳把他的两个大拇指绑在背后，他能不能挣开。等你发现他逃不了，就叫我出来。
        - id: ch02-b04
          speaker: narrator
          text: >-
            继妹照着强盗的吩咐做了。她替他治好伤，又让他恢复身体，变得比从前更强。哥哥回来后，她拿丝绳把他的两个大拇指绑在背后。王子只用力一挣，绳子便断了。
        - id: ch02-b05
          speaker: eldest_prince
          text: >-
            妹妹，这根绳子可绑不住我。
        - id: ch02-b06
          speaker: narrator
          text: >-
            第二天，王子又带着群兽去了森林。强盗叫继妹换一根粗得多的绳子。到了晚上，她再次把哥哥的拇指绑在背后。王子这回多费了些力气，可最后还是挣开了。
        - id: ch02-b07
          speaker: eldest_prince
          text: >-
            这一根也不够结实。
        - id: ch02-b08
          speaker: narrator
          text: >-
            第三天，王子答应做最后一次试验。继妹听从强盗的主意，早已备好一根极结实的丝绳。她把王子绑好后，王子拼命拉扯，却怎么也弄不断。
        - id: ch02-b09
          speaker: eldest_prince
          text: >-
            妹妹，这次的绳子真把我困住了。快来替我解开。
        - id: ch02-b10
          speaker: narrator
          text: >-
            继妹没有过去，反倒叫出了强盗。强盗挥着刀冲进屋里，眼看就要向王子下手。王子连忙请他稍等片刻。
        - id: ch02-b11
          speaker: eldest_prince
          text: >-
            给我一点时间。死以前，让我吹三声猎号吧。这间屋里一声，楼梯上一声，院子里再吹一声。
        - id: ch02-b12
          speaker: narrator
          text: >-
            强盗答应了。第一声号音才响，院子笼中的狐狸就醒过来，知道主人遇上了危险。它用尾巴扫过狼的眼睛，狼也醒了。它们接着唤醒狮子。狮子用尽力气撞向笼门，门板顿时碎了一地。所有野兽都冲出笼子，穿过院子去救主人。狐狸咬断王子背后的绳子，狮子扑倒强盗，把他杀死，撕成碎片。最后，每只野兽都叼走了一根骨头。
        - id: ch02-b13
          speaker: narrator
          text: >-
            王子回过身，面对自己的继妹。
        - id: ch02-b14
          speaker: eldest_prince
          text: >-
            我不会杀你，可我要把你留在这里悔过。等你的眼泪装满这只碗，我才会再来见你。
        - id: ch02-b15
          speaker: narrator
          text: >-
            他用铁链把继妹锁在墙边，又把一只大碗放在她面前。随后，王子唤上群兽，离开城堡，继续远游。

    - id: ch03
      title: 九头龙
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            王子走了不久，来到一家客店。店里每个人都满面愁容，他便问大家究竟出了什么事。
        - id: ch03-b02
          speaker: inn_guest
          text: >-
            唉，今天，我们国王的女儿就要死了。她会被送给一头可怕的九头龙。
          emotion: sad
        - id: ch03-b03
          speaker: eldest_prince
          text: >-
            公主为什么一定要死？我有的是力气，我去救她。
        - id: ch03-b04
          speaker: narrator
          text: >-
            王子赶到海边，恶龙会在那里带走公主。他带着群兽等了一阵，一支长长的队伍走了过来，护送着那位不幸的公主。到了岸边，所有人都悲伤地返回家中，把她独自留下。只有王子还守在那里。
        - id: ch03-b05
          speaker: narrator
          text: >-
            不久，远处的水面动了起来。那东西越来越近，王子终于看清，一头九个脑袋的巨龙正贴着水面飞快掠来。他和群兽商议好对策，等恶龙接近海岸，狐狸就把尾巴浸进海水，再猛地一扫，让咸涩的水花扑进恶龙眼中。熊和狮子也用爪子掀起更多海水。怪物被弄得昏头转向，什么都看不见。王子拔剑冲上去，杀死恶龙，群兽又将龙身撕成碎块。
        - id: ch03-b06
          speaker: narrator
          text: >-
            公主感谢王子救了自己的性命。她送给他一枚戒指，又送了半方自己的手帕。
        - id: ch03-b07
          speaker: princess
          text: >-
            请上马车吧。我们一起回我父王的宫殿。
        - id: ch03-b08
          speaker: narrator
          text: >-
            可是在回宫的路上，车夫和随从偷偷商量起来。
        - id: ch03-b09
          speakers: [coachman, footman]
          ensemble: duo
          text: >-
            何必把这个陌生人带回宫？杀了他，我们就能告诉国王，是我们杀掉恶龙，救了公主。这样，我们俩就能有一个娶她。
        - id: ch03-b10
          speaker: narrator
          text: >-
            两人杀死王子，把他的遗体丢在路边。忠实的群兽围了过来，一面流泪，一面发愁，不知道怎样才能救主人。忽然，狼想出一个办法。它跑进森林，找到一头牛，把牛咬死。随后，它叫狐狸守住死牛。如果有鸟儿飞下来啄肉，就要立刻捉住，送到狮子面前。
        - id: ch03-b11
          speaker: narrator
          text: >-
            没过多久，一只乌鸦落下来啄食牛肉。狐狸一下捉住它，带去交给狮子。
        - id: ch03-b12
          speaker: lion
          text: >-
            飞到那座有三口灵泉的城里去，用嘴衔回泉水，让这个死人重新活过来。你答应做到，我们就饶你一命。
        - id: ch03-b13
          speaker: narrator
          text: >-
            乌鸦立刻飞往城里，先后从疗伤泉、力量泉和迅捷泉中汲水。它飞回王子身边，把嘴里的泉水滴在他的唇上。王子的伤口愈合了。他坐起身，又站起来，已经能够行走。

    - id: ch04
      title: 真正杀死恶龙的人
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            王子带着忠实的群兽动身进城。他们来到王宫时，仆人们正在筹备一场盛宴。原来，公主马上就要嫁给车夫了。
        - id: ch04-b02
          speaker: narrator
          text: >-
            王子走进宫殿，径直来到车夫面前。
        - id: ch04-b03
          speaker: eldest_prince
          text: >-
            你说自己杀死恶龙，赢得公主为妻，有什么凭证？真正的信物在我这里，就是这枚戒指，还有公主的半方手帕。
        - id: ch04-b04
          speaker: narrator
          text: >-
            国王一见信物，就知道王子说的是真话。车夫被戴上镣铐，扔进监牢。王子娶了公主，国王还拿出半个王国来奖赏他。
        - id: ch04-b05
          speaker: narrator
          text: >-
            婚后没过多久，一天傍晚，王子带着群兽在森林里散步。天黑下来，他找不到回宫的路，只能在树木之间来回寻找。走着走着，他看见一团火光。循着亮光过去，只见一位老妇人站在林间空地上，把枯枝和干叶耙到一起焚烧。
        - id: ch04-b06
          speaker: narrator
          text: >-
            王子已经非常疲惫，夜色又很深。他不想继续乱走，便问能不能在老妇人的火堆旁过夜。
        - id: ch04-b07
          speaker: old_woman
          text: >-
            当然可以。只是你的野兽让我害怕。让我拿手杖在它们身上打一下，我就安心了。
        - id: ch04-b08
          speaker: eldest_prince
          text: >-
            好吧，我不介意。
        - id: ch04-b09
          speaker: narrator
          text: >-
            老妇人伸出手杖，逐个碰过那些野兽。眨眼之间，群兽全都变成了石头，王子也化作一尊石像。

    - id: ch05
      title: 巫婆的手杖
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            不久以后，小王子结束游历，回到三兄弟分别的路口。三棵带着箭痕的白桦树还在那里。他想起当初的约定，便绕着另外两棵树查看。大王子那棵树的伤口正在渗血。小王子明白，大哥一定死了。他带上自己的群兽，沿着大哥走过的路，来到大哥统治过的城里。大哥所娶的公主也住在这里。
        - id: ch05-b02
          speaker: narrator
          text: >-
            全城的人都在为王子失踪而悲伤。人们看见小王子和身后的群兽，还以为他们的王子回来了。他们欢喜地围上前，告诉他，大家找遍各处也没能找到他。国王也把小王子当成了自己的女婿，可公主知道，这个人并不是她的丈夫。
        - id: ch05-b03
          speaker: princess
          text: >-
            请带着你的兽伙伴去森林里找哥哥吧。不要停下来，直到把他找到。
        - id: ch05-b04
          speaker: narrator
          text: >-
            小王子听从了她的话。他在森林里四处寻找，也迷失了方向，直到黑夜降临。最后，他走进那片有火堆的空地，看见老妇人正在照料火焰。天色已经太晚，也太黑了，他便请求留在火边过夜。
        - id: ch05-b05
          speaker: old_woman
          text: >-
            当然可以。可我害怕你的野兽。让我用手杖轻轻碰它们一下吧，这样我就不怕了。
        - id: ch05-b06
          speaker: narrator
          text: >-
            小王子不知道她是巫婆，便答应了。老妇人伸出手杖。转眼间，王子和他所有的野兽都变成了石头。
        - id: ch05-b07
          speaker: narrator
          text: >-
            又过了不久，二王子也结束游历，回到了那个路口。他绕着白桦树查看，只见两个兄弟留下的箭痕都在向外淌血。二王子流下了眼泪。
        - id: ch05-b08
          speaker: second_prince
          text: >-
            唉，我的两个兄弟都死了。
          emotion: sad
        - id: ch05-b09
          speaker: narrator
          text: >-
            他带着群兽，赶往大哥曾经统治的城里。百姓也把他错认成失踪的王子，纷纷围过来，问他去了哪里，为什么一直不回家，随后又将他领进王宫。国王同样分辨不出，公主却知道，这不是自己的丈夫。两人单独相处时，她恳求二王子去寻找哥哥，把人带回家。
        - id: ch05-b10
          speaker: narrator
          text: >-
            二王子召集群兽，走进森林。他在树木之间寻找，又把耳朵贴到地面，想听听哥哥那些野兽的声音。远处似乎有一点微弱的声响，他却辨不出方向。于是，他吹响猎号，再俯身去听。这一次，声音像是从林中一团火光那边传来的。
        - id: ch05-b11
          speaker: narrator
          text: >-
            他循着火光走去，看见老妇人正在把树枝和枯叶耙进余烬。二王子请求在火堆旁过夜。老妇人说，她害怕他的野兽，要他先答应用手杖把它们逐个敲一遍。
        - id: ch05-b12
          speaker: second_prince
          text: >-
            不行。我才是它们的主人，除了我，谁也不能打它们。把那根手杖给我。
        - id: ch05-b13
          speaker: narrator
          text: >-
            老妇人交出了手杖。二王子用它碰了碰自己的狐狸，狐狸立刻变成石头。他这才明白，面前的老妇人是个巫婆。
        - id: ch05-b14
          speaker: second_prince
          text: >-
            马上让我的兄弟和他们的野兽全都恢复原样。不然，我的狮子会把你撕成碎片。
          emotion: angry
        - id: ch05-b15
          speaker: narrator
          text: >-
            巫婆吓坏了。她取来一棵小橡树，把它一直烧成雪白的灰，再将灰烬撒向空地周围的石头。眨眼之间，大王子和小王子活生生地站在兄弟面前，他们的群兽也恢复原样，围在三个人身边。
        - id: ch05-b16
          speaker: narrator
          text: >-
            三位王子带着所有兽伙伴，一同返回城里。到了宫中，国王怎么也分不清谁才是自己的女婿。公主却一眼认出了丈夫。于是，整个国度都欢庆起来。
