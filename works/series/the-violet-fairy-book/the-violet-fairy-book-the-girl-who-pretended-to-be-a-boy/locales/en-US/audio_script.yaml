  chapters:
    - id: ch01
      title: The Emperor's Three Daughters
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a conquering emperor who ruled more countries than anyone else in the world. Whenever he defeated a king, he offered peace on one condition. One of that king's sons had to serve him for ten years.
        - id: ch01-b02
          speaker: narrator
          text: On the edge of his lands stood another empire. Its ruler had been every bit as brave in his youth. Whenever war came, he had been the victor. But year after year passed. His mind grew tired of making plans for campaigns, while his people longed to stay at home and work their fields in peace. At last the old ruler saw more clearly each day that only one choice remained. He would have to pay homage and bow to his powerful neighbor.
        - id: ch01-b03
          speaker: narrator
          text: One thing held him back. The conqueror would demand a son, and the old emperor had no sons at all. He had only three daughters. Whichever way he looked, he saw ruin. He grew so gloomy that his daughters became frightened. Nothing they did could cheer him.
        - id: ch01-b04
          speaker: narrator
          text: One day at dinner, the eldest daughter gathered her courage and spoke.
        - id: ch01-b05
          speaker: eldest_princess
          text: Father, what sorrow are you hiding? Are your people unhappy with you? Have we displeased you? We would give our own blood to take those lines from your face. You know our lives are bound to yours.
        - id: ch01-b06
          speaker: old_emperor
          text: My daughter, you have never caused me a moment of pain. But you cannot help me now. Oh, why could not one of you have been a boy?
          emotion: sad
        - id: ch01-b07
          speaker: eldest_princess
          text: I do not understand. Tell us what has happened. We may not be boys, but that does not make us useless.
          emotion: surprised
        - id: ch01-b08
          speaker: old_emperor
          text: What can you do, my children? You have learned to spin, sew, and weave. I need a warrior now, a young giant strong enough to swing a battle-axe and strike deadly blows with a sword.
        - id: ch01-b09
          speaker: eldest_princess
          text: But why do you need a son now? Please tell us everything. Knowing cannot make the trouble worse.
        - id: ch01-b10
          speaker: old_emperor
          text: When I was young, no man brought an army against me without paying dearly. Now age has chilled my blood and taken my strength. Deer may roam safely from my arrows. Foreign soldiers may burn my houses and water their horses at my wells, and I cannot stop them. My day is over. I must bow beneath my enemy's yoke. But who will give him the ten years of service he demands from every defeated ruler?
          emotion: sad
        - id: ch01-b11
          speaker: eldest_princess
          text: I will!
        - id: ch01-b12
          speaker: narrator
          text: She sprang to her feet, but her father sadly shook his head.
        - id: ch01-b13
          speaker: eldest_princess
          text: I will never shame you. Let me go. I am a princess and an emperor's daughter.
        - id: ch01-b14
          speaker: old_emperor
          text: Then go.
        - id: ch01-b15
          speaker: narrator
          text: Joy nearly stopped the brave girl's heart. She could not stay still for a moment. She danced from chest to wardrobe, turning everything upside down as she gathered enough things for a year. She chose dresses embroidered with gold and precious stones and laid in a great supply of food. From the stable, she picked the most spirited horse of all. Its eyes flashed like flame, and its coat shone silver.
        - id: ch01-b16
          speaker: narrator
          text: Her father watched her prance around the courtyard in disguise. He advised her how to behave as the young man she seemed to be, and how to guard herself as the girl she truly was. He blessed her, and away she flew. Her silver armor dazzled everyone she passed. She rode so fast that she had to stop miles later and wait for her escort.
        - id: ch01-b17
          speaker: narrator
          text: None of the daughters knew that their father was a magician. Unseen, he hurried ahead and threw a copper bridge across a stream on her road. Then he became a wolf and waited under one of its arches.
        - id: ch01-b18
          speaker: narrator
          text: The emperor had chosen his moment well. About half an hour later, hoofbeats sounded along the road. The princess's horse was almost on the bridge when a great gray wolf sprang out in front of her. He showed his grinning teeth and gave a deep growl that froze her blood. Then he gathered himself to leap. The wolf appeared so suddenly that the princess could not move. Running away did not even enter her mind until her frightened horse jumped violently to one side. At last she turned him around, urged him to his greatest speed, and never drew rein until the palace gates rose before her.
        - id: ch01-b19
          speaker: narrator
          text: The old emperor had arrived long before her. He met her at the palace door and touched her shining armor.
        - id: ch01-b20
          speaker: old_emperor
          text: Did I not tell you, my child? Flies do not make honey.
        - id: ch01-b21
          speaker: narrator
          text: The days passed. One morning, the second princess begged for permission to try the same adventure in which her sister had failed. Her father listened unwillingly. He felt certain that sending her would do no good, but she pleaded so earnestly that at last he consented. She chose her weapons and rode away. Unlike her elder sister, she knew the wolf would be waiting when she reached the copper bridge. She prepared herself for his appearance. Even so, the moment she saw him, her courage left her. She turned at once and raced back as fast as her horse could carry her.
        - id: ch01-b22
          speaker: narrator
          text: Still trembling, she knelt before her father on the castle steps. He spoke gently to her.
        - id: ch01-b23
          speaker: old_emperor
          text: Did I not tell you, my child? Not every bird is caught in a net.
    - id: ch02
      title: The Youngest Princess and the Old Horse
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: For a little while after the two failures, all three daughters stayed quietly in the palace. They returned to embroidery, spinning, and weaving. They tended their birds and cared for the flowers, and no one spoke of another journey. Then, early one morning, the youngest princess left those peaceful tasks behind and entered her father's private rooms.
        - id: ch02-b02
          speaker: youngest_princess
          text: Father, now it is my turn. Perhaps I can defeat that wolf.
        - id: ch02-b03
          speaker: old_emperor
          text: You think you are braver than your sisters, you vain little thing? You have hardly grown out of your baby clothes.
        - id: ch02-b04
          speaker: narrator
          text: She did not care that he laughed at her.
        - id: ch02-b05
          speaker: youngest_princess
          text: For you, Father, I would cut the devil into pieces, or even turn into a devil myself. I believe I can succeed. If I fail, I will come home with no more shame than my sisters did.
        - id: ch02-b06
          speaker: narrator
          text: The emperor still hesitated. She coaxed and petted him until he finally gave in.
        - id: ch02-b07
          speaker: old_emperor
          text: Well, if you must go, then go. I doubt I shall gain anything except a good laugh when you return with your head bowed and your eyes on the ground.
        - id: ch02-b08
          speaker: youngest_princess
          text: The one who laughs last laughs best.
        - id: ch02-b09
          speaker: narrator
          text: Once she had won his permission, the princess decided to begin by finding a white-haired boyar whose advice she could trust. She also meant to choose her horse with the greatest care. She went straight to the royal stables, where the most beautiful horses in the empire stood feeding in their stalls. She looked at one after another, but none seemed right for her journey. Almost in despair, she came to the very last stall. There, stretched sadly on the straw, lay her father's ancient war-horse, as old and worn as his master.
        - id: ch02-b10
          speaker: narrator
          text: Tears filled her eyes as she looked at him. The horse lifted his head and gave a soft neigh.
        - id: ch02-b11
          speaker: old_horse
          text: You have a gentle heart, but I know you pity me because you love your father. Ah, what a warrior he was! What days we shared together. Now I am old, too, and my master has forgotten me. Why should anyone care whether my coat shines? Still, it is not too late. Give me proper care, and in one week I can match any horse in these stables.
        - id: ch02-b12
          speaker: youngest_princess
          text: What care do you need?
        - id: ch02-b13
          speaker: old_horse
          text: Rub me down with rainwater every morning and evening. Boil my barley in milk because my teeth are bad, and wash my feet with oil.
        - id: ch02-b14
          speaker: youngest_princess
          text: I would like to try. Perhaps you can help me with my plan.
        - id: ch02-b15
          speaker: old_horse
          text: Try it, mistress. I promise you will not regret it.
        - id: ch02-b16
          speaker: narrator
          text: A week later, the horse woke with a shiver running through every limb. When it passed, his skin shone like a mirror, his body was round as a watermelon, and he moved as lightly as a mountain goat. The princess came early to the stable, and he greeted her with joy.
        - id: ch02-b17
          speaker: old_horse
          text: May success wait at my master's daughter's door. You have given me back my life. Tell me what you need, Princess, and I will do it.
          emotion: happy
        - id: ch02-b18
          speaker: youngest_princess
          text: I must go to our overlord, but I have no adviser. Which white-haired boyar should I choose?
        - id: ch02-b19
          speaker: old_horse
          text: With me, you need no one else. I will serve you as I served your father, if you promise to follow my advice.
        - id: ch02-b20
          speaker: youngest_princess
          text: I will follow every word. Can you leave in three days?
        - id: ch02-b21
          speaker: old_horse
          text: I can leave this very moment.
        - id: ch02-b22
          speaker: narrator
          text: Her preparations were simple. She packed a boy's clothes, a little linen and food, and some money for need. Then she said farewell to her father and rode away.
    - id: ch03
      title: Three Bridges and a Dragon
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: After a day's journey, the princess neared the copper bridge. Before it came into sight, the magical horse warned her how her father meant to test her courage.
        - id: ch03-b02
          speaker: narrator
          text: The warning did not stop her trembling when an enormous wolf bounded toward her, howling. He was thin as though he had eaten nothing for a month. His claws were like saws, and his mouth gaped as wide as an oven. For one moment, her heart failed. Then she touched her horse with the spur and drew her sword, ready to take off the wolf's head with one blow.
        - id: ch03-b03
          speaker: narrator
          text: The wolf saw the blade and shrank away. That was wise, for now the light of battle burned in the girl's eyes. Without looking back, she crossed the bridge.
        - id: ch03-b04
          speaker: narrator
          text: Proud of her first victory, the emperor took a shorter road and went ahead again. At the end of the next day's journey, he found a river, cast a silver bridge across it, and changed himself into a lion. Once more, the horse guessed what danger was coming and explained how the princess could escape it. But advice is one thing when you hear it in comfort, with danger still far away. Carrying it out while something terrible is bearing down on you is quite another.
        - id: ch03-b05
          speaker: narrator
          text: The wolf had frightened her, but beside this lion he seemed like a lamb. The lion roared until the trees shook, and each claw looked as large as a curved sword. The princess gasped for breath. Her feet rattled in the stirrups. Then she remembered how the wolf had fled. She raised her sword and charged so fiercely that the lion barely sprang aside in time. In a flash, she crossed the silver bridge.
        - id: ch03-b06
          speaker: narrator
          text: All her life, the princess had been guarded so carefully that she had never gone beyond the palace gardens. Now, for the first time, she saw the wide world. Hills rose around her and valleys opened below. Clear streams tinkled over their stones. Larks and blackbirds sang above fields bright with flowers. Wonder and delight nearly carried her away. She wanted to climb down, bathe her face in the clear pools, and gather the brilliant blossoms. The horse told her no. He quickened his pace and kept straight on, never turning right or left.
        - id: ch03-b07
          speaker: old_horse
          text: A warrior rests only after the victory. One battle remains, and it will be the hardest.
        - id: ch03-b08
          speaker: narrator
          text: At the end of the third day, no wolf or lion waited for her. A twelve-headed dragon lay before a golden bridge. At first she saw nothing. Then smoke and flame burst from beneath her feet. She looked down and saw the monster twisting there, all twelve heads raised to seize her.
        - id: ch03-b09
          speaker: narrator
          text: The reins dropped from her hand, and the sword she had begun to draw slipped back into its sheath. The horse told her not to fear. With a great effort, she sat upright and drove him straight at the dragon.
        - id: ch03-b10
          speaker: narrator
          text: They fought for an hour, and the dragon pressed her hard. At last she struck sideways and cut off one of its heads. The dragon roared as if the sky had split in two. It fell to the earth and rose again as a man.
        - id: ch03-b11
          speaker: narrator
          text: The horse had told her the dragon was her father, but she had hardly believed him. She stared at the change in amazement. Her father threw his arms around her and held her close.
        - id: ch03-b12
          speaker: old_emperor
          text: Now I know you are as brave as the bravest and as wise as the wisest. You chose the right horse. Without him, you would have returned with bowed head and lowered eyes. You have given me hope that you can finish what you began. Remember all my advice, and above everything, listen to your horse.
        - id: ch03-b13
          speaker: narrator
          text: The princess knelt for his blessing. Then father and daughter went their separate ways.
    - id: ch04
      title: The Two Genii and Sunlight
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The princess rode on until she reached the mountains that hold up the roof of the world. There she found two Genii who had fought savagely for two years. Neither had gained the smallest advantage. They saw only a young man in search of adventure, and both called to her.
        - id: ch04-b02
          speaker: first_genius
          text: Fet-Fruners, save me from my enemy! I will give you a horn whose call can be heard three days' journey away.
        - id: ch04-b03
          speaker: second_genius
          text: Fet-Fruners, help me defeat this pagan thief! I will give you my horse, Sunlight.
        - id: ch04-b04
          speaker: narrator
          text: Before she answered, the princess asked her horse which offer to take. He told her to help Sunlight's master. Sunlight was his younger brother and even swifter than he was.
        - id: ch04-b05
          speaker: narrator
          text: The princess attacked the other genius at once and soon split his skull. The victor invited her home so he could give her Sunlight as he had promised.
        - id: ch04-b06
          speaker: narrator
          text: The genius's mother rejoiced to see her son safe. She prepared her finest room for his exhausted guest. The princess said she must first settle her horse in the stable, but that was only an excuse to ask him for advice.
        - id: ch04-b07
          speaker: narrator
          text: From the first moment, the old woman suspected that the young rescuer was really a girl in disguise. She told her son that this was exactly the wife he needed. He laughed at her. What woman, he asked, could swing a saber that way? His mother would not yield.
        - id: ch04-b08
          speaker: narrator
          text: That night, the old woman laid a handful of magic flowers on each pillow. These flowers faded when a man touched them, but stayed fresh forever in a woman's hand. She thought this would prove her suspicion. It was a clever test, but the horse had already warned the princess what to expect. The princess waited until the whole house was silent. Then she rose, crept softly into the genius's room, and exchanged the fresh flowers from her own hand for his faded ones. She slipped back into her room, lay down again, and fell fast asleep.
        - id: ch04-b09
          speaker: narrator
          text: At dawn, the old woman hurried to her son and found dead flowers in his hand, just as she expected. Beside the sleeping princess, she found another withered bunch. Still she did not believe the guest was a man. She and her son planned a second test.
        - id: ch04-b10
          speaker: narrator
          text: After breakfast, the genius offered his guest his arm and led her into the garden. As they walked among the flowers, he kept urging her to pick any she liked. The princess sensed a trap.
        - id: ch04-b11
          speaker: youngest_princess
          text: Why are we wasting good hours among flowers? We are men. We should be in the stables caring for our horses.
        - id: ch04-b12
          speaker: narrator
          text: The genius told his mother she was plainly mistaken. His rescuer was certainly a man. The old woman remained unconvinced and proposed one final trial.
        - id: ch04-b13
          speaker: narrator
          text: The old woman said she would try once more. Her son must take the visitor into the armory and offer any weapon there. The room held every kind of weapon used anywhere in the world. Some were plain and bare. Others glittered with precious stones. The princess studied them closely. She felt the edges and tested the points, then chose an old sword with a curved blade. It was the sort of weapon that would have done honor to an ancient warrior. After buckling it to her belt, she announced that she would leave early the next day and take Sunlight with her. The mother could do nothing but accept it, though she still held firmly to her opinion.
        - id: ch04-b14
          speaker: narrator
          text: The princess mounted Sunlight and touched him with her spur. Her old horse galloped beside them and spoke.
        - id: ch04-b15
          speaker: old_horse
          text: Mistress, you have followed my advice until now, and all has gone well. Listen once more. I am old, and now that another can take my place, I admit that I may not have strength for what lies ahead. Let me go home. Continue with my brother, and trust him as you trusted me. You will not regret it. Wisdom came early to Sunlight.
        - id: ch04-b16
          speaker: youngest_princess
          text: My old comrade, you have served me well. Every victory I have won came through your help. It grieves me to say goodbye, but I will obey you once more and heed your brother as I heeded you. First, I need proof that he loves me as you do.
          emotion: sad
        - id: ch04-b17
          speaker: sunlight
          text: How could I not love you? How could I not be proud to serve such a warrior? Trust me, mistress. You will never have cause to regret my brother's absence. Trouble waits on our road, but we will meet it together.
        - id: ch04-b18
          speaker: narrator
          text: With tears in her eyes, the princess parted from the old horse. He galloped home to her father.
        - id: ch04-b19
          speaker: narrator
          text: Only a few miles farther on, she saw a golden curl in the road. She stopped and asked Sunlight whether to pick it up.
        - id: ch04-b20
          speaker: sunlight
          text: Take it, and you will regret it. Leave it, and you will regret that, too. So take it.
        - id: ch04-b21
          speaker: narrator
          text: She dismounted, picked up the curl, and wound it safely around her neck. They crossed hills and mountains and rode through valleys, leaving forests and flowered fields behind. At last they reached the overlord's court.
    - id: ch05
      title: The Golden-Haired Captive
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The overlord sat on his throne among the sons of defeated emperors, who served him as pages. The young men welcomed their new companion and wondered why they liked him at once. The princess had no time to talk or hide her fear. She was led to the throne and quietly explained why she had come.
        - id: ch05-b02
          speaker: narrator
          text: The emperor received her kindly. He said he was fortunate to gain so brave and charming a vassal and ordered Fet-Fruners to attend him personally. She took great care around the other pages, whose habits she disliked.
        - id: ch05-b03
          speaker: narrator
          text: One day, the princess amused herself by making sweetmeats. While she worked, two of the young princes looked in to visit their new companion. She welcomed them and offered some of the food already set out on the table. The princes had eaten many royal meals, but they thought these sweets wonderfully good. They enjoyed every mouthful and even licked their fingers so that not one morsel would be lost.
        - id: ch05-b04
          speakers: [first_page, second_page]
          ensemble: duo
          text: That was the finest supper we have ever eaten!
          emotion: happy
        - id: ch05-b05
          speaker: narrator
          text: Of course, the two princes did not keep their discovery secret. They hurried to tell every other page that they had just eaten the best supper of their lives. From that moment, the princess had no peace. The young men followed her and pleaded until she promised to cook a full dinner for them all. Then, on the very day chosen for the feast, every cook in the palace became drunk. There was no one in the kitchen sober enough even to make up the fire. When the pages heard this dreadful news, they rushed to their companion and begged her to save their dinner.
        - id: ch05-b06
          speaker: narrator
          text: The princess was fond of cooking, and she was too good-natured to refuse. She tied on an apron and went down to the kitchen without delay. Soon the entire dinner stood ready. When the dishes reached the emperor's table, he found them so delicious that he ate much more than was good for him. The taste stayed in his mind. As soon as he woke the next morning, he sent for the head cook and ordered him to serve exactly the same dishes again. Fear seized the cook. He knew he could never obey that command, so he dropped to his knees and confessed the truth.
        - id: ch05-b07
          speaker: head_cook
          text: Mighty Emperor, it was not I who cooked that dinner. Fet-Fruners prepared every dish.
          emotion: fearful
        - id: ch05-b08
          speaker: narrator
          text: The emperor was too astonished even to scold him. While he considered this news, some pages entered with another tale. They claimed the newcomer had boasted of knowing where the famous Iliane could be found. She was the golden-haired woman celebrated in the song that begins, "Golden Hair, the fields are green." The pages declared that Fet-Fruners even carried one of her curls around his neck, and that they knew it for a fact.
        - id: ch05-b09
          speaker: narrator
          text: The emperor ordered the page brought before him. As soon as the princess arrived, he confronted her.
        - id: ch05-b10
          speaker: overlord
          text: Fet-Fruners, you hid the fact that you knew golden-haired Iliane. Why? I have treated you better than any of my pages.
        - id: ch05-b11
          speaker: narrator
          text: He made her show him the golden curl.
        - id: ch05-b12
          speaker: overlord
          text: Listen well. Find the owner of this lock and bring her to me by any means you can. If you fail, I will have your head cut off where you stand. Now go!
          emotion: angry
        - id: ch05-b13
          speaker: narrator
          text: The poor girl tried to explain how she had found the hair, but the emperor refused to hear her. She bowed low, left him, and hurried to Sunlight. His first words lifted her spirits.
        - id: ch05-b14
          speaker: sunlight
          text: Do not be afraid, mistress. Last night my brother came to me in a dream. A genius carried Iliane away, and the curl you found is hers. Before she will marry him, she demands her whole herd of mares as a gift. He is half mad with love and thinks of nothing but catching them. While he tries, she remains safe in a palace among the island swamps of the sea. Ask the emperor for twenty ships loaded with precious goods. I will tell you the rest when the time comes.
          emotion: calm
        - id: ch05-b15
          speaker: narrator
          text: The princess went back to the throne at once.
        - id: ch05-b16
          speaker: youngest_princess
          text: Long life to you, mighty Sovereign. I can obey your command if you give me twenty ships and fill them with the richest merchandise in your kingdom.
        - id: ch05-b17
          speaker: overlord
          text: Bring me golden-haired Iliane, and everything I own is at your disposal.
        - id: ch05-b18
          speaker: narrator
          text: The emperor's people soon made all twenty ships ready and loaded them with the finest wares in the kingdom. The princess chose the largest and most beautiful vessel for herself and went aboard with Sunlight at her side. The sailors spread the sails, and the voyage began. For seven full weeks, the wind blew steadily and carried the fleet straight toward the west. Then, early one morning, the island swamps of the sea finally rose into view.
        - id: ch05-b19
          speaker: narrator
          text: They anchored in a small bay. Before going ashore, the princess tied tiny golden slippers set with jewels to her belt. She mounted Sunlight and rode until she found several palaces built on hinges, each turning to face the sun.
        - id: ch05-b20
          speaker: narrator
          text: Three slaves guarded the grandest palace. Their greedy eyes fixed on the shining slippers, and they hurried toward the stranger.
        - id: ch05-b21
          speaker: first_slave
          text: Who are you, and what brings you here?
        - id: ch05-b22
          speaker: youngest_princess
          text: I am a merchant. I lost my road and somehow wandered into the island swamps of the sea.
        - id: ch05-b23
          speaker: narrator
          text: The guards did not know whether they could admit him. They went to their mistress and described the visitor and the slippers. Iliane had already seen the merchant from the palace roof. Her captor was away, still trying to catch her mares, so she was free for the moment.
        - id: ch05-b24
          speaker: narrator
          text: The slaves described the stranger and the jeweled slippers so eagerly that Iliane insisted on going down to the shore and seeing them herself. When she arrived, she found them even lovelier than she had expected. The merchant told her that the ships held other slippers finer still and begged her to come aboard to inspect them. Iliane knew her captor was away. Her curiosity was stronger than her caution, and she agreed to go.
        - id: ch05-b25
          speaker: narrator
          text: Once aboard the great ship, Iliane forgot everything except the treasures spread before her. She turned over one precious object after another, examining each new wonder. While she was busy, the crew quietly spread the sails. Iliane did not notice that the ship had left the bay or that the wind was driving it swiftly over the sea. By the time she understood, the island lay behind them. In her heart, she rejoiced at her escape. For anyone watching, though, she wept and lamented as if a merchant had carried her off into captivity for the second time. And so the ships returned to the emperor's court.
        - id: ch05-b26
          speaker: narrator
          text: They had reached the emperor's country and were just about to land when the mother of Iliane's captor appeared behind them. She had learned that Iliane had fled with a merchant. Since her son was still away, she had taken up the pursuit herself. The terrible old woman strode across the blue water, hopping from wave to wave. One foot seemed to reach heaven while the other planted itself in the foam. She was almost at their heels when they stepped ashore, and fire and flame poured from her mouth.
        - id: ch05-b27
          speaker: narrator
          text: Iliane recognized the horrible old woman and whispered to her companion. Without a word, the princess swung Iliane into Sunlight's saddle, leaped up behind her, and flew away.
        - id: ch05-b28
          speaker: narrator
          text: Near the town, the princess bent down and asked Sunlight what to do.
        - id: ch05-b29
          speaker: sunlight
          text: Reach into my left ear. Take the sharp stone you find there and throw it behind us.
        - id: ch05-b30
          speaker: narrator
          text: She obeyed, and a huge mountain rose at their backs. The old woman climbed it. Fast as Sunlight ran, she ran faster.
        - id: ch05-b31
          speaker: narrator
          text: Her steps came closer and closer. Again the princess asked for help.
        - id: ch05-b32
          speaker: sunlight
          text: Reach into my right ear. Throw the brush behind us.
        - id: ch05-b33
          speaker: narrator
          text: A forest sprang up, so thick that even a wren could not pass through its leaves. The old woman seized the branches and swung from one to another like a monkey. Still she gained on them, until the flames from her mouth singed their hair.
        - id: ch05-b34
          speaker: narrator
          text: In despair, the princess asked if anything more could save them.
        - id: ch05-b35
          speaker: sunlight
          text: Quickly! Pull the betrothal ring from Iliane's finger and throw it behind us.
        - id: ch05-b36
          speaker: narrator
          text: The princess tore the ring from Iliane's finger and cast it behind them. At once, a great stone tower rose from the earth. Its walls were smooth as ivory and hard as steel, and its top reached all the way to heaven. The old woman howled with rage when she saw that she could not climb it or force her way through. Yet she was not beaten. She gathered herself for one tremendous leap and landed on the very top of the tower. She came down in the center of Iliane's ring, which closed around her and held her fast. Only her claws could be seen gripping the battlements.
        - id: ch05-b37
          speaker: narrator
          text: She struggled with all her power. Her fiery breath never reached the fugitives, though it burned a hundred miles of country around the tower like a volcano. With one last effort, her hands lost their hold. She fell to the foot of the tower and broke into pieces.
        - id: ch05-b38
          speaker: narrator
          text: Following Sunlight's advice, the princess rode back. As the tower slowly sank into the earth, she placed Iliane's finger on its top. In an instant, the tower vanished as if it had never existed. The ring was once again around Iliane's finger.
    - id: ch06
      title: Iliane's Mares
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: The emperor welcomed Iliane with every honor she deserved. He also fell in love with her at first sight. Iliane was not pleased. She walked sadly through the palace and gardens, wondering why other girls could choose their own lives while she was always held by someone she hated.
        - id: ch06-b02
          speaker: narrator
          text: When the emperor asked her to share his throne, she gave him an answer.
        - id: ch06-b03
          speaker: iliane
          text: Noble Sovereign, I cannot consider marriage until my herd of horses is brought to me with every piece of its harness.
        - id: ch06-b04
          speaker: narrator
          text: The emperor summoned Fet-Fruners again.
        - id: ch06-b05
          speaker: overlord
          text: Fetch Iliane's mares at once, with all their harness. If you do not, you will pay with your head.
        - id: ch06-b06
          speaker: youngest_princess
          text: Mighty Emperor, I kiss your hands. I have only just returned from carrying out your command. Now you give me another quest and risk my head on it, though your court is full of brave young men longing to prove themselves. People call you just. Why not send one of them? And where am I even to look for these mares?
        - id: ch06-b07
          speaker: overlord
          text: How should I know? They may be anywhere in heaven or on earth. Wherever they are, you must find them.
        - id: ch06-b08
          speaker: narrator
          text: The princess bowed and went to Sunlight. He heard her story and told her what to do.
        - id: ch06-b09
          speaker: sunlight
          text: Bring me nine buffalo hides at once. Cover them thickly with tar and lay them over my back. Do not fear. You will succeed again. In the end, the emperor's own desires will destroy him.
          emotion: calm
        - id: ch06-b10
          speaker: narrator
          text: The hides were quickly found, and they set out. The road was long and hard. At last they reached the meadow where the mares grazed. Iliane's captor wandered nearby, still trying to catch them. He believed she remained safely locked in his palace.
        - id: ch06-b11
          speaker: narrator
          text: As soon as the princess saw the genius, she rode straight up to him. She told him that Iliane had escaped from the turning palace. Then she told him how his mother had chased the fugitives and had died in her effort to drag Iliane back. At that news, a blind fury took possession of him. He forgot the mares and every other thought. Drawing his weapon, he rushed wildly upon the princess. She did not retreat. She waited for his attack with perfect calm.
        - id: ch06-b12
          speaker: narrator
          text: He charged with his saber held high. Sunlight bounded over his head, and the blade struck nothing. When the princess swung in return, Sunlight dropped to his knees, guiding her sword into the genius's thigh.
        - id: ch06-b13
          speaker: narrator
          text: The fight raged so fiercely that the earth seemed ready to give way beneath them. For twenty miles around, every beast in the forests fled to its cave for shelter. Neither fighter would yield. At last the princess's strength was almost gone. Then the genius lowered his sword for a single instant. She saw the opening, swept her own blade through the air, and severed his head from his body. The long struggle had left her trembling, but she turned away and went toward the meadow where Iliane's mares were feeding.
        - id: ch06-b14
          speaker: narrator
          text: At Sunlight's instruction, she kept out of sight and climbed a thick tree. From there she could see and hear without being seen. Sunlight neighed. The mares galloped over to inspect the newcomer. Only one stayed apart. That horse disliked strangers and thought the herd needed no one new.
        - id: ch06-b15
          speaker: narrator
          text: Sunlight stood his ground, quite pleased by all the attention from the mares. The unfriendly horse watched him for a time, then suddenly charged. It sank its teeth into Sunlight with such force that, without the nine tarred buffalo hides, his final moment would have come. The horses fought until every one of those hides had been torn to ribbons. When it was over, Sunlight still stood, while the beaten horse lay twisting with pain upon the grass.
        - id: ch06-b16
          speaker: narrator
          text: Nothing remained except to drive the entire herd back to the emperor's court. The princess climbed down from her hiding place and mounted Sunlight. As he moved away, all the mares followed meekly behind him. The horse that had attacked him was too sore to keep up with the others and came slowly at the rear. When they reached the palace, the princess guided every animal safely into a yard. Only then did she go inside and announce to the emperor that she had returned with Iliane's herd.
        - id: ch06-b17
          speaker: narrator
          text: Word reached Iliane at once. She ran down and called every mare by name. The moment the wounded one saw her, it shook itself. Its wounds disappeared, leaving no mark on its shining coat.
        - id: ch06-b18
          speaker: narrator
          text: The emperor joined Iliane in the yard. At her request, he ordered the mares milked so the two of them could bathe in the milk and remain young forever. The animals would let no one approach them. Once again, the emperor commanded Fet-Fruners to do the work.
        - id: ch06-b19
          speaker: narrator
          text: The girl's heart swelled inside her. The hardest task was always handed to her, and she thought that long before her ten years of service were over, she would be worn out and useless. While these thoughts filled her mind, a fearful rain began to fall, heavier than any rain people could remember. Water rose around the herd until it reached the mares' knees. Then the storm stopped as suddenly as it had begun. In the same moment, all the water turned to ice and held the animals firmly where they stood. The princess's heart became light again. She sat down cheerfully and milked every mare as easily as though she had done the work each morning of her life.
    - id: ch07
      title: The Holy Water and the Last Laugh
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: The emperor loved Iliane more each day, but she paid no attention to him. She always found another reason to delay their wedding. At last she ran out of excuses.
        - id: ch07-b02
          speaker: iliane
          text: Grant me only one more request, Sire, and then I truly will marry you. You have waited so patiently.
        - id: ch07-b03
          speaker: overlord
          text: My beautiful dove, I am yours, and so is everything I possess. Ask what you wish, and it shall be done.
        - id: ch07-b04
          speaker: iliane
          text: Then bring me a flask of holy water from the little church beyond the river Jordan, and I will become your wife.
        - id: ch07-b05
          speaker: narrator
          text: The emperor ordered Fet-Fruners to ride to the Jordan at once and return with the holy water, whatever it cost. As the princess saddled Sunlight, he spoke to her.
        - id: ch07-b06
          speaker: sunlight
          text: Mistress, this is your last and hardest task. Do not fear. The emperor's hour has come.
          emotion: calm
        - id: ch07-b07
          speaker: narrator
          text: They started out, and the magical horse told her exactly where to find the water.
        - id: ch07-b08
          speaker: sunlight
          text: The holy water stands in a flask on the altar of a little church beyond the Jordan. A company of nuns guards it, and they never sleep, either by night or by day. From time to time, a hermit comes to visit them and teach them certain things they need to know. Whenever he comes, all but one of the nuns gather around him, leaving a single guard at the church. If fortune brings us there at that moment, we may take the flask at once. If not, we must wait for the hermit, no matter how long his coming takes. There is no other way to obtain the water.
        - id: ch07-b09
          speaker: narrator
          text: At last the little church beyond the Jordan came into view. To their great joy, the princess and Sunlight saw the hermit arriving at its door at that very moment. They heard him call the nuns around him. One after another, the women left the church and settled beneath a tree, with the hermit seated in their midst. Only one nun stayed behind. She remained at the entrance to guard the holy water, just as their custom required.
        - id: ch07-b10
          speaker: narrator
          text: The hermit had much to say, and the day was very hot. Tired of sitting alone, the guard lay across the threshold and fell asleep. Sunlight told the princess what to do.
        - id: ch07-b11
          speaker: narrator
          text: The princess stepped softly over the sleeping nun and entered the church. She crept like a cat along the dark aisle, moving one careful pace at a time. Her fingers stayed against the wall so she would not trip over some unseen object and ruin everything with a noise. In this way, she reached the altar safely. The flask of holy water stood exactly where Sunlight had said it would. She pushed it securely inside her clothes, crept back with the same care, stepped once more over the guard, and sprang into the saddle with a bound.
        - id: ch07-b12
          speaker: youngest_princess
          text: Home, Sunlight! Carry me as fast as your legs can run!
        - id: ch07-b13
          speaker: narrator
          text: The sound of Sunlight's flying hoofs woke the nun at the door. She understood at once that the precious treasure had been stolen. Her shrieks were so loud and piercing that all the other nuns came running to learn what had happened, and the hermit followed close behind them. He saw that it was impossible to overtake the thief. So he fell to his knees and called down the deadliest curse he knew. If the thief was a man, he prayed that the man should become a woman. If the thief was a woman, she should become a man. In either case, the hermit believed the punishment would be severe.
        - id: ch07-b14
          speaker: narrator
          text: People do not always agree about punishments. The princess suddenly felt herself become the man she had only pretended to be. She was delighted. If the hermit had been close enough, she would have thanked him with all her heart.
        - id: ch07-b15
          speaker: narrator
          text: By the time Fet-Fruners reached court, everyone saw a young man before them. Even the genius's suspicious mother would have been satisfied. He drew the flask from his tunic and held it up.
        - id: ch07-b16
          speaker: youngest_princess
          text: All hail, mighty Sovereign! I have completed this task as well. I hope it is the last one you have for me. Let someone else take a turn now.
        - id: ch07-b17
          speaker: overlord
          text: I am satisfied, Fet-Fruners. When I die, you will inherit my throne, for I have no son. If a son is born to me and my greatest wish comes true, you will stand at his right hand and guide him with your wisdom.
        - id: ch07-b18
          speaker: narrator
          text: The emperor was satisfied, but Iliane was not. She had watched him send Fet-Fruners from one danger to another, and now she meant to punish him for it. As for the flask of holy water, she thought common courtesy should have made her suitor fetch it himself. He could have made the journey without any danger at all, yet once again he had risked Fet-Fruners instead.
        - id: ch07-b19
          speaker: narrator
          text: Iliane ordered the great bath filled with her mares' milk. She asked the emperor to dress in white and enter it with her. He accepted joyfully. When the milk reached their necks, she sent for the horse that had fought Sunlight and gave it a secret sign.
        - id: ch07-b20
          speaker: narrator
          text: The horse understood Iliane's secret signal. It turned toward the two figures standing neck-deep in the mares' milk. From one nostril, the animal breathed fresh, cool air over Iliane. From the other nostril, it snorted a burning wind upon the emperor. The heat shriveled him where he stood. In a moment, nothing remained of the great conqueror except a little heap of ashes in the bath.
        - id: ch07-b21
          speaker: narrator
          text: No one could explain his strange death. News of it swept through the country, and his people gave him the grandest funeral ever known. When it was over, Iliane summoned Fet-Fruners.
        - id: ch07-b22
          speaker: iliane
          text: Fet-Fruners, you brought me here and saved my life. You obeyed my wishes and restored my mares. You killed the genius and his witch of a mother. You brought me the holy water. You, and no one else, will be my husband.
        - id: ch07-b23
          speaker: youngest_princess
          text: Yes, I will marry you. But understand this. In our house, the cock will crow, not the hen!
