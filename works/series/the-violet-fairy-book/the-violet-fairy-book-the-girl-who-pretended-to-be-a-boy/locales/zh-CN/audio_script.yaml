audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 编者
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清晰的成年男声
        pace: 从容舒展
        pitch: 中低音
    old_emperor:
      display_name: 老皇帝
      tts:
        delivery: 威严中带着衰老后的忧虑与慈爱
        timbre: 苍劲浑厚的老年男声
        pace: 稍慢
        pitch: 低音
    eldest_princess:
      display_name: 长公主
      tts:
        delivery: 真诚勇敢，却缺少临危的沉着
        timbre: 清亮端庄的年轻女声
        pace: 适中
        pitch: 中高音
    youngest_princess:
      display_name: 小公主费特·弗鲁纳斯
      tts:
        delivery: 坚定机敏，历险中渐显沉着英武
        timbre: 清澈柔韧的年轻女声
        pace: 适中
        pitch: 中音
    old_horse:
      display_name: 老战马
      tts:
        delivery: 忠诚睿智，劝告时稳重恳切
        timbre: 温厚略显苍老的男声
        pace: 从容
        pitch: 中低音
    first_spirit:
      display_name: 号角的主人
      tts:
        delivery: 激烈急切，带着久战不休的疲惫
        timbre: 粗犷有力的成年男声
        pace: 稍快
        pitch: 中低音
    second_spirit:
      display_name: 阳光的主人
      tts:
        delivery: 豪迈直率，许诺时郑重爽快
        timbre: 洪亮坚实的成年男声
        pace: 适中
        pitch: 中低音
    spirit_mother:
      display_name: 精灵的母亲
      tts:
        delivery: 多疑精明，盛怒时凶狠尖厉
        timbre: 干涩锐利的老年女声
        pace: 适中
        pitch: 中高音
    sunlight:
      display_name: 阳光
      tts:
        delivery: 年轻自信，忠诚而富有智慧
        timbre: 明朗有力的年轻男声
        pace: 适中
        pitch: 中音
    suzerain_emperor:
      display_name: 宗主皇帝
      tts:
        delivery: 表面和善，发号施令时专横冷酷
        timbre: 饱满威严的成年男声
        pace: 稍慢
        pitch: 低音
    servant:
      display_name: 宫殿守卫
      tts:
        delivery: 谨慎而贪婪，见到宝物便格外殷勤
        timbre: 普通清楚的成年男声
        pace: 适中
        pitch: 中音
    ilyana:
      display_name: 金发伊利亚娜
      tts:
        delivery: 高贵克制，忧伤中藏着坚定主见
        timbre: 明丽柔和的年轻女声
        pace: 适中
        pitch: 中高音
    hermit:
      display_name: 隐士
      tts:
        delivery: 庄严严厉，诅咒时愤怒决绝
        timbre: 苍老洪亮的男声
        pace: 稍慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 三位公主
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前有一位皇帝，打过的胜仗数也数不清，征服的国家比谁都多。每攻下一个王国，他只答应按一个条件议和：战败的国王要送一个儿子来，为他效力十年。
        - id: ch01-b02
          speaker: narrator
          text: >-
            邻国也有一位皇帝，年轻时同样英勇，逢战必胜。可他年纪大了，不愿再谋划战争，百姓也只想留在家乡种田。到后来，他知道自己除了向那位强大的邻国君主称臣，已经没有别的路可走。
        - id: ch01-b03
          speaker: narrator
          text: >-
            偏偏称臣还有一个难处，让他一直下不了决心。虽然他一天比一天更明白，称臣是唯一的出路，可新君主一定会索要他的一个儿子去服役。老皇帝哪里有儿子呢？他只有三个女儿。不管朝哪边看，他都觉得眼前只有灭顶之灾，整天愁眉不展。女儿们见了害怕极了，想尽办法哄他开心，却没有一点用。
        - id: ch01-b04
          speaker: narrator
          text: >-
            一天，父女四人正在吃饭，长公主终于鼓起勇气开了口。
        - id: ch01-b05
          speaker: eldest_princess
          text: >-
            父亲，到底有什么心事这样折磨您？是百姓不服您，还是我们惹您生气了？只要能让您不再皱眉，我们连血都愿意流尽。您知道，我们的性命和您的性命连在一起。
        - id: ch01-b06
          speaker: old_emperor
          text: >-
            女儿，你说得没错。你们从来没有让我烦恼过。可眼前这件事，你们谁也帮不了我。唉，你们怎么偏偏没有一个是男孩呢！
        - id: ch01-b07
          speaker: eldest_princess
          text: >-
            我不懂。请您把事情告诉我们吧。我们虽然不是男孩，也不是什么用都没有呀！
          emotion: surprised
        - id: ch01-b08
          speaker: old_emperor
          text: >-
            可你们会做什么呢？你们学过的不过是纺线、缝衣和织布。现在能救我的，得是挥得动战斧的年轻勇士，是一剑就能杀敌的巨人。
        - id: ch01-b09
          speaker: eldest_princess
          text: >-
            您为什么非得有一个儿子？把一切都告诉我们吧。就算我们听完了，事情也不会更糟。
        - id: ch01-b10
          speaker: old_emperor
          text: >-
            那就听着。年轻时，无论谁领兵来犯，我都会让他付出惨重的代价。如今岁月冻冷了我的血，也耗尽了我的力气。林中的鹿不再怕我的箭，外国士兵就算烧掉我的房屋，牵马到我的井边喝水，我这双手也拦不住他们。我的时代过去了，我只能在敌人的轭下低头。可战败以后，还有十年的服役要还。谁能替我去呢？
          emotion: sad
        - id: ch01-b11
          speaker: eldest_princess
          text: >-
            我去！
        - id: ch01-b12
          speaker: narrator
          text: >-
            长公主猛地站了起来，老皇帝却只是伤心地摇头。
        - id: ch01-b13
          speaker: eldest_princess
          text: >-
            我绝不会让您蒙羞。请让我去。我既是公主，也是皇帝的女儿，难道还不能替您承担吗？
        - id: ch01-b14
          speaker: old_emperor
          text: >-
            那你就去吧。
        - id: ch01-b15
          speaker: narrator
          text: >-
            姑娘欢喜得心都快停了，一刻也不肯闲着。她在屋里跑来跑去，把箱子和衣柜翻得乱七八糟，挑出够用一年的衣裳。那些衣裳用金线和宝石绣成，她又带上许多干粮。随后，她从马厩里选了最烈的一匹马。那匹马双眼像火，皮毛闪着银光。父亲看她骑马在庭院里腾跃盘旋，就教她怎样举止才像一个年轻男子，又怎样守住姑娘的身份。祝福过她以后，长公主轻磕马刺，出发了。
        - id: ch01-b16
          speaker: narrator
          text: >-
            她和马身上的银甲晃得路人睁不开眼。她一路飞驰，很快便消失在众人的视野里。要不是跑出几英里后停下来等随从，只怕会独自走完全程。三个女儿谁都不知道，老皇帝其实是个魔法师，心里早有安排。他悄无声息地抢先来到一条溪边，架起铜桥，又变成一头狼，躲在一个桥洞下面等候。
        - id: ch01-b17
          speaker: narrator
          text: >-
            半小时后，马蹄声到了桥边。大灰狼忽然龇着牙挡住去路，低吼一声，弓起身子就要扑来。长公主吓得动也不能动。直到坐骑猛地跳向一旁，她才回过神，立刻调转马头，拼命逃回宫门前。
        - id: ch01-b18
          speaker: old_emperor
          text: >-
            孩子，我不是早告诉过你吗？苍蝇酿不出蜜来。
        - id: ch01-b19
          speaker: narrator
          text: >-
            日子一天天过去。一天早晨，二公主也苦苦请求父亲，让她试试姐姐没能闯过的冒险。老皇帝很不情愿，觉得这样做毫无用处，最后还是被她求得答应了。二公主选好兵器，骑马来到铜桥。她不像姐姐那样毫无防备，早就知道狼会出现。可她的勇气并没有因此多一点，还是任由坐骑用最快的速度把她驮回家。父亲站在城堡台阶上，她怕得浑身发抖，一下跪倒在他脚边。
        - id: ch01-b20
          speaker: old_emperor
          text: >-
            孩子，我不是说过吗？不是每只鸟都会落进网里。
          emotion: calm
        - id: ch01-b21
          speaker: narrator
          text: >-
            此后一阵子，三个姑娘都安静地留在宫里，刺绣、纺线、织布，照料鸟儿和花草。一天清早，小公主走进父亲的内室。
        - id: ch01-b22
          speaker: youngest_princess
          text: >-
            父亲，现在该轮到我了。说不定我能胜过那头狼呢！
        - id: ch01-b23
          speaker: old_emperor
          text: >-
            怎么，你还觉得自己比两个姐姐更勇敢？你这个自负的小东西，才刚脱下婴儿穿的长衣呢！
        - id: ch01-b24
          speaker: youngest_princess
          text: >-
            为了您，就算遇到魔鬼，我也敢把他剁成碎片，哪怕我自己也得变成魔鬼。我想我能成功。即使失败，我回来时也不会比姐姐们更丢脸。
        - id: ch01-b25
          speaker: narrator
          text: >-
            老皇帝还是犹豫。小公主又撒娇又央求，终于让他松了口。
        - id: ch01-b26
          speaker: old_emperor
          text: >-
            好吧，好吧。你非去不可，那就去。我倒要看看能得到什么。多半只能等你低着头回来，再好好笑一场。
        - id: ch01-b27
          speaker: youngest_princess
          text: >-
            谁笑到最后，谁才笑得最好。
        - id: ch01-b28
          speaker: narrator
          text: >-
            小公主如愿以偿，心里十分欢喜。她先想找一位白发苍苍、值得信赖的老贵族请教，再仔细挑一匹坐骑。她径直来到马厩，帝国里最漂亮的马都在各自的栏中吃草。可她一匹匹看过去，没有哪一匹完全合心意。她几乎绝望时，才走到最后一间马栏。那里躺着父亲从前的战马。它和主人一样衰老疲惫，悲伤地卧在草上。姑娘站在那里望着它，眼里涌出了泪水。老马抬起头，轻轻嘶鸣。
        - id: ch01-b29
          speaker: old_horse
          text: >-
            你温柔又有怜悯心。我知道，你这样心疼我，是因为你爱父亲。他从前多么英勇啊，我们也曾一同度过许多好时光。如今我老了，主人把我忘了，也没人关心我的皮毛是亮是暗。不过还不算太迟。只要用心照料我，一个星期后，我能和马厩里任何一匹马较量。
        - id: ch01-b30
          speaker: youngest_princess
          text: >-
            那我该怎样照料你？
        - id: ch01-b31
          speaker: old_horse
          text: >-
            每天早晚用雨水给我刷洗。我的牙齿不好，你要把大麦放进牛奶里煮熟，还要用油洗我的蹄子。
        - id: ch01-b32
          speaker: youngest_princess
          text: >-
            我愿意试试。也许你真能帮我完成计划。
        - id: ch01-b33
          speaker: old_horse
          text: >-
            那就试吧，主人。我保证你不会后悔。

    - id: ch02
      title: 三座桥
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            一个星期后的清晨，老马浑身一阵战栗。等它平静下来，皮毛已经亮得像镜子，身子壮得像西瓜，动作轻盈得如同岩羚。它看着早早来到马厩的公主，高兴地开口了。
        - id: ch02-b02
          speaker: old_horse
          text: >-
            你把生命还给了我，愿成功守候在你的台阶前。告诉我吧，公主，你想让我做什么？我一定替你办到。
          emotion: happy
        - id: ch02-b03
          speaker: youngest_princess
          text: >-
            我想去投奔宗主皇帝，却没人指点我。那些白发老贵族里，我该请谁做顾问？
        - id: ch02-b04
          speaker: old_horse
          text: >-
            有我就够了。只要你肯听话，我会像从前侍奉你父亲那样侍奉你。
        - id: ch02-b05
          speaker: youngest_princess
          text: >-
            你说什么，我都照办。我们三天后动身，可以吗？
        - id: ch02-b06
          speaker: old_horse
          text: >-
            只要你愿意，现在就能走。
        - id: ch02-b07
          speaker: narrator
          text: >-
            小公主带的行装比姐姐们少得多，只有几套男装、少量贴身衣物和食物，再加一点备用的钱。她向父亲告别，骑马走了一整天。铜桥还没有出现，懂魔法的老马就告诉她，父亲会怎样试她的勇气。
        - id: ch02-b08
          speaker: narrator
          text: >-
            可巨狼咆哮着扑来时，她还是浑身发抖。那狼瘦得像整整饿了一个月，爪子像锯齿，张开的嘴足有烤炉那么宽。她有一瞬间胆怯了，随即轻磕马刺，拔出长剑，要把狼头一剑从身上砍掉。野兽一见剑锋便向后退，这样做再明智不过，因为姑娘此刻已经战意勃发，眼中燃起了搏杀的光。她头也不回地策马过了铜桥。
        - id: ch02-b09
          speaker: narrator
          text: >-
            老皇帝为女儿第一次得胜深感骄傲。他抄近路赶到前面，在第二天路程尽头的一条河上架起银桥，这一回又变成了一头狮子。老马猜到新的危险，事先告诉公主怎样脱身。可人坐在安全舒服的地方听忠告，是一回事。可怕的灾难真到了眼前，还能不能照做，又完全是另一回事。巨狼已经让姑娘怕得发抖，可和眼前这头狮子相比，那狼简直像一只温顺的羊羔。
        - id: ch02-b10
          speaker: narrator
          text: >-
            狮子一吼，连树木也跟着发抖。它的爪子大得吓人，每一根都像一柄弯刀。公主呼吸急促，双脚在马镫里碰得咯咯作响。她忽然想起被自己吓退的那头狼，勇气又回来了。她挥起长剑，猛烈地朝狮子冲去。狮子差点来不及跳向一旁，险些被剑锋砍中。紧接着，公主像一道闪电，飞驰过了银桥。
        - id: ch02-b11
          speaker: narrator
          text: >-
            公主从小没有走出过宫苑。如今第一次看见山丘、谷地和清亮的溪水，第一次听见云雀和乌鸫歌唱，她惊喜得忘乎所以。她真想下马洗洗脸，再摘几朵花，老马却说了一声不行，脚下更快了。
        - id: ch02-b12
          speaker: old_horse
          text: >-
            勇士要等胜利以后才能休息。前面还有一场仗，也是最难的一场。
        - id: ch02-b13
          speaker: narrator
          text: >-
            第三天路程的尽头，金桥前等着她的不是狼，也不是狮子，而是一条十二个头的恶龙。公主刚往前走，一股烟火便从脚下喷出。她低头一看，怪物正盘旋扭动，十二个脑袋全都昂起来，像要把她夹在中间一口吞掉。
        - id: ch02-b14
          speaker: narrator
          text: >-
            缰绳滑出了她的手，刚握住的剑也落回鞘中。老马叫她别怕。她拼尽力气重新坐直身子，猛踢马腹，径直冲向恶龙。战斗足足持续了一个小时，恶龙步步紧逼，公主一直难以招架。终于，她瞅准一个机会，从侧面一剑砍下一颗龙头。恶龙发出一声怒吼，仿佛能把天空撕成两半。它倒在地上，随即化成一个男人，站到了她面前。
        - id: ch02-b15
          speaker: narrator
          text: >-
            老马早说过，恶龙就是她的父亲，可姑娘一直半信半疑。看到眼前的变化，她惊得说不出话。父亲张开双臂，把她紧紧抱在胸前。
        - id: ch02-b16
          speaker: old_emperor
          text: >-
            现在我知道了，你的勇气不输给最勇敢的人，智慧也不输给最聪明的人。你选对了坐骑。没有它，你早就低着头回家了。也许你真能完成自己担下的使命。不过，千万别忘记我的告诫，尤其要听你的马。
        - id: ch02-b17
          speaker: narrator
          text: >-
            公主跪下领受父亲的祝福。随后，父女二人各自上路。

    - id: ch03
      title: 阳光
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            公主不停向前，来到支撑世界屋顶的群山。那里有两个精灵，已经恶斗了整整两年，谁也没占到一点上风。他们把公主当成一个寻找冒险的年轻男子。
        - id: ch03-b02
          speaker: first_spirit
          text: >-
            费特·弗鲁纳斯！帮我除掉敌人，我就把号角送给你。它吹响以后，三天路程以外也能听见！
        - id: ch03-b03
          speaker: second_spirit
          text: >-
            费特·弗鲁纳斯！替我打败这个异教恶贼，我就把我的马“阳光”送给你！
        - id: ch03-b04
          speaker: narrator
          text: >-
            公主先问老马该帮谁。老马劝她帮助“阳光”的主人，因为“阳光”是它的弟弟，跑得比它还快。姑娘立刻攻向另一个精灵，很快劈开了他的头。获胜的精灵请她回家，答应把“阳光”交给她。
        - id: ch03-b05
          speaker: narrator
          text: >-
            精灵的母亲见儿子平安回来，高兴极了，赶紧给公主收拾出最好的房间。公主经过这场劳累，确实很需要休息，却坚持先去马厩安顿老马。其实这只是借口，她还有好几件事要向老马请教。老太婆从第一眼就怀疑，救儿子的少年是姑娘假扮的，还对精灵说，这样的人正好可以给他做妻子。精灵听了嗤之以鼻，反问一个女人的手怎么可能把军刀使成那样。
        - id: ch03-b06
          speaker: narrator
          text: >-
            母亲不管儿子怎样嘲笑，还是不肯罢休。为了证明自己的判断，夜里她往两人的枕头上各放了一把魔花。男人一碰，花就会枯萎，女人拿在手里，花却会永远鲜艳。这个办法的确聪明，可老马早已提醒公主该防备什么。等屋里一片寂静，公主悄悄溜进精灵的房间，用自己手里的鲜花换走他的枯花。随后，她轻手轻脚地回到床上，很快沉沉睡去。
        - id: ch03-b07
          speaker: narrator
          text: >-
            天一亮，老太婆便先跑去看儿子，果然发现他手里握着一束枯花。接着她又来到公主床边，只见客人仍在熟睡，手里也抓着枯萎的花。可她还是不信，又把怀疑告诉儿子。早饭后，精灵挽着客人的手去花园散步。他们在花丛间走了很久，精灵一个劲儿劝她摘取喜欢的花。公主猜到又是试探，便粗声问道，两个男子汉不去马厩照料坐骑，为什么要在花园里浪费宝贵时间。精灵认定母亲看错了，老太婆却还要再试。
        - id: ch03-b08
          speaker: narrator
          text: >-
            这一次，老太婆要儿子把客人领进兵器库，再请他任选一件武器。那里挂着天下各处使用的种种兵器，有的朴素无饰，有的镶满宝石。公主仔细看遍每一件，又逐一试过锋刃和尖端，最后把一柄古旧的弯刃剑挂在腰间。即使交给古代勇士，那把剑也足以为他增光。选好以后，她告诉精灵，自己第二天一早就带“阳光”离开。老太婆再也想不出办法，只得依从，心里却仍坚持原来的判断。
        - id: ch03-b09
          speaker: narrator
          text: >-
            公主骑上“阳光”，老马跟在身边飞奔。走出一段路，老马忽然开了口。
        - id: ch03-b10
          speaker: old_horse
          text: >-
            主人，你一直听我的劝，所以事事顺利。请再听我最后一次。我老了，如今也有人能接替我，我怕自己的力气应付不了前面的任务。让我回家吧，你跟着我弟弟继续走。像信任我一样信任它，你不会后悔。“阳光”虽然年轻，却已经很有智慧。
        - id: ch03-b11
          speaker: youngest_princess
          text: >-
            老伙伴，你一直忠心帮助我。直到今天，我的每一次胜利都离不开你。向你告别让我很难过，可我愿意再听你一次。以后，我会像听你的话一样听你弟弟的话。不过，它得先证明自己也同你一样爱我。
          emotion: sad
        - id: ch03-b12
          speaker: sunlight
          text: >-
            我怎么会不爱你？能侍奉你这样的勇士，我当然骄傲。相信我，主人，我不会让你因为哥哥不在就后悔。前路不管有多少难处，我们都会一同面对。
        - id: ch03-b13
          speaker: narrator
          text: >-
            公主含着眼泪告别老马，看它飞奔回父亲身边。又走了几英里，她看见路上有一绺金发，便问“阳光”该捡起来，还是留在原地。
        - id: ch03-b14
          speaker: sunlight
          text: >-
            你捡了会后悔，不捡也会后悔。所以，还是捡起来吧。
        - id: ch03-b15
          speaker: narrator
          text: >-
            姑娘下马拾起金发，缠在脖子上免得遗失。他们翻过丘陵和群山，穿过山谷，把森林和花原都抛在身后，终于来到宗主皇帝的宫廷。

    - id: ch04
      title: 金发的主人
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            皇帝坐在宝座上，身边围着其他皇帝送来服役的儿子，他们全在这里充当侍从。这些年轻人纷纷上前欢迎新同伴，心里还奇怪，自己为什么会这样喜欢他。眼下公主没有工夫和他们攀谈，只顾竭力掩饰心里的害怕。她被人径直带到宝座前，低声说明自己为什么来到这里。皇帝待她很和善，还说能得到这样勇敢又讨人喜欢的臣属，实在是自己的幸运，便吩咐公主留在身边侍候。
        - id: ch04-b02
          speaker: narrator
          text: >-
            公主和其他侍从相处时处处小心，因为她并不喜欢他们的生活方式。有一天，她正在做糖果消遣，两位年轻王子恰好进来拜访。她请他们尝尝桌上已经做好的点心。两人觉得太好吃，连手指也舔得干干净净，一点都舍不得浪费。他们当然没有把这个发现藏在心里，马上告诉所有伙伴，自己刚吃到了有生以来最棒的一顿晚餐。从那以后，大家缠着公主不放，直到她答应亲手做一顿饭。
        - id: ch04-b03
          speaker: narrator
          text: >-
            偏偏到了约定那天，宫里的厨子全喝得酩酊大醉，连生火的人都没有。侍从们赶来求新同伴救急。公主本来就爱烹饪，又热心助人，马上系起围裙下了厨房。饭菜端到皇帝面前，他觉得美味极了，吃得远远超过身体能承受的分量。
        - id: ch04-b04
          speaker: narrator
          text: >-
            第二天一早，皇帝叫御厨再做一次昨日的菜。御厨知道自己做不出来，吓得跪下说了实话。皇帝吃惊得忘了斥责。正在这时，几个侍从来报告，说新同伴夸口知道金发伊利亚娜在哪里，就是歌里那位大名鼎鼎的姑娘。那首歌开头唱着，“金色的头发，田野一片青……”他们还说，新同伴手中确实有她的一绺头发。
        - id: ch04-b05
          speaker: narrator
          text: >-
            皇帝立刻把费特·弗鲁纳斯召到面前。
        - id: ch04-b06
          speaker: suzerain_emperor
          text: >-
            费特·弗鲁纳斯，你知道金发伊利亚娜的下落，为什么还瞒着我？我待你可比别的侍从都好。
        - id: ch04-b07
          speaker: narrator
          text: >-
            皇帝让她取下颈上的金发，拿在手里看了看。
        - id: ch04-b08
          speaker: suzerain_emperor
          text: >-
            听好。不管用什么办法，你都得把这绺头发的主人带回来。不然，我就让人在你站着的地方砍掉你的脑袋。现在就走！
          emotion: angry
        - id: ch04-b09
          speaker: narrator
          text: >-
            可怜的姑娘想解释头发是怎么来的，皇帝一句也不听。她只能深深行礼，退出大殿，去找“阳光”商量。马刚说了几句，她的脸色便亮了起来。
        - id: ch04-b10
          speaker: sunlight
          text: >-
            别怕，主人。昨夜哥哥托梦告诉我，一个精灵掳走了伊利亚娜，你捡到的正是她的头发。伊利亚娜说，精灵若想娶她，就要先找回原本属于她的整群母马，送给她做礼物。那个精灵爱得发了疯，正日夜寻找马群。伊利亚娜目前平安无事，被关在海中岛屿的沼泽里。你去向皇帝要二十艘船，装满珍贵货物。以后怎么做，到时你就知道了。
          emotion: calm
        - id: ch04-b11
          speaker: narrator
          text: >-
            公主听完，立刻返回皇帝面前。
        - id: ch04-b12
          speaker: youngest_princess
          text: >-
            愿无所不能的君王长寿。只要您给我二十艘船，再装上全国最珍贵的货物，我就能完成命令。
        - id: ch04-b13
          speaker: suzerain_emperor
          text: >-
            只要你能带回金发伊利亚娜，我所有的东西都可以给你。
        - id: ch04-b14
          speaker: narrator
          text: >-
            二十艘船很快准备妥当，每一艘都装满了全国最珍贵的货物。公主带着“阳光”登上最大也最漂亮的那艘船。船帆一面面升起，漫长的航程开始了。风一连吹了七个星期，把他们径直送向西方。一天清晨，海中岛屿的沼泽地终于出现在眼前。
        - id: ch04-b15
          speaker: narrator
          text: >-
            船队驶进一处小海湾，在那里下了锚。公主急着和“阳光”一同上岸，离船以前，却先把一双镶满宝石的小金鞋牢牢系在腰带上。她骑上“阳光”，在沼泽地里四处探寻，最后来到几座宫殿前。那些宫殿全都建在转轴上，可以永远随着太阳转动。不管太阳走到哪里，宫殿的正面都会跟着它。
        - id: ch04-b16
          speaker: narrator
          text: >-
            最华美的一座宫殿由三个奴仆看守。他们贪婪的眼睛立刻盯住金鞋，忙来询问公主是什么人。
        - id: ch04-b17
          speaker: youngest_princess
          text: >-
            我是个商人，不知怎么走错了路，迷失在这片海岛沼泽里。
        - id: ch04-b18
          speaker: narrator
          text: >-
            奴仆拿不准该不该接待这个陌生人，便回去把看到的一切禀告女主人。其实他们还没开口，伊利亚娜早已从宫殿屋顶看见了商人。看守她的精灵外出寻找捕捉马群的办法，她暂时独自留在宫殿里，可以自由行动。奴仆把那双金鞋说得活灵活现，伊利亚娜听完，坚持要下到海边亲眼看看。
        - id: ch04-b19
          speaker: narrator
          text: >-
            金鞋比伊利亚娜想象的还美，也更讨她喜欢。商人恳求她上船看看另外几双，说那些更加精巧。她实在好奇得无法拒绝，便跟着上了船。上船以后，她一心翻看堆在那里的奇珍异宝，完全没有发现风帆已经张开，船队正乘着风飞快离去。等她终于察觉以后，心里其实十分高兴，表面却装作自己又一次被人掳走，哭哭啼啼，不停叹息。就这样，他们平安回到了皇帝的国土。

    - id: ch05
      title: 火焰后的高塔
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            两人正要上岸，精灵的母亲突然追到了眼前。她听说伊利亚娜跟一个商人逃出牢笼，儿子又不在，便亲自赶来追捕。她一步步跨过蓝色海水，从一个浪头跳到另一个浪头，一只脚直抵天空，另一只踩在浪花里。公主和伊利亚娜下船时，她已经追到身后，嘴里不断喷出烈焰。
        - id: ch05-b02
          speaker: narrator
          text: >-
            伊利亚娜认出这可怕的老太婆，连忙低声提醒同伴。公主一句话也没说，先把伊利亚娜托上“阳光”的马鞍，自己跳到她身后，转眼便飞驰而去。快到城镇时，她才俯身问“阳光”怎么办。
        - id: ch05-b03
          speaker: sunlight
          text: >-
            把手伸进我的左耳，拿出里面的尖石头，往身后扔！
        - id: ch05-b04
          speaker: narrator
          text: >-
            公主照做，一座大山立刻从背后升起。精灵的母亲开始翻山。他们跑得很快，老太婆却更快，脚步声越来越近。
        - id: ch05-b05
          speaker: sunlight
          text: >-
            把手伸进我的右耳，找到里面的刷子，再扔到身后！
        - id: ch05-b06
          speaker: narrator
          text: >-
            一片大森林顿时挡住去路，枝叶密得连鹪鹩也钻不过去。可老太婆像猴子一样抓着树枝，从一根荡到另一根。她越追越近，口中的火焰已经燎焦两人的头发。公主绝望了，再次弯身询问。
        - id: ch05-b07
          speaker: sunlight
          text: >-
            快！快把伊利亚娜手上的订婚戒指摘下来，扔到后面！
        - id: ch05-b08
          speaker: narrator
          text: >-
            一座巨大的石塔拔地而起。塔身光滑得像象牙，坚硬得像钢铁，一直耸进天空。精灵的母亲知道自己既爬不过去，也没法穿过去，发出一声愤怒的号叫。可她仍旧不认输，聚起全身的力气猛然一跃，竟然落到塔顶，正好跌进留在那里的戒指。戒指把她紧紧套住，远远看去，人们只能看见她的利爪抓着城垛。
        - id: ch05-b09
          speaker: narrator
          text: >-
            老巫婆使尽了所有办法。她口中喷出的烈火始终够不到已经逃远的人，却像火山流出的熔焰，把石塔周围一百英里的土地全烧成荒原。她被戒指套在塔顶，怎样也脱不了身。最后，她又拼尽全力挣扎了一次，抓住城垛的双手终于再也撑不住。她从高塔上一直坠落到塔底，摔得粉身碎骨。
        - id: ch05-b10
          speaker: narrator
          text: >-
            公主看见这一幕，依照“阳光”的劝告返回原处，把手指放到缓缓沉入地下的塔顶。眨眼间，高塔消失了，只留下公主伸出的手指，伊利亚娜的戒指正套在上面。
        - id: ch05-b11
          speaker: narrator
          text: >-
            皇帝用配得上伊利亚娜身份的礼节接待她，而且第一眼见到她就爱上了她。伊利亚娜却一点也不高兴。不管在宫殿里，还是在花园里，她走动时总是一脸忧伤。她心里怎么也想不明白，为什么别的姑娘可以照自己的心意生活，她却一次又一次落到自己憎恨的人手里。所以，当皇帝请她和自己共享王位时，她没有答应，而是这样回答。
        - id: ch05-b12
          speaker: ilyana
          text: >-
            高贵的君王，等我的马群回到身边，每一匹都配齐鞍辔，我才能考虑婚事。
        - id: ch05-b13
          speaker: narrator
          text: >-
            皇帝听完，又把费特·弗鲁纳斯召来。
        - id: ch05-b14
          speaker: suzerain_emperor
          text: >-
            立刻把那群母马带回来，一副鞍辔也不能少。办不到，就用你的脑袋抵偿。
        - id: ch05-b15
          speaker: youngest_princess
          text: >-
            伟大的皇帝，请让我吻您的手。我刚办完上一件差事，您又把任务给我，还拿我的脑袋下注。宫廷里有这么多英勇的年轻人，人人都盼着立功。大家都说您办事公正，为什么不派他们中的一个？再说，我该到哪里去找那些母马？
        - id: ch05-b16
          speaker: suzerain_emperor
          text: >-
            我怎么知道？它们也许在天上，也许在地下。不管在哪里，你都必须找到。

    - id: ch06
      title: 伊利亚娜的马群
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            公主行礼退出，去找“阳光”商议。马听完便告诉她该怎样准备。
        - id: ch06-b02
          speaker: sunlight
          text: >-
            快找来九张水牛皮，厚厚涂满焦油，全铺在我背上。别害怕，这一回你也能成功。不过到了最后，皇帝会被自己的欲望害死。
        - id: ch06-b03
          speaker: narrator
          text: >-
            九张水牛皮很快备齐，公主骑着“阳光”出发。路途又长又难，他们终于来到母马吃草的地方。掳走伊利亚娜的精灵就在附近游荡，正设法捕捉马群。他还以为伊利亚娜好好地关在自己的宫殿里。
        - id: ch06-b04
          speaker: narrator
          text: >-
            公主一看见精灵，便主动走上前去。她告诉他，伊利亚娜已经逃走，他的母亲试图把姑娘追回来，却在盛怒中丢了性命。精灵听到这个消息，顿时陷入疯狂的暴怒，凶猛地向公主扑来。公主却镇定地站着，等他进攻。精灵把军刀高高举在空中，冲到眼前时，“阳光”猛然从他头顶跃过，那一刀顿时落空。轮到公主挥剑，“阳光”又用双膝跪地，让她的剑锋正好刺进精灵的大腿。
        - id: ch06-b05
          speaker: narrator
          text: >-
            这一战激烈无比，仿佛连大地也要在他们脚下塌陷。方圆二十英里内，森林里的野兽全都逃进洞穴躲避。两人打了很久，公主的力气几乎耗尽，精灵却恰好有一瞬间垂下了剑。她抓住这唯一的机会，用尽力气挥动手臂，一剑砍下敌人的头。漫长的搏斗终于结束了，公主的身体仍在不停发抖。可她没有停下来休息，马上转身离开，朝马群吃草的牧场走去。
        - id: ch06-b06
          speaker: narrator
          text: >-
            她听从“阳光”的话，不让母马看见自己，爬上枝叶茂密的大树躲好。“阳光”一声嘶鸣，母马们都想看看这位新客人，纷纷跑来。只有一匹马不喜欢陌生人，觉得原来的日子就很好，始终不肯靠近。
        - id: ch06-b07
          speaker: narrator
          text: >-
            “阳光”稳稳站在原处，很享受大家的注目。那匹不肯靠近的马脾气暴躁，忽然冲上来，一口狠狠咬住它。要不是背上铺着九张涂满焦油的水牛皮，“阳光”当场就会丧命。两匹马激烈地争斗起来。等恶斗结束，九张水牛皮全碎成了布条，落败的马则痛苦地倒在草地上，不停扭动身体。
        - id: ch06-b08
          speaker: narrator
          text: >-
            现在只剩下最后一件事，就是把整个马群带回皇帝的宫廷。公主从枝叶茂密的大树上下来，重新骑上“阳光”。母马群已经变得十分温顺，全都跟在他们后面，受伤的那一匹慢慢走在最后。长路走完，他们终于抵达宫殿。公主先把整个马群赶进一座院子安顿好，随后才去禀告皇帝，说自己已经平安归来，也完成了带回马群的命令。
        - id: ch06-b09
          speaker: narrator
          text: >-
            公主回来的消息立刻传到伊利亚娜那里。她马上跑下楼，来到院子里，把母马一匹一匹叫到自己身边，而且每一匹都能喊出名字。那匹受伤的马一看见她，便迅速抖了抖身体。就在这一抖之间，它身上的所有伤口都痊愈了，重新变得精神十足。油亮的皮毛上干干净净，连一道受过伤的痕迹也没有留下。
        - id: ch06-b10
          speaker: narrator
          text: >-
            皇帝听说伊利亚娜在院里，也赶了过来。照她的要求，他命人挤出母马的奶，供两人一同沐浴，好让他们永远年轻。可母马不许任何人靠近，这件差事又落到公主头上。
        - id: ch06-b11
          speaker: narrator
          text: >-
            姑娘听到命令，气得胸口翻腾。最艰难的任务总是交给她，两年服役还远远没有结束，她怕自己早就会被累垮，以后再也派不上用场。正这样想着，一场从来没人见过的可怕暴雨突然倾盆而下。积水不断上涨，一直没到母马膝头。雨又猛地停了。看哪，地上的水已经结成冰，把所有母马牢牢冻在原地。
        - id: ch06-b12
          speaker: narrator
          text: >-
            公主的心一下轻快起来。她高高兴兴地坐下挤奶，那熟练的样子，仿佛一辈子每天清晨都在做这件事。

    - id: ch07
      title: 圣水与王位
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: >-
            皇帝越来越爱伊利亚娜，伊利亚娜却始终不理会，总能找到理由推迟婚期。最后，她再也想不出新的办法，便向皇帝提出一个请求。
        - id: ch07-b02
          speaker: ilyana
          text: >-
            陛下，请您再答应我最后一件事，我就真的嫁给您。毕竟，您已经耐心等了这样久。
        - id: ch07-b03
          speaker: suzerain_emperor
          text: >-
            我美丽的鸽子，我和我的一切都属于你。说吧，你想要什么，一定会得到。
        - id: ch07-b04
          speaker: ilyana
          text: >-
            请替我取来一瓶圣水。它供在约旦河对岸一座小教堂里。等圣水到了，我就做您的妻子。
        - id: ch07-b05
          speaker: narrator
          text: >-
            皇帝又下令，要费特·弗鲁纳斯立刻骑马去约旦河，不惜任何代价带回圣水。公主给“阳光”备鞍时，马开口了。
        - id: ch07-b06
          speaker: sunlight
          text: >-
            主人，这是你最后一项任务，也是最困难的一项。不过别怕，皇帝的时辰已经到了。
        - id: ch07-b07
          speaker: narrator
          text: >-
            他们动身上路。“阳光”不只有魔力，还知道圣水究竟藏在哪里。
        - id: ch07-b08
          speaker: sunlight
          text: >-
            圣水就在小教堂的祭坛上，由一群修女看守。她们白天黑夜都不睡。不过每隔一段日子，会有一位隐士来教她们一些必须知道的事。那时只留一名修女守卫。运气好，我们正赶上这个时候，就能拿走瓶子。要是赶不上，无论等多久，也只能等到隐士再来，没有别的办法。
        - id: ch07-b09
          speaker: narrator
          text: >-
            他们赶到约旦河边，望见了对岸的那座小教堂。两人惊喜地发现，那位隐士恰好刚到教堂门口。他们听见隐士召集修女，也看见修女们陆续走到一棵树下坐好，隐士就坐在她们中间。所有修女都过去听讲，只有一个人没有离开教堂。她按照平时的规矩，独自留下守卫祭坛上的圣水。
        - id: ch07-b10
          speaker: narrator
          text: >-
            隐士有许多话要讲，那一天又十分炎热。守门的修女厌倦了独自坐着，便横卧在门槛上，很快睡熟了。“阳光”告诉公主接下来该怎样行动。姑娘轻轻跨过熟睡的修女，像猫一样沿着黑暗的过道悄悄向前。里面什么也看不清，她只好用手指摸着墙走，免得撞倒什么东西，弄出一点声音，把整个计划全毁掉。
        - id: ch07-b11
          speaker: narrator
          text: >-
            她平安来到祭坛前，看见圣水瓶就摆在那里。她把瓶子塞进衣襟，照原路小心退了出去，随即跳上马背，抓紧缰绳，叫“阳光”用最快的速度往回跑。
        - id: ch07-b12
          speaker: narrator
          text: >-
            疾驰的蹄声惊醒了守门的修女。她立刻明白，珍贵的宝物已经被人偷走，于是发出尖利的惨叫。其余修女全都飞奔过来，想看看究竟出了什么事，隐士也紧随在她们身后。他看出盗贼已经无法追上，便双膝跪地，把自己所能想到的最恶毒的诅咒降到她头上。
        - id: ch07-b13
          speaker: hermit
          text: >-
            偷走圣水的人若是男人，就让他变成女人。若是女人，就让她变成男人！
          emotion: angry
        - id: ch07-b14
          speaker: narrator
          text: >-
            隐士相信，不论发生哪一种变化，对偷水的人来说都会是十分严厉的惩罚。可一件事到底算不算惩罚，人们的看法并不总是一样。公主忽然发现，自己真的变成了从前一直假扮的男人，顿时喜出望外。这个诅咒正好解除了她一直以来的难处。要是隐士就在近旁，她一定会发自内心地向他道谢。
        - id: ch07-b15
          speaker: narrator
          text: >-
            费特·弗鲁纳斯回到宫廷时，在所有人眼中都已是一个真正的年轻男子。如今就算精灵的母亲还活着，也不会再有一点怀疑。他从上衣里取出圣水瓶，举给皇帝看。
        - id: ch07-b16
          speaker: youngest_princess
          text: >-
            伟大的君王，愿您安康！这项任务我也完成了。但愿这是您交给我的最后一项差事，现在该轮到别人了。
        - id: ch07-b17
          speaker: suzerain_emperor
          text: >-
            我很满意，费特·弗鲁纳斯。我死以后，你来继承王位，因为我至今没有儿子。若上天赐给我一个儿子，实现我最珍重的愿望，你就做他的右手，用智慧辅佐他。
        - id: ch07-b18
          speaker: narrator
          text: >-
            皇帝很满意，伊利亚娜却一点也不满意。皇帝让费特·弗鲁纳斯冒过太多危险，她决心替他报复。至于那瓶圣水，她认为一个求婚的人哪怕只讲最起码的礼貌，也该亲自去取，而不是再把危险推给别人。何况皇帝若亲自前往，根本不会遇到任何危险。
        - id: ch07-b19
          speaker: narrator
          text: >-
            于是，伊利亚娜命人把那座大浴池灌满刚挤出的母马奶，又请皇帝穿上一身白袍，和她一同走进浴池。皇帝听了十分欢喜，欣然答应。两个人站进池中，奶汁不断上涨，一直漫到他们的颈项。伊利亚娜又叫人牵来那匹曾经同“阳光”恶斗的马，趁皇帝没有留意，暗中向它打了一个手势。
        - id: ch07-b20
          speaker: narrator
          text: >-
            那匹马立刻明白了。它从一边鼻孔向伊利亚娜吹出清新的风，从另一边向皇帝喷出灼热的气流。皇帝站在那里，被热风一点点烧干，最后只剩下一小堆灰烬。
        - id: ch07-b21
          speaker: narrator
          text: >-
            没有人能够解释，皇帝为什么会这样离奇地死去。这个消息传开以后，全国上下都为之震动。臣民们为他举行了一场从未有过的盛大葬礼，用他们认为最隆重的方式送走了君主。等葬礼结束，伊利亚娜便把费特·弗鲁纳斯召到自己面前。
        - id: ch07-b22
          speaker: ilyana
          text: >-
            费特·弗鲁纳斯，是你把我带回来，救了我的性命，也听从了我的愿望。你替我找回马群，杀死精灵和他的巫婆母亲，又带回圣水。我要嫁的人只能是你，绝不会是别人。
        - id: ch07-b23
          speaker: youngest_princess
          text: >-
            好，我娶你。不过你得知道，在我们家里，开口啼唱的会是公鸡，不是母鸡！
        - id: ch07-b24
          speaker: narrator
          text: >-
            这个故事选自朱尔·布伦与莱奥·巴舍兰合编的《七篇罗马尼亚故事》。
