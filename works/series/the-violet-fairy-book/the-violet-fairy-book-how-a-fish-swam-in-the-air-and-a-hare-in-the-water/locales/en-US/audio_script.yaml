audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, steady, and quietly mysterious
        timbre: clear and resonant
        pace: measured
        pitch: medium
    old_man:
      display_name: The Old Man
      tts:
        delivery: thoughtful, crafty, and dryly amused
        timbre: weathered and mellow
        pace: unhurried
        pitch: medium-low
    old_woman:
      display_name: The Old Woman
      tts:
        delivery: eager, outspoken, and quick to react
        timbre: bright and mature
        pace: brisk
        pitch: medium-high
    secretary:
      display_name: The Chief Secretary
      tts:
        delivery: official, skeptical, and stern
        timbre: firm and polished
        pace: measured
        pitch: medium-low
    elder_1:
      display_name: First Village Elder
      tts:
        delivery: sober and matter-of-fact
        timbre: aged and steady
        pace: measured
        pitch: low
    elder_2:
      display_name: Second Village Elder
      tts:
        delivery: restrained and quietly amused
        timbre: dry and mature
        pace: measured
        pitch: medium-low
    elder_3:
      display_name: Third Village Elder
      tts:
        delivery: plainspoken and assured
        timbre: clear and mature
        pace: moderate
        pitch: medium
  chapters:
    - id: ch01
      title: The Treasure in the Forest
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, an old man and his wife lived in a little village. They might have been happy together if the old woman had known when to keep quiet. Whatever happened at home, and whatever news her husband brought back, she told the whole village at once. The stories were passed around and changed until they caused real mischief. It was often the old man's back that paid for the trouble she made.
        - id: ch01-b02
          speaker: narrator
          text: One day, the old man drove toward the forest. At its edge, he climbed out of his cart and walked beside it. Then his foot sank into a patch of soft earth.
        - id: ch01-b03
          speaker: old_man
          text: What could be under there? I'll dig a little and find out.
        - id: ch01-b04
          speaker: narrator
          text: He dug down until he uncovered a small pot filled with gold and silver.
        - id: ch01-b05
          speaker: old_man
          text: What luck! But how can I get this treasure home? I could never hide it from my wife. The moment she knows, she'll tell everyone, and I'll be in trouble.
        - id: ch01-b06
          speaker: narrator
          text: He sat for a long while, turning the problem over in his mind. At last, he had a plan. He buried the pot again beneath earth and twigs, then drove into town. At the market, he bought a live pike and a live hare.
        - id: ch01-b07
          speaker: narrator
          text: Back in the forest, he hung the pike high in a tree. He tied the hare inside a fishing net at the edge of a little stream, without caring how miserable the wet place would be for it. Then he climbed into his cart and trotted merrily home. The moment he stepped inside, he called to his wife.
    - id: ch02
      title: A Fish in a Tree
      blocks:
        - id: ch02-b01
          speaker: old_man
          text: Wife! You would never guess what wonderful luck has come to us.
        - id: ch02-b02
          speaker: old_woman
          text: What is it, dear husband? Tell me everything, right now!
        - id: ch02-b03
          speaker: old_man
          text: No, no. You would run off and tell everyone.
        - id: ch02-b04
          speaker: old_woman
          text: Of course I wouldn't! How can you think that of me? Why, I will swear never to tell anyone.
        - id: ch02-b05
          speaker: old_man
          text: Well, if you truly mean it, then listen. I found a pot full of gold and silver in the forest. Not a word now!
        - id: ch02-b06
          speaker: old_woman
          text: Then why didn't you bring it home?
        - id: ch02-b07
          speaker: old_man
          text: We will drive there together and carry it safely back between us.
        - id: ch02-b08
          speaker: narrator
          text: He shared the secret in a whisper. Then the old man and his wife set off for the forest. As they rode along, he began to speak.
        - id: ch02-b09
          speaker: old_man
          text: People tell the strangest things these days. I heard that fish now live quite happily in the tops of trees, while some wild animals spend their time in the water. Times certainly have changed.
        - id: ch02-b10
          speaker: old_woman
          text: Husband, you must be out of your mind! The things people say are complete nonsense.
        - id: ch02-b11
          speaker: old_man
          text: Nonsense? Look up there! Bless me, there is a fish in that tree. Unless I'm mistaken, it's a real pike.
        - id: ch02-b12
          speaker: old_woman
          text: Good gracious! How did a pike get up there? It really is a pike, and don't try to tell me otherwise. Perhaps those people were telling the truth after all.
          emotion: surprised
        - id: ch02-b13
          speaker: narrator
          text: The old man only shook his head, lifted his shoulders, and stared with his mouth open, as if he could not believe his eyes.
        - id: ch02-b14
          speaker: old_woman
          text: Don't just stand there gaping, you fool! Climb up, catch that pike, and we will cook it for dinner.
          emotion: angry
        - id: ch02-b15
          speaker: narrator
          text: The old man climbed the tree, brought down the pike, and drove on. Near the stream, he stopped the cart again.
        - id: ch02-b16
          speaker: old_woman
          text: What are you staring at now? Can't you keep driving?
        - id: ch02-b17
          speaker: old_man
          text: Something seems to be moving in the net I set. I must see what it is.
        - id: ch02-b18
          speaker: narrator
          text: He ran to the net. After looking inside, he called back to his wife.
        - id: ch02-b19
          speaker: old_man
          text: Come and see! A four-footed creature is caught in my net. I believe it is a hare.
        - id: ch02-b20
          speaker: old_woman
          text: Heavens! How did a hare get into your net? It is a hare, and you needn't deny it. So people really were telling the truth.
          emotion: surprised
        - id: ch02-b21
          speaker: narrator
          text: Her husband shook his head and lifted his shoulders once more, pretending that he could hardly trust his own eyes.
        - id: ch02-b22
          speaker: old_woman
          text: Why are you standing there, you fool? Pick up the hare. A plump hare will make a fine feast-day dinner.
          emotion: angry
        - id: ch02-b23
          speaker: narrator
          text: The old man took the hare, and they continued to the buried treasure. They brushed away the twigs, dug through the earth, lifted out the pot, and carried it home.
    - id: ch03
      title: The Quarrel over the Gold
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Now the old couple had plenty of money, and for quite a while they lived in comfort and good cheer. But the foolish wife invited crowds of people to dinner every day and gave them feast after feast. At last, her husband lost patience. He tried to reason with her, but she would not listen to a word he said.
        - id: ch03-b02
          speaker: old_woman
          text: You have no right to scold me! We found the treasure together, so we will spend it together.
          emotion: angry
        - id: ch03-b03
          speaker: narrator
          text: The old man endured it as long as he could. Finally, he spoke plainly.
        - id: ch03-b04
          speaker: old_man
          text: Do as you please, but I will not give you another penny.
        - id: ch03-b05
          speaker: narrator
          text: The old woman flew into a rage.
        - id: ch03-b06
          speaker: old_woman
          text: What a worthless man! He wants all the money for himself. Just wait. I will show him what I can do.
          emotion: angry
        - id: ch03-b07
          speaker: narrator
          text: She hurried away to complain to the governor.
        - id: ch03-b08
          speaker: old_woman
          text: My lord, please protect me from my husband! Ever since he found that treasure, he has been impossible. He does nothing but eat and drink. He will not work, and he keeps every bit of the money for himself.
        - id: ch03-b09
          speaker: narrator
          text: The governor felt sorry for her and ordered his chief secretary to investigate. The secretary gathered the village elders and went with them to the old man's house.
    - id: ch04
      title: The Secretary's Questions
      blocks:
        - id: ch04-b01
          speaker: secretary
          text: The governor orders you to place all the treasure you found in my care.
        - id: ch04-b02
          speaker: old_man
          text: What treasure? I know nothing about any treasure.
        - id: ch04-b03
          speaker: secretary
          text: Nothing? Your own wife has complained about you, so do not lie. Hand over the money now, or you will stand trial for finding treasure and failing to report it to the governor.
          emotion: angry
        - id: ch04-b04
          speaker: old_man
          text: Forgive me, Your Excellency, but what sort of treasure does she claim it was? My wife must have dreamed the whole thing, and you gentlemen have been listening to her foolish talk.
        - id: ch04-b05
          speaker: old_woman
          text: Foolish talk? You call a kettle full of gold and silver foolish talk?
          emotion: angry
        - id: ch04-b06
          speaker: old_man
          text: Dear wife, you are not in your right mind. Sir, please ask her exactly how it happened. If her story convinces you, I will answer for it with my life.
        - id: ch04-b07
          speaker: old_woman
          text: I will tell you, Mr. Secretary. We were driving through the forest when we saw a pike at the very top of a tree.
        - id: ch04-b08
          speaker: secretary
          text: A pike? Do you think you can make jokes at my expense?
          emotion: angry
        - id: ch04-b09
          speaker: old_woman
          text: I am not joking, Mr. Secretary! Every word is true.
        - id: ch04-b10
          speaker: old_man
          text: Now you can judge for yourselves, gentlemen. How can anyone trust her when she talks like this?
        - id: ch04-b11
          speaker: old_woman
          text: Talks like this? Me? Perhaps you have also forgotten the live hare we found in the river!
          emotion: angry
        - id: ch04-b12
          speaker: narrator
          text: Everyone burst out laughing. Even the secretary smiled and stroked his beard.
        - id: ch04-b13
          speaker: old_man
          text: Come now, wife. Everyone is laughing at you. Gentlemen, you can see for yourselves how much of her story should be believed.
        - id: ch04-b14
          speakers: [elder_1, elder_2, elder_3]
          ensemble: chorus
          text: Indeed we can. This is the first time we have ever heard of hares living in water or fish thriving in treetops.
    - id: ch05
      title: Peace at Last
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The chief secretary could make no sense of the woman's tale, so he returned to town. The whole village laughed at the old woman so thoroughly that from then on, she had to hold her tongue and obey her husband.
        - id: ch05-b02
          speaker: narrator
          text: The old man used part of the treasure to buy goods. Then he moved into town, opened a shop, and prospered. He spent the rest of his days in peace.
