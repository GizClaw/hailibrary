audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 编者
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清晰的成年男声
        pace: 从容舒展
        pitch: 中低音
    old_man:
      display_name: 老头儿
      tts:
        delivery: 老实沉着，盘算时透着机敏
        timbre: 温厚略沙哑的老年男声
        pace: 适中
        pitch: 中低音
    wife:
      display_name: 老太婆
      tts:
        delivery: 嘴快性急，自信又爱声张
        timbre: 响亮爽利的老年女声
        pace: 稍快
        pitch: 中高音
    secretary:
      display_name: 首席书记官
      tts:
        delivery: 威严审慎，受冒犯时语气严厉
        timbre: 清晰沉稳的成年男声
        pace: 适中
        pitch: 中低音
    elder_1:
      display_name: 村中长老甲
      tts:
        delivery: 稳重朴实，带一点看热闹的笑意
        timbre: 苍老浑厚的男声
        pace: 稍慢
        pitch: 低音
    elder_2:
      display_name: 村中长老乙
      tts:
        delivery: 平实直率，语气笃定
        timbre: 清楚温和的老年男声
        pace: 适中
        pitch: 中低音
    elder_3:
      display_name: 村中长老丙
      tts:
        delivery: 随和爽朗，略带调侃
        timbre: 明亮粗粝的老年男声
        pace: 适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 林中的财宝
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，一座小村庄里住着一对老夫妻。两个人原本可以过得很快活，可老太婆偏偏管不住嘴。家里一有事情，或是丈夫从外面带回一点消息，她马上就要说给全村人听。话传来传去，越传越不像样，常常惹出乱子，最后挨打受苦的却总是老头儿。
        - id: ch01-b02
          speaker: narrator
          text: >-
            一天，老头儿赶着车来到森林。走到林边，他下了车，跟在车旁往前走。忽然，脚下的地面一软，他的一只脚陷进了土里。
        - id: ch01-b03
          speaker: old_man
          text: >-
            这下面是什么？我挖开看看。
        - id: ch01-b04
          speaker: narrator
          text: >-
            他挖了又挖，竟挖出一只小罐。罐子里装得满满的，全是金子和银子。
        - id: ch01-b05
          speaker: old_man
          text: >-
            真是走运！可我怎么把这些财宝带回家呢？妻子一定会发现。只要她知道了，准会嚷得人人都听见，到时候麻烦又落到我头上。
        - id: ch01-b06
          speaker: narrator
          text: >-
            老头儿坐在原地，把这件事翻来覆去想了很久，终于有了主意。他先用泥土盖住罐子，又在上面铺好树枝，让人看不出这里藏着东西。随后，他赶车进城，在集市上买了一条活梭鱼和一只活野兔。
        - id: ch01-b07
          speaker: narrator
          text: >-
            回到森林以后，他把梭鱼挂到一棵树的最高处，又将野兔装进渔网，系在小溪边。至于那片湿地会让野兔多难受，他一点也没有放在心上。一切布置妥当，他便坐上车，喜滋滋地赶回家。
        - id: ch01-b08
          speaker: old_man
          text: >-
            老婆子，你绝对猜不到，咱们交了多大的好运！
        - id: ch01-b09
          speaker: wife
          text: >-
            什么好运？亲爱的老头子，快从头到尾告诉我！
        - id: ch01-b10
          speaker: old_man
          text: >-
            不行。你一听完，转身就会告诉所有人。
        - id: ch01-b11
          speaker: wife
          text: >-
            我绝不会说！你怎么能这样想我？真不像话！不信的话，我可以发誓，永远也不——
        - id: ch01-b12
          speaker: old_man
          text: >-
            好吧。你要真能保密，就听仔细了。我在森林里发现了一罐金银。嘘，小声些！
        - id: ch01-b13
          speaker: wife
          text: >-
            那你怎么没把它带回来？
        - id: ch01-b14
          speaker: old_man
          text: >-
            咱们得一起去，两个人小心地把它运回来。
        - id: ch01-b15
          speaker: narrator
          text: >-
            就这样，老夫妻又赶着车，朝森林出发了。

    - id: ch02
      title: 树上的鱼与水里的兔
      blocks:
        - id: ch02-b01
          speaker: old_man
          text: >-
            老婆子，世上的怪事可真多。前两天有人告诉我，如今鱼儿能在树梢上生活，越长越壮，有些野兽反倒整天待在水里。啧啧，这世道真是变了。
        - id: ch02-b02
          speaker: wife
          text: >-
            你一定是疯了，老头子！人们怎么会说出这种荒唐话？
        - id: ch02-b03
          speaker: old_man
          text: >-
            可不是荒唐吗？咦，你快看！那棵树上好像有条鱼。我瞧着，还真是一条梭鱼。
        - id: ch02-b04
          speaker: wife
          text: >-
            天哪，梭鱼怎么跑到树上去了？它就是梭鱼，你可别硬说不是。难道人们讲的竟然是真的——
        - id: ch02-b05
          speaker: narrator
          text: >-
            老头儿摇摇头，耸耸肩，还张大嘴巴愣在那里，好像连自己的眼睛也不敢相信。
        - id: ch02-b06
          speaker: wife
          text: >-
            你这个傻瓜，还站着瞪什么？快爬上去把梭鱼抓下来，咱们晚上煮了吃！
        - id: ch02-b07
          speaker: narrator
          text: >-
            老头儿爬上树，取下梭鱼，两个人继续赶路。快到溪边时，他忽然把车勒住了。
        - id: ch02-b08
          speaker: wife
          text: >-
            你怎么又盯着看？还不快赶车？
        - id: ch02-b09
          speaker: old_man
          text: >-
            我布下的那张网里，好像有东西在动。我得过去看一眼。
        - id: ch02-b10
          speaker: narrator
          text: >-
            他跑到网边，低头看清里面的东西，便回身朝妻子喊。
        - id: ch02-b11
          speaker: old_man
          text: >-
            快来看！网里真的逮住了一只四条腿的活物。我看，这准是一只野兔。
        - id: ch02-b12
          speaker: wife
          text: >-
            老天爷呀，野兔怎么钻进渔网里了？它明明就是野兔，你别想说它不是。看来，人们讲的果然没错——
        - id: ch02-b13
          speaker: narrator
          text: >-
            丈夫仍旧摇头、耸肩，摆出一副不敢相信的样子。
        - id: ch02-b14
          speaker: wife
          text: >-
            你又傻站着干什么？快把野兔提起来。这么肥的一只兔子，正好做顿节日大餐！
        - id: ch02-b15
          speaker: narrator
          text: >-
            老头儿提起野兔，两人再次上路，一直赶到藏宝的地方。他们扫开盖在上面的树枝，挖去泥土，终于取出那只装满金银的罐子。随后，他们把罐子稳稳放上车，一起载回了家。

    - id: ch03
      title: 老太婆告状
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            老夫妻从此有了许多钱，吃穿不愁，日子过得又快活又舒坦。可老太婆实在糊涂。她每天都请来一大群人，在家里摆开宴席，请大家尽情吃喝。这样过了一天又一天，丈夫终于忍无可忍。他耐着性子同妻子讲道理，她却一句也听不进去。
        - id: ch03-b02
          speaker: wife
          text: >-
            你没资格教训我！财宝是咱们一起找到的，当然也该一起花。
        - id: ch03-b03
          speaker: old_man
          text: >-
            你爱怎样就怎样，可我以后不会再给你一文钱。
        - id: ch03-b04
          speaker: narrator
          text: >-
            老太婆听了，气得火冒三丈。
        - id: ch03-b05
          speaker: wife
          text: >-
            好哇，这个没用的东西，竟想独吞所有的钱！你等着，看我怎么收拾你。
          emotion: angry
        - id: ch03-b06
          speaker: narrator
          text: >-
            她径直跑去见总督，开口便告丈夫的状。
        - id: ch03-b07
          speaker: wife
          text: >-
            大人，请您保护我，别让我丈夫欺负！自从找到那笔财宝，他就变得谁也受不了。他只管吃喝，不肯做事，还把所有钱都扣在自己手里。
        - id: ch03-b08
          speaker: narrator
          text: >-
            总督很同情她，命首席书记官查清这件事。书记官召集村里的长老，带着他们一起去了老头儿家。
        - id: ch03-b09
          speaker: secretary
          text: >-
            总督有令。你找到的财宝，必须全部交给我保管。
        - id: ch03-b10
          speaker: old_man
          text: >-
            什么财宝？我根本不知道有财宝这回事。
        - id: ch03-b11
          speaker: secretary
          text: >-
            你还敢说不知道？你妻子已经告了你的状，少在这里撒谎！要是不马上交出所有钱财，就凭你挖到财宝却不禀报总督这一条，也要把你送去受审。
          emotion: angry
        - id: ch03-b12
          speaker: old_man
          text: >-
            请大人宽恕。可那究竟是什么样的财宝？一定是我妻子做梦梦见的，诸位先生却把她的胡话当真了。
        - id: ch03-b13
          speaker: wife
          text: >-
            胡话？满满一罐金银，你竟然说是胡话？
          emotion: angry
        - id: ch03-b14
          speaker: old_man
          text: >-
            亲爱的老婆子，你这是神志不清了。大人，请您见谅。您问问她事情是怎么发生的吧。她要真能让您相信，我情愿拿命抵偿。

    - id: ch04
      title: 谁会相信她
      blocks:
        - id: ch04-b01
          speaker: wife
          text: >-
            书记官大人，事情是这样的。我们赶车穿过森林，看见一条梭鱼待在树梢上——
        - id: ch04-b02
          speaker: secretary
          text: >-
            什么，梭鱼？你以为可以拿我取笑吗？
          emotion: angry
        - id: ch04-b03
          speaker: wife
          text: >-
            我真的没有说笑，大人！我说的每一句都是实话。
        - id: ch04-b04
          speaker: old_man
          text: >-
            诸位先生，现在你们看见了吧？她这样胡言乱语，说的话还能信几分？
        - id: ch04-b05
          speaker: wife
          text: >-
            我胡言乱语？我！难道你连咱们在河里捉到活野兔的事也忘了？
          emotion: angry
        - id: ch04-b06
          speaker: narrator
          text: >-
            众人听完，顿时哄堂大笑。就连书记官也忍不住笑了，一边笑，一边摸着胡须。
        - id: ch04-b07
          speaker: old_man
          text: >-
            好了，老婆子，大家都在笑你。诸位先生，你们亲眼瞧见了，她的话到底能信几分。
        - id: ch04-b08
          speakers: [elder_1, elder_2, elder_3]
          ensemble: chorus
          text: >-
            可不是吗！野兔能在水里过日子，鱼儿能在树梢间生活，这种事我们还是头一回听说。
        - id: ch04-b09
          speaker: narrator
          text: >-
            书记官听来听去，怎么也理不出头绪，只好赶车回城。老太婆被大家笑得再也抬不起头。从那以后，她只得管住嘴巴，乖乖听丈夫的话。
        - id: ch04-b10
          speaker: narrator
          text: >-
            老头儿拿出一部分财宝购置货物，搬进城里开了一间铺子。他的买卖越做越兴旺，余下的日子也过得太平安稳。
