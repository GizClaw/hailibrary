  chapters:
    - id: ch01
      title: The Emperor's Challenge
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, a young man made a vow. He would marry no one unless royal blood ran in her veins. One day, he gathered all his courage and went to the palace. There he asked the emperor for the hand of his daughter.
        - id: ch01-b02
          speaker: narrator
          text: The emperor had only one child, and he did not care for the match at all. Still, he was too polite to say so plainly.
        - id: ch01-b03
          speaker: emperor
          text: Very well, my son. If you can win the princess, you may marry her. But first, you must meet my conditions. Within eight days, bring me three untamed horses that have never known a master. One must be pure white. One must be fox-red with a black head. The last must be coal-black, with a white head and white feet. And you must bring my wife a gift as well. Load those three horses with as much gold as they can carry.
        - id: ch01-b04
          speaker: narrator
          text: The young man was dismayed. Even so, he forced himself to thank the emperor for his kindness. Then he left the palace, wondering how he could ever complete such a task.
        - id: ch01-b05
          speaker: narrator
          text: Luckily, the emperor's daughter had heard every word. From behind a curtain, she had also seen the young man. She thought he was more handsome than anyone she had ever seen.
        - id: ch01-b06
          speaker: narrator
          text: The princess hurried back to her room and wrote him a letter. She gave it to a servant she trusted. The letter begged her suitor to come to her rooms early the next morning. If he truly wanted her as his wife, he must attempt nothing until he had heard her advice.
        - id: ch01-b07
          speaker: narrator
          text: That night, after her father fell asleep, the princess crept softly into his chamber. She opened the chest where he kept his treasures, took out an enchanted knife, and hid it safely away before going to bed.
    - id: ch02
      title: The Princess's Secret
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The sun had barely risen when the princess's nurse brought the young man to her rooms. For several minutes, neither of them spoke. They simply stood there, holding hands in their joy. At last, they both cried out that nothing but death would ever part them. Then the princess told him what he must do.
        - id: ch02-b02
          speaker: princess
          text: Take my horse and ride straight through the woods toward the setting sun. Keep going until you reach a hill with three peaks. Turn right first, and then turn left. That will lead you into a sunny meadow where many horses graze.
        - id: ch02-b03
          speaker: princess
          text: Find the three horses my father described. They may be too wild to let you come near. If they run from you, draw this knife and hold it in the sunlight. Its rays will fill the whole meadow with light. Then the horses will come to you on their own and allow you to lead them away.
        - id: ch02-b04
          speaker: princess
          text: Once the horses are secure, look for a cypress tree. Its roots are brass, its branches are silver, and its leaves are gold. Cut through the roots with the knife. Beneath them, you will find more bags of gold than you can count.
        - id: ch02-b05
          speaker: princess
          text: Load the horses with all the gold they can bear. Then return to my father. Tell him you have completed his task and may claim me as your wife.
        - id: ch02-b06
          speaker: narrator
          text: The princess had said all she could. Now everything depended on the young man.
    - id: ch03
      title: The Meadow of Horses
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: He tucked the knife into the folds of his girdle, mounted the princess's horse, and rode away in search of the meadow. He found it without much trouble. But the horses were so shy that the moment he drew near, they galloped away.
        - id: ch03-b02
          speaker: narrator
          text: The young man pulled out the knife and raised it toward the sun. At once, a glorious light shone from it and bathed the whole meadow. Horses rushed toward him from every side. As each one passed, it dropped to its knees to honor him.
        - id: ch03-b03
          speaker: narrator
          text: From that great herd, he chose only the three the emperor had named. There was the pure white horse, the fox-red horse with a black head, and the coal-black horse with a white head and white feet. He tied them to his own mount with a silken rope.
    - id: ch04
      title: The Treasure Beneath the Cypress
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Next, he searched for the cypress. It stood alone in a corner of the meadow. In moments, he was beside it, digging away the earth with the enchanted knife.
        - id: ch04-b02
          speaker: narrator
          text: Deeper and deeper he dug. Far below the brass roots, the blade struck buried treasure. Bags of gold lay heaped all around. With great effort, the young man lifted them from their hiding place and loaded them onto the horses one by one.
        - id: ch04-b03
          speaker: narrator
          text: When the three horses could carry no more, he led them back to the emperor. The emperor stared in wonder. He could not guess how the young man had outwitted him, and he did not learn the truth until the betrothal ceremony was over.
        - id: ch04-b04
          speaker: narrator
          text: Then the emperor asked his new son-in-law what dowry he wished to receive with his bride.
        - id: ch04-b05
          speaker: young_man
          text: Noble emperor, I desire only your daughter as my wife, and the use of your enchanted knife forever.
