audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 编者
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清晰的成年男声
        pace: 从容舒展
        pitch: 中低音
    young_man:
      display_name: 年轻人
      tts:
        delivery: 真诚勇敢，紧张时仍守礼克制
        timbre: 清朗坚定的青年男声
        pace: 适中
        pitch: 中音
    emperor:
      display_name: 皇帝
      tts:
        delivery: 威严客气，话中暗藏考验
        timbre: 浑厚端正的成年男声
        pace: 稍慢
        pitch: 中低音
    princess:
      display_name: 公主
      tts:
        delivery: 聪慧果断，面对爱人温柔而坚定
        timbre: 明亮柔和的年轻女声
        pace: 适中
        pitch: 中高音
  chapters:
    - id: ch01
      title: 皇帝的难题
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，有个年轻人发过誓，他要娶的姑娘一定得有王族血统。一天，他终于鼓足勇气，进宫向皇帝求娶公主。皇帝只有这一个女儿，心里很不愿意把她嫁给这样的年轻人。不过，他没有失掉礼数，只给求婚者出了一道难题。
        - id: ch01-b02
          speaker: emperor
          text: >-
            好吧，孩子。你若有本事赢得公主，我就答应这门婚事。可你得在八天之内，驯服三匹从没让人骑过的马，再把它们带回来。第一匹浑身雪白。第二匹身子火红，脑袋却是黑的。第三匹通身乌黑，脑袋和四只蹄子却是白的。你还要给皇后带一份礼物。那三匹马能驮多少黄金，你就得带来多少。
        - id: ch01-b03
          speaker: narrator
          text: >-
            年轻人听得心里发慌，却还是勉强镇定下来，谢过皇帝，离开了宫殿。他一路都在想，这样的任务怎么可能完成。幸运的是，公主把父亲的话全听见了。她从帘子后面看见求婚的年轻人，觉得自己一生中从没见过这样英俊的人。
        - id: ch01-b04
          speaker: narrator
          text: >-
            公主赶紧回房写了一封信，托可靠的仆人送出去。信里请年轻人第二天一早来见她，还说，如果他真想娶她，在听到她的办法之前，什么也不要做。

    - id: ch02
      title: 公主与魔刀
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            那天夜里，公主等父亲睡熟，轻轻溜进寝宫。她从装珍宝的箱子里取出一把魔刀，藏到了稳妥的地方，然后才回去睡觉。
        - id: ch02-b02
          speaker: narrator
          text: >-
            第二天，太阳才刚露面，公主的乳母就把年轻人带进她的房间。两人欢喜地握着彼此的手，好半天都说不出一句话。到最后，他们一同喊出了心里的誓言。
        - id: ch02-b03
          speakers: [young_man, princess]
          ensemble: duo
          text: >-
            除了死亡，谁也不能把我们分开！
        - id: ch02-b04
          speaker: princess
          text: >-
            你骑我的马出发，朝太阳落下的方向一直走，穿过树林，找到一座有三个峰头的山。到了山下，先往右转，再往左转，就能看见一片洒满阳光的草场。那里有许多马在吃草，你要找出父亲说的三匹。要是它们一见你就躲，不肯让你靠近，你便拔出魔刀，让太阳照在刀刃上。刀光会洒遍草场，那些马自然会走过来，让你牵走。
        - id: ch02-b05
          speaker: princess
          text: >-
            三匹马到手以后，你再找一棵柏树。它的根是黄铜的，枝是白银的，叶子全是黄金的。用魔刀斩开树根，下面藏着数不尽的金袋。三匹马能驮多少，你就装多少。然后回来告诉父亲，你已经完成任务，可以娶我了。

    - id: ch03
      title: 阳光下的马群
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            公主把办法全告诉了他，剩下的就看年轻人自己了。他把刀藏进腰带的褶缝，骑上马去寻找那片草场。一路没有遇到太多周折，他很快便找对了地方。可那里的马十分怕人。他才走近一步，马群就飞奔着躲开。
        - id: ch03-b02
          speaker: narrator
          text: >-
            年轻人拔出魔刀，朝着太阳高高举起。灿烂的刀光立刻照满整片草场。四面八方的马全向他奔来，争先恐后地围在身边。每一匹从他面前经过的马，都会屈下双膝，向他致敬。
        - id: ch03-b03
          speaker: narrator
          text: >-
            年轻人只选出皇帝要的三匹，用丝绳把它们系在自己的坐骑后面，然后开始寻找柏树。那棵树独自长在草场的一角，他很快便来到了树下。

    - id: ch04
      title: 金袋与婚约
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            年轻人赶到树下，拿魔刀刨开泥土，一直往深处挖。挖到黄铜树根底下时，刀锋碰到了埋藏的宝物。四周全是一袋袋堆起来的黄金。他使出全身力气，把金袋从地下搬出来，一袋一袋放上三匹马的背，直到它们再也驮不动。
        - id: ch04-b02
          speaker: narrator
          text: >-
            他牵着三匹马回去见皇帝。皇帝看着眼前的一切，大为惊讶，却始终猜不到年轻人究竟用了什么办法，竟能胜过自己。等订婚仪式结束，皇帝问刚刚定下来的女婿，想让新娘带什么陪嫁。
        - id: ch04-b03
          speaker: young_man
          text: >-
            尊贵的皇帝陛下，我只求娶您的女儿做妻子，再让我永远使用您的魔刀。这就是我想要的一切。
        - id: ch04-b04
          speaker: narrator
          text: >-
            这个故事出自《塞尔维亚民间故事》。
