  chapters:
    - id: ch01
      title: The Herb Seller's Son
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Fairies, witches, and magicians did not live only in Eastern lands or in ancient times. They have belonged to every country and every age. No doubt we would see plenty of them even now, if only we knew how to look.
        - id: ch01-b02
          speaker: narrator
          text: A few hundred years ago, a poor cobbler and his wife lived in a large German town. The cobbler spent his days in a little stall on a street corner, mending every pair of shoes brought to him. His wife, Hannah, sold the fruit and vegetables from their garden in the Market Place. She kept herself and her stall so neat, and arranged her goods so invitingly, that customers came often.
        - id: ch01-b03
          speaker: narrator
          text: They had one child, a handsome, pleasant boy named Jem. He was twelve years old and tall for his age. He sat beside his mother at the market and carried people's purchases home. They often rewarded him with a flower, a slice of cake, or even a small coin.
        - id: ch01-b04
          speaker: narrator
          text: One day, Jem and Hannah had spread fine herbs and vegetables across their board. Early pears, apples, and apricots filled the smaller baskets. Jem called out as loudly as he could.
        - id: ch01-b05
          speaker: jem
          text: Come this way, gentlemen! Look at these lovely cabbages and fresh herbs! Ladies, we have early apples, pears, and apricots, all at a good price. Come and buy!
        - id: ch01-b06
          speaker: narrator
          text: An old woman crossed the Market Place toward them. Her clothes were torn and ragged. Her small, sharp face was covered in wrinkles, her eyes were red, and her thin hooked nose nearly touched her chin. Leaning on a tall stick, she limped and shuffled as if she might pitch forward at any moment. At last she stopped before their stall.
        - id: ch01-b07
          speaker: old_woman
          text: Are you Hannah, the herb seller?
        - id: ch01-b08
          speaker: hannah
          text: Yes, I am. What can I get for you?
        - id: ch01-b09
          speaker: old_woman
          text: We shall see. Let me inspect those herbs. Perhaps you have what I need.
        - id: ch01-b10
          speaker: narrator
          text: She pushed her ugly brown hands into the herb basket. Her thin fingers tossed aside Hannah's tidy bundles, and she lifted one herb after another to her nose and sniffed. Hannah hated to see her goods handled that way, but she did not dare object. When the woman had disturbed the entire basket, she muttered that it was all poor stuff, much worse than it had been fifty years before.
        - id: ch01-b11
          speaker: jem
          text: What a rude old woman you are! First you spoil our herbs with those horrible brown fingers. Then you sniff them with that long nose until nobody else will want them. And now you call them bad, when even the duke's own cook buys his herbs from us!
          emotion: angry
        - id: ch01-b12
          speaker: narrator
          text: The old woman gave the bold boy a sharp look and let out an unpleasant laugh.
        - id: ch01-b13
          speaker: old_woman
          text: So my long nose displeases you, does it, little boy? Then you shall have one of your own, reaching right down to your chin.
        - id: ch01-b14
          speaker: narrator
          text: She shuffled to the hamper of cabbages. One by one, she picked them up, squeezed them hard, and tossed them back, still muttering that they were bad.
        - id: ch01-b15
          speaker: jem
          text: Please don't shake your head like that. Your neck is as thin as a cabbage stalk. It might snap, and your head could fall straight into the basket. Who would buy anything then?
        - id: ch01-b16
          speaker: old_woman
          text: You dislike thin necks too? Then you shall have no neck at all. Your head will sit close between your shoulders, where it cannot fall off.
        - id: ch01-b17
          speaker: hannah
          text: Stop talking such nonsense to the boy. If you mean to buy something, please be quick. You are driving my other customers away.
        - id: ch01-b18
          speaker: old_woman
          text: Very well. I will take these six cabbages. But I walk with a stick, as you can see, and I cannot carry them. Send your boy home with me, and I will pay him for the trouble.
        - id: ch01-b19
          speaker: narrator
          text: Jem was frightened of the woman and began to cry. His mother still ordered him to go, because she believed they should help such a feeble old creature. So Jem filled a basket with the cabbages and followed the woman across the Market Place, crying as he went.
    - id: ch02
      title: Seven Years in the Strange House
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The old woman moved so slowly that more than half an hour passed before they reached a distant part of town. Jem followed beneath the weight of the cabbages until she stopped at a small, crumbling house. She pulled a rusty hook from her pocket and pushed it into a little hole in the door. The door flew open at once.
        - id: ch02-b02
          speaker: narrator
          text: Inside, Jem found a home of astonishing splendor. The walls and ceiling were marble. Ebony furniture gleamed with gold and precious stones. The floor was made of glass so smooth and slippery that Jem fell more than once.
        - id: ch02-b03
          speaker: narrator
          text: The woman blew a silver whistle, and its note rang through the house. A troop of guinea pigs hurried down the stairs. Each walked upright, wore nutshell shoes and men's clothing, and had a hat in the very latest fashion.
        - id: ch02-b04
          speaker: old_woman
          text: Where are my slippers, you lazy creatures? How long do you expect me to stand here waiting?
          emotion: angry
        - id: ch02-b05
          speaker: narrator
          text: She swung her stick at them. They raced upstairs and soon returned carrying two coconuts lined with leather. The old woman slipped them onto her feet. At once, her limp vanished. She threw away her stick and strode briskly across the glass floor, pulling Jem behind her.
        - id: ch02-b06
          speaker: narrator
          text: They entered a room so full of pots and pans that it looked like a kitchen, though its tables were mahogany and its chairs and sofas wore the richest coverings. The woman pushed Jem into the corner of a sofa and drew a table close before him.
        - id: ch02-b07
          speaker: old_woman
          text: Sit down. You have walked a long way with a heavy load, so I owe you something for your trouble. Wait here. I will make you a fine soup, one you will remember for the rest of your life.
        - id: ch02-b08
          speaker: narrator
          text: She whistled once more. Guinea pigs in men's clothes entered first, wearing large kitchen aprons with carving knives and ladles tucked into their belts. Then came squirrels in full Turkish trousers and little green velvet caps. They scrambled up the walls and fetched pots, eggs, flour, butter, and herbs for the stove. The woman bustled among them, preparing something special.
        - id: ch02-b09
          speaker: narrator
          text: When the broth bubbled, she poured it into a silver bowl and placed it before Jem.
        - id: ch02-b10
          speaker: old_woman
          text: Eat this soup, my boy. Then you will have everything you admired so much about me. You will become a clever cook as well. But the true herb? No, you will never find that. Why did your mother not have it in her basket?
        - id: ch02-b11
          speaker: narrator
          text: Jem did not understand her words, but he understood the soup. Nothing his mother had ever served tasted so delicious. Sweetness and sharpness mingled with the strong scent of herbs and spices.
        - id: ch02-b12
          speaker: narrator
          text: As he finished, the guinea pigs lit Arabian incense. Blue vapor slowly filled the room, growing thicker until the scent nearly overcame him. Jem knew he should return to his mother, but each time he tried to rise, he sank back into the sofa. At last, he fell fast asleep.
        - id: ch02-b13
          speaker: narrator
          text: Then came a strange dream. The old woman took away his clothes and wrapped him in a squirrel skin. He joined her well-mannered squirrels and guinea pigs and waited upon her. For the first year, he cleaned and polished her coconut slippers. After that, he learned to catch tiny sun moths, press them through the finest sieves, and bake their flour into soft bread for the toothless woman.
        - id: ch02-b14
          speaker: narrator
          text: Every year brought a different kind of service, and he spent a full year learning each one. In the fourth year, he entered the kitchen. He began as the lowest scullion, then worked his way upward until he became head pastry cook. By then, his skill was extraordinary. He could prepare the hardest dishes, two hundred kinds of patties, and soups flavored with every sort of herb. Whatever they taught him, he learned it quickly and learned it well.
        - id: ch02-b15
          speaker: narrator
          text: After seven years, the old woman went out one day and ordered him to kill and pluck a chicken, fill it with herbs, and roast it perfectly before she returned. Jem followed every rule. He wrung the chicken's neck, dipped it in boiling water, removed each feather, and rubbed the skin smooth.
        - id: ch02-b16
          speaker: narrator
          text: When he went for the stuffing herbs, he noticed a half-open cupboard in the storeroom, one he could not remember seeing before. Inside were baskets giving off a powerful, pleasant scent. In one basket grew a rare herb. Its stems and leaves were blue-green, and its deep red flower had a yellow edge.
        - id: ch02-b17
          speaker: narrator
          text: Jem stared at the flower and breathed in. It had the same strange perfume as the old woman's soup. The scent was so sharp that he sneezed over and over. Then, all at once, he woke.
        - id: ch02-b18
          speaker: narrator
          text: He was lying on the old woman's sofa, staring around in wonder.
        - id: ch02-b19
          speaker: jem
          text: What an extraordinary dream! I could have sworn I was a squirrel living among guinea pigs, and that I became a great cook. Mother will laugh when she hears it. But she may scold me for sleeping in a stranger's house instead of helping at the market.
        - id: ch02-b20
          speaker: narrator
          text: Jem sprang up and prepared to leave, though his whole body felt stiff after such a long sleep. His neck was stiffest of all, and he could barely turn his head. As he crossed the room, his nose kept striking walls and cupboards. Jem only laughed at his own foolishness. He thought he was still so drowsy that he could not walk properly.
        - id: ch02-b21
          speaker: narrator
          text: The squirrels and guinea pigs followed him, whimpering as if they wished to leave too. At the doorway, Jem invited them along. Instead, every one of them turned and rushed back into the house.
    - id: ch03
      title: The Dwarf in the Mirror
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Jem did not know the narrow streets in that distant neighborhood. Their twists confused him, and crowds seemed to be gathering for a show. Again and again, he heard people calling out about an ugly dwarf with a long nose, a head sunk between his shoulders, and ugly brown hands. Jem loved displays of giants and dwarfs, and he might have followed them if he had not been so anxious to reach his mother.
        - id: ch03-b02
          speaker: narrator
          text: At last he reached the Market Place. Hannah still sat in her usual place, and plenty of fruit remained in her baskets. Jem took that as proof that he could not have slept very long. Yet something was wrong. His mother looked sadder than he remembered and paler than usual. She made no effort to call passing customers. She only sat with her head resting heavily on one hand.
        - id: ch03-b03
          speaker: narrator
          text: Jem hesitated. Then he slipped behind her and touched her arm.
        - id: ch03-b04
          speaker: jem
          text: Mammy, what is wrong? Are you angry with me?
        - id: ch03-b05
          speaker: narrator
          text: Hannah spun around and sprang to her feet with a cry of horror.
        - id: ch03-b06
          speaker: hannah
          text: What do you want, you hideous dwarf? Go away! I cannot bear such tricks!
          emotion: fearful
        - id: ch03-b07
          speaker: jem
          text: But Mother, what is the matter? You must be ill. Why are you sending your own son away?
          emotion: fearful
        - id: ch03-b08
          speaker: hannah
          text: I told you to leave. Your cruel game will get nothing from me, you little monster!
          emotion: angry
        - id: ch03-b09
          speaker: narrator
          text: Jem murmured that she must have lost her senses. He wondered how he could possibly get her home.
        - id: ch03-b10
          speaker: jem
          text: Dear Mother, please look closely at me. Can't you see that I am Jem, your own son?
        - id: ch03-b11
          speaker: hannah
          text: Have you ever heard such shamelessness? Look at this dreadful dwarf! He expects me to believe he is my Jem!
        - id: ch03-b12
          speaker: narrator
          text: The market women crowded around, all talking at once. They scolded Jem for tormenting Hannah, who had never recovered after her beautiful boy was stolen seven years before. If the dwarf did not leave, they threatened to scratch him.
        - id: ch03-b13
          speaker: narrator
          text: Jem could make no sense of it. He was certain that he had come to market with his mother that very morning. He had helped arrange the stall, carried the old woman's cabbages, eaten a bowl of soup, and taken one short nap. Yet these women spoke of seven whole years, and they called him a horrible dwarf. What in the world had happened? When Hannah truly refused to accept him, tears filled his eyes. He turned away and walked sadly toward his father's stall.
        - id: ch03-b14
          speaker: jem
          text: I will see whether Father knows me. I will stand at his door and speak to him.
        - id: ch03-b15
          speaker: narrator
          text: The cobbler was so busy that he did not notice Jem at first. When he finally looked up, his shoes, thread, and tools fell from his hands.
        - id: ch03-b16
          speaker: jem_father
          text: Good heavens! What is that?
          emotion: surprised
        - id: ch03-b17
          speaker: jem
          text: Good evening, master. How are you?
        - id: ch03-b18
          speaker: jem_father
          text: Poorly, little sir. Trade is bad. I work alone, I am growing old, and hiring help costs too much.
        - id: ch03-b19
          speaker: jem
          text: Don't you have a son who could slowly learn the trade?
        - id: ch03-b20
          speaker: jem_father
          text: I did. His name was Jem. By now he would be a strong young man of twenty and a great help to me. Even at twelve he was quick and clever. He had learned many small tasks, and customers liked his handsome face and pleasant manner. Well, that is how the world goes.
        - id: ch03-b21
          speaker: jem
          text: Where is your son now?
          emotion: fearful
        - id: ch03-b22
          speaker: jem_father
          text: Only heaven knows. He was stolen from the Market Place seven years ago. We have heard nothing since.
        - id: ch03-b23
          speaker: jem
          text: Seven years ago?
          emotion: surprised
        - id: ch03-b24
          speaker: jem_father
          text: Yes, seven years, though it feels like yesterday. My wife came home weeping because he had not returned all day. I had always warned her. The town was large and full of dangerous people, but she was proud of Jem and let him carry goods to grand houses, where everyone made a pet of him.
        - id: ch03-b25
          speaker: jem_father
          text: Then an old woman bought more than she could carry. My kindhearted wife sent Jem to help her, and we never saw him again. We searched every house and had his description cried through town. Many people knew and loved him, but nobody knew the woman. Only one person had an answer. A ninety-year-old woman said it might have been the fairy Herbaline, who comes here once every fifty years to shop.
        - id: ch03-b26
          speaker: narrator
          text: As his father spoke, the truth slowly became clear. Jem had not dreamed at all. For seven years, he had truly served the old woman in the shape of a squirrel. The thought filled him with rage. Seven years of his youth had been stolen. And what had he received in return? He knew how to oil and polish coconut shoes, scrub slippery glass floors, and prepare food under the instruction of guinea pigs.
        - id: ch03-b27
          speaker: jem_father
          text: Is there anything I can do for you, young gentleman? Perhaps I could make you slippers. Or perhaps you need a case for that nose of yours.
        - id: ch03-b28
          speaker: jem
          text: What is wrong with my nose? Why would it need a case?
        - id: ch03-b29
          speaker: jem_father
          text: Everyone has his own taste. If that nose belonged to me, though, I would cover it in fine red leather. I have just the piece. It would protect you when you knock into things.
        - id: ch03-b30
          speaker: narrator
          text: Jem touched his face and found a thick nose two hand-lengths long. Now he understood why Hannah had called him a dwarf. The fairy had changed his body.
        - id: ch03-b31
          speaker: jem
          text: Master, do you have a mirror I may use?
        - id: ch03-b32
          speaker: jem_father
          text: Young gentleman, your looks give you little reason for vanity. There is no point wasting time before a mirror. I have none here anyway. Try Urban the barber across the street. Good morning.
        - id: ch03-b33
          speaker: narrator
          text: The cobbler gently pushed Jem outside, shut the door, and returned to work. Jem crossed the street to Urban, whom he had known long ago.
        - id: ch03-b34
          speaker: jem
          text: Good morning, Urban. May I use your mirror for a moment?
        - id: ch03-b35
          speaker: barber
          text: Of course! Such a handsome youth, with that swanlike neck, those white hands, and that tiny nose. No wonder you are vain. Look as long as you please.
        - id: ch03-b36
          speaker: narrator
          text: Everyone in the shop laughed. Jem stood before the mirror, staring sadly until tears filled his eyes. No wonder his mother had failed to know him. This was not the boy whose beauty had made her proud.
        - id: ch03-b37
          speaker: narrator
          text: His eyes had become tiny, almost like a pig's. His enormous nose hung down over his mouth and chin. His throat seemed to have vanished completely, leaving his head fixed stiffly between his shoulders. Though seven years had passed, he was no taller than he had been at twelve. Instead, his back and chest had swollen into two great humps like heavy sacks. Thin, spindly legs held up that broad body. His arms were as large as a grown man's, and they ended in big brown hands with long, narrow fingers.
        - id: ch03-b38
          speaker: narrator
          text: Jem remembered every threat the woman had made that morning. Without another word, he left the barber's shop.
        - id: ch03-b39
          speaker: narrator
          text: He found Hannah still at the market and begged her to listen quietly. He reminded her of the day he had gone away with the old woman. Then he recalled many things from his childhood that her true son would know. He explained how the fairy had bewitched him and forced him to serve for seven years. Hannah did not know what to believe. His memories sounded true, but the story itself was almost impossible, and this ugly dwarf looked nothing like her handsome boy. At last, she decided to ask her husband. She packed her baskets, told Jem to follow, and led him straight to the cobbler's stall.
        - id: ch03-b40
          speaker: hannah
          text: This creature claims he is our missing boy. He says a fairy stole him seven years ago and put him under a spell.
        - id: ch03-b41
          speaker: jem_father
          text: Does he indeed? I told this rascal the whole story only an hour ago, and now he uses it to fool you. So you were bewitched, were you? Wait there, and I will bewitch you myself!
          emotion: angry
        - id: ch03-b42
          speaker: narrator
          text: He seized a bundle of leather straps and struck at Jem until the poor dwarf ran away crying.
    - id: ch04
      title: The Grand Duke's Kitchen
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Jem wandered through the streets for the rest of the day. He had no food and not even a drink of water. When night came, he was glad to lie down on the stone steps of a church and sleep. The first rays of morning woke him. Now he had to decide how a lonely dwarf could earn his living. Then he remembered the one useful thing the fairy's household had given him. He was an excellent cook, trained in dishes few others could make. He would look for a position in a kitchen.
        - id: ch04-b02
          speaker: narrator
          text: As soon as day had fully broken, Jem went to the palace. He knew the grand duke who ruled the country was very fond of fine food. Palace servants surrounded Jem, laughing and making jokes about him. Their noise grew so loud that the head steward came rushing out.
        - id: ch04-b03
          speaker: head_steward
          text: For goodness' sake, be quiet! Have you forgotten that His Highness is still asleep?
        - id: ch04-b04
          speaker: narrator
          text: Some servants fled, while others pointed to Jem. The steward himself could hardly keep from laughing. Still, he dismissed them and took the dwarf into his room. When Jem asked for a cook's position, the steward thought he had misunderstood.
        - id: ch04-b05
          speaker: head_steward
          text: Surely you mean to apply as the grand duke's court dwarf, my lad.
        - id: ch04-b06
          speaker: jem
          text: No, sir. I am a trained cook. Please take me to the head cook, and he may discover that I can be useful.
        - id: ch04-b07
          speaker: head_steward
          text: Have it your way, though the place of court dwarf would be much easier.
        - id: ch04-b08
          speaker: narrator
          text: He led Jem to the head cook. Jem bowed so deeply that his nose nearly brushed the floor.
        - id: ch04-b09
          speaker: jem
          text: Sir, could you use an experienced cook?
        - id: ch04-b10
          speaker: narrator
          text: The head cook looked him up and down, then burst out laughing.
        - id: ch04-b11
          speaker: head_cook
          text: You, a cook? Our stoves are not low enough for you to see into the pots. Whoever sent you here must be playing a joke.
        - id: ch04-b12
          speaker: jem
          text: In a house like this, surely you can spare an egg or two, a little flour and butter, and a few spices. Name any dish. Give me what I ask for, and let my cooking answer you.
        - id: ch04-b13
          speaker: narrator
          text: Jem would not be discouraged. He kept explaining what he could do until the head cook finally agreed to test him. Together they entered the palace kitchen. It was an enormous room, with at least twenty fireplaces burning at once. A little stream of perfectly clear water ran straight through it, and live fish were kept in the water at one end, ready for cooking. Every pot, pan, knife, and table was of the finest quality. Great numbers of cooks and scullions hurried from fire to fire as they prepared the duke's food. The moment the head cook entered with the strange dwarf beside him, all of them stopped and stood completely still.
        - id: ch04-b14
          speaker: head_cook
          text: What has His Highness requested for luncheon?
        - id: ch04-b15
          speaker: kitchen_servant
          text: His Highness has ordered Danish soup and red Hamburg dumplings, sir.
        - id: ch04-b16
          speaker: head_cook
          text: You heard the order. Can you manage those dishes? I doubt you can make the dumplings. Their recipe is secret.
        - id: ch04-b17
          speaker: jem
          text: Is that all? I need eggs, wild boar, and the proper roots and herbs for the soup. For the dumplings, bring me four kinds of meat, wine, duck marrow, ginger, and an herb called heal-well.
        - id: ch04-b18
          speaker: head_cook
          text: Where in the world did you learn to cook? Those are exactly the right ingredients. We have never added heal-well, but I am certain it will improve the flavor.
          emotion: surprised
        - id: ch04-b19
          speaker: narrator
          text: Jem was given his chance and all the ingredients he had named. He could not come close to reaching the high kitchen range, but he solved that problem by laying a broad plank across two chairs. Standing on it, he worked as easily as any other cook. Everyone gathered around to watch. Soon they were admiring the speed and confidence with which he cut, mixed, seasoned, and stirred. At last, both dishes were prepared. Jem ordered that the pots remain over the fires until he gave the word. Then he began counting aloud. He counted steadily from one all the way to five hundred.
        - id: ch04-b20
          speaker: jem
          text: Now!
        - id: ch04-b21
          speaker: narrator
          text: At Jem's signal, the cooks lifted both pots from the heat. Jem invited the head cook to taste his work. The first cook brought out a golden spoon, carefully washed it, wiped it dry, and handed it over. With great ceremony, the head cook approached the food and tasted first one dish, then the other. He paused to judge the flavors, and then smacked his lips with pleasure.
        - id: ch04-b22
          speaker: head_cook
          text: First-rate! You truly are a master, little fellow. That heal-well gives the food a remarkable savor.
        - id: ch04-b23
          speaker: narrator
          text: The duke's valet arrived to announce that His Highness was ready to eat. The food was carried in on silver dishes. The head cook took Jem aside to question him, but almost at once a messenger summoned him to the grand duke. He put on his finest clothes and hurried away.
        - id: ch04-b24
          speaker: narrator
          text: The grand duke looked thoroughly pleased. Both silver dishes stood empty before him, and he was wiping his mouth when the head cook entered in his best clothes.
        - id: ch04-b25
          speaker: grand_duke
          text: Who prepared my luncheon today? Your dumplings are always good, but I have never tasted any so delicious. Who made them?
        - id: ch04-b26
          speaker: narrator
          text: The head cook told him the strange story. The duke was so amazed that he ordered the dwarf brought in and questioned him closely. Jem could hardly admit that he had once been a squirrel, so he only said he had no parents and had learned cooking from an old woman.
        - id: ch04-b27
          speaker: grand_duke
          text: Stay in my service, and I will pay you fifty ducats each year, along with a new coat and two pairs of trousers. You will cook my luncheon yourself and direct the menu for dinner. From now on, you shall be assistant head cook.
        - id: ch04-b28
          speaker: narrator
          text: Jem bowed all the way to the floor and promised to obey his new master in everything. He wasted no time before beginning his duties. Soon, everyone in the palace kitchen was glad to have him there. The grand duke was not a patient man. In the past, when food failed to suit his taste, he had been known to hurl plates and dishes at his cooks and servants. Under Jem's direction, all that changed. The duke no longer threw anything. He did not even grumble. Instead of three meals a day, he began eating five. Every dish delighted him, and he grew fatter day by day.
        - id: ch04-b29
          speaker: narrator
          text: Two years passed. Jem was respected by everyone, though thoughts of his parents still made him sad. Day followed day in much the same way, until something remarkable happened.
    - id: ch05
      title: The Talking Goose
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Dwarf Long Nose, as everyone called him, preferred to choose the palace food himself. Whenever he had time, he visited the market for fruit and poultry. One morning, he went to the goose market in search of fine, fat birds. No one laughed at him now. Everyone knew he was the duke's personal cook, and each seller felt honored when his long nose turned toward her stall.
        - id: ch05-b02
          speaker: narrator
          text: One woman sat apart from all the others with several geese. Unlike the rest of the sellers, she did not call out to passing shoppers or boast about the quality of her birds. Jem went to her stall. He felt each goose carefully and weighed it in his hands. The birds were plump and in excellent condition. He chose three, paid for them and the cage that held them, then lifted the entire load onto his broad shoulders and set off toward the palace.
        - id: ch05-b03
          speaker: narrator
          text: Two geese gobbled and cried as geese normally do. The third remained quiet and only gave a deep sigh now and then, almost like a person.
        - id: ch05-b04
          speaker: jem
          text: That goose must be ill. I had better hurry home and kill and dress her.
        - id: ch05-b05
          speaker: mimi
          text: Squeeze me tight and I will bite. Twist my neck, and you will meet an early grave.
        - id: ch05-b06
          speaker: narrator
          text: Terrified, Jem set down the cage. The goose looked at him with sad, knowing eyes and sighed again.
        - id: ch05-b07
          speaker: jem
          text: Good gracious! You can speak, Mistress Goose. I never imagined such a thing. Don't be afraid. I know better than to harm so rare a bird. And I would wager you did not always wear feathers. After all, I was once a squirrel myself.
          emotion: surprised
        - id: ch05-b08
          speaker: mimi
          text: You are right. I was not born in this dreadful shape. No one would ever have dreamed that Mimi, daughter of the great Weatherbold, would be killed for the grand duke's table.
          emotion: sad
        - id: ch05-b09
          speaker: jem
          text: You are safe with me, Mistress Mimi. I am an honest man and assistant head cook to His Highness. No one will hurt you. I will build a little shelter in my rooms, feed you well, and visit whenever I can. I will tell the cooks that I am fattening you on a special diet for the duke. When the right chance comes, I will set you free.
          emotion: calm
        - id: ch05-b10
          speaker: narrator
          text: Tears filled Mimi's eyes as she thanked him. Jem kept his promise. The other two geese became dinner, but Mimi received a small shed in his room. He claimed he wanted to fatten her under his own watch. In every spare moment, he talked with her, comforted her, and brought her the finest food.
        - id: ch05-b11
          speaker: narrator
          text: As the days passed, they learned to trust each other and shared their histories. Mimi explained that her father was the great wizard Weatherbold, who lived far away on the island of Gothland. He had once quarreled with an old fairy. The fairy could not overcome him by honest magic, so she used cunning and treachery to get the better of him. Then, to take revenge upon Weatherbold, she cast a spell over his daughter. She turned Mimi into a goose and carried her away to this distant country, far beyond her father's help.
        - id: ch05-b12
          speaker: mimi
          text: I know something about enchantments. From what you have told me, yours was worked through an herb. If you can find the herb whose scent woke you, the spell should break.
        - id: ch05-b13
          speaker: narrator
          text: That gave Jem little comfort. He had no idea what the herb was or where to search for it.
    - id: ch06
      title: The Queen of Pasties
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Around that time, a neighboring prince came to visit the grand duke. He was the duke's friend, but also a famous judge of food. The duke summoned Long Nose.
        - id: ch06-b02
          speaker: grand_duke
          text: Now you must show me your full skill. My guest enjoys finer dinners than anyone but me, and he knows excellent cooking. While he is here, surprise him at every meal. Never serve the same dish twice, or you will answer to me. Buy anything you need and spare no expense. Melt down gold and precious stones if you must. I would rather become poor than feel ashamed before this prince.
        - id: ch06-b03
          speaker: jem
          text: I will obey, Your Highness. I shall do everything in my power to please you and your guest.
        - id: ch06-b04
          speaker: narrator
          text: From that moment, Jem was hardly ever seen anywhere but the kitchen. His helpers crowded around him from morning until night as he directed every part of the work. He gave orders, watched the fires, baked pastries, stewed meats, measured seasonings, and arranged the finished dishes. No matter how many meals the two rulers demanded, he kept sending out something new.
        - id: ch06-b05
          speaker: narrator
          text: The prince remained at the palace for two full weeks and enjoyed himself tremendously. He and the grand duke sat down to eat five times every day. Still, Jem never repeated a dish. The duke watched the prince closely at every meal. Whenever he saw how much his guest enjoyed the food, he felt more satisfied with the dwarf's remarkable talent. On the fifteenth day of the visit, the grand duke sent for Jem. This time, instead of keeping the little cook hidden away in the kitchen, he brought Jem before the prince and formally presented him.
        - id: ch06-b06
          speaker: prince
          text: You are a marvelous cook and clearly understand good food. Not once during my visit have you repeated a dish, and every one has been excellent. Yet why have you never served the queen of all dishes, the Suzeraine Pasty?
        - id: ch06-b07
          speaker: narrator
          text: Jem was frightened. He had never even heard of this Queen of Pasties, but he kept his face composed.
        - id: ch06-b08
          speaker: jem
          text: I hoped Your Highness would remain with us for some time. My plan was to honor the final day of your visit with that truly royal dish.
        - id: ch06-b09
          speaker: grand_duke
          text: Indeed? Then you must have been saving it for the day I die, because you have never served it to me. Find some other farewell dish. The pasty will be on my table tomorrow.
        - id: ch06-b10
          speaker: jem
          text: As Your Highness commands.
        - id: ch06-b11
          speaker: narrator
          text: Jem bowed and withdrew, but the duke's command did not please him at all. He believed the hour of his disgrace had finally come. He could prepare hundreds of difficult foods, yet he had never heard the name Suzeraine Pasty and had no idea how it was made. He returned to his rooms in deep sadness and sat without moving, completely lost in thought. Mimi was allowed to walk freely there. She came up to him, saw his troubled face, and asked what had happened. Jem told her about the prince's request and the duke's command. As soon as she understood the problem, Mimi assured him that she knew the dish.
        - id: ch06-b12
          speaker: mimi
          text: Take heart, my friend. I know that dish well. We often ate it at home, and I can tell you almost exactly how it was made.
          emotion: calm
        - id: ch06-b13
          speaker: narrator
          text: Mimi named the ingredients and explained how to use them.
        - id: ch06-b14
          speaker: mimi
          text: I believe that is everything. If I have forgotten one tiny detail, perhaps they will not notice.
        - id: ch06-b15
          speaker: narrator
          text: The following day, Jem's magnificent pasty was carried to the royal table. A wreath of flowers encircled it, making it look worthy of its title. Jem dressed himself in his finest clothes and went personally to the dining hall. He arrived just as the head carver cut through the crust and placed generous servings before the grand duke and his guests. The duke lifted a large forkful, put it into his mouth, and swallowed. As he tasted it, his eyes rolled upward with delight.
        - id: ch06-b16
          speaker: grand_duke
          text: Oh! This deserves its name as Queen of Pasties, and my dwarf deserves to be called king of cooks. Don't you agree, my dear friend?
          emotion: happy
        - id: ch06-b17
          speaker: narrator
          text: The prince took several small pieces. He tasted each carefully and examined the dish. Then a secretive, mocking smile crossed his face.
        - id: ch06-b18
          speaker: prince
          text: It is very nicely prepared, but the Suzeraine is not complete. That is just what I expected.
        - id: ch06-b19
          speaker: narrator
          text: The grand duke burst into a rage.
        - id: ch06-b20
          speaker: grand_duke
          text: You dog of a cook! How dare you put an unfinished dish before me? I should have that enormous head chopped off!
          emotion: angry
        - id: ch06-b21
          speaker: jem
          text: Mercy, Your Highness! I followed the finest rules, and I left nothing out. Ask the prince what ingredient is missing.
          emotion: fearful
        - id: ch06-b22
          speaker: prince
          text: I knew you could not equal my own cook, friend Long Nose. The missing herb is called Relish. It is unknown in this country, but it gives the pasty its special flavor. Without Relish, your master will never taste the dish in its perfection.
        - id: ch06-b23
          speaker: grand_duke
          text: But I will taste it in perfection! Tomorrow you will make the pasty properly, or you will lose your head. Go, scoundrel. You have twenty-four hours.
          emotion: angry
        - id: ch06-b24
          speaker: narrator
          text: Jem hurried to his room and poured out his grief to Mimi.
        - id: ch06-b25
          speaker: mimi
          text: Is that all? Then I can help you. My father taught me every plant and herb. We are fortunate, because Relish grows only at the new moon, and tonight the moon is new. Are there chestnut trees near the palace?
        - id: ch06-b26
          speaker: jem
          text: Yes! A large grove stands by the lake, only a few hundred yards away. Why?
        - id: ch06-b27
          speaker: mimi
          text: Relish grows only among chestnut roots. We must search at once. Carry me under your arm, set me down outside, and I will find it.
    - id: ch07
      title: The Herb That Broke the Spell
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: Jem carried Mimi into the garden and placed her on the ground. She waddled toward the lake as fast as she could, with Jem hurrying anxiously behind. His life depended on her success.
        - id: ch07-b02
          speaker: narrator
          text: Mimi searched beneath one chestnut tree after another. At every trunk, she bent low and turned over each blade of grass with her bill. Jem followed and watched, but again and again she found nothing. The whole grove seemed empty of Relish. All the while, evening drew closer and the light began to fade. Jem knew that if they failed before nightfall, the duke's sentence would soon be carried out. Then he looked across the lake and noticed one more chestnut, a great old tree standing entirely by itself on the opposite bank.
        - id: ch07-b03
          speaker: jem
          text: Look over there! Let us try beneath that one.
        - id: ch07-b04
          speaker: narrator
          text: Mimi fluttered and skipped ahead. Jem ran after her as quickly as his short legs allowed. The tree spread a wide shadow, and beneath it the ground was almost dark. Suddenly, Mimi stopped, beat her wings with joy, and plucked a plant. She held it out to her astonished friend.
        - id: ch07-b05
          speaker: mimi
          text: Here it is! More of it grows nearby, so you will have all you need.
          emotion: happy
        - id: ch07-b06
          speaker: narrator
          text: Jem stood motionless, staring at the plant in Mimi's bill. A strong, sweet fragrance rose from it, and the scent carried him at once to the day of his enchantment. He remembered the strange cupboard, the basket of herbs, and the sharp perfume that had ended his seven-year sleep. This plant looked the same as well. Its stems and leaves were blue-green. At the top bloomed a deep, bright red flower with a narrow yellow edge.
        - id: ch07-b07
          speaker: jem
          text: How wonderful! I truly believe this is the herb that changed me from a squirrel into this miserable shape. Should I test it now?
          emotion: surprised
        - id: ch07-b08
          speaker: mimi
          text: Not here. Gather a good handful and bring it to your room. First we will collect your money and clothes. Then you can test its power.
        - id: ch07-b09
          speaker: narrator
          text: Back in his room, Jem gathered the fifty ducats he had saved, along with his clothes and shoes, and tied everything into a bundle. Then he buried his face in the herbs and drew in their perfume.
        - id: ch07-b10
          speaker: narrator
          text: The change began the instant he breathed in. Every limb cracked and stretched. He felt his head rising higher and higher above his shoulders as his missing neck returned. When he glanced down, his enormous nose was growing smaller before his eyes. The heavy humps across his chest and back sank away until his body was straight and well formed. His short, spindly legs stretched into the legs of a grown young man. Mimi watched every part of the transformation in amazement.
        - id: ch07-b11
          speaker: mimi
          text: Oh, how tall and handsome you are! Thank heaven, you are completely changed!
          emotion: happy
        - id: ch07-b12
          speaker: narrator
          text: Jem folded his hands in gratitude. Even in his joy, he did not forget what he owed his friend.
        - id: ch07-b13
          speaker: jem
          text: You saved my life and set me free. Without you, I would never have regained my true form, and soon I would have lost my head. I will take you home to your father. Surely he will know how to break your enchantment.
        - id: ch07-b14
          speaker: narrator
          text: Mimi accepted his offer with joy. Carrying his bundle and keeping his friend close, Jem found a way out of the palace. Nobody noticed the handsome young man or guessed that he was the missing dwarf. He and Mimi traveled safely all the way to the island of Gothland. When they reached Weatherbold, the wizard soon broke the spell that held his daughter in a goose's form. He was deeply grateful to Jem for bringing her home. He thanked the young man again and again, then loaded him with valuable gifts for his return journey.
        - id: ch07-b15
          speaker: narrator
          text: Jem hurried back to his native town. This time, his parents gladly recognized the handsome young man as their missing son. With the wizard's money, Jem opened a shop. It prospered, and he lived a long and happy life.
        - id: ch07-b16
          speaker: narrator
          text: Yet Jem's disappearance caused a great disturbance at the palace. The next day, the grand duke ordered the dwarf beheaded if he had failed to find the herb. But the dwarf was nowhere to be found. The prince suggested that the duke had secretly let his cook escape and had therefore broken his word.
        - id: ch07-b17
          speaker: narrator
          text: The quarrel ended in a terrible war between the two rulers. History remembered it as the Herb War. After many battles and much loss of life, peace finally came. That agreement became known as the Pasty Peace, because at the celebration banquet, the prince's cook served the Queen of Pasties, the Suzeraine. The grand duke tasted it and declared it quite excellent.
