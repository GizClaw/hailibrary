audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 编者
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清晰的成年男声
        pace: 从容舒展
        pitch: 中低音
    jem:
      display_name: 杰姆
      tts:
        delivery: 聪敏直率，历经磨难后更显沉着
        timbre: 清亮灵活的年轻男声
        pace: 适中偏快
        pitch: 中高音
    hanna:
      display_name: 汉娜
      tts:
        delivery: 勤快爽利，悲伤时带着疲惫
        timbre: 朴实温暖的成年女声
        pace: 适中
        pitch: 中音
    herb_fairy:
      display_name: 香草仙子
      tts:
        delivery: 嘶哑尖刻，话里藏着阴冷的戏弄
        timbre: 干涩苍老的女声
        pace: 缓慢拖沓
        pitch: 中低音
    shoemaker:
      display_name: 鞋匠
      tts:
        delivery: 朴直劳苦，失子后忧郁而戒备
        timbre: 粗粝厚重的成年男声
        pace: 稍慢
        pitch: 低音
    barber:
      display_name: 理发师乌尔班
      tts:
        delivery: 油滑爱打趣，笑意里带着刻薄
        timbre: 明亮圆滑的成年男声
        pace: 适中偏快
        pitch: 中音
    steward:
      display_name: 总管
      tts:
        delivery: 威严利落，待人带着审视
        timbre: 清晰端正的成年男声
        pace: 适中
        pitch: 中低音
    head_cook:
      display_name: 总厨
      tts:
        delivery: 自负爽朗，识得真本领后坦率赞赏
        timbre: 洪亮饱满的成年男声
        pace: 适中
        pitch: 中低音
    duke:
      display_name: 大公
      tts:
        delivery: 好食而专横，喜怒来得猛烈
        timbre: 浑厚威势的成年男声
        pace: 适中偏慢
        pitch: 低音
    mimi:
      display_name: 咪咪
      tts:
        delivery: 聪慧温柔，忧伤中始终保持镇定
        timbre: 清柔细腻的年轻女声
        pace: 适中
        pitch: 中高音
    prince:
      display_name: 亲王
      tts:
        delivery: 讲究挑剔，客气中透着讥诮
        timbre: 清雅冷淡的成年男声
        pace: 从容
        pitch: 中音
  chapters:
    - id: ch01
      title: 集市上的诅咒
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            要是有人以为仙女、女巫和魔法师只在遥远的东方出现，只属于哈伦·阿尔·拉希德那个年代，那就错了。仙灵不挑国家，也不挑时代。哪怕到了今天，只要懂得怎么看，照样能遇见不少。
        - id: ch01-b02
          speaker: narrator
          text: >-
            大约两百年前，德国一座大城里住着一对贫穷而勤劳的夫妻。丈夫是鞋匠，整天坐在街角的小摊里，谁送来鞋子，他就替谁修补。妻子汉娜一面操持家里的生活，一面把自家园里的瓜果蔬菜拿到集市出售。她总把自己和货物收拾得干干净净，菜也摆得叫人一看就想买，所以生意很好。
        - id: ch01-b03
          speaker: narrator
          text: >-
            夫妻俩只有一个孩子，名字叫杰姆。他十二岁，个子比同龄孩子高，模样俊秀，脸上总带着讨人喜欢的神情。他常陪母亲坐在集市守摊。顾客买了东西，他就主动替人家送回家。大家都喜欢这个孩子，常送他一朵漂亮的花、一片蛋糕，有时还给他一枚小钱作为酬谢。
        - id: ch01-b04
          speaker: narrator
          text: >-
            一天，摊上摆满鲜嫩的香草、蔬菜，还有早熟的梨、苹果和杏子。杰姆像往常一样，扯开嗓子招呼客人。
        - id: ch01-b05
          speaker: jem
          text: >-
            先生们，来这边看看！卷心菜多漂亮，香草多新鲜！太太们，这儿有早熟的苹果、梨和杏子，价钱便宜，快来买呀！
        - id: ch01-b06
          speaker: narrator
          text: >-
            一个衣衫褴褛的老妇人从集市对面走来。她小脸尖尖的，布满皱纹，眼睛通红，细长的鹰钩鼻几乎碰到下巴。她拄着一根高高的手杖，一路跛着脚，还拖着步子。她走得东倒西歪，看上去随时会一头栽到自己的鼻子上。她就这样慢慢穿过人群，蹒跚来到母子俩的摊前，停住了。
        - id: ch01-b07
          speaker: herb_fairy
          text: >-
            你就是那个卖香草的汉娜吗？
        - id: ch01-b08
          speaker: hanna
          text: >-
            是我。您要买什么？
        - id: ch01-b09
          speaker: herb_fairy
          text: >-
            我先看看。让我好好找找，你这里到底有没有我要的香草。
        - id: ch01-b10
          speaker: narrator
          text: >-
            她把褐色的丑手伸进篮子，用干瘦的手指翻乱一把又一把香草，还把每样东西都凑到长鼻子下面闻。汉娜看着她糟蹋货物，心里很厌恶，却没敢出声。老妇人翻遍了整只篮子，仍在不停嘟囔。
        - id: ch01-b11
          speaker: herb_fairy
          text: >-
            都是坏东西。五十年前的货可比这些强多了。坏东西，全是坏东西。
        - id: ch01-b12
          speaker: narrator
          text: >-
            杰姆一下子火了。
        - id: ch01-b13
          speaker: jem
          text: >-
            你这老太婆太没礼貌了！你先用那双难看的褐手把好香草翻得乱七八糟，又拿长鼻子一把把地闻，弄得别人都不肯买，最后还敢说它们不好。连公爵的厨师都只来我们这里买香草！
          emotion: angry
        - id: ch01-b14
          speaker: narrator
          text: >-
            老妇人转过那张尖脸，用锐利的目光瞪着这个大胆的孩子。接着，她咧开嘴，发出一阵叫人很不舒服的笑声。
        - id: ch01-b15
          speaker: herb_fairy
          text: >-
            原来你不喜欢我的长鼻子，小家伙？好啊，你自己也会长一只，一直垂到下巴上。
        - id: ch01-b16
          speaker: narrator
          text: >-
            她一边说，一边拖着脚挪到装卷心菜的大筐前。她把菜一颗颗拿起来，用力捏过，再随手扔回去。整筐菜被她弄得乱七八糟，嘴里还是不停念叨着坏东西。
        - id: ch01-b17
          speaker: jem
          text: >-
            求你别再那么吓人地摇头了。你的脖子细得像菜梗，一折就断。脑袋掉进筐里以后，谁还会来买菜？
        - id: ch01-b18
          speaker: herb_fairy
          text: >-
            连我的细脖子你也看不顺眼？那你就不用长脖子了。把脑袋牢牢夹在两肩中间，它再也掉不下来。
        - id: ch01-b19
          speaker: hanna
          text: >-
            别再对孩子说胡话了。您真要买，就快点挑吧，别的客人都叫您吓走了。
        - id: ch01-b20
          speaker: herb_fairy
          text: >-
            好，我就照你说的办。这六颗卷心菜，我全买了。不过你也看见了，我得拄着手杖走路，拿不了东西。让你儿子替我送回去，我会给他工钱。
        - id: ch01-b21
          speaker: narrator
          text: >-
            杰姆害怕老妇人，很不情愿，甚至哭了。可母亲认为，不肯帮助一个衰弱的老人是不对的，命令他去。杰姆只好一边擦眼泪，一边把六颗卷心菜装进篮子，跟老妇人穿过集市。他回头看了母亲几次，还是一步步走远了。

    - id: ch02
      title: 魔宅里的七年
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            老妇人走了半个多钟头，才在城里偏远的一角停下。眼前是一幢破败的小屋。她从口袋摸出一只生锈的旧钩子，往门上的小孔一插，门猛地弹开了。
        - id: ch02-b02
          speaker: narrator
          text: >-
            杰姆进门一看，惊得呆住了。破屋里面竟然富丽堂皇，和外表完全不同。墙壁和天花板全是大理石，乌木家具镶着黄金和宝石，地面则铺着光滑发亮的玻璃。杰姆从没走过这样的地面，一连摔了好几跤。
        - id: ch02-b03
          speaker: narrator
          text: >-
            老妇人吹响一枚银哨，一大群豚鼠立刻从楼梯上跑下来。它们都用后腿走路，脚穿果壳鞋，身上是男人的衣裳，头上还戴着最新式样的帽子。
        - id: ch02-b04
          speaker: herb_fairy
          text: >-
            我的拖鞋呢，你们这些懒骨头？还想让我站着等多久？
          emotion: angry
        - id: ch02-b05
          speaker: narrator
          text: >-
            她挥着手杖四处抽打。豚鼠慌忙跑上楼，取来一双内衬皮革的椰子壳。老妇人把它们套上，立刻不跛也不拖了。她扔掉手杖，轻快地走过玻璃地面，又拉着杰姆来到一间像厨房的屋子。那里锅碗齐全，红木桌旁却摆着蒙了华贵织物的沙发和椅子。
        - id: ch02-b06
          speaker: herb_fairy
          text: >-
            坐下歇歇吧。你走了这么远，还背着那么重的东西，我当然要给你报酬。等一会儿，我请你喝碗汤。这碗汤，你一辈子也忘不了。
        - id: ch02-b07
          speaker: narrator
          text: >-
            她把杰姆推进沙发角落，把一张桌子挪到他面前，又吹响哨子。穿男装的豚鼠先走进来，腰间系着大围裙，皮带上插满切肉刀、汤勺和各色家伙。接着又来了一群穿肥大土耳其裤、戴绿色天鹅绒帽的松鼠。它们像厨房杂役一样爬上墙，取下锅碗、鸡蛋、面粉、黄油和香草，全送到炉边。老妇人在炉前转个不停，显然正专门替杰姆烹调一道不同寻常的东西。
        - id: ch02-b08
          speaker: narrator
          text: >-
            汤终于咕嘟咕嘟地沸腾了。她把汤倒进银碗，放在孩子面前。
        - id: ch02-b09
          speaker: herb_fairy
          text: >-
            来，孩子，把汤喝了。你很喜欢我身上的那些地方，对吧？喝完以后，它们全会长到你身上。你还会成为一个了不起的厨师。不过那种真正要紧的香草，你永远找不到。为什么你母亲的篮子里偏偏没有它呢？
        - id: ch02-b10
          speaker: narrator
          text: >-
            杰姆不懂她的话，却喝得出汤有多鲜美。母亲做过许多好吃的，也没有一样比得上它。香草和香料热腾腾地飘出碗口，汤又甜又辛，滋味浓得惊人。
        - id: ch02-b11
          speaker: narrator
          text: >-
            汤快喝完时，豚鼠点起阿拉伯熏香。蓝烟越来越浓，香气熏得杰姆几乎失去知觉。他一遍遍提醒自己，该回母亲身边了。可每次想站起来，沉重的身体又陷进沙发。最后，他在角落里睡熟了。
        - id: ch02-b12
          speaker: narrator
          text: >-
            一个又一个怪梦接着来了。他梦见老妇人脱掉他的衣服，拿一张松鼠皮把他从头到脚裹住。从那以后，他便和松鼠、豚鼠住在一起，过起了和它们一样的日子。这些小动物全都彬彬有礼，彼此和气相待，又一心一意地侍候老妇人。
        - id: ch02-b13
          speaker: narrator
          text: >-
            起先，杰姆学习给老妇人的椰壳鞋擦油，再花许多工夫，把鞋面磨得闪闪发亮。后来，他又学会捕捉小小的太阳蛾。他把这些飞蛾放进最细的筛子里磨碎，再把筛出来的细粉和进面团，给没有牙齿的老妇人烤出松软的面包。
        - id: ch02-b14
          speaker: narrator
          text: >-
            就这样，杰姆每年都换一种差事。到了第四年，他终于被提拔进厨房，先从最低等的杂役做起，再一步步学会更难的手艺，最后竟然成了糕点总厨。到了这时候，再难的菜也难不倒他。他能烤出两百种不同的肉馅饼，也知道怎样用每一种香草调出鲜汤。无论老妇人和豚鼠教什么，他都学得又快又好。
        - id: ch02-b15
          speaker: narrator
          text: >-
            到第七年，有一天老妇人要出门，命他杀一只鸡，拔净羽毛，肚里塞满香草，在她回来时烤得正好。杰姆完全按规矩动手。他拧断鸡脖子，把鸡浸进沸水，仔细拔掉每一根羽毛，又把鸡皮摩挲得平滑干净。做完这些，他才去储藏室寻找填进鸡腹的香草。
        - id: ch02-b16
          speaker: narrator
          text: >-
            储藏室里有个半开的柜子，他从前好像从没见过。杰姆探头往里面一看，只见柜中摆着许多篮子，一阵浓烈而芬芳的气息从里面飘出来。他选中一只篮子，伸手打开，看见里面放着一种极为罕见的草。它的茎叶泛着蓝绿色，上面开着一朵深红而明艳的小花，每片花瓣的边缘都镶着黄色。
        - id: ch02-b17
          speaker: narrator
          text: >-
            杰姆盯着花，又凑近闻了闻。那正是七年前老妇人煮汤时的奇异香气。气味实在太冲，他一个接一个地打喷嚏。接着，他醒了。
        - id: ch02-b18
          speaker: narrator
          text: >-
            他仍躺在老妇人的沙发上，惊奇地看着四周。他觉得，一个人怎么会做这样古怪的梦？他几乎敢发誓，自己当过松鼠，和豚鼠一类的动物一起生活，还学成了一个出色的厨师。母亲听见准会笑个不停。可他在陌生人家白白睡觉，没有回集市帮忙，她知道以后，恐怕也会把他骂个痛快。
        - id: ch02-b19
          speaker: narrator
          text: >-
            杰姆跳起来要走，可身体像睡僵了，尤其是脖子，脑袋怎么也转不灵。他昏昏沉沉，不时用鼻子撞上墙壁和柜子，还觉得自己这副笨样很好笑。松鼠和豚鼠呜咽着跟到门边，像是也想离开。杰姆招呼它们同行，它们却全转过身，飞快跑回屋里。

    - id: ch03
      title: 父母认不出的孩子
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            这一带满是弯弯绕绕的窄巷，杰姆完全不认识路。街上又挤满了人，仿佛都赶着看热闹。他听见众人嚷着，快看那个丑矮人，他的鼻子多长，脑袋整个缩在两肩中间，还有一双难看的褐手。杰姆以为大家在谈论别处的矮人。若不是急着找母亲，他也想跟去看看。
        - id: ch03-b02
          speaker: narrator
          text: >-
            到了集市，他更糊涂了。母亲还坐在原处，篮中也剩着许多水果，看来他并没睡多久。可母亲神色悲伤，不再招呼客人，只用手托着头发呆，脸也比平日苍白。杰姆迟疑了一会儿，悄悄绕到她身后，把手放在她胳膊上。
        - id: ch03-b03
          speaker: jem
          text: >-
            妈妈，您怎么了？还在生我的气吗？
        - id: ch03-b04
          speaker: narrator
          text: >-
            汉娜猛地回头，惊叫着跳了起来。
        - id: ch03-b05
          speaker: hanna
          text: >-
            你这个丑矮子想干什么？快走开！这种恶作剧，我受不了！
          emotion: angry
        - id: ch03-b06
          speaker: jem
          text: >-
            可是妈妈，您到底怎么啦？您一定不舒服。为什么要赶自己的儿子走？
          emotion: fearful
        - id: ch03-b07
          speaker: hanna
          text: >-
            我叫你走开！你这个怪物，别想耍花招从我这里捞好处。
          emotion: angry
        - id: ch03-b08
          speaker: jem
          text: >-
            她一定糊涂了。我怎么才能带她回家呢？妈妈，请您仔细看看我。您真的认不出儿子杰姆了吗？
        - id: ch03-b09
          speaker: hanna
          text: >-
            你们听听，这话多无耻！这个吓人的矮子，居然要我相信他是我儿子杰姆！
        - id: ch03-b10
          speaker: narrator
          text: >-
            女摊贩们马上围了上来，七嘴八舌地骂他。她们说，汉娜太太那个漂亮的儿子七年前被人偷走，从那以后，她始终没能从悲痛中恢复。如今这个丑东西竟然还来拿她取乐，实在可恶透顶。要是他再不离开，大家就一起扑过去，把他狠狠抓挠一顿。
        - id: ch03-b11
          speaker: narrator
          text: >-
            杰姆完全不明白。他明明记得，早晨才帮母亲摆好摊，后来去了老妇人家，只喝一碗汤，睡了一个小觉。为什么人人都说过了七年，还叫他可怕的矮子？眼看母亲真不认他，他含着泪离开，走向父亲的鞋摊。他想，父亲总该认得自己。
        - id: ch03-b12
          speaker: narrator
          text: >-
            鞋匠一直埋头干活，很久才抬眼看见门口的客人。他吓得把鞋子和线团全扔到地上。
        - id: ch03-b13
          speaker: shoemaker
          text: >-
            天哪！这是什么东西？
          emotion: surprised
        - id: ch03-b14
          speaker: jem
          text: >-
            晚上好，师傅。您身体还好吗？
        - id: ch03-b15
          speaker: shoemaker
          text: >-
            糟透了，小先生。生意难做，我孤零零的，年纪也越来越大，又请不起伙计。
        - id: ch03-b16
          speaker: jem
          text: >-
            您不是有个儿子吗？他可以慢慢学会修鞋，帮您的忙。
        - id: ch03-b17
          speaker: shoemaker
          text: >-
            我从前有个儿子，也叫杰姆。他现在该二十岁了，准是个高大结实的小伙子。十二岁那年，他已经又机灵又能干，模样俊，性情也讨人喜欢，顾客见了他都高兴。唉，不说了，世事就是这样。
        - id: ch03-b18
          speaker: jem
          text: >-
            那么，您的儿子去了哪里？
        - id: ch03-b19
          speaker: shoemaker
          text: >-
            只有上天知道。七年前，他在集市上叫人拐走，从此再没有消息。
        - id: ch03-b20
          speaker: jem
          text: >-
            七年前？
          emotion: surprised
        - id: ch03-b21
          speaker: shoemaker
          text: >-
            整整七年，可我还觉得像昨天。那天妻子哭着回来，说孩子一整天没回家。我早就警告过她，城这么大，坏人又多，一定得把杰姆看紧。可她常让孩子替体面人家送东西。那天，一个老妇人买得太多，自己拿不了，她好心让杰姆送去。从那以后，我们再没见过他。
        - id: ch03-b22
          speaker: shoemaker
          text: >-
            我们请人沿街呼喊，又挨家挨户寻找，还是一无所获。没人认识那个买菜的老妇人。只有一位九十岁的老太太说，她也许是香草仙子，每隔五十年才进城采买一次。
        - id: ch03-b23
          speaker: narrator
          text: >-
            父亲说话的时候，杰姆心里的一切渐渐清楚了。那不是梦。他真的变成松鼠，在老妇人手下服侍了七年。想到七年的少年时光就这样被偷走，他胸中全是怒火。老妇人拿什么补偿他？是教他擦亮椰子壳，还是让他磨光玻璃地板，再叫豚鼠教会他厨艺？他呆呆站了很久，父亲才再次开口。
        - id: ch03-b24
          speaker: shoemaker
          text: >-
            年轻的先生，我能替你做些什么？一双拖鞋？还是给你的鼻子做个套子？
        - id: ch03-b25
          speaker: jem
          text: >-
            我的鼻子怎么了？为什么要给它做套子？
        - id: ch03-b26
          speaker: shoemaker
          text: >-
            各人有各人的爱好。不过我要是长着这种鼻子，一定拿这块好红皮给它做个结实的套子。不然，你准会老拿鼻子撞东西。
        - id: ch03-b27
          speaker: narrator
          text: >-
            杰姆吓得说不出话。他伸手一摸，鼻子又粗又长，足有两只手掌那么长。原来老妇人真的改了他的模样，难怪母亲认不出他。
        - id: ch03-b28
          speaker: jem
          text: >-
            师傅，您这里有镜子吗？我想看看自己。
        - id: ch03-b29
          speaker: shoemaker
          text: >-
            年轻的先生，你这副相貌实在不值得欣赏，也不用浪费工夫。我没有镜子。你非看不可，就去街对面的理发师乌尔班那里借吧。早安。
        - id: ch03-b30
          speaker: narrator
          text: >-
            鞋匠把他轻轻推出门，关门继续干活。杰姆去了街对面的理发店。那位理发师，他从前也认识。
        - id: ch03-b31
          speaker: jem
          text: >-
            早安，乌尔班。能借镜子给我照一会儿吗？
        - id: ch03-b32
          speaker: barber
          text: >-
            当然行！你真是位漂亮青年，脖颈像天鹅，双手又白净，鼻子还这么小巧，难怪爱照镜子。尽管照，照多久都行！
          emotion: happy
        - id: ch03-b33
          speaker: narrator
          text: >-
            满屋客人都窃笑起来。杰姆站到镜前，悲伤地望着自己，眼泪涌进眼眶。他想，难怪母亲认不出她的孩子。从前她为儿子的相貌自豪，那孩子绝不是如今这副样子。
        - id: ch03-b34
          speaker: narrator
          text: >-
            镜中人的眼睛缩得很小，活像一双猪眼。巨大的鼻子越过嘴和下巴，一直垂到下面。脖子仿佛完全消失了，脑袋僵硬地夹在两肩之间。他仍只有十二岁时那么高，身体却没有向上长，反倒横着长宽了。胸前和背后各鼓着一个大包，像挂着两只硕大的口袋。两条腿又细又短，两条胳膊却像壮年男子一样粗。褐色手掌又宽又丑，十根手指瘦长如柴。
        - id: ch03-b35
          speaker: narrator
          text: >-
            他想起初见老妇人的早晨，也想起她当时怎样嘲笑自己，怎样预告鼻子会垂到下巴，脑袋会夹进肩膀。这下他知道，她的每一句威胁都已经应验。他没有和理发师或客人争辩，只是一声不响地离开理发店，又回到集市找母亲。
        - id: ch03-b36
          speaker: narrator
          text: >-
            这一次，他请求汉娜静静听完。他提醒她回想自己跟老妇人离开的那一天，又说出许多只有母子俩知道的童年旧事，最后讲了仙女怎样对他施法，逼他服侍整整七年。汉娜不知道该信什么。故事实在太离奇，她那个漂亮的儿子和眼前这个丑矮人，又怎么可能是同一个人？最后，她决定去找丈夫商量，便收起篮子，叫杰姆跟在身后。
        - id: ch03-b37
          speaker: hanna
          text: >-
            你看看，这个东西说自己是我们失踪的儿子。他说七年前被人拐走，后来又中了仙女的魔法。
        - id: ch03-b38
          speaker: shoemaker
          text: >-
            是吗？他真敢这么说？你这个无赖，等一等！一个钟头前，是我亲口把事情告诉你的，你转身就拿它骗我妻子。原来你中了魔法，我的儿子？好，我马上让你尝尝我的魔法！
          emotion: angry
        - id: ch03-b39
          speaker: narrator
          text: >-
            鞋匠说完便抓起一捆皮带，劈头盖脸地抽过去。杰姆被打得哭叫起来，只能赶紧逃走。这个可怜的小矮人在街上游荡了一整天，身边没有一个能收留他的人。他没吃一口东西，也没喝一滴水。到了夜里，他总算找到一座教堂，只好躺在冰冷的台阶上睡着了。

    - id: ch04
      title: 王宫里的新厨师
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            第二天清晨，第一缕阳光唤醒杰姆。他开始盘算靠什么谋生，忽然记起，自己已经学成了高明的厨师。统治这片国土的大公最爱美食，他便趁天刚亮，向王宫走去。
        - id: ch04-b02
          speaker: narrator
          text: >-
            王宫的仆人一见他，就围上来嘲笑。喊声和笑声越来越响，总管终于冲出来。
        - id: ch04-b03
          speaker: steward
          text: >-
            看在老天的份上，你们不能安静一点吗？不知道殿下还在睡觉？
          emotion: angry
        - id: ch04-b04
          speaker: narrator
          text: >-
            有些仆人马上逃开，其余的人都指着杰姆。总管看见他，也差点笑出来。他赶走众人，把这个矮人带进自己的房间。听说杰姆想谋个厨师职位，总管十分意外。
        - id: ch04-b05
          speaker: steward
          text: >-
            孩子，你大概找错人了。你想要的，难道不是大公身边弄臣矮人的差事吗？
        - id: ch04-b06
          speaker: jem
          text: >-
            不是，先生。我是个有经验的厨师。请您带我去见总厨，他也许用得上我。
        - id: ch04-b07
          speaker: steward
          text: >-
            好吧，既然你非去不可，我就带你去。不过相信我，给大公当矮人，要轻松得多。
        - id: ch04-b08
          speaker: narrator
          text: >-
            总管把他领到总厨的房间。杰姆弯腰行礼，鼻尖几乎碰着地板。
        - id: ch04-b09
          speaker: jem
          text: >-
            先生，您这里需要一个有经验的厨师吗？
        - id: ch04-b10
          speaker: narrator
          text: >-
            总厨从头到脚打量他，放声大笑。
        - id: ch04-b11
          speaker: head_cook
          text: >-
            你是厨师？难道你以为我们的炉灶很矮，凭你的个头也看得见锅里？可爱的小家伙，不管是谁叫你来，都是故意拿你寻开心。
          emotion: happy
        - id: ch04-b12
          speaker: jem
          text: >-
            府上这么富贵，多用几个鸡蛋，多费一点黄油、面粉和香料，也算不了什么。您随便点一道菜，把材料给我，我当场做给您看。
        - id: ch04-b13
          speaker: narrator
          text: >-
            杰姆又劝了许久，总厨终于答应。他们来到厨房。那里至少有二十座炉灶，炉火常年不熄。一股清水从屋内流过，一端还养着活鱼。所有用具和食材都是最好的，大群厨师和杂役正在预备菜肴。总厨一进门，众人便停下手，站得笔直。
        - id: ch04-b14
          speaker: head_cook
          text: >-
            殿下吩咐午餐做什么？
        - id: ch04-b15
          speaker: steward
          text: >-
            殿下今天要一份丹麦汤，再来红色的汉堡丸子。
        - id: ch04-b16
          speaker: head_cook
          text: >-
            听见了吧？这两道菜你会不会？丸子你多半做不了，那可是秘传配方。
        - id: ch04-b17
          speaker: jem
          text: >-
            只有这些？太容易了。汤里要放鸡蛋、一块野猪肉，再配这几种根茎和香草。丸子需要四种肉、葡萄酒、鸭骨髓、少许姜，还要一种叫百病消的香草。
        - id: ch04-b18
          speaker: head_cook
          text: >-
            天哪，你从哪里学来的？一样材料也没说错！只是我们从来不用百病消。把它加进去，味道一定更好。
          emotion: surprised
        - id: ch04-b19
          speaker: narrator
          text: >-
            杰姆获准动手。炉台远远高过他的头，他便叫人搬来两把椅子，再在上面横架一块宽木板。他站到木板上，正好能够着锅灶，干起活来也十分顺手。厨房里的厨师全围过来看，人人都佩服他的动作敏捷、手法娴熟。等所有材料准备妥当，杰姆命人把两只锅放到火上，又郑重吩咐，没有他的命令，谁也不许把锅拿开。
        - id: ch04-b20
          speaker: narrator
          text: >-
            杰姆从一数起，一直数到五百，突然喊了一声现在。两只锅立即离火。他请总厨尝味道。一名厨师取来金汤匙，洗净擦干后递过去。总厨郑重地尝了尝，满意地咂着嘴。
        - id: ch04-b21
          speaker: head_cook
          text: >-
            的确好极了！小家伙，你真是烹饪大师。百病消又添了一种特别的滋味。
          emotion: happy
        - id: ch04-b22
          speaker: narrator
          text: >-
            大公的贴身侍从来传话，说殿下要用午餐了。菜立刻盛进银盘送上桌。总厨刚把杰姆带回房间，还没来得及细问，就被大公召去。他急忙换好衣裳，跟传信人走了。
        - id: ch04-b23
          speaker: narrator
          text: >-
            大公对这顿午餐满意极了。盘里的汤和丸子都已经吃得精光，总厨走进来时，他还在拿餐巾擦嘴。
        - id: ch04-b24
          speaker: duke
          text: >-
            今天这顿午餐是谁做的？你的丸子一向不错，可今天这份，是我一生吃过最美味的。到底是谁做的？
        - id: ch04-b25
          speaker: narrator
          text: >-
            总厨说事情十分离奇，随后从头讲了一遍。大公听得惊讶，立刻叫人把矮人带来，问了他许多问题。杰姆不能说自己曾变成松鼠，只说父母已经去世，厨艺是一个老妇人教的。
        - id: ch04-b26
          speaker: duke
          text: >-
            只要你肯留下，我每年给你五十枚达克特，另做一件新外套和两条裤子。每天午餐必须由你亲手做，晚餐吃什么也归你安排。从今天起，你就是副总厨。
        - id: ch04-b27
          speaker: narrator
          text: >-
            杰姆一直躬身到地，答应服从新主人。他没有耽搁，立刻开始工作。厨房里人人都庆幸有他，因为大公性子急躁。只要菜稍微不合口，他甚至会把盘子和碟子朝厨师、仆人的头上扔。自从杰姆掌勺，一切都变了。大公再也没有抱怨过任何一道菜，还把每天三餐增加到五餐。他餐餐都吃得满意，身子也一天比一天肥胖。
        - id: ch04-b28
          speaker: narrator
          text: >-
            两年过去，杰姆深受尊敬和器重。只有想起父母时，他才会难过。日子原本一天接一天，没有多少不同，直到一件意外发生。

    - id: ch05
      title: 会说话的鹅
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            大家一直叫他长鼻矮人。他喜欢亲自采买，只要有空，就去集市选家禽和水果。如今没人再取笑他的模样。人人都知道他是大公的专任厨师，卖鹅的女人只要看见那只长鼻子朝自己的摊位转来，便觉得十分光彩。
        - id: ch05-b02
          speaker: narrator
          text: >-
            一天早晨，他看见一个女人独自坐在旁边，四周围着许多鹅，却不像别人那样高声叫卖。杰姆走过去，把鹅一只只摸过，又掂了分量，觉得都很不错，就买下三只，连笼子一起扛在宽肩上回去。
        - id: ch05-b03
          speaker: narrator
          text: >-
            路上，两只鹅照常嘎嘎乱叫，第三只却安静地坐着，只偶尔像人一样深深叹气。杰姆觉得它病了，得赶快杀掉收拾干净。没想到，那只鹅清清楚楚地开了口。
        - id: ch05-b04
          speaker: mimi
          text: >-
            你若把我挤得紧，我就咬你不留情。你若胆敢扭我颈，我叫你早早丧命。
        - id: ch05-b05
          speaker: narrator
          text: >-
            杰姆大吃一惊，连忙放下笼子。那只鹅用忧伤而聪慧的眼睛望着他，又叹了一声。
        - id: ch05-b06
          speaker: jem
          text: >-
            天哪，鹅太太，你竟然会说话！别害怕，我不会伤害你这样稀罕的鸟。不过我敢说，你不是生来就长着羽毛。我自己也当过一阵松鼠。
          emotion: surprised
        - id: ch05-b07
          speaker: mimi
          text: >-
            你猜对了。我生来并不是这副可怕的样子。谁能想到，伟大的韦瑟博尔德之女咪咪，竟会叫人宰杀，再端上大公的餐桌呢？
          emotion: sad
        - id: ch05-b08
          speaker: jem
          text: >-
            放心吧，咪咪太太。只要我还是个诚实的人，还是殿下的副总厨，就没人能伤害你。我在房里给你搭个小窝，喂你最好的食物，有空就来陪你。我会告诉厨师们，我正用特别的饲料替大公催肥一只鹅。等有了合适的机会，我就放你自由。
          emotion: calm
        - id: ch05-b09
          speaker: narrator
          text: >-
            咪咪眼里含着泪，向他道谢。杰姆也说到做到。他杀掉另外两只鹅做晚餐，却告诉厨房里的人，自己要用一种特别的饲料，亲自替大公把咪咪催肥。他在自己的房间里搭了一间小棚，让咪咪住下。每逢有空，他就来陪她说话，安慰她，还把最精美的食物留给她。两人相处得越来越亲近，也互相讲了各自的遭遇。
        - id: ch05-b10
          speaker: narrator
          text: >-
            咪咪告诉杰姆，自己是魔法师韦瑟博尔德的女儿，父亲住在哥特兰岛上。韦瑟博尔德曾经和一个老仙女结下仇怨。仙女靠狡猾和背叛胜过了他，还嫌这样不够。为了继续报复，她把魔法师的女儿变成一只鹅，又把她从家乡带到这个遥远的地方。咪咪说完自己的遭遇，也认真听杰姆讲了七年来的一切，随后才说出自己的判断。
        - id: ch05-b11
          speaker: mimi
          text: >-
            这种魔法，我多少懂一些。照你说的，你中的是香草魔法。只要找到那种曾用气味把你唤醒的香草，咒语就会解开。
        - id: ch05-b12
          speaker: narrator
          text: >-
            可杰姆一点也轻松不起来。他连那种香草在哪里、该怎样寻找都不知道。

    - id: ch06
      title: 君主馅饼的考验
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            就在这时，邻国的一位亲王来拜访大公。两人原是朋友。大公把长鼻矮人召到面前，要他拿出真正的本领。
        - id: ch06-b02
          speaker: duke
          text: >-
            这位亲王是我的贵客。他家的宴席除了我的以外，胜过所有人，他本人也最懂烹饪。只要他还在这里，你每天就得端出更新奇的东西。记住，任何一道菜都不准出现两次。需要什么尽管拿，哪怕要熔掉金子和宝石也行。我宁可变成穷光蛋，也不能在他面前丢脸。你若惹我不快，就有苦头吃了。
        - id: ch06-b03
          speaker: jem
          text: >-
            谨遵殿下之命。我一定竭尽全力，让您和亲王满意。
        - id: ch06-b04
          speaker: narrator
          text: >-
            从那以后，小厨师几乎不离厨房。他身边围着一群助手，不停地下令、烘烤、炖煮、调味和装盘，一道接一道，做出数不清的菜。亲王在大公府上住了整整两个星期，每天吃五顿饭，而且过得十分快活。大公看见贵客如此满意，自己也觉得很有面子，对矮人的才华自然没有半点不满。
        - id: ch06-b05
          speaker: narrator
          text: >-
            到第十五天，大公把杰姆叫来，介绍给亲王。
        - id: ch06-b06
          speaker: prince
          text: >-
            你确实是位了不起的厨师，也真正懂得什么叫美味。我住了这些天，你没把同一道菜端上两次，而且每一道都很好。不过我倒想问问，群馅饼之女王，君主馅饼，你为什么从来没上过？
        - id: ch06-b07
          speaker: narrator
          text: >-
            杰姆心里一惊。他根本没听说过这位馅饼女王，可脸上没有露出慌张。
        - id: ch06-b08
          speaker: jem
          text: >-
            我一直盼着殿下能多住几日。我本来打算等您离开的最后一天，再用这道真正的王者之菜替您送行。
        - id: ch06-b09
          speaker: duke
          text: >-
            真是这样吗？那你大概想等到我死的那天才做，因为你也从没让我吃过。送别菜另想一道，君主馅饼明天必须上桌。
        - id: ch06-b10
          speaker: jem
          text: >-
            一切听从殿下吩咐。
        - id: ch06-b11
          speaker: narrator
          text: >-
            杰姆告退了，心里却很不情愿。丢脸的时候似乎到了，因为他完全不知道这种馅饼怎么做。他愁眉苦脸地回到房间，坐在那里苦想。平时能自由走动的咪咪来到身旁，问清了缘故。
        - id: ch06-b12
          speaker: mimi
          text: >-
            振作一点，我的朋友。这道菜我很熟。我们家从前常做，我大致能猜出做法。
          emotion: calm
        - id: ch06-b13
          speaker: narrator
          text: >-
            咪咪告诉他该放哪些材料，最后又安慰他说，这样应该差不多，就算少了一丁点东西，他们也未必尝得出来。
        - id: ch06-b14
          speaker: narrator
          text: >-
            第二天，一只华丽的大馅饼果然摆上餐桌，四周还缀满了鲜花。杰姆穿上自己最好的衣裳，亲自来到餐厅，想听听两位贵客怎样评价。就在他进门时，切肉总管正把馅饼切开，一块块分给大公和宾客。大公把满满一大口塞进嘴里，细细嚼过，咽下时满意得两眼上翻。
        - id: ch06-b15
          speaker: duke
          text: >-
            啊，啊！它果然配得上馅饼女王的名字。我的矮人，也该叫厨师之王。亲爱的朋友，你说是不是？
          emotion: happy
        - id: ch06-b16
          speaker: narrator
          text: >-
            亲王取了好几小块，一一品尝，又仔细查看，随后露出神秘而讥讽的笑。
        - id: ch06-b17
          speaker: prince
          text: >-
            做得很不错。可这只君主馅饼并不完整，果然和我猜的一样。
        - id: ch06-b18
          speaker: narrator
          text: >-
            大公顿时暴怒。
        - id: ch06-b19
          speaker: duke
          text: >-
            你这狗厨子！竟敢拿这种东西伺候我？我真该砍掉你的大脑袋，让你受点惩罚！
          emotion: angry
        - id: ch06-b20
          speaker: jem
          text: >-
            殿下开恩！我完全照最好的规矩做了，一样也没有少。请您问亲王，馅饼里还缺什么。
          emotion: fearful
        - id: ch06-b21
          speaker: prince
          text: >-
            长鼻朋友，我早知道你做不出我家厨师那种馅饼。少的是一种叫添香草的香料。这个国家没人认识它，可君主馅饼独有的滋味，全靠这种草。没有它，你的主人永远吃不到十全十美的馅饼。
        - id: ch06-b22
          speaker: duke
          text: >-
            我偏要吃到十全十美的！明天，要么把馅饼做得一点不差，要么就砍掉这个混蛋的脑袋。滚吧，恶棍！我给你二十四小时。
          emotion: angry
        - id: ch06-b23
          speaker: narrator
          text: >-
            可怜的杰姆匆匆回到房间，把满腹痛苦全告诉了咪咪。
        - id: ch06-b24
          speaker: mimi
          text: >-
            原来只是添香草，那我能帮你。父亲教过我辨认所有花草。幸好现在正逢新月，这种草只在新月时生长。你先告诉我，王宫附近有没有栗树？
        - id: ch06-b25
          speaker: jem
          text: >-
            当然有！离王宫大约两百码，湖边就是一大片。你为什么问这个？
          emotion: happy
        - id: ch06-b26
          speaker: mimi
          text: >-
            因为添香草只长在栗树根旁。别再耽搁了，赶快去找。你把我夹在胳膊下，到了外面再放我下来，我来替你寻找。
        - id: ch06-b27
          speaker: narrator
          text: >-
            杰姆照她的话做了。一进花园，他便把咪咪放到地上。咪咪尽快摇摆着走向湖边，杰姆焦急地跟在后面。他的性命全看她能不能找到那株草。
        - id: ch06-b28
          speaker: narrator
          text: >-
            咪咪在湖边到处寻找，一棵接一棵地检查栗树。她低着头，用嘴拨开树根旁的每一片草叶，可下面始终没有添香草。杰姆跟着她越走越急。他们找遍一处又一处，仍旧一无所获。眼看天色一点点暗下来，杰姆忽然抬头，看见湖对岸孤零零地立着一棵高大的老树。
        - id: ch06-b29
          speaker: jem
          text: >-
            看呀！我们去那棵树下碰碰运气。
        - id: ch06-b30
          speaker: narrator
          text: >-
            咪咪拍着翅膀，一蹦一跳地跑在前面。杰姆迈开短腿，拼命追赶。老树投下大片阴影，树下几乎已经全黑了。忽然，咪咪停住脚，欢喜地拍起翅膀。她用嘴拔下一样东西，递给惊讶的朋友。
        - id: ch06-b31
          speaker: mimi
          text: >-
            就是它！这里还有不少，以后你再也不会缺了。
          emotion: happy
        - id: ch06-b32
          speaker: narrator
          text: >-
            杰姆目不转睛地望着那株草。它散发着浓郁甜美的香气，让他想起中魔法的那一天。蓝绿色的茎叶顶端，开着一朵深沉鲜亮的红花，花瓣边缘镶着黄色。
        - id: ch06-b33
          speaker: jem
          text: >-
            真是奇迹！我相信，就是这种香草把我从松鼠变成了现在的模样。我要不要立刻试试？
          emotion: surprised
        - id: ch06-b34
          speaker: mimi
          text: >-
            先别试。多采一把，带回你的房间。把钱和衣服都收拾好，然后再看看它有怎样的力量。

    - id: ch07
      title: 添香草与馅饼和约
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: >-
            两人带着采下的香草回到杰姆的房间。杰姆先取出这两年积攒下来的五十来枚达克特，再把自己的衣裳和鞋子全部收拢起来。他把这些东西仔细包好，扎成一个随时可以带走的包袱。准备妥当以后，他才拿起那束香草，把脸埋进叶片和花朵之间，深深吸进它的芬芳。
        - id: ch07-b02
          speaker: narrator
          text: >-
            他的骨节立刻噼啪作响，四肢不断伸长。脑袋从两肩之间升了起来。他低头看着那只鼻子一点点缩小，胸前和背后的肉包也渐渐平复，两条腿却越长越长。咪咪站在旁边，惊奇地看着他的身体恢复原样。
        - id: ch07-b03
          speaker: mimi
          text: >-
            啊，你变得多么高大，多么英俊！感谢上天，你已经完全恢复原样了！
          emotion: happy
        - id: ch07-b04
          speaker: narrator
          text: >-
            杰姆双手合在一起，满心感激。他欣喜若狂，却没忘记自己欠咪咪多大的人情。
        - id: ch07-b05
          speaker: jem
          text: >-
            是你救了我的命，又让我重新自由。没有你，我永远恢复不了原样，很快还会被人砍头。现在，我送你回父亲身边。他一定知道怎样替你解除魔法。
          emotion: happy
        - id: ch07-b06
          speaker: narrator
          text: >-
            咪咪高兴地接受了这个提议。杰姆带好包袱和香草，两人设法悄悄溜出王宫，没有惊动任何人。前往哥特兰岛的路上没有发生意外，他们平安来到魔法师韦瑟博尔德身边。魔法师见到女儿，立刻施展法术，很快解除了她身上的咒语。他又一再向杰姆道谢，送给这个救命恩人许多贵重礼物。
        - id: ch07-b07
          speaker: narrator
          text: >-
            杰姆片刻也没有耽搁，带着魔法师的礼物，立即赶回自己的故乡。这一次，父母看见的是一个英俊挺拔的年轻人。听过他的故事，又认出他的模样，他们都乐意承认，他正是家里失踪多年的儿子。杰姆终于重新回到亲人身边。后来，他用魔法师赠送的钱开了一家店铺，生意十分兴隆，从此长久而幸福地生活下去。
        - id: ch07-b08
          speaker: narrator
          text: >-
            不过，还有一件事不能漏掉。杰姆突然失踪，在王宫里引起了不小的骚乱。第二天，大公原本已经下令，要是矮人仍旧找不到君主馅饼必需的香草，就把他的头砍下来。可到了该执行命令的时候，人们四处寻找，怎么也找不到长鼻矮人的踪影。
        - id: ch07-b09
          speaker: narrator
          text: >-
            亲王却暗示，大公是故意放走了厨师，因而违背了自己的诺言。最后，两位君主之间爆发了一场大战。后来的史书把它记作香草战争。双方为了这件事打了许多仗，每一仗都有人受伤或死去。经过许多死伤以后，他们终于停战，缔结了和平。
        - id: ch07-b10
          speaker: narrator
          text: >-
            这次和平，后来又被称为馅饼和约。为了庆祝和约，两位君主举行了一场宴会。席间，亲王的厨师终于端出了那位群馅饼之女王，也就是杰姆没能做得十全十美的君主馅饼。大公亲口尝过以后，也只好宣布，这道馅饼的确美味无比。
