  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, steady, and quietly mysterious
        timbre: clear and resonant
        pace: measured
        pitch: medium
    emperor_trojan:
      display_name: Emperor Trojan
      tts:
        delivery: proud, guarded, and commanding
        timbre: deep and firm
        pace: measured
        pitch: low
    apprentice:
      display_name: Young Apprentice
      tts:
        delivery: honest, careful, and youthful
