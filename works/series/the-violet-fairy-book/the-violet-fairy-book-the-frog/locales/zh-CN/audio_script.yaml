audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 编者
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清晰的成年男声
        pace: 从容舒展
        pitch: 中低音
    mother:
      display_name: 母亲
      tts:
        delivery: 精明直率，语气慈爱而有主见
        timbre: 温厚的中年女声
        pace: 适中
        pitch: 中音
    youngest_son:
      display_name: 小儿子
      tts:
        delivery: 朴实腼腆，遇事常带迟疑
        timbre: 清朗的年轻男声
        pace: 适中
        pitch: 中音
    frog:
      display_name: 青蛙
      tts:
        delivery: 坚定热心，言语简洁
        timbre: 清脆柔和的年轻女声
        pace: 适中
        pitch: 中高音
  chapters:
    - id: ch01
      title: 三绞亚麻
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前有个妇人，养了三个儿子。他们虽是农民，家境却很好。那里的土地肥沃，庄稼年年丰收。有一天，三个儿子一起告诉母亲，他们都想娶妻了。
        - id: ch01-b02
          speaker: mother
          text: >-
            随你们的意。不过，可得挑会持家的好姑娘，能把自己的日子和家里大大小小的事情全都料理妥当。我给你们一人一绞亚麻，拿去请她们纺线。谁纺得最好，谁就是我最疼爱的儿媳妇。
        - id: ch01-b03
          speaker: narrator
          text: >-
            两个哥哥早已选好了妻子，接过亚麻就去找各自的未婚妻。小儿子可犯了愁。他从没跟姑娘说过话，根本不知道该把亚麻交给谁。他走过一个又一个村庄，遇见姑娘便上前询问，问她们肯不肯接下这件差事。可她们一看见那绞亚麻，就当面嘲笑他，拿他取乐。小儿子彻底没了办法，只好离开那些村庄，独自走到郊外，坐在池塘边伤心地哭。
        - id: ch01-b04
          speaker: narrator
          text: >-
            忽然，身边有了动静。一只青蛙从水里跳上岸，问他为什么哭。小儿子说，两个哥哥都会带回未婚妻纺好的麻布，自己的线却没人肯纺。
        - id: ch01-b05
          speaker: frog
          text: >-
            别为这件事哭啦。把线给我，我替你纺。
        - id: ch01-b06
          speaker: narrator
          text: >-
            青蛙从小儿子手里接过亚麻，扑通一声跳回水里。小儿子也回了家，却猜不出以后会怎样。没过多久，母亲要看儿媳妇们用亚麻织出的布。兄弟三人都走出了房间。几分钟后，两个哥哥各自带着未婚妻纺织的麻布回来。小儿子却两手空空，什么也拿不出来，只得愁眉苦脸地回到池塘边，又坐下来哭。
        - id: ch01-b07
          speaker: narrator
          text: >-
            扑通！青蛙又从水里冒了出来。
        - id: ch01-b08
          speaker: frog
          text: >-
            拿去吧，这是我替你纺织的麻布。
        - id: ch01-b09
          speaker: narrator
          text: >-
            小儿子欢喜极了，接过麻布就往家跑。母亲一看，也喜欢得不得了。她说自己从没见过这样漂亮的麻布。跟两个哥哥带回来的相比，这一匹不知细白了多少。
        - id: ch01-b10
          speaker: mother
          text: >-
            孩子们，只试这一回还不够。我得再看看你们选中的姑娘会不会做妻子。家里有三只小狗，你们一人抱走一只，交给将来要娶的姑娘饲养调教。谁养出的狗最出色，谁就是我最疼爱的儿媳妇。

    - id: ch02
      title: 小狗与衬衫
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            三兄弟各抱一只小狗上了路。小儿子不知道还能去哪里，只好回到池塘边，又一次坐下哭起来。扑通！青蛙出现在他身旁，问他遇见了什么难事。小儿子说，自己不知道该把小狗交给谁。
        - id: ch02-b02
          speaker: frog
          text: >-
            把它交给我吧，我替你养大。
        - id: ch02-b03
          speaker: narrator
          text: >-
            小儿子还在迟疑，青蛙已经从他怀里抱走小狗，消失在池塘里。日子一天天过去，几个星期变成了几个月。一天，母亲要看看未来的儿媳妇把狗训练得怎样。两个哥哥很快牵回两条高大的獒犬。它们龇着牙低吼，凶相毕露，母亲只看一眼就吓得发抖。
        - id: ch02-b04
          speaker: narrator
          text: >-
            小儿子照旧来到池塘边，请青蛙救他。没过多久，青蛙就带来一只可爱的小狗，放进他的怀里。小狗会坐起来，举着前爪作揖，还会表演许多讨人喜欢的把戏。它听得懂每一道吩咐，也能一一照做，聪明得简直像个人。
        - id: ch02-b05
          speaker: narrator
          text: >-
            小儿子兴高采烈地抱着狗回家。那只小狗跟先前一样乖巧机灵，母亲刚一看见，就赞叹起来。
        - id: ch02-b06
          speaker: mother
          text: >-
            我这辈子还没见过这么漂亮的小狗。孩子，你真有福气，挑到了一位珍珠般难得的妻子。
          emotion: happy
        - id: ch02-b07
          speaker: mother
          text: >-
            这里还有三件衬衫。你们拿去交给各自选中的姑娘，谁缝得最好，谁就是我最疼爱的儿媳妇。
        - id: ch02-b08
          speaker: narrator
          text: >-
            三兄弟再次出门，各自去找选中的姑娘。这一回，仍旧是青蛙的针线最好，又精细又整洁。母亲出的三道考题都做完了，她也终于满意了。
        - id: ch02-b09
          speaker: mother
          text: >-
            现在，你们去把新娘接回家吧。我来预备婚宴。
        - id: ch02-b10
          speaker: narrator
          text: >-
            小儿子听见这话，心一下沉了下去。他上哪里去接新娘呢？这道新难题，青蛙还能帮忙吗？他垂着头，满心悲伤地来到池塘边坐下。扑通！那只忠实的青蛙又到了他身旁。

    - id: ch03
      title: 青蛙新娘
      blocks:
        - id: ch03-b01
          speaker: frog
          text: >-
            什么事让你这样发愁？
        - id: ch03-b02
          speaker: narrator
          text: >-
            小儿子把母亲要他接新娘回家的事全告诉了她。
        - id: ch03-b03
          speaker: frog
          text: >-
            那么，你愿意娶我做妻子吗？
        - id: ch03-b04
          speaker: youngest_son
          text: >-
            我娶你做妻子，又能拿你怎么办呢？
        - id: ch03-b05
          speaker: narrator
          text: >-
            这个古怪的提议，让小儿子实在摸不着头脑。
        - id: ch03-b06
          speaker: frog
          text: >-
            我再问一遍，你到底要不要我？
        - id: ch03-b07
          speaker: youngest_son
          text: >-
            我既不说要你，也不说不要你。
        - id: ch03-b08
          speaker: narrator
          text: >-
            青蛙忽然不见了。转眼间，路上出现一辆精巧的小马车，由两匹小巧的马儿拉着。青蛙扶住车门，请小儿子进去。
        - id: ch03-b09
          speaker: frog
          text: >-
            跟我来吧。
        - id: ch03-b10
          speaker: narrator
          text: >-
            小儿子站起来，跟她坐进马车。他们沿路前行，途中遇见三个女巫。第一个双目失明，第二个弓腰驼背，第三个喉咙里扎着一根大刺。
        - id: ch03-b11
          speaker: narrator
          text: >-
            三个女巫看见那辆小马车，再瞧瞧神气十足地坐在软垫中间的青蛙，顿时一阵接一阵地大笑，怎么也停不下来。第一个笑得眼皮猛然张开，恢复了视力。第二个在地上笑得滚来滚去，竟把驼背笑直了。第三个放声大笑，喉咙里的刺也掉了出来。青蛙自己还浑然不觉，却无意中治好了她们各自的苦痛。女巫们第一个念头，就是要报答她。

    - id: ch04
      title: 三件魔法礼物
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            第一个女巫向青蛙挥动魔杖，把她变成世上最美丽的姑娘。第二个女巫朝小马车和小马挥了挥魔杖，它们立刻变成一辆华美宽大的四轮马车，几匹骏马昂首腾跃，车夫端坐在前座。第三个女巫送给姑娘一只魔法钱袋，里面装满了钱。
        - id: ch04-b02
          speaker: narrator
          text: >-
            三件礼物送完，女巫们便消失了。小儿子带着美丽的新娘乘车来到母亲家。母亲看见小儿子得了这样的好运，欢喜极了。人们为新婚夫妇盖起一座美丽的房子。姑娘成了母亲最疼爱的儿媳妇。他们事事顺心，从此一直过着幸福的生活。
        - id: ch04-b03
          speaker: narrator
          text: >-
            这个故事来自意大利。
