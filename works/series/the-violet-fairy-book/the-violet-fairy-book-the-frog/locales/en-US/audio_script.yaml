audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, steady, and quietly mysterious
        timbre: clear and resonant
        pace: measured
        pitch: medium
    mother:
      display_name: Mother
      tts:
        delivery: practical, firm, and warmhearted
        timbre: mature and full
        pace: measured
        pitch: medium-low
    youngest_son:
      display_name: Youngest Son
      tts:
        delivery: gentle, earnest, and sometimes uncertain
        timbre: clear and youthful
        pace: measured
        pitch: medium
    frog:
      display_name: Frog
      tts:
        delivery: patient, faithful, and quietly confident
        timbre: light and clear
        pace: unhurried
        pitch: medium-high
  chapters:
    - id: ch01
      title: Three Skeins of Flax
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a woman with three sons. They were peasants, but their good soil gave them rich crops, and the family lived comfortably. One day, all three sons told their mother that they wished to marry.
        - id: ch01-b02
          speaker: mother
          text: Choose as you please, but choose women who will be good housewives and take proper care of your affairs. Here are three skeins of flax. Give one to each woman to spin. The one who does the finest work will be my favorite daughter-in-law.
        - id: ch01-b03
          speaker: narrator
          text: The two older sons had already chosen their brides. They took their flax away and asked the women to spin it, just as their mother had told them. The youngest son was puzzled. He had never even spoken to a girl, and he had no idea whom to ask. He wandered here and there, going from village to village. Every time he met a girl, he asked if she would take on the task. But the moment the girls saw his flax, they laughed in his face and mocked him.
        - id: ch01-b04
          speaker: narrator
          text: At last, he gave up and went into the countryside. He sat on the bank of a pond and cried bitterly. Then he heard a sound beside him. A frog leaped out of the water and landed on the bank.
        - id: ch01-b05
          speaker: frog
          text: Why are you crying?
        - id: ch01-b06
          speaker: narrator
          text: The young man explained that his brothers would bring home linen spun by their future wives, while no one would spin his thread.
        - id: ch01-b07
          speaker: frog
          text: Then do not cry over it. Give the thread to me, and I will spin it for you.
        - id: ch01-b08
          speaker: narrator
          text: She took the skein from his hand and flopped back into the pond. The young man went home, wondering what could happen next.
    - id: ch02
      title: The Finest Linen
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Before long, the two older brothers came home. Their mother asked to see the linen woven from the flax she had given them. All three sons left the room. A few minutes later, the older two returned with the linen their chosen brides had made. The youngest had nothing to show, and he was deeply troubled. He went sadly back to the pond, sat on the bank, and began to cry.
        - id: ch02-b02
          speaker: narrator
          text: Flop! The frog appeared beside him once again.
        - id: ch02-b03
          speaker: frog
          text: Take this. Here is the linen I spun for you.
        - id: ch02-b04
          speaker: narrator
          text: The young man could hardly contain his delight. The frog placed the linen in his hands, and he carried it straight home. His mother was so pleased that she declared she had never seen linen spun so beautifully. It was much finer and whiter than the webs his brothers had brought.
        - id: ch02-b05
          speaker: mother
          text: This is not proof enough, my sons. I must learn more about the wives you have chosen. There are three puppies in the house. Each of you must take one to your future bride and ask her to raise and train it. The mistress of the finest dog will be my favorite daughter-in-law.
        - id: ch02-b06
          speaker: narrator
          text: The sons went their separate ways, each carrying a puppy. The youngest did not know where else to turn. He returned to the pond, sat down, and began to cry.
        - id: ch02-b07
          speaker: narrator
          text: Flop! There was the frog, close beside him.
        - id: ch02-b08
          speaker: frog
          text: Why are you crying now?
        - id: ch02-b09
          speaker: narrator
          text: He told her about the new test and said he had no one to raise the puppy for him.
        - id: ch02-b10
          speaker: frog
          text: Give the puppy to me. I will raise it for you.
        - id: ch02-b11
          speaker: narrator
          text: The young man hesitated. So the frog took the little creature from his arms and disappeared with it beneath the water.
    - id: ch03
      title: The Clever Little Dog
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Weeks passed, and then months. One day, the mother decided it was time to see how her future daughters-in-law had trained the dogs. The two older sons went away and soon returned, leading two huge mastiffs. The dogs growled fiercely and looked so savage that their very appearance made the mother tremble.
        - id: ch03-b02
          speaker: narrator
          text: As usual, the youngest son went to the pond and called for the frog to come to his rescue. She was at his side within a minute, bringing the loveliest little dog with her, and she placed it in his arms. The dog sat up and begged with its front paws. Then it went through one pretty trick after another. It seemed almost human because it understood every command and did exactly as it was told.
        - id: ch03-b03
          speaker: narrator
          text: The young man carried it home in high spirits. The moment his mother saw it, she cried out in delight.
        - id: ch03-b04
          speaker: mother
          text: I have never seen such a beautiful little dog! My son, you are fortunate indeed. You have found a pearl of a wife.
          emotion: happy
        - id: ch03-b05
          speaker: narrator
          text: Then she turned to the other sons and handed out three shirts.
        - id: ch03-b06
          speaker: mother
          text: Take these shirts to the women you have chosen. Whoever sews the best will be my favorite daughter-in-law.
        - id: ch03-b07
          speaker: narrator
          text: Once more, the three young men set off. And once more, the frog's work was the finest and neatest of all.
        - id: ch03-b08
          speaker: mother
          text: I am satisfied with the tests. Now go and bring your brides home. I will prepare the wedding feast.
        - id: ch03-b09
          speaker: narrator
          text: The youngest brother's heart sank. Where could he possibly find a bride to bring home? Could the frog help him even now? He bowed his head, went to the pond, and sat sadly at the water's edge.
    - id: ch04
      title: The Frog's Proposal
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Flop! The faithful frog was beside him once more.
        - id: ch04-b02
          speaker: frog
          text: What is troubling you so deeply?
        - id: ch04-b03
          speaker: narrator
          text: The young man told her everything. His mother expected him to return with a bride, and he had no bride to bring.
        - id: ch04-b04
          speaker: frog
          text: Will you take me as your wife?
        - id: ch04-b05
          speaker: youngest_son
          text: But what would I do with a frog for a wife?
          emotion: surprised
        - id: ch04-b06
          speaker: narrator
          text: He could hardly understand her strange proposal.
        - id: ch04-b07
          speaker: frog
          text: I will ask you once more. Will you have me, or will you not?
        - id: ch04-b08
          speaker: youngest_son
          text: I will not say yes, but I will not refuse you either.
        - id: ch04-b09
          speaker: narrator
          text: The frog vanished. A moment later, the young man saw a lovely little chariot waiting on the road, drawn by two tiny ponies. The frog held open its door for him.
        - id: ch04-b10
          speaker: frog
          text: Come with me.
        - id: ch04-b11
          speaker: narrator
          text: He rose and joined her in the chariot. As they traveled along the road, they met three witches. The first was blind. The second had a hunched back. The third had a great thorn caught in her throat.
        - id: ch04-b12
          speaker: narrator
          text: The witches saw the chariot, with the frog sitting proudly among its cushions, and burst into helpless laughter. They laughed so hard that something extraordinary happened. The blind witch's eyelids sprang open, and her sight returned. The hunchback rolled on the ground with such merriment that her back became straight. The third witch gave a great roar of laughter, and the thorn dropped from her throat. The frog had cured all three without even knowing it, and their first thought was to reward her for ending their troubles.
    - id: ch05
      title: The Lovely Bride
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The first witch waved her magic wand over the frog. At once, the frog became the loveliest young woman anyone had ever seen. The second witch waved the wand over the tiny chariot and ponies. They changed into a magnificent carriage drawn by prancing horses, with a coachman seated above. The third witch gave the young woman a magic purse filled with money.
        - id: ch05-b02
          speaker: narrator
          text: When their gifts were given, the witches disappeared. The young man and his lovely bride drove on to his mother's home. His mother rejoiced at her youngest son's wonderful fortune.
        - id: ch05-b03
          speaker: narrator
          text: A beautiful house was built for the couple, and the young woman became the favorite daughter-in-law. All went well for them, and they lived happily ever after.
