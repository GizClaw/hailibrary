  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, steady, and quietly mysterious
        timbre: clear and resonant
        pace: measured
        pitch: medium
    king:
      display_name: King
      tts:
        delivery: commanding, guarded, and quick to anger
        timbre: deep and firm
        pace: deliberate
        pitch: low
    young_man:
      display_name: Young Man
      tts:
        delivery: clever, confident, and sincere
        timbre: clear and youthful
        pace: measured
        pitch: medium
    herdsman:
      display_name: Herdsman
