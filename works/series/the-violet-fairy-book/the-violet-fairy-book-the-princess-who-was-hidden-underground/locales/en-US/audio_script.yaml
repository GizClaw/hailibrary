  chapters:
    - id: ch01
      title: The Palace Beneath the Earth
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a very rich king. When he died, he divided everything he owned among his three sons. The two eldest spent their shares on feasts and wild living. Before long, every bit of their father's wealth was gone, and they were left poor and miserable.
        - id: ch01-b02
          speaker: narrator
          text: The youngest son took better care of his share. He married, and soon he and his wife had a daughter of wonderful beauty. When the girl grew up, her father had a magnificent palace built for her deep underground. Then he killed the architect who had made it, shut his daughter inside, and sent heralds across the world with a challenge. Any man who found the king's daughter could marry her. Any man who tried and failed must die.
        - id: ch01-b03
          speaker: narrator
          text: Many young men came to search for the hidden princess. Not one of them found her, and every one lost his life.
    - id: ch02
      title: The Golden Lamb
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: At last another young man heard of the challenge. He was as clever as he was handsome, and he longed to attempt it. First he went to a herdsman and asked for help. The man was to hide him inside a sheepskin with a golden fleece and carry him to the king. The herdsman let himself be persuaded. He found the right skin, sewed the young man inside it, and tucked in food and drink as well. Then he brought what looked like a golden lamb to the palace.
        - id: ch02-b02
          speaker: king
          text: Will you sell me this lamb?
        - id: ch02-b03
          speaker: herdsman
          text: No, Your Majesty, I will not sell it. But if it pleases you, I will lend it to you for three days and ask no payment. After that, you must return it.
        - id: ch02-b04
          speaker: narrator
          text: The king agreed. He took the golden lamb and carried it to his daughter. After leading it through room after room in the underground palace, he stopped at a locked door.
        - id: ch02-b05
          speaker: king
          text: Open, Sartara Martara of the earth!
        - id: ch02-b06
          speaker: narrator
          text: The door opened by itself. The king led the lamb through many more rooms until they reached a second locked door.
        - id: ch02-b07
          speaker: king
          text: Open, Sartara Martara of the earth!
        - id: ch02-b08
          speaker: narrator
          text: That door opened too. Beyond it was the princess's apartment, where the floor, the walls, and even the roof were made of silver. The king embraced his daughter and gave her the lamb. She was delighted. She stroked it, cuddled it, and played with it. After a while, the lamb slipped free of its skin.
        - id: ch02-b09
          speaker: princess
          text: Look, Father! The lamb has come loose.
        - id: ch02-b10
          speaker: king
          text: It is only a lamb. Why shouldn't it run free?
        - id: ch02-b11
          speaker: narrator
          text: With that, the king left the lamb beside the princess and went away.
    - id: ch03
      title: Three Days with the Princess
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: That night, the young man climbed out of the sheepskin. The princess saw how handsome he was and fell in love with him.
        - id: ch03-b02
          speaker: princess
          text: Why did you come here hidden in a sheepskin?
        - id: ch03-b03
          speaker: young_man
          text: So many men have searched for you, but none could find you, and all of them died. I thought of this trick, and it brought me safely to you.
        - id: ch03-b04
          speaker: princess
          text: Your trick was a good one, but you have not won the challenge yet. My father will turn me and all my maidens into ducks. Then he will ask you which duck is the princess. Watch carefully. I will turn my head back and clean my wings with my bill. That is how you will know me.
        - id: ch03-b05
          speaker: narrator
          text: For three days, the young man and the princess stayed together, talking and caressing each other. When the three days were over, the herdsman returned to the king and asked for his lamb. The king went all the way down to his daughter's hidden rooms to fetch it. The princess was deeply troubled, because she and the lamb had played so happily together.
        - id: ch03-b06
          speaker: king
          text: I cannot leave it with you, my daughter. The lamb was only lent to me.
        - id: ch03-b07
          speaker: narrator
          text: So the king took the lamb away and returned it to the herdsman.
    - id: ch04
      title: The Secret Doors
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Once they were away from the king, the young man cast off the golden sheepskin. Then he went straight back to the palace.
        - id: ch04-b02
          speaker: young_man
          text: Your Majesty, I believe I can find your daughter.
        - id: ch04-b03
          speaker: narrator
          text: The king looked at the handsome youth and felt sorry for him.
        - id: ch04-b04
          speaker: king
          text: My boy, so many men have already died trying to do this. It will surely cost you your life as well.
        - id: ch04-b05
          speaker: young_man
          text: I accept your terms, Your Majesty. I will find her, or I will lose my head.
        - id: ch04-b06
          speaker: narrator
          text: The young man set off with the king following behind him. When they reached the great door, the young man stopped.
        - id: ch04-b07
          speaker: young_man
          text: Say the words that open it.
        - id: ch04-b08
          speaker: king
          text: What words? Should I say, “Shut, shut, shut”?
        - id: ch04-b09
          speaker: young_man
          text: No. Say, “Open, Sartara Martara of the earth.”
        - id: ch04-b10
          speaker: narrator
          text: The king spoke the words, and the door opened by itself. As they went in, he gnawed his moustache with anger. At the second door, everything happened just as it had at the first. They passed through and found the princess.
    - id: ch05
      title: The Princess Among the Ducks
      blocks:
        - id: ch05-b01
          speaker: king
          text: Yes, you truly have found the princess. But now I will turn her and all her maidens into ducks. If you can tell me which duck is my daughter, you may marry her.
        - id: ch05-b02
          speaker: narrator
          text: At once, the king changed the princess and every one of her maidens into ducks. He drove them all before the young man.
        - id: ch05-b03
          speaker: king
          text: Now show me which one is my daughter.
        - id: ch05-b04
          speaker: narrator
          text: Just as they had agreed, one duck turned her head back and began cleaning her wings with her bill.
        - id: ch05-b05
          speaker: young_man
          text: The duck cleaning her wings is the princess.
        - id: ch05-b06
          speaker: narrator
          text: There was nothing more the king could do. He gave his daughter to the young man as his wife, and the two of them lived together in great joy and happiness.
