audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 编者
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清晰的成年男声
        pace: 从容舒展
        pitch: 中低音
    king:
      display_name: 国王
      tts:
        delivery: 威严强硬，动怒时仍保持王者气势
        timbre: 浑厚低沉的成年男声
        pace: 稍慢
        pitch: 低音
    herdsman:
      display_name: 牧人
      tts:
        delivery: 朴实谨慎，说话干脆
        timbre: 粗粝温厚的成年男声
        pace: 适中
        pitch: 中低音
    young_man:
      display_name: 年轻人
      tts:
        delivery: 聪敏果断，面对危险毫不畏缩
        timbre: 清朗坚定的年轻男声
        pace: 适中
        pitch: 中音
    princess:
      display_name: 公主
      tts:
        delivery: 聪慧柔和，关键时刻机敏利落
        timbre: 明净柔美的年轻女声
        pace: 适中
        pitch: 中高音
  chapters:
    - id: ch01
      title: 地下的宫殿
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前有一位国王，家财万贯。临终时，他把财产分给三个儿子。两个哥哥整日饮宴作乐，很快就把父亲的钱财挥霍干净，落得又穷又苦。小儿子却不同，他把自己的那一份用得很好，还娶妻成了家。不久，妻子生下一个美貌无双的女儿。
        - id: ch01-b02
          speaker: narrator
          text: >-
            女儿长大后，他让人在地下建起一座宏伟的宫殿，随后又杀死了那位工匠。他把女儿关进宫中，派使者到天下各处宣布，无论谁找到公主，都可以娶她为妻。可要是找不到，就得送命。许多年轻人前来寻找，结果一个也没能活下来。
        - id: ch01-b03
          speaker: narrator
          text: >-
            后来，又来了一个年轻人。他不但容貌俊美，还聪明绝顶，很想试试这件凶险的差事。他找到一位牧人，请对方把自己藏在一张金色羊毛的羊皮里，装成羊羔送到国王面前。牧人答应了。他把食物和饮水也放进羊皮，再把年轻人严严实实地缝在里面，就这样带去见国王。
        - id: ch01-b04
          speaker: king
          text: >-
            这只金色的羊羔，你肯卖给我吗？
        - id: ch01-b05
          speaker: herdsman
          text: >-
            陛下，我不能卖。不过您既然喜欢，我可以分文不取，借给您三天。三天一到，请您把它还给我。
        - id: ch01-b06
          speaker: narrator
          text: >-
            国王答应了，亲自带着羊羔去见女儿。他们进入地下宫殿，走过许多房间，终于被一扇紧闭的门拦住。
        - id: ch01-b07
          speaker: king
          text: >-
            大地的萨塔拉·马塔拉，开门！
        - id: ch01-b08
          speaker: narrator
          text: >-
            门自己打开了。他们继续往里走，又来到一扇紧闭的门前。国王再次喊出同样的话，第二扇门也自行打开。他们终于走进公主的住处。那里的地板、墙壁，连屋顶都是银子做的。
        - id: ch01-b09
          speaker: narrator
          text: >-
            国王拥抱了女儿，把羊羔送给她。公主高兴极了，抱着它又摸又逗，玩个不停。过了一会儿，羊羔松脱了出来。
        - id: ch01-b10
          speaker: princess
          text: >-
            父王，您看，羊羔松开了。
        - id: ch01-b11
          speaker: king
          text: >-
            它只是一只羊羔，何必拴着呢？
        - id: ch01-b12
          speaker: narrator
          text: >-
            国王就把羊羔留在女儿身边，独自走了。

    - id: ch02
      title: 羊皮里的年轻人
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            到了夜里，年轻人脱下羊皮。公主一见他这样俊美，马上爱上了他。
        - id: ch02-b02
          speaker: princess
          text: >-
            你为什么披着羊皮，装成这副模样到这里来？
        - id: ch02-b03
          speaker: young_man
          text: >-
            我看见那么多人来找你，可谁也找不到，还都丢了性命。我这才想出这个办法，总算平安来到你身边。
        - id: ch02-b04
          speaker: princess
          text: >-
            这个办法想得好！不过，你还没有赢。父王会把我和侍女们全变成鸭子，再让你认出哪一只是公主。到时候，我会把头转到背后，用嘴梳理翅膀。你看见这个动作，就能认出我了。
        - id: ch02-b05
          speaker: narrator
          text: >-
            两人在一起度过三天。他们亲密地谈天说笑，彼此爱抚。第三天，牧人回来找国王，要取回自己的羊羔。国王只好去女儿那里把它带走。公主十分难过，说自己和羊羔玩得正开心。
        - id: ch02-b06
          speaker: king
          text: >-
            女儿，我不能把它留给你。这只羊羔是别人借给我的。
        - id: ch02-b07
          speaker: narrator
          text: >-
            国王把羊羔带走，还给了牧人。年轻人一离开王宫，就脱下羊皮，再以自己的模样来到国王面前。
        - id: ch02-b08
          speaker: young_man
          text: >-
            陛下，我相信自己能找到您的女儿。
        - id: ch02-b09
          speaker: narrator
          text: >-
            国王见他生得这样英俊，不免怜惜他的青春。
        - id: ch02-b10
          speaker: king
          text: >-
            年轻人，这件事已经害死许多人。我实在不忍心看你也为它送命，可你若去找，一定也是死路一条。
        - id: ch02-b11
          speaker: young_man
          text: >-
            陛下，您的条件我接受。要么让我找到公主，要么就砍下我的脑袋。

    - id: ch03
      title: 两扇门
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            年轻人走在前面，国王跟在后面。两人来到地下宫殿的大门前，年轻人停住脚步。
        - id: ch03-b02
          speaker: young_man
          text: >-
            请您说出那句开门的话。
        - id: ch03-b03
          speaker: king
          text: >-
            什么开门的话？难道要我说，“关上，关上，关上”？
        - id: ch03-b04
          speaker: young_man
          text: >-
            不对。您要说，“大地的萨塔拉·马塔拉，开门！”
        - id: ch03-b05
          speaker: narrator
          text: >-
            国王只得照着他说。话音一落，大门果然自己打开了。两人往里走去，国王气得一路直咬胡子。来到第二扇门前，年轻人又让他喊出同一句话。第二扇门也开了，他们进去一看，公主就在里面。
        - id: ch03-b06
          speaker: king
          text: >-
            不错，你的确找到了公主。不过，我还要把她和所有侍女都变成鸭子。你若能认出哪一只是我的女儿，我才把她嫁给你。
        - id: ch03-b07
          speaker: narrator
          text: >-
            国王说完，立刻把所有姑娘变成了鸭子，又把它们赶到年轻人面前。
        - id: ch03-b08
          speaker: king
          text: >-
            现在，指给我看，哪一只是我的女儿？

    - id: ch04
      title: 公主的暗号
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            公主没有忘记两人的约定。她把头转向背后，开始用嘴梳理自己的翅膀。年轻人一眼就看见了。
        - id: ch04-b02
          speaker: young_man
          text: >-
            正在梳理翅膀的那一只，就是公主。
        - id: ch04-b03
          speaker: narrator
          text: >-
            这一下，国王再也没有别的办法，只得让年轻人娶公主为妻。从此，两人欢欢喜喜地生活在一起，一直都很幸福。
        - id: ch04-b04
          speaker: narrator
          text: >-
            这个故事来自德国。
