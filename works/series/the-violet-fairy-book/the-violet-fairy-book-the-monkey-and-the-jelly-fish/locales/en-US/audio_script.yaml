audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, steady, and quietly mysterious
        timbre: clear and resonant
        pace: measured
        pitch: medium
    turtle:
      display_name: Turtle
      tts:
        delivery: cautious, dutiful, and earnest
        timbre: deep and rounded
        pace: measured
        pitch: low
    monkey:
      display_name: Monkey
      tts:
        delivery: lively, quick-witted, and expressive
        timbre: bright and youthful
        pace: brisk
        pitch: medium-high
    jelly_fish:
      display_name: Jelly-fish
      tts:
        delivery: gentle, sympathetic, and guileless
        timbre: soft and airy
        pace: unhurried
        pitch: medium
  chapters:
    - id: ch01
      title: The Queen's Illness
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Children often wonder why jelly-fishes have no shells, though so many creatures washed onto the beach do. Long ago, the jelly-fish had a shell as hard as any other sea creature's. This story tells how he lost it through his own fault.
        - id: ch01-b02
          speaker: narrator
          text: The sea-queen Otohime suddenly became very ill. Swift messengers fetched the finest doctors from every country beneath the sea. Nothing helped. The queen only grew worse.
        - id: ch01-b03
          speaker: narrator
          text: Nearly everyone had lost hope when the cleverest doctor arrived. He said only one thing could cure her. She must eat an ape's liver.
        - id: ch01-b04
          speaker: narrator
          text: But apes did not live beneath the sea. The kingdom's wisest heads met to decide how to get such a liver. They chose the prudent turtle. He must swim ashore, catch a living ape, and bring it safely back.
    - id: ch02
      title: The Turtle's Captive
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Giving the turtle his task was easy. Carrying it out was not. Still, the old turtle had seen much. He swam to a coast covered with tall trees, where he thought apes might live.
        - id: ch02-b02
          speaker: narrator
          text: For a long while, he saw none. Watching made him weary, and on one hot day, he fell sound asleep despite every effort to stay awake.
        - id: ch02-b03
          speaker: narrator
          text: Some apes had watched him from the treetops, hidden from his sight. Now they crept down and gathered around. They had never seen a turtle and could not make out what he was.
        - id: ch02-b04
          speaker: narrator
          text: One young monkey was bolder than the rest. He bent down and stroked the creature's shining shell. The gentle touch woke the turtle. In one quick movement, he caught the monkey's hand in his mouth and held on while the monkey struggled.
        - id: ch02-b05
          speaker: narrator
          text: The other apes saw that this creature was dangerous. They fled and left their young brother to whatever fate awaited him.
        - id: ch02-b06
          speaker: turtle
          text: Be still and obey me, and I won't harm you. Climb onto my back. You're coming with me.
        - id: ch02-b07
          speaker: narrator
          text: The monkey had no choice. He obeyed while the turtle still held his hand between his jaws.
    - id: ch03
      title: A Welcome Beneath the Sea
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Delighted to have captured his prize, the turtle hurried to the shore and plunged into the water. He swam faster than he had ever swum before. Soon they reached the royal palace.
        - id: ch03-b02
          speaker: narrator
          text: When the attendants saw them coming, they shouted for joy. Some ran ahead to tell the queen that the monkey had arrived. Before long, they said, she would be as healthy as ever.
        - id: ch03-b03
          speaker: narrator
          text: In their relief, everyone welcomed the monkey kindly and kept him comfortable. Soon he forgot his fears and became quite at ease.
        - id: ch03-b04
          speaker: narrator
          text: But now and then he longed terribly for home. Whenever that sadness came over him, he hid in a dark corner until it passed.
        - id: ch03-b05
          speaker: narrator
          text: During one of those spells, a jelly-fish swam past. Jelly-fishes still had shells then. He saw the usually lively monkey crouched beneath a tall rock, eyes shut and head bowed. Feeling sorry for him, he stopped.
        - id: ch03-b06
          speaker: jelly_fish
          text: Oh, you poor fellow. Of course you're crying. In only a few days, they'll kill you and give your liver to the queen to eat.
          emotion: sad
        - id: ch03-b07
          speaker: narrator
          text: The monkey drew back in horror.
        - id: ch03-b08
          speaker: monkey
          text: What have I done? Why do I deserve to die?
          emotion: fearful
        - id: ch03-b09
          speaker: jelly_fish
          text: You haven't done anything wrong. But only your liver can cure our queen, and they can't take it without killing you. You had better accept what is coming and keep quiet. I pity you with all my heart, but there is no way I can help.
          emotion: sad
        - id: ch03-b10
          speaker: narrator
          text: The jelly-fish swam away and left the monkey cold with fear.
    - id: ch04
      title: The Liver on the Bush
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: At first, the monkey felt as though his liver were already being torn out. Then he wondered how he might escape. At last, a plan came to him.
        - id: ch04-b02
          speaker: narrator
          text: For several days, he acted as cheerful as before. Then the sun disappeared and rain poured down. From morning until night, the monkey wept and howled. The turtle, who was his chief keeper, heard the noise and came to ask what was wrong.
        - id: ch04-b03
          speaker: monkey
          text: Before I left home, I hung my liver on a bush to dry. If this rain keeps falling, it will be ruined! Someone must carry me back to the land so I can fetch it.
        - id: ch04-b04
          speaker: narrator
          text: The cunning fellow moaned and made such a commotion that he could have softened a heart of stone. Nothing would satisfy him except being taken ashore to recover his liver.
        - id: ch04-b05
          speaker: narrator
          text: The queen's councillors were not very wise. They ordered the turtle to take the monkey home and let him fetch his liver from the bush. They warned him never to let his prisoner out of sight.
        - id: ch04-b06
          speaker: narrator
          text: The monkey knew about their warning, but he trusted that he could fool the turtle when the moment came. He climbed onto the turtle's back, secretly full of joy. He took great care not to show it.
    - id: ch05
      title: How the Jelly-fish Lost His Shell
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: They set off. A few hours later, they were moving through the same forest where the turtle had first caught the monkey. The monkey looked up and saw his family peering from the treetops.
        - id: ch05-b02
          speaker: narrator
          text: He caught the nearest branch and swung himself into the tree. The turtle snapped after him and nearly caught his hind leg, but the monkey pulled it away just in time.
        - id: ch05-b03
          speaker: narrator
          text: Safe above the ground, the monkey told his family every dreadful thing that had happened. Then he gave a war cry. Apes came rushing in from the neighboring hills until the whole tribe had gathered.
        - id: ch05-b04
          speaker: narrator
          text: At the monkey's command, they charged the unfortunate turtle together. They rolled him onto his back and tore away the shield that covered his body. Then they mocked him and chased him all the way to the shore and into the sea. He was only too grateful to escape alive.
        - id: ch05-b05
          speaker: narrator
          text: The turtle reached the queen's palace weak and exhausted. Cold water struck his bare body, leaving him sick and miserable. Still, he had to tell the queen's advisers everything and admit that the monkey had escaped.
        - id: ch05-b06
          speaker: narrator
          text: Yet, as sometimes happens, the turtle went free without punishment. His shell was returned to him. All the blame fell upon the poor jelly-fish, and the queen condemned him to remain without a shell forever after.
