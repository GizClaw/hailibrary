audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 编者
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清晰的成年男声
        pace: 从容舒展
        pitch: 中低音
    turtle:
      display_name: 海龟
      tts:
        delivery: 谨慎尽责，受骗前显得一本正经
        timbre: 浑厚圆润的成年男声
        pace: 沉稳
        pitch: 低音
    monkey:
      display_name: 猴子
      tts:
        delivery: 活泼机敏，遇险时慌张却很快恢复灵巧
        timbre: 明亮灵动的年轻男声
        pace: 轻快
        pitch: 中高音
    jelly_fish:
      display_name: 水母
      tts:
        delivery: 善良单纯，说话坦白而带着同情
        timbre: 轻柔清澈的成年男声
        pace: 舒缓
        pitch: 中音
  chapters:
    - id: ch01
      title: 女王的重病
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            孩子们也许常常觉得奇怪，海滩上每天冲来那么多海里的生灵，为什么水母偏偏没有硬壳？很久以前，水母的壳和别的海兽一样坚硬。后来他自己犯了错，这才把壳丢掉。这个故事说的，正是其中的原委。
        - id: ch01-b02
          speaker: narrator
          text: >-
            海中女王乙姬，就是浦岛太郎故事里的那位女王，忽然得了重病。最快的使者匆匆赶往海底各国，请来最好的医生，可是谁也治不好她。女王的病反而越来越重，大家几乎都不抱希望了。
        - id: ch01-b03
          speaker: narrator
          text: >-
            这时，又来了一位医术最高明的医生。他说，只有猴子的肝才能治好女王。可海底哪有猴子呢？国中最有智慧的人聚在一起商议，最后把任务交给了海龟，因为大家都知道他做事谨慎。海龟得游到陆地上，活捉一只猴子，再平安带回海底王国。

    - id: ch02
      title: 海龟捉住了猴子
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            大臣们把任务交出去很容易，海龟要完成它可不容易。不过，海龟上了年纪，见识也广。他游到一片长满高树的海岸，猜想那里一定有猴子。
        - id: ch02-b02
          speaker: narrator
          text: >-
            他等了很久，一只猴子也没看见。一个炎热的日子，他守候得太累，怎么撑也撑不住，终于沉沉睡去。其实，几只猴子一直藏在树顶偷看他。见海龟睡着了，它们悄悄爬下来，围在旁边瞪着眼睛。它们从没见过海龟，谁也猜不出这是什么东西。
        - id: ch02-b03
          speaker: narrator
          text: >-
            一只小猴子胆子最大。他弯下腰，摸了摸这个陌生家伙背上亮闪闪的壳。动作虽然很轻，海龟还是醒了。他猛地扭过头，一口咬住小猴子的手。小猴子拼命往回挣，海龟就是不松口。别的猴子一看这家伙惹不得，转身逃走，把年幼的伙伴独自留给了命运。
        - id: ch02-b04
          speaker: turtle
          text: >-
            你别乱动，乖乖听我的，我就不伤你。现在爬到我背上，跟我走。
        - id: ch02-b05
          speaker: narrator
          text: >-
            猴子没有别的办法，只好照做。再说，他的手还在海龟嘴里，就算想反抗也不成。

    - id: ch03
      title: 海底王宫的秘密
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            海龟捉到了猎物，心里高兴极了。他赶到岸边，一头扎进海里，游得比这辈子任何时候都快。没过多久，他们便到了王宫。侍从们远远看见，立刻欢呼起来。有人飞奔去禀告女王，说猴子已经到了，她很快就能恢复健康。
        - id: ch03-b02
          speaker: narrator
          text: >-
            大家总算放下心来，对猴子格外亲切，总想让他过得舒舒服服。猴子很快忘了先前的害怕，平日里自在得很。只是偶尔想起家乡，他还是会突然难过。每到这时，他就躲进一个黑暗的角落，等乡愁自己退去。
        - id: ch03-b03
          speaker: narrator
          text: >-
            有一回，猴子正躲在一块高大的岩石下面。他闭着眼，垂着头。一只水母恰好从旁边游过。别忘了，那年月的水母还有硬壳。水母看见平日活泼的猴子变成这样，心里很不忍，便停了下来。
        - id: ch03-b04
          speaker: jelly_fish
          text: >-
            唉，你真可怜。难怪你这么伤心。再过几天，他们就会杀掉你，把你的肝取出来给女王吃。
          emotion: sad
        - id: ch03-b05
          speaker: narrator
          text: >-
            猴子吓得往后一缩。
        - id: ch03-b06
          speaker: monkey
          text: >-
            我到底犯了什么罪？为什么非得死？
          emotion: fearful
        - id: ch03-b07
          speaker: jelly_fish
          text: >-
            你一点罪也没有。可只有你的肝能治好女王，不杀你，他们怎么取肝呢？你还是认命吧，别为这事吵闹。我打心底里可怜你，可我实在救不了你。
          emotion: sad
        - id: ch03-b08
          speaker: narrator
          text: >-
            水母说完便游走了，只留下猴子待在那里，吓得浑身冰凉。

    - id: ch04
      title: 挂在灌木上的肝
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            起初，猴子觉得自己的肝好像已经叫人掏了出来。慢慢地，他开始琢磨，怎样才能逃过这场可怕的死亡。最后，他终于想出了一条计策。
        - id: ch04-b02
          speaker: narrator
          text: >-
            接连几天，他装得和从前一样快活。后来太阳躲了起来，大雨倾盆而下，猴子就从早到晚又哭又嚎。看守猴子的总管正是海龟。他听见了，赶来问出了什么事。
        - id: ch04-b03
          speaker: monkey
          text: >-
            我离家以前，把肝挂在一丛灌木上晾着了。雨要是一直这么下，那副肝就不能用了！你们得送我回到陆地，让我把肝取回来。
        - id: ch04-b04
          speaker: narrator
          text: >-
            这个狡猾的家伙哭闹个不停，苦苦哀号，连石头心肠也会被他说软。不送他回陆地取肝，他怎么也不肯罢休。
        - id: ch04-b05
          speaker: narrator
          text: >-
            女王的谋士们并不怎么聪明。他们商量以后，决定让海龟把猴子送回故乡，准他从灌木上取下自己的肝。不过，他们一再叮嘱海龟，一刻也不能让猴子离开视线。
        - id: ch04-b06
          speaker: narrator
          text: >-
            猴子知道他们说了什么，却相信时机一到，自己总能哄过海龟。他爬上龟背，满心欢喜，又小心藏住喜色，没有让谁看出来。

    - id: ch05
      title: 水母怎样丢掉了硬壳
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            他们就此上路。几小时后，海龟带着猴子回到当初捉住他的那片树林。猴子抬头一看，家人正在树顶探头张望。他赶紧抓住最近的一根树枝，荡身上了树。海龟一口咬来，差一点咬住他的后腿，好在猴子及时缩了回去。
        - id: ch05-b02
          speaker: narrator
          text: >-
            猴子把自己的可怕遭遇全都告诉了家人，又发出一声战斗的呼号。邻近山头上的猴子一齐赶来，整群猴子都聚齐了。猴子一声令下，大家便扑向倒霉的海龟，把他掀得四脚朝天，扯掉了护住他身体的硬甲。
        - id: ch05-b03
          speaker: narrator
          text: >-
            猴群一路嘲笑海龟，把他赶到岸边，又赶进海里。海龟能活着回到水中，已经谢天谢地。他又虚弱又疲惫地回到王宫。冰冷的海水打在赤裸的身体上，叫他浑身难受，狼狈极了。
        - id: ch05-b04
          speaker: narrator
          text: >-
            可海龟再怎么难受，也得去见女王的谋士。他把自己的遭遇从头说了一遍，也承认自己让猴子逃走了。可世上的事有时就是这样。海龟没有受罚，硬壳也还给了他。所有惩罚反倒落在可怜的水母身上。女王判他从此永远赤身露体，再也不能有硬壳。
