  chapters:
    - id: ch01
      title: The Beggars' Gift
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: There once lived a merchant named Mark, though everyone called him Mark the Rich. His heart was hard. He could not stand the sight of poor people near his house. Whenever a beggar came close, Mark had his servants drive the person away, or he sent his dogs after them.
        - id: ch01-b02
          speaker: narrator
          text: One day, three very poor old men came to his door. Mark was about to loose his fiercest dogs when his little daughter, Anastasia, slipped up beside him.
        - id: ch01-b03
          speaker: anastasia
          text: Dear Daddy, please let the poor old men sleep here tonight. Please do it for me.
        - id: ch01-b04
          speaker: narrator
          text: Mark could never bear to refuse her. So the three beggars were given a place to sleep in the loft. That night, after everyone in the house had fallen fast asleep, Anastasia got out of bed. She climbed to the loft and peeped inside.
        - id: ch01-b05
          speaker: narrator
          text: The old men stood in the middle of the loft, resting on their sticks. Their long gray beards flowed down over their hands, and they spoke in low voices.
        - id: ch01-b06
          speaker: eldest_beggar
          text: What news have you heard?
        - id: ch01-b07
          speaker: second_beggar
          text: A peasant named Ivan, in the next village, has just had his seventh son. What name shall the boy have? And what fortune shall we give him?
        - id: ch01-b08
          speaker: third_beggar
          text: Name him Vassili. Give him every possession belonging to the hard-hearted man whose loft shelters us, the man who meant to drive us from his door.
        - id: ch01-b09
          speaker: narrator
          text: The three talked a little longer. Then they made ready, crept quietly from the loft, and disappeared. Anastasia had heard every word. She ran straight to her father and told him everything.
        - id: ch01-b10
          speaker: narrator
          text: Mark was astonished. He thought about the beggars' words over and over. In the morning, he drove to the next village to learn whether such a child had really been born. First he went to the priest and asked about the children in his parish.
        - id: ch01-b11
          speaker: priest
          text: Yesterday, a boy was born in the poorest house in the village. I named the unlucky little fellow Vassili. He is the seventh son, and the oldest is only seven. There is scarcely enough food for any of them. Who could we possibly ask to be godfather to a poor little boy like that?
        - id: ch01-b12
          speaker: narrator
          text: Mark's heart began to pound, and his thoughts toward the baby were wicked. He offered to be godfather himself and ordered a splendid christening feast. The child was christened, and Mark treated the father warmly. Once the ceremony was over, he drew Ivan aside.
        - id: ch01-b13
          speaker: mark
          text: Listen, my friend. You are poor. How can you raise another boy? Give him to me, and I will make something of him. In return, I will give you one thousand crowns. Do we have a bargain?
        - id: ch01-b14
          speaker: narrator
          text: Ivan scratched his head and considered the offer for a long time. At last, he agreed.
        - id: ch01-b15
          speaker: narrator
          text: Mark counted out the money. He wrapped the baby in a fox skin, laid him beside himself in the sledge, and started home. Several miles down the road, Mark stopped. He carried the child to the edge of a steep precipice and threw him over.
        - id: ch01-b16
          speaker: mark
          text: There! Now let us see you take my property!
    - id: ch02
      title: The Child Who Would Not Die
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Soon afterward, some foreign merchants traveled along that road. They were going to see Mark and repay the twelve thousand crowns they owed him. Near the precipice, they heard a baby crying. They looked down and saw a little green meadow caught between two great banks of snow. Among the flowers on that meadow lay the child.
        - id: ch02-b02
          speaker: narrator
          text: The merchants climbed down, picked him up, and wrapped him carefully. Then they continued on their way. When they reached Mark, they told him about their strange discovery. Mark knew at once that this was his godson. He asked to see the baby.
        - id: ch02-b03
          speaker: mark
          text: What a fine little fellow. I would like to keep him. Leave him with me, and I will forgive every crown of your debt.
        - id: ch02-b04
          speaker: narrator
          text: The merchants were delighted with such a bargain. They gave Mark the child and drove away. That night, Mark put the baby in a barrel, fastened the lid down tightly, and threw the barrel into the sea.
        - id: ch02-b05
          speaker: narrator
          text: The barrel drifted far away. At last it floated near a monastery. Some monks were spreading their nets to dry along the shore when they heard crying. The sound seemed to come from a barrel bobbing near the water's edge. They pulled it ashore, opened it, and found a little child inside.
        - id: ch02-b06
          speaker: narrator
          text: When the abbot heard, he decided that the monks would raise the boy. He named him Vassili. The child grew into a clever, gentle, handsome young man. No one there could read, write, or sing better. He did every task so well that the abbot made him keeper of the monastery's clothes.
        - id: ch02-b07
          speaker: narrator
          text: About that time, Mark visited the monastery during a journey. The monks received him politely and showed him their home, their church, and all they possessed. As Mark entered the church, the choir was singing. One voice rang out so clear and beautiful that he asked who it belonged to.
        - id: ch02-b08
          speaker: narrator
          text: The abbot told him the wondrous story of Vassili's arrival. Mark understood that this was the godson he had already tried twice to kill.
        - id: ch02-b09
          speaker: mark
          text: I cannot tell you how much I enjoy that young man's singing. If he came to me, I would put him in charge of all my business. You say he is good and clever, and I could make his fortune. Please let him go with me. I will give your monastery twenty thousand crowns.
        - id: ch02-b10
          speaker: narrator
          text: The abbot hesitated for a long while. He consulted all the other monks. In the end, they agreed that they should not stand between Vassili and such good fortune.
        - id: ch02-b11
          speaker: narrator
          text: Mark wrote a letter to his wife and sent Vassili to deliver it. The letter ordered her to lead the young man into the soap factory. When they passed the great boiler, she was to push him in. If she disobeyed, Mark would be furious. He claimed that Vassili was wicked and would ruin them all if he lived.
    - id: ch03
      title: The Changed Letter
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Vassili had a good voyage. When he landed, he set out on foot for Mark's home. Along the road, he met three beggars.
        - id: ch03-b02
          speakers: [eldest_beggar, second_beggar, third_beggar]
          ensemble: chorus
          text: Where are you going, Vassili?
        - id: ch03-b03
          speaker: vassili
          text: I am going to Mark the Merchant's house. I have a letter for his wife.
        - id: ch03-b04
          speakers: [eldest_beggar, second_beggar, third_beggar]
          ensemble: chorus
          text: Let us see the letter.
        - id: ch03-b05
          speaker: narrator
          text: Vassili handed it to them. The beggars blew upon it and returned it to him.
        - id: ch03-b06
          speakers: [eldest_beggar, second_beggar, third_beggar]
          ensemble: chorus
          text: Now take the letter to Mark's wife. You will not be abandoned.
        - id: ch03-b07
          speaker: narrator
          text: Vassili reached the house and delivered the letter. Mark's wife read it and could hardly believe her eyes. She called for Anastasia. The message now told her to prepare a wedding and marry the bearer to their daughter the very next day. It warned that Mark would be furious if she failed to obey.
        - id: ch03-b08
          speaker: narrator
          text: Anastasia liked the young man as soon as she saw him. They dressed Vassili in fine clothes, and the next day he and Anastasia were married.
        - id: ch03-b09
          speaker: narrator
          text: In time, Mark returned from his travels. His wife, daughter, and new son-in-law all came out to meet him. The sight of Vassili sent Mark into a terrible rage. He turned on his wife.
        - id: ch03-b10
          speaker: mark
          text: How dare you marry my daughter without asking me?
          emotion: angry
        - id: ch03-b11
          speaker: mark_wife
          text: I did exactly what you ordered. Here is the letter.
        - id: ch03-b12
          speaker: narrator
          text: Mark read it. The handwriting was certainly his, but those were not the orders he had given.
        - id: ch03-b13
          speaker: narrator
          text: Mark thought that Vassili had escaped him three times, but that this time he could surely defeat the young man. He kept the thought to himself. For a month, he acted kindly toward his daughter and her husband. Then one day he called Vassili to him.
        - id: ch03-b14
          speaker: mark
          text: I want you to visit my friend, the Serpent King, in his beautiful land at the end of the world. Twelve years ago, he built a castle on land that belongs to me. Ask him for all twelve years of rent. I also want to know what happened to my twelve ships. They sailed for his country three years ago and never returned.
        - id: ch03-b15
          speaker: narrator
          text: Vassili did not dare refuse. He said goodbye to his young wife, who wept bitterly as they parted. Then he hung a bag of biscuits over his shoulder and set out.
    - id: ch04
      title: Questions Along the Road
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Whether his journey was long or short, no one can say. But as Vassili walked, he suddenly heard a voice call his name and ask where he was going. He looked all around and saw no one.
        - id: ch04-b02
          speaker: vassili
          text: Who spoke to me?
        - id: ch04-b03
          speaker: old_oak
          text: I did. I am this old oak with the wide branches. Tell me where you are bound.
        - id: ch04-b04
          speaker: vassili
          text: I am going to collect twelve years of rent from the Serpent King.
        - id: ch04-b05
          speaker: old_oak
          text: When you reach him, remember me. Ask him this. The old oak is rotten at the roots and half dead, yet it is still green. Must it stand on the earth much longer?
        - id: ch04-b06
          speaker: narrator
          text: Vassili went on until he reached a river. He stepped into the ferryboat, and the old ferryman looked at him.
        - id: ch04-b07
          speaker: ferryman
          text: Are you traveling far, my friend?
        - id: ch04-b08
          speaker: vassili
          text: I am going to the Serpent King.
        - id: ch04-b09
          speaker: ferryman
          text: Then remember me when you see him. Tell him the ferryman has rowed back and forth for thirty years. Ask whether this tired old man must keep rowing much longer.
        - id: ch04-b10
          speaker: vassili
          text: Very well. I will ask him.
        - id: ch04-b11
          speaker: narrator
          text: Farther on, Vassili came to a narrow strait. A great whale lay across the water. People walked and drove over its back as if it were a bridge or a road. The moment Vassili stepped onto the whale, it spoke.
        - id: ch04-b12
          speaker: whale
          text: Please tell me where you are going.
        - id: ch04-b13
          speaker: vassili
          text: I am going to the Serpent King.
        - id: ch04-b14
          speaker: whale
          text: Then think of me too. Tell the king that this poor whale has lain across the strait for three years. Men and horses have nearly trampled my back down to my ribs. Ask whether I must lie here much longer.
        - id: ch04-b15
          speaker: vassili
          text: I will remember.
        - id: ch04-b16
          speaker: narrator
          text: Vassili walked on and on until he came to a vast green meadow. A splendid castle stood there. Its walls of white marble sparkled in the light. Mother-of-pearl covered the roof and shone like a rainbow, while the sun burned like fire in the crystal windows.
        - id: ch04-b17
          speaker: narrator
          text: He entered the castle and passed from room to room, amazed by everything he saw. In the very last room, he found a beautiful girl sitting on a bed.
    - id: ch05
      title: The Serpent King's Answers
      blocks:
        - id: ch05-b01
          speaker: castle_girl
          text: Oh, Vassili! What has brought you to this accursed place?
          emotion: fearful
        - id: ch05-b02
          speaker: narrator
          text: Vassili told her why he had come. He also told her about the oak, the ferryman, and the whale he had met along the way.
        - id: ch05-b03
          speaker: castle_girl
          text: No one sent you here to collect rent. You were sent here to die. The serpent is meant to devour you.
          emotion: fearful
        - id: ch05-b04
          speaker: narrator
          text: Before she could say another word, the whole castle shook. A dreadful sound of rustling, hissing, and groaning swept through it. The girl quickly pushed Vassili into a chest beneath the bed and locked it.
        - id: ch05-b05
          speaker: castle_girl
          text: Listen carefully to everything the serpent and I say.
        - id: ch05-b06
          speaker: narrator
          text: Then she rose to receive the Serpent King. The monster rushed into the room and flung himself onto the bed, panting.
        - id: ch05-b07
          speaker: serpent_king
          text: I have flown over half the world. I am tired, terribly tired. I want to sleep. Scratch my head.
        - id: ch05-b08
          speaker: narrator
          text: The girl sat beside him and stroked his hideous head. Her voice was sweet and coaxing.
        - id: ch05-b09
          speaker: castle_girl
          text: You know everything in the world. After you left, I had the strangest dream. Will you tell me what it means?
        - id: ch05-b10
          speaker: serpent_king
          text: Then tell it quickly. What did you dream?
        - id: ch05-b11
          speaker: castle_girl
          text: I dreamed I was walking along a broad road when an oak spoke to me. Its roots were rotten, and it was half dead, but its leaves were still green. The oak wanted to know whether it must stand much longer.
        - id: ch05-b12
          speaker: serpent_king
          text: It must stand until someone knocks it down with one foot. Once it falls, more gold and silver will be found beneath its roots than even Mark the Rich possesses.
        - id: ch05-b13
          speaker: castle_girl
          text: Then I dreamed I reached a river. An old ferryman told me he had rowed back and forth for thirty years. He wanted to know whether he must go on much longer.
        - id: ch05-b14
          speaker: serpent_king
          text: That is up to him. The next time someone enters his boat, he must push it away from the bank and walk off without looking back. The passenger in the boat will have to take his place.
        - id: ch05-b15
          speaker: castle_girl
          text: At last, I dreamed I crossed a bridge formed by a whale's back. The living bridge said it had lain there for three years. Men and horses had trampled its back almost to its ribs. It asked whether it must stay there much longer.
        - id: ch05-b16
          speaker: serpent_king
          text: It must remain until it throws up the twelve ships belonging to Mark the Rich. It swallowed them all. After that, it can plunge into the sea and let its back heal.
        - id: ch05-b17
          speaker: narrator
          text: The Serpent King closed his eyes, rolled onto his other side, and began to snore. The sound was so loud that the windows rattled. The girl lost no time. She unlocked the chest, helped Vassili out, and showed him part of the way back. Vassili thanked her most politely and hurried away.
    - id: ch06
      title: The Journey Home
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: When Vassili reached the strait, the whale called to him.
        - id: ch06-b02
          speaker: whale
          text: Did you remember me?
        - id: ch06-b03
          speaker: vassili
          text: Yes. As soon as I reach the other side, I will tell you what you need to know.
        - id: ch06-b04
          speaker: narrator
          text: Once Vassili had crossed, he turned back to the whale.
        - id: ch06-b05
          speaker: vassili
          text: You swallowed Mark's twelve ships three years ago. Throw them up.
        - id: ch06-b06
          speaker: narrator
          text: The huge creature heaved itself upward and brought up all twelve ships, with every crew aboard. Then the whale shook itself for joy and plunged into the sea.
        - id: ch06-b07
          speaker: narrator
          text: Vassili continued to the river. The old ferryman was waiting.
        - id: ch06-b08
          speaker: ferryman
          text: Did you remember my question?
        - id: ch06-b09
          speaker: vassili
          text: Yes. Ferry me across first, and then I will give you the answer.
        - id: ch06-b10
          speaker: narrator
          text: When they reached the other bank, Vassili explained what the ferryman must do.
        - id: ch06-b11
          speaker: vassili
          text: When the next traveler gets into your boat, leave him there. Step ashore, push the boat away, and you will be free. That traveler will have to take your place.
        - id: ch06-b12
          speaker: narrator
          text: Vassili went on and soon came to the old oak. He pushed it with his foot, and the tree toppled over. Beneath its roots lay more gold and silver than even Mark the Rich owned.
        - id: ch06-b13
          speaker: narrator
          text: Just then, the twelve ships the whale had released came sailing by and anchored nearby. The three beggars stood on the deck of the first ship.
        - id: ch06-b14
          speakers: [eldest_beggar, second_beggar, third_beggar]
          ensemble: chorus
          text: Heaven has blessed you, Vassili.
        - id: ch06-b15
          speaker: narrator
          text: The beggars vanished, and Vassili never saw them again. The sailors carried all the gold and silver aboard. Then the ships set sail for home, with Vassili among them.
    - id: ch07
      title: Mark at the Ferry
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: Mark was more furious than ever. He had his horses harnessed and drove away himself. He meant to find the Serpent King and complain that he had been betrayed.
        - id: ch07-b02
          speaker: narrator
          text: When Mark reached the river, he jumped into the ferryboat. But the ferryman did not climb in. He pushed the boat away from the shore.
        - id: ch07-b03
          speaker: narrator
          text: Vassili lived a good and happy life with his dear wife, while his kind mother-in-law made her home with them. He helped the poor. He gave food to the hungry and clothes to those who had none. All of Mark's riches became his.
        - id: ch07-b04
          speaker: narrator
          text: Mark has been rowing people across that river for many years. His face is wrinkled now. His hair and beard are white as snow, and his eyes have grown dim.
        - id: ch07-b05
          speaker: narrator
          text: Still, he rows on.
