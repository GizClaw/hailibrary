        pace: 稍慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 三位乞丐的预言
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前有个商人叫马克，人们都称他“富人马克”。他心肠很硬，最见不得穷人。乞丐只要靠近他家，不是被仆人赶走，就是要遭恶狗追咬。
        - id: ch01-b02
          speaker: narrator
          text: >-
            一天，三个穷苦的老头来到门前讨饭。马克正要放狗，小女儿阿娜斯塔西娅悄悄靠到父亲身边。
        - id: ch01-b03
          speaker: anastasia
          text: >-
            好爸爸，让这几位可怜的老人住一晚吧。就答应我，好不好？
        - id: ch01-b04
          speaker: narrator
          text: >-
            马克不忍拒绝女儿，只好让三人在阁楼过夜。深夜，家里的人都睡熟了，阿娜斯塔西娅却爬起来，登上阁楼，偷偷往里看。
        - id: ch01-b05
          speaker: narrator
          text: >-
            三个老人拄着手杖，站在阁楼中央。灰白的长胡子垂下来，盖住了双手。他们正低声交谈。
        - id: ch01-b06
          speaker: beggar_eldest
          text: >-
            有什么新鲜事？
        - id: ch01-b07
          speaker: beggar_second
          text: >-
            邻村的农夫伊凡刚得了第七个儿子。我们给他取什么名字，又赐给他怎样的命运？
        - id: ch01-b08
          speaker: beggar_third
          text: >-
            就叫瓦西里。我们此刻站在谁家的阁楼，就把那狠心人的全部家产赐给他。刚才这家主人还想赶走我们呢。
        - id: ch01-b09
          speaker: narrator
          text: >-
            三人又谈了一会儿，便悄无声息地离去。阿娜斯塔西娅听见了每一句话，立刻跑去把一切告诉父亲。
        - id: ch01-b10
          speaker: narrator
          text: >-
            马克又惊又疑，坐在那里想了又想。第二天一早，他赶到邻村，要弄清那里是不是真有这样一个孩子降生。他先去见牧师，打听教区里新生的孩子。
        - id: ch01-b11
          speaker: priest
          text: >-
            昨天，村里最穷的人家生了个男孩。我给这可怜的小家伙取名叫瓦西里。他是第七个儿子，最大的孩子才七岁。一家人连一口饭都难分到，谁肯给这样的穷孩子做教父呢？
        - id: ch01-b12
          speaker: narrator
          text: >-
            马克的心怦怦直跳，脑中全是害死这个可怜婴儿的念头。他却装作亲热，说自己愿做教父，还吩咐人备下丰盛的洗礼宴。孩子被抱来受了洗，马克对伊凡格外友善。仪式过后，他把伊凡拉到一旁。
        - id: ch01-b13
          speaker: mark
          text: >-
            朋友，你这么穷，怎么养得起这个孩子？把他交给我，我会把他培养成材，再送你一千克朗。就这么说定，怎么样？
        - id: ch01-b14
          speaker: narrator
          text: >-
            伊凡挠着头，想了又想，终于答应。马克当面数出一千克朗，用狐狸皮裹住婴儿，放在自己身旁的雪橇上，赶车回家。走出几英里，他勒住马，把孩子抱到陡峭的悬崖边，扔了下去。
        - id: ch01-b15
          speaker: mark
          text: >-
            这下看你还怎么夺走我的家产！
          emotion: angry
        - id: ch01-b16
          speaker: narrator
          text: >-
            不久，几个外国商人从这里经过，要去偿还欠马克的一万二千克朗。他们听见崖下传来哭声，低头一看，两大堆积雪之间夹着一小片绿草地，一个婴儿正躺在花丛中。
        - id: ch01-b17
          speaker: narrator
          text: >-
            商人们救起孩子，仔细裹好，带去见马克，还讲了这桩奇事。马克一眼便认出自己的教子。
        - id: ch01-b18
          speaker: mark
          text: >-
            这小家伙真可爱，我愿意留下他。你们把他交给我，那笔债就不用还了。
        - id: ch01-b19
          speaker: narrator
          text: >-
            商人们满心欢喜地做成了这桩合算的交易，把孩子留下便赶车离开。可到了夜里，马克把孩子塞进木桶，牢牢钉死桶盖，抛进大海。木桶漂出很远，最后来到一座修道院旁。修士们正把渔网摊在岸边晾晒，忽然听见哭声，像是从水边一起一伏的木桶里传出来的。他们把桶拖上岸，打开一看，里面竟是个孩子。
        - id: ch01-b20
          speaker: narrator
          text: >-
            院长听到消息，决定亲自将男孩抚养成人，也给他取名瓦西里。孩子留在修道院里，跟随修士们长大，变成一个聪明、温和又俊美的青年。论读书、写字和歌唱，没有谁比得过他。他无论做什么都很出色，院长便让他掌管衣物。

    - id: ch02
      title: 一封变了内容的信
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            一次，马克出门办事，途中来到这座修道院。修士们客客气气地带他参观院舍、教堂和院里的一切。他们走进教堂时，唱诗班正在歌唱，其中一个嗓音格外清亮优美。马克问那是谁，院长便将瓦西里的奇异来历告诉了他。马克立刻明白，这正是自己两次想杀却都没能杀死的教子。
        - id: ch02-b02
          speaker: mark
          text: >-
            我太喜欢那年轻人的歌声了。他要是跟我走，我就让他总管我所有的生意。他这样善良聪明，您就把他让给我吧。我会让他飞黄腾达，还会送给修道院两万克朗。
        - id: ch02-b03
          speaker: narrator
          text: >-
            院长犹豫了很久，又把全体修士召来商议。大家想来想去，最后认定，不该挡住瓦西里的大好前程，于是答应让他跟马克走。
        - id: ch02-b04
          speaker: narrator
          text: >-
            马克写了一封信，让瓦西里带给自己的妻子。信中命令她等送信人一到，就把他领进肥皂作坊，经过那口大锅时将他推进去。若不服从，马克就会大发雷霆，因为这个年轻人是个恶徒，只要活着，迟早会害得全家破产。
        - id: ch02-b05
          speaker: narrator
          text: >-
            瓦西里带着信乘船出发，海上一路顺利。船靠岸以后，他独自上岸，徒步前往马克家。走在路上，他遇见了三个乞丐。
        - id: ch02-b06
          speakers: [beggar_eldest, beggar_second, beggar_third]
          ensemble: chorus
          text: >-
            瓦西里，你要到哪里去？
        - id: ch02-b07
          speaker: vassili
          text: >-
            我要去商人马克家，替他给妻子送一封信。
        - id: ch02-b08
          speaker: beggar_eldest
          text: >-
            把信给我们看看。
        - id: ch02-b09
          speaker: narrator
          text: >-
            瓦西里递过信去。三人朝信上吹了一口气，又把它交还给他。
        - id: ch02-b10
          speakers: [beggar_eldest, beggar_second, beggar_third]
          ensemble: chorus
          text: >-
            现在去把信交给马克的妻子吧。你绝不会遭人遗弃。
        - id: ch02-b11
          speaker: narrator
          text: >-
            瓦西里来到马克家，把信交给女主人。她读完以后，几乎不敢相信自己的眼睛，赶忙叫来女儿。信上清清楚楚地吩咐她立刻筹备婚礼，第二天就让送信人与阿娜斯塔西娅成婚。若不服从，马克便要大发雷霆。
        - id: ch02-b12
          speaker: narrator
          text: >-
            阿娜斯塔西娅见到送信的瓦西里，心里十分喜欢。家里人立即为他换上一身华美的衣裳。到了第二天，婚礼如期举行，瓦西里与阿娜斯塔西娅成了亲。
        - id: ch02-b13
          speaker: narrator
          text: >-
            过了些日子，马克远行归来。妻子、女儿和女婿一同出门迎接。他看见瓦西里，顿时冲妻子发起火来。
        - id: ch02-b14
          speaker: mark
          text: >-
            你怎么敢不问过我，就把女儿嫁出去？
          emotion: angry
        - id: ch02-b15
          speaker: mark_wife
          text: >-
            我只是照你的命令办事。你写的信就在这里。
        - id: ch02-b16
          speaker: narrator
          text: >-
            马克看了信。那确实是他的笔迹，内容却绝不是他的意思。
        - id: ch02-b17
          speaker: mark
          text: >-
            你已经从我手里逃过三回。下一次，我总能胜过你。
        - id: ch02-b18
          speaker: narrator
          text: >-
            他耐着性子等了一个月，对女儿和女婿一直装得亲切和善。时机一到，便把瓦西里叫来。
        - id: ch02-b19
          speaker: mark
          text: >-
            你替我去见蛇王。他住在世界尽头一个美丽的国度。十二年前，他在我的土地上建了一座城堡。你去讨回十二年的租金，再问清我那十二艘船的下落。三年前，它们驶往他的国度，从此再没回来。
        - id: ch02-b20
          speaker: narrator
          text: >-
            瓦西里不敢违命。他向年轻的妻子告别。阿娜斯塔西娅哭得很伤心。他把一袋饼干搭在肩头，独自上路。

    - id: ch03
      title: 通往世界尽头的路
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            这段路到底是长是短，就连讲故事的人也实在说不清。瓦西里背着那袋饼干，一路走着，走着，忽然听见有声音叫他的名字，问他要到哪里去。他停下脚步，四下一望，却看不见半个人影。
        - id: ch03-b02
          speaker: vassili
          text: >-
            是谁在跟我说话？
        - id: ch03-b03
          speaker: oak
          text: >-
            是我，这棵枝叶伸展的老橡树。告诉我，你要去哪儿？
        - id: ch03-b04
          speaker: vassili
          text: >-
            我要去找蛇王，向他收取十二年的租金。
        - id: ch03-b05
          speaker: oak
          text: >-
            到了那里，别忘了替我问问。我的根已经腐烂，身子也死了一半，却还长得青绿。我还要在世上站多久？
        - id: ch03-b06
          speaker: narrator
          text: >-
            瓦西里记住老橡树的话，继续向前赶路。走了一程，他来到一条河边，见那里停着一只渡船，便登了上去。守船的老艄公开口问他。
        - id: ch03-b07
          speaker: ferryman
          text: >-
            朋友，你要去很远的地方吗？
        - id: ch03-b08
          speaker: vassili
          text: >-
            我要去找蛇王。
        - id: ch03-b09
          speaker: ferryman
          text: >-
            那就替我问问他。我来来回回划了三十年，还要在这条河上辛苦多久？
        - id: ch03-b10
          speaker: vassili
          text: >-
            好，我会替你问。
        - id: ch03-b11
          speaker: narrator
          text: >-
            再往前走，他来到一道狭窄的海峡。一条大鲸鱼横卧在水面，人们从它背上行走赶车，就像过桥一样。瓦西里刚踏上去，鲸鱼便问他要去哪里。
        - id: ch03-b12
          speaker: vassili
          text: >-
            我要去找蛇王。
        - id: ch03-b13
          speaker: whale
          text: >-
            请替我问问国王。我横卧在海峡里已经三年，人和马几乎把我的背踩进肋骨里。我还得在这里躺多久？
        - id: ch03-b14
          speaker: vassili
          text: >-
            我会记得你的事。
        - id: ch03-b15
          speaker: narrator
          text: >-
            他走啊，走啊，不停地走，终于来到一片辽阔的绿草地。那里耸立着一座宏伟壮丽的城堡。白色大理石墙在光下闪闪发亮，铺满珍珠母的屋顶泛着彩虹般的光，阳光落在水晶窗上，像火一样灿烂。瓦西里走了进去，一间屋接一间屋地看，眼前的奢华让他惊叹不已。
        - id: ch03-b16
          speaker: narrator
          text: >-
            瓦西里走进城堡，穿过一间又一间华美的屋子。在最后一间屋里，一个美丽的姑娘正坐在床上。
        - id: ch03-b17
          speaker: maiden
          text: >-
            哎呀，瓦西里，你怎么会来到这个遭诅咒的地方？
          emotion: surprised
        - id: ch03-b18
          speaker: narrator
          text: >-
            瓦西里说出自己的来意，又讲了路上的所见所闻。
        - id: ch03-b19
          speaker: maiden
          text: >-
            马克让你来，不是为了收租金。他是要你送命，好让那条蛇把你吃掉。
          emotion: fearful
        - id: ch03-b20
          speaker: narrator
          text: >-
            她刚说完，整座城堡便猛然摇撼。四周传来摩擦声、嘶嘶声和呻吟声。姑娘赶紧把瓦西里推进床下的箱子，锁好箱盖。
        - id: ch03-b21
          speaker: maiden
          text: >-
            仔细听我和蛇王说些什么。
        - id: ch03-b22
          speaker: narrator
          text: >-
            她起身迎接蛇王。怪物冲进房间，气喘吁吁地扑倒在床上。
        - id: ch03-b23
          speaker: serpent_king
          text: >-
            我飞过了大半个世界，累得要命！我要睡觉，快给我挠挠头。
        - id: ch03-b24
          speaker: narrator
          text: >-
            姑娘坐到它身边，轻轻抚摸那颗丑陋的脑袋，用甜甜的声音哄它。
        - id: ch03-b25
          speaker: maiden
          text: >-
            世上的事没有你不知道的。你走以后，我做了一个好奇怪的梦。你能告诉我，那是什么意思吗？
        - id: ch03-b26
          speaker: serpent_king
          text: >-
            快说！你梦见什么了？

    - id: ch04
      title: 蛇王解开三个谜
      blocks:
        - id: ch04-b01
          speaker: maiden
          text: >-
            我梦见自己走在一条宽阔的大路上。一棵橡树请我问国王，它的根已经腐烂，身子死了一半，却依然青绿。它还要站多久？
        - id: ch04-b02
          speaker: serpent_king
          text: >-
            它得等到有人走来，用脚把它推倒。树根下面藏着的金银，比富人马克所有的还要多。
        - id: ch04-b03
          speaker: maiden
          text: >-
            后来我梦见一条河。老艄公说，他来回划了三十年，已经疲惫不堪。他还要划多久？
        - id: ch04-b04
          speaker: serpent_king
          text: >-
            那要看他自己。下次有人上船，他只管把船推离岸边，自己转身走开，别再回头。船上的人自然会接替他。
        - id: ch04-b05
          speaker: maiden
          text: >-
            最后，我梦见自己走过一座鲸背搭成的桥。那座活桥说，它横卧了三年，人和马几乎把它的背踩进肋骨。它还要躺多久？
        - id: ch04-b06
          speaker: serpent_king
          text: >-
            它吞了富人马克的十二艘船。等它把船全吐出来，就能潜回大海，养好背上的伤。
        - id: ch04-b07
          speaker: narrator
          text: >-
            蛇王闭上眼，翻到另一侧，很快便鼾声大作，震得窗子格格响。姑娘一刻也不耽搁，赶紧放瓦西里从箱子里出来，又为他指路，送了他一程。瓦西里彬彬有礼地向她道谢，匆匆离去。
        - id: ch04-b08
          speaker: narrator
          text: >-
            回到海峡边，鲸鱼马上问他有没有记起自己的事。
        - id: ch04-b09
          speaker: vassili
          text: >-
            记得。等我走到对岸，就把答案告诉你。
        - id: ch04-b10
          speaker: narrator
          text: >-
            瓦西里过了海峡，这才转身对鲸鱼说出答案。
        - id: ch04-b11
          speaker: vassili
          text: >-
            把三年前吞下的马克那十二艘船吐出来。
        - id: ch04-b12
          speaker: narrator
          text: >-
            大鲸鱼用力拱起庞大的身子，把十二艘船连同船上的人全吐了出来。重获自由以后，它欢喜地抖了抖全身，一头扎进水里，潜回了辽阔的大海。
        - id: ch04-b13
          speaker: narrator
          text: >-
            瓦西里来到渡口，老艄公也问起自己的答案。
        - id: ch04-b14
          speaker: vassili
          text: >-
            我记得。先送我过河，到了对岸我就告诉你。
        - id: ch04-b15
          speaker: narrator
          text: >-
            老人把他送过河去。瓦西里上岸以后，才说出脱身的办法。
        - id: ch04-b16
          speaker: vassili
          text: >-
            下一个人来了，就让他留在船上。你踏上岸，把船推开，这样便自由了。船里的人会接替你。
        - id: ch04-b17
          speaker: narrator
          text: >-
            瓦西里继续往前，很快来到老橡树跟前。他用脚一推，大树轰然倒下。树根底下果然藏着无数金银，比富人马克的全部财富还多。
        - id: ch04-b18
          speaker: narrator
          text: >-
            就在这时，鲸鱼吐出的十二艘船扬帆而来，停泊在附近。先头那艘船的甲板上，站着瓦西里先前见过的三个乞丐。
        - id: ch04-b19
          speakers: [beggar_eldest, beggar_second, beggar_third]
          ensemble: chorus
          text: >-
            上天已经赐福于你，瓦西里。
        - id: ch04-b20
          speaker: narrator
          text: >-
            说完，三人便消失无踪。瓦西里从此再没见过他们。水手们把金银全搬上船，随后升帆返航，带他回家。

    - id: ch05
      title: 富人马克的结局
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            马克气得比以往任何时候都厉害。他命人套好马车，亲自赶往世界尽头，要去见蛇王，控诉自己怎样遭人算计和背叛。来到那条河边，他纵身跳进渡船。可是，这一回老艄公没有跟着上船，只站在岸上，将船推离了岸边……
        - id: ch05-b02
          speaker: narrator
          text: >-
            瓦西里和心爱的妻子过着幸福的生活，善良的岳母也与他们住在一起。他扶助穷人，给饥饿的人饭吃，给衣不蔽体的人衣穿。马克的全部财富，最终都归了他。
        - id: ch05-b03
          speaker: narrator
          text: >-
            许多年过去了，马克还在河上替人摆渡。他满脸皱纹，头发和胡子白得像雪，双眼已经昏花，却仍旧不停地划着船。
        - id: ch05-b04
          speaker: narrator
          text: >-
            这个故事选自《塞尔维亚民间故事》。
