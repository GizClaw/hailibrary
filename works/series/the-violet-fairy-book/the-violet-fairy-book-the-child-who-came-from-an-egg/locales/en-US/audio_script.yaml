  chapters:
    - id: ch01
      title: The Egg in the Birch-Bark Basket
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a queen whose heart ached because she had no children. She was sad even when her husband was beside her. Whenever he went away, she shut herself off from everyone and wept all day.
        - id: ch01-b02
          speaker: narrator
          text: Then war broke out with a neighboring king, and her husband left to fight. Alone in the palace, the queen felt as though the walls were closing around her. She wandered into the garden and lay down on a grassy bank beneath a lime tree.
        - id: ch01-b03
          speaker: narrator
          text: After a while, leaves rustled above her. An old woman on crutches was limping toward the stream. She drank, then came straight to the queen.
        - id: ch01-b04
          speaker: godmother
          text: Please don't be offended because I dared to speak to you, noble lady. And don't fear me. I may be able to bring you good luck.
        - id: ch01-b05
          speaker: narrator
          text: The queen looked at the old woman with doubt.
        - id: ch01-b06
          speaker: queen
          text: You don't seem to have had much luck yourself. How could you have any to spare for someone else?
        - id: ch01-b07
          speaker: godmother
          text: Rough bark can hide smooth wood and a sweet kernel. Give me your hand, and I will read what lies ahead.
        - id: ch01-b08
          speaker: narrator
          text: The queen held out her hand. The old woman studied every line in her palm.
        - id: ch01-b09
          speaker: godmother
          text: Two sorrows weigh on you, one new and one old. Your new sorrow is for your husband, fighting far away. Believe me, he is safe, and he will soon return with happy news. But the older sorrow has spoiled all your joy. You have no children.
        - id: ch01-b10
          speaker: narrator
          text: The queen turned scarlet and tried to pull her hand away.
        - id: ch01-b11
          speaker: godmother
          text: Be patient a little longer. There are still things I need to see clearly.
        - id: ch01-b12
          speaker: queen
          text: Who are you? You seem able to see into my heart.
        - id: ch01-b13
          speaker: godmother
          text: My name does not matter. Be glad that I am allowed to show you how to ease your grief. But you must promise to follow every word I tell you, or no good will come of it.
        - id: ch01-b14
          speaker: queen
          text: I promise I will obey you exactly. If you can help me, I will give you anything you ask.
        - id: ch01-b15
          speaker: narrator
          text: The old woman thought for a moment. Then she reached into the folds of her dress and undid wrapping after wrapping. Inside was a tiny basket made of birch bark.
        - id: ch01-b16
          speaker: godmother
          text: There is a bird's egg in this basket. Keep it warm for three months. It will become a doll. Put that doll in a basket lined with soft wool and leave it alone. It needs no food. In time, it will grow to the size of a baby.
        - id: ch01-b17
          speaker: godmother
          text: By then, you will have a baby of your own. Lay the two children side by side and bring your husband to see his son and daughter. Raise the boy yourself, but place the girl in a nurse's care.
        - id: ch01-b18
          speaker: godmother
          text: When they are christened, invite me to be the princess's godmother. You will find a goose's wing hidden in the cradle. Throw it from the window, and I will come at once. Tell no one about anything that has happened here.
        - id: ch01-b19
          speaker: narrator
          text: Before the queen could answer, the old woman limped away. She had barely taken two steps when she became a young girl. She moved so swiftly that she seemed to fly instead of walk.
        - id: ch01-b20
          speaker: narrator
          text: The queen watched the change and could hardly trust her eyes. She might have believed it was all a dream, but the little basket was still in her hands. That was proof enough. She hurried back to her room, feeling nothing like the poor, sorrowful woman who had entered the garden only a short while before.
        - id: ch01-b21
          speaker: narrator
          text: Inside the basket she found a tiny, soft-blue egg dotted with green. The warmest place she could think of was close to her heart, so that was where she kept it.
    - id: ch02
      title: Two Royal Children
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Two weeks later, the king came home victorious. The old woman's first promise had come true, and the queen's heart leaped with hope. Perhaps everything else would happen too.
        - id: ch02-b02
          speaker: narrator
          text: She guarded the egg and its basket as her greatest treasures. She even had a golden case made, so the basket would be safe when the egg was placed inside it.
        - id: ch02-b03
          speaker: narrator
          text: Three months passed. The queen took the egg from its warm place close to her heart and tucked it among folds of wool, just as she had been told. When she looked the next morning, the first thing she saw was the broken shell. A little doll lay quietly among the pieces.
        - id: ch02-b04
          speaker: narrator
          text: At last the queen was happy. She left the doll undisturbed and waited for the child of her own who had been promised to her.
        - id: ch02-b05
          speaker: narrator
          text: In time, the queen had a baby of her own, just as the old woman had promised. It was a son. She lifted the little girl from the basket and laid her beside the boy in a golden cradle that glittered with precious stones. Then she sent for her husband. When the king came and saw both babies waiting for him, he nearly went wild with joy.
        - id: ch02-b06
          speaker: narrator
          text: Soon the whole court gathered for the royal christening. When everything was ready, the queen quietly opened the window and let the goose's wing fly out.
        - id: ch02-b07
          speaker: narrator
          text: Guests were still arriving when a splendid coach appeared, drawn by six cream-colored horses. A young lady stepped down in clothes that shone like the sun. A veil hid her face, but when she reached the queen and the babies, she drew it aside. Everyone was dazzled by her beauty.
        - id: ch02-b08
          speaker: narrator
          text: The lady took the little girl in her arms and held her up before everyone. From that day on, she announced, the child would be called Dotterine. No one understood that strange name except the queen, who knew the baby had come from an egg yolk. The boy received the name Willem.
        - id: ch02-b09
          speaker: narrator
          text: When the feast ended and the guests began to leave, the godmother placed Dotterine in the cradle and spoke privately to the queen.
        - id: ch02-b10
          speaker: godmother
          text: Whenever she sleeps, put the basket beside her and keep the eggshells inside it. As long as you do, no evil can reach her. Guard this treasure as carefully as your own eyes, and teach your daughter to guard it too.
        - id: ch02-b11
          speaker: narrator
          text: She kissed the baby three times, climbed into her coach, and drove away.
        - id: ch02-b12
          speaker: narrator
          text: Both children flourished. Dotterine's nurse loved her as though she were her own baby. The girl grew lovelier each day, and people said she would soon be as beautiful as her godmother.
        - id: ch02-b13
          speaker: narrator
          text: Only the nurse knew that a strange and beautiful lady bent over Dotterine while she slept at night. At last she told the queen, and the two women agreed that no one else must know.
    - id: ch03
      title: The Queen's Last Charge
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The twins were almost two when the queen suddenly became ill. The finest doctors in the country came to her, but there is no cure for death.
        - id: ch03-b02
          speaker: narrator
          text: Knowing her life was ending, the queen sent for Dotterine and the nurse, who had become her lady-in-waiting. She trusted this faithful woman with the precious basket.
        - id: ch03-b03
          speaker: queen
          text: When my daughter turns ten, place this basket in her hands. Warn her seriously that all her future happiness depends on how carefully she guards it. As for my son, I have no fear for him. He is heir to the kingdom, and his father will watch over him.
        - id: ch03-b04
          speaker: narrator
          text: The lady-in-waiting promised to obey and, above all, to keep the basket secret. That same morning, the queen died.
        - id: ch03-b05
          speaker: narrator
          text: Years later, the king married again, though he did not love his second wife as he had loved the first. Ambition alone led him to the marriage. The new queen hated her stepchildren. Their father saw it and kept them out of her way under the old nurse's care. But whenever they happened to cross the queen's path, she kicked them out of her sight like dogs.
        - id: ch03-b06
          speaker: narrator
          text: On Dotterine's tenth birthday, the nurse gave her the basket and repeated her mother's last instructions. Dotterine was still too young to understand its worth, and at first she paid little attention to it.
        - id: ch03-b07
          speaker: narrator
          text: Two years passed. One day, while the king was away, the stepmother found Dotterine beneath a lime tree. As always, she flew into a rage. She beat the child so cruelly that Dotterine staggered back to her room.
        - id: ch03-b08
          speaker: narrator
          text: Her nurse was gone. Dotterine stood there crying until she noticed the golden case that held the little basket. Hoping it might contain something amusing, she opened it eagerly. She found only wool and two empty pieces of eggshell.
        - id: ch03-b09
          speaker: narrator
          text: Disappointed, she lifted the wool and uncovered the goose's wing.
        - id: ch03-b10
          speaker: dotterine
          text: This is nothing but old rubbish.
        - id: ch03-b11
          speaker: narrator
          text: She turned and tossed the wing through the open window. In an instant, a beautiful lady stood beside her.
        - id: ch03-b12
          speaker: godmother
          text: Don't be frightened. I am your godmother, and I have come to visit you. Your red eyes show how unhappy you are. I know your stepmother treats you cruelly, but be brave and patient. Better days will come.
          emotion: calm
        - id: ch03-b13
          speaker: godmother
          text: Once you are grown, she will have no power over you. No one else can harm you either, as long as you never part with the basket or lose the eggshells. Make a silk case for the basket and hide it in your dress, day and night. Then you will be safe from anyone who means to hurt you.
        - id: ch03-b14
          speaker: godmother
          text: If you are ever in trouble and don't know what to do, take out the goose's wing and throw it through a window. I will come at once. Now walk with me beneath the lime trees, where no one can hear us talk.
        - id: ch03-b15
          speaker: narrator
          text: Beneath the lime trees, they had so much to tell each other that the hours slipped away. The sun was already setting when the godmother finished giving Dotterine all the good advice she had come to offer. At last, she saw it was time to leave.
        - id: ch03-b16
          speaker: godmother
          text: Give me the basket. You need some supper, and I won't let you go to bed hungry.
        - id: ch03-b17
          speaker: narrator
          text: She bent over the basket and whispered magic words. At once, a table covered with fruit and cakes appeared on the ground. When they had eaten, the godmother walked Dotterine home. Along the way, she taught her what to say whenever she wanted the basket to give her something.
    - id: ch04
      title: The Fall of the Kingdom
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: A few more years went by, and Dotterine grew into a young woman. Everyone who saw her thought there could not be a lovelier girl anywhere in the world.
        - id: ch04-b02
          speaker: narrator
          text: Then a terrible war began. The king and his army were driven farther and farther back until they took refuge inside the town and prepared for a siege. The siege lasted so long that food ran out. Even the palace had almost nothing left to eat.
        - id: ch04-b03
          speaker: narrator
          text: One morning, after going without both supper and breakfast, Dotterine was terribly hungry. There was still nothing in the palace for her to eat. She sent the wing flying from her window. By then she felt so weak and miserable that, the moment her godmother appeared, Dotterine burst into tears. For some time, she could not speak at all.
        - id: ch04-b04
          speaker: godmother
          text: Don't cry, dear child. I will take you away from all this. The others must face whatever comes.
          emotion: calm
        - id: ch04-b05
          speaker: narrator
          text: Dotterine followed her through the town gates and straight through the enemy army. No one stopped them. No one even seemed to see them.
        - id: ch04-b06
          speaker: narrator
          text: The town surrendered the very next day. The king and every one of his courtiers were taken prisoner. In all the confusion, his son found a way to escape. The stepmother was already dead, struck by a spear that had been thrown carelessly.
        - id: ch04-b07
          speaker: narrator
          text: Once they were safely beyond the enemy, Dotterine changed from her own clothes into a peasant's dress. To hide her even more completely, the godmother changed her face.
        - id: ch04-b08
          speaker: godmother
          text: When happier times return and you want your own face again, whisper the words I taught you into the basket. Ask to look like yourself, and it will happen at once. You must endure a little longer first.
        - id: ch04-b09
          speaker: narrator
          text: The godmother warned her once more to guard the basket, then said farewell.
        - id: ch04-b10
          speaker: narrator
          text: For many days, Dotterine wandered from place to place without finding shelter. The basket gave her enough food to keep her from starving, but she still longed for a home. She was glad when a peasant family took her into service, and there she meant to stay until brighter days arrived.
        - id: ch04-b11
          speaker: narrator
          text: At first, every task seemed difficult. Yet Dotterine learned with wonderful speed, unless the basket was secretly helping her. After only three days, she could scrub pots and sweep rooms as skillfully as if she had done such work all her life.
    - id: ch05
      title: A Servant in Disguise
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: One morning, Dotterine was scouring a wooden tub outside the door when a noble lady passed through the village. The girl's bright face caught her eye, and she stopped to call Dotterine over.
        - id: ch05-b02
          speaker: noble_lady
          text: Would you like to come and work in my household?
        - id: ch05-b03
          speaker: dotterine
          text: I would like that very much, if my mistress will let me go.
        - id: ch05-b04
          speaker: noble_lady
          text: Leave that to me. I will arrange it.
        - id: ch05-b05
          speaker: narrator
          text: And she did. That same day, the noble lady and Dotterine set out for her home, with Dotterine seated beside the coachman.
        - id: ch05-b06
          speaker: narrator
          text: Six months passed. Then joyful news spread through the kingdom. The king's son had gathered an army, fought the usurper who had taken his father's place, and defeated him. At that same moment, however, Dotterine learned that the old king had died while still a prisoner.
        - id: ch05-b07
          speaker: narrator
          text: She wept bitterly for him, but only in secret. She had never told her mistress anything about her former life.
        - id: ch05-b08
          speaker: narrator
          text: After a year of mourning, the young king announced that he meant to marry. Every maiden in the kingdom was commanded to attend a feast, and he would choose his wife from among them.
        - id: ch05-b09
          speaker: narrator
          text: For weeks, mothers and daughters prepared beautiful gowns and tried new ways of arranging their hair. The noble lady's three lovely daughters were just as excited as all the rest.
        - id: ch05-b10
          speaker: narrator
          text: Dotterine had clever hands, and all day long she worked on their fine clothes. But each night, she dreamed that her godmother bent over her bed and spoke to her.
        - id: ch05-b11
          speaker: godmother
          text: Dress your young ladies for the feast. When they have gone, follow them. No one there will look as splendid as you.
    - id: ch06
      title: The Feast at the Palace
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: When the great day arrived, Dotterine could hardly contain her excitement. Still, she did her work. She dressed each of the three young women for the feast and watched them drive away with their mother. Once they were gone, Dotterine flung herself onto her bed and burst into tears.
        - id: ch06-b02
          speaker: narrator
          text: A voice seemed to whisper close beside her.
        - id: ch06-b03
          speaker: godmother
          text: Look inside your basket. Everything you need is waiting there.
        - id: ch06-b04
          speaker: narrator
          text: Dotterine needed no second invitation. She sprang up, took the basket, and said the magic words. There on the bed lay a dress that shone like a star.
        - id: ch06-b05
          speaker: narrator
          text: Her fingers trembled with joy as she put the dress on. When she looked into the mirror, the sight of her own beauty left her speechless. Downstairs, a magnificent carriage stood waiting before the door. Dotterine stepped inside, and it carried her away as swiftly as the wind.
        - id: ch06-b06
          speaker: narrator
          text: The king's palace stood far away, but only a few moments seemed to pass before the carriage reached its gates. Dotterine was about to step down when she remembered the basket. She had left it behind.
        - id: ch06-b07
          speaker: narrator
          text: Should she go back and fetch it, so no misfortune could touch her? Or should she enter the palace and hope that nothing would go wrong? Before she could choose, a little swallow flew toward her with the basket held in its beak. Dotterine's happiness returned at once.
        - id: ch06-b08
          speaker: narrator
          text: The feast was already at its height when she arrived. The great hall glittered with all the youth and beauty of the kingdom. Then the doors were thrown wide and Dotterine entered. The other maidens seemed pale and dim beside her, as if their brightness had faded the moment she appeared.
        - id: ch06-b09
          speaker: narrator
          text: The other girls knew their hopes were gone. Their mothers whispered among themselves that this must surely be the princess who had vanished.
        - id: ch06-b10
          speaker: narrator
          text: The young king did not recognize Dotterine. Still, he never left her side, and he could not take his eyes from her.
    - id: ch07
      title: Dotterine's True Story
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: At midnight, something strange happened. A thick cloud suddenly filled the hall until, for one moment, no one could see anything at all. Then the darkness inside the mist turned bright, and Dotterine's godmother appeared, standing where everyone could see her.
        - id: ch07-b02
          speaker: godmother
          text: This is the young woman you always believed was your sister, the one who disappeared during the siege. She is not your sister. She is the daughter of a neighboring king. A wizard threatened her, so she was placed in your mother's care to keep her safe.
        - id: ch07-b03
          speaker: narrator
          text: With that, the godmother vanished. No one ever saw her again, and the wonderful basket disappeared as well.
        - id: ch07-b04
          speaker: narrator
          text: But Dotterine's troubles were over, and she no longer needed magic to protect her. She and the young king lived happily together for the rest of their days.
