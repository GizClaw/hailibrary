audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 编者
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清晰的成年男声
        pace: 从容舒展
        pitch: 中低音
    queen:
      display_name: 王后
      tts:
        delivery: 聪慧坚定，乔装时爽朗而克制
        timbre: 清澈柔韧的成年女声
        pace: 适中
        pitch: 中高音
    godmother:
      display_name: 教母
      tts:
        delivery: 神秘慈爱，劝诫时温和而坚定
        timbre: 柔和明亮的成年女声
        pace: 从容
        pitch: 中音
    dotterine:
      display_name: 多特琳
      tts:
        delivery: 纯真柔顺，历经苦难仍有朝气
        timbre: 清亮柔美的年轻女声
        pace: 适中
        pitch: 中高音
    noblewoman:
      display_name: 贵妇
      tts:
        delivery: 从容亲切，带着贵族的端庄
        timbre: 圆润清晰的成年女声
        pace: 适中
        pitch: 中音
    mother_1:
      display_name: 宾客甲
      tts:
        delivery: 惊讶好奇，低声议论
        timbre: 清晰的成年女声
        pace: 适中
        pitch: 中音
    mother_2:
      display_name: 宾客乙
      tts:
        delivery: 惊讶好奇，低声议论
        timbre: 柔和的成年女声
        pace: 适中
        pitch: 中高音
    mother_3:
      display_name: 宾客丙
      tts:
        delivery: 惊讶好奇，低声议论
        timbre: 略显苍老的成年女声
        pace: 稍慢
        pitch: 中音
  chapters:
    - id: ch01
      title: 桦树皮篮子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，有位王后一直没有孩子，心里十分痛苦。丈夫在家时，她已经很伤心。丈夫一走，她更是谁也不见，只会整天坐着流泪。后来邻国发动战争，国王出征，宫里只剩下王后一个人。
        - id: ch01-b02
          speaker: narrator
          text: >-
            王后悲伤得连宫墙都像要把她闷死，只好独自走进花园，倒在椴树浓荫下的草坡上。她在那里躺了好一会儿，树叶里忽然传来沙沙声。王后抬头一看，一个老婆婆拄着双拐，正一瘸一拐地走向流过园子的小溪。老婆婆俯身喝足了水，随即转过身，径直来到王后面前。
        - id: ch01-b03
          speaker: godmother
          text: >-
            尊贵的夫人，请别怪我冒昧，也不用怕我。说不定，我能给您带来好运。
        - id: ch01-b04
          speaker: queen
          text: >-
            可你看起来也不像交过好运，更不像还有福气能分给别人。
        - id: ch01-b05
          speaker: godmother
          text: >-
            粗糙的树皮下面，也藏着光滑的木头和香甜的果仁。把手给我，让我看看您的将来。
        - id: ch01-b06
          speaker: narrator
          text: >-
            王后伸出手。老婆婆仔细看过掌纹，说她心里压着两桩愁事，一桩旧，一桩新。新愁是丈夫远在战场，不过他平安无事，很快会带着喜讯回来。旧愁比这久得多。她没有孩子，再好的日子也无法叫她快活。王后一听，脸顿时红了，想把手抽回来。
        - id: ch01-b07
          speaker: godmother
          text: >-
            再耐心等等，还有些事，我得看清楚。
        - id: ch01-b08
          speaker: queen
          text: >-
            你究竟是谁？怎么像是能看透我的心？
        - id: ch01-b09
          speaker: godmother
          text: >-
            名字不重要。您只需知道，我能指给您一条路，减轻这份痛苦。可您必须答应，一切都照我的话做。
        - id: ch01-b10
          speaker: queen
          text: >-
            我一定照办！只要你肯帮我，不论要什么，我都拿来报答你。
        - id: ch01-b11
          speaker: narrator
          text: >-
            老婆婆想了片刻，从衣襟里取出一件层层包好的东西。包布解开，里面是一只桦树皮编的小篮子。
        - id: ch01-b12
          speaker: godmother
          text: >-
            篮里有一枚鸟蛋。把它放在温暖的地方，好好守护三个月，它就会变成一个娃娃。再让娃娃睡在垫着软羊毛的篮中，不要惊动它，也不必喂食。过些时候，它会慢慢长成婴儿。那时您也会生下一个孩子。把两个孩子放在一起，再请国王来看他的儿女。男孩由您亲自抚养，女孩要交给乳母。等他们受洗，请我来做小公主的教母。摇篮里会藏着一只鹅翅膀，把它扔出窗外，我马上就到。还有一件事必须记住。今天发生的一切，绝不能告诉别人。
        - id: ch01-b13
          speaker: narrator
          text: >-
            王后还没来得及回答，老婆婆已经拄着拐杖离开。她才走两步，竟变成一个年轻姑娘，快得像飞一样。王后看着这场变化，几乎不敢相信自己的眼睛。若不是篮子还在手中，她一定会以为自己做了场梦。刚走进花园时，她还是个悲伤得毫无希望的人，如今却像完全变了一个人。她匆匆回房，小心地伸手进篮子，在里面摸到一枚小蛋。蛋壳是柔和的淡蓝色，上面点着绿色斑点。她把它取出来，藏在胸前，因为再也想不出更温暖的地方了。

    - id: ch02
      title: 从蛋里来的公主
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            老婆婆来过两星期后，国王果然战胜敌军回来了。她说的第一件事已经应验，王后的心欢喜得怦怦直跳，对后面的预言也重新燃起希望。她把蛋和篮子当作自己最珍贵的宝物，还特意叫人造了一只金匣来装篮子，好让那枚小蛋到了该放进去的时候，不会受到半点损伤。
        - id: ch02-b02
          speaker: narrator
          text: >-
            三个月一到，王后便照嘱咐把蛋从胸前取出，安稳地放进温暖的羊毛里。第二天早晨，她过去一看，蛋壳已经裂开，碎壳中躺着一个小娃娃。王后终于觉得幸福了。她没有惊动娃娃，让它静静长大，自己则等待亲生的孩子降世。后来，她果真生下一个男孩。篮里的女孩也长成了婴儿。王后把两个孩子并排放进一架镶满宝石、闪闪发亮的金摇篮，又派人请来国王。国王一看见他们，欢喜得几乎发狂。
        - id: ch02-b03
          speaker: narrator
          text: >-
            两个婴儿受洗那天，整个宫廷都奉命前来观礼。等一切准备妥当，王后悄悄把窗户推开一条缝，让鹅翅膀飞走。宾客正不断赶来，一辆由六匹乳白色骏马拉着的华美马车忽然驶到门前。车上下来一位蒙着面纱的年轻夫人，衣裳像太阳一样闪耀。没人看得清她的脸。
        - id: ch02-b04
          speaker: narrator
          text: >-
            她来到抱着婴儿的王后面前，掀开面纱，美得让所有人眼花。她抱起小女孩，高高举到众人面前，宣布孩子从此叫多特琳。谁也不懂这个名字，只有王后知道，那是因为女孩原本来自一枚蛋的蛋黄。男孩则取名威廉。
        - id: ch02-b05
          speaker: godmother
          text: >-
            孩子睡下时，一定要把篮子放在她身边，蛋壳也得留在里面。只要这样，灾祸就伤不了她。你要像爱护自己的眼睛一样守好它，将来也教女儿这么做。
        - id: ch02-b06
          speaker: narrator
          text: >-
            教母亲了婴儿三次，坐上马车离去。两个孩子一天天茁壮长大。乳母把多特琳当亲生女儿一样疼爱。小姑娘一天比一天漂亮，人们都说，她很快就会像教母那样美丽。可只有乳母知道，多特琳夜里睡着后，总有一位陌生而美丽的夫人俯身看她。乳母终于把这件事告诉王后，两人却决定共同保守秘密。
        - id: ch02-b07
          speaker: narrator
          text: >-
            双胞胎快两岁时，王后忽然病倒。全国最好的医生都被请来了，却谁也救不了她，因为死亡没有药可医。王后知道自己的日子不多，便召来多特琳和已经成为侍女的乳母。她把带来好运的篮子交给这个最忠心的仆人，恳求乳母一定珍重保管。
        - id: ch02-b08
          speaker: queen
          text: >-
            等我女儿十岁，把篮子交给她。一定郑重告诉她，她一生的幸福，全看她能不能守好它。儿子是王位继承人，有父亲照管，我并不担心。
        - id: ch02-b09
          speaker: narrator
          text: >-
            乳母答应照办，更答应绝不泄露秘密。就在那个早晨，王后去世了。几年后，国王为了自己的野心再次娶妻。他并不像爱第一位妻子那样爱新王后，新王后却恨透了两个继子女。国王看出她的心思，只好让从前的乳母照料孩子，尽量不让他们出现在王后面前。可他们偶尔走到继母眼前，她就像赶狗一样把他们踢走。

    - id: ch03
      title: 教母的守护
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            多特琳十岁生日那天，乳母把摇篮交给她，也一字不漏地转述了母亲的遗言。可她年纪还小，不懂这礼物有多珍贵，起初根本没放在心上。两年后的一天，国王不在，继母发现她坐在椴树下，又像往常那样大发脾气，把多特琳狠狠毒打了一顿。
        - id: ch03-b02
          speaker: narrator
          text: >-
            多特琳被打得踉踉跄跄，只好回到自己的房间，乳母恰好不在。她独自站在那里哭，忽然看见装着宝篮的金匣，便以为里面也许有什么东西能让自己解闷。她急忙打开一看，可篮子里只有一把羊毛和两片空蛋壳。多特琳失望极了，伸手掀起羊毛，这才看见藏在下面的鹅翅膀。
        - id: ch03-b03
          speaker: dotterine
          text: >-
            这是什么破烂旧东西。
        - id: ch03-b04
          speaker: narrator
          text: >-
            她随手把翅膀扔出窗外。一转眼，那位美丽的夫人便站在她身旁，还轻轻摸了摸她的头。
        - id: ch03-b05
          speaker: godmother
          text: >-
            别害怕，我是你的教母，特意来看你。你的红眼睛已经告诉我，你受了委屈。我知道继母待你很坏。可你要勇敢，也要耐心，好日子一定会来。等你长大，她就再也不能欺负你。
        - id: ch03-b06
          speaker: godmother
          text: >-
            永远别让篮子离开身边，也不能弄丢蛋壳。给篮子做个丝绸套子，日夜藏在衣服里，谁都伤不了你。要是遇到难事，不知道该怎么办，就把鹅翅膀扔出窗外，我马上会来。现在到花园去吧，我们在椴树下说话，没人能听见。
        - id: ch03-b07
          speaker: narrator
          text: >-
            她们在椴树下说了很久。等教母把所有好建议都告诉多特琳，太阳已经快落山，她也该走了。可教母不肯让孩子饿着肚子上床，便要过篮子，俯身对它念了几句咒语。地上立刻出现一张餐桌，上面摆满水果和糕点。她们吃完后，教母送多特琳回去，一路又教会她该念什么话，才能让篮子拿出自己想要的东西。
        - id: ch03-b08
          speaker: narrator
          text: >-
            又过了几年，多特琳长成了年轻姑娘。见过她的人都说，世上再也找不到比她更美的人。偏偏就在这时，一场可怕的战争爆发。国王和他的军队一退再退，最后只能撤进城中，准备抵御围攻。围城拖得太久，粮食渐渐吃光，连宫中也没有足够的食物。
        - id: ch03-b09
          speaker: narrator
          text: >-
            一天早晨，多特琳前一晚没吃饭，早上也没有东西可吃，已经饿得十分难受。她只好取出鹅翅膀，让它飞走。教母刚一出现，多特琳便因为虚弱和悲伤放声哭了起来，过了好一会儿，还是说不出一句话。
        - id: ch03-b10
          speaker: godmother
          text: >-
            别哭了，可怜的孩子。我会带你离开。其他人只能让他们各安天命。
        - id: ch03-b11
          speaker: narrator
          text: >-
            教母领着多特琳穿过城门，又从城外的敌军中间走过。没人阻拦，仿佛根本看不见她们。第二天，城池投降了。国王和所有朝臣都成了俘虏，威廉却在混乱中设法逃走。继母王后已经丧命，一支被人随手投出的长矛刺死了她。
        - id: ch03-b12
          speaker: narrator
          text: >-
            等她们彻底摆脱敌军，多特琳脱下自己的衣裙，换上农家姑娘的衣裳。为了让别人更难认出她，教母还彻底改变了她的脸。
        - id: ch03-b13
          speaker: godmother
          text: >-
            等好日子来了，你想变回原样，只要对篮子念出我教你的话，再说想要从前那张脸，立刻就能如愿。眼下还得忍耐一阵。千万照看好篮子。
        - id: ch03-b14
          speaker: narrator
          text: >-
            教母再次叮嘱她看好篮子，这才告别。多特琳流浪了许多天，从一个地方走到另一个地方，始终找不到安身之处。篮子给的食物虽能让她不至于饿死，可在好日子来临以前，能到一户农家帮佣，她已经很庆幸。起初，样样活计都很难。也许她学得特别快，也许篮子偷偷帮了忙。才过三天，她刷锅扫地就像干了一辈子那样熟练。

    - id: ch04
      title: 宴会的邀请
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            一天早晨，多特琳正在门前擦洗木盆，一位贵妇恰好经过村庄。姑娘明亮的脸庞吸引了她，她停下来，把多特琳叫到跟前。
        - id: ch04-b02
          speaker: noblewoman
          text: >-
            你愿意到我家来做事吗？
        - id: ch04-b03
          speaker: dotterine
          text: >-
            我很愿意，只要现在的女主人肯让我走。
        - id: ch04-b04
          speaker: noblewoman
          text: >-
            这件事交给我来办。
        - id: ch04-b05
          speaker: narrator
          text: >-
            贵妇果真办妥了。当天，多特琳便坐在马车夫身旁，跟她回家。六个月后，喜讯传来。威廉已经召集起一支军队，打败了夺走父亲王位的篡位者。可就在同一时候，多特琳又得知，老国王已经死在囚禁之中。她为父亲伤心痛哭，却只能偷偷地哭，因为她从没向女主人讲过自己的过去。
        - id: ch04-b06
          speaker: narrator
          text: >-
            服丧一年后，年轻的国王宣布自己要成婚。他命全国的未婚姑娘前来赴宴，好从中选择妻子。一连几个星期，全国的母亲和女儿都忙着缝制漂亮衣裙，尝试各种新发式。贵妇的三个美丽女儿也和别人一样兴奋。多特琳手很巧，整天替她们准备赴宴的华服。
        - id: ch04-b07
          speaker: narrator
          text: >-
            可每到夜里，她总会梦见教母俯在身边，对她说，替小姐们打扮好，等她们出发，自己也跟着去，到时谁也不会比她更光彩。
        - id: ch04-b08
          speaker: narrator
          text: >-
            盛宴那天终于来了，多特琳激动得几乎按捺不住。她替三位小姐梳妆完毕，目送她们跟着母亲离去，便一下扑在床上，放声哭起来。就在这时，她仿佛听见一个声音在耳边轻轻提醒她，去看看自己的篮子，那里已经备好她需要的一切。
        - id: ch04-b09
          speaker: narrator
          text: >-
            这话不用说第二遍。多特琳立刻跳起来，抓过篮子念出咒语。一件像星光般闪耀的衣裙出现在床上。她欢喜得双手发颤，换好衣裙，对镜一看，竟被自己的美貌惊得说不出话。她走下楼，门前已有一辆华丽马车等着。她坐进去，马车便载着她像风一样飞驰而去。
        - id: ch04-b10
          speaker: narrator
          text: >-
            国王的宫殿明明远在他方，多特琳却觉得才过几分钟，马车就停在高大的宫门前。她正要下车，忽然想起篮子还留在家中。到底该怎么办？要是回去取，就会错过宴会。要是不取，万一灾祸降临呢？她还没拿定主意，一只小燕子已经飞到车前，嘴里正衔着那只篮子。多特琳看见宝物安然无恙，终于又放下心来。

    - id: ch05
      title: 午夜的真相
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            宴会已经到了最热闹的时候，大厅里满是年轻美丽的人，处处辉煌耀眼。大门忽然敞开，多特琳走了进来。别的姑娘站在她身旁，全都显得苍白暗淡。姑娘们望着她，心中被选为王后的希望一点点熄灭，她们的母亲却聚在一起，悄声议论起来。
        - id: ch05-b02
          speakers: [mother_1, mother_2, mother_3]
          ensemble: chorus
          text: >-
            这一定是我们失踪的公主！
        - id: ch05-b03
          speaker: narrator
          text: >-
            年轻的国王却没有认出多特琳。他整晚守在她身边，目光始终不肯移开。午夜时分，一件怪事发生了。浓云突然涌进大厅，四周一下黑了。片刻后，云雾又亮起来，多特琳的教母就站在光中。
        - id: ch05-b04
          speaker: godmother
          text: >-
            陛下，这位姑娘就是那个一直被你当作妹妹、又在围城时失踪的女孩。她其实不是你的妹妹，而是邻国国王的女儿。一个巫师想把她夺走，她的父亲为了救她，才把她交给你的母亲抚养。
        - id: ch05-b05
          speaker: narrator
          text: >-
            说完，教母便从云雾中消失了。从此以后，谁也没有再见过她，那只能够创造奇迹的篮子也跟着不见了。不过，多特琳的苦难已经结束，她不再需要教母和篮子的守护。她和年轻的国王从此幸福相伴，一直生活到生命的最后一天。
        - id: ch05-b06
          speaker: narrator
          text: >-
            这是一个爱沙尼亚童话。
