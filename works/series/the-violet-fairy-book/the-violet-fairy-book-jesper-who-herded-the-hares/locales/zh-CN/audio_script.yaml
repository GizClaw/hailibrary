audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 编者
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清晰的成年男声
        pace: 从容舒展
        pitch: 中低音
    king:
      display_name: 国王
      tts:
        delivery: 骄傲威严，遇到窘境时容易慌乱
        timbre: 浑厚有力的老年男声
        pace: 稍慢
        pitch: 低音
    peter:
      display_name: 彼得
      tts:
        delivery: 粗鲁自负，说话不耐烦
        timbre: 粗犷结实的青年男声
        pace: 稍快
        pitch: 中低音
    paul:
      display_name: 保罗
      tts:
        delivery: 傲慢冷淡，语气尖刻
        timbre: 干脆坚硬的青年男声
        pace: 稍快
        pitch: 中音
    jesper:
      display_name: 耶斯珀
      tts:
        delivery: 善良机敏，带着沉着的幽默
        timbre: 清朗自然的青年男声
        pace: 适中
        pitch: 中音
    ant_king:
      display_name: 蚂蚁王
      tts:
        delivery: 恳切爽快，充满自信
        timbre: 轻巧清亮的成年男声
        pace: 稍快
        pitch: 中高音
    old_woman:
      display_name: 老妇人
      tts:
        delivery: 温和从容，话里藏着神秘力量
        timbre: 柔厚清晰的老年女声
        pace: 从容
        pitch: 中低音
    queen:
      display_name: 王后
      tts:
        delivery: 精明镇定，受窘时语气凌厉
        timbre: 成熟饱满的女声
        pace: 适中
        pitch: 中低音
    princess:
      display_name: 公主
      tts:
        delivery: 端庄温柔，坦率真诚
        timbre: 明亮柔和的年轻女声
        pace: 适中
        pitch: 中高音
    courtier_1:
      display_name: 大臣甲
      tts:
        delivery: 恭敬得体，声音清楚
        timbre: 端正明朗的成年男声
        pace: 适中
        pitch: 中音
    courtier_2:
      display_name: 大臣乙
      tts:
        delivery: 恭敬得体，语气郑重
        timbre: 平稳圆润的成年男声
        pace: 适中
        pitch: 中低音
  chapters:
    - id: ch01
      title: 国王的告示
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，有个王国坐落在日出与日落之间，究竟在什么地方，谁也说不清。它跟古时候常见的王国一样小。国王只要登上宫殿屋顶，朝四面望一圈，就能看见国境尽头。可整个国家都归他所有，他为此骄傲极了，还常常琢磨，要是没了自己，这个王国该怎么过日子。
        - id: ch01-b02
          speaker: narrator
          text: >-
            国王只有一个女儿。公主将来得有个丈夫接替王位，可这个男人既要富有，又要聪明，还必须配得上公主。上哪儿找这样的人呢？国王为这件事犯愁，夜里也常睡不安稳。
        - id: ch01-b03
          speaker: narrator
          text: >-
            后来，国王想出一条妙计。他向全国颁下告示，又请最近的邻国也替他传开。谁能献上十二颗他生平见过的最上等的珍珠，再完成他指定的任务，谁就能迎娶公主，等时候到了，再继承王位。他认定，拿得出这样一打珍珠的人必定十分富有，闯得过那些难关的人也必定有不同寻常的本领。这样选出来的女婿，当然正合他的心意。
        - id: ch01-b04
          speaker: narrator
          text: >-
            求婚者很快挤进王宫。富商和外国王子来了一拨又一拨，多的时候，简直叫国王心烦。他们都带着华美的珍珠，可最简单的任务也没人能完成。还有些骗子拿假珍珠来碰运气，也被老国王识破，赶出了宫门。几个星期以后，来求婚的人越来越少，合适的女婿依旧一个也没有。
        - id: ch01-b05
          speaker: narrator
          text: >-
            王国靠海的一角，住着一个穷渔夫。他有三个儿子，老大彼得，老二保罗，最小的叫耶斯珀。两个哥哥已经长大，耶斯珀也刚刚成年。哥哥们比他高大强壮，可要论聪明，三个人里谁也比不上耶斯珀。当然，彼得和保罗绝不会承认。至于事实究竟怎样，故事很快就能证明。
        - id: ch01-b06
          speaker: narrator
          text: >-
            一天，父亲出海回来，当天的渔获里带着三打牡蛎。三兄弟把牡蛎逐个打开，发现每一只壳里都有一颗又大又美的珍珠。这个发现刚摆在眼前，三个人便同时想到，可以拿珍珠去做公主的求婚者。他们认真商量了一番，决定用抽签的办法分珍珠，再按长幼顺序轮流去试。要是老大成功，两个弟弟自然也不用再跑一趟。

    - id: ch02
      title: 变成炉灰的珍珠
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            第二天一早，彼得提着装珍珠的小篮子，往王宫去了。走出不远，他看见蚂蚁王和甲虫王各自带着军队，正面对面摆好阵势，眼看就要开战。
        - id: ch02-b02
          speaker: ant_king
          text: >-
            请你来帮帮我们吧。甲虫块头太大，我们实在敌不过。你今天帮了我，也许将来我能报答你。
        - id: ch02-b03
          speaker: peter
          text: >-
            别人的闲事，我可没时间管。你们爱怎么打就怎么打吧。
        - id: ch02-b04
          speaker: narrator
          text: >-
            彼得说完就走了。再往前没多远，他碰见一个老妇人。
        - id: ch02-b05
          speaker: old_woman
          text: >-
            早上好，年轻人。你出门真早。篮子里带的是什么呀？
        - id: ch02-b06
          speaker: peter
          text: >-
            篮子里装的是炉灰。
        - id: ch02-b07
          speaker: narrator
          text: >-
            他头也不回地往前走，心里还得意地想，这就是她多管闲事的下场。
        - id: ch02-b08
          speaker: old_woman
          text: >-
            好吧。你既然说是炉灰，那就让它变成炉灰。
        - id: ch02-b09
          speaker: narrator
          text: >-
            彼得装作没听见。不久，他来到王宫，当即被领到国王面前。他一揭开篮盖，国王和大臣们全都盯住了珍珠。
        - id: ch02-b10
          speakers: [king, courtier_1, courtier_2]
          ensemble: chorus
          text: >-
            这是我们见过的最上等的珍珠！
        - id: ch02-b11
          speaker: narrator
          text: >-
            可怪事马上发生了。珍珠洁白的光泽慢慢褪去，颜色越来越暗，又越变越黑，到最后，满篮珍珠全成了炉灰。彼得惊得一个字也说不出，连替自己辩解都忘了。国王却替两个人把话都说够了。彼得巴不得马上离开，双腿能跑多快就跑多快，一口气逃回家。他不敢把王宫里的经过告诉父亲和弟弟，只肯承认，自己的求婚失败了。
        - id: ch02-b12
          speaker: narrator
          text: >-
            次日轮到保罗。他也遇见了蚂蚁王和甲虫王。两支军队在战场上过了一夜，又要接着打了。
        - id: ch02-b13
          speaker: ant_king
          text: >-
            昨天我们败得很惨。请你帮帮我们吧，也许有一天，我也能帮你。
        - id: ch02-b14
          speaker: paul
          text: >-
            你们今天再败一次，我也不在乎。我有要紧事，才不想掺和这场争斗。
        - id: ch02-b15
          speaker: narrator
          text: >-
            保罗继续赶路，那位老妇人也来问他的篮子里装了什么。
        - id: ch02-b16
          speaker: paul
          text: >-
            我带的是炉灰。
        - id: ch02-b17
          speaker: narrator
          text: >-
            他跟哥哥一样无礼，也一样想教训别人别乱打听。
        - id: ch02-b18
          speaker: old_woman
          text: >-
            好吧。你既然说是炉灰，那就让它变成炉灰。
        - id: ch02-b19
          speaker: narrator
          text: >-
            老妇人在后面高声喊，保罗既不回答，也连头都没回。当时，他根本没把这句话放在心上。可是到了王宫，他的珍珠也在国王和满朝大臣眼前一点点化成炉灰，他这才明白老妇人的话有多要紧。保罗没敢耽搁，立刻赶回家去。谁问他求婚的结果如何，他都沉着脸发脾气，不肯好好回答。

    - id: ch03
      title: 耶斯珀上路
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            第三天，终于轮到耶斯珀。他起床吃早饭，两个哥哥还躺在床上说风凉话。他们说，自己都失败了，弟弟更不可能成功，准会刚出门就跑回来。耶斯珀没有争辩，只把珍珠放进小篮子，安静地上路了。
        - id: ch03-b02
          speaker: narrator
          text: >-
            蚂蚁王和甲虫王还在列阵。蚂蚁已经少了许多，这一天恐怕再也撑不下去。
        - id: ch03-b03
          speaker: ant_king
          text: >-
            求你帮帮我们，不然我们就要全军覆没了。你若救了我们，也许将来我能报答你。
        - id: ch03-b04
          speaker: narrator
          text: >-
            耶斯珀听惯了别人夸蚂蚁聪明勤劳，却从没听谁说过甲虫的好话，便答应相助。他第一次冲过去，甲虫的队伍就彻底乱了，士兵们惊慌地四散逃命。离洞口最近的运气最好，赶在耶斯珀的靴子踩下来以前钻了进去。几分钟后，整片战场都归获胜的蚂蚁所有。蚂蚁王为耶斯珀发表了一番颇为动听的谢辞，不但郑重感谢他的援手，还许诺以后不论他遇到什么难处，都一定前来相助。
        - id: ch03-b05
          speaker: ant_king
          text: >-
            不管你走到什么地方，只要需要我，就开口呼唤。世上没有哪儿离我太远。只要帮得上忙，我一定赶来。
        - id: ch03-b06
          speaker: narrator
          text: >-
            耶斯珀差点笑出来，可他忍住了，认真答应会记得这份好意。走到路口的拐弯处，他忽然碰上了老妇人。
        - id: ch03-b07
          speaker: old_woman
          text: >-
            早上好。你的篮子里装了什么？
        - id: ch03-b08
          speaker: jesper
          text: >-
            是珍珠。我要带去王宫，用它们迎娶公主。你看，就在这里。
        - id: ch03-b09
          speaker: narrator
          text: >-
            他揭开篮盖，让老妇人亲眼看见。
        - id: ch03-b10
          speaker: old_woman
          text: >-
            真漂亮，确实是好珍珠。不过，光有它们还娶不到公主。国王出的任务，你也得完成才行。我看你还带了午餐。能送给我吗？到了王宫，你一定有丰盛的晚饭吃。
        - id: ch03-b11
          speaker: jesper
          text: >-
            当然可以。我倒真没想到这一点。
        - id: ch03-b12
          speaker: narrator
          text: >-
            耶斯珀把整份午餐都交给老妇人，继续往前走。刚走几步，她又把他叫了回去。
        - id: ch03-b13
          speaker: old_woman
          text: >-
            这只哨子送给你，就当交换那顿午餐。它看起来不起眼，可只要吹一声，不论你丢了什么，或是谁从你手里拿走了什么，那件东西马上就会回来。
        - id: ch03-b14
          speaker: narrator
          text: >-
            耶斯珀道了谢，收好哨子，虽然眼下还想不出它能派上什么用场。他继续赶路，终于来到王宫。珍珠一献出来，每个看见的人都又惊又喜，周围立刻响起一阵阵赞叹。这一回，珍珠始终明亮美丽。可国王得知它们的主人只是个渔家小伙，心里就很不痛快。这样的穷小子，跟他设想的女婿可差得太远了。他把王后叫到一旁，毫不客气地说出了自己的不满。
        - id: ch03-b15
          speaker: queen
          text: >-
            这有什么可担心的？你只要出几道他绝对办不到的难题，我们很快就能把他打发走。
        - id: ch03-b16
          speaker: king
          text: >-
            对呀，我怎么忘了。最近事情这么多，我的记性真是越来越差。
        - id: ch03-b17
          speaker: narrator
          text: >-
            那天，耶斯珀陪国王、王后和贵族们吃了饭。夜里，他住进一间从未见过的华丽卧房。四周太陌生，他又不停猜想国王会出什么题，自己能不能办到，因此整夜没合眼。床铺再柔软，他也盼着天赶快亮。

    - id: ch04
      title: 四堆谷物
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            早饭以后，国王带耶斯珀来到谷仓。地板中央堆着一大堆混在一起的谷物，小麦、大麦、燕麦和黑麦各有一袋。
        - id: ch04-b02
          speaker: king
          text: >-
            日落前一个钟头，你得把这些谷物分成四堆。只要有一粒放错地方，你就不能再娶公主。我会把门锁上，不准任何人进来帮忙。到了时候，我再来检查。
        - id: ch04-b03
          speaker: narrator
          text: >-
            国王走后，耶斯珀望着那堆谷物，简直绝望了。他坐下来试着挑了一会儿，马上就知道，仅凭自己一双手，绝不可能按时做完。门已经锁住，也没人能进来。可他忽然想起，蚂蚁王曾答应来帮忙，于是开口呼唤。没过多久，蚂蚁王果然出现。耶斯珀赶紧说明自己的难处。
        - id: ch04-b04
          speaker: ant_king
          text: >-
            原来只有这点事。放心吧，我们很快就能做好。
        - id: ch04-b05
          speaker: narrator
          text: >-
            蚂蚁王发出王家的号令。只过了一两分钟，成群的蚂蚁便像一道不断流动的细小水流，涌进谷仓。它们听从国王指挥，一粒一粒搬运，把四种谷物送进各自该去的那一堆。耶斯珀看着这些小家伙不停地忙来忙去，再加上昨夜没睡，很快便沉沉睡去。他醒来时，国王恰好推门进来。四堆谷物已经分得清清楚楚，一粒也没有放错，而耶斯珀居然还有时间睡上一觉。国王看得目瞪口呆。
        - id: ch04-b06
          speaker: king
          text: >-
            真是了不起，我从没想过你能办成。不过，最难的还在后面。明天你就会见识到了。

    - id: ch05
      title: 一百只野兔
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            第二天，耶斯珀看见任务，便知道国王没有说错。猎场看守捉来一百只活野兔，要把它们放进一片大草场。耶斯珀得看管整整一天，傍晚再一只不少地带回去。只要丢了一只，他就不能娶公主。
        - id: ch05-b02
          speaker: narrator
          text: >-
            他还没来得及彻底想明白，这根本是一件办不到的差事，看守们已经打开运兔子的口袋。一百只野兔一起甩动短尾巴，扇起长耳朵。转眼之间，它们便朝各不相同的方向飞奔而去，草场上只剩下耶斯珀一个人。
        - id: ch05-b03
          speaker: king
          text: >-
            好了，这回让我看看，你的聪明究竟能有多大用处。
        - id: ch05-b04
          speaker: narrator
          text: >-
            国王走远了。耶斯珀茫然地看着空荡荡的四周，两只手也不知道该做什么，便照平日的习惯插进口袋。这一摸，正好摸到老妇人送的哨子。他想起她说过，凡是丢失或被人拿走的东西，哨声一响就会回来。可那一百只野兔早已四散奔逃，每一只都去了不同的方向，说不定都跑到几英里外了。这只小哨子真能把它们全叫回来吗？耶斯珀半信半疑，还是拿起哨子吹了一声。
        - id: ch05-b05
          speaker: narrator
          text: >-
            几分钟后，野兔从草场四面的篱笆间蹦了进来，很快围着耶斯珀坐成一圈。从此，他便让兔子在草场里随意跑跳，只要不跑出去就好。
        - id: ch05-b06
          speaker: narrator
          text: >-
            国王早已留下一个看守暗中观察。他认定耶斯珀见四下无人，一定会拼命逃走，再也不敢回王宫。可看守带回的消息却说，野兔神秘地全回来了，耶斯珀很可能完成任务。国王听了又惊又恼。
        - id: ch05-b07
          speaker: king
          text: >-
            不管用什么办法，都得从他手里弄走一只。我去问问王后，她最擅长想主意。
        - id: ch05-b08
          speaker: narrator
          text: >-
            不久，一个穿破衣裳的姑娘走进草场。她来到耶斯珀面前，请他送一只野兔。
        - id: ch05-b09
          speaker: princess
          text: >-
            我家忽然来了客人，要留下吃晚饭，可我们没有东西招待。求你给我一只吧。
        - id: ch05-b10
          speaker: jesper
          text: >-
            不能给你。这些野兔不是我的，而且到了晚上，我必须把一百只全带回去。这件事关系重大。
        - id: ch05-b11
          speaker: narrator
          text: >-
            姑娘虽然衣衫破旧，却长得非常漂亮。她苦苦央求，怎么也不肯罢休，耶斯珀最后只好提出一个条件。
        - id: ch05-b12
          speaker: jesper
          text: >-
            那好。你亲我一下，我就给你一只。
        - id: ch05-b13
          speaker: narrator
          text: >-
            耶斯珀看得出来，姑娘一点也不喜欢这个条件，可她还是答应了这桩交换。她亲过耶斯珀，把一只野兔兜进围裙里，带着它离开。姑娘才刚跨出草场，身后便响起哨声。那只野兔立刻像鳗鱼一样扭动身子，从围裙形成的牢笼里钻了出去，使出最快的速度，一路奔回耶斯珀身边。
        - id: ch05-b14
          speaker: narrator
          text: >-
            随后，一个穿乡下衣裳的胖老妇人也来讨野兔，说家里有客人等着吃饭。耶斯珀不肯，她却一再纠缠，根本不听拒绝。
        - id: ch05-b15
          speaker: jesper
          text: >-
            好吧，我不要你一分钱。你踮起脚尖，绕着我走一圈，再抬头望着天，像母鸡那样咯咯叫，我就送你一只。
        - id: ch05-b16
          speaker: queen
          text: >-
            呸，这是什么荒唐条件！邻居要是看见了，准会以为我疯了。
        - id: ch05-b17
          speaker: jesper
          text: >-
            随你的便。你究竟有多想要这只野兔，只有自己知道。
        - id: ch05-b18
          speaker: narrator
          text: >-
            老妇人别无选择，只好踮脚绕圈，仰头学母鸡叫。那副样子实在滑稽，叫声也不怎么像，不过耶斯珀并不苛刻，仍给了她一只。她才离开草场，哨子便又响了。长腿长耳朵的野兔立刻飞奔回来。

    - id: ch06
      title: 国王倒立
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            第三个来讨野兔的，是个穿马夫衣裳的胖老头。他身上那套王室制服十分显眼，而他本人也显然觉得自己了不起。
        - id: ch06-b02
          speaker: king
          text: >-
            年轻人，我要一只野兔。价钱随你开，反正我非拿到一只不可。
        - id: ch06-b03
          speaker: jesper
          text: >-
            没问题，代价也不高。你只要头朝下倒立，把两个脚后跟磕在一起，再喊一声“万岁”，野兔就是你的。
        - id: ch06-b04
          speaker: king
          text: >-
            什么？让我倒立？这算什么主意！
        - id: ch06-b05
          speaker: jesper
          text: >-
            不愿意也没关系。只是这样一来，野兔就不能给你了。
        - id: ch06-b06
          speaker: narrator
          text: >-
            谁都看得出，老头心里有多不情愿。这件事简直处处跟他过不去。可他折腾了好一阵，终于把脑袋顶在草地上，两只脚跟高高翘到空中。他有气无力地磕了磕脚跟，又软绵绵地喊了一声“万岁”。耶斯珀并不苛刻，算他完成了条件，把野兔交了出去。当然，和前两只一样，这只兔子也没走出多远，很快又被哨声叫回草场。
        - id: ch06-b07
          speaker: narrator
          text: >-
            傍晚，耶斯珀回到王宫，一百只野兔整整齐齐地跟在身后，果真一只也没有少。整个宫里的人都惊叹不已，国王和王后却很不高兴。只有公主对耶斯珀露出了微笑。
        - id: ch06-b08
          speaker: king
          text: >-
            好吧，这件事你确实做得很好。明天还有一项小任务。要是你也能完成，我们就把婚事定下来，让你迎娶公主。

    - id: ch07
      title: 装满木桶的实话
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: >-
            次日，王宫宣布最后一项考验要在大厅举行，所有人都可以前来观看。国王和王后坐上宝座，公主陪在他们身旁，贵族男女围满大厅四周，人人都等着看结果。国王一抬手，两名仆人便抬进一只大大的空木桶，把它放在宝座前留出的空地上。接着，耶斯珀被叫到众人眼前，站在木桶旁边。
        - id: ch07-b02
          speaker: king
          text: >-
            你要不断说出千真万确的话，直到把木桶装满。装不满，你就不能娶公主。
        - id: ch07-b03
          speaker: jesper
          text: >-
            可是，木桶什么时候算满，该由谁来判断？
        - id: ch07-b04
          speaker: king
          text: >-
            这不用你操心。该怎么判断，是我的事。
        - id: ch07-b05
          speaker: narrator
          text: >-
            大家都觉得这规矩不公平，可谁也不愿第一个开口反对。耶斯珀只得镇定下来，讲起昨天的事。
        - id: ch07-b06
          speaker: jesper
          text: >-
            昨天我看管野兔的时候，有个穿破衣裳的姑娘来找我，求我送她一只。她拿到了野兔，却得先亲我一下。那个姑娘就是公主。这件事是真的吧？
        - id: ch07-b07
          speaker: narrator
          text: >-
            他望着公主。公主红了脸，很不自在，却只能承认这是真话。
        - id: ch07-b08
          speaker: king
          text: >-
            这几句话可没占木桶多少地方。接着说。
        - id: ch07-b09
          speaker: jesper
          text: >-
            后来，一个穿乡下衣裳的胖老妇人也来讨野兔。她得先踮起脚尖绕着我走一圈，还得翻起眼睛望天，学母鸡咯咯叫，才能把野兔拿走。那个老妇人就是王后。这也是真的吧？
        - id: ch07-b10
          speaker: narrator
          text: >-
            王后的脸涨得通红，身上也热了起来，可她同样无法否认。
        - id: ch07-b11
          speaker: king
          text: >-
            唔，这倒装进去了一点，不过桶还没满。
        - id: ch07-b12
          speaker: narrator
          text: >-
            国王说完，转向王后，压低了声音。
        - id: ch07-b13
          speaker: king
          text: >-
            我真没想到，你会做出这么蠢的事。
        - id: ch07-b14
          speaker: queen
          text: >-
            那你呢？你又干了什么？
        - id: ch07-b15
          speaker: king
          text: >-
            你以为我会为了那个小子做什么吗？
        - id: ch07-b16
          speaker: narrator
          text: >-
            国王赶紧催耶斯珀继续。
        - id: ch07-b17
          speaker: jesper
          text: >-
            再后来，一个胖老头为了同一只野兔来了。他神气十足，摆出一副威严模样，可为了拿到兔子，竟然头朝下倒立，把脚后跟磕在一起，还喊了一声“万岁”。那个老头就是……
        - id: ch07-b18
          speaker: king
          text: >-
            住口，快住口！你一个字也不用再说了，木桶已经满了！
        - id: ch07-b19
          speaker: narrator
          text: >-
            满朝众人一齐鼓掌喝彩。国王亲口说木桶已经装满，王后也无法反对，两人只好接受耶斯珀做自己的女婿。公主却高兴得很。到了这时候，她已经深深爱上这个既英俊又聪明的年轻人。后来，老国王终于有空静下心来，把整件事从头到尾想了一遍。他确信，只要耶斯珀照管百姓能像放牧那一百只野兔一样出色，把王国交到他手中，一定会平安稳妥。
        - id: ch07-b20
          speaker: narrator
          text: >-
            这个故事来自斯堪的纳维亚。
