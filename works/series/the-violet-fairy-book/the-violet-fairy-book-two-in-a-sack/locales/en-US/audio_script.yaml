audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, steady, and quietly mysterious
        timbre: clear and resonant
        pace: measured
        pitch: medium
    man:
      display_name: The Man
      tts:
        delivery: humble, hopeful, and sometimes sly
        timbre: gentle and weathered
        pace: moderate
        pitch: medium-low
    wife:
      display_name: The Wife
      tts:
        delivery: sharp, forceful, and quick-tempered
        timbre: strong and rough-edged
        pace: brisk
        pitch: medium
    crane:
      display_name: The Crane
      tts:
        delivery: dignified, direct, and quietly generous
        timbre: clear and stately
        pace: measured
        pitch: medium-high
    cousin:
      display_name: The Cousin
      tts:
        delivery: outwardly welcoming but inwardly calculating
        timbre: smooth and mature
        pace: moderate
        pitch: medium
    ruffian_1:
      display_name: First Ruffian
      tts:
        delivery: rough, rhythmic, and relentless
        timbre: deep and gravelly
        pace: brisk
        pitch: low
    ruffian_2:
      display_name: Second Ruffian
      tts:
        delivery: harsh, taunting, and rhythmic
        timbre: coarse and booming
        pace: brisk
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Crane's Gift
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: What a miserable life that poor man had with his wife. Every day she scolded him and called him names. Sometimes she even pulled the broom from behind the stove and beat him with it. He had no peace at home, and he hardly knew how much longer he could bear it.
        - id: ch01-b02
          speaker: narrator
          text: One day, his wife was especially cruel and left him black and blue. The man wandered slowly out into the fields. He could not sit idle even then, so he spread his nets.
        - id: ch01-b03
          speaker: narrator
          text: And what sort of bird did he catch? It was a crane. The bird found itself tangled in the net and spoke to the man.
        - id: ch01-b04
          speaker: crane
          text: Set me free, and I'll find a way to thank you.
        - id: ch01-b05
          speaker: man
          text: No, my dear fellow. I'll take you home. Perhaps then my wife won't scold me quite so badly.
        - id: ch01-b06
          speaker: crane
          text: You would do better to come home with me.
        - id: ch01-b07
          speaker: narrator
          text: So the man followed the crane. At the crane's house, the bird reached up and took a sack from the wall.
        - id: ch01-b08
          speaker: crane
          text: Two out of the sack!
        - id: ch01-b09
          speaker: narrator
          text: At once, two handsome lads sprang out. They carried in oak tables, covered them with silk, and filled them with delicious food and cool drinks. The man had never seen anything so splendid. He could hardly contain his delight.
        - id: ch01-b10
          speaker: crane
          text: Take this sack home to your wife.
        - id: ch01-b11
          speaker: narrator
          text: The man thanked the crane with all his heart. Then he took the sack and began the long walk home.
    - id: ch02
      title: A Night at the Cousin's House
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Home was still far away. Darkness was coming on, and the man was tired, so he stopped for the night at his cousin's house.
        - id: ch02-b02
          speaker: narrator
          text: His cousin had three daughters. They set out a fine-looking supper, but the man refused to touch it.
        - id: ch02-b03
          speaker: man
          text: This supper of yours is no good.
        - id: ch02-b04
          speaker: cousin
          text: Oh, try to make the best of what we have.
        - id: ch02-b05
          speaker: man
          text: Take it all away!
        - id: ch02-b06
          speaker: narrator
          text: Then he pulled out the crane's sack and called the words he had been taught.
        - id: ch02-b07
          speaker: man
          text: Two out of the sack!
        - id: ch02-b08
          speaker: narrator
          text: Out jumped the two handsome lads. In moments, oak tables stood before them under silken covers, loaded with every kind of delicious dish and refreshing drink. The cousin and her daughters had never seen a supper like it. They stared in wonder and delight.
        - id: ch02-b09
          speaker: narrator
          text: But the cousin had already decided to steal the sack. She kept that thought to herself and called to her daughters.
        - id: ch02-b10
          speaker: cousin
          text: Quickly, go and heat the bathroom. Our dear guest will surely want a bath before bed.
        - id: ch02-b11
          speaker: narrator
          text: Once the man was safely in the bathroom, the cousin ordered her daughters to make another sack exactly like his. They worked as fast as they could. Then she exchanged the sacks and hid the crane's gift.
        - id: ch02-b12
          speaker: narrator
          text: The man enjoyed his bath and slept soundly. Early the next morning, he set off with the sack he believed the crane had given him.
    - id: ch03
      title: The Empty Sack
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The man felt so cheerful on the road that he sang and whistled all the way through the woods. He never noticed the birds twittering and laughing at him from the trees.
        - id: ch03-b02
          speaker: narrator
          text: As soon as his house came into view, he began shouting from far away.
        - id: ch03-b03
          speaker: man
          text: Hallo, old woman! Come out here and meet me!
        - id: ch03-b04
          speaker: wife
          text: You come here! I'll give you a proper thrashing with the poker!
          emotion: angry
        - id: ch03-b05
          speaker: narrator
          text: The man went inside, hung the sack on a nail, and proudly spoke the crane's command.
        - id: ch03-b06
          speaker: man
          text: Two out of the sack!
        - id: ch03-b07
          speaker: narrator
          text: Not a soul came out. The man tried once more, taking care to say every word exactly as the crane had taught him.
        - id: ch03-b08
          speaker: man
          text: Two out of the sack!
        - id: ch03-b09
          speaker: narrator
          text: His wife heard him babbling words that meant nothing to her. She grabbed her wet broom and swept the ground all around him with it. The man fled from the house and raced back into the field.
        - id: ch03-b10
          speaker: narrator
          text: There he found the crane striding proudly about. The man told the whole sorry tale.
        - id: ch03-b11
          speaker: crane
          text: Come home with me again.
        - id: ch03-b12
          speaker: narrator
          text: Once again, the man followed the crane home. Once again, the crane took a sack down from the wall.
        - id: ch03-b13
          speaker: crane
          text: Two out of the sack!
        - id: ch03-b14
          speaker: narrator
          text: Two handsome lads sprang out at once. They brought in oak tables, laid silk across them, and covered them with wonderful food and refreshing drinks.
        - id: ch03-b15
          speaker: crane
          text: Take this sack with you.
        - id: ch03-b16
          speaker: narrator
          text: The man thanked the crane warmly and set off again. After walking a long way, he grew hungry. He stopped and gave the sack the command he knew.
        - id: ch03-b17
          speaker: man
          text: Two out of the sack!
        - id: ch03-b18
          speaker: narrator
          text: This time, two rough men crawled out, each carrying a heavy stick. They fell upon the man and beat him soundly while they chanted.
        - id: ch03-b19
          speakers: [ruffian_1, ruffian_2]
          ensemble: duo
          text: Don't go boasting to your kin! One, two! Or our sticks will warm your skin! One, two!
        - id: ch03-b20
          speaker: narrator
          text: The blows kept coming until the man could barely gasp out the words that would stop them.
        - id: ch03-b21
          speaker: man
          text: Two into the sack!
        - id: ch03-b22
          speaker: narrator
          text: He had hardly finished speaking when both rough men crawled back inside.
    - id: ch04
      title: The Stolen Sack Returned
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The man shouldered the sack and went straight to his cousin's house. He hung it on a nail as soon as he arrived.
        - id: ch04-b02
          speaker: man
          text: Cousin, please heat the bathroom for me.
        - id: ch04-b03
          speaker: narrator
          text: His cousin did as he asked. The man went into the bathroom, but he did not wash or rub himself. He simply sat there and waited.
        - id: ch04-b04
          speaker: narrator
          text: Before long, the cousin grew hungry. She called her three daughters, and all four of them sat down at the table. Then the mother gave the sack its command.
        - id: ch04-b05
          speaker: cousin
          text: Two out of the sack!
        - id: ch04-b06
          speaker: narrator
          text: The two rough men crawled out at once. They began beating the cousin with their thick sticks, keeping time with their chant.
        - id: ch04-b07
          speakers: [ruffian_1, ruffian_2]
          ensemble: duo
          text: Greedy pack! Thieving pack! One, two! Give the peasant his sack back! One, two!
        - id: ch04-b08
          speaker: narrator
          text: They went on until the woman called desperately to her eldest daughter.
        - id: ch04-b09
          speaker: cousin
          text: Fetch your cousin from the bathroom! Tell him these two ruffians are beating me black and blue!
          emotion: fearful
        - id: ch04-b10
          speaker: man
          text: I'm still busy rubbing myself.
        - id: ch04-b11
          speaker: narrator
          text: The two ruffians kept beating her and chanting for the stolen sack.
        - id: ch04-b12
          speakers: [ruffian_1, ruffian_2]
          ensemble: duo
          text: Greedy pack! Thieving pack! One, two! Give the peasant his sack back! One, two!
        - id: ch04-b13
          speaker: narrator
          text: Next, the woman sent her second daughter.
        - id: ch04-b14
          speaker: cousin
          text: Hurry! Make him come to me!
          emotion: fearful
        - id: ch04-b15
          speaker: man
          text: I'm washing my hair now.
        - id: ch04-b16
          speaker: narrator
          text: Then she sent her youngest daughter, but the man still refused to hurry.
        - id: ch04-b17
          speaker: man
          text: I'm not dry yet.
        - id: ch04-b18
          speaker: narrator
          text: At last, the cousin could endure no more. She sent him the sack she had stolen. Only then was his bath quite finished. He came out and gave the command.
        - id: ch04-b19
          speaker: man
          text: Two into the sack!
        - id: ch04-b20
          speaker: narrator
          text: The two rough men crawled straight back inside. The man took both sacks, the good one and the bad one, and started for home.
    - id: ch05
      title: A Feast at Home
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: When the man came near his house, he called out once more.
        - id: ch05-b02
          speaker: man
          text: Hallo, old woman! Come and meet me!
        - id: ch05-b03
          speaker: wife
          text: Come here, you broomstick! Your back will pay for this!
          emotion: angry
        - id: ch05-b04
          speaker: narrator
          text: The man walked into the cottage and hung one sack on a nail. Then he spoke the words the crane had taught him.
        - id: ch05-b05
          speaker: man
          text: Two out of the sack!
        - id: ch05-b06
          speaker: narrator
          text: The two handsome lads sprang out. They carried in oak tables, spread silken covers over them, and served every kind of delicious food and refreshing drink.
        - id: ch05-b07
          speaker: narrator
          text: The woman ate and drank her fill. For once, she had nothing but praise for her husband.
        - id: ch05-b08
          speaker: wife
          text: Well, old man, I won't beat you anymore.
        - id: ch05-b09
          speaker: narrator
          text: When the meal was over, the man carried the good sack into the storeroom and put it safely away. He hung the bad sack on the nail instead. Then he went outside and strolled up and down the yard.
    - id: ch06
      title: The Wife Learns Her Lesson
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: After a while, his wife grew thirsty. She kept looking longingly at the sack on the wall. At last, she repeated the command she had heard her husband use.
        - id: ch06-b02
          speaker: wife
          text: Two out of the sack!
        - id: ch06-b03
          speaker: narrator
          text: Out crawled the two rogues with their great sticks. They began to beat her, and as they swung, they sang together.
        - id: ch06-b04
          speakers: [ruffian_1, ruffian_2]
          ensemble: duo
          text: Would you beat your husband true? Don't cry so! Now we'll beat you black and blue! Oh! Oh!
        - id: ch06-b05
          speaker: wife
          text: Old man! Old man, come quickly! Two ruffians are pounding me hard enough to break my bones!
          emotion: fearful
        - id: ch06-b06
          speaker: narrator
          text: Her husband only laughed and kept strolling up and down.
        - id: ch06-b07
          speaker: man
          text: Yes, old lady. They'll give you a proper beating.
        - id: ch06-b08
          speaker: narrator
          text: The sticks continued to thump while the two rogues sang another verse.
        - id: ch06-b09
          speakers: [ruffian_1, ruffian_2]
          ensemble: duo
          text: Blows can hurt, remember well. We mean you well, we mean you well! Leave the stick alone from now on. You know how much it hurts yourself. One, two!
        - id: ch06-b10
          speaker: narrator
          text: At last, the man took pity on his wife and called the rogues back.
        - id: ch06-b11
          speaker: man
          text: Two into the sack!
        - id: ch06-b12
          speaker: narrator
          text: The words were hardly out of his mouth before both men were inside the sack again.
        - id: ch06-b13
          speaker: narrator
          text: From that time on, the man and his wife lived so happily together that it was a pleasure to see them.
        - id: ch06-b14
          speaker: narrator
          text: And so the story comes to an end.
