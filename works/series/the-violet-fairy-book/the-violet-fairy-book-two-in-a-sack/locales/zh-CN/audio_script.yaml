audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 编者
      tts:
        delivery: 亲切而略带诙谐的讲述
        timbre: 温暖清晰的成年男声
        pace: 从容舒展
        pitch: 中低音
    old_man:
      display_name: 老头儿
      tts:
        delivery: 老实沉着，盘算时透着机敏
        timbre: 温厚略沙哑的老年男声
        pace: 适中
        pitch: 中低音
    wife:
      display_name: 老太婆
      tts:
        delivery: 嘴快性急，自信又爱声张
        timbre: 响亮爽利的老年女声
        pace: 稍快
        pitch: 中高音
    crane:
      display_name: 鹤
      tts:
        delivery: 从容神秘，说话简洁而笃定
        timbre: 清亮沉稳的成年男声
        pace: 稍慢
        pitch: 中音
    cousin:
      display_name: 表姐
      tts:
        delivery: 表面热情，暗中精明贪婪
        timbre: 圆润利落的成年女声
        pace: 适中
        pitch: 中音
    ruffian_1:
      display_name: 棍棒汉甲
      tts:
        delivery: 粗野有力，唱词节拍鲜明
        timbre: 粗厚响亮的成年男声
        pace: 适中
        pitch: 低音
    ruffian_2:
      display_name: 棍棒汉乙
      tts:
        delivery: 凶悍干脆，唱词节拍鲜明
        timbre: 沙哑洪亮的成年男声
        pace: 适中
        pitch: 中低音
  chapters:
    - id: ch01
      title: 鹤的礼物
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            那个可怜的男人，在家里一天安生日子也没有。妻子天天骂他，拿难听的话数落他，有时还会从炉子后面抄起扫帚打他。他实在不知道，这样的日子还能怎么熬下去。
        - id: ch01-b02
          speaker: narrator
          text: >-
            一天，妻子格外凶狠，又把他打得青一块紫一块。男人慢慢走进田野。虽然心里难受，他也不愿闲着，于是撒开捕鸟网。你猜网里捉到了什么？原来是一只鹤。
        - id: ch01-b03
          speaker: crane
          text: >-
            放我走吧，我一定会报答你。
        - id: ch01-b04
          speaker: old_man
          text: >-
            那可不行，老兄。我要带你回家，也许我妻子见了你，就不会骂得那么凶了。
        - id: ch01-b05
          speaker: crane
          text: >-
            你还是跟我回家吧。
        - id: ch01-b06
          speaker: narrator
          text: >-
            到了鹤的家，鹤从墙上取下一只口袋。
        - id: ch01-b07
          speaker: crane
          text: >-
            袋中二人，出来！
        - id: ch01-b08
          speaker: narrator
          text: >-
            两个俊俏的小伙子一下跳了出来。他们搬来橡木桌，铺上丝绸桌布，又摆满美味佳肴和清凉饮品。男人一辈子也没见过这样的筵席，高兴得不得了。
        - id: ch01-b09
          speaker: crane
          text: >-
            把这只口袋带回去，交给你妻子吧。
        - id: ch01-b10
          speaker: narrator
          text: >-
            男人连声向鹤道谢，拿起口袋上路了。他家离这里很远，走着走着，天色渐渐暗下来，他也越来越疲乏。半路上正好住着他的表姐，男人便到她家歇脚，打算住上一夜。

    - id: ch02
      title: 被调换的口袋
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            表姐和三个女儿端来一桌诱人的晚餐，男人却一口不吃。
        - id: ch02-b02
          speaker: old_man
          text: >-
            你家的饭菜太差了。
        - id: ch02-b03
          speaker: cousin
          text: >-
            就将就吃一点吧。
        - id: ch02-b04
          speaker: old_man
          text: >-
            都撤下去！袋中二人，出来！
        - id: ch02-b05
          speaker: narrator
          text: >-
            两个俊俏的小伙子应声而出。他们飞快地搬来橡木桌，铺上丝绸桌布，又摆好各式美味佳肴和清凉饮品。表姐和三个女儿这辈子从没见过这样的晚餐，看得又惊又喜。可表姐没有声张，心里却已经打定主意，要把口袋偷来。
        - id: ch02-b06
          speaker: cousin
          text: >-
            快把浴室烧热。咱们的客人睡觉前，一定想舒舒服服洗个澡。
        - id: ch02-b07
          speaker: narrator
          text: >-
            等男人安安稳稳进了浴室，表姐马上叫女儿们赶快缝一只一模一样的口袋。她调换了两只口袋，把真正的那只藏了起来。男人舒舒服服洗了澡，又美美睡了一夜，第二天一早便带着假口袋回家去了。他还以为自己拿的是鹤送的口袋呢。
        - id: ch02-b08
          speaker: narrator
          text: >-
            他一路唱歌吹口哨，心情好极了，连林中鸟儿的啁啾听来也像是在笑他。远远望见自家的屋子，他便高声呼喊。
        - id: ch02-b09
          speaker: old_man
          text: >-
            喂，老婆子！快出来接我！
        - id: ch02-b10
          speaker: wife
          text: >-
            你给我滚过来，看我不用拨火棍狠狠揍你！
          emotion: angry
        - id: ch02-b11
          speaker: narrator
          text: >-
            男人进屋，把口袋挂到钉子上，照鹤教的口令喊了两遍。
        - id: ch02-b12
          speaker: old_man
          text: >-
            袋中二人，出来！袋中二人，出来！
        - id: ch02-b13
          speaker: narrator
          text: >-
            可口袋里连个人影也没有。妻子听他不知在嘟囔什么，抓起湿淋淋的扫帚，朝他脚边四下乱扫。男人吓得拔腿就逃，一口气冲到田野。他在那里找到那只正神气踱步的鹤，把自己的遭遇原原本本讲了一遍。

    - id: ch03
      title: 棍棒汉讨回口袋
      blocks:
        - id: ch03-b01
          speaker: crane
          text: >-
            再跟我回家吧。
        - id: ch03-b02
          speaker: narrator
          text: >-
            他们回到鹤的家。鹤又从墙上取下一只口袋。
        - id: ch03-b03
          speaker: crane
          text: >-
            袋中二人，出来！
        - id: ch03-b04
          speaker: narrator
          text: >-
            两个俊俏的小伙子立刻跳了出来。他们搬来橡木桌，铺上丝绸桌布，再摆满各式各样的美味佳肴和清凉饮品。
        - id: ch03-b05
          speaker: crane
          text: >-
            这只口袋，你拿去吧。
        - id: ch03-b06
          speaker: narrator
          text: >-
            男人千恩万谢，拿起口袋继续赶路。他还要走很远，没过多久便觉得肚子饿了，于是照着鹤教他的，对口袋喊道。
        - id: ch03-b07
          speaker: old_man
          text: >-
            袋中二人，出来！
        - id: ch03-b08
          speaker: narrator
          text: >-
            谁知钻出来的不是俊俏小伙子，而是两个手持粗棍的彪形大汉。他们劈里啪啦地痛打男人，一面打，一面喊。
        - id: ch03-b09
          speakers: [ruffian_1, ruffian_2]
          ensemble: duo
          text: >-
            得了宝贝莫向亲戚夸，一——二——不然棍棒准把你狠打，一——二——
          emotion: angry
        - id: ch03-b10
          speaker: narrator
          text: >-
            两个人不停地打，男人被打得气喘吁吁，只好喊出另一句口令。
        - id: ch03-b11
          speaker: old_man
          text: >-
            二人回袋！
          emotion: fearful
        - id: ch03-b12
          speaker: narrator
          text: >-
            话音还没落，两人便钻回口袋。男人把口袋扛上肩，径直来到表姐家，又把它挂在钉子上。
        - id: ch03-b13
          speaker: old_man
          text: >-
            表姐，请把浴室烧热吧。
        - id: ch03-b14
          speaker: narrator
          text: >-
            男人进了浴室，却不洗也不擦，只坐着等。表姐饿了，叫来三个女儿，母女四人一同坐到桌边，也对口袋念出口令。
        - id: ch03-b15
          speaker: cousin
          text: >-
            袋中二人，出来！
        - id: ch03-b16
          speaker: narrator
          text: >-
            两个彪形大汉立刻从口袋里钻出来，抡起粗棍痛打表姐。一下接着一下，根本不给她喘气的工夫。他们还踩着棍棒落下的节拍，一同喊起来。
        - id: ch03-b17
          speakers: [ruffian_1, ruffian_2]
          ensemble: duo
          text: >-
            一窝馋鬼！一窝贼！一——二——快把农夫的口袋还回！一——二——
          emotion: angry
        - id: ch03-b18
          speaker: narrator
          text: >-
            两个人越打越起劲。表姐实在挨不住，急忙冲大女儿叫喊。
        - id: ch03-b19
          speaker: cousin
          text: >-
            去浴室叫你表舅来！告诉他，这两个恶棍快把我打得浑身青紫了！
          emotion: fearful
        - id: ch03-b20
          speaker: old_man
          text: >-
            我还没擦洗完呢。
        - id: ch03-b21
          speaker: narrator
          text: >-
            棍棒没有停，两个恶棍又把刚才的歌唱了一遍。
        - id: ch03-b22
          speakers: [ruffian_1, ruffian_2]
          ensemble: duo
          text: >-
            一窝馋鬼！一窝贼！一——二——快把农夫的口袋还回！一——二——
          emotion: angry
        - id: ch03-b23
          speaker: cousin
          text: >-
            快，快去叫他，让他马上到我这里来！
          emotion: fearful
        - id: ch03-b24
          speaker: old_man
          text: >-
            我刚洗到头呢。
        - id: ch03-b25
          speaker: narrator
          text: >-
            她再让小女儿去叫，男人仍旧不肯出来。
        - id: ch03-b26
          speaker: old_man
          text: >-
            我还没擦干身子呢。
        - id: ch03-b27
          speaker: narrator
          text: >-
            表姐再也支撑不住，只好把偷来的口袋送还给他。这一下，男人的澡可算洗完了。他走出浴室，高声喊道。
        - id: ch03-b28
          speaker: old_man
          text: >-
            二人回袋！
        - id: ch03-b29
          speaker: narrator
          text: >-
            两个恶棍立刻钻回口袋。男人带上两只口袋，一只是好的，一只是坏的，离开表姐家，向自己家走去。

    - id: ch04
      title: 好口袋的筵席
      blocks:
        - id: ch04-b01
          speaker: old_man
          text: >-
            喂，老婆子，快出来接我！
        - id: ch04-b02
          speaker: wife
          text: >-
            你这个扫帚把儿，给我滚过来！这回非拿你的背出气不可。
          emotion: angry
        - id: ch04-b03
          speaker: narrator
          text: >-
            男人走进小屋，把好口袋挂在钉子上，再次念出口令。
        - id: ch04-b04
          speaker: old_man
          text: >-
            袋中二人，出来！
        - id: ch04-b05
          speaker: narrator
          text: >-
            两个俊俏的小伙子立刻从口袋里跳了出来。他们搬来橡木桌，铺上丝绸桌布，又把各式各样的美食和清凉饮品摆了满桌。妻子吃得痛快，喝得也痛快，终于对丈夫赞不绝口。
        - id: ch04-b06
          speaker: wife
          text: >-
            好啦，老头子，往后我再也不打你了。
        - id: ch04-b07
          speaker: narrator
          text: >-
            吃完以后，男人把好口袋收进储藏室，只将坏口袋挂在钉子上。接着，他到院子里慢悠悠地踱步去了。

    - id: ch05
      title: 坏口袋的教训
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            妻子渐渐口渴，眼巴巴盯着墙上的口袋，终于学丈夫那样开口。
        - id: ch05-b02
          speaker: wife
          text: >-
            袋中二人，出来！
        - id: ch05-b03
          speaker: narrator
          text: >-
            话音一落，出来的却不是摆筵席的小伙子。两个手持粗棍的恶棍从口袋里钻出来，围着她抡起棍子狠揍，还一边打一边唱起了歌。
        - id: ch05-b04
          speakers: [ruffian_1, ruffian_2]
          ensemble: duo
          text: >-
            还想把你丈夫打？别哭喊！这回打得你青又紫！哎哟！哎哟！
          emotion: angry
        - id: ch05-b05
          speaker: wife
          text: >-
            老头子，老头子，快过来！这两个恶棍要把我的骨头都打断了！
          emotion: fearful
        - id: ch05-b06
          speaker: narrator
          text: >-
            丈夫只管在院子里来回踱步，还笑了起来。
        - id: ch05-b07
          speaker: old_man
          text: >-
            可不是吗，老婆子，他们会好好揍你的。
        - id: ch05-b08
          speaker: narrator
          text: >-
            两个恶棍听了也不停手，照旧一棍接一棍地打。妻子越喊，他们打得越响，还把另一段歌也唱了出来。
        - id: ch05-b09
          speakers: [ruffian_1, ruffian_2]
          ensemble: duo
          text: >-
            老婆子，挨打疼不疼？我们为你好，我们为你好。往后休要再把棍棒抡，如今你可知道有多疼，一——二——
          emotion: angry
        - id: ch05-b10
          speaker: narrator
          text: >-
            妻子挨了好一阵，丈夫才终于动了恻隐之心。他停下脚步，朝口袋高声喊道。
        - id: ch05-b11
          speaker: old_man
          text: >-
            二人回袋！
        - id: ch05-b12
          speaker: narrator
          text: >-
            话音刚落，两个恶棍便钻回口袋。从此以后，男人和妻子过得和和美美，任谁见了都觉得欢喜。故事也就讲完了。
