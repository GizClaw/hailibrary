audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 清楚从容，像在为听众介绍一本古老的童话集
        timbre: 温暖明净
        pace: 舒缓
        pitch: 中音
    alonzo:
      display_name: 阿隆索
      tts: {delivery: 诚恳热烈，面对诱惑时逐渐恍惚急迫, timbre: 清朗年轻, pace: 适中, pitch: 中音}
    julia:
      display_name: 朱莉娅
      tts: {delivery: 温柔敏锐，察觉危险时急切而坚定, timbre: 温暖年轻, pace: 适中, pitch: 中高音}
  chapters:
    - id: ch01
      title: 盛会上的姑娘
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            在遥远的南方，太阳晒得火辣辣的。人和万物整天都在沉睡，就连大森林也静悄悄的，只有清晨和傍晚才有些声息。从前，这片土地上住着一位姑娘和一个年轻人。姑娘生在城里，几乎从没离开过。年轻人却来自异乡，因为故乡找不到活儿干，才来到这座大河边的城市。
        - id: ch01-b02
          speaker: narrator
          text: >-
            几个月后，天气凉爽了一些，人们也不再整天昏睡。城外举行了一场盛大的宴会，方圆三十多英里的人全赶来了。有人走路，有人骑马，还有人坐着漂亮的金色马车。人人都穿着鲜艳的红衣或蓝衣，头发上戴着花环。
        - id: ch01-b03
          speaker: narrator
          text: >-
            年轻人从没参加过这样的盛会。他安静地站在一旁，看青年男女跳着优美的舞，玩着有趣的游戏。人群中有一位白衣姑娘，发间簪着鲜红的石榴花。在他眼里，她比所有姑娘都美。宴会散后，他回到住处，举止却像换了个人，朋友们全都看出了异样。第二天从早到晚，无论手里做着什么活儿，他眼前还是她的脸，是她抛球给同伴、在舞伴间轻盈穿行的模样。
        - id: ch01-b04
          speaker: narrator
          text: >-
            夜里，他怎么也睡不着。在床上翻来覆去几个钟头以后，他便起身走进森林，跳进河边一处幽深的水潭。这样的日子过了几个星期，机会终于来了。
        - id: ch01-b05
          speaker: narrator
          text: >-
            一天傍晚，他从姑娘家附近经过，看见她背靠墙壁，用扇子抵挡一条扑向她喉咙的恶犬。年轻人名叫阿隆索。他冲上去，只一拳就把恶犬打死在路上，又扶着吓得半昏过去的姑娘，走进她父母所在的宽敞凉廊。从此，这家人总欢迎他来。没过多久，他便和姑娘朱莉娅订了婚。
        - id: ch01-b06
          speaker: narrator
          text: >-
            每天做完工，阿隆索都会来到那座藏在花木和绚丽藤蔓间的房子。蜂鸟掠过灌木，红的、绿的、灰的鹦鹉一齐尖叫。朱莉娅等在那里，两人坐在星空下，一待就是一两个钟头。星星又大又亮，仿佛伸手便能碰到。
    - id: ch02
      title: 朱莉娅的警告
      blocks:
        - id: ch02-b01
          speaker: julia
          text: 昨晚你回去以后，都做了些什么？
        - id: ch02-b02
          speaker: alonzo
          text: >-
            还是和平常一样。天太热，躺下也睡不着，我就去了森林，在河边那处又深又暗的水潭里游水。我已经去了好几个月，可昨晚遇见一件怪事。最后一次潜水时，我听见有人唱歌。声音一会儿在这边，一会儿又飘到那边，比夜莺还要甜美，可我连一个字也听不清。
        - id: ch02-b03
          speaker: alonzo
          text: >-
            我出了水，赶紧穿好衣服，把水边每一片灌木、每一棵树都找过了。我以为是朋友在捉弄我，却连个人影也没见到。等我回家，那位朋友还睡得正香。
        - id: ch02-b04
          speaker: narrator
          text: >-
            朱莉娅的脸一下白得吓人，浑身像受了寒似的直抖。她从小便听说，森林里和河岸下藏着可怕的精怪，只有强大的护符才能挡住它们。迷住阿隆索的歌声，会不会就来自其中一个？也许，那正是雅拉的声音。传说雅拉会在年轻男子成婚前夕出现，把他们当成猎物。
        - id: ch02-b05
          speaker: narrator
          text: 恐惧堵住了朱莉娅的喉咙。过了一会儿，她才勉强开口。
        - id: ch02-b06
          speaker: julia
          text: 阿隆索，你肯答应我一件事吗？
          emotion: fearful
        - id: ch02-b07
          speaker: alonzo
          text: 你要我答应什么？
        - id: ch02-b08
          speaker: julia
          text: 这关系到我们以后的幸福。
        - id: ch02-b09
          speaker: alonzo
          text: 那可真是大事了。我当然答应，你快说吧。
        - id: ch02-b10
          speaker: narrator
          text: 朱莉娅把声音压得很低，几乎只剩耳语。
        - id: ch02-b11
          speaker: julia
          text: 答应我，再也不要去那些水潭游水。
          emotion: fearful
        - id: ch02-b12
          speaker: alonzo
          text: >-
            为什么呀，我心中的女王？我一直都去，不是什么事也没有吗，我心爱的花朵？
        - id: ch02-b13
          speaker: julia
          text: 现在没有，不等于以后没有。你若不答应，我会活活吓疯的。求你答应我。
          emotion: fearful
        - id: ch02-b14
          speaker: alonzo
          text: 到底怎么了？你的脸这么白，为什么怕成这样？
        - id: ch02-b15
          speaker: julia
          text: 你不是听见那支歌了吗？
          emotion: fearful
        - id: ch02-b16
          speaker: alonzo
          text: 就算听见了，一支歌又怎么能伤人？那是我听过最美的歌。
        - id: ch02-b17
          speaker: julia
          text: 歌声过后，幻影就会出现。再往后……再往后……
          emotion: fearful
        - id: ch02-b18
          speaker: alonzo
          text: 我还是不明白。再往后究竟是什么？
        - id: ch02-b19
          speaker: julia
          text: 再往后，就是死亡。
          emotion: fearful
        - id: ch02-b20
          speaker: narrator
          text: >-
            阿隆索瞪着她，心想朱莉娅难道真的疯了？她从来不说这种话。还没等他回过神，朱莉娅又说了下去。
        - id: ch02-b21
          speaker: julia
          text: 所以我才求你别再去那里。至少在我们结婚以前，千万别去。
        - id: ch02-b22
          speaker: alonzo
          text: 结了婚又会有什么不同？
        - id: ch02-b23
          speaker: julia
          text: 结婚以后就没有危险了。到时你想去多少次都行。
        - id: ch02-b24
          speaker: alonzo
          text: 可你还没说，为什么这么害怕。
        - id: ch02-b25
          speaker: julia
          text: 因为你听见的就是雅拉的声音。我知道你会笑，可这是真的。
    - id: ch03
      title: 海螺里的歌
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            阿隆索果然放声大笑。那笑声又尖厉又响亮，朱莉娅浑身发抖，向后缩去。他像是怎么也停不下来。他笑得越厉害，姑娘的脸便越苍白。她看着他，低声喃喃自语。
        - id: ch03-b02
          speaker: julia
          text: 天哪！你已经见过她了！你见过她了！我该怎么办？
          emotion: fearful
        - id: ch03-b03
          speaker: narrator
          text: 她的声音虽轻，阿隆索还是听见了。他笑得说不出话，只能摇头。
        - id: ch03-b04
          speaker: julia
          text: 你自己还不知道，可这是真的。没见过雅拉的人，绝不会发出这样的笑声。
          emotion: fearful
        - id: ch03-b05
          speaker: narrator
          text: 朱莉娅扑倒在地，伤心地哭了起来。阿隆索这才收起笑容，跪到她身边，轻轻将她扶起。
        - id: ch03-b06
          speaker: alonzo
          text: 别再哭了，我的天使。你要我答应什么都行，只求你再对我笑一笑。
        - id: ch03-b07
          speaker: narrator
          text: 朱莉娅费了很大力气才止住抽泣，重新站起来。
        - id: ch03-b08
          speaker: julia
          text: >-
            谢谢你。听见这句话，我心里轻松多了。我知道你会努力守信，不再走进森林。可是雅拉的力量太强了。她一开口唱歌，男人便很容易忘掉世上的一切。我亲眼见过这种事。如今不止一位订过婚的姑娘孤零零地活着，心也碎了。
        - id: ch03-b09
          speaker: julia
          text: >-
            万一你又回到最初听见歌声的水潭，至少答应我，把这个带在身边。
        - id: ch03-b10
          speaker: narrator
          text: >-
            她打开一只雕刻精巧的盒子，取出一枚闪着斑斓光彩的海螺，又对着螺口轻轻唱了一支歌。
        - id: ch03-b11
          speaker: julia
          text: >-
            一听见雅拉的声音，你就把海螺贴到耳边。这样，你听见的便会是我的歌。也许……我也不能肯定……可也许，我能比雅拉更强。
        - id: ch03-b12
          speaker: narrator
          text: >-
            那天夜里，阿隆索很晚才回去。月光照着远处的河，河水显得清凉诱人。森林里的树木像是伸出手臂，招他过去。可他坚定地转过脸，朝相反的方向走去，回家睡觉了。
        - id: ch03-b13
          speaker: narrator
          text: >-
            第二天，朱莉娅见到他时又欢喜又安心，这便是他苦苦抵住诱惑的奖赏。阿隆索向她保证，自己既然已经胜过一次，危险也就过去了。朱莉娅却比他更明白雅拉的容貌和歌声有多大的魔力。等他要离开时，她仍不放心，又让阿隆索把诺言说了一遍。
    - id: ch04
      title: 月光下的身影
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            一连三夜，阿隆索都没有失信。不是因为他相信雅拉，他只把那些传说当作胡言乱语。他不去，是因为受不了朱莉娅的眼泪。可那支歌始终在耳边回响，还一天比一天响亮。
        - id: ch04-b02
          speaker: narrator
          text: >-
            到了第四夜，森林的吸引变得无比强烈。朱莉娅和自己的诺言都拦不住他。十一点钟，他钻进林间清凉的黑暗，沿小路走向河边。朱莉娅的警告仍留在记忆里，尽管她说那些话时，他还曾笑她多心。头一回，他带着从未有过的恐惧，不断望向路旁的灌木。
        - id: ch04-b03
          speaker: narrator
          text: >-
            到了河边，他停下来四处查看。他总觉得有人盯着自己，又想证明那只是错觉。月光把每一棵树都照得清清楚楚。他只看见自己的影子，也只听见潺潺的流水声。
        - id: ch04-b04
          speaker: narrator
          text: >-
            他脱下衣服，正要一头扎进水里，却忽然回过头。月亮恰好从云后露出来，照亮了一位金发美女。她站在蕨草后面，半个身子藏在阴影里。
        - id: ch04-b05
          speaker: narrator
          text: >-
            阿隆索一下抓起斗篷，沿着来路拼命逃跑。每跑一步，他都怕有只手搭上肩膀。直到把最后一排树木甩在身后，独自站到空旷的平原上，他才敢回头。那个白色身影仿佛还站在林边，双臂来回挥动。这已经足够吓人了。他沿大路跑得比先前更快，一直逃进自己的房间才停下。
        - id: ch04-b06
          speaker: narrator
          text: >-
            天刚亮，他又回到森林，想找出雅拉留下的痕迹。他翻遍灌木，也抬头搜过每一棵树，可四处空空荡荡。唯一听见的只有鹦鹉难听的叫声，那声音只会把人赶走。
        - id: ch04-b07
          speaker: alonzo
          text: 我一定是疯了。昨晚那些荒唐事，全是我做的梦。
        - id: ch04-b08
          speaker: narrator
          text: >-
            他回城干活，却怎么也集中不了心思。不知是活儿比往常更难，还是他真的病了。白天遇见的每个人都问他出了什么事，为什么脸色惨白，神情惊恐。
        - id: ch04-b09
          speaker: alonzo
          text: 我准是在发烧。浑身这么热还去洗冷水澡，确实有些危险。
        - id: ch04-b10
          speaker: narrator
          text: >-
            可他心里很清楚，自己正在数着钟点，盼黑夜快些到来，好再次走进森林。
    - id: ch05
      title: 水潭中的雅拉
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            傍晚，他还是去了朱莉娅家。其实，他不如别去。那张脸太苍白，举止也太反常，朱莉娅一眼便看出准有可怕的事发生。可无论她怎么问，阿隆索都不肯回答，只答应第二天再把一切说出来。
        - id: ch05-b02
          speaker: narrator
          text: >-
            他假装头痛得厉害，早早告别朱莉娅，匆匆回到住处。他取下一把手枪，装好弹药，插进腰带。快到午夜时，他踮着脚溜出门，免得惊动别人，随后便沿大路赶往森林。
        - id: ch05-b03
          speaker: narrator
          text: >-
            到了水潭边，他手握手枪四下张望。树叶落地，野兽在灌木中窸窣，夜鸟突然啼叫。每一点声音都会让他跳起来，把枪扳上击锤，对准那边。可月亮一直照着，他什么也没看见。渐渐地，他靠在树上，迷迷蒙蒙，仿佛落进梦里。
        - id: ch05-b04
          speaker: narrator
          text: >-
            他不知道自己这样待了多久。忽然，有个声音轻轻唤出他的名字，他一下惊醒。
        - id: ch05-b05
          speaker: alonzo
          text: 谁在那里？
        - id: ch05-b06
          speaker: narrator
          text: >-
            只有回声答他。他立刻站直，可目光很快又被脚边幽暗的潭水摄住，再也移不开了。他一动不动地望着水底。几分钟后，黑暗深处亮起一个小小的光点。光点飞快变大，也变得越来越亮。那股可怕的恐惧再一次攫住他。他拼命想把目光从水里转开，却无论如何也办不到。有一种比他更强的力量，逼他继续凝望。
        - id: ch05-b07
          speaker: narrator
          text: >-
            水面终于无声地分开。几天前吓跑他的美丽女子，如今正浮在水上。阿隆索想转身逃走，两只脚却牢牢粘在原地。她微笑着向他伸出双臂。就在这时，他想起几个钟头前见过的朱莉娅，也想起她为眼前这场危险发出的警告和恐惧。
        - id: ch05-b08
          speaker: narrator
          text: >-
            那个身影越来越近。阿隆索拼尽全力，终于从恍惚中挣脱。他瞄准她的肩头，扣下扳机。枪声惊醒了森林里沉睡的回音，可她仍在微笑，仍在靠近。他又开了一枪。子弹呼啸而过，她却离他更近了。再过片刻，她就会来到身边。
        - id: ch05-b09
          speaker: narrator
          text: >-
            手枪已经空了。阿隆索双手握紧枪管，打算等雅拉再近一些，就把枪当作棍棒抡下去。他高举手枪，一步步逼上前。现在仿佛轮到雅拉害怕了，她竟停住片刻。
    - id: ch06
      title: 两支歌的较量
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            激动之中，阿隆索忘了身后就是河流。直到冰冷的水碰到双脚，他才本能地停住。雅拉看出他在迟疑，便让身体在河面上轻轻摇曳，开口唱歌。
        - id: ch06-b02
          speaker: narrator
          text: >-
            歌声穿过树林，忽远忽近。谁也说不出它来自哪里，仿佛整个夜空都被歌声填满。阿隆索的神智渐渐消散，意志也一点点崩溃。他的双臂沉重地垂下，却碰到了外衣里的海螺。他答应过朱莉娅，会一直带着它。
        - id: ch06-b03
          speaker: narrator
          text: >-
            他昏沉的脑海还留着最后一丝清明，足够记起朱莉娅的嘱咐。他用颤抖的手指掏出海螺，那些手指几乎连东西都抓不住。雅拉的歌声变得更加甜美，更加温柔。他却不再听，低下头，把海螺贴到耳边。
        - id: ch06-b04
          speaker: narrator
          text: >-
            朱莉娅的歌声从海螺深处升起，正是她交出海螺时唱过的那支歌。开始时，曲调十分微弱。接着，它越来越响，终于把笼罩阿隆索的迷雾彻底吹散。
        - id: ch06-b05
          speaker: narrator
          text: >-
            阿隆索抬起头，觉得自己像是穿过了一片诡异之地，从此再也不会迷入其中。他重新站直身子，感到坚强有力，又环顾四周。眼前只有河面闪烁的波光和树木幽暗的影子。耳边只有昆虫飞过夜色时发出的嗡鸣。
        - id: ch06-b06
          speaker: narrator
          text: 本故事改写自《巴西民间传说》。
