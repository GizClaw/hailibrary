audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, grave, and attentive to wonder
        timbre: clear and resonant
        pace: measured
        pitch: medium
    alonzo:
      display_name: Alonzo
      tts:
        delivery: earnest, affectionate, and increasingly spellbound
        timbre: clear and youthful
        pace: measured
        pitch: medium
    julia:
      display_name: Julia
      tts:
        delivery: tender, perceptive, and urgent in danger
        timbre: warm and youthful
        pace: measured
        pitch: medium-high
  chapters:
    - id: ch01
      title: The Feast
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Far in the south, the sun shone so fiercely that everyone slept through the day. Even the great forests were silent except in the early morning and late evening. In that country lived a young woman who had been born in the town and had hardly ever left it. A young man had also come there from another country because he could find no work at home.
        - id: ch01-b02
          speaker: narrator
          text: A few months after he arrived, the cooler days brought a great feast outside the town. People came from thirty miles around. Some walked, some rode, and some arrived in splendid golden coaches. Everyone wore beautiful red or blue clothes and wreaths of flowers in their hair.
        - id: ch01-b03
          speaker: narrator
          text: The young man had never seen such a gathering. He stood quietly to one side, watching the graceful dances and the games. Then he noticed a girl in white, with scarlet pomegranates in her hair. To him, she was lovelier than anyone there.
        - id: ch01-b04
          speaker: narrator
          text: After the feast, his friends saw at once that something about him had changed. All through the next day's work, he kept seeing the girl's face. He pictured her throwing a ball to her friends and weaving among them in the dance. At night he could not sleep. After hours of tossing in bed, he would rise and bathe in a deep pool near the river, a little way into the forest.
        - id: ch01-b05
          speaker: narrator
          text: Several weeks passed before chance helped him. One evening, near the girl's house, he found her pressed against a wall. A savage dog was leaping for her throat, and she was trying to beat it away with her fan. The young man sprang forward and killed the dog with one blow of his fist.
        - id: ch01-b06
          speaker: narrator
          text: His name was Alonzo. He helped the terrified, half-fainting girl into the broad, cool veranda where her parents sat. From then on, their home was always open to him. Before long, he and Julia were promised to each other.
        - id: ch01-b07
          speaker: narrator
          text: Each day after work, Alonzo visited the house among its flowering plants and brilliant vines. Hummingbirds darted between the bushes, while red, green, and gray parrots shrieked together. Julia waited for him there. They spent an hour or two beneath stars that looked so large and bright, they seemed almost near enough to touch.
    - id: ch02
      title: Julia's Warning
      blocks:
        - id: ch02-b01
          speaker: julia
          text: What did you do last night after you went home?
        - id: ch02-b02
          speaker: alonzo
          text: What I always do. It was too hot for sleep, so I went straight to the forest and bathed in one of those deep, dark pools by the river. I've been going there for months, but last night something strange happened. As I took my last plunge, I heard a voice singing. First it seemed to come from one side, then from another. It was sweeter than any nightingale, though I couldn't make out a single word.
        - id: ch02-b03
          speaker: alonzo
          text: I climbed out, dressed as quickly as I could, and searched every bush and tree near the water. I thought perhaps my friend was playing a trick on me, but no one was there. When I reached home, my friend was fast asleep.
        - id: ch02-b04
          speaker: narrator
          text: Julia's face turned deathly pale. Her whole body shook as if she were cold. Since childhood, she had heard of terrible beings hidden in the forests and beneath the riverbanks. Only powerful charms could keep them away. Had one of them enchanted Alonzo? Could that lovely voice belong to the dreaded Yara, who hunted young men just before they married?
        - id: ch02-b05
          speaker: narrator
          text: Fear choked Julia for a moment. Then she managed to speak.
        - id: ch02-b06
          speaker: julia
          text: Alonzo, will you promise me something?
          emotion: fearful
        - id: ch02-b07
          speaker: alonzo
          text: What do you want me to promise?
        - id: ch02-b08
          speaker: julia
          text: It concerns our happiness together.
        - id: ch02-b09
          speaker: alonzo
          text: Oh, then it must be serious. Of course I promise. Tell me what it is.
        - id: ch02-b10
          speaker: narrator
          text: Julia lowered her voice to a whisper.
        - id: ch02-b11
          speaker: julia
          text: Promise me you'll never bathe in those pools again.
          emotion: fearful
        - id: ch02-b12
          speaker: alonzo
          text: But why, queen of my soul? I've always gone there, and nothing has ever hurt me, flower of my heart.
        - id: ch02-b13
          speaker: julia
          text: Nothing has hurt you yet. If you refuse, I'll go mad with fear. Please promise me.
          emotion: fearful
        - id: ch02-b14
          speaker: alonzo
          text: What's wrong? You're so pale. Why are you this frightened?
        - id: ch02-b15
          speaker: julia
          text: You heard the song, didn't you?
          emotion: fearful
        - id: ch02-b16
          speaker: alonzo
          text: Even if I did, how could a song harm me? It was the loveliest one I've ever heard.
        - id: ch02-b17
          speaker: julia
          text: First comes the song. Then the apparition. And after that... after that...
          emotion: fearful
        - id: ch02-b18
          speaker: alonzo
          text: I don't understand. What comes after that?
        - id: ch02-b19
          speaker: julia
          text: Death.
          emotion: fearful
        - id: ch02-b20
          speaker: narrator
          text: Alonzo stared at her. Had Julia truly lost her senses? She had never spoken this way before. Before he could gather his thoughts, she went on.
        - id: ch02-b21
          speaker: julia
          text: That's why I'm begging you to stay away. At least don't go back until we're married.
        - id: ch02-b22
          speaker: alonzo
          text: Why would marriage make any difference?
        - id: ch02-b23
          speaker: julia
          text: After we're married, the danger will be gone. Then you may bathe there as often as you wish.
        - id: ch02-b24
          speaker: alonzo
          text: But what are you so afraid of?
        - id: ch02-b25
          speaker: julia
          text: The voice you heard was the Yara's. I know you'll laugh, but it's true.
          emotion: fearful
        - id: ch02-b26
          speaker: narrator
          text: Alonzo burst into loud laughter. The sound was so harsh that Julia drew back, shuddering. He seemed unable to stop, and the longer he laughed, the paler she grew.
        - id: ch02-b27
          speaker: julia
          text: Oh, heaven! You've seen her. You've seen her! What am I going to do?
          emotion: fearful
        - id: ch02-b28
          speaker: narrator
          text: Though she spoke in a faint whisper, Alonzo heard her. Still laughing too hard to answer, he shook his head.
        - id: ch02-b29
          speaker: julia
          text: You may not know it, but you have. No one laughs that way unless he's seen the Yara.
          emotion: fearful
        - id: ch02-b30
          speaker: narrator
          text: Julia threw herself to the ground and wept bitterly. At once Alonzo became serious. He knelt beside her and gently helped her up.
        - id: ch02-b31
          speaker: alonzo
          text: Don't cry, my angel. I'll promise anything you ask. Only let me see you smile again.
        - id: ch02-b32
          speaker: narrator
          text: With a great effort, Julia stopped sobbing and rose.
        - id: ch02-b33
          speaker: julia
          text: Thank you. My heart already feels lighter. I know you'll try to keep your word and stay away from the forest. But the Yara is very powerful. Her voice can make a man forget everything else. I've seen what happens. More than one woman who was about to marry now lives alone with a broken heart.
          emotion: fearful
        - id: ch02-b34
          speaker: julia
          text: If you ever return to the pool where you heard her, promise you'll take this with you.
        - id: ch02-b35
          speaker: narrator
          text: Julia opened a strangely carved box. From it she took a seashell gleaming with many colors, and she sang softly into it.
        - id: ch02-b36
          speaker: julia
          text: As soon as you hear the Yara sing, hold this shell to your ear. You'll hear my song instead. I can't be certain, but perhaps I may be stronger than she is.
        - id: ch02-b37
          speaker: narrator
          text: It was late when Alonzo set out for home. Moonlight lay on the distant river, making the water look cool and inviting. The forest trees seemed to reach out their arms and beckon him. But Alonzo turned firmly away and went home to bed.
        - id: ch02-b38
          speaker: narrator
          text: The struggle had been hard. The next day, Julia's joy and relief were his reward. He told her that once he had resisted the temptation, the danger was over. Julia knew the magic of the Yara's face and voice better than he did, so before he left, she made him promise again.
    - id: ch03
      title: The Woman in the Ferns
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: For three nights, Alonzo kept his word. He did not believe in the Yara. To him, every tale about her was nonsense. But he could not bear the thought of Julia's tears if he admitted that he had gone back to the forest. Even so, the song kept ringing in his ears, and each day it grew louder.
        - id: ch03-b02
          speaker: narrator
          text: On the fourth night, the forest pulled at him so strongly that neither Julia nor his promises could hold him. At eleven o'clock, he entered the cool darkness beneath the trees and followed the path to the river. For the first time, Julia's warnings came back to him. Though he had laughed at them before, he now watched the bushes with a new feeling of fear.
        - id: ch03-b03
          speaker: narrator
          text: At the river, he stopped and looked around. He felt as if someone were watching him, and he wanted to prove it was only his imagination. Bright moonlight fell on every tree. He saw nothing but his own shadow and heard nothing but the stream rippling past.
        - id: ch03-b04
          speaker: narrator
          text: Alonzo took off his clothes and prepared to dive. Then something made him turn. At that very moment, the moon came out from behind a cloud. Its light revealed a beautiful woman with golden hair, half hidden among the ferns.
        - id: ch03-b05
          speaker: narrator
          text: In a single bound, Alonzo snatched up his mantle and fled along the path. At every step, he feared a hand would fall upon his shoulder. Only when he had passed the last tree and reached the open plain did he dare look back. A white figure seemed to remain there, waving her arms. Alonzo ran even harder and did not stop until he was safe in his room.
        - id: ch03-b06
          speaker: narrator
          text: At the first light of dawn, he returned to search for some trace of the Yara. He examined every patch of bushes and looked into every tree. He found nothing. The only voices belonged to parrots, whose ugly cries would drive anyone away.
        - id: ch03-b07
          speaker: alonzo
          text: I must be losing my mind. I dreamed all that foolishness.
        - id: ch03-b08
          speaker: narrator
          text: He went back to the city and began his day's work. But either the work was harder than usual or Alonzo was ill, because he could not keep his mind on it. Everyone he met asked what had happened to make him look so pale and frightened.
        - id: ch03-b09
          speaker: alonzo
          text: I must have a fever. Taking a cold bath when I felt so hot was probably dangerous.
        - id: ch03-b10
          speaker: narrator
          text: Yet even as he told himself this, he knew he was counting the hours until night, when he could return to the forest.
        - id: ch03-b11
          speaker: narrator
          text: That evening, he went as usual to the house covered in vines. He would have done better to stay away. His pale face and strange behavior told Julia that something terrible had happened. Alonzo refused to answer her questions. He would only promise to explain everything the next day.
        - id: ch03-b12
          speaker: narrator
          text: Pretending to have a violent headache, he left much earlier than usual and hurried home. He took down a pistol, loaded it, and placed it in his belt. A little before midnight, he crept outside on tiptoe so that no one would wake. Then he hurried down the road to the forest.
