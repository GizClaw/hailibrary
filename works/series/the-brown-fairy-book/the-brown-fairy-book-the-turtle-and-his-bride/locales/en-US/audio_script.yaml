  chapters:
    - id: ch01
      title: A Promise for Spring
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a turtle who lived in a large camp beside a great river. The river began high among the snows and ran south until it reached a sea where the water was always warm. Many kinds of people lived in that camp, including many other turtles.
        - id: ch01-b02
          speaker: narrator
          text: This turtle was kind and pleasant to all the other turtles. Still, he cared for none of them very deeply, and he was rather lonely. So he built himself a hut. He filled it with skins to sit on and made it the most comfortable hut for miles around. When everything was ready, he began looking among the young women for a wife.
        - id: ch01-b03
          speaker: narrator
          text: He took a long time to choose, because no turtle likes to be hurried. At last, he noticed one young woman who seemed prettier and more hardworking than all the others. One day he went into her home.
        - id: ch01-b04
          speaker: turtle
          text: Will you be my wife?
        - id: ch01-b05
          speaker: narrator
          text: The question startled her so much that she dropped the beaded slipper she was making and stared at him. She wanted to laugh because the idea seemed absurd. But she was kind and polite, so she kept her face as serious as she could.
        - id: ch01-b06
          speaker: young_woman
          text: How could you provide for a family? When the whole camp moves, you won't even be able to keep up with everyone else.
        - id: ch01-b07
          speaker: turtle
          text: I can move as fast as any of them.
        - id: ch01-b08
          speaker: narrator
          text: The turtle tossed his head. He was deeply offended, though he hid it from her. He begged and pleaded until she finally agreed to marry him, even though she did not want to.
        - id: ch01-b09
          speaker: young_woman
          text: You'll have to wait until spring. I need to make plenty of slippers and dresses for myself. I won't have much time for that afterward.
        - id: ch01-b10
          speaker: narrator
          text: The turtle did not like this answer, but he knew more talk would do no good.
        - id: ch01-b11
          speaker: turtle
          text: Then I'll go to war and capture some prisoners. I'll be gone for several months. When I come back, I expect you to be ready to marry me.
        - id: ch01-b12
          speaker: narrator
          text: He returned to his hut and began preparing at once. First he gathered all his relatives. He asked them to join him in making war against the people of a nearby village. The turtles were tired of having nothing to do, so they quickly agreed. The next day, the whole tribe set out from camp.
        - id: ch01-b13
          speaker: narrator
          text: The young woman stood in her doorway as they passed. They moved so slowly that she laughed aloud. Her turtle lover marched at the front, and her laughter made him furious.
        - id: ch01-b14
          speaker: turtle
          text: Four days from now, you'll be crying instead of laughing. There will be hundreds of miles between us by then!
          emotion: angry
        - id: ch01-b15
          speaker: narrator
          text: The young woman had promised to marry him only so he would leave her alone.
        - id: ch01-b16
          speaker: young_woman
          text: Four days? By then, you'll barely be out of sight.
        - id: ch01-b17
          speaker: turtle
          text: I meant four years, not four days! Whatever happens, I'll be home by then.
    - id: ch02
      title: The Fallen Tree
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The turtle army marched on. One day, they felt as if they must have traveled halfway around the earth, although they were not even four miles from camp. Then they found a huge tree lying across their path. They gazed at it in dismay. The oldest turtles put their heads together and considered what to do.
        - id: ch02-b02
          speaker: turtle_scout_1
          text: Couldn't we get around the top of it?
        - id: ch02-b03
          speaker: turtle_scout_2
          text: That would take us years! Look at those tall green branches going everywhere. Once they tangled around us, we'd never escape.
        - id: ch02-b04
          speaker: turtle_scout_3
          text: Then let's go around the bottom.
        - id: ch02-b05
          speaker: turtle_scout_4
          text: How? The roots have dug a deep hole, and there's a high bank above it. No, we have only one choice. We must burn a large opening through the trunk.
        - id: ch02-b06
          speaker: narrator
          text: So the turtles tried to burn an opening. But the trunk was very thick, and the fire would not burn all the way through.
        - id: ch02-b07
          speakers: [old_turtle, turtle_scout_1, turtle_scout_2, turtle_scout_3]
          ensemble: chorus
          text: This is hopeless. We'll have to turn back. No one needs to know. We've been gone long enough to have had all kinds of adventures.
        - id: ch02-b08
          speaker: narrator
          text: The whole company started home. The return took even longer because the journey had left them tired and footsore. As they neared the camp, they gathered their courage and began singing a war song.
        - id: ch02-b09
          speaker: narrator
          text: The villagers came rushing out to see what spoils the turtles had won. But when they came near, every turtle grabbed someone by the wrist.
        - id: ch02-b10
          speakers: [old_turtle, turtle_scout_1, turtle_scout_2, turtle_scout_3]
          ensemble: chorus
          text: You are our spoils. You are our prisoners!
        - id: ch02-b11
          speaker: narrator
          text: The turtle leader happened to seize the young woman he was supposed to marry.
        - id: ch02-b12
          speaker: turtle
          text: Now that I've caught you, I'm keeping you.
        - id: ch02-b13
          speaker: narrator
          text: Everyone was angry, especially the young woman. In her heart, she decided she would take revenge. For now, though, the turtles were too strong. Their prisoners had to put on their finest slippers and brightest clothes, then dance a war dance while the turtles sang.
        - id: ch02-b14
          speaker: narrator
          text: The dance went on and on. It seemed it might never end. Then the turtle leading the song suddenly began a loud chant.
        - id: ch02-b15
          speaker: turtle
          text: Whoever comes here will die, will die!
          emotion: angry
        - id: ch02-b16
          speaker: narrator
          text: The dancers were terrified. They burst through the ring of turtles and ran back to the village. The turtles followed them, very slowly.
    - id: ch03
      title: The Broken Promise
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: On the way, the turtle leader met a man from the village.
        - id: ch03-b02
          speaker: villager
          text: The woman who promised to marry you has married someone else.
        - id: ch03-b03
          speaker: turtle
          text: Is that true? Then I must meet this man.
        - id: ch03-b04
          speaker: narrator
          text: As soon as the villager was gone, the turtle stopped. He took a bundle of fringes and ornaments from his back and hung them all over himself. They rattled with every step. When he came close to the woman's hut, he called out.
        - id: ch03-b05
          speaker: turtle
          text: I've come for the woman who promised to be my wife.
        - id: ch03-b06
          speaker: husband
          text: The turtle is here. What are we going to do?
        - id: ch03-b07
          speaker: young_woman
          text: Let me handle him.
        - id: ch03-b08
          speaker: narrator
          text: At that moment, the turtle entered and grabbed her wrist.
        - id: ch03-b09
          speaker: turtle
          text: You are coming with me.
        - id: ch03-b10
          speaker: young_woman
          text: You broke your promise. You said you would return soon, but you've been gone more than a year. How could I know you were still alive?
        - id: ch03-b11
          speaker: narrator
          text: Her husband found his courage and quickly spoke up.
        - id: ch03-b12
          speaker: husband
          text: You also promised to fight a war and bring home prisoners. You haven't done that either.
        - id: ch03-b13
          speaker: turtle
          text: I did go to war, and I took many prisoners.
          emotion: angry
        - id: ch03-b14
          speaker: narrator
          text: The turtle angrily pulled out his knife.
        - id: ch03-b15
          speaker: turtle
          text: If she won't be my wife, she won't be yours. I'll cut her in half. You can have one half, and I'll take the other.
          emotion: angry
        - id: ch03-b16
          speaker: husband
          text: Half a woman is no use to me. If you want her that badly, take her.
        - id: ch03-b17
          speaker: narrator
          text: So the turtle carried the young woman away to his own hut, with all his relatives following behind him.
    - id: ch04
      title: The Iron Pot
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The young woman saw that being sulky would get her nowhere. So she acted as though she was delighted to be rid of her husband and pleased to be with the turtle. All the while, she was trying to think of a way to escape him. At last, she remembered that one of her friends owned a large iron pot.
        - id: ch04-b02
          speaker: narrator
          text: When the turtle went into his room to put away his fringes, she hurried to her neighbor's hut and brought back the pot. She filled it with water and hung it over the fire. The water had just begun to bubble and hiss when the turtle came in.
        - id: ch04-b03
          speaker: turtle
          text: What are you doing?
        - id: ch04-b04
          speaker: narrator
          text: He was always afraid of anything he did not understand.
        - id: ch04-b05
          speaker: young_woman
          text: I'm only heating some water. Do you know how to swim?
        - id: ch04-b06
          speaker: turtle
          text: Of course I can swim. Why would you ask me that?
        - id: ch04-b07
          speaker: narrator
          text: Now he was more suspicious than ever.
        - id: ch04-b08
          speaker: young_woman
          text: I thought you might want a wash after such a long journey. The roads are muddy after the winter rains. I could scrub your shell until it shines again.
        - id: ch04-b09
          speaker: turtle
          text: I am rather muddy. When you're fighting, you can't stop to choose a clean path. Yes, I would feel much better if you washed my back.
        - id: ch04-b10
          speaker: narrator
          text: The young woman gave him no time to change his mind. She seized him by the shell and dropped him straight into the pot. He sank to the bottom and died at once.
        - id: ch04-b11
          speaker: narrator
          text: The other turtles were standing at the door. They saw their leader disappear into the pot. As soldiers, they believed it was their duty to follow wherever he had gone. One after another, they jumped in and died too.
        - id: ch04-b12
          speaker: narrator
          text: Only one young turtle stayed behind. He watched and waited, but none of his friends came out again. That frightened him. He hurried as fast as he could to a clump of bushes, and from there he made his way to the river.
        - id: ch04-b13
          speaker: narrator
          text: His only thought was to get as far as possible from that dreadful hut. So he gave himself to the river and let the current carry him wherever it was going. Farther and farther he drifted. At last, one day, he reached the sea where the water was always warm. If he is not dead, you may still meet him there.
