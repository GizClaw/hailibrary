audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 温暖庄重，以从容而清晰的语气讲述古老命运故事, timbre: 清澈浑厚, pace: 舒缓, pitch: 中音}
    fox:
      display_name: 狐狸
      tts: {delivery: 狡黠善变，装腔作势时格外自然, timbre: 轻快灵巧, pace: 明快, pitch: 中高音}
    sledge_driver:
      display_name: 雪橇夫
      tts: {delivery: 朴实警觉，遇到怪事时又惊又疑, timbre: 粗犷结实, pace: 适中, pitch: 中低音}
    bear:
      display_name: 熊
      tts: {delivery: 粗声粗气，骄傲急躁又容易上当, timbre: 低沉浑厚, pace: 稍慢, pitch: 低音}
    foot:
      display_name: 狐狸的脚
      tts: {delivery: 干脆利落，随时准备奔逃, timbre: 清亮有力, pace: 明快, pitch: 中高音}
    ear:
      display_name: 狐狸的耳朵
      tts: {delivery: 机警专注，回答简洁, timbre: 轻细清晰, pace: 适中, pitch: 高音}
    nose:
      display_name: 狐狸的鼻子
      tts: {delivery: 灵敏自信，语气笃定, timbre: 明亮细巧, pace: 适中, pitch: 中高音}
    tail:
      display_name: 狐狸的尾巴
      tts: {delivery: 忠诚警觉，带着迫切的提醒, timbre: 柔韧清晰, pace: 稍快, pitch: 中音}
    lapp:
      display_name: 拉普人
      tts: {delivery: 做买卖时谨慎克制，受骗后怒气冲冲, timbre: 坚实沧桑, pace: 适中, pitch: 中低音}
    boat_mender:
      display_name: 修船人
      tts: {delivery: 忙碌不耐烦，说话简短生硬, timbre: 朴实粗重, pace: 明快, pitch: 中低音}
    pike:
      display_name: 梭子鱼
      tts: {delivery: 热切好胜，抢先时十分得意, timbre: 尖亮清脆, pace: 快, pitch: 中高音}
    eel:
      display_name: 鳗鱼
      tts: {delivery: 热心顺滑，急着展示自己, timbre: 细柔流畅, pace: 快, pitch: 高音}
    perch:
      display_name: 鲈鱼
      tts: {delivery: 自信爽快，乐意相助, timbre: 清脆轻巧, pace: 明快, pitch: 中高音}
    trout:
      display_name: 鳟鱼
      tts: {delivery: 满怀期待，颇为自信, timbre: 清澈温和, pace: 适中, pitch: 中音}
    grouse:
      display_name: 松鸡
      tts: {delivery: 客气平实，不慌不忙, timbre: 柔和微哑, pace: 适中, pitch: 中音}
    bee:
      display_name: 蜜蜂
      tts: {delivery: 礼貌爽利，回答轻快, timbre: 细小明亮, pace: 快, pitch: 高音}
    asp:
      display_name: 蝰蛇
      tts: {delivery: 谨慎而真诚，愿意帮助别人, timbre: 轻柔丝滑, pace: 舒缓, pitch: 中低音}
  chapters:
    - id: ch01
      title: 鱼雪橇
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，有只狐狸趴在洞口，窥望不远处的大路。他心里无聊得发闷，脾气也越来越坏，只盼能看到一件有趣的事。可他等了很久，四下仿佛都睡着了，连头顶也不见一只鸟飞过。狐狸厌烦极了，正要转身回洞，雪地上忽然传来脚步声。他兴冲冲地伏到路边，听见挽具上的铃铛，立刻认出那是一个赶驯鹿雪橇的人。
        - id: ch01-b02
          speaker: fox
          text: 要是我装死，会发生什么呢？不管怎样，总算能遇上一场奇事！
        - id: ch01-b03
          speaker: narrator
          text: >-
            他伸直身子，躺到车夫一定看得见、驯鹿却踩不到的地方。事情果然如他所料。车夫一看见路旁直挺挺躺着一只漂亮狐狸，猛地勒住驯鹿，跳下车，把他扔到雪橇底部。周围全是用绳子牢牢捆好的货物。狐狸摔得骨头生疼，却连一根毛也不动。车夫丝毫没有起疑，重新坐上座位，欢欢喜喜地赶车前行。没走多远，靠在车边的狐狸便设法滑下去，又直挺挺地躺在雪上。车夫看见以后，只好再次停车，把他捡起来，放进拴在后面的另一辆雪橇。这天附近城镇正赶集，男人有许多货物要卖，身后拖着长长一列车子。
        - id: ch01-b04
          speaker: narrator
          text: >-
            车队继续前行，林中的响动让男人回过头，恰好看见狐狸又砰地摔在冻雪上。
        - id: ch01-b05
          speaker: sledge_driver
          text: 这畜生准是中了邪！
          emotion: surprised
        - id: ch01-b06
          speaker: narrator
          text: >-
            这回，车夫把狐狸丢进最后一辆雪橇。那里满载着鱼，正是这个狡猾家伙想去的地方。他轻轻扭动身子爬到前头，咬断连接前车的绳索，让鱼雪橇独自留在路中央。车队实在太长，拉普人很久都没有察觉，险些就这样直接进城。偏偏天空忽然落起雪来，他才下车把遮货的布一一系紧，免得货物淋湿。等走到长队末尾，他终于发现，载着鱼和狐狸的那辆雪橇不见了。
        - id: ch01-b07
          speaker: narrator
          text: >-
            他赶紧卸下一头驯鹿，骑着它原路返回，果然在路中央找到了雪橇。可狐狸紧贴着绳套咬断了绳子，连一截能重新捆扎的绳头都没留下。车虽然找到了，却根本没法拖走。这时狐狸正快活得不得了。雪橇刚一脱开，他便在为集市码得整整齐齐的鱼堆里翻找起来，挑出自己最爱的一条，稳稳叼在嘴里，把雪橇留在身后，独自跑进森林。
    - id: ch02
      title: 熊的两次灾祸
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 过了一阵，狐狸碰见一头又饿又暴躁的熊。熊一看见鱼，马上拦住他。
        - id: ch02-b02
          speaker: bear
          text: 狐狸先生，你从哪里弄来的鱼？
        - id: ch02-b03
          speaker: fox
          text: >-
            不远处有条小河，就在小精灵住处旁边。我把尾巴伸进水里，鱼自己便咬了上来。
        - id: ch02-b04
          speaker: bear
          text: 鱼肯咬你的尾巴，当然也会咬我的。
        - id: ch02-b05
          speaker: fox
          text: 那是当然，熊爷爷。只怕你没有耐心，受不了我受的苦。
        - id: ch02-b06
          speaker: bear
          text: 我怎么会受不了？别说傻话，快带路！
        - id: ch02-b07
          speaker: narrator
          text: >-
            狐狸领他来到一条小河边。春日阳光下，温暖处的水面只结着薄冰。
        - id: ch02-b08
          speaker: fox
          text: 小精灵在这里洗澡。你把尾巴伸进去，鱼就会咬住。千万别心急，不然什么都捞不到。
        - id: ch02-b09
          speaker: narrator
          text: >-
            狐狸小跑着离开，却只走到熊看不见的地方，躲在那儿暗中等候。熊站在河岸，一动不动，把尾巴深深浸在水里。太阳很快落山，天气一下冷得刺骨。河面迅速结起冰来，熊的尾巴也被牢牢冻住，紧得像叫铁钳夹住了一样。狐狸探头一看，所有事情都照着自己的盘算发生了，这才放声呼喊。
        - id: ch02-b10
          speaker: fox
          text: 乡亲们，快带弓箭和长矛来！有头熊在你们的小河里偷鱼！
        - id: ch02-b11
          speaker: narrator
          text: >-
            转眼之间，四下挤满了小小的精灵。每个精灵都带着一张小弓，还有一支连婴孩拿着都嫌小的短矛。可那些箭和矛扎起人来很厉害，熊心里再清楚不过。他吓得猛力一挣，竟把尾巴生生扯断，整个身子滚了出去。他四条腿能跑多快便跑多快，一头逃进森林。狐狸看见这副模样，捧着肚子笑个不停，随后又朝另一个方向飞奔而去。
        - id: ch02-b12
          speaker: narrator
          text: >-
            狐狸钻进枞树根下的洞里，捧起一只后脚，做起一件古怪的事。他问脚，若有人出卖自己，它会怎么办。
        - id: ch02-b13
          speaker: foot
          text: 我会拼命快跑，让他怎么也捉不到你。
        - id: ch02-b14
          speaker: narrator
          text: 狐狸又问耳朵同样的问题。
        - id: ch02-b15
          speaker: ear
          text: 我会用心细听，把他的打算全听清楚。
        - id: ch02-b16
          speaker: narrator
          text: 接着，狐狸问起鼻子。
        - id: ch02-b17
          speaker: nose
          text: 我会使劲闻，在他还很远时就知道他来了。
        - id: ch02-b18
          speaker: narrator
          text: 最后，狐狸问自己的尾巴。
        - id: ch02-b19
          speaker: tail
          text: >-
            我会替你把方向掌稳，很快逃出他的手心。咱们走吧，我觉得危险就在附近。
          emotion: fearful
        - id: ch02-b20
          speaker: narrator
          text: >-
            可洞里待着太舒服，狐狸并不急着听从尾巴的劝告。等他察觉不妙，已经迟了。熊从另一条路绕过来，猜到仇敌藏在树根下，便用爪子不停抓挠。狐狸尽力把身子缩小，仍有一小截尾巴露在外面。熊一口咬住，死也不肯松开。狐狸把利爪深深抠进地面，可他的力气敌不过熊，只能一点一点被拖出洞。熊把狐狸整个甩到自己的颈背上，嘴里始终叼着那条尾巴，就这样沿路走去。
        - id: ch02-b21
          speaker: narrator
          text: 路边树桩上，一只羽色鲜艳的啄木鸟正笃笃敲着。
        - id: ch02-b22
          speaker: fox
          text: 唉，我从前给所有鸟儿涂上鲜艳颜色，那才是好日子啊！
        - id: ch02-b23
          speaker: bear
          text: 老伙计，你在说什么？
        - id: ch02-b24
          speaker: fox
          text: 我什么也没说。你赶快把我带回洞里吃掉吧。
          emotion: sad
        - id: ch02-b25
          speaker: narrator
          text: >-
            熊不再说话，只顾想着即将入口的晚餐。两个家伙继续上路，来到另一棵树旁，树上也有一只啄木鸟在敲打。狐狸又自言自语，把刚才那声叹息原样说了一遍。熊听进了心里，突然想到，自己也可以拥有鸟儿那样鲜艳的颜色。
        - id: ch02-b26
          speaker: bear
          text: 你也给我涂上颜色，不行吗？
        - id: ch02-b27
          speaker: narrator
          text: 狐狸摇摇头。他一向爱演戏，就算旁边没人看也一样。
        - id: ch02-b28
          speaker: fox
          text: >-
            你太怕疼，性子又急，吃不了涂色的苦。你得先挖坑，用柳条搓绳，打下木桩，灌满沥青，最后还要点火。这些事你一定做不来。
        - id: ch02-b29
          speaker: bear
          text: 活儿再难也不要紧，每一样我都能做！
        - id: ch02-b30
          speaker: narrator
          text: 熊立刻刨出一个足以容身的深坑。狐狸这才装作改了主意。
        - id: ch02-b31
          speaker: fox
          text: 看来是我错怪你了。坐到坑边，让我把你捆起来。
        - id: ch02-b32
          speaker: narrator
          text: >-
            熊坐到坑边，狐狸跳上他的背，用柳条绳一道道交叉着把他捆住，然后点燃坑里的沥青。火焰刹那间窜起来，烧着柳条，也烧着熊粗硬的毛。可熊一动不动。他以为狐狸正在把鲜艳颜色揉进皮毛，自己很快就会美得像开满花的整片草地。直到火焰越来越烫，他才不安起来，两只脚来回换着踩，终于忍不住低声哀求。
        - id: ch02-b33
          speaker: bear
          text: 老伙计，好像越来越热了。
        - id: ch02-b34
          speaker: fox
          text: 我就知道，你受不了那些小鸟受过的痛。
        - id: ch02-b35
          speaker: narrator
          text: >-
            熊最受不了别人说他还没有一只鸟勇敢，于是咬紧牙关，决心无论多痛也不再开口。这时，最后一道柳条绳已经被烧断。狐狸用力一推，把这个倒霉的家伙推进草丛，自己飞快跑进森林藏了起来。过了一阵，他小心翼翼地溜回来查看。事情果然和他预料的一样，原地只剩几根烧焦的骨头。狐狸把骨头一根根捡起，装进袋子，再把袋子背到背上。
    - id: ch03
      title: 一袋焦骨头
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 狐狸在路上遇见另一个赶着驯鹿的拉普人。他故意把袋中骨头摇得喀啦作响。
        - id: ch03-b02
          speaker: narrator
          text: 男人听着像是金银，便客气地询问袋里装了什么。
        - id: ch03-b03
          speaker: lapp
          text: 你好，朋友！什么东西响得这样古怪？
        - id: ch03-b04
          speaker: fox
          text: 是父亲留给我的全部财宝。你想和我做笔买卖吗？
        - id: ch03-b05
          speaker: lapp
          text: 买卖可以做，不过先让我看看你究竟有多少钱。
        - id: ch03-b06
          speaker: fox
          text: >-
            袋口已经封死，不能打开。你若把那三头驯鹿给我，整袋财宝就全归你。
        - id: ch03-b07
          speaker: narrator
          text: >-
            拉普人心里觉得这笔交易不大妥当，可狐狸说话时摆出一副十拿九稳的派头，他的疑虑慢慢全消失了。他点点头，伸手表示成交。狐狸把沉甸甸的袋子放进他手中，又从驯鹿队里解下自己选中的三头。正要赶着它们朝相反方向离开时，狐狸忽然像是想起什么，猛地回过头。
        - id: ch03-b08
          speaker: fox
          text: >-
            差点忘了！你得走出至少五英里，翻过那边的山丘，才能开袋。提前打开，金银就会全变成焦骨头。
        - id: ch03-b09
          speaker: narrator
          text: >-
            狐狸挥鞭赶动驯鹿，很快便消失了。起初，拉普人只要听见袋中喀啦作响就很满足。他想着这笔交易多么划算，又盘算着拿钱去买各种东西。可过了一会儿，只凭声音已经不能叫他满意。连自己究竟有多富都不知道，计划又有什么用？也许银子很多，金子很少，也许金子很多，银子很少。谁说得准呢？他当然不会把钱全倒出来清点，那样也许会招来坏运气。可是，只偷看一眼总不会有害吧？拉普人慢慢撕开封口，解下绳结。袋里哪有什么财宝，眼前分明是一堆烧焦的骨头。
        - id: ch03-b10
          speaker: narrator
          text: >-
            拉普人这才知道上了当。他愤怒地把袋子摔在地上，踩着雪鞋，以最快的速度追赶狐狸。狐狸早已猜到会有这一出，一路都在留心张望。他刚看见远处有个小黑点朝自己奔来，便希望追赶者的雪鞋折断。就在那一瞬间，两只雪鞋果真双双断成两截。拉普人并不知道这是狐狸做的手脚，只得停下来，回去牵出另一头驯鹿，骑上它再次追赶仇敌。狐狸很快听见身后的动静，这回又希望那头驯鹿跌倒，折断一条腿。事情果然如此。拉普人眼看再追也没有希望，终于明白自己根本不是狐狸的对手。
        - id: ch03-b11
          speaker: narrator
          text: >-
            狐狸从此安安稳稳地赶路，直到回到储藏食物的洞穴。他这才开始琢磨，要请谁帮忙杀死偷来的三头驯鹿。他虽然有本事把驯鹿骗到手，身子却太小，根本杀不死它们。狐狸想了一会儿，又觉得这件事其实很容易。附近一棵树上有只松鼠正在看他，他便叫松鼠捎去口信，请森林里所有强盗野兽都来帮忙。不到半个钟头，枝条猛烈折断的声响便从林中传来。熊、狼、蛇、老鼠、青蛙和许多动物挤作一团，一同涌到洞前。
        - id: ch03-b12
          speaker: narrator
          text: >-
            大家听完召集的缘由，都答应各尽一份力。熊从颈上取下弩，射中一头驯鹿的下巴。从那天直到现在，每头驯鹿的下巴都有一道同样的印记，人们一直把它叫作“熊箭”。狼一箭射中驯鹿的大腿，他的箭痕也留到了今天。老鼠、蝰蛇和其余动物也纷纷动手，就连青蛙都射了一箭。最后，三头驯鹿全都死了。只有狐狸什么也没做，始终站在旁边看着。
        - id: ch03-b13
          speaker: fox
          text: 我得去小河边洗洗身子。
        - id: ch03-b14
          speaker: narrator
          text: >-
            狐狸其实浑身上下干干净净。他走到河岸下面，藏在一块石头后，随即发出最骇人的尖叫。动物们吓得向四面八方逃散。只有老鼠和白鼬留在原地，因为他们觉得自己实在太小，谁也不会注意。狐狸继续尖叫，直到确信其他动物都跑到了安全的远处，才从石后爬出来，走向三头驯鹿。如今这些猎物全归他一个了。他拾来一捆树枝准备生火，正要烤一块肉排，受骗的拉普人忽然赶到。男人一路奔波，又焦急又激动，累得气喘吁吁。
        - id: ch03-b15
          speaker: lapp
          text: >-
            你在这里做什么？为什么用骨头骗我？驯鹿已经到手，你为什么还把它们杀了？
          emotion: angry
        - id: ch03-b16
          speaker: fox
          text: >-
            亲爱的兄弟，这场祸事不能怪我。是那些伙伴不听我的苦苦哀求，硬把驯鹿杀了。
          emotion: sad
        - id: ch03-b17
          speaker: narrator
          text: >-
            拉普人没有回答，因为石头后面忽然闪过一片白色，吸引了他的目光。白鼬正和老鼠一起伏在那里。男人急忙抓起悬在火堆上方的铁钩，朝白鼬掷去。白鼬躲得太快，钩子只擦过尾尖。从那天起，白鼬的尾尖便一直是黑色的。男人又捡起一根烧了一半的木柴，朝老鼠扔去。木柴没有伤到他，却把那身漂亮的白毛抹得乌黑，从此怎么洗也洗不干净。拉普人若肯放过他们，倒会聪明一些。就在他的注意力离开狐狸时，狐狸瞅准机会，悄无声息地溜走了。等男人回过头来，身边已经谁也没有。
    - id: ch04
      title: 岛上的鱼儿
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            狐狸悄悄走到一丛茂密的灌木后面，这才拔腿飞奔。他一直跑到一条河边，才看见有个男人正在那里修船。狐狸想出一个新主意，便用两条后腿坐直，仰头望着男人的脸，故意大声叫喊起来。
        - id: ch04-b02
          speaker: fox
          text: 我真希望，真希望自己也有一条船可以修！
        - id: ch04-b03
          speaker: boat_mender
          text: 别再胡说！否则我就把你扔进河里洗澡。
          emotion: angry
        - id: ch04-b04
          speaker: fox
          text: 我真希望，我实在希望自己也有一条船可以修！
        - id: ch04-b05
          speaker: narrator
          text: >-
            狐狸像是根本没有听见警告，又把愿望说了一遍。修船人终于发起火来，一把揪住他的尾巴，把他远远扔进河中，正好落在一座小岛边。这恰恰是狐狸想要的。他轻轻松松爬上岛，坐在高处，呼唤鱼儿快来驮自己过河。鱼儿听见喊声，纷纷离开睡觉的石缝和觅食的水潭，争先恐后地游来，都想看看谁能最早赶到小岛。
        - id: ch04-b06
          speaker: pike
          text: 我赢了！狐狸，快跳上来，我转眼就能送你到对岸。
          emotion: happy
        - id: ch04-b07
          speaker: fox
          text: 谢谢，不必了。你的背太单薄，会被我压断。
        - id: ch04-b08
          speaker: eel
          text: 那就试试我的背吧。
        - id: ch04-b09
          speaker: fox
          text: 也不行。我会从你头上滑下去，淹死在水里。
        - id: ch04-b10
          speaker: perch
          text: 骑在我背上，你绝不会滑下去。
        - id: ch04-b11
          speaker: fox
          text: 不会滑，可你实在太粗糙了。
        - id: ch04-b12
          speaker: trout
          text: 你总挑不出我的毛病吧。
        - id: ch04-b13
          speaker: fox
          text: 我的天哪，你也来了？可我还是不敢坐你的背。
          emotion: surprised
        - id: ch04-b14
          speaker: narrator
          text: 这时，一条漂亮的鲑鱼缓缓游来。狐狸一眼看中了他。
        - id: ch04-b15
          speaker: fox
          text: 对，我要找的就是你。再靠近些，别让我弄湿了脚。
        - id: ch04-b16
          speaker: narrator
          text: >-
            鲑鱼紧贴着岛岸游来。刚一碰到岸边，狐狸便忽然伸出利爪，一把擒住他，拖出水面，穿在烤叉上。狐狸生起火来，又架起一锅水。等一切备妥，水也渐渐发热，他便把鲑鱼扑通一声放进锅里，耐心等着。狐狸估摸鲑鱼快要煮熟了，便俯下身去看。锅里的热水却忽然嘶的一响，猛地溅进他双眼，烫得他什么也看不见。他痛叫一声，往后跳开，坐在地上前后摇晃了好一阵。等疼痛稍微缓和，狐狸才站起身，摸索着沿路走去。
    - id: ch05
      title: 狐狸的新眼睛
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 狐狸沿路摸索着走，先遇见一只松鸡。松鸡看见他双眼受伤，便停下脚步，问他究竟出了什么事。
        - id: ch05-b02
          speaker: fox
          text: 请问，你身边有没有一双眼睛？
        - id: ch05-b03
          speaker: grouse
          text: 恐怕没有。
        - id: ch05-b04
          speaker: narrator
          text: 松鸡说完便继续赶路。过了一会儿，狐狸听见嗡嗡的声音。一线春日阳光引出了一只早早离巢的蜜蜂，正从他身边飞过。
        - id: ch05-b05
          speaker: fox
          text: 你碰巧有一双多余的眼睛吗？
        - id: ch05-b06
          speaker: bee
          text: 真遗憾，我只有自己正用着的这一双。
        - id: ch05-b07
          speaker: narrator
          text: 蜜蜂也飞走了。狐狸只得继续沿路摸索，走着走着，险些一脚绊在一条蝰蛇身上。那条蛇恰好正从路面缓缓滑过。
        - id: ch05-b08
          speaker: fox
          text: >-
            你若能告诉我去哪里找一双眼睛，我真是感激不尽。你手边该不会正好有一双能借我吧？
        - id: ch05-b09
          speaker: asp
          text: 如果只借一小会儿，我也许能想办法。不过我不能太久没有眼睛。
        - id: ch05-b10
          speaker: fox
          text: >-
            我只用很短一会儿。我的眼睛就在山丘后面，找到以后立刻还你。在这之前，你先替我保管这双吧。
        - id: ch05-b11
          speaker: narrator
          text: >-
            狐狸说完，便从自己头上挖出那双被热水烫坏的眼睛，塞进蝰蛇的眼窝里，又取出蝰蛇的眼睛，装到自己头上。新眼睛刚一安好，他便转身飞奔，把好心的蝰蛇远远甩在身后，只顾回过头高喊。
        - id: ch05-b12
          speaker: fox
          text: 只要世界还在，蝰蛇的眼睛就会一代又一代长在狐狸头上！
        - id: ch05-b13
          speaker: narrator
          text: >-
            从那以后，事情果然一直如此。你若仔细看看蝰蛇的眼睛，会发现它们全都像烧焦了一样。自从那只狐狸四处游荡，把遇见的每一个家伙都捉弄一番，距今已经过去千千万万年。可他烹煮鲑鱼的那一天，至今仍在蝰蛇身上留着清清楚楚的痕迹。
