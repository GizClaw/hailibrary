  chapters:
    - id: ch01
      title: The Sledge of Fish
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, a fox lay at the mouth of his hole and watched the road a little way off. He was bored and rather cross, and he hoped something might come along to amuse him. For a long time, nothing did. Everything seemed asleep. Not even a bird moved overhead. At last, just as the fox was turning away in disgust, he heard feet crossing the snow.
        - id: ch01-b02
          speaker: narrator
          text: He crouched eagerly beside the road. The harness bells told him that a man was driving a reindeer sledge.
        - id: ch01-b03
          speaker: fox
          text: What if I pretend to be dead? Something is bound to happen, and any adventure is better than none.
        - id: ch01-b04
          speaker: narrator
          text: The fox stretched out where the driver could not miss him, but where the reindeer would not step on him. Everything happened just as he hoped. The driver stopped sharply when he saw the beautiful animal lying stiff beside the road. He jumped down and tossed the fox into the bottom of his sledge, among goods tied tight with ropes.
        - id: ch01-b05
          speaker: narrator
          text: The fall made the fox's bones ache, but he never moved a muscle. The driver suspected nothing. He climbed back into his seat and drove merrily onward. Before they had gone far, the fox worked his way to the edge and slipped out. The driver soon saw him stretched across the snow. He stopped the reindeer, picked up the fox again, and put him into one of the sledges tied behind the first. It was market day in the nearest town, and the man had brought a long train of goods to sell.
        - id: ch01-b06
          speaker: narrator
          text: They went a little farther. A noise in the forest made the driver turn around just in time to see the fox land on the frozen snow with a thump.
        - id: ch01-b07
          speaker: sledge_driver
          text: That creature must be bewitched!
          emotion: surprised
        - id: ch01-b08
          speaker: narrator
          text: This time, he put the fox in the very last sledge, which was loaded with fish. That was exactly what the cunning creature wanted. He wriggled gently to the front and bit through the cord that joined the last sledge to the one ahead. The fish sledge stayed behind in the middle of the road.
        - id: ch01-b09
          speaker: narrator
          text: The line of sledges was so long that the Lapp did not notice the loss. He might have reached town without knowing, but then snow began to fall. He stopped to fasten the cloths over his goods more securely. When he reached the end of the line, he found that the fox and all his fish were gone.
        - id: ch01-b10
          speaker: narrator
          text: He quickly freed one reindeer and rode back over the path he had traveled. The missing sledge stood safely in the middle of the road. But the fox had bitten the cord off right beside its noose, leaving nothing that could be fastened to another sledge. The man had found his load of fish, yet he had no way to move it away.
        - id: ch01-b11
          speaker: narrator
          text: Meanwhile, the fox was having a splendid time. The moment the sledge came loose, he searched through the fish that had been arranged in neat piles for the market. He chose the one he liked best, took it firmly in his mouth, and left the stranded sledge behind as he trotted off among the trees.
    - id: ch02
      title: The Bear Goes Fishing
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: After a while, the fox met a bear. The bear stopped when he saw the fish.
        - id: ch02-b02
          speaker: bear
          text: Where did you get that fish, Mr. Fox?
        - id: ch02-b03
          speaker: fox
          text: Not far from here. I put my tail into the stream near the elves' home, and the fish grabbed it all by itself.
        - id: ch02-b04
          speaker: bear
          text: If a fish will hang on to your tail, I suppose it will hang on to mine.
        - id: ch02-b05
          speaker: narrator
          text: The bear was hungry and in a bad temper.
        - id: ch02-b06
          speaker: fox
          text: Of course it will, Grandfather, as long as you can bear what I bore.
        - id: ch02-b07
          speaker: bear
          text: Naturally I can! What nonsense. Take me there.
        - id: ch02-b08
          speaker: narrator
          text: The fox led him to a stream in a warm place. Only a thin skin of ice covered parts of the water, and the spring sunshine glittered on it.
        - id: ch02-b09
          speaker: fox
          text: This is where the elves bathe. Put your tail in, and the fish will take hold. But don't rush, or you'll ruin everything.
        - id: ch02-b10
          speaker: narrator
          text: The fox trotted away, though he went only far enough to stay out of sight. The bear stood on the bank with his tail deep in the stream. The sun went down. The cold grew sharp, and ice formed quickly around his tail until it held him as tightly as a vise.
        - id: ch02-b11
          speaker: narrator
          text: When the fox saw that his trick had worked, he shouted at the top of his voice.
        - id: ch02-b12
          speaker: fox
          text: Hurry, good people! Bring your bows and spears! A bear has been fishing in your brook!
        - id: ch02-b13
          speaker: narrator
          text: In a moment, the whole place filled with little creatures. Each one carried a tiny bow and a spear hardly big enough for a baby. Small as the weapons were, their arrows and spear points could sting. The bear knew that very well. Frightened out of his wits, he gave one tremendous pull. His tail snapped short, and he rolled away into the forest as fast as his legs could carry him.
        - id: ch02-b14
          speaker: narrator
          text: The fox watched him go and laughed until he had to hold his sides. Then he scampered off in the opposite direction. After a while, he came to a fir tree and crept into a hole beneath its roots. Once he was settled there, he did something very strange. He took one of his hind feet between his two front paws and began to question it softly.
        - id: ch02-b15
          speaker: fox
          text: My foot, what would you do if someone betrayed me?
        - id: ch02-b16
          speaker: fox
          text: I would run so fast that he could never catch you.
        - id: ch02-b17
          speaker: fox
          text: And you, my ear? What would you do if someone betrayed me?
        - id: ch02-b18
          speaker: fox
          text: I would listen so carefully that I heard every plan he made.
        - id: ch02-b19
          speaker: fox
          text: What about you, my nose? What would you do?
        - id: ch02-b20
          speaker: fox
          text: I would smell him from far away and know he was coming.
        - id: ch02-b21
          speaker: fox
          text: And you, my tail? What would you do if someone betrayed me?
        - id: ch02-b22
          speaker: fox
          text: I would steer you straight and take you beyond his reach. Come, let's go. I feel danger nearby.
        - id: ch02-b23
          speaker: narrator
          text: The fox was comfortable and did not follow his tail's advice. Before long, it was too late. The bear had come around by another path. He guessed where his enemy was hiding and scratched at the roots.
        - id: ch02-b24
          speaker: narrator
          text: The fox curled himself as small as he could, but a scrap of his tail still showed beyond the roots. The bear caught it and held tight. The fox dug all his claws into the earth and pulled against him. But he could not match the bear's strength. Inch by inch, the bear dragged him from the hole. Then he flung the fox's body across his neck and set off down the road, keeping the fox's tail clamped in his mouth the whole way.
    - id: ch03
      title: The Bear's New Colors
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: After they had traveled some distance, they passed a tree stump where a brightly colored woodpecker was tapping.
        - id: ch03-b02
          speaker: fox
          text: Ah, those were better days, when I used to paint all the birds in such bright colors.
        - id: ch03-b03
          speaker: bear
          text: What did you say, old fellow?
        - id: ch03-b04
          speaker: fox
          text: Me? Nothing at all. Just take me to your cave and eat me as quickly as you can.
        - id: ch03-b05
          speaker: narrator
          text: The bear said no more. He thought about his supper as they continued along the road. Then they came to another tree where a woodpecker was tapping.
        - id: ch03-b06
          speaker: fox
          text: Ah, those were better days, when I painted all the birds in such bright colors.
        - id: ch03-b07
          speaker: bear
          text: Couldn't you paint me as well?
        - id: ch03-b08
          speaker: narrator
          text: The fox shook his head. He was always acting, even when no one was there to watch.
        - id: ch03-b09
          speaker: fox
          text: You can't stand pain, and you're far too impatient. You would never do all the work. First, you must dig a pit. Then you must twist willow ropes, drive in posts, fill the hole with pitch, and finally set it alight. No, you could never manage that.
        - id: ch03-b10
          speaker: bear
          text: I don't care how hard it is. I'll do every bit of it!
        - id: ch03-b11
          speaker: narrator
          text: The bear eagerly tore at the earth, and soon he had made a pit deep enough to hold him.
        - id: ch03-b12
          speaker: fox
          text: Good. I see I judged you wrongly. Sit here, and I'll tie you up.
        - id: ch03-b13
          speaker: narrator
          text: The bear sat at the edge of the pit. The fox sprang onto his back, crossed it with willow ropes, and set fire to the pitch. The flames rose at once. They caught the willow bands and the bear's rough fur.
        - id: ch03-b14
          speaker: narrator
          text: The bear did not move. He believed that the burning meant the fox was rubbing bright colors deep into his skin. Soon, he thought, his coat would be as beautiful as a whole meadow covered in flowers. The heat kept building, but still he tried to sit quietly. Only when the fire grew hotter yet did he begin to shift uneasily from one foot to the other.
        - id: ch03-b15
          speaker: bear
          text: Old man, it is getting rather warm.
        - id: ch03-b16
          speaker: fox
          text: I knew you couldn't bear pain as well as those little birds.
        - id: ch03-b17
          speaker: narrator
          text: The bear could not stand being told he was less brave than one of those little birds. He clenched his teeth. No matter how much it hurt, he would endure it before he complained again. By then, the flames had eaten through the last willow rope. The fox gave his victim one hard push and sent him tumbling into the grass. Then the fox ran off and hid among the trees.
        - id: ch03-b18
          speaker: narrator
          text: After a while, the fox crept back cautiously. Just as he expected, only a few charred bones remained. He gathered them into a bag and slung it over his back.
    - id: ch04
      title: The Bag of Bones
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Before long, the fox met a Lapp driving reindeer along the road. As they drew near each other, the fox rattled the bones merrily.
        - id: ch04-b02
          speaker: narrator
          text: The man thought the sound must be silver or gold, so he addressed the fox politely.
        - id: ch04-b03
          speaker: lapp
          text: Good day, friend. What is making that strange noise in your bag?
        - id: ch04-b04
          speaker: fox
          text: It is all the wealth my father left me. Would you care to trade?
        - id: ch04-b05
          speaker: lapp
          text: Perhaps. But let me see your money first.
        - id: ch04-b06
          speaker: narrator
          text: The Lapp was a careful man and did not want to seem too eager.
        - id: ch04-b07
          speaker: fox
          text: I can't show it to you. The bag is sealed. Give me those three reindeer, and you may take the bag exactly as it is, with everything inside.
        - id: ch04-b08
          speaker: narrator
          text: The Lapp did not quite like the bargain. Still, the fox spoke with such confidence that his doubts slowly melted away. At last, the man nodded and stretched out his hand. The fox placed the sealed bag in it, walked over to the team, and unharnessed the three reindeer he had chosen for himself.
        - id: ch04-b09
          speaker: fox
          text: Oh, I nearly forgot! Don't open that bag until you've gone at least five miles and crossed those hills. If you open it sooner, all the gold and silver will turn into charred bones.
        - id: ch04-b10
          speaker: narrator
          text: With that warning, the fox whipped up the reindeer, turned them the other way, and soon vanished from sight. For a time, the Lapp was content just to hear the bag rattle. He congratulated himself on his bargain and imagined all the things he would buy. Before long, listening was not enough. What use was it to make plans when he did not know how rich he truly was? The bag might contain a great heap of silver and only a little gold. Or perhaps it held a great heap of gold and hardly any silver. There was no way to tell.
        - id: ch04-b11
          speaker: narrator
          text: Of course, he would not take the money out and count it. That might bring bad luck. But surely there could be no harm in one quick peep. He slowed his hands over the bag, then broke the seal and carefully untied the strings. He looked inside, and there before him lay nothing but a heap of burned bones.
        - id: ch04-b12
          speaker: narrator
          text: The Lapp knew at once that he had been cheated. In a rage, he threw down the bag and chased the fox as fast as his snowshoes could carry him.
        - id: ch04-b13
          speaker: narrator
          text: The fox had expected this and kept watch behind him. The moment he saw a little speck approaching, he wished for the man's snowshoes to break. At once, they snapped in two.
        - id: ch04-b14
          speaker: narrator
          text: The Lapp did not know the fox had caused it. With his snowshoes broken, he had to stop and go back for another reindeer. He mounted it and began the chase again. The fox soon heard the hoofbeats behind him. This time, he wished for the reindeer to fall and break its leg. The animal fell at once, exactly as the fox had wished. The Lapp knew then that the chase was hopeless. No matter what he tried, he was no match for the fox.
        - id: ch04-b15
          speaker: narrator
          text: The fox went peacefully on to the cave where he kept his stores. Then he wondered who might help him kill the reindeer. He was clever enough to steal them, but too small to kill them himself.
        - id: ch04-b16
          speaker: fox
          text: This will be easy enough.
        - id: ch04-b17
          speaker: narrator
          text: A squirrel was watching from a nearby tree. The fox sent it to summon every robber beast in the forest. Less than half an hour later, branches crashed as bears, wolves, snakes, mice, frogs, and many other creatures crowded around the cave.
        - id: ch04-b18
          speaker: narrator
          text: When they heard why the fox had called them, every animal declared that he was ready to do his share. A bear took the crossbow from his neck and shot a reindeer in the chin. From that day to this, every reindeer has carried a mark in that same place, and it is still called the bear's arrow. A wolf shot one in the thigh, leaving another mark that remains to this day. The mouse, the viper, and every other creature took a turn, even the frog. At last, all three reindeer died. Through it all, the fox did nothing but stand and watch.
        - id: ch04-b19
          speaker: fox
          text: I really must go to the brook and wash.
        - id: ch04-b20
          speaker: narrator
          text: He was perfectly clean, but he slipped beneath the bank and hid behind a stone. Then he let out such dreadful shrieks that the animals fled in every direction. Only the mouse and the ermine stayed. They thought they were too small for anyone to notice.
        - id: ch04-b21
          speaker: narrator
          text: The fox kept shrieking until he was sure the others had gone a safe distance. Then he crawled out and returned to the dead reindeer, which were now his alone. He gathered sticks for a fire and was about to cook a steak when the Lapp arrived, panting with haste and excitement.
        - id: ch04-b22
          speaker: lapp
          text: What are you doing? Why did you trick me with those bones? And after taking my reindeer, why did you kill them?
          emotion: angry
        - id: ch04-b23
          speaker: fox
          text: Dear brother, don't blame me for this disaster. My companions killed them, though I begged them not to.
          emotion: sad
        - id: ch04-b24
          speaker: narrator
          text: The man did not answer. He had noticed the ermine's white fur behind some stones. He seized the iron hook hanging over the fire and threw it. The ermine darted aside, but the hook brushed the tip of its tail. That tip has been black ever since.
        - id: ch04-b25
          speaker: narrator
          text: Then the Lapp snatched up a half-burned stick and threw it after the mouse. It was not heavy enough to hurt him, but it smeared soot all over his beautiful white coat. Even all the washing in the world could never make that coat clean again. The man would have been wiser to leave both little creatures alone. By the time he turned around to face the fox, he was standing there by himself.
        - id: ch04-b26
          speaker: narrator
          text: The instant the fox saw his enemy look away, he slipped off quietly. Once he reached a patch of thick bushes, he ran as fast as he could.
    - id: ch05
      title: The Fox Borrows New Eyes
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The fox ran until he reached a river, where a man was repairing his boat.
        - id: ch05-b02
          speaker: fox
          text: Oh, how I wish I had a boat to mend too!
        - id: ch05-b03
          speaker: narrator
          text: He sat up on his hind legs and stared into the man's face.
        - id: ch05-b04
          speaker: boat_mender
          text: Stop that foolish chatter, or I'll give you a bath in the river.
          emotion: angry
        - id: ch05-b05
          speaker: fox
          text: Oh, I truly wish I had a boat to mend!
        - id: ch05-b06
          speaker: narrator
          text: The fox spoke as though he had heard nothing. The man lost his temper, grabbed him by the tail, and hurled him far into the river, close to an island. That was just what the fox wanted. He scrambled onto the island without trouble and called from the top.
        - id: ch05-b07
          speaker: fox
          text: Quickly, fishes! Come and carry me to the other bank!
        - id: ch05-b08
          speaker: narrator
          text: At the sound of the fox's call, the fish left the stones where they had been sleeping and the quiet pools where they had been feeding. They streamed toward the island from every side, each one racing the others and hoping to be the first to offer its back.
        - id: ch05-b09
          speaker: pike
          text: I won! Climb onto my back, dear fox, and I'll have you across in no time.
          emotion: happy
        - id: ch05-b10
          speaker: fox
          text: No, thank you. Your back is much too weak. I would break it.
        - id: ch05-b11
          speaker: eel
          text: Then try my back.
        - id: ch05-b12
          speaker: fox
          text: No, thank you. I would slide over your head and drown.
        - id: ch05-b13
          speaker: perch
          text: You won't slide off my back.
        - id: ch05-b14
          speaker: fox
          text: No, but your back is far too rough.
        - id: ch05-b15
          speaker: trout
          text: Surely you can't find anything wrong with me.
        - id: ch05-b16
          speaker: fox
          text: Good gracious, are you here? I'm afraid I can't trust you either.
        - id: ch05-b17
          speaker: narrator
          text: Just then, a fine salmon came swimming slowly toward them.
        - id: ch05-b18
          speaker: fox
          text: Ah, you're exactly the one I need. Come closer so I can climb on without getting my feet wet.
        - id: ch05-b19
          speaker: narrator
          text: The salmon swam close beneath the island so the fox would not have to wet his paws. As soon as the fish touched the bank, the fox dug in his claws and dragged him out of the water. He put the salmon on a spit and kindled a fire beside him. When everything was ready and the water in the pot had grown hot, the fox dropped the salmon in and waited until he thought the fish was almost boiled.
        - id: ch05-b20
          speaker: narrator
          text: The fox bent low over the pot to look. Suddenly, the water gave a sharp fizzle and splashed straight into his eyes. The pain blinded him. He cried out, sprang backward, and sat there for several minutes, rocking himself to and fro. When the pain eased a little, he got to his feet and felt his way along a road until he met a grouse.
        - id: ch05-b21
          speaker: grouse
          text: What has happened to you?
        - id: ch05-b22
          speaker: fox
          text: Do you happen to have a spare pair of eyes?
        - id: ch05-b23
          speaker: grouse
          text: No, I'm afraid I don't.
        - id: ch05-b24
          speaker: narrator
          text: The grouse went on. A little later, the fox heard an early bee buzzing nearby. A gleam of sunshine had tempted it outside.
        - id: ch05-b25
          speaker: fox
          text: Do you have an extra pair of eyes by any chance?
        - id: ch05-b26
          speaker: bee
          text: I'm sorry, but I have only the eyes I'm using.
        - id: ch05-b27
          speaker: narrator
          text: The fox kept walking and nearly tripped over an asp gliding across the road.
        - id: ch05-b28
          speaker: fox
          text: I would be very grateful if you could tell me where to find a pair of eyes. You don't have any you could lend me, do you?
        - id: ch05-b29
          speaker: asp
          text: If you need them only briefly, I may be able to help. I can't manage without them for long.
        - id: ch05-b30
          speaker: fox
          text: I need them for only a moment. My own eyes are just beyond that hill. Once I find them, I'll bring yours back. You may keep these until then.
        - id: ch05-b31
          speaker: narrator
          text: The asp agreed to the exchange. The fox took the burned eyes out of his own head and popped them into the asp's head for safekeeping. Then he removed the asp's good eyes and fitted them into their place. The moment he could see again, he turned and ran. As he disappeared down the road, he shouted over his shoulder.
        - id: ch05-b32
          speaker: fox
          text: As long as the world lasts, the eyes of asps will pass down through the heads of foxes, generation after generation!
        - id: ch05-b33
          speaker: narrator
          text: And so it has been. Look at an asp's eyes, and you will see that they are burned. Thousands upon thousands of years have passed since the fox went around playing tricks on everyone he met, but the asp still bears the marks of the day that sly creature cooked the salmon.
