  chapters:
    - id: ch01
      title: Two Wives Make a Test
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: On a broad plain stood a little village where the sun could be seen from sunrise until sunset. Two married couples lived there side by side. The husbands worked for the same master and got along very well. Their wives did not. They argued all the time, most often about which woman had the more foolish husband.
        - id: ch01-b02
          speaker: narrator
          text: Most people think their own belongings are better than anyone else's. These women were different. Each one was certain that her husband was the greater fool.
        - id: ch01-b03
          speaker: first_wife
          text: You should see the things my husband does. He puts the baby's frock on upside down. Once he tried to feed her soup while it was still boiling, and her mouth was burned for days. He picks up stones from the road and plants them instead of potatoes. Then one day he said the quickest way into the garden was through the upstairs window!
        - id: ch01-b04
          speaker: second_wife
          text: That is bad, I admit. But it is nothing beside what my husband puts me through. If I ask him to feed the poultry while I'm busy, he gives them poison instead of food. By the time I reach the yard, every bird is dead. When I went to care for my sick mother, he took my best bonnet and gave it to a hen for a nest. And only last week I sent him for a cask of butter. He came home driving a hundred and fifty ducks that someone had talked him into taking. Not one of them would lay an egg.
        - id: ch01-b05
          speaker: first_wife
          text: Yes, he certainly sounds difficult. Let us test both men and find out which one really is the bigger fool.
        - id: ch01-b06
          speaker: narrator
          text: Near the time her husband usually came home, the first wife brought out her spinning wheel. She sat there turning it busily, though there was nothing on it. Her husband came in, but she never looked up. For several minutes he watched her with his mouth hanging open. At last, he spoke.
        - id: ch01-b07
          speaker: first_husband
          text: Wife, have you lost your senses? You're spinning, but there isn't anything on the wheel.
        - id: ch01-b08
          speaker: first_wife
          text: You may not see it, but there is a great skein of wool there. The thread is so fine that no one can see it. I am going to weave it into a coat for you.
        - id: ch01-b09
          speaker: first_husband
          text: Well, what a clever wife I have! I would never have known the wool was there if you hadn't told me. But now... yes, I really think I can see something.
        - id: ch01-b10
          speaker: narrator
          text: His wife only smiled and went on spinning.
    - id: ch02
      title: The Invisible Coat
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: She kept at it for another hour. Then she left the spinning wheel and moved to her loom, where she pretended to weave as fast as she could. At last she rose and turned to her husband.
        - id: ch02-b02
          speaker: first_wife
          text: I am too tired to finish the coat tonight. I'll go to bed now. Tomorrow, all that will be left is the cutting and stitching.
        - id: ch02-b03
          speaker: narrator
          text: Early the next morning, she cleaned the house, fed the chickens, and put everything in order. Then she bent over the kitchen table with her large scissors. Snip, snap! Snip, snap! The sound carried all the way to the garden. Her husband watched, but he could see no cloth beneath the blades and nothing for her to cut. Still, he told himself that this was only because he was too foolish to see such fine wool.
        - id: ch02-b04
          speaker: narrator
          text: After the cutting came the sewing. The woman patted the empty air. She pinned it, fitted it, and joined it. Then she called her husband over.
        - id: ch02-b05
          speaker: first_wife
          text: Your new coat is ready. Come and try it on.
        - id: ch02-b06
          speaker: narrator
          text: She made him remove the coat he was wearing and stand before her. Again she patted, pinned, fitted, and joined the invisible cloth. She even took great care to smooth out every wrinkle. He endured it patiently for a long while before saying anything.
        - id: ch02-b07
          speaker: first_husband
          text: It doesn't feel very warm.
        - id: ch02-b08
          speaker: first_wife
          text: That is because the cloth is so fine. Surely you don't want a coat as thick as the rough things you wear every day.
        - id: ch02-b09
          speaker: narrator
          text: He did want that, but he was too ashamed to admit it.
        - id: ch02-b10
          speaker: first_husband
          text: If you say it's beautiful, then I'm sure it is. I'll look smarter than anyone else in the village. When people see me, they'll cry, “What a splendid coat!” Of course, not everyone has a wife as clever as mine.
        - id: ch02-b11
          speaker: narrator
          text: Meanwhile, the second wife had begun her own test. The moment her husband came home, she stared at him in such terror that the poor man became frightened too.
        - id: ch02-b12
          speaker: second_husband
          text: Why are you looking at me like that? What's wrong?
        - id: ch02-b13
          speaker: second_wife
          text: Oh, go straight to bed! You must be terribly ill if you look as bad as that!
          emotion: fearful
        - id: ch02-b14
          speaker: narrator
          text: At first the man was surprised. He had felt especially well that evening. Yet as soon as his wife spoke, he became certain that something dreadful was wrong with him. The color drained from his face.
        - id: ch02-b15
          speaker: second_husband
          text: I suppose bed is the best place for me.
          emotion: fearful
        - id: ch02-b16
          speaker: narrator
          text: He was trembling as his wife took him upstairs and helped him undress. She tucked him in warmly, shaking her head all the while.
        - id: ch02-b17
          speaker: second_wife
          text: If you sleep well tonight, you may still have a chance. But if you don't...
        - id: ch02-b18
          speaker: narrator
          text: After hearing that, the poor man did not close his eyes once before sunrise.
    - id: ch03
      title: A Living Man in a Coffin
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The second wife finished her housework and then crept into the bedroom on tiptoe.
        - id: ch03-b02
          speaker: second_wife
          text: How are you feeling this morning?
        - id: ch03-b03
          speaker: second_husband
          text: Bad. Very bad. I haven't slept for even a moment. Can't you think of anything that might cure me?
        - id: ch03-b04
          speaker: second_wife
          text: I'll try everything I can. I'll find some dried herbs and make you a drink, though I fear it may already be too late. Why didn't you tell me sooner?
        - id: ch03-b05
          speaker: narrator
          text: She had no wish for her husband to die. She only meant to prove that he was more foolish than the other man.
        - id: ch03-b06
          speaker: second_husband
          text: I thought the pain might pass after a day or two. And I didn't want to upset you. If I'd known how ill I truly was, I would have told you at once.
        - id: ch03-b07
          speaker: narrator
          text: By now he was sure that he had suffered terrible pain and borne it bravely.
        - id: ch03-b08
          speaker: second_wife
          text: I'll see what can be done. But you mustn't talk. Stay still and keep warm.
        - id: ch03-b09
          speaker: narrator
          text: He remained in bed all day. Whenever his wife entered, she shook her head and asked how he felt. Every time, he told her he was worse than before. By evening, he had spent the whole day beneath the covers. Then his wife suddenly burst into tears. Her husband asked what was wrong, and she began to sob.
        - id: ch03-b10
          speaker: second_wife
          text: Oh, my poor husband! Can you truly be dead? Tomorrow I'll have to order your coffin.
          emotion: sad
        - id: ch03-b11
          speaker: narrator
          text: A cold shiver ran through the man. All at once, he knew he felt as healthy as ever.
        - id: ch03-b12
          speaker: second_husband
          text: No, no! I'm completely better now. I think I'll go back to work.
          emotion: fearful
        - id: ch03-b13
          speaker: second_wife
          text: You certainly will not. Lie perfectly still. Before the sun rises, you will be dead.
        - id: ch03-b14
          speaker: narrator
          text: Her words terrified him, so he lay without moving. The undertaker came and measured him for a coffin. His wife told the gravedigger how to prepare the grave. That evening, the coffin arrived at their home.
        - id: ch03-b15
          speaker: narrator
          text: At nine the next morning, his wife dressed him in a long flannel garment. Then she called the undertaker's men. They fastened the lid and carried him toward the grave, where all the couple's friends were waiting.
    - id: ch04
      title: Which Was the Foolishest?
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Just as the coffin was being lowered into the ground, the first husband came running toward them. As far as anyone could see, he had no clothes on at all. Everyone burst into laughter. The undertaker's men set down the coffin and laughed until their sides nearly split.
        - id: ch04-b02
          speaker: narrator
          text: The supposedly dead man could not understand such behavior. He peered through a little window in the side of his coffin and called out.
        - id: ch04-b03
          speaker: second_husband
          text: I would laugh as loudly as any of you, if I were not a dead man.
        - id: ch04-b04
          speaker: narrator
          text: A voice had come from inside the coffin. At once, the laughter stopped. Everyone stood as still as stone. Then they all rushed forward and raised the lid, and the man stepped out among them.
        - id: ch04-b05
          speakers: [villager_one, villager_two, villager_three]
          ensemble: chorus
          text: So you weren't dead after all? Then why did you let them bury you?
          emotion: surprised
        - id: ch04-b06
          speaker: narrator
          text: The two wives confessed. Each one had wanted to prove that her own husband was more foolish than the other woman's husband.
        - id: ch04-b07
          speaker: narrator
          text: But the villagers could not choose between them. One man had been persuaded that he wore beautiful clothes while he wore nothing at all. The other had allowed himself to be buried while he was alive and perfectly well.
        - id: ch04-b08
          speaker: narrator
          text: So the two women went right on quarrelling, and no one ever learned whose husband was the greater fool.
