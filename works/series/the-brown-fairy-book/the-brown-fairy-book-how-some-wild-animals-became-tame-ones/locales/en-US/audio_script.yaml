audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, grave, and attentive to wonder
        timbre: clear and resonant
        pace: measured
        pitch: medium
    bear:
      display_name: Bear
      tts:
        delivery: slow, trusting, and weary
        timbre: broad and mellow
        pace: unhurried
        pitch: low
    wolf:
      display_name: Wolf
      tts:
        delivery: direct and disapproving
        timbre: full and rugged
        pace: measured
        pitch: medium-low
    fox:
      display_name: Fox
      tts:
        delivery: keen, curious, and unsparing
        timbre: clear and lean
        pace: measured
        pitch: medium
    boy:
      display_name: Boy
      tts:
        delivery: lively, blunt, and certain of himself
        timbre: bright and clear
        pace: brisk
        pitch: medium-high
    horse:
      display_name: Horse
      tts:
        delivery: proud, energetic, and scornfully confident
        timbre: strong and ringing
        pace: brisk
        pitch: medium-low
    cow:
      display_name: Cow
      tts:
        delivery: pleasant at first, then prim and self-assured
        timbre: smooth and full
        pace: measured
        pitch: medium
    reindeer:
      display_name: Reindeer
      tts:
        delivery: serious, formal, and firmly confident
        timbre: clear and steady
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: Invitations to the Wedding
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, there was a miller so rich that when he decided to marry, he invited more than his own friends to the feast. He also sent invitations to the wild animals in the hills and woods nearby.
        - id: ch01-b02
          speaker: narrator
          text: The leaders of the bears, wolves, foxes, horses, cows, goats, sheep, and reindeer were all asked to come. None of them was used to being invited to a wedding. They felt pleased and honored, and each sent back a most polite message promising to attend.
        - id: ch01-b03
          speaker: narrator
          text: On the morning of the wedding, Bear was the first to set out. He always liked to arrive on time, and he had a long road ahead of him. His thick, rough coat had also needed a good brushing before it was fit for a party. He had taken care to wake very early, and when everything was ready, he started down the road with a light heart.
        - id: ch01-b04
          speaker: narrator
          text: Before Bear had gone far, he met a boy. The boy came whistling along and knocking the tops from the flowers with a stick. He knew Bear already, and he was surprised to see his old acquaintance looking so fine.
        - id: ch01-b05
          speaker: boy
          text: Where are you going all dressed up like that?
        - id: ch01-b06
          speaker: bear
          text: Oh, only to the miller's wedding. I'd much rather stay at home, of course, but the miller wanted me there so badly that I couldn't refuse.
        - id: ch01-b07
          speaker: boy
          text: Don't go! If you do, you'll never come home. You have the most beautiful skin in the world, exactly the kind everyone wants. They'll kill you and take it from you.
          emotion: fearful
        - id: ch01-b08
          speaker: narrator
          text: Bear's face turned white, though no one could see it under all that fur.
        - id: ch01-b09
          speaker: bear
          text: I never thought of that. Are you sure they could be so wicked? Or are you only jealous because no one invited you?
          emotion: fearful
        - id: ch01-b10
          speaker: boy
          text: What nonsense! Do whatever you like. It's your skin, not mine, and I don't care what happens to it!
          emotion: angry
        - id: ch01-b11
          speaker: narrator
          text: The boy marched away quickly with his head held high. Bear waited until he was out of sight, then slowly followed him. Deep down, Bear knew the advice was good, but he was too proud to admit it.
    - id: ch02
      title: The Wolf and the Fox Turn Back
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The boy soon grew tired of following the road. He turned into the woods, where he could jump over bushes and wade through streams. He had not gone far when he met Wolf, another animal he had seen before.
        - id: ch02-b02
          speaker: boy
          text: Where are you going?
        - id: ch02-b03
          speaker: wolf
          text: Oh, only to the miller's wedding. It's rather tiresome. Weddings are always so dull, but one has to be good-natured about these things.
        - id: ch02-b04
          speaker: boy
          text: Don't go. Your skin is thick and warm, and winter is nearly here. They'll kill you and strip it off.
        - id: ch02-b05
          speaker: narrator
          text: Wolf's jaw dropped. He stared at the boy in terror.
        - id: ch02-b06
          speaker: wolf
          text: Do you truly think they would do that?
          emotion: fearful
        - id: ch02-b07
          speaker: boy
          text: Of course I do. But it's your concern, not mine. Good morning.
        - id: ch02-b08
          speaker: narrator
          text: The boy wished him good morning and went on through the woods. Wolf did not follow. He stood where he was for several minutes, trembling from head to foot as he thought about what might be waiting at the wedding. Then he turned and crept quietly back to his cave.
        - id: ch02-b09
          speaker: narrator
          text: Next the boy met Fox. His lovely silver-gray coat shone in the sunlight, and the boy stopped to admire it.
        - id: ch02-b10
          speaker: boy
          text: You look very fine today. Are you going to the miller's wedding too?
        - id: ch02-b11
          speaker: fox
          text: Yes. It's a long journey for a wedding, but you know the miller's friends. They're such dull, heavy company that it seems only kind to go and entertain them.
        - id: ch02-b12
          speaker: boy
          text: You poor fellow. Take my advice and stay home. The moment you pass through the miller's gate, his dogs will tear you to pieces.
        - id: ch02-b13
          speaker: fox
          text: Well, yes. Things like that have happened before.
        - id: ch02-b14
          speaker: narrator
          text: Fox said nothing more. He turned around and trotted back the way he had come.
    - id: ch03
      title: The Horse Refuses to Listen
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Fox's tail had barely vanished when branches began crashing nearby. Horse bounded into sight, his black coat gleaming like satin.
        - id: ch03-b02
          speaker: horse
          text: Good morning! I can't stop to talk. I promised the miller I'd be at his wedding feast, and they won't sit down until I arrive.
        - id: ch03-b03
          speaker: boy
          text: Stop! Stop!
        - id: ch03-b04
          speaker: narrator
          text: Something in the boy's voice made Horse pull up.
        - id: ch03-b05
          speaker: horse
          text: What's wrong?
        - id: ch03-b06
          speaker: boy
          text: You don't understand what you're doing. Once you go there, you'll never gallop through these woods again. You may be stronger than many men, but they'll catch you and tie ropes around you. Then you'll have to work for them and serve them for the rest of your life.
        - id: ch03-b07
          speaker: narrator
          text: Horse tossed back his head and laughed at the warning.
        - id: ch03-b08
          speaker: horse
          text: Yes, I am stronger than many men, and every rope in the world couldn't hold me. Let them bind me as tightly as they like. I can always break free and come back to the forest.
        - id: ch03-b09
          speaker: narrator
          text: With that proud speech, Horse flicked his long tail and galloped away even faster than before.
        - id: ch03-b10
          speaker: narrator
          text: When Horse reached the miller's house, everything happened just as the boy had warned. He stood looking over the wedding guests and thinking how much stronger and handsomer he was than every one of them. While his mind was on his own fine appearance, a rope suddenly dropped over his head. He was thrown to the ground, and a bit was forced between his teeth before he could escape.
        - id: ch03-b11
          speaker: narrator
          text: Horse struggled, but they dragged him into a stable. For several days, they shut him in without food. At last his proud spirit was broken, and his shining coat grew dull.
        - id: ch03-b12
          speaker: narrator
          text: After that, they harnessed Horse to a plow. As he worked, he had plenty of time to remember everything he had lost because he would not listen to the boy's advice.
    - id: ch04
      title: The Cow Goes On
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: After Horse ignored him, the boy wandered on with no particular hurry. Sometimes he picked wild strawberries from a bank. Sometimes he plucked wild cherries from a tree. At last he reached a clearing in the middle of the forest.
        - id: ch04-b02
          speaker: narrator
          text: A beautiful milk-white Cow was crossing the open ground. A wreath of flowers hung around her neck.
        - id: ch04-b03
          speaker: cow
          text: Good morning.
        - id: ch04-b04
          speaker: boy
          text: Good morning. Where are you going in such a hurry?
        - id: ch04-b05
          speaker: cow
          text: To the miller's wedding. I'm already rather late because the wreath took so long to make, so I can't stop.
        - id: ch04-b06
          speaker: boy
          text: Please don't go. Once they taste your milk, they'll never let you leave. You'll have to serve them for the rest of your life.
        - id: ch04-b07
          speaker: cow
          text: Nonsense. What could you know about it? I can run twice as fast as any of them. I'd like to see anyone try to keep me when I want to go!
        - id: ch04-b08
          speaker: narrator
          text: Cow always believed she was wiser than everyone else. She was so offended that she left without even giving the boy a polite bow.
        - id: ch04-b09
          speaker: narrator
          text: But once again, everything turned out as the boy had said. All the wedding guests had heard how famous Cow's milk was, and they coaxed her into giving them some. The moment they tasted it, they decided they would never let her go. Cow's fate was settled.
        - id: ch04-b10
          speaker: narrator
          text: A crowd closed around Cow and held her horns so she could not use them. Like Horse, she was locked in the stable. They let her out only in the mornings, when they tied a long rope around her head and fastened her to a stake in a grassy meadow.
        - id: ch04-b11
          speaker: narrator
          text: The very same thing happened to Goat and Sheep.
    - id: ch05
      title: The Last Animal on the Road
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Reindeer came last of all. As usual, he looked as though he had serious business to attend to. By now, the boy was tired of eating wild cherries and had begun to think about his dinner.
        - id: ch05-b02
          speaker: boy
          text: Where are you going?
        - id: ch05-b03
          speaker: reindeer
          text: I've been invited to the wedding, and the miller begged me not to disappoint him.
        - id: ch05-b04
          speaker: boy
          text: You fool! Don't you have any sense? When you arrive, they'll hold you there. No beast or bird is as strong or as fast as you are.
          emotion: angry
        - id: ch05-b05
          speaker: reindeer
          text: That's exactly why I'm safe. I'm too strong for anyone to bind, and I'm so swift that even an arrow can't catch me. Goodbye for now. You'll soon see me coming back.
        - id: ch05-b06
          speaker: narrator
          text: But none of the animals who went to the miller's wedding ever returned.
        - id: ch05-b07
          speaker: narrator
          text: They had been stubborn and proud, and they would not listen to good advice. That is why they and their children have remained the servants of people to this very day.
