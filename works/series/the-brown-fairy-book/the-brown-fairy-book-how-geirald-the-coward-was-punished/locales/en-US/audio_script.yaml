  chapters:
    - id: ch01
      title: A Promise Between Friends
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once there was a poor knight with many children and scarcely enough food for them all. One day he sent his eldest son, Rosald, into a nearby town on business. Rosald was brave and honest. In the town, he met a young man called Geirald, and the two became friends.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Geirald's father was rich and very proud of his son. He had always let the boy do as he pleased. Fortunately, Geirald was sensible with money and did not throw it away as many rich young men might have done. For some time he had wanted to travel in foreign lands. After talking with Rosald, he asked his new friend to go with him.
        - id: ch01-b03
          speaker: rosald
          text: >-
            I would like nothing better. But my father is poor. He could never give me enough money for such a journey.
          emotion: sad
        - id: ch01-b04
          speaker: geirald
          text: >-
            If money is the only problem, then there's no problem at all. My father has more than he can use, and he'll give me enough for both of us. I ask only one thing. If we meet with adventures, you must let all the honor and glory come to me.
        - id: ch01-b05
          speaker: rosald
          text: >-
            Of course. That seems fair. I have never cared about pushing myself forward. But I must tell my parents before I go. I'm sure they'll think me lucky to have such a chance.
        - id: ch01-b06
          speaker: narrator
          text: >-
            As soon as his business was done, Rosald hurried home. His parents were delighted by his good fortune. His father gave him his own sword, which had begun to rust from lying unused. His mother made sure that his leather jerkin was ready for the road.
        - id: ch01-b07
          speaker: rosald_mother
          text: >-
            Remember the promise you made to Geirald. Whatever happens, you must never betray him.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Rosald said farewell and rode away full of joy. The next day, he and Geirald set out together in search of adventures. They soon found their own country disappointing. It was governed so well that nothing unusual was likely to happen there. But the moment they crossed the border into the next kingdom, everything changed. Lawlessness and confusion were everywhere.
    - id: ch02
      title: The Twelve Robbers
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            They had not gone far when their road climbed across a mountain. Among the trees ahead, they caught sight of several armed men hiding beside the path. At once they remembered all the stories they had heard about twelve robbers who waited there for wealthy travelers and took them by surprise.
        - id: ch02-b02
          speaker: narrator
          text: >-
            These robbers were said to be more like wild beasts than men. They lived near the mountaintop in caves and holes in the ground. Every one of them was called Hankur. Colors set most of them apart, such as Blue Hankur, Grey Hankur, and Red Hankur. Only their chief had another name. He was Hankur the Tall. The two friends remembered all this when they saw the robbers' swords flash in the moonlight.
        - id: ch02-b03
          speaker: geirald
          text: >-
            We can't fight them. There are twelve of them and only two of us. Let's turn around and take the lower road. Throwing our lives away here would be foolish.
          emotion: fearful
        - id: ch02-b04
          speaker: narrator
          text: >-
            Geirald stopped his horse in the middle of the path, but Rosald would not agree.
        - id: ch02-b05
          speaker: rosald
          text: >-
            We can't go back now. We would be ashamed to face anyone again. Besides, this is our chance to prove what we're made of. We'll tie the horses here, climb those rocks, and roll stones down on the robbers.
        - id: ch02-b06
          speaker: geirald
          text: >-
            We could try it that way. At least we'll still have the horses if we need them.
        - id: ch02-b07
          speaker: narrator
          text: >-
            They tied their horses and climbed the rocks in silence, placing every foot with care. Below them, the robbers lay ready beside the road. They expected their victims to come around the corner at any moment, only a few yards away. Instead, a shower of huge stones came crashing onto their heads. Half the band was killed before the others understood what was happening.
        - id: ch02-b08
          speaker: narrator
          text: >-
            The surviving robbers sprang up the rock toward them. Each time a man reached the top, Rosald's sword swept around, and the robber tumbled down into the valley. At last Hankur the Tall managed to leap onto the rock. He caught Rosald around the waist and sent his sword flying away. Locked together, the two fought desperately. Their struggling bodies swayed nearer and nearer to the edge.
        - id: ch02-b09
          speaker: narrator
          text: >-
            Rosald was the smaller of the two, and it seemed certain that he must fall. Then his left hand found the robber's sword. He pulled it from its sheath and drove it into Hankur's heart. From the dead chief, Rosald took a beautiful ring set with a large stone and placed it on his own finger.
        - id: ch02-b10
          speaker: narrator
          text: >-
            News of the wonderful deed soon traveled through the whole kingdom. People often stopped Geirald's horse and asked permission to see the robber's ring. They said Hankur had stolen it from the reigning king's father. Geirald always showed them the ring with pride and gladly listened while they praised him. No one who saw him would ever have guessed that someone else had destroyed the robbers.
    - id: ch03
      title: The Giant with the Iron Staff
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            A few days later, the friends left that kingdom and rode into another. They meant to stay there for the rest of the winter. Geirald liked his comforts and had no wish to keep traveling through ice and snow. The king agreed to let them remain, but only on one condition. Before winter ended, they must give him some fresh proof of the courage he had heard so much about. Rosald's heart lifted at the message. Geirald felt sure that everything would go well as long as Rosald was beside him. Together they bowed low and answered that the king had only to command, and they would obey.
        - id: ch03-b02
          speaker: king
          text: >-
            Then here is your task. A giant lives in the northeast of my kingdom. He carries an iron staff twenty yards long and wields it so swiftly that even fifty knights cannot defeat him. The bravest and strongest men at my court have died beneath that staff. Since you conquered twelve robbers with such ease, I hope you can conquer this giant. You will leave three days from now.
        - id: ch03-b03
          speaker: rosald
          text: We will be ready, Your Majesty.
        - id: ch03-b04
          speaker: narrator
          text: >-
            Geirald said nothing. Once they were outside the castle, his fear burst out.
        - id: ch03-b05
          speaker: geirald
          text: >-
            How are we supposed to fight a giant who has killed fifty knights? The king only wants us out of his way! At least he won't look for us during these next three days. That's enough time to cross the border and escape.
          emotion: fearful
        - id: ch03-b06
          speaker: rosald
          text: >-
            We may not kill him, but we cannot run before we try. And think what an honor it would be if we did defeat him. I know exactly what weapon I need. Come with me, and I'll arrange it now.
        - id: ch03-b07
          speaker: narrator
          text: >-
            Rosald took Geirald by the arm and led him to a shop. There he bought a solid lump of iron so huge that the two of them could barely lift it. They managed to carry it to a blacksmith, and Rosald had it beaten into a thick club with a sharp spike at one end. When the work pleased him, he carried the club home under his arm.
        - id: ch03-b08
          speaker: narrator
          text: >-
            Very early on the third morning, the two young men set out. They traveled for four days and reached the giant's cave before he was out of bed. When the giant heard footsteps, he rose and came to the entrance to see who was there. Rosald had expected him to do just that. He swung the iron club and struck the giant such a blow on the forehead that the giant fell to the ground. Before the creature could regain his feet, Rosald drew his sword and cut off his head.
        - id: ch03-b09
          speaker: rosald
          text: You see? In the end, it wasn't so difficult.
        - id: ch03-b10
          speaker: narrator
          text: >-
            Rosald put the giant's head into the leather wallet on his back, and the friends returned to the castle. Near the gates, he took out the head and handed it to Geirald. Then he followed him before the king.
        - id: ch03-b11
          speaker: geirald
          text: The giant will never trouble your kingdom again.
        - id: ch03-b12
          speaker: narrator
          text: >-
            Geirald held out the head. The king threw his arms around him and kissed him.
        - id: ch03-b13
          speaker: king
          text: >-
            You are the bravest knight in all the world! I will hold a feast for you and Rosald, and your great deed shall be proclaimed across the kingdom.
          emotion: happy
        - id: ch03-b14
          speaker: narrator
          text: >-
            Pride filled Geirald's heart. He almost forgot that Rosald, not he, had killed the giant.
    - id: ch04
      title: The Queen's Challenge
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Soon people began whispering that a beautiful lady from the castle would attend the feast with her twenty-four maidens. She was a queen in her own right. Her parents had died when she was little, so her uncle, the king, had cared for her.
        - id: ch04-b02
          speaker: narrator
          text: >-
            The queen was old enough to rule her own country now, but her subjects did not want a woman to govern them alone. They insisted that she find a husband to help manage the kingdom. One prince after another offered himself, and she wanted nothing to do with any of them. At last she told her ministers that if she must have a husband, she would choose him herself. She certainly would not marry one of their choices. The ministers replied that she had better manage alone. But the young queen knew nothing about state business. Affairs fell into such confusion that she finally gave them up altogether and went to stay with her uncle.
        - id: ch04-b03
          speaker: narrator
          text: >-
            When the queen heard how the two young men had slain the giant, her heart filled with admiration for their courage. She declared that if a feast was held for them, she would certainly be there. And so she was. After the feast, she asked her uncle to let the heroes who had killed the robbers and the giant fight a tourney the next day against one of her pages.
        - id: ch04-b04
          speaker: narrator
          text: >-
            The king gladly agreed and ordered the lists prepared. He never doubted that two famous champions would welcome another chance for glory. He had no idea that Geirald spent the night begging Rosald to flee the castle in secret.
        - id: ch04-b05
          speaker: geirald
          text: >-
            I don't believe those opponents are pages at all. They must be experienced knights. How can we face them when we're so young and untested?
          emotion: fearful
        - id: ch04-b06
          speaker: rosald
          text: If we win, the honor will be greater still.
        - id: ch04-b07
          speaker: narrator
          text: >-
            Geirald refused to listen. He said he cared nothing for honor. He would rather live than receive every honor in the world. He meant to leave, and since Rosald had promised to keep him company, Rosald must leave too.
        - id: ch04-b08
          speaker: narrator
          text: >-
            Rosald was deeply troubled, but he knew he could not change his friend's mind. Instead, he tried to find some way to stop this shameful escape. Then his face brightened.
        - id: ch04-b09
          speaker: rosald
          text: >-
            We'll exchange clothes. I will fight, and you will receive the glory. No one will ever know.
        - id: ch04-b10
          speaker: narrator
          text: Geirald readily agreed.
        - id: ch04-b11
          speaker: narrator
          text: >-
            Geirald may or may not have been right about the supposed page being an experienced knight. One thing was certain. Rosald faced a very hard fight. Three times the riders charged and crashed together with such force that their horses reeled. Once Rosald knocked the helmet from his opponent's head. In return, he received a blow so heavy that he staggered in his saddle.
        - id: ch04-b12
          speaker: narrator
          text: >-
            The spectators shouted as victory seemed to pass from one rider to the other. At last Rosald set his spear against the armor on his opponent's chest and drove the rider steadily backward.
        - id: ch04-b13
          speakers: [spectator_1, spectator_2, spectator_3]
          ensemble: chorus
          text: He's unhorsed! Unhorsed!
        - id: ch04-b14
          speaker: narrator
          text: >-
            Rosald dismounted and helped his opponent rise. In the confusion afterward, he slipped away and gave Geirald back his own clothes. Torn and dusty from the fight, Geirald obeyed the king's summons and came before him.
        - id: ch04-b15
          speaker: king
          text: You have done exactly what I expected. Now choose your reward.
        - id: ch04-b16
          speaker: geirald
          text: >-
            Your Majesty, grant me the hand of your niece, the queen. I will defend her kingdom from every enemy.
        - id: ch04-b17
          speaker: king
          text: >-
            She could choose no better husband. If she agrees, then so do I.
        - id: ch04-b18
          speaker: narrator
          text: >-
            The king turned to the queen. She had not watched the fight but had just taken a seat at his right hand. Her sharp eyes noticed that the tall, handsome man before her differed in several small ways from the man who had fought. One difference stood out most of all. She could not understand how there had been a trick, or why the true victor would surrender his prize. Still, her heart warned her to be careful.
        - id: ch04-b19
          speaker: queen
          text: >-
            You may be satisfied, Uncle, but I am not. I require one more proof. Let these two young men fight each other now. I will marry the man who killed the robbers and the giant and defeated my page.
        - id: ch04-b20
          speaker: narrator
          text: >-
            Geirald turned pale when he heard her words. There was no escape now. He never doubted for a moment that Rosald would honor their agreement loyally to the end. But how could even Rosald deceive the watchful eyes of the king and his entire court? Geirald feared the young queen's eyes most of all. He felt uneasily certain that she had suspected him from the beginning.
    - id: ch05
      title: A Victory Given Away
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            The friends met in the tourney. Despite Geirald's fears, Rosald held back. His attacks were never meant to succeed, and he let through blows he could easily have stopped. After making a great show of resistance, he fell heavily to the ground.
        - id: ch05-b02
          speaker: narrator
          text: >-
            As Rosald fell, he knew he was surrendering more than the glory that belonged to him. He was also giving up the queen's hand, which he valued even more.
        - id: ch05-b03
          speaker: narrator
          text: >-
            Geirald did not even wait to learn whether Rosald was hurt. He went straight to the wall where the royal banner flew and claimed his reward.
        - id: ch05-b04
          speaker: narrator
          text: >-
            Everyone turned toward the queen, expecting her to bend down and give the victor some token. Instead, she smiled gracefully. To the surprise of them all, she announced one final test.
        - id: ch05-b05
          speaker: queen
          text: >-
            Before I give my hand, Geirald and Rosald must each face one knight from the king's court. Whoever unhorses his opponent shall have both me and my kingdom. The final tourney will begin tomorrow morning at ten.
        - id: ch05-b06
          speaker: narrator
          text: >-
            All night, Geirald paced restlessly around his room, from the door to the window and back again. He dared not face the fight ahead, and he tried with all his might to discover some way of escaping it. Morning came without an answer. The trumpets sounded at the appointed hour, and the other combatants rode onto the field. Geirald alone was missing.
        - id: ch05-b07
          speaker: narrator
          text: >-
            The king sent messengers through the castle to discover what had become of him. They found Geirald hiding beneath his bed and trembling with fear. After that, no further proof was needed. The final combat was declared unnecessary. The queen said she was now completely satisfied and ready to accept Rosald as her husband.
    - id: ch06
      title: The Ring and the Promise
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: When Rosald and the queen were alone, she explained how she had known the truth.
        - id: ch06-b02
          speaker: queen
          text: >-
            You forgot one thing. I recognized my father's ring on your right hand. Hankur the Tall had stolen it, so I knew that you, not Geirald, had destroyed the robbers. I was the page who fought you. I saw the ring on your hand again, though Geirald was not wearing it when he came to claim the prize.
        - id: ch06-b03
          speaker: queen
          text: >-
            That is why I ordered you to fight each other. Your loyalty to your promise defeated that plan, so I had to try once more. A man who keeps his word, whatever it costs him, is a man I can trust with both myself and my people.
        - id: ch06-b04
          speaker: narrator
          text: >-
            Rosald and the queen were married. They returned to her kingdom and ruled it wisely and happily.
        - id: ch06-b05
          speaker: narrator
          text: >-
            Many years later, a poor beggar came to the palace gates. He asked for money for the sake of the days that he and Rosald had once shared. That beggar was Geirald.
