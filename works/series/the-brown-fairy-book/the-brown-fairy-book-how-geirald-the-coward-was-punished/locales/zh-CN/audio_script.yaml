audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 清楚从容，像在为听众介绍一本古老的童话集
        timbre: 温暖明净
        pace: 舒缓
        pitch: 中音
    rosald:
      display_name: 罗萨尔德
      tts: {delivery: 正直勇敢，说话坦荡而坚定, timbre: 清朗年轻, pace: 适中, pitch: 中音}
    geirald:
      display_name: 吉拉尔德
      tts: {delivery: 养尊处优，遇险时胆怯急促，得意时张扬, timbre: 明亮年轻, pace: 稍快, pitch: 中高音}
    mother:
      display_name: 罗萨尔德的母亲
      tts: {delivery: 慈爱郑重，叮嘱时语气坚决, timbre: 温厚成熟, pace: 舒缓, pitch: 中音}
    king:
      display_name: 国王
      tts: {delivery: 威严爽朗，习惯发号施令, timbre: 洪亮厚实, pace: 从容, pitch: 中低音}
    queen:
      display_name: 年轻女王
      tts: {delivery: 聪慧敏锐，克制中带着坚定, timbre: 清澈端庄, pace: 适中, pitch: 中音}
    spectator_1:
      display_name: 观众甲
      tts: {delivery: 兴奋直率，随人群高声助阵, timbre: 明亮成年, pace: 较快, pitch: 中音}
    spectator_2:
      display_name: 观众乙
      tts: {delivery: 热烈响亮，随人群高声助阵, timbre: 粗厚成年, pace: 较快, pitch: 中低音}
    spectator_3:
      display_name: 观众丙
      tts: {delivery: 激动有力，随人群高声助阵, timbre: 清脆年轻, pace: 较快, pitch: 中高音}
  chapters:
    - id: ch01
      title: 约定与强盗
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，有一位贫穷的骑士。他的儿女很多，要让每个孩子吃饱，都不是容易的事。一天，他派长子罗萨尔德去邻城办事。罗萨尔德勇敢又正直，在城里认识了一个叫吉拉尔德的年轻人，两个人很快就成了朋友。
        - id: ch01-b02
          speaker: narrator
          text: >-
            吉拉尔德的父亲很富有，也一直以儿子为荣。吉拉尔德从小想做什么，父亲都由着他。好在他为人谨慎又懂事，不像许多富家子弟那样胡乱花钱。他早就一心想到外国去游历。和新朋友谈了一会儿，他便问罗萨尔德愿不愿意一起上路。
        - id: ch01-b03
          speaker: rosald
          text: >-
            我再愿意不过了。可我父亲实在太穷，拿不出让我远行的钱。
        - id: ch01-b04
          speaker: geirald
          text: >-
            原来只是缺钱，那还不好办？我父亲的钱多得不知道怎么用，我们两人的盘缠，他一定肯出。不过你要答应我一件事。路上若遇见什么冒险，所有荣誉和声名都归我。
        - id: ch01-b05
          speaker: rosald
          text: >-
            可以，这很公平。我只要先回家告诉父母，不能就这样走掉。他们知道我有这个机会，一定也会替我高兴。
        - id: ch01-b06
          speaker: narrator
          text: 罗萨尔德本来就从不在意出风头，更不在意把功劳留给别人。
        - id: ch01-b07
          speaker: narrator
          text: >-
            罗萨尔德办完事，马上赶回家。父母听了果然十分欢喜。父亲把自己那把许久没用、已经开始生锈的剑送给他，母亲则替他把皮上衣仔细收拾妥当。临别时，母亲认真地叮嘱他。
        - id: ch01-b08
          speaker: mother
          text: >-
            你既然答应了吉拉尔德，就一定要守信。不管将来发生什么事，也绝不能背叛他。
          emotion: calm
        - id: ch01-b09
          speaker: narrator
          text: >-
            罗萨尔德欢欢喜喜地骑马离开。第二天，他和吉拉尔德一同出发，去寻找冒险。可他们自己的国家治理得太好，几乎不会发生出奇的事，这叫两个人很失望。直到越过边境，进入另一个王国，四周才一下子变得混乱无序。
        - id: ch01-b10
          speaker: narrator
          text: >-
            两人骑马上山，没走多远，就看见前面的树林里藏着几个带兵器的人。他们想起一路听来的传闻。山顶某处的山洞和地洞里住着十二个强盗，专门埋伏有钱的旅客。他们凶得不像人，倒像野兽。人人都叫汉库尔，再用蓝、灰、红之类的颜色彼此区别。只有首领不用颜色，人称高个子汉库尔。此刻，月光正从他们的刀剑上闪过。
        - id: ch01-b11
          speaker: geirald
          text: >-
            十二个人打我们两个，这怎么打？我们还是回头走山下那条路吧。明知道会送命还往前走，太愚蠢了。
          emotion: fearful
        - id: ch01-b12
          speaker: rosald
          text: >-
            我们不能回头。要是就这么逃了，以后还有什么脸见人？这正好能看看我们有多大本领。把马拴在这里，我们爬到岩石上面，再往下滚石头砸他们。
        - id: ch01-b13
          speaker: geirald
          text: >-
            那就试一试吧。这样一来，我们的马也不会落到他们手里。
        - id: ch01-b14
          speaker: narrator
          text: >-
            两个人轻手轻脚地爬上岩石。强盗们早已埋伏好，只等猎物从几码外的转角出现。谁知猎物没来，一阵巨石却从头顶砸下，当场压死了六个强盗。剩下的人冲上岩顶，可他们刚冒出头，罗萨尔德的剑就扫了过来，把他们一个接一个劈进山谷。
        - id: ch01-b15
          speaker: narrator
          text: >-
            最后，高个子汉库尔跃上岩石，一把抱住罗萨尔德的腰，还打飞了他的剑。两人拼命扭打，身子摇摇晃晃，离悬崖边越来越近。罗萨尔德比强盗瘦小，眼看就要被推下去了。危急中，他伸出左手，拔出强盗鞘里的剑，一剑刺进对方心口。
        - id: ch01-b16
          speaker: narrator
          text: >-
            罗萨尔德从死去的首领身上取下一枚漂亮的戒指。戒指上镶着一颗很大的宝石，他便把它戴在自己手上。这场胜利很快传遍全国。人们常常拦住吉拉尔德的马，请他准许大家看一看强盗的戒指。据说，那戒指原来属于当今国王的父亲，后来才被强盗偷走。
        - id: ch01-b17
          speaker: narrator
          text: >-
            每逢有人请求，吉拉尔德总是骄傲地把戒指展示给他们看。他听着众人一句接一句地称赞，心里越发得意。谁也没有起过疑心，更没有人猜到，真正消灭十二个强盗的其实另有其人。
    - id: ch02
      title: 巨人的头颅
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            几天后，两人离开这个王国，继续向前赶路。他们来到另一个国家，打算在这里停留，一直住到冬天结束。吉拉尔德喜欢舒服，不愿冒着冰雪赶路。可这里的国王不肯白白准许他们留下。他提出一个条件，冬天结束以前，两人必须再做一件勇敢的事，证明传闻没有夸大。
        - id: ch02-b02
          speaker: narrator
          text: >-
            罗萨尔德听了很高兴。吉拉尔德心想，只要罗萨尔德还在身边，事情总会顺利。于是，他们一起向国王深深鞠躬，说国王只管下令，他们一定服从。
        - id: ch02-b03
          speaker: king
          text: >-
            好，那就听着。我国东北住着一个巨人，他有一根二十码长的铁杖，挥起来快得吓人。就算五十名骑士一起上，也不是他的对手。宫廷里最勇敢、最强壮的年轻人，都死在那根铁杖下面。你们既然轻易打败了十二个强盗，我想，你们也有希望制服他。三天以后动身。
        - id: ch02-b04
          speaker: rosald
          text: 我们一定会准备好，陛下。
        - id: ch02-b05
          speaker: narrator
          text: >-
            吉拉尔德站在一旁，一句话也没说。等两个人走出城堡，他马上叫了起来。
        - id: ch02-b06
          speaker: geirald
          text: >-
            那个巨人杀过五十名骑士，我们怎么可能赢？国王分明想除掉我们！好在这三天里，他不会再理会我们。时间足够了，我们可以越过国境，逃到他找不到的地方。
          emotion: fearful
        - id: ch02-b07
          speaker: rosald
          text: >-
            我们也许杀不了巨人，可不试一试就逃走，绝对不行。再想想看，要是真把他杀了，那该有多光荣！我已经知道该用什么兵器。你跟我来，我现在就去准备。
        - id: ch02-b08
          speaker: narrator
          text: >-
            罗萨尔德拉着朋友走进一家铺子，买下一大块实心铁。铁块重得两个人几乎抬不动，他们费了好大力气，才把它搬进铁匠铺。罗萨尔德请铁匠把它打成一根粗铁棒，一端还要有尖刺。兵器打好以后，他独自夹在腋下，带回住处。
        - id: ch02-b09
          speaker: narrator
          text: >-
            第三天一早，两位年轻人出发了。到了第四天，他们赶到巨人的洞穴，那巨人还没起床。他听见脚步声，爬起来走向洞口，想看看是谁来了。罗萨尔德早料到这一着。他迎面一棒，重重打在巨人额头上，巨人当场倒地。没等对方重新站起，罗萨尔德已经拔出剑，砍下了他的头。
        - id: ch02-b10
          speaker: rosald
          text: 你看，事情并没有想象中那么难。
        - id: ch02-b11
          speaker: narrator
          text: >-
            他把巨人的头装进背后的皮口袋，两人便返回城堡。快到城门时，罗萨尔德取出那颗头，递给吉拉尔德，自己跟在他后面去见国王。
        - id: ch02-b12
          speaker: geirald
          text: 陛下，那个巨人再也不会来烦扰您了。
        - id: ch02-b13
          speaker: narrator
          text: >-
            吉拉尔德把头颅献了上去。国王激动地搂住他，亲吻他，还说他是全世界最勇敢的骑士。国王下令为吉拉尔德和罗萨尔德举办宴会，又要把这项功绩传遍全国。吉拉尔德越听越得意，几乎忘了真正杀死巨人的人是罗萨尔德。
    - id: ch03
      title: 女王的侍从
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            不久，城堡里传开一个消息。这里住着一位美丽的年轻女王，她会带着二十四名漂亮的侍女出席宴会。女王还是个小姑娘时，父母就去世了，她从此由舅父，也就是这里的国王照管。如今她已经能亲自治理自己的国家了，可臣民不愿让一位女子统治，坚持要她找个丈夫帮忙。
        - id: ch03-b02
          speaker: narrator
          text: >-
            许多王子先后来求婚，女王却一个也看不中。她告诉大臣，真要嫁人，就得由她亲自挑选，他们选来的人，她绝不接受。大臣们便叫她独自管理国家。偏偏女王不懂政务，把事情弄得一团糟，最后索性撒手，投奔舅父来了。
        - id: ch03-b03
          speaker: narrator
          text: >-
            女王听说两位年轻人杀死了巨人，心里十分钦佩他们的勇气。她当即表示，只要举办庆功宴，自己一定出席。她果然带着侍女来到了宴会上。宴会结束后，她向身为监护人的国王提出，要让这两位杀过强盗和巨人的英雄，在第二天各自同她的一名侍从比武。
        - id: ch03-b04
          speaker: narrator
          text: >-
            国王欣然同意，立刻命人准备赛场。他以为这两位出名的勇士，一定很乐意再添一份荣誉。可当天夜里，吉拉尔德却使尽力气，要劝罗萨尔德和他偷偷逃出城堡。
        - id: ch03-b05
          speaker: geirald
          text: >-
            我才不信那些人真是侍从。他们一定是久经沙场的骑士。我们这么年轻，又没参加过多少比武，怎么可能是他们的对手？
          emotion: fearful
        - id: ch03-b06
          speaker: rosald
          text: 对手越厉害，我们赢了以后，不就越光荣吗？
        - id: ch03-b07
          speaker: narrator
          text: >-
            吉拉尔德根本听不进去。他说自己一点也不稀罕荣誉，就算全世界的荣誉都堆在面前，也比不上活着。他非走不可。罗萨尔德已经答应陪伴他，所以也必须一起走。
        - id: ch03-b08
          speaker: narrator
          text: >-
            罗萨尔德听得很难过。他知道劝不动吉拉尔德，只好另想办法，阻止这次丢脸的逃亡。忽然，他有了主意。
        - id: ch03-b09
          speaker: rosald
          text: >-
            我们交换衣服吧。由我替你上场，赢来的荣誉还是算你的。不会有人知道真相。
        - id: ch03-b10
          speaker: narrator
          text: >-
            吉拉尔德马上答应了。那名所谓的侍从，究竟是不是一位久经沙场的骑士，谁也说不准。不过，罗萨尔德这一仗确实打得非常辛苦。他和对手三次猛烈撞在一起，震得两匹马都连连踉跄。
        - id: ch03-b11
          speaker: narrator
          text: >-
            有一回，罗萨尔德打落了对方的头盔，自己也挨了一记重击，在马鞍上摇晃起来。观众高声呐喊。一会儿这个占上风，一会儿那个像是要赢。最后，罗萨尔德把长矛抵进对手胸前的铠甲，稳稳地把对方逼得向后倒去。
        - id: ch03-b12
          speakers: [spectator_1, spectator_2, spectator_3]
          ensemble: chorus
          text: 他落马了！他落马了！
          emotion: surprised
        - id: ch03-b13
          speaker: narrator
          text: >-
            罗萨尔德也跳下马，把对手扶了起来。趁着场上一片混乱，他悄悄溜走，把原来的衣服还给吉拉尔德。吉拉尔德就穿着那套在比武中扯破、沾满尘土的衣服，前去接受国王召见。
        - id: ch03-b14
          speaker: king
          text: 你果然没有让我失望。现在说吧，你想要什么奖赏？
        - id: ch03-b15
          speaker: geirald
          text: >-
            陛下，请把您的外甥女，也就是女王，嫁给我。我会保护她的国家，不让任何敌人伤害它。
        - id: ch03-b16
          speaker: king
          text: >-
            她再也找不到比你更好的丈夫。只要她愿意，我就答应这门婚事。
    - id: ch04
      title: 一次又一次考验
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            国王转身看向女王。她没有观看比武，这时才悄悄来到国王右边坐下。女王的目光非常敏锐。站在眼前的男人虽然高大英俊，可她总觉得，他和赛场上的骑手有许多细小的不同，其中一处尤其明显。
        - id: ch04-b02
          speaker: narrator
          text: >-
            女王不明白这里面怎么会有骗局，更不明白真正的胜者为什么愿意把奖赏送给别人。不过，她心里有个声音提醒她，一定要当心。
        - id: ch04-b03
          speaker: queen
          text: >-
            舅父，您满意了，我还没有。我需要再看一个证明。请让这两位年轻人现在就彼此比武。我要嫁的人，必须亲手杀过强盗和巨人，也必须是打败我侍从的那个人。
        - id: ch04-b04
          speaker: narrator
          text: >-
            吉拉尔德的脸一下变得惨白。他知道这回逃不掉了。他相信罗萨尔德一定会守约到底，可就算罗萨尔德故意相让，又怎么瞒得过国王和满朝人的眼睛？尤其是那位年轻女王。吉拉尔德越想越觉得，她也许早就在怀疑自己。
        - id: ch04-b05
          speaker: narrator
          text: >-
            比武开始了。罗萨尔德故意收着力气。他发动的进攻，原本就没打算成功。那些本来轻易能挡开的招式，他也故意让它们打中。装模作样地抵抗了很久以后，罗萨尔德终于重重摔在地上。
        - id: ch04-b06
          speaker: narrator
          text: >-
            倒下去时，他心里明白，自己让出的不只是本来属于他的荣誉。他还把女王的手让给了别人，而这份奖赏，比所有荣誉都更加珍贵。
        - id: ch04-b07
          speaker: narrator
          text: >-
            吉拉尔德甚至不肯等一等，看看罗萨尔德有没有受伤。他直接走到王旗飘扬的墙边，要求领取如今属于自己的奖赏。围观的人全都望向女王，以为她会俯身送给胜者一件信物。
        - id: ch04-b08
          speaker: narrator
          text: >-
            可女王只是优雅地笑了笑。她说，在决定嫁人以前，还要再加一场考验，不过这一定是最后一场。
        - id: ch04-b09
          speaker: queen
          text: >-
            明天上午十点，举行最后一次比武。吉拉尔德和罗萨尔德各自迎战宫廷里的一名骑士。谁能把对手挑下马，谁就能得到我，也能得到我的王国。
        - id: ch04-b10
          speaker: narrator
          text: >-
            那天夜里，吉拉尔德一直在房中走来走去。他不敢面对第二天的比武，只顾拼命寻找逃避的办法。整整一夜，他从房门走到窗前，又从窗前走回房门，始终没有停下来。
        - id: ch04-b11
          speaker: narrator
          text: >-
            第二天，号角吹响，参赛的人都骑马进入赛场，唯独吉拉尔德不见了。国王派出使者，要他们查清吉拉尔德出了什么事。众人最后发现，他正躲在床底下，怕得浑身发抖。现在，再也不需要别的证明。国王宣布这场比武已经没有必要，女王也说自己完全满意，愿意嫁给罗萨尔德。
    - id: ch05
      title: 戒指揭开的真相
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 后来，女王和罗萨尔德单独在一起，她向他讲明了真相。
        - id: ch05-b02
          speaker: queen
          text: >-
            你忘了一件事。高个子汉库尔从我父亲那里偷走的戒指，我在你右手上认出来了。所以我早就知道，消灭那群强盗的人是你，不是吉拉尔德。
        - id: ch05-b03
          speaker: queen
          text: >-
            和你比武的那个侍从，其实就是我。那时，我又看见戒指戴在你的手上。可吉拉尔德来向我领取奖赏时，手上却没有戒指。我这才要求你们两个人交手。
        - id: ch05-b04
          speaker: queen
          text: >-
            可你宁愿牺牲自己，也不肯违背诺言，我的计划没有成功，只好再想一个办法。一个人若肯付出任何代价也要守信，我就能够相信他。我能把自己托付给他，也能把我的人民托付给他。
          emotion: calm
        - id: ch05-b05
          speaker: narrator
          text: >-
            于是，罗萨尔德和女王结了婚。他们一同回到女王的国家，把那里治理得很好，也一直过得很幸福。
        - id: ch05-b06
          speaker: narrator
          text: >-
            许多年以后，一个穷乞丐来到宫门前。他念着往日的情分，向宫里讨要一些钱财。这个乞丐，正是吉拉尔德。
        - id: ch05-b07
          speaker: narrator
          text: 本故事选自《新冰岛民间故事》。
