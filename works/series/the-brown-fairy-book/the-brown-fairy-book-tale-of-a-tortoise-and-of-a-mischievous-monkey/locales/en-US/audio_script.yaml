  chapters:
    - id: ch01
      title: The Tortoise Proves His Strength
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a country whose rivers were broader and whose forests were deeper than any others. Few people ever entered it, so the wild creatures had the whole place to themselves. They played the strangest games. Thick flowering vines linked the great trees, with scarlet and yellow blossoms shining among the leaves. Monkeys hid there until a puma or an elephant passed below. Then they leaped onto its back for a ride and swung away on the vines when they had enough. Huge tortoises lived beside the rivers. They may look dull and slow to us, but these tortoises were wonderfully clever. Again and again, they outwitted friends far livelier than themselves.
        - id: ch01-b02
          speaker: narrator
          text: One tortoise in particular always got the better of everyone. The forest was full of tales about him, and his adventures began when he was young. Tired of staying home with his father and mother, he walked away one day to seek his fortune. In a broad clearing, he found an elephant eating supper before his evening bath in the nearby river.
        - id: ch01-b03
          speaker: tortoise
          text: Let us find out which one of us is stronger.
        - id: ch01-b04
          speaker: narrator
          text: The elephant was greatly amused by such boldness from such a little creature.
        - id: ch01-b05
          speaker: elephant
          text: Very well. When shall we have this trial?
        - id: ch01-b06
          speaker: tortoise
          text: In an hour. I have some business to finish first.
        - id: ch01-b07
          speaker: narrator
          text: Away he hurried, as fast as his short legs could carry him. A whale was resting in a river pool, blowing water high into the air like a lovely fountain. The young tortoise was too busy to admire it. He called for the whale to stop and listen.
        - id: ch01-b08
          speaker: tortoise
          text: Would you care to see which of us is stronger?
        - id: ch01-b09
          speaker: narrator
          text: The whale looked at him and sent up one more fountain.
        - id: ch01-b10
          speaker: whale
          text: Certainly. When do you want to begin? I am ready now.
        - id: ch01-b11
          speaker: tortoise
          text: Give me one of your longest bones. I will fasten it to my leg. When I call out, pull as hard as you can, and we will see who pulls harder.
        - id: ch01-b12
          speaker: whale
          text: Very good.
        - id: ch01-b13
          speaker: narrator
          text: The whale took out a bone and passed it over. With one end in his mouth, the tortoise went back to the clearing.
        - id: ch01-b14
          speaker: tortoise
          text: I will tie this to your leg just as it is tied to mine. Then we both pull with all our strength, and we will soon know who is stronger.
        - id: ch01-b15
          speaker: narrator
          text: He wound the bone carefully around the elephant's leg and knotted it tight.
        - id: ch01-b16
          speaker: tortoise
          text: Now!
        - id: ch01-b17
          speaker: narrator
          text: The tortoise plunged into a thick bush. The whale pulled one end while the elephant pulled the other. Neither guessed that the tortoise was not his opponent. When the whale gave his strongest tug, the elephant slid into the water. When the elephant pulled hardest, the whale came scraping onto the land. They were evenly matched, and their struggle went on and on.
        - id: ch01-b18
          speaker: narrator
          text: At last both were exhausted. The watching tortoise saw that they could do no more. He crept from the bush, dipped himself in the river, and approached the elephant as though he had been pulling from the water.
        - id: ch01-b19
          speaker: tortoise
          text: I see you are stronger than I expected. Shall we stop for today?
        - id: ch01-b20
          speaker: narrator
          text: Then he dried himself on moss and went to the whale.
        - id: ch01-b21
          speaker: tortoise
          text: I see you are stronger than I expected. Shall we stop for today?
        - id: ch01-b22
          speaker: narrator
          text: Both opponents were only too glad to rest. For the rest of their lives, each believed that the tortoise was stronger than either elephant or whale.
    - id: ch02
      title: Seven Years Underground
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: A day or two later, the young tortoise met a fox while out walking.
        - id: ch02-b02
          speaker: tortoise
          text: Why not see which of us can stay buried underground for seven years?
        - id: ch02-b03
          speaker: fox
          text: I would be delighted, but I would rather you went first.
        - id: ch02-b04
          speaker: tortoise
          text: That makes no difference to me. Come back tomorrow and you will see that I have kept my side of the bargain.
        - id: ch02-b05
          speaker: narrator
          text: The tortoise looked around and found a handy hole beneath an orange tree. He crawled inside. Next morning, the fox piled earth around him and promised to bring fresh fruit every day. The fox did come each sunrise, but only to ask how the tortoise was doing.
        - id: ch02-b06
          speaker: tortoise
          text: I am doing very well, though I wish you would give me some fruit.
        - id: ch02-b07
          speaker: fox
          text: Sadly, the fruit is not ripe enough for you yet.
        - id: ch02-b08
          speaker: narrator
          text: The fox hoped hunger would kill the tortoise long before seven years had passed.
        - id: ch02-b09
          speaker: tortoise
          text: Oh dear, I am terribly hungry!
          emotion: sad
        - id: ch02-b10
          speaker: fox
          text: I am sure you are. Never mind. Tomorrow everything will be all right.
        - id: ch02-b11
          speaker: narrator
          text: The fox trotted away. He did not know that ripe oranges fell through the hollow trunk and dropped straight into the hole. The tortoise had all he could eat. Seven years passed, and when he climbed out, he was as fat as ever.
        - id: ch02-b12
          speaker: narrator
          text: Now the fox had to take his turn. He chose a hole, and the tortoise covered him with earth. He promised to return every day or two with a tender young bird for the fox's dinner. Whenever he visited, his voice was cheerful.
        - id: ch02-b13
          speaker: tortoise
          text: Well, how are you managing down there?
        - id: ch02-b14
          speaker: fox
          text: Quite well, except that I wish you had brought a bird.
        - id: ch02-b15
          speaker: tortoise
          text: I have had dreadful luck and could not catch one. I am sure tomorrow will go better.
        - id: ch02-b16
          speaker: narrator
          text: There were not many tomorrows. On one visit, the tortoise called his usual question and heard nothing. The fox lay motionless in his hole. He had died of hunger.
        - id: ch02-b17
          speaker: narrator
          text: By then the tortoise was grown. All through the forest, creatures feared his strength and respected his wisdom. No one thought him a fast runner, though, until a race with a deer added one more tale to his fame.
        - id: ch02-b18
          speaker: narrator
          text: One day a stag stopped to talk while the tortoise warmed himself in the sun.
        - id: ch02-b19
          speaker: tortoise
          text: Would you like to find out which of us runs faster?
        - id: ch02-b20
          speaker: narrator
          text: The stag found the question so foolish that he merely shrugged. Then the tortoise added that the winner would have the right to kill the loser.
        - id: ch02-b21
          speaker: stag
          text: On that condition, I agree. But I fear you have just chosen your own death.
        - id: ch02-b22
          speaker: tortoise
          text: You cannot frighten me. Give me three days to train. We will start when the sun touches the great tree beside the clearing.
        - id: ch02-b23
          speaker: narrator
          text: The tortoise immediately gathered his brothers and cousins. He hid them beneath ferns all along the clearing, one after another for many miles. Once every relative was in place, he returned to the starting point.
        - id: ch02-b24
          speaker: narrator
          text: The stag arrived on time. As sunlight struck the tree trunk, he raced away and soon left the true tortoise far behind. Every so often he looked back and called to ask how his rival was doing. Whichever tortoise was nearest answered from the ferns.
        - id: ch02-b25
          speaker: tortoise
          text: I am doing fine. I am right behind you.
        - id: ch02-b26
          speaker: narrator
          text: Astonished, the stag ran harder. Each time he called to ask whether the tortoise was still there, another relative answered.
        - id: ch02-b27
          speaker: tortoise
          text: Of course I am here. Where else would I be?
        - id: ch02-b28
          speaker: narrator
          text: The stag ran and ran until he had no strength left. At last he fell dead upon the grass. Whenever the tortoise remembers that race, he still laughs.
    - id: ch03
      title: The Monkey's Chain of Trades
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The tortoise was not the only forest creature famous for his tricks. There was also a monkey just as clever and far more mischievous, for his hands and feet were much quicker. No one could catch him to give him the beating he so often deserved. He simply swung into a tree and laughed down at his angry victim. Now and then, someone was foolish enough to provoke him, and that creature always came off worst.
        - id: ch03-b02
          speaker: narrator
          text: One morning the monkey visited a barber and asked for a shave. The barber bowed, seated his customer, tied a large cloth around his neck, and rubbed soap over his chin. But instead of trimming the beard, he snipped off the very end of the monkey's tail. The cut was tiny, yet the monkey sprang up in more rage than pain.
        - id: ch03-b03
          speaker: monkey
          text: Give me the end of my tail, or I will take one of your razors!
          emotion: angry
        - id: ch03-b04
          speaker: narrator
          text: The barber refused to return the missing piece. So the monkey seized a razor from the table and fled. There was no other razor for miles, and for days afterward, nobody in the forest could be shaved.
        - id: ch03-b05
          speaker: narrator
          text: The monkey headed toward his own palm tree, where coconuts grew ready for him to throw at passersby. Along the way, he met a woman scraping the scales from a fish with a piece of wood. A few people lived in huts beside the river in that part of the forest.
        - id: ch03-b06
          speaker: monkey
          text: That looks like hard work. Use my knife instead. You will finish much faster.
        - id: ch03-b07
          speaker: narrator
          text: He handed her the razor. A few days later, he knocked on the door of her hut.
        - id: ch03-b08
          speaker: monkey
          text: I have come to collect my razor.
        - id: ch03-b09
          speaker: fish_woman
          text: I lost it.
        - id: ch03-b10
          speaker: monkey
          text: If you will not hand it over now, I will take your sardine instead.
        - id: ch03-b11
          speaker: narrator
          text: He did not believe her when she insisted the razor was gone. He snatched up the sardine and ran away.
        - id: ch03-b12
          speaker: narrator
          text: Farther down the path, a baker stood in his doorway eating a loaf.
        - id: ch03-b13
          speaker: monkey
          text: That bread must be rather dry. Have my fish with it.
        - id: ch03-b14
          speaker: narrator
          text: The baker needed no second invitation. Several days later, the monkey returned to his hut.
        - id: ch03-b15
          speaker: monkey
          text: I have come back for my fish.
        - id: ch03-b16
          speaker: baker
          text: Your fish? But I ate it!
          emotion: surprised
        - id: ch03-b17
          speaker: monkey
          text: Then I will take this barrel of meal in its place.
        - id: ch03-b18
          speaker: narrator
          text: Off he walked with the barrel tucked beneath his arm. Before long, he saw a woman teaching a group of little girls how to arrange their hair.
        - id: ch03-b19
          speaker: monkey
          text: Here is something you can use to bake cakes for the children.
        - id: ch03-b20
          speaker: narrator
          text: He set down the barrel, which had grown heavy. The delighted children hurried to find flat stones. They baked the cakes, ate every one, and thought nothing had ever tasted better. When the monkey returned later, they rushed to meet him, hoping for another present. He ignored their questions and spoke only to their mother.
        - id: ch03-b21
          speaker: monkey
          text: I have come to collect my barrel of meal.
        - id: ch03-b22
          speaker: mother
          text: But you gave it to me so I could make cakes!
          emotion: surprised
        - id: ch03-b23
          speaker: monkey
          text: If I cannot have my barrel, I will take one of your children. I need someone to bake bread when I tire of fruit, and to make coconut cakes for me.
        - id: ch03-b24
          speaker: mother
          text: Please leave my child with me. I will find another whole barrel for you.
          emotion: sad
        - id: ch03-b25
          speaker: monkey
          text: I do not want another barrel. I want that very one.
          emotion: angry
        - id: ch03-b26
          speaker: narrator
          text: The mother stood wringing her hands. The monkey picked up the little girl he thought prettiest and carried her home to his palm tree. She never returned to the hut. Still, she was not much to be pitied. Monkeys were nearly as good as children for playmates. They taught her to swing, climb, fly from tree to tree, and do everything else they knew, which was a great deal.
    - id: ch04
      title: Jack-in-the-Green
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The monkey's troublesome tricks earned him many enemies, but the puma hated him most. Only those two knew how their quarrel began. Everyone else knew enough to stay away whenever they might meet. Again and again, the puma set traps that seemed impossible to escape. The monkey pretended not to notice and walked toward each snare until the hidden puma felt sure of him. Then laughter rang out overhead. A grinning face appeared among the vines and vanished before the puma could reach it.
        - id: ch04-b02
          speaker: narrator
          text: This went on for a long time. Then came a season unlike any the oldest parrot could remember. Usually hundreds of inches of rain fell, but now month followed month without one cloud. Rivers and springs dried up until a single little pool held the only drinking water for miles. Every animal grieved over the drought except the puma. For years he had thought of nothing but capturing the monkey. Now, he believed, his chance had come. He would hide in the thicket by the pool. The monkey had to drink, and when he bent down, the puma would spring. This time there could be no escape.
        - id: ch04-b03
          speaker: narrator
          text: There truly would have been none if the puma had been more patient. In his excitement, he shifted too soon. As the monkey bent to drink, he heard leaves rustle and turned. Two murderous yellow eyes flashed from the bushes. He sprang with all his strength, caught a hanging vine, and landed on a branch. The puma burst from cover so close that his breath touched the monkey's feet. Never had the monkey come so near death. A long time passed before he dared go down to the ground again.
        - id: ch04-b04
          speaker: narrator
          text: Safe among the branches, the monkey searched for a way around the puma's traps. Chance finally helped him. A man came along the path with a large gourd of honey balanced on his head. When the man passed beneath the tree, the monkey hung down and snatched it. The man could only stare upward, since he could not climb after him.
        - id: ch04-b05
          speaker: narrator
          text: The monkey smeared honey all over his body. Then he gathered leaves from a nearby vine and pressed them into the sticky coating until he looked like a walking bush. He hurried to the pool to inspect himself. Pleased with what he saw, he went looking for adventure.
        - id: ch04-b06
          speaker: narrator
          text: Soon the whole forest heard of a strange new animal that had come from no one knew where. Asked his name, he called himself Jack-in-the-Green. Beast and bird alike failed to recognize the monkey beneath the leaves, so he could drink from the pool whenever he pleased. When anyone questioned him, he claimed that drinking too deeply had turned his hair into leaves. After that, every creature knew what would happen if it grew greedy for water.
        - id: ch04-b07
          speaker: narrator
          text: In time, the great rains returned. Rivers and streams filled again, and the monkey no longer needed the pool near his enemy's home. One still night, when even the chattering parrots slept on one leg, he crept down from his perch. He washed away the honey and leaves and climbed from the water in his proper skin. On the way to breakfast, he stopped to talk with a rabbit.
        - id: ch04-b08
          speaker: monkey
          text: I feel rather dull. A little hunting might do me good. Would you like to come?
        - id: ch04-b09
          speaker: rabbit
          text: Gladly. But what should we hunt?
        - id: ch04-b10
          speaker: narrator
          text: The young rabbit felt proud that such a large creature had spoken to him. The monkey stroked his chin before answering.
        - id: ch04-b11
          speaker: monkey
          text: There is no glory in hunting an elephant or a tiger. They are so large that they cannot slip out of your way. Catching something small enough to hide behind a leaf takes real skill. I will hunt butterflies, and you can hunt snakes.
        - id: ch04-b12
          speaker: narrator
          text: The inexperienced rabbit thought this was an excellent plan, and they went separate ways. The monkey climbed the nearest tree and quietly ate fruit for most of the day. The rabbit exhausted himself poking his nose into every heap of dry leaves, hoping to uncover a snake. Luckily, all the snakes had gone to a meeting that afternoon. A plump rabbit would otherwise have made them a fine dinner. Finding every pile empty, the rabbit finally fell asleep where he was.
        - id: ch04-b13
          speaker: narrator
          text: The monkey had watched the whole time. He dropped down and yanked the rabbit's ears. Furious, the rabbit swore to have revenge. Catching the monkey off guard was not easy, so he waited a long while for his chance.
        - id: ch04-b14
          speaker: narrator
          text: One day Jack-in-the-Green sat on a stone, wondering what mischief to try next. The rabbit crept up behind him and sharply pulled his tail. With a cry of pain, the monkey darted into a tree. Then he saw that only the rabbit had dared insult him. He chattered furiously and looked so fierce that the rabbit fled into the nearest hole. There he stayed for several days, trembling with fear.
    - id: ch05
      title: The Figure in the Orange Tree
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Soon afterward, the monkey traveled to the edge of the forest. There he found a beautiful garden filled with ripe oranges. Birds loved the place, and each came hoping to carry an orange away for dinner. To frighten them off and save some fruit for himself, the owner had fixed a wax figure to one of the branches.
        - id: ch05-b02
          speaker: narrator
          text: The monkey loved oranges as much as any bird. When he saw what looked like a man standing in the tree with the largest, sweetest fruit, he called up rudely.
        - id: ch05-b03
          speaker: monkey
          text: You there! Throw down that great orange, or I will throw a stone at you.
        - id: ch05-b04
          speaker: narrator
          text: The wax figure paid no attention. Easily angered, the monkey picked up a stone and hurled it with all his strength. Instead of dropping back to earth, it stuck fast in the soft wax.
        - id: ch05-b05
          speaker: narrator
          text: Just then a breeze shook the tree. The orange he wanted fell from its branch. He ate all of it, even the rind, and liked it so much that he wanted another. Once more he ordered the silent figure to throw him fruit. Once more he flung a stone, and this one stuck beside the first.
        - id: ch05-b06
          speaker: narrator
          text: The monkey grew angrier when stones made no difference. He scrambled into the tree and kicked the figure hard. His leg sank into the wax and stayed there.
        - id: ch05-b07
          speaker: monkey
          text: Release me now, or I will kick you again!
          emotion: angry
        - id: ch05-b08
          speaker: narrator
          text: He did kick again, and his other foot became trapped. Blind with anger, he struck first with one hand and then the other. Soon the wax held him hand and foot. Terror joined his rage. As he struggled, he tumbled from the tree and dragged the figure down with him. The fall pulled him free, but both monkey and figure landed in a thorn bed. Bruised and battered, he limped away groaning loudly. When monkeys are hurt, they take care that everyone hears about it.
        - id: ch05-b09
          speaker: narrator
          text: A long time passed before Jack was well enough to travel again. When he recovered, he met his old enemy, the puma. To understand what followed, we must first hear what the puma had done to a stag.
    - id: ch06
      title: The Road to the Dairy
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: One day the puma invited his friend the stag to visit a comrade whose cows gave famous milk. The stag loved milk and gladly agreed. When the sun sank a little lower, the two set out. Their path brought them to a river. Bridges did not exist in those days, so they would have to swim. The stag disliked swimming. He said he felt tired, the milk was not worth such a journey, and he might as well go home. The puma saw through every excuse and laughed.
        - id: ch06-b02
          speaker: puma
          text: This river is hardly deep at all. Your feet will never leave the bottom. Be brave and follow me.
        - id: ch06-b03
          speaker: narrator
          text: The stag feared the river, but he feared ridicule even more. He plunged in behind the puma. At once the current swept him away. By chance it carried him toward a shallow place on the far side, and he managed to scramble onto the bank. Otherwise, he would surely have drowned. He emerged shaking with terror and found the puma waiting.
        - id: ch06-b04
          speaker: puma
          text: You came very close to dying that time.
        - id: ch06-b05
          speaker: narrator
          text: They rested a few minutes while the stag recovered, then continued until they reached a banana grove. The puma gazed hungrily at the fruit.
        - id: ch06-b06
          speaker: puma
          text: Those bananas look excellent, and you must be hungry, my friend. Climb up and pick some. Eat the green ones yourself, since they are the sweetest. Throw the yellow ones down to me. I suppose they will be good enough.
        - id: ch06-b07
          speaker: narrator
          text: The stag obeyed. Climbing was hard for him. His knees grew sore, and his antlers kept catching in the vines. Worse still, the green bananas tasted dreadful. He threw down every piece of fruit, green and yellow, and left the puma to choose. The puma ate a tremendous dinner. Only when he was completely finished did they resume their journey.
        - id: ch06-b08
          speaker: narrator
          text: Next they crossed a maize field where several men were laboring in the heat. As the travelers came near, the puma whispered to the stag.
        - id: ch06-b09
          speaker: puma
          text: Walk ahead of me and call out, “Bad luck to everyone who works!”
        - id: ch06-b10
          speaker: narrator
          text: The stag did as he was told. The tired, overheated workers found no humor in it and set their dogs on him. He had to race away as fast as he could. The puma followed at his ease and addressed the men.
        - id: ch06-b11
          speaker: puma
          text: I hope your hard work brings you the reward it deserves.
        - id: ch06-b12
          speaker: narrator
          text: Pleased by his words, the men offered him maize to eat. Farther along, the puma noticed a little snake with gleaming skin coiled beneath a tree.
        - id: ch06-b13
          speaker: puma
          text: What a beautiful bracelet that would be for your daughter. Pick it up, my friend.
        - id: ch06-b14
          speaker: narrator
          text: The stag bent down and lifted the snake. It bit him. He wheeled angrily on the puma.
        - id: ch06-b15
          speaker: stag
          text: Why did you not warn me that it would bite?
          emotion: angry
        - id: ch06-b16
          speaker: puma
          text: How is it my fault that you are a fool?
        - id: ch06-b17
          speaker: narrator
          text: At last they reached the comrade's home. It was late, and their host was ready for bed. They hung their hammocks in convenient places and went to sleep. In the middle of the night, the puma quietly rose and slipped into the sheepfold. He killed and ate the fattest sheep. Then he filled a bowl with its blood, returned indoors, and sprinkled the sleeping stag. After that, he went back to bed.
        - id: ch06-b18
          speaker: narrator
          text: In the morning, the shepherd went to release his flock and found one sheep gone. He immediately suspected the puma and hurried in to accuse him.
        - id: ch06-b19
          speaker: puma
          text: Me, my good man? Why would you think such a thing? Do you see any blood on me? If someone ate your sheep, it must have been my friend the stag.
        - id: ch06-b20
          speaker: narrator
          text: The shepherd examined the sleeping stag and saw the blood.
        - id: ch06-b21
          speaker: shepherd
          text: So you steal my sheep! I will teach you not to do that again.
          emotion: angry
        - id: ch06-b22
          speaker: narrator
          text: With one blow to the skull, the shepherd killed the stag. The noise woke the comrade upstairs, and he came down. The puma greeted him joyfully and asked at once for some of his famous milk, saying he was very thirsty. A large bucket was placed before him. He drank every drop and took his leave.
        - id: ch06-b23
          speaker: narrator
          text: On the way home, the puma met the monkey.
        - id: ch06-b24
          speaker: puma
          text: Do you like milk? I know a place where it is especially good. I can take you there if you wish.
        - id: ch06-b25
          speaker: narrator
          text: The monkey knew the puma would never act kindly without a reason. Still, he trusted himself to stay safe and said he would be pleased to go. Soon they reached the same river.
        - id: ch06-b26
          speaker: puma
          text: The water is very shallow, friend monkey. There is nothing to fear. Jump in first, and I will come behind you.
        - id: ch06-b27
          speaker: monkey
          text: Do you take me for the stag? I would rather follow you. If I cannot, I will go no farther.
        - id: ch06-b28
          speaker: narrator
          text: The puma saw that he could not make the monkey lead. He chose a shallow place and began swimming. The monkey waited until the puma reached midstream, then sprang onto his back. He knew the puma would not dare shake him off and risk being swept into deep water. In that way, both reached the opposite bank.
        - id: ch06-b29
          speaker: narrator
          text: The banana grove stood nearby. The puma meant to repay the monkey for forcing him to provide a ride.
        - id: ch06-b30
          speaker: puma
          text: Look at those fine bananas. Since you enjoy climbing, run up and toss a few down. You may eat the green ones, which are the best, and I will settle for the yellow fruit.
        - id: ch06-b31
          speaker: monkey
          text: Very well.
        - id: ch06-b32
          speaker: narrator
          text: The monkey swung into the tree, ate every yellow banana, and threw down only the green ones.
        - id: ch06-b33
          speaker: puma
          text: I will strike you on the head for that!
          emotion: angry
        - id: ch06-b34
          speaker: monkey
          text: If you talk such nonsense, I will not travel with you.
        - id: ch06-b35
          speaker: narrator
          text: The puma said no more. Minutes later, they came to the maize field where the men were working. The puma tried the same trick again.
        - id: ch06-b36
          speaker: puma
          text: If you want these men to like you, call out, “Bad luck to everyone who works!”
        - id: ch06-b37
          speaker: monkey
          text: Very well.
        - id: ch06-b38
          speaker: narrator
          text: Instead, the monkey smiled and nodded to the workers.
        - id: ch06-b39
          speaker: monkey
          text: I hope your hard work brings you the reward it deserves.
        - id: ch06-b40
          speaker: narrator
          text: The men thanked him warmly and allowed him through. The puma followed behind. Farther on, the shining snake still lay upon the moss.
        - id: ch06-b41
          speaker: puma
          text: What a lovely necklace for your daughter. Pick it up and carry it with you.
        - id: ch06-b42
          speaker: monkey
          text: That is very kind, but I will leave it for you.
        - id: ch06-b43
          speaker: narrator
          text: Nothing more was said about the snake. Before long, they reached the comrade's house and found him preparing for bed. Without stopping to talk, the visitors hung their hammocks. The monkey placed his so high that nobody could reach him. He also decided not to sleep. He lay still and snored loudly instead.
        - id: ch06-b44
          speaker: narrator
          text: When darkness filled the house and everything was silent, the puma crept to the sheepfold. He killed another sheep and returned with a bowl of blood to pour over the monkey. Watching through half-closed eyes, the monkey waited until the puma came close. Then one violent kick sent the bowl flying. All the blood spilled over the puma himself.
        - id: ch06-b45
          speaker: narrator
          text: The puma hurried toward the door, but the shepherd was already coming. With no time to escape, the puma lay down and pretended to sleep.
        - id: ch06-b46
          speaker: shepherd
          text: This is the second sheep I have lost. When I catch the thief, he will be sorry.
          emotion: angry
        - id: ch06-b47
          speaker: narrator
          text: The monkey said nothing. He silently pointed at the sleeping puma. The shepherd bent down and saw the blood.
        - id: ch06-b48
          speaker: shepherd
          text: Ah, so you are the thief! Then take this!
          emotion: angry
        - id: ch06-b49
          speaker: narrator
          text: The shepherd struck the puma on the head with his stick, and the puma died on the spot. Then the monkey climbed down, went into the dairy, and drank all the milk he could find. Afterward, he returned home and married. That is the last anyone heard of him.
