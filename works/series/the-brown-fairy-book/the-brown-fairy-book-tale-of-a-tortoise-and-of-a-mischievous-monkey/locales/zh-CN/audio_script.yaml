audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 温暖庄重，以从容而清晰的语气讲述古老命运故事, timbre: 清澈浑厚, pace: 舒缓, pitch: 中音}
    tortoise:
      display_name: 陆龟
      tts: {delivery: 机灵自信，话里总藏着盘算, timbre: 沉稳圆润, pace: 适中, pitch: 中低音}
    elephant:
      display_name: 大象
      tts: {delivery: 厚重直率，带着不以为意的豪爽, timbre: 低沉浑厚, pace: 稍缓, pitch: 低音}
    whale:
      display_name: 鲸
      tts: {delivery: 开阔爽快，说话干脆有力, timbre: 深沉洪亮, pace: 稍缓, pitch: 低音}
    fox:
      display_name: 狐狸
      tts: {delivery: 狡猾轻慢，得意时透着虚伪, timbre: 尖细清晰, pace: 适中, pitch: 中高音}
    deer:
      display_name: 雄鹿
      tts: {delivery: 骄傲好胜，受惊时急促慌张, timbre: 年轻明亮, pace: 适中, pitch: 中音}
    tortoise_relative_1:
      display_name: 第一只陆龟亲族
      tts: {delivery: 机敏配合，答话利落, timbre: 温厚清晰, pace: 适中, pitch: 中音}
    tortoise_relative_2:
      display_name: 第二只陆龟亲族
      tts: {delivery: 机敏配合，语气笃定, timbre: 圆润清晰, pace: 适中, pitch: 中低音}
    monkey:
      display_name: 猴子
      tts: {delivery: 淘气机警，得意时快活，发怒时尖锐, timbre: 灵活明亮, pace: 稍快, pitch: 中高音}
    fish_woman:
      display_name: 刮鱼的女人
      tts: {delivery: 朴实直接，辩解时略显慌乱, timbre: 成熟柔和, pace: 适中, pitch: 中音}
    baker:
      display_name: 面包师
      tts: {delivery: 随和贪嘴，被追问时惊慌, timbre: 饱满明快, pace: 适中, pitch: 中音}
    mother:
      display_name: 小姑娘的母亲
      tts: {delivery: 慈爱朴实，恳求时焦急哀伤, timbre: 成熟温暖, pace: 适中, pitch: 中音}
    rabbit:
      display_name: 兔子
      tts: {delivery: 年轻热心，受骗后又气又怕, timbre: 轻快清亮, pace: 稍快, pitch: 中高音}
    puma:
      display_name: 美洲狮
      tts: {delivery: 阴险自负，诱骗时故作亲热, timbre: 低沉粗粝, pace: 适中, pitch: 低音}
    shepherd:
      display_name: 牧人
      tts: {delivery: 警觉刚烈，发怒时毫不迟疑, timbre: 粗犷洪亮, pace: 适中, pitch: 中低音}
  chapters:
    - id: ch01
      title: 陆龟的力气
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，有个国家，河流格外宽，森林格外深。那里很少见到人，整片天地几乎都属于野兽，它们常常互相玩些稀奇古怪的游戏。参天大树间缠着粗壮的藤蔓，鲜红和金黄的花开满藤条，正好让猴子藏身。它们躲在暗处，等美洲狮或大象路过，就跳到它们背上兜风，骑够了再抓住藤蔓荡回树梢。河边还住着庞大的陆龟。在我们看来，它们迟缓又笨重，心眼却灵得出奇，不知有多少回把那些活泼得多的朋友耍得团团转。
        - id: ch01-b02
          speaker: narrator
          text: >-
            有一只陆龟尤其厉害，每次较量几乎总能占尽上风，森林里到处都流传着它的许多故事。还在年幼时，它就嫌整天跟父母待在家里太闷，独自出门寻找奇遇。它走进一片林木围住的空地，看见一头大象刚吃过晚饭，正要到附近的河里洗澡。小陆龟大步上前，要跟大象比比力气。
        - id: ch01-b03
          speaker: tortoise
          text: 咱们来较量一下，看看到底谁力气大。
        - id: ch01-b04
          speaker: narrator
          text: 大象正准备吃完晚饭就去河里洗澡。它低头看看这只胆敢挑战自己的小东西，觉得实在有趣。
        - id: ch01-b05
          speaker: elephant
          text: 好啊，什么时候比？
        - id: ch01-b06
          speaker: tortoise
          text: 一个钟头以后。我得先去办件事。
        - id: ch01-b07
          speaker: narrator
          text: 陆龟迈开短腿，拼命赶到河边。水潭里有一条鲸正在歇息，喷出的水柱在空中散成一座美丽的喷泉。可小陆龟年纪还小，又忙着办事，根本没有心思欣赏。
        - id: ch01-b08
          speaker: tortoise
          text: 鲸，咱们比一场吧，看看谁的力气更大。
        - id: ch01-b09
          speaker: narrator
          text: 鲸瞧了它一眼，又喷起一道水柱。
        - id: ch01-b10
          speaker: whale
          text: 当然可以。什么时候开始？我已经准备好了。
        - id: ch01-b11
          speaker: tortoise
          text: 把你最长的骨头给我一根，我要拴在腿上。等我一发信号，你就使劲拉，看咱们谁拉得过谁。
        - id: ch01-b12
          speaker: whale
          text: 好，就这么办。
        - id: ch01-b13
          speaker: narrator
          text: 鲸取出一根骨头交给陆龟。陆龟叼住一端，急忙回去找大象，又把骨头仔细绕在大象腿上，打了个牢牢的结。
        - id: ch01-b14
          speaker: tortoise
          text: 我把这根骨头拴在你腿上，就跟拴在我腿上一样。等会儿咱们都拼命拉，马上就知道谁更强壮。准备，开始！
        - id: ch01-b15
          speaker: narrator
          text: 陆龟喊完，一头钻进身后的密林。鲸在河里使劲拉，大象在岸上拼命拽，谁也不知道绳子另一头根本不是陆龟。鲸一发力，大象就被拖进水里。大象再猛地一拉，鲸又被拽上岸。两个庞然大物势均力敌，斗得十分辛苦，最后全都筋疲力尽。
        - id: ch01-b16
          speaker: narrator
          text: 陆龟躲在旁边看够了，知道游戏该结束了。它先到河里蘸湿身体，再慢慢走到大象面前。
        - id: ch01-b17
          speaker: tortoise
          text: 看来你比我原先以为的还要强。今天就到这里，怎么样？
        - id: ch01-b18
          speaker: narrator
          text: 随后，陆龟在苔藓上擦干身子，又去见鲸。
        - id: ch01-b19
          speaker: tortoise
          text: 看来你比我原先以为的还要强。今天就到这里，怎么样？
        - id: ch01-b20
          speaker: narrator
          text: 两个对手巴不得赶紧歇下。从那天起，直到生命尽头，它们始终相信，陆龟的力气终究胜过自己。
    - id: ch02
      title: 七年与一场赛跑
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一两天后，小陆龟散步时遇见狐狸，停下来若无其事地跟它说话。
        - id: ch02-b02
          speaker: tortoise
          text: 咱们比比谁能埋在土里待上七年，怎么样？
        - id: ch02-b03
          speaker: fox
          text: 我太乐意了，不过你得先来。
        - id: ch02-b04
          speaker: tortoise
          text: 谁先都一样。你明天来看看，就知道我已经照约定做了。
        - id: ch02-b05
          speaker: narrator
          text: 陆龟四处寻找，终于在一棵橙树脚下发现一个合用的洞。它爬了进去。第二天早晨，狐狸在洞口堆满泥土，答应每天送新鲜水果来。狐狸的诺言只守了一半。每天太阳升起，它都会来问陆龟过得怎样，却从不带吃的。
        - id: ch02-b06
          speaker: tortoise
          text: 我还不错。你要是肯给我一点水果，那就更好了。
        - id: ch02-b07
          speaker: fox
          text: 唉，果子还没熟，现在不能给你。
        - id: ch02-b08
          speaker: narrator
          text: 狐狸只盼七年还没过完，陆龟就先饿死。
        - id: ch02-b09
          speaker: tortoise
          text: 哎呀，哎呀，我快饿坏了！
        - id: ch02-b10
          speaker: fox
          text: 我敢说你一定饿得厉害。不过别急，明天就好了。
        - id: ch02-b11
          speaker: narrator
          text: 狐狸说完便一溜烟跑了。它还以为陆龟只能在土里忍饥挨饿，哪里知道橙树的树干是空的，熟橙子会一直顺着树干滚进洞里，多得陆龟根本吃不完。就这样，一天又一天，整整七年过去了。陆龟从洞里爬出来时，还是跟从前一样肥胖。
        - id: ch02-b12
          speaker: narrator
          text: 这下轮到狐狸了。狐狸选好洞，陆龟在四周堆上泥土，还答应每隔一两天捉一只鲜嫩的小鸟给它当晚饭。每次来探望，陆龟都兴冲冲地问同一句话。
        - id: ch02-b13
          speaker: tortoise
          text: 怎么样，日子过得还好吗？
        - id: ch02-b14
          speaker: fox
          text: 还算好，就是你一只鸟也没带来。
        - id: ch02-b15
          speaker: tortoise
          text: 我的运气实在太差，什么也没捉到。不过明天准会走运，我保证。
        - id: ch02-b16
          speaker: narrator
          text: 可没过几个这样的“明天”，陆龟再来问话时，洞里已经没有回答。狐狸静静躺在那里，早就饿死了。
        - id: ch02-b17
          speaker: narrator
          text: 这时，陆龟已经长大。整座森林都敬畏它，把它当成既有力量又有智慧的大人物。可谁也不觉得它跑得快，直到它和一头雄鹿相遇，又为自己添上一桩威名。那天陆龟正在暖暖的阳光下晒太阳，雄鹿从旁边经过，停下来跟它聊了几句。
        - id: ch02-b18
          speaker: tortoise
          text: 你想不想看看，咱们两个谁跑得更快？
        - id: ch02-b19
          speaker: narrator
          text: 雄鹿觉得这问题傻透了，只耸了耸肩。陆龟接着提出，胜者可以杀死败者。
        - id: ch02-b20
          speaker: deer
          text: 要是有这个条件，我就答应。不过恐怕你已经是个死人了。
        - id: ch02-b21
          speaker: tortoise
          text: 吓唬我没有用。给我三天训练。三天后，太阳照到大空地边上那棵大树时，咱们就起跑。
        - id: ch02-b22
          speaker: narrator
          text: 陆龟召来所有兄弟和表亲，沿着空地边缘，把它们一个个藏在蕨草底下。长长的队伍像一架伸出许多英里的梯子。全都安排妥当，陆龟才回到起点。
        - id: ch02-b23
          speaker: narrator
          text: 雄鹿准时赴约。阳光一照上树干，它就飞奔出去，转眼把起点的陆龟甩得没影了。它边跑边回头喊。
        - id: ch02-b24
          speaker: deer
          text: 你跑得怎么样了？
        - id: ch02-b25
          speaker: tortoise_relative_1
          text: 好得很，我就在你后面！
        - id: ch02-b26
          speaker: narrator
          text: 雄鹿惊讶极了，只能跑得更快。可它怎么也甩不掉那个声音。
        - id: ch02-b27
          speaker: deer
          text: 你还跟着吗？
        - id: ch02-b28
          speaker: tortoise_relative_2
          text: 当然跟着。我不在这里，还能在哪里？
        - id: ch02-b29
          speaker: narrator
          text: 雄鹿一直跑，一直跑，一刻也不敢停。最后，它再也迈不动腿，一头倒在草地上死了。这场赛跑又给陆龟添了一桩威名。直到今天，它想起这件事，还是会笑个不停。
    - id: ch03
      title: 从尾巴尖到小姑娘
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 森林里的恶作剧并不全是陆龟干的。还有一只大名鼎鼎的猴子，同样聪明，却淘气得多。它手脚灵活，谁也抓不住它。闯了祸，它只消攀住藤蔓荡上树，就能对着树下怒气冲冲的受害者哈哈大笑。偏偏有些居民还会主动招惹它，理发师就是一个。
        - id: ch03-b02
          speaker: narrator
          text: 一天早晨，猴子来刮脸。理发师客气地鞠躬，请它坐下，在它颈上围好布，又往下巴抹了肥皂。他没有刮猴子的胡子，却拿起剪刀，“咔嚓”一声剪掉一小截尾巴。伤处并不很疼，猴子却气得跳了起来。
        - id: ch03-b03
          speaker: monkey
          text: 把我的尾巴尖还给我！你要是不还，我就拿走一把剃刀！
          emotion: angry
        - id: ch03-b04
          speaker: narrator
          text: 理发师不肯交出尾巴尖，猴子抓起桌上的剃刀就跑。方圆许多英里再找不到第二把剃刀，森林里的人一连几天都没法刮脸。
        - id: ch03-b05
          speaker: narrator
          text: 猴子往自己常住的棕榈树走。那棵树结满椰子，最适合拿来砸过路人。路上，它遇见一个住在河边的女人，正用木片费劲地刮鱼鳞。
        - id: ch03-b06
          speaker: monkey
          text: 这么刮鱼一定很累。试试我这把刀，干起来快得多。
        - id: ch03-b07
          speaker: narrator
          text: 猴子说着便把剃刀递给女人，让她拿去刮鱼鳞。几天后，它沿着原路回来，走到小屋门前敲响了门。
        - id: ch03-b08
          speaker: monkey
          text: 我来拿回那把剃刀。
        - id: ch03-b09
          speaker: fish_woman
          text: 剃刀让我弄丢了。
        - id: ch03-b10
          speaker: monkey
          text: 我可不信。你现在不还，我就把你的沙丁鱼拿走。
        - id: ch03-b11
          speaker: narrator
          text: 女人一遍遍说刀确实不在自己这里。猴子根本不相信，也不再听她解释，拿起她的沙丁鱼就跑了。
        - id: ch03-b12
          speaker: narrator
          text: 往前走了一段，猴子看见面包师站在门口吃面包。
        - id: ch03-b13
          speaker: monkey
          text: 光吃面包多干啊，来尝尝我的鱼。
        - id: ch03-b14
          speaker: narrator
          text: 面包师根本不用再劝。几天后，猴子又来到他的小屋前。
        - id: ch03-b15
          speaker: monkey
          text: 我是来拿那条鱼的。
        - id: ch03-b16
          speaker: baker
          text: 那条鱼？可我早就吃掉了！
          emotion: surprised
        - id: ch03-b17
          speaker: monkey
          text: 既然让你吃了，我就拿这桶面粉抵吧。
        - id: ch03-b18
          speaker: narrator
          text: 猴子把面粉桶夹在腋下，继续赶路。它看见一个女人带着一群小姑娘，正在教她们梳头。
        - id: ch03-b19
          speaker: monkey
          text: 我带了些面粉，正好给孩子们做饼。
        - id: ch03-b20
          speaker: narrator
          text: >-
            猴子放下沉重的木桶。小姑娘们高兴极了，马上找来平石烤饼。她们吃完，都觉得从没尝过这么香的东西。没过多久，猴子又来了。孩子们一齐跑去迎接，还以为它又带了礼物。猴子不理会她们的问题，只对母亲开口。
        - id: ch03-b21
          speaker: monkey
          text: 我来拿回那桶面粉。
        - id: ch03-b22
          speaker: mother
          text: 什么？那桶面粉不是你送来给我们做饼的吗？
          emotion: surprised
        - id: ch03-b23
          speaker: monkey
          text: 拿不回原来那桶面粉，我就带走你的一个孩子。等我吃水果吃腻了，正好让她替我烤面包，还得会做椰子饼。
        - id: ch03-b24
          speaker: mother
          text: 求求你，别带走我的孩子！我会另外找一桶面粉给你。
          emotion: sad
        - id: ch03-b25
          speaker: monkey
          text: 我不要别的，只要原来那一桶。
        - id: ch03-b26
          speaker: narrator
          text: 女人站在那里，不停地绞着双手，又没有办法交出已经吃完的面粉。猴子看遍那群孩子，选中自己觉得最漂亮的小姑娘，一把将她抱起，带回棕榈树上的家。
        - id: ch03-b27
          speaker: narrator
          text: 小姑娘再也没有回到那间小屋。不过，她倒不太值得可怜。猴子玩起来几乎和孩子一样有趣。它们教她荡秋千、爬树，还教她从一棵树飞跃到另一棵，把自己懂的事全教给了她，而猴子懂的事情可真不少。
    - id: ch04
      title: 绿叶杰克
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            猴子的把戏让它在树下结了不少仇敌，最恨它的就是美洲狮。它们为何结仇，只有它们自己知道。森林里的动物只知道，这两个家伙势不两立。美洲狮一次次设下自以为万无一失的圈套。猴子偏要装作没看见，眼看就要走进陷阱，却忽然从藤蔓间探出龇牙咧嘴的脸，放声大笑，再赶在美洲狮扑来以前消失。
        - id: ch04-b02
          speaker: narrator
          text: >-
            这样的日子过了很久。有一年，天气反常得连森林里最老的鹦鹉也从没见过。往年大家习以为常的两三百英寸雨水，一滴也不再落下。一个月又一个月，天空连一片云也没有。河流和泉水一天天变浅，最后全都干涸，只剩一口小水潭，所有动物都得到那里喝水。方圆许多英里的动物没有一个不为这场旱灾发愁，只有美洲狮暗自高兴。它多年都在盘算怎样抓住猴子，如今便躲进潭边的灌木，只等猴子非来不可时猛扑出去。
        - id: ch04-b03
          speaker: narrator
          text: >-
            要是美洲狮更有耐心，猴子这回真逃不掉。可它太激动，动手早了一点。猴子俯身喝水时听见沙沙声，回头正好看见两只凶狠的黄眼睛。它猛地跃起，抓住头顶的藤蔓，翻身落到树枝上。美洲狮扑出来，呼出的气几乎碰到它的脚。猴子从没离死亡这样近，过了很久才敢重新下地。
        - id: ch04-b04
          speaker: narrator
          text: >-
            猴子躲在高高的树冠里，琢磨该怎样避开这道圈套。它往地上一看，一个人正沿小路走来，头顶托着装满蜂蜜的大葫芦。等那人来到树下，猴子倒挂下来，一把抢走葫芦。那人不会爬树，只能仰头发愣。
        - id: ch04-b05
          speaker: narrator
          text: >-
            猴子把蜂蜜涂遍全身，又从藤蔓上扯下许多叶子，一片片粘到蜂蜜上，直到自己像一丛会走路的灌木。它跑到水潭边照照模样，满意极了。没过多久，森林里就传开一个消息，说这里来了一种从未见过的动物。谁问它叫什么，它便回答自己叫“绿叶杰克”。
        - id: ch04-b06
          speaker: narrator
          text: >-
            靠着这身装扮，猴子想去水潭喝多少水都行，飞禽走兽没有谁能认出它，更没有谁把它当成美洲狮正在等的那只猴子。有人追问它为什么长着叶子，它就说自己喝了太多潭水，身上的毛才变成了这样。大家听完这番解释，都以为自己已经明白，水喝得太贪会落到什么下场。
        - id: ch04-b07
          speaker: narrator
          text: >-
            后来，大雨终于又落下来。河流溪涧重新涨满，猴子不必再去美洲狮守着的水潭。一天深夜，连话最多的鹦鹉也单脚站着睡着了。猴子悄悄爬下树，洗掉蜂蜜和叶子，终于变回原来的模样。去吃早饭的路上，它遇见一只兔子，便停下来说话。
        - id: ch04-b08
          speaker: monkey
          text: 我闷得很，打打猎也许会痛快一点。你觉得呢？
        - id: ch04-b09
          speaker: narrator
          text: 兔子见这样一个大人物主动跟自己说话，心里十分得意。
        - id: ch04-b10
          speaker: rabbit
          text: 我当然愿意。可咱们猎什么？
        - id: ch04-b11
          speaker: monkey
          text: 追大象和老虎算什么本事？它们那么大，根本来不及躲。能抓住一眨眼就藏进叶子后面的小东西，那才叫本领。我去猎蝴蝶，你去猎蛇，怎么样？
        - id: ch04-b12
          speaker: narrator
          text: >-
            年轻又没见识的兔子觉得这主意妙极了，两只动物便各自出发。猴子不声不响地爬上最近的大树，差不多一整天都在吃水果。兔子却把看见的每一堆枯叶都翻了一遍，还拿鼻子到处乱拱，一心想从叶子下面找出一条蛇，最后累得半死。幸好蛇群那天下午都去参加自己的集会，不然最爱吃肥嫩兔子的蛇准会把它当成晚饭。
        - id: ch04-b13
          speaker: narrator
          text: >-
            兔子什么也没找到，最后躺在原地睡着了。一直盯着它的猴子跳下树，狠狠揪了揪它的耳朵。兔子气坏了，发誓非报仇不可。可要趁猴子不注意实在太难，它等了很久，才终于等到机会。
        - id: ch04-b14
          speaker: narrator
          text: >-
            一天，绿叶杰克坐在石头上，想着接下来做什么。兔子偷偷爬到它身后，猛地扯了一把尾巴。猴子疼得尖叫，蹿上树去。等它看清冒犯自己的只是一只兔子，立刻气得叽叽喳喳说个不停，神情也凶狠极了。兔子逃进最近的洞里，吓得浑身发抖，好几天都不敢露面。
        - id: ch04-b15
          speaker: narrator
          text: >-
            不久，猴子来到森林边缘。那里有座美丽的果园，树上挂满成熟的橙子。鸟儿都爱来这里找晚饭。园主人为了吓走它们，把一个蜡人固定在树枝上。猴子也爱吃橙子。它看见有个人站在最大最甜的橙子旁边，立刻粗声粗气地喊。
        - id: ch04-b16
          speaker: monkey
          text: 喂，把上面那个大橙子扔下来！不然我拿石头砸你！
          emotion: angry
        - id: ch04-b17
          speaker: narrator
          text: >-
            蜡人一声不响，连头也没有动一下。猴子很容易发火，立刻捡起一块石头，用尽力气扔过去。石头没有掉回地上，反而牢牢粘在柔软的蜡上。正巧一阵微风摇动果树，那个大橙子从枝头掉了下来。猴子捡起来，连皮也吃得干干净净。橙子实在太香，它还想再吃一个，便又命令蜡人往下扔。蜡人依然不动。猴子扔出第二块石头，石头也像第一块一样粘住了。
        - id: ch04-b18
          speaker: narrator
          text: 眼看这个人连石头也不怕，猴子越发恼怒。它匆匆爬上树，狠狠踢了蜡人一脚，腿却粘在蜡上，再也拔不出来。
        - id: ch04-b19
          speaker: monkey
          text: 马上放开我！再不放，我可要用另一只脚踢你了！
          emotion: angry
        - id: ch04-b20
          speaker: narrator
          text: >-
            猴子说踢就踢，另一条腿也被“抓”住了。它早已气昏头，又先后挥出两只手，结果手脚全粘在蜡人身上。猴子又气又怕，拼命挣扎，最后拖着蜡人一起摔进荆棘丛。这一摔倒让它挣脱了手脚，可也摔得够呛，浑身被刺得伤痕累累。
        - id: ch04-b21
          speaker: narrator
          text: 猴子一瘸一拐地走了，一路大声呻吟。它只要受了伤，总会想尽办法让所有人都知道。
    - id: ch05
      title: 美洲狮最后的圈套
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 过了很久，绿叶杰克的伤才养好，终于能够重新四处走动。随后，它又遇上老仇敌美洲狮。要说清这次相遇，还得先讲讲美洲狮刚刚怎样捉弄了一头雄鹿。
        - id: ch05-b02
          speaker: narrator
          text: >-
            一天，美洲狮约雄鹿去拜访一位养母牛的伙伴。那里的牛奶十分有名，雄鹿最爱喝牛奶，马上答应了。太阳西斜时，它们上路，来到一条没有桥的河边。雄鹿不爱游泳，便说自己累了，又说为一点牛奶走这么远不值得，还是回家吧。美洲狮听穿了这些借口，只管嘲笑它。
        - id: ch05-b03
          speaker: puma
          text: 这条河浅得很，你的脚根本不会离开河底。来吧，拿出点勇气，跟我走。
        - id: ch05-b04
          speaker: narrator
          text: >-
            雄鹿害怕河水，却更怕被美洲狮嘲笑，只好跟在后面跳进河里。谁知一眨眼，急流就把它冲得站不住脚，卷着它往下游去。幸好河水碰巧将它送到对岸一处浅滩，它总算挣扎着爬了上去，不然早就淹死了。雄鹿爬出水面，仍然吓得浑身发抖，美洲狮已经站在那里等它。
        - id: ch05-b05
          speaker: puma
          text: 刚才可真危险啊。
        - id: ch05-b06
          speaker: narrator
          text: 它们歇了几分钟，等雄鹿缓过来，又继续走，很快来到一片香蕉林。美洲狮眼馋地望着树上的香蕉。
        - id: ch05-b07
          speaker: puma
          text: 雄鹿朋友，你一定饿了吧？爬上树摘些香蕉。最好吃、最甜的青香蕉留给你，黄香蕉扔给我就行，我勉强吃一点。
        - id: ch05-b08
          speaker: narrator
          text: >-
            雄鹿照着做了。它不惯爬树，费了很大力气，膝盖磨得生疼，鹿角还总缠进藤蔓。可它尝过才知道，青香蕉一点也不好吃，只得把青的黄的都扔下去，让美洲狮挑选。美洲狮美美吃了一顿，彻底吃饱以后才肯再次上路。
        - id: ch05-b09
          speaker: narrator
          text: 小路穿过一片玉米地，几个男人正在干活。走近时，美洲狮压低声音教雄鹿该说什么。
        - id: ch05-b10
          speaker: puma
          text: 你走在前面，只管对他们说：“祝所有干活的人都倒霉！”
        - id: ch05-b11
          speaker: narrator
          text: 雄鹿真的走在前面，朝田里的男人大声说了那句坏话。那些人顶着热气干了许久的活，本来就又热又累，听完可不觉得这是什么好笑话。他们立刻放出狗群追赶，逼得雄鹿拼尽力气逃跑，好不容易才甩掉它们。美洲狮随后走过田地，却换了一套说法。
        - id: ch05-b12
          speaker: puma
          text: 愿各位的勤劳得到应有的回报。
        - id: ch05-b13
          speaker: narrator
          text: 男人们十分高兴，还拿出玉米给它吃。又走一阵，美洲狮看见树下盘着一条小蛇，蛇皮闪亮又漂亮。
        - id: ch05-b14
          speaker: puma
          text: 这要是做成镯子送给你女儿，一定很漂亮！
        - id: ch05-b15
          speaker: narrator
          text: 雄鹿低头捡起小蛇，马上被咬了一口。它生气地转向美洲狮。
        - id: ch05-b16
          speaker: deer
          text: 你怎么不告诉我，它会咬人？
          emotion: angry
        - id: ch05-b17
          speaker: puma
          text: 你自己是个笨蛋，难道还要怪我？
        - id: ch05-b18
          speaker: narrator
          text: >-
            它们终于到达目的地，可天色已经很晚，养母牛的主人正准备睡觉。两位客人没有多谈，各找一处方便的地方挂好吊床，也各自睡下。到了半夜，美洲狮悄悄起身，溜出门外，钻进羊圈。它挑出能找到的最肥的一只羊，杀死后吃得干干净净。随后，它又盛了满满一碗羊血，全洒在熟睡的雄鹿身上，这才悄悄回到吊床躺下。
        - id: ch05-b19
          speaker: narrator
          text: 第二天早晨，牧人打开羊圈，发现少了一只羊，立刻想到美洲狮，跑去指责它。
        - id: ch05-b20
          speaker: puma
          text: 我？好心人，你怎么会怀疑我？我身上有血吗？要是真有谁吃了羊，那一定是我的雄鹿朋友。
        - id: ch05-b21
          speaker: narrator
          text: 牧人听信了这番话，走到雄鹿的吊床旁仔细查看。雄鹿仍在熟睡，身上却果然沾满了羊血。
        - id: ch05-b22
          speaker: shepherd
          text: 好啊，我这就让你知道偷东西是什么下场！
          emotion: angry
        - id: ch05-b23
          speaker: narrator
          text: >-
            牧人朝雄鹿头上猛击一下，雄鹿当场死了。响声惊醒了楼上的主人。美洲狮欢欢喜喜地迎上去，说自己渴得厉害，请他快拿些著名的牛奶来。一大桶牛奶立刻摆到它面前。它喝得一滴不剩，随后告辞回家。
        - id: ch05-b24
          speaker: narrator
          text: 回去的路上，美洲狮遇见猴子，又打起了坏主意。
        - id: ch05-b25
          speaker: puma
          text: 你喜欢牛奶吗？我知道一个地方，牛奶好喝极了。你要是愿意，我可以带你去。
        - id: ch05-b26
          speaker: narrator
          text: 猴子知道美洲狮从来不会无缘无故献殷勤，这次主动请客，一定没安好心。不过它相信自己足够机灵，完全能照顾好自己，便装作什么也不知道，答应陪这个老仇敌走一趟。
        - id: ch05-b27
          speaker: narrator
          text: 它们很快来到同一条河边。美洲狮照旧哄骗猴子。
        - id: ch05-b28
          speaker: puma
          text: 猴子朋友，河水很浅，没什么可怕的。你先跳下去，我跟在后面。
        - id: ch05-b29
          speaker: monkey
          text: 你当我跟那头雄鹿一样好骗吗？我要走在后面，不然就不去了。
        - id: ch05-b30
          speaker: narrator
          text: >-
            美洲狮明白摆布不了猴子，只好找一处浅水，先往对岸游。等它游到河中央，猴子纵身跳上它的背。猴子知道，美洲狮不敢把自己甩下去，不然它自己也可能被急流卷进深水。就这样，它们平安到了对岸。
        - id: ch05-b31
          speaker: narrator
          text: 香蕉林就在河边不远。美洲狮想报复猴子逼自己驮它过河，便又装出亲热的样子。
        - id: ch05-b32
          speaker: puma
          text: 猴子朋友，快看这些好香蕉！你最会爬树，上去扔几个给我吧。最好吃的青香蕉归你，我只好将就吃黄的。
        - id: ch05-b33
          speaker: monkey
          text: 好啊。
        - id: ch05-b34
          speaker: narrator
          text: 猴子荡上树，把黄香蕉全吃了，只将剩下的青香蕉往下扔。美洲狮气得大叫。
        - id: ch05-b35
          speaker: puma
          text: 我要为这件事打烂你的脑袋！
          emotion: angry
        - id: ch05-b36
          speaker: monkey
          text: 你再说这种蠢话，我可不跟你走了。
        - id: ch05-b37
          speaker: narrator
          text: 美洲狮只得闭嘴。几分钟后，它们来到男人们收割玉米的田地。美洲狮又把骗雄鹿的那句话教给猴子。
        - id: ch05-b38
          speaker: puma
          text: 经过时，你只管说：“祝所有干活的人都倒霉！”他们一定会喜欢你。
        - id: ch05-b39
          speaker: monkey
          text: 好啊。
        - id: ch05-b40
          speaker: narrator
          text: 可猴子经过农夫身边时，只是点头微笑。
        - id: ch05-b41
          speaker: monkey
          text: 愿各位的勤劳得到应有的回报。
        - id: ch05-b42
          speaker: narrator
          text: 男人们热情地道谢，让猴子通过，美洲狮也跟在后面走了过去。继续往前，那条闪亮的小蛇还躺在苔藓上。
        - id: ch05-b43
          speaker: puma
          text: 这条蛇给你女儿做项链正合适，快捡起来带走吧！
        - id: ch05-b44
          speaker: monkey
          text: 你真是好心。不过这么漂亮的东西，还是留给你吧。
        - id: ch05-b45
          speaker: narrator
          text: 它们没有再提那条蛇。不久，两只动物来到牛奶房主人的家。主人正要睡觉，客人也不多话，各自挂起吊床。
        - id: ch05-b46
          speaker: narrator
          text: >-
            猴子故意把自己的吊床挂得很高，谁也伸手够不着。它还觉得整夜不睡更安全，便安静躺着，故意发出响亮的鼾声。夜完全黑下来，四周再没有一点声响。美洲狮以为猴子已经熟睡，便爬出门去，钻进羊圈，杀死一只羊。接着，它又端回满满一碗羊血，打算像陷害雄鹿那样，把血全泼到猴子身上。
        - id: ch05-b47
          speaker: narrator
          text: 猴子一直眯着眼偷看。等美洲狮走近，它猛地踢出一脚，整碗血全泼在美洲狮自己身上。
        - id: ch05-b48
          speaker: narrator
          text: 美洲狮知道不妙，转身想逃，可牧人已经走了过来。它来不及出门，只好赶紧重新躺下。
        - id: ch05-b49
          speaker: shepherd
          text: 这是我第二次丢羊。等我抓到那个贼，准叫它吃足苦头。我说到做到！
          emotion: angry
        - id: ch05-b50
          speaker: narrator
          text: 猴子没有回答，只默默指向装睡的美洲狮。牧人弯腰一看，果然看见了血迹。
        - id: ch05-b51
          speaker: shepherd
          text: 原来是你！那就吃我这一棍！
          emotion: angry
        - id: ch05-b52
          speaker: narrator
          text: 牧人举起棍子，狠狠打在美洲狮头上。美洲狮当场毙命。
        - id: ch05-b53
          speaker: narrator
          text: 猴子站起身，走进牛奶房，把能找到的牛奶全喝光了。后来，它回到家里，娶了妻子。从此以后，我们再也没有听到它的消息。
        - id: ch05-b54
          speaker: narrator
          text: 这个故事，改编自《巴西民间传说》。
