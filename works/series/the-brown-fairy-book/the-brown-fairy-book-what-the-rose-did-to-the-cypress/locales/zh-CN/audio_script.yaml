  chapters:
    - id: ch01
      title: 城垛上的谜语
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，东方有位萨曼·拉尔波什王。他有三个英勇聪慧的儿子，塔赫马斯普、卡马斯和阿尔马斯·鲁赫·巴赫什。一天，长子塔赫马斯普向父王请求出城打猎，答应晚祷时回来。大王准了，还派亲信带着鹰隼、猎犬和猎豹随行。
        - id: ch01-b02
          speaker: tahmasp
          text: 父王，我在城里待得厌倦了。请准我明日带人到山脚打猎，晚祷前一定回来。
        - id: ch01-b03
          speaker: narrator
          text: >-
            到了猎场，一头美得少见的鹿闯进众人眼中。王子舍不得伤它，吩咐随从谁也不许放箭，只能张网、抛套索，设法活捉。鹿四下找路，偏偏看准王子身边露出一个空当。它猛地腾空，从王子头顶一跃而过，冲出包围，像东风一样奔入荒野。王子立刻纵马追赶，一心盯着鹿，没多久便把随从远远甩在身后。太阳渐渐升到头顶，那头鹿忽然绕过一处高地，再也不见踪影。王子来回寻找，连一点蹄印也找不到。这时，他早已汗湿全身，每喘一口气，胸口都疼。坐骑更是渴得伸出舌头。他只得下马，把缰绳挽在手臂上，拖着脚往前走，一路祈求上天垂怜。可马终于倒在沙地上，断了气。王子独自走了很久，边走边哭，胸口仿佛燃着火。直到远处出现一座山，他才鼓起最后的力气爬上山顶。那里立着一棵巨树，树根紧抓大地，树冠直抵苍穹。绿叶在枝头闪亮，树下长着青草和五色花朵，一股清泉正从中流过。王子大喜，挪到泉边喝了个痛快，又为自己得救而感谢上天。等他抬头环顾四周，竟发现这片无情的荒野里还摆着一张御座。
        - id: ch01-b04
          speaker: narrator
          text: >-
            一位赤着头脚的苦行僧走来。他虽然衣着简朴，举止却像出身王室，面容慈祥沉静。
        - id: ch01-b05
          speaker: jahangir
          text: 年轻人，你是谁，从哪里来，又怎么独自到了这里？
        - id: ch01-b06
          speaker: narrator
          text: 王子讲完遭遇，也请老人说说自己的身世。老人起初不肯，王子再三恳求，他才开口。
        - id: ch01-b07
          speaker: jahangir
          text: >-
            你既然一定要听，那就听好。我是巴比伦王贾南吉尔。从前，我也有军队、仆从、妻儿和数不尽的财富。上天赐给我七个儿子，他们都已经长大成人，也学会了王子应有的本领。我的长子听一位旅人说，在突厥斯坦与中国交界的地方，有位提穆斯之子库伊穆斯王。他只有一个孩子，就是米赫尔·阿弗鲁兹公主。蓝天之下，没有谁能与她的美貌相比。各地王子都来求婚，她却给每个人定下同一个条件。她知道一个谜。谁能答出“玫瑰对柏树做了什么”，她便嫁给谁，还把全部财产交给他。谁若答不出来，她便砍下那人的头，挂在城堡垛口上。
        - id: ch01-b08
          speaker: jahangir
          text: >-
            我的儿子连姑娘的面都没见过，竟然已经爱上了她。他跑来向我哭诉，无论我怎样劝都不肯回头。我只好说，既然他痴心不改，我可以亲率大军去见库伊穆斯。若对方肯好好把女儿嫁过来，自然最好。若他不肯，我就攻下那个国家，把公主带回来。可这个办法不合我儿的心意。他说，为了满足自己的愿望，就毁掉一个国家和一座宫殿，这样做不对。他要独自去解谜，堂堂正正娶到公主。我怜惜孩子，最后还是放他走了。到了库伊穆斯的都城，他没能说出答案，头被砍下来挂上城垛。我换上黑衣，为他哀悼四十天。谁知此后，我另外六个儿子也一个接一个生出同样的念头。他们全都去了，又全都被杀。七个儿子一个也没能回来。我悲痛得再也坐不住王位，便抛下国家，来到这片荒漠。从那以后，我不再过问世事，只等忧愁一点点耗尽自己的生命。
          emotion: sad
        - id: ch01-b09
          speaker: narrator
          text: >-
            塔赫马斯普听完这个故事，竟也被那位素未谋面的公主迷住了。就在这时，失散的随从终于寻到山上，像飞蛾围住灯火一样聚到他身旁。他们牵来一匹快马，王子这才平安回国。可日子一天天过去，他心里的爱意越扎越深，身体也越来越虚弱。亲信看出缘故，只好把实情禀告萨曼王。悲愁立刻笼住了父亲的心。萨曼王愿意先派使者送去友好的书信，再奉上宝石、巴达赫尚红宝石和厚礼，为儿子正式求婚。若库伊穆斯不肯，他甚至愿意让军队席卷对方的国土，把公主带回来。塔赫马斯普却不答应。他说，这样做不对，他一定要亲自前去解开谜语。大臣们只好劝大王派几位可信的人陪着，也许王子走到半路还能回心转意。于是旅途所需都备齐了。塔赫马斯普辞别父亲，带上几位廷臣，又领着一队双峰黑眼骆驼。骆驼背上装满珠宝、黄金和贵重织物，一行人就这样上了路。
        - id: ch01-b10
          speaker: narrator
          text: >-
            走过许多驿站和漫长的日子，他们终于来到库伊穆斯的都城。高耸的城堡压在大地上，城垛几乎碰到蓝天。许多求婚者的头悬在上面，其中还有身份高贵的人。王子看见了，却半点没有动摇。别人劝他放下这场痴念，他也一句都听不进去，只管骑进城中。广场上立着一顶猩红缎帐，帐下摆着两面镶满珠宝的鼓，连鼓槌都闪着宝光。这是专为求婚者备下的。谁击响它们，谁就会被带去见国王。王子一看见双鼓，心里的爱火烧得更旺，立刻下马走过去。同伴连忙追上来，求他让大家先入宫通报，把带来的财物安置好，再碰这件生死攸关的大事。可王子说，自己千里迢迢来到这里，第一件事就该击鼓，让所有人知道求婚者已经到了。国王自然会按礼数接见，也会给他们安排住处。说罢，他亲手敲响双鼓。鼓声刚落，一名官员便赶来，把他领到库伊穆斯王面前。
        - id: ch01-b11
          speaker: kaymus
          text: 年轻人，我女儿仗着美貌生出妄念，已经害死许多还没享过人生的人。你放下这件事吧，别让死亡毁了你的青春。
        - id: ch01-b12
          speaker: narrator
          text: 王子不肯退缩。国王只得留他欢聚三日，又召来女儿和王后劝说。
        - id: ch01-b13
          speaker: kaymus
          text: 女儿，别再执迷了。东方来的王子年轻俊美，又带来无数财宝，只求娶你。你不会再遇到更好的丈夫。
        - id: ch01-b14
          speaker: mihr
          text: 父王，我已经立誓。哪怕等上一千年，只要没人解开谜语，我就不嫁。我只嫁给答对的人。
        - id: ch01-b15
          speaker: narrator
          text: 三天后，公主问出那句话。塔赫马斯普虽然能言善辩，却不知道答案，只能用一句诗作答。
        - id: ch01-b16
          speaker: tahmasp
          text: 秘密只有全能者知道。若有人自称知道，千万别信。
        - id: ch01-b17
          speaker: executioner
          text: 谁的生命就要落山了？
        - id: ch01-b18
          speaker: narrator
          text: >-
            刽子手抓住王子的胳膊，把他按在行刑布上，铁石心肠地砍下他的头，又将头颅挂上城垛。死讯传回东方，萨曼王一下陷入绝望，惊得连神志都麻木了。他换上黑衣，为长子哀悼整整四十天。可没过多久，次子卡马斯也生出同样的念头。他求得父王准许，去了那座城，最终也没能答出谜语，同样死在刽子手刀下。萨曼王的三个儿子，如今只剩勇敢、善辩、天性快活的阿尔马斯·鲁赫·巴赫什。
        - id: ch01-b19
          speaker: almas
          text: 父亲，库伊穆斯王的女儿害死了两位哥哥。我要去找她报仇。
        - id: ch01-b20
          speaker: saman
          text: 我的孩子，我只剩你一个了。你还要我准你去送死吗？
          emotion: sad
        - id: ch01-b21
          speaker: almas
          text: 我若不能挫败她的傲气，把她押到您面前，心里永远不能安宁。
        - id: ch01-b22
          speaker: narrator
          text: >-
            父亲终于答应。阿尔马斯没有带一个随从，只身踏上长路。他来到库伊穆斯的都城，也看见了那座高堡，更看见两个哥哥的头颅悬在城垛上。他在城里走了一圈，看见猩红帐篷和两面宝鼓，却没有上前敲响，而是先出了城。邻近村庄里住着一对极老的夫妻。妻子已有一百二十岁，甚至还不止，两位老人一生没有见过自己的孩子。阿尔马斯进了他们家，老人欢喜得像终于有了亲生儿子。他把全部财物交给二老保管，把马拴在外屋，还再三叮嘱他们替自己保密。随后，他脱下王室衣装，换上一身普通衣服。第二天太阳刚刚升起，他便悄悄进城。他到处走，到处听，反复思量怎样弄懂谜语、怎样替哥哥报仇，可全国上下竟没有一个人知道答案。
    - id: ch02
      title: 宝座下的秘密
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            阿尔马斯在城里听不到半点线索，便想到公主自己的宫殿里碰碰运气。他来到花园别宫，只见大门雄伟，围墙坚固，守门人又多，根本不可能从他们眼前进去。王子心里发苦，却告诉自己，想找的东西一定就在这里。他沿着外墙寻找缺口，一边恳求上天为无援的人指路。祈祷间，他忽然看见流进花园的水道。四下无人时，他脱下衣服，滑进水中，让流水把自己送进高墙。上岸后，他先藏起来，等腰布晾干，才走进园子。那里像一座伊甸园。流水穿过草地，百花盛开，鸽子低鸣，夜莺啼啭。前院有张光亮的碧玉御座，座台中央嵌着一池清水，明得像镜子。王子看过宫室，又躲开园丁，在园中住了一夜。第二天早晨，他装出疯疯癫癫的模样到处游荡，终于走近一片草地。几位姑娘正在嬉戏，米赫尔·阿弗鲁兹坐在丝绸覆盖的宝座上，身上的香气飘满四周。
        - id: ch02-b02
          speaker: narrator
          text: >-
            米赫尔·阿弗鲁兹正和侍女们在园中。迪尔·阿拉姆到水边取水，看见王子的倒影，惊得杯子落进溪中。
        - id: ch02-b03
          speaker: dil_aram
          text: 公主，我在水里看见一个人的影子，吓了我一跳！
          emotion: surprised
        - id: ch02-b04
          speaker: narrator
          text: >-
            别的姑娘把迪尔·阿拉姆带到公主面前。另一个姑娘也去水边察看，同样看见了陌生人的倒影。公主这才亲自起身，像孔雀一样走到溪边。她望见水中那张从未见过的俊美容貌，立刻吩咐乳母查出那人是谁，又藏在哪里。王子听见这话，便抬起头。公主看清他的脸，顿时动了心，示意乳母把他带来。王子故意装成被乳母劝了半天才肯同行。公主问他是谁，怎样闯进花园，他却一会儿笑，一会儿哭，只说自己饿了，还夹杂着一串颠三倒四的话，叫人听不出真假。
        - id: ch02-b05
          speaker: mihr
          text: 可惜，他原来疯了。以后他就是我的疯子，谁也不许伤害他。他要什么，你们便给什么。
        - id: ch02-b06
          speaker: narrator
          text: >-
            王子留在宫中，暗想只要守住秘密，也许能在这里找到谜底。最早发现他的迪尔·阿拉姆却深深爱上了他。她避开公主，把头俯在他脚边。
        - id: ch02-b07
          speaker: dil_aram
          text: 请告诉我你是谁，又怎样来到这里。我爱你。你若要走，我愿跟你一起走，我的财富也都可以给你。
        - id: ch02-b08
          speaker: narrator
          text: >-
            王子心想，若随便泄露秘密，自己一定会丧命。他仍旧装疯，对姑娘的问题一句实话也不说。迪尔·阿拉姆只得流着泪离开，独自在房中哀伤。此后每逢公主召王子过去，所有侍女里总是她照料得最细心。公主看在眼里，索性把自己的“疯子”交给她照看，吩咐王子要什么就给什么。这正是迪尔·阿拉姆盼望的机会。过了一阵，她终于把王子带到僻静处，要两人互相起誓，谁也不泄露对方的秘密。
        - id: ch02-b09
          speaker: dil_aram
          text: 我以上天起誓，绝不泄露你的秘密。把身世都告诉我吧，我会帮你得到想要的东西。
        - id: ch02-b10
          speaker: almas
          text: 我要查清“玫瑰对柏树做了什么”。你的女主人用这个谜砍下那么多人的头，究竟有什么缘故？
        - id: ch02-b11
          speaker: dil_aram
          text: 你若答应娶我，让我永远留在你所爱的人中间，我就把知道的一切告诉你，也替你留心谜底。
        - id: ch02-b12
          speaker: almas
          text: 等我完成心愿，替哥哥们报仇，我一定遵守与你的盟约，让你成为我的慰藉。
        - id: ch02-b13
          speaker: dil_aram
          text: >-
            我并不知道答案。不过，把谜语告诉公主的，是她藏在宝座下的一个黑人。他从高加索的瓦克逃来。你只有去那里追问，别无办法。
        - id: ch02-b14
          speaker: narrator
          text: 王子听后沉思良久。迪尔·阿拉姆见他忧愁，愿意替他毒死公主。
        - id: ch02-b15
          speaker: dil_aram
          text: 你若只想让她死，我就在她杯中下毒，让她永远醒不过来。
        - id: ch02-b16
          speaker: almas
          text: 那算不得勇士的报复。我一定要到瓦克，把真相查个水落石出。
        - id: ch02-b17
          speaker: narrator
          text: >-
            两人重申婚约，这才分别。王子回到村中，告诉老人自己要走一段很长的路，请他们不必担心，只要替他保管好留下的财物。可他根本不知道高加索瓦克在哪个方向。想到自己孤立无援，他牵着马越走越灰心。就在这时，前方出现一位神色安详的老人。老人身穿绿衣，手持拐杖，很像传说中的希兹尔。王子立刻感谢上天，双手按在胸前，恭敬地向他行礼。老人也和蔼地还了礼。
        - id: ch02-b18
          speaker: saint
          text: 旅人，你要去哪里？
        - id: ch02-b19
          speaker: almas
          text: 我不知道通往高加索瓦克的路，请您指点我。
        - id: ch02-b20
          speaker: saint
          text: 快回头吧。你就算有一百条命，也别想从这趟旅程里保住一条。究竟是什么事，值得你这样舍命？
        - id: ch02-b21
          speaker: almas
          text: 只有走这一趟，我才能办成要紧的事。看在真主的分上，请把路告诉我。
        - id: ch02-b22
          speaker: saint
          text: >-
            一直走到三岔路口，不走左右，只走中路。一天一夜后会有一根石柱，上面嵌着刻有库法体文字的大理石板。碑上怎么写，你就怎么做，千万别违背。
        - id: ch02-b23
          speaker: narrator
          text: >-
            圣者祝福他一路平安，王子吻过他的脚，向他告别。走了一天一夜，王子果然看见一根石柱静静耸入云端，柱上嵌着刻有库法体文字的大理石板。他通晓各种文字，便把警告读了出来。想安逸过完一生的人，可以走右路。左路会碰到一些麻烦，却能很快到达目的地。中路直通高加索，不但漫长得像没有尽头，而且险恶万分，纵使有一千条命，也保不住一条。王子读完，摘下头巾，举手请求上天引他穿过危险。随后他抓起一把泥土，撒进自己的衣领。
        - id: ch02-b24
          speaker: almas
          text: 泥土，你就是我的坟墓。衣衫，你就是我的裹尸布。
        - id: ch02-b25
          speaker: narrator
          text: 说完，他踏上中路，一天天向高加索走去。
    - id: ch03
      title: 魔法花园
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            王子在中路走了一天又一天，默默祈祷了无数次。漫长的沙海尽头，终于升起一片树林。那是一座花园。整块大理石雕成的大门旁，睡着一个巨大得可怕的黑人。他枕着石头，上唇翘到鼻孔，下唇垂得像骆驼嘴。四扇磨盘合成他的盾牌，黄杨树上挂着巨剑，十二张兽皮才缝成一条腰布，腰间铁链的每个环都有象腿那么粗。王子把马拴在他头边，念着真主之名走进园中。里面古树参天，绿荫清凉，花畦一片接一片。鹿群不断用眼神和蹄子催他回头，因为这里是魔法之地。王子不懂，还以为它们正在欢迎自己。再往深处走，一座金银砌墙的宫殿出现在眼前。宫中铺着精美地毯，八道门各对着一座水池，每座池里都喷出清水。
        - id: ch03-b02
          speaker: narrator
          text: >-
            王子走进宫殿一侧的大门，一扇高窗忽然打开。拉蒂法夫人坐在窗边，看见这位陌生的年轻人，立刻动了心。她吩咐乳母下楼，请王子进来。王子来到她面前，受到热情款待。拉蒂法问起他的身世和目的，他没有隐瞒，把两位哥哥怎样死去、自己怎样进入公主宫中、又怎样得知瓦克可能藏着谜底，全都说了。拉蒂法听完，百般阻拦，告诉他前面的道路只会带来流浪和死亡。
        - id: ch03-b03
          speaker: latifa
          text: >-
            去高加索只会让你流浪送命。留下与我共享王位吧。我的财富任你取用，连库伊穆斯王和他的女儿，我也能替你抓来。
        - id: ch03-b04
          speaker: almas
          text: >-
            我已经向上天立约。在到达瓦克、查明谜底、为哥哥们报仇以前，绝不停下。等事情办完，我会带着仪仗回来，依照律法娶你。
        - id: ch03-b05
          speaker: narrator
          text: >-
            拉蒂法不愿放他走，接连三天用美酒、音乐和宴乐挽留，又不断劝他留下。王子的回答始终没有改变。到了第四天，他起身告辞。拉蒂法心里恼怒，脸上却装出好意，说远行前要送他一点提神的东西。她先让他吃下药，又取出一根蛇形短杖，念动咒语，重重打在他的肩上。王子原地转了一圈，四肢忽然缩变，竟成了一头鹿。拉蒂法叫来金匠，为鹿角包上黄金、嵌满宝石，又把自己的头巾系在鹿颈上。做完这些，她便把他丢在园中，再也不管。
        - id: ch03-b06
          speaker: narrator
          text: >-
            鹿身里仍装着王子的心。他在花园中来回奔跑，寻找逃出去的办法。有一天，他终于跃过围墙，可落地一看，自己仍在原来的园中。第二次、第三次，直到第八次，结果都一样。第九次奋力一跃，他才真正离开拉蒂法的魔法，落进另一座花园。这里属于拉蒂法的妹妹贾米拉夫人。她正坐在窗边，看见园中忽然多出一头金角嵌宝的美鹿，颈上还系着姐姐的头巾，立刻叫来乳母，要她设法捉住。
        - id: ch03-b07
          speaker: jamila
          text: 乳母，快捉住它！捉到了，我就把这串价值一国的珍珠项链赏给你。
        - id: ch03-b08
          speaker: nurse
          text: 我已经追得快累死了，它哪里肯让我靠近！
        - id: ch03-b09
          speaker: narrator
          text: >-
            乳母追了很久，累得几乎倒下，鹿始终不让她靠近。贾米拉只好亲自下楼。王子心想，她既然是拉蒂法的妹妹，多半也是魔法师，若落入她手中，恐怕又要遭殃。可转念一想，自己的命运早已注定，躲也无用。他便低下头，让贾米拉走近，搂住自己的脖颈。贾米拉欢喜地吻了它，把它牵回高座旁，用一根短绳系住。第二天，乳母担心短绳勒得太紧，换来一根长绳。她刚走近，就看见鹿的眼睛里不断落下泪来。
        - id: ch03-b10
          speaker: nurse
          text: 夫人，这头鹿在哭。我活了这么久，从没见过鹿流眼泪。
        - id: ch03-b11
          speaker: jamila
          text: >-
            我的心，你为什么这样难过？是因为我捉住你吗？我爱你胜过自己的性命。若我没有猜错，这一定是我那邪恶姐姐的魔法。放心，我会让你恢复原形。
        - id: ch03-b12
          speaker: narrator
          text: >-
            鹿听懂了她的话，把头伏在她脚边。贾米拉这才确信自己的猜想。她先沐浴更衣，又命人把鹿全身洗净。随后，她从匣中取出一件东西喂它吃下，再拿出短杖，念过咒语，往鹿身上打去。鹿原地转了一圈，四条腿重新变成人的手脚。阿尔马斯王子恢复原形，拉蒂法的头巾、鹿角上的黄金和宝石一起散落满地。贾米拉立即取来王室礼服，请他换上，又设下宴席款待。
        - id: ch03-b13
          speaker: almas
          text: 可爱的人，我给你添了这么多麻烦，怎样才能赔罪，又该怎样感谢你？
        - id: ch03-b14
          speaker: narrator
          text: >-
            贾米拉说，这番遭遇一定藏着一段长故事，请他不要隐瞒。王子便从自己是谁、为何离家讲起，一直讲到哥哥们的死、公主的谜语、迪尔·阿拉姆的帮助，以及前往瓦克的使命。贾米拉听完，也劝他不要再往前走。这里离高加索边境尚远，道路已经这样凶险。真正到了那片精灵、恶魔和仙灵盘踞的地方，只怕更难保住性命。
        - id: ch03-b15
          speaker: jamila
          text: 阿尔马斯王子，这里还没到高加索边境，道路已经如此危险。留下吧，我愿为你做任何事。
        - id: ch03-b16
          speaker: almas
          text: >-
            你若爱我，就请帮助我完成旅程。若我如愿归来，一定依照律法娶你，带你回国，从此快活相伴。
        - id: ch03-b17
          speaker: jamila
          text: >-
            那就带上三件宝物：萨利赫先知的弓箭、所罗门的宝剑“蝎子”，还有提穆斯的匕首。宝剑能劈开钢铁顽石，匕首能让佩戴者扛住七峰骆驼的重量。你必须找到西穆尔格。只有它能驮你越过通往瓦克的七片海。
        - id: ch03-b18
          speaker: narrator
          text: >-
            贾米拉先从匣中取出那几件宝物。王子念过真主之名，把弓、箭囊、宝剑和匕首一一佩好。她又拿来两只红宝石色的丝绸鞍袋，一只装着烤禽和小饼，另一只装满宝石，再送给他一匹快如晨风的马。临行前，她把通往西穆尔格住处的道路仔细说了一遍，唯恐他漏掉一句。
        - id: ch03-b19
          speaker: jamila
          text: >-
            先在赠礼之地过夜，带些猎物献给狮王。替它擦净尘土，亲手切肉奉上，它会保护你。离开那里后走左路，千万别走右路。右边是刀剑交击之堡，四十名黑人将领都听命于塔拉姆塔克。越过那里，才到西穆尔格的住处。
        - id: ch03-b20
          speaker: narrator
          text: 两人分别。贾米拉回宫哀伤，王子骑马来到赠礼之地。
    - id: ch04
      title: 狮王与西穆尔格
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            王子在赠礼之地的石台旁下马。来时他已经遵照贾米拉的话捕到猎物。夜过一两个更次，旷野里渐渐挤满威武奇异的动物，有狮子、老虎、花豹和猿猴，许多都是他从未见过的。群兽忽然向两边让开，一头大得惊人的狮王走了过来，从鼻尖到尾端足有八十码。七八十头狮子跟在后面，又远远围成一圈。王子上前行礼，狮王也威严地低下头和鬃毛，然后走到石台旁，把右爪搭在左爪上。王子取出贾米拉交给他的头巾，擦去狮王脸上的尘土，又把洗剥干净的猎物端来，双手交在胸前侍立。狮王要吃，他便亲手割肉，躬身送到它嘴边。随从的狮子也靠近了。王子本想停手，狮王却示意他把肉分给大家。他照办以后，狮王让他安心睡下，自有卫士守夜。王子就在狮群环绕中睡到天明。黎明分别时，狮王拔下几根鬃毛送给他。
        - id: ch04-b02
          speaker: lion_king
          text: 遇到危险，就烧掉一根鬃毛，我会赶来。
        - id: ch04-b03
          speaker: narrator
          text: >-
            王子立刻启程。到了岔路口，他清楚记得贾米拉说过，左路安全，右路短些，却会经过刀剑交击之堡。他转念又想，命运若已经写在额头上，无论选哪条路，终究还是会发生。于是他偏偏走上禁行的右路。不久，一座城堡挡在前方。王子知道这里就是刀剑交击之地，也曾想过原路退回，可勇气不许他这样做。他只说，亘古注定的事，终会落在自己身上，便继续向城门走去。正要把马拴在门边树上，一个黑人守卫出来看见他，心想首领塔拉姆塔克许久没吃人肉，这回正好送上一顿。他一把抓住王子的马缰。
        - id: ch04-b04
          speaker: guard
          text: 小崽子，下马跟我走！主人正馋人肉，你来得太好了。
        - id: ch04-b05
          speaker: almas
          text: 住口！你在胡说什么？
        - id: ch04-b06
          speaker: guard
          text: 敢骂我？我要把你害得连天上的鸟都替你落泪！
          emotion: angry
        - id: ch04-b07
          speaker: narrator
          text: >-
            王子拔出所罗门的宝剑“蝎子”，一剑砍在守卫的皮腰带上。剑锋穿过身体，从另一边露了出来。那人直挺挺站了一会儿，还伸手想抓王子，身体却突然裂成两半。王子到附近水边做过净礼，知道真正的大战就要来了。第二个守卫出堡看见尸体，赶紧回去报信。随后一批又一批人冲出来，都被“蝎子”劈成两截。塔拉姆塔克听说后，终于召来巨人奇尔马克。这个人身高如塔楼，战场上足以抵挡三百名士兵。他举着八扇磨盘合成的盾牌，扛着大棒走出城堡。
        - id: ch04-b08
          speaker: chirmak
          text: 蠢货，你敢闯进我国杀人？来，把我也劈成两半试试！
        - id: ch04-b09
          speaker: narrator
          text: >-
            奇尔马克打心底瞧不起这个年轻人。他随手丢开大棒，徒手扑上来，揪住王子的衣领，把人夹进腋下，转身就往堡中走。王子却抽出提穆斯的匕首，从巨人的腋窝向上猛刺，刀刃一直没到柄。奇尔马克疼得松手，把他摔回地面，又弯腰去捡大棒。就在这一瞬，王子挥起“蝎子”，从腰间把巨人劈成两段。消息传进城堡，塔拉姆塔克亲自统率大军杀了出来。王子在敌群中奋战，神剑之下不断有人倒下，可他的力气也快耗尽。攻势稍缓，他立刻打着火镰，烧掉狮王的一根鬃毛。火才燃起来，敌人又冲到身边，几乎把他活捉。忽然，沙漠尽头涌出一支狮子大军。狮王冲在最前面，一万头雄狮随后扑入战团，把人和马撕成碎片。王子精神大振，继续挥剑。没过多久，敌军便只剩下塔拉姆塔克一人。
        - id: ch04-b10
          speaker: almas
          text: 你往哪里逃？敢不敢回来面对我？
        - id: ch04-b11
          speaker: talarm_tak
          text: 来吧，凡人！我要用大棒把你砸得像软蜡！
          emotion: angry
        - id: ch04-b12
          speaker: narrator
          text: >-
            塔拉姆塔克把大棒猛掷向王子的头。王子及时催马向前，大棒从身后落下。首领还以为自己已经击中，正低头寻找尸体，王子却从背后赶来，一剑把他从肩头劈到腰间。狮王大大赞扬王子的勇猛，陪他走进城堡。堡内陈设华贵，很有王者气象。塔拉姆塔克年幼的女儿就住在里面。她知道父亲已死，便派人向阿尔马斯传话，请求留在他身边。
        - id: ch04-b13
          speaker: talarm_daughter
          text: 请您收我做侍女吧。把我留在身边，无论您去哪里，我都愿跟随。
        - id: ch04-b14
          speaker: narrator
          text: >-
            姑娘来到王子面前，亲吻他的双脚，又在他的引领下皈依。王子告诉她，自己正要去办一件大事，不能就此停留。等他归来，会带她和她的财物一同回国。眼下，她必须留在堡中等候。随后，王子把整座堡垒和其中的一切交给狮王照管，请这位兄弟不许任何人碰动。他与狮王告别，又从塔拉姆塔克的马厩里挑出一匹新马，再次上路。
        - id: ch04-b15
          speaker: narrator
          text: >-
            走过许多驿程和许多日子，他来到一片美得出奇的平原。玫瑰、郁金香和苜蓿铺满地面，清水从草坪间流过。那里有一棵从未见过的树，枝条形状相同，却结着千百种花果。树旁的蓄水池由试金石、纯石、大理石和磁石砌成，水像香油一样流进流出。王子确信这里就是西穆尔格的家。他让马自由吃草，自己吃了些贾米拉备下的食物，又喝过溪水，便躺下休息。睡意未消时，坐骑忽然嘶鸣刨地，把他惊醒。一条山岳般的巨龙正压在地上，沉重胸膛把身下石块碾成软泥。王子念起真主的一千个名号，取出萨利赫的弓和三支箭，把提穆斯的匕首系紧，又将“蝎子”挂在颈上。第一支箭射进巨龙眼睛，直没到箭尾。怪物痛得扭动，喷出恶臭毒气，用头猛撞地面，震得大地颤抖。第二支箭正中咽喉。巨龙张口猛吸，想把王子吞下。王子被吸到剑锋可及之处，立刻把自己托付给上天，拔剑全力一劈，砍开了怪物的脖颈。巨龙终于倒下，可恶臭、污血和骇人的模样也把王子熏得昏了过去。醒来时，他全身都浸在怪物血里。他站起身，先感谢上天保住了自己的性命。
        - id: ch04-b16
          speaker: narrator
          text: >-
            奇树顶端正是西穆尔格的巢，幼鸟住在里面，父母外出觅食去了。平日亲鸟总叮嘱它们不许探头，可今天树下打斗得天摇地动，它们忍不住低头，把经过全看见了。巨龙一死，幼鸟便饿得吵起来。王子割开龙肉，一块块送进它们嘴里，直到整条巨龙都被吃光。随后他洗净身体，躺在树下休息。两只大鸟归来时，幼鸟吃得太饱，正在呼呼大睡。平日孩子早会欢叫迎接，这一次巢中却毫无动静。两只大鸟以为多年来反复发生的灾祸又来了，孩子已经被害。它们看见陌生人睡在树下，立刻把他当成凶手。雄鸟认定王子吃掉幼鸟，饱餐后还敢留在原地，便飞回山间，用利爪抓起一块巨石，要砸碎他的头。
        - id: ch04-b17
          speaker: simurgh_mate
          text: 先看看巢里。若杀了无辜的人，我们会背上罪孽。
        - id: ch04-b18
          speaker: chick
          text: 妈妈，是树下的年轻人杀了巨龙，救了我们，还割肉把我们喂饱了！
        - id: ch04-b19
          speaker: simurgh_mate
          text: 孩子的父亲，你险些犯下大错。幸好那桩可怕的罪没有落到你身上。
        - id: ch04-b20
          speaker: narrator
          text: >-
            西穆尔格听完孩子的话，带着巨石飞到远处，把它丢了下去。石头不断下沉，仿佛一直落进大地中央。等它飞回树旁，恰好有一小片阳光穿过树叶，落在王子身上。西穆尔格便展开双翼替他遮阴，一直守到他醒来。王子起身行礼，巨鸟也满怀感激地还礼，亲昵地抚慰他，又问他是谁，要去哪里，怎样穿过了从无人走过的无情沙漠。阿尔马斯从头讲起，一直说到寻找瓦克的使命。他恳求西穆尔格驮自己跨海，也许凭这份帮助，他才能查明谜底，为两个哥哥报仇。
        - id: ch04-b21
          speaker: simurgh
          text: >-
            从没有哪个凡人的儿子做成过你做的事。那条巨龙年年来吞吃我的孩子，我却一直不知道仇敌是谁，更没有机会报仇。凭上天的恩典，你替我的孩子除掉了强敌，也救了它们的性命。你有权得到我的一切帮助，我也把你看作自己的孩子。还是留下吧。我可以为你建一座城，把所需的一切都备齐，还能把高加索之地交给你，让那里的王公都臣服。放弃瓦克吧。那地方危机四伏，精灵一定会杀死你。
        - id: ch04-b22
          speaker: narrator
          text: 王子决心不改。西穆尔格只得答应帮助。
        - id: ch04-b23
          speaker: simurgh
          text: >-
            既然你决心不改，那就照我说的准备。去平原捕七头鹿，把鹿皮做成七只不漏水的皮囊，里面装满水，再把鹿肉也分成七份。通往瓦克的路上横着七片海，我会驮你飞过去。每飞过一片海，我开口时，你就把一份肉和一囊水送进我嘴里。没有这些饮食，我们一定会坠进海中。到了最后一片海的对岸，你再拿走我三根羽毛。以后无论遇到什么困难，只要烧掉一根，我眨眼间就会赶到。
        - id: ch04-b24
          speaker: narrator
          text: >-
            王子一件件照办。他捕来七头鹿，缝好皮囊，盛满清水，又把肉分成七份。准备妥当后，他坐上西穆尔格的背，两者一同升入天空。巨鸟驮着他飞过七片海。每过一片，王子就按约定喂它一份鹿肉和一囊水。等他们落在最后一片海的岸边，西穆尔格告诉王子，前路已经在眼前，只需一直走进城中。它留下三根羽毛，再次叮嘱遇险便烧，这才与他分别。
    - id: ch05
      title: 玫瑰与柏树
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            王子进城，在市集和街巷间寻找了七天，始终不知该向谁打听。一个年轻布商与他一见如故，王子终于开口询问。
        - id: ch05-b02
          speaker: almas
          text: 好朋友，请告诉我，“玫瑰对柏树做了什么”究竟是什么意思？
        - id: ch05-b03
          speaker: cloth_merchant
          text: 若不是把你当兄弟，我听到这句话就会砍下你的头！
          emotion: surprised
        - id: ch05-b04
          speaker: almas
          text: 就算要杀我，也得先告诉我想知道的事。
        - id: ch05-b05
          speaker: cloth_merchant
          text: 那就只有去见我国国王。旁人谁也不敢告诉你。我有位宫中朋友法鲁赫·法勒，可以替你引见。
        - id: ch05-b06
          speaker: narrator
          text: >-
            王子听说布商能够引见，立刻答应。法鲁赫·法勒见过阿尔马斯，便把这位远道而来的异乡旅人带到西瑙巴尔王面前，请国王准他栖身于王室的庇护之下。西穆尔格临别曾送给王子一颗重三十米斯卡尔的钻石，他命人把宝石献给国王。西瑙巴尔一眼就认出它价值非凡，问他从哪里得来。王子只说，自己从前也有财富、地位和权势，故乡还有许多这样的宝石。来此途中，他在刀剑交击之堡遭了抢劫，只有这一颗藏在浴巾里，侥幸保住。国王以为这是客人最后的财物，便回赠了价值远胜钻石的礼品，又让宰相把他安置在王家宾馆。西瑙巴尔很喜欢与王子相伴，日日召他见面，几次请他随意求取一件赏赐。王子始终不说。直到国王再次追问什么能使他欢喜，他才回答，自己确有一个愿望，却只能私下禀告。国王立即命所有人退下。
        - id: ch05-b07
          speaker: almas
          text: 我此生只有一个愿望，就是知道玫瑰对柏树做了什么，这句话到底有什么含义。
        - id: ch05-b08
          speaker: sinaubar
          text: 凭真主之名，若是旁人这样问，我已经砍下他的头了。
          emotion: surprised
        - id: ch05-b09
          speaker: narrator
          text: >-
            王子安静听着，又用机智风趣的话把国王说得心醉，西瑙巴尔终究没能下手。日子飞快过去。国王一次次要他求赏，他总说只愿陛下安康，自己别无欲求。一天夜里，宫中举行大宴。斟酒人捧着金银酒杯轮番献酒，歌者争着用最甜美的声音博取喝彩。王子从国王自己的杯中饮酒，酒意渐渐烧热头脑。他接过乐师的鲁特琴，坐到地毯边，一曲接一曲地唱，令所有听众都沉醉其中。四面响起赞美声。国王亲手斟满一杯酒，把王子召到面前，将酒杯递给他，又一次要他当众说出愿望。
        - id: ch05-b10
          speaker: sinaubar
          text: 说出你的愿望，我答应你。
        - id: ch05-b11
          speaker: almas
          text: 我只有这一个目标，请告诉我玫瑰对柏树做了什么。
        - id: ch05-b12
          speaker: sinaubar
          text: 问过此事的人，没有一个活着离开。既然你别无所求，我就告诉你，但听完之后，你必须甘愿领死。
        - id: ch05-b13
          speaker: almas
          text: 我答应，绝不反悔。
        - id: ch05-b14
          speaker: narrator
          text: >-
            国王接受了他的承诺，随即向侍从下令。有人把一张铺着欧洲天鹅绒的名贵地毯摆在王座旁，又牵来一条狗。狗颈上套着镶满宝石的金项链，被请到华美织物上坐好，一群漂亮姑娘随即围到它身旁伺候。接着，十二个黑人恶声恶气地拖来一个女子。她手脚戴着镣铐，身上的衣服又破又寒酸，却美得连灿烂的太阳也要羞愧。她被扔在光秃秃的地面上，国王命人朝她娇嫩的身体抽打一百鞭。女子只发出一声长长的叹息。有人送来饭菜，铺开餐布，把一道道精美食物先摆到狗面前，还用中国水晶制成的御杯喂它喝水。狗吃饱以后，剩食才被端到戴锁链的女子面前，逼她吞下。她一哭，泪珠落地便成了珍珠。她一笑，双唇间便掉下玫瑰。侍从把珍珠和鲜花一一收起，全送进宝库。
        - id: ch05-b15
          speaker: sinaubar
          text: 你已经看见这些事，愿望满足了。
        - id: ch05-b16
          speaker: almas
          text: 我看见了，却一点也不明白。请告诉我背后的故事，然后再杀我。
        - id: ch05-b17
          speaker: sinaubar
          text: >-
            戴锁链的女子是我的妻子古尔，意思是玫瑰。我叫西瑙巴尔，意思是柏树。有一次我打猎口渴，找到一口极隐蔽的井。我用头巾做绳、帽子做桶，放下去却被什么东西勾住。
        - id: ch05-b18
          speaker: sinaubar
          text: 井下的人，无论你是谁，请放开我的头巾。我快要渴死了。
        - id: ch05-b19
          speakers: [fairy_1, fairy_2]
          ensemble: duo
          text: 我们被困在这里很久了。看在真主的分上，请救我们出去！
        - id: ch05-b20
          speaker: narrator
          text: >-
            西瑙巴尔听见求救，想了许多办法，终于从井中拉出两个双目失明的女人。她们说自己本是仙灵，因为触怒国王，被弄瞎眼睛，独自丢进这口井里，已经困了很久。如今若有人能找来医治眼睛的药，她们愿意终身为他效劳，无论他要什么，都设法办到。
        - id: ch05-b21
          speaker: fairy_1
          text: 若你能找来治眼睛的药，我们一生听你差遣。
        - id: ch05-b22
          speaker: sinaubar
          text: 什么东西能治好你们？
        - id: ch05-b23
          speaker: fairy_2
          text: >-
            海里有头母牛会上岸吃草。取一点它的粪便就能治眼睛，可千万别让它看见，否则它会杀了你。
        - id: ch05-b24
          speaker: narrator
          text: >-
            西瑙巴尔重新振作起来，赶到海岸，找地方藏好。没过多久，那头母牛果然从海中走出，在岸边吃草。等它重新回到海里，他才离开藏身处，取了一点粪便带回井边。两个仙灵把药敷在眼上，凭着神圣的力量，双眼果然重新看见光明。她们先感谢上天，又感谢救命恩人，随后商量该怎样报答。她们说，仙灵王有个女儿，亲自严加看守，认定她是世间最美的姑娘，绝不会把她嫁给任何人。两个仙灵可以把西瑙巴尔送进姑娘家中，但他必须赢得她的心，让她爱到无法离开。若姑娘的母亲发现这件事，一定会把他投入烈火。到那时，他只有依照她们所教的办法，才能保住性命。
        - id: ch05-b25
          speaker: fairy_1
          text: >-
            你要让公主爱上你。若她母亲发现，一定会把你烧死。那时请求先给身体涂油，说想死得快些。我们会设法来涂一种神油，烈火烧上一千年也伤不了你。
        - id: ch05-b26
          speaker: narrator
          text: >-
            最后，两个仙灵把西瑙巴尔带进姑娘家。他看见古尔正娇柔地睡着，美得叫人分不清是真人还是梦境。那张完美的面容令他惊得失去知觉。等他清醒，确认眼前确实是一位真实的姑娘，他立刻感谢上天，觉得奔跑的人已经抵达终点，寻宝的人终于找到了宝藏。就在这时，古尔睁开眼睛。陌生男人竟站在自己房中，她吓得立刻坐起。
        - id: ch05-b27
          speaker: gul
          text: 你是谁？是来偷东西的吗？快逃！守卫我的恶魔和仙灵醒来，一定会抓住你。
          emotion: fearful
        - id: ch05-b28
          speaker: narrator
          text: >-
            可爱情已经刺进西瑙巴尔的心，古尔望着他的眼神也同样含着情意。他没有逃走，而是在她家中秘密住了好几个月。两人谁也不敢让古尔的母亲知道。古尔日日忧虑，生怕秘密被发现，脸色渐渐不如从前。一天，父亲问她是不是生了病，为何这样憔悴，还说可以请医生来诊治。两人爱情里的欢喜和痛苦终于再也藏不住，秘密就此败露。西瑙巴尔被抓进监牢，古尔失去爱人，只觉得整个世界都暗了。仙灵王认定这个凡人潜入家中，背弃了主人，下令收集香木，堆成柴堆，要把他活活烧死。
        - id: ch05-b29
          speaker: fairy_king
          text: 你这个凡人，为什么潜入我家，做出这样背信弃义的事？
          emotion: angry
        - id: ch05-b30
          speaker: narrator
          text: >-
            柴堆已经备好，西瑙巴尔忽然想起两个仙灵教过的保命办法。他请求最后一个恩典，希望行刑前先在身上涂油，好让自己死得快些，少受折磨。仙灵王准了，两个获救的仙灵也设法成了替他涂油的人。她们给他抹上那种不怕烈火的神油，随后西瑙巴尔被投入火中。烈焰烧了七天七夜，他身上却没有留下半点痕迹。一周后，仙灵王命人把灰烬倒进垃圾堆，人们这才发现，西瑙巴尔依旧活着，而且毫发无伤。有些仙灵看见古尔因为思念爱人而日渐憔悴，便一同向国王求情。他们说，姑娘的命运显然早与这个凡人的命运相连，否则烈火不会伤不了他。两人彼此相爱，西瑙巴尔又是卡夫瓦克的国王，再也找不到更合适的人选。仙灵王终于答应，亲自主持婚礼，把古尔嫁给了西瑙巴尔。
        - id: ch05-b31
          speaker: sinaubar
          text: 王子，如今你知道我为这个负心人付出过什么。别忘了我们的约定。
        - id: ch05-b32
          speaker: almas
          text: 我记得。但古尔王后为什么会落到今天这一步？
        - id: ch05-b33
          speaker: sinaubar
          text: >-
            一天夜里，古尔冰冷的手脚贴到我身上，把我惊醒了。我问她去了哪里，身上为什么这样冷，她只说有事出去了一趟。第二天早晨，我到马厩，看见疾风和猛虎两匹马都又瘦又累。我以为马夫失职，斥责他，还打了他。马夫却问自己究竟错在哪里。他说，是我的妻子夜夜牵走一匹马，骑到天亮前才回来。我的心里立刻燃起怒火，非要查明她去了哪里，又做了什么。我命马夫保守秘密，下次古尔来牵马，就立刻替我备好另一匹。当天我没有出门打猎，只留在宫中等候。夜里，我照常躺下，故意装作熟睡。古尔以为我已经睡沉，果然起身去了马厩。那一夜轮到猛虎，她骑上它出了城。我随后骑上疾风追赶。你刚才看见的那条狗也跟在我身边。它是忠诚的朋友，从来没有离开过我。
        - id: ch05-b34
          speaker: sinaubar
          text: >-
            山脚下，她走进一间屋子，向高座上的巨人般黑人行礼。那人把她打得满身鞭痕，她一句也不抱怨。我从前只用玫瑰枝轻打她一下，她还烦恼了三天。
        - id: ch05-b35
          speaker: black_man
          text: 丑八怪，秃脑袋！为什么来得这么晚，又为什么不穿新娘礼服？
          emotion: angry
        - id: ch05-b36
          speaker: gul
          text: 那个人迟迟不睡，白天又留在家里。我没法打扮，已经尽快赶来了。
        - id: ch05-b37
          speaker: sinaubar
          text: >-
            过了一会儿，那黑人叫古尔坐到身边。我再也忍不住，扑上去与他拼命。他抓住我的衣领，我们扭打在一起。谁知古尔从背后抓住我的双脚，一下把我掀翻。黑人把我死死按在地上，她又拔出我自己的刀，亲手递给他。若不是忠犬猛扑过去，咬住他的喉咙，把他拖倒在地，我早已经丢了性命。我重新站起来，杀死了那个恶棍。屋里还有四个黑人，我又杀死三个，第四个趁乱逃走。那逃走的人如今就藏在米赫尔·阿弗鲁兹的宝座下面。我把古尔带回宫殿。从那一天直到现在，我把她当狗一样对待，却把救命的忠犬当妻子一样照料。这就是玫瑰对柏树做的事。王子，你已经听到答案，现在该履行我们的约定了。
    - id: ch06
      title: 逃离瓦克
      blocks:
        - id: ch06-b01
          speaker: almas
          text: 我会守约。只求送一点水到屋顶，让我做最后一次净礼。
        - id: ch06-b02
          speaker: narrator
          text: >-
            国王准许了他的请求，命人把水送到屋顶。王子登上去，走进一个无人看见的角落。他打着火镰，在火焰中烧掉一根西穆尔格的羽毛。巨鸟眨眼间便出现在空中，威严的身影仿佛震动了整座城。王子坐到它背上，西穆尔格立刻展翅，直冲天顶。国王在下面等了很久，迟迟不见年轻人回来，这才觉得不对。
        - id: ch06-b03
          speaker: sinaubar
          text: 那年轻人在屋顶太久了，把他带回来。
        - id: ch06-b04
          speaker: narrator
          text: >-
            侍从赶上屋顶，那里早已不见王子的踪影。众人向远处望去，只能依稀看见西穆尔格驮着他飞在天边。消息报到国王面前，西瑙巴尔非但没有发怒，反而感谢上天。他庆幸这个年轻人逃走了，自己的双手不必沾上他的鲜血。西穆尔格越飞越高，大地渐渐缩小，看上去像一枚浮在海上的蛋。最后，巨鸟笔直降回自己的住处。幼鸟们欢叫着迎接救命恩人，又拿出食物盛情款待。王子把玫瑰与柏树的故事从头讲了一遍。西穆尔格听后，又从远近各城为他搜集许多礼物。王子带上这些礼物，告别鸟群，动身返回刀剑交击之堡。
        - id: ch06-b05
          speaker: narrator
          text: >-
            狮王出城迎接。阿尔马斯遵守诺言，依照律法娶了塔拉姆塔克的女儿。姑娘也叫古尔。随后，他带上古尔、她的财物和侍从，来到赠礼之地过夜。黎明时，队伍与狮王告别，向贾米拉的国家进发。贾米拉听说王子临近，立刻率领许多侍女出城，深情迎接。两人欢喜相逢，一同回到花园宫殿。贾米拉召集全国显贵，当着众人的面与王子举行婚礼。几天以后，她把国事交给宰相，准备跟随丈夫回国。启程前，她让所有被姐姐拉蒂法施过魔法的人恢复原形，接受众人的祝福，又送他们各自踏上归途。只有邪恶的拉蒂法仍被独自留在她自己的花园别宫。等仆役、财宝和货物全部备齐，庞大的队伍才从容上路，向库伊穆斯王的都城进发。
        - id: ch06-b06
          speaker: narrator
          text: >-
            库伊穆斯王听说一支庞大的队伍正在靠近，不知来者是敌是友，便派宰相出城隆重迎接，同时询问他们为何到访。阿尔马斯回话说自己无意开战，又亲笔写下一封信。他告诉国王，自己此来，是为终止米赫尔·阿弗鲁兹的罪行。公主已经杀死许多国王和王子，还把他们的头颅悬在城堡上。如今，他要亲自回答她的谜语。进入都城以后，王子果敢地走到猩红帐下，再次敲响那两面珠宝鼓，随后被人领到库伊穆斯王面前。
        - id: ch06-b07
          speaker: kaymus
          text: 年轻人，千万别碰这个谜。至今没有一个人能活着脱身。
        - id: ch06-b08
          speaker: almas
          text: 大王，我正是为回答它而来，绝不会退却。
    - id: ch07
      title: 谜底大白
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: >-
            米赫尔·阿弗鲁兹听说，又有一个人拿自己的头颅押在她的问题上，而且还声称已经知道答案。阿尔马斯请求把全国官员和显贵都召来，让大家亲耳听见他如何作答。于是众人齐聚宫廷。库伊穆斯王、古尔鲁赫王后、公主和阿尔马斯都在场，所有人的目光都落在这场问答上。
        - id: ch07-b02
          speaker: almas
          text: 公主，你问的是什么？
        - id: ch07-b03
          speaker: mihr
          text: 玫瑰对柏树做了什么？
        - id: ch07-b04
          speaker: almas
          text: 各位阅历丰富的人，你们可曾知道、听过，或亲眼见过这件事？
        - id: ch07-b05
          speakers: [courtier_1, courtier_2, courtier_3]
          ensemble: chorus
          text: 没有！从来没人知道、听过或见过。这只是凭空妄想。
        - id: ch07-b06
          speaker: almas
          text: >-
            那么公主从谁那里听来？就是这个凭空的谜，害死了那么多无辜的人。公主，请把实话说出来。我知道故事的全部，可若只有我讲，谁能作证？你必须带来那个证人。
        - id: ch07-b07
          speaker: mihr
          text: 那你先把话讲明白。
        - id: ch07-b08
          speaker: almas
          text: 把藏在你宝座下面的黑人带来，我自然会讲清楚。
        - id: ch07-b09
          speaker: kaymus
          text: 年轻人，你说我女儿的宝座下藏着黑人？
          emotion: surprised
        - id: ch07-b10
          speaker: almas
          text: 您命人去找，很快就会亲眼看见。
        - id: ch07-b11
          speaker: narrator
          text: >-
            国王立刻派使者赶往花园别宫。过了一阵，他们果然从公主宝座下的密室里押回一个黑人。那人穿着荣誉礼服，藏身之处陈设华贵，显然一直过着奢侈生活。库伊穆斯王看到眼前这一幕，惊骇得说不出话。公主心里也猛地一沉，担心自己保守多年的秘密就要传遍天下。可她很快又安慰自己，也许王子只是偶然听说黑人藏在这里，并不知道真正的故事。想到这一层，她重新壮起胆子，语气又傲慢起来。
        - id: ch07-b12
          speaker: mihr
          text: 王子，你还没有回答我的谜。
        - id: ch07-b13
          speaker: almas
          text: 你竟还不知道悔改吗？
          emotion: angry
        - id: ch07-b14
          speaker: narrator
          text: >-
            王子转向满朝众人，从西瑙巴尔打猎口渴、在井中救出两位失明仙灵讲起。他说到海中母牛的药，说到仙灵把西瑙巴尔送进古尔家中，也说到那场烧了七天七夜却没能伤人的烈火。接着，他讲出两人如何成婚，又讲到古尔夜夜骑马出城，与山脚屋中的黑人私会。西瑙巴尔追踪妻子，被古尔从背后掀翻，险些死在自己的刀下，最后全靠忠犬咬住敌人的喉咙才保住性命。说到屋中其余四个黑人时，王子告诉众人，其中三个已经被杀，只有第四个逃了出来。他抬起手，指向此刻被押在殿中的那个人。
        - id: ch07-b15
          speaker: almas
          text: 当时你也在那里。
        - id: ch07-b16
          speaker: black_man
          text: 不错，一切都和你讲的一样。
        - id: ch07-b17
          speaker: narrator
          text: >-
            黑人亲口作证，谜语终于彻底解开。从今以后，再不会有国王和王子因为这句话丧命。宫廷里立刻响起欢呼，喜讯又传遍全国。库伊穆斯王履行约定，把女儿交给阿尔马斯。王子却拒绝娶她，只把她收作俘虏。他又请求国王取下城垛上那些死者的头颅，让他们得到妥善安葬。事情一一照办。随后，国王把米赫尔·阿弗鲁兹的全部财产交给王子。金银珠宝、贵重织物和地毯、全套家什、马匹骆驼、仆役奴隶，一样也没有留下。
        - id: ch07-b18
          speaker: narrator
          text: >-
            王子回到营地，立刻派人召来迪尔·阿拉姆。姑娘守着旧日的盟约，带上自己的财物、黄金和珠宝赶来与他会合。一切备妥后，阿尔马斯启程回国。同行的有贾米拉、迪尔·阿拉姆、塔拉姆塔克之女古尔，还有被俘的米赫尔·阿弗鲁兹。四人的全部财物装上马背和骆驼背，又装满数也数不清的车辆。这样浩浩荡荡的一支队伍，终于踏上归途。
        - id: ch07-b19
          speaker: narrator
          text: >-
            他们接近萨曼王的国境时，王子平安归来的消息早已传开。全城百姓纷纷出城迎接。萨曼王为两个死去的儿子流尽了眼泪，如今双目已经失明。阿尔马斯来到父亲面前，俯身亲吻他的双脚，领受祝福。随后，他从匣中取出一点所罗门眼药。这是西穆尔格送给他的宝物，甚至能使人看见大地隐藏的东西。王子轻轻把药抹到父亲眼上，黑暗立刻退去，光明重新回到萨曼王眼中。父亲终于亲眼看见远行归来的儿子。
        - id: ch07-b20
          speaker: almas
          text: 父亲，她就是杀害您儿子的凶手。您想怎样处置都可以。
        - id: ch07-b21
          speaker: saman
          text: 你已经挫败了她，就由你处置吧。
        - id: ch07-b22
          speaker: narrator
          text: >-
            阿尔马斯作出裁决，叫人牵来四匹强壮的快马。他们把那个藏在宝座下、把谜语告诉公主的黑人分别绑在四匹马上。号令一响，四匹马各自朝一个方向奔去，转眼便把那人像细棉布一样撕成碎片。米赫尔·阿弗鲁兹在一旁看见，吓得魂飞魄散。她认定自己马上也会受到同样的惩罚，便哭着扑向王子，为自己的性命求情。
        - id: ch07-b23
          speaker: mihr
          text: >-
            阿尔马斯王子，人总是更珍惜难以得到的东西。我从没臣服于哪个男人，也没爱过哪个男人。那些王子死去，是他们命中注定，不是我的罪。开天辟地之初，也早已注定我的命运要与你相连。
          emotion: fearful
        - id: ch07-b24
          speaker: narrator
          text: >-
            王子听进了她那番关于宿命的话，又见她确实美丽非凡，最终没有杀她，而是依照律法娶了她。米赫尔·阿弗鲁兹与贾米拉住在一家，迪尔·阿拉姆与古尔住在另一家。从此以后，阿尔马斯与四位妻子一起生活，尽享圆满幸福，日日欢聚相伴。
        - id: ch07-b25
          speaker: narrator
          text: 玫瑰对柏树做了什么，已经讲完了。
        - id: ch07-b26
          speaker: narrator
          text: 完了，完了，完了！
