  chapters:
    - id: ch01
      title: The Riddle and the Three Princes
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a great eastern king named Saman-lalposh. He had three sons, and all three were brave and clever. Their names were Tahmasp, Qamas, and Almas-ruh-bakhsh. One day, as the king sat in his hall, his eldest son came before him and bowed.
        - id: ch01-b02
          speaker: tahmasp
          text: Royal father, I am tired of the town. If you permit it, tomorrow I will take my servants into the hills to hunt. We will return by evening prayer.
        - id: ch01-b03
          speaker: narrator
          text: His father agreed. He sent trusted servants with him, along with hawks and falcons, hunting dogs, cheetahs, and leopards. At the hunting ground, Tahmasp saw a deer of extraordinary beauty. He ordered the beaters not to kill it, but to catch it alive. The deer searched the ring for an opening. The only unwatched place was beside the prince himself. With one great bound, it sailed over his head and raced into the waste like the eastern wind.
        - id: ch01-b04
          speaker: narrator
          text: Tahmasp spurred after it and soon left his followers far behind. The deer flew over the ground, always near enough to keep his hope alive, and the prince would not take his eyes from it. The chase drew him deeper into empty country. Before long he could no longer hear a horn, a hound, or a human voice behind him. Still he followed. When the sun stood directly overhead, the deer vanished behind rising ground. Tahmasp rode over the rise, certain he would see it again, but the waste beyond was bare. He circled one way and then the other. He searched every hollow and ridge, yet found neither hoofprint nor moving shape. Sweat soaked him. Each breath hurt, and his horse's tongue hung out with thirst. There was no shade and no water. He dismounted and struggled onward with the bridle over his arm, praying for heaven's mercy. His horse staggered beside him, fell upon the sand, and died. Tahmasp had lost his quarry, his companions, and now his mount. Still he walked. The hot air burned his chest, and tears ran down his face. At last, through the wavering distance, a hill came into view.
        - id: ch01-b05
          speaker: narrator
          text: He gathered what strength remained and climbed it. At the top stood a giant tree. Its roots seemed to hold the wrinkled earth in place, while its crown touched heaven. Beneath its shining leaves were grass, flowers of many colors, and a spring. Tahmasp dragged himself to the water, drank deeply, and gave thanks for being saved from thirst.
        - id: ch01-b06
          speaker: narrator
          text: Nearby he noticed a royal seat. He was wondering why it stood in that merciless desert when a barefoot man approached. The stranger wore the clothes of a faqir, yet carried himself like a king. His face was kind, wise, and thoughtful.
        - id: ch01-b07
          speaker: janangir
          text: Good young man, how did you come here? Who are you, and where is your home?
        - id: ch01-b08
          speaker: narrator
          text: The prince told him everything that had happened.
        - id: ch01-b09
          speaker: tahmasp
          text: I have told you my circumstances. Now, with respect, may I ask about yours? Who are you, and why do you live alone in this wilderness?
        - id: ch01-b10
          speaker: janangir
          text: Young man, it would be better if you knew nothing about me. My story is not fit to tell, or even to hear.
        - id: ch01-b11
          speaker: narrator
          text: Tahmasp pleaded until the faqir could refuse no longer.
        - id: ch01-b12
          speaker: janangir
          text: Then listen. I am Janangir, King of Babylon. Once I had an army and servants, a family, treasure, and wealth beyond counting. God gave me seven sons, each trained in every princely art. My eldest heard travelers speak of King Quimus, son of Timus, who rules in Turkistan near the Chinese frontier. Quimus has one daughter, Mihr-afruz, whose beauty is said to have no equal beneath the blue sky.
        - id: ch01-b13
          speaker: janangir
          text: "Princes come from every land to ask for her hand. She gives them all the same condition. She says she knows a riddle. Whoever answers it may marry her and receive all she owns. Whoever fails loses his head, which is hung from the citadel wall. Her question is this: What did the rose do to the cypress?"
        - id: ch01-b14
          speaker: janangir
          text: My son fell in love with this girl he had never seen. He came to me weeping, and nothing I said could turn him from her.
        - id: ch01-b15
          speaker: janangir
          text: My son, if this longing must bear fruit, I will lead an army against Quimus. If he gives you his daughter freely, all is well. If he refuses, I will break his kingdom and carry her away.
        - id: ch01-b16
          speaker: eldest_son
          text: A whole kingdom should not be ruined for my desire. I will go alone. I will answer her riddle and win her fairly.
        - id: ch01-b17
          speaker: janangir
          text: I pitied him, so at last I let him go. He reached Quimus's city, heard the riddle, and failed to answer. They cut off his head and hung it from the wall. I wore black and mourned him for forty days. Then another son was seized by the same longing, and another after him. In the end, all seven went to Mihr-afruz, and every one was killed. Grief drove me from my throne. I came to this desert, left all affairs of state behind, and have been wasting away in sorrow.
        - id: ch01-b18
          speaker: narrator
          text: Tahmasp listened, and the same love for the unseen princess struck his own heart like an arrow. At that unlucky moment his followers finally found him and gathered around him like moths around a lamp. They gave him a swift horse and brought him home. But with every passing day, love's thorn sank deeper. He grew pale and weak until his confidants discovered his secret and carried it to King Saman.
        - id: ch01-b19
          speaker: confidant
          text: Your son is desperately in love with Princess Mihr-afruz, the daughter of King Quimus.
        - id: ch01-b20
          speaker: narrator
          text: They told the king about the riddle and the deaths. Sadness clouded his mind.
        - id: ch01-b21
          speaker: saman
          text: If that is so, I will begin with friendship. I will send letters to King Quimus and ask for his daughter's hand. I will send rich gifts, with camels carrying jewels and rubies. She and her household can come here in honor, and she will be your comfort. If Quimus refuses, I will send an army like a whirlwind and bring this proud girl to you.
        - id: ch01-b22
          speaker: tahmasp
          text: That would not be right. I must go myself and answer the riddle.
        - id: ch01-b23
          speaker: wise_man
          text: This is a grave matter. Let the prince travel with people you trust. Perhaps on the road he will think better of it and return.
        - id: ch01-b24
          speaker: narrator
          text: King Saman ordered preparations. Tahmasp took leave of him and set out with courtiers and a train of two-humped, dark-eyed camels laden with gold, jewels, and costly cloth.
        - id: ch01-b25
          speaker: narrator
          text: Stage after stage, through one long day after another, the travelers crossed the distance to King Quimus's city. At last its great citadel rose before them. Its foundations seemed to hold the wrinkled earth firm, and its battlements touched the blue sky. From those battlements hung the heads of many noble men, princes who had arrived with hopes like Tahmasp's and failed before the same question. His companions could see exactly what awaited him. They urged him to put aside his longing while there was still time. Yet those silent heads did not turn Tahmasp back. Advice could not cool the fire that had brought him so far. He rode through the gate and into the heart of the city. Everywhere he looked there were splendid buildings, crowded streets, rich goods, and signs of royal power. It seemed a place whose equal the eyes of all the ages had never seen. Tahmasp noticed its wonders only as things standing between him and Mihr-afruz.
        - id: ch01-b26
          speaker: narrator
          text: In an open square stood a crimson satin tent. Beneath it were two jeweled drums with jeweled sticks. Any suitor for Mihr-afruz was to beat them and announce his arrival. The drums stirred the fire in Tahmasp's heart. His companions begged him to wait while they announced him properly and secured their possessions, but he refused.
        - id: ch01-b27
          speaker: tahmasp
          text: I came for one purpose. My first duty is to strike those drums and declare myself a suitor. Then the king will receive me in that name and give me lodging.
        - id: ch01-b28
          speaker: narrator
          text: He struck the drums. An officer appeared at once and led him before King Quimus. The king saw how young he was, still drinking from the fountain of wonder, and tried to save him.
        - id: ch01-b29
          speaker: quimus
          text: Young man, abandon this proud fancy of my daughter's. No one can answer her riddle. She has killed many men before they had truly tasted life. Heaven forbid that the springtime of your life should be destroyed by the winds of death.
        - id: ch01-b30
          speaker: narrator
          text: Tahmasp would not withdraw. At last they agreed on three days of hospitality before the riddle was asked. The prince went to his quarters and was treated according to his rank. Meanwhile Quimus called for his daughter and her mother, Gulrukh.
        - id: ch01-b31
          speaker: quimus
          text: Listen to me, you cruel flirt. Why continue this madness? A prince from the east has come for you. He is so handsome the sun itself might grow modest before him. He is rich, and he has brought gold and jewels for your sake. You will not find a better husband.
        - id: ch01-b32
          speaker: mihr_afruz
          text: Father, I have sworn that even if a thousand years pass, I will marry no one who cannot answer my riddle. I will give myself only to the man who solves it.
        - id: ch01-b33
          speaker: narrator
          text: Neither father nor mother could change her mind. After three days, Tahmasp was asked, "What did the rose do to the cypress?" He was famous for eloquence, and he answered at once with a verse.
        - id: ch01-b34
          speaker: tahmasp
          text: Only the Almighty knows every secret. If any man tells you, "I know," do not believe him.
        - id: ch01-b35
          speaker: narrator
          text: A servant brought in the cruel blue-eyed headsman.
        - id: ch01-b36
          speaker: headsman
          text: Whose sun of life is nearing its setting?
        - id: ch01-b37
          speaker: narrator
          text: He seized Tahmasp by the arm, placed him on the execution cloth, cut off his head without mercy, and hung it from the battlements.
        - id: ch01-b38
          speaker: narrator
          text: "News of Tahmasp's death plunged King Saman into stunned despair. He wore black and mourned for forty days. Only a few days later, his second son, Qamas, persuaded him to grant the same journey. Qamas too was put to death. One son remained: brave, eloquent, cheerful Almas-ruh-bakhsh. One day he came before his father, who sat brooding over the children he had lost."
        - id: ch01-b39
          speaker: almas
          text: Father, King Quimus's daughter has killed both my brothers. I mean to avenge them.
        - id: ch01-b40
          speaker: narrator
          text: His words brought tears to the king's eyes.
        - id: ch01-b41
          speaker: saman
          text: Light of your father, you are all I have left. And now you ask me to let you go to your death.
          emotion: sad
        - id: ch01-b42
          speaker: almas
          text: Dear father, I cannot rest until I have broken that proud beauty's power and brought her here before you.
        - id: ch01-b43
          speaker: narrator
          text: In the end, Almas also received permission. Unlike his brothers, he traveled alone. He made the long journey to the city of Quimus and saw Tahmasp's and Qamas's heads on the citadel. He found the tent and the jeweled drums, but did not strike them. Instead, he left the city and went to a nearby village.
        - id: ch01-b44
          speaker: narrator
          text: There he found a very old man and his wife, who was more than one hundred and twenty years old. Their hair had whitened, their bodies had grown frail, and their lives were nearly over, yet they had never held a child of their own. The arrival of the young stranger delighted them. They opened their house to him, gave him the place a son might have filled, and cared for him with all the affection they had carried unused through so many years. Almas did not tell the village who he was. He brought his chests, weapons, traveling goods, and every other possession into the old couple's keeping. His horse was led into their outbuilding and fastened there. He asked husband and wife to speak of him to no one and to let no hint of his purpose escape. Then he removed the clothes that declared him a prince and put on a plain disguise. With his rank hidden, he could move through the city without announcing himself at the fatal drums or drawing the princess's notice too soon.
        - id: ch01-b45
          speaker: almas
          text: I trust you with everything I own. Please tell no one about me or my affairs.
        - id: ch01-b46
          speaker: old_woman
          text: Your secret is safe here, my son.
        - id: ch01-b47
          speaker: narrator
          text: At sunrise the next morning, Almas returned to the city. Again and again he asked himself who could explain the riddle and help him avenge his brothers. He wandered everywhere, but no one in the land knew what Mihr-afruz's question meant.
    - id: ch02
      title: The Secret Beneath the Throne
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: One day Almas decided to search Mihr-afruz's own palace for an answer. Her garden-house was magnificent. Its gateway was a wonder, its walls were as strong as Alexander's ramparts, and guards watched every entrance. There was no hope of walking through. Bitter at heart, he told himself that this was still the place where he would find what he needed. He circled the wall, searching for a break, and prayed for a path to open.
        - id: ch02-b02
          speaker: narrator
          text: Then he noticed a stream flowing toward the garden and passing beneath the wall. The water itself offered the gap that stone and guards denied him. After making sure no one was watching, he removed his clothes, slipped into the current, and allowed it to carry him under the barrier. Once inside, he crept into cover and waited until his loincloth was dry enough to wear. The garden around him was like Eden. Clear channels crossed its green lawns. Flowers of many colors opened along the banks, doves called mournfully from the branches, and nightingales answered with their repeated songs. The beauty of the place could steal good sense from anyone who entered it. Almas moved carefully among the trees and came close enough to inspect the garden-house. No one seemed to be there. In its forecourt stood a royal seat made of polished jasper. At the center of the platform, a basin of perfectly clear water caught the light like a mirror. For a little while he forgot his danger and took pleasure in everything he saw. Then the day began to fail. He withdrew into the garden, kept beyond the gardeners' sight, and passed the whole night hidden among the trees.
        - id: ch02-b03
          speaker: narrator
          text: The next morning he pretended to be mad and wandered until he reached a lawn. Several lively young women were at play there. On a jeweled throne covered in silk sat a girl whose beauty seemed to light the whole garden and whose perfume filled the air. Almas knew she must be Mihr-afruz.
        - id: ch02-b04
          speaker: narrator
          text: One attendant came to the water for a cupful. Almas remained hidden, but his face appeared in the water. The girl dropped her cup in fright.
        - id: ch02-b05
          speaker: attendant_1
          text: Is that an angel, a peri, or a man?
          emotion: fearful
        - id: ch02-b06
          speaker: narrator
          text: Trembling, she screamed. The others hurried over and took her to the princess.
        - id: ch02-b07
          speaker: mihr_afruz
          text: What happened, pretty one?
        - id: ch02-b08
          speaker: attendant_1
          text: Princess, I went for water and saw someone's image there. It frightened me.
          emotion: fearful
        - id: ch02-b09
          speaker: narrator
          text: A second attendant went to look. She saw the same face and returned with the same report. Mihr-afruz rose and walked to the basin with the stately step of a peacock. When she saw the reflection, she called her nurse.
        - id: ch02-b10
          speaker: mihr_afruz
          text: Find the person whose face is in that water. Learn where he is hiding.
        - id: ch02-b11
          speaker: narrator
          text: Her words reached Almas. He lifted his head. Mihr-afruz saw a beauty unlike any she had known, and lost a hundred hearts to him. She signaled for the nurse to bring him forward. Almas allowed himself to be persuaded, but when the princess asked his name and how he had entered the garden, he acted senseless. He smiled, then cried. He asked for food, then answered with random words, polite ones mixed with rude.
        - id: ch02-b12
          speaker: mihr_afruz
          text: What a pity. He has lost his mind. Still, he is my madman now. No one is to hurt him.
        - id: ch02-b13
          speaker: narrator
          text: She brought him into her household, ordered that every need be supplied, and told him never to leave. Almas thought this was the best place in the world to discover the riddle's answer. Yet one true word could cost him his life, so he kept up the disguise.
        - id: ch02-b14
          speaker: narrator
          text: The first girl who had seen his reflection was named Dil-aram. She came to love him deeply and spent day and night wondering how to tell him. At last she escaped the princess's notice, found Almas alone, and laid her head at his feet.
        - id: ch02-b15
          speaker: dil_aram
          text: Heaven gave you beauty and charm. Please tell me your secret. Who are you, and how did you come here? I love you. If you wish to escape, I will go with you. I possess wealth as great as Qarun's treasure.
        - id: ch02-b16
          speaker: narrator
          text: Almas answered like a madman and revealed nothing. He would not carelessly lift the veil from his secret and disgrace himself. Dil-aram rose with tears streaming down her face and returned to her room to grieve.
        - id: ch02-b17
          speaker: narrator
          text: Whenever Mihr-afruz called for her madman, Dil-aram watched over him more carefully than any other attendant. The princess noticed.
        - id: ch02-b18
          speaker: mihr_afruz
          text: Dil-aram, take charge of my madman. Give him whatever he asks for.
        - id: ch02-b19
          speaker: narrator
          text: This was exactly what Dil-aram had prayed for. Soon she took Almas somewhere private. She made him swear to secrecy, then swore the same oath herself.
        - id: ch02-b20
          speaker: dil_aram
          text: By heaven, I will never reveal your secret. Tell me who you are and what you need, so I can help you.
        - id: ch02-b21
          speaker: narrator
          text: Almas heard true love in her promise and trusted her.
        - id: ch02-b22
          speaker: almas
          text: Lovely Dil-aram, I need to learn what the rose did to the cypress. Your mistress cuts off men's heads over that question. Why does she do it, and what truth lies behind it?
        - id: ch02-b23
          speaker: dil_aram
          text: Promise that you will marry me and always keep me among those you favor. Then I will tell you what I know, and I will watch for anything more about the riddle.
        - id: ch02-b24
          speaker: almas
          text: If I reach my goal and my struggle ends, I will keep that promise. Once I have this woman in my power and have avenged my brothers, you will be my beloved companion.
        - id: ch02-b25
          speaker: dil_aram
          text: Treasure of my life, I do not know what the rose did to the cypress. But I do know who told Mihr-afruz. She hides a black man beneath her throne. He fled here from Waq in the Caucasus. You must seek the truth there, because no other road leads to it.
        - id: ch02-b26
          speaker: narrator
          text: Almas sank into deep thought. Until that moment he had hoped the answer might lie somewhere inside Mihr-afruz's own household, close enough to seize by patience and cleverness. Now the clue pointed beyond every familiar country, toward a place of demons and peris that he did not know how to find. He had learned why the hidden man mattered, but not the words that could answer the riddle. The road ahead, he knew, might consume years of his life. Dil-aram watched his face while he weighed the distance, the danger, the promise to avenge his brothers, and the marriage compact he had just made with her. She saw his silence as sorrow and tried to offer him a quicker kind of vengeance.
        - id: ch02-b27
          speaker: dil_aram
          text: My life, do not despair. If you want Mihr-afruz dead, I can poison her cup. She will fall asleep and never wake.
        - id: ch02-b28
          speaker: almas
          text: No, Dil-aram. That would not be a brave man's revenge. I will not rest until I reach Waq of the Caucasus and uncover the truth.
        - id: ch02-b29
          speaker: narrator
          text: They renewed their promise of marriage and parted. Almas returned to the village and told the old couple that he must make a long journey. He asked them not to worry and to keep his property safe.
        - id: ch02-b30
          speaker: narrator
          text: He had no idea which road led to Waq. Discouraged by his helplessness, he walked beside his horse. Then an old man appeared before him, serene-faced, dressed in green, and carrying a staff. He looked like the saint Khizr. Almas thanked heaven, placed his hands respectfully over his breast, and bowed. The old man returned his greeting.
        - id: ch02-b31
          speaker: green_saint
          text: How are you, traveler? Where are you bound? Your face tells me you are far from home.
        - id: ch02-b32
          speaker: almas
          text: Revered saint, I am in great difficulty. I do not know the road to Waq of the Caucasus.
        - id: ch02-b33
          speaker: green_saint
          text: Turn back from that dangerous purpose. Choose another task. If you carried a hundred lives with you, not one would return safely from that journey.
        - id: ch02-b34
          speaker: narrator
          text: The warning did not shake Almas.
        - id: ch02-b35
          speaker: green_saint
          text: Why are you so determined to spend your life this way?
        - id: ch02-b36
          speaker: almas
          text: I have important work, and only this road can make it possible. I must go. In God's name, please show me the way.
        - id: ch02-b37
          speaker: green_saint
          text: Then understand me well. Waq belongs to Qaf in the Caucasus, a country of jinn, demons, and peris. Follow this road until it divides into three. Take neither the right road nor the left. Choose the middle one and travel for a day and a night. You will find a pillar bearing a marble slab written in Cufic letters. Obey whatever is written there. Do not disobey.
        - id: ch02-b38
          speaker: narrator
          text: The saint blessed him. Almas kissed his feet, said farewell, and took the road with thanks to the Causer of Causes.
        - id: ch02-b39
          speaker: narrator
          text: A day and a night later, a pillar rose before him in silent beauty. Everything was as the saint had said. Almas knew every language, so he read the old inscription. It told travelers that the right-hand road led to comfort and pleasure. The left brought trouble but reached its goal quickly. The middle road led endlessly toward the Caucasus, where even a thousand lives would be lost. It ended with a warning to stay away.
        - id: ch02-b40
          speaker: narrator
          text: Almas uncovered his head and raised his hands.
        - id: ch02-b41
          speaker: almas
          text: Friend of every traveler, I come to You for help. My purpose lies in Qaf, and danger fills my road. Lead me through it.
        - id: ch02-b42
          speaker: narrator
          text: He threw a handful of earth upon his collar.
        - id: ch02-b43
          speaker: almas
          text: Earth, be my grave if I fall. Coat, be my winding sheet.
        - id: ch02-b44
          speaker: narrator
          text: Then he chose the middle road. Day after day he crossed the weary waste, praying in silence, until trees rose from the sand. They formed a garden behind a gate of carved marble. Beside it slept a huge black guard with his head on a stone. Four millstones made his shield. A giant sword hung from a box tree, and a chain with links as thick as an elephant's thigh held twelve animal skins around his waist.
        - id: ch02-b45
          speaker: narrator
          text: Almas tied his horse near the sleeper's head, trusting that the astonishing guard would not wake. He let the words of the Bismillah fall softly from his lips and entered the gate. The path carried him through great trees, fresh green growth, and borders crowded with flowers. Deeper inside, he reached a private garden where many deer moved together. They were not ordinary animals. Again and again they turned their eyes toward the gate, stamped or lifted a foot, and begged him in the only way they could to go back. This ground was enchanted, and they knew the danger waiting ahead. Almas did not understand. Their delicate movements looked like a greeting, so he continued with an easy heart. After a while a palace appeared. Its porch was grander than Caesar's, and its walls were built of bricks of gold and silver. In the middle stood a high seat covered with the finest carpets. Eight separate doors opened toward it, and opposite every door rested a marble basin. Nothing moved to threaten him. The beauty and stillness of the place made him set caution aside as he walked on.
    - id: ch03
      title: The Enchanted Gardens
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Prince Almas walked farther into the garden. Suddenly a window opened, and a girl looked out. She was so lovely the moon itself might have been jealous. She lost her heart to the prince at once and sent her nurse to bring him in. She wanted to know who had entered a private garden where even lions and wolves dared not go.
        - id: ch03-b02
          speaker: latifa_nurse
          text: Welcome, young man. The lady of the garden wishes to see you. Come with me.
        - id: ch03-b03
          speaker: narrator
          text: The nurse stared at his radiant face in wonder, then led him into a palace like a house in Paradise. Lady Latifa sat among royal carpets. She rose, took his hand, and seated him beside her.
        - id: ch03-b04
          speaker: latifa
          text: Who are you, young man? Where have you come from? And how did you enter my garden?
        - id: ch03-b05
          speaker: narrator
          text: Almas told her his story from beginning to end.
        - id: ch03-b06
          speaker: latifa
          text: This is foolishness. It will make you a wanderer and finally destroy you. No one can reach the Caucasus. Stay here and be grateful. Share my throne and my wealth. I will do whatever you want. I can bring King Quimus and his daughter here, and then you may deal with them as you choose.
        - id: ch03-b07
          speaker: almas
          text: Lady Latifa, I have made a promise before heaven. I will not rest until I have reached Waq of Qaf, learned the truth, taken Mihr-afruz from her father, and put her in prison. When that is done, I will return in state with a great company and marry you according to the law.
        - id: ch03-b08
          speaker: narrator
          text: Latifa argued, but he would not bend. She called for wine, hoping a heated head would change his mind. When the clear wine arrived, she filled a cup and handed it to him.
        - id: ch03-b09
          speaker: almas
          text: Enchanting lady, the host should drink before the guest.
        - id: ch03-b10
          speaker: narrator
          text: To overcome his caution, Latifa emptied the cup herself. She filled it again, and Almas drank. Then she took a lute from one of the singers. Her hands moved with such skill that everyone who heard her lost all sense of the world. For three days the feast continued. Wine shone in the cups, musicians played, and Latifa used every pleasure of her palace to make the prince forget the road. Sometimes she reasoned with him about its dangers. Sometimes she described the throne and riches they could share. Sometimes she reminded him that she had offered to place Quimus and Mihr-afruz in his hands without hardship. Almas enjoyed her company and felt the fire of her love, but he never confused that love with the promise that governed his journey. He would not agree to remain, and he would not trade his chosen task for a victory Latifa offered to arrange. On the fourth day he knew that another hour of delight would only make departure harder, so he asked her to release him with her blessing.
        - id: ch03-b11
          speaker: almas
          text: Joy of my eyes, please bid me farewell now. My road is long, and your love burns in my heart. If heaven lets me fulfill my purpose, I will return to you.
        - id: ch03-b12
          speaker: narrator
          text: Latifa saw that persuasion had failed. She ordered her nurse to bring a casket containing something that would strengthen him for the road. She gave Almas a portion to eat. While he suspected nothing, she reached for a stick shaped like a snake, whispered words over it, and struck his shoulder. He cried out, spun around, and found himself changed into a deer.
        - id: ch03-b13
          speaker: narrator
          text: Despair swept over him. Every thread of misfortune seemed knotted around him, and his last chance appeared lost. He tried to flee, but Latifa called a goldsmith to cover his antlers with gold and jewels. She tied her own embroidered kerchief around his neck, then let him go.
        - id: ch03-b14
          speaker: narrator
          text: The prince-deer bounded through the garden, hunting for an escape. None appeared. He joined the other deer and soon became their leader. Though his body was a deer's, his mind and heart remained human. He even thanked heaven that Latifa had given him a beautiful form. For a time he lived with the herd. At last he could endure it no longer and searched the wall again.
        - id: ch03-b15
          speaker: narrator
          text: He found a place where the top of the wall dipped lower. Gathering himself, he remembered the Divine Names and sprang over, trusting whatever God had willed. His hooves touched ground, but freedom did not lie beneath them. When he looked up, he stood in the very place from which he had jumped. The same palace rose nearby. The same paths crossed the same garden, and the same enchanted deer watched him. He went around the wall once more, returned to the low place, and tried again. Once more the garden folded him back upon himself. He leaped a third time, then a fourth, refusing to accept the prison magic had made. Eight times he cleared the stones. Eight times he found himself where he had started, with every familiar sight around him. Still he did not stop. At the ninth leap, something changed. There was again a palace, and again a garden enclosed by walls, but the herd had vanished. Almas had escaped Latifa's enclosure only to land in another unknown place.
        - id: ch03-b16
          speaker: narrator
          text: A moon-faced girl opened a window. The sight of her captured the prince's heart, while she cried out in delight at the jeweled deer.
        - id: ch03-b17
          speaker: jamila
          text: Nurse, catch it for me! If you do, I will give you this necklace. Every pearl is worth a kingdom.
        - id: ch03-b18
          speaker: narrator
          text: The nurse wanted the pearls, but she was three hundred years old and did not know how to catch a deer. She went down with a handful of grass. Each time she crept close, Almas ran away.
        - id: ch03-b19
          speaker: jamila
          text: Nurse, if you do not catch that deer, I will kill you!
        - id: ch03-b20
          speaker: jamila_nurse
          text: I am already killing myself trying!
        - id: ch03-b21
          speaker: narrator
          text: The girl saw the old woman tottering and came to help. When she noticed the gilded antlers and embroidered kerchief, she understood that the deer had known human hands.
        - id: ch03-b22
          speaker: jamila
          text: This must be some royal pet. It is accustomed to people.
        - id: ch03-b23
          speaker: narrator
          text: Almas feared she might be another magician who would give him an even worse shape. Still, surrender seemed his best hope. He played around her and allowed her to catch him by the neck. They brought a leash and fruit, stroked him with delight, and led him into the palace. He was tied at the foot of Lady Jamila's raised seat. She ordered a longer cord so he could jump up beside her.
        - id: ch03-b24
          speaker: narrator
          text: As the nurse changed the cord, she saw tears falling from the deer's eyes.
        - id: ch03-b25
          speaker: jamila_nurse
          text: Lady Jamila, this is no ordinary deer. It is crying. I have never seen a deer shed tears.
          emotion: surprised
        - id: ch03-b26
          speaker: narrator
          text: Jamila rushed down. The deer rubbed its head against her feet and shook it so sadly that she began to cry too. She stroked it gently.
        - id: ch03-b27
          speaker: jamila
          text: Why are you grieving, my heart? Why do you cry, my soul? Is it because I caught you? I love you more than my own life.
          emotion: sad
        - id: ch03-b28
          speaker: narrator
          text: The deer only wept harder.
        - id: ch03-b29
          speaker: jamila
          text: Unless I am wrong, my wicked sister Latifa did this. She uses magic to turn God's servants into wild animals.
        - id: ch03-b30
          speaker: narrator
          text: At her words, the deer made urgent sounds and laid its head upon her feet. Jamila knew then that it was truly a man.
        - id: ch03-b31
          speaker: jamila
          text: Take comfort. I will return you to your own shape.
          emotion: calm
        - id: ch03-b32
          speaker: narrator
          text: Jamila bathed and ordered the deer to be washed as well. She put on clean clothes, opened a box from an alcove, and fed the deer a portion of what it held. From beneath her carpet she drew a stick, spoke over it, and struck him hard. The deer spun around and became Prince Almas once more. Latifa's kerchief and the jewels from his antlers fell to the floor.
        - id: ch03-b33
          speaker: narrator
          text: Almas bowed to the ground in gratitude to heaven and to Jamila.
        - id: ch03-b34
          speaker: almas
          text: Wonderful lady, how can I excuse all the trouble I have brought you? What words could ever thank you?
        - id: ch03-b35
          speaker: narrator
          text: Jamila chose a royal robe from a clothing chest, and her attendants dressed him. When he returned, she took his hand, seated him beside her, and looked at him with love.
        - id: ch03-b36
          speaker: jamila
          text: Tell me the truth. Who are you, where is your home, and how did you fall into my sister's power?
        - id: ch03-b37
          speaker: narrator
          text: Even as a deer, Almas had admired Jamila. Now she seemed a thousand times lovelier. He trusted truth and told her his whole history.
        - id: ch03-b38
          speaker: jamila
          text: Prince Almas, do you still mean to travel to Waq of Qaf? What hope can you have? The road is deadly even here, and we have not reached the Caucasus border. Give it up. Jinn and demons will seize you. Stay with me, and whatever you wish will be yours.
        - id: ch03-b39
          speaker: almas
          text: Generous Jamila, my life is truly in your hands. I ask one favor. I love you as you love me, so do not forbid this journey. Help me as far as you can. If I return with my purpose fulfilled, I will marry you lawfully, take you to my country, and share my life with you in happiness. Give me your counsel.
        - id: ch03-b40
          speaker: jamila
          text: Then I will give you treasures no king possesses. First, the bow and arrows of the Prophet Salih. Second, a sword called the Scorpion of Solomon. Stone and steel are alike to it, and nothing it strikes can resist it. Third, the dagger made by the sage Timus. Whoever wears it will not bend beneath the weight of seven loaded camels.
        - id: ch03-b41
          speaker: jamila
          text: You must first reach the Simurgh's home and win his friendship. If he favors you, he can carry you to Waq of Qaf. Otherwise you will never arrive. Seven seas stand in the way, and no gathering of kings, ministers, and sages could discover how to cross them, even after a thousand years.
        - id: ch03-b42
          speaker: almas
          text: Where does the Simurgh live, and how can I reach him?
        - id: ch03-b43
          speaker: jamila
          text: Follow my directions exactly, and use both your eyes and your judgment. If you fail, you may wander into the country of a bloodthirsty people, and heaven forbid that they catch you.
        - id: ch03-b44
          speaker: narrator
          text: She brought out the bow and quiver, the sword, and the dagger. Almas spoke God's name and fastened them on. Jamila also gave him two red silk saddlebags. One held roasted birds and small cakes. The other held precious stones. Last came a horse as quick as the morning wind.
        - id: ch03-b45
          speaker: jamila
          text: Ride to a nearby rise where you will find a spring called the Place of Gifts. Stay there for one night. Many wild creatures will gather, including lions, tigers, leopards, and apes. Hunt some game before you arrive. A lion-king rules the long road beyond. Without his power, other beasts would destroy the country and no traveler could pass.
        - id: ch03-b46
          speaker: jamila
          text: When the great red lion comes, stand and bow. Wipe the dust from his face with a cloth. Clean the game and place it before him. When he wishes to eat, cut pieces and offer them respectfully. Do this, and the lion-king will become your friend. He will protect you from the black warriors of that country.
        - id: ch03-b47
          speaker: jamila
          text: After the Place of Gifts, do not take the right-hand road. Choose the left. The right passes the Castle of Clashing Swords. Forty captains live there, each commanding three or four thousand men, and Taram-taq rules them all. Beyond that castle lies the Simurgh's home.
        - id: ch03-b48
          speaker: narrator
          text: Almas fixed every word in his memory. Jamila escorted him part of the way. Then they said farewell, and she returned home to mourn his absence.
    - id: ch04
      title: The Lion King and the Castle of Clashing Swords
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Trusting in the Causer of Causes, Almas rode to the Place of Gifts and dismounted beside its platform. Just as Jamila had promised, after several hours of darkness the open ground filled with magnificent beasts. They made way for a lion of astonishing size, eighty yards from nose to tail. Seventy or eighty lions followed him and formed a wide circle.
        - id: ch04-b02
          speaker: narrator
          text: Almas went forward and bowed. The lion lowered his great head and paced toward the platform. He laid his right paw over his left. Almas took Jamila's kerchief and carefully wiped the dust from his face. Then he brought the prepared game and stood with crossed hands. When the lion wished to eat, Almas cut the meat and placed each piece in his mouth.
        - id: ch04-b03
          speaker: narrator
          text: The serving lions came closer. Almas was about to stop feeding, but their king signaled that they too should eat. He spread meat for them on the platform. At last the king beckoned him nearer.
        - id: ch04-b04
          speaker: lion_king
          text: Sleep without fear. My guards will watch over you.
          emotion: calm
        - id: ch04-b05
          speaker: narrator
          text: Surrounded by the lion guard, Almas slept until dawn. At parting, the king pulled several hairs from his mane.
        - id: ch04-b06
          speaker: lion_king
          text: If danger finds you, burn one of these hairs. I will come.
        - id: ch04-b07
          speaker: narrator
          text: The lions disappeared into the jungle. Almas rode on until the road divided. He remembered Jamila's warning that the right-hand way was short but deadly. Yet he told himself that whatever had been written on his forehead must happen. Against her advice, he took the forbidden road.
        - id: ch04-b08
          speaker: narrator
          text: A castle soon appeared. He knew it was the Place of Clashing Swords. He wished he could turn back, but his courage would not allow it. Accepting what had been ordained, he rode toward the gate. As he prepared to tie his horse to a tree, a guard came out and saw him.
        - id: ch04-b09
          speaker: gate_guard
          text: Ha! Taram-taq has craved human flesh for a long time. This creature will make him a fine meal.
        - id: ch04-b10
          speaker: narrator
          text: The guard seized the horse's reins.
        - id: ch04-b11
          speaker: gate_guard
          text: Get down, man-child. My master has been waiting for human meat.
        - id: ch04-b12
          speaker: almas
          text: What vile nonsense is this? Let go of my reins.
        - id: ch04-b13
          speaker: gate_guard
          text: Come quietly, or I will leave you in such a state that even the birds will weep.
        - id: ch04-b14
          speaker: narrator
          text: Almas drew the Scorpion of Solomon and struck through the man's thick leather belt. The blade passed clean through him. He remained standing for a moment, muttered, and reached for Almas. Then his two halves fell apart.
        - id: ch04-b15
          speaker: narrator
          text: Almas washed at nearby water and prepared himself for the struggle ahead. A second guard emerged, saw the body, and ran back to report. Others came hoping to cut Almas down. The magic sword divided every one of them. At last Taram-taq summoned his giant champion, Chil-maq, a fighter said to be worth three hundred men.
        - id: ch04-b16
          speaker: taram_taq
          text: Go and bring that man to me.
        - id: ch04-b17
          speaker: narrator
          text: Chil-maq came out as tall as a tower, carrying a shield made from eight millstones.
        - id: ch04-b18
          speaker: chil_maq
          text: Hey, fool! Who gave you the right to enter our country and kill our people? Come on, then. Cut me in two as well!
        - id: ch04-b19
          speaker: narrator
          text: He thought so little of the prince that he threw aside his club and rushed forward barehanded. He caught Almas by the collar, tucked him under one arm, and started back toward Taram-taq. Almas drew the dagger of Timus and drove its full length up beneath the giant's arm. Chil-maq dropped him and bent to recover his club. As he stooped, the Scorpion of Solomon cut him through the waist.
        - id: ch04-b20
          speaker: narrator
          text: When Taram-taq heard that his champion was dead, he put himself at the head of his whole army and led them from the castle. Rank after rank poured toward Almas. The magic sword felled many, but every fallen fighter seemed to be replaced by another. The prince struck at leather belts and armored heads, driving the attackers back whenever they crowded him. The battle continued until his arms grew heavy, his breath came painfully, and weakness and exhaustion nearly overcame him. He remembered the hairs the lion king had given him, but the enemy allowed him no time to use them. At last there came one brief pause between attacks. Almas caught up his fire steel, made a spark, and held one hair in the tiny flame. He had only just managed to burn it when the army charged again. They closed around him from every side and came so near to taking him prisoner that he could no longer see a path out.
        - id: ch04-b21
          speaker: narrator
          text: Then an army of lions appeared beyond the veil of the desert, their king at its head.
        - id: ch04-b22
          speakers: [warrior_1, warrior_2]
          ensemble: duo
          text: What brought these scourges of heaven upon us?
          emotion: fearful
        - id: ch04-b23
          speaker: narrator
          text: Their roar gave Almas fresh strength. His sword split belts and bodies, or cleaved helmets down to the waist. Ten thousand lions joined him, tearing through riders and horses. At last Taram-taq stood alone and turned toward his fort.
        - id: ch04-b24
          speaker: almas
          text: Where are you going, accursed chief? Are you running away from me?
        - id: ch04-b25
          speaker: taram_taq
          text: Welcome, little man! Come closer, and my club will soften you like wax.
          emotion: angry
        - id: ch04-b26
          speaker: narrator
          text: Taram-taq hurled his club at Almas's head. The prince spurred forward, and it crashed harmlessly behind him. Thinking he had struck his enemy, Taram-taq looked down. Almas swept around behind him and cut him to the waist.
        - id: ch04-b27
          speaker: narrator
          text: The lion king praised the prince's fierce courage. Together they entered the castle and found it furnished like a royal palace. Taram-taq had a daughter there, still a child, and she sent Almas a message.
        - id: ch04-b28
          speaker: gul_daughter
          text: King of the world, accept me as your servant. Keep me beside you, and wherever you go, I will follow.
        - id: ch04-b29
          speaker: narrator
          text: Almas sent for her. She kissed his feet and accepted his faith.
        - id: ch04-b30
          speaker: almas
          text: I must travel far on urgent business. When I return, I will take you and all your possessions to my country. Until then, remain safely in this castle.
        - id: ch04-b31
          speaker: narrator
          text: He placed the fort and everything within it under the lion's protection.
        - id: ch04-b32
          speaker: almas
          text: Guard them, brother. Let no one harm them or take what is theirs.
        - id: ch04-b33
          speaker: narrator
          text: He chose a fresh horse from Taram-taq's stable, said farewell, and continued his journey.
    - id: ch05
      title: The Simurgh and the Seven Seas
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "After many days and many stages, Almas reached a plain of marvelous beauty. Roses, tulips, and clover carpeted the earth. Clear water wound among soft lawns. One tree was unlike any he had seen. Though all its branches grew from the same trunk, they carried a thousand kinds of fruit and flowers. Beside it stood a reservoir built from four stones: touchstone, pure stone, marble, and lodestone. Fragrant water flowed through it. Almas knew this must be the Simurgh's home."
        - id: ch05-b02
          speaker: narrator
          text: He let his horse graze, ate some of Jamila's food, drank, and lay down. He had just begun to doze when the horse neighed and pawed the ground. Almas opened his eyes and saw a dragon like a mountain. Its vast breast crushed the stones beneath it into paste.
        - id: ch05-b03
          speaker: narrator
          text: He remembered the Thousand Names of God and prepared each of Jamila's gifts. He took the bow of the Prophet Salih from its case and drew three arrows from the quiver. He tied the dagger of Timus firmly at his waist so it could not be torn away, and hung the Scorpion of Solomon where his hand could reach it. Then he placed one arrow on the string and drew with all his strength. It flew into the monster's eye so deeply that only the notch remained outside. The dragon twisted its mountain-sized body upon itself. It beat its head against the ground until the earth shook beneath the prince and his horse. From its mouth rolled a foul, poisonous vapor. The creature was wounded, but it was far from helpless, and its rage made the peaceful plain tremble around it.
        - id: ch05-b04
          speaker: narrator
          text: The second arrow struck its throat. The dragon drew a mighty breath, trying to pull Almas into its mouth. When he came within reach, he entrusted himself to God, drew the Scorpion, and struck through its neck to the gullet. The creature's foul breath and terrible strangeness overwhelmed him. He fainted. When he woke, its blood covered him. He rose and thanked heaven for his life.
        - id: ch05-b05
          speaker: narrator
          text: High in the wonderful tree was the Simurgh's nest. The parent birds were away searching for food. They always told their young never to look over the rim while they were gone. But the battle below was so loud that the nestlings peered down and saw everything. Once the dragon was dead, hunger made them cry out. Almas cut up the monster and fed them piece after piece until not one bit remained. Then he washed and went to sleep.
        - id: ch05-b06
          speaker: narrator
          text: The parent birds returned while Almas still slept below. Usually, long before they reached the tree, their children thrust up their heads and filled the air with hungry cries of welcome. That day the nest remained silent. The young birds were so full of dragon meat that they could do nothing but sleep. From above, the parents saw the strange human figure stretched beneath their tree, but they saw no movement in the nest. A familiar grief seized them. For many earlier years, their nestlings had disappeared while they were away gathering food. They had searched and mourned, yet never discovered what creature was murdering their young. Now a man lay beneath the nest as though sleeping after a meal. To the frightened parents, his presence seemed to explain the old calamity and the dreadful silence of this day.
        - id: ch05-b07
          speaker: simurgh_father
          text: That man has eaten our children and fallen asleep afterward. He must die.
          emotion: angry
        - id: ch05-b08
          speaker: narrator
          text: The father bird flew to the hills, tore up a huge stone in his claws, and prepared to drop it on the prince.
        - id: ch05-b09
          speaker: simurgh_mother
          text: Look into the nest first. If we kill an innocent person, we will answer for it on the Day of Resurrection.
        - id: ch05-b10
          speaker: narrator
          text: They came closer. The young birds woke.
        - id: ch05-b11
          speakers: [nestling_1, nestling_2]
          ensemble: duo
          text: Mother, what food did you bring us?
        - id: ch05-b12
          speaker: nestling_1
          text: A dragon came while you were gone. The young man fought it and saved us.
        - id: ch05-b13
          speaker: nestling_2
          text: Then he cut it up and fed us. That is why we were asleep when you returned.
        - id: ch05-b14
          speaker: simurgh_mother
          text: Father, you nearly did a terrible thing. We have been spared a great sin.
        - id: ch05-b15
          speaker: narrator
          text: The father carried the stone far away and dropped it. It sank into the middle of the earth. Returning, he saw a narrow beam of sunlight touching Almas through the leaves. He spread his great wings and shaded the prince until he woke. Almas rose and bowed. The Simurgh greeted him with joy, caressed him, and asked about his journey.
        - id: ch05-b16
          speaker: simurgh_father
          text: Tell me truly, young man. Who are you, where are you going, and how did you cross the desert where no human foot has ever walked?
        - id: ch05-b17
          speaker: narrator
          text: Almas told the story from its beginning.
        - id: ch05-b18
          speaker: almas
          text: My heart's wish is that you carry me to Waq of the Caucasus. With your help, perhaps I can finish my task and avenge my brothers.
        - id: ch05-b19
          speaker: simurgh_father
          text: No human being has ever done what you did today. You saved my children, so you may claim all the help I possess. Every year that dragon came and destroyed my young, while I never knew the killer. By God's grace, you have ended our enemy. From this day I count you as my own child.
        - id: ch05-b20
          speaker: simurgh_father
          text: Stay here. I will give you anything you desire. I can raise a city for you, fill it with every necessity, give you the lands of the Caucasus, and make its princes obey you. Do not travel to Waq. The road is full of death, and its jinn will surely kill you.
        - id: ch05-b21
          speaker: narrator
          text: Almas remained firm. The Simurgh saw that no promise or warning could move him.
        - id: ch05-b22
          speaker: simurgh_father
          text: Then let it be so. Before we leave, go into the plain and take seven deer. Make watertight bags from their hides, and divide the meat into seven portions. Seven seas lie between us and Waq. I will carry you, but you must place food and water in my mouth whenever I ask. Without them, we will fall and drown.
        - id: ch05-b23
          speaker: narrator
          text: Almas prepared everything exactly as instructed. Then he climbed onto the Simurgh, and they rose into the sky. They crossed the seven seas, and above each one he fed the bird meat and gave it water. At last they landed on the far shore.
        - id: ch05-b24
          speaker: simurgh_father
          text: My son, your road begins here. Follow it until you reach the city. Take three of my feathers. If trouble comes, burn one, and I will reach you in the blink of an eye.
        - id: ch05-b25
          speaker: narrator
          text: Almas walked alone along the road the Simurgh had shown him until the city came into sight. He passed through its gates and began searching without knowing what sort of person might hold the answer. He crossed busy bazaars, followed narrow lanes, entered open squares, and wandered through every quarter. Nothing he overheard mentioned the rose or the cypress. He could not safely question strangers, because the silence surrounding the riddle felt deliberate, and he had not crossed seven seas merely to die before learning the truth. Seven days passed while he considered the problem. From his first day in the city, a young cloth merchant had treated him with friendship. They spent time together, spoke openly on ordinary matters, and soon liked one another as brothers. Almas decided that if anyone could direct him without betraying him, it was this friend. One day, without warning or cautious preparation, he put the forbidden question plainly.
        - id: ch05-b26
          speaker: almas
          text: Dear friend, tell me what the rose did to the cypress. What does that riddle mean?
        - id: ch05-b27
          speaker: cloth_merchant
          text: If I did not love you like a brother, I would cut off your head for asking that.
          emotion: surprised
        - id: ch05-b28
          speaker: almas
          text: Even if you meant to kill me, you would still have to answer first.
        - id: ch05-b29
          speaker: cloth_merchant
          text: If you truly want the answer, you must ask our king. No one else will speak of it. I have a friend at court named Farrukh-fal. I can introduce you.
        - id: ch05-b30
          speaker: almas
          text: That is exactly what I need.
        - id: ch05-b31
          speaker: narrator
          text: The merchant arranged the meeting. Farrukh-fal brought Almas before King Sinaubar and presented him as a far-traveled stranger who sought the king's protection. The Simurgh had given Almas a diamond weighing thirty misqals. He offered it to the king, who knew its worth at once.
        - id: ch05-b32
          speaker: sinaubar
          text: Where did you find such a stone?
        - id: ch05-b33
          speaker: almas
          text: Once I had wealth, rank, and power, and my country holds many stones like this. Robbers took everything from me at the Castle of Clashing Swords. I saved only this diamond, hidden in my bathing cloth.
        - id: ch05-b34
          speaker: narrator
          text: Sinaubar understood both the diamond's great value and what it meant for a traveler to surrender the last object he still owned. Instead of merely accepting it, he sent Almas gifts worth many times more. He welcomed the stranger with the fullest hospitality and ordered his minister to install him in the royal guest house with every comfort due to a man of rank. The king soon discovered that Almas was an engaging companion. The prince could speak wisely, listen well, and turn serious conversation toward pleasure without becoming foolish. They met every day, and the hours passed easily between them. Sinaubar wished to show still greater generosity. Several times he asked Almas to name some possession, office, treasure, or favor that would give him pleasure. Almas delayed because he knew the one gift he wanted carried a danger unlike any ordinary royal request.
        - id: ch05-b35
          speaker: sinaubar
          text: Name something that would please you, so I may give it.
        - id: ch05-b36
          speaker: narrator
          text: At last Almas asked to speak privately. Sinaubar dismissed everyone.
        - id: ch05-b37
          speaker: almas
          text: I have only one desire. Tell me what the rose did to the cypress, and what those words mean.
        - id: ch05-b38
          speaker: narrator
          text: The king stared at him in astonishment.
        - id: ch05-b39
          speaker: sinaubar
          text: In God's name, if anyone else had asked me that, I would have cut off his head at once.
          emotion: surprised
        - id: ch05-b40
          speaker: narrator
          text: Almas answered with silence, then turned the conversation so pleasantly that Sinaubar could not bring himself to kill him. Time passed. Whenever the king offered a gift, Almas wished only for his welfare.
        - id: ch05-b41
          speaker: narrator
          text: One night a banquet filled the palace. Cupbearers passed gold and silver cups of sparkling wine. Singers competed with voices of great sweetness. Almas drank from the king's cup. When the wine warmed him, he took a lute, sat at the carpet's edge, and sang until his listeners forgot themselves. Praise rang from every side. Sinaubar filled a cup and called him near.
        - id: ch05-b42
          speaker: sinaubar
          text: Name your wish now. Whatever it is, it belongs to you.
        - id: ch05-b43
          speaker: narrator
          text: Almas emptied the cup.
        - id: ch05-b44
          speaker: almas
          text: King of the world, I have one aim in life. I must know what the rose did to the cypress.
        - id: ch05-b45
          speaker: sinaubar
          text: No man has ever asked that and survived. If it is truly your only wish, I will answer. But first you must agree that after hearing the truth, you will submit to death.
        - id: ch05-b46
          speaker: almas
          text: I accept. My foot stands firmly on that promise.
    - id: ch06
      title: What the Rose Did to the Cypress
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Sinaubar gave an order. An attendant spread a costly carpet covered with European velvet. A dog entered on a jeweled golden chain and sat upon it, while a band of beautiful attendants gathered around to serve it.
        - id: ch06-b02
          speaker: narrator
          text: Then twelve men dragged in a woman whose hands and feet were chained. Though poorly dressed, she was beautiful enough to shame the sun. They set her on the bare floor. At the king's command, she received one hundred lashes and released one long sigh. Servants spread tablecloths and set delicate food before the dog, with water in a royal cup of Chinese crystal. After the dog had eaten, they made the woman eat what it left. She wept, and her tears became pearls. She smiled, and roses fell from her lips. Servants gathered the pearls and flowers for the treasury.
        - id: ch06-b03
          speaker: sinaubar
          text: You have now seen these things. Your purpose is fulfilled.
        - id: ch06-b04
          speaker: almas
          text: I have seen wonders, but I do not understand them. Tell me their meaning, and then kill me.
        - id: ch06-b05
          speaker: sinaubar
          text: The chained woman is my wife. Her name is Gul, the Rose, and I am Sinaubar, the Cypress. One day while hunting, I became desperately thirsty. After a long search I found a hidden well. I was alone, so I used my turban as a rope and my cap as a bucket. When I lowered it, something caught the rope and would not let go.
        - id: ch06-b06
          speaker: sinaubar
          text: I pulled at the turban, but whatever held it below would not let go. I called down that I was a servant of God, that I was dying of thirst, and that it was unjust to keep water from me. A cry rose from the darkness. The voices said they too were servants of God. They had been trapped in the well for a long time and begged me, in God's name, to bring them into the light. I forgot my thirst and tried one plan after another. The narrow opening and my poor rope made the work difficult, but at last I drew up two women. Both were blind. They told me they were peris, and that their own king had struck away their sight in anger and left them alone at the bottom of that hidden well.
        - id: ch06-b07
          speakers: [peri_1, peri_2]
          ensemble: duo
          text: Find the cure for our blindness, and we will serve you faithfully. Whatever you ask, we will do.
        - id: ch06-b08
          speaker: sinaubar
          text: What will cure you?
        - id: ch06-b09
          speaker: peri_1
          text: A sea cow comes ashore nearby to graze. A little of her dung will restore our sight.
        - id: ch06-b10
          speaker: peri_2
          text: Do not let her see you. If she does, she will certainly kill you.
        - id: ch06-b11
          speaker: sinaubar
          text: Hope gave me new strength. I hid near the shore and watched the cow rise from the sea, graze, and return to the water. Then I collected what the peris needed. They rubbed it on their eyes, and by divine power they could see again.
        - id: ch06-b12
          speaker: sinaubar
          text: They thanked heaven and wondered how to repay me. Their king had a daughter whom he guarded closely and believed to be the loveliest creature on earth.
        - id: ch06-b13
          speaker: peri_1
          text: We will take you into the princess's house. You must win her love and become dearer to her than anyone else.
        - id: ch06-b14
          speaker: peri_2
          text: Her mother cannot bear to part from her and refuses every marriage. If she discovers you, she will have you burned alive. Ask as your final favor to be rubbed with oil, so the flames will end your pain quickly. We will arrange to anoint you with an oil that no fire can burn away.
        - id: ch06-b15
          speaker: sinaubar
          text: The peris brought me into the girl's room. She lay sleeping, more beautiful than I could have imagined. For a while I could not tell whether she was real or a dream. Then I thanked heaven that my long search had led me to such treasure.
        - id: ch06-b16
          speaker: gul_queen
          text: Who are you? Did you come to steal? How did you enter? Go quickly, before the demons and peris guarding me wake and seize you!
          emotion: fearful
        - id: ch06-b17
          speaker: sinaubar
          text: Love had already pierced my heart, and she looked on me kindly too. I could not leave. For several months I hid in her house. We dared not let her mother discover our love. Gul often grew sad, fearing the secret would escape. Then one day her father questioned her.
        - id: ch06-b18
          speaker: peri_king
          text: Sweetheart, your beauty has faded lately. Are you ill? Tell me, and I will seek a cure.
        - id: ch06-b19
          speaker: sinaubar
          text: Our joy and fear could no longer be concealed. The secret came out. I was thrown into prison, and without me the world went dark for my rose.
        - id: ch06-b20
          speaker: peri_king
          text: Why have you, a human man, betrayed the trust of my house?
          emotion: angry
        - id: ch06-b21
          speaker: sinaubar
          text: The king ordered me burned. Demons and peris piled fragrant wood for the fire. Then I remembered the lifesaving counsel of the two women I had rescued. I asked to be covered with oil so I would die quickly and escape long torture. The king allowed it. My two friends became the anointers and spread their magic oil over me.
        - id: ch06-b22
          speaker: sinaubar
          text: They placed me in the fire and kept it burning for seven days and nights. By the will of the Great King, it did not mark me. After a week, the peri king ordered the ashes thrown on the rubbish heap. There they found me alive and untouched.
        - id: ch06-b23
          speaker: narrator
          text: The peris who had watched Gul suffer for love now pleaded with their king.
        - id: ch06-b24
          speakers: [peri_1, peri_2]
          ensemble: duo
          text: Your daughter's fate is plainly joined to his. The fire could not harm him. Let them marry, because they love one another. He is the King of Waq of Qaf, and she will find no better husband.
        - id: ch06-b25
          speaker: sinaubar
          text: Her father agreed, and Gul and I were lawfully married. Now you know what I endured for this faithless woman. Prince, remember your promise.
        - id: ch06-b26
          speaker: almas
          text: I remember. But first tell me what she did to deserve these chains.
        - id: ch06-b27
          speaker: sinaubar
          text: One night I woke when Gul's hands and feet touched me. They were cold as death. She said she had needed to go outside. The next morning, two horses in my stable, Windfoot and Tiger, looked exhausted and thin. I blamed the groom and beat him.
        - id: ch06-b28
          speaker: groom
          text: What have I done wrong? Every night your wife takes one of those horses and rides away. She returns only a little before dawn.
        - id: ch06-b29
          speaker: sinaubar
          text: Anger burned in me, but I ordered the groom to keep silent. The next time Gul took a horse, he was to saddle the other and bring it to me. I stayed home from the hunt and pretended to sleep that night. Once Gul thought I was helplessly asleep, she went to the stable, mounted Tiger, and rode away. I followed on Windfoot. The dog you see here came with me, as faithful as ever.
        - id: ch06-b30
          speaker: sinaubar
          text: Beyond the city, at the foot of the hills, Gul dismounted near a house built by several black men. A giant lay on a raised seat by the door. She bowed before him. He rose and beat her until her skin was striped with wounds, yet she did not complain. I could hardly believe it. Once I had touched her with a rose stem, and she complained for three days.
        - id: ch06-b31
          speaker: gul_lover
          text: Why are you late, ugly shaven-headed woman? And why did you come without your wedding clothes?
        - id: ch06-b32
          speaker: gul_queen
          text: That man would not go to sleep, and he stayed home all day. I had no chance to dress myself. I came as soon as I could.
        - id: ch06-b33
          speaker: sinaubar
          text: Soon he called her to sit beside him. I could endure no more. I rushed at him, and we grappled for our lives. Gul came from behind, caught my feet, and threw me down. While her lover pinned me, she pulled my own knife from its sheath and handed it to him.
        - id: ch06-b34
          speaker: sinaubar
          text: I would have died then, but my dog seized the giant by the throat, dragged him down, and held him. I rose and killed the wretch. Four others were there. I killed three. The fourth escaped and now hides beneath the throne of Mihr-afruz, daughter of King Quimus.
        - id: ch06-b35
          speaker: sinaubar
          text: When the struggle was over, I brought Gul back with me to the palace. I remembered the danger I had crossed to win her, the seven days of fire, and the marriage her own people had granted us. I also remembered her hand closing around my feet and the knife she had offered to the man who meant to murder me. From that night until this one, I have given her the place her conduct earned. She is chained, beaten, and fed from the faithful animal's leavings, while the dog who saved my life sits on royal cloth, eats royal food, and receives the care once given to a queen. Now you understand every sight I placed before you. You know the woman is Gul, the Rose. You know I am Sinaubar, the Cypress. You know what the rose did to the cypress, and you know why the survivor beneath Mihr-afruz's throne can confirm it. Prince Almas, the answer you crossed the world to obtain is yours. Now keep your agreement with me.
        - id: ch06-b36
          speaker: almas
          text: I will keep it. May I take a little water to the roof and perform my final washing?
        - id: ch06-b37
          speaker: narrator
          text: Sinaubar consented. On the roof, Almas found a hidden corner, struck his fire steel, and burned one of the Simurgh's feathers. The great bird appeared at once, and the force of his arrival shook the city. He lifted Almas onto his back and soared toward the highest sky.
        - id: ch06-b38
          speaker: sinaubar
          text: That young man has been on the roof a long time. Go and bring him down.
        - id: ch06-b39
          speaker: narrator
          text: The servants found no one. Far away, the Simurgh could be seen carrying the prince through the sky. When Sinaubar heard, he thanked heaven that his hands would remain clean of Almas's blood.
    - id: ch07
      title: The Answer and the Homecoming
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: The Simurgh flew so high that the earth looked like an egg floating on an ocean. At last he dropped toward his own tree. The nestlings welcomed Almas, and the whole family treated him generously. He told them the story of the rose and the cypress. Then, carrying gifts the Simurgh had gathered from distant cities, he set out for the Castle of Clashing Swords.
        - id: ch07-b02
          speaker: narrator
          text: The lion king came out to meet him and welcomed the traveler whose call he had once answered in battle. Almas entered the castle he had left in the lion's care and found Taram-taq's daughter safe, with her household and possessions undisturbed. Her name, like Sinaubar's queen, was Gul. Almas kept the promise he had made before departing and married her according to the law. Then the castle became busy with preparations. Gul's goods were packed, her attendants gathered, and everything that would accompany her to a distant country was made ready. Almas, his new wife, and their company left the Place of Clashing Swords under the lion king's protection. Together they traveled back to the Place of Gifts, where the prince had first served the great lion and earned his friendship. They halted there for one night. At dawn Almas and the lion king said farewell as brothers. The lions turned toward their wild country, while the travelers took the road to Jamila's land.
        - id: ch07-b03
          speaker: narrator
          text: News of Almas's approach reached Jamila before the company arrived. She had mourned his absence without knowing whether the Caucasus had swallowed him, and now she went out with many beautiful attendants to welcome him. Their meeting was full of joy. He had returned alive, he had reached Waq, and the purpose she had helped him pursue was fulfilled. They entered the garden palace together. Jamila summoned the leading people of her country so that nothing about their union would be hidden or uncertain. In the presence of those nobles, she and Almas were lawfully married. They remained there for several days while she arranged the government she would leave behind. Jamila entrusted her affairs to her minister, gave the necessary orders for her absence, and began preparing her servants, treasure, and household for the journey to the prince's own country.
        - id: ch07-b04
          speaker: narrator
          text: Before leaving, Jamila restored every man whom her sister Latifa had changed into an animal. They blessed her and returned to their homes. Wicked Latifa remained alone in her garden-house. Then Jamila's servants, slaves, treasure, and goods were made ready, and the company traveled at an easy pace toward King Quimus's city.
        - id: ch07-b05
          speaker: narrator
          text: The long procession traveled at ease until it drew near the city of King Quimus. So many attendants, animals, carts, and loads of treasure could not approach unnoticed. Reports reached the king that a great company was moving toward his walls. He did not know whether it came in friendship or as an army, so he sent his minister out with an honorable escort. The minister was to welcome its leader properly, observe the strength of the visitors, and ask what had earned King Quimus the favor of such a visit. Almas received him without hostility. He made it clear that he had not come to lay waste to the city or begin a war. His quarrel concerned the deaths caused by Mihr-afruz and the answer she believed no one could bring her. He wrote the purpose in a message for her father.
        - id: ch07-b06
          speaker: almas
          text: King Quimus, I have come to end the crimes of your proud daughter. She has unjustly killed many kings and princes and hung their heads from your citadel. I am here to answer her riddle.
        - id: ch07-b07
          speaker: narrator
          text: Later he entered the city, struck the jeweled drums boldly, and was led before the king.
        - id: ch07-b08
          speaker: quimus
          text: Leave the riddle alone. No man who faced it has come away alive.
        - id: ch07-b09
          speaker: almas
          text: Answering it is the reason I came. I will not turn back.
        - id: ch07-b10
          speaker: narrator
          text: Mihr-afruz learned that another man had staked his head on her question, and that this one claimed to know the answer. At Almas's request, all the officers and nobles of the land assembled to hear him. King Quimus, Queen Gulrukh, Mihr-afruz, and the prince took their places before the crowded court.
        - id: ch07-b11
          speaker: almas
          text: Princess, what question do you ask your suitors?
        - id: ch07-b12
          speaker: mihr_afruz
          text: What did the rose do to the cypress?
        - id: ch07-b13
          speaker: narrator
          text: Almas smiled and faced the assembly.
        - id: ch07-b14
          speaker: almas
          text: You are experienced people who know the ways of the world. Before today, had any of you heard or seen the truth behind this question?
        - id: ch07-b15
          speakers: [courtier_1, courtier_2]
          ensemble: duo
          text: No. None of us has ever heard, seen, or known anything about it. It seems an empty fancy.
        - id: ch07-b16
          speaker: almas
          text: Then who told the princess? This so-called fancy has sent many innocent people to their deaths.
        - id: ch07-b17
          speaker: narrator
          text: The court recognized the force of his reasoning and showed its approval. Almas turned back to Mihr-afruz.
        - id: ch07-b18
          speaker: almas
          text: Tell us the truth. Who gave you this riddle? I know the story from beginning to end, but if I tell it alone, who can prove my answer is true? Bring forward the person who can confirm it.
        - id: ch07-b19
          speaker: narrator
          text: Mihr-afruz's heart sank. She feared her guarded secret was about to be shouted before the world.
        - id: ch07-b20
          speaker: mihr_afruz
          text: Explain what you mean.
        - id: ch07-b21
          speaker: almas
          text: I will explain when you bring out the man you hide beneath your throne.
        - id: ch07-b22
          speaker: quimus
          text: What are you saying? What man does my daughter hide beneath her throne?
          emotion: surprised
        - id: ch07-b23
          speaker: almas
          text: Send your people to look, and you will see.
        - id: ch07-b24
          speaker: narrator
          text: Messengers hurried to the garden-house. They returned with a man found in a secret room under Mihr-afruz's throne, richly dressed and surrounded by luxury. King Quimus was overwhelmed. But the princess had recovered her nerve. Perhaps, she thought, Almas knew only that her secret guest existed.
        - id: ch07-b25
          speaker: mihr_afruz
          text: You still have not answered my riddle.
        - id: ch07-b26
          speaker: almas
          text: Your shamelessness is astonishing. Even now, will you not repent?
        - id: ch07-b27
          speaker: narrator
          text: Then Almas told the entire court about King Sinaubar and Queen Gul, the Rose and the Cypress. He told of the well and the blind peris, the marriage won through fire, Gul's secret night rides, and her betrayal. When he reached the fight at her lover's house, he pointed to the hidden man.
        - id: ch07-b28
          speaker: almas
          text: You were there that night too.
        - id: ch07-b29
          speaker: gul_lover
          text: Yes. Everything happened exactly as you have said.
        - id: ch07-b30
          speaker: narrator
          text: The witness's answer removed the last possible doubt. Rejoicing broke out in the court and spread through the whole country. The question that had seemed impossible was answered at last. More important, no new king or prince would be led to the execution cloth because of it. King Quimus accepted Almas's victory and made over his daughter to him. Almas would not marry the woman who had ordered his brothers' deaths. He took Mihr-afruz as his captive instead. Then he turned to the proof of her cruelty that still hung above the city. He asked that every severed head be taken down from the battlements, treated with honor, and given a decent burial. The order was carried out. The remains of Tahmasp and Qamas, along with those of all the other dead suitors, were no longer left on display.
        - id: ch07-b31
          speaker: narrator
          text: "Almas received everything belonging to Mihr-afruz: her gold and silver, rich cloth and carpets, household treasures, horses and camels, servants and slaves. Then he returned to camp and sent for Dil-aram. She came with her property, gold, and jewels. When all was prepared, Almas set out for home with Jamila, Dil-aram, Gul the daughter of Taram-taq, captive Mihr-afruz, and the belongings of all four loaded onto countless horses, camels, and carts."
        - id: ch07-b32
          speaker: narrator
          text: Word of his coming raced ahead across his father's borders. The whole city came out to welcome him. King Saman-lalposh had wept so much for his sons that he had become blind. Almas kissed his feet and received his blessing. Then he opened a casket and took out a little of Solomon's eye medicine, a gift from the Simurgh that revealed the hidden things of earth. He rubbed it over his father's eyes. Light returned, and the king saw his son.
        - id: ch07-b33
          speaker: almas
          text: Father, this is the woman who killed your sons. Do with her as you choose.
        - id: ch07-b34
          speaker: narrator
          text: Saman thought his son might still care for Mihr-afruz's beauty.
        - id: ch07-b35
          speaker: saman
          text: You have already humbled her. Her fate is yours to decide.
        - id: ch07-b36
          speaker: narrator
          text: Almas ordered four swift, strong horses brought forward. Gul's former lover was tied between them, and each horse was driven toward a different quarter. He was torn apart like thin cloth.
        - id: ch07-b37
          speaker: narrator
          text: Mihr-afruz watched in horror, certain that the same death awaited her.
        - id: ch07-b38
          speaker: mihr_afruz
          text: Prince Almas, people value most what is hardest to win. Until now I have answered to no man, and I have never loved one. Those kings and princes died because that death was written for them. I did not choose their fate. From the beginning, it was also written that my fate would be joined with yours.
          emotion: fearful
        - id: ch07-b39
          speaker: narrator
          text: Almas listened to her argument about destiny. Because she was very beautiful, he too married her according to the law. Mihr-afruz and Jamila kept one household, while Dil-aram and Gul kept another. Prince Almas spent the rest of his life with all four in perfect happiness and pleasant companionship.
        - id: ch07-b40
          speaker: narrator
          text: And now you have heard what the rose did to the cypress.
        - id: ch07-b41
          speaker: narrator
          text: Finished, finished, finished!
