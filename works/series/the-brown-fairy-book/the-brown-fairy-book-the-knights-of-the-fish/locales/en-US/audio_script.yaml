  chapters:
    - id: ch01
      title: The Wonderful Fish
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was an old cobbler who worked from morning until night. He hardly stopped long enough to eat. Yet for all his labor, he could barely buy bread and cheese for himself and his wife. Day by day, they grew thinner.
        - id: ch01-b02
          speaker: narrator
          text: For a long time, each pretended not to be hungry. They told one another that a few blackberries from the hedges tasted much better than a good bowl of hot soup. At last, the cobbler could bear his hunger no longer. He threw down his shoemaker's last, borrowed a fishing rod from a neighbor, and went to the stream.
        - id: ch01-b03
          speaker: narrator
          text: He brought the same patience to fishing that he had brought to making shoes. From dawn until dark, he stood on the bank. All he caught was an eel and a few old shoes. Even a cobbler as clever as he was knew those shoes were beyond repair.
        - id: ch01-b04
          speaker: narrator
          text: Night after night passed in the same way, until his patience was gone. One evening, as he undressed, he made a grim promise to himself.
        - id: ch01-b05
          speaker: cobbler
          text: I will try once more. If I catch no fish tomorrow, I will go and hang myself.
          emotion: sad
        - id: ch01-b06
          speaker: narrator
          text: The next morning, he had been fishing for less than ten minutes when he pulled up the most beautiful fish he had ever seen. Then the fish spoke in a tiny, squeaking voice. The cobbler was so startled that he nearly tumbled into the river.
        - id: ch01-b07
          speaker: fish
          text: Take me home and cook me. Cut me into pieces, and season them with pepper and salt. Give two pieces to your wife, and bury two more in the garden.
        - id: ch01-b08
          speaker: narrator
          text: The cobbler could make no sense of this. But he was wiser than many people. When he did not understand something, he knew it might be best to obey. His children wanted to eat the whole fish and begged to know what he meant to do with the pieces he had saved. He only laughed and said it was none of their business.
        - id: ch01-b09
          speaker: narrator
          text: When the children were safely in bed, he slipped into the garden and buried the two pieces. Before long, two babies who looked exactly alike were lying in a cradle. Out in the garden stood two tall plants, each with a brilliant shield at its top.
    - id: ch02
      title: The Brothers Part
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The years went by, and the babies grew until they were nearly men. Both were weary of their quiet life at home. Everyone they met mistook one for the other, and the brothers longed for adventures of their own. They decided to set out in opposite directions.
        - id: ch02-b02
          speaker: narrator
          text: One fine morning, they left the cobbler's hut and walked together until the great road divided. There they embraced and said goodbye. They promised that if anything remarkable happened to either of them, he would come back to those crossroads and wait for his brother.
        - id: ch02-b03
          speaker: narrator
          text: The brother who followed the eastern road soon reached a large city. At every doorway, people stood wringing their hands and weeping. He stopped and looked around him.
        - id: ch02-b04
          speaker: east_knight
          text: What has happened here?
        - id: ch02-b05
          speaker: narrator
          text: A townsman answered in a faltering voice. Every year, he said, a beautiful girl was chosen by lot and given to a terrible fire-breathing dragon. The creature's mother was even worse than her son. This year, the lot had fallen upon their peerless princess.
        - id: ch02-b06
          speaker: east_knight
          text: Where is the princess now?
        - id: ch02-b07
          speaker: townsman
          text: She is waiting beneath a tree, one mile from here. She is waiting for the dragon.
        - id: ch02-b08
          speaker: narrator
          text: The Knight of the Fish waited for nothing more. He ran until he found the princess beneath the tree, soaked in tears and trembling from head to foot. At the sound of his sword, she turned and lifted the handkerchief from her eyes.
        - id: ch02-b09
          speaker: princess
          text: Run! Go while there is still time, before the monster sees you!
          emotion: fearful
        - id: ch02-b10
          speaker: narrator
          text: She truly wanted him to escape. Yet when he turned away, she felt more alone than ever. Only a few minutes passed before he returned at a furious gallop on a borrowed horse, with a huge mirror laid across its neck.
        - id: ch02-b11
          speaker: east_knight
          text: Good, I have come back in time.
        - id: ch02-b12
          speaker: narrator
          text: He dismounted with great care and leaned the mirror against the trunk of the tree.
        - id: ch02-b13
          speaker: east_knight
          text: Give me your veil, quickly.
        - id: ch02-b14
          speaker: narrator
          text: The princess unwound the veil from her head, and he draped it over the mirror.
        - id: ch02-b15
          speaker: east_knight
          text: As soon as the dragon comes close, pull off the veil and hide behind the mirror. Do not be afraid. I will be nearby.
    - id: ch03
      title: The Dragon and the Mirror
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The knight and his horse had barely hidden among some rocks when the beating of the dragon's wings filled the air. The dragon tossed his head with delight when he saw the princess. Slowly, he moved toward her as she stood just in front of the covered mirror.
        - id: ch03-b02
          speaker: narrator
          text: She kept her eyes fixed upon his face. Then she reached behind her, tore away the veil, and sprang behind the tree.
        - id: ch03-b03
          speaker: narrator
          text: The princess had obeyed the Knight of the Fish without knowing what the mirror would do. Perhaps the dragon's snaky locks would turn him to stone, as they had in an old tale her nurse once told. Perhaps a fiery spark would leap from the mirror's heart and strike him dead. But neither thing happened.
        - id: ch03-b04
          speaker: narrator
          text: Instead, the dragon stopped in rage and astonishment. Before him stood a monster every bit as large and strong as himself. He shook his mane, and the enemy shook its mane. He whipped his tail and rolled his red eyes. The other dragon matched every movement.
        - id: ch03-b05
          speaker: narrator
          text: He opened his jaws as wide as they would go and gave a dreadful roar. The dragon before him roared back. That was more than he could endure. With another roar that made the princess shake in her shoes, he hurled himself at his foe.
        - id: ch03-b06
          speaker: narrator
          text: The mirror shattered beneath him into a thousand pieces. Every fragment showed him part of his own body. The foolish dragon believed that he, too, had been smashed to bits.
        - id: ch03-b07
          speaker: narrator
          text: The Knight of the Fish had been waiting for that very moment. Before the dragon learned that he was not hurt at all, the knight drove his lance down the creature's throat. The dragon rolled dead upon the grass.
        - id: ch03-b08
          speaker: narrator
          text: Great cries of joy rang through the city when the young man rode back. The princess sat behind him, and the dead monster dragged after them on a cord. Everyone called for the king to give his daughter to the victor. And so he did.
        - id: ch03-b09
          speaker: narrator
          text: No one had ever seen such feasts, balls, and games. When the celebrations ended, the newly married couple went to the palace prepared for them. It was so enormous that the road around it ran for three miles.
    - id: ch04
      title: The Castle of Albatroz
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: On the first rainy day after the wedding, the bridegroom asked his wife to show him every room in their palace. The tour took so long that the sun was shining again by the time they reached the roof and looked across the country.
        - id: ch04-b02
          speaker: east_knight
          text: What is that castle in the distance? It looks as though it is built from black marble.
        - id: ch04-b03
          speaker: princess
          text: That is the castle of Albatroz. It is enchanted. Everyone who has tried to enter has vanished and never returned.
        - id: ch04-b04
          speaker: narrator
          text: Her husband made no reply and soon changed the subject. But the following morning, he ordered his horse, took his spear, called his bloodhound, and rode toward the castle.
        - id: ch04-b05
          speaker: narrator
          text: A man needed courage even to approach Albatroz. One look at it made his hair rise. It was dark as a stormy night and silent as a grave. But the Knight of the Fish knew no fear and had never turned away from an enemy. He drew out his horn and blew a blast.
        - id: ch04-b06
          speaker: narrator
          text: The call woke every sleeping echo in the castle. The sound came back loud, then soft, near, then far away. Still, no one appeared.
        - id: ch04-b07
          speaker: east_knight
          text: Is anyone inside? Will anyone offer a knight shelter? Is there no governor, no squire, not even a page?
        - id: ch04-b08
          speakers: [echo_1, echo_2, echo_3]
          ensemble: chorus
          text: Not even a page!
        - id: ch04-b09
          speaker: narrator
          text: The knight ignored the echoes and struck the gate a furious blow. A little grating opened. Through it came the tip of an enormous nose, and behind that nose was the ugliest old woman anyone had ever seen.
        - id: ch04-b10
          speaker: berberisca
          text: What is it you want?
        - id: ch04-b11
          speaker: east_knight
          text: I want to come in. May I rest here tonight? Give me a plain answer, yes or no.
        - id: ch04-b12
          speakers: [echo_1, echo_2, echo_3]
          ensemble: chorus
          text: No! No! No!
        - id: ch04-b13
          speaker: narrator
          text: The fierce sun and the long wait had made the knight hot and angry. He raised his visor. When the old woman saw how handsome he was, she began to fumble with the lock.
        - id: ch04-b14
          speaker: berberisca
          text: Come inside. Come in. Such a fine gentleman will surely do us no harm.
        - id: ch04-b15
          speakers: [echo_1, echo_2, echo_3]
          ensemble: chorus
          text: Do us no harm!
        - id: ch04-b16
          speaker: narrator
          text: Again, the knight paid no attention to the voices.
        - id: ch04-b17
          speaker: east_knight
          text: Then lead the way, old dame.
        - id: ch04-b18
          speaker: berberisca
          text: You will call me Lady Berberisca. This castle belongs to me, and I welcome you into it. You shall stay here, live with me, and become my husband.
        - id: ch04-b19
          speaker: narrator
          text: The knight was so astonished that he dropped his spear.
        - id: ch04-b20
          speaker: east_knight
          text: Marry you? You must be a hundred years old! You are mad. I only want to look through the castle, and then I mean to leave.
          emotion: surprised
        - id: ch04-b21
          speaker: narrator
          text: Mocking laughter floated back from the echoes. Lady Berberisca took no notice of it. She simply told the knight to follow her.
    - id: ch05
      title: The Trap Below the Stairs
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Old as she was, Lady Berberisca never seemed to tire. She led the knight into every room, even the smallest. Each one held strange and curious things he had never seen before.
        - id: ch05-b02
          speaker: narrator
          text: At last, they reached a stone staircase. It was so dark that the knight could not have seen his own hand before his face.
        - id: ch05-b03
          speaker: berberisca
          text: I saved my greatest treasure until the end. Let me walk ahead of you. These steps are steep, and you could easily break your leg.
        - id: ch05-b04
          speaker: narrator
          text: Down she went, calling back to him now and then through the darkness. He could not see when she slipped sideways into a hidden recess. His next step landed on a trapdoor. It fell open beneath him, and down he plunged, just as many good knights had plunged before. His voice joined their voices among the echoes.
        - id: ch05-b05
          speaker: berberisca
          text: So you would not marry me! Ha, ha! Ha, ha!
          emotion: happy
    - id: ch06
      title: The Brother Returns
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Meanwhile, the other brother had wandered far and wide. In time, his road brought him to the same great city where the first Knight of the Fish had found so many adventures.
        - id: ch06-b02
          speaker: narrator
          text: As he walked through the streets, the guards lined up and saluted him. Drummers struck up the royal march. He stared at them in amazement. Then servants in splendid clothes came running to meet him. They said the princess was certain that something dreadful had happened to him, and she had wept until she made herself ill.
        - id: ch06-b03
          speaker: narrator
          text: At last, the young man understood. Once again, someone had mistaken him for his twin.
        - id: ch06-b04
          speaker: west_knight
          text: I had better keep quiet. If I do, perhaps I can help my brother.
        - id: ch06-b05
          speaker: narrator
          text: He allowed the servants to carry him to the palace in triumph. The princess rushed forward and threw her arms around him.
        - id: ch06-b06
          speaker: princess
          text: Then you really did go to the castle?
        - id: ch06-b07
          speaker: west_knight
          text: Yes, I went there.
        - id: ch06-b08
          speaker: princess
          text: What did you find inside?
        - id: ch06-b09
          speaker: west_knight
          text: I cannot tell you anything about it until I have gone there once again.
        - id: ch06-b10
          speaker: princess
          text: Must you go back to that dreadful place? No other man has ever returned from it.
        - id: ch06-b11
          speaker: west_knight
          text: I must go.
        - id: ch06-b12
          speaker: narrator
          text: The princess was a wise woman. She did not try to question him any further.
        - id: ch06-b13
          speaker: princess
          text: Then go to bed now. You must be exhausted.
        - id: ch06-b14
          speaker: narrator
          text: But the knight shook his head.
        - id: ch06-b15
          speaker: west_knight
          text: I have sworn that I will not lie in a bed while my work at the castle is still unfinished.
        - id: ch06-b16
          speaker: narrator
          text: The princess sighed and said nothing more. Early the next morning, the young man set out for Albatroz. By then he felt sure that some terrible fate had overtaken his brother.
        - id: ch06-b17
          speaker: narrator
          text: He sounded his horn before the castle. Soon the old woman's long nose poked through the grating. The moment she saw his face, she nearly fainted. She thought the young man whose bones lay in her dungeon had returned as a ghost.
        - id: ch06-b18
          speaker: west_knight
          text: Lady older than all the ages, did you shelter a young knight here not long ago?
        - id: ch06-b19
          speakers: [echo_1, echo_2, echo_3]
          ensemble: chorus
          text: Not long ago!
        - id: ch06-b20
          speaker: west_knight
          text: Tell me what cruelty you have done to him.
        - id: ch06-b21
          speakers: [echo_1, echo_2, echo_3]
          ensemble: chorus
          text: Done to him!
        - id: ch06-b22
          speaker: narrator
          text: Lady Berberisca did not wait to hear another word. She turned to run, but the knight's sword pierced her body.
        - id: ch06-b23
          speaker: west_knight
          text: Where is my brother, you cruel hag?
          emotion: angry
        - id: ch06-b24
          speaker: berberisca
          text: I will tell you. But I can feel myself dying, so I will keep that secret until you have brought me back to life.
        - id: ch06-b25
          speaker: narrator
          text: The knight laughed at her with scorn.
        - id: ch06-b26
          speaker: west_knight
          text: And how do you expect me to perform a miracle like that?
        - id: ch06-b27
          speaker: berberisca
          text: It is simple. Pick flowers from the everlasting plant in the garden, and bring some dragon's blood. Crush them together and boil them in a great tub of water. Then place me in the water.
    - id: ch07
      title: The Water of Life
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: The knight followed the witch's instructions. He gathered the everlasting flowers and the dragon's blood, crushed them, and boiled them together in a huge tub. When he put Lady Berberisca into the water, she came out whole again. She was uglier than ever, but alive.
        - id: ch07-b02
          speaker: narrator
          text: Now she told him what had happened to his brother. He went down into the dungeon and carried up his brother's body. Around it lay the bodies of all the other victims who had fallen through the witch's trap. He brought those up as well.
        - id: ch07-b03
          speaker: narrator
          text: One after another, they were washed in the magic water. Life and strength returned to every one of them.
        - id: ch07-b04
          speaker: narrator
          text: In another cavern, the knight discovered the bodies of the girls who had been sacrificed to the dragon. He carried them out, too, and restored them all to life.
        - id: ch07-b05
          speaker: narrator
          text: As for Lady Berberisca, rage consumed her when she saw every victim escape. In the end, that rage killed her. The instant she drew her final breath, the castle of Albatroz crashed into ruins with a tremendous roar.
