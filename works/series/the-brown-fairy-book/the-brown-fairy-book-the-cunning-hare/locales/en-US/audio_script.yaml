  chapters:
    - id: ch01
      title: A Net Full of Fish
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Far across the seas lay a bitterly cold country, where ice and snow covered the ground for months at a time. A little hare lived there with his grandmother, for both his parents were dead. He was too young to work, and she was too old. They were very poor, and often went hungry.
        - id: ch01-b02
          speaker: narrator
          text: One day the hare was hungrier than ever. The thaw had come, and the river ran freely again, so he asked if he might catch a fish for their breakfast. His grandmother laughed. What fish would let a hare catch it, especially one so young? Still, her rheumatism was bad, and she could find no food herself. Perhaps, she thought, he might find something even if he caught no fish.
        - id: ch01-b03
          speaker: narrator
          text: She showed him where the net lay and explained how to stretch it across the river. He started off feeling quite grown-up, but she suddenly called him back.
        - id: ch01-b04
          speaker: grandmother
          text: What good will this do, my boy? Even if you catch a fish, we have no fire to cook it.
        - id: ch01-b05
          speaker: hare
          text: Let me catch the fish first. Then I'll soon get you a fire!
        - id: ch01-b06
          speaker: narrator
          text: He answered cheerfully. He was young and knew nothing of how hard it was to make a fire. Dragging the net through bushes and across fields took a long time. At last he reached a river pool that was said to swarm with fish, and set the net just as his grandmother had taught him.
        - id: ch01-b07
          speaker: narrator
          text: He was so excited that he barely slept. At the first streak of dawn, he raced back to the river. His heart beat as if dogs were chasing him. He almost feared to look at the net. What if there was not even one fish? Hunger made him sick with worry.
        - id: ch01-b08
          speaker: narrator
          text: But every mesh held a fine fat fish. The net was so heavy that he could lift only one corner. He threw some fish back, then buried more in a hole beneath a stone where he could find them later. He rolled the rest inside the net, heaved it onto his back, and carried it home. The load made his back ache, and he was glad to drop it outside the hut. Then he rushed in joyfully to tell his grandmother.
        - id: ch01-b09
          speaker: hare
          text: Clean them quickly! I'm going to the tents across the water.
        - id: ch01-b10
          speaker: narrator
          text: His grandmother stared at him in horror. Others had tried to steal fire, and very few had returned alive. Yet he had caught far more fish than she ever expected. Perhaps, she thought, some magic was at work in him. So she did not stop him.
    - id: ch02
      title: A Bridge of Whales
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Once the fish were out, the hare fetched the net he had spread to dry and folded it very small. Then he ran to the river, hoping to find a narrow place he could leap across. He soon saw that even the finest jumper in the world could not clear that river.
        - id: ch02-b02
          speaker: narrator
          text: He stood wondering what to do. Then he remembered part of a spell he had once heard a wizard speak while drinking from the river. The hare repeated the words as well as he could and waited.
        - id: ch02-b03
          speaker: narrator
          text: Five minutes later came a great grunting and puffing. Columns of water shot into the air, though the hare could not see what caused them. Then fifteen enormous whales rounded the bend. He ordered them to line up head to tail like stepping-stones. Leaping from whale to whale, he crossed to the other bank.
        - id: ch02-b04
          speaker: narrator
          text: As soon as he landed, he told the whales he needed them no longer. Then he sat on the sand to rest.
        - id: ch02-b05
          speaker: narrator
          text: Some children playing nearby happened to see him. One boy crept up from behind and grabbed both his ears. The hare had been watching the whales sail away. He jumped violently and fought to escape, but the boy held tight and ran home as fast as he could.
    - id: ch03
      title: The Stolen Fire
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The boy told the people at home how he had caught the hare. At once, the old woman gave an order.
        - id: ch03-b02
          speaker: old_woman
          text: Put it in the basket. Once the pot boils, we'll hang the basket over the fire and drop it in!
        - id: ch03-b03
          speaker: old_man
          text: We should kill it first.
        - id: ch03-b04
          speaker: narrator
          text: The hare listened in terror. All the while, he secretly searched for a hole he might escape through. There was one at the very top of the tent. He began to tremble as though fear alone shook him, and let one end of his net slowly unroll.
        - id: ch03-b05
          speaker: hare
          text: If only a spark from the fire would land on my net.
          emotion: fearful
        - id: ch03-b06
          speaker: narrator
          text: The next moment, a great log toppled into the middle of the tent. Everyone sprang backward. Sparks flew everywhere, and one landed on the net, kindling a small flame.
        - id: ch03-b07
          speaker: narrator
          text: In an instant, the hare leaped through the hole and raced toward the river. Men, women, and children chased after him. There was no time to summon the whales. He gripped the burning net in his mouth and wished himself across the water. Then he sprang high into the air and landed safely on the far bank.
        - id: ch03-b08
          speaker: narrator
          text: He turned to make sure no one could follow. Then he trotted happily home to his grandmother.
    - id: ch04
      title: Wiser Than His Grandmother
      blocks:
        - id: ch04-b01
          speaker: hare
          text: Didn't I tell you I'd bring back fire?
        - id: ch04-b02
          speaker: narrator
          text: He held up the net, which was now burning brightly.
        - id: ch04-b03
          speaker: grandmother
          text: But how did you get across the river?
        - id: ch04-b04
          speaker: hare
          text: Oh, I simply jumped!
        - id: ch04-b05
          speaker: narrator
          text: His grandmother asked nothing more, for she could see that the little hare was wiser than she was.
