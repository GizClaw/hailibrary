audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 清楚从容，像在为听众介绍一本古老的童话集
        timbre: 温暖明净
        pace: 舒缓
        pitch: 中音
    little_hare:
      display_name: 小野兔
      tts: {delivery: 天真机敏，遇险时紧张却不失灵气, timbre: 清亮稚嫩, pace: 轻快, pitch: 中高音}
    grandmother:
      display_name: 兔奶奶
      tts: {delivery: 年迈慈爱，说话朴实而谨慎, timbre: 温厚苍老, pace: 舒缓, pitch: 中低音}
    old_woman:
      display_name: 老妇人
      tts: {delivery: 干脆直接，语气冷硬, timbre: 粗哑苍老, pace: 适中, pitch: 中低音}
    old_man:
      display_name: 老头
      tts: {delivery: 简短冷漠，不带迟疑, timbre: 低沉苍老, pace: 缓慢, pitch: 低音}
  chapters:
    - id: ch01
      title: 祖孙俩的早饭
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            大海遥远的另一边，有一个冷得刺骨的国度。一年中有好几个月，冰雪一直盖着大地。那里住着一只小野兔。他的父母早已去世，是奶奶把他养大的。一个年纪太小，一个年纪太老，谁也干不了活。祖孙俩穷得厉害，常常连饭都吃不饱。
        - id: ch01-b02
          speaker: narrator
          text: >-
            有一天，小野兔饿得实在受不了。天气已经回暖，河里的冰也化了，水又流动起来。他便想去河边捉条鱼，给自己和奶奶当早饭。奶奶听完笑了。哪有鱼会让一只野兔捉住呢，何况他还这么小。可是奶奶的风湿病很重，自己找不到吃的，只能让他试试看。
        - id: ch01-b03
          speaker: narrator
          text: >-
            奶奶心想，就算捉不着鱼，他也可能找到点别的。于是，她告诉兔孙渔网放在哪里，又教他怎样把网横在河里。小野兔顿时觉得自己已经是个大人了。他刚要动身，奶奶又叫住他。
        - id: ch01-b04
          speaker: grandmother
          text: >-
            我的孩子，你就算去了，又能怎么样呢？哪怕真捉到一条鱼，咱们没有火，也没法把鱼煮熟呀。
        - id: ch01-b05
          speaker: little_hare
          text: 您等着吧。鱼由我来捉，火我也会很快弄回来。
        - id: ch01-b06
          speaker: narrator
          text: >-
            小野兔答得很快活。他年纪还小，根本不知道弄到火有多难。他拖着渔网，穿过灌木和田野，走了好一阵，才来到河里的一处水潭。听说那里到处都是鱼。他照着奶奶的话，把网下好了。
    - id: ch02
      title: 满网的鱼
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            那一夜，小野兔兴奋得几乎没有睡着。天边才透出一点晨光，他就拼命跑向河边。心跳得飞快，就像后面有猎狗在追。他又怕失望，几乎不敢看那张网。里面会不会连一条鱼也没有？想到这里，肚子饿得直绞，他也怕得一阵恶心。
        - id: ch02-b02
          speaker: narrator
          text: >-
            可他根本不用害怕。每个网眼里都挂着一条肥鱼！整张网沉得不得了，他只能提起一个角。他把一部分鱼放回水里，又把一些藏进石头下面的洞里，免得以后找不到。剩下的鱼还裹在网中，由他背回了家。
        - id: ch02-b03
          speaker: narrator
          text: >-
            这一大包东西压得他背都疼了。他总算挨到小屋外，赶紧卸下重担，欢欢喜喜地冲进去告诉奶奶。
        - id: ch02-b04
          speaker: little_hare
          text: 快把鱼收拾好！我现在就去河对岸，找住在帐篷里的那些人。
        - id: ch02-b05
          speaker: narrator
          text: >-
            奶奶吓得瞪着他。以前也有人去偷火，可几乎没有谁能活着回来。不过，小野兔竟然捉到了这么多鱼，实在出乎她的意料。也许兔孙有某种她不知道的法力。想到这里，她便没有阻拦。
    - id: ch03
      title: 鲸鱼搭成的路
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            鱼全取出来以后，小野兔拿起晾干的渔网，把它叠得很小，随后跑到河边。他想找一处窄些的水面跳过去，可河实在太宽了。就算世上最会跳的人来了，也不可能跳到对岸。
        - id: ch03-b02
          speaker: narrator
          text: >-
            他站在那里想办法，忽然记起了几句咒语。从前有个巫师来河边喝水，曾经念过它们。小野兔尽力照着记忆念了一遍，然后等着。不到五分钟，河里便响起沉重的哼声和喷气声，一道道水柱也冲上半空。他却看不见水下是什么。
        - id: ch03-b03
          speaker: narrator
          text: >-
            很快，十五条巨鲸绕过河湾游来了。小野兔叫它们一条接一条，头尾相连，排成水上的踏脚石。他从一条鲸鱼跳到下一条，就这样一直跳上了对岸。到了以后，他让鲸鱼们离开，自己坐在沙地上休息。
        - id: ch03-b04
          speaker: narrator
          text: >-
            可附近正有几个孩子玩耍，他们看见了小野兔。一个男孩从背后悄悄靠近，猛地抓紧他的两只耳朵。小野兔一直望着鲸鱼顺流游远，被吓得狠狠一跳，连忙挣扎。男孩就是不松手，提着他飞快地跑回了家。
    - id: ch04
      title: 帐篷里的一颗火星
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 男孩一回家，就把事情讲给帐篷里的老人听。老妇人立刻吩咐他。
        - id: ch04-b02
          speaker: old_woman
          text: >-
            把这只野兔扔进锅里。不，先放进那只篮子。等锅里的水烧开，咱们就把它架到火上。
        - id: ch04-b03
          speaker: old_man
          text: 先把它杀掉更好。
        - id: ch04-b04
          speaker: narrator
          text: >-
            小野兔听得怕极了，可他还在暗暗寻找逃走的洞口。只要有机会，他就要逃出去。真的有个洞，就在帐篷顶上。他装作吓得发抖，身子一颤，悄悄放松了渔网的一角。
        - id: ch04-b05
          speaker: little_hare
          text: 要是有一颗火星能落在我的网上就好了。
        - id: ch04-b06
          speaker: narrator
          text: >-
            他才低声说完，一根燃烧的大木柴就朝前倒下，落在帐篷中央。所有人都往后一跳。火星四处乱飞，其中一颗落上渔网，点起了一小簇火苗。
        - id: ch04-b07
          speaker: narrator
          text: >-
            小野兔立刻蹿出帐篷顶上的洞，直奔河边。男人、女人和孩子全都追在后面。现在再叫鲸鱼回来已经来不及了。他用嘴紧紧衔住渔网，许愿让自己越过河去。
        - id: ch04-b08
          speaker: narrator
          text: >-
            他纵身跳到高高的空中，稳稳落在河对岸。小野兔回头看了看，确定没有人还能追上自己，这才快活地朝家里跑去。
    - id: ch05
      title: 小野兔带回了火
      blocks:
        - id: ch05-b01
          speaker: little_hare
          text: >-
            您看，我不是早就说过，会把火带回来吗？
        - id: ch05-b02
          speaker: narrator
          text: 小野兔说着，举起了渔网。网上的火已经烧得很旺。
        - id: ch05-b03
          speaker: grandmother
          text: 可是，这么宽的河，你到底是怎么过来的？
        - id: ch05-b04
          speaker: little_hare
          text: 哦，我就是用力一跳，这不就过来了！
        - id: ch05-b05
          speaker: narrator
          text: >-
            从那以后，奶奶再也没有问下去。她已经看出来，自己的兔孙比她还要聪明。
        - id: ch05-b06
          speaker: narrator
          text: 本故事选自《印第安民间故事》，由民族学局收录。
