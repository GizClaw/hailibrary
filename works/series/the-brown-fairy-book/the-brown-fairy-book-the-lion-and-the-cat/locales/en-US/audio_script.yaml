audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, grave, and attentive to wonder
        timbre: clear and resonant
        pace: measured
        pitch: medium
    lion:
      display_name: Lion
      tts:
        delivery: powerful, impulsive, and not quite as clever as he believes
        timbre: deep and commanding
        pace: measured
        pitch: low
    wild_cat:
      display_name: Wild Cat
      tts:
        delivery: quick-witted, proud, and quietly determined
        timbre: young and clear
        pace: lively
        pitch: medium-high
    elder_girl:
      display_name: Elder Girl
      tts:
        delivery: practical, curious, and warm
        timbre: young and clear
        pace: measured
        pitch: medium-high
    younger_girl:
      display_name: Younger Girl
