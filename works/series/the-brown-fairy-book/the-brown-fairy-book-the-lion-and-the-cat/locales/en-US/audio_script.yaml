  chapters:
    - id: ch01
      title: The Golden Ball
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long ago, far away on the other side of the world, a lion lived with his younger brother, the wild cat. The brothers loved each other so much that they shared one hut. The lion was much larger and stronger than his brother. In fact, no other beast in the forest could match his size or strength. He could leap farther and run faster than all the rest, too. Whenever strength and speed could win him a meal, he never went hungry. But when cunning was needed, the grizzly bear and the serpent could outwit him, so he had to ask the wild cat for help.
        - id: ch01-b02
          speaker: narrator
          text: The young cat owned a beautiful golden ball. It shone so fiercely that anyone who looked at it needed a piece of smoked glass. He kept it hidden in the thick fur muff around his neck. A huge old animal, long since dead, had given it to him when he was little more than a baby. He was told never to give it away, because no harm could reach him while it was his.
        - id: ch01-b03
          speaker: narrator
          text: Most of the time, the cat did not need to use the ball at all. The lion loved hunting and could kill all the food the two brothers needed. Every now and then, though, the cat's life would have been in danger without the golden ball.
        - id: ch01-b04
          speaker: narrator
          text: One day the brothers set out at daybreak. Because the cat could not run nearly as fast, he started well ahead. At least, he thought he was well ahead. A few bounds and springs brought the lion right beside him.
        - id: ch01-b05
          speaker: lion
          text: There is a bear sitting in that tree. He is waiting for us to pass so he can drop onto my back.
        - id: ch01-b06
          speaker: wild_cat
          text: You are so big that he cannot see me behind you. Bear, die!
        - id: ch01-b07
          speaker: narrator
          text: The cat touched the ball as he spoke. The bear fell dead from the tree and rolled to the ground in front of them.
        - id: ch01-b08
          speaker: narrator
          text: They trotted on without trouble for some time. At the edge of the forest, they came to a strip of long grass. Just before they crossed it, the lion's sharp ears caught a faint rustle. He stopped at once. Snakes frightened him much more than bears did.
        - id: ch01-b09
          speaker: lion
          text: That is a snake!
          emotion: fearful
        - id: ch01-b10
          speaker: wild_cat
          text: It is all right. Snake, die!
        - id: ch01-b11
          speaker: narrator
          text: The snake died. The brothers skinned it and folded the skin into a tiny parcel. The cat tucked it into his mane, because a snake skin can do wonderful things for anyone lucky enough to own one.
        - id: ch01-b12
          speaker: narrator
          text: They still had no dinner. Snake meat was unpleasant, and the lion would not eat bear. Perhaps he never quite believed a bear was dead. It might spring up the moment he came close. Almost everyone fears something, and bears and serpents were the only creatures that made the lion's heart tremble.
        - id: ch01-b13
          speaker: narrator
          text: The brothers went on until they reached a hillside where several fine deer were grazing.
        - id: ch01-b14
          speaker: wild_cat
          text: Kill one deer for your dinner, but bring me the other one alive. I want it.
        - id: ch01-b15
          speaker: narrator
          text: The lion sprang at the deer with a roar. They bounded away, and soon all three had vanished. The cat waited a long time. When his brother still did not return, he went home alone.
    - id: ch02
      title: The Brothers Quarrel
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Darkness had fallen by the time the lion came home. His younger brother sat curled in a corner, waiting for him.
        - id: ch02-b02
          speaker: wild_cat
          text: Did you catch my deer?
        - id: ch02-b03
          speaker: lion
          text: Well, no. I did not catch up with them until we had run halfway across the world and left the wind far behind. Just think how hard it would have been to drag one all the way home. So I ate them both.
        - id: ch02-b04
          speaker: narrator
          text: The cat said nothing, but at that moment he did not feel any love for his big brother. He had spent a long time thinking about that deer. He meant to climb onto its back and ride it like a horse. Then he could visit all the wonderful places the lion told him about whenever he was in a good temper.
        - id: ch02-b05
          speaker: narrator
          text: The more the cat thought about it, the sulkier he became. In the morning, the lion said it was time to hunt again.
        - id: ch02-b06
          speaker: wild_cat
          text: You can kill the bears and snakes by yourself. I have a headache, so I would rather stay home.
        - id: ch02-b07
          speaker: narrator
          text: The little cat knew the lion would never go without him and his golden ball. He was far too afraid of meeting a bear or a snake.
        - id: ch02-b08
          speaker: narrator
          text: Their quarrel dragged on. For many days, neither brother spoke to the other. They found very little to eat, and hunger made them even more cross. At last the lion decided that if he could only steal the magic ball, he could kill bears and snakes for himself. Then the cat could sulk as much as he liked, and it would no longer matter to the lion.
        - id: ch02-b09
          speaker: narrator
          text: But how could the stealing be done? The cat kept the ball hanging around his neck both day and night. He was such a light sleeper that taking it while he slept was useless to think about. No, the lion would have to persuade his brother to lend it willingly. After several days, he finally thought of a plan that he believed would work, though clever plans did not come easily to him.
        - id: ch02-b10
          speaker: narrator
          text: One afternoon, rain poured down in torrents. No matter how sharp a hunter's eyes or nose might be, not one bird or beast could be found among the bushes.
        - id: ch02-b11
          speaker: lion
          text: Oh, it is so dull in here. I am dreadfully bored. Why don't we play catch with your golden ball?
        - id: ch02-b12
          speaker: wild_cat
          text: I do not want to play catch. It does not amuse me.
        - id: ch02-b13
          speaker: narrator
          text: The cat was still as cross as ever. Even now, no cat forgets an injury.
        - id: ch02-b14
          speaker: lion
          text: Then lend me the ball for a little while, and I will play alone.
        - id: ch02-b15
          speaker: narrator
          text: The lion held out one paw.
        - id: ch02-b16
          speaker: wild_cat
          text: You cannot play outside in this rain. If you try, you will lose it in the bushes.
        - id: ch02-b17
          speaker: lion
          text: I will stay inside, and I will not lose it. Do not be so unkind.
        - id: ch02-b18
          speaker: narrator
          text: Very unwillingly, the cat untied the string and tossed the golden ball into the lion's lap. Then he settled down to sleep again.
        - id: ch02-b19
          speaker: narrator
          text: For a long while, the lion happily tossed the ball up and down inside the hut. However soundly the cat appeared to be sleeping, the lion felt sure that his younger brother had one eye open. So he moved slowly. Little by little, he edged closer to the doorway. At last he gave the ball such a toss that it sailed high into the air, and he could no longer see where it went.
        - id: ch02-b20
          speaker: lion
          text: Oh, how foolish of me! Let us look for it at once. It cannot have fallen far.
        - id: ch02-b21
          speaker: narrator
          text: The cat sprang up in anger. They searched that day, the next day, and the day after that. They never found the ball, because it never came down.
    - id: ch03
      title: The Ball in the Tree
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: After losing his ball, the cat refused to live with the lion any longer. He left their hut and wandered north, always hoping that somewhere he would meet with it again. Months passed, and then years passed. Though he traveled for hundreds of miles, he never saw the smallest trace of the golden ball.
        - id: ch03-b02
          speaker: narrator
          text: At last, when he was growing old, he reached a place unlike any he had known. A great river rolled to the foot of high mountains. The riverbank was wet and marshy. Since no cat likes wet paws, he climbed a tree that rose high over the water. There he sadly remembered the lost ball that could have helped him escape this dreadful place.
        - id: ch03-b03
          speaker: narrator
          text: Suddenly he saw a beautiful ball dangling from a branch of that very tree. It looked exactly like his own. He longed to reach it, but he could not tell whether the branch would bear his weight. After everything he had done, it would be foolish to fall into the water and drown. Still, creeping out a little way could do no harm. If the branch felt unsafe, he could somehow get back.
        - id: ch03-b04
          speaker: narrator
          text: He stretched flat along the branch and wriggled forward with care. To his delight, the wood felt thick and strong. One more movement would bring the string within reach of his paw. Then the branch cracked loudly, and the cat hurried backward the way he had come.
        - id: ch03-b05
          speaker: narrator
          text: Once cats decide to do something, they usually do it. The wild cat looked for another way to reach his ball. There was one. It was harder, but much safer. A thicker bough grew above the branch where the ball hung. He knew that one would bear his weight.
        - id: ch03-b06
          speaker: narrator
          text: If he held tightly to the upper bough with all four paws, he could just reach the ball with his tail. He began whisking it back and forth. Little by little, the movement would loosen the string until the ball dropped to the ground. It might take a long time, but the lion's little brother was patient, as most cats are.
        - id: ch03-b07
          speaker: narrator
          text: Everything happened just as he intended. The ball fell to the ground. The cat raced down the tree like lightning, picked it up, and tucked it into the snake-skin pouch around his neck.
    - id: ch04
      title: Across the Big Water
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The cat began leaping from place to place along the shore of the Big Water. He searched for a boat, or even a floating log that could carry him across. There was nothing. On the far bank, he could see two girls cooking. He shouted to them at the top of his voice, but they were too far away to hear what he was saying.
        - id: ch04-b02
          speaker: narrator
          text: Then something worse happened. The ball slipped from its snake-skin pouch and fell straight into the river.
        - id: ch04-b03
          speaker: narrator
          text: Balls often tumble into rivers. Usually they sink to the bottom and stay there, or bob on the surface near the place where they fell. This ball did neither. It traveled straight across the river. One of the girls saw it when she bent to fill her pail with water.
        - id: ch04-b04
          speaker: elder_girl
          text: Oh, what a beautiful ball!
          emotion: surprised
        - id: ch04-b05
          speaker: narrator
          text: She tried to catch the ball in her pail. Each time she lowered the pail toward it, the ball bobbed just beyond her reach. She tried again and again, but it kept slipping away across the water.
        - id: ch04-b06
          speaker: elder_girl
          text: Come and help me!
        - id: ch04-b07
          speaker: narrator
          text: Her sister came to help. It took them a long while, but at last the two girls got the ball safely inside the pail. They were delighted with their lovely new toy. Neither wanted to put it down, so for the rest of the day, one sister or the other always held it in her hand.
        - id: ch04-b08
          speaker: narrator
          text: When bedtime came, the girls still did not want to let the ball go. They took a long while to decide where it would be safest for the night. At last, they locked it in a cupboard in the corner of their room. There was not a single hole anywhere, so the ball could not possibly escape. Only then did the sisters go to sleep.
    - id: ch05
      title: The Prince in the Cupboard
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The moment the girls woke, they ran to the cupboard and unlocked it. When the door swung open, both of them started back. The golden ball was gone. A handsome young man stood in its place.
        - id: ch05-b02
          speaker: prince
          text: Ladies, how can I ever thank you? Long ago, a wicked fairy enchanted me. I was condemned to remain a ball until two maidens found me and took me into their own home.
        - id: ch05-b03
          speaker: prince
          text: But where could I ever meet them? For hundreds of years, I lived deep in the forest where only wild beasts came. Then the lion threw me into the sky, and at last I fell to earth near this river.
        - id: ch05-b04
          speaker: prince
          text: I knew that people would come to a river sooner or later. So I hung myself from a tree and watched and waited. For a moment, I lost hope when my old master, the wild cat, found me again. Then I saw him heading toward the bank across from you, and my hopes returned.
        - id: ch05-b05
          speaker: prince
          text: That was my chance, and I took it. If you ever need my help, climb to the top of that high mountain. On its north side, you will find an iron door. Knock three times, and I will come to you.
        - id: ch05-b06
          speaker: narrator
          text: The prince bowed low and vanished. The two maidens wept, because in a single moment they had lost both the golden ball and the prince.
