audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 温暖庄重，以从容而清晰的语气讲述古老命运故事, timbre: 清澈浑厚, pace: 舒缓, pitch: 中音}
    lion:
      display_name: 狮子
      tts: {delivery: 雄壮直率，得意时显得憨拙，畏惧时藏不住慌张, timbre: 粗厚有力, pace: 适中, pitch: 低音}
    wild_cat:
      display_name: 野猫
      tts: {delivery: 年轻机敏，语气干脆，受伤后带着倔强和冷淡, timbre: 清亮灵活, pace: 适中, pitch: 中高音}
    maiden_1:
      display_name: 姐姐
      tts: {delivery: 活泼好奇，遇见奇事时惊喜坦率, timbre: 明亮年轻, pace: 适中, pitch: 中高音}
    prince:
      display_name: 王子
      tts: {delivery: 彬彬有礼，讲述漫长遭遇时真诚而沉静, timbre: 清朗温润, pace: 稍慢, pitch: 中音}
  chapters:
    - id: ch01
      title: 兄弟出猎
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            很久以前，在世界遥远的另一端，狮子和弟弟野猫住在同一间茅屋里。兄弟俩十分亲密，有什么都会一起分享。狮子比弟弟高大强壮得多，其实，他比森林里所有野兽都高大强壮，跳得最远，也跑得最快。只要力气和速度能够换来一顿饭，他就绝不会挨饿。可要动脑筋，他斗不过灰熊，也斗不过蛇。每逢这种时候，他只能请弟弟出手相助。
        - id: ch01-b02
          speaker: narrator
          text: >-
            野猫有一只耀眼的金球，那光芒美得让人几乎无法直视，非隔着熏黑的玻璃才看得清。他把球藏在围住脖颈的厚毛套里。野猫还小得像个婴儿时，一头十分庞大的老兽把金球送给了他。那头老兽如今已经死去，可它留下的叮嘱，野猫始终记得。无论如何也不能丢掉这只球，因为只要球在身边，任何灾祸都无法靠近。狮子喜欢打猎，平日总能捕来兄弟俩需要的食物，所以野猫很少动用金球。不过偶尔也有那么几回，若不是金球保护，他早就没命了。
        - id: ch01-b03
          speaker: narrator
          text: >-
            一天清晨，兄弟俩出门打猎。野猫跑得慢，便早早动身。他以为自己已经领先很远，可狮子纵身跃了几下，就赶到他身旁。狮子忽然压低了声音。
        - id: ch01-b04
          speaker: lion
          text: 那棵树上坐着一头熊。他正等我们经过，好跳到我背上。
          emotion: fearful
        - id: ch01-b05
          speaker: wild_cat
          text: 你这么高大，把后面的我全遮住了。他根本没看见我。熊，死吧！
        - id: ch01-b06
          speaker: narrator
          text: >-
            野猫说着碰了一下金球。熊立刻断了气，从树上栽下来，翻滚几下，正好停在兄弟俩面前。他们继续小跑，许久都平安无事。快要走过森林边缘的一片长草时，狮子灵敏的耳朵听见一阵轻轻的窸窣声。他猛地停下脚步。世上仅有熊和蛇能让他心头发抖，而他怕蛇更胜过怕熊。
        - id: ch01-b07
          speaker: lion
          text: 是蛇！
          emotion: fearful
        - id: ch01-b08
          speaker: wild_cat
          text: 不要紧。蛇，死吧！
          emotion: calm
        - id: ch01-b09
          speaker: narrator
          text: >-
            蛇当即死去。兄弟俩剥下蛇皮，折成一个很小的包，由野猫塞进自己的鬃毛。谁有幸得到一张蛇皮，便能靠它施展种种奇妙本领。可忙到这时，他们还没吃上午饭。蛇肉的滋味不好，狮子又不肯吃熊。面对倒地的熊，他总也不能放心，生怕熊并没有真的死去，只等仇敌靠近时突然活过来扑向他。
        - id: ch01-b10
          speaker: narrator
          text: >-
            兄弟俩再次出发，很快来到一座山脚。几头肥美的鹿正在那里吃草。野猫看中了其中一头。
        - id: ch01-b11
          speaker: wild_cat
          text: 你杀一头当午饭，再替我活捉一头。我想要一头活鹿。
        - id: ch01-b12
          speaker: narrator
          text: >-
            狮子大吼一声，立刻朝鹿群扑去。鹿一齐飞奔而逃，狮子在后面紧追。没过多久，三头鹿全都从野猫眼前消失了。野猫留在原地，等了又等，哥哥始终没有回来。他只好独自走回兄弟俩的茅屋。直到天黑透了，狮子才回到家中。弟弟正蜷在屋角，一见他便跳起来。
        - id: ch01-b13
          speaker: wild_cat
          text: 你替我捉到那头鹿了吗？
        - id: ch01-b14
          speaker: lion
          text: >-
            没有。我追到它们时，已经跑过了半个世界，连风都被我远远甩下了。把一头鹿拖回这么远，实在太麻烦。所以嘛，我索性把两头都吃掉了。
    - id: ch02
      title: 飞上天空的金球
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            野猫一句话也没说，可他觉得自己已经不再爱这个大哥了。他惦记那头活鹿已经很久，原本想骑到鹿背上，把它当成自己的坐骑。这样，他就能去看狮子心情好时讲起的那些神奇地方。他越想越气，整张脸都沉了下来。第二天早晨，狮子叫他一起出门打猎，他却说自己头痛，宁愿留在家里。
        - id: ch02-b02
          speaker: wild_cat
          text: 今天你自己去吧。熊也好，蛇也好，都由你自己来杀。
        - id: ch02-b03
          speaker: narrator
          text: >-
            野猫知道，没有他和金球，哥哥害怕碰见熊或蛇，绝不敢独自出门。兄弟俩就这样闹翻了，许多天互不理睬。他们找到的食物越来越少，肚子一饿，脾气也更坏了。
        - id: ch02-b04
          speaker: narrator
          text: >-
            狮子终于打起金球的主意。只要偷到它，自己就能对付熊和蛇。到了那时，弟弟爱生多久的气都随他去。可这球该怎么偷呢？野猫白天黑夜都把它挂在脖子上，睡觉又极轻，想趁他熟睡时拿走，根本没有用。看来只有一个办法，就是让野猫自己答应把球借出来。狮子本来一点儿也不聪明，苦想了好几天，才有了一条自以为行得通的计策。
        - id: ch02-b05
          speaker: narrator
          text: >-
            一天下午，大雨倾盆。无论眼睛还是鼻子多么灵敏，也找不到藏在灌木里的鸟兽。狮子故意大声抱怨起来。
        - id: ch02-b06
          speaker: lion
          text: 待在这里真没意思，我都要闷死了。我们拿你的金球玩抛接，好不好？
        - id: ch02-b07
          speaker: wild_cat
          text: 我不想玩。抛来抛去，一点儿也不好玩。
        - id: ch02-b08
          speaker: narrator
          text: 野猫的气还没消。猫受过伤害，从来不会忘记，直到今天还是如此。狮子伸出一只爪子。
        - id: ch02-b09
          speaker: lion
          text: 那就借我玩一会儿，我自己抛。
        - id: ch02-b10
          speaker: wild_cat
          text: 外面正下雨，你没法玩。就算出去了，也只会把球丢进灌木丛。
        - id: ch02-b11
          speaker: lion
          text: 我不会弄丢的，就在屋里玩。你别这么不肯帮忙嘛。
        - id: ch02-b12
          speaker: narrator
          text: >-
            野猫很不情愿地解下绳子，把球扔进哥哥怀里，自己又伏下睡觉。狮子高高兴兴地把球抛上抛下，玩了很久。他知道，弟弟不管看起来睡得多沉，其实一定还睁着一只眼。于是他一边抛球，一边一点一点挪向门口。到了门边，他忽然使足力气，把金球高高抛进空中。球越飞越高，转眼消失得无影无踪，狮子根本看不出它去了哪里。野猫怒气冲冲地跳了起来。
        - id: ch02-b13
          speaker: lion
          text: 都怪我太笨了！我们马上去找，球一定没有落得太远。
        - id: ch02-b14
          speaker: narrator
          text: >-
            兄弟俩当天找，第二天找，第三天还在找，却怎么也找不到。原来，那只球根本没有落下来。失去金球以后，野猫不肯再跟狮子同住。他独自向北走去，总盼望有一天能找回金球。几个月过去，几年过去，他走了几百英里，连金球的一点踪迹也没见到。
    - id: ch03
      title: 大水两岸
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            野猫渐渐老了。一天，他来到一个前所未见的地方。大河滚滚奔流，一直涌到几座高山脚下，岸边到处是湿漉漉的沼泽。猫都不喜欢弄湿爪子，他只好爬上一棵高高伸到水面上方的大树。他难过地想起丢失的金球。要是球还在，就能带他离开这个可怕的地方。就在这时，他看见一只美丽的球挂在自己所在的树枝上，模样跟原来的金球分毫不差。
        - id: ch03-b02
          speaker: narrator
          text: >-
            野猫恨不得立刻拿到球，又担心细枝撑不住自己的分量。他经历了这么多，可不能到头来淹死在水里。不过，只向前挪一点，应该没有什么危险，无论如何总能再退回来。他在树枝上伸直身体，小心地一点点往前爬。令他欢喜的是，树枝似乎又粗又结实。只要再挪一步，他的爪子就能碰到绳子。偏在这时，树枝咔嚓一声巨响，他赶紧扭动身体，循着原路退了回去。
        - id: ch03-b03
          speaker: narrator
          text: >-
            猫一旦下定决心，通常非做成不可。野猫四下察看，想弄清是不是真的再无办法。很快，他发现球上方还有一根粗壮得多的树枝。这条路虽然更难，却比刚才稳妥，他知道那根粗枝一定撑得住自己。他用四只爪子紧紧攀住，尾巴恰好能碰到金球。只要用尾巴不停地来回扫动，绳子迟早会变松，球也会掉到地上。这办法很费时间，不过狮子的小兄弟跟大多数猫一样有耐心。
        - id: ch03-b04
          speaker: narrator
          text: >-
            事情果真如他所愿。金球一落地，他便像闪电一样奔下树，把球捡起来，藏进脖子上的蛇皮袋。接着，他沿大水岸边一路跳跃，想找一条船，哪怕一根能载他过河的木头也好。岸边什么都没有，河对岸却有两个姑娘正在烧饭。野猫扯开嗓门呼喊，可她们离得太远，什么也听不清。
        - id: ch03-b05
          speaker: narrator
          text: >-
            偏偏这时，金球忽然从蛇皮袋中滑出来，直落进河里。球掉进河中，本来并不稀奇。普通的球要么沉到水底，从此留在那里，要么就在刚刚落水的地方浮来浮去。可这只球哪一种都没有做，反而径直游向对岸。一个姑娘正弯腰往桶里舀水，看见它在自己身边起伏。
        - id: ch03-b06
          speaker: maiden_1
          text: 快看，多漂亮的球！
          emotion: surprised
        - id: ch03-b07
          speaker: narrator
          text: 她想用水桶捞球，可球总在她够不到的地方浮动。姑娘只好喊自己的姐妹。
        - id: ch03-b08
          speaker: maiden_1
          text: 快来帮我把它捞起来！
        - id: ch03-b09
          speaker: narrator
          text: >-
            姐妹俩忙了好久，终于把球稳稳收进桶里。她们得到这个新玩具，高兴极了。直到睡前，不是姐姐拿着，就是妹妹拿着，谁也舍不得放下。到了晚上，两人又商量许久，怎么也拿不定主意，不知道放在哪里过夜才最安全。最后，她们把球锁进房间角落的橱柜。柜子上连一个孔也没有，金球绝不可能自己逃走。安排妥当以后，她们这才安心睡下。
    - id: ch04
      title: 金球的秘密
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            第二天一早，姐妹俩首先跑去打开橱柜。柜门刚开，她们就吃惊地后退一步。橱柜里没有金球，站着的竟是一位英俊的青年。
        - id: ch04-b02
          speaker: prince
          text: >-
            两位姑娘，你们帮了我这么大的忙，我该怎么感谢你们？很久以前，一个邪恶的仙女给我施了魔法。我只能一直做一只球，直到有两位少女把我带回她们的家。
        - id: ch04-b03
          speaker: prince
          text: >-
            可是，我到哪里去遇见她们呢？几百年来，我困在森林深处，身边只有野兽，从来没有人走到那里。后来，狮子把我抛到天空，我才终于离开森林，落在这条河附近。我知道，有河流的地方，迟早会有人前来，就把自己挂在一棵树上，一边守望，一边等待。
        - id: ch04-b04
          speaker: prince
          text: >-
            没想到，我又落回旧主人野猫手里。那一刻，我几乎失去了希望。可后来，我看见他正沿岸寻找过河的办法，要去你们站立位置的对面，心里又燃起希望。我知道机会终于来了，于是立刻抓住了它。
        - id: ch04-b05
          speaker: prince
          text: >-
            以后如果需要我帮忙，就登上那座高山，在北面的铁门上敲三下。我一定会出来见你们。
        - id: ch04-b06
          speaker: narrator
          text: >-
            青年说完，向姐妹俩深深鞠了一躬，随即从她们眼前消失。两个姑娘哭了，因为就在一眨眼之间，她们既失去了那只美丽的金球，也失去了王子。
