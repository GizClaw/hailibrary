audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 温暖庄重，讲述奇异之事时从容而有分寸, timbre: 清澈浑厚, pace: 舒缓, pitch: 中音}
    gardener_boy:
      display_name: 园丁的儿子
      tts: {delivery: 诚实恳切，历险中渐渐勇敢坚定, timbre: 年轻清亮, pace: 适中, pitch: 中高音}
    fox:
      display_name: 狐狸
      tts: {delivery: 机敏爽快，善意中带着胸有成竹, timbre: 清脆而略带沙哑, pace: 稍快, pitch: 中音}
    king:
      display_name: 国王
      tts: {delivery: 傲慢严厉，惯于发号施令, timbre: 洪亮威严, pace: 适中, pitch: 低音}
    prince:
      display_name: 王子
      tts: {delivery: 活泼任性，说话理直气壮, timbre: 稚嫩明亮, pace: 稍快, pitch: 中高音}
    traveler:
      display_name: 旅人
      tts: {delivery: 稳重热心，言语朴实, timbre: 平实厚重, pace: 适中, pitch: 中低音}
    sister_of_sun:
      display_name: 太阳的妹妹
      tts: {delivery: 明朗坚定，威严之下带着温柔, timbre: 明亮清澈, pace: 适中, pitch: 中高音}
    lost_princess:
      display_name: 被救的公主
      tts: {delivery: 温柔沉静，获救后满怀希望, timbre: 轻柔清晰, pace: 适中, pitch: 中高音}
    giant_1:
      display_name: 巨人甲
      tts: {delivery: 粗声大气，兴高采烈又容易受骗, timbre: 粗犷洪亮, pace: 适中, pitch: 低音}
    giant_2:
      display_name: 巨人乙
      tts: {delivery: 急躁响亮，情绪来得很快, timbre: 低沉沙哑, pace: 稍快, pitch: 低音}
    giant_3:
      display_name: 巨人丙
      tts: {delivery: 直来直去，粗鲁而警觉, timbre: 宽厚粗粝, pace: 适中, pitch: 低音}
    gardener:
      display_name: 园丁
      tts: {delivery: 谦卑谨慎，时时挂念儿子, timbre: 温暖沧桑, pace: 舒缓, pitch: 中低音}
    messenger:
      display_name: 报信人
      tts: {delivery: 急切清楚，奔跑后气息急促, timbre: 高亢明亮, pace: 快, pitch: 中音}
    first_woman:
      display_name: 小妹老妇人
      tts: {delivery: 慈祥神秘，说话朴素直接, timbre: 苍老柔和, pace: 缓慢, pitch: 中低音}
    second_woman:
      display_name: 二姐老妇人
      tts: {delivery: 内敛热心，回答干脆, timbre: 轻柔苍老, pace: 舒缓, pitch: 中音}
    eldest_woman:
      display_name: 大姐老妇人
      tts: {delivery: 智慧庄重，慈悲中带着警告, timbre: 苍老深沉, pace: 缓慢, pitch: 低音}
    brother_1:
      display_name: 兄弟甲
      tts: {delivery: 护物心切，争辩时急促, timbre: 坚实朴拙, pace: 稍快, pitch: 中音}
    brother_2:
      display_name: 兄弟乙
      tts: {delivery: 固执急切，却很容易相信别人, timbre: 年轻粗哑, pace: 稍快, pitch: 中低音}
    cloth_man_1:
      display_name: 桌布主人甲
      tts: {delivery: 好争而轻信，说起宝物十分兴奋, timbre: 尖细清楚, pace: 稍快, pitch: 中高音}
    cloth_man_2:
      display_name: 桌布主人乙
      tts: {delivery: 固执贪吃，说话直白, timbre: 圆润朴实, pace: 稍快, pitch: 中音}
    staff_man_1:
      display_name: 木杖主人甲
      tts: {delivery: 强硬自负，争执时毫不退让, timbre: 坚硬沉稳, pace: 适中, pitch: 中低音}
    staff_man_2:
      display_name: 木杖主人乙
      tts: {delivery: 戒备固执，回答直截了当, timbre: 干涩粗哑, pace: 适中, pitch: 中音}
    shoe_man_1:
      display_name: 鞋主人甲
      tts: {delivery: 急切好胜，容易受人哄骗, timbre: 细亮急促, pace: 稍快, pitch: 中高音}
    shoe_man_2:
      display_name: 鞋主人乙
      tts: {delivery: 务实固执，却同样轻信, timbre: 扎实朴素, pace: 适中, pitch: 中低音}
  chapters:
    - id: ch01
      title: 金色羽毛
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            很久以前，一位小王子把园丁的儿子当成最要好的玩伴。国王本想叫儿子跟宫里的侍童交朋友，可王子受惯了娇宠，只肯同这个安静懂事的孩子玩。于是，园丁的儿子从早到晚都能待在王宫里。
        - id: ch01-b02
          speaker: narrator
          text: >-
            两个孩子最喜欢比赛射箭。国王送给他们两张一模一样的弓，他们常常比一整天，看谁射得更高。这玩法危险得很，可他们竟从没伤到眼睛。
        - id: ch01-b03
          speaker: narrator
          text: >-
            一天早晨，王子做完功课，便跑出去叫上朋友，两人一同奔向平日玩耍的草坪。他们从存放玩具的小屋里取出弓，又比赛谁能射得更高。后来，两人碰巧同时向天上放箭。箭落回地面时，其中一支竟插着一根金母鸡的尾羽。可两支箭完全相同，无论凑得多近，谁也看不出半点分别。王子一口咬定箭是他的，园丁的儿子也认定箭属于自己。这一回，园丁的儿子的确说对了。两人争不清，只好径直去找国王评理。
        - id: ch01-b04
          speaker: narrator
          text: 国王听完，偏说羽毛属于王子。园丁的儿子不肯服气，仍旧坚持那是自己的。国王终于发怒了。
        - id: ch01-b05
          speaker: king
          text: >-
            好，你既然这样肯定，羽毛就给你。可你必须找到尾巴上少了这根羽毛的金母鸡。找不到，就拿脑袋来抵！
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: >-
            男孩用尽全部勇气，才一声不响地听完。他根本不知道金母鸡在哪里。即使查到它的住处，他也不知道该怎样去到那里。可除了服从国王，他已经没有别的路。男孩觉得越早离开王宫越好，便回家往袋里装了些食物，独自出发，只盼途中会有什么机缘，告诉他该走哪条路。
        - id: ch01-b07
          speaker: narrator
          text: 走了几个钟头，他遇见一只和气的狐狸。男孩正愁无人说话，便坐下来同它攀谈。
        - id: ch01-b08
          speaker: fox
          text: 你要去哪里？
        - id: ch01-b09
          speaker: gardener_boy
          text: >-
            我要找一只尾巴上少了根羽毛的金母鸡。可我不知道它住在哪儿，也不知道该怎么捉住它！
        - id: ch01-b10
          speaker: fox
          text: >-
            我能带你去。一直往东，很远的地方住着一位美丽姑娘，大家叫她太阳的妹妹。她家里有三只金母鸡，那根羽毛也许就是其中一只的。
        - id: ch01-b11
          speaker: narrator
          text: >-
            男孩听到这个消息，欢喜极了，跟着狐狸走了一整天。狐狸在前，他在后。夜色降临，他们把行囊垫在头下当枕头，就地躺下来睡觉。将近半夜时，狐狸忽然低声呜咽，往睡在身旁的男孩身边靠了靠。
        - id: ch01-b12
          speaker: fox
          text: 兄弟，有个人过来了。他会抢走我的行囊。你看那边！
        - id: ch01-b13
          speaker: narrator
          text: 男孩从灌木间望去，果然看见一个男人。
        - id: ch01-b14
          speaker: gardener_boy
          text: 我看他不会抢我们。
        - id: ch01-b15
          speaker: narrator
          text: >-
            男人走近后，男孩把自己的遭遇从头告诉了他。这个故事让陌生人很感兴趣，他便请求跟他们一起赶路，说自己或许能派上用场。太阳升起时，三人再次出发。仍是狐狸走在最前，男人和男孩跟在后面。
    - id: ch02
      title: 太阳的妹妹
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            几个钟头后，他们来到太阳的妹妹的城堡。她把三只金母鸡养在珍宝之中。三人在门外商量，该由谁进去见她。
        - id: ch02-b02
          speaker: fox
          text: 还是我进去，把母鸡偷出来吧。
        - id: ch02-b03
          speaker: gardener_boy
          text: 不行。这是我的事，应该由我去。
        - id: ch02-b04
          speaker: fox
          text: 那些母鸡可不容易捉住。
        - id: ch02-b05
          speaker: gardener_boy
          text: 我不会出事的。
        - id: ch02-b06
          speaker: fox
          text: >-
            那就去吧，可别犯错。只拿尾巴上少了一根羽毛的那只，另外两只碰也别碰。
        - id: ch02-b07
          speaker: narrator
          text: >-
            旅人始终在一旁听着，没有插嘴。男孩独自走进宫殿的庭院，很快便看见三只金母鸡昂首阔步地走来走去，仿佛骄傲得不得了。其实，它们心里着急寻找的，只是地上有没有几粒可以啄食的谷子。最后一只从男孩面前走过时，他看得分明，它的尾巴上果真少了一根羽毛。
        - id: ch02-b08
          speaker: narrator
          text: >-
            男孩扑上去，捉住母鸡，夹在腋下就往大门走。可他快出门时回头一看，宫殿敞开的门里闪耀着无数珍宝。
        - id: ch02-b09
          speaker: gardener_boy
          text: 反正不急。既然来了，我何不进去看一眼？
        - id: ch02-b10
          speaker: narrator
          text: >-
            他掉头走回去，竟把怀里的母鸡忘得一干二净。母鸡趁机从他胳膊底下挣脱，跑回姐妹身边。敞开的门里，一件件美丽的珍宝闪现出来，把男孩迷得连已经到手的猎物丢了也没察觉。等他看见太阳的妹妹正躺在床上沉睡，世上还有金母鸡这回事，他早已完全忘记。
        - id: ch02-b11
          speaker: narrator
          text: >-
            他站着看了许久，才猛然想起自己不该在这里，便悄悄退出去，又捉住母鸡。可到了门槛，他再次停下。
        - id: ch02-b12
          speaker: gardener_boy
          text: 我为什么不能再去看看她？她睡着了，什么也不会知道。
        - id: ch02-b13
          speaker: narrator
          text: >-
            他第二次转身走进卧房，母鸡也像上回一样，从他怀里扭了出去。男孩站在那里，直到看够了，才回到庭院。那只母鸡正四处寻谷子，他又把它捉住，夹在怀里。可是快走到大门时，他第三次停了下来。
        - id: ch02-b14
          speaker: gardener_boy
          text: 我刚才为什么没亲她一下？以后再也遇不到这样美丽的女子了。
        - id: ch02-b15
          speaker: narrator
          text: 他懊恼地搓着双手，母鸡掉到地上，又逃走了。
        - id: ch02-b16
          speaker: gardener_boy
          text: 我现在去亲她，还来得及！
          emotion: happy
        - id: ch02-b17
          speaker: narrator
          text: >-
            男孩满心欢喜地跑回卧房，在沉睡姑娘的额头上吻了一下。可等他再次出来，那只母鸡已经受了惊，无论他怎样靠近，它都躲得远远的。更糟的是，它的两个姐妹也扯开嗓子，咯咯叫个不停。太阳的妹妹被吵醒了。她慌忙跳下床，快步来到门口，看见男孩还在庭院里。
        - id: ch02-b18
          speaker: sister_of_sun
          text: >-
            你永远也别想得到我的母鸡，除非你把我姐姐救回来。她被巨人掳到了很远的城堡。
          emotion: angry
        - id: ch02-b19
          speaker: narrator
          text: >-
            男孩只好离开宫殿。他走得又慢又沉重，满心都是懊悔和悲伤。狐狸和旅人还等在大门外，他便把经过一五一十说了出来。那只金母鸡明明三次被他抱在怀里，却又三次因为他贪看公主和珍宝，从手中逃走。
        - id: ch02-b20
          speaker: fox
          text: >-
            我就知道不会这么容易。别再耽搁，我们马上去找她姐姐。幸好，我认识路。
    - id: ch03
      title: 巨人的城堡
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 他们走了许多天。走在最前的狐狸忽然停下脚步。
        - id: ch03-b02
          speaker: fox
          text: >-
            巨人的城堡就在前面。你们两个留在外面，我进去带公主出来。她一出来，你们就抓牢她，尽快逃走。我再回去跟巨人们周旋，让他们发现不了公主已经逃了。
        - id: ch03-b03
          speaker: narrator
          text: >-
            到了城堡，常来这里的狐狸轻易溜进大厅。许多老老少少的巨人正围着公主跳舞。他们一见狐狸便热闹地招呼它。
        - id: ch03-b04
          speakers: [giant_1, giant_2, giant_3]
          ensemble: chorus
          text: 老狐狸，快来一起跳！我们好久没见你了！
          emotion: happy
        - id: ch03-b05
          speaker: narrator
          text: 狐狸便陪着他们跳起来。过了一会儿，它停下脚步。
        - id: ch03-b06
          speaker: fox
          text: >-
            我会一种很迷人的新舞，正想跳给你们看。可它只能两个人跳。要是公主肯陪我一会儿，你们马上就能瞧见。
        - id: ch03-b07
          speakers: [giant_1, giant_2, giant_3]
          ensemble: chorus
          text: 太好了！我们正想看点新鲜的！
          emotion: happy
        - id: ch03-b08
          speaker: narrator
          text: >-
            巨人们兴冲冲地把公主放进狐狸张开的双臂。就在那一瞬间，狐狸撞倒了照亮大厅的巨大灯架，趁着一片漆黑抱起公主，冲到城堡门口。男孩和旅人按照约定牢牢接住她，带着她飞快逃走。狐狸立刻折回大厅，竟赶在别人发现它离开以前回到了原处。巨人们仍在摸黑生火，想重新弄出一点亮光。忙乱了好一阵，才有人想起公主，突然叫了起来。
        - id: ch03-b09
          speaker: giant_2
          text: 公主到哪里去了？
          emotion: surprised
        - id: ch03-b10
          speaker: fox
          text: 她就在我怀里。别怕，她安全得很。
        - id: ch03-b11
          speaker: narrator
          text: >-
            狐狸等到伙伴们至少越过五六座山，才一下蹿出门去。
        - id: ch03-b12
          speaker: fox
          text: 姑娘就在这里！有本事就来抓她！
        - id: ch03-b13
          speaker: narrator
          text: >-
            巨人们这才明白猎物已经逃掉，迈开两条大长腿拼命追赶。他们认定公主就在狐狸背上，还以为很快便能追上。狐狸可比他们聪明得多。它故意绕开朋友们逃走的道路，在森林里一会儿钻进，一会儿绕出，把追兵引向别处。后来，就连狐狸也累得筋疲力尽，倒在一棵树下沉沉睡去。它白天实在太累，连巨人逼近的脚步都没有听见。那些大手已经伸来，眼看就要抓住它的尾巴，它才猛然睁眼，一个大跳，再次逃出他们的手掌。
        - id: ch03-b14
          speaker: narrator
          text: >-
            狐狸跑了整整一夜。东方泛红时，它停下来，等巨人们追到身后，才从容回头。
        - id: ch03-b15
          speaker: fox
          text: 看哪，太阳的妹妹来了！
        - id: ch03-b16
          speaker: narrator
          text: >-
            巨人们一齐抬头，立刻变成石柱。狐狸对每根石柱都深深鞠躬，然后抄近路翻过山岭，很快追上朋友们。
        - id: ch03-b17
          speaker: narrator
          text: >-
            狐狸熟悉许多翻山越岭的近路，很快追上了朋友。四人日夜不停地赶路，终于回到太阳的妹妹的城堡。宫里的人原以为公主已经死去，如今见她平安回来，到处都是欢宴和庆祝。男孩冒着重重危险救回公主，也受到所有人的百般款待。太阳的妹妹立刻把金母鸡交给他，还许诺再过一阵，等他长大几岁，自己就到他家去做他的妻子。男孩听见等待自己的竟是这样的幸福，简直不敢相信耳朵。她是世上最美的公主，额头上有一颗星，无论黑夜多么浓重，只要星光照亮四周，黑暗顷刻便会消散。
    - id: ch04
      title: 海上的白帆
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            男孩带着朋友们踏上归途。每当想起公主的承诺，他心里便充满欢喜。伙伴们在最初相遇的地方一个接一个离去。等他走进故乡的城门和王宫大门，已经只剩下孤身一人。他把金母鸡夹在腋下，来到国王面前，讲完一路的奇遇，又说将来会有一位举世无双的公主嫁给自己。她额头上的星光，能把黑夜变成白昼。国王始终沉默地听着。
        - id: ch04-b02
          speaker: king
          text: 要是你的故事有半句不真，我就把你扔进一桶沥青里。
        - id: ch04-b03
          speaker: gardener_boy
          text: 每一个字都是真的。她来找我的日子和时辰，早已定好了。
        - id: ch04-b04
          speaker: narrator
          text: >-
            约定的日子越来越近，公主却毫无消息，男孩渐渐焦虑不安。更叫他害怕的是，宫里传来消息，说那只大桶已经在灌沥青，桶底也堆好了木柴，只等点火把沥青煮沸。男孩整日守在窗前，望向公主必经的海面。可是海上一点动静也没有，连最小的一片白帆也看不见。
        - id: ch04-b05
          speaker: narrator
          text: >-
            男孩还站在窗前，士兵便冲进来抓住他，把他押到那只大桶边。桶底烈火熊熊燃烧，可怕的黑沥青正在里面翻滚冒泡，甚至溢过桶沿。男孩只看了一眼便浑身发抖。可四周全是士兵，根本无处可逃，他只好紧紧闭上眼睛，不再去看。命令下达了，他正要踏上通往桶顶的台阶，忽然有几个人从远处拼命跑来。
        - id: ch04-b06
          speaker: messenger
          text: 一艘张满船帆的大船正朝城里驶来！
        - id: ch04-b07
          speaker: narrator
          text: >-
            没人知道那是什么船，也没人知道它从哪里来。国王却宣称，在船到达以前不准烧死男孩，反正以后有的是时间。大船终于平安驶进港口。围观的人群里很快传开消息：船上正是太阳的妹妹，她依照诺言，前来嫁给年轻的农家子弟。没过多久，公主便登上岸，请人带她去未婚夫曾多次描述的那间小屋。国王一看见海上的船，就已经叫人把男孩送回那里。
        - id: ch04-b08
          speaker: sister_of_sun
          text: 你不认得我了吗？
        - id: ch04-b09
          speaker: narrator
          text: >-
            公主俯下身，看着躺在那里的男孩。他刚从沸腾的沥青桶旁逃回，已经被恐惧折磨得几乎失去神智。即使听见熟悉的声音，他仍旧垂着眼睛，连头也不敢抬起。
        - id: ch04-b10
          speaker: gardener_boy
          text: 不，不。我不认识你。
          emotion: fearful
        - id: ch04-b11
          speaker: sister_of_sun
          text: 那就吻我一下。
        - id: ch04-b12
          speaker: narrator
          text: 男孩吻了她，仍然垂着眼睛。
        - id: ch04-b13
          speaker: sister_of_sun
          text: 现在还不认得我吗？
        - id: ch04-b14
          speaker: gardener_boy
          text: 不，我不认识你。我不认识你！
          emotion: fearful
        - id: ch04-b15
          speaker: narrator
          text: >-
            公主见他像被恐惧逼疯了一样，也有些害怕起来，只好从头讲起，说他们怎样相识，自己又怎样赶过漫长的路来同他成婚。她刚把故事讲完，国王便走进小屋，要亲眼看看男孩的话究竟是真是假。门才打开，屋里灿烂的光芒就刺得他几乎睁不开眼。他立刻想起男孩说过，公主额头上有一颗星。国王踉跄后退，仿佛挨了一记重击。随后，一种从未有过的古怪感受抓住了他。他竟跪倒在公主面前，苦苦请求她抛下园丁的儿子，转而同自己共享王位。
        - id: ch04-b16
          speaker: sister_of_sun
          text: >-
            我若想坐王位，自有一张比你的更华美。我愿意嫁给谁，就嫁给谁。除了这个男孩，我谁也不要。要不是你逼他出发，我还不会遇见他呢。
        - id: ch04-b17
          speaker: sister_of_sun
          text: 我明天就嫁给他。立刻准备婚礼。
    - id: ch05
      title: 国王的三件差事
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            第二天到了，新郎的父亲告诉公主，依照本国法律，婚礼必须在国王面前举行。他只希望陛下不要耽搁太久。一个钟头过去，又一个钟头过去，所有人都在等待张望。终于，远处响起号角声，一支盛大的队伍沿街走来。人们早已为国王备好一把蒙着天鹅绒的椅子。他坐下以后，环视聚在四周的人群。
        - id: ch05-b02
          speaker: king
          text: >-
            我不想禁止这桩婚事。可是，新郎必须先完成三件差事，证明自己配得上这样的新娘。第一件，他要在一天之内砍倒整片森林里的每一棵树。
        - id: ch05-b03
          speaker: narrator
          text: >-
            年轻人惊呆了。他从没砍过一棵树，连怎样下手都不知道，更别说一整片森林。公主看出了他的心思，贴近他低声说道。
        - id: ch05-b04
          speaker: sister_of_sun
          text: >-
            别怕。我的船上有一把斧头，把它带进森林。你砍倒第一棵树后，就说：“让整片森林都倒下吧。”所有树会立刻倒下。不过，记得捡起三块木屑，放进口袋。
          emotion: calm
        - id: ch05-b05
          speaker: narrator
          text: 年轻人照她说的做了，很快便带着三块木屑回来。
        - id: ch05-b06
          speaker: narrator
          text: >-
            第二天早晨，公主说自己已经仔细想过。她不是国王的臣民，没有理由受他的法律约束，所以当天便要成婚。园丁却告诉她，说起来虽然容易，对自己的儿子可完全是另一回事。儿子若违抗国王的命令，就得拿脑袋偿命。不过，年轻人已经完成昨天的差事，园丁希望陛下或许会心软，尤其是国王已经派人传话，说马上就到。新郎新娘只好接受这个安排，尽量耐心等候。
        - id: ch05-b07
          speaker: narrator
          text: 国王很快到了。他们一看他的脸色，便知道没有好事。
        - id: ch05-b08
          speaker: king
          text: 婚礼不能举行。年轻人得先把昨天砍倒的每一棵树重新接到树根上。
        - id: ch05-b09
          speaker: narrator
          text: 这听来比砍树难得多。年轻人绝望地望向公主。
        - id: ch05-b10
          speaker: sister_of_sun
          text: >-
            没关系。把这瓶水洒在一棵倒下的树上，再说：“让森林里所有的树重新站起来吧。”它们立刻就会恢复原样。
          emotion: calm
        - id: ch05-b11
          speaker: narrator
          text: 年轻人照办了。离开时，整片森林和从前毫无分别。
        - id: ch05-b12
          speaker: narrator
          text: >-
            公主以为这下再没有理由推迟婚礼，便命人把一切准备妥当，第二天成婚。园丁却又来阻拦，说没有国王允许，任何婚礼都不能举行。国王第三次被请来，也第三次提出条件：新郎必须杀死城堡后面宽阔河流里的巨蛇。人人都听过这条巨蛇的可怕传闻，却没有谁真正见过它。只是时不时会有孩子离家以后再也没有回来。每逢这时，母亲们就严禁其他孩子靠近河边，哪怕岸边的果子鲜美多汁，花朵也开得十分漂亮。
        - id: ch05-b13
          speaker: narrator
          text: 年轻人听完，脸色惨白，浑身发抖。公主握住他的手。
        - id: ch05-b14
          speaker: sister_of_sun
          text: >-
            这一次你也会成功。船上有一把魔剑，什么都能斩断。你去河边解开那条小船，把三块木屑扔进水里。巨蛇抬起身子时，一剑砍掉它的三个头，再割下三截舌尖。明早把它们带进御膳房。国王若进来，你就说：“你叫我效劳三次，我也回赠你三件礼物。”把舌尖扔向他，立刻跑回船上。记住，绝不能回头。
          emotion: calm
        - id: ch05-b15
          speaker: narrator
          text: >-
            年轻人丝毫不差地照公主的话去做。他来到河边，把三块木屑扔进水里。木屑立刻化作一条船。他驾船横渡河面时，巨蛇昂起身子，发出响亮的嘶嘶声。年轻人早已握好魔剑，只一挥，三个蛇头便全都落下，在水面上起起伏伏。他把船划到近旁，俯身割下三条舌头的尖端，随后又划回对岸。
        - id: ch05-b16
          speaker: narrator
          text: >-
            第二天早晨，他把三截蛇舌带进王宫的御膳房，守在那里等待。国王每天都有亲自走进厨房的习惯，要看看当天的晚餐会端上什么。国王果然出现时，年轻人立刻迎上前，把三截蛇舌一起扔到他的脸上。
        - id: ch05-b17
          speaker: gardener_boy
          text: 你叫我效劳，我也送你一份回礼！
        - id: ch05-b18
          speaker: narrator
          text: >-
            他推开厨房的门，朝大船飞奔。可惜，他在激动和慌乱中走错了路，一会儿向前，一会儿折回，怎么也弄不清自己正往哪里跑。最后，他彻底绝望了，忘记公主的警告，回头望了一眼。眼前的景象叫他不敢相信：整座城市连同王宫，全都消失得无影无踪。他赶紧转向另一边，只见大船已经远在天际。船帆全都张开，身后的顺风正带着它越走越远。
    - id: ch06
      title: 班卡城堡
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            眼前这可怕的景象仿佛夺去了年轻人的神智。他整整一天四处游荡，连自己往哪里走也不知道。到了傍晚，他终于看见附近有一缕烟升起来，烟下是一间小小的泥炭屋。年轻人径直走到门前，大声向屋里呼喊。
        - id: ch06-b02
          speaker: gardener_boy
          text: 好妈妈，可怜可怜我，让我进去吧！
        - id: ch06-b03
          speaker: narrator
          text: 屋里的老妇人招手让他进门。他才跨进去，便急着再问。
        - id: ch06-b04
          speaker: gardener_boy
          text: 好妈妈，你知道太阳的妹妹在哪里吗？
        - id: ch06-b05
          speaker: first_woman
          text: 不，我一点也不知道。
        - id: ch06-b06
          speaker: narrator
          text: 年轻人正要离开，老妇人却交给他一封信。
        - id: ch06-b07
          speaker: first_woman
          text: >-
            请把它带给我二姐。路上要是累了，就拿出信来，把信纸抖得沙沙响。
        - id: ch06-b08
          speaker: narrator
          text: >-
            年轻人听了十分惊讶，完全想不出抖响信纸能帮上什么忙，却没有多问，只沿着道路继续漫无目的地走。后来，他累得一步也迈不动，才记起老妇人的叮嘱。他只把信纸抖响了一次，全身的疲惫便立刻消失。他重新迈开大步，穿过一片片草地，直到第二间一模一样的泥炭小屋出现在眼前。
        - id: ch06-b09
          speaker: gardener_boy
          text: >-
            好妈妈，请让我进去。这是你妹妹捎来的信。你知道太阳的妹妹在哪里吗？
        - id: ch06-b10
          speaker: second_woman
          text: 不，我一点也不知道。
        - id: ch06-b11
          speaker: narrator
          text: 年轻人绝望地转身，二姐却又叫住他。
        - id: ch06-b12
          speaker: second_woman
          text: >-
            要是经过我大姐家，请替我送去这封信。路上累了，就拿出来抖响信纸。
        - id: ch06-b13
          speaker: narrator
          text: >-
            年轻人收好信，翻山越岭走了一整天，来到第三间泥炭小屋。
        - id: ch06-b14
          speaker: gardener_boy
          text: >-
            好妈妈，请让我进去。这是你妹妹的信。你知道太阳的妹妹在哪里吗？
        - id: ch06-b15
          speaker: eldest_woman
          text: >-
            知道。她住在班卡城堡。你带走她父亲的魔剑，害他几天前打了败仗。太阳的妹妹悲痛得快要死了。见到她以后，用针刺进她的手心，再吸去流出的血珠。她就会平静下来，也会重新认出你。可你得小心，抵达班卡城堡以前，还会遇上可怕的事情。
        - id: ch06-b16
          speaker: narrator
          text: >-
            老妇人的消息叫年轻人喜极而泣。他连声感谢，随后继续赶路。可他还没走出多远，就在道路的拐弯处看见两兄弟吵得不可开交。两个人谁也不肯让谁，手里争抢的却只是一块看起来毫不值钱的破布。
        - id: ch06-b17
          speaker: gardener_boy
          text: 两位，你们为什么抢这块不值钱的破布？
        - id: ch06-b18
          speakers: [brother_1, brother_2]
          ensemble: duo
          text: >-
            它是父亲留下的。谁把它裹在身上，别人就看不见谁。我们都想要它！
        - id: ch06-b19
          speaker: gardener_boy
          text: 先让我披上试试，我再替你们判断它该归谁。
        - id: ch06-b20
          speaker: narrator
          text: >-
            兄弟俩觉得让陌生人评判很公平，便高高兴兴地一起把破布交给他。年轻人把它往肩头一披，身影立刻从两人面前消失，仿佛他从来没有站在那里。兄弟俩这才明白，那块能让人隐身的布已经被这个过路人骗走了。
        - id: ch06-b21
          speaker: narrator
          text: 他快步赶路，又看见两个男人在争一块桌布。
        - id: ch06-b22
          speaker: gardener_boy
          text: 你们在争什么？
        - id: ch06-b23
          speakers: [cloth_man_1, cloth_man_2]
          ensemble: duo
          text: >-
            只要把这块桌布铺上桌，桌面马上会摆满最可口的食物。我们都想得到它！
        - id: ch06-b24
          speaker: gardener_boy
          text: 让我试试，再由我判断它应该归谁。
        - id: ch06-b25
          speaker: narrator
          text: 两人把桌布交给他。他立即披上隐身布消失了，只留下两人懊恼自己的愚蠢。
        - id: ch06-b26
          speaker: narrator
          text: >-
            他带着两件宝物继续走，没过多久，又看见两个男人站在路边。他们死死抓着同一根粗杖，一会儿这个像是要抢到手，一会儿又轮到那个占了上风，谁也不肯放开。
        - id: ch06-b27
          speaker: gardener_boy
          text: >-
            林子里随便砍砍，就能找到十几根这样的木棍。你们何必争它？
        - id: ch06-b28
          speaker: staff_man_1
          text: >-
            你可说错了！这根杖的一头能把人打死，另一头只要轻轻一碰，就能叫死人复活。你上哪儿找第二根？
        - id: ch06-b29
          speaker: gardener_boy
          text: 那的确稀奇。让我看看，再替你们判断该归谁。
        - id: ch06-b30
          speaker: narrator
          text: 两个人都觉得请他评判是个好主意，便暂时停止争抢，把那根奇异的木杖递到年轻人手里，让他仔细查看。
        - id: ch06-b31
          speaker: gardener_boy
          text: >-
            可哪一头能叫人复活呢？只要打得够重，普通木棍也能打死人。
        - id: ch06-b32
          speaker: narrator
          text: 两人指明以后，年轻人披上隐身布，带着木杖消失了。
        - id: ch06-b33
          speaker: narrator
          text: >-
            年轻人把隐身布重新披到肩上，带着木杖离开了那两个还在争吵的人。继续走了一段路，他终于看见最后一群人。这些人围在路边，彼此拉扯推搡，拼命争夺的竟是一双看起来根本不能穿的破旧鞋子。
        - id: ch06-b34
          speaker: gardener_boy
          text: 这双鞋旧得连一步都走不了，你们为什么还要争？
        - id: ch06-b35
          speakers: [shoe_man_1, shoe_man_2]
          ensemble: duo
          text: >-
            它们虽然旧，可谁穿上以后想去什么地方，不用走一步也能立刻到达！
        - id: ch06-b36
          speaker: gardener_boy
          text: 真有意思。让我试试，再告诉你们鞋该归谁。
        - id: ch06-b37
          speaker: narrator
          text: 众人把鞋交给他。鞋刚穿上，他便高声说出愿望。
        - id: ch06-b38
          speaker: gardener_boy
          text: 我要去班卡城堡！
        - id: ch06-b39
          speaker: narrator
          text: >-
            话音刚落，神奇的鞋便把他带走。还没等他明白过来，他已经站在班卡城堡里。太阳的妹妹就在眼前，悲伤得奄奄一息。年轻人跪在她身边，取出一根针，刺进她的手心。一滴鲜血立刻涌了出来。他照老妇人的吩咐把血吸去，公主马上清醒过来，也重新认出了他。她伸出双臂，紧紧搂住他的脖子。随后，她把大船没有等到他便驶离以后，自己经历的事情全都告诉了他。
        - id: ch06-b40
          speaker: sister_of_sun
          text: >-
            最惨的是那场败仗。你带着父亲的魔剑消失了，他的军队几乎全军覆没，活下来的人寥寥无几。
          emotion: sad
        - id: ch06-b41
          speaker: gardener_boy
          text: 带我去战场。
        - id: ch06-b42
          speaker: narrator
          text: >-
            公主领他来到一片荒凉的原野。阵亡的士兵仍保持着倒下时的姿势，遍地躺在那里，等着有人来埋葬。年轻人拿出木杖，用能使人复活的那一头，一个接一个地碰过他们。士兵们陆续睁开眼睛，从地上站起。最后，整支军队都活了过来，齐齐站在他面前。整个王国上下只剩欢喜。这一次，再也没有人能阻挠他们，婚礼终于真真正正地举行了。新郎和新娘住在班卡城堡里，幸福地生活到生命的尽头。
