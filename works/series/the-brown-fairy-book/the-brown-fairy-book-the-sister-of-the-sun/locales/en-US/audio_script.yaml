  chapters:
    - id: ch01
      title: The Golden Feather
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long ago, a young prince chose the gardener's son for his closest playmate. The gardener and his family lived in the palace grounds. The king would rather have seen his son with the pages who grew up at court, but the prince wanted nothing to do with them. He was spoiled and always got his way. Since the gardener's boy was quiet and well behaved, he was allowed inside the palace from morning until night.
        - id: ch01-b02
          speaker: narrator
          text: Best of all, the two boys loved to shoot arrows. The king had given them matching bows, and they spent whole days trying to see who could shoot highest. It was dangerous play, and it was a wonder neither boy lost an eye, but somehow they always escaped harm.
        - id: ch01-b03
          speaker: narrator
          text: One morning, as soon as the prince had finished his lessons, he fetched his friend. They hurried to their usual lawn, took their bows from the little toy hut, and began their contest. At last they released two arrows at the very same moment. When the arrows fell, the tail feather of a golden hen was caught in one of them.
        - id: ch01-b04
          speaker: narrator
          text: The arrows looked exactly alike. No matter how closely the boys stared, they could not tell them apart. So the question was not easy at all. Which boy had shot the arrow with the golden feather?
        - id: ch01-b05
          speaker: prince
          text: The lucky arrow is mine. That golden feather belongs to me.
        - id: ch01-b06
          speaker: gardener_boy
          text: No, it came down on my arrow. I am certain it did.
        - id: ch01-b07
          speaker: narrator
          text: This time the gardener's son was right. Still, the boys could not settle the quarrel, so they went straight to the king and asked him to decide. The king heard the whole story, then announced that the feather belonged to his own son. The gardener's boy would not listen. He knew what he had seen, and he claimed the feather once again. At last the king's patience gave way.
        - id: ch01-b08
          speaker: king
          text: Very well! If you are so certain it is yours, then keep it. But you must search until you find the golden hen with a missing tail feather. If you fail to bring her back, you will pay with your head.
          emotion: angry
        - id: ch01-b09
          speaker: narrator
          text: The boy needed all his courage to listen without speaking. The king's sentence left him with two impossible questions. Where in the world did the golden hen live? Even if he found her, how could he ever bring her back? Yet he had no choice but to obey. He felt the sooner he left the palace, the better. He went home, packed food into a bag for the journey, and set out in the hope that some lucky accident would show him which road to take.
        - id: ch01-b10
          speaker: narrator
          text: Several hours later, he met a friendly-looking fox. The boy was so glad to find someone to talk with that he sat down beside him.
        - id: ch01-b11
          speaker: fox
          text: Where are you going, cousin?
        - id: ch01-b12
          speaker: gardener_boy
          text: I must find a golden hen that has lost a tail feather. I do not know where she lives, and I do not know how I can catch her.
        - id: ch01-b13
          speaker: fox
          text: I can lead you the right way. Far to the east lives a beautiful maiden called the Sister of the Sun. She keeps three golden hens in her house. Your feather may belong to one of them.
        - id: ch01-b14
          speaker: narrator
          text: The news delighted the boy. At last he had a place to search and someone who knew the way. All that day they traveled together, the fox trotting in front and the boy following behind. When evening came, they lay down beside the road to sleep. They put the food bag beneath their heads and used it as a pillow.
        - id: ch01-b15
          speaker: narrator
          text: Near midnight, the fox gave a low whine and crept closer to his companion.
        - id: ch01-b16
          speaker: fox
          text: Cousin, someone is coming to steal our bag. Look through those bushes.
          emotion: fearful
        - id: ch01-b17
          speaker: narrator
          text: The boy peered through the leaves and saw a man approaching.
        - id: ch01-b18
          speaker: gardener_boy
          text: I do not believe he means to rob us.
        - id: ch01-b19
          speaker: narrator
          text: When the stranger reached them, the boy told him the whole story. The man was deeply interested and asked to come along, saying he might be useful. At sunrise the three set off, with the fox in front and the man and boy behind him.
    - id: ch02
      title: The Hens and the Lost Princess
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: After several hours, they reached the castle of the Sister of the Sun. Her three golden hens lived there among all her other treasures. The companions stopped before the gate. They knew someone would have to enter the court and face the lady herself, so they took counsel together about who it should be.
        - id: ch02-b02
          speaker: fox
          text: I had better slip inside and steal the hens.
        - id: ch02-b03
          speaker: gardener_boy
          text: No. This is my task, so I must be the one to go.
        - id: ch02-b04
          speaker: fox
          text: Getting hold of those hens will not be easy.
        - id: ch02-b05
          speaker: gardener_boy
          text: I will be all right. Nothing is going to happen to me.
        - id: ch02-b06
          speaker: fox
          text: Then go, but do exactly as I say. Take only the hen with a feather missing from her tail. Leave the other two alone.
        - id: ch02-b07
          speaker: narrator
          text: The traveler listened to this exchange without interfering. The boy went through the gate alone and entered the palace court. Before long, he spotted all three golden hens. They strutted proudly past him, one after another, though each was secretly searching the ground for any grain she might be glad to eat. The final hen passed close by. There, in her shining tail, he saw the place where one feather was missing.
        - id: ch02-b08
          speaker: narrator
          text: He sprang forward, caught her firmly by the neck so she could not struggle, and tucked her under his arm. He went straight toward the gate. But just before he passed through it, an open palace door gave him a glimpse of dazzling treasures.
        - id: ch02-b09
          speaker: gardener_boy
          text: There is no need to hurry. Since I am already here, I may as well look around.
        - id: ch02-b10
          speaker: narrator
          text: He turned back, forgetting the fox's warning and forgetting the hen beneath his arm. She wriggled free and ran to join her sisters. The wonderful things beyond the doorway fascinated him so completely that he scarcely noticed his prize was gone. Then he stepped farther inside and saw the Sister of the Sun sleeping on a bed. From that moment, he did not remember there was such a thing as a hen anywhere in the world.
        - id: ch02-b11
          speaker: narrator
          text: For a long time he did nothing but stand and stare. At last he came to himself with a start. He knew he had no business in that chamber, so he stole softly away. Back in the court, he was fortunate enough to catch the right hen again. He tucked her beneath his arm and took her toward the gate. But when he reached the threshold, his feet stopped once more.
        - id: ch02-b12
          speaker: gardener_boy
          text: Why should I not look at the Sister of the Sun again? She is asleep. She will never know.
        - id: ch02-b13
          speaker: narrator
          text: For the second time, he turned away from freedom and entered her chamber. While he gazed at the sleeping maiden, the hen twisted out of his arm just as she had before. When he had looked as long as he wished, he went back into the courtyard. He found the escaped hen there, calmly hunting for corn. Once again he picked her up, and once again he started for the gate. As he drew near it, regret made him pause for a third time.
        - id: ch02-b14
          speaker: gardener_boy
          text: Why did I not kiss her? I shall never kiss anyone so beautiful.
        - id: ch02-b15
          speaker: narrator
          text: He wrung his hands so hard that the hen dropped to the ground and escaped.
        - id: ch02-b16
          speaker: gardener_boy
          text: It is not too late. I can still do it!
          emotion: happy
        - id: ch02-b17
          speaker: narrator
          text: He rushed into the chamber and kissed the sleeping maiden on the forehead. But he had let the golden hen escape three times now. When he came outside again, she had grown so shy that she would not allow him near her. Worse still, her two sisters joined her and began clucking with all their might. The noise woke the Sister of the Sun. She sprang hastily from her bed and came to the chamber door.
        - id: ch02-b18
          speaker: sister_of_sun
          text: You will never have my hen until you bring back my sister. A giant carried her away to a distant castle.
          emotion: angry
        - id: ch02-b19
          speaker: narrator
          text: The boy left the palace slowly and sadly. Outside the gate, he confessed that he had held the hen three times and lost her every time.
        - id: ch02-b20
          speaker: fox
          text: I knew we would not escape so easily. We cannot waste another moment. I know where the giant lives, so let us find the sister at once.
        - id: ch02-b21
          speaker: narrator
          text: They traveled for many days, crossing one stretch of country after another. The fox went first as always, choosing every turn. At last he stopped so suddenly that the two behind him nearly walked into him.
        - id: ch02-b22
          speaker: fox
          text: The giant's castle is close now. You two must wait outside while I fetch the princess. The instant I bring her through the gate, hold her tightly and run as fast as you can. I will go back and keep the giants talking so they do not notice she is gone. There are many of them in there.
        - id: ch02-b23
          speaker: narrator
          text: A few minutes later they arrived. The fox had visited the place often, so he slipped inside easily. Young giants and old giants filled the hall, all dancing around the captive princess. When they saw their familiar guest, they greeted him together.
        - id: ch02-b24
          speakers: [giant_1, giant_2, giant_3]
          ensemble: chorus
          text: Come dance with us, old fox! We have not seen you for a long time.
        - id: ch02-b25
          speaker: narrator
          text: The fox rose on his hind legs and joined the dance. He knew the steps and performed them as well as the best giant in the hall. He kept dancing until everyone was watching him with pleasure. Only then did he stop and announce that he knew something they had never seen.
        - id: ch02-b26
          speaker: fox
          text: I know a wonderful new dance. I would gladly show it to you, but it takes exactly two dancers. If the princess will join me for a moment, you shall see it.
        - id: ch02-b27
          speakers: [giant_1, giant_2, giant_3]
          ensemble: chorus
          text: Yes, show us! We want to see something new.
          emotion: happy
        - id: ch02-b28
          speaker: narrator
          text: They placed the princess between the fox's outstretched paws. In an instant, he knocked over the great stand of lamps. Darkness swallowed the hall. He carried the princess to the gate, where his companions seized her as instructed and hurried away. Before anyone missed him, the fox was back among the giants.
        - id: ch02-b29
          speaker: narrator
          text: The giants were too busy to notice that either the fox or the princess had left. They stumbled through the dark hall, trying to kindle a fire and get the lamps burning again. After a while, one giant finally remembered their prisoner and called through the darkness.
        - id: ch02-b30
          speaker: giant_3
          text: Where is the princess?
        - id: ch02-b31
          speaker: fox
          text: She is right here in my arms. Do not worry. I have her safely.
        - id: ch02-b32
          speaker: narrator
          text: The fox waited until his friends had a long start and had crossed five or six mountains. Then he leaped through the doorway.
        - id: ch02-b33
          speaker: fox
          text: The maiden is over here! Come and take her if you can!
        - id: ch02-b34
          speaker: narrator
          text: Now the giants understood that their prisoner had escaped. They charged after the fox as fast as their enormous legs could carry them. They were sure the chase would be short. Surely the fox had the princess on his back, and that burden must slow him down. But the fox had no princess with him, and he was much too clever to follow the road his friends had taken. He twisted in and out through the forest, drawing the giants farther away, until even he was exhausted.
        - id: ch02-b35
          speaker: narrator
          text: At last he fell asleep beneath a tree. He was so tired that he never heard the giants coming. Their hands were reaching for his tail when his eyes opened. With one tremendous leap, he bounded beyond their grasp.
        - id: ch02-b36
          speaker: narrator
          text: For all the rest of the night, the fox ran and ran. The giants never stopped behind him. When morning came and bright red light spread across the eastern sky, the fox halted. He waited where he stood until the giants were almost close enough to seize him. Then he turned to face them and spoke in a quiet voice.
        - id: ch02-b37
          speaker: fox
          text: Look. There is the Sister of the Sun.
          emotion: calm
        - id: ch02-b38
          speaker: narrator
          text: Every giant looked up at once. In that instant, all of them turned into pillars of stone. The fox bowed low to each pillar and set off after his friends.
        - id: ch02-b39
          speaker: narrator
          text: He knew many shortcuts across the hills and soon caught up. Then the fox, the boy, the traveler, and the rescued princess journeyed night and day until they reached the castle of the Sister of the Sun.
    - id: ch03
      title: The Bride Across the Sea
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Joy swept through the whole palace when the lost princess appeared. Everyone had mourned her as dead and believed they would never see her again. Now every room filled with celebration, and a great feast was prepared. The people welcomed all four travelers, and they could not praise the gardener's son enough for facing such dangers to bring the princess home.
        - id: ch03-b02
          speaker: narrator
          text: The Sister of the Sun gave him the golden hen at once. She promised something more. In a few years, when he was older, she would travel to his home and become his wife. The boy could hardly believe such happiness awaited him. She was the most beautiful princess in the world. No matter how deep the darkness, it fled before the light of the star on her forehead.
        - id: ch03-b03
          speaker: narrator
          text: The boy began the long journey home with his friends beside him. Whenever he thought of the princess's promise, gladness filled his heart. But the companions were not all going to his country. One by one, they said farewell at the very places where he had first met them. The rescued princess left the road, then the traveler, and at last the faithful fox. By the time the young man reached his native town and stood before the palace gates, he was alone.
        - id: ch03-b04
          speaker: narrator
          text: He carried the golden hen before the king and told every adventure. He also told of the wondrous princess who would become his wife, and of the star on her forehead that could turn night into day. The king listened in silence.
        - id: ch03-b05
          speaker: king
          text: If I discover that any part of this story is false, I will have you thrown into a barrel of pitch.
        - id: ch03-b06
          speaker: gardener_boy
          text: Every word is true. My bride has even chosen the day and hour when she will come for me.
        - id: ch03-b07
          speaker: narrator
          text: But the promised time drew near, and no news came. The youth grew more uneasy each day. Then he heard that the great barrel was being filled with pitch and that firewood was stacked beneath it.
        - id: ch03-b08
          speaker: narrator
          text: All day he stood at a window and searched the sea, because the princess would have to cross it to reach him. Again and again he looked toward the horizon. There was no sign of her, not even the smallest white sail. At last soldiers came, seized him, and led him to the barrel. A huge fire was blazing underneath. The horrible black pitch boiled inside and bubbled over the rim.
        - id: ch03-b09
          speaker: narrator
          text: The youth stared and shuddered. There was no way to escape, so he closed his eyes. The order had just been given for him to climb the steps to the top when several men came running at full speed.
        - id: ch03-b10
          speaker: messenger
          text: A great ship is sailing straight toward the city! Every sail is spread!
          emotion: surprised
        - id: ch03-b11
          speaker: narrator
          text: No one knew the ship or where it came from. The king decided the boy would not be burned until it arrived. There would always be time for that afterward.
        - id: ch03-b12
          speaker: narrator
          text: At last the vessel entered the harbor safely. A whisper ran through the watching crowd and grew as it passed from person to person. The Sister of the Sun was aboard. She had crossed the sea to marry the young gardener's son just as she had promised. A few moments later, she stepped onto the shore. She asked at once to be shown the cottage her bridegroom had described to her so many times. At the first sign of her ship, the king had already ordered that the youth be led back there.
        - id: ch03-b13
          speaker: narrator
          text: She found him lying in the cottage, nearly senseless with terror, and bent over him.
        - id: ch03-b14
          speaker: sister_of_sun
          text: Do you not know me?
        - id: ch03-b15
          speaker: gardener_boy
          text: No. No, I do not know you.
          emotion: fearful
        - id: ch03-b16
          speaker: narrator
          text: He would not even lift his eyes.
        - id: ch03-b17
          speaker: sister_of_sun
          text: Then kiss me.
        - id: ch03-b18
          speaker: narrator
          text: The youth obeyed, but he still did not look up.
        - id: ch03-b19
          speaker: sister_of_sun
          text: Do you know me now?
        - id: ch03-b20
          speaker: gardener_boy
          text: No, I do not know you. I do not know you!
          emotion: fearful
        - id: ch03-b21
          speaker: narrator
          text: He spoke like a man driven out of his mind by fear. Now the Sister of the Sun became frightened too. She began at the beginning and told him how they had met, and how far she had traveled in order to marry him.
        - id: ch03-b22
          speaker: narrator
          text: Just as she finished, the king entered the cottage to learn whether the boy's tale was true. The light inside nearly blinded him. He remembered the story of the star on the princess's forehead and staggered backward as if struck. Then a feeling he had never known took hold of him. He fell to his knees before her.
        - id: ch03-b23
          speaker: king
          text: Forget this peasant boy. Marry me instead, and share my throne.
        - id: ch03-b24
          speaker: narrator
          text: The Sister of the Sun laughed at him.
        - id: ch03-b25
          speaker: sister_of_sun
          text: If I wanted a throne, I have a finer one of my own. I am free to choose, and I will marry no one but this young man. If not for you, I would never have met him at all. We shall marry tomorrow. Begin the preparations now.
        - id: ch03-b26
          speaker: narrator
          text: The next day, however, the gardener told the princess that the law required the king to witness the marriage. He hoped his majesty would not keep them waiting long.
        - id: ch03-b27
          speaker: gardener
          text: Your Highness may choose freely, but my son is still the king's subject. By the law of this land, the wedding must take place before him.
        - id: ch03-b28
          speaker: narrator
          text: An hour passed, and then another. The wedding company waited and watched the road for the king. At last they heard trumpets in the distance. A grand procession appeared and marched slowly up the street. A chair covered in velvet had been prepared for his majesty. The king took his seat, looked around at the bride, the bridegroom, and everyone assembled there, and finally began to speak.
        - id: ch03-b29
          speaker: king
          text: I do not forbid the marriage. Before I allow it, however, the bridegroom must prove he deserves such a bride by completing three tasks. His first task is to cut down every tree in an entire forest before this day is over.
        - id: ch03-b30
          speaker: narrator
          text: The youth stared in horror. He had never cut down even one tree and did not know how to begin. A whole forest was beyond imagining. The princess saw his thoughts and whispered to him.
    - id: ch04
      title: The King's Three Tasks
      blocks:
        - id: ch04-b01
          speaker: sister_of_sun
          text: Do not be afraid. There is an axe aboard my ship. Carry it to the forest. Cut down one tree, then say, "So let the forest fall." Every other tree will fall at once. But remember to pick up three chips from the tree you cut and put them in your pocket.
          emotion: calm
        - id: ch04-b02
          speaker: narrator
          text: The young man followed every instruction. Before long, he returned with three wood chips safe inside his coat.
        - id: ch04-b03
          speaker: narrator
          text: The next morning, the princess said she had considered the matter. She was not the king's subject, so his laws did not bind her. She meant to marry that very day. The gardener warned her that his son was a subject, and disobedience would cost him his head.
        - id: ch04-b04
          speaker: gardener
          text: You may speak that way, Princess, but my son cannot. Still, after what he achieved yesterday, perhaps the king will soften. I have sent word, and he should be here soon.
        - id: ch04-b05
          speaker: narrator
          text: The couple had to be as patient as they could. The king soon arrived, and one look at his face told them to expect no kindness.
        - id: ch04-b06
          speaker: king
          text: There will be no wedding until this youth has set every fallen tree back upon its roots.
        - id: ch04-b07
          speaker: narrator
          text: This sounded harder than the first task. The young man turned to the Sister of the Sun in despair.
        - id: ch04-b08
          speaker: sister_of_sun
          text: All will be well. Take this water and sprinkle it over one fallen tree. Say, "So let all the trees of the forest stand upright." In a moment, the whole forest will rise again.
          emotion: calm
        - id: ch04-b09
          speaker: narrator
          text: Once more, the young man did exactly as she said. When he left the forest, it looked just as it had before a single tree was cut.
        - id: ch04-b10
          speaker: narrator
          text: Surely there could be no reason to delay the wedding now, the princess thought. She ordered everything prepared for the following day. Once again, the gardener interfered. Without royal permission, he said, no marriage could take place.
        - id: ch04-b11
          speaker: narrator
          text: The king was summoned for a third time. For a third time, he refused his consent. The bridegroom must first kill a serpent living in the broad river behind the castle.
        - id: ch04-b12
          speaker: narrator
          text: Everyone knew frightening tales about the creature, though no one had seen it. Now and then a child wandered away and never returned. Afterward, mothers warned every other child to stay back from the river, even though juicy fruit and lovely flowers grew along its banks.
        - id: ch04-b13
          speaker: narrator
          text: No wonder the young man trembled and turned pale. The Sister of the Sun pressed his hand and spoke softly.
        - id: ch04-b14
          speaker: sister_of_sun
          text: You will succeed again. My ship carries a magic sword that can cut through anything. Go to the river and untie the boat moored there. Throw your three wood chips into the water. When the serpent rises, cut off all three heads with one stroke. Take the tip of each tongue. Tomorrow morning, carry them into the king's kitchen.
          emotion: calm
        - id: ch04-b15
          speaker: sister_of_sun
          text: If the king enters, tell him, "Here are three gifts in return for the services you demanded of me." Throw the tongue tips at him and run to the ship as fast as you can. Whatever happens, never look behind you.
        - id: ch04-b16
          speaker: narrator
          text: The young man obeyed. When he cast the three chips into the river, they became a boat. He steered into the stream. The serpent raised its body and hissed. His sword was ready. One stroke sent all three heads bobbing on the water.
        - id: ch04-b17
          speaker: narrator
          text: He guided the boat beside the heads, bent down, and cut off the three tongue tips. Then he rowed back to shore.
        - id: ch04-b18
          speaker: narrator
          text: The following morning, he carried them into the royal kitchen. As usual, the king came in to inspect what would be served for dinner.
        - id: ch04-b19
          speaker: gardener_boy
          text: Here are three gifts for you in return for the services you demanded of me!
        - id: ch04-b20
          speaker: narrator
          text: The bridegroom flung the serpent's tongue tips into the king's face, opened the kitchen door, and fled toward the ship. But in his excitement he missed the road. He ran one way, then another, with no idea where he was going.
        - id: ch04-b21
          speaker: narrator
          text: At last, in despair, he looked back. To his amazement, the city and palace had completely vanished. When he turned the other way, he saw the ship far in the distance. Its sails were spread, and a fair wind carried it away.
        - id: ch04-b22
          speaker: narrator
          text: The dreadful sight robbed him of his senses. He wandered all day without knowing where his feet were taking him. Toward evening, smoke rose from a little turf hut nearby. He went to its door and called out.
    - id: ch05
      title: The Road to the Banka
      blocks:
        - id: ch05-b01
          speaker: gardener_boy
          text: Mother, please have pity and let me come inside!
        - id: ch05-b02
          speaker: narrator
          text: The old woman who lived there beckoned him in. He had barely crossed the threshold before another question burst from him.
        - id: ch05-b03
          speaker: gardener_boy
          text: Mother, do you know anything about the Sister of the Sun?
        - id: ch05-b04
          speaker: first_woman
          text: No, I know nothing about her.
        - id: ch05-b05
          speaker: narrator
          text: The young man turned toward the door. The old woman stopped him and handed him a letter for her next eldest sister.
        - id: ch05-b06
          speaker: first_woman
          text: Please carry this to my sister. If the journey tires you, take out the letter and rustle the paper.
        - id: ch05-b07
          speaker: narrator
          text: The advice puzzled him. He could not imagine how rustling paper could help, but he said nothing and returned to the road. He still did not know where he was going.
        - id: ch05-b08
          speaker: narrator
          text: At last he became too tired to take another step. Then he remembered the letter. He rustled its pages once, and every trace of weariness vanished. He strode across the grass until he reached another small turf hut.
        - id: ch05-b09
          speaker: gardener_boy
          text: Dear mother, please let me in.
        - id: ch05-b10
          speaker: narrator
          text: The door opened before him.
        - id: ch05-b11
          speaker: gardener_boy
          text: Your sister sent you this letter. And please, can you tell me anything about the Sister of the Sun?
        - id: ch05-b12
          speaker: second_woman
          text: No, I know nothing about her.
        - id: ch05-b13
          speaker: narrator
          text: He turned away without hope, but the second woman called him back.
        - id: ch05-b14
          speaker: second_woman
          text: If you pass the house of our eldest sister, will you give her this letter? If you grow tired, take it from your pocket and rustle the paper.
        - id: ch05-b15
          speaker: narrator
          text: He put the new letter away and walked over the hills for the whole day. At last he found a third turf hut, exactly like the first two.
        - id: ch05-b16
          speaker: gardener_boy
          text: Dear mother, please let me in. I have a letter from your sister. Can you tell me anything about the Sister of the Sun?
        - id: ch05-b17
          speaker: eldest_woman
          text: Yes, I can. She lives in the castle on the Banka. Only a few days ago, her father lost a battle because you had taken his magic sword. The Sister of the Sun is nearly dead from grief.
        - id: ch05-b18
          speaker: eldest_woman
          text: When you reach her, prick the palm of her hand with a pin and suck the drops of blood that appear. She will become calmer and recognize you. But take care. Fearful things will happen before you reach the castle on the Banka.
        - id: ch05-b19
          speaker: narrator
          text: Tears of gladness filled the young man's eyes. He thanked the old woman for the news and continued on his way.
        - id: ch05-b20
          speaker: narrator
          text: Before he had gone far, he rounded a bend and met two brothers fighting over a ragged piece of cloth.
        - id: ch05-b21
          speaker: gardener_boy
          text: Good men, why quarrel over that? The cloth does not look worth very much.
        - id: ch05-b22
          speaker: brother_1
          text: It may be ragged, but our father left it to us.
        - id: ch05-b23
          speaker: brother_2
          text: Anyone who wraps it around himself becomes invisible. We both want it.
        - id: ch05-b24
          speaker: gardener_boy
          text: Let me wear it for a moment. Then I will decide which brother should own it.
        - id: ch05-b25
          speaker: narrator
          text: The brothers liked his proposal and handed over the cloth. The instant he threw it around his shoulders, he disappeared as completely as if he had never stood there.
        - id: ch05-b26
          speaker: narrator
          text: Carrying the invisible cloth, the young man walked briskly onward. Soon he found two other men arguing over a tablecloth.
        - id: ch05-b27
          speaker: gardener_boy
          text: What are you two fighting about?
        - id: ch05-b28
          speaker: cloth_man_1
          text: Spread this cloth over a table, and delicious food appears at once.
        - id: ch05-b29
          speaker: cloth_man_2
          text: And each of us says it ought to be his.
        - id: ch05-b30
          speaker: gardener_boy
          text: Let me test the tablecloth. After that, I can tell you who should keep it.
        - id: ch05-b31
          speaker: narrator
          text: This pair also thought the plan was fair and gave it to him. The young man quickly wrapped the first cloth around his shoulders and disappeared, leaving them to grieve over their foolishness.
        - id: ch05-b32
          speaker: narrator
          text: Not much farther down the road, two more men stood gripping the same thick staff. First one nearly pulled it free, then the other.
        - id: ch05-b33
          speaker: gardener_boy
          text: Why fight over one stick? The woods could give each of you a dozen just as good.
        - id: ch05-b34
          speaker: narrator
          text: Both men stopped tugging and looked at him.
        - id: ch05-b35
          speaker: staff_man_1
          text: You might think that, but one end of this staff can kill a man with a single blow.
        - id: ch05-b36
          speaker: staff_man_2
          text: Touch him with the other end, and it brings him back to life. You will not find another staff like ours.
        - id: ch05-b37
          speaker: gardener_boy
          text: That does make a difference. Let me examine it, and I will decide who ought to have it.
        - id: ch05-b38
          speaker: narrator
          text: They handed him the staff.
        - id: ch05-b39
          speaker: gardener_boy
          text: It is certainly strange. Which end restores the dead? A hard enough blow from almost any stick can kill someone.
        - id: ch05-b40
          speaker: narrator
          text: The men showed him the end that gave life. At once he wrapped the invisible cloth around himself and vanished with the staff.
        - id: ch05-b41
          speaker: narrator
          text: At last he came upon another pair of men struggling over some shoes.
        - id: ch05-b42
          speaker: gardener_boy
          text: Why not leave those worn-out shoes alone? They look too old to carry anyone a single yard.
        - id: ch05-b43
          speaker: shoe_man_1
          text: They are old, but they can take you anywhere.
        - id: ch05-b44
          speaker: shoe_man_2
          text: Put them on, wish for a place, and you arrive without having to walk there.
        - id: ch05-b45
          speaker: gardener_boy
          text: That sounds remarkable. Let me try them. Then I can judge who should own them.
        - id: ch05-b46
          speaker: narrator
          text: The men were pleased with the idea and handed him the shoes. The moment they were on his feet, he called out his wish.
        - id: ch05-b47
          speaker: gardener_boy
          text: I wish to be in the castle on the Banka!
        - id: ch05-b48
          speaker: narrator
          text: Before he could think another thought, he stood inside the castle. There lay the Sister of the Sun, dying from grief.
    - id: ch06
      title: The Castle on the Banka
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: The young man knelt beside her. He took a pin, pricked her palm, and drew out a drop of blood. As the eldest woman had instructed, he sucked the drop away. At once the princess came to herself and threw her arms around his neck.
        - id: ch06-b02
          speaker: narrator
          text: She told him everything that had happened since the ship sailed without him.
        - id: ch06-b03
          speaker: sister_of_sun
          text: The worst disaster was the battle my father lost. You had vanished with his magic sword, and almost no one in his entire army survived.
          emotion: sad
        - id: ch06-b04
          speaker: gardener_boy
          text: Take me to the battlefield.
        - id: ch06-b05
          speaker: narrator
          text: The Sister of the Sun led him to a wild heath. The dead soldiers still lay where they had fallen, waiting to be buried. The young man went among them and touched each one with the life-giving end of his staff. One after another, they rose and stood before him.
        - id: ch06-b06
          speaker: narrator
          text: Joy filled the whole kingdom. This time, the wedding truly took place.
        - id: ch06-b07
          speaker: narrator
          text: The Sister of the Sun and the gardener's son lived happily together in the castle on the Banka for the rest of their lives.
