audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, grave, and attentive to wonder
        timbre: clear and resonant
        pace: measured
        pitch: medium
    rat_father:
      display_name: Rat Father
      tts:
        delivery: practical, proud, and easily exasperated
        timbre: small and seasoned
        pace: measured
        pitch: medium-low
    rat_mother:
      display_name: Rat Mother
      tts:
        delivery: grand, determined, and openly ambitious
        timbre: bright and polished
        pace: brisk
        pitch: medium-high
    rat_daughter:
      display_name: Rat Daughter
      tts:
        delivery: dutiful, tender, and suddenly resolute
        timbre: young and clear
        pace: measured
        pitch: high
    sun:
      display_name: Sun
      tts:
        delivery: courteous, dignified, and tactfully distant
        timbre: radiant and full
        pace: measured
        pitch: medium
    cloud:
      display_name: Cloud
      tts:
        delivery: modest, airy, and gracious
        timbre: soft and floating
        pace: unhurried
        pitch: medium-high
    wind:
      display_name: Wind
