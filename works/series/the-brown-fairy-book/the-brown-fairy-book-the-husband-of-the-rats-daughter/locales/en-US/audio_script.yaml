  chapters:
    - id: ch01
      title: A Husband Above All Others
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long ago in Japan, a rat and his wife lived with their only daughter. They came from an old and noble family, and they believed their daughter was the loveliest girl in the whole rat world. They were very proud of her. They took care to teach her everything a young rat lady ought to know.
        - id: ch01-b02
          speaker: narrator
          text: No other young lady in town could gnaw through the hardest wood so cleverly. None could drop from so high onto a bed, or run away so quickly at the sound of someone coming. Her parents cared just as much about her looks. Her skin gleamed like satin, and her pointed teeth were as white as pearls.
        - id: ch01-b03
          speaker: narrator
          text: With so much beauty and talent, her parents expected her to make a splendid marriage. As she grew older, they began searching for the right husband. That was when their trouble began.
        - id: ch01-b04
          speaker: narrator
          text: The father was a rat through and through, from the end of his nose to the tip of his tail. He wanted his daughter to marry one of her own people. She had plenty of admirers, but he secretly favored one fine young rat. The young fellow's moustaches nearly brushed the ground, and his family was even older and nobler than theirs.
        - id: ch01-b05
          speaker: narrator
          text: The mother had very different plans for her precious child. She looked down on her own relations and surroundings. She liked to imagine that she was made of finer stuff than everyone else.
        - id: ch01-b06
          speaker: rat_mother
          text: My daughter will never marry an ordinary rat. With all her beauty and talent, she deserves someone far better than that!
        - id: ch01-b07
          speaker: narrator
          text: She said the same thing to anyone willing to listen. No one knew what the daughter herself wanted, and no one cared to ask. In the rat world, that simply was not the custom.
        - id: ch01-b08
          speaker: narrator
          text: The old rat and his wife quarreled about the marriage again and again. Sometimes the marks on their faces made it seem that the quarrels had gone beyond words. One day, the mother lost her temper more fiercely than usual.
        - id: ch01-b09
          speaker: rat_mother
          text: Reach for the stars. That is what I always say! Our daughter's beauty raises her above everything on earth. I will certainly not accept a son-in-law who stands beneath her.
          emotion: angry
        - id: ch01-b10
          speaker: rat_father
          text: Then why not offer her to the sun? I know of nothing greater than he is.
        - id: ch01-b11
          speaker: narrator
          text: The father spoke impatiently, but his wife seized on the idea at once.
        - id: ch01-b12
          speaker: rat_mother
          text: I was already thinking of the sun. Since you agree with me, we shall visit him tomorrow.
        - id: ch01-b13
          speaker: narrator
          text: Early the next morning, the two rats spent hours making themselves look their best. Then they set out to see the sun, with their daughter walking between them.
    - id: ch02
      title: The Sun and the Cloud
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Their journey took a long while. At last, they arrived at the golden palace where the sun lived. The mother stepped forward and began her speech.
        - id: ch02-b02
          speaker: rat_mother
          text: Noble king, look upon our daughter. She is so beautiful that she stands above everything in the world. We naturally want a son-in-law who is greater than all others, and that is why we have come to you.
        - id: ch02-b03
          speaker: narrator
          text: The sun was much too busy to want a wife, but he answered with great politeness.
        - id: ch02-b04
          speaker: sun
          text: I am deeply flattered. Your offer does me great honor. But you are mistaken about one thing, and I must not take advantage of what you do not know. The cloud is greater than I am. Just look.
        - id: ch02-b05
          speaker: narrator
          text: As the sun spoke, a cloud passed across his face and shut out every one of his rays. The mother immediately turned her attention to the cloud.
        - id: ch02-b06
          speaker: rat_mother
          text: Very well. Then we shall speak to the cloud.
        - id: ch02-b07
          speaker: narrator
          text: She gave the cloud the same proposal and offered him her daughter as a bride.
        - id: ch02-b08
          speaker: cloud
          text: Such a charming young lady is far above me. But you have made another mistake. The wind is even more powerful than I am. Ah, here he comes now. You can see the truth for yourself.
        - id: ch02-b09
          speaker: narrator
          text: The mother certainly did see. The wind caught the cloud as he rushed past and hurled him clear across to the other side of the sky.
    - id: ch03
      title: The Wind and the Wall
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Then the wind swept up the father, the mother, and their daughter. He tumbled all three back down to earth. For one moment he stopped beside them, resting his foot against an old wall.
        - id: ch03-b02
          speaker: narrator
          text: The mother lay there until she had caught her breath. Then she rose and began her familiar little speech once again.
        - id: ch03-b03
          speaker: wind
          text: The wall is the proper husband for your daughter. You can see that he is greater than I am, because he has the power to stop me while I am flying.
        - id: ch03-b04
          speaker: narrator
          text: The wind's home was a cave, though he only visited it when he was not rushing about somewhere else. The mother made no effort to hide what she wanted. The moment she heard his answer, she turned toward the wall.
    - id: ch04
      title: The Daughter Speaks
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Then something happened that none of them expected. The daughter, who had kept silent through the whole journey, began to sob and finally spoke for herself.
        - id: ch04-b02
          speaker: rat_daughter
          text: I will not marry that ugly old wall. He is as old as my grandfather! I would have married the sun, the cloud, or the wind because it was my duty. But I love the handsome young rat, and I love only him. I would sooner die than marry that horrible old wall!
          emotion: sad
        - id: ch04-b03
          speaker: narrator
          text: The wall felt rather hurt by this. He declared that he had no right to become the husband of such a beautiful girl.
        - id: ch04-b04
          speaker: wall
          text: It is true that I can stop the wind. The wind can scatter the clouds, and the clouds can cover the sun. Yet someone can do more than any of us, and that someone is the rat. A rat can pass straight through me and grind me into powder with nothing but his teeth. If you want a son-in-law who is greater than the whole world, you must look for him among the rats.
        - id: ch04-b05
          speaker: rat_father
          text: Ah! What have I been telling you all along?
        - id: ch04-b06
          speaker: narrator
          text: For a moment, the mother was angry to find that she had lost the argument. Before long, though, she decided that a rat was exactly the sort of son-in-law she had wanted from the beginning.
        - id: ch04-b07
          speaker: narrator
          text: So the father, the mother, and their daughter all returned home happily. Three days later, the wedding was celebrated.
