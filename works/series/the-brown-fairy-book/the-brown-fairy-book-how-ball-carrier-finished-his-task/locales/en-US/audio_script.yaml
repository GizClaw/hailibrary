  chapters:
    - id: ch01
      title: The Race Across the Prairie
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: After Ball-Carrier drowned the Bad One and ended his mischief, he could no longer remember the way to his grandmother's house. He searched everywhere, but never found it. He wandered through strange places and met with many adventures. One day he reached a hut where a young woman lived. Tired and hungry, he asked to come inside and rest. He stayed a long while, and the young woman became his wife.
        - id: ch01-b02
          speaker: narrator
          text: One morning, Ball-Carrier saw two children playing outside. He went to speak to them, but the moment they saw him, they screamed and ran away. His wife explained that they belonged to her sister, who had just returned from a long journey.
        - id: ch01-b03
          speaker: wife
          text: Now my sister knows you are my husband, she means to kill you.
        - id: ch01-b04
          speaker: ball_carrier
          text: Let her try. She is not the first person who has wanted me dead, and I am still here.
        - id: ch01-b05
          speaker: wife
          text: Be careful. She is very cunning.
        - id: ch01-b06
          speaker: narrator
          text: At that very moment, her sister came up to them.
        - id: ch01-b07
          speaker: witch_sister
          text: So you are my brother-in-law. I have heard a great deal about you, and I am glad to meet you at last. They say no man on earth is stronger than you. I have power too, so let us find out which of us is stronger.
        - id: ch01-b08
          speaker: ball_carrier
          text: Gladly. We can begin with a short race, and try something else afterward.
        - id: ch01-b09
          speaker: witch_sister
          text: That suits me. But let us agree on the prize. Whoever wins may kill the other.
        - id: ch01-b10
          speaker: ball_carrier
          text: Certainly. The prairie will give us the flattest course. No one knows how many miles it runs. We will race to the far end and back.
        - id: ch01-b11
          speaker: narrator
          text: They prepared to run. In silence, Ball-Carrier asked the good spirits to help him and keep him from falling into the wicked witch's hands.
        - id: ch01-b12
          speaker: witch_sister
          text: We start when the sun touches the trunk of that tree.
        - id: ch01-b13
          speaker: narrator
          text: They stood side by side and watched the sunlight move down the tree. At the first step, Ball-Carrier became a wolf and raced far ahead. For a long way he held his lead. Then he heard the witch creeping closer behind him, until she passed him. He changed into a pigeon and flew swiftly beyond her. Little by little she gained again, and she was back in front as the far end of the prairie came into sight.
        - id: ch01-b14
          speaker: narrator
          text: A crow could fly faster than a pigeon, he thought. In that shape he passed her and held the lead so long that he believed she was beaten. The witch began to fear the same thing. She called on all her strength and slipped ahead once more. Ball-Carrier became a hawk. In that form he reached the prairie’s boundary, where he and the witch turned toward home at exactly the same moment.
        - id: ch01-b15
          speaker: narrator
          text: He tried one bird after another, yet each time the witch caught him and went in front. Then the goal came into view. If he could not pass her now, she would kill him at his own door while his wife watched. His sight blurred with weariness. His wings beat heavily and could barely carry him, while the witch seemed as fresh as ever.
        - id: ch01-b16
          speaker: narrator
          text: What bird could fly faster? Would the good spirits not tell him? Then he remembered. Why had he not thought of it at the start? In the next instant, a hummingbird dressed in green and blue flashed past the witch and flew into the house.
        - id: ch01-b17
          speaker: narrator
          text: The witch came up panting and furious. She had been certain she would win. Ball-Carrier had already returned to his own shape. He struck her on the head and killed her.
    - id: ch02
      title: The Robin in the Hidden Hut
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: For a long time, Ball-Carrier was content to live quietly with his wife and children. He was tired of adventures and hunted only enough to feed the household. Then one day he ate poisonous berries in the forest. He became so ill that he knew he was dying.
        - id: ch02-b02
          speaker: ball_carrier
          text: When I die, do not bury me in the ground. Lay me over there, among that clump of trees.
        - id: ch02-b03
          speaker: narrator
          text: His wife and her three children stayed beside him for as long as he lived. After his death, they lifted him and carried him to the grove. There they laid his body on a platform of stakes they had prepared among the trees. As they walked back toward the hut, weeping for him, they caught sight of the ball rolling away down the path toward the old grandmother.
        - id: ch02-b04
          speaker: narrator
          text: One son ran to stop it. Ball-Carrier had often told them how the ball had helped him cross the river. But it rolled too quickly to catch. The family could only keep his war club, bow, and arrows, which they put carefully away.
        - id: ch02-b05
          speaker: narrator
          text: Some time later, a company of travelers passed the hut. Their chief asked permission to marry Ball-Carrier's daughter. Her mother said the girl was still very young, so she must have time to think. They agreed that the man would go away with his friends for one month. Then he would return and learn whether the girl herself was willing to marry him.
        - id: ch02-b06
          speaker: narrator
          text: Since Ball-Carrier's death, the family had become very poor and often went hungry. One morning, after having neither supper nor breakfast, the daughter went out to search for cranberries. Close to home, she was astonished to find a large hut that had not been there before.
        - id: ch02-b07
          speaker: narrator
          text: No one was outside, so she peered in. Every kind of food lay heaped in one corner. Above it, a little robin redbreast perched on a beam and looked down at her.
        - id: ch02-b08
          speaker: daughter
          text: I am sure it is my father!
        - id: ch02-b09
          speaker: narrator
          text: The bird answered with a clear little pipe. From then on, whenever the family needed food, they went to the hut. The robin could not speak, but he hopped onto their shoulders, and they fed him the things they knew he liked best.
    - id: ch03
      title: The Husband's Cruel Wish
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: When the man returned, he found the girl much prettier and better fed than before. He insisted on marrying her at once. Her mother did not know how to send him away, so she gave in.
        - id: ch03-b02
          speaker: narrator
          text: The husband spent his days hunting, and the family had more meat than ever. Yet he had seen their poverty, and he wondered why they never seemed hungry or eager for what he brought.
        - id: ch03-b03
          speaker: husband
          text: They must be getting food somewhere else.
        - id: ch03-b04
          speaker: narrator
          text: One morning he pretended to leave for the hunt, then hid in a thicket and watched. Soon the whole family came out and walked together to the other hut. It lay hidden in a hollow, so the husband was seeing it for the first time. He followed them and watched each one go up to the robin and shake him by the claw. Then he entered boldly and shook the bird's claw too. The whole party sat down to dinner together, and afterward they all returned to their own hut.
        - id: ch03-b05
          speaker: narrator
          text: The next day, the husband claimed to be terribly ill and unable to eat. It was only a pretense to get what he wanted. The family grew distressed and begged him to name some food he might fancy.
        - id: ch03-b06
          speaker: husband
          text: Oh, I could not eat anything.
        - id: ch03-b07
          speaker: narrator
          text: Each time he answered, his voice became fainter. They began to think he would die of weakness before their eyes.
        - id: ch03-b08
          speaker: daughter
          text: There must be something you could eat. Please, just tell me what it is.
        - id: ch03-b09
          speaker: husband
          text: Nothing at all. Unless perhaps—but no. That would be impossible.
        - id: ch03-b10
          speaker: daughter
          text: I am sure it is not impossible. I promise you shall have it. Only tell me.
        - id: ch03-b11
          speaker: husband
          text: I could never ask such a thing of you. Leave me alone, and let me die quietly.
        - id: ch03-b12
          speaker: daughter
          text: You will not die. Whatever it is, I will find a way to get it for you.
        - id: ch03-b13
          speaker: narrator
          text: She loved her husband dearly because, unlike most husbands the girls knew, he did not beat her.
        - id: ch03-b14
          speaker: husband
          text: Well, then. If I had that redbreast roasted nicely, I think I could eat a little piece of his wing.
        - id: ch03-b15
          speaker: narrator
          text: His wife recoiled in horror. The man turned his face to the wall and ignored her, thinking it best to leave her alone with the request.
        - id: ch03-b16
          speaker: narrator
          text: Weeping and wringing her hands, the daughter went to her mother. Her brothers were furious when they heard what the husband wanted.
        - id: ch03-b17
          speakers: [son_1, son_2]
          ensemble: duo
          text: If someone must die, it will not be the robin!
          emotion: angry
        - id: ch03-b18
          speaker: narrator
          text: But all through the night, the man seemed to grow weaker and weaker. His faint voice and helpless manner wore down his wife's resolve. At last, very early in the morning, she crept outside without the others. She stole to the hidden hut, killed the bird, and carried him home to the husband she believed she was saving.
        - id: ch03-b19
          speaker: narrator
          text: She was about to cook the robin when her brothers entered. At the sight of him, they cried out in horror and rushed from the hut.
        - id: ch03-b20
          speakers: [son_1, son_2]
          ensemble: duo
          text: We will never see you again!
          emotion: angry
        - id: ch03-b21
          speaker: narrator
          text: With a heavy heart, the poor girl took the redbreast's body to her husband. The instant she entered, he said he felt much better.
        - id: ch03-b22
          speaker: husband
          text: I would rather have some bear meat, boiled well. I do not want any bird, however tender it may be.
        - id: ch03-b23
          speaker: narrator
          text: His wife was miserable. Their beloved redbreast had died for nothing.
        - id: ch03-b24
          speaker: daughter
          text: You were so certain it would help you. Please try a little. I still think it might cure you completely.
        - id: ch03-b25
          speaker: narrator
          text: The man flew into a rage. He threw the bird out of the window, got up, and walked away.
    - id: ch04
      title: The Grandmother Follows the Ball
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: All this time, the ball had been rolling and rolling toward the old grandmother's hut on the other side of the world. The moment it came inside, she knew her grandson was dead.
        - id: ch04-b02
          speaker: narrator
          text: She wasted no time. She tied one fox skin around her forehead and another around her waist, as witches did when leaving home. Then she spoke to the ball.
        - id: ch04-b03
          speaker: grandmother
          text: Go back the way you came. Lead me to my grandson.
        - id: ch04-b04
          speaker: narrator
          text: The ball rolled away, and the old woman followed. Even for a witch, the journey was long. But at last she stood before the platform of stakes where Ball-Carrier's body lay.
        - id: ch04-b05
          speaker: grandmother
          text: Wake up, my grandson. It is time to go home.
        - id: ch04-b06
          speaker: narrator
          text: At her command, Ball-Carrier woke and stepped down from the platform as though rising from an ordinary sleep. He went into the family hut and brought out the war club, bow, and arrows that had been stored there so carefully. Then he set off behind the old woman, leaving the grove and traveling toward her home on the other side of the world.
        - id: ch04-b07
          speaker: narrator
          text: They came to the hut where Ball-Carrier had fasted many years before. For the first time since their journey began, the grandmother spoke.
        - id: ch04-b08
          speaker: grandmother
          text: My grandson, did you ever get the gold from the Bad One?
        - id: ch04-b09
          speaker: ball_carrier
          text: Yes, grandmother. I got it.
        - id: ch04-b10
          speaker: grandmother
          text: Where is it?
        - id: ch04-b11
          speaker: ball_carrier
          text: Here, under my left arm.
        - id: ch04-b12
          speaker: narrator
          text: She took a knife and scraped away all the gold stuck to his skin. It had remained there ever since he first stole it. When she had gathered every bit, she questioned him again.
        - id: ch04-b13
          speaker: grandmother
          text: My grandson, did you also get the bridge from the Bad One?
        - id: ch04-b14
          speaker: ball_carrier
          text: Yes, grandmother. I got that too.
        - id: ch04-b15
          speaker: grandmother
          text: Where is it?
        - id: ch04-b16
          speaker: narrator
          text: Ball-Carrier raised his right arm and pointed beneath it.
        - id: ch04-b17
          speaker: ball_carrier
          text: The bridge is here, grandmother.
    - id: ch05
      title: The Task Is Finished
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Then the grandmother did something no one in the world could have guessed. She took the gold and spoke to Ball-Carrier.
        - id: ch05-b02
          speaker: grandmother
          text: My grandson, this gold must be hidden in the earth. If people believe they can take it whenever they wish, they will grow lazy and foolish. We will bury it in different parts of the world. Anyone who wants it must work, and will find only a little at a time.
        - id: ch05-b03
          speaker: narrator
          text: As she spoke, she pulled up one of the poles that held the hut. Beneath it, Ball-Carrier saw a deep, deep hole that seemed to have no bottom. His grandmother poured in all the gold. Once it disappeared from sight, it ran beneath the earth into every part of the world. That is why people who dig hard sometimes find a little of it. When the gold was gone, she set the pole back in its place.
        - id: ch05-b04
          speaker: narrator
          text: Next she took a rusty spade from a high shelf. On the other side of the hut, she dug a hole that was very small, but very deep.
        - id: ch05-b05
          speaker: grandmother
          text: Give me the bridge. I will bury it here. If anyone could take it and cross every river and sea without trouble, people would never learn how to cross for themselves.
        - id: ch05-b06
          speaker: grandmother
          text: I am a witch. If I had chosen, I could have cast a spell on the Bad One and forced him to give you the gold and bridge on your first day here. But then you would never have fasted. You would never have planned how to win what you needed, or come to know the good spirits. You would have stayed fat and idle all your life.
        - id: ch05-b07
          speaker: grandmother
          text: Now go. In the hut you can see far away live your father and mother. They are old now, and they need a son to hunt for them. You have done what you were set to do, and I need you no more.
        - id: ch05-b08
          speaker: narrator
          text: Then Ball-Carrier remembered his parents, and he went home to them.
