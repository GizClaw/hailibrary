audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 清楚从容，像在为听众介绍一本古老的童话集
        timbre: 温暖明净
        pace: 舒缓
        pitch: 中音
    ball_carrier:
      display_name: 持球童
      tts: {delivery: 机灵勇敢，话语干脆, timbre: 清亮稚嫩, pace: 适中, pitch: 中高音}
    witch:
      display_name: 老女巫
      tts: {delivery: 亲热中带着神秘与算计, timbre: 苍老低哑, pace: 缓慢, pitch: 中低音}
    wife:
      display_name: 持球童的妻子
      tts: {delivery: 温柔谨慎，语气真挚, timbre: 柔和温暖, pace: 适中, pitch: 中音}
    witch_sister:
      display_name: 女巫姐姐
      tts: {delivery: 表面客气，骨子里争强好胜又凶险, timbre: 坚硬低沉, pace: 适中, pitch: 中低音}
    daughter:
      display_name: 持球童的女儿
      tts: {delivery: 善良轻信，情感真切, timbre: 年轻清澈, pace: 适中, pitch: 中高音}
    son_1:
      display_name: 持球童的大儿子
      tts: {delivery: 忠诚急切，脾气直爽, timbre: 年轻清亮, pace: 稍快, pitch: 中音}
    son_2:
      display_name: 持球童的小儿子
      tts: {delivery: 忠诚急切，脾气直爽, timbre: 年轻轻快, pace: 稍快, pitch: 中高音}
    husband:
      display_name: 女儿的丈夫
      tts: {delivery: 虚伪算计，要求别人时故作虚弱, timbre: 平滑干涩, pace: 适中, pitch: 中低音}
  chapters:
    - id: ch01
      title: 草原上的赛跑
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            持球童淹死恶魔以后，再也记不起通往外祖母家的路。他四处寻找，始终没能找到。那些日子里，他走过许多奇异的地方，也经历了许多冒险。一天，他来到一间小屋，又累又饿，便请求屋里的年轻姑娘让自己进去歇歇。他后来在那里住了很久，姑娘也成了他的妻子。
        - id: ch01-b02
          speaker: narrator
          text: >-
            一天早晨，持球童看见两个孩子在屋前玩，就出去跟他们说话。孩子们一见他，却吓得尖叫起来，转身就跑。妻子告诉他，那是她姐姐的孩子。姐姐刚从远方回来，已经知道持球童成了自己的妹夫。
        - id: ch01-b03
          speaker: wife
          text: 我姐姐现在想杀了你。
        - id: ch01-b04
          speaker: ball_carrier
          text: 那就让她试试。想杀我的人又不止她一个。你看，我不是还站在这里吗？
        - id: ch01-b05
          speaker: wife
          text: 你可要当心。她非常狡猾。
        - id: ch01-b06
          speaker: narrator
          text: 她才说完，姐姐便走到了两人面前。
        - id: ch01-b07
          speaker: witch_sister
          text: 妹夫，你好！我听人说起过你好多次，今天总算见到了。大家都说，你比世上所有男子都有力量。我也有些本领，咱们不如比一比，看看到底谁更强。
        - id: ch01-b08
          speaker: ball_carrier
          text: 好极了。我们先跑一小段，再比别的，怎么样？
        - id: ch01-b09
          speaker: witch_sister
          text: 很好。不过咱们得先说定，赢的人有权杀掉输的人。
        - id: ch01-b10
          speaker: ball_carrier
          text: 没问题。我看大草原最平坦，没有人知道它有多少英里长。我们就跑到草原尽头，再跑回来。
        - id: ch01-b11
          speaker: narrator
          text: >-
            两人就这样定下了比赛。准备的时候，持球童默默求善良的神灵帮忙，别让自己落到这个恶毒的女巫手里。
        - id: ch01-b12
          speaker: witch_sister
          text: 等太阳照到那棵树的树干上，咱们就出发。
        - id: ch01-b13
          speaker: narrator
          text: >-
            两人并肩等着。才跑出第一步，持球童就变成一匹狼，远远冲在前面。可是女巫一点点追了上来，很快便超过了他。他马上化作鸽子，从女巫身边飞掠过去。没多久，女巫又赶到了前头，这时草原的尽头也已经在望。
        - id: ch01-b14
          speaker: ball_carrier
          text: 乌鸦飞得比鸽子快。
        - id: ch01-b15
          speaker: narrator
          text: >-
            于是他又化作乌鸦，超过女巫，还领先了好长一段路。他以为这回女巫准输了，女巫自己也开始害怕，便使出全部力气，再次滑到他前面。持球童又变成一只鹰。两人几乎同时抵达草原边界，也同时掉头往回赶。
        - id: ch01-b16
          speaker: narrator
          text: >-
            持球童接连变成一种又一种飞鸟，可每一次，女巫都会追上他，抢到前面。眼看终点越来越近，他知道现在若还不能领先，就会在自家门口、妻子的眼前被杀死。他累得眼前发黑，翅膀沉重地拍着，几乎再也托不住身体。女巫却还是精神十足。到底还有什么鸟能飞得更快？善良的神灵为什么不告诉他？
        - id: ch01-b17
          speaker: ball_carrier
          text: 啊，我知道了！怎么没有早点想到，害我白白累了这么久？
        - id: ch01-b18
          speaker: narrator
          text: >-
            转眼间，一只披着绿蓝羽衣的蜂鸟像闪电一样掠过女巫，飞进小屋。女巫喘着粗气赶到门前。她本以为自己一定会赢，现在输了，气得发狂。持球童已经变回原形。他朝女巫头上猛击一下，把她杀死了。
    - id: ch02
      title: 知更鸟的小屋
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            此后很长一段时间，持球童和妻儿安静地住在家里。他已经厌倦冒险，打猎也只求够全家吃。可是一天，他误食了森林里的毒浆果，病得很重，觉得自己快要死了。
        - id: ch02-b02
          speaker: ball_carrier
          text: 我死以后，别把我埋进土里。把我放到那边的树丛中。
        - id: ch02-b03
          speaker: narrator
          text: >-
            妻子和三个孩子一直守着他，直到他咽下最后一口气。他们把持球童抬进树林，放到一座用木桩搭起的高台上。回家时，大家一路哭泣，忽然看见魔球顺着小路滚远了。它正朝老外祖母那里回去。一个儿子赶紧去拦，因为父亲常说起这只球怎样帮助自己渡河。可是魔球太快了。孩子们追不上，只能留下战棒、弓和箭，把它们仔细收好。
        - id: ch02-b04
          speaker: narrator
          text: >-
            后来，一队旅行者经过这里。为首的男子提出，要娶持球童的女儿。母亲说女儿还小，自己得想一想。于是男子和同伴先离开一个月，约好回来时再问姑娘愿不愿意。
        - id: ch02-b05
          speaker: narrator
          text: >-
            父亲去世以后，这一家非常贫穷，常常吃不饱。一天早晨，姑娘头天没吃晚饭，当天也没吃早饭，只好出门寻找蔓越莓。她其实还在家附近，却发现一间大屋。上一次走过这里时，明明还没有这间屋。四周一个人也没有，她便壮着胆子探头往里看。屋角堆满各式各样的食物，一只小知更鸟栖在横梁上，正低头看她。眼前的一切让她更加惊奇。
        - id: ch02-b06
          speaker: daughter
          text: 我敢肯定，这就是父亲！
          emotion: surprised
        - id: ch02-b07
          speaker: narrator
          text: >-
            小鸟啾啾叫着回应她。从此以后，家里一缺食物，他们就去那间屋。知更鸟虽然不会说话，却会跳到他们肩上。大家知道它最爱吃什么，每次都会拿那些食物来喂它。
        - id: ch02-b08
          speaker: narrator
          text: >-
            一个月后，那个男子和同伴们回来了。姑娘比他离开时丰满漂亮了许多，他便坚持当场成婚，一刻也不肯再等。母亲想不出办法打发他，只得答应。婚后，丈夫每天都去打猎，家里的肉多得从来没有过。可他知道这家人以前穷成什么样，如今却发现他们不稀罕这些肉，也从来不饿，心中十分奇怪。
        - id: ch02-b09
          speaker: husband
          text: 他们一定还从别的地方弄到了食物。
        - id: ch02-b10
          speaker: narrator
          text: >-
            一天早晨，他假装出去打猎，其实躲在灌木丛里监视。没过多久，一家人便一同走向另一间屋。屋子藏在洼地里，难怪他以前从没见过。他悄悄跟上去，看见每个人都走到知更鸟面前，握住它的爪子摇一摇。等他们都问候过小鸟，他也大模大样地走进去，照样同它握了握爪。接着，所有人一起坐下吃饭，吃完才回到自己的小屋。
        - id: ch02-b11
          speaker: narrator
          text: >-
            第二天，丈夫说自己病得很厉害，什么也吃不下。其实他只是在装病，想借此得到自己看中的东西。一家人都急坏了，求他说说到底想吃什么。
        - id: ch02-b12
          speaker: husband
          text: 唉，我什么也吃不下。
        - id: ch02-b13
          speaker: narrator
          text: >-
            每问一次，他的声音就更微弱一点。最后，大家都以为他会在眼前虚弱而死。
        - id: ch02-b14
          speaker: daughter
          text: 总会有一样东西是你吃得下的。求你告诉我，那是什么。
        - id: ch02-b15
          speaker: husband
          text: 没有，什么也没有。除非……可那当然办不到！
        - id: ch02-b16
          speaker: daughter
          text: 不，一定办得到。我答应你，不管是什么，我都会弄来。你只要说出来。
        - id: ch02-b17
          speaker: husband
          text: 我倒想起一样，可我怎么能叫你做那种事？别管我了，让我安静地死吧。
        - id: ch02-b18
          speaker: narrator
          text: 姑娘很爱丈夫，因为他不像大多数姑娘的丈夫那样打她。
        - id: ch02-b19
          speaker: daughter
          text: 我不会让你死。不管你想要什么，我都能设法弄到。
        - id: ch02-b20
          speaker: husband
          text: 那好吧。要是能把那只知更鸟烤熟，我也许吃得下一小块翅膀。
        - id: ch02-b21
          speaker: narrator
          text: >-
            妻子吓得后退了一步。丈夫却转过脸去，不再理她。他觉得应该让她独自想一想。姑娘流着泪，绞着双手，下楼去找母亲。两个兄弟听了气愤极了。
        - id: ch02-b22
          speakers: [son_1, son_2]
          ensemble: duo
          text: 就算一定要死一个，也绝不能让知更鸟死！
          emotion: angry
        - id: ch02-b23
          speaker: narrator
          text: >-
            可是整个晚上，丈夫看起来越来越虚弱。天刚蒙蒙亮，姑娘终于偷偷出了门。她溜进那间屋，杀死知更鸟，带回去交给丈夫。她正要烹煮小鸟，两个兄弟走了进来。他们一看见知更鸟，便惊恐地叫起来，冲出小屋。
        - id: ch02-b24
          speakers: [son_1, son_2]
          ensemble: duo
          text: 我们再也不要见你！
          emotion: angry
        - id: ch02-b25
          speaker: narrator
          text: 姑娘心里沉甸甸的，只好捧着知更鸟的尸体，上楼去见丈夫。她才进门，丈夫却说自己已经好多了。
        - id: ch02-b26
          speaker: husband
          text: 我现在不想吃鸟肉了，再嫩也不想吃。给我一块煮得烂熟的熊肉倒更好。
        - id: ch02-b27
          speaker: narrator
          text: 姑娘想到大家心爱的知更鸟白白送了命，难过极了，便求丈夫多少尝一点。
        - id: ch02-b28
          speaker: daughter
          text: 你先前那么肯定，说吃了它就会好起来。我还是觉得，你现在吃一点，病就能全好了。
          emotion: sad
        - id: ch02-b29
          speaker: narrator
          text: 丈夫却勃然大怒，把小鸟扔出窗外，随后站起来走了出去。
    - id: ch03
      title: 老外祖母归来
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            这一切发生时，魔球一直滚啊，滚啊，滚啊，朝世界另一头老外祖母的小屋滚去。它刚滚进屋，老妇人就明白外孙一定死了。她一点时间也没浪费，马上拿来两张狐狸皮，一张绑在额头上，一张系在腰间。女巫离开自家屋子时，总是这样装束。
        - id: ch03-b02
          speaker: witch
          text: 沿着来路滚回去，带我去找外孙。
        - id: ch03-b03
          speaker: narrator
          text: >-
            魔球立刻出发，老妇人一路跟在后面。即使对女巫来说，这趟旅程也很漫长。不过世上的事总会有尽头，她终于来到木桩高台前，看见持球童的身体躺在那里。
        - id: ch03-b04
          speaker: witch
          text: 醒醒，我的外孙。咱们该回家了。
        - id: ch03-b05
          speaker: narrator
          text: >-
            持球童从高台上走下来，到小屋里拿出战棒、弓和箭，跟着老妇人向世界另一头走去。他们一路没有交谈。直到回到许多年前持球童禁食的那间小屋，老妇人才第一次开口。
        - id: ch03-b06
          speaker: witch
          text: 我的外孙，你后来从恶魔那里拿到黄金了吗？
        - id: ch03-b07
          speaker: ball_carrier
          text: 拿到了，外祖母。
        - id: ch03-b08
          speaker: witch
          text: 放在哪里了？
        - id: ch03-b09
          speaker: ball_carrier
          text: 就在这里，我的左边腋下。
        - id: ch03-b10
          speaker: narrator
          text: >-
            老妇人拿起刀，把粘在他皮肤上的黄金全刮下来。那些黄金从他当初偷走时起，就一直留在那里。刮完以后，她又问起另一件宝物。
        - id: ch03-b11
          speaker: witch
          text: 我的外孙，那座小桥呢？你也从恶魔那里拿到了吗？
        - id: ch03-b12
          speaker: ball_carrier
          text: 拿到了，外祖母。桥也在我这里。
        - id: ch03-b13
          speaker: witch
          text: 在哪里？
        - id: ch03-b14
          speaker: narrator
          text: 持球童抬起右臂，指了指腋下。
        - id: ch03-b15
          speaker: ball_carrier
          text: 桥在这里，外祖母。
    - id: ch04
      title: 最后的使命
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            接下来，老女巫做了一件谁也猜不到的事。她先拿起黄金，对持球童说出自己的打算。
        - id: ch04-b02
          speaker: witch
          text: >-
            我的外孙，这些黄金得藏进土里。要是人们以为想拿就能拿到，他们会变得又懒又愚蠢。可我们把黄金分开，埋到世界各地，想要它的人就必须下力气，而且每次只能找到一点。
        - id: ch04-b03
          speaker: narrator
          text: >-
            她边说边拔起小屋的一根柱子。柱子下面露出一个很深很深、仿佛没有底的大洞。她把所有黄金都倒了进去。黄金一消失，便流向世界各处。那些辛勤挖掘的人，有时会在那里找到它。老妇人做完这件事，又把柱子放回原位。
        - id: ch04-b04
          speaker: narrator
          text: >-
            接着，她从高高的搁板上取下一把生锈的铁锹，走到小屋另一边，挖了一个洞。洞口非常小，却一直通向很深的地方。
        - id: ch04-b05
          speaker: witch
          text: >-
            把桥给我，我要埋在这里。要是有人拿到它，发现渡过江河大海一点也不费事，那他永远也不会自己想办法渡过去。我是女巫。当初你来到这里的第一天，我只要愿意，就能对恶魔施法，逼他把黄金和桥交出来。
        - id: ch04-b06
          speaker: witch
          text: >-
            可要是那样，你就不会禁食，不会动脑筋盘算怎样拿到想要的东西，也不会结识善良的神灵。你只会一辈子又胖又懒。现在走吧。看见远处那间小屋了吗？你的父亲和母亲住在那里。他们已经老了，需要儿子替他们打猎。交给你的使命已经完成，我不再需要你了。
        - id: ch04-b07
          speaker: narrator
          text: 持球童这才想起自己的父母，便回到他们身边。
        - id: ch04-b08
          speaker: narrator
          text: 本故事收录自美国民族学局的《印第安民间传说》。
