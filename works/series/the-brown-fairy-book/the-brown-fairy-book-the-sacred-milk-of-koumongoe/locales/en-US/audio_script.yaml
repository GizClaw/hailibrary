  chapters:
    - id: ch01
      title: The Milk of Koumongoé
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Far away, in a country where the sun burned hot, a man and woman lived with their two children. Their son was Koane, and their daughter was Thakane. The parents worked in the fields early each morning and again in the cool of evening. At midday they rested beneath a tree. While they were away, little Thakane kept the house. Koane rose before dawn, while the air was still fresh, and drove the cattle to the best grass he could find.
        - id: ch01-b02
          speaker: narrator
          text: One morning Koane slept later than usual. His parents had already gone to the fields, and Thakane was alone, making bread for supper.
        - id: ch01-b03
          speaker: koane
          text: Thakane, I'm thirsty. Bring me some milk from the Koumongoé tree. Its milk is the best in the world.
        - id: ch01-b04
          speaker: thakane
          text: Oh, Koane, you know we're forbidden to touch that tree. What will Father say when he comes home? He is sure to find out.
          emotion: fearful
        - id: ch01-b05
          speaker: koane
          text: That's nonsense. Koumongoé holds so much milk that he'll never miss a little. If you won't fetch it, I won't take the cattle out. They can stay in the hut all day, and you know they'll starve.
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: He turned away in a rage and sat in a corner. The cattle were still shut inside, though they should already have been grazing. After a while, as the day grew hotter, Thakane tried once more.
        - id: ch01-b07
          speaker: thakane
          text: The heat is rising. Shouldn't you take the cattle out now?
        - id: ch01-b08
          speaker: koane
          text: I told you, I'm not taking them anywhere. If I get no milk, they get no grass.
        - id: ch01-b09
          speaker: narrator
          text: Thakane did not know what to do. If she disobeyed her parents, they would probably beat her. But the animals would suffer if they stayed shut inside, and she might be beaten for that too. At last she took an axe and a tiny earthen bowl. She made the smallest hole she could in the side of Koumongoé, and enough milk rushed out to fill the bowl.
        - id: ch01-b10
          speaker: thakane
          text: Here, Koane. This is the milk you wanted.
        - id: ch01-b11
          speaker: koane
          text: What use is that? There isn't enough there to drown a fly. Go back and bring me three times as much!
        - id: ch01-b12
          speaker: narrator
          text: Thakane trembled with fear, but she returned to the tree and struck it hard with the axe. At once, milk poured out in a mighty stream. It ran like a river straight into the hut.
        - id: ch01-b13
          speaker: thakane
          text: Koane! Come help me close the hole! There won't be any milk left for Father and Mother!
          emotion: fearful
        - id: ch01-b14
          speaker: narrator
          text: Koane could not stop it, and neither could Thakane. Soon the milk swept through the hut and flowed downhill toward the fields below.
    - id: ch02
      title: The River That Ran Uphill
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Far off, the father saw a white stream racing toward him. He guessed at once what had happened.
        - id: ch02-b02
          speaker: father
          text: Wife! Do you see Koumongoé rushing down the hill? The children must have made some mischief. I have to go home and learn what's wrong.
        - id: ch02-b03
          speaker: narrator
          text: The mother had been working a little distance away. Both parents dropped their hoes and hurried to the stream. They knelt on the grass, shaped their hands into cups, and drank the milk from them. The moment they had swallowed it, Koumongoé turned and flowed all the way back uphill, then entered the hut again.
        - id: ch02-b04
          speaker: narrator
          text: The parents reached home panting in the fierce heat. They spoke to Thakane severely.
        - id: ch02-b05
          speakers: [father, mother]
          ensemble: duo
          text: Thakane, what have you done? Why did Koumongoé come down to us in the fields instead of staying in the garden?
        - id: ch02-b06
          speaker: thakane
          text: It was Koane's fault. He refused to take the cattle to graze until he had drunk some milk from Koumongoé. I didn't know what else to do, so I gave him some.
        - id: ch02-b07
          speaker: narrator
          text: Her father heard every word, but gave no answer. He went outside, brought back two sheepskins, and stained them red. Then he sent for a blacksmith to forge iron rings. The rings were fitted around Thakane's arms, legs, and neck, and the heavy skins were fastened to her, one in front and one behind. When everything was ready, the father summoned his servants.
        - id: ch02-b08
          speaker: father
          text: I am going to get rid of Thakane.
        - id: ch02-b09
          speaker: servant
          text: Get rid of your only daughter? Why would you do that?
          emotion: surprised
        - id: ch02-b10
          speaker: father
          text: She ate what she was forbidden to eat. She touched the sacred tree that belongs only to her mother and me.
        - id: ch02-b11
          speaker: narrator
          text: He turned his back, ordered Thakane to follow, and set off along the road to the home of an ogre.
    - id: ch03
      title: Voices Along the Road
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: They passed fields where the corn was ripening. Suddenly a rabbit sprang up at their feet. It stood on its hind legs and sang.
        - id: ch03-b02
          speaker: rabbit
          text: Why give the ogre your child, your child so fair, so fair?
        - id: ch03-b03
          speaker: father
          text: Ask her. She is old enough to answer you herself.
        - id: ch03-b04
          speaker: thakane
          text: I gave Koumongoé to Koane, Koumongoé to the keeper of beasts. Without Koumongoé they could not reach the meadows. Without Koumongoé they would starve inside the hut. That is why I gave him my father's Koumongoé.
        - id: ch03-b05
          speaker: rabbit
          text: You wretched man! The ogre should eat you, not your beautiful daughter!
          emotion: angry
        - id: ch03-b06
          speaker: narrator
          text: The father paid no attention to the rabbit's words. He only walked faster and ordered Thakane to stay close behind. Before long, they met a whole herd of great deer called elands. The animals stopped in the road when they saw Thakane in her iron rings and red skins, and they sang together.
        - id: ch03-b07
          speakers: [eland_1, eland_2, eland_3]
          ensemble: chorus
          text: Why give the ogre your child, your child so fair, so fair?
        - id: ch03-b08
          speaker: father
          text: Ask her. She is old enough to answer you herself.
        - id: ch03-b09
          speaker: thakane
          text: I gave Koumongoé to Koane, Koumongoé to the keeper of beasts. Without Koumongoé they could not reach the meadows. Without Koumongoé they would starve inside the hut. That is why I gave him my father's Koumongoé.
        - id: ch03-b10
          speakers: [eland_1, eland_2, eland_3]
          ensemble: chorus
          text: You wretched man! The ogre should eat you, not your beautiful daughter!
          emotion: angry
        - id: ch03-b11
          speaker: narrator
          text: By then darkness was near. The father said they could go no farther and must sleep where they were. Thakane was deeply thankful. She was exhausted, and the two skins tied around her were almost too heavy to carry. Though she dreaded the ogre, she slept until dawn. Then her father woke her roughly and told her it was time to continue.
        - id: ch03-b12
          speaker: narrator
          text: As they crossed the plain, they passed a herd of gazelles feeding in the early light. The gazelles raised their heads to see who was abroad so soon. When they saw Thakane, they sang.
        - id: ch03-b13
          speakers: [gazelle_1, gazelle_2, gazelle_3]
          ensemble: chorus
          text: Why give the ogre your child, your child so fair, so fair?
        - id: ch03-b14
          speaker: father
          text: Ask her. She can answer for herself.
        - id: ch03-b15
          speaker: thakane
          text: I gave Koumongoé to Koane, Koumongoé to the keeper of beasts. Without Koumongoé they could not reach the meadows. Without Koumongoé they would starve inside the hut. That is why I gave him my father's Koumongoé.
        - id: ch03-b16
          speakers: [gazelle_1, gazelle_2, gazelle_3]
          ensemble: chorus
          text: You wretched man! The ogre should eat you, not your beautiful daughter!
          emotion: angry
    - id: ch04
      title: Masilo's Village
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: At last they reached the village where the ogre lived and went straight to his hut. The ogre was nowhere to be seen. In his place they found his son Masilo, who was no ogre at all, but a very courteous young man. Masilo welcomed them, then told his servants to bring a pile of skins for the tired girl to sit upon. Her father received no such honor. He had to sit on the bare ground.
        - id: ch04-b02
          speaker: narrator
          text: Thakane kept her face lowered. When Masilo caught sight of it, her beauty amazed him. He asked the same question the rabbit, the elands, and the gazelles had asked.
        - id: ch04-b03
          speaker: masilo
          text: Why is your father giving you to the ogre, when you are his own fair child?
        - id: ch04-b04
          speaker: thakane
          text: I gave Koumongoé to Koane, Koumongoé to the keeper of beasts. Without Koumongoé they could not reach the meadows. Without Koumongoé they would starve inside the hut. That is why I gave him my father's Koumongoé.
        - id: ch04-b05
          speaker: narrator
          text: As soon as Masilo heard her answer, he ordered that Thakane be taken to his mother's hut and placed in her care. Her father was sent in the other direction and led before the ogre. A great cooking pot always stood ready on the ogre's fire. The moment the ogre saw the man, he gave an order to the servant.
        - id: ch04-b06
          speaker: ogre
          text: Throw this man into the great pot on the fire.
        - id: ch04-b07
          speaker: narrator
          text: Five minutes later, the father was cooked. The servant returned to Masilo and told him all that had happened.
        - id: ch04-b08
          speaker: narrator
          text: Masilo had fallen in love with Thakane the moment he saw her. At first, the feeling bewildered him. All his life he had disliked women, and he had refused several brides chosen by his parents. But his parents longed to see him married. They gladly accepted Thakane as their daughter-in-law, even though she brought no marriage gift with her.
    - id: ch05
      title: The Child Beneath the Lake
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: After some time, Thakane had a baby. To her, this was the most beautiful child ever born. But when Masilo's mother saw that the baby was a girl, she wrung her hands and wept.
        - id: ch05-b02
          speaker: masilos_mother
          text: Oh, unhappy mother! Oh, unhappy child! Why, why were you not a boy?
          emotion: sad
        - id: ch05-b03
          speaker: narrator
          text: Thakane was astonished and asked why the old woman was so distressed. Masilo's mother explained that in their country, every girl who was born had to be given to the ogre to eat. Thakane clasped her baby tightly.
        - id: ch05-b04
          speaker: thakane
          text: That is not the custom in my country! When children die there, we bury them in the earth. No one will take my baby from me.
          emotion: angry
        - id: ch05-b05
          speaker: narrator
          text: That night, when everyone in the hut was asleep, Thakane rose with the baby on her back. She went down to a place where the river widened into a great lake. Tall willows grew all around its banks. Hidden from everyone, she sat on a stone and wondered how she could save her child.
        - id: ch05-b06
          speaker: narrator
          text: A rustle came from the willows, and an old woman appeared.
        - id: ch05-b07
          speaker: old_woman
          text: My dear, why are you crying?
        - id: ch05-b08
          speaker: thakane
          text: I'm crying for my baby. I cannot hide her forever. If the ogre sees her, he will eat her, and I would rather she drowned than suffer that.
          emotion: sad
        - id: ch05-b09
          speaker: old_woman
          text: What you say is true. Give me the child, and I will care for her. Choose a day to meet me here, and I will bring your baby to you.
        - id: ch05-b10
          speaker: narrator
          text: Thakane dried her tears and gladly accepted the offer. She fixed a day when they would meet again, then placed her baby in the old woman's care. When she returned home, she told Masilo she had thrown the child into the river. He had watched her leave in that direction, so it never occurred to him to doubt her story.
        - id: ch05-b11
          speaker: narrator
          text: On the chosen day, Thakane slipped away while everyone was busy and ran to the lake. She crouched among the willows and sang softly.
        - id: ch05-b12
          speaker: thakane
          text: Bring me Dilah, Dilah the rejected one, Dilah, whom her father Masilo cast away!
        - id: ch05-b13
          speaker: narrator
          text: In a moment, the old woman appeared with the baby in her arms. Dilah had grown so big and strong that Thakane's heart filled with joy and gratitude. She stayed beside the willows for as long as she dared, holding and playing with her child. At last she knew she must return to the village before anyone missed her. She handed Dilah back to the old woman, who carried the baby away and vanished with her into the lake.
        - id: ch05-b14
          speaker: narrator
          text: Children who live beneath the water grow with astonishing speed. Before anyone could have expected it, Dilah had grown from a baby into a woman. Whenever she could, Thakane went to visit her.
    - id: ch06
      title: Masilo Learns the Secret
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: One day, while mother and daughter sat talking beside the lake, a man came to cut willow branches for baskets. He saw them together. The girl's face looked so much like Masilo's that the man left his work and hurried back to the village.
        - id: ch06-b02
          speaker: basket_maker
          text: Masilo, I just saw your wife by the river with a girl who must be your daughter. She looks exactly like you. We have all been deceived. We thought the child was dead.
        - id: ch06-b03
          speaker: narrator
          text: Masilo tried to look shocked that his wife had broken the law, but inside he was very glad.
        - id: ch06-b04
          speaker: masilo
          text: What should I do now?
        - id: ch06-b05
          speaker: basket_maker
          text: See the truth for yourself. The next time Thakane says she is going to bathe, hide among the bushes and wait for the girl to appear.
        - id: ch06-b06
          speaker: narrator
          text: For several days Thakane stayed at home. Masilo began to think the basket maker might have been wrong. At last she told him she was going to bathe in the river.
        - id: ch06-b07
          speaker: masilo
          text: Very well. You may go.
        - id: ch06-b08
          speaker: narrator
          text: But Masilo raced down another path, reached the lake first, and hid in the bushes. A moment later Thakane arrived. She stood on the bank and sang.
        - id: ch06-b09
          speaker: thakane
          text: Bring me Dilah, Dilah the rejected one, Dilah, whom her father Masilo cast away!
        - id: ch06-b10
          speaker: narrator
          text: The old woman rose from the water, holding the hand of a tall, slender young woman. Masilo looked at her and knew she truly was his daughter. He wept with joy because she was not lying dead at the bottom of the lake. But the old woman grew uneasy.
        - id: ch06-b11
          speaker: old_woman
          text: I feel that someone is watching us. I will not leave the girl today. She must come back with me.
        - id: ch06-b12
          speaker: narrator
          text: She sank beneath the surface and drew Dilah after her. Thakane went back to the village. Masilo had already hurried home by the other path.
        - id: ch06-b13
          speaker: narrator
          text: He sat in a corner and wept for the rest of the day. When his mother came in, she asked him what was wrong.
        - id: ch06-b14
          speaker: masilos_mother
          text: My son, why are you crying so bitterly?
        - id: ch06-b15
          speaker: masilo
          text: My head hurts. It hurts terribly.
        - id: ch06-b16
          speaker: narrator
          text: His mother went on and left him alone. That evening, Masilo faced his wife.
        - id: ch06-b17
          speaker: masilo
          text: I saw my daughter where you said you had drowned her. She is alive beneath the lake, and now she has grown into a young woman.
        - id: ch06-b18
          speaker: thakane
          text: I don't know what you mean. I buried my child under the sand on the shore.
        - id: ch06-b19
          speaker: narrator
          text: Masilo begged her to bring the girl home, but Thakane refused to listen.
        - id: ch06-b20
          speaker: thakane
          text: If I gave her back, you would follow your country's law. You would take her to your father, and the ogre would eat her.
        - id: ch06-b21
          speaker: narrator
          text: Masilo begged again and again. He promised that he would never let his father see Dilah, and he insisted that now she was a grown woman, no one would try to harm her. At last, Thakane's heart softened. She went down to the lake, clapped her hands to summon the old woman, and asked what she should do.
    - id: ch07
      title: Dilah Comes Home
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: Thakane clapped her hands beside the lake, and the old woman appeared.
        - id: ch07-b02
          speaker: thakane
          text: What should I do? Masilo saw Dilah yesterday, and ever since then he has begged me to give him back his daughter.
        - id: ch07-b03
          speaker: old_woman
          text: If I let Dilah go, Masilo must give me one thousand cattle in exchange.
        - id: ch07-b04
          speaker: narrator
          text: Thakane carried the answer back to her husband.
        - id: ch07-b05
          speaker: masilo
          text: I would gladly give her two thousand! The old woman saved my daughter.
          emotion: happy
        - id: ch07-b06
          speaker: narrator
          text: Masilo sent messengers racing to every neighboring village. They told his people to send him all the cattle he owned. When the herds had gathered, he chose one thousand of the finest bulls and cows. He drove them down to the river, followed by a great crowd that wondered what would happen.
        - id: ch07-b07
          speaker: narrator
          text: Thakane stepped out in front of the cattle and sang.
        - id: ch07-b08
          speaker: thakane
          text: Bring me Dilah, Dilah the rejected one, Dilah, whom her father Masilo cast away!
        - id: ch07-b09
          speaker: narrator
          text: Dilah came out of the water with her hands reaching toward Masilo and Thakane. In her place, the thousand cattle sank beneath the lake. The old woman drove them down to the great city full of people that lies on the bottom.
