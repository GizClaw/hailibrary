  chapters:
    - id: ch01
      title: The Leaves of Fate
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Far away in an eastern country, there once lived a king who loved hunting more than his own safety. The moment he saw a deer, he would race after it without caring where the chase led. Again and again, he left his nobles and attendants far behind. In fact, he especially enjoyed adventures when he was alone. He had another favorite amusement as well. He would announce that he was ill and could receive no visitors. Then, with only his faithful Grand Wazeer in the secret, he dressed as a pedlar and loaded a donkey with cheap goods. He traveled among his people in disguise. That was how he learned what ordinary people said about him and whether his judges and governors truly did their duty.
        - id: ch01-b02
          speaker: narrator
          text: One day the queen gave birth to a daughter as beautiful as the dawn. The king was so delighted that he forgot about hunting for a whole week and filled the days with celebrations.
        - id: ch01-b03
          speaker: narrator
          text: Before long, though, he went hunting in a distant part of his forests. His dogs startled a beautiful snow-white stag. The king decided he must have it, whatever the cost, and galloped after it. His attendants did their best to follow, but his horse was splendid and the stag was swift. After an hour, only the king and his favorite hound remained in the chase.
        - id: ch01-b04
          speaker: narrator
          text: Still he chased on, until he rode into a valley walled in by great rocky mountains. His horse was so weary that it trembled at every stride, and the sun would soon set. The king shot arrow after arrow at the beautiful stag. Every one fell short or flew wide. Just as darkness came, the animal vanished from sight. By then, the horse could hardly move. The hound staggered beside him, panting. The king was lost among mountains he had never seen before. He had missed his way completely, and there was not a person or a house anywhere in sight.
        - id: ch01-b05
          speaker: narrator
          text: Losing the stag troubled him more than anything else. Still, he knew there was no use worrying over it. He dismounted, took the bridle over his arm, and led his horse along the rough path, hoping to find a shepherd's hut, a cave, or some shelter for the night.
        - id: ch01-b06
          speaker: narrator
          text: Soon he heard the roar of rushing water and made his way toward it. He struggled over the steep, rocky shoulder of a hill. Below him, a stream crashed through a deep gorge. Almost beneath his feet, down at the level of the torrent, a dim light twinkled like a lamp. The king led his horse toward it while the hound followed. All three slid and stumbled down the steep, stony path.
        - id: ch01-b07
          speaker: narrator
          text: At the bottom was a narrow strip of grass beside the stream. A rough lantern shone from the mouth of a cave. An old hermit with a long white beard sat by the water, dropping dry leaves into the current. He did not speak or move when the king came near.
        - id: ch01-b08
          speaker: king
          text: Peace be upon you.
        - id: ch01-b09
          speaker: hermit
          text: And peace be upon you.
        - id: ch01-b10
          speaker: narrator
          text: The hermit did not look up or pause. The king watched him throw in two leaves at a time. Sometimes both swept away downstream. Sometimes one escaped while the other spun at the current's edge and circled back to the hermit's feet. At other times, an eddy caught both leaves and kept them from the rushing water.
        - id: ch01-b11
          speaker: king
          text: What are you doing?
        - id: ch01-b12
          speaker: hermit
          text: I am reading the fates of men. Every person's fate is settled from the beginning. Whatever it may be, no one can escape it.
        - id: ch01-b13
          speaker: narrator
          text: The king laughed.
        - id: ch01-b14
          speaker: king
          text: My own fate means little to me. But I would like to know what awaits my baby daughter.
        - id: ch01-b15
          speaker: hermit
          text: I cannot tell you.
        - id: ch01-b16
          speaker: king
          text: Then you do not know?
        - id: ch01-b17
          speaker: hermit
          text: I may know. But knowing too much is not always wise.
        - id: ch01-b18
          speaker: narrator
          text: That answer did not satisfy the king. He kept pressing the old man, though the hermit refused for a long while. At last, the king urged him so fiercely that he spoke.
        - id: ch01-b19
          speaker: hermit
          text: The king's daughter will marry the son of a poor slave woman named Puruna. She belongs to the king of the northern land. There is no escaping from Fate.
        - id: ch01-b20
          speaker: narrator
          text: The prophecy threw the king into a rage. Yet he was exhausted, so he only laughed and said he hoped there was some way out of that fate. Then he asked whether the hermit could shelter him and his animals for the night. The old man said yes. The king watered his horse and tied it securely. After a supper of bread and roasted peas, he lay down inside the cave with his faithful hound at his feet and tried to sleep.
        - id: ch01-b21
          speaker: narrator
          text: Sleep would not come. He thought about the prophecy until his anger grew unbearable. At last he ground his teeth and swore it would never, never come true.
        - id: ch01-b22
          speaker: narrator
          text: Morning found him pale and sullen. The hermit showed him the right path, and he reached home easily. The moment he returned, he wrote to the northern king. He asked to buy Puruna and her son and offered to send a messenger to meet them at the river between the two kingdoms.
    - id: ch02
      title: The Child in the Cave
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: For five days the king waited for an answer. He barely ate or slept and was cross with everyone around him. On the fifth day, his messenger returned with a letter. The northern king would not sell Puruna and her child, but he would give them to the king as a gift. The news filled the king with joy because he believed the prophecy was finally in his hands.
        - id: ch02-b02
          speaker: narrator
          text: He told the Grand Wazeer to invent an excuse for another lonely journey. Then he disguised himself as an ordinary messenger, mounted a swift camel, and rode to the meeting place. He gave the northern messengers a letter of thanks, a handsome gift for their master, and rewards for themselves. Without delay, he put Puruna and her tiny son on his camel and carried them into the wild desert.
        - id: ch02-b03
          speaker: narrator
          text: He rode for a day and a night with hardly a stop. At a great cave, he ordered Puruna down from the camel and led her inside with her baby. There he drew his sword and killed her with one blow.
        - id: ch02-b04
          speaker: narrator
          text: His anger had made him cruel enough to do that dreadful thing, but he could not bring his sword down upon a helpless baby. He felt sure the child would soon die alone without its mother. So he left the boy in the cave and hurried home on his camel.
        - id: ch02-b05
          speaker: narrator
          text: In a small village in the king's country lived an old widow with no children and no family at all. She earned most of her living by selling milk from a flock of goats. She was very poor and not very strong. Often she wondered how she could survive if illness or old age left her unable to tend the animals. Every morning, she drove the goats into the desert, where they fed on the shrubs and bushes. Every evening, they found their own way home. Then she milked them and shut them up safely for the night.
        - id: ch02-b06
          speaker: narrator
          text: One evening, her finest nanny goat came back without a drop of milk. The widow was astonished. She suspected that some mischievous boy or girl had caught the goat on its way home and stolen all the milk. The next evening, the goat was almost dry again. It happened night after night. At last the widow decided to discover who the thief was. The following morning she drove the goats out as usual, then followed the flock from a distance and watched while they grazed.
        - id: ch02-b07
          speaker: narrator
          text: That afternoon, the nanny goat slipped away from the others. The widow followed until the animal disappeared into a cave among the rocks. Inside, she found the goat feeding its milk to a baby boy. Nearby lay the sad remains of his dead mother.
        - id: ch02-b08
          speaker: narrator
          text: The widow stood there frightened and full of wonder. She had no child and no relation in the world. At last, she thought this little baby might become a son to her in her old age. Perhaps he would grow up and one day bring her comfort and support. She lifted him carefully, carried him all the way home, and took him into her hut. The next day she returned to the cave with a spade. She dug a grave in the earth and laid his poor mother to rest.
        - id: ch02-b09
          speaker: narrator
          text: Years passed. The widow named the boy Nur Mahomed, and he grew into a fine, handsome young man. He was as hardworking as he was brave, and as daring as he was good-looking.
        - id: ch02-b10
          speaker: narrator
          text: When Nur Mahomed was about seventeen, he came home from working in the fields and found a strange donkey eating the cabbages around their cottage. He seized a large stick, beat the animal, and drove it out. A neighbor passing by called to him.
        - id: ch02-b11
          speaker: neighbor
          text: Hey there! Why are you beating the pedlar's donkey?
        - id: ch02-b12
          speaker: nur_mahomed
          text: The pedlar ought to keep it out of my cabbages. If it comes back tonight, I'll cut off its tail!
        - id: ch02-b13
          speaker: narrator
          text: Nur Mahomed went indoors, whistling cheerfully. But the neighbor loved to make trouble by talking. That evening, he found the pedlar at the inn and told him about the donkey. Then he added something Nur Mahomed had never said.
        - id: ch02-b14
          speaker: neighbor
          text: Yes, and that hotheaded boy said he would beat you too, then cut off your nose for being a thief!
        - id: ch02-b15
          speaker: narrator
          text: A few days later, after the pedlar had traveled on, two men arrived in the village asking questions. Who had threatened to mistreat and murder an innocent pedlar? They declared that the man had feared for his life and complained directly to the king. The king, they said, had sent them to find the lawless person who had spoken those threats and bring him to court for trial.
        - id: ch02-b16
          speaker: narrator
          text: The men soon heard the true story of the donkey eating Nur Mahomed's cabbages and the angry words he had actually used. The young man insisted that he had never said anything about murdering the pedlar. It made no difference. The officers answered that their orders were to arrest him and take him before the king. Despite all his protests and his mother's cries, they carried him away. In time he stood in the royal court, never guessing that the supposed pedlar had been the king himself.
        - id: ch02-b17
          speaker: narrator
          text: The king was furious over what the neighbor had told him. He announced that the young man would serve as an example and learn that even a poor traveling pedlar could receive justice and protection in his country. The king was just about to pronounce a very harsh sentence when a commotion rose in the court. Nur Mahomed's old mother pushed her way forward. She was weeping and lamenting, and she begged the king to hear her before he passed judgment.
        - id: ch02-b18
          speaker: old_woman
          text: Please spare him, Your Majesty. He is a good boy and the only support of my old age. If you send him to prison, I will die.
          emotion: fearful
        - id: ch02-b19
          speaker: narrator
          text: The king asked who she was.
        - id: ch02-b20
          speaker: old_woman
          text: I am his mother.
        - id: ch02-b21
          speaker: king
          text: His mother? Surely you are too old to have such a young son.
        - id: ch02-b22
          speaker: narrator
          text: In her fear and misery, the widow confessed everything. She told how she had found the baby in the cave, rescued him, and raised him. Then she begged the king once more for mercy.
        - id: ch02-b23
          speaker: narrator
          text: As the story unfolded, the king's face grew darker and darker, then grimmer still. By the end, rage and astonishment had nearly made him faint. This was the very baby he had abandoned in the desert after cruelly murdering Puruna. Fate had somehow spared the child. The old hermit's prophecy returned to the king with all its force, and he could think of nothing else.
        - id: ch02-b24
          speaker: narrator
          text: The king wanted an excuse to put Nur Mahomed to death. But the young man had done nothing that deserved it. If the king ordered his execution, everyone would call him a tyrant. He did not dare.
        - id: ch02-b25
          speaker: king
          text: If this young man joins my army, I will release him. We need men like him, and a little discipline will do him good.
        - id: ch02-b26
          speaker: narrator
          text: The widow kept pleading. She said she could not live without her son, and the thought of his becoming a soldier frightened her almost as much as the thought of prison. But the king was determined to get Nur Mahomed into his power. At last, he quieted the old woman by promising her a pension large enough to keep her in comfort. Nur Mahomed himself was delighted by the decision. He was formally enrolled in the king's army and began his new life as a soldier.
    - id: ch03
      title: The King's Secret Letter
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Nur Mahomed seemed wonderfully lucky as a soldier. To his surprise and pleasure, he was always among the men chosen whenever a difficult or dangerous mission had to be done. More than once, he escaped death by the narrowest margin. Yet the very danger of each situation gave him a special chance to show his courage. He never boasted afterward. Because he was modest and generous as well as brave, both his officers and his fellow soldiers came to admire him.
        - id: ch03-b02
          speaker: narrator
          text: Before long, Nur Mahomed was selected for the king's own bodyguard. The king had hoped some battle would kill him. Instead, the young man flourished through every hard blow. So the king began planning more direct and deadly attacks.
        - id: ch03-b03
          speaker: narrator
          text: Soon after Nur Mahomed joined the bodyguard, he was assigned to escort the king through the city. The royal procession had been moving along without trouble when a man suddenly rushed from an alley. A dagger gleamed in his hand, and he ran straight toward the king. Nur Mahomed was the nearest of all the guards. Without waiting for anyone else, he threw himself between the attacker and the king. The dagger struck him instead of his ruler.
        - id: ch03-b04
          speaker: narrator
          text: Luckily, the attacker had struck in haste. The blade glanced off Nur Mahomed's breastbone instead of sinking deep into his chest. Even so, the wound was severe. His youth and strength helped him recover quickly. The king could not ignore such a brave act, though it had ruined another chance to be rid of him. As a public reward, he made Nur Mahomed one of his own attendants.
        - id: ch03-b05
          speaker: narrator
          text: Then came one strange danger after another. Officers of the guard were often sent on secret and difficult errands, and those errands somehow appeared whenever Nur Mahomed was on duty. A footbridge collapsed beneath him. Armed robbers attacked him. A rock rolled toward him in a mountain pass. In a narrow city lane, a heavy stone from a rooftop crashed down at his feet.
        - id: ch03-b06
          speaker: narrator
          text: Nur Mahomed began to suspect that he had made an enemy somewhere. Still, he was lighthearted and did not worry much. He escaped every time and felt more amused than afraid as he wondered what adventure would come next.
        - id: ch03-b07
          speaker: narrator
          text: In that city, there was an old custom. Whichever officer commanded the palace guard for the day received every meal directly from the king's own kitchen. When Nur Mahomed's turn came, a delicious stew arrived from the palace. He had just sat down to eat when a thin, hungry street dog poked its nose through the open guardroom door. It stared at Nur Mahomed and the steaming dish. Its mouth watered, and its nostrils worked eagerly at the smell.
        - id: ch03-b08
          speaker: narrator
          text: Kindhearted Nur Mahomed took out a piece of meat and tossed it outside. The dog swallowed it greedily. Then it staggered, fell, rolled over, and died. Nur Mahomed watched in silence for a moment. He returned to the table, softly whistling, wrapped up the rest of the meal so he could bury it, and sent the empty dishes back.
        - id: ch03-b09
          speaker: narrator
          text: The next morning, Nur Mahomed appeared at court fresh, smiling, and as lively as ever. The king was furious. He decided to try one final scheme. That evening he summoned the young man and ordered him to carry a secret dispatch to the governor of a distant province.
        - id: ch03-b10
          speaker: king
          text: Prepare at once. You will leave tomorrow morning. I will place the papers in your hands just before you go.
        - id: ch03-b11
          speaker: narrator
          text: The province lay four or five days away from the palace. Its governor was the most faithful servant the king possessed. He could keep a secret like the grave, and nothing made him prouder than exact obedience. He had served the king loyally for many years. His wife was also close to the royal family. Ever since the queen had died some years before, she had cared for the young princess almost like a mother.
        - id: ch03-b12
          speaker: narrator
          text: Not long before this, the princess had gone to another distant province for her health. The governor's wife invited her to visit as soon as she could. The princess gladly accepted and was staying in the governor's home when the king chose to send Nur Mahomed there with the mysterious letter.
        - id: ch03-b13
          speaker: narrator
          text: Following his orders, Nur Mahomed came to the king's private rooms early the next morning. He was ready for the road. His best horse stood saddled, food was packed in his saddlebag, and a little money was tied securely inside his waistband. The king handed him a sealed packet. Nur Mahomed was to guard it carefully and place it himself into the governor's hands. No one else must touch it.
        - id: ch03-b14
          speaker: narrator
          text: Nur Mahomed hid the packet carefully in his turban, mounted, and rode through the city gates five minutes later. The weather was very hot, but he wanted to deliver the precious message quickly. He rode through most of each night and rested only during the hottest hours. By noon on the third day, he was nearing the town.
        - id: ch03-b15
          speaker: narrator
          text: Not another soul could be seen on the road. After so many hours in the saddle, Nur Mahomed was stiff, dusty, thirsty, and tired. He looked longingly over the town wall into the gardens beyond. There were splashing fountains and stretches of cool green grass. Shady apricot orchards and giant mulberry trees promised relief from the burning sun. How he wished he were already among them.
        - id: ch03-b16
          speaker: narrator
          text: At the castle gates, his bodyguard uniform gained him immediate entry. A soldier explained that the governor was resting and could not receive him until evening. Nur Mahomed gave his horse to an attendant, walked into the beautiful gardens, and lay beneath a tree.
        - id: ch03-b17
          speaker: narrator
          text: He watched birds chatter among the leaves. Through the branches, he saw kites circling across patches of blue sky and heard their sharp cries. Bees hummed over the flowers. Within minutes, Nur Mahomed was fast asleep.
    - id: ch04
      title: The Princess Changes Fate
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Each afternoon, during the worst heat, the governor and his wife rested for two or three hours in their rooms. Nearly everyone else in the palace did the same. But the princess was restless, as many young girls are. She preferred wandering through the garden to lying still on a heap of soft cushions. Her stout older attendants found these afternoons a torment whenever she insisted that they stay awake, chatter with her, or find something for her to do. They could hardly keep their eyes open.
        - id: ch04-b02
          speaker: narrator
          text: Sometimes the princess pretended to sleep until all her women followed her example. Then she slipped outside alone, with her veil hanging loosely around her. If the governor's wife caught her, she scolded severely. The princess only laughed and did it again the next time.
        - id: ch04-b03
          speaker: narrator
          text: That very afternoon, the princess left all her women sleeping. For a while she tried to amuse herself indoors, but nothing pleased her. At last she slipped out into the great garden and wandered through all her favorite paths, nooks, and corners. Not another creature seemed to be awake, so she felt perfectly safe. Then she turned a corner and stopped in surprise. She had almost tripped over a man stretched across the path. He lay there fast asleep.
        - id: ch04-b04
          speaker: narrator
          text: He was a young officer of the king's guard, handsome, tanned, and dusty from travel. The princess had one great weakness. Her curiosity could devour her, and her idle life gave her far too much time to wonder about other people's affairs. As she studied the stranger, she noticed the corner of a letter peeping from one of the folds of his turban.
        - id: ch04-b05
          speaker: narrator
          text: Who was it for? What could it say? She pulled her veil closer, crept forward on tiptoe, and took hold of the corner. She drew it out little by little until a large seal appeared. It was her father's seal.
        - id: ch04-b06
          speaker: narrator
          text: For a moment, the sight of her father's seal stopped her. She felt half ashamed of what she was doing. But the secret pleasure of taking a letter that was never meant for her proved too strong. In another moment, it was in her hand. Then a terrible thought struck her. If this poor officer lost a royal dispatch, he might be put to death. Whatever happened, she must return it before he woke.
        - id: ch04-b07
          speaker: narrator
          text: Putting it back was not so easy, and the unopened letter seemed to burn in her hand. She longed to know why her father had sent it and what words were hidden inside. She examined the seal. The fierce heat of the sun had made it soft and sticky. With very little effort, it parted from the paper. Now the letter lay open. The princess could resist no longer, and she read the order.
        - id: ch04-b08
          speaker: king
          text: Secretly behead the messenger who delivers this letter. Do it at once, and ask no questions.
        - id: ch04-b09
          speaker: narrator
          text: The princess went pale. It was shameful, she thought. She would not allow such a handsome young man to be beheaded. But she needed a plan, and someone might interrupt her in the garden.
        - id: ch04-b10
          speaker: narrator
          text: She crept back to her room, found a fresh sheet of paper, and wrote a different command.
        - id: ch04-b11
          speaker: princess
          text: Publicly marry the messenger who delivers this letter to the princess. Do it at once, and ask no questions.
        - id: ch04-b12
          speaker: narrator
          text: The princess even managed to work the seals free from the original letter and fasten them onto the new one. Unless someone examined the packet very closely, no one could tell it had ever been opened. Then she slipped back toward the garden, shaking with fear and excitement. The young officer still lay in the shade, completely asleep. She crept near, thrust the changed letter into the fold of his turban, and hurried back to her room. It was done.
        - id: ch04-b13
          speaker: narrator
          text: Late that afternoon, Nur Mahomed woke. He checked that the precious packet was safe, prepared himself, and went to meet the governor. As commanded, he took the letter from his turban and placed it directly in the governor's hands.
        - id: ch04-b14
          speaker: narrator
          text: The governor broke the seal and read the message. He was certainly surprised by the strange command. But the letter plainly told him to ask no questions, and he knew how to obey his king. He did not question Nur Mahomed or examine the packet more closely. Instead, he immediately sent for his wife and ordered her to dress the princess and prepare her for marriage.
        - id: ch04-b15
          speaker: governor_wife
          text: Nonsense! What in the world are you talking about?
          emotion: surprised
        - id: ch04-b16
          speaker: governor
          text: These are the king's commands. Go and do as I tell you. The letter says to act at once and ask no questions. The wedding must happen this evening.
        - id: ch04-b17
          speaker: narrator
          text: His wife raised every objection she could think of. There had been no warning, no preparation, and no explanation. But the more she argued, the more stubborn and determined her husband became.
        - id: ch04-b18
          speaker: governor
          text: I know how to obey an order, and this one is as plain as the nose on my face!
        - id: ch04-b19
          speaker: narrator
          text: The princess was summoned and told that she must marry the young messenger that evening. To everyone's surprise, she received the news very calmly. Then the governor sent for Nur Mahomed and informed him of the king's supposed command. The young man was greatly startled. Yet he believed the order truly came from the king, and he could only be delighted by such a great and unexpected honor.
        - id: ch04-b20
          speaker: narrator
          text: The whole castle burst into confusion. When the news reached the town, confusion spread there too. Everyone ran about, trying to do everything at once. In the midst of it all, the old governor hurried from place to place with his hair standing on end, muttering about obeying orders.
        - id: ch04-b21
          speaker: narrator
          text: That evening, Nur Mahomed and the princess were married. A great feast filled the castle, while another celebration took place in the soldiers' barracks. Lamps and decorations shone all over the town and through the lovely gardens. From the palace to the streets, the whole place blazed with celebration. The people declared that no one had ever seen such a wonderful sight. They remembered that astonishing wedding and talked about it to the ends of their lives.
    - id: ch05
      title: No Escaping from Fate
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The next day, the governor sent the princess and her bridegroom back to the king. A troop of splendidly dressed horsemen rode with them. Ahead of the company, a mounted messenger carried the governor's letter describing the marriage.
        - id: ch05-b02
          speaker: narrator
          text: When the king opened the governor's letter and read what had happened, his face grew so red that everyone feared he would collapse. The people around him were anxious and desperately curious, but he offered no explanation. He rushed from them, locked himself alone in a room, and stamped and raged over the marriage until he had worn himself out.
        - id: ch05-b03
          speaker: narrator
          text: After a while, the king's fury cooled enough for him to think. He decided he must make the best of matters. The careful old governor had returned the royal letter along with his report. One look at the changed order made the king fairly certain that the words were in his daughter's handwriting. He was fond of her. Though she had behaved badly and ruined his plan, he had no wish to cut off her head.
        - id: ch05-b04
          speaker: narrator
          text: Nor could he let anyone learn the truth, for then he would look foolish. The more he thought, the wiser it seemed to welcome the marriage and let everyone believe he had arranged it freely.
        - id: ch05-b05
          speaker: narrator
          text: So when the young couple arrived, the king received them with full ceremony and gave his son-in-law a province to govern. Nur Mahomed proved as capable and honorable a governor as he had been a brave soldier. When the old king died, Nur Mahomed took his place and ruled for many happy years.
        - id: ch05-b06
          speaker: narrator
          text: His old mother lived a long time in her son's palace and died peacefully. The princess had won her husband by a trick, but she soon learned she could not trick him. She never tried. Instead, she taught her children and scolded her maids.
        - id: ch05-b07
          speaker: narrator
          text: No one ever found the old hermit again. But his cave still stands, and the leaves lie thick before it to this very day.
