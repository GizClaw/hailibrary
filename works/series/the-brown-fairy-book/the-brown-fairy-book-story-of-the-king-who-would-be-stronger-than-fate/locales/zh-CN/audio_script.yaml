audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 温暖庄重，以从容而清晰的语气讲述古老命运故事, timbre: 清澈浑厚, pace: 舒缓, pitch: 中音}
    king:
      display_name: 国王
      tts: {delivery: 威严自负，盛怒时冷硬逼人, timbre: 成熟洪亮, pace: 适中, pitch: 中低音}
    hermit:
      display_name: 老隐士
      tts: {delivery: 淡泊沉静，话语简短而意味深长, timbre: 苍老低沉, pace: 缓慢, pitch: 低音}
    nur_mahomed:
      display_name: 努尔·穆罕默德
      tts: {delivery: 爽朗坦率，勇敢而不失谦逊, timbre: 年轻清朗, pace: 适中, pitch: 中音}
    neighbor:
      display_name: 邻居
      tts: {delivery: 好事多嘴，言语夸张而带着怂恿, timbre: 尖细轻浮, pace: 稍快, pitch: 中高音}
    old_woman:
      display_name: 老妇人
      tts: {delivery: 朴实慈爱，求情时焦急哀恳, timbre: 苍老温厚, pace: 稍缓, pitch: 中音}
    princess:
      display_name: 公主
      tts: {delivery: 聪慧活泼，好奇而遇事果断, timbre: 年轻明亮, pace: 适中, pitch: 中高音}
    governor:
      display_name: 总督
      tts: {delivery: 一板一眼，以服从命令为荣, timbre: 年长浑厚, pace: 适中, pitch: 中低音}
    governor_wife:
      display_name: 总督夫人
      tts: {delivery: 老练直率，遇到荒唐事便毫不客气, timbre: 年长清晰, pace: 适中, pitch: 中音}
  chapters:
    - id: ch01
      title: 溪边的预言
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，遥远的东方有一位国王，最爱打猎。鹿只要一露面，他就连自己的安危也忘了，常把贵族和随从远远甩在后面，独自去冒险。他还有一种消遣。国王会装病谢客，只把实情告诉忠心的大维齐尔，再扮成货郎，让驴驮着廉价杂货四处游走。这样，他既能听见百姓怎样议论自己，也能暗中查看法官和地方长官有没有尽责。
        - id: ch01-b02
          speaker: narrator
          text: >-
            一天，王后生下一位小公主，孩子美得像朝霞。国王欢喜极了，整整一星期都忘了打猎，宫里宫外只顾庆贺。可没过多久，他又到森林深处追鹿去了。猎犬惊起一头雪白的雄鹿，国王一眼看见，就下定决心非猎到它不可。
        - id: ch01-b03
          speaker: narrator
          text: >-
            他用马刺猛催坐骑，一路飞驰。随从们自然也使出最快的速度紧追，可那匹马脚程太快，白鹿也快得惊人。一个钟头以后，追逐的队伍里只剩国王和最心爱的猎犬，其他人早已落在遥远的后方，连影子也看不见。国王毫不畏惧，仍不肯停，一直追进四面都是岩山的深谷。马疲惫不堪，每走一步都在发抖，暮色也已经降临，太阳眼看就要落山。他朝白鹿接连射箭，却全都白费了。每一箭不是力道不足，就是偏离目标。黑暗将至时，白鹿终于彻底消失了。
        - id: ch01-b04
          speaker: narrator
          text: >-
            国王迷失在陌生的群山里。马累得挪不动脚，猎犬喘着粗气，附近既没有人，也没有屋舍。真正叫他难受的，是丢了那头美丽的鹿。不过，无法挽回的事，他一向不肯多想，便下马把胳膊套进缰绳，牵着马寻找牧人小屋，或者一处能过夜的山洞。
        - id: ch01-b05
          speaker: narrator
          text: >-
            不久，他听见奔流的水声，便朝那边走去。费力翻过陡峭的石坡，他看见一条溪流从险峻的峡谷奔腾而下。就在脚下不远处，几乎与激流齐平的地方，还有一点昏黄灯光闪闪烁烁。国王带着马和猎犬走向灯光，在又陡又多碎石的小径上连滑带绊，终于来到谷底。狭窄的草坡横在水边，洞口挂着一盏粗陋的提灯，把摇曳不定的光投过草地。一位白须垂胸的老人坐在溪旁。国王走近时，他既不说话，也一动不动，只把散落在身边的枯叶投入水中。
        - id: ch01-b06
          speaker: king
          text: 愿平安与你同在。
        - id: ch01-b07
          speaker: hermit
          text: 也愿平安与你同在。
        - id: ch01-b08
          speaker: narrator
          text: >-
            老隐士答过话，仍旧没有停手。国王看了一会儿，发现他每次都把两片叶子一同放进水里。有时，两片都被急流卷走。有时，只有一片顺流而下，另一片在水边打着转，又随着漩涡回到老人脚下。还有时，两片叶子都困在回旋的水里，怎么也进不了喧响的主流。
        - id: ch01-b09
          speaker: king
          text: 你到底在做什么？
        - id: ch01-b10
          speaker: hermit
          text: >-
            我在看世人的命运。每个人的命从一开始就定下了。不管那命运是什么，谁也逃不掉。
        - id: ch01-b11
          speaker: narrator
          text: 国王听了大笑起来。
        - id: ch01-b12
          speaker: king
          text: 我才不在乎自己的命运。不过，我很想知道小女儿将来会有怎样的命。
        - id: ch01-b13
          speaker: hermit
          text: 我不能说。
        - id: ch01-b14
          speaker: king
          text: 难道你不知道？
        - id: ch01-b15
          speaker: hermit
          text: 我或许知道。可是，人知道得太多，未必是明智的事。
        - id: ch01-b16
          speaker: narrator
          text: >-
            国王不肯罢休，一再逼问。老人推辞了很久，最后实在抵挡不住，只好开口。
        - id: ch01-b17
          speaker: hermit
          text: >-
            国王的女儿会嫁给一个穷苦女奴的儿子。那女奴叫普鲁娜，是北方国王的人。命运逃不过去。
        - id: ch01-b18
          speaker: narrator
          text: >-
            国王听到这番话，气得发狂。可他已经疲惫不堪，只冷笑着说，那样的命无论如何总有办法避开。他又问隐士，能否让自己和牲口在这里住一夜，隐士答应了。没过多久，国王便给马饮过水，拴好了缰绳。他吃了些面包和烘豌豆当晚饭，随后躺进山洞，猎犬伏在他的脚边。国王原想睡觉，却始终只能睁眼躺着，反复想着隐士的预言。他越想越生气，怒火一点点升高，最后竟咬着牙发誓，那个预言绝不能、绝不能成真。
    - id: ch02
      title: 沙漠中的孩子
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            天亮以后，国王脸色苍白，满心愠怒。他向隐士问明道路，骑马回了王宫，马上写信给北方国王，请他把女奴普鲁娜和她的儿子卖给自己，还说会派人到两国交界的河边接他们。
        - id: ch02-b02
          speaker: narrator
          text: >-
            国王等了五天，几乎不吃不睡，脾气坏到了极点。第五天，使者终于带回一封信。北方国王不愿卖人，却肯把女奴和孩子送给他。国王喜出望外，立刻叫来大维齐尔，说自己又要独自出行，要他替这次离宫编个借口。他扮成普通使者，骑上快骆驼，赶往两国交界的河边。见到护送普鲁娜的人以后，国王交出一封谢函和一份厚礼，请他们带回去献给主人，又逐一赏赐了他们。随后，他毫不耽搁，让可怜的普鲁娜抱着襁褓中的婴儿，与自己一同坐上骆驼，向荒凉的沙漠赶去。
        - id: ch02-b03
          speaker: narrator
          text: >-
            一天一夜后，他们来到一座大山洞。国王命普鲁娜下去，把母子带进洞里，拔剑一挥，砍下了她的头。他的怒火能让他犯下这样的罪行，却还不足以叫他把大剑挥向无助的婴儿。国王认定，孩子没了母亲，独自留在荒野，很快也会死。他把婴儿丢在原地，骑着骆驼飞快回宫去了。
        - id: ch02-b04
          speaker: narrator
          text: >-
            国王境内的一座小村里，住着一位贫苦的老寡妇。她无儿无女，也没有亲人，靠卖山羊奶生活。她身子不强，常发愁自己一旦衰弱或病倒，不能再照看羊群，该怎样活下去。她每天清晨把羊赶进沙漠吃灌木，傍晚羊群会自行回家，让她挤奶，再被关起来过夜。
        - id: ch02-b05
          speaker: narrator
          text: >-
            一天傍晚，老妇人惊讶地发现，最好的一头母山羊回来时一滴奶也没有。她以为是淘气的孩子在路上捉住了羊，把奶全偷走了。可是，一个晚上接一个晚上，那头羊的奶始终几乎是空的。老妇人决心找出小偷，第二天便远远跟着羊群，看它们吃草。到了下午，那头母羊悄悄离开同伴，独自走出很远，最后钻进岩石间的一座洞穴。老妇人一路追进去。你猜她看见了什么？母羊竟在给一个小男婴喂奶，孩子身旁还躺着他死去的母亲留下的凄惨遗骸。
        - id: ch02-b06
          speaker: narrator
          text: >-
            老妇人又惊又怕，站在那里想了许久。她没有孩子，也没有亲人，或许这个婴儿能在她晚年成为一个儿子。等他渐渐长大，也许能给她安慰，在她年老体弱时支撑这个家。于是，老妇人把婴儿抱回自己的小屋。第二天，她又带着铁锹来到山洞，亲手挖出一座坟，安葬了孩子那位可怜的母亲。
        - id: ch02-b07
          speaker: narrator
          text: >-
            许多年过去，老妇人给孩子取名努尔·穆罕默德。他长成了英俊出色的少年，勇敢、勤劳又大胆。大约十七岁那年，一天，他干完田里的活回家，看见一头陌生的驴正在啃菜园里的卷心菜，便抄起大棍打它，要把它赶出去。一个邻居正好经过，冲他喊起来。
        - id: ch02-b08
          speaker: neighbor
          text: 喂！你怎么能这样打货郎的驴？
        - id: ch02-b09
          speaker: nur_mahomed
          text: >-
            货郎就该管好它，别让它吃我的卷心菜。今晚它要是再来，我就割掉它的尾巴！
        - id: ch02-b10
          speaker: narrator
          text: >-
            说完，他快活地吹着口哨进屋了。这个邻居偏偏最爱搬弄是非。晚上，他在驿馆遇见货郎，不但把事情讲了一遍，还添上了几句。
        - id: ch02-b11
          speaker: neighbor
          text: >-
            那个火爆小子还说了，打驴要是不管用，连你也一起打，再割下你的鼻子，叫你做贼！
        - id: ch02-b12
          speaker: narrator
          text: >-
            几天后，货郎已经离村，两个人却找上门来，追查是谁扬言要伤害并杀死一名无辜货郎。他们说，货郎害怕丢命，已经告到国王那里，国王命他们把那个无法无天的人押去受审。两人很快查清，那头驴确实吃了努尔·穆罕默德的卷心菜，少年也确实在气头上说过狠话。可无论他怎样分辩，说自己从没提过要杀人，他们只回答，奉命必须逮捕他，带到国王面前。任少年抗议，任母亲哭喊，也没有用。他终于被押进王宫。努尔·穆罕默德哪里会知道，那个货郎正是乔装的国王，这件事原本谁也不知道。
        - id: ch02-b13
          speaker: narrator
          text: >-
            国王听信了告状的话，气愤不已。他宣称要拿这个年轻人警告所有人，让他明白，即使贫苦的行脚货郎，在自己的国家里也能讨回公道，不会任由无法无天的人欺负。国王正要宣布一项极重的刑罚，朝堂上忽然一阵骚动。努尔·穆罕默德的老母亲哭着走上前，一边哀叹，一边恳求国王听她说话。国王准许她开口，她便为少年求起情来。
        - id: ch02-b14
          speaker: old_woman
          text: >-
            求陛下饶了这个孩子吧。他一直那么善良，是我晚年唯一的依靠。要是把他关进牢里，我也活不成了。
          emotion: sad
        - id: ch02-b15
          speaker: narrator
          text: 国王问她是谁，老妇人说自己是少年的母亲。
        - id: ch02-b16
          speaker: king
          text: 他的母亲？你年纪这么大，怎么会有这么年轻的儿子？
        - id: ch02-b17
          speaker: narrator
          text: >-
            老妇人又惊又急，只好说出全部实情。她讲起自己如何在洞里发现婴儿，如何救下他，又如何把他抚养成人，最后再次求国王开恩。
        - id: ch02-b18
          speaker: narrator
          text: >-
            随着老妇人的故事一点点展开，国王脸色越来越阴沉，神情越来越可怕，最后几乎被愤怒和震惊逼得昏过去。原来，眼前这个年轻人就是他残忍杀死普鲁娜以后，留在山洞中等死的婴儿。命运竟连这一回也不肯饶过他！老隐士的预言再次清清楚楚地涌上心头。国王真希望能找到一个足够充分的借口，马上把少年处死。可努尔·穆罕默德的罪过远远不够判这样的刑罚。真要下令杀他，所有人都会叫国王暴君。事实上，他根本不敢这么做。
        - id: ch02-b19
          speaker: king
          text: >-
            只要这个年轻人加入我的军队，我就免了他的罪。军中需要这样的人，规矩也能好好管教他。
        - id: ch02-b20
          speaker: narrator
          text: >-
            老妇人还是哀求。没有儿子，她无法生活；而儿子要去当兵，也几乎和入狱一样让她害怕。国王却打定主意，一定要把少年攥在自己手里。他答应给老妇人一笔丰厚的年金，足以让她今后生活无忧，这才终于安抚了她。努尔·穆罕默德自己倒非常欢喜。他一直盼着能有所作为，如今便依照命令正式登记入伍，成了国王军队中的一名士兵。
    - id: ch03
      title: 一次次死里逃生
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            当兵以后，努尔·穆罕默德似乎格外走运。每逢有艰难危险的任务，他总会成为被挑中的人之一。少年虽然有些意外，心里却很高兴。有几次，他只差一点就要丧命，可处境越是凶险，越让他有机会显出过人的勇气。他为人又谦逊又慷慨，很快便深受长官和同袍喜爱。所以，没过多久，他被选进国王近卫军的精锐队伍，并没有让任何人觉得奇怪。
        - id: ch03-b02
          speaker: narrator
          text: >-
            其实，国王把他送进一次次险境，一直盼着他死在某场战斗里。眼看少年非但没死，反而越经磨难越出色，国王决定使出更直接、更狠毒的手段。一天，努尔·穆罕默德加入近卫军不久，被选中随队护送国王穿城。队伍原本走得十分顺利，一个男人却忽然手持匕首冲出巷口，直扑国王。努尔·穆罕默德在所有侍卫中离得最近。他没有迟疑，立即挡在国王身前，替国王挨了本来刺向他的那一刀。
        - id: ch03-b03
          speaker: narrator
          text: >-
            幸好凶手出手仓促，匕首从他的胸骨上滑开。伤势虽重，他凭着年轻力壮，很快便康复了。国王不得不奖赏这桩英勇事迹，只好把他升为贴身侍从。
        - id: ch03-b04
          speaker: narrator
          text: >-
            此后，努尔·穆罕默德遇上的怪事简直没完没了。近卫军军官常被派去办各种秘密而危险的差事，而只要轮到他当值，这种差事就会离奇地冒出来。有一回，他在旅途中走过一座人行小桥，桥忽然在脚下垮掉。又有一回，他遭到一群持械强盗围攻。他走过山口时，曾有巨石朝他滚来。他穿过城中窄巷时，也有沉重的石檐从屋顶坠落，正好砸在他脚边。
        - id: ch03-b05
          speaker: narrator
          text: >-
            经历得多了，努尔·穆罕默德觉得自己大概在什么地方结了仇。可他天性快活，并不十分在意。他每次总有办法逃脱，想到下一场奇遇时，觉得好笑多过担心。
        - id: ch03-b06
          speaker: narrator
          text: >-
            城里有条规矩，当日统领王宫卫兵的军官，一日三餐都由御膳房送来。轮到努尔·穆罕默德值勤时，他正要吃一锅香喷喷的炖肉，一条瘦骨嶙峋的野狗从敞开的卫兵室门外探进头来。这种饥饿的狗在东方各国的街上随处可见。它眼巴巴地盯着少年，馋得流出口水，鼻孔不停翕动。
        - id: ch03-b07
          speaker: narrator
          text: >-
            努尔·穆罕默德心地善良，便从炖肉里挑出一大块，走到门边扔给外面的狗。饿狗立刻扑上去，贪婪地一口吞下。它刚要转身离开，却突然踉跄起来，接着倒在地上，翻了个身便死了。少年原本懒洋洋地望着它，此刻一动不动地站了片刻，随后才轻轻吹着口哨回到屋里。他收拢起剩下的整顿饭菜，仔细包好，准备带到别处埋掉，又叫人把那些空盘子送回王宫。
        - id: ch03-b08
          speaker: narrator
          text: >-
            第二天早朝，努尔·穆罕默德又精神十足、笑容满面地出现了。国王简直气疯，却决心再试一回。当晚，他把少年召来，命他给远方一个行省的总督送一封密函。
        - id: ch03-b09
          speaker: king
          text: >-
            立刻去准备，明早出发。等你临走的时候，我会亲手把文书交给你。
    - id: ch04
      title: 头巾里的密函
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            那个行省离王宫有四五天路程。总督是国王最忠诚的臣仆，他守口如瓶，还一直以服从命令为荣。他侍奉国王多年，是个久经考验的老臣。总督的妻子也与王家关系深厚。王后几年前去世后，她几乎代替了母亲的位置，一直照顾着年轻的公主。恰好在这之前，公主因为身体欠佳，被送到另一个偏远行省休养。她在那里时，总督夫人曾请她一有空便来家中小住。公主欣然答应。国王决定派努尔·穆罕默德送出神秘密函时，她正住在总督府。
        - id: ch04-b02
          speaker: narrator
          text: >-
            第二天清早，努尔·穆罕默德来到内廷。他最好的马已经备妥，鞍袋里有食物，腰带里也扎着钱。国王交给他一只密封纸包，叮嘱他只能亲手交给总督，绝不能给旁人。少年把密函藏进头巾，翻身上马。五分钟后，他已经出了城门。
        - id: ch04-b03
          speaker: narrator
          text: >-
            天气热得厉害，可努尔·穆罕默德只想着，贵重的密函越早送到越好。他每晚大半时间都骑马赶路，只在白天最热的时辰停下休息。这样一来，到了第三天正午，他已经接近目的地的城镇。道路四周连一个人影也没有。他在马背上颠得浑身僵硬，口干舌燥，又渴又累，只能越过围墙，眼巴巴地望着里面的花园。他看见清凉的喷泉、青翠的草地、浓荫覆盖的杏树林，还有一棵棵高大的桑树，只盼自己已经身在其中。
        - id: ch04-b04
          speaker: narrator
          text: >-
            到了城堡，守卫认出国王近卫军的制服，立即放他进去。总督正在午休，傍晚才能见客。努尔·穆罕默德把马交给仆从，走进美丽的花园，在树荫下仰面躺倒。他听着枝头鸟雀啼叫，看着鸢鸟在大片天空里盘旋，花间的蜜蜂嗡嗡飞舞。那声音叫人昏昏欲睡，几分钟后，他便睡着了。
        - id: ch04-b05
          speaker: narrator
          text: >-
            每天下午最热的两三个钟头，总督夫妇都在各自房中休息，府里大多数人也是如此。公主却像许多少女一样闲不住，宁愿在花园散步，也不肯躺在一堆软垫上。那些肥胖的老女官和侍女困得眼皮都撑不开时，她偏要保持清醒，还要她们陪着说话做事，真叫人受不了。有时，她也会装作睡着。等身边的人如释重负，纷纷跟着入睡，她便独自起身溜出门，只松松披着面纱。年长的女主人若是发现，总要严厉训她。可公主只是笑一笑，下一次仍然照旧。
        - id: ch04-b06
          speaker: narrator
          text: >-
            这天下午，公主把熟睡的侍女留在房里，独自走进大花园。四下无人，她安心逛着每个熟悉的角落。转过一个弯，她忽然停步，差点绊在一个熟睡的男人身上。那是个年轻军官，穿着近卫军制服，满身旅尘，脸也晒成了褐色。
        - id: ch04-b07
          speaker: narrator
          text: >-
            公主美丽聪慧，却有个很大的好奇心，清闲的生活又给了她足够的工夫去满足它。年轻人的头巾里露出一封信的一角。那是什么信？又要交给谁？她拢紧面纱，踮脚走近，先抽出一点，又抽出一点，一个硕大的封印露了出来。
        - id: ch04-b08
          speaker: narrator
          text: >-
            公主认出父亲的印记，停了片刻，不免为自己的举动有些羞愧。可是，偷拿一封本不该给她看的信，那份诱惑实在太大，她还是把信完全抽了出来。她马上又想到，这个可怜的军官一旦丢失密函，便会被处死，无论如何都得把信放回去。可要让它原样回到头巾褶缝里，并不那么容易。更何况，信拿在手中，简直像在灼烧她，叫她非得打开看看里面写了什么不可。
        - id: ch04-b09
          speaker: narrator
          text: >-
            烈日把封蜡晒得发黏，公主没费多少力气便把它与信纸分开。她打开密函，看见上面写着：“秘密处死带来此信的使者，立即执行。不得问话。”
        - id: ch04-b10
          speaker: narrator
          text: >-
            公主脸色煞白。她觉得这实在可耻，绝不能让这样一个英俊的年轻人被砍头。可是，该怎样阻止，她一时又想不明白。她必须想出一个办法，还得找个不会被人打扰的地方，因为花园里随时可能有人经过。公主轻手轻脚地回到房中，把自己关起来，取出一张纸，另写了一封信：“立即公开将带来此信的使者与公主成婚。不得问话。”
        - id: ch04-b11
          speaker: narrator
          text: >-
            她又设法从原信取下封印，重新粘好。除非有人仔细查看，谁也瞧不出信被打开过。公主又怕又激动，浑身发抖。她溜回花园，把信塞进仍在熟睡的军官头巾里，匆忙回房。这件事终于办成了。
        - id: ch04-b12
          speaker: narrator
          text: >-
            下午很晚，努尔·穆罕默德醒了。他确认密函还在，便去准备谒见总督。到了总督面前，他依照命令从头巾中取出信，亲手递了过去。总督读完，确实有点惊讶。可信上叫他不得问话，而他最懂得服从命令。他马上叫来妻子，要她替公主准备婚礼。
        - id: ch04-b13
          speaker: governor_wife
          text: 胡说！你到底在讲什么？
          emotion: surprised
        - id: ch04-b14
          speaker: governor
          text: >-
            这是国王的命令。你照我的话去办。信上写着“立即”，也写着“不得问话”，所以婚礼今晚就得举行。
        - id: ch04-b15
          speaker: narrator
          text: 总督夫人提出一个又一个反对理由。她越争辩，总督反而越坚决。
        - id: ch04-b16
          speaker: governor
          text: >-
            我知道该怎么服从命令。这封信写得再清楚不过，就像我脸上的鼻子一样明白！
        - id: ch04-b17
          speaker: narrator
          text: >-
            公主被叫来以后，听到消息竟十分平静，让总督夫妇有点意外。接着，努尔·穆罕默德也被告知此事。他大吃一惊，可他以为这是国王忽然赐下的无上荣耀，自然只有万分欢喜。整座城堡顿时忙得乱成一团。消息传进城中，全城也跟着沸腾起来。每个人都四处奔跑，谁都想把所有事情同时办完。老总督则顶着一头竖立的乱发，在混乱中走来走去，嘴里不停念叨着“服从命令”。
        - id: ch04-b18
          speaker: narrator
          text: >-
            当晚，婚礼真的举行了。城堡里摆开盛大的宴席，士兵的营房里也有一场。整座城镇处处张灯结彩，美丽的花园更被灯火照得辉煌灿烂。所有见到这番景象的人都说，从来没有看过这样壮观的场面。许多年后，他们直到生命尽头，仍在谈论那一夜。
    - id: ch05
      title: 命运终究实现
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            第二天，总督派出一队衣饰华丽的骑兵，护送公主和她的新郎前去见国王。他还另外派了一名骑马的信使，让那人先于整个队伍出发，带着一封亲笔信，把这场突然举行的婚事从头到尾禀报给国王。
        - id: ch05-b02
          speaker: narrator
          text: >-
            国王收到总督的信，整张脸顿时涨得通红，红得让所有人都以为他快要中风了。大家又担心，又急着知道究竟出了什么事，他却一句也不肯解释，只冲进一间屋子，把门反锁起来。他在里面暴跳如雷，又吼又骂，一直闹到自己精疲力尽。安静下来又过了一阵，他终于开始盘算，事情既然已经如此，还是设法接受这个事实为好。
        - id: ch05-b03
          speaker: narrator
          text: >-
            老总督很机灵，连国王原来的密函也送了回来。国王一看，几乎可以断定，新信上的字迹出自女儿之手。他一向疼爱公主。女儿虽然做了坏事，他却不愿砍掉她的脑袋。国王也绝不想让众人知道真相，因为那会叫他显得十分可笑。想得越久，他越觉得，最明智的办法就是装出若无其事的样子，把这件事体面地接纳下来，让天下人以为这门婚事从头到尾都是他自愿促成的。
        - id: ch05-b04
          speaker: narrator
          text: >-
            年轻夫妻抵达王宫时，国王果然摆出体面的样子，以全副礼仪隆重接待了他们，还赐给女婿一个行省，让他在那里治理百姓。努尔·穆罕默德很快便证明，自己做总督时和做士兵时一样能干，一样正直。后来，老国王去世了。那个曾被他丢在山洞中等死的孩子继承王位，成了新的国王，并且长久而幸福地统治着这个国家。
        - id: ch05-b05
          speaker: narrator
          text: >-
            努尔·穆罕默德的老母亲后来搬进“儿子”的宫殿，在那里又安稳生活了许多年，最后平静地离开人世。至于公主，她虽然靠一场计谋得到了丈夫，婚后却发现自己骗不了努尔·穆罕默德。于是，她从此不再尝试，只把日子花在教养儿女和责骂侍女上。
        - id: ch05-b06
          speaker: narrator
          text: >-
            至于那位预言命运的老隐士，从此再也没有人发现过他的任何踪迹。不过，国王当年借宿过一整夜的那座山洞依然还在，洞口前面的地上直到今天仍堆着一层又一层厚厚的落叶。
        - id: ch05-b07
          speaker: narrator
          text: 这个故事，是一位印度人讲给作者听的。
