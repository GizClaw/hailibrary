audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, grave, and attentive to wonder
        timbre: clear and resonant
        pace: measured
        pitch: medium
    wolverine:
      display_name: Wolverine
      tts:
        delivery: boastful, sharp, and quick to complain
        timbre: wiry and rough
        pace: brisk
        pitch: medium
    rock:
      display_name: Rock
      tts:
        delivery: dry, stubborn, and matter-of-fact
        timbre: deep and stony
        pace: slow
        pitch: low
    wolf:
      display_name: Wolf
      tts:
        delivery: direct and disapproving
        timbre: full and rugged
        pace: measured
        pitch: medium-low
    fox:
      display_name: Fox
      tts:
        delivery: keen, curious, and unsparing
        timbre: clear and lean
        pace: measured
        pitch: medium
    frog:
      display_name: Frog
      tts:
        delivery: obliging, gentle, and good-natured
        timbre: soft and rounded
        pace: unhurried
        pitch: medium-high
    mouse:
      display_name: Mouse
      tts:
        delivery: patient, practical, and quietly capable
        timbre: small and clear
        pace: measured
