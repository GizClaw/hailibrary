audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 清楚从容，像在为听众介绍一本古老的童话集
        timbre: 温暖明净
        pace: 舒缓
        pitch: 中音
    captor:
      display_name: 捕获本耶普的年轻人
      tts: {delivery: 自信任性，危急时惊慌急促, timbre: 年轻明亮, pace: 适中, pitch: 中音}
    young_man_1:
      display_name: 年轻人甲
      tts: {delivery: 直率警觉，遇险时紧张, timbre: 清亮, pace: 稍快, pitch: 中音}
    young_man_2:
      display_name: 年轻人乙
      tts: {delivery: 朴实谨慎，遇险时紧张, timbre: 温厚, pace: 适中, pitch: 中音}
    young_man_3:
      display_name: 年轻人丙
      tts: {delivery: 活泼爽快，遇险时紧张, timbre: 年轻清脆, pace: 稍快, pitch: 中高音}
  chapters:
    - id: ch01
      title: 盛夏的水塘
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            很久很久以前，在世界另一头的遥远地方，一群年轻人离开营地，为妻子和孩子寻找食物。天气炎热，他们却很喜欢。一路上，大伙儿赛跑，比谁把长矛掷得更远，还比谁最会投回旋镖。那种奇特的武器飞出去以后，总会回到投掷者手中。他们边走边比，自然走得不快。
        - id: ch01-b02
          speaker: narrator
          text: >-
            过了一阵，他们来到一片平地。洪水季节，这里满是水。如今正是盛夏，只剩一汪汪水塘。每一汪都围着一圈草木，里面长满灯心草。当地人爱吃灯心草的根，觉得味道像洋葱一样好。一个年轻人提议挖些带回营地。大伙儿很快用柳条梢编好一只篮子，正要蹚进水里拔草根，队伍里忽然有人叫住大家。
        - id: ch01-b03
          speaker: captor
          text: >-
            等等！这种活儿本来就该让女人和孩子做，我们何必浪费时间？让她们自己来挖吧。我们去钓鳗鱼，水里能钓到什么都行。
        - id: ch01-b04
          speaker: narrator
          text: >-
            这个主意让所有人都很高兴。他们整理好用黄含羞草树皮搓成的钓线，又去找鱼饵。多数人找来蚯蚓。刚才说话的年轻人却从兽皮袋里取出一块准备当晚饭的生肉，避开同伴的目光，割下一小块挂在钩上。
    - id: ch02
      title: 可怕的幼崽
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            众人耐心钓了很久，一次也没有鱼来咬钩。太阳渐渐西斜，他们眼看就要空手回营地，连一篮草根也没有。这时，用生肉作饵的年轻人突然发现钓线沉进水里。他猜水下是一条很重的大鱼，可那东西力气大得惊人，拽得他几乎站不住。两边僵持了好几分钟。他若不松手，就要被拖下水，只好赶紧向朋友们求助。
        - id: ch02-b02
          speaker: narrator
          text: >-
            大家又害怕又发抖，合力将那东西弄上了岸。它不像牛犊，也不像海豹，却仿佛两种动物各占一点，后面还有一条宽阔的长尾巴。年轻人互相望着，只觉得一股寒意爬上脊背。尽管谁也不曾亲眼见过这种怪物，在场的每个人还是立刻知道了它是什么。这正是可怕的本耶普的幼崽。
        - id: ch02-b03
          speaker: narrator
          text: >-
            突然，一声低低的哀号打破了寂静，水塘对面又响起一声回应。母本耶普离开巢穴，浮出水面，朝他们逼来。她那双吓人的黄眼睛里闪着怒火。
        - id: ch02-b04
          speakers: [young_man_1, young_man_2, young_man_3]
          ensemble: chorus
          text: 快放了它！快放了它！
          emotion: fearful
        - id: ch02-b05
          speaker: narrator
          text: 年轻人们压低声音互相催促，可捕获幼崽的人坚决不肯放手。
        - id: ch02-b06
          speaker: captor
          text: >-
            这是我捉到的，当然得归我。我答应过心爱的姑娘，要带够三天的肉，让她父亲一家好好吃一顿。小本耶普不能吃，给她的弟弟妹妹当玩伴也不错。
        - id: ch02-b07
          speaker: narrator
          text: >-
            他朝母本耶普掷出长矛，不让她靠近，接着把幼崽扛在肩上，往营地走去。身后那位可怜的母亲声声哀号，他却根本不理会。
    - id: ch03
      title: 洪水与黑天鹅
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            太阳快落山了。平原已经暗下来，山峰顶上还留着亮光。年轻人刚刚不再害怕，身后却传来低沉的奔流声。他们回头一看，水塘正在缓缓升高，拖幼崽上岸的地方已经被水淹没。
        - id: ch03-b02
          speakers: [young_man_1, young_man_2, young_man_3]
          ensemble: chorus
          text: 天上根本没有云，水怎么会涨得这么高？以前从没见过啊！
          emotion: surprised
        - id: ch03-b03
          speaker: narrator
          text: >-
            众人愣在那里，像被冻住了一样。下一刻，他们转身拼命逃跑。扛着本耶普的年轻人跑得最快。他奔上一座能俯瞰整片平原的高峰，停下来喘气，回头看看自己是否安全。可哪里还有安全？洪水已经化作一片汪洋，水面上只剩树梢，连树梢也在不断消失。他们非得跑得更快，才有机会逃出去。
        - id: ch03-b04
          speaker: narrator
          text: >-
            大伙儿继续飞奔，几乎感觉不到脚下的地面。最后，他们扑倒在一个个挖进土里的洞穴前。所有人都出生在那里。老人坐在洞外，孩子正在玩耍，女人聚在一起说话。小本耶普突然落在他们中间，孩子们几乎个个都明白，一场大祸已经追来了。
        - id: ch03-b05
          speaker: young_man_1
          text: 洪水！洪水来了！
          emotion: fearful
        - id: ch03-b06
          speaker: narrator
          text: >-
            洪水果然正爬上山脊，虽然缓慢，却一刻也不停。父母抱紧孩子，仿佛这样就能挡住水。闯下大祸的年轻人抓住心爱的姑娘，向她喊道。
        - id: ch03-b07
          speaker: captor
          text: 我带你爬到那棵树顶上！水再高，也到不了那里！
          emotion: fearful
        - id: ch03-b08
          speaker: narrator
          text: >-
            话音还没落，一样冰冷的东西碰到了他。他低头看去，双脚已经变成鸟爪。他再看怀里的姑娘，身边站着的竟是一只黑色大鸟。他转向朋友们，那里只剩一群笨重的大鸟，正在扑扇翅膀。
        - id: ch03-b09
          speaker: narrator
          text: >-
            年轻人想抬手遮住脸，手却没了，只有翅膀尖。他想说话，细长的喉咙里传出一种陌生的叫声。水已经涨到腰间，他却轻易浮在水上。水面映出的，是一只黑天鹅。四周还有许多只和他一样的黑天鹅。
        - id: ch03-b10
          speaker: narrator
          text: >-
            这些天鹅再也没能变回人。但直到今天，它们依然不同于别的天鹅。夜深以后，留心的人会听见它们彼此交谈，那绝不是天鹅的语言。有时还会听到说笑声，和我们熟悉的天鹅叫声完全不同。
    - id: ch04
      title: 黑水下的宅邸
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            母本耶普带着幼崽回了家，洪水随后退回原来的水道。从此，人人都躲着她居住的那一边水塘。谁也说不准，她会不会忽然从水里探出头，把人拖进巨大的嘴里。
        - id: ch04-b02
          speaker: narrator
          text: >-
            不过人们都说，在水塘漆黑的水底，母本耶普住在一座装满美丽宝物的宅邸里。那些东西奇妙得很，住在地上的凡人根本想不到。可人们到底是怎么知道的，我就没法告诉你了。毕竟，那座宅邸从来没有人亲眼见过。
        - id: ch04-b03
          speaker: narrator
          text: 本故事收录自《人类学学会杂志》。
