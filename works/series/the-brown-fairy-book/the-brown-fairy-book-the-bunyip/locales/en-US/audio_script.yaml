  chapters:
    - id: ch01
      title: The Pools on the Plain
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long, long ago, far away on the other side of the world, some young men left their camp to find food for their wives and children. The sun was hot, but they liked the heat. As they went, they raced each other. They tested who could throw a spear farthest, and who could best cast the strange curved weapon called a boomerang, which always comes back to the thrower. With all those contests, they did not travel very quickly.
        - id: ch01-b02
          speaker: narrator
          text: In time they came to a wide, flat place. Floodwater covered it at other times of year, but now it was the height of summer. Only a chain of pools remained. Plants fringed each pool, and bulrushes stood farther in. The people of that country liked bulrush roots and thought them as good as onions. One young man suggested gathering some to carry home.
        - id: ch01-b03
          speaker: narrator
          text: They quickly wove willow tops into a basket. They were about to wade in and pull up the roots when another young man called out.
        - id: ch01-b04
          speaker: young_man_1
          text: Why waste our time on work meant for women and children? They can come for the roots themselves. We'll fish for eels instead, and catch whatever else we can.
        - id: ch01-b05
          speaker: narrator
          text: The others loved that idea. They prepared fishing lines made from the bark of the yellow mimosa and searched for bait. Most chose worms. But one young man had a piece of raw meat for his dinner tucked inside his skin wallet. Without letting his companions see, he cut off a small piece and fixed it to his hook.
        - id: ch01-b06
          speaker: narrator
          text: They cast their lines and waited. A long time passed without a single bite. The sun dropped low, and it began to look as though they would return with nothing at all, not even a basket of roots.
    - id: ch02
      title: The Bunyip's Cub
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Then the line baited with raw meat suddenly vanished beneath the water. The young man thought a very heavy fish had taken it. Whatever was down there pulled so hard that he could barely stay on his feet. For several minutes, it seemed he would have to release the line or be dragged into the pool.
        - id: ch02-b02
          speaker: captor
          text: Help me! I can't hold it alone!
          emotion: fearful
        - id: ch02-b03
          speaker: narrator
          text: His friends rushed to help. All of them trembled at the thought of what might rise from the water. At last, working together, they hauled the creature onto the bank. It was not a calf and not a seal, but looked something like both, with a long, broad tail.
        - id: ch02-b04
          speaker: narrator
          text: The young men stared at one another in horror as cold shivers ran down their backs. None of them had ever seen such a creature before. Yet every one of them knew exactly what lay there. It was the cub of the dreadful Bunyip.
        - id: ch02-b05
          speaker: narrator
          text: A low wail broke the silence. Another wail answered from across the pool. The mother Bunyip rose from her den and came toward them, with rage flashing in her terrible yellow eyes.
        - id: ch02-b06
          speakers: [young_man_1, young_man_2, young_man_3]
          ensemble: chorus
          text: Let the little one go. Let it go!
          emotion: fearful
        - id: ch02-b07
          speaker: narrator
          text: They spoke in frightened whispers, but the young man holding the cub refused. He said he had caught it and meant to keep it.
        - id: ch02-b08
          speaker: captor
          text: I promised my sweetheart enough meat to feed everyone in her father's house for three days. We can't eat this little Bunyip, but her brothers and sisters can have it to play with.
        - id: ch02-b09
          speaker: narrator
          text: He hurled his spear at the mother to hold her back. Then he lifted the little Bunyip onto his shoulders and started toward the camp. Behind him, the poor mother cried in distress, but he paid no attention.
    - id: ch03
      title: The Rising Water
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Sunset was near by then. Shadow covered the plain, though the mountain tops still shone brightly. The young men had stopped being afraid. Then a low rushing sound rose behind them, and they spun around. Water was slowly filling the pool. The bank where they had pulled out the little Bunyip had already disappeared.
        - id: ch03-b02
          speaker: young_man_2
          text: How can the water be rising? There isn't one cloud in the sky, and we've never seen it climb so high.
          emotion: surprised
        - id: ch03-b03
          speaker: narrator
          text: For one moment, they stood frozen and watched. Then they turned and ran with all their strength. The man carrying the Bunyip ran faster than any of them.
        - id: ch03-b04
          speaker: narrator
          text: He reached a high peak above the plain and stopped for breath. When he looked back to see whether he was safe, he found a sea where the plain had been. Only the tree tops still showed above the water, and even those were quickly vanishing. If they hoped to escape, they had to run faster still.
        - id: ch03-b05
          speaker: narrator
          text: Away they flew, hardly feeling the ground beneath them. At last they threw themselves down before the hollows scooped from the earth where they had all been born. The old men sat outside. Children played nearby, and the women talked together. Then the little Bunyip tumbled into their midst. Almost every child knew at once that something terrible was coming.
        - id: ch03-b06
          speaker: young_man_3
          text: The water! Look, the water is coming!
          emotion: fearful
        - id: ch03-b07
          speaker: narrator
          text: There it was, rising slowly but steadily up the ridge itself. Parents held tight to their children, as if clinging together might somehow stop the flood. The young man who had brought this disaster upon them seized his sweetheart.
        - id: ch03-b08
          speaker: captor
          text: Come with me. We'll climb to the top of that tree. The water can never reach us there.
          emotion: fearful
        - id: ch03-b09
          speaker: narrator
          text: As he spoke, something cold touched him. He looked quickly at his feet and shuddered. His feet were gone. Bird claws had taken their place. He looked at the girl in his arms and saw a great black bird beside him. When he turned toward his friends, a flock of large, awkward creatures stood where the young men had been, beating their wings.
        - id: ch03-b10
          speaker: narrator
          text: He raised his hands to cover his face, but there were no hands now, only the tips of wings. He tried to speak. A strange sound came from a throat that had suddenly grown long and slender. The flood had already reached his waist, yet he found that he could sit easily on the water. On its surface, he saw the reflection of a black swan, one among many.
    - id: ch04
      title: The Black Swans
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The swans never became men again. Even now, though, they are different from other swans. At night, anyone who listens may hear them speaking in a language that is certainly not the language of swans. There are sounds of laughter and conversation, unlike any cry made by the swans we know.
        - id: ch04-b02
          speaker: narrator
          text: The mother carried her little Bunyip home. After that, the floodwater sank into its old channels. Everyone still avoids the side of the pool where she lives. No one knows when she might suddenly lift her head from the water and pull someone into her mighty jaws.
        - id: ch04-b03
          speaker: narrator
          text: People say that beneath the pool's black water, the Bunyip has a house filled with beautiful things, wonders beyond anything known to the mortals who live on the earth.
        - id: ch04-b04
          speaker: narrator
          text: But how those people could know, I cannot tell you. No one has ever seen it.
