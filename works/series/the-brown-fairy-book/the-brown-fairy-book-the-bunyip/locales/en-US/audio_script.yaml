audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, grave, and attentive to wonder
        timbre: clear and resonant
        pace: measured
        pitch: medium
    captor:
      display_name: The Captor
      tts:
        delivery: bold, stubborn, and increasingly frightened
        timbre: strong and youthful
        pace: energetic
        pitch: medium
    young_man_1:
      display_name: First Young Man
      tts:
        delivery: lively and impulsive
        timbre: clear and young
        pace: quick
        pitch: medium-high
    young_man_2:
      display_name: Second Young Man
      tts:
        delivery: wary and earnest
        timbre: warm and youthful
        pace: measured
