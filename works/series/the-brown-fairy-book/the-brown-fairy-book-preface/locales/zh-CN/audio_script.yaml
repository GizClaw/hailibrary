audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 清楚从容，像在为听众介绍一本古老的童话集
        timbre: 温暖明净
        pace: 舒缓
        pitch: 中音
  chapters:
    - id: ch01
      title: 前十一篇
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            有玫瑰如何对待柏树
            脚注
            持球人与恶魔
            持球人怎样完成了任务
            本耶普怪兽
            爱抱怨的父亲
            雅拉的故事
            机灵的野兔
            乌龟和他的新娘
            胆小鬼盖拉尔德怎样受到了惩罚
            哈博吉。
    - id: ch02
      title: 中间十一篇
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            有小弟弟怎样救出了哥哥们
            库蒙戈埃的圣乳
            邪恶的狼獾
            老鼠女儿的丈夫
            美人鱼和男孩
            皮维和卡博
            精灵少女
            几种野兽怎样成了家畜
            命运女神与樵夫
            中了魔法的头颅
            太阳的妹妹。
    - id: ch03
      title: 后十一篇
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            有王子与三位命运女神
            狐狸和拉普人
            猫咪基萨
            狮子和猫
            谁最愚蠢
            阿斯蒙德和西格妮
            吕贝察尔
            想要战胜命运的国王
            善良老实的瓦利·达德
            乌龟和淘气猴子的故事
            鱼骑士。书名《棕色童话书》。
