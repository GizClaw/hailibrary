audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 清楚从容，像在为听众介绍一本古老的童话集
        timbre: 温暖明净
        pace: 舒缓
        pitch: 中音
    young_man:
      display_name: 年轻渔夫
      tts: {delivery: 朴实坚韧，受惊时克制，面对妻子时坦率温和, timbre: 清朗结实, pace: 适中, pitch: 中音}
    rival:
      display_name: 心怀嫉妒的渔夫
      tts: {delivery: 表面热络，内里阴沉狡猾，设计害人时故作自然, timbre: 略显粗沉, pace: 适中, pitch: 中低音}
    elf_maiden:
      display_name: 精灵姑娘
      tts: {delivery: 明快神秘，作出吩咐时从容坚定，面对丈夫时亲切坦率, timbre: 清澈柔和, pace: 舒缓, pitch: 中高音}
  chapters:
    - id: ch01
      title: 冬尽出海
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，一座小村庄里有两个年轻人，他们同时爱上了一个姑娘。冬天，那里几乎整日整夜都是黑的，只有正午前后的一小会儿，天色才稍稍亮些。两个年轻人常常暗中较劲，看谁能请姑娘坐上雪橇，在北极光下兜风，又看谁能劝她去邻村的谷仓跳舞。
        - id: ch01-b02
          speaker: narrator
          text: >-
            春天一到，白昼渐渐变长。村民们看见太阳，人人心里都欢喜。他们选好日子，把船拖下水，准备去北面几英里外的岛屿，在海湾里撒开大网。两个年轻人和姑娘也跟着全村人一同出发。海面上尽是说笑声，大家像一群喜鹊那样聊个不停，还一路唱着喜欢的歌。到岸以后，船上的东西一样样搬下来，场面好不热闹。
        - id: ch01-b03
          speaker: narrator
          text: >-
            这是一处有名的渔场，他们要住在小木屋里，等秋天和坏天气回来时才离开。姑娘、两个年轻人和几位朋友恰好同住一屋，每天又乘同一条船打鱼。慢慢地，其中一个年轻人看明白了，姑娘待他的同伴比待他亲近。他起先只说自己看错了，很长一段时间里，凡是不愿看见的，他都装作没看见。可真相总能从缝隙里钻出来。最后，他不再欺骗自己，开始盘算怎样除掉情敌。
        - id: ch01-b04
          speaker: narrator
          text: >-
            他想出的计策要过几个月才有机会实行。他越想越满意，脸上却一点也没有露出来，只管耐心等着。等到大家收拾行装，要乘船回大陆过冬时，机会终于来了。趁着人人忙乱，他故意让自己的船最后离岸。东西已经装好，船帆也快张起来了，他忽然叫住同伴。
        - id: ch01-b05
          speaker: rival
          text: >-
            糟了，我把最好用的刀落在木屋里了。好兄弟，你快替我拿回来吧。我留在船上起锚，再把舵柄解开。
        - id: ch01-b06
          speaker: narrator
          text: >-
            年轻人没有起疑，跳上岸，沿陡坡走到木屋门前。他停下脚步回头一看，顿时吓呆了。船头已经朝向大海，他被一个人扔在了岛上。除了同伴故意留在窗台上的那把刀，他再也没有任何东西可以倚仗。年轻人被这场背叛惊得好一会儿无法思索，清醒过来以后，他下定决心，无论多难也要活下去，至少要活到能够报仇的那一天。
    - id: ch02
      title: 圣诞夜的来客
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            年轻人把刀收进口袋，走到岛上一处不那么荒凉的地方。那里有一小片树林，他砍下一根合适的树枝做弓，又捡来木屋旁遗落的一截绳子当弓弦。弓一做好，他便跑去海边射下一两只海鸟，拔掉羽毛，烤来当作晚饭。就靠这些办法，他一天又一天地活了下来。几个月过去，圣诞节又来了。
        - id: ch02-b02
          speaker: narrator
          text: >-
            圣诞节前夕，他先走到海边岩石间，又钻进小树林，把海水冲上岸的漂木和大风吹倒的枯枝全都收集起来，在门外堆起高高的柴垛。这样到了圣诞节当天，他就不必再出门找柴。他做完活，站在那里望向大陆，想起去年圣诞夜的热闹舞会。夜里又冷又静，北极光照得他几乎能看见对岸。这时，一条船忽然朝小岛径直驶来。年轻人欢喜得站都站不稳，他太想和另一个人说句话了。
        - id: ch02-b03
          speaker: narrator
          text: >-
            可那条船越近，模样越显得陌生。年轻人一辈子见过的船不少，眼前这条却有种说不出的不同。等它靠岸，他才发现，满船乘客根本不是我们这个世界的生灵。他赶紧藏到柴垛后面，等着看会发生什么。奇异的来客一个接一个跳上岩石，每人都扛着自己要用的东西。女人当中有两个少女，她们比旁人更美，衣着也更华丽，合力抬着两大篮食物。年轻人探出头，想看这么多人挤进小木屋究竟要做什么。恰好两个少女出来察看小岛，他又连忙缩了回去。
        - id: ch02-b04
          speaker: narrator
          text: >-
            两个少女的眼睛很尖，很快发现柴捆后面蜷着一个人。她们起初吓得身子一缩，差点转身逃走。可是年轻人始终一动不动，她们这才放下心来，快活地相视而笑。其中一个弯下腰，伸手掐了他一把。
        - id: ch02-b05
          speaker: elf_maiden
          text: 这东西真古怪。让我试试，他究竟是什么做的。
        - id: ch02-b06
          speaker: narrator
          text: >-
            年轻人的外衣袖口刚好别着一根针。少女的手一碰到他，指头就被狠狠扎了一下，鲜血立刻冒了出来。她放声尖叫，所有来客都从木屋跑出来看出了什么事。他们一看见年轻人，马上朝另一边逃走，又抓起带来的货物，飞快奔回海边。只过了一眨眼的工夫，船、人和东西全都不见了。
        - id: ch02-b07
          speaker: narrator
          text: >-
            他们慌忙中忘下两样东西，一串桌上的钥匙，还有那位被针扎伤的少女。她脸色苍白，孤零零地站在柴垛旁，终于开了口。
        - id: ch02-b08
          speaker: elf_maiden
          text: 你让我流了血，我从今以后就是你的人。你得娶我。
        - id: ch02-b09
          speaker: young_man
          text: 我愿意娶你。不过夏天还远着呢，我们靠什么活下去？
        - id: ch02-b10
          speaker: elf_maiden
          text: 这个你不必担心。只要娶了我，一切都会好的。我很富有，我的家人也一样富有。
        - id: ch02-b11
          speaker: narrator
          text: >-
            年轻人答应娶她，少女也履行了约定。整个漫长的冬天，岛上始终有充足的食物，丈夫却一直不知道食物是从哪里来的。日子一天天过去，春天再度来临，大陆上的渔民也快要扬帆返回小岛了。太阳比先前明亮，风也柔和起来。
    - id: ch03
      title: 一夜建成的家
      blocks:
        - id: ch03-b01
          speaker: elf_maiden
          text: 天暖起来了。我们接下来去哪里？
        - id: ch03-b02
          speaker: young_man
          text: 我去哪里都行。你想去哪儿？
        - id: ch03-b03
          speaker: narrator
          text: >-
            姑娘想搬到岛的另一端，远远避开渔民的小木屋，在那里盖房子。丈夫答应了。两人当天就出发，要找一处能遮风、又靠近溪流的地方，这样以后取水才方便。最后，他们在小岛另一侧的小海湾里找到了。那里仿佛天生就是为他们准备的。走了很远的路，两个人都累坏了，便在几株白桦树之间的苔藓坡上躺下，想好好睡一夜，养足精神，第二天再开始干活。
        - id: ch03-b04
          speaker: elf_maiden
          text: 夜里就算听见什么怪声，你也别动，更不能起来查看。
        - id: ch03-b05
          speaker: young_man
          text: 这儿这么安静，怎么会有声音呢？
        - id: ch03-b06
          speaker: narrator
          text: >-
            年轻人很快睡着，却突然被一阵震耳的巨响惊醒。那声音就像天下所有工匠都挤在他耳边，有的锯木，有的敲锤，有的盖房。他正要跳起来查看，幸好记起妻子的叮嘱，只好重新躺好，一动也不动。等待天亮的时间显得格外漫长。清晨第一缕阳光出现时，两人起身推开白桦树枝，看见选好的地方已经立着一座美丽房屋，门窗样样齐全，所有地方都完工了。
        - id: ch03-b07
          speaker: narrator
          text: 两人摘了野樱桃当早饭。吃完以后，姑娘又交给丈夫一件事。
        - id: ch03-b08
          speaker: elf_maiden
          text: 选一块地方盖牛棚。尺寸要正合适，不能太大，也不能太小。
        - id: ch03-b09
          speaker: narrator
          text: >-
            丈夫照办了，心里却想，他们一头牛也没有，牛棚能有什么用？妻子懂得比他多，他又有些怕她，所以一句也没有问。第二夜，同样的锯木声和敲锤声再次把他惊醒。天亮后，溪边已经多了一座从未见过的漂亮牛棚。里面的牛栏、奶桶、挤奶凳全都备好了，凡是牛棚该有的东西一样不少，独独没有牛。
        - id: ch03-b10
          speaker: narrator
          text: >-
            姑娘接着让他划出地方建一座仓库，这次大小随他的心意。仓库也建成后，她提出去探望父母。两位老人热情欢迎女儿女婿，又把方圆许多英里内的邻居全都邀来，为他们摆下盛大宴席。大家一连庆祝了几个星期，农庄上的活谁也没有去做。年轻夫妻终于厌倦了整日玩乐，声明非回到自己家中不可。临行以前，妻子悄悄提醒丈夫。
        - id: ch03-b11
          speaker: elf_maiden
          text: 跨门槛时一定要尽快跳过去，不然你会吃大亏。
        - id: ch03-b12
          speaker: narrator
          text: >-
            年轻人听她的话，像离弦的箭一样跃过门槛。他刚落到另一边，岳父就把一柄大锤朝他掷来。要不是跳得快，那锤子准会砸断他的两条腿。
    - id: ch04
      title: 跟在身后的牛群
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 回家路上，两人走出一段距离，妻子再次叮嘱他。
        - id: ch04-b02
          speaker: elf_maiden
          text: 在你真正走进家门前，不论看见什么、听见什么，都不要回头。
        - id: ch04-b03
          speaker: narrator
          text: >-
            丈夫答应了。起先一路平静，他渐渐把这件事忘了。可后来，他听见身后传来无数脚步踩踏地面的声音。离家越近，那声音就越响。他终于把手放上了门，以为这样便算安全，于是转头看去。原来后面跟着浩浩荡荡的一大群牛。岳父发现女儿比自己更机灵，便把牛群送来追随女婿。
        - id: ch04-b04
          speaker: narrator
          text: >-
            牛群已有一半跨过围栏，在溪流岸边低头吃草。另一半还在围栏外面，就在年轻人的注视下变得越来越淡，最终什么也没有剩下。不过，已经进来的牛仍足以让他成为富翁。他和妻子过得很幸福，只有一件事叫他烦恼。妻子偶尔会从他眼前消失，等她回来，也从不肯说自己去了哪里。
    - id: ch05
      title: 门槛上的钉子
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 年轻人沉默了很久。后来有一天，他终于忍不住，埋怨妻子总是不告而别。姑娘这才说出了缘故。
        - id: ch05-b02
          speaker: elf_maiden
          text: >-
            亲爱的丈夫，我并不想离开，可每次都是非去不可。只有一个办法能让我留下。你往门槛里钉一枚钉子，我从此就再也不能跨进跨出了。
        - id: ch05-b03
          speaker: narrator
          text: 年轻人照她说的做了。
