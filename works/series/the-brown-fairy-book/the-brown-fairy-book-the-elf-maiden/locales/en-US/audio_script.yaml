audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, grave, and attentive to wonder
        timbre: clear and resonant
        pace: measured
        pitch: medium
    young_man:
      display_name: Young Fisherman
      tts:
        delivery: earnest, resilient, and open to wonder
        timbre: clear and youthful
        pace: measured
        pitch: medium
    rival:
      display_name: Rival Fisherman
      tts:
        delivery: smooth, calculating, and falsely helpful
        timbre: lean and controlled
        pace: measured
        pitch: medium-low
    elf_maiden:
      display_name: Elf Maiden
      tts:
        delivery: bright, assured, and quietly mysterious
        timbre: light and clear
        pace: measured
        pitch: medium-high
  chapters:
    - id: ch01
      title: Left on the Island
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once, two young men in a small village fell in love with the same girl. In winter, darkness filled almost the whole day. Only around noon did it grow a little less dark. Each young man tried to tempt her out for a sleigh ride beneath the flashing Northern Lights, or persuade her to join a dance in a nearby barn.
        - id: ch01-b02
          speaker: narrator
          text: Then spring came and the daylight lingered longer. The villagers rejoiced to see the sun. They chose a day to bring out their boats and spread their great nets in the bays of some islands a few miles north. Everyone joined the fishing trip, including the girl and the two young men.
        - id: ch01-b03
          speaker: narrator
          text: They sailed merrily over the sea, chattering like magpies and singing their favorite songs. When they reached the islands, everyone began unpacking. This was a famous fishing ground, and they meant to live there in little wooden huts until autumn brought bad weather again.
        - id: ch01-b04
          speaker: narrator
          text: The girl and her two admirers shared a hut with several friends, and every day they fished from the same boat. As the weeks passed, one young man saw that she paid far more attention to his companion than to him. At first, he told himself he must be dreaming. For a long while, he shut his eyes tightly against what he did not want to see. But the truth kept wriggling through. At last, he stopped deceiving himself and began searching for a way to defeat his rival.
        - id: ch01-b05
          speaker: narrator
          text: The plan he settled on could not be carried out for months. Yet the longer he considered it, the better he liked it. He showed no sign of his true feelings and waited patiently. His chance finally came on the very day everyone was leaving the islands and sailing back to the mainland for winter. Amid all the bustle, he managed to make their boat the last one away. Just as everything was ready and the sails were about to rise, he called out.
        - id: ch01-b06
          speaker: rival
          text: Oh no! I've left my best knife in the hut. Run back and fetch it for me, won't you? I'll raise the anchor and free the tiller while you're gone.
        - id: ch01-b07
          speaker: narrator
          text: Suspecting nothing, the other young man jumped ashore and climbed the steep bank. At the hut door, he stopped and glanced back. Then he stared in horror. The boat's bow was pointing out to sea. His rival had left him alone on the island.
        - id: ch01-b08
          speaker: narrator
          text: There could be no mistake. He was entirely alone, with nothing to help him but the knife his false friend had deliberately left on the window ledge. At first the betrayal stunned him so deeply that he could not think. Then he pulled himself together. Somehow, he would stay alive, if only so he could take revenge.
        - id: ch01-b09
          speaker: narrator
          text: He pocketed the knife and went to a less barren part of the island, where a small grove stood. He cut a bow from one tree and strung it with a piece of cord that someone had left lying near the huts. Once the bow was ready, he hurried down to the shore. He shot one or two seabirds, plucked them, and cooked them for his supper.
    - id: ch02
      title: Visitors on Christmas Eve
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: He lived this way as the months went by, and Christmas returned. On Christmas Eve, the young man searched along the rocks and through the grove. He gathered every piece of driftwood that the sea had washed ashore and every branch the gales had blown down. He built it all into a great stack outside the hut, enough to spare him from gathering any more wood on Christmas Day.
        - id: ch02-b02
          speaker: narrator
          text: When the work was done, he looked toward the mainland and remembered the merry dance of the Christmas Eve before. The night was cold and still. In the Northern Lights, he could almost see the opposite coast. Then he noticed a boat steering straight toward the island.
        - id: ch02-b03
          speaker: narrator
          text: At first, the joy nearly made him weak. After all those lonely months, the chance to speak to another person was wonderful. But as the boat came closer, something about it seemed unlike every boat he had known in his life. He could not have said what was different. When it reached the shore, he saw that its passengers were beings from another world. He quickly hid behind the woodpile and waited to see what would happen.
        - id: ch02-b04
          speaker: narrator
          text: The strange people jumped onto the rocks one by one. Each of them carried a load of something they meant to use. Among the women were two young girls, more beautiful and finely dressed than all the rest. Between them, they carried two large baskets filled with food. The young man cautiously peered from his hiding place. He wondered what such a crowd could possibly be doing inside that tiny hut.
        - id: ch02-b05
          speaker: narrator
          text: He drew back at once when the girls came outside again and began looking around the island. Their sharp eyes soon found him crouching behind the bundles of sticks. They started in fear and almost ran. But he stayed perfectly still, so they grew bolder and laughed together.
        - id: ch02-b06
          speaker: elf_maiden
          text: What a strange creature! Let's find out what he's made of.
        - id: ch02-b07
          speaker: narrator
          text: The girl bent down and gave him a pinch. A pin was sticking from the sleeve of his jacket. The moment her hand touched him, it pricked her so sharply that blood appeared. She screamed so loudly that all the strange people came running out of the hut to learn what was wrong.
        - id: ch02-b08
          speaker: narrator
          text: The moment the strange folk saw the man, they turned and fled. They snatched up the things they had brought and raced down to the shore. In an instant, the boat, its passengers, and all their goods had completely vanished.
        - id: ch02-b09
          speaker: narrator
          text: In their haste, they forgot two things. A bundle of keys still lay on the table, and the girl who had pricked her hand stood pale and helpless beside the woodpile.
        - id: ch02-b10
          speaker: elf_maiden
          text: You must make me your wife now. You drew my blood, so I belong to you.
        - id: ch02-b11
          speaker: young_man
          text: Why not? I'm willing. But how can we possibly live here until summer returns?
        - id: ch02-b12
          speaker: elf_maiden
          text: Don't worry about that. Marry me, and all will be well. I am very rich, and so is all my family.
        - id: ch02-b13
          speaker: narrator
          text: The young man promised to marry her, and the girl kept her side of the bargain. Food remained plentiful on the island through the long winter, though he never discovered where it came from.
    - id: ch03
      title: A House Built in the Night
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: In time, spring returned, and soon the fishing folk would sail out again from the mainland.
        - id: ch03-b02
          speaker: elf_maiden
          text: Where shall we go now?
        - id: ch03-b03
          speaker: narrator
          text: The sun looked brighter that day, and the wind felt softer than usual.
        - id: ch03-b04
          speaker: young_man
          text: I don't mind where we go. What would you like to do?
        - id: ch03-b05
          speaker: elf_maiden
          text: Let's go to the far end of the island and build a home there, well away from the fishermen's huts.
        - id: ch03-b06
          speaker: narrator
          text: He agreed. That very day, they set out to find a sheltered place beside a stream, where water would be easy to fetch. Across the island, in a tiny bay, they found exactly the place they needed. It seemed almost made for them.
        - id: ch03-b07
          speaker: narrator
          text: The long walk had tired them, so they lay on a mossy bank among the birches. They planned to sleep well and begin work fresh in the morning. Before closing her eyes, the girl warned her husband.
        - id: ch03-b08
          speaker: elf_maiden
          text: If you dream that you hear strange noises tonight, don't move. And whatever you do, don't get up to see what they are.
        - id: ch03-b09
          speaker: young_man
          text: We aren't likely to hear anything in a place this quiet.
        - id: ch03-b10
          speaker: narrator
          text: He fell sound asleep. Then a tremendous clatter woke him. It sounded as if every workman in the world were sawing, hammering, and building beside him. He was ready to leap up and investigate, but luckily he remembered his wife's warning and stayed where he was.
        - id: ch03-b11
          speaker: narrator
          text: He remained still, but the hours before morning felt very long. At the first ray of sunlight, the couple rose and pushed aside the birch branches around them. There, on the very place they had chosen the day before, stood a beautiful house. It had doors and windows, and every last part of it was complete.
        - id: ch03-b12
          speaker: elf_maiden
          text: After breakfast, choose a place for the cow stalls. Measure it carefully. It must be neither too large nor too small.
        - id: ch03-b13
          speaker: narrator
          text: They had eaten wild cherries for breakfast. Now the husband did as she told him, though he wondered why they needed a cow house when they owned no cows. His wife knew so much more than he did that he felt a little afraid of her, and he asked no questions.
        - id: ch03-b14
          speaker: narrator
          text: That night, the same sawing and hammering woke him again. In the morning, a magnificent cow house stood near the stream. It was the finest one anyone could imagine. It had stalls, milk pails, milking stools, and everything else a cow house could possibly need. The only things missing were the cows themselves.
        - id: ch03-b15
          speaker: narrator
          text: Next, the girl told him to mark out the ground for a storehouse. This building, she said, could be as large as he wished. Once the storehouse was finished, she proposed that they visit her parents.
    - id: ch04
      title: The Gift That Followed Them Home
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Her parents welcomed the couple warmly. They summoned neighbors from many miles around and held a great feast in their honor. The celebrating went on and on. For several weeks, no work was done on the farm at all. At last, the young man and his wife grew tired of so much play. They declared that it was time to return to their own home.
        - id: ch04-b02
          speaker: narrator
          text: Just before they began their journey, the wife whispered to her husband.
        - id: ch04-b03
          speaker: elf_maiden
          text: Jump over the threshold as quickly as you can. If you don't, something bad will happen to you.
        - id: ch04-b04
          speaker: narrator
          text: He obeyed and sprang across like an arrow from a bow. It was well that he did. The instant he landed outside, his father-in-law hurled a huge hammer after him. If it had touched him, it would have broken both his legs.
        - id: ch04-b05
          speaker: narrator
          text: When the couple had traveled some distance toward home, the girl gave her husband another warning.
        - id: ch04-b06
          speaker: elf_maiden
          text: Until you have stepped inside our house, don't look behind you. It doesn't matter what you hear or see.
        - id: ch04-b07
          speaker: narrator
          text: Her husband promised. For a while, everything remained quiet, and he forgot about the warning. But as they drew nearer to the house, he heard feet trampling behind him. The closer he came to the door, the louder the sound grew.
        - id: ch04-b08
          speaker: narrator
          text: At last, he reached the house and laid his hand on the door. He thought that was enough to make him safe, so he turned around before stepping inside. Sure enough, a vast herd of cattle was following them. His father-in-law had sent the animals after discovering that his daughter had been cleverer than he was.
        - id: ch04-b09
          speaker: narrator
          text: Half the herd had already passed through the fence and was cropping the grass along the banks of the stream. The other half still stood outside the fence. As the young man watched, every one of those cattle faded away into nothing.
    - id: ch05
      title: The Nail in the Threshold
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Even so, enough cattle remained to make the young man rich. He and his wife lived happily together after that, except that now and then the girl vanished from his sight. Whenever she returned, she never told him where she had gone.
        - id: ch05-b02
          speaker: narrator
          text: For a long time, he said nothing. One day, however, he complained about her disappearances. Then she explained what he could do.
        - id: ch05-b03
          speaker: elf_maiden
          text: Dear husband, I have to go, even when I don't want to. There is only one way to stop me. Drive a nail into the threshold, and then I can never pass in or out again.
        - id: ch05-b04
          speaker: narrator
          text: And so he did.
