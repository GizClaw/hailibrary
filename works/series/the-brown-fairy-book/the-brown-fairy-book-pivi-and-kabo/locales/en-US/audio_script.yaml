audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, grave, and attentive to wonder
        timbre: clear and resonant
        pace: measured
        pitch: medium
    pivi:
      display_name: Pivi
      tts:
        delivery: cheerful, courteous, and openhearted
        timbre: bright and clear
        pace: lively
        pitch: medium-high
    kabo:
      display_name: Kabo
      tts:
        delivery: harsh, envious, and slyly self-important
        timbre: dark and rasping
        pace: measured
        pitch: medium-low
    river_woman:
      display_name: Woman of the River
      tts:
        delivery: kind, assured, and quietly mysterious
        timbre: warm and smooth
        pace: unhurried
        pitch: medium
    wife_one:
      display_name: First Wife
      tts:
        delivery: playful, affectionate, and resolute
        timbre: light and melodic
        pace: measured
        pitch: medium-high
    wife_two:
      display_name: Second Wife
      tts:
        delivery: playful, affectionate, and resolute
        timbre: soft and clear
        pace: measured
        pitch: medium
  chapters:
    - id: ch01
      title: The Broken Leg
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long ago, when birds were men and men were birds, Pivi and Kabo lived on the faraway island of New Caledonia. Pivi was a cheerful little bird who chirped at sunset. Kabo was an ugly black fowl who croaked in the dark.
        - id: ch01-b02
          speaker: narrator
          text: One day they decided to make slings and practice with them, as the island people still do. They stripped bark from a banyan tree for the strings, then went to the riverbank to gather stones. Kabo stood on the bank while Pivi stepped into the water. Kabo would sling stones at him, and Pivi would dodge them if he could.
        - id: ch01-b03
          speaker: narrator
          text: Pivi dodged cleverly for a while. Then one of Kabo's stones struck his leg and broke it. Poor Pivi fell into the stream and drifted away. The current carried him into a large hollow bamboo that a woman used when she washed her sweet potatoes.
        - id: ch01-b04
          speaker: river_woman
          text: What's inside my bamboo?
        - id: ch01-b05
          speaker: narrator
          text: She blew into one end, and little Pivi shot out of the other like a pea from a pea-shooter.
        - id: ch01-b06
          speaker: river_woman
          text: Oh, look at you! How did you get into such a state?
          emotion: surprised
        - id: ch01-b07
          speaker: pivi
          text: Kabo broke my leg while we were playing the slinging game.
        - id: ch01-b08
          speaker: river_woman
          text: I'm sorry, Pivi. Will you come with me and do exactly as I tell you?
        - id: ch01-b09
          speaker: pivi
          text: I will.
        - id: ch01-b10
          speaker: narrator
          text: The woman was kind and pretty. She carried Pivi into the shed where she stored her fruit, laid him on a bed of mats, and made him comfortable. She cared for his broken leg without cutting away the flesh around the bone, as the people there usually did.
        - id: ch01-b11
          speaker: river_woman
          text: Lie very still, Pivi. If you hear a tiny noise, pretend you're dead. The Black Ant will crawl from your feet all the way to your head. Don't speak or move. Can you do that?
        - id: ch01-b12
          speaker: pivi
          text: Certainly, kind lady. I'll be as still as I can.
        - id: ch01-b13
          speaker: river_woman
          text: Next the big Red Ant will come. You know him, don't you?
        - id: ch01-b14
          speaker: pivi
          text: Yes. He has legs like a grasshopper's.
        - id: ch01-b15
          speaker: river_woman
          text: He'll walk over you and climb toward your head. When he does, shake your whole body. Do you understand?
        - id: ch01-b16
          speaker: pivi
          text: Yes, dear lady. I'll do just what you say.
        - id: ch01-b17
          speaker: river_woman
          text: Very good.
        - id: ch01-b18
          speaker: narrator
          text: She went out and shut the door. Pivi lay quietly beneath the coverings. Soon he heard a tiny sound. The Black Ant marched over him, and Pivi did not move. Then the big Red Ant skipped along his body. Pivi shook himself all over.
        - id: ch01-b19
          speaker: narrator
          text: At once he sprang up, completely healed. He ran to the river and looked into the water. He was no longer a bird. He had become a fine young man.
        - id: ch01-b20
          speaker: pivi
          text: Oh, lady, come look! I've turned into a man, and a handsome one too!
          emotion: happy
    - id: ch02
      title: The Two Coconuts
      blocks:
        - id: ch02-b01
          speaker: river_woman
          text: Will you obey me once more?
        - id: ch02-b02
          speaker: pivi
          text: Always. I'll do whatever you ask.
        - id: ch02-b03
          speaker: river_woman
          text: Then climb that coconut tree using only your legs. Don't use your hands.
        - id: ch02-b04
          speaker: narrator
          text: The island people could run up coconut trees like squirrels. Some used only one hand, and the girls could do that too. But hardly anyone could climb without using their hands at all.
        - id: ch02-b05
          speaker: river_woman
          text: You'll find two coconuts at the top. Carry them in your hands. Don't throw them down. Then come down the same way you went up, using only your legs.
        - id: ch02-b06
          speaker: pivi
          text: At least I'll try.
        - id: ch02-b07
          speaker: narrator
          text: Up Pivi went. It was very hard, but at last he came down again with a coconut in each hand.
        - id: ch02-b08
          speaker: pivi
          text: Here are your coconuts.
        - id: ch02-b09
          speaker: river_woman
          text: Put them in the shed where you rested. When the sun sinks into the sea to cool itself, then rises less hot at dawn, go and fetch them.
        - id: ch02-b10
          speaker: narrator
          text: Pivi spent the day playing in the river, as the island people did. They tossed fruit at one another and sent silver showers of water through the air. At sunset, he went toward the shed. Before he reached it, he heard sweet voices talking and laughing inside.
        - id: ch02-b11
          speaker: pivi
          text: Who's chattering in there? Maybe they've taken my coconuts.
        - id: ch02-b12
          speaker: narrator
          text: He stepped inside and found two pretty girls laughing and teasing each other. He searched everywhere, but the coconuts were gone. Pivi hurried back to the river.
        - id: ch02-b13
          speaker: pivi
          text: Oh, lady, someone has stolen my coconuts!
        - id: ch02-b14
          speaker: river_woman
          text: Come with me, Pivi. There will be nuts for you.
        - id: ch02-b15
          speaker: narrator
          text: They returned to the shed, where the girls were still laughing and playing.
        - id: ch02-b16
          speaker: river_woman
          text: You were expecting nuts? Instead, here are two wives for you. Take them home, Pivi.
        - id: ch02-b17
          speaker: pivi
          text: Oh, good lady, how kind you are!
          emotion: happy
        - id: ch02-b18
          speaker: narrator
          text: Pivi married the two girls, and they were very happy together. Then one day, cross old Kabo came in.
    - id: ch03
      title: Kabo Tries the Same
      blocks:
        - id: ch03-b01
          speaker: kabo
          text: Is that Pivi? Yes, it is. No, it can't be. You look a little like him, but not quite. Tell me, are you really Pivi?
        - id: ch03-b02
          speaker: pivi
          text: Of course I am! I look much better now. And these are my two wives. Aren't they beautiful?
        - id: ch03-b03
          speaker: kabo
          text: You're making fun of me! How could you have wives? Where did they come from?
          emotion: angry
        - id: ch03-b04
          speaker: narrator
          text: Pivi told him about the kind woman and every wonderful thing that had happened.
        - id: ch03-b05
          speaker: kabo
          text: Well, I want to be handsome too, and I want pretty young wives.
        - id: ch03-b06
          speaker: pivi
          text: But how could we make that happen?
        - id: ch03-b07
          speaker: kabo
          text: We'll do everything again. We'll play the slinging game, and this time you can break my leg.
        - id: ch03-b08
          speaker: pivi
          text: I'd be delighted to help.
        - id: ch03-b09
          speaker: narrator
          text: Pivi was always ready to oblige. They played with the slings, and Pivi broke Kabo's leg. Kabo fell into the river and floated into the bamboo. The woman blew him out just as she had blown out Pivi. She picked him up, laid him in the shed, and explained what to do when the Black Ant came and when the Red Ant followed. But Kabo did not obey.
        - id: ch03-b10
          speaker: narrator
          text: As soon as the Black Ant crawled over him, Kabo shook himself. In that instant, his leg twisted, a hump rose on his back, and his whole body turned as black as the ant. He ran to the woman.
        - id: ch03-b11
          speaker: kabo
          text: Look at me! What a dreadful shape I'm in!
        - id: ch03-b12
          speaker: narrator
          text: The woman only told him to climb the coconut tree, just as Pivi had done. Kabo climbed with both hands and feet. Instead of carrying the coconuts down, he threw them to the ground. Then he put them in the shed.
        - id: ch03-b13
          speaker: narrator
          text: When he returned for them, he found two horrible old black women inside. They were arguing, scolding, and scratching one another. Kabo went back to Pivi with them. Pivi saw Kabo beside his own two beautiful wives and felt very sorry for him. But there was nothing he could do except sit down and cry.
    - id: ch04
      title: The Monster in the Water
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: One day Kabo asked Pivi to sail with him in his canoe. He knew where to find a huge shellfish, he said, large enough to feed them for a week. Pivi went along. Deep in the clear water, they saw it resting on a rock. It was like an oyster, but as big as the rock itself, and its shell stood wide open.
        - id: ch04-b02
          speaker: pivi
          text: We can catch it, dry it, smoke it, and invite all our friends to dinner!
        - id: ch04-b03
          speaker: kabo
          text: I'll dive down and break it loose from the rock. Then you can help me pull it into the canoe.
        - id: ch04-b04
          speaker: narrator
          text: The great shellfish lay below with its mouth gaping. Kabo dived into the water, but he stayed well away from it. Soon he came back to the surface, puffing and blowing.
        - id: ch04-b05
          speaker: kabo
          text: Pivi, I can't move it at all. You jump in and try.
        - id: ch04-b06
          speaker: narrator
          text: Pivi took his spear and dived. The shellfish opened even wider and drew him in. Pivi vanished into its mouth, and the shell snapped shut.
        - id: ch04-b07
          speaker: narrator
          text: Kabo laughed like a fiend, then went home alone.
        - id: ch04-b08
          speakers: [wife_one, wife_two]
          ensemble: duo
          text: Where is Pivi?
        - id: ch04-b09
          speaker: narrator
          text: Kabo pretended to weep. He told them that the shellfish had swallowed Pivi.
        - id: ch04-b10
          speaker: kabo
          text: Dry your tears, my darlings. I'll become your husband, and my wives can serve you. You see? Everything has turned out for the best.
        - id: ch04-b11
          speakers: [wife_one, wife_two]
          ensemble: duo
          text: No! We love Pivi, and we won't love anyone else. We'll stay here and mourn for him.
          emotion: sad
        - id: ch04-b12
          speaker: kabo
          text: You miserable fools! Pivi was a scoundrel. He broke my leg and knocked me into the river!
          emotion: angry
        - id: ch04-b13
          speaker: narrator
          text: Just then, a small cough sounded at the door. Kabo began to tremble. He knew that cough belonged to Pivi.
        - id: ch04-b14
          speaker: kabo
          text: Dear Pivi! What a joy to see you! I was only trying to comfort your dear wives.
    - id: ch05
      title: Pivi Comes Home
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Pivi did not answer. He raised one hand, and twenty-five of his friends came streaming down the hill. Together they cut Kabo into little pieces.
        - id: ch05-b02
          speaker: narrator
          text: Pivi turned around. There stood the good woman from the river.
        - id: ch05-b03
          speaker: river_woman
          text: Pivi, how did you escape from the living tomb Kabo sent you into?
        - id: ch05-b04
          speaker: pivi
          text: I still had my spear. The inside of the shell was completely dry, so I kept working at the creature with my spear. At last it understood that it had better open up, and out I came.
        - id: ch05-b05
          speaker: narrator
          text: The good woman laughed. From that day on, Pivi and his two wives lived happily ever after.
