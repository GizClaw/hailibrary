  chapters:
    - id: ch01
      title: The Rooms Inside the Oaks
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long, long ago, when fairies, witches, giants, and ogres still came to the earth, a king ruled a great and beautiful country. He dearly loved his queen, and they had two promising children, a son named Asmund and a daughter named Signy.
        - id: ch01-b02
          speaker: narrator
          text: The king and queen took great care over their children's upbringing. The young prince and princess learned everything that might make them clever and accomplished. They lived in their father's palace, where he did all he could to make them happy.
        - id: ch01-b03
          speaker: narrator
          text: Asmund loved outdoor sports and life beneath the open sky. From his earliest years, he had dreamed of living in the nearby forest. After much pleading and many arguments, he persuaded the king to give him two great oak trees of his own.
        - id: ch01-b04
          speaker: asmund
          text: I will have the trees hollowed out. Then I can make rooms inside them, furnish them, and live in the forest.
        - id: ch01-b05
          speaker: signy
          text: Oh, Asmund, what a wonderful idea! Please let me come and live in one of your trees. I can bring all my pretty things and ornaments. The trees are so close to home that we will be perfectly safe.
        - id: ch01-b06
          speaker: narrator
          text: Asmund was very fond of his sister and gladly agreed. Together they carried their favorite treasures into the oaks, along with Signy's jewels and ornaments. They arranged everything in the pretty little rooms and spent a happy time there.
        - id: ch01-b07
          speaker: narrator
          text: But sad days followed. War broke out with another country, and the king had to lead his army away. While he was gone, the queen became ill. Her sickness lasted for some time, and then she died. Asmund and Signy were overcome with grief.
        - id: ch01-b08
          speaker: narrator
          text: They decided to live entirely in their trees for a while. To make that possible, they stored enough food inside to last them for a whole year without needing to leave.
    - id: ch02
      title: The False Princess
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Far away, in another country, there lived a king whose only son was named Ring. Prince Ring had heard so much about Princess Signy's beauty and goodness that he resolved to marry her if he could. He asked his father for a ship, sailed with a favorable wind, and at last reached Signy's country.
        - id: ch02-b02
          speaker: narrator
          text: Ring set off for the royal palace at once. On the way, he met a woman so wonderfully lovely that he thought he had never seen anyone so beautiful. He stopped her and asked who she was.
        - id: ch02-b03
          speaker: witch
          text: I am Signy, the king's daughter.
        - id: ch02-b04
          speaker: narrator
          text: Ring asked why she was wandering alone. She told him that her mother's death had made her so sad that she preferred solitude while her father was away.
        - id: ch02-b05
          speaker: narrator
          text: The prince believed every word. He never guessed that this was not Signy at all, but a powerful, gigantic, wicked witch hidden beneath a beautiful shape. He told her that tales of her beauty had brought him all the way from his own land. Then, there on the road, he asked her to marry him.
        - id: ch02-b06
          speaker: narrator
          text: The witch listened to everything he said and was delighted by her good fortune. At last, she accepted his offer. But first, she asked him to return to his ship for a little while. She said she needed to go farther into the forest and promised that she would join him later.
        - id: ch02-b07
          speaker: narrator
          text: Ring went back to wait aboard his ship. The witch walked on until she came to the two oak trees. There she took her own gigantic shape again. She ripped both trees out by the roots, threw one across her back, and held the other against her chest. Then she carried them to the shore and waded out to the ship.
        - id: ch02-b08
          speaker: narrator
          text: She took great care to reach the ship without being noticed. The moment she stepped aboard, she changed back into the lovely woman Ring had met. She told him that all her luggage was safely aboard now, so nothing remained for them to wait for.
        - id: ch02-b09
          speaker: narrator
          text: Ring ordered the ship to sail at once. After a pleasant voyage, they reached his country. His parents and his only sister welcomed him with joy and affection, and they received the false Signy with equal kindness.
        - id: ch02-b10
          speaker: narrator
          text: A beautiful house was prepared for her. Ring had the two oaks planted in its garden, directly before her windows, so she could always enjoy the sight of them. He often visited the woman he believed to be Princess Signy. One day, he spoke of their wedding.
        - id: ch02-b11
          speaker: ring
          text: Do you think we might marry soon?
        - id: ch02-b12
          speaker: witch
          text: Yes. I am ready to marry you whenever you wish.
        - id: ch02-b13
          speaker: ring
          text: Then let us marry two weeks from today. And look, I have brought you cloth for your wedding dress.
        - id: ch02-b14
          speaker: narrator
          text: He gave her a large piece of magnificent brocade. Gold threads ran through it, and pearls and other jewels covered its embroidery.
    - id: ch03
      title: The Witch and the Brocade
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Ring had hardly gone when the witch returned to her true shape. She stormed around the room and threw the beautiful silk onto the floor.
        - id: ch03-b02
          speaker: witch
          text: What am I supposed to do with such things? I cannot sew or make clothes! And if my brother Ironhead does not come soon with raw meat and bones, I will starve. I cannot eat anything else!
          emotion: angry
        - id: ch03-b03
          speaker: narrator
          text: As she raged and roared in this frantic way, part of the floor suddenly opened. A huge giant rose through it with a great chest in his arms. The sight enchanted the witch. She eagerly helped her brother set the chest down and lift the lid. It was filled with the raw meat, bones, and other ghastly food she had been craving.
        - id: ch03-b04
          speaker: narrator
          text: The horrible pair greedily ate everything. When the chest was empty, Ironhead lifted it onto his shoulder and vanished the same way he had come. He left no sign that he had ever been there.
        - id: ch03-b05
          speaker: narrator
          text: His sister was not quiet for long. She stamped about, shouted angrily, and pulled at the rich brocade as though she meant to tear it apart.
        - id: ch03-b06
          speaker: narrator
          text: All this time, Asmund and Signy were sitting inside their oaks just beyond the window. They saw everything that happened.
        - id: ch03-b07
          speaker: asmund
          text: Dear Signy, please try to get that brocade and make the clothes yourself. With all this noise, we will have no rest by day or by night.
        - id: ch03-b08
          speaker: signy
          text: I will try. It will not be easy, but a little trouble is worth it if we can have some peace.
        - id: ch03-b09
          speaker: narrator
          text: Signy waited for her chance. The first time the witch left the room, she managed to carry away the brocade. Then she began cutting and sewing as well as she could. Six days later, she had made an elegant robe with a long train and a mantle.
        - id: ch03-b10
          speaker: narrator
          text: When the clothes were finished, Signy climbed to the top of her tree. From there, she managed to toss them through the open window and onto a table.
        - id: ch03-b11
          speaker: narrator
          text: The witch was overjoyed when she found the finished clothes. On Ring's next visit, she showed them to him. He praised her skill again and again, then said goodbye in the friendliest way.
        - id: ch03-b12
          speaker: narrator
          text: Ring had barely left the house when the witch began raging as wildly as before. She did not stop until Ironhead appeared once more.
    - id: ch04
      title: The Secret Behind the Wall
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: After watching these wild scenes from his tree, Asmund felt he could stay silent no longer. He went to Prince Ring and urged him to come see the strange things taking place in the new princess's room.
        - id: ch04-b02
          speaker: asmund
          text: Come with me, and you can see for yourself what is happening in her room.
        - id: ch04-b03
          speaker: narrator
          text: Ring was greatly surprised, but he agreed. He and Asmund hid behind the room's wooden paneling, where a narrow slit allowed them to watch everything inside.
        - id: ch04-b04
          speaker: narrator
          text: The witch was roaring and raving as usual. Then she told her brother what she meant to do after the wedding.
        - id: ch04-b05
          speaker: witch
          text: Once I marry the king's son, I will have a better life. I will make sure that whole pack of courtiers is put to death. Then I will send for all our relations to live here. The giants will have a wonderful time with me and my husband.
        - id: ch04-b06
          speaker: narrator
          text: When Ring heard her plan, he flew into a rage. He ordered the house to be set on fire. It burned to the ground with the witch and Ironhead inside.
    - id: ch05
      title: The Double Wedding
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Asmund then explained the secret of the two oak trees and took Ring to see them. Ring was astonished by the rooms and all the treasures inside. But Signy's great beauty amazed him even more.
        - id: ch05-b02
          speaker: narrator
          text: He fell in love with the true princess at once and begged her to marry him. After some time, Signy agreed. Asmund, in turn, asked to marry Ring's sister, and his request was gladly granted. The two weddings were celebrated together with great rejoicing.
        - id: ch05-b03
          speaker: narrator
          text: Afterward, Asmund and his bride returned to his own country and lived with his father, the king. The two couples often met, and they were happy for many, many years.
        - id: ch05-b04
          speaker: narrator
          text: And that is the end of the story.
