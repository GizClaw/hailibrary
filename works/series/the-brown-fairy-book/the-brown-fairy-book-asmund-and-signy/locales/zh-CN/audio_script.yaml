audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 温暖庄重，以从容而清晰的语气讲述古老命运故事, timbre: 清澈浑厚, pace: 舒缓, pitch: 中音}
    asmund:
      display_name: 阿斯蒙德
      tts: {delivery: 热爱冒险，坦率亲切，对妹妹关怀备至, timbre: 年轻清朗, pace: 适中, pitch: 中音}
    signy:
      display_name: 西格妮
      tts: {delivery: 温柔能干，遇事镇定，勇气含而不露, timbre: 年轻明亮, pace: 适中, pitch: 中高音}
    ring:
      display_name: 林格
      tts: {delivery: 谦恭诚恳，作出决断时果断有力, timbre: 年轻浑厚, pace: 适中, pitch: 中音}
    witch:
      display_name: 巫婆
      tts: {delivery: 伪装时甜美殷勤，现形后凶狠贪婪, timbre: 浓厚而隐含沙哑锋芒, pace: 适中, pitch: 中低音}
  chapters:
    - id: ch01
      title: 橡树里的房间
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            很久很久以前，仙女、巫婆、巨人和食人魔还会来到人间。那时有一位国王，统治着辽阔而美丽的国家。他深爱自己的王后，两人有一双聪慧出众的儿女。儿子名叫阿斯蒙德，女儿名叫西格妮。
        - id: ch01-b02
          speaker: narrator
          text: >-
            国王和王后一心要把孩子教养好。凡是能增长才智、学到本领的学问，都请人教给小王子和小公主。兄妹俩住在父亲的宫殿里，国王费尽心思，只盼他们幸福。
        - id: ch01-b03
          speaker: narrator
          text: >-
            阿斯蒙德最爱户外活动，也最喜欢露天生活。从很小的时候起，他就盼着能住进附近的森林。他一再恳求，又跟父亲争辩了许多回，终于说服国王，把两棵高大的橡树赐给他。
        - id: ch01-b04
          speaker: asmund
          text: 我要请人把树干掏空，在里面隔出房间，摆上家具。这样，我就可以住在森林里了。
        - id: ch01-b05
          speaker: signy
          text: >-
            阿斯蒙德，这个主意太妙了！让我也去吧，我要住进另一棵树，再把漂亮的小玩意儿和首饰都带去。那里离家这么近，我们一定很安全。
        - id: ch01-b06
          speaker: narrator
          text: >-
            阿斯蒙德十分疼爱妹妹，马上答应了。他们把各自心爱的宝物，还有西格妮的珠宝首饰，一件件搬进树里，再安放到精巧的小房间中。兄妹俩在那里过了一段快活日子。
        - id: ch01-b07
          speaker: narrator
          text: >-
            可悲伤的日子很快来了。邻国挑起战争，国王不得不亲自率领军队迎敌。他离开后，王后病倒了。她在病榻上熬了一段时日，最终还是去世了。两个孩子悲痛万分，决定暂且完全住进橡树里。为了不用离开那里，他们还在树中存下了足够吃上一整年的食物。
    - id: ch02
      title: 假公主
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            遥远的另一个国家里，也住着一位国王。他只有一个儿子，名叫林格。林格王子总听人称赞西格妮公主美丽又善良，便打定主意，只要能办到，一定要娶她。他向父亲求来一艘船，趁着顺风扬帆启程。航行了一段时日，他终于登上西格妮国家的海岸。
        - id: ch02-b02
          speaker: narrator
          text: >-
            王子立即赶往王宫。路上，他遇见一个美貌绝伦的女子，只觉得自己从未见过这样动人的容颜。他拦住她，问她是谁。
        - id: ch02-b03
          speaker: witch
          text: 我就是国王的女儿，西格妮。
        - id: ch02-b04
          speaker: narrator
          text: >-
            林格又问，她为什么独自在外游荡。女子说，母亲去世以后，她一直很伤心。父亲又不在国中，她只想一个人待着。
        - id: ch02-b05
          speaker: narrator
          text: >-
            王子把每个字都信了。他哪会想到，这根本不是西格妮，而是一个强壮高大、心肠恶毒的巫婆。她只是披上美丽的外表，存心要骗他。林格告诉她，自己听了关于她美貌的传闻，早已为她倾心，这才从遥远的故国赶来。说完，他当场向她求婚。
        - id: ch02-b06
          speaker: narrator
          text: >-
            巫婆听得十分得意，最后答应了。不过，她说自己还得往森林深处走一程，请王子先回船上等一会儿。她办完事，就去与他会合。
        - id: ch02-b07
          speaker: narrator
          text: >-
            林格依言回船等候。巫婆走进森林，一直来到那两棵橡树前。她现出庞大的原形，把两棵树连根拔起。一棵甩到背上，另一棵紧抱在胸前。接着，她扛着树来到岸边，抱着它们蹚进海里，走向林格的船。
        - id: ch02-b08
          speaker: narrator
          text: >-
            登船时，巫婆小心避开众人的眼睛。刚踏上甲板，她就变回那个美丽女子，还告诉王子，自己的行李已经全在船上，他们不必再等了。
        - id: ch02-b09
          speaker: narrator
          text: >-
            王子马上命令开船。一路风平浪静，他们回到了他的国家。父母和唯一的妹妹满心欢喜地迎接林格，也亲切地欢迎假西格妮。
        - id: ch02-b10
          speaker: narrator
          text: >-
            人们为她备下一座美丽的宅院。林格又叫人把两棵橡树栽进花园，就在她的窗前，好让她随时都能欣赏。他常去探望自己心目中的西格妮公主。一天，他说起了婚事。
        - id: ch02-b11
          speaker: ring
          text: 你看，我们是不是可以早些成婚？
        - id: ch02-b12
          speaker: witch
          text: 可以呀。只要你愿意，哪一天我都答应。
        - id: ch02-b13
          speaker: ring
          text: 那就定在两星期后的今天。我还给你带来了衣料，正好拿来做嫁衣。
        - id: ch02-b14
          speaker: narrator
          text: >-
            林格递给她一大幅华美的锦缎。锦缎用金线织成，上面绣满珍珠和各色宝石。
    - id: ch03
      title: 巫婆与锦缎
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            王子才刚离开，巫婆就现出原形。她在房里横冲直撞，又吼又叫，还把美丽的绸缎摔到地上。
        - id: ch03-b02
          speaker: witch
          text: >-
            她拿这些东西有什么用？她根本不会缝衣裳！铁头哥哥要是再不送生肉和骨头来，她还会活活饿死。除了那些东西，她什么都吃不下！
          emotion: angry
        - id: ch03-b03
          speaker: narrator
          text: >-
            她正发疯似的咆哮，地板忽然裂开一块。一个巨人从下面升上来，怀中抱着一只大箱子。巫婆一见就喜出望外，赶忙帮哥哥放下箱子，掀开箱盖。里面全是她朝思暮想的可怕食物。
        - id: ch03-b04
          speaker: narrator
          text: >-
            这一对恶兄恶妹立刻扑上去，贪婪地吃了个精光。箱子空了，铁头便把它扛到肩上，从来处消失了，没留下半点痕迹。
        - id: ch03-b05
          speaker: narrator
          text: >-
            可巫婆没安静多久。她又撕扯起贵重的锦缎，好像非把它毁掉不可，还一边跺脚，一边愤怒地大喊。
        - id: ch03-b06
          speaker: narrator
          text: 阿斯蒙德和西格妮一直坐在窗外的橡树中。屋里发生的一切，他们都看见了。
        - id: ch03-b07
          speaker: asmund
          text: >-
            西格妮，想办法把那幅锦缎拿来，由你替她做好衣裳吧。她再这么吵下去，我们白天黑夜都别想安宁。
        - id: ch03-b08
          speaker: signy
          text: 我来试试。这事不会容易，不过只要能清静一会儿，多费些力气也值得。
        - id: ch03-b09
          speaker: narrator
          text: >-
            西格妮耐心等着机会。巫婆第一次离开房间，她就设法取走了锦缎，尽力裁剪缝制。六天后，锦缎变成一件优雅的长裙，裙摆长长地拖在身后，另有一件相配的斗篷。
        - id: ch03-b10
          speaker: narrator
          text: >-
            衣裳做好了。西格妮爬到树顶，从敞开的窗户把它们扔进屋里，恰好落在桌上。
        - id: ch03-b11
          speaker: narrator
          text: >-
            巫婆发现成衣，别提多高兴了。林格下次来探望时，她便拿给他看。王子连声夸奖她手艺高超，然后亲亲热热地告别了。
        - id: ch03-b12
          speaker: narrator
          text: 林格才走出宅院，巫婆又像从前一样大发雷霆。直到哥哥铁头再次出现，她才停下来。
    - id: ch04
      title: 墙后的秘密
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            阿斯蒙德从树里看了这么久，再也无法沉默。他找到林格，要他亲眼看看新公主房里那些古怪的事。
        - id: ch04-b02
          speaker: asmund
          text: 请跟我走一趟。她的房间里到底发生了什么，你亲眼一看就明白了。
        - id: ch04-b03
          speaker: narrator
          text: >-
            林格十分吃惊，还是答应了。他和阿斯蒙德躲到房间的护墙板后面，从一道窄缝里观察屋中的动静。
        - id: ch04-b04
          speaker: narrator
          text: 巫婆照旧又吼又叫。闹了一阵，她把成婚后的打算告诉了哥哥。
        - id: ch04-b05
          speaker: witch
          text: >-
            等她嫁给国王的儿子，日子就比现在好过了。那一大群朝臣，一个也别想活命。等他们全死了，她就把咱们的亲戚接来住。到时候，那些巨人一定能跟她和丈夫过得快活极了！
        - id: ch04-b06
          speaker: narrator
          text: >-
            林格听见她的毒计，顿时怒不可遏。他下令放火烧掉宅院。烈火把房屋化为灰烬，巫婆和铁头也葬身其中。
    - id: ch05
      title: 两对新人的婚礼
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            随后，阿斯蒙德说出了两棵橡树的秘密，又领林格前去观看。树中的房间和珍藏已经让王子惊叹不已，西格妮惊人的美貌更叫他目眩神迷。
        - id: ch05-b02
          speaker: narrator
          text: >-
            林格立刻爱上了真正的公主，恳求她嫁给自己。过了一段时间，西格妮终于答应。阿斯蒙德也向林格的妹妹求婚，林格欣然应允。两对新人一同举行婚礼，举国欢庆，热闹非凡。
        - id: ch05-b03
          speaker: narrator
          text: >-
            此后，阿斯蒙德带着新娘回到自己的国家，与父王一同生活。两对夫妻常常相聚，幸福快乐地度过了许多年。
        - id: ch05-b04
          speaker: narrator
          text: 故事到这里就结束了。
