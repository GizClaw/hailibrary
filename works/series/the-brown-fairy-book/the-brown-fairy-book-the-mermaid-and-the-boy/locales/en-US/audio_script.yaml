  chapters:
    - id: ch01
      title: The Promise at Sea
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long ago, a king ruled a country beside the sea. About a year after his marriage, people on a distant group of islands rose against his laws. The king had to leave his wife, sail to the islands, and settle their dispute himself. His queen feared that harm would come from the voyage and begged him to remain at home. But the king said no one else could do his work for him. The sails were spread the next morning, and he set out across the sea.
        - id: ch01-b02
          speaker: narrator
          text: Before the ship had gone far, it struck a rock and lodged deep in a cleft. The whole crew pulled and pushed, but they could not free it. Meanwhile the wind grew stronger. Soon the ship would be smashed to pieces, and everyone aboard would drown. Then a mermaid appeared, dancing on the waves that threatened to sweep over them.
        - id: ch01-b03
          speaker: mermaid
          text: There is one way to save yourselves. Give me your solemn promise that you will hand over the first child born to you.
        - id: ch01-b04
          speaker: narrator
          text: The king hesitated. He hoped to have children one day, and the thought of surrendering the heir to his crown was bitter. Just then, a huge wave struck the ship. His men fell to their knees and begged him to save them.
        - id: ch01-b05
          speaker: narrator
          text: With the ship in danger and his crew pleading around him, the king finally gave the mermaid his promise. This time, the next wave did not strike the vessel. It lifted the ship cleanly out of the rocky cleft and set it down in the open sea once more.
        - id: ch01-b06
          speaker: narrator
          text: Settling the island dispute took months. When the king finally returned to his palace, he found that a son had been born while he was away. His joy was so great that he forgot the mermaid and the price of saving his ship.
        - id: ch01-b07
          speaker: narrator
          text: Years passed, and the baby grew into a fine strong boy. Then the memory of the mermaid returned, and the king told the queen the whole story. From that moment, the happiness of both their lives was ruined. Each night they went to bed wondering whether the boy's room would be empty by morning. Each day they kept him close beside them, expecting him to be snatched away before their very eyes.
        - id: ch01-b08
          speaker: king_father
          text: We cannot go on like this. Keeping our son here, in the very place where the mermaid will search, is foolish. We should give him food and send him into the world. If she ever comes, perhaps she will take another child instead.
        - id: ch01-b09
          speaker: narrator
          text: The queen agreed that this seemed the wisest plan. They called their son, and the king told him the whole story of the voyage. The prince listened eagerly. He was delighted to travel alone and see the world. Though he was sixteen, he had hardly ever walked beyond the palace gardens without someone beside him.
        - id: ch01-b10
          speaker: narrator
          text: He began preparing at once. He took off his fine velvet coat and put on a green cloth one instead. The queen offered him a beautiful bag to carry his food, but he refused it. He slung a leather knapsack over his shoulders, just as he had seen other travelers do. Then he said farewell to his father and mother and went on his way.
    - id: ch02
      title: Three Gifts in the Forest
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: All day the prince walked through the forest, watching strange birds and animals dart across his path or peer from behind the bushes. By evening he was tired and began searching for a place to sleep. He found a soft bank of moss beneath a tree and was about to lie down when a terrible roar made him tremble. Something flew through the air, and a lion landed before him.
        - id: ch02-b02
          speaker: lion
          text: What are you doing here?
        - id: ch02-b03
          speaker: prince
          text: I am running away from the mermaid.
          emotion: fearful
        - id: ch02-b04
          speaker: lion
          text: Then give me something to eat. My supper is late, and I am very hungry.
        - id: ch02-b05
          speaker: narrator
          text: The prince was grateful that the lion did not mean to eat him. He opened the knapsack and offered him bread and a flask of wine.
        - id: ch02-b06
          speaker: lion
          text: That was good. Now I shall sleep on this soft moss. You may lie beside me if you wish.
        - id: ch02-b07
          speaker: narrator
          text: The boy and the lion slept soundly side by side until sunrise. In the morning, the lion shook him awake.
        - id: ch02-b08
          speaker: lion
          text: I must leave now. First, cut off the tip of my ear and keep it safe. Whenever danger comes, wish to be a lion, and you will become one at once. One good turn deserves another.
        - id: ch02-b09
          speaker: narrator
          text: The prince thanked him, did as he was told, and said farewell. After walking a little way, he began to wonder what being a lion felt like. He took the ear tip from inside his jacket and wished with all his strength.
        - id: ch02-b10
          speaker: narrator
          text: In an instant, his head swelled to several times its usual size, and his neck felt hot and heavy. Somehow his hands became great paws, while yellow hair spread across his skin. Best of all, he had a long tail with a tuft at the end. He switched it from side to side with great pride.
        - id: ch02-b11
          speaker: prince
          text: I like being a lion very much!
          emotion: happy
        - id: ch02-b12
          speaker: narrator
          text: He trotted happily down the road in his new shape. Before long, though, he grew tired of walking on four feet. The strange motion made his back ache, and both front paws became sore. He wished to be a boy again. In the blink of an eye, his tail disappeared, his great head shrank, and the long thick mane became short curly hair. Then he searched for a sleeping place, gathered dry ferns, and piled them into a bed.
        - id: ch02-b13
          speaker: narrator
          text: Before he could close his eyes, a heavy body crashed through the nearby trees. The prince stood and saw a huge black bear coming toward him.
        - id: ch02-b14
          speaker: bear
          text: What are you doing here?
        - id: ch02-b15
          speaker: prince
          text: I am escaping from the mermaid.
        - id: ch02-b16
          speaker: bear
          text: I am hungry. Give me some food.
        - id: ch02-b17
          speaker: narrator
          text: The bear cared nothing about the mermaid. The prince picked up his knapsack from the ferns and brought out another loaf and his second flask of wine.
        - id: ch02-b18
          speaker: prince
          text: We can eat supper together.
        - id: ch02-b19
          speaker: narrator
          text: The bear had never learned manners. He gave no answer to the prince's polite offer and ate as quickly as he could. When all the bread and wine were gone, he rose and stretched his great body.
        - id: ch02-b20
          speaker: bear
          text: That bed looks comfortable. Even though I sleep badly, I might rest well there. I can squeeze you in beside me. You do not take up much room.
        - id: ch02-b21
          speaker: narrator
          text: The bear's easy way of claiming the bed made the prince rather indignant. Still, he was too tired to gather another heap of ferns. He made room, and the two lay side by side. Neither one stirred until sunrise. Then the bear seized the sleepy prince and pulled him upright.
        - id: ch02-b22
          speaker: bear
          text: I must go. Cut off the tip of my ear first. If danger comes, wish to be a bear, and you will become one. One good turn deserves another.
        - id: ch02-b23
          speaker: narrator
          text: The prince obeyed, and they parted. A little farther on, he wondered how it felt to be a bear. He took the ear tip from inside his coat and wished hard. His body stretched, thick black fur covered him, and his hands turned into paws. He tried to swish his tail and was disgusted by how little it moved.
        - id: ch02-b24
          speaker: prince
          text: That is hardly worth calling a tail!
          emotion: disgusted
        - id: ch02-b25
          speaker: narrator
          text: He remained a bear and continued his journey for the rest of the day. The thick hide was useful when he pushed through the forest brambles, but as evening came, it began to feel terribly heavy. He wished himself back into a boy. He was too exhausted to cut ferns or look for moss, so he simply threw himself down beneath a tree. Directly over his head, a bumblebee landed on a honeysuckle branch with a great buzzing sound.
        - id: ch02-b26
          speaker: bee
          text: What are you doing out here? Someone your age ought to be safely at home.
          emotion: angry
        - id: ch02-b27
          speaker: prince
          text: I am running away from the mermaid.
        - id: ch02-b28
          speaker: bee
          text: I am hungry. Give me something to eat.
        - id: ch02-b29
          speaker: narrator
          text: Like the lion and bear, the bee had not listened to his answer. The boy laid his last loaf and flask on the ground, and they ate together.
        - id: ch02-b30
          speaker: bee
          text: Now I am going to sleep. You are not very large, so I can make room beside me.
        - id: ch02-b31
          speaker: narrator
          text: The bee curled up his wings, tucked in all his legs, and settled beside the prince. Both of them slept soundly until morning. When the bee woke, he carefully brushed every speck of dust from his velvet coat. Then he flew close and buzzed loudly in the boy's ear until the prince awakened too.
        - id: ch02-b32
          speaker: bee
          text: Take one hair from my wing. If you meet danger, wish to be a bee, and you will become one. One good turn deserves another. Farewell, and thank you for supper.
        - id: ch02-b33
          speaker: narrator
          text: The prince pulled out one hair, wrapped it safely in a leaf, and watched the bee depart. After another hour or two of walking, he wondered how being a bee would feel. It must be quite unlike being a lion or bear, and he thought he could travel much faster. He took out the hair and wished.
        - id: ch02-b34
          speaker: narrator
          text: The strangest change yet came over him. All his limbs seemed to draw together, and his body became very short and round. His head grew tiny. Instead of his pale skin, the richest, softest velvet covered him. Better than all the rest, he now had two lovely gauzy wings. They carried him onward for the whole day, and he never grew tired.
        - id: ch02-b35
          speaker: narrator
          text: Late that afternoon, he saw what looked like a vast heap of stones in the distance and flew toward it. At the gates, he discovered a great town. He changed back into a boy and went inside.
    - id: ch03
      title: The Princess Behind the Locked Door
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The palace doors stood wide open, so the prince boldly entered a hall crowded with servants. Men and women were talking together, and he joined their conversation. They told him the king had one daughter who hated men so much that she never allowed one into her presence.
        - id: ch03-b02
          speaker: narrator
          text: Her father was in despair over her refusal. He had portraits painted of the handsomest princes from every royal court in the world. He hoped that she might see one face and fall in love. But even that plan was useless. The princess would not allow a single portrait to be carried into her room.
        - id: ch03-b03
          speaker: palace_woman
          text: It is late. I must go to my mistress. Please find this young man a bed.
        - id: ch03-b04
          speaker: prince
          text: There is no need. This bench will do. I am used to nothing better.
        - id: ch03-b05
          speaker: narrator
          text: When the hall was empty, he lay down for a few minutes. As soon as the palace grew quiet, he used the wing hair and became a bee. He flew upstairs, passed the guards, slipped through the princess's keyhole, and changed back into a man.
        - id: ch03-b06
          speaker: narrator
          text: The princess was wide awake. At the dreadful sight of a man in her chamber, she screamed.
        - id: ch03-b07
          speaker: princess
          text: A man! There is a man in here!
          emotion: fearful
        - id: ch03-b08
          speaker: narrator
          text: The guards rushed into the chamber, but by then only a bumblebee was buzzing around the room. They searched under the bed, looked behind every curtain, and opened the cupboards. There was no man in any of those places. The guards decided that the princess must have suffered a bad dream, bowed respectfully, and left her alone again.
        - id: ch03-b09
          speaker: narrator
          text: The door had barely shut when the bee vanished and the handsome young man returned.
        - id: ch03-b10
          speaker: princess
          text: I knew a man was hiding here!
          emotion: fearful
        - id: ch03-b11
          speaker: narrator
          text: She screamed even louder. The guards hurried back, but once again they found no man anywhere, and they told her so.
        - id: ch03-b12
          speaker: princess
          text: He was here only a moment ago. I saw him with my own eyes!
          emotion: fearful
        - id: ch03-b13
          speaker: narrator
          text: The guards did not dare contradict the king's daughter. Still, they shook their heads and whispered to one another. They thought the princess had gone mad over this fear of men and now imagined one hiding in every table and chair. Before leaving, they made up their minds that however loudly she screamed again, they would pay no attention.
        - id: ch03-b14
          speaker: narrator
          text: The princess understood what they were thinking. They would no longer help her. Worse, they might tell the king strange stories about her. He might lock her in a lonely tower and stop her from walking among her birds and flowers. When the prince appeared for the third time, she did not call out. She sat in bed and stared at him in silent terror.
        - id: ch03-b15
          speaker: prince
          text: Please do not be frightened. I will not harm you.
          emotion: calm
        - id: ch03-b16
          speaker: narrator
          text: He began talking about her gardens, which he had heard the servants describe. He praised the birds that lived there and the flowers she loved. As she listened, the princess's anger softened, and at last she answered him in gentle words. They soon became so friendly that she vowed she would never marry anyone else.
        - id: ch03-b17
          speaker: princess
          text: In three days, my father will ride away to war. He will leave his sword hidden in this room. Any man who finds it and carries it to him will win my hand.
        - id: ch03-b18
          speaker: narrator
          text: At that moment a cock crowed, and the prince sprang up.
        - id: ch03-b19
          speaker: prince
          text: I shall ride to war with the king. If I do not return, take your violin to the shore every evening and play. Play loudly enough for the sea-kobolds at the bottom of the ocean to hear and come to you.
    - id: ch04
      title: The Sword and the Mermaid
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Three days later, just as the princess had said, the king rode to war with a great company behind him. The young prince went among them. He had presented himself at court as a nobleman who was looking for adventure. They had left the city many miles behind when the king suddenly discovered that his own sword was missing. Every attendant instantly offered him another, but the king declared that he could fight with no weapon except his own.
        - id: ch04-b02
          speaker: city_king
          text: The first man to bring my sword from my daughter's room shall marry her. When I die, he shall rule in my place.
        - id: ch04-b03
          speaker: narrator
          text: The Red Knight, the prince, and several others wheeled their horses around and raced toward the palace. Then the prince thought of a better way. He let the other riders pass, drew out his precious parcel, and wished to be a lion.
        - id: ch04-b04
          speaker: narrator
          text: He bounded toward the palace, roaring so dreadfully that the other riders' horses became frightened and impossible to control. While the men struggled with their mounts, the lion easily raced past them. He soon reached the palace gates. There he quickly became a bee, flew straight through the palace into the princess's room, and changed back into a man.
        - id: ch04-b05
          speaker: narrator
          text: The princess showed him the sword hidden behind a curtain. As he lifted it down, he reminded her of their promise.
        - id: ch04-b06
          speaker: prince
          text: Be sure you remember what you promised me.
        - id: ch04-b07
          speaker: narrator
          text: The princess did not answer aloud. She smiled sweetly, slipped a gold ring from her finger, and broke it into two pieces. Without a word, she held one half out to the prince. The other half went safely into her own pocket. The prince kissed the piece she had given him, took up the sword, and ran down the palace stairs.
        - id: ch04-b08
          speaker: narrator
          text: Farther along the road, he met the Red Knight and the other riders. The Red Knight tried to seize the sword by force, but the prince was too strong. The knight stopped fighting and decided to wait for a better chance.
        - id: ch04-b09
          speaker: narrator
          text: The chance soon came. The day was hot, and the prince was thirsty. He saw a little stream flowing into the sea, turned aside, unbuckled the sword, and lay down for a long drink.
        - id: ch04-b10
          speaker: narrator
          text: At that very moment, the mermaid was floating nearby. She knew this was the child promised to her before his birth. She drifted quietly toward him, caught him by the arm, and pulled him under. The waves closed over them both.
        - id: ch04-b11
          speaker: narrator
          text: They had scarcely vanished beneath the waves when the Red Knight crept cautiously toward the stream. He could hardly believe his eyes when he saw the king's sword lying alone on the bank. He wondered what had become of the young man who had guarded that treasure so fiercely only an hour before. Then he decided the answer was none of his concern. He fastened the sword to his own belt and carried it back to the king.
        - id: ch04-b12
          speaker: narrator
          text: The war soon ended, and the king's people greeted his return with joyful shouts. From her window, the princess searched the riders behind her father. Her promised husband was not among them, and her heart sank. She knew some evil had befallen him, and she feared the Red Knight.
        - id: ch04-b13
          speaker: narrator
          text: She had known for a long time how clever and wicked the Red Knight could be. Something told her that he would claim the honor of returning the sword. Then he would demand her as his bride, even though he had never set foot in her chamber. She had no way to stop him. Her father loved her, but he never allowed her wishes to stand in the way of his plans.
        - id: ch04-b14
          speaker: narrator
          text: Everything happened as she feared. The king told her that the Red Knight had won her fairly. Their wedding would be the next day, followed by a great feast.
    - id: ch05
      title: Music Above the Sea
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: In those days, wedding feasts lasted far longer and were much grander than they are now. Darkness was falling when the princess, worn out by all she had endured, slipped away to her room for a little peace.
        - id: ch05-b02
          speaker: narrator
          text: The moon shone so brightly across the sea that its light seemed to draw her toward the water. Remembering what the prince had told her, she tucked her violin under one arm, slipped out of the palace, and crept down to the shore alone.
        - id: ch05-b03
          speaker: mermaid
          text: Listen! That is the woman you loved before, playing her violin. We mermaids know everything that happens on land.
        - id: ch05-b04
          speaker: narrator
          text: The prince lay on a bed of seaweed at the bottom of the sea. He looked unhappy as he answered.
        - id: ch05-b05
          speaker: prince
          text: I cannot hear anything. Carry me higher, where the music can reach me.
          emotion: sad
        - id: ch05-b06
          speaker: narrator
          text: The mermaid lifted him onto her shoulders and carried him halfway to the surface.
        - id: ch05-b07
          speaker: mermaid
          text: Can you hear it now?
        - id: ch05-b08
          speaker: prince
          text: No. I hear only the water rushing. I must go higher.
        - id: ch05-b09
          speaker: narrator
          text: She carried him all the way to the surface.
        - id: ch05-b10
          speaker: mermaid
          text: Surely you can hear the music now?
        - id: ch05-b11
          speaker: prince
          text: I still hear nothing except the water.
        - id: ch05-b12
          speaker: narrator
          text: So the mermaid took him right up to the land.
        - id: ch05-b13
          speaker: mermaid
          text: You must be able to hear it here.
        - id: ch05-b14
          speaker: prince
          text: The water is still rushing in my ears. Wait a moment. The sound will soon fade.
        - id: ch05-b15
          speaker: narrator
          text: As he spoke, the prince reached inside his coat and grasped the bee's wing hair. He wished, became a bee, and flew straight into the princess's pocket.
        - id: ch05-b16
          speaker: narrator
          text: The mermaid searched the shore and water for him, but she searched in vain. She floated on the sea throughout the night, still waiting. The prince did not come back to her then, and he never gladdened her eyes again.
        - id: ch05-b17
          speaker: narrator
          text: The princess felt that something strange was close to her, though she could not guess what it might be. She quickly left the shore and returned to the palace. Once they were inside, the bee flew out of her pocket and became the young man again. At the sight of him alive before her, joy filled her heart. Still, the feast was continuing, and they had no time to lose.
    - id: ch06
      title: The Test at the Feast
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: The princess led the prince straight into the hall, where the king and his nobles were still feasting.
        - id: ch06-b02
          speaker: princess
          text: This man boasts that he can perform wonders even greater than the Red Knight's. Of course that cannot be true, but perhaps we should teach this impostor a lesson. He says he can turn himself into a lion, and I do not believe him. Red Knight, you have studied magic. Show him how it is done and put him to shame.
        - id: ch06-b03
          speaker: narrator
          text: The Red Knight had never opened a book of magic in his life. Yet he was used to believing he could do everything better than other people without learning how. Before the whole feast, he turned and twisted his body, bellowed loudly, and pulled terrible faces. For all that effort, he did not become a lion. He remained a man.
        - id: ch06-b04
          speaker: princess
          text: Perhaps becoming a lion is too difficult. Turn yourself into a bear instead.
        - id: ch06-b05
          speaker: narrator
          text: The Red Knight found changing into a bear no easier than changing into a lion.
        - id: ch06-b06
          speaker: princess
          text: Then try a bee. I have always read that anyone with even a little magic can manage that.
        - id: ch06-b07
          speaker: narrator
          text: The old knight buzzed and hummed, but he stayed exactly as he was.
        - id: ch06-b08
          speaker: princess
          text: Now it is your turn. Show us whether you can become a lion.
        - id: ch06-b09
          speaker: narrator
          text: In an instant, such a fierce lion stood before them that every guest rushed out of the hall. In their terror, they stumbled and trampled over one another. The lion sprang straight at the Red Knight and would have torn him to pieces. But the princess held the lion back and commanded him to take his human shape again. A second later, the young man stood where the lion had been.
        - id: ch06-b10
          speaker: princess
          text: Now become a bear.
        - id: ch06-b11
          speaker: narrator
          text: A bear appeared in the hall and advanced upon the Red Knight. It panted heavily and stretched both great arms toward him. All the knight's boasting deserted him, and he shrank away behind the princess for protection.
        - id: ch06-b12
          speaker: narrator
          text: By then, some of the guests had found enough courage to return as far as the doorway. They thought that if the princess could stand near the bear without harm, perhaps the hall was safe for them too. The king was braver than his guests. He also felt that a king ought to set everyone a good example, so he had never once left his chair.
        - id: ch06-b13
          speaker: narrator
          text: At another command from the princess, the bear became a man. The king stared in astonishment. At last, he began to suspect the truth.
        - id: ch06-b14
          speaker: city_king
          text: Was this the man who brought back my sword?
          emotion: surprised
        - id: ch06-b15
          speaker: princess
          text: Yes. He was the one.
        - id: ch06-b16
          speaker: narrator
          text: She told her father the whole story. She explained how she had broken her gold ring and given half to the prince. The prince brought out his half, and the princess took hers from her pocket. The two pieces fitted exactly.
        - id: ch06-b17
          speaker: narrator
          text: The next day, the Red Knight was hanged, as he richly deserved. Then a new wedding feast was held for the prince and princess.
