audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 清楚从容，像在为听众介绍一本古老的童话集
        timbre: 温暖明净
        pace: 舒缓
        pitch: 中音
    king:
      display_name: 国王
      tts: {delivery: 威严果断，忧虑时声音沉重, timbre: 洪亮厚实, pace: 适中, pitch: 中低音}
    mermaid:
      display_name: 人鱼
      tts: {delivery: 神秘从容，话音像随海浪起伏, timbre: 清冷柔滑, pace: 舒缓, pitch: 中高音}
    prince:
      display_name: 王子
      tts: {delivery: 年轻坦率，遇险时机敏坚定, timbre: 清朗明亮, pace: 适中, pitch: 中音}
    lion:
      display_name: 狮子
      tts: {delivery: 粗犷直接，吃饱后爽快友善, timbre: 浑厚有力, pace: 稍慢, pitch: 低音}
    bear:
      display_name: 黑熊
      tts: {delivery: 粗声粗气，理所当然又有些无礼, timbre: 低沉粗厚, pace: 缓慢, pitch: 低音}
    bee:
      display_name: 大黄蜂
      tts: {delivery: 急躁挑剔，说话干脆利落, timbre: 明亮紧实, pace: 稍快, pitch: 中高音}
    maid:
      display_name: 女仆
      tts: {delivery: 平实自然，带着一天劳作后的倦意, timbre: 清晰柔和, pace: 适中, pitch: 中高音}
    princess:
      display_name: 公主
      tts: {delivery: 聪慧敏锐，从戒备惊惧渐转为温柔果断, timbre: 清亮端正, pace: 适中, pitch: 中高音}
  chapters:
    - id: ch01
      title: 国王的诺言
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            很久很久以前，海边有一个国家，由一位国王统治。国王成婚才一年左右，住在远方一群岛屿上的臣民便反抗他的法令。事情闹得很大，他必须离开妻子，亲自渡海去平息纷争。王后总觉得这趟远行会招来灾祸，苦苦求他留在家中。可国王告诉她，这件事没有人能代替他去办。第二天一早，船帆张起，他还是出海了。
        - id: ch01-b02
          speaker: narrator
          text: >-
            船没走多远就撞上礁石，牢牢卡在一道石缝中。全船人使尽力气，也不能让它挪动分毫。偏偏风还越刮越大。谁都看得出来，再过几个钟头，船就会被浪头撞得粉碎，所有人都得葬身大海。正在这危急关头，一个人鱼的身影忽然出现在浪尖上，在随时会吞没他们的波涛间轻盈起舞。
        - id: ch01-b03
          speaker: mermaid
          text: 想活着离开，只有一个办法。你得郑重答应我，把你第一个出世的孩子交给我。
        - id: ch01-b04
          speaker: narrator
          text: >-
            国王听了，迟迟不肯答应。他一直盼望有一天，自己的家里也会有孩子。如今一想到未来的王位继承人必须交给人鱼，他心里苦极了。就在这时，一股巨浪狠狠撞上船舷，臣下们站立不稳，全跪下来求国王救他们的性命。国王再没有别的选择，只好许下诺言。紧接着又来了一股浪，竟把整条船托离礁石，送回了辽阔的大海。
        - id: ch01-b05
          speaker: narrator
          text: >-
            岛上的纷争比国王预料的更难解决，几个月过去，他才回到王宫。在他离开的日子里，王后已经生下一个儿子。国王欢喜得忘了人鱼，也忘了自己为救船付出的代价。可岁月一年年过去，婴儿长成高大健壮的男孩，那份记忆又回来了。一天，国王把真相全都告诉王后。从此，两人再没有安宁。每晚睡觉时，他们都怕第二天一早会看见孩子的房间空空荡荡。每个白天，他们又把孩子紧紧留在身边，时刻担心他会在自己眼前被夺走。
        - id: ch01-b06
          speaker: narrator
          text: 国王终于觉得不能再这样过下去，便和王后商量。
        - id: ch01-b07
          speaker: king
          text: >-
            把孩子留在人鱼一定会来找的地方，才是天下最愚蠢的办法。不如给他备些食物，让他出门远游。将来人鱼找来，也许另一个孩子就能让她满意。
        - id: ch01-b08
          speaker: narrator
          text: >-
            王后听完，也认为这已是最明智的办法。他们叫来儿子，国王把那次航海的经历从头到尾讲给他听。十六岁的王子几乎从没获准独自走出王宫花园，如今听说能一个人去看世界，反而兴奋不已，半点也不害怕。他忙着收拾行装，脱掉漂亮的天鹅绒外套，换上绿色呢衣。王后拿来一只精美的食物袋，他却不肯要，非要学别的旅人，把皮背囊挎上肩头。准备停当后，他告别父母，独自上路了。
    - id: ch02
      title: 狮子、黑熊和大黄蜂
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            王子走了一整天，一路兴致勃勃地观察森林里陌生的飞禽走兽。有些从小路上一闪而过，有些躲在灌木后面，偷偷探头看他。黄昏渐渐降临，他也越走越累，便边走边寻找过夜的地方。后来，他在一棵树下发现一片柔软的苔藓地。可他刚要躺下，一声可怕的咆哮便吓得他猛然一跳，浑身发抖。紧接着，有个东西从空中飞掠而来，一头狮子落在面前。
        - id: ch02-b02
          speaker: lion
          text: 你在这里做什么？
        - id: ch02-b03
          speaker: prince
          text: 我在躲避人鱼。
          emotion: fearful
        - id: ch02-b04
          speaker: lion
          text: 那就拿点吃的给我。早过了晚饭时候，我快饿坏了。
        - id: ch02-b05
          speaker: narrator
          text: >-
            王子听出狮子只是要食物，并不打算吃掉自己，庆幸得不得了。他赶紧捡起落在地上的背囊，拿出一些面包和一瓶酒。狮子吃喝完毕，觉得舒服多了，便说自己要睡在这片柔软的苔藓上，王子若愿意，也可以躺在旁边。于是，他们并肩躺下，沉沉睡去，一直睡到太阳升起。
        - id: ch02-b06
          speaker: lion
          text: >-
            我该走了。你割下我的耳朵尖，好好收着。以后遇到危险，只要想着变成狮子，你马上就会变成一头。好心总该有好报。
        - id: ch02-b07
          speaker: narrator
          text: >-
            王子谢过狮子的好意，照它的话割下耳朵尖，两人就此告别。王子走出不远，便很想试试变成狮子的滋味。他从上衣胸前取出耳朵尖，拼命想着自己要成为狮子。刹那间，他的脑袋胀大到原来的好几倍，脖子又热又沉。两只手不知怎的成了爪子，皮肤上也长出黄色的茸毛。最让他得意的，是那条末端带着一簇毛的长尾巴。他神气地抽打着尾巴，沿大路欢快地小跑起来。
        - id: ch02-b08
          speaker: prince
          text: 做狮子的滋味真不错。
          emotion: happy
        - id: ch02-b09
          speaker: narrator
          text: >-
            不过，这种陌生的走路方式很快让他厌倦了。他的背酸痛起来，两只前爪也磨得生疼。王子便盼着恢复原形。转眼间，尾巴消失，脑袋缩小，长长的厚鬃毛也变回短短的卷发。他找来一些干蕨叶，堆成睡床。可还没来得及闭眼，附近树林里便传来一阵巨响，好像有个沉重的庞然大物正撞开枝木闯来。一头巨大的黑熊朝他走了过来。
        - id: ch02-b10
          speaker: bear
          text: 你在这里做什么？
        - id: ch02-b11
          speaker: prince
          text: 我在躲避人鱼。
        - id: ch02-b12
          speaker: bear
          text: 我对人鱼没兴趣。我饿了，给我吃的。
        - id: ch02-b13
          speaker: narrator
          text: 王子拿出第二瓶酒和另一只面包，客气地请黑熊一起吃晚饭。黑熊一句话也不答，转眼便吃得干干净净。
        - id: ch02-b14
          speaker: bear
          text: >-
            这张蕨叶床看着很舒服。我一向睡不好，今晚也许能睡个好觉。反正你占不了多少地方，我勉强给你挤一点吧。
        - id: ch02-b15
          speaker: narrator
          text: >-
            王子听了这番理所当然的话，心里颇为恼火。可他实在太累，不愿再去收集一堆蕨叶，只好和黑熊并肩挤在一起。他们整夜没有动过，一觉睡到第二天日出。早晨，黑熊把睡意蒙眬的王子拉起来，让他先割下一截耳朵尖，好好收着。以后遇上危险，只要盼着自己变成熊，他就会立刻变成一头熊。黑熊也说，好心总该有好报。王子照办后，两人互相道别。
        - id: ch02-b16
          speaker: narrator
          text: >-
            王子又想试试做熊的滋味。他一许愿，身体便拉长，浑身长满浓黑的毛，双手也成了爪子。可他要甩尾巴时，那截小东西怎么也甩不起来。
        - id: ch02-b17
          speaker: prince
          text: 嗨，这也配叫尾巴！
          emotion: disgusted
        - id: ch02-b18
          speaker: narrator
          text: >-
            他用熊的模样走完了那一天。穿过森林里的荆棘丛时，那身熊皮非常管用。可到了傍晚，厚重的熊皮越来越难受，他便盼着恢复男孩的模样。王子已经累得筋疲力尽，既不愿再割蕨叶，也懒得寻找苔藓，直接倒在一棵树下。就在这时，头顶响起响亮的嗡嗡声。一只大黄蜂正好飞来，落在他头顶那根金银花的枝条上。
        - id: ch02-b19
          speaker: bee
          text: 你在这里干什么？你这个年纪，本该安安稳稳待在家里。
          emotion: angry
        - id: ch02-b20
          speaker: prince
          text: 我在躲避人鱼。
        - id: ch02-b21
          speaker: bee
          text: 我饿了。给我点吃的。
        - id: ch02-b22
          speaker: narrator
          text: >-
            大黄蜂像狮子和黑熊一样，属于那种只管提问、根本不听回答的家伙。王子从背囊里拿出最后一只面包和最后一瓶酒，放在地上，同它一起吃晚饭。最后一点面包屑也吃完后，大黄蜂说王子个头不算大，可以睡在自己身边。它卷好翅膀，收拢几条腿，两人都沉沉睡到早晨。天一亮，大黄蜂便起身仔细梳理，掸净天鹅绒般的绒毛上每一粒灰尘，又在王子耳边大声嗡鸣，把他叫醒。
        - id: ch02-b23
          speaker: bee
          text: >-
            从我的翅膀上拔一根细毛吧。遇到危险时，你只要想变成大黄蜂，就会立刻变成一只。好心总该有好报。再见，多谢你的晚饭。
        - id: ch02-b24
          speaker: narrator
          text: 王子拔下细毛，用叶子仔细包好。大黄蜂便飞走了。
    - id: ch03
      title: 锁眼后的公主
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            王子又步行了一两个钟头，越想越觉得做大黄蜂一定和做狮子、黑熊完全不同，而且飞起来多半会快得多。他取出那根细毛，盼着自己变成大黄蜂。最奇异的变化立刻发生了。他的四肢仿佛全缩到一起，身体变得又短又圆，脑袋小得出奇。原先白净的皮肤不见了，取而代之的是一层无比丰厚、无比柔软的绒毛。更妙的是，两片漂亮的薄纱翅膀托着他飞了一整天，一点也不累。
        - id: ch03-b02
          speaker: narrator
          text: >-
            下午很晚时，他远远看见一大片东西，仿佛是座巨大的石堆，便笔直飞了过去。到了城门前，他才看清，那原来是一座大城。王子恢复人形，走进城里。王宫大门敞开着，他大胆走进一间像是前厅的屋子。那里挤满了人，男仆女佣正聚在一起闲谈。王子也加入他们，很快便听说，国王只有一个女儿。公主厌恶所有男人，绝不许任何男人出现在面前。国王为此绝望极了，命人画下天下各国最英俊的王子，希望女儿能爱上一个。可公主连那些画像都不准送进房间。
        - id: ch03-b03
          speaker: maid
          text: 天晚了，我得去服侍主人。请给这位年轻人找张床吧。
        - id: ch03-b04
          speaker: prince
          text: 不必了。这条长凳就够，我平时也没有更好的地方睡。
        - id: ch03-b05
          speaker: narrator
          text: >-
            前厅的人散去后，王子先在长凳上躺了一会儿。等整座王宫安静下来，他取出大黄蜂翅膀上的细毛，许愿变成大黄蜂。他飞上楼梯，从守卫身边悄悄经过，又穿过锁眼，钻进公主的卧房。进屋以后，他才重新恢复人形。公主根本还没有睡着，一见眼前突然出现一个男人，便吓得放声尖叫。
        - id: ch03-b06
          speaker: princess
          text: 男人！这里有男人！
          emotion: fearful
        - id: ch03-b07
          speaker: narrator
          text: >-
            守卫听见喊声冲进来时，房里只剩一只大黄蜂嗡嗡飞舞。他们低头查看床底，又翻过帘幕后面，还把橱柜全搜了一遍。什么都没找到，守卫们认定公主只是做了一场噩梦，便行礼退出。房门刚在他们身后合上，大黄蜂就消失了，英俊的年轻人又站回原处。
        - id: ch03-b08
          speaker: princess
          text: 我就知道有个男人藏在这里！
          emotion: angry
        - id: ch03-b09
          speaker: narrator
          text: >-
            她这一次叫得更响，守卫再次赶来，连种种绝不可能藏人的地方都翻找过了，仍然一无所获。公主坚持那人刚才还在，自己亲眼看得清清楚楚。守卫不敢当面反驳，只能摇着头悄声议论。他们认定公主在这件事上已经发了疯，恐怕看见每张桌子、每把椅子，都以为是男人。守卫们打定主意，以后任凭她叫得多响，也绝不再理会。
        - id: ch03-b10
          speaker: narrator
          text: >-
            公主把守卫的心思看得清清楚楚。她知道以后再喊，他们也不会来帮忙。说不定守卫还会把她的怪话传给父亲，国王一生气，就会把她关进一座孤零零的高塔。从此，她再也不能去花园里散步，也不能和心爱的鸟儿花朵作伴。所以王子第三次出现在眼前时，她没有再尖叫，只是惊恐地坐起身，默默盯着他。
        - id: ch03-b11
          speaker: prince
          text: 别怕，我不会伤害你。
          emotion: calm
        - id: ch03-b12
          speaker: narrator
          text: >-
            王子从仆人那里听说过公主的花园，也知道她喜爱园里的鸟儿和花朵，便一样样称赞起来。公主慢慢消了怒气，回答他时也温和起来。两人很快亲密得不得了，公主发誓除了他谁也不嫁。她还悄悄告诉王子，三天后父亲要出征打仗，会把宝剑留在她房中。哪个男人能找到那把剑，送到国王手上，谁就能娶她。话说到这里，雄鸡忽然啼叫，王子赶忙跳了起来。
        - id: ch03-b13
          speaker: prince
          text: >-
            我一定会跟国王出征。要是我没有回来，你每天傍晚就带着小提琴到海边演奏。连海底的水精都会听见琴声，来到你身边。
    - id: ch04
      title: 被夺走的宝剑
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            三天后，国王带领大队人马出征。王子也在队伍中，他在宫廷里自称是出来寻求奇遇的年轻贵族。离城许多英里后，国王突然发现忘了宝剑。随从纷纷献剑，他却说自己只能用原来那一把。
        - id: ch04-b02
          speaker: king
          text: 谁第一个从我女儿房里把剑送来，谁就能娶她。等我死后，他还能继承王位。
        - id: ch04-b03
          speaker: narrator
          text: >-
            红骑士、王子和另外几人立刻掉转马头，骑得像风一样快。王子忽然想到更好的办法，便故意慢下来，让别人先跑。他从胸前取出那包珍贵的宝物，变成狮子，一路吼叫着向前飞奔。可怕的吼声把那些马吓得失去控制，他轻而易举地超过众人，很快赶到王宫门前。到了那里，他又连忙变成大黄蜂，径直飞进公主房里，再恢复人形。公主指给他看，宝剑正藏在帘幕后。
        - id: ch04-b04
          speaker: prince
          text: 千万别忘记你答应过我的事。
        - id: ch04-b05
          speaker: narrator
          text: >-
            公主没有回答，只是甜甜一笑。她从手指上褪下金戒指，掰成两半，默默把一半递给王子，另一半则放进自己的衣袋。王子吻了吻那半枚戒指，带着宝剑跑下楼梯。离王宫一段路后，他遇见红骑士和其他人。红骑士起先想凭蛮力夺走宝剑，可年轻的王子比他强壮得多。红骑士只好放弃，暗中等待另一个机会。
        - id: ch04-b06
          speaker: narrator
          text: >-
            这个机会很快来了。天气炎热，王子渴得厉害。他看到一条小溪流入大海，便离开道路，解下宝剑，趴在岸边痛饮溪水。不巧，人鱼恰好漂在不远处的水面。她一眼就认出，这正是还没出生便已许给她的男孩。人鱼轻轻漂到他身边，一把抓住他的手臂，海浪随即在两人头上合拢，把他们一起吞没了。
        - id: ch04-b07
          speaker: narrator
          text: >-
            他们刚刚消失，红骑士就蹑手蹑脚地走来。他看见国王的剑竟然留在岸上，几乎不敢相信自己的眼睛。一个钟头以前，那个年轻人还把这件宝物守得那么紧，如今人却不见了。红骑士也纳闷他去了哪里，不过转念一想，这跟自己又有什么相干！于是，他把宝剑系在腰间，若无其事地带回去交给国王。
        - id: ch04-b08
          speaker: narrator
          text: >-
            战争很快结束。国王回到臣民中间，人们欢呼着迎接他。公主从窗口望去，却没在父亲身后的队伍里看见自己的未婚夫，心顿时沉了下去。她知道王子一定遭遇了祸事，也害怕起红骑士来。她早就知道那个骑士有多狡猾、多邪恶。心里有个声音告诉她，红骑士一定会冒领送回宝剑的功劳，要求娶她为妻，尽管他连公主的房间都没进去过。可是她无计可施。国王虽然爱女儿，却从不允许她阻挡自己的安排。
        - id: ch04-b09
          speaker: narrator
          text: >-
            可怜的公主猜得一点也没错。国王说红骑士堂堂正正赢得了她，婚礼明天举行，婚后还要大摆筵席。
    - id: ch05
      title: 海上的琴声
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            那个年代的宴席比今天更漫长，也更奢华。等到天色渐渐暗下去，公主被这一天的种种折磨弄得疲惫不堪，便悄悄回到自己的房间，想独自清静片刻。可是明月把海面照得如此明亮，仿佛正把她向海边召唤。公主想起与王子的约定，把小提琴夹在腋下，悄悄走出王宫，来到岸边演奏。
        - id: ch05-b02
          speaker: mermaid
          text: >-
            听，快听！那是你的旧情人在拉琴。陆地上发生的每件事，我们人鱼都知道。
        - id: ch05-b03
          speaker: narrator
          text: 王子正躺在海底的一张海草床上，看起来一点也不快活。
        - id: ch05-b04
          speaker: prince
          text: 我什么也听不见。带我升高一些，到琴声能传来的地方。
        - id: ch05-b05
          speaker: narrator
          text: 人鱼把他扛在肩上，带到海底与水面之间。
        - id: ch05-b06
          speaker: mermaid
          text: 现在听见了吗？
        - id: ch05-b07
          speaker: prince
          text: 没有，只有奔涌的水声。还得再高一点。
        - id: ch05-b08
          speaker: narrator
          text: 人鱼把他带到水面。
        - id: ch05-b09
          speaker: mermaid
          text: 这下总该听见了吧？
        - id: ch05-b10
          speaker: prince
          text: 还是只有水声。
        - id: ch05-b11
          speaker: narrator
          text: 人鱼只好把他送到陆地上。
        - id: ch05-b12
          speaker: mermaid
          text: 这回无论如何能听见了吧？
        - id: ch05-b13
          speaker: prince
          text: 耳朵里还在哗哗响。等一会儿，很快就会好。
        - id: ch05-b14
          speaker: narrator
          text: >-
            王子说着便把手伸进胸前，抓住那根细毛，变成大黄蜂，径直飞进公主的衣袋。人鱼四处寻找，一整夜都在海上漂游，却再没见过他。从此以后，王子也再没回去让她看上一眼。公主只觉得身边好像多了什么奇怪的东西，却不知道那是什么，便匆匆赶回王宫。王子在那里恢复了原形。公主见到他，心里又惊又喜，可此刻片刻也不能耽搁。她立即把王子领进宴会大厅，国王和贵族们还坐在那里赴宴。
    - id: ch06
      title: 三场变形
      blocks:
        - id: ch06-b01
          speaker: princess
          text: >-
            这个人吹嘘自己会了不起的法术，甚至比红骑士还强。当然不会是真的，不过我们该教训一下这个骗子。他说自己能变成狮子，我根本不信。红骑士，你精通魔法，就示范给他看，让他当众出丑吧。
        - id: ch06-b02
          speaker: narrator
          text: >-
            其实，红骑士这一辈子连一本魔法书都没翻开过。可他一向觉得，不管做什么事，就算没有人教，自己也能胜过别人。于是，他当着满厅宾客的面扭动身体，又吼又叫，还挤眉弄眼，做出各种鬼脸。可不管他怎样折腾，始终还是一个人，没有变成狮子。
        - id: ch06-b03
          speaker: princess
          text: 变成狮子也许太难。那就变成黑熊吧。
        - id: ch06-b04
          speaker: narrator
          text: 红骑士照样办不到。
        - id: ch06-b05
          speaker: princess
          text: >-
            那就试试大黄蜂。我在书上读过，只要真会一点魔法，这个总能做到。
        - id: ch06-b06
          speaker: narrator
          text: 老骑士又嗡嗡又哼哼，可还是没变成大黄蜂。
        - id: ch06-b07
          speaker: princess
          text: 现在轮到你。让我们看看，你能不能变成狮子。
        - id: ch06-b08
          speaker: narrator
          text: >-
            转眼间，一头凶猛得吓人的狮子站在众人面前。所有宾客都吓得冲出大厅，慌乱中彼此踩踏。狮子猛地扑向红骑士，眼看就要把他撕成碎片。幸亏公主及时拦住狮子，命令王子恢复人形。只过了一眨眼，原来站着狮子的地方，又出现了那个年轻人。
        - id: ch06-b09
          speaker: princess
          text: 现在变成黑熊。
        - id: ch06-b10
          speaker: narrator
          text: >-
            一头熊喘着粗气，伸开两只前臂，步步走向红骑士。红骑士吓得缩在公主身后。这时，一些宾客已经找回勇气，又小心地回到大厅门口。他们想，既然公主待在那里安然无恙，自己大概也不会有事。国王比他们勇敢，而且觉得自己应该给众人作个好榜样，所以始终没有离开座位。公主再次下令，黑熊便变回王子。国王惊讶得说不出话，心里也渐渐猜到了真相。
        - id: ch06-b11
          speaker: king
          text: 取回宝剑的人，是他吗？
          emotion: surprised
        - id: ch06-b12
          speaker: princess
          text: 是他。
        - id: ch06-b13
          speaker: narrator
          text: >-
            公主把事情的全部经过告诉父亲，还说起自己怎样掰断金戒指，把其中一半交给王子。王子从身上取出他的半枚戒指，公主也取出自己那一半。两片戒指放在一起，果然严丝合缝。真相再也没有疑问。第二天，罪有应得的红骑士被处以绞刑，王子和公主也重新举行了一场婚宴。
        - id: ch06-b14
          speaker: narrator
          text: 这个故事选自《拉普兰童话》。
