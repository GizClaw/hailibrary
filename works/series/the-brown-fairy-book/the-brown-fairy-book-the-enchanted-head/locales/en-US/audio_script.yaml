  chapters:
    - id: ch01
      title: The Head on the Bridge
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once, an old woman lived with her two daughters in a small cottage by the sea. They were very poor. The girls hardly ever went out because they spent each day making veils for ladies to wear over their faces. Every morning, once the veils were finished, their mother carried them across the bridge and sold them in the city. With the money, she bought all the food they needed for that day. Then she returned home and took her place beside her daughters to make more veils.
        - id: ch01-b02
          speaker: narrator
          text: One morning she got up earlier than usual and set off toward the city with her bundle of finished veils. As she crossed the bridge, she suddenly stumbled against a human head. It had never been there before. She recoiled in horror. Then, to her amazement, the head spoke as though a body were attached to it.
        - id: ch01-b03
          speaker: enchanted_head
          text: Please take me with you, good mother. Take me home with you.
        - id: ch01-b04
          speaker: narrator
          text: The poor woman nearly lost her senses with fear. Keep that dreadful thing in her house? Never! She turned and ran home as fast as she could, without knowing that the head was jumping, dancing, and rolling after her. When she reached her own door, it bounded inside ahead of her. It stopped before the fire and kept begging and pleading to be allowed to stay.
        - id: ch01-b05
          speaker: narrator
          text: No one ate that day. The veils had not been sold, so there was no money for food. The three women worked in silence, each secretly blaming the head for their bad luck.
        - id: ch01-b06
          speaker: narrator
          text: Evening came, and still there was no supper. At last, the head spoke for the first time since morning.
        - id: ch01-b07
          speaker: enchanted_head
          text: Good mother, does no one eat in this house? I have been here for hours, and not one of you has touched any food.
        - id: ch01-b08
          speaker: old_woman
          text: No. We are not eating today.
        - id: ch01-b09
          speaker: enchanted_head
          text: Why not, good mother?
        - id: ch01-b10
          speaker: old_woman
          text: We have no money to buy food.
        - id: ch01-b11
          speaker: enchanted_head
          text: Do you usually go without eating?
        - id: ch01-b12
          speaker: old_woman
          text: No. Each morning I sell our veils in the city. The few shillings they bring pay for everything we need. I did not cross the bridge today, so I had nothing to spend on food.
        - id: ch01-b13
          speaker: enchanted_head
          text: Then you have all been hungry because of me?
        - id: ch01-b14
          speaker: old_woman
          text: Yes, we have.
        - id: ch01-b15
          speaker: enchanted_head
          text: Then I will give you plenty of money, if you follow my instructions. Be on the bridge when the clock strikes twelve, at the place where you found me. Call out “Ahmed” three times, as loudly as you can. A man will appear. Tell him, “The head, your master, commands you to open the trunk and give me the green purse inside.”
        - id: ch01-b16
          speaker: old_woman
          text: Very well, my lord. I will leave for the bridge now.
        - id: ch01-b17
          speaker: narrator
          text: She wrapped her veil around herself and went out. Midnight was striking when she reached the place where she had met the head.
        - id: ch01-b18
          speaker: old_woman
          text: Ahmed! Hear me call you. Ahmed! Ahmed!
        - id: ch01-b19
          speaker: narrator
          text: At once, a huge man as tall as a giant stood before her on the bridge.
        - id: ch01-b20
          speaker: ahmed
          text: What do you want?
        - id: ch01-b21
          speaker: old_woman
          text: The head, your master, commands you to open the trunk and give me the green purse inside.
        - id: ch01-b22
          speaker: ahmed
          text: I will return in a moment, good mother.
        - id: ch01-b23
          speaker: narrator
          text: Three minutes later, Ahmed placed a purse full of sequins in her hand.
    - id: ch02
      title: Two Purses and a Royal Bride
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: No one could imagine how the whole family rejoiced at the sight of so much wealth. Their tiny, crumbling cottage was rebuilt. The daughters got new dresses, and their mother no longer needed to sell veils. Having money to spend was entirely new to them, and they were not as careful as they might have been. Little by little, the green purse emptied. Before long, not one coin remained. Their hearts sank, and their faces grew sad.
        - id: ch02-b02
          speaker: enchanted_head
          text: Have you spent the whole fortune? Then go to the bridge at midnight, good mother, and call “Mahomet” three times as loudly as you can. A man will come. Tell him to open the trunk and give you the red purse inside.
        - id: ch02-b03
          speaker: narrator
          text: The old woman needed no second telling. She left for the bridge at once.
        - id: ch02-b04
          speaker: old_woman
          text: Mahomet! Hear me call you. Mahomet! Mahomet!
        - id: ch02-b05
          speaker: narrator
          text: In an instant, a man even larger than Ahmed stood before her.
        - id: ch02-b06
          speaker: mahomet
          text: What do you want?
        - id: ch02-b07
          speaker: old_woman
          text: The head, your master, orders you to open the trunk and give me the red purse inside.
        - id: ch02-b08
          speaker: mahomet
          text: Very well, good mother. I will do it.
        - id: ch02-b09
          speaker: narrator
          text: Mahomet vanished. A moment later, he was back with the purse in his hand.
        - id: ch02-b10
          speaker: narrator
          text: This time the money seemed endless. The old woman built herself a new house and filled it with the most beautiful things she could find in the shops. Her daughters were always wrapped in veils that seemed woven from sunbeams, and their dresses glittered with precious stones. The neighbors marveled at the change. They wondered where all this sudden wealth had come from, but no one knew about the head hidden in the house.
        - id: ch02-b11
          speaker: enchanted_head
          text: Good mother, go to the city this morning. Ask the sultan to give me his daughter as my bride.
        - id: ch02-b12
          speaker: old_woman
          text: Ask him what? How can I tell the sultan that a head without a body wants to be his son-in-law? They will think I have gone mad. I will be driven from the palace, and the children will stone me!
          emotion: fearful
        - id: ch02-b13
          speaker: enchanted_head
          text: Do as I command. It is my will.
        - id: ch02-b14
          speaker: narrator
          text: The old woman was too afraid to argue. She dressed in her richest clothes and went to the palace. The sultan received her at once, and she made her request in a trembling voice.
        - id: ch02-b15
          speaker: sultan
          text: Have you lost your mind, old woman?
          emotion: surprised
        - id: ch02-b16
          speaker: old_woman
          text: This suitor is powerful, O Sultan. Nothing is impossible for him.
        - id: ch02-b17
          speaker: sultan
          text: Is that really true?
        - id: ch02-b18
          speaker: old_woman
          text: It is true, O Sultan. I swear it.
        - id: ch02-b19
          speaker: sultan
          text: Then he must prove his power by completing three tasks. If he does, I will give him my daughter.
        - id: ch02-b20
          speaker: old_woman
          text: Tell me your commands, gracious prince.
        - id: ch02-b21
          speaker: sultan
          text: Do you see the hill in front of my palace?
        - id: ch02-b22
          speaker: old_woman
          text: Yes, I see it.
        - id: ch02-b23
          speaker: sultan
          text: In forty days, your master must make that hill disappear and put a beautiful garden in its place. That is his first task. Now go and give him my answer.
        - id: ch02-b24
          speaker: narrator
          text: The old woman returned home and told the head the sultan's first condition.
        - id: ch02-b25
          speaker: enchanted_head
          text: It will be done.
        - id: ch02-b26
          speaker: narrator
          text: He said nothing more about it.
    - id: ch03
      title: The Garden in a Night
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: For thirty-nine days, the head stayed in his favorite corner and did nothing at all about the hill. The old woman began to think the task was beyond his power. She expected to hear no more about the sultan's daughter. Then, on the thirty-ninth evening after her visit to the palace, the head suddenly spoke.
        - id: ch03-b02
          speaker: enchanted_head
          text: Good mother, go to the bridge tonight and call “Ali” three times as loudly as you can. A man will appear. Tell him to level the hill and make the most beautiful garden ever seen in its place.
        - id: ch03-b03
          speaker: old_woman
          text: I will go now.
        - id: ch03-b04
          speaker: narrator
          text: She soon reached the bridge and stood where she had first found the head.
        - id: ch03-b05
          speaker: old_woman
          text: Ali! Hear me call you. Ali! Ali!
        - id: ch03-b06
          speaker: narrator
          text: A man appeared at once. He was so enormous that the old woman was half afraid, but his voice was mild and gentle.
        - id: ch03-b07
          speaker: ali
          text: What do you want?
        - id: ch03-b08
          speaker: old_woman
          text: Your master commands you to level the hill in front of the sultan's palace. Make the most beautiful garden in the world where it stands now.
        - id: ch03-b09
          speaker: ali
          text: Tell my master that I will obey him. It shall be done this very moment.
        - id: ch03-b10
          speaker: narrator
          text: The old woman went home and repeated Ali's message to the head.
        - id: ch03-b11
          speaker: narrator
          text: Meanwhile, the sultan waited in his palace for the fortieth dawn. Not one spadeful of earth had been taken from the hill.
        - id: ch03-b12
          speaker: sultan
          text: If that old woman has tricked me, I will hang her. Tomorrow I will put the gallows on the hill itself.
          emotion: angry
        - id: ch03-b13
          speaker: narrator
          text: But morning came, and the hill was gone. When the sultan opened his eyes, he wondered why his room was so much brighter than usual. The air was filled with the sweet scent of flowers.
        - id: ch03-b14
          speaker: sultan
          text: Could there be a fire? The sun has never entered through this window before. I must get up and look.
        - id: ch03-b15
          speaker: narrator
          text: He rose and went to the window. Below him, where the hill had stood the day before, flowers from every part of the world were blooming. Creepers of every color hung in long chains from one tree to the next. The sight and the scent filled the whole view beneath the palace. Then the sultan remembered the old woman's promise.
        - id: ch03-b16
          speaker: sultan
          text: Her son must be a very clever magician! I have never known anyone so clever. Now, what task shall I give him? Ah, I have it.
          emotion: surprised
        - id: ch03-b17
          speaker: narrator
          text: He sent for the old woman, who was already waiting below by the head's command.
        - id: ch03-b18
          speaker: sultan
          text: Your son has done exactly what I asked. This garden is larger and finer than any other king's. But when I cross it, I will need somewhere to rest on the far side. Within forty days, he must build me a palace there. Every room must hold furniture from a different country, and each room must be more magnificent than any room ever seen.
        - id: ch03-b19
          speaker: narrator
          text: With that, he turned away. The old woman walked home slowly with her head bowed.
        - id: ch03-b20
          speaker: old_woman
          text: He will never manage this one. It is much harder than removing the hill.
        - id: ch03-b21
          speaker: enchanted_head
          text: Well, what must I do next?
        - id: ch03-b22
          speaker: narrator
          text: The head sounded cheerful, and the old woman told him about the palace.
        - id: ch03-b23
          speaker: enchanted_head
          text: Is that all? Why, it is child's play.
    - id: ch04
      title: The Blue Palace and Forty Servants
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The head seemed to give no further thought to the palace for thirty-nine days. Then he told the old woman to go to the bridge and call for Hassan.
        - id: ch04-b02
          speaker: old_woman
          text: Hassan! Hear me call you. Hassan! Hassan!
        - id: ch04-b03
          speaker: narrator
          text: Hassan appeared, but he was not as polite as the others had been.
        - id: ch04-b04
          speaker: hassan
          text: What do you want, old woman?
        - id: ch04-b05
          speaker: old_woman
          text: Your master commands you to build the most magnificent palace ever seen. Place it at the edge of the new garden.
        - id: ch04-b06
          speaker: hassan
          text: I will obey him.
        - id: ch04-b07
          speaker: narrator
          text: Hassan vanished to carry out the command. By morning, the palace stood at the far edge of the garden, just as the sultan had required. Its rooms held magnificent furnishings from many different countries. When the sultan woke, he saw the palace in the distance. It was built from soft blue marble and rested on slender pillars of pure gold.
        - id: ch04-b08
          speaker: sultan
          text: That old woman's son truly is all-powerful. What can I demand from him now?
          emotion: surprised
        - id: ch04-b09
          speaker: narrator
          text: He thought for a while, then sent for the old woman. She had been expecting the summons.
        - id: ch04-b10
          speaker: sultan
          text: The garden is wonderful, and the palace is the finest in the world. But my own servants would look shabby inside it. Your son must fill it with forty servants of unmatched beauty. They must all look exactly alike and be the same height.
        - id: ch04-b11
          speaker: narrator
          text: This time, the sultan believed he had invented a truly impossible task. He was very pleased with his own cleverness.
        - id: ch04-b12
          speaker: narrator
          text: Thirty-nine days passed. At midnight on the final night, the old woman stood again on the bridge.
        - id: ch04-b13
          speaker: old_woman
          text: Bekir! Hear me call you. Bekir! Bekir!
        - id: ch04-b14
          speaker: narrator
          text: Bekir appeared before her.
        - id: ch04-b15
          speaker: bekir
          text: What do you need from me?
        - id: ch04-b16
          speaker: old_woman
          text: The head, your master, commands you to find forty servants of unequalled beauty, all the same height. Place them in the sultan's palace beyond the garden.
        - id: ch04-b17
          speaker: narrator
          text: On the morning of the fortieth day, the sultan went to the blue palace. Forty servants received him there. Every one of them had unequalled beauty, every face looked exactly alike, and every one stood at the same height. The sight nearly made the sultan lose his senses with surprise.
        - id: ch04-b18
          speaker: sultan
          text: I will certainly give my daughter to the old woman's son. I could search the whole world and never find a more powerful son-in-law.
        - id: ch04-b19
          speaker: narrator
          text: When the old woman came before him, he told her he was ready to keep his promise. Her son must appear at the palace without delay.
    - id: ch05
      title: The Enchantment Revealed
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The command did not please the old woman at all, though she made no objection in front of the sultan. When she reached home, she complained to the head.
        - id: ch05-b02
          speaker: old_woman
          text: Everything has gone well until now. But what do you think the sultan will say when he sees the man his daughter is supposed to marry?
        - id: ch05-b03
          speaker: enchanted_head
          text: Never mind what he says. Put me on a silver dish and carry me to the palace.
        - id: ch05-b04
          speaker: narrator
          text: The old woman did as he asked. Her heart pounded as she set down the silver dish with the head resting on it. The moment the sultan saw him, he flew into a violent rage.
        - id: ch05-b05
          speaker: sultan
          text: I will never let my daughter marry such a monster!
          emotion: angry
        - id: ch05-b06
          speaker: narrator
          text: The princess gently rested her head against her father's arm.
        - id: ch05-b07
          speaker: princess
          text: You gave your word, Father. You cannot break it.
          emotion: calm
        - id: ch05-b08
          speaker: sultan
          text: But my child, you cannot possibly marry such a creature!
          emotion: surprised
        - id: ch05-b09
          speaker: princess
          text: Yes, I will marry him. He has a beautiful head, and I already love him.
        - id: ch05-b10
          speaker: narrator
          text: And so the marriage was celebrated. Great feasts were held throughout the palace, though the people wept when they thought of the sad fate of their beloved princess. To them, she had been given to a head without a body, and they could not imagine what happiness she might find.
        - id: ch05-b11
          speaker: narrator
          text: When the celebrations ended and the young couple were alone, the head suddenly disappeared. Or rather, a body appeared beneath it. One of the handsomest young men anyone had ever seen now stood before the princess.
        - id: ch05-b12
          speaker: enchanted_head
          text: A wicked fairy put an enchantment on me when I was born. To everyone else, I must always be nothing but a head. But for you, and only for you, I am a man like any other.
        - id: ch05-b13
          speaker: princess
          text: And that is all I care about.
