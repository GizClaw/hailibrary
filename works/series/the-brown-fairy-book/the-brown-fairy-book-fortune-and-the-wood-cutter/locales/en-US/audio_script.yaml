  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, grave, and attentive to wonder
        timbre: clear and resonant
        pace: measured
        pitch: medium
    wood_cutter:
      display_name: Wood-Cutter
      tts:
        delivery: weary, stubborn, and bluntly triumphant
