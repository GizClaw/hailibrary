  chapters:
    - id: ch01
      title: Fortune and the Wood-Cutter
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Several hundred years ago, a wood-cutter lived in a forest with his wife and children. He was very poor. All he had to earn his living were an axe and two mules, which carried his wood to the nearest town. Still, he worked hard. Summer or winter, he was always out of bed by five in the morning.
        - id: ch01-b02
          speaker: narrator
          text: This hard life went on for twenty years. By then, his sons were grown and went into the forest with him. But everything seemed to work against the family, and they stayed as poor as ever. At last, the wood-cutter lost heart.
        - id: ch01-b03
          speaker: wood_cutter
          text: What good is all this work if I never end the day a penny richer? I won't go back to the forest. Maybe if I stay in bed and stop chasing Fortune, she'll come to me one day.
        - id: ch01-b04
          speaker: narrator
          text: The next morning, he did not get up. When the clock struck six, his wife left her housecleaning and went to see what was wrong.
        - id: ch01-b05
          speaker: wife
          text: Are you ill? The cock has crowed again and again. You should have been up long ago.
          emotion: surprised
        - id: ch01-b06
          speaker: wood_cutter
          text: Why should I get up?
        - id: ch01-b07
          speaker: wife
          text: Why? You have to go to the forest, of course.
        - id: ch01-b08
          speaker: wood_cutter
          text: And after working all day, I'll barely earn enough to feed us one meal.
        - id: ch01-b09
          speaker: wife
          text: But what else can we do, my poor husband? Fortune has always played tricks on us. She has never once smiled our way.
        - id: ch01-b10
          speaker: wood_cutter
          text: I've had enough of Fortune's tricks! If she wants me, she can find me here. I'm finished with cutting wood forever.
          emotion: angry
        - id: ch01-b11
          speaker: wife
          text: My dear husband, your troubles have driven you mad! Do you really think Fortune comes to someone who won't go after her? Get dressed, saddle the mules, and start your work. There isn't even a morsel of bread in the house.
        - id: ch01-b12
          speaker: wood_cutter
          text: I don't care. I'm not going to the forest. You can keep talking, but nothing will change my mind.
        - id: ch01-b13
          speaker: narrator
          text: His poor wife begged and pleaded, but it did no good. He stayed in bed. At last, she gave up in despair and went back to her work.
        - id: ch01-b14
          speaker: narrator
          text: An hour or two later, a man from the nearest village knocked at the door. The wife opened it.
        - id: ch01-b15
          speaker: neighbour
          text: Good morning, mother. I have a job to do. Since your husband isn't using the mules, would he lend them to me? And could he come lend me a hand himself?
        - id: ch01-b16
          speaker: wife
          text: He's upstairs. You'd better ask him.
        - id: ch01-b17
          speaker: narrator
          text: The neighbour went upstairs and asked the wood-cutter for his help.
        - id: ch01-b18
          speaker: wood_cutter
          text: I'm sorry, neighbour. I've sworn that I won't leave this bed, and nothing will make me break that vow.
        - id: ch01-b19
          speaker: neighbour
          text: Then will you lend me your two mules? I'll pay you for using them.
        - id: ch01-b20
          speaker: wood_cutter
          text: Of course, neighbour. Take them. You're welcome to them.
        - id: ch01-b21
          speaker: narrator
          text: The man left the house, led the mules out of the stable, and put two sacks across their backs. Then he drove them to a field where he had found a hidden treasure.
        - id: ch01-b22
          speaker: narrator
          text: He filled both sacks with money, though he knew perfectly well that the treasure belonged to the sultan. He was quietly driving the loaded mules home when he saw two soldiers coming along the road.
        - id: ch01-b23
          speaker: narrator
          text: The man knew he would be put to death if they caught him. He fled back into the forest. Left on their own, the mules followed the path to their master's stable.
        - id: ch01-b24
          speaker: narrator
          text: The wood-cutter's wife was looking out the window when the mules stopped at the door. Their loads were so heavy that the animals could hardly stand. She quickly called to her husband, who was still lying in bed.
        - id: ch01-b25
          speaker: wife
          text: Quick! Get up as fast as you can! Our mules have come back with sacks on them. Whatever is inside, it's so heavy that the poor animals can barely stand.
        - id: ch01-b26
          speaker: wood_cutter
          text: Wife, I've told you a dozen times that I won't get up. Why can't you leave me alone?
        - id: ch01-b27
          speaker: narrator
          text: Her husband would not help, so the woman took a large knife and cut the cords holding the sacks to the mules. The sacks dropped straight to the ground. A rain of gold coins poured out, until the little courtyard shone like the sun.
        - id: ch01-b28
          speaker: wife
          text: A treasure! A treasure!
          emotion: surprised
        - id: ch01-b29
          speaker: narrator
          text: At first, surprise had left her speechless. Now she ran to tell her husband.
        - id: ch01-b30
          speaker: wife
          text: Get up! Get up! You were right to stay away from the forest and wait for Fortune in bed. She has finally come! Our mules brought home all the gold in the world, and it's lying in the courtyard. No one in the whole country can be as rich as we are!
          emotion: surprised
        - id: ch01-b31
          speaker: narrator
          text: In an instant, the wood-cutter was on his feet. He ran to the courtyard and stopped there, dazzled by the glittering coins scattered all around him. At last, he spoke.
        - id: ch01-b32
          speaker: wood_cutter
          text: You see, my dear wife? I was right. Fortune is so changeable that you can never count on her. Chase after her, and she'll fly away from you. Stay still, and she'll come to you.
