  chapters:
    - id: ch01
      title: The Cat Who Kept Her Word
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a queen with a beautiful smoke-colored cat. The cat had china-blue eyes, and the queen loved her dearly. Wherever the queen went, the cat followed. She even sat proudly beside her mistress when they rode out in a fine glass coach.
        - id: ch01-b02
          speaker: queen
          text: Oh, pussy, you are happier than I am. You have a dear little kitten just like you, while I have no one but you to play with.
          emotion: sad
        - id: ch01-b03
          speaker: smoke_cat
          text: Don't cry. Tears won't help us. I'll find out what can be done.
          emotion: calm
        - id: ch01-b04
          speaker: narrator
          text: The cat rested one paw on the queen's arm as she spoke, and she kept her promise. As soon as their drive was over, she trotted into the forest to ask a fairy for help. Before long, the queen had a baby girl who seemed to be made of snow and sunbeams.
        - id: ch01-b05
          speaker: narrator
          text: The queen was delighted. Soon the baby began watching the kitten leap around the room. At bedtime, she would not sleep unless that kitten was curled beside her.
        - id: ch01-b06
          speaker: narrator
          text: Two or three months passed. The baby was still a baby, but the kitten was quickly growing into a cat. Then one evening, when the nurse came to put her into the baby's cot, she could not be found.
        - id: ch01-b07
          speaker: narrator
          text: Everyone hunted for her. Each servant hoped the queen would reward whoever found the missing cat, so they searched in places where she could never have fit. They opened boxes scarcely big enough for one paw. They pulled books from the shelves in case she was hidden behind them, and they took out every drawer in case she had been shut inside. Nothing worked. The cat had plainly run away, and no one knew whether she would ever come back.
    - id: ch02
      title: A Voice Among the Roses
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Years went by. One day the princess, whose name was Ingibjorg, was playing ball in the garden. She threw the ball farther than usual, and it landed among some rosebushes. She ran after it and bent down to search through the long grass. Then a voice called to her.
        - id: ch02-b02
          speaker: kisa
          text: Ingibjorg! Ingibjorg! Have you forgotten me? I'm Kisa, your sister!
        - id: ch02-b03
          speaker: ingibjorg
          text: But I've never had a sister.
          emotion: surprised
        - id: ch02-b04
          speaker: narrator
          text: Ingibjorg was completely puzzled. No one had told her what had happened when she was a baby.
        - id: ch02-b05
          speaker: kisa
          text: Don't you remember me sleeping beside you in your cot? You always cried until I came. Girls have no memory at all! Why, if I could get inside the palace, I could go straight to that cot right now.
        - id: ch02-b06
          speaker: ingibjorg
          text: Then why did you leave?
        - id: ch02-b07
          speaker: narrator
          text: Before Kisa could answer, Ingibjorg's attendants hurried up, breathless. The sight of a strange cat horrified them. Kisa darted into the bushes and returned to the forest.
        - id: ch02-b08
          speaker: narrator
          text: The princess was very annoyed with her ladies for frightening away her old playmate. The queen came to Ingibjorg's room every evening to say good night. When she arrived that night, Ingibjorg told her what had happened.
        - id: ch02-b09
          speaker: queen
          text: Yes, everything Kisa told you is true. I wish I could have seen her again. Perhaps she'll come back one day. If she does, you must bring her to me.
        - id: ch02-b10
          speaker: narrator
          text: The next morning was very hot. Ingibjorg declared that she had to play in the forest, where the great shady trees kept the air cool. As always, her attendants let her have her way. They settled on a mossy bank beside a tinkling stream and soon fell fast asleep.
        - id: ch02-b11
          speaker: narrator
          text: Ingibjorg was delighted that they were no longer watching her. She wandered deeper and deeper among the trees. At every turn, she expected to find fairies dancing in a ring or little brown elves peeking from behind a trunk. She saw none of them. Instead, a horrible giant stepped out of his cave and ordered her to follow him.
        - id: ch02-b12
          speaker: narrator
          text: He was so huge and ugly that the princess was terribly afraid. Now she wished she had stayed close enough to call for help. But she knew there was no use refusing him, so she walked meekly behind.
        - id: ch02-b13
          speaker: narrator
          text: They traveled a long way. Ingibjorg grew exhausted, and at last she began to cry. The giant turned around.
        - id: ch02-b14
          speaker: giant
          text: I can't stand girls who make such horrible noises. But if you want to cry, I'll give you a reason.
        - id: ch02-b15
          speaker: narrator
          text: He pulled an axe from his belt and cut off both her feet. Then he picked them up, put them in his pocket, and went away.
        - id: ch02-b16
          speaker: narrator
          text: Poor Ingibjorg lay in the grass in dreadful pain. No one knew where to look for her. Would she remain there until she died? She had no idea how many hours had passed since morning. To her, it felt like years. Yet the sun was still high when she heard wheels approaching through the forest.
        - id: ch02-b17
          speaker: narrator
          text: Her throat was dry with fear and pain, but with a great effort, she shouted.
        - id: ch02-b18
          speaker: kisa
          text: I'm coming!
        - id: ch02-b19
          speaker: narrator
          text: A cart came between the trees. Kisa was driving, and she flicked her tail like a whip to make the horse hurry. The moment she saw Ingibjorg, she jumped down. With her two front paws, she carefully lifted the girl onto a bed of soft hay. Then she drove her home to a little hut in the forest.
    - id: ch03
      title: Kisa at the Giant's Cave
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: A heap of cushions stood in one corner of Kisa's room. She arranged them into a bed. Ingibjorg was close to fainting after all she had suffered. She eagerly drank some milk, then sank back while Kisa took dried herbs from a cupboard. The cat soaked the herbs in warm water and tied them around the bleeding legs. At once, the pain disappeared, and Ingibjorg looked up at Kisa with a smile.
        - id: ch03-b02
          speaker: kisa
          text: Go to sleep now. You won't mind if I leave you for a little while. I'll lock the door, so no one can hurt you.
          emotion: calm
        - id: ch03-b03
          speaker: narrator
          text: Before Kisa had finished speaking, the princess was asleep. Kisa climbed into the cart outside, gathered the reins, and drove straight to the giant's cave.
        - id: ch03-b04
          speaker: narrator
          text: She left the cart hidden behind some trees and crept softly toward the open door. Crouching low, she listened. Inside the cave, the giant was eating supper with his wife and telling her what he meant to do.
        - id: ch03-b05
          speaker: giant
          text: As soon as I have a day to spare, I'll go back and kill that girl. I can't let everyone in the forest think a mere girl can defy me!
        - id: ch03-b06
          speaker: narrator
          text: The giant and his wife began calling Ingibjorg every sort of name for behaving so badly. They were far too busy to notice Kisa slip into a dark corner. There she tipped an entire bag of salt into the huge pot over the fire.
        - id: ch03-b07
          speaker: giant
          text: Dear me, I'm terribly thirsty!
        - id: ch03-b08
          speaker: giant_wife
          text: So am I. I wish I hadn't swallowed that last spoonful of broth. There must have been something wrong with it.
        - id: ch03-b09
          speaker: giant
          text: If I don't get water, I'll die!
        - id: ch03-b10
          speaker: narrator
          text: He rushed out of the cave, and his wife ran after him. Together they hurried down the path to the river.
        - id: ch03-b11
          speaker: narrator
          text: Kisa went inside at once. She searched every hole until she found a patch of grass. Ingibjorg's feet were hidden beneath it. Kisa put them in her cart and drove quickly back to her hut.
        - id: ch03-b12
          speaker: narrator
          text: Ingibjorg was deeply thankful to hear her return. She had awakened and was too frightened to sleep again. Every little noise had made her tremble. Kisa turned the key in the lock.
        - id: ch03-b13
          speaker: ingibjorg
          text: Oh, is that you?
          emotion: happy
        - id: ch03-b14
          speaker: narrator
          text: Kisa came inside holding up two neat little feet, still wearing their silver slippers.
        - id: ch03-b15
          speaker: kisa
          text: In two minutes, they'll be joined as firmly as ever!
        - id: ch03-b16
          speaker: narrator
          text: Some strands of the giant's magic grass were still clinging to the feet. Kisa took them and bound the feet onto Ingibjorg's legs.
        - id: ch03-b17
          speaker: kisa
          text: Of course, you won't be able to walk for a while. You mustn't expect that. But if you're very good, I may be able to carry you home in about a week.
        - id: ch03-b18
          speaker: narrator
          text: And that was exactly what she did.
    - id: ch04
      title: Home from the Forest
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: A week later, Kisa drove her cart up to the palace gate, lashing the horse fiercely with her tail. The king and queen saw their lost daughter sitting beside the cat. They declared that no reward could ever be too great for the person who had rescued Ingibjorg from the giant.
        - id: ch04-b02
          speaker: kisa
          text: We can talk about my reward another time.
        - id: ch04-b03
          speaker: narrator
          text: Kisa made her finest bow, turned the horse around, and left.
        - id: ch04-b04
          speaker: narrator
          text: Ingibjorg was miserable that Kisa had gone without even saying farewell. She refused food and drink. She would not look at any of the beautiful dresses her parents bought for her. At last, the king and queen whispered together.
        - id: ch04-b05
          speaker: queen
          text: If we can't make her laugh, she will die. Is there anything left that we haven't tried?
        - id: ch04-b06
          speaker: king
          text: Only marriage.
        - id: ch04-b07
          speaker: narrator
          text: So the king invited every handsome young man he could think of to the palace. He told the princess to choose one of them for her husband.
        - id: ch04-b08
          speaker: narrator
          text: Ingibjorg took some time to decide whom she liked best. At last, she chose a young prince with eyes like pools in the forest and hair of shining gold. Her parents were very pleased. He was the son of a neighboring king, and they ordered a splendid wedding feast.
    - id: ch05
      title: Kisa's Reward
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: When the marriage ceremony was over, Kisa suddenly appeared before them. Ingibjorg rushed to her and wrapped her arms around the cat.
        - id: ch05-b02
          speaker: kisa
          text: I've come to ask for my reward. Let me sleep at the foot of your bed tonight.
        - id: ch05-b03
          speaker: ingibjorg
          text: Is that all you want?
          emotion: surprised
        - id: ch05-b04
          speaker: narrator
          text: Ingibjorg was disappointed that Kisa had asked for so little.
        - id: ch05-b05
          speaker: kisa
          text: It is enough.
        - id: ch05-b06
          speaker: narrator
          text: Morning came. The creature lying on the bed was no longer a cat. In Kisa's place was a beautiful princess.
        - id: ch05-b07
          speaker: kisa
          text: A spiteful fairy enchanted my mother and me. We could not free ourselves until we had done a kind deed that had never been done before. My mother died without finding the chance to do anything new. But the giant's cruel act gave me my chance, and I used it to make you whole again.
        - id: ch05-b08
          speaker: narrator
          text: Everyone was more delighted than ever. Kisa lived at the royal court until she also married. Then she went away to govern a kingdom of her own.
