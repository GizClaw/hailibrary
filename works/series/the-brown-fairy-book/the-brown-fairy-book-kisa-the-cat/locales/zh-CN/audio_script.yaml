audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 温暖庄重，以从容而清晰的语气讲述古老命运故事, timbre: 清澈浑厚, pace: 舒缓, pitch: 中音}
    queen:
      display_name: 王后
      tts: {delivery: 高贵温柔，忧愁时依然克制, timbre: 柔和明净, pace: 适中, pitch: 中音}
    kisa:
      display_name: 基萨
      tts: {delivery: 聪慧果断，亲切中带着沉着自信, timbre: 清亮柔韧, pace: 适中, pitch: 中高音}
    ingibjorg:
      display_name: 英吉比约格
      tts: {delivery: 从天真好奇渐转为真挚坚定，情绪自然鲜明, timbre: 清澈年轻, pace: 适中, pitch: 中高音}
    giant:
      display_name: 巨人
      tts: {delivery: 粗暴蛮横，自负而缺少耐心, timbre: 粗粝低沉, pace: 稍慢, pitch: 低音}
    giant_wife:
      display_name: 巨人的妻子
      tts: {delivery: 粗声直率，抱怨时毫不掩饰, timbre: 厚重沙哑, pace: 适中, pitch: 中低音}
    parent_voice:
      display_name: 王室亲长
      tts: {delivery: 压低声音，忧心忡忡而谨慎, timbre: 成熟温和, pace: 稍慢, pitch: 中音}
    king:
      display_name: 国王
      tts: {delivery: 威严稳重，作决定时简洁果断, timbre: 浑厚清晰, pace: 适中, pitch: 中低音}
  chapters:
    - id: ch01
      title: 烟灰色的猫
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，有一位王后，养着一只烟灰色的美丽母猫。它长着瓷蓝色的眼睛，王后十分疼爱它。王后走到哪里，它就跟到哪里。就连王后乘着华丽的玻璃马车出游，它也会神气地坐在她身旁。母猫还有一只跟自己一模一样的小猫。
        - id: ch01-b02
          speaker: queen
          text: 猫咪，你可比我幸福。你有这么可爱的孩子，我却只有你陪着我玩。
          emotion: sad
        - id: ch01-b03
          speaker: kisa
          text: 别哭，哭也没有用。我去想想能有什么办法。
          emotion: calm
        - id: ch01-b04
          speaker: narrator
          text: >-
            母猫把爪子搭在王后的手臂上，而且真的履行了承诺。马车一回来，它就小跑进森林，向住在那里的仙女求助。没过多久，王后有了一个小女儿。那孩子好像由冰雪和阳光一起塑成，王后欢喜极了。小婴儿渐渐会留意屋里蹦来跳去的小猫。到了晚上，只有小猫蜷在身边，她才肯安静入睡。
        - id: ch01-b05
          speaker: narrator
          text: >-
            两三个月过去，婴儿依旧很小，小猫却快长成大猫了。一天傍晚，保姆像往常一样来抱它进婴儿床，却怎么也找不到它。仆人们都盼着得到王后的赏赐，把王宫翻了个遍。他们打开连猫爪都装不下的盒子，把书一本本搬离书架，怕小猫躲在后面，又逐个拉开抽屉，怕它被关在里头。可这些全没有用。小猫确实跑了，谁也不知道它还愿不愿意回来。
        - id: ch01-b06
          speaker: narrator
          text: >-
            许多年以后，公主英吉比约格在花园里玩球。有一天，她把球扔得比平时远，球落进了一丛玫瑰。她马上追过去，弯腰在深草里摸索，忽然听见有人一遍遍叫自己的名字。
        - id: ch01-b07
          speaker: kisa
          text: 英吉比约格！你忘记我了吗？我是基萨，是你的姐姐呀！
        - id: ch01-b08
          speaker: ingibjorg
          text: 可是，我从来没有过姐姐呀。
          emotion: surprised
        - id: ch01-b09
          speaker: kisa
          text: >-
            你不记得了吗？小时候我总睡在你的小床里，陪在你身边。你一哭起来，非得等我来了才肯停。女孩子真没有记性！只要让我进了王宫，我现在就能径直找到那张小床。
        - id: ch01-b10
          speaker: ingibjorg
          text: 那你为什么要离开呢？
        - id: ch01-b11
          speaker: narrator
          text: >-
            基萨还没来得及回答，侍女们已经气喘吁吁地追到了玫瑰丛旁。她们看见这只陌生的猫，吓得魂不附体。基萨只得钻进灌木，回森林去了。英吉比约格怪侍女们吓跑了儿时的伙伴，心里非常生气。到了晚上，她把这次相遇告诉了前来道晚安的王后。
        - id: ch01-b12
          speaker: queen
          text: >-
            基萨说的都是真的。我也想再见见它。也许它还会回来，到时候你一定要带它来见我。
    - id: ch02
      title: 森林里的巨人
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            第二天十分炎热，公主一定要去凉爽的森林玩。高大的树木投下浓荫，那里总比别处清凉。侍女们照旧由着她，在溪边长满青苔的坡岸上坐下，很快全睡着了。公主见她们不会留心自己，高高兴兴地独自往前走。她一路盼着遇见围圈跳舞的仙女，或是躲在树后探头张望的棕色小精灵。可她一个也没见到。从洞里出来的，是一个高大丑陋的巨人。巨人命令她跟上。她害怕极了，也后悔没有待在能呼救的地方，可眼下无法反抗，只好温顺地走在后面。
        - id: ch02-b02
          speaker: narrator
          text: 他们走了很远。英吉比约格累极了，终于哭了起来。巨人转身瞪着她。
        - id: ch02-b03
          speaker: giant
          text: >-
            我最讨厌女孩子哭出这种难听的声音。你既然非哭不可，我就给你一个真正值得哭的理由。
          emotion: angry
        - id: ch02-b04
          speaker: narrator
          text: >-
            巨人从腰间拔出斧头，砍下她的两只脚。他把脚捡起来塞进口袋，丢下公主独自走了。可怜的英吉比约格疼得躺在草地上。没有人知道该到哪里找她，她不知道自己是否会一直躺在这里，直到死去。她已经分不清从早晨出发以后究竟过了多久，只觉得仿佛过了好几年。其实太阳仍高高挂在天上。这时，远处传来车轮声。她的喉咙因恐惧和疼痛干得发紧，还是拼尽力气喊了出去。
        - id: ch02-b05
          speaker: kisa
          text: 我来了！
        - id: ch02-b06
          speaker: narrator
          text: >-
            一辆马车穿过树林，基萨正在车上挥动尾巴，把它当鞭子催马快跑。它一见倒在地上的公主，立刻跳下车，用两只前爪小心抱起她，放到柔软的干草上，又赶车回到自己的小屋。基萨把屋角那一摞垫子铺成床。英吉比约格经历了这一切，已经快昏过去了。她大口喝下牛奶，虚弱地躺回垫子上。基萨从橱柜里拿出几味干草药，用温水泡软，绑在她流血的腿上。疼痛马上消失，公主抬头对它笑了。
        - id: ch02-b07
          speaker: kisa
          text: >-
            现在睡一会儿吧。我得离开一小会儿，你不用担心。我会锁好门，谁也进不来伤害你。
          emotion: calm
        - id: ch02-b08
          speaker: narrator
          text: >-
            话还没说完，公主就睡着了。基萨登上停在门外的马车，抄起缰绳，直奔巨人的洞穴。它把车藏在几棵树后，轻手轻脚地爬到敞开的洞门边。基萨伏低身子，听着巨人和一同吃晚饭的妻子讲话。
        - id: ch02-b09
          speaker: giant
          text: >-
            等我哪天有空，就回去杀掉她。要是森林里的人知道一个小丫头也敢反抗我，我的脸往哪儿放！
          emotion: angry
        - id: ch02-b10
          speaker: narrator
          text: >-
            夫妻俩忙着给英吉比约格扣上种种恶名，只顾责骂她不懂规矩。他们谁也没有看见基萨溜进阴暗的角落，把一整袋盐全倒进火前的大锅。过了一会儿，巨人渴得大叫起来。
        - id: ch02-b11
          speaker: giant
          text: 哎呀，我怎么这么渴！
          emotion: surprised
        - id: ch02-b12
          speaker: giant_wife
          text: 我也渴得厉害。真不该喝最后那勺汤，汤里一定不对劲。
        - id: ch02-b13
          speaker: giant
          text: 再喝不到水，我就要渴死了！
        - id: ch02-b14
          speaker: narrator
          text: >-
            巨人冲出洞穴，妻子紧跟在后面，两人沿着小路一路跑向河边。基萨马上进洞，一刻也不耽搁，搜遍每个角落。它终于发现一堆草，公主的双脚就藏在下面。基萨把两只脚放进马车，赶回自己的小屋。
    - id: ch03
      title: 基萨的营救
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            英吉比约格其实一直没能睡着。她独自躺在那里，怕得听见一点声音就浑身发抖。门锁一响，她认出了回来的基萨。
        - id: ch03-b02
          speaker: ingibjorg
          text: 啊，是你回来了吗？
          emotion: happy
        - id: ch03-b03
          speaker: narrator
          text: 基萨走进来，举着那双小巧的脚，银拖鞋还好好穿在上面。
        - id: ch03-b04
          speaker: kisa
          text: 不用两分钟，它们就会跟从前一样牢牢长好。
        - id: ch03-b05
          speaker: narrator
          text: >-
            巨人曾经随手把一些魔草堆在双脚上。基萨从中抽出几根，把两只脚仔细绑回公主腿上。
        - id: ch03-b06
          speaker: kisa
          text: >-
            你当然不能马上走路，可别急着试。只要好好养着，也许一个星期以后，我就能送你回家。
        - id: ch03-b07
          speaker: narrator
          text: >-
            一个星期后，公主已经可以回家了。基萨果然驾着马车来到王宫。它用尾巴使劲抽着马，失踪的公主就坐在身旁。国王和王后见女儿平安归来，激动地宣称，基萨把公主从巨人手里救了出来，不管给这位救命恩人什么奖赏，都不算太多。
        - id: ch03-b08
          speaker: kisa
          text: 奖赏的事，以后再谈吧。
        - id: ch03-b09
          speaker: narrator
          text: >-
            基萨行了一个最漂亮的鞠躬礼，调转马头离开了，甚至没向公主告别。英吉比约格难过极了。她不肯吃，也不肯喝。父母给她买来一件又一件漂亮衣裳，她连看也不看一眼。
        - id: ch03-b10
          speaker: parent_voice
          text: >-
            再不能让她笑起来，她就会死。世上还有什么办法，是我们没有试过的呢？
          emotion: sad
        - id: ch03-b11
          speaker: king
          text: 只剩下让她结婚了。
        - id: ch03-b12
          speaker: narrator
          text: >-
            国王把能想到的英俊青年全请进王宫，让女儿从中挑选丈夫。英吉比约格花了好一阵，才决定自己最中意谁。她最后选中一位年轻王子。他的双眼像森林里的水潭，头发像明亮的黄金。王子正是邻国国王的儿子，国王和王后十分满意，立刻下令准备一场盛大的宴席。
    - id: ch04
      title: 前所未有的善事
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            盛大的婚礼终于结束了。就在国王、王后和新人都在一起时，基萨忽然出现在众人面前。英吉比约格一看见它，马上飞奔过去，把它紧紧抱进怀里。
        - id: ch04-b02
          speaker: kisa
          text: 我来领取自己的奖赏。今天晚上，让我睡在你的床脚吧。
        - id: ch04-b03
          speaker: ingibjorg
          text: 就只要这个吗？
          emotion: surprised
        - id: ch04-b04
          speaker: kisa
          text: 这就足够了。
        - id: ch04-b05
          speaker: narrator
          text: >-
            基萨就在床脚睡了一夜。第二天晨光初现，床上躺着的已经不是猫，而是一位美丽的公主。
        - id: ch04-b06
          speaker: kisa
          text: >-
            我和母亲都中了一个恶毒仙女的魔法。除非做出一件前所未有的善事，否则我们谁也不能恢复原样。母亲一直没有找到机会，没能做成一件从来没人做过的好事，最后带着魔法去世了。巨人对你做下恶事，我却借着他的恶行，让你重新变得跟从前一样完好。
        - id: ch04-b07
          speaker: narrator
          text: >-
            听完这些，大家比先前更加欢喜。猫公主一直留在宫廷里生活。后来，她也结了婚，这才离开王宫，到属于自己的国家去治理百姓。
