audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 温暖庄重，以从容而清晰的语气讲述古老命运故事, timbre: 清澈浑厚, pace: 舒缓, pitch: 中音}
    rubezahl:
      display_name: 吕贝察尔
      tts: {delivery: 古老而多变，殷勤时温柔热切，受挫时显出精灵的急躁与威严, timbre: 深沉醇厚, pace: 适中, pitch: 中低音}
    princess:
      display_name: 公主
      tts: {delivery: 聪慧敏锐，真情自然明亮，周旋时克制而机警, timbre: 年轻清亮, pace: 适中, pitch: 中高音}
    ratibor:
      display_name: 拉蒂博尔
      tts: {delivery: 深情坦率，悲伤时低沉，重获希望后果断坚定, timbre: 年轻浑厚, pace: 适中, pitch: 中音}
    magpie:
      display_name: 喜鹊
      tts: {delivery: 伶俐急促，带着鸟儿停不下来的清脆节奏, timbre: 清脆明亮, pace: 稍快, pitch: 高音}
  chapters:
    - id: ch01
      title: 山地精灵与人类
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            山地精灵吕贝察尔统治着无边无际的地下世界。单是照管这片领地，就够他忙个不停。数不清的宝库等着他巡查，大群地精等着他督促。有的筑起坚固堤坝，拦住地心奔流的火河。有的驱使滚烫的蒸气，把灰暗石头炼成贵重金属。还有的把钻石和红宝石填进每一道岩缝。吕贝察尔喜爱一切美丽的东西，偶尔心血来潮，也会离开阴沉的地底，到绿色的大地上住一阵，晒晒太阳，听听鸟鸣。
        - id: ch01-b02
          speaker: narrator
          text: >-
            地精能活几百年，所以他见过许多奇景。第一次来到地面时，一层层山上覆盖着密林，野兽在林中出没。他看熊和野牛凶猛搏斗，也追逐灰狼。兴致来了，他还把巨石滚下荒凉山谷，听那雷鸣般的坠落声在群山间回荡。可他下一次冒险上来时，一切竟然都变了。黑压压的森林已经被砍去，原地有了开花的果园，围着一幢幢舒适茅屋。每家烟囱都升起青烟，静静卷入空中。牛羊在鲜花遍地的草场吃草，篱笆树荫下传来牧羊人的笛声。
        - id: ch01-b03
          speaker: narrator
          text: >-
            吕贝察尔看得心花怒放，觉得这幅景象又新鲜又可爱，一点也不怨恨这些不请自来的客人。他们连一句“借过”都没说，便在他的山上安了家，好像天生就该住在这里。他任由他们安居，从不惊扰，就像宽厚的屋主不会赶走屋檐下筑巢的燕子。他还想和这种叫作“人”的生灵交朋友，于是变成老农工，到一户农家帮忙。经他照料，田里的庄稼样样都长得极好，可主人挥霍无度，也不懂感激。
        - id: ch01-b04
          speaker: narrator
          text: >-
            他很快离开农夫，又去替邻居放羊。他把羊群照料得十分用心，知道哪里有最鲜嫩的牧草，也知道该去山中何处寻找走失的羊。羊群在他手里越来越兴旺，没有一只走丢，也没有一只被狼撕碎。偏偏这位新主人心肠冷酷，连吕贝察尔应得的工钱也舍不得给。吕贝察尔只得逃走，转去侍奉一位法官。
        - id: ch01-b05
          speaker: narrator
          text: >-
            他在那里竭尽全力维护法律，盗贼和恶徒没有一个不怕他。法官本人却收受贿赂，轻蔑法律，实在是个坏人。吕贝察尔不愿做不义之人的工具，便当着主人的面把话说明。法官立刻叫人把他关进监狱。可这哪里困得住地精？他索性从锁孔钻了出去，回到地下宫殿。第一次和人类打交道，令他失望透顶。只是时间一久，他渐渐忘了那些不快，又想去地面世界看一看。
    - id: ch02
      title: 魔法水池
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            吕贝察尔悄悄溜进山谷，一路小心藏在矮树丛和篱笆后面。不久，他遇见了一桩奇事。透过枝叶，他看见前方有片绿茵茵的草地。那里站着一位少女，美丽而年轻，像明媚的春日。她的女伴们躺在四周，看样子刚玩过一场快活的游戏，正在草地上休息。她们身后有条小溪，瀑布从高高的岩石跃入水中，悦耳的水声洒满四周，给酷热的正午送来凉意。
        - id: ch02-b02
          speaker: narrator
          text: >-
            吕贝察尔一见少女就满心欢喜，生平第一次希望自己是个凡人。为了看清姑娘们，他变成乌鸦，落在溪边伸向水面的橡树上。谁知有了乌鸦的眼睛，也就有了乌鸦的心。树根下一窝田鼠，反倒比姑娘们更吸引他。他赶紧飞回灌木丛，变成英俊青年。这一次，他当场爱上了少女。
        - id: ch02-b03
          speaker: narrator
          text: >-
            少女正是本国国王的女儿。她常和女伴到森林里采花摘果，到了炎热的正午，就去溪边的阴凉草地歇息、戏水。那天上午，她们又进了森林。机会来了。吕贝察尔走到草地中央，念起魔咒。等姑娘们中午回来，眼前的景色让她们惊得以为是在做梦。红岩变成洁白的大理石和雪花石，撞击乱石的溪水安静地流进光滑水道。清泉向上喷起，再像钻石一样随风洒落。
        - id: ch02-b04
          speaker: narrator
          text: >-
            水边铺满雏菊和勿忘我，高高的玫瑰与茉莉围住四周，编成世上最香甜、最精美的凉亭。瀑布两旁各敞开一座奇妙洞穴，洞壁和拱顶闪着五彩岩晶的光。每个壁龛都放着稀奇的果子和糖果，公主只看一眼就想尝尝。可她迟疑了好一阵，简直不敢相信自己的眼睛。她不知道该走进魔境，还是赶快逃开。最后，好奇心赢了。姑娘们尽情寻找每一处奇景，把所有东西看了一遍，也尝了一遍。她们乐不可支地来回奔跑，笑着彼此呼唤。
        - id: ch02-b05
          speaker: narrator
          text: >-
            玩到精疲力尽时，公主忽然喊起来，说她别的都不要，偏要去大理石水池洗澡。那池水的确诱人，大家便欢欢喜喜地开始这个新游戏。公主最先准备好，可她刚滑过池边，身子就向下沉去，向下，再向下，一直沉向深处。惊恐的女伴们连她浮在水上的一缕金发都没来得及抓住，她已经消失在深水里。
        - id: ch02-b06
          speaker: narrator
          text: >-
            女伴们吓得放声哭喊，绕着池边不停奔跑。水看起来明明又浅又清，却当着她们的面吞掉了公主。她们甚至一个个纵身跳进池里，试着潜到水下寻找，可所有努力都没有用。在这座魔法水池中，人人都像软木塞一样浮在水面，哪怕一瞬间也沉不下去。
        - id: ch02-b07
          speaker: narrator
          text: >-
            姑娘们最后明白，除了回宫把爱女失踪的噩耗告诉国王，已经没有别的办法。可怕的消息一传进宫里，哭声立刻震天，人人都在悲叹。国王撕破衣袍，把金冠从头上扔出去，又把脸埋进紫色斗篷，为女儿悲痛不已。放声哭过以后，他还是振作起来，盼着这一切也许终究只是弄错了，便急忙亲自赶去察看。可姑娘们说的璀璨洞穴已经消失，大理石水池和茉莉花亭也全都不见，那里只有从前那片杂乱缠绕的花草。
        - id: ch02-b08
          speaker: narrator
          text: >-
            国王又困惑又愤怒，用各种刑罚威胁女伴，要她们老实说出公主究竟怎么失踪。可无论怎样追问，她们都只能一遍遍讲述同样的经过。没过多久，国王终于认定，这一切必定是某个小精灵或小鬼在作怪。他下令举行一场盛大的狩猎，借此排遣失去女儿的悲伤。因为国王们不管遇上什么烦心事，总是忍受不了太久。
        - id: ch02-b09
          speaker: narrator
          text: 与此同时，公主待在精灵恋人的宫殿里，日子倒还不算太难过。
    - id: ch03
      title: 根菜变成的伴侣
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            水仙女早已藏在池中等候。她们抓住公主，把她拖离女伴的视线时，公主还没来得及害怕。她们飞快游过奇异的地下通道，把公主带进一座华丽得难以想象的宫殿。和这里相比，她父亲的王宫简直像穷人的茶屋。
        - id: ch03-b02
          speaker: narrator
          text: >-
            公主回过神时，已经坐在长榻上，身上穿着美妙的缎子长袍，腰间系着丝带。一位青年跪在旁边，对她低声说着世上最甜蜜的情话。他正是吕贝察尔。地精把自己的身份和庞大的地下王国一一告诉她，又领她穿过一间又一间屋子、一座又一座大厅，观看陈列其中的稀世珍宝。那种铺张的奇辉异彩一齐映入眼中，看得公主头晕目眩。
        - id: ch03-b03
          speaker: narrator
          text: >-
            宫殿三面都被可爱的花园围绕。鲜艳芬芳的花朵开得到处都是，丝绒般的草坪阴凉青翠，让公主看着十分舒心。果树枝头挂着金色和红色的苹果，每丛树枝里都有夜莺歌唱。吕贝察尔陪公主走过树叶掩映的小径，一会儿望着月亮，一会儿停下脚步，摘下最珍稀的花朵给她佩戴。他心里始终想着，自己活了几百年，从没见过这样迷人的少女。
        - id: ch03-b04
          speaker: narrator
          text: >-
            公主心里却没有半点喜悦。身边尽管有种种魔法奇景，她还是整日郁郁寡欢。她只因害怕激怒地精，才努力装出心满意足的样子。吕贝察尔很快看出她不快乐，想了成百上千种办法赶走那片阴云，却毫无用处。他最后暗自猜想，人类像蜜蜂和蚂蚁一样，是喜欢结伴的生灵。这个可爱的凡人一定是没有同伴，才会如此难过。可他该找谁陪她说话呢？
        - id: ch03-b05
          speaker: narrator
          text: >-
            他赶到最近的田里，挖出十来根胡萝卜、芜菁和小萝卜，仔细装进一只精美的篮子，送到公主面前。那时，公主正满怀心事地坐在玫瑰凉亭下。
        - id: ch03-b06
          speaker: rubezahl
          text: >-
            世上最美的姑娘，别再伤心了。从今往后，你在我家里不会再孤单。这篮东西能变出这里缺少的一切。拿着这根彩色魔杖，轻轻点一下，每根菜都会变成你想见的模样。
        - id: ch03-b07
          speaker: narrator
          text: >-
            说完，他便离开了。公主一刻也不耽搁，马上打开篮子，用魔杖轻轻点向一只芜菁，急切地呼唤自己最亲爱的女伴。
        - id: ch03-b08
          speaker: princess
          text: 布伦希尔德，我亲爱的布伦希尔德，快来我身边！
          emotion: happy
        - id: ch03-b09
          speaker: narrator
          text: >-
            布伦希尔德果然站在眼前，欢喜地拥抱、亲吻公主，还像从前一样快活地说个不停。公主几乎不敢相信好友真的回来了。两人手挽手走遍魔法花园，从树上摘下金苹果，又参观宫殿里所有奇妙的房间，最后来到存放华服珠宝的屋子。这些全是地精送给未来新娘的礼物。
        - id: ch03-b10
          speaker: narrator
          text: >-
            她们在那里找到了数不清的乐趣。面纱、腰带、项链，一件件试过，一件件赞叹。时光过得飞快，仿佛一个小时只有一分钟。这个假布伦希尔德举止得体，眼光又好得出奇，谁能想到她原本只是一只芜菁？吕贝察尔一直躲在暗处观察，自以为已经看透女人的心思，得意极了。在他眼里，公主也比从前更加迷人。
        - id: ch03-b11
          speaker: narrator
          text: >-
            公主又用魔杖点过其余根菜，很快，所有女伴都来到了身边。篮子里还剩两根小樱桃萝卜，她就把它们变成自己最宠爱的猫和小狗贝尼。从此，城堡里充满欢乐。公主给每位女伴安排差事，她们把她照料得无微不至。整整一星期，大家从早到晚一起唱歌、跳舞、玩耍，公主安心享受着有人陪伴的快乐。
        - id: ch03-b12
          speaker: narrator
          text: >-
            可公主渐渐发现，女伴们鲜嫩年轻的面孔一天比一天苍白憔悴。大理石厅的镜子清楚地告诉她，只有自己依旧双颊红润，布伦希尔德她们却正在眼前枯萎。她们一再保证自己一切都好，身子却不断衰弱，一天比一天难以陪公主游戏。终于，在一个阳光明媚的早晨，公主从床上一跃而起，急着去和快活的女伴相聚，眼前的景象却吓得她浑身发抖，连连后退。
        - id: ch03-b13
          speaker: narrator
          text: >-
            一群干瘪老妇聚在那里。她们弓腰驼背，四肢颤抖，只有拄着手杖和拐杖，才能一步步蹒跚而行，嘴里还发出凄惨的咳嗽声。靠近壁炉的地方，原本活蹦乱跳的贝尼僵直地伸着四条腿，那只光滑圆润的猫也虚弱得连头都抬不起来。公主吓得魂飞魄散，连忙逃到门口，避开这群悲惨的伙伴，再放声呼唤吕贝察尔。地精立刻出现，满脸殷勤，谦恭地等她吩咐。
        - id: ch03-b14
          speaker: princess
          text: >-
            你这个恶毒的妖精！我孤苦无依的时候，她们给了我最大的快乐，你为什么连她们也容不下？难道让我独自在荒野生活还不够，你还非得把城堡变成满是病弱老人的地方吗？立刻让她们恢复青春和健康，否则我永远不会爱你！
          emotion: angry
        - id: ch03-b15
          speaker: rubezahl
          text: >-
            最甜美、最美丽的姑娘，请别生气。只要我做得到，什么都愿意为你做，可这件事实在办不到。根菜里的汁液鲜活时，魔杖才能让它们保持你想要的模样。汁液一干，它们也会枯萎。不过别担心，再拿一篮新鲜芜菁来，一切就会恢复。花园那片绿油油的菜地，会给你更有活力的伙伴。
        - id: ch03-b16
          speaker: narrator
          text: >-
            地精说完便走了。公主用魔杖点过那些满脸皱纹的老妇，她们立刻显出真正模样，变回一根根枯萎的菜，只等着被扔上垃圾堆。公主轻快地跳过草地，去找那只刚装满的篮子，可四处都不见踪影。她在花园里来来回回地寻找，窥看每个角落，却连篮子的影子也没看到。最后，她在葡萄架旁遇见吕贝察尔。两人还隔得很远，她已经从他的样子看出了窘迫和慌乱。
        - id: ch03-b17
          speaker: princess
          text: 你是在耍我吗？你把篮子藏到哪里去了？我至少找了一个小时！
          emotion: angry
        - id: ch03-b18
          speaker: rubezahl
          text: >-
            我心中的王后，请原谅我的粗心。我答应了自己办不到的事。我走遍国土去找根菜，可它们早已收完，正在发霉的地窖里变干。山谷上方正是冬天，田野里什么也不长。只有你身边留着春天，你走到哪里，鲜花就开到哪里。请再等一等，到时候，你一定能拿到陪你玩耍的娃娃。
        - id: ch03-b19
          speaker: narrator
          text: >-
            话还没说完，失望的公主已经昂首转身，回自己的房间去了，连一句回答也不肯给他。
    - id: ch04
      title: 飞向拉蒂博尔的口信
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            吕贝察尔赶紧动身去地面。他扮成农夫，在最近的集镇买下一头驴，让驴驮着几袋芜菁、胡萝卜和小萝卜种子，一同回到地下。他把种子播满一大片田，派出浩浩荡荡的小鬼日夜守护、料理，又命他们把地心的火河引到种子附近，给刚冒出的嫩芽送去温暖，帮助它们生长。庄稼得到这样的照料，长势惊人，眼看就会带来一场好收成。
        - id: ch04-b02
          speaker: narrator
          text: >-
            公主每天都在田边徘徊。魔法花园里再美的花果，也比不上这些根菜讨她喜欢，可她依然满眼不快。她常去阴凉的杉树林，在溪边坐下，把采来的花投入水中，看着它们漂远。吕贝察尔想尽办法讨她欢心，却始终不懂她为何不肯爱他。他以为公主只是年纪轻、没见过世面。
        - id: ch04-b03
          speaker: narrator
          text: >-
            他猜错了。公主心中早已有了别人。年轻的拉蒂博尔王子统治着与她父亲相邻的土地，也早已赢得她的芳心。两人正盼着婚期到来，新娘却神秘失踪。这个噩耗让拉蒂博尔痛苦万分。日子一天天过去，公主还是音信全无。他离开城堡，不再与人来往，整日在荒野和森林徘徊，对着树木和岩石高声呼唤她的名字。与此同时，公主在华丽的牢笼里暗暗叹息，默默悲伤。她不敢让地精起疑，心中却一直琢磨，该用什么办法逃出囚禁。最后，她终于有了主意。
        - id: ch04-b04
          speaker: narrator
          text: >-
            春天重新统治山谷。根菜靠地火的温暖熬过严冬，如今已经长得很足。吕贝察尔便命令火河退回地底深处原来的地方。公主每天都会拔出几根菜来试一试，一会儿变出这个思念的人，一会儿又变出另一个。她看着他们现身，装作只是拿这件事取乐。其实，她真正谋划的是另一件事。一天，她把一只小芜菁变成蜜蜂，派它去打听恋人的消息。
        - id: ch04-b05
          speaker: princess
          text: >-
            飞吧，亲爱的小蜜蜂，向东去找我心爱的拉蒂博尔。在他耳边嗡嗡地告诉他，我只爱他一个，却被关在山底的地精宫殿里。别漏掉我的任何一句问候，再把他给我的口信带回来。
        - id: ch04-b06
          speaker: narrator
          text: >-
            蜜蜂展开亮晶晶的翅膀飞走了。可它还没飞出公主的视线，一只贪吃的燕子就猛扑过来，把信使当场吞下。公主伤心极了。后来，她又用魔杖变出一只蟋蟀，教它带去同样的消息。
        - id: ch04-b07
          speaker: princess
          text: >-
            跳吧，小蟋蟀，一直跳到拉蒂博尔身边。请你在他耳边唱给他听，我只爱他一个，却被地精关在山底的宫殿里。
        - id: ch04-b08
          speaker: narrator
          text: >-
            蟋蟀快活地跳走，一心想把口信送到。偏偏一只长腿鹳也沿着那条路走来，用长嘴一下夹住了它。蟋蟀还来不及说一个字，就进了鹳的喉咙。两次都失败了，公主仍没有放弃。第三回，她把芜菁变成一只喜鹊。
        - id: ch04-b09
          speaker: princess
          text: >-
            爱说话的鸟儿，从一棵树飞到另一棵树，直到找到我心爱的拉蒂博尔。告诉他，我被囚禁在这里。请他带上马匹和人手，在三天后的今天赶到荆棘谷那座高丘。
        - id: ch04-b10
          speaker: narrator
          text: >-
            喜鹊仔细听完，在树枝间跳了一阵，便振翅远飞。公主焦急地望着，直到它消失在天边。那时，拉蒂博尔仍每天在森林游荡，连明媚的春光也安慰不了他。
        - id: ch04-b11
          speaker: narrator
          text: >-
            一天，王子坐在橡树下思念公主，不时高声呼唤她的名字。他仿佛听见另一个声音回应，立刻跳起来四处寻找，却看不见一个人。他刚觉得是自己听错了，声音又来了。他抬头一看，一只喜鹊正在枝头跳动，而且真的在叫他的名字。
        - id: ch04-b12
          speaker: ratibor
          text: >-
            可怜的多嘴鸟，是谁教你说出这个名字？这名字属于一个不幸的人。他只盼大地裂开，把他和世人对他的记忆一同吞没。
          emotion: sad
        - id: ch04-b13
          speaker: narrator
          text: >-
            王子抓起大石头，正要朝喜鹊砍去，喜鹊忽然叫出了公主的名字。他的手臂一下垂落，整个人僵在原地。
        - id: ch04-b14
          speaker: magpie
          text: >-
            公主只爱拉蒂博尔一个。她被关在山底的地精宫殿里。请带上马匹和人手，在三天后的今天，赶到荆棘谷的高丘！
        - id: ch04-b15
          speaker: narrator
          text: >-
            喜鹊天生爱叽叽喳喳，要是一刻不能说话，就快活不起来。它把公主教的话一遍遍说个不停。拉蒂博尔终于听懂，心中顿时充满欢喜，阴郁和痛苦转眼消失。他急切地向这位受欢迎的信使追问公主的遭遇，可喜鹊只会背这一段，其他什么也不知道。鸟儿很快振翅飞走，王子则急匆匆赶回城堡，召集一队骑兵。无论前方有什么在等待，他都鼓起勇气去面对。
    - id: ch05
      title: 新娘的考验
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            公主机敏地继续逃走的计划。她不再对吕贝察尔冷淡疏远，眼神甚至暗暗鼓励他相信，也许有一天，她会回报他的爱情。地精为这个念头欣喜若狂。第二天太阳刚升起，公主便穿上痴心地精为她准备的奇丽长袍，戴好珠宝，把自己打扮成新娘。她编好金发，在发冠上缀了桃金娘，垂下的面纱上闪着宝石的光。随后，她身披华美礼服，来到宫殿宽阔的露台见吕贝察尔。
        - id: ch05-b02
          speaker: rubezahl
          text: >-
            世上最美丽的姑娘，让我看看你亲爱的眼睛吧。让我从你的目光里知道，你已经不再拒绝我的爱，也愿意让我成为太阳底下最幸福的生灵。
          emotion: happy
        - id: ch05-b03
          speaker: narrator
          text: >-
            他深深鞠躬，结结巴巴地说着，还伸手想掀开面纱。公主却把面纱拢得更紧。
        - id: ch05-b04
          speaker: princess
          text: >-
            你的痴情终于打动了我，我再也不能违背你的心愿。请你相信我，也请让我继续用面纱遮住羞涩和眼泪。
        - id: ch05-b05
          speaker: rubezahl
          text: >-
            我心爱的人，你为什么哭？你的每一滴泪落在我心上，都像一滴熔化的金子。我渴望得到你的爱，却不愿你为我作出牺牲。
          emotion: fearful
        - id: ch05-b06
          speaker: princess
          text: >-
            你误会我的眼泪了。我的心已经回应你的深情，可我还是害怕。妻子不可能永远这样迷人。你永远不会改变，凡人的美貌却会像花一样凋谢。我怎么知道，你将来还会像现在这样爱我呢？
        - id: ch05-b07
          speaker: rubezahl
          text: >-
            那就向我要一个凭证吧，我的甜心。不管你怎样考验我的顺从和耐心，我都会让你知道，我对你的爱永远不变。
        - id: ch05-b08
          speaker: princess
          text: >-
            那就给我一个证明，让我看看你的真心。去草地上把芜菁全都数清。我的婚宴要有宾客，它们还得变成伴娘。你不能骗我，也不能漏掉一只。我要用这件事看看，你对我究竟有多真诚。
        - id: ch05-b09
          speaker: narrator
          text: >-
            地精一刻也舍不得离开美丽的新娘，却没有半点迟疑，立刻服从命令，急匆匆赶到田里。他像蚱蜢一样敏捷地在芜菁间跳来跳去，很快就全部数完。为了保证自己没有弄错，他决定再数一遍。这次得到的数字却变了，气得他恼火不已。他只好数第三遍，谁知新数目和前两次都不一样。其实这也难怪，他满脑子都是公主迷人的模样，还有她刚刚说过的甜蜜话语。
        - id: ch05-b10
          speaker: narrator
          text: >-
            受骗的恋人才消失，公主就开始逃走。她早已在附近藏好一只饱满新鲜的芜菁，现在用魔杖把它变成一匹神采飞扬的骏马，鞍辔一样不少。她跃上马背，飞越山岭和谷地，一路冲到荆棘谷，扑进心爱的拉蒂博尔怀中。
    - id: ch06
      title: 地下故事的结局
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            吕贝察尔还在一遍遍数芜菁，数得腰酸背痛、头昏眼花，连二加二也算不清。不过，田里究竟有多少大大小小的芜菁，他总算有了几分把握。他急忙往回赶，想向心上人证明自己会是多么可爱、多么顺从的丈夫。他心满意足地越过长满苔藓的草地，回到与公主分别的地方，可那里已经没有她了。
        - id: ch06-b02
          speaker: narrator
          text: >-
            他搜遍每片树丛、每条小路，查看每棵树后，也向每一池水中张望，还是一无所获。他又急匆匆冲回宫殿，从一间房奔向另一间房，查看每个孔洞、每处角落，一声接一声地呼唤公主的名字。可空荡荡的大理石厅里只有回声回答。那里听不见人的声音，也听不见半点脚步声。
        - id: ch06-b03
          speaker: narrator
          text: >-
            吕贝察尔终于知道出事了。他甩掉碍事的凡人身体，飞出宫殿，直上云霄。远处，一匹快马正驮着逃走的公主越过他的领地边界，他看得清清楚楚。
        - id: ch06-b04
          speaker: narrator
          text: >-
            地精怒不可遏，把两片巨云猛撞在一起，朝飞驰的少女掷出一道震电。那雷电击碎了矗立千年的岩石屏障，却没能伤到公主。他的愤怒全然没有用处，雷云化成轻柔薄雾，渐渐散得无影无踪。吕贝察尔绝望地乱飞了一阵，对着四面的风哀叹自己不幸的命运，这才悲伤地回到宫殿。
        - id: ch06-b05
          speaker: narrator
          text: >-
            他又一次钻进每个房间，从这里找到那里，一路长吁短叹，悲声哀哭。随后，他走进那座已经对自己失去全部魅力的花园。小路的金色细沙上，还留着公主走过的脚印。他每看见一个，悲伤便重新涌来。四周的一切都变得孤寂、空虚而凄凉。这个被人抛弃的地精终于决定，今后再也不跟人类这种虚伪的生灵来往。
        - id: ch06-b06
          speaker: narrator
          text: >-
            他在地面连踩三脚。整座魔法宫殿和其中的宝藏立刻消失，回到当初被召唤出来的虚无里。吕贝察尔也再次逃进地下王国深处。
        - id: ch06-b07
          speaker: narrator
          text: >-
            这一切发生时，拉蒂博尔正带着自己失而复得的珍宝，急忙奔向安全的地方。他大张旗鼓地胜利归来，把美丽的公主送回父亲身边。两人当场举行婚礼，随后，王子带着新娘回到自己的城堡。
        - id: ch06-b08
          speaker: narrator
          text: >-
            后来，公主和她的儿女都已经去世很久很久了。可每到寒冷漫长的冬夜，村民们还是会像从前那样围坐在一起雕刻木头。就在这样的夜晚，他们一遍遍讲起这段古老故事，讲公主曾被囚禁在地底宫殿里。
