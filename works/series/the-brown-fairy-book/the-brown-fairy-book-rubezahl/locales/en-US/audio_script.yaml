audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, grave, and attentive to wonder
        timbre: clear and resonant
        pace: measured
        pitch: medium
    rubezahl:
      display_name: Rübezahl
      tts:
        delivery: proud, ardent, and quick to strong feeling
        timbre: deep and resonant
        pace: measured
        pitch: medium-low
    princess:
      display_name: Princess
      tts:
        delivery: gentle, loyal, and quietly resolute
        timbre: young and luminous
        pace: measured
        pitch: medium-high
    ratibor:
      display_name: Prince Ratibor
      tts:
        delivery: noble, sorrowful, and wholehearted
        timbre: youthful and clear
        pace: measured
        pitch: medium
  chapters:
    - id: ch01
      title: The Lord Beneath the Mountains
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Far beneath the mountains, Rübezahl ruled a vast underground kingdom. Its care kept him busy from one end of his realm to the other. He had endless treasure chambers to inspect and hosts of working gnomes to keep at their tasks. Some built strong walls to hold back the fiery rivers in the heart of the earth. Others used scalding vapors to turn dull stones into precious metal. Still others labored to fill every crack in the rocks with diamonds and rubies, for Rübezahl loved beautiful things wherever he found them.
        - id: ch01-b02
          speaker: narrator
          text: Now and then, he tired of those gloomy halls. Then he climbed into the green world for a while, warmed himself in the sunshine, and listened to the birds. Gnomes live for many hundreds of years, so strange changes could take place between one visit and the next. The first time he came up, thick forests covered the great hills and wild beasts wandered under the trees. He watched fierce battles between bears and bison. He chased gray wolves through the woods. Sometimes he amused himself by rolling huge rocks into lonely valleys just to hear the thunder of their fall echo from hill to hill.
        - id: ch01-b03
          speaker: narrator
          text: When he next ventured above ground, everything had changed. The dark woods were gone. Flowering orchards surrounded snug cottages with thatched roofs, and blue smoke curled peacefully from every chimney. Sheep and oxen grazed in meadows bright with flowers. From behind the hedges came the music of a shepherd's pipe.
        - id: ch01-b04
          speaker: narrator
          text: Rübezahl was delighted by the strange, pleasant sight. These unexpected guests had settled on his hills without so much as asking leave, but he did not resent them. He let them keep their homes in peace, as a kindly householder leaves swallows nesting beneath his roof. He even wished to make friends with this creature called man.
        - id: ch01-b05
          speaker: narrator
          text: He took the shape of an old farm laborer and hired himself to a farmer. Every crop under his care grew wonderfully, but his master was wasteful and ungrateful. Rübezahl soon left him and became shepherd to a neighboring farmer. He tended the flock faithfully, led the sheep to the sweetest grass, and knew exactly where among the hills to look for any that strayed. The flock prospered under him. Not one sheep was lost, and not one was torn by wolves. Yet this second master was a hardhearted man who begrudged Rübezahl the wages he had honestly earned.
        - id: ch01-b06
          speaker: narrator
          text: So Rübezahl ran away and entered the service of the judge. He defended the law with all his strength and terrified thieves and wrongdoers. But the judge himself took bribes and cared nothing for justice. Rübezahl refused to serve an unjust man and told him so. The judge ordered him thrown into prison.
        - id: ch01-b07
          speaker: narrator
          text: A prison could not hold a mountain gnome. Rübezahl simply slipped out through the keyhole and returned to his palace below the earth, deeply disappointed by his first dealings with mankind. In time, though, the unpleasant memories faded. At last he decided to look at the upper world again.
    - id: ch02
      title: The Enchanted Pool
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Rübezahl crept into the valley and kept himself hidden among bushes and hedges. Before long, he found an adventure. Through a screen of leaves he saw a green lawn, and on it stood a maiden as fresh as spring and lovely to behold. Her young companions rested on the grass after a merry game. Beyond them ran a little brook. A waterfall leaped from a high rock, filling the air with its music and cooling the heat of noon.
        - id: ch02-b02
          speaker: narrator
          text: The maiden pleased him so much that, for the first time, Rübezahl wished he were mortal. To see the company better, he changed himself into a raven and perched in an oak above the brook. That plan failed. He could see only with a raven's eyes and feel only what a raven felt. The field mice nesting below the tree soon interested him far more than the maidens did.
        - id: ch02-b03
          speaker: narrator
          text: As soon as he understood his mistake, he flew into the thicket and became a handsome young man. That was better. He fell in love with the maiden at once. She was the king's daughter, and she often came into the forest with her playfellows to gather wild fruit and flowers. When the midday heat grew strong, they rested on this shady lawn or bathed in the cool water.
        - id: ch02-b04
          speaker: narrator
          text: That morning, the maidens took it into their heads to wander back into the woods. The empty lawn gave Rübezahl his chance. He stepped out of hiding, stood in its center, and wove his spells until everything around him slowly changed. When the maidens returned at noon to their favorite resting place, they stopped in amazement and wondered if they were dreaming. Red rocks had turned to white marble and alabaster. The stream no longer murmured and struggled over stones. It flowed silently through a smooth channel, where a clear fountain rose and fell in showers of diamond drops as the wandering breeze tossed it from side to side.
        - id: ch02-b05
          speaker: narrator
          text: Daisies and forget-me-nots edged the water. High hedges of roses and jasmine circled the whole place and made the loveliest bower anyone could imagine. On the right and left of the waterfall opened a marvelous grotto. Many-colored crystals glittered over its walls and arches. Strange fruits and sweetmeats filled every niche, and the very sight of them made the princess long for a taste. Still, she hesitated for some time. She could scarcely trust her eyes. She did not know whether to enter the enchanted place or turn and run from it.
        - id: ch02-b06
          speaker: narrator
          text: In the end, curiosity won. The princess and her companions entered and explored to their hearts' content. They tasted the strange food, examined every wonder, and ran from place to place in delight, calling merrily to one another. At last, all that activity left them weary. Then the princess suddenly declared that nothing would satisfy her except a bath in the inviting marble pool. The others forgot their tiredness and gladly followed her to this new amusement.
        - id: ch02-b07
          speaker: narrator
          text: The princess was ready first. The moment she slipped over the rim, she sank down, down, down. Before her terrified friends could catch even one strand of her floating golden hair, she vanished into the depths.
        - id: ch02-b08
          speaker: narrator
          text: Her playfellows wept and wailed beside the pool. It looked clear and shallow, yet it had swallowed their princess before their eyes. They jumped in and tried to dive after her. The enchanted water held them up like corks, and none could remain beneath the surface for even a second.
        - id: ch02-b09
          speaker: narrator
          text: At last, they could do nothing but carry the dreadful news to the king. Grief swept through the palace. The king tore his robes, flung his golden crown from his head, and hid his face in his purple mantle. Once his first wild sorrow had passed, he hurried to the forest. Like many grieving people, he still hoped there had been some mistake.
        - id: ch02-b10
          speaker: narrator
          text: But the place had changed again. The glittering grotto, the marble pool, and the jasmine bower were gone. There was only the old tangle of flowers. Bewildered, the king threatened the maidens with punishment unless they confessed what had happened. They could only repeat the same story. He finally blamed a sprite or goblin, then tried to comfort himself by ordering a grand hunt. Kings do not like to remain troubled for long.
    - id: ch03
      title: Companions Made from Roots
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Meanwhile, the princess was not happy in the palace of her elfish lover. Water nymphs had been hiding beneath the pool, ready for her arrival. The instant she sank, they caught her and drew her out of sight of the terrified maidens above. Everything happened so quickly that she had no time to feel afraid. The nymphs swam with her through strange underground passages and brought her at last to a palace so splendid that her father's royal home seemed like a poor cottage beside it.
        - id: ch03-b02
          speaker: narrator
          text: When her astonishment cleared, she found herself sitting on a couch. A marvelous satin robe covered her, fastened with a silken girdle. A handsome young man knelt beside her and whispered the sweetest words in her ear. He was Rübezahl himself. He told her who he was and described his vast kingdom beneath the earth. Then he led her through the palace, room after room and hall after hall, showing her the rare and wonderful things displayed in each one until all that splendor dazzled her.
        - id: ch03-b03
          speaker: narrator
          text: A beautiful garden lay along three sides of the palace. Bright, sweet flowers grew there in masses, and the velvet lawns stayed cool and shady. The princess took pleasure in looking at them. Golden and rosy apples hung from the fruit trees, while nightingales sang from every bush. Rübezahl and the princess wandered along the leafy paths together. Sometimes they gazed at the moon. Sometimes they stopped to gather the rarest flowers for her to wear. All the while, he thought that in the hundreds of years he had lived, he had never seen anyone so charming.
        - id: ch03-b04
          speaker: narrator
          text: The princess felt nothing like his happiness. All the magic around her could not ease her sadness, though she pretended to be content because she feared displeasing him. Rübezahl soon saw the sorrow in her face. He tried a thousand ways to drive it away, and every one failed. At last, he decided that mortals must be sociable, like bees and ants. Surely she was lonely and needed companions.
        - id: ch03-b05
          speaker: narrator
          text: He hurried to the nearest field and dug up a dozen roots, including carrots, turnips, and radishes. He arranged them in an elegant basket and carried it to the princess, who sat thinking beneath a rose arbor.
        - id: ch03-b06
          speaker: rubezahl
          text: Loveliest daughter of the earth, put away your sorrow. You need never be lonely here again. This basket holds all you need to make the palace pleasant. Take this little colored wand. Touch any root with it, and the root will take whatever form you wish to see.
        - id: ch03-b07
          speaker: narrator
          text: Rübezahl left her. The princess opened the basket without a moment's delay, touched a turnip, and called eagerly for her dearest playfellow.
        - id: ch03-b08
          speaker: princess
          text: Brunhilda, dear Brunhilda, please come to me now!
          emotion: happy
        - id: ch03-b09
          speaker: narrator
          text: There stood Brunhilda, hugging and kissing her princess and chattering as gaily as she had in the old days. The princess could hardly believe her eyes. She was beside herself with joy. Hand in hand, they wandered through the enchanted garden and picked golden apples. Then the princess showed her friend every wonderful room in the palace.
        - id: ch03-b10
          speaker: narrator
          text: At last, they entered the chamber where Rübezahl kept all the dresses and ornaments he had given his hoped-for bride. They tried on veils, girdles, and necklaces, admired each one, and found so much to enjoy that hours seemed like minutes. The false Brunhilda behaved with such taste and grace that no one would have guessed she was really a turnip.
        - id: ch03-b11
          speaker: narrator
          text: Rübezahl secretly watched them and congratulated himself on understanding a woman's heart so well. The happy princess seemed lovelier than ever. She touched the other roots with her wand and soon had all her maidens around her. Two tiny radishes remained, so she changed one into her favorite cat and the other into her little dog, Beni.
        - id: ch03-b12
          speaker: narrator
          text: The castle grew cheerful. The princess gave each maiden her own work, and no mistress was ever better served. For a whole week, nothing disturbed the pleasure of their company. They sang, danced, and played from morning until night. Yet the princess noticed that each day the fresh young faces grew paler and thinner. The great mirror in the marble hall showed that she alone kept her rosy color, while Brunhilda and all the others visibly faded. Whenever she asked, they assured her that they were well. Even so, they continued to waste away, and every day it became harder for them to take part in her games.
        - id: ch03-b13
          speaker: narrator
          text: One fine morning, the princess sprang from bed and hurried to meet them. Then she stopped with a shudder. A group of shriveled old women stood before her, their backs bent and their limbs trembling. They leaned on sticks and crutches, coughed miserably, and could scarcely walk. Near the fire lay Beni, once so lively, with all four legs stretched out stiffly. The sleek cat was too weak even to lift its head from its velvet cushion.
        - id: ch03-b14
          speaker: narrator
          text: Horrified, the princess fled to the door and called loudly for Rübezahl. He appeared at once, humble and anxious to obey her.
        - id: ch03-b15
          speaker: princess
          text: Cruel sprite! Why would you take away the playmates who brighten my lonely hours? Is it not bad enough to live alone in this desert? Now you have turned the castle into a home for the ancient and sick. Give my maidens back their youth and health this instant, or I will never love you!
          emotion: angry
        - id: ch03-b16
          speaker: rubezahl
          text: Sweetest and fairest maiden, please do not be angry. I will do everything within my power, but even I cannot do the impossible. The wand held your companions in those shapes while the roots were full of fresh sap. As the sap dried, the roots withered, and so did they. Do not worry, my dearest. A basket of new turnips will put everything right. You can call back every form you wish, and the great green patch in the garden will give you livelier company.
        - id: ch03-b17
          speaker: narrator
          text: With that, he went away. The princess touched the wrinkled women with her wand. They became withered roots again, ready for the rubbish heap. Then she ran lightly across the meadow to find the promised basket. It was nowhere to be seen. She searched up and down, peering into every corner of the garden.
        - id: ch03-b18
          speaker: narrator
          text: At last, near a trellis of grapevines, she met Rübezahl. Even from a distance she saw how embarrassed he was.
        - id: ch03-b19
          speaker: princess
          text: You are teasing me. Where did you hide the basket? I have searched for it for at least an hour.
        - id: ch03-b20
          speaker: rubezahl
          text: Dear queen of my heart, forgive my carelessness. I promised what I could not provide. I have searched the whole country, but all the roots have been harvested and lie drying in musty cellars. The fields below are bare because winter rules the valley. Only here beside you have I held spring in place, and flowers open wherever you walk. Be patient a little longer. Then you shall certainly have your playthings again.
        - id: ch03-b21
          speaker: narrator
          text: Before he had quite finished, the disappointed princess turned away. Without giving him an answer, she marched to her rooms.
        - id: ch03-b22
          speaker: narrator
          text: Rübezahl hurried above ground as quickly as he could. Disguised as a farmer, he went to the nearest market town and bought a donkey. He loaded it with sacks of turnip, carrot, and radish seed, brought it home, and sowed a great field. Then he sent a vast army of goblins to guard and tend the ground. They drew the fiery rivers up from the heart of the earth, bringing them close enough to warm the seeds and encourage every sprout. With such care, the plants grew and flourished marvelously through the winter, and the field promised a fine crop.
        - id: ch03-b23
          speaker: narrator
          text: The princess walked through the field each day. No other plant or fruit in her marvelous garden pleased her so much as those roots, yet discontent still filled her eyes. Most of all, she liked to sit in a shady fir wood beside a small stream. She dropped the flowers she had gathered into the water and watched them drift away.
    - id: ch04
      title: Three Messengers
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Rübezahl tried every means within his power to please the princess and win her love, yet nothing succeeded. He never guessed the true reason. He imagined that she was simply too young and inexperienced to care for him. In that, the wise old gnome was badly mistaken. Another face had filled her heart long before she entered his underground kingdom.
        - id: ch04-b02
          speaker: narrator
          text: Prince Ratibor ruled the land beside her father's kingdom, and he had already won the princess's heart. The young lovers had been looking joyfully toward their wedding day when the bride vanished without a trace. The dreadful news drove Ratibor nearly out of his mind. As day followed day and no one heard anything of her, he abandoned his castle and the company of other people. He spent his time roaming through the wild forests, calling her name aloud to the silent trees and rocks.
        - id: ch04-b03
          speaker: narrator
          text: In her splendid prison, the princess sighed over her sorrow in secret. She did not want to arouse Rübezahl's suspicions, so she hid her feelings whenever he was near. But in her own thoughts she was always searching for some way to escape her captivity. She considered one possibility after another until, at last, a plan came to her.
        - id: ch04-b04
          speaker: narrator
          text: By this time, spring ruled the valley once more. The roots that had been kept warm through the cruel winter were now fully grown, so Rübezahl sent the underground fires back to their places in the deep earth. Each day, the princess pulled up a few roots and made experiments with her wand. She called forth one person she missed and then another, as though she wanted only the pleasure of seeing each familiar face appear. But behind these little trials, she had another purpose.
        - id: ch04-b05
          speaker: narrator
          text: One day, she turned a tiny turnip into a bee and sent it to find news of her lover.
        - id: ch04-b06
          speaker: princess
          text: Fly east, dear little bee, until you find my beloved Ratibor. Hum softly in his ear that I love only him, and that the gnome holds me captive in his palace beneath the mountains. Remember every word, then bring me back a message from him.
        - id: ch04-b07
          speaker: narrator
          text: The bee spread its shining wings and flew away. Before it had passed from sight, a greedy swallow swooped down and caught it. The princess watched in grief as her messenger was eaten on the spot.
        - id: ch04-b08
          speaker: narrator
          text: Next, she used the wand to summon a cricket and carefully taught it another greeting.
        - id: ch04-b09
          speaker: princess
          text: Hop to Ratibor, little cricket. Chirp in his ear that I love only him, but the gnome is keeping me prisoner in his palace beneath the mountains.
        - id: ch04-b10
          speaker: narrator
          text: The cricket hopped away merrily, determined to carry the message. But a long-legged stork came striding down the same road. Her beak snapped up the cricket, and before the poor creature could say one word, it had vanished down her throat.
        - id: ch04-b11
          speaker: narrator
          text: Two failures did not stop the princess. For her third attempt, she changed a turnip into a magpie.
        - id: ch04-b12
          speaker: princess
          text: Fly from tree to tree, you chattering bird, until you reach Ratibor, my love. Tell him I am a captive. Ask him to come with horses and men to the hill above the Thorny Valley, three days from now.
        - id: ch04-b13
          speaker: narrator
          text: The magpie listened. It hopped along the branches for a while, then darted away. The princess watched anxiously until it disappeared.
        - id: ch04-b14
          speaker: narrator
          text: Ratibor was still wandering through the woods, and not even the beauty of spring could soothe him. One day, he sat beneath an oak, dreaming of the princess and sometimes crying her name aloud. Another voice seemed to answer. He leaped up and looked around, but saw no one. He had almost decided he was mistaken when the voice called again. High among the twigs, a magpie hopped back and forth. To his astonishment, the bird was saying his name.
        - id: ch04-b15
          speaker: ratibor
          text: Poor chatterer, who taught you that name? It belongs to a wretched man who wishes the earth would open and swallow him, name and memory together.
          emotion: sad
        - id: ch04-b16
          speaker: narrator
          text: Ratibor seized a large stone and raised his arm to throw it. At that very moment, the magpie spoke the princess's name. His arm dropped helplessly to his side, and he stood perfectly still.
        - id: ch04-b17
          speaker: narrator
          text: Like every magpie, this bird could never be happy without chattering. It began repeating the lesson the princess had taught it. As Ratibor understood the message, joy rushed into his heart. His misery vanished. He questioned the welcome messenger again and again about what had happened to her.
        - id: ch04-b18
          speaker: narrator
          text: The magpie could tell him nothing beyond the lesson it had learned. However anxiously the prince questioned it, the bird had no other answer. Before long it fluttered away among the trees. Ratibor did not waste another moment. He hurried back to his castle, gathered a troop of horsemen, and made ready to meet whatever danger might be waiting at the Thorny Valley.
    - id: ch05
      title: The Counted Turnips
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Meanwhile, the princess carefully continued her plan. She stopped treating Rübezahl with coldness. A new look in her eyes made him hope that one day she might return his love, and the thought delighted him.
        - id: ch05-b02
          speaker: narrator
          text: The next morning, as soon as the sun rose, she dressed herself as a bride in the robes and jewels Rübezahl had prepared for her. Her golden hair was braided and crowned with myrtle flowers. Gems flashed across her long veil. Wearing all that splendor, she went to meet him on the great terrace.
        - id: ch05-b03
          speaker: rubezahl
          text: Loveliest of maidens, let me look into your dear eyes. Let me see there that you will refuse my love no longer, and that you mean to make me the happiest creature beneath the sun.
        - id: ch05-b04
          speaker: narrator
          text: He bowed low and reached to lift her veil, but the princess drew it more closely around her.
        - id: ch05-b05
          speaker: princess
          text: Your faithful love has won me. I will resist your wishes no longer. Only trust what I say, and let this veil hide my blushes and tears a little longer.
        - id: ch05-b06
          speaker: rubezahl
          text: Tears, my beloved? Every one falls on my heart like a drop of molten gold. Much as I desire your love, I will not ask you to make a sacrifice.
        - id: ch05-b07
          speaker: princess
          text: Oh, you have misunderstood me. My heart answers your tenderness, but I am afraid. A wife cannot remain charming forever. You will never change, but mortal beauty fades like a flower. How can I know that you will always be as loving and delightful as you are today?
        - id: ch05-b08
          speaker: rubezahl
          text: Then ask me for proof, sweetheart. Test my obedience and patience, and you will see that my love can never change.
        - id: ch05-b09
          speaker: princess
          text: Very well. Give me one proof of your goodness. Go and count every turnip in that meadow. There must be enough guests for my wedding feast, and the turnips will give me bridesmaids too. Do not deceive me, and do not miss even one. That will prove you are true to me.
        - id: ch05-b10
          speaker: narrator
          text: Rübezahl hated to lose sight of his beautiful bride for even a moment, but he obeyed her command without delay. He hurried into the field and skipped among the turnips as lightly as a grasshopper, counting each root in its row. Before long, he reached the far end and believed the task complete. Yet the princess had warned him not to miss even one. To make perfectly certain that he had made no mistake, he turned around and counted the whole field again.
        - id: ch05-b11
          speaker: narrator
          text: To his great annoyance, the second answer differed from the first. He tried a third time, and that number matched neither of the others. No wonder. His mind was full of the princess's lovely face and tender words.
        - id: ch05-b12
          speaker: narrator
          text: As soon as her deceived lover was well out of sight, the princess prepared to flee. She had hidden one fine, fresh turnip nearby. With her wand, she changed it into a spirited horse, already saddled and bridled. She sprang onto its back and galloped over hills and valleys until she reached the Thorny Valley. There she threw herself into the arms of Prince Ratibor.
        - id: ch05-b13
          speaker: narrator
          text: Rübezahl counted on and on, going through the whole task again and again, until his back ached and his head swam. At last he could hardly add two and two. Still, he felt almost certain that he finally knew the exact number of turnips, large and small together. Eager to prove what an obedient and agreeable husband he would be, he hurried back across the mossy lawn to his beloved. He felt very pleased with himself as he approached the place where he had left her. Then he arrived and saw that she was gone.
        - id: ch05-b14
          speaker: narrator
          text: He searched every path and thicket without success. He looked behind every tree and gazed into every pond, but found no trace of her anywhere in the garden. Then he raced into the palace. He rushed from room to room, peered into every hole and corner, and called her name again and again. Only echoes answered through the marble halls. No voice replied, and no footstep broke the silence.
        - id: ch05-b15
          speaker: narrator
          text: At last, he understood that something was wrong. He cast off the mortal body that slowed him down, flew out of the palace, and soared high above the ground. Far away, he saw the fleeing princess just as her swift horse carried her across the border of his kingdom.
        - id: ch05-b16
          speaker: narrator
          text: In fury, Rübezahl drove two great clouds together and hurled a thunderbolt after the flying princess. It struck behind her and shattered rocky walls that had stood for a thousand years. But his rage was useless, for she had already crossed beyond his power. The thunderclouds softened and melted into mist. He flew about for a while in despair and cried his misery to all four winds. Then he returned sorrowfully to the palace. He crept once more through every empty room, filling the halls with sighs and lamentations.
        - id: ch05-b17
          speaker: narrator
          text: He wandered into the gardens, but they had lost all beauty for him. The princess's footprints in the golden sand renewed his grief. Everything felt lonely, empty, and sorrowful. The forsaken gnome decided that he would never again deal with people, for he believed them false.
        - id: ch05-b18
          speaker: narrator
          text: He stamped three times upon the earth. The magic palace and all its treasures vanished into the nothingness from which he had called them. Then Rübezahl fled once more into the depths of his underground kingdom.
        - id: ch05-b19
          speaker: narrator
          text: While this happened, Ratibor carried the princess swiftly to safety. With great triumph and ceremony, he restored her to her father. The two were married then and there, and Ratibor took his bride home to his own castle.
        - id: ch05-b20
          speaker: narrator
          text: Long after the princess had died, and after her children were gone as well, villagers still told the story of her imprisonment beneath the mountains. On winter nights, they sat carving wood and passed the tale from one generation to the next.
