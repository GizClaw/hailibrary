cover_prompt: |-
  A wordless cover gathers motifs from the globally sourced tales of The Brown Fairy Book around a warm earth-colored crossroads. A simple-hearted traveler shares bread with a stranger, a tortoise faces a mischievous monkey beside a fruit tree, twin fish-knights rise from a river, and a distant horse carries a young wanderer toward ochre hills. At the center, the traveler opens his small cloth bundle so that seeds, shells, and a golden fruit spill into a shared circle. This generous offering is the focal action, linking the varied traditions without blending their distinct clothing or settings into caricature. Use a broad slightly elevated composition with layered paths, river, palms, and mountains, leaving generous sunset sky above. Treat each figure with dignity, base garments on the tale's stated region and premodern period, and avoid generic costume stereotypes or adaptation imagery. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
