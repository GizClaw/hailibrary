audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 温暖庄重，以从容而清晰的语气讲述古老命运故事, timbre: 清澈浑厚, pace: 舒缓, pitch: 中音}
    wali_dad:
      display_name: 瓦利·达德
      tts: {delivery: 纯朴谦和，遇事先替别人着想, timbre: 苍老温厚, pace: 稍缓, pitch: 中低音}
    merchant:
      display_name: 商人
      tts: {delivery: 见多识广，起初风趣，后来渐显为难, timbre: 成熟清晰, pace: 适中, pitch: 中音}
    princess_khaistan:
      display_name: 海斯坦公主
      tts: {delivery: 端庄仁厚，言语温雅而有分寸, timbre: 年轻明亮, pace: 适中, pitch: 中高音}
    prince_nekabad:
      display_name: 内卡巴德王子
      tts: {delivery: 英勇大方，待人真诚而热烈, timbre: 年轻洪亮, pace: 适中, pitch: 中音}
    king_khaistan:
      display_name: 海斯坦国王
      tts: {delivery: 威严老练，盘算时直截了当, timbre: 成熟浑厚, pace: 适中, pitch: 中低音}
    peri_1:
      display_name: 第一位佩里仙女
      tts: {delivery: 慈悲安宁，话语清亮如歌, timbre: 空灵清澈, pace: 舒缓, pitch: 高音}
    peri_2:
      display_name: 第二位佩里仙女
      tts: {delivery: 温柔沉静，询问时清晰坚定, timbre: 空灵柔和, pace: 舒缓, pitch: 中高音}
  chapters:
    - id: ch01
      title: 一只金镯
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，有个穷苦老人叫瓦利·达德·甘杰，人们也叫他秃头瓦利·达德。他没有亲人，独自住在远离城镇的小泥屋里。每天，他进林子割草，再把草卖给人喂马，只能挣五枚半便士。老人心思简单，所需很少，四枚用来置办必需的吃穿，剩下一枚便存起来。这样的日子过了许多年，他一直过得心满意足。
        - id: ch01-b02
          speaker: narrator
          text: >-
            一天夜里，瓦利·达德想数数藏在地板下大陶罐里的钱。他费了好大的劲儿才拖出钱袋。袋口一开，硬币滚了一地。老人坐在那里，惊讶地望着它们，不知该拿这么多钱做什么。他从没想过花在自己身上，因为照旧生活已经让他十分满足，对更多的安逸和享受毫无向往。最后，他把钱装进旧布袋，塞到床下，裹着破毯子睡了。
        - id: ch01-b03
          speaker: narrator
          text: >-
            第二天一早，他扛着沉甸甸的钱袋，摇摇晃晃来到相熟的珠宝匠铺里，讲定价钱，买下一只精美的小金镯。他把镯子仔细包好，藏进棉布腰带，又去找一位富有的行商朋友。这位商人常带着骆驼和货物周游各国。瓦利·达德运气不错，恰好赶上他在家。两人闲谈一阵，老人问他，见过的女子中，谁最美丽也最贤德。商人说，海斯坦公主不但容貌出众，仁慈慷慨的性情也天下闻名。
        - id: ch01-b04
          speaker: wali_dad
          text: >-
            那么，你下次去海斯坦，就替我把这只小镯子送给公主。请告诉她，这是一个仰慕美德远胜过贪求财富的人，向她表达的一点敬意。
        - id: ch01-b05
          speaker: narrator
          text: >-
            瓦利·达德从腰带里取出金镯，交给朋友。商人吃惊极了，却没有推辞。后来，他在旅途中来到海斯坦都城，一有机会便进宫求见。他把金镯装进自己预备的雅致香盒，连同瓦利·达德的话一起送进去。公主猜不出送礼人是谁，只请商人办完城里的事再来听答复。几天后，商人果然回宫，收到整整一骆驼的华贵绸缎，还得了一笔给自己的赏钱。他带着礼物踏上归途。
        - id: ch01-b06
          speaker: narrator
          text: >-
            几个月后，商人结束了漫长的旅程，把公主的回礼送到瓦利·达德那里。整整一骆驼的绸缎卸在小屋门前，老人面对这些贵重东西，又犯了难。他不知道自己能拿它们怎么办。苦苦思量一阵，他请商人想一想，是否认识哪个年轻王子，正好用得上、也配得上这样的珍宝。
        - id: ch01-b07
          speaker: merchant
          text: >-
            当然认识！从德里到巴格达，从君士坦丁堡到勒克瑙，所有王子我都知道。可最配得上这份礼物的，还是英勇富有的内卡巴德王子。
        - id: ch01-b08
          speaker: wali_dad
          text: 那就请你把绸缎带给他，再带去一个老人的祝福。
        - id: ch01-b09
          speaker: narrator
          text: >-
            能把绸缎送出去，瓦利·达德着实松了口气。商人下一次经过内卡巴德，带着绸缎求见王子。他获准入内后，取出这份礼物，说它是瓦利·达德献上的一点心意，也是向王子的品德与尊贵致敬。年轻王子深受送礼人的慷慨感动，立刻挑出本国最负盛名的十二匹良种骏马作为回礼。商人告辞以前，也因一路奔波效劳，得到了丰厚赏赐。
    - id: ch02
      title: 越送越大的回礼
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            商人回家后的第二天，带着十二匹马去找瓦利·达德。老人远远看见马群，心想这些客人一定要吃许多草，自己不用辛苦拖去市场，就能把草全卖掉了。他连忙跑进林子，使劲割了一大捆，背着所能扛动的最多一捆草回来。可这时他才知道，骏马全是送给自己的，顿时大失所望。起初他完全不知该怎么办。想了一会儿，他突然有了好主意，把两匹送给商人，又请商人把其余十匹带给海斯坦公主，因为只有她才配拥有这样美丽的牲口。
        - id: ch02-b02
          speaker: narrator
          text: >-
            商人大笑着离开，却还是照办了。下一趟旅程，他把十匹骏马平安送到公主面前。公主这回召来商人，仔细追问送礼人的情形。商人平日极诚实，这回却不愿如实说出瓦利·达德每天只挣五枚半便士，甚至衣不蔽体。他只说，朋友听闻公主美丽善良，一心想把手中最好的东西献到她脚下。公主不知该怎样回报一个坚持送来厚礼的人，便把整件事告诉父王，请他替自己想个得体的办法。
        - id: ch02-b03
          speaker: king_khaistan
          text: >-
            这些礼物不能退。你就送他一份贵重无比的回礼，让他再也拿不出更好的东西。这样，他以后自然不好意思继续送了。
        - id: ch02-b04
          speaker: narrator
          text: >-
            国王命人把每匹马换成两头驮满白银的骡子，作为公主的回礼。不过几个钟头，商人便发现自己竟管领了一支富丽堂皇的驮队。财宝太多，他只得另外雇来许多武装护卫，沿途防备强盗。走过漫长的道路，等他终于平安回到瓦利·达德的小屋，真是庆幸不已。
        - id: ch02-b05
          speaker: wali_dad
          text: >-
            这下我可以好好报答那位王子了！不过，你这一趟一定花了许多钱。请你留下六头骡子和它们驮的银子，再把其余的直接送去内卡巴德，我会十分感激。
        - id: ch02-b06
          speaker: narrator
          text: >-
            商人觉得辛劳已经得到优厚回报，也想看看事情究竟会闹成什么样，便没有推辞。他一预备妥当，就带着这份气派非凡的礼物出发了。王子收到白银，同样觉得为难，便细细盘问商人。商人本想从此结束这场玩笑，可又担心自己的信誉受损。一开口，他还是忍不住把瓦利·达德夸得天花乱坠。老人若亲耳听见，恐怕连自己也认不出来。
        - id: ch02-b07
          speaker: narrator
          text: >-
            王子也想让那位神秘人物从此罢手，便决定回赠一份真正配得上王室的厚礼。他备下二十匹骏马，配着金线绣成的鞍衣、上等摩洛哥皮马鞍和银制辔头马镫；又选了二十峰最优良的骆驼。它们的速度堪比赛马，能一整天轻快小跑而不疲倦。最后还有二十头大象，背负辉煌的银轿，身披珍珠刺绣的丝绸障衣。商人不得不雇来一小队人马照管这些牲口。整支队伍走在路上，浩浩荡荡，好不威风。
        - id: ch02-b08
          speaker: narrator
          text: >-
            瓦利·达德远远望见尘云和闪亮的装具，还以为来了许多买草的客人。他高兴地喊了一声“真主在上”，便赶进林子拼命割草。回来后，他发现驮队停在自家门口，商人正不安地等着恭喜他发了大财。
        - id: ch02-b09
          speaker: wali_dad
          text: >-
            大财？我一只脚都踏进坟墓了，要财富做什么？那位年轻美丽的公主才会喜欢这些好东西。你留下两匹马、两峰骆驼和两头大象，连同装具，其余全替我送给她吧。
        - id: ch02-b10
          speaker: narrator
          text: >-
            商人起初坚决反对。他说，这几趟送礼的差事越来越叫人难堪。费用方面，他自己的确得到了丰厚补偿，可他还是不愿这样一趟趟地来回奔波，心里也越来越害怕。瓦利·达德再三相求，最后他才答应再去一次，同时暗暗发誓，从此再也不揽这种差事。休息几天后，驮队再次向海斯坦进发。
    - id: ch03
      title: 国王与公主启程
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            海斯坦国王看见金碧辉煌的人兽队伍开进王宫庭院，惊得亲自匆匆下楼查问。等他听说这些又是尊贵的瓦利·达德送给女儿的礼物，更是惊得说不出话来。他没有片刻耽搁，立刻赶到公主的房中，把自己的猜测告诉了她。
        - id: ch03-b02
          speaker: king_khaistan
          text: >-
            亲爱的，这个人一定想娶你，这些礼物就是他的意思。我们只能亲自去拜访他。他必定富可敌国，又对你如此倾心。嫁给他，或许真不算坏事。
        - id: ch03-b03
          speaker: narrator
          text: >-
            公主赞同父王说的每一句话。宫中立刻传下命令，不得耽搁，要预备大批象群和驼队、华美的帐篷与旗帜、供女眷乘坐的轿舆，还有供男子骑乘的马匹。国王宣布，他和公主要亲自去拜访伟大而慷慨的瓦利·达德王子，而商人必须为整支队伍带路。
        - id: ch03-b04
          speaker: narrator
          text: >-
            可怜的商人恨不得立刻逃走，可众人把他当作瓦利·达德的代表，处处殷勤款待。他几乎片刻不得安宁，更找不到一点溜走的机会。几天后，他彻底绝望，只能认定一切都是命运，自己根本逃脱不了。他只好虔诚祈求时来运转，把自己从这场原本出于好意、却亲手招来的灾难中救出去。
        - id: ch03-b05
          speaker: narrator
          text: >-
            第七天，大队人马终于出发。城头礼炮轰鸣，漫天尘土飞扬，人群高声欢呼，号角震耳欲聋。他们一天接一天地赶路，商人也一天比一天虚弱难受。他不停猜想，国王会发明怎样一种死法处置自己。每一夜，他几乎都睁眼躺到天亮，反复想着眼前的困局。这样的折磨，恐怕和国王的刽子手已经对他的脖子动手也差不了多少。
        - id: ch03-b06
          speaker: narrator
          text: >-
            离小泥屋只剩一天路程时，大队扎下了巨大的营盘。商人被派去先行通报，说海斯坦国王和公主已经抵达，请求与瓦利·达德见面。他赶到小屋时，可怜的老人正在用洋葱和干面包作晚饭。听完整件事，瓦利·达德为自己、朋友和公主的名誉羞愧悲伤到了极点，一面哭，一面揪扯胡须，凄惨地呻吟。商人本有满腔责备，此刻却一句也不忍说。
        - id: ch03-b07
          speaker: wali_dad
          text: >-
            求你了，无论想什么借口，也请把他们拖延一天。等到明早你再回来，我们一起商量该怎么办。
          emotion: sad
        - id: ch03-b08
          speaker: narrator
          text: >-
            商人离开后，瓦利·达德觉得，自己的愚蠢酿成了这场耻辱和灾祸，只有一个体面的办法可以解脱，那就是自尽。他半夜来到高耸的石崖边，河水正在谷底蜿蜒奔流。老人退开几步，助跑着冲向黑暗深渊，却在最后一刻猛地停住。他做不到。
        - id: ch03-b09
          speaker: narrator
          text: >-
            黑沉沉的夜影里，崖下河水咆哮翻滚，撞击嶙峋岩石。瓦利·达德本来熟悉这个地方，可如今什么也看不见，脑海里的景象比平日凶险无情十倍。风穿过峡谷，像在可怕地叹息和低语。石缝中的灌木野草仿佛成了活物，在昏暗中舞动招手。一只猫头鹰突然贴着他的脸“呼、呼”怪笑。瓦利·达德吓出一身冷汗，猛地退开。他害怕了，只能浑身发抖地捂住脸，放声大哭。
    - id: ch04
      title: 黑夜里的佩里仙女
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            过了一会儿，瓦利·达德发觉面前泛起柔光。他还以为清晨已经到来，要赶着揭开自己的耻辱。可放下双手一看，眼前站着两位美丽仙灵。他立刻知道，她们不是凡人，而是来自天国的佩里仙女。
        - id: ch04-b02
          speaker: peri_1
          text: 老人家，你为什么哭？
        - id: ch04-b03
          speaker: narrator
          text: 她的声音像夜莺一样清亮悦耳。
        - id: ch04-b04
          speaker: wali_dad
          text: 我是因为羞愧才哭。
          emotion: sad
        - id: ch04-b05
          speaker: peri_2
          text: 你到这里来做什么？
        - id: ch04-b06
          speaker: wali_dad
          text: 我是来寻死的。
          emotion: sad
        - id: ch04-b07
          speaker: narrator
          text: >-
            两位仙女继续询问，瓦利·达德便从第一只金镯说起，把整个故事都坦白了。第一位走上前，把一只手轻轻搭在他的肩上。老人立刻感觉有件奇异的事正在自己身上发生，却说不出究竟是什么，只能惊讶地低头看着。
        - id: ch04-b08
          speaker: narrator
          text: >-
            破旧的棉布衣衫变成了细麻衣和绣花袍服。赤裸而坚硬的双脚穿上温暖柔软的鞋。头上出现一顶缀满珠宝的巨大头巾，颈间垂着沉甸甸的金链。那把挂在腰间的破弯镰也化成辉煌的弯刀，象牙刀柄在微光中闪耀，仿佛月下白雪。
        - id: ch04-b09
          speaker: narrator
          text: >-
            老人像在梦里一样，惊奇得呆住。第二位仙女挥手叫他回头。眼前敞开一座宏伟的大门。两位仙女领他走过巨型悬铃木夹成的大道。就在泥屋原来的地方，一座华美宫殿突然出现，千万盏灯照得通明。
        - id: ch04-b10
          speaker: narrator
          text: >-
            宫殿的巨大门廊和回廊里，仆从来去匆匆。卫兵沿路巡行。老人走过覆着青苔的小径时，他们纷纷恭敬行礼。小径穿过一片片开阔草坪，喷泉在其间飞溅，鲜花的香气浮在空气中。瓦利·达德看得目瞪口呆，手足无措。
        - id: ch04-b11
          speaker: peri_1
          text: 不要害怕。回家去吧，也要明白，真主会奖赏心地纯朴的人。
          emotion: calm
        - id: ch04-b12
          speaker: narrator
          text: >-
            话音一落，两位仙女双双消失，只留下瓦利·达德。他继续向宫殿走去，心里仍认定自己一定是在做梦。不久，他便来到一间无比华丽的寝室休息，那屋子比他最奢侈的梦境还要气派。天亮醒来，他发现宫殿还在，自己和仆从也全都是真的。原来这一切并不是梦。
        - id: ch04-b13
          speaker: narrator
          text: >-
            日出不久，商人被领到瓦利·达德面前。老人固然惊愕，商人却比他更加吃惊。商人说，自己整夜没睡，天边刚露出第一线曙光就来找朋友，可这一趟找得无比艰难。大片荒芜林地一夜间成了花园与园林。若不是几个新仆从发现他，把他带进宫中，他早已吓得逃走，还会以为连日的忧虑逼疯了自己，眼前所见的一切都只是幻象。
        - id: ch04-b14
          speaker: narrator
          text: >-
            瓦利·达德把昨夜发生的一切，从悬崖边的绝望到两位仙女的出现，全告诉了商人。两人仔细商议以后，他派出正式邀请，请海斯坦国王和公主来到宫中做客。他还特意请王室带上全部随员与仆从，从最高贵的臣子到营地里身份最低微的人，一个也不要落下。
    - id: ch05
      title: 心地纯朴的人
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            一场款待王室贵客的盛宴整整持续了三天三夜。每晚，国王和贵族使用金盘金杯，地位较低的人使用银盘银杯。宴席结束，每位客人都被请把自己用过的杯盘留下，作为这场盛会的纪念。世上从未有人见过这样的辉煌。除了丰盛的大宴，还有竞技、狩猎、舞蹈和各式各样的娱乐。
        - id: ch05-b02
          speaker: narrator
          text: >-
            到了第四天，海斯坦国王把主人请到一旁。他说自己早有猜测，便直接问瓦利·达德，是否果真有意迎娶他的女儿。老人听完，先为国王给他的这份美意再三道谢，才说出了自己真正的心里话。
        - id: ch05-b03
          speaker: wali_dad
          text: >-
            我做梦也不敢奢望这样的荣耀。我年纪太老，模样又太丑，实在配不上如此美丽的女子。请陛下暂且留下，让我派人请来内卡巴德王子。他品德高尚、勇敢正直，一定很乐意争取公主的芳心。
        - id: ch05-b04
          speaker: narrator
          text: >-
            国王欣然答应，答应继续留在宫中等候。瓦利·达德让商人再次前往内卡巴德，这回不但有一群随从同行，还带上了极其贵重的礼物。王子收到邀请，立刻赶来。他一见公主便爱得神魂颠倒，很快赢得了她的芳心。不久，王子就在瓦利·达德的宫殿里迎娶公主。婚礼无比盛大，整座宫殿和四周又爆发出一片新的欢腾。
        - id: ch05-b05
          speaker: narrator
          text: >-
            婚礼过后，海斯坦国王回到自己的国家，新婚的内卡巴德王子和公主也回到了他们的国度。瓦利·达德则一直活到很老，始终帮助每一个陷入困境的人。即使有了享用不尽的荣华富贵，他仍保有从前那个割草人瓦利·达德·甘杰心地纯朴、慷慨无私的本性。
        - id: ch05-b06
          speaker: narrator
          text: 这个故事，是一位印度人讲给作者听的。
