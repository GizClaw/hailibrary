audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, grave, and attentive to wonder
        timbre: clear and resonant
        pace: measured
        pitch: medium
    wali_dad:
      display_name: Wali Dad
      tts:
        delivery: humble, openhearted, and gently bewildered
        timbre: old and softly weathered
        pace: unhurried
        pitch: medium-low
    merchant:
      display_name: Merchant
      tts:
        delivery: practical, good-natured, and increasingly uneasy
        timbre: mature and clear
        pace: measured
        pitch: medium
    king:
      display_name: King of Khaistan
      tts:
        delivery: dignified, decisive, and fatherly
        timbre: rich and authoritative
        pace: measured
        pitch: medium-low
    first_peri:
      display_name: First Peri
      tts:
        delivery: tender, musical, and otherworldly
        timbre: clear and bell-like
        pace: serene
        pitch: high
    second_peri:
      display_name: Second Peri
      tts:
        delivery: gentle, searching, and otherworldly
        timbre: airy and luminous
        pace: serene
        pitch: medium-high
  chapters:
    - id: ch01
      title: The Gold Bracelet
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, a poor old man named Wali Dad Gunjay lived alone in a little mud hut far from any town. People also called him Wali Dad the Bald. He had no family. Each day he cut grass in the jungle and sold it as horse fodder.
        - id: ch01-b02
          speaker: narrator
          text: He earned only five halfpence a day. Four paid for the little food and clothing he needed, and he saved the last one. He needed so little that this was enough. Wali Dad was content with his simple life, and the years passed quietly in the same way.
        - id: ch01-b03
          speaker: narrator
          text: One night, he decided to count the money hidden in a great earthen pot beneath his floor. It took a great deal of effort to reach the bag and drag it out. When the coins spilled across the floor in a heap, he sat staring at them in amazement. What could he possibly do with so much money?
        - id: ch01-b04
          speaker: narrator
          text: Not once did he consider spending the money on himself. He was perfectly content to live out the rest of his days in the same way he had lived for so many years. He had no wish for greater comfort or luxury. At last, he poured the coins into an old sack, pushed it under his bed, wrapped himself in his ragged blanket, and went to sleep.
        - id: ch01-b05
          speaker: narrator
          text: Early the next morning, Wali Dad staggered into town with the heavy sack. At a jeweler's shop, he traded all his savings for a beautiful little gold bracelet. He tucked it safely into the cotton cloth around his waist and went to see a rich friend.
        - id: ch01-b06
          speaker: narrator
          text: This friend was a traveling merchant who wandered through many countries with his camels and merchandise. Luckily, Wali Dad found him at home. They sat down and talked for a while. Then Wali Dad asked which lady was the most beautiful and virtuous the merchant had ever known.
        - id: ch01-b07
          speaker: merchant
          text: The Princess of Khaistan is famous everywhere. People praise both her beauty and her kind, generous heart.
        - id: ch01-b08
          speaker: wali_dad
          text: Then please give her this bracelet when you next travel that way. Tell her it comes with the respectful compliments of a man who values virtue far more than wealth.
        - id: ch01-b09
          speaker: narrator
          text: Wali Dad drew out the bracelet and handed it over. The merchant was astonished, but he raised no objection.
        - id: ch01-b10
          speaker: narrator
          text: Time passed, and at last his travels brought him to the capital of Khaistan. As soon as the chance came, he presented himself at the palace. He had placed the bracelet neatly in a little perfumed box of his own. He sent it in to the princess together with Wali Dad's message.
        - id: ch01-b11
          speaker: narrator
          text: The princess could not imagine who had sent such a gift. She asked the merchant to return after finishing his business in the city, and promised him an answer then.
        - id: ch01-b12
          speaker: narrator
          text: A few days later, he came back. The princess gave him a camel-load of rich silks for Wali Dad and a gift of money for himself. Then the merchant began his journey home.
    - id: ch02
      title: Gifts That Would Not End
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Several months passed before the merchant reached Wali Dad's hut. The old man was completely puzzled when a camel-load of costly silk came tumbling down at his door. What was he to do with all of it?
        - id: ch02-b02
          speaker: narrator
          text: After thinking hard, he asked whether the merchant knew some young prince who might make good use of such treasure.
        - id: ch02-b03
          speaker: merchant
          text: Of course I do! From Delhi to Baghdad, and from Constantinople to Lucknow, I know them all. None is worthier than the brave and wealthy young Prince of Nekabad.
        - id: ch02-b04
          speaker: narrator
          text: The merchant was greatly amused.
        - id: ch02-b05
          speaker: wali_dad
          text: Good. Take the silks to him, then, along with an old man's blessing.
        - id: ch02-b06
          speaker: narrator
          text: Wali Dad was greatly relieved to be rid of them. On his next journey, the merchant carried the silks with him. In time, he reached Nekabad and asked for an audience with the prince. When he was admitted, he displayed the beautiful gift and asked the young man to accept it as Wali Dad's humble tribute to his worth and greatness.
        - id: ch02-b07
          speaker: narrator
          text: The prince was deeply touched. In return, he ordered twelve of his country's finest horses to be given to the merchant. Before the man left, the prince also rewarded him generously for his service.
        - id: ch02-b08
          speaker: narrator
          text: At last, the merchant came home and set out for Wali Dad's hut with all twelve horses. When the old man saw them in the distance, he thought a troop of travelers was coming.
        - id: ch02-b09
          speaker: wali_dad
          text: What luck! Those horses will need plenty of grass. I can sell everything I have without dragging it to market.
        - id: ch02-b10
          speaker: narrator
          text: He hurried into the jungle and cut grass as fast as he could. When he returned with the largest load he could carry, he was dismayed to learn that every horse belonged to him.
        - id: ch02-b11
          speaker: narrator
          text: At first, he could not imagine what to do with twelve horses. After a little while, a splendid thought came to him. He gave two to the merchant and asked him to take the other ten to the Princess of Khaistan. To Wali Dad, she was clearly the proper person to own such beautiful animals.
        - id: ch02-b12
          speaker: narrator
          text: The merchant laughed as he left. Still, he kept his promise. On his next journey, he delivered the horses safely to the princess.
        - id: ch02-b13
          speaker: narrator
          text: This time, the princess called the merchant before her and questioned him about the mysterious giver. The merchant was normally a most honest man. Still, he did not quite like to describe Wali Dad truthfully as an old grass cutter who earned five halfpence a day and hardly had enough clothing to cover himself.
        - id: ch02-b14
          speaker: merchant
          text: My friend heard of your beauty and goodness. He wished to place the very best he had at your feet.
        - id: ch02-b15
          speaker: narrator
          text: The princess told her father everything and asked how she could answer someone who kept sending her such gifts.
        - id: ch02-b16
          speaker: king
          text: You cannot refuse them. Send this unknown friend a present so magnificent that he cannot possibly improve upon it. Then perhaps he will feel too ashamed to send anything more.
        - id: ch02-b17
          speaker: narrator
          text: The king ordered two mules loaded with silver for every one of the ten horses. Within a few hours, the merchant found himself responsible for a splendid caravan of twenty laden mules. Such wealth would tempt robbers, so he had to hire a number of armed men to defend it on the road. After that long and anxious journey, he was very glad when he finally reached Wali Dad's hut.
        - id: ch02-b18
          speaker: wali_dad
          text: Now I can properly repay that kind prince for his wonderful horses! But this journey has cost you a great deal. Please keep six loaded mules, then take all the rest straight to Nekabad. I will be deeply grateful.
        - id: ch02-b19
          speaker: narrator
          text: The merchant considered himself handsomely repaid for all his trouble, and he wondered greatly how this strange business would end. He made no difficulty about Wali Dad's request. As soon as he could prepare everything, he set off for Nekabad with the new and princely gift.
    - id: ch03
      title: A Royal Caravan
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Now the prince was embarrassed in his turn, and he questioned the merchant closely. The merchant felt that his own reputation was at stake. Inside, he resolved that he would carry the joke no further. Even so, he described Wali Dad in such glowing terms that the old man would never have recognized himself if he had been there to listen.
        - id: ch03-b02
          speaker: narrator
          text: Like the King of Khaistan, the prince decided to answer with a truly royal gift. Perhaps then the unknown giver would stop trying to outdo him.
        - id: ch03-b03
          speaker: narrator
          text: He assembled twenty splendid horses, each dressed in cloth embroidered with gold. They wore fine morocco leather saddles, along with silver bridles and silver stirrups. Then he added twenty camels of the finest breed. These camels had the speed of racehorses and could swing along at a trot for the whole day without growing tired.
        - id: ch03-b04
          speaker: narrator
          text: Last came twenty elephants with magnificent silver howdahs and silk coverings sewn with pearls. The merchant hired a small army to tend them, and the great procession made a dazzling sight upon the road.
        - id: ch03-b05
          speaker: narrator
          text: From far away, Wali Dad saw the caravan's cloud of dust and all its glittering ornaments.
        - id: ch03-b06
          speaker: wali_dad
          text: By Allah, what a grand crowd! There are elephants too. Grass should sell very well today!
        - id: ch03-b07
          speaker: narrator
          text: Once again, he rushed to the jungle and cut grass as quickly as he could. When he got back, the caravan stood at his door. The merchant was waiting, rather anxiously, to congratulate him on his new riches.
        - id: ch03-b08
          speaker: wali_dad
          text: Riches? What use are riches to an old man with one foot in the grave? That beautiful young princess could enjoy these fine things. Keep two horses, two camels, and two elephants with all their trappings. Please take everything else to her.
        - id: ch03-b09
          speaker: narrator
          text: At first, the merchant objected. He explained that these repeated missions were growing awkward, and they made him nervous. It was true that he had been richly repaid for every expense. Even so, he did not like visiting the same royal families again and again with ever greater gifts.
        - id: ch03-b10
          speaker: narrator
          text: At last, he agreed to go once more. Secretly, he vowed that nothing would ever draw him into another such undertaking. After resting for a few days, he set off again for Khaistan.
        - id: ch03-b11
          speaker: narrator
          text: The King of Khaistan saw the gorgeous line of people and animals entering his palace courtyard. He hurried down himself to ask what it meant. When he heard that the so-called princely Wali Dad had sent all this to his daughter, he was struck speechless.
        - id: ch03-b12
          speaker: narrator
          text: He hurried to the princess's rooms.
        - id: ch03-b13
          speaker: king
          text: My dear, I know what this means. The man wants to marry you. Why else would he send all these gifts? We must visit him ourselves. He must be immensely wealthy, and since he is so devoted to you, you might do worse than marry him.
        - id: ch03-b14
          speaker: narrator
          text: The princess agreed with her father. Orders went out without delay for great numbers of elephants and camels, brilliant tents and flags, litters to carry the ladies, and horses for all the men. A vast royal company was prepared. The king and his daughter would travel in person to visit the great and generous Prince Wali Dad, and the merchant was commanded to guide the entire party.
        - id: ch03-b15
          speaker: narrator
          text: The unfortunate merchant would gladly have run away. But everyone treated him with such generous hospitality as Wali Dad's representative that he got no real peace and never had a chance to slip off. After several days, despair took hold of him. Whatever happened must be his fate, and escape seemed impossible. He could only pray that some turn of fortune would free him from the trouble his good intentions had caused.
        - id: ch03-b16
          speaker: narrator
          text: On the seventh day, the royal party departed. Cannons thundered from the city walls. Dust rose, people cheered, and trumpets blared.
    - id: ch04
      title: At the Edge of the Cliffs
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The procession traveled on day after day, while the poor merchant grew more sick and miserable. Almost every night, he lay awake wondering what sort of death the king would devise once the truth came out. His thoughts tortured him so badly that it felt as if the king's executioners had already begun their work upon his neck.
        - id: ch04-b02
          speaker: narrator
          text: At last, they camped only one day's march from Wali Dad's little mud hut. The merchant was sent ahead to announce that the King and Princess of Khaistan had come to meet him.
        - id: ch04-b03
          speaker: narrator
          text: He found the old man eating his evening meal of onions and dry bread. Once he had told the whole story, he could not bring himself to utter the angry words he had planned.
        - id: ch04-b04
          speaker: narrator
          text: Wali Dad was overcome by grief and shame. He grieved for himself, for the friend who had been caught in this trouble, and for the princess's name and honor. He wept, tugged at his beard, and groaned so miserably that the merchant had no heart to blame him.
        - id: ch04-b05
          speaker: wali_dad
          text: Please find some excuse and hold them there for one more day. Come back in the morning, and we will decide what to do.
          emotion: sad
        - id: ch04-b06
          speaker: narrator
          text: When the merchant had gone, Wali Dad decided there was only one honorable escape from the shame his foolishness had caused. He would end his own life.
        - id: ch04-b07
          speaker: narrator
          text: Without asking anyone for advice, he left in the middle of the night. He went where the river twisted below enormous rocky cliffs. There, he meant to throw himself down.
        - id: ch04-b08
          speaker: narrator
          text: Wali Dad stepped back, ran toward the edge, and stopped short above the dreadful black gulf. He could not do it.
        - id: ch04-b09
          speaker: narrator
          text: Far below, hidden in the deep shadows of night, water roared and boiled around jagged rocks. Wali Dad knew the place well enough to picture it, but the sightless darkness made it seem ten times more merciless and forbidding. Wind sighed fearfully through the gorge. Bushes and grasses on the cliff ledges looked like dim living creatures that danced and beckoned to him.
        - id: ch04-b10
          speaker: narrator
          text: An owl cried, “Hoo! Hoo!” almost in his face as he peered over the edge. Wali Dad sprang back, sweating with terror. He was afraid. Shuddering, he covered his face and wept aloud.
        - id: ch04-b11
          speaker: narrator
          text: After a while, a soft light appeared before him. Could morning already be coming to expose his disgrace? He lowered his hands and saw two lovely beings. At once, he knew they were not mortal. They were Peris from Paradise.
        - id: ch04-b12
          speaker: first_peri
          text: Why are you crying, old man?
        - id: ch04-b13
          speaker: narrator
          text: Her voice was as clear and musical as the song of a bulbul.
        - id: ch04-b14
          speaker: wali_dad
          text: I am crying because I am ashamed.
          emotion: sad
        - id: ch04-b15
          speaker: second_peri
          text: Why have you come to this place?
        - id: ch04-b16
          speaker: wali_dad
          text: I came here to die.
          emotion: sad
        - id: ch04-b17
          speaker: narrator
          text: The Peris questioned him further, and Wali Dad confessed the entire story.
    - id: ch05
      title: The Peris' Gift
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The first Peri stepped forward and rested a hand on Wali Dad's shoulder. At once, he felt something strange happening, though he could not tell what it was.
        - id: ch05-b02
          speaker: narrator
          text: His old cotton rags became beautiful linen and embroidered cloth. Warm, soft shoes covered his hard, bare feet, and a great jeweled turban appeared on his head. A heavy gold chain circled his neck.
        - id: ch05-b03
          speaker: narrator
          text: Even the small, bent sickle at his waist was transformed. In its place hung a splendid scimitar, with an ivory handle that shone in the pale light like snow under the moon.
        - id: ch05-b04
          speaker: narrator
          text: While he stood there as if in a dream, the second Peri waved her hand and told him to turn around. A noble gateway now stood open before him.
        - id: ch05-b05
          speaker: narrator
          text: The Peris led him along an avenue of giant plane trees. He could only follow in silent amazement. Where his hut had stood, a magnificent palace blazed with countless lights.
        - id: ch05-b06
          speaker: narrator
          text: Servants hurried through the palace's great porches and verandas. Guards paced back and forth and saluted Wali Dad respectfully as he approached. The Peris led him along mossy paths and across broad green lawns. Fountains played around him, and flowers filled the air with their scent. Wali Dad could only stand there, stunned and helpless.
        - id: ch05-b07
          speaker: first_peri
          text: Do not be afraid. Go into your home, and know that God rewards the simple-hearted.
          emotion: calm
        - id: ch05-b08
          speaker: narrator
          text: With those words, both Peris disappeared and left him alone. Wali Dad walked toward the palace, still thinking that he must be inside a dream. The servants received him as their master, and before long he retired to rest in a splendid room. It was far grander than anything he had ever imagined.
        - id: ch05-b09
          speaker: narrator
          text: Morning came. Wali Dad awoke and discovered that the palace, the servants, and even his own transformation were real. It had not been a dream.
        - id: ch05-b10
          speaker: narrator
          text: The merchant arrived soon after sunrise and was even more astonished than Wali Dad had been. He explained that he had not slept at all that night. At the first streak of daylight, he had left the royal camp and set out to find his friend.
        - id: ch05-b11
          speaker: merchant
          text: What a search I had! During the night, a great stretch of wild jungle became parks and gardens. I could not find your hut anywhere. If some of your new servants had not found me and brought me to this palace, I would have run away. I truly thought all this trouble had driven me mad, and everything I saw was only in my imagination.
        - id: ch05-b12
          speaker: narrator
          text: Wali Dad told him what had happened. Following the merchant's advice, he invited the King and Princess of Khaistan to be his guests. The invitation included every person with them, down to the humblest servant in the camp.
    - id: ch06
      title: The Wedding at Wali Dad's Palace
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: For three full days and three nights, Wali Dad held a great feast in honor of his royal guests. Each evening, the king and all his nobles were served their food on golden plates and their drink in golden cups. The less important people in the company were served on silver plates and drank from silver cups.
        - id: ch06-b02
          speaker: narrator
          text: At the end of every evening, each guest was asked to keep the plate and cup they had used as a remembrance of the occasion. No one there had ever seen such splendor. Besides the great dinners, the guests enjoyed sports and hunting, dances, and amusements of every kind throughout the three days.
        - id: ch06-b03
          speaker: narrator
          text: On the fourth day, the King of Khaistan drew his host aside. He asked whether Wali Dad truly wished to marry the princess, as the king had suspected.
        - id: ch06-b04
          speaker: wali_dad
          text: I thank you deeply for such an honor, but I never dreamed of it. I am much too old and ugly for so beautiful a lady. Please stay here while I send for the Prince of Nekabad. He is excellent, brave, and honorable, and I am sure he would be glad to try to win your daughter's hand.
        - id: ch06-b05
          speaker: narrator
          text: The king agreed to remain as Wali Dad's guest. Wali Dad sent the merchant to Nekabad, accompanied by a number of attendants and carrying handsome gifts for the prince. The invitation and presents pleased the young man so greatly that he came to the palace at once.
        - id: ch06-b06
          speaker: narrator
          text: The prince fell completely in love with the princess. They were married at Wali Dad's palace, and the celebrations began all over again.
        - id: ch06-b07
          speaker: narrator
          text: In time, the King of Khaistan returned to his country, and the Prince and Princess of Nekabad returned to theirs.
        - id: ch06-b08
          speaker: narrator
          text: Wali Dad lived to a fine old age. He helped everyone who was in trouble, and through all his prosperity he kept the simple, generous heart he had possessed when he was only Wali Dad Gunjay, the grass cutter.
        - id: ch06-b09
          speaker: narrator
          text: This story was told to the author by an Indian storyteller.
