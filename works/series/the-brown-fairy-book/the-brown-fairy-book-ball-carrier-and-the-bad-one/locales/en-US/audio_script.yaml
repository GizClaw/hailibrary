audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, grave, and attentive to wonder
        timbre: clear and resonant
        pace: measured
        pitch: medium
    ball_carrier:
      display_name: Ball-Carrier
      tts:
        delivery: brave, quick-witted, and youthful
        timbre: clear and young
        pace: lively
        pitch: medium-high
    witch:
      display_name: The Old Witch
      tts:
        delivery: coaxing, cunning, and grandmotherly
        timbre: dry and aged
        pace: unhurried
        pitch: medium-low
    bad_one:
      display_name: The Bad One
      tts:
        delivery: greedy, domineering, and easily enraged
        timbre: deep and heavy
        pace: forceful
        pitch: low
    lung_woman:
      display_name: Lung-Woman
      tts:
        delivery: obedient, suspicious, and easily tempted
        timbre: rough and mature
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Witch's Ball
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Far, far inside a forest stood two little huts. In each hut lived a famous hunter with his wife and three or four children. The children were never allowed to play far from the door. Across the woods, near the great river, lived a witch who stole children with a magic ball.
        - id: ch01-b02
          speaker: narrator
          text: Her trick was simple, and it had never failed. Whenever she wanted a child, she threw the ball toward the child's home, however distant it was. The ball always arrived. The moment a child saw it, it began to roll back toward the witch. It stayed just far enough ahead to make the child think one more step would catch it. No child ever did, and no parent ever saw that child again.
        - id: ch01-b03
          speaker: narrator
          text: The mothers and fathers did everything they could to find their lost children. But the forest was enormous. The witch was cunning enough to know exactly where each search would go, and she always kept out of the way. There were wolves, too, roaming in great packs through the winter woods. Any missing child might have been eaten by them. So the parents could never know what had happened or where else to search.
        - id: ch01-b04
          speaker: narrator
          text: One day the old witch decided she wanted a little boy. She flung her ball toward the hunters' huts. Outside one hut, a boy was practicing with his bow and arrows. Then he saw the ball. It was glass, frosted all over, with blue, green, and white shifting into one another. He dropped his bow and bent to pick it up.
        - id: ch01-b05
          speaker: narrator
          text: The ball gently rolled downhill. It was so close that the boy could not bear to let it go, and he chased after it. It always stayed within reach, yet his fingers never closed around it. The farther it rolled, the faster it went, and the more excited he became. That time he nearly touched it. No, he missed by the width of a hair. Now it was just ahead of him. If he gave one great spring and landed in front of it, surely he could stop it.
        - id: ch01-b06
          speaker: narrator
          text: He leaped, tripped, and fell. When he looked up, he was inside the witch's house.
        - id: ch01-b07
          speaker: witch
          text: Welcome, welcome, grandson! Get up and rest. You have walked a long way, and you must be tired.
        - id: ch01-b08
          speaker: narrator
          text: The boy sat down. The witch gave him a bowl of food unlike anything he had ever tasted, and he found it delicious. He ate every bite. Then she asked whether he had ever fasted.
        - id: ch01-b09
          speaker: ball_carrier
          text: No. Well, sometimes I had to go without eating, but never when there was food.
        - id: ch01-b10
          speaker: witch
          text: If you want the spirits to make you strong and wise, you must fast. The sooner you begin, the better.
        - id: ch01-b11
          speaker: ball_carrier
          text: Very well. What must I do first?
        - id: ch01-b12
          speaker: witch
          text: Lie down on those buffalo skins beside the door.
        - id: ch01-b13
          speaker: narrator
          text: The boy lay down on the buffalo skins. While he fasted, squirrels, little bears, and birds came near and talked with him. He remained there without food as one day followed another. Ten days passed before the old woman returned, carrying a bowl of the same food he had eaten before.
        - id: ch01-b14
          speaker: witch
          text: Get up, grandson. You have fasted long enough. Did the good spirits visit you? Did they give you the strength and wisdom you wanted?
        - id: ch01-b15
          speaker: ball_carrier
          text: Some came and gave me a share of both. But many of them stayed away.
        - id: ch01-b16
          speaker: witch
          text: Then you must fast for ten more days.
        - id: ch01-b17
          speaker: narrator
          text: Again he lay on the buffalo skins and fasted for ten days. When those days were over, he did not stop. He turned his face toward the wall and stayed there without eating for twenty days more. At last, after all that time, the witch called to him.
        - id: ch01-b18
          speaker: witch
          text: Come and eat something, grandson.
        - id: ch01-b19
          speaker: narrator
          text: He rose at her voice and ate everything she gave him. When the bowl was empty, she questioned him again.
        - id: ch01-b20
          speaker: witch
          text: After all these days of fasting, surely the good spirits have visited you.
        - id: ch01-b21
          speaker: ball_carrier
          text: Not all of them, grandmother. Some still keep away. They say I have not fasted long enough.
        - id: ch01-b22
          speaker: witch
          text: Then fast again until every good spirit has given you a gift. Not one may be missing.
        - id: ch01-b23
          speaker: narrator
          text: The boy gave no answer. For the third time he stretched out on the buffalo skins, and for another twenty days he ate nothing. At the end, his face had gone white. His body lay so still that the witch believed he was dead. But she fed him from her bowl. Little by little his strength returned, and before long he could raise himself and sit up.
        - id: ch01-b24
          speaker: witch
          text: You have fasted longer than anyone before you. The good spirits must be satisfied now.
        - id: ch01-b25
          speaker: ball_carrier
          text: Yes, grandmother. They all came, and every one gave me a gift.
    - id: ch02
      title: The Journey to the Great River
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The answer delighted the old woman. She brought another bowl, and while the boy ate, she told him why she had trained him.
        - id: ch02-b02
          speaker: witch
          text: >-
            Far beyond the great river stands the Bad One's home. His house holds plenty of gold. But he owns something more precious than gold: a little bridge. When he waves his hand, it grows long enough to cross any river or sea. I want that bridge and some of his gold. That is why I have stolen so many boys with my ball. I tried to teach them to win the good spirits' gifts, but none would fast long enough. In the end, I sent them on small, easy errands instead. You were strong and faithful. If you follow my words, you can do this. At the river, tie the ball to your foot. It will carry you across, and nothing else can. Do not fear. Trust the ball, and you will be safe.
        - id: ch02-b03
          speaker: narrator
          text: The boy took the magic ball and tucked it into a bag. Then he made himself a club and a bow. He made arrows, too, and the strength given by the good spirits would send them farther than anyone else's arrows. The spirits had given him other gifts. He could change his shape, and his eyes and ears had grown so quick that nothing could escape his notice. They also made him understand, in some mysterious way, that if he ever needed more help, they would give it.
        - id: ch02-b04
          speaker: narrator
          text: When the weapons and the bag were ready, the boy said farewell to the witch and set out alone. He walked through the forest for several days. No person crossed his path. He saw only his old friends, the squirrels, the little bears, and the birds that had visited him while he fasted. He stopped and spoke with every one of them, but he took care never to reveal where he was going.
        - id: ch02-b05
          speaker: narrator
          text: At last, after many days, he reached the great river. On the far side, he noticed a small hut standing on a hill. He guessed that it must be the Bad One's home. But the stream rushed past so swiftly that he could not see how anyone might cross it. To test the current, he broke a branch from a tree and threw it into the water. It seemed hardly to touch the surface before the river snatched it away. Even the boy's magic sight could not follow it.
        - id: ch02-b06
          speaker: narrator
          text: The boy was frightened, but he hated to abandon anything he had begun. He tied the ball to his right foot and stepped onto the river. To his surprise, he could stand. Then panic seized him, and he scrambled back onto the bank.
        - id: ch02-b07
          speaker: narrator
          text: After a minute or two, he gathered enough courage to try again. He stepped back onto the racing water and went farther this time. But when he looked across the great width still before him, fear overcame him, and once more he retreated to the bank. Now he felt ashamed of his cowardice. The ball had already proved that it could support him. So he forced himself to try a third time. He kept going, trusted the magic ball beneath his foot, and at last reached the other side safely.
    - id: ch03
      title: Inside the Bad One's House
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The boy put the ball back in its bag and carefully looked around. The door of the Bad One's hut stood open. Great wooden beams held up the roof, and from those beams hung bags of gold and the little bridge. In the middle of his treasures sat the Bad One, eating his dinner and drinking from a horn.
        - id: ch03-b02
          speaker: narrator
          text: The boy knew he needed a plan to draw the Bad One away. Otherwise, he could never take the bridge or the gold. He considered screaming as though someone were hurting him, but the Bad One would not care. He thought of calling the Bad One by name, but such a cunning creature would suspect a trick. Then the right idea came, and the boy jumped for joy.
        - id: ch03-b03
          speaker: ball_carrier
          text: Oh, why didn't I think of that before?
        - id: ch03-b04
          speaker: narrator
          text: With all his might, he wished the Bad One would become terribly hungry, too hungry to wait while anyone fetched fresh food. At that very moment, the Bad One shouted to his servant.
        - id: ch03-b05
          speaker: bad_one
          text: This food would not fill a sparrow! Bring me more at once. I am starving!
          emotion: angry
        - id: ch03-b06
          speaker: narrator
          text: He gave the woman no time to visit the larder. He rose from his chair and staggered hungrily toward the kitchen.
        - id: ch03-b07
          speaker: narrator
          text: As soon as the door shut behind him, the boy dashed inside. He pulled a gold bag from a beam and tucked it beneath his left arm. Then he unhooked the little bridge and held it beneath his right. He did not run away as most boys his age would have done. The spirits' wisdom warned him that the Bad One would follow his footprints and catch him before he reached the river.
        - id: ch03-b08
          speaker: narrator
          text: Instead of fleeing, he used the spirits' gift to make himself very small and thin. In one corner stood a heap of buffalo skins. He squeezed behind them, but before hiding himself completely, he tore a narrow slit through one skin. From there he could remain hidden and still see everything that happened in the room.
        - id: ch03-b09
          speaker: narrator
          text: He had barely settled when the servant came in. The last gold bag dropped from the beam as she entered. In fact, all the bags had begun falling as soon as the boy took the first. She called out that someone had stolen a bag and the bridge.
        - id: ch03-b10
          speaker: narrator
          text: The Bad One rushed back, wild with anger. He ordered her to search for footprints outside so they could discover where the thief had gone. She soon returned. There were no tracks leading toward the river, so the thief had to be in the house. She shifted every piece of furniture but found no Ball-Carrier.
        - id: ch03-b11
          speaker: lung_woman
          text: He must be hiding here somewhere.
        - id: ch03-b12
          speaker: narrator
          text: She examined the buffalo skins for a second time. Ball-Carrier knew he could not escape now, so he quickly wished that the Bad One would be unable to eat any more food for the present.
        - id: ch03-b13
          speaker: lung_woman
          text: Ah! This skin has a slit in it. Here he is!
          emotion: surprised
        - id: ch03-b14
          speaker: narrator
          text: She shook the skin and pulled him out. He was so lean and small that he would scarcely have been one mouthful for a sparrow.
        - id: ch03-b15
          speaker: bad_one
          text: Did you steal my gold and my bridge?
        - id: ch03-b16
          speaker: ball_carrier
          text: Yes. I took them.
        - id: ch03-b17
          speaker: narrator
          text: The Bad One made a sign to Lung-Woman, and she demanded to know where the stolen things were hidden. The boy raised his left arm, the arm beneath which he had tucked the gold. She picked up a knife and scraped along his skin until not one bit of gold remained clinging to him.
        - id: ch03-b18
          speaker: lung_woman
          text: And where did you put the bridge?
        - id: ch03-b19
          speaker: narrator
          text: He raised his right arm, and she took the bridge from him. The Bad One watched with satisfaction.
        - id: ch03-b20
          speaker: bad_one
          text: Make certain he cannot run away. Boil the water and prepare him for cooking. I am going to invite my friends, the water-demons, to our feast.
    - id: ch04
      title: The Kettle
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Lung-Woman pinched Ball-Carrier between one finger and her thumb. She was about to carry him into the kitchen when he spoke.
        - id: ch04-b02
          speaker: ball_carrier
          text: I am so thin and small that cooking me is hardly worth the trouble. Keep me for two days and feed me well. Then I will grow big and fat. If your water-demon friends saw the feast you have now, they would think you were making fun of them.
        - id: ch04-b03
          speaker: bad_one
          text: Perhaps you are right. I will keep you for two days.
        - id: ch04-b04
          speaker: narrator
          text: The Bad One went out to visit the water-demons. His servant's name was Lung-Woman. She led Ball-Carrier to a small shed and chained him to a ring in the wall. Every hour, she brought him food. After two days, he was as fat and big as a Christmas turkey. He could barely turn his head from side to side.
        - id: ch04-b05
          speaker: narrator
          text: The Bad One often came to inspect him. Now he decided Ball-Carrier was ready.
        - id: ch04-b06
          speaker: bad_one
          text: He will do. I am going to tell the water-demons to come for dinner tonight. Put the kettle on the fire, and do not taste the broth for any reason.
        - id: ch04-b07
          speaker: narrator
          text: Lung-Woman obeyed at once. She built up the low fire and filled the kettle with water. A rope hung from the ceiling. She passed it through the kettle's handle and swung the kettle over the flames. Then she brought in Ball-Carrier.
        - id: ch04-b08
          speaker: narrator
          text: When he saw the preparations, the boy made two wishes. As long as he remained inside the kettle, the water must only seem to boil. It could hiss and bubble, but it must not truly burn him. And the spirits must change that water into fat.
        - id: ch04-b09
          speaker: narrator
          text: Soon the kettle began to sing and bubble, and Lung-Woman lifted Ball-Carrier into it. Before long, the fat meant for the sauce rose to the surface. As the boy bobbed from one side to the other, he called to her.
        - id: ch04-b10
          speaker: ball_carrier
          text: You should taste the broth. I think it needs some salt.
        - id: ch04-b11
          speaker: narrator
          text: Lung-Woman knew her master had forbidden it. But once Ball-Carrier put the thought into her mind, the smell from the kettle seemed so delicious that she took a long ladle from the wall and dipped it into the broth.
        - id: ch04-b12
          speaker: ball_carrier
          text: Standing so far away will make you spill it. Why not come closer?
        - id: ch04-b13
          speaker: narrator
          text: Lung-Woman stepped nearer. Ball-Carrier called on the spirits to restore his usual size and strength and make the water scalding hot. Then he kicked the kettle over. All the boiling water poured across Lung-Woman. He jumped over her body and took the gold and bridge again. He picked up his club, bow, and arrows, set fire to the Bad One's hut, and ran down to the river. The magic bridge carried him safely across.
    - id: ch05
      title: The End of the Bad One
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The Bad One's hut was built of wood, so the flames consumed it quickly. It had burned all the way to the ground before he returned with a great crowd of water-demons. They found no sign of any person or any treasure. The Bad One hurried on toward the river. When he reached the bank, he saw Ball-Carrier across the water, sitting there quietly and eating an apple.
        - id: ch05-b02
          speaker: narrator
          text: The Bad One understood what had happened. He told the water-demons there would be no feast after all. Then he called across the river to Ball-Carrier.
        - id: ch05-b03
          speaker: bad_one
          text: Now I know your name. You have ruined me, and I am no longer rich. Will you take me as your servant?
        - id: ch05-b04
          speaker: ball_carrier
          text: Yes, I will, even though you tried to kill me.
        - id: ch05-b05
          speaker: narrator
          text: As he answered, Ball-Carrier threw the bridge across the water. The Bad One started over it. But when he reached the middle of the river, the boy wished the bridge small. The Bad One fell into the current and drowned.
        - id: ch05-b06
          speaker: narrator
          text: And the world was rid of him.
