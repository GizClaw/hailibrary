audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 清楚从容，像在为听众介绍一本古老的童话集
        timbre: 温暖明净
        pace: 舒缓
        pitch: 中音
    ball_carrier:
      display_name: 持球童
      tts: {delivery: 机灵勇敢，话语干脆, timbre: 清亮稚嫩, pace: 适中, pitch: 中高音}
    witch:
      display_name: 老女巫
      tts: {delivery: 亲热中带着神秘与算计, timbre: 苍老低哑, pace: 缓慢, pitch: 中低音}
    bad_one:
      display_name: 恶魔
      tts: {delivery: 贪婪凶狠，盛气凌人, timbre: 粗重阴沉, pace: 沉缓, pitch: 低音}
    lung_woman:
      display_name: 肺婆
      tts: {delivery: 粗鲁顺从，容易受诱惑, timbre: 沙哑成熟, pace: 适中, pitch: 中低音}
  chapters:
    - id: ch01
      title: 女巫的魔球
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            森林很深很深的地方，有两间小屋。每间屋里都住着一位有名的猎人、他的妻子，还有三四个孩子。大人只许孩子在家门附近玩，稍远一点都不行。因为穿过森林，在大河边住着一个女巫。她有一只带魔力的球，专门拿它拐走孩子。
        - id: ch01-b02
          speaker: narrator
          text: >-
            这办法简单，却从没失手。女巫想要哪个孩子，就把球朝那孩子家扔。不管有多远，球都能滚到。孩子一看见它，它就慢慢往女巫家滚，总在前面差那么一点，仿佛下一刻便能捉住。可孩子追了一程又一程，始终差那么一点，最后再也回不了家。丢了孩子的父母当然出去寻找，可森林太大，女巫又能猜到他们会搜哪一带，总是早早躲开。冬天林中还有成群的狼，人们难免以为，孩子也许已经被狼吃了。
        - id: ch01-b03
          speaker: narrator
          text: >-
            一天，老女巫想弄个小男孩来，便把球扔向猎人的小屋。一个孩子正在屋外用弓箭射靶。一看见那只玻璃球，他立刻扔下弓。球上像蒙着白霜，里面的蓝、绿、白不断变幻。男孩才弯腰去捡，它就轻轻滚下山坡。球明明那么近，他怎么肯让它溜走？于是拔腿去追。球一直像是伸手就能够到，却越滚越快，男孩也越追越兴奋。这一下，他差一点碰到了，只差一根头发那么远。只要再往前一跃，准能抢到球前面。可他猛扑出去，脚下却绊了一跤。抬头一看，自己竟到了女巫家里。
        - id: ch01-b04
          speaker: witch
          text: 欢迎，欢迎，我的外孙！快起来歇歇吧。你走了这么远的路，我知道你一定累坏了。
        - id: ch01-b05
          speaker: narrator
          text: >-
            男孩坐下来，吃了女巫递来的一碗东西。那滋味和他从前吃过的一切都不同，他觉得好吃极了。等他连最后一点也吃干净，女巫便问他以前禁过食没有。
        - id: ch01-b06
          speaker: ball_carrier
          text: 没有。有时候没东西吃，我也只好饿肚子。可只要找得到食物，我就不会挨饿。
        - id: ch01-b07
          speaker: witch
          text: 想让神灵赐给你力量和智慧，你就得禁食。越早开始越好。
        - id: ch01-b08
          speaker: ball_carrier
          text: 好吧，那我先做什么？
        - id: ch01-b09
          speaker: witch
          text: 躺到屋门边那些野牛皮上去。
        - id: ch01-b10
          speaker: narrator
          text: 男孩依言躺下。松鼠、小熊和鸟儿都来陪他说话。
    - id: ch02
      title: 神灵的恩赐
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 十天后，老妇人端来一碗和上次一样的食物。
        - id: ch02-b02
          speaker: witch
          text: 起来吧，我的外孙。你禁食得够久了。善良的神灵来看过你吗？他们把你想要的力量和智慧赐给你了吗？
        - id: ch02-b03
          speaker: ball_carrier
          text: 来过几个，也给了我一些力量和智慧。可还有许多没有来。
        - id: ch02-b04
          speaker: witch
          text: 那你再禁食十天。
        - id: ch02-b05
          speaker: narrator
          text: >-
            男孩又躺到野牛皮上，十天没有进食。十天到了，他把脸转向墙壁，又接着熬了二十天。女巫终于叫他起来吃东西。他一听见她的声音，就站起身，把她带来的食物吃得一点不剩。女巫又像上次那样问，他饿了这么多天，那些神灵是不是全都来过了。
        - id: ch02-b06
          speaker: ball_carrier
          text: 还没有，外祖母。仍有几个不肯来。他们说，我饿得还不够久。
        - id: ch02-b07
          speaker: witch
          text: 那就再来一次。一直等到每一位善良的神灵都把恩赐给你，一个也不能少。
        - id: ch02-b08
          speaker: narrator
          text: >-
            男孩没有作声，第三次躺到野牛皮上，又禁食了二十天。最后，他脸色白得吓人，身体纹丝不动，女巫还以为他已经死了。她一点点把碗里的食物喂进他嘴里，他才渐渐恢复力气，不久便能坐起来。
        - id: ch02-b09
          speaker: witch
          text: 你禁食得比任何人都久。这一回，善良的神灵总该满意了吧？
        - id: ch02-b10
          speaker: ball_carrier
          text: 是的，外祖母。他们全都来了，也给了我各自的恩赐。
        - id: ch02-b11
          speaker: narrator
          text: 老妇人十分高兴，又端来一盆食物。男孩吃着，她便说出了真正的打算。
        - id: ch02-b12
          speaker: witch
          text: >-
            大河对岸很远的地方，住着恶魔。他家中有许多黄金，还有一座比黄金更宝贵的小桥。他只要挥挥手，桥就会越伸越长，再宽的河、再大的海都能跨过去。我想把那座桥据为己有，也想拿到一些黄金，这才用魔球带回许多男孩。我也教过他们怎样求取善良神灵的恩赐，可他们都不肯禁食足够久。最后，我只能派他们去做些简单容易的小事。你不一样。你既坚强又忠实，只要听我的话，一定办得到。走到河边，把这只球绑在脚上，只有它能带你过去。千万别害怕，只管相信魔球，你一定会平安无事。
        - id: ch02-b13
          speaker: narrator
          text: >-
            男孩把球装进袋里，又为自己做了一根木棒、一张弓和几支箭。神灵给了他力量，他的箭因此比任何人的都射得远。他还能随意改变身形，眼睛和耳朵也变得异常敏锐，周围的任何动静都逃不过他。更奇妙的是，他心里明白，只要再遇到难处，神灵仍会帮助他。
    - id: ch03
      title: 大河对岸
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            一切备好，男孩辞别女巫，在林中走了好几天。路上一个人也没有，只有松鼠、熊和鸟儿这些老朋友。每次遇见它们，他都会停下来聊上几句，却始终小心守住秘密，没有透露自己要去哪里。许多天后，他来到大河边，看见对岸小山上有一间屋子，猜出那就是恶魔的家。
        - id: ch03-b02
          speaker: narrator
          text: >-
            水流快得可怕。男孩想先试试它有多急，便折下一根树枝扔进去。树枝仿佛还没碰到水，眨眼间就没了踪影，连他那双有魔力的眼睛也追不上。他忍不住害怕，可已经决定的事，他最不愿半途而废。于是，他把球绑在右脚上，小心踩上河面。出乎意料，球稳稳托住了他，他却突然慌了，手脚并用地爬回岸上。过了一两分钟，他攒起勇气又试一次。这回多走了几步，可一抬头，看见大河宽得望不到尽头，他再次退了回来。男孩心里有些羞愧。魔球明明托得住自己，再这样胆怯怎么行？第三次，他终于没有回头，平安走到了对岸。
        - id: ch03-b03
          speaker: narrator
          text: >-
            男孩上了岸，把球收回袋里，仔细往四周看。恶魔的屋门敞着，屋顶靠几根粗大木梁撑住。梁上挂着一袋袋黄金，还有那座小桥。恶魔就坐在财宝中间吃饭，用角杯喝着东西。不把他引走，就绝对拿不到宝物。该怎么办？装出痛苦的尖叫吗？恶魔根本不会在乎外面的人是否正被杀害。直接喊他的名字吗？这个狡猾的家伙一定会怀疑有诈。非得找个更好的办法不可。忽然，男孩有了主意，高兴得轻轻跳了一下。
        - id: ch03-b04
          speaker: ball_carrier
          text: 我怎么早没想到呢！
        - id: ch03-b05
          speaker: narrator
          text: >-
            他集中全部心思许下愿望，要让恶魔饿得连一刻也等不了，必须马上得到新的食物。愿望立刻实现了。
        - id: ch03-b06
          speaker: bad_one
          text: 你拿来的东西连麻雀也喂不饱！快去再取些，我都要饿死了！
          emotion: angry
        - id: ch03-b07
          speaker: narrator
          text: >-
            恶魔连仆人走去储藏室的工夫都等不及，自己从椅子上站起来，饿得摇摇晃晃，连滚带爬直奔厨房。门一关，男孩就冲进屋，从梁上扯下一袋黄金，夹在左臂下，又摘下小桥，塞到右臂下。他没有像别的孩子那样立刻逃跑。神灵给他的智慧提醒他，自己还没赶到河边架起小桥，恶魔就会沿着脚印追上来。男孩便把自己变得又小又薄，躲到墙角一堆野牛皮后面。他还先在一张牛皮上撕了道缝，好看清屋里的动静。
        - id: ch03-b08
          speaker: narrator
          text: >-
            他刚藏好，仆人便进来了。就在她跨进屋门时，梁上的最后一袋黄金落在地上。原来，从第一袋被取下以后，其余金袋就接连往下掉。仆人大声告诉恶魔，有人偷了一袋黄金和小桥。恶魔气得发狂，冲进屋来，命她到外面找脚印，看看贼逃往哪里。她很快回来，说地上没有通向河边的脚印，贼一定还在屋里。接着，她把屋里的家具一件件挪开，却始终没找到持球童。
        - id: ch03-b09
          speaker: lung_woman
          text: 他一定藏在这里的什么地方。
        - id: ch03-b10
          speaker: narrator
          text: >-
            她第二次翻查那堆野牛皮。持球童知道躲不过去了，赶紧许愿，让恶魔眼下再也吃不下东西。
    - id: ch04
      title: 大锅里的计策
      blocks:
        - id: ch04-b01
          speaker: lung_woman
          text: 啊，这张皮上有道缝！他就在这里！
          emotion: surprised
        - id: ch04-b02
          speaker: narrator
          text: 她把男孩揪了出来。他变得又瘦又小，连麻雀吃一口都嫌不够。
        - id: ch04-b03
          speaker: bad_one
          text: 我的黄金和桥，是你拿走的吗？
        - id: ch04-b04
          speaker: ball_carrier
          text: 是我拿的。
        - id: ch04-b05
          speaker: narrator
          text: >-
            恶魔朝女人使了个眼色，她便逼问男孩把东西藏在哪里。男孩抬起夹着黄金的左臂。她拿起一把刀，在他的皮肤上刮了又刮，连粘在上面的一点金屑也不肯留下。
        - id: ch04-b06
          speaker: lung_woman
          text: 那座桥呢？你把它藏在哪里？
        - id: ch04-b07
          speaker: narrator
          text: 男孩又抬起右臂。她拿走小桥，恶魔满意地笑了。
        - id: ch04-b08
          speaker: bad_one
          text: 看紧他，别让他逃掉。烧一锅水，把他收拾好等着下锅。我去请水魔朋友们来赴宴。
        - id: ch04-b09
          speaker: narrator
          text: 女人用两根手指捏起持球童，正要把他送进厨房，他连忙开口。
        - id: ch04-b10
          speaker: ball_carrier
          text: >-
            我现在这么瘦小，根本不值得费事去煮。把我多留两天，给我许多食物，让我每顿都吃饱，我就会长得又大又肥。照我现在这个样子，要是水魔朋友来了，只看见宴席上有这么一点东西，他们准会以为你故意拿他们取笑。
        - id: ch04-b11
          speaker: bad_one
          text: 也许你说得对。那就留你两天。
        - id: ch04-b12
          speaker: narrator
          text: >-
            恶魔出门拜访水魔。那个仆人名叫肺婆，她把男孩带进一间小棚屋，用锁链拴在墙上的铁环上。接下来，她每隔一个钟头便送来食物。两天以后，持球童已经肥大得像一只圣诞火鸡，连脑袋都很难从一边转到另一边。恶魔这两天不断跑来看他长得怎样，这回终于满意了。
        - id: ch04-b13
          speaker: bad_one
          text: >-
            现在正合适。我去告诉水魔，今晚请他们来吃饭。你把锅架到火上。记住，无论如何都不许尝汤。
        - id: ch04-b14
          speaker: narrator
          text: >-
            肺婆不敢耽搁，马上照办。炉火已经烧得很弱，她先添足木柴，又往锅里灌满水。接着，她把屋顶垂下的绳子穿过锅柄，将锅吊在火焰上方，这才带来持球童。男孩看着眼前的准备，便悄悄许愿。只要自己还在锅里，水就可以发出嘶嘶声，可以翻滚冒泡，却不能真的沸腾。他还求神灵把锅里的水变成油脂。
        - id: ch04-b15
          speaker: narrator
          text: >-
            大锅很快像唱歌一样咕嘟作响，持球童被放了进去。没过多久，用来调酱汁的油脂渐渐浮上水面。他在锅里一会儿漂向这边，一会儿荡到那边，便叫肺婆尝一口汤，说里面似乎还该加点盐。肺婆明明记得主人严禁她尝，可这个念头一进脑子，锅里飘出的香味就变得无法抗拒。她终于从墙上取下一柄长勺，伸进锅里舀汤。
        - id: ch04-b16
          speaker: ball_carrier
          text: 站那么远，汤会全洒出来。你怎么不靠近一点？
        - id: ch04-b17
          speaker: narrator
          text: >-
            肺婆果然走近了。持球童立刻呼唤神灵，请他们还回自己原来的身材和力气，再把锅里的水变得滚烫。愿望一成真，他就一脚踢翻大锅，沸水全泼在肺婆身上。他从她倒下的身体上跳过去，重新拿回黄金和小桥，又捡起自己的木棒、弓和箭。临走前，他放火点燃恶魔的木屋，然后飞奔到河边，借助小桥平安走到对岸。
    - id: ch05
      title: 恶魔的末日
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            木屋全由木头搭成。恶魔带着一大群水魔赶回来以前，它就已经烧成了灰烬。四周看不见一个人，也没有任何东西留下。恶魔马上赶到河边，看见持球童安安静静坐在对岸吃苹果，这才明白发生了什么。他只好告诉水魔们，今天根本没有宴席，接着隔着河向男孩喊话。
        - id: ch05-b02
          speaker: bad_one
          text: 我现在总算知道你叫什么了。你毁了我的一切，拿走了我的财宝，让我再也不是有钱人。你肯收我做仆人吗？
        - id: ch05-b03
          speaker: ball_carrier
          text: 肯，尽管你曾想杀死我。
        - id: ch05-b04
          speaker: narrator
          text: >-
            持球童一边回答，一边把小桥伸过河面。恶魔踏上桥，一步步往对岸走。等他正好走到河中央，持球童便许愿让小桥缩小。恶魔顿时一头掉进湍急的水里，活活淹死。从此以后，世上再也没有这个祸害了。
        - id: ch05-b05
          speaker: narrator
          text: 本故事收录自美国民族学局的记录。
