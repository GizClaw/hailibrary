audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 温暖庄重，以从容而清晰的语气讲述古老命运故事, timbre: 清澈浑厚, pace: 舒缓, pitch: 中音}
    prince:
      display_name: 王子
      tts: {delivery: 少年时直率活泼，成年后勇敢而重情, timbre: 明亮清朗, pace: 适中, pitch: 中高音}
    father_king:
      display_name: 王子的父王
      tts: {delivery: 慈爱而忧心，习惯以威严掩饰恐惧, timbre: 洪亮厚重, pace: 适中, pitch: 低音}
    fairy_1:
      display_name: 仙女甲
      tts: {delivery: 肃穆克制，仿佛宣读不可更改的判词, timbre: 清冷柔和, pace: 缓慢, pitch: 中高音}
    fairy_2:
      display_name: 仙女乙
      tts: {delivery: 庄重悲悯，不带夸张情绪, timbre: 空灵清晰, pace: 缓慢, pitch: 高音}
    fairy_3:
      display_name: 仙女丙
      tts: {delivery: 平静坚定，语气神秘而遥远, timbre: 柔和低回, pace: 缓慢, pitch: 中音}
    page:
      display_name: 侍童
      tts: {delivery: 恭敬谨慎，回答简洁, timbre: 年轻清亮, pace: 适中, pitch: 中高音}
    suitor_1:
      display_name: 求婚者甲
      tts: {delivery: 热心直爽，禀报时干脆利落, timbre: 年轻爽朗, pace: 适中, pitch: 中音}
    suitor_2:
      display_name: 求婚者乙
      tts: {delivery: 友善健谈，带着年轻人的热情, timbre: 清亮温和, pace: 适中, pitch: 中高音}
    suitor_3:
      display_name: 求婚者丙
      tts: {delivery: 坦率随和，说话朴实, timbre: 稳健清晰, pace: 适中, pitch: 中音}
    princess_king:
      display_name: 公主的父王
      tts: {delivery: 骄傲急躁，息怒后又显出豪爽, timbre: 威严粗厚, pace: 适中, pitch: 低音}
    princess:
      display_name: 公主
      tts: {delivery: 聪慧坚定，危急时勇敢果断, timbre: 明亮柔韧, pace: 适中, pitch: 中高音}
    crocodile:
      display_name: 鳄鱼
      tts: {delivery: 阴沉笃定，像命运本身一样不容置疑, timbre: 粗粝低沉, pace: 缓慢, pitch: 低音}
  chapters:
    - id: ch01
      title: 命运的预言
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，一位国王统治着一个大国，一条宽阔的河流从国中穿过。国王一直盼着有个儿子继承王位。小王子出生那天，他欢喜得几乎发了狂，马上派出使者，恳请所有法力高强的仙女都来看看这个非凡的婴儿。不过一两个钟头，摇篮边就挤满了仙女，孩子几乎透不过气。国王热切地望着她们，却发现她们个个神色凝重，心里顿时不安起来。
        - id: ch01-b02
          speaker: father_king
          text: 出了什么事？
        - id: ch01-b03
          speaker: narrator
          text: 仙女们望着国王，一齐摇头。
        - id: ch01-b04
          speakers: [fairy_1, fairy_2, fairy_3]
          ensemble: chorus
          text: >-
            这孩子长得真美，可惜命中注定的事终究会发生。命运之书写着，他必将死于鳄鱼、蛇或狗。我们若能救他，当然愿意，可这件事连我们也做不到。
          emotion: sad
        - id: ch01-b05
          speaker: narrator
          text: >-
            话音一落，仙女们全都消失了。国王吓得呆在原地，想起儿子将要面对的可怕厄运，心中满是恐惧。可他生性乐观，很快便开始设法搭救儿子。他立刻召来王家建筑师，命人在山顶建一座坚固的城堡，把王宫里最珍贵的东西和孩子想要的一切玩具都搬进去，还下了最严厉的命令，要卫兵日夜不停地绕着城堡巡逻。
        - id: ch01-b06
          speaker: narrator
          text: >-
            小王子和乳母们在城堡里独自生活了四五年。他每天只在宽阔的平台上透气。平台四面有高墙，墙下有壕沟，只有一座吊桥通向外面的世界。一天，他已经能独自飞快奔跑了。他从平台越过壕沟，看见对岸有一团柔软蓬松的小东西，正在蹦跳玩耍。为了防止预言应验，所有的狗都被隔绝在外，王子从没见过这种动物。他回头问身后的侍童。
        - id: ch01-b07
          speaker: prince
          text: 那个跑得飞快的小东西是什么？真有趣！
        - id: ch01-b08
          speaker: page
          text: 殿下，那是一条狗。
        - id: ch01-b09
          speaker: prince
          text: 给我找一条一样的来，我要跟它比比谁跑得快。
        - id: ch01-b10
          speaker: narrator
          text: >-
            王子一直望到小狗消失在转角。侍童可犯了难。他不能拒绝王子的要求，又记得那个可怕的预言，只好去请国王决定。
        - id: ch01-b11
          speaker: father_king
          text: 他既然想要，就给他一条吧。不给的话，他准会伤心地哭个不停。
        - id: ch01-b12
          speaker: narrator
          text: >-
            人们找来一条一模一样的小狗。两条狗简直像双胞胎，说不定本来就是。年复一年，男孩和小狗一起玩耍，直到王子长得高大强壮。终于有一天，他再也忍受不了城堡里的生活，派人给父亲送去口信。
        - id: ch01-b13
          speaker: prince
          text: >-
            为什么一直把我关在这里？出生时的预言，我早就知道了。与其这样无所事事地活着，我宁愿立刻死去。求您给我兵器，让我带着狗出去闯荡吧。
        - id: ch01-b14
          speaker: narrator
          text: >-
            国王又一次答应了儿子的请求。王子和狗乘船渡过那条宽得几乎像海一样的大河。对岸有一匹黑马拴在树上等着他。王子跨上马，随心所欲地向前驰去，狗始终紧跟在马后。终于离开山顶城堡，世上再没有比他更快活的王子了。他就这样不停地骑呀骑，不知过了多久，最后来到另一位国王的宫殿。
    - id: ch02
      title: 七十扇高窗
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            这里的国王不操心国家，也不在意百姓是否过得快活称心。他整天编谜语，还总想些本该趁早丢开的古怪主意。王子到来时，国王刚为自己的独生女儿建好一座奇妙的宫殿。宫殿有七十扇窗，每扇窗都离地七十英尺。他又派王家传令官走遍邻国边境，向所有人宣布，谁能攀上高墙，到达公主的窗口，谁就能娶她为妻。
        - id: ch02-b02
          speaker: narrator
          text: >-
            公主的美名传遍四方，许多王子都来碰碰运气。每天早晨，他们穿着各色衣裳攀在雪白的大理石墙上，远远看去就像一块块彩色斑点，整座宫殿的模样实在滑稽。有的人比别人爬得更高些，却没有一个能接近顶端。年轻王子来到时，他们已经这样试了好几天。众人见他模样讨喜，谈吐有礼，便欢迎他住进专为求婚者准备的宅院。他一路长途跋涉，大家还让人仔细为他的浴水添上香料，叫他好好洗去风尘。
        - id: ch02-b03
          speakers: [suitor_1, suitor_2, suitor_3]
          ensemble: chorus
          text: 你从哪里来？是谁家的儿子？
        - id: ch02-b04
          speaker: narrator
          text: 王子不愿暴露身份，便编了一个故事。
        - id: ch02-b05
          speaker: prince
          text: >-
            我父亲是我国国王的御马总管。母亲去世后，他又娶了妻子。继母有了自己的孩子，就恨起我来。我怕她加害，只好逃出家乡。
        - id: ch02-b06
          speaker: narrator
          text: >-
            年轻人们听了都很同情，想尽办法逗他开心，让他忘掉旧日的伤心事。一天，王子问起他们来这里的缘故。
        - id: ch02-b07
          speaker: prince
          text: 你们每天都在忙什么？
        - id: ch02-b08
          speakers: [suitor_1, suitor_2, suitor_3]
          ensemble: chorus
          text: 我们整天爬宫墙，想够到公主的窗口。可直到现在，还没人能爬到离窗口十英尺以内。
        - id: ch02-b09
          speaker: prince
          text: 那我也试试。不过明天我先看你们怎么爬，然后再动手。
        - id: ch02-b10
          speaker: narrator
          text: >-
            第二天，王子站在能看清众人的地方，仔细观察他们怎样攀爬。他记下墙上最难通过的地方，打算轮到自己时另选一条路。他一连看了好几天，终于把整面墙的布局熟记在心。这天早晨，他和其他求婚者一同站到墙下。别人失败的地方都被他避开了。他借着墙上一处又一处粗糙的凸起向上爬，最后站上公主的窗台。下面的朋友们又羡又妒，只见一只雪白的手从窗内伸出来，把他拉了进去。
        - id: ch02-b11
          speaker: narrator
          text: 一个求婚者立刻跑进王宫禀报。
        - id: ch02-b12
          speaker: suitor_1
          text: 有人爬上高墙，已经赢得公主了！
        - id: ch02-b13
          speaker: princess_king
          text: 是谁？哪一位王子要做我的女婿？
          emotion: surprised
        - id: ch02-b14
          speaker: suitor_1
          text: >-
            他根本不是王子，是河对岸那位大国王的御马总管之子。他因为继母憎恨自己，才从家乡逃了出来。
        - id: ch02-b15
          speaker: narrator
          text: 国王从没想过王子以外的人也敢求婚，顿时大发雷霆。
        - id: ch02-b16
          speaker: princess_king
          text: 叫他滚回原来的地方！一个流亡的人，也敢指望我把女儿嫁给他？
          emotion: angry
        - id: ch02-b17
          speaker: narrator
          text: >-
            国王怒吼之后还不解气，竟在狂怒中摔砸起酒器。求婚者被他吓坏了，匆匆跑回同伴住处，把这些话原原本本告诉王子。公主正倚在窗口，全都听见了。她叫那人回去告诉父王，要是年轻人被带走，她就发誓从此不吃不喝。国王听到口信更加恼怒，立刻派卫兵去处死胜利者。公主看见他们闯来，猛地挡在年轻人和卫兵中间。
        - id: ch02-b18
          speaker: princess
          text: 你们敢碰他一根手指，我活不到日落便会死去。
          emotion: angry
        - id: ch02-b19
          speaker: narrator
          text: >-
            卫兵看出她说到做到，只好离开宫殿，把她的话带回去。这时国王的怒火已经渐渐平息。他开始思量，自己若违背当众许下的诺言，百姓会怎样看待他。于是，他把公主和年轻人一同召来。两人走进宝座厅，国王见胜利者气度高贵，心中的怒气一下消散，竟跑上前去抱住了他。
        - id: ch02-b20
          speaker: princess_king
          text: 告诉我，你究竟是谁？我绝不相信你身上没有王族的血统。
        - id: ch02-b21
          speaker: narrator
          text: >-
            王子仍不肯明说，只把原来的故事又讲了一遍。国王实在喜欢他，便不再追问。第二天，两人举行婚礼，还得到大群牛和辽阔的领地。
    - id: ch03
      title: 蛇的来临
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 过了一阵，王子把预言告诉了妻子。
        - id: ch03-b02
          speaker: prince
          text: 我的性命掌握在三种动物手中，鳄鱼、蛇，还有狗。
        - id: ch03-b03
          speaker: princess
          text: 你明明知道，怎么还把那可怕的狗留在身边？我马上叫人杀掉它！
          emotion: fearful
        - id: ch03-b04
          speaker: narrator
          text: 王子怎么也不肯答应。
        - id: ch03-b05
          speaker: prince
          text: >-
            它从还是小狗时起就是我的玩伴，我怎么能杀掉它？绝对不行。
        - id: ch03-b06
          speaker: narrator
          text: >-
            公主再三劝说，最终也只让他答应随身佩剑，每次离开宫殿都带人同行。几个月后，消息传来，说王子的继母已经去世，父亲年老多病，一心盼着长子回到身边。王子无法不理会这样的呼唤，便依依不舍地告别妻子，踏上归途。
        - id: ch03-b07
          speaker: narrator
          text: >-
            回家的路十分遥远，王子不得不常常停下休息。一天夜里，他住在大河岸边的一座城里。王子睡着以后，一条巨大的鳄鱼悄无声息地爬进来，沿着走廊摸向他的房间。幸好它正想从卫兵身边偷偷溜过时，其中一个人醒了。众人赶紧把鳄鱼关进一座大厅，派一个巨人守住它。巨人只有夜里趁鳄鱼熟睡才会离开，其余时候寸步不离。这样过了一个多月。
        - id: ch03-b08
          speaker: narrator
          text: >-
            王子发现自己大概不会再离开父亲的国家，便派人接妻子，约她在河边的城里会合。他正因为留在这里等候，才迟迟没有继续赶路，也才险些被鳄鱼吃掉。接下来的几个星期，他想尽办法消磨时间，心里却一分一秒地盼着公主到来。公主一到，他便准备带她前往父亲的宫廷。
        - id: ch03-b09
          speaker: narrator
          text: >-
            就在那天夜里，王子熟睡时，公主看见屋角有一块黑影。黑影越拉越长，慢慢移向王子睡卧的软垫。她害怕地往后一缩，那东西听见轻微的响动，抬起头来。公主这才看清，那是蛇又长又扁的脑袋。她立刻想起预言，却没有惊醒丈夫，只悄悄下床，把桌上一只盛满牛奶的沉重钵子放到蛇面前。她知道，没有一条蛇能抵挡牛奶。
        - id: ch03-b10
          speaker: narrator
          text: >-
            公主屏住呼吸，看着蛇慢慢爬近。蛇再次昂起脑袋，像是闻到了什么美味，分叉的舌头贪婪地吞吐着。它终于看见牛奶，马上飞快舔起来，快得让人担心它会噎住。只要钵里还剩一滴，它就不肯抬头。喝完以后，蛇倒在地上沉沉睡去。公主等的正是这一刻。她抄起丈夫的剑，一下斩断了蛇头。
        - id: ch03-b11
          speaker: narrator
          text: >-
            第二天早晨，两人赶到老国王的宫殿，却发现他已经去世。他们为国王举行了隆重的葬礼。王子随后忙着审阅自己离开期间颁布的新法令，还要处理许多别的国事，终于劳累过度，病得不轻。他只好去河边的一座行宫休养。在那里，他很快恢复健康，又开始出门打猎，用弓箭射野鸭。那条已经非常衰老的狗，无论他去哪里都跟在身旁。
    - id: ch04
      title: 鳄鱼的条件
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            一天早晨，王子照常带狗追猎，来到河岸边。他正全速追着狗跑，险些被路上一截像木头的东西绊倒。那东西忽然开口，王子才发现，被他当成树枝的原来是条鳄鱼。
        - id: ch04-b02
          speaker: crocodile
          text: >-
            你逃不掉。我就是你的命运。不论你去哪里，做什么，我都会先一步等着你。只有一个办法能破除我的力量。你若能在干沙里挖个坑，让水盛在里面一点也不漏，我的魔力就会消失。做不到，你很快便会死。我只给你这一次机会。走吧。
        - id: ch04-b03
          speaker: narrator
          text: >-
            王子满心悲伤地回到宫殿，把自己锁进房里。整整一天，他谁也不见，连妻子也被挡在门外。日落时，公主听见里面始终没有动静，害怕得闹了起来。王子只好打开门闩。
        - id: ch04-b04
          speaker: princess
          text: 你的脸怎么这样苍白？是谁伤了你？快告诉我出了什么事，也许我能帮你。
          emotion: fearful
        - id: ch04-b05
          speaker: narrator
          text: 王子把遇见鳄鱼的经过，还有那件不可能完成的任务，全都告诉了她。
        - id: ch04-b06
          speaker: prince
          text: >-
            沙坑怎么盛得住水？水一定会全漏掉。鳄鱼说这是给我一次机会，可它还不如当场把我拖进河里。它说得对，我逃不过它。
          emotion: sad
        - id: ch04-b07
          speaker: princess
          text: >-
            要只是这件事，我就能救你。仙女教母教过我怎样使用草木。附近的沙漠里有一种四叶小草，把它放进坑中，水一整年也不会漏。天一亮我就去找，你随时可以开始挖坑。
        - id: ch04-b08
          speaker: narrator
          text: >-
            为了安慰丈夫，公主故意把话说得又轻松又快活。其实她心里很清楚，寻找四叶草绝不是一件轻松的事，前面的路也不知道藏着多少艰难。可她既勇敢又有精神，已经下定决心，不管想什么办法，无论付出多少辛苦，都一定要救下王子。
        - id: ch04-b09
          speaker: narrator
          text: >-
            天上还亮着星，公主就骑上一头雪白的驴，离开宫殿，背对大河径直向西而去。起初，眼前只有一片平坦无边的沙地。太阳越升越高，沙地也越来越烫。公主和驴都渴得厉害，四周却没有一条溪流可以解渴。即使真看见水，她大概也没有时间停下，因为前面的路还很远。她必须在傍晚前赶回去，否则鳄鱼也许会说王子没有履行条件。她不断给驴鼓劲，驴便叫几声回答，一人一驴坚定地向前走。
        - id: ch04-b10
          speaker: narrator
          text: >-
            远处终于出现一块高耸的岩石，他们欢喜极了，连口渴和烈日都忘在脑后，脚下的地面仿佛飞快向后退去。驴跑到岩下，自己停进凉爽的阴影里。它可以休息，公主却不能。她知道四叶草长在岩顶，岩脚四周还有一道宽阔的深沟。幸好公主带了绳子。她在一头挽成套结，使尽力气抛向对面。第一次，绳套慢慢滑回沟里。她拉上来重新一抛，终于钩住一样看不见的东西。
        - id: ch04-b11
          speaker: narrator
          text: >-
            公主看不见绳套究竟钩住了什么，只能把全身重量交给这座细细的绳桥。绳子随时都可能绷断，让她坠进乱石深处。那样一来，她会死，王子也同样活不成。幸好，这种可怕的事没有发生，她平安到了对面。可真正艰难的事才刚开始。她每次刚把脚踩上岩石的一处凸棱，石块就从脚底崩落，让她仍旧留在原处。时间却不停流逝，眼看就到正午了。
    - id: ch05
      title: 比命运更强大
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            可怜的公主几乎绝望，却不肯放弃。她四下寻找，看见上方一块小石头似乎比其余的更牢固。她把脚轻轻点在中间那些碎石上，使尽全力，终于攀到那里。她就这样一步步爬上岩顶，双手已经撕裂，鲜血淋漓。岩顶狂风呼啸，卷起的沙尘几乎让她睁不开眼。她只得伏倒在地，用手四处摸索那株珍贵的小草。
        - id: ch05-b02
          speaker: narrator
          text: >-
            有几个可怕的瞬间，她以为岩顶寸草不生，自己一路辛苦全都白费。无论摸到哪里，手下都只有砂砾和石块。忽然，她的手指碰见石缝里一样柔软的东西。那分明是株植物，可是不是她要找的呢？狂风越刮越猛，让她睁不开眼。她只好伏在原处数叶片。一片、两片、三片……对了，对了，一共四片！公主摘下一片，紧紧攥在手心，顶着几乎把人吹昏的风，转身爬下岩石。
        - id: ch05-b03
          speaker: narrator
          text: >-
            她一安全翻过岩顶边缘，四周马上平静下来。公主顺着岩壁飞快滑下，速度快得惊人，险些一头栽进深沟。幸好她停在离绳桥很近的地方，很快又借着绳子回到对岸。驴一看见她，便欢喜地叫起来，接着撒开四蹄，用自己最快的速度往家赶，仿佛根本不知道脚下的大地和头顶的太阳一样滚烫。
        - id: ch05-b04
          speaker: narrator
          text: >-
            到了大河岸边，驴才停下脚步。公主立刻奔向王子。他正站在干沙里挖好的坑旁，身边放着一只巨大的水罐。不远处，鳄鱼躺在阳光下，懒洋洋地眨着眼。它张开黄白色的大嘴，里面露出一排尖利的牙齿。
        - id: ch05-b05
          speaker: narrator
          text: >-
            公主一发出信号，王子就提起巨大的水罐，把水倒进坑里。水刚漫到坑沿，她马上投进四叶草。魔法究竟会不会生效？水会不会一点一点从沙里漏走，让王子成为可怕怪物的牺牲品？两个人目不转睛地盯着水坑，整整等了半个钟头。坑里的水仍和起初一样满，绿色的小叶子轻轻漂在水面。王子终于转过身，发出胜利的欢呼。鳄鱼却闷闷不乐地扑进河里。
        - id: ch05-b06
          speaker: narrator
          text: 王子的三种命运，第二种也被他永远逃过了。
        - id: ch05-b07
          speaker: narrator
          text: >-
            王子站在岸边望着鳄鱼离去，正为重获自由而欢喜。一只野鸭忽然从他们身边飞过，想钻进河边的芦苇丛躲藏。转眼间，老狗便猛追过去，重重撞上主人的双腿。王子踉跄几步，失去平衡，仰面跌进河里，淤泥和芦苇把他紧紧缠住。他向妻子大声呼救，公主立刻飞奔过来，幸好她还带着那根绳子。可怜的老狗淹死了，王子却被妻子拉回岸上。
        - id: ch05-b08
          speaker: prince
          text: 我的妻子，比我的命运更强大。
