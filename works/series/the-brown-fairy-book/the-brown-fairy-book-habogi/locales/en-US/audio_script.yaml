  chapters:
    - id: ch01
      title: The Name in the Whisper
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there were two peasants with three daughters. The youngest, Helga, was the prettiest and the sweetest-tempered of them all. Whenever her sisters wanted to go out, she willingly stayed home and did their work.
        - id: ch01-b02
          speaker: narrator
          text: The years went quickly, and one day the parents realized that all three girls were grown. It would not be long before they began thinking about marriage. One evening, as the family sat outside the cottage door, their father laughed and asked the eldest a question.
        - id: ch01-b03
          speaker: father
          text: Have you chosen the name your husband must have? You know, that's a very important thing!
        - id: ch01-b04
          speaker: eldest_sister
          text: Yes. I won't marry any man unless his name is Sigmund.
        - id: ch01-b05
          speaker: father
          text: Then you're fortunate. There are plenty of Sigmunds around here, so you'll have your choice. And what about you?
        - id: ch01-b06
          speaker: narrator
          text: He turned to his second daughter.
        - id: ch01-b07
          speaker: second_sister
          text: Oh, no name sounds as lovely as Sigurd!
        - id: ch01-b08
          speaker: father
          text: Then you won't have to stay single, either. Why, the next village alone has seven Sigurds! And you, Helga?
        - id: ch01-b09
          speaker: narrator
          text: Helga looked up. She had a favorite name too. But just as she was about to speak, she seemed to hear a voice whisper, “Marry no one who is not called Hábogi.”
        - id: ch01-b10
          speaker: narrator
          text: Helga had never heard that name, and she did not like it. She decided to ignore the whisper. She opened her mouth to say that her husband must be called Njal, but different words came out instead.
        - id: ch01-b11
          speaker: helga
          text: If I ever marry, it will only be to Hábogi.
        - id: ch01-b12
          speakers: [father, eldest_sister, second_sister]
          ensemble: chorus
          text: Who is Hábogi? We've never heard of anyone by that name.
          emotion: surprised
        - id: ch01-b13
          speaker: helga
          text: All I know is that if I have a husband, Hábogi will be the one.
        - id: ch01-b14
          speaker: narrator
          text: That was all Helga would tell them.
    - id: ch02
      title: The Stranger at the Wedding
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Before long, young men from the nearby villages and the mountain slopes heard what the sisters had said. Sigmunds and Sigurds came by the score to visit the cottage. Men with other names came too, hoping they might win Helga's heart. There was more than one Njal among them, but Helga always seemed to be looking somewhere else.
        - id: ch02-b02
          speaker: narrator
          text: At last, the two older sisters chose their husbands from all those Sigmunds and Sigurds. The family decided to hold both weddings together. They invited friends and relatives, and on the great morning everyone gathered for the feast.
        - id: ch02-b03
          speaker: narrator
          text: Then a rough, coarse old peasant stepped out of the crowd and approached the brides' father.
        - id: ch02-b04
          speaker: habogi
          text: My name is Hábogi. Helga must be my wife.
        - id: ch02-b05
          speaker: narrator
          text: Helga went pale and shook with surprise, but she made no attempt to escape.
        - id: ch02-b06
          speaker: father
          text: This is no time to discuss such a thing.
        - id: ch02-b07
          speaker: narrator
          text: Her father could not bear the thought of giving his favorite daughter to such a horrible old man. He hoped that if he delayed, something might prevent the marriage. Helga's sisters had always been rather jealous of her, so they were secretly glad that their own bridegrooms looked far better than hers.
        - id: ch02-b08
          speaker: narrator
          text: When the feast ended, Hábogi brought a beautiful horse from the field where it had been grazing. Its splendid saddle was embroidered in scarlet and gold. He told Helga to climb on.
        - id: ch02-b09
          speaker: habogi
          text: You will come home again. But first, you must see the house where you are going to live.
        - id: ch02-b10
          speaker: narrator
          text: Helga was very unwilling to go, yet something within her compelled her to obey. Hábogi settled her comfortably in the saddle. Then he sprang up in front of her as lightly as a boy, shook the reins, and carried her swiftly out of sight.
    - id: ch03
      title: All That Belongs to Hábogi
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: After several miles, they rode through a meadow whose grass was so green that it dazzled Helga's eyes. Great fat sheep fed there, with the whitest, curliest wool she had ever seen.
        - id: ch03-b02
          speaker: helga
          text: What beautiful sheep! Who owns them?
        - id: ch03-b03
          speaker: habogi
          text: Your Hábogi owns them. Everything you see is his. But the finest sheep in the flock, the one with little golden bells between its horns, will belong to you.
        - id: ch03-b04
          speaker: narrator
          text: Helga had never owned anything herself, so the gift pleased her greatly. She smiled with real happiness and thanked Hábogi.
        - id: ch03-b05
          speaker: narrator
          text: Soon they left the sheep and entered a broad field with a river flowing through it. Beautiful gray cows stood beside a gate, waiting for the milkmaid.
        - id: ch03-b06
          speaker: helga
          text: Oh, those cows are lovely! Their milk must be sweeter than any other milk. I'd so like to have some. Who do they belong to?
        - id: ch03-b07
          speaker: habogi
          text: They belong to your Hábogi. One day you may have all the milk you want, though we cannot stop now. See that large gray cow with silver bells between her horns? She will be yours, and you may have her milked every morning as soon as you wake.
        - id: ch03-b08
          speaker: narrator
          text: Helga's eyes shone. She said nothing, but she decided she would learn to milk the cow herself.
        - id: ch03-b09
          speaker: narrator
          text: A mile farther on, they reached a wide common covered in short, springy turf. Horses of every color played there, kicking up their heels. Their coats gleamed like satin. Helga was so delighted that she nearly leaped from the saddle with a cry of joy.
        - id: ch03-b10
          speaker: helga
          text: Who owns them? Oh, tell me, who? The man who owns such wonderful creatures must be very happy!
        - id: ch03-b11
          speaker: habogi
          text: They are your Hábogi's. You may choose the most beautiful one for yourself, and you shall learn to ride it.
        - id: ch03-b12
          speaker: narrator
          text: At once, Helga forgot all about the sheep and the cow.
        - id: ch03-b13
          speaker: helga
          text: A horse of my own! Please stop for one moment and let me choose. The white one? No. The chestnut? No. I think I like the coal-black horse best, the one with the little white star on his forehead. Oh, please stop for just a minute!
        - id: ch03-b14
          speaker: narrator
          text: Hábogi would neither stop nor listen.
        - id: ch03-b15
          speaker: habogi
          text: Once we are married, you will have plenty of time to choose.
        - id: ch03-b16
          speaker: narrator
          text: They rode on for another two or three miles.
    - id: ch04
      title: The House Beyond the Fields
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: At last, Hábogi drew the horse to a stop before a small house. It was ugly and poor-looking, and it seemed ready to tumble to pieces. He jumped down and held out his arms to lift Helga from the saddle.
        - id: ch04-b02
          speaker: habogi
          text: This is my home, and it will be yours too.
        - id: ch04-b03
          speaker: narrator
          text: Helga's heart sank a little. A man who owned such marvelous sheep, cows, and horses might surely have built himself a prettier place to live. Still, she said nothing about it. Hábogi took her arm and led her up the steps.
        - id: ch04-b04
          speaker: narrator
          text: The moment Helga entered, the beauty all around her left her bewildered. Not one of her friends owned such wonderful things. Even the miller, the richest man she knew, had nothing like them. Thick, soft carpets in deep, glowing colors lay everywhere. There were silk cushions that looked comfortable enough to send anyone to sleep, and curious little china figures stood here and there.
        - id: ch04-b05
          speaker: narrator
          text: Helga felt that it would take her whole life to look at everything properly. Yet it seemed only a second had passed since she entered when Hábogi came up to her.
        - id: ch04-b06
          speaker: habogi
          text: I must start preparing our wedding at once. My foster-brother will take you home, just as I promised. Three days from now, he will bring you back with your parents, your sisters, and any guests you wish to invite. The feast will be ready by then.
        - id: ch04-b07
          speaker: narrator
          text: Helga had so much to think about that the ride home seemed very short. Her father and mother were delighted to see her. They had not been sure she would return at all. A man as ugly and cross-looking as Hábogi, they feared, might have played some cruel trick on her.
        - id: ch04-b08
          speaker: narrator
          text: After giving Helga supper, they begged to hear everything that had happened. She told them only that they would see it for themselves on the third day, when they came to her wedding.
    - id: ch05
      title: Roses in the Ashes
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The wedding party set out very early in the morning. Along the way, they passed the great flocks of sheep, the gray cows, and the splendid horses. When Helga's sisters heard that she had been given the finest of each for herself, they grew green with envy. Then they caught sight of the poor little house where she was to live, and their hearts grew light again.
        - id: ch05-b02
          speakers: [eldest_sister, second_sister]
          ensemble: duo
          text: I would be ashamed to live in a place like that.
          emotion: disgusted
        - id: ch05-b03
          speaker: narrator
          text: The eldest talked about the carved stone above her own doorway, while the second boasted of how many rooms she had. But the moment they stepped inside Hábogi's house, all its splendor struck them dumb with rage. Then they saw the dress he had prepared for his bride. It glittered like sunbeams dancing on ice, and their faces went white and cold with fury.
        - id: ch05-b04
          speakers: [eldest_sister, second_sister]
          ensemble: duo
          text: She will not look so much finer than we do!
          emotion: angry
        - id: ch05-b05
          speaker: narrator
          text: That night, the sisters waited until they were alone. Then they stole out of their rooms, took Helga's wedding dress, and carried it to the ash pit. They laid it there and heaped ashes over it until it was hidden.
        - id: ch05-b06
          speaker: narrator
          text: But Hábogi knew a little magic, and he had guessed what they meant to do. He changed all the ashes into roses. Then he cast a spell over the sisters so that they could not leave that very spot for a whole day. Everyone who passed by saw them there and made fun of them.
        - id: ch05-b07
          speaker: narrator
          text: When everyone woke the next morning, the ugly, crumbling house was gone without a trace. A splendid palace stood in its place. The guests searched everywhere for the bridegroom. All they could see was a handsome young man in a blue velvet coat trimmed with silver, with a golden crown on his head.
        - id: ch05-b08
          speakers: [guest_1, guest_2, guest_3]
          ensemble: chorus
          text: Who is that?
          emotion: surprised
        - id: ch05-b09
          speaker: helga
          text: That is my Hábogi.
