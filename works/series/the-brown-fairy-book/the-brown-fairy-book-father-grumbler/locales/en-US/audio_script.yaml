  chapters:
    - id: ch01
      title: Father Grumbler and the Magic Basket
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a man with almost as many children as there were sparrows in the garden. He worked hard from morning to night just to find enough food for them. The work left him tired and cross. He complained about everyone and everything, until people began to call him Father Grumbler.
        - id: ch01-b02
          speaker: narrator
          text: After a while, he grew sick of working all the time. On Sundays he stayed in bed instead of going to church. But lying alone for hours was dull, especially when all he could think about was the rent he still owed. The tavern across the road looked bright and cheerful, so one Sunday he went in and sat with his friends. He told himself he was only trying to chase Care away. Yet when he came out, many hours later, Care came out beside him.
        - id: ch01-b03
          speaker: narrator
          text: He returned home gloomier than before. He knew he had wasted both his time and his money.
        - id: ch01-b04
          speaker: father_grumbler
          text: I'll visit the Holy Man who lives in the cave by the well. Perhaps he can tell me why everyone else gets the good luck while I get nothing but trouble.
        - id: ch01-b05
          speaker: narrator
          text: Father Grumbler set off at once. The cave lay far away, beyond mountains and valleys, but at last he reached it and knocked on the door.
        - id: ch01-b06
          speaker: holy_man
          text: Who is there?
        - id: ch01-b07
          speaker: father_grumbler
          text: It's Father Grumbler, Holy Man. You know me. I'm the one with as many children as there are sparrows in the garden.
        - id: ch01-b08
          speaker: holy_man
          text: Well, what do you want?
        - id: ch01-b09
          speaker: father_grumbler
          text: I want to know why everyone else has all the luck, while nothing but misfortune comes to me!
          emotion: angry
        - id: ch01-b10
          speaker: narrator
          text: The Holy Man said nothing. He went into an inner cave and returned with something in his hand.
        - id: ch01-b11
          speaker: holy_man
          text: Do you see this basket? It is magic. Whenever you are hungry, say, “Little basket, little basket, do your duty,” and it will give you the finest dinner you have ever eaten. When you have enough, remember to call, “That will do for today.” One more thing. You needn't show it to everyone or announce that I gave it to you. Do you understand?
        - id: ch01-b12
          speaker: narrator
          text: Father Grumbler was so used to thinking himself unlucky that he wondered if the Holy Man was tricking him. Still, he took the basket. He did not say thank you or even good morning before he left.
        - id: ch01-b13
          speaker: narrator
          text: As soon as the cave was out of sight, he bent over the basket and whispered.
        - id: ch01-b14
          speaker: father_grumbler
          text: Little basket, little basket, do your duty.
        - id: ch01-b15
          speaker: narrator
          text: The basket had a lid, so he could not see inside. Then he heard a strange scuffling. The lid flew open, and delicious little white rolls tumbled out one after another. Behind them came a stream of small fish, already cooked. More and more poured out. Soon they covered the road and began to hide the banks on either side. Father Grumbler stared at the rushing food in alarm. At last he remembered the Holy Man's command.
        - id: ch01-b16
          speaker: father_grumbler
          text: Enough! Enough! That will do for today!
          emotion: fearful
        - id: ch01-b17
          speaker: narrator
          text: The lid snapped shut. Father Grumbler sighed with relief and delight. He sat on a heap of stones and ate until he could eat no more. Trout, salmon, turbot, soles, and a hundred kinds of fish he could not name lay around him, boiled, fried, and grilled. The Holy Man had spoken truly. Father Grumbler had never eaten such a dinner. Even so, when he finished, he shook his head.
        - id: ch01-b18
          speaker: father_grumbler
          text: Yes, there is plenty of food. But it has made me thirsty, and there isn't one drop to drink anywhere.
        - id: ch01-b19
          speaker: narrator
          text: Then he looked up and somehow saw the tavern right in front of him, though he had thought it was miles and miles away.
    - id: ch02
      title: The Basket Is Stolen
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Father Grumbler walked into the tavern and called to the innkeeper's wife.
        - id: ch02-b02
          speaker: father_grumbler
          text: Bring me your best wine and two glasses, good mother. If you like fish, there is enough outside to feed everyone here. But don't go telling the whole neighborhood about it. Do you understand?
        - id: ch02-b03
          speaker: narrator
          text: He did not wait for her answer. He leaned toward the basket and spoke the magic words.
        - id: ch02-b04
          speaker: father_grumbler
          text: Little basket, little basket, do your duty.
        - id: ch02-b05
          speaker: narrator
          text: The innkeeper and his wife thought their customer had suddenly gone mad. They watched him closely, ready to jump on him if he turned violent. Then rolls and every kind of fish burst from the basket. Both of them leaped backward and nearly landed in the fire. Food covered the tables, the chairs, and the floor, then spilled through the door into the street.
        - id: ch02-b06
          speaker: father_grumbler
          text: Quickly, pick it all up! And if that isn't enough, the basket can give you plenty more.
        - id: ch02-b07
          speaker: narrator
          text: The innkeeper and his wife needed no second invitation. They dropped to their knees and gathered everything within reach. Busy as they were, they still found a moment to whisper together.
        - id: ch02-b08
          speakers: [innkeeper, innkeepers_wife]
          ensemble: duo
          text: If only we can get that basket, it will make our fortune.
        - id: ch02-b09
          speaker: narrator
          text: They invited Father Grumbler to their table and brought up the finest wine in the cellar, hoping it would make him talk. But he was cleverer than they expected. They tried every way they knew to learn who had given him the basket, and he kept the secret. The trouble was that although he did not speak, he did drink. Before long, he fell fast asleep.
        - id: ch02-b10
          speaker: narrator
          text: The woman fetched another basket from her kitchen. It looked so much like the magic one that no one could tell them apart without looking closely. She slipped the ordinary basket into Father Grumbler's hand and carefully hid the magic basket away.
        - id: ch02-b11
          speaker: narrator
          text: It was dinner time when Father Grumbler woke. He jumped up and hurried home. There he found all his children crowded around a basin of thin soup. Each child pushed a wooden bowl forward, hoping to get the first spoonful. Their father burst into the room holding the basket.
        - id: ch02-b12
          speaker: father_grumbler
          text: Don't fill yourselves with that watery stuff, children. Look at this basket. All I have to do is say, “Little basket, little basket, do your duty,” and then you'll see something wonderful. As a special treat, you may say it this time.
        - id: ch02-b13
          speaker: narrator
          text: The children were amazed and delighted. Together they repeated the words.
        - id: ch02-b14
          speakers: [child_1, child_2, child_3]
          ensemble: chorus
          text: Little basket, little basket, do your duty!
        - id: ch02-b15
          speaker: narrator
          text: Nothing happened. They tried again and again. Still nothing came. It was only an ordinary basket, with a few fish scales stuck to the bottom. The innkeeper's wife had taken that basket to market the day before.
        - id: ch02-b16
          speaker: father_grumbler
          text: What is wrong with this thing?
          emotion: angry
        - id: ch02-b17
          speaker: narrator
          text: He snatched it from the children, turned it upside down, and swore and grumbled. His wife and children watched in astonishment, unable to decide whether to laugh or cry.
        - id: ch02-b18
          speaker: father_grumbler
          text: It certainly smells like fish.
        - id: ch02-b19
          speaker: narrator
          text: Then he stopped. A sudden thought had come to him.
        - id: ch02-b20
          speaker: father_grumbler
          text: What if this isn't my basket at all? What if—ah, those scoundrels!
          emotion: angry
    - id: ch03
      title: Back to the Cave
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: His wife and children were frightened by his strange behavior. They begged him to stay, but he would not listen. He ran across the road and burst through the tavern door.
        - id: ch03-b02
          speaker: innkeepers_wife
          text: Is there something I can do for you, Father Grumbler?
        - id: ch03-b03
          speaker: narrator
          text: She spoke in her softest voice.
        - id: ch03-b04
          speaker: father_grumbler
          text: I seem to have taken the wrong basket by mistake. Here is yours. Now will you please return mine?
        - id: ch03-b05
          speaker: innkeepers_wife
          text: Whatever are you talking about? Look for yourself. There isn't any basket here.
        - id: ch03-b06
          speaker: narrator
          text: Father Grumbler did look. It was true that there was no basket anywhere in sight.
        - id: ch03-b07
          speaker: innkeepers_wife
          text: Come, have a glass to warm you on this cold day.
        - id: ch03-b08
          speaker: narrator
          text: She hoped to keep him in a good temper. Father Grumbler never refused such an offer. He swallowed the drink and left.
        - id: ch03-b09
          speaker: narrator
          text: He took the road to the Holy Man's cave and hurried so fast that he soon reached the door. He knocked.
        - id: ch03-b10
          speaker: holy_man
          text: Who is there?
        - id: ch03-b11
          speaker: father_grumbler
          text: It's me, Holy Man. You know who I am. Father Grumbler, with as many children as sparrows in the garden.
        - id: ch03-b12
          speaker: holy_man
          text: But my good man, I gave you a handsome present only yesterday.
        - id: ch03-b13
          speaker: father_grumbler
          text: Yes, Holy Man, and here it is. Something has happened to it. I don't know what, but it won't work anymore.
        - id: ch03-b14
          speaker: holy_man
          text: Put it down. I'll see if I can find something else for you.
        - id: ch03-b15
          speaker: narrator
          text: A few minutes later, the Holy Man returned with a cock tucked under his arm.
        - id: ch03-b16
          speaker: holy_man
          text: Listen carefully. Whenever you need money, say, “Show me what you can do, cock,” and you will see something marvelous. But remember, the whole world does not need to know your secret.
        - id: ch03-b17
          speaker: father_grumbler
          text: Oh no, Holy Man. I'm not foolish enough for that.
        - id: ch03-b18
          speaker: holy_man
          text: And don't tell everyone that I gave it to you. I don't have treasures like these by the dozen.
        - id: ch03-b19
          speaker: narrator
          text: Without waiting for an answer, the Holy Man shut the door.
    - id: ch04
      title: The Golden Cock
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Just as before, the journey back seemed wonderfully short. In a moment, the tavern stood in front of Father Grumbler. Without stopping to think, he went straight inside. He found the innkeeper's wife in the kitchen making a cake.
        - id: ch04-b02
          speaker: innkeepers_wife
          text: Where have you been? And where did you get that handsome red cock in your basket?
        - id: ch04-b03
          speaker: narrator
          text: The bird was so large that the lid would not close properly.
        - id: ch04-b04
          speaker: father_grumbler
          text: I come from a place where treasures like this aren't kept by the dozen.
        - id: ch04-b05
          speaker: narrator
          text: He sat down at the table. The woman asked no more questions. Instead, she placed a bottle of his favorite wine before him. Soon Father Grumbler could not resist showing off his prize.
        - id: ch04-b06
          speaker: father_grumbler
          text: Show me what you can do, cock!
        - id: ch04-b07
          speaker: narrator
          text: The cock stood tall and flapped its wings three times. Each time it gave a trumpet-like cry of “Coquerico!” And with every crow, drops of gold and diamonds as large as peas fell from its beak.
        - id: ch04-b08
          speaker: narrator
          text: This time Father Grumbler did not invite the woman to gather the treasure. He held his own hat beneath the cock's beak and caught every piece. But he missed the look that passed between husband and wife. Each knew exactly what the other was thinking. That cock would go beautifully with their basket.
        - id: ch04-b09
          speaker: innkeeper
          text: Would you care for another glass of wine?
        - id: ch04-b10
          speaker: narrator
          text: The couple pretended they had not noticed the gold or diamonds. Father Grumbler gladly accepted. He drank one glass after another until his head dropped onto the table and he was sound asleep again.
        - id: ch04-b11
          speaker: narrator
          text: The woman gently coaxed the cock out of the basket and carried it to her own poultry yard. From there she brought another cock that looked exactly like it and popped the ordinary bird into the basket.
        - id: ch04-b12
          speaker: narrator
          text: Night was falling when Father Grumbler awoke. He proudly scattered a few grains of gold on the table to pay for his wine, tucked the cock comfortably into the basket, and went home.
        - id: ch04-b13
          speaker: narrator
          text: His wife and all the children were waiting at the door. The moment she saw him, his wife began to scold.
        - id: ch04-b14
          speaker: grumblers_wife
          text: What a fine husband you are! You waste your time and money drinking at the tavern while we starve at home. Aren't you ashamed?
          emotion: angry
        - id: ch04-b15
          speaker: father_grumbler
          text: You don't know what you're saying. Money? I can have all the gold and diamonds I want now. See this cock? Just tell him, “Show me what you can do, cock,” and something splendid will happen.
        - id: ch04-b16
          speaker: narrator
          text: After what had happened with the basket, neither his wife nor his children trusted him much. Still, they thought the cock was worth a try. They said the words as he had told them.
        - id: ch04-b17
          speakers: [grumblers_wife, child_1, child_2, child_3]
          ensemble: chorus
          text: Show us what you can do, cock!
        - id: ch04-b18
          speaker: narrator
          text: The cock flew around the room like a mad creature. It crowed until their heads nearly split from the noise. But not one speck of gold and not one tiny diamond fell onto the brick floor.
        - id: ch04-b19
          speaker: narrator
          text: Father Grumbler stared without a word. Then he swore so loudly that even his family, who knew his language well, wondered at him. At last he quieted a little, but he was still completely puzzled.
        - id: ch04-b20
          speaker: father_grumbler
          text: Could I have forgotten the words? No, I know that is what he said. I saw those diamonds with my own eyes!
          emotion: angry
        - id: ch04-b21
          speaker: narrator
          text: Suddenly, he grabbed the cock, shut it in the basket, and rushed out of the house.
        - id: ch04-b22
          speaker: narrator
          text: His heavy wooden shoes clattered along the road. He ran so quickly that the stars were only beginning to appear when he reached the Holy Man's cave and knocked.
        - id: ch04-b23
          speaker: holy_man
          text: Who is knocking now?
        - id: ch04-b24
          speaker: father_grumbler
          text: It's me! Holy Man, you know me. Father—
        - id: ch04-b25
          speaker: holy_man
          text: My good fellow, you really ought to let someone else have a turn. This is your third visit, and at such a late hour too.
        - id: ch04-b26
          speaker: father_grumbler
          text: Yes, Holy Man, I know it's late. Please forgive me. Something is wrong with your cock, just as there was with the basket. Look!
        - id: ch04-b27
          speaker: holy_man
          text: That is supposed to be my cock? And that is supposed to be my basket? Someone has tricked you, my good man.
        - id: ch04-b28
          speaker: father_grumbler
          text: Tricked me? Then it must have been those two—
          emotion: surprised
        - id: ch04-b29
          speaker: holy_man
          text: I warned you not to show the treasures to anyone. You deserve—but I will give you one last chance.
