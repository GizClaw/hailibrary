  chapters:
    - id: ch01
      title: The Thief of the Golden Apples
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: A powerful King owned many treasures, but the wonder of his garden was a tree that bore beautiful golden apples every year. He never got to enjoy them. No matter how carefully they were watched, someone always stole them as soon as they began to ripen.
        - id: ch01-b02
          speaker: narrator
          text: At last the King sent for his three sons. He spoke first to the two eldest.
        - id: ch01-b03
          speaker: king
          text: Prepare for a journey. Take gold, silver, and all the servants that noble princes should have. Travel through the world until you discover who steals my golden apples. If you can, bring the thief back so I may give him the punishment he deserves.
        - id: ch01-b04
          speaker: narrator
          text: The two princes were delighted by the plan, for they had wanted to see something of the world for a long time. They made ready as quickly as they could, gathered the servants and riches suited to their rank, said farewell to their father, and left the town.
        - id: ch01-b05
          speaker: narrator
          text: The youngest Prince was bitterly disappointed to be left behind. Everyone had always thought him the foolish one, and his father feared that harm would come to him. Still, the young man begged so patiently and for so long that the King finally consented. He gave him gold and silver, just as he had given his brothers, but the Prince had not thought to ask for a fine mount. His father gave him the most miserable horse in the stable. The whole court and town laughed as he rode away to find the thief.
        - id: ch01-b06
          speaker: narrator
          text: His road entered a wood. Before he had gone far, a thin and hungry-looking wolf stopped in front of him.
        - id: ch01-b07
          speaker: prince
          text: Are you hungry?
        - id: ch01-b08
          speaker: wolf
          text: I am.
        - id: ch01-b09
          speaker: prince
          text: Then you may have my horse and eat it. You look as hungry as you say.
        - id: ch01-b10
          speaker: narrator
          text: The wolf needed no second invitation. He quickly finished the poor animal, and afterward he looked quite different. The Prince considered the long road ahead.
        - id: ch01-b11
          speaker: prince
          text: Well, my friend, you have eaten my horse, and I cannot possibly walk all the way, however hard I try. The least you can do is carry me on your back.
        - id: ch01-b12
          speaker: wolf
          text: Of course I will.
        - id: ch01-b13
          speaker: narrator
          text: The Prince climbed onto the wolf, who trotted cheerfully through the trees. After they had traveled a little way, the wolf looked around and asked where his rider wished to go. The Prince told the whole story. Every year, the golden apples vanished as they ripened, and his two elder brothers had already set out with many followers to hunt for the thief.
        - id: ch01-b14
          speaker: narrator
          text: This was no ordinary wolf. He was a mighty magician, and he knew who the thief was.
        - id: ch01-b15
          speaker: wolf
          text: In the country next to yours, a powerful Emperor keeps a beautiful golden bird in a cage. That bird steals the apples. It flies too fast to be caught in your garden, so you must enter the Emperor's palace at night and take it, cage and all. When you leave, be very careful not to touch the walls.
        - id: ch01-b16
          speaker: narrator
          text: The following night, the Prince slipped into the palace and found the golden bird exactly where the wolf had said. He lifted its cage with care. But as he passed some sleeping watchmen, he brushed the wall. They woke at once, seized him, beat him, and locked him in chains.
        - id: ch01-b17
          speaker: narrator
          text: The next day the Emperor condemned him to death. Until the day of his execution, he was to remain in a dark dungeon.
    - id: ch02
      title: The Golden Horse
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Through his magic, the wolf knew everything that had happened. He changed himself into a mighty king, gathered a splendid train of followers, and went straight to the Emperor's court. The Emperor believed that a great monarch had come to visit him, so he welcomed the stranger with every mark of honor. The two rulers talked together about one subject after another.
        - id: ch02-b02
          speaker: narrator
          text: As they talked, the visiting king asked whether the Emperor owned many slaves.
        - id: ch02-b03
          speaker: bird_emperor
          text: I have more slaves than I can use. Another was caught last night while trying to steal my magic bird. I already have too many mouths to feed, so that prisoner will be hanged tomorrow morning.
        - id: ch02-b04
          speaker: wolf
          text: He must be a daring thief to attempt that. Your bird cannot have been lightly guarded. I should very much like to see the rascal.
        - id: ch02-b05
          speaker: bird_emperor
          text: Certainly. Come with me.
        - id: ch02-b06
          speaker: narrator
          text: The Emperor led his guest into the dungeon. Once they had stepped out of the Prince's cell, the disguised wolf turned to his host.
        - id: ch02-b07
          speaker: wolf
          text: I confess I am disappointed. I expected a formidable robber, but I found the most wretched creature imaginable. Hanging is too easy for him. Give him some nearly impossible task and promise him death if he fails. If he succeeds, you gain something valuable. If he fails, you can still hang him.
        - id: ch02-b08
          speaker: bird_emperor
          text: That is excellent advice, and I know the very task. My nearest neighbor owns a golden horse and guards it with the greatest care. This prisoner must steal the horse and bring it to me.
        - id: ch02-b09
          speaker: narrator
          text: The Prince was brought out of the dungeon and told that his life would be spared if he brought the golden horse to the Emperor. The news gave him no joy at all. He did not know where the horse was kept or how anyone could pass its guards. He set off in bitter tears, wondering again and again what had made him leave his father's house and kingdom.
        - id: ch02-b10
          speaker: narrator
          text: He had not gone far when the wolf appeared before him.
        - id: ch02-b11
          speaker: wolf
          text: Dear Prince, why are you so downhearted? You failed to catch the bird, but do not lose courage. This time you will be more careful, and surely you will win the horse. Above all, do not touch the wall, and do not let the horse touch it as you lead it out.
        - id: ch02-b12
          speaker: narrator
          text: The wolf stayed beside him and spoke encouragingly until the Prince took heart again. After a long journey, they reached the kingdom of the Emperor who owned the golden horse. Evening was already far advanced when they entered the capital. The wolf urged the Prince to act at once, before their presence in the city could make the guards more watchful.
        - id: ch02-b13
          speaker: narrator
          text: They entered the imperial stables unseen. The wolf led him to the place with the most guards, reasoning that the finest horse must be there. At an inner door, he told the Prince to wait while he went ahead. Before long he returned.
        - id: ch02-b14
          speaker: wolf
          text: The horse is guarded more closely than anything I have seen, but I have bewitched every guard. If neither you nor the horse touches the wall on the way out, you have nothing to fear. The prize will be yours.
        - id: ch02-b15
          speaker: narrator
          text: Determined to be doubly cautious, the Prince went in. Every guard was fast asleep. He took the horse by its bridle and quietly led it from the stall. They were almost clear of the stables when a gadfly stung the horse. Its tail flicked against the wall.
        - id: ch02-b16
          speaker: narrator
          text: In an instant the spell broke and every guard woke. They caught the Prince before he could escape and beat him without mercy with their horsewhips. Then they fastened him in chains and flung him into a dungeon. The next morning he was dragged before the Emperor. He received the same harsh treatment he had met at the palace of the golden bird, and the Emperor commanded that he be beheaded the following day.
    - id: ch03
      title: The Golden Mermaid
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: When the wolf-magician saw that the Prince had failed again, he became a mighty king once more. This time his train was even more magnificent. The Emperor received him courteously and entertained him at court.
        - id: ch03-b02
          speaker: narrator
          text: After dinner the visitor brought the talk around to slaves. In the course of their conversation, he asked to see the bold robber who had dared to break into the imperial stable and steal its greatest treasure. The Emperor consented and led him to the prisoner. Everything then happened as it had at the court of the golden bird. The disguised wolf spoke scornfully of the captive and suggested a difficult task instead of an immediate death.
        - id: ch03-b03
          speaker: narrator
          text: The Emperor decided that the prisoner's life would be spared on one condition. Within three days, he must bring back the golden mermaid, whom no mortal had ever been able to approach.
        - id: ch03-b04
          speaker: narrator
          text: The Prince left his gloomy prison crushed by the danger and difficulty before him. To his great joy, he met the wolf after traveling only a few miles. The clever creature pretended to know nothing.
        - id: ch03-b05
          speaker: wolf
          text: How did you fare with the golden horse?
        - id: ch03-b06
          speaker: narrator
          text: The Prince told him about the gadfly, his capture, and the condition the Emperor had placed on his life.
        - id: ch03-b07
          speaker: wolf
          text: I have rescued you from prison twice. Trust me now, and follow every word I say. Then you will succeed in this last task.
        - id: ch03-b08
          speaker: narrator
          text: They made their way toward the sea. At last it spread before them as far as they could see, with every wave dancing and shining in the bright sun.
        - id: ch03-b09
          speaker: wolf
          text: I will turn myself into a boat filled with the loveliest silks. Climb aboard without fear and steer into the open sea while you hold my tail. Soon you will meet the golden mermaid. If she calls you, do not follow her. Tell her, “The buyer comes to the seller, not the seller to the buyer.” Then turn toward land. She will follow because she will not be able to resist the beautiful goods in your boat.
        - id: ch03-b10
          speaker: narrator
          text: The Prince faithfully promised to obey. The wolf became a ship loaded with exquisite silks in every shade and color. Though amazed, the Prince stepped aboard. With the wolf's tail in his hand, he steered bravely into the open sea, where the sun turned the blue waves to gold.
        - id: ch03-b11
          speaker: narrator
          text: Soon the golden mermaid appeared beside the ship. She beckoned to him and called for him to follow.
        - id: ch03-b12
          speaker: mermaid
          text: Come after me!
        - id: ch03-b13
          speaker: prince
          text: If you wish to buy something, you must come to me. The buyer comes to the seller, not the seller to the buyer.
        - id: ch03-b14
          speaker: narrator
          text: He turned the enchanted ship toward the shore. The mermaid called for him to stop, but he would not listen. He did not pause until the boat reached the sand. Then he waited while she swam after him.
        - id: ch03-b15
          speaker: narrator
          text: As she approached, he saw that she was more beautiful than any mortal he had ever known. She circled the ship for a while, then swung herself gracefully aboard to look more closely at the splendid silks.
        - id: ch03-b16
          speaker: narrator
          text: The Prince caught her in his arms. He kissed her tenderly on the cheeks and lips and told her that she was his forever. At that very moment, the boat changed back into the wolf. The mermaid was so frightened that she clung to the Prince for protection.
        - id: ch03-b17
          speaker: narrator
          text: So the golden mermaid was caught. Before long she saw that she had nothing to fear from either the Prince or the wolf, and she became quite happy in her new life. For the journey, she took her place on the wolf's broad back, and the Prince climbed up behind her. Then the three travelers left the shore and made their way toward the country of the Emperor who owned the golden horse.
    - id: ch04
      title: The Gifts of the Two Emperors
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: When they reached the Emperor's country, the Prince dismounted and helped the mermaid down from the wolf's back. Then he led her toward the palace. The guards saw the beautiful mermaid beside him and the grim wolf who, unlike before, would not leave his side. All of them bowed respectfully and let the travelers pass. Soon the Prince, the mermaid, and the wolf stood together before the Emperor.
        - id: ch04-b02
          speaker: narrator
          text: The Prince told how he had gained his beautiful prize. The Emperor immediately understood that magic had helped him and gave up every claim to the mermaid.
        - id: ch04-b03
          speaker: horse_emperor
          text: Dear young man, forgive my shameful treatment of you. To show that you pardon me, accept the golden horse as my gift. Your power is greater than I can understand, for you reached the golden mermaid when no mortal before you could approach her.
        - id: ch04-b04
          speaker: narrator
          text: A great feast was laid before them. The Prince had to tell his adventures from beginning to end, and the whole company listened in wonder.
        - id: ch04-b05
          speaker: narrator
          text: Yet he longed to return to his own kingdom. As soon as the feast ended, he said farewell to the Emperor. He lifted the mermaid onto the golden horse and mounted behind her. They rode away merrily, with the wolf trotting at their heels, until they entered the country of the Emperor with the golden bird.
        - id: ch04-b06
          speaker: narrator
          text: The fame of the Prince and his great adventure had traveled faster than they had. The Emperor already knew they were coming and waited on his throne for the travelers to arrive. When the golden horse carried the Prince and the mermaid into the palace courtyard, with the wolf following close behind, all three were surprised and delighted. The palace shone with festive lights, and every part of it had been decorated to welcome them.
        - id: ch04-b07
          speaker: narrator
          text: They climbed the palace steps, and the Emperor came forward to lead them into the throne room. At once a servant appeared carrying the golden bird in its golden cage.
        - id: ch04-b08
          speaker: bird_emperor
          text: Please accept this bird with my affection, and forgive the disgrace you suffered at my hands.
        - id: ch04-b09
          speaker: narrator
          text: The Emperor bowed low to the beautiful mermaid and offered her his arm for dinner. The Prince followed, and so did their friend the wolf. No one had invited the wolf to sit at the table, but that did not trouble him in the least.
        - id: ch04-b10
          speaker: narrator
          text: After the splendid meal, the Prince and the mermaid took their leave. They mounted the golden horse and continued homeward. On the road, the wolf turned to them.
        - id: ch04-b11
          speaker: wolf
          text: Dear friends, I must say farewell now. I leave you in such happy circumstances that our parting cannot feel entirely sad.
        - id: ch04-b12
          speaker: narrator
          text: The Prince was deeply unhappy to hear this and begged the wolf to remain with them forever. The good creature thanked him kindly but refused.
        - id: ch04-b13
          speaker: wolf
          text: If evil ever comes upon you, dear Prince, you may always depend on my friendship and gratitude.
        - id: ch04-b14
          speaker: narrator
          text: Those were his parting words. He vanished into the thicket, and the Prince could not hold back his tears as his friend disappeared in the distance. One look at his beloved mermaid soon lifted his spirits, and the two of them rode happily onward.
    - id: ch05
      title: The Brothers' Treachery
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Word of the Prince's adventures had already reached his father's court. Everyone marveled at the success of the young man they had once despised. His elder brothers had searched for the thief of the golden apples and found nothing. When they heard of their younger brother's good fortune, they were furious. They plotted together to kill him.
        - id: ch05-b02
          speaker: narrator
          text: The brothers hid in the wood that lay across the Prince's road to the palace. When he came near, they rushed upon him and beat him to death. Then they carried away the golden horse and the golden bird.
        - id: ch05-b03
          speaker: narrator
          text: But they could not persuade the golden mermaid to go with them. Nothing could make her leave that place. Since leaving the sea, she had grown so devoted to her Prince that she wanted only to live or die beside him.
        - id: ch05-b04
          speaker: narrator
          text: For many weeks the poor mermaid remained in the wood. She sat beside her lover's body and kept watch over him, refusing to abandon the place where he lay. Day after day she wept salt tears for her loss. Then, when all those sorrowful weeks had passed, their old friend the wolf suddenly appeared before her.
        - id: ch05-b05
          speaker: wolf
          text: Gather every leaf and flower you can find in this wood, and cover the Prince's body with them.
        - id: ch05-b06
          speaker: narrator
          text: The maiden obeyed. When the body lay beneath leaves and flowers, the wolf breathed across that flowery grave. And there was the Prince, resting as peacefully as a sleeping child.
        - id: ch05-b07
          speaker: wolf
          text: You may wake him now, if you wish.
        - id: ch05-b08
          speaker: narrator
          text: The mermaid leaned over the Prince and gently kissed the wounds his brothers had left on his forehead. At once he opened his eyes and woke. His joy at finding his beautiful mermaid beside him was more than words could tell. Yet when he remembered what had happened in the wood, the loss of the golden horse and the golden bird weighed heavily on him.
        - id: ch05-b09
          speaker: narrator
          text: The wolf threw himself affectionately around the Prince's neck. After a while, he advised the pair to continue their journey. Once again, the Prince and his lovely bride climbed onto the faithful wolf's back, and he carried them toward home.
    - id: ch06
      title: The Prince Comes Home
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: The old King's joy was great when he held his youngest son in his arms. He had given up all hope that the Prince would ever return. He welcomed the wolf and the golden mermaid just as warmly, and asked his son to tell the whole tale from its beginning.
        - id: ch06-b02
          speaker: narrator
          text: As the King heard what the elder brothers had done, sorrow came over him. He ordered both of them to appear before him.
        - id: ch06-b03
          speaker: narrator
          text: The brothers entered and saw the young Prince standing beside the King, alive and well. They turned as white as death. They had believed they had murdered him in the wood. The sight of him left them so startled and shaken that they could invent no lie when their father questioned them.
        - id: ch06-b04
          speaker: king
          text: Why did you treat your own brother with such wickedness?
          emotion: angry
        - id: ch06-b05
          speaker: narrator
          text: They confessed at once. They had killed their younger brother so they could possess the golden horse and the golden bird. Their father's anger knew no bounds, and he ordered both elder sons banished from the kingdom.
        - id: ch06-b06
          speaker: narrator
          text: The King could never do enough to honor his youngest son. The Prince and the beautiful mermaid were married with great splendor, and the whole court celebrated them.
        - id: ch06-b07
          speaker: narrator
          text: When the festivities ended, the wolf said farewell to them all. He returned to his life in the woods, much to the sorrow of the old King, the young Prince, and his bride.
        - id: ch06-b08
          speaker: narrator
          text: And so ended the adventures of the Prince and his friend the wolf.
