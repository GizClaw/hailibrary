audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，像编书人面对孩子娓娓而谈，幽默处轻巧含笑
        timbre: 温暖清朗
        pace: 舒缓而有自然起伏
        pitch: 中音
    king:
      display_name: 国王
      tts:
        delivery: 威严持重，关切小儿子时透出父亲的温情
        timbre: 苍老浑厚
        pace: 稍慢
        pitch: 低音
    prince:
      display_name: 小王子
      tts:
        delivery: 年轻真诚，待人坦率，遇到挫折时忧伤却不失勇气
        timbre: 清亮温和
        pace: 自然
        pitch: 中高音
    wolf:
      display_name: 狼
      tts:
        delivery: 沉着机敏，指点王子时笃定亲切，化身君王时庄严有力
        timbre: 深沉醇厚
        pace: 从容
        pitch: 中低音
    bird_emperor:
      display_name: 金鸟皇帝
      tts:
        delivery: 起初冷酷傲慢，后来敬服而郑重
        timbre: 洪亮端正
        pace: 稳健
        pitch: 中低音
    horse_emperor:
      display_name: 金马皇帝
      tts:
        delivery: 威严多疑，认输道歉时诚恳庄重
        timbre: 厚实明亮
        pace: 稳健
        pitch: 中音
  chapters:
    - id: ch01
      title: 被偷走的金苹果
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，有位权势显赫的国王。他的宝物数也数不清，花园里还有一棵神奇的树，每年都结出美丽的金苹果。可那些苹果刚一成熟，就会被人偷个精光。国王怎么守也守不住，最后只好把三个儿子叫到跟前，对两个年长的儿子下了一道命令。
        - id: ch01-b02
          speaker: king
          text: >-
            你们准备出发吧。带上金银，多领些仆从，像尊贵的王子那样去走遍天下。查清是谁偷了我的金苹果。能抓到那个贼，就把他带回来领罪。
        - id: ch01-b03
          speaker: narrator
          text: >-
            两位王子早就想到外面看看世界，听了这话都很高兴。他们赶紧收拾行装，辞别父亲，离开了都城。小王子却失望极了，因为父亲不肯让他同行。家里人一直觉得他很傻，国王生怕这个孩子在外面遭遇不测。可他一遍遍央求，怎么也不肯罢休，父亲终于答应了，也像给两个哥哥那样，替他备好金银。只是这傻小子没想到讨一匹好马，国王就把马厩里最不中用的那匹交给他。小王子也踏上了捉贼的路。可他出城的时候，满朝上下和全城百姓都在身后嘲笑起哄。
        - id: ch01-b04
          speaker: narrator
          text: >-
            王子先走进一片树林。没走多远，一头瘦得皮包骨头的狼拦在路上。王子问它是不是饿了，狼说正是。
        - id: ch01-b05
          speaker: prince
          text: >-
            看你的样子，确实饿得厉害。那就把我的马吃掉吧。
        - id: ch01-b06
          speaker: narrator
          text: >-
            狼立刻大吃起来，很快就吃光了那匹可怜的马。等它吃饱，王子瞧着它说起话来。
        - id: ch01-b07
          speaker: prince
          text: >-
            朋友，你吃了我的马，可我要去的地方远得很。光靠两条腿，无论如何也走不到。作为补偿，你至少该驮我一程吧。
        - id: ch01-b08
          speaker: wolf
          text: >-
            当然可以。
        - id: ch01-b09
          speaker: narrator
          text: >-
            王子骑到狼背上，狼便快活地跑进树林。走了一会儿，它回头问王子要去哪里。王子从父王花园里的金苹果讲起，又说两个哥哥怎样带着大队随从，先一步出门寻找窃贼。原来，这头狼并不是普通的野兽，而是个法力高强的魔法师。它听完就说，自己大概知道窃贼是谁，也能帮助王子把它捉住。
        - id: ch01-b10
          speaker: wolf
          text: >-
            邻国有一位强大的皇帝。他养着一只关在笼中的金鸟，偷苹果的就是它。那只鸟飞得太快，行窃时抓不到。你要趁夜潜进皇宫，把鸟和笼子一起带出来。记住，出来时绝对不能碰墙。

    - id: ch02
      title: 金鸟与金马
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            第二天夜里，王子偷偷进入皇宫，果真找到了笼中的金鸟。他提起鸟笼，小心绕过熟睡的卫兵，可再怎么留神，经过他们身边时还是擦到了墙。卫兵一下全醒了。他们抓住王子，痛打一顿，给他戴上锁链。第二天，皇帝判他死刑，把他关进阴暗的地牢等候行刑。
        - id: ch02-b02
          speaker: narrator
          text: >-
            狼用魔法看见了这一切。它立刻变成一位威风凛凛的君王，带着浩浩荡荡的随从来到宫中，皇帝也用最隆重的礼节迎接客人。两人谈了许多事情。这位陌生君王像是随口问起，皇帝手下到底有多少奴隶。皇帝回答说，奴隶已经多得不知该怎么处置，光是养活他们就够费心了。昨夜偏偏又捉到一个偷神鸟的家伙，所以明早就要把这个新囚犯绞死。
        - id: ch02-b03
          speaker: wolf
          text: >-
            敢偷看守森严的神鸟，那贼真够大胆。我很想亲眼看看他。
        - id: ch02-b04
          speaker: bird_emperor
          text: >-
            这有何难？请随我来。
        - id: ch02-b05
          speaker: narrator
          text: >-
            皇帝亲自领客人下到地牢。看过王子以后，两人走出囚室，化身君王的狼露出失望的神情。
        - id: ch02-b06
          speaker: wolf
          text: >-
            尊贵的陛下，我原以为会见到一个凶悍的大盗，没想到只是个可怜虫。绞死他未免太便宜了。依我看，不如给他一件极难的差事。办成了，对您有好处。办不成，再绞死他也不迟。
        - id: ch02-b07
          speaker: bird_emperor
          text: >-
            这主意很好，我正有一件事可叫他去办。邻国皇帝有一匹金马，守得很严。就让这囚犯把马偷来交给我。
        - id: ch02-b08
          speaker: narrator
          text: >-
            王子就这样被放出了地牢。皇帝的人告诉他，只要能把邻国严密看守的金马带回来，他就可以保住性命。可王子一点也高兴不起来。他根本不知道这件事该从哪里下手，只好一边赶路，一边伤心地哭，还不停地想，自己为什么偏要离开父亲的家和自己的王国。幸好没走多远，狼又站到了他面前。
        - id: ch02-b09
          speaker: wolf
          text: >-
            亲爱的王子，别这么难过。上回你没捉到金鸟，这次就会更加小心，金马一定能牵出来。千万记住，你自己不能碰墙，也别让马碰到墙，否则还会像上次那样失败。
        - id: ch02-b10
          speaker: narrator
          text: >-
            他们走了很久，终于来到金马皇帝的都城。那天已近傍晚，狼催王子立刻行动，免得卫兵发现城里来了生人。他们悄悄溜进皇家马厩，直奔守卫最多的地方。狼猜得没错，金马果然在那里。走到一道内门前，它让王子等在门外，自己先进去。不一会儿，它便回来了。
        - id: ch02-b11
          speaker: wolf
          text: >-
            金马守得非常严，不过所有卫兵都中了我的魔法。只要出去时你和马都不碰墙，就没有危险。这一次，千万要小心。
        - id: ch02-b12
          speaker: narrator
          text: >-
            王子决心再也不能出错。他走进马栏，看见卫兵们都睡熟了，便抓住缰绳，把金马慢慢牵出去。眼看就要离开马厩，一只牛虻忽然叮了马一下。金马甩起尾巴，恰好扫到墙壁。卫兵全被惊醒了。他们扑上去抓住王子，用马鞭狠狠抽他，再锁上铁链扔进地牢。第二天，皇帝下令在次日将他斩首。
        - id: ch02-b13
          speaker: narrator
          text: >-
            狼知道王子又失败了，再次化成一位君王。这一回，它带来的队伍比上回更加华丽。皇帝礼貌地迎接客人，又设宴款待。饭后，这位君王把话题转到奴隶身上，请求去看那个敢闯皇家马厩、偷走皇帝最宝贵财物的狂徒。后面的事和金鸟皇帝宫里一模一样。客人又提议用一件艰难的差事代替死刑。最后，王子若想活命，就必须在三天之内带回金色美人鱼。可直到那时，还从来没有一个凡人能够接近她。

    - id: ch03
      title: 海上的丝绸船
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            王子离开阴森的牢房，想着眼前这个危险又艰难的任务，心里十分沉重。可他才走出几英里，就看见了狼，顿时喜出望外。狡猾的狼假装什么也不知道，还故意问他金马牵到了没有。王子只好把牛虻叮马、马尾碰墙、自己再次入狱的经过全讲出来，又说了皇帝开出的活命条件。狼这才提醒他，自己已经两次设法救他走出牢狱。
        - id: ch03-b02
          speaker: wolf
          text: >-
            只要你信任我，每一步都照我说的做，最后这件事一定能办成。
        - id: ch03-b03
          speaker: narrator
          text: >-
            他们朝海边走去。大海铺在眼前，一直伸到目光尽头。明亮的阳光下，海浪闪着光，一道接一道地跳动。
        - id: ch03-b04
          speaker: wolf
          text: >-
            我会变成一条船，船上装满最漂亮的丝绸。你放心上船，抓着我的尾巴掌舵，一直驶向外海。很快，你就能碰见金色美人鱼。她若叫你跟她走，千万别去。你要回答她：“是买主到卖主这里来，不是卖主去找买主。”然后马上把船开回岸边。她舍不得这些漂亮货物，自然会跟过来。
        - id: ch03-b05
          speaker: narrator
          text: >-
            王子郑重答应，绝不会忘记。狼随即变成一条船，船舱里装满精美的丝绸，什么颜色都有。王子又惊又喜，跨上船，握住狼尾向大海深处驶去。阳光洒在蓝色波浪上，海面仿佛镀了一层金。不久，金色美人鱼游到船边，一面招手，一面叫他跟自己走。
        - id: ch03-b06
          speaker: prince
          text: >-
            你若想买东西，就该到我船上来。哪有卖主追着买主跑的道理？
        - id: ch03-b07
          speaker: narrator
          text: >-
            王子说完便调转船头，向陆地驶去。美人鱼在后面叫他停船，他只管往前开，直到船头碰上岸边的沙滩，才停下来等她。美人鱼果然一路游了过来。等她靠近，王子发现她比自己见过的任何凡间女子都美。她先绕着船游了一圈又一圈，最后轻盈地跃上甲板，要仔细看看那些丝绸。王子立刻把她抱进怀中，温柔地亲吻她的脸颊和嘴唇。
        - id: ch03-b08
          speaker: prince
          text: >-
            从今以后，你永远属于我了。
        - id: ch03-b09
          speaker: narrator
          text: >-
            就在这时，船忽然变回了狼。美人鱼吓得紧紧依偎着王子，要他保护自己。就这样，金色美人鱼被捉住了。后来，她看出王子和狼都不会伤害她，很快也就安心了。她坐在狼背上，王子骑在身后，三位一起去见金马皇帝。

    - id: ch04
      title: 三件金色的宝物
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            到了皇宫，王子先跳下狼背，再扶美人鱼下来。卫兵看见美丽的姑娘，又看见那头寸步不离王子的凶猛野兽，都恭敬地让开道路。三位很快来到皇帝面前。皇帝听完王子的经历，马上明白这件事离不开魔法。他当场放弃了得到美人鱼的念头。
        - id: ch04-b02
          speaker: horse_emperor
          text: >-
            年轻人，请原谅我从前那样可耻地对待你。要是你肯宽恕我，就收下金马吧。我承认，你拥有的力量远远超过我的理解。毕竟，从来没有凡人能接近金色美人鱼，而你成功了。
        - id: ch04-b03
          speaker: narrator
          text: >-
            皇帝设下盛大的宴席。席间，王子又从头讲了一遍自己的历险，满座宾客听得又惊又奇。可王子已经厌倦了漂泊，一心想回到自己的王国。宴席刚结束，他便向皇帝告辞，把美人鱼扶上金马，自己也坐到她身后。两个人快活地往前走，狼一路小跑跟在后面。他们很快来到金鸟皇帝的国度。
        - id: ch04-b04
          speaker: narrator
          text: >-
            王子的名声和他的奇遇早已传到这里。皇帝坐在宝座上，等着他们到来。三位进入王宫庭院时，只见四处灯火辉煌，装饰一新，原来整座宫殿都在迎接他们。王子和美人鱼登上台阶，狼也跟了进去。皇帝亲自迎上来，把客人领进宝座大厅。这时，一名仆人捧来了金鸟和金笼。
        - id: ch04-b05
          speaker: bird_emperor
          text: >-
            请你收下这只金鸟，就当接受我的情意。也请原谅你先前在我手里受过的屈辱。
        - id: ch04-b06
          speaker: narrator
          text: >-
            皇帝又向美人鱼深深鞠躬，伸出手臂，引她入席。王子和她的朋友狼紧跟在后面。没人请狼坐下，它却毫不见外，也在餐桌旁占了一个位子，仿佛受到邀请本来就是理所当然的事。等丰盛的晚宴结束，王子和美人鱼向皇帝告辞，再次同乘金马，继续回家。
        - id: ch04-b07
          speaker: narrator
          text: >-
            半路上，狼回头看着王子。
        - id: ch04-b08
          speaker: wolf
          text: >-
            亲爱的朋友们，我得在这里告别了。如今你们这样幸福，我们分别也用不着伤心。
        - id: ch04-b09
          speaker: narrator
          text: >-
            王子听了很难过，一再请狼永远和他们在一起。善良的狼谢过他的邀请，却还是拒绝了。它转身走进树丛，快要看不见时，又回头喊道。
        - id: ch04-b10
          speaker: wolf
          text: >-
            亲爱的王子，以后无论什么时候，只要灾祸落到你身上，你都可以相信我的友谊。我一定会来报答你。
        - id: ch04-b11
          speaker: narrator
          text: >-
            这就是狼临别前说的最后一句话。王子望着朋友消失在远方，忍不住流下眼泪。不过，看一眼身旁心爱的美人鱼，他又有了精神。两人继续快快乐乐地赶路。

    - id: ch05
      title: 林中的暗算
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            其实，王子的历险早已传回父王的宫廷。从前受尽轻视的小儿子竟然大获成功，人人都觉得不可思议。两个哥哥没有找到偷金苹果的贼，听说弟弟带着宝物回来，又妒又恨，便商量好要杀死他。他们埋伏在王子回宫一定会经过的树林里，等弟弟一出现，就冲上去把他活活打死，再抢走金马和金鸟。
        - id: ch05-b02
          speaker: narrator
          text: >-
            两个哥哥使尽办法，也不能让美人鱼跟他们走。她一步也不肯离开王子。自从告别大海，她已经深深爱上他，只愿同他一起活，也愿同他一起死。可怜的美人鱼守着爱人的尸体，整整坐了好几个星期。她不停地哭，流下的泪水也像海水一样咸。
        - id: ch05-b03
          speaker: narrator
          text: >-
            一天，他们的老朋友狼突然出现了。
        - id: ch05-b04
          speaker: wolf
          text: >-
            去把林子里所有能找到的树叶和鲜花都拿来，盖在王子身上。
        - id: ch05-b05
          speaker: narrator
          text: >-
            美人鱼照它说的做了。狼朝那座鲜花覆盖的坟吹了一口气。再一看，王子正安安静静地躺在那里，就像一个睡熟的孩子。
        - id: ch05-b06
          speaker: wolf
          text: >-
            现在，你想叫醒他就叫吧。
        - id: ch05-b07
          speaker: narrator
          text: >-
            美人鱼俯下身，轻轻吻过王子额头上的伤口。王子睁开了眼睛。见到美丽的美人鱼还守在身边，他高兴极了，只是想到金鸟和金马已经丢了，心里有些难过。狼也扑到王子颈间拥抱他。过了一会儿，它劝两位继续上路。王子和他美丽的新娘再次骑上忠实的狼，一起向王宫赶去。

    - id: ch06
      title: 王子回来了
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            国王早已不敢再盼望小儿子回来。如今他看见王子活生生站在眼前，立刻紧紧抱住儿子，心中的喜悦简直说不尽。他也热情迎接了狼和金色美人鱼，又让王子从开头讲起，把所有经历再讲一遍。
        - id: ch06-b02
          speaker: narrator
          text: >-
            老国王听说两个大儿子干下的卑劣事情，难过极了，马上派人把他们叫来。两人以为弟弟早就死在自己手里，此刻见他好端端地站在面前，顿时吓得脸色惨白。国王质问他们，为什么要这样狠心地伤害亲弟弟。他们慌得连谎话都编不出来，只好立刻招认，是为了夺走金马和金鸟，才杀了小王子。
        - id: ch06-b03
          speaker: narrator
          text: >-
            国王听完怒不可遏，下令把两个大儿子一起赶出国境，永远放逐。至于死而复生的小儿子，他无论给多少荣誉，都觉得还远远不够。王子和美丽的美人鱼举行了盛大华美的婚礼。庆典结束以后，狼向在场的所有人告别，重新回到树林里，继续从前的生活。老国王、年轻的王子和他的新娘都万分舍不得它离开。
        - id: ch06-b04
          speaker: narrator
          text: >-
            王子和狼朋友的历险，就这样结束了。
        - id: ch06-b05
          speaker: narrator
          text: >-
            这个故事，是格林兄弟写下的。
