audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，像编书人面对孩子娓娓而谈
        timbre: 温暖清朗
        pace: 舒缓而有自然起伏
        pitch: 中音
  chapters:
    - id: ch01
      title: 五颜六色的童话书
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            这是这套彩色童话书的第三本，恐怕也是最后一本。最先问世的是《蓝色童话书》。后来，你们这些孩子还想听更多故事，我们就编了《红色童话书》。你们听了还不过瘾，于是又有了眼前这本《绿色童话书》。几本书的故事来自四面八方，有法国的、德国的、俄国的、意大利的，也有苏格兰和英格兰的，还有一篇中国故事。各国人会为小事争来争去，喜欢童话这一点倒是完全相同。为什么呢？大概因为在很久很久以前，大人的心思也像孩子。那时还没有人忙着写报纸、布道词、小说和长诗，大家坐在一起，讲的正是童话书里的这类故事。他们真心相信女巫能把人变成野兽，野兽能够开口，谁戴上魔戒，谁就能隐身，其他奇迹也全都可能发生。世界慢慢长大以后，那些没写下来的故事本来会消失。多亏老奶奶还记得，讲给小孙儿孙女听。孩子们长大，也成了爷爷奶奶，又把故事传给下一代。因此，这些故事早在读写和印刷出现以前就有了。最早落在纸上的童话出自埃及，大约与约瑟处在同一时代，已有近三千五百年。差不多三千年前，希腊的荷马也听过童话。他把它们编成《奥德赛》这部长诗，希望你们将来能读一读。书里有女巫把人变成猪，有人刺瞎了大而愚笨的巨人那只眼睛，还有隐身帽和飞快鞋。后来，杀巨人杰克也穿过那双鞋。这些世上最古老的故事，原是心性像孩子的人编来给自己取乐的。如今孩子依旧爱听，那些没有忘记童年滋味的大人也一样喜欢。
    - id: ch02
      title: 故事与教训
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            有些故事当然不只想逗人开心，还想教人学好。童话里，那个善待动物、礼貌、慷慨又勇敢的男孩，总能顺利闯过考验。讲故事的人大约盼着听众也能善良无私，待人有礼，遇事勇敢。这就是故事里的教训。可我们读童话时，多半先顾着故事有多有趣，不大惦记它在教什么。现在有些大人认为童话不适合孩子。他们说，故事都是假的，世上哪有女巫和会说话的野兽？里面还常常死人，邪恶的巨人尤其容易送命。可是你们读故事，自然分得出几分真、几分假。我从没听说哪个孩子因为杰克杀过巨人，就去杀一个特别高的人。就算一个孩子有继母，也不会因为童话里的继母常惹人讨厌，便故意欺负自己的继母。童话里的怪物再可怕，如今也不必怕了。那一种怪物早就不在世上游荡，不管很久以前它做过些什么，现在都已经化成石头，遗骸还摆在博物馆里呢。所以我不担心魔法师和龙会吓坏你们。再说，即使它们的法力最强，真正勇敢的男孩女孩也总能把它们制伏。
    - id: ch03
      title: 古老与新写的童话
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            书里的故事并不全给同样年纪的孩子听。像《半只小鸡》，很小的孩子就能听懂，另一些更适合大孩子。最长的几篇，例如《冰之心》，也不像别的故事那样古老。大约两百年前，奥努瓦夫人、凯吕斯伯爵这些聪明的男女作家用法文写下了它们。到了今天，真正会写好童话的人恐怕已经很少，说不定一个也没有。因为他们不大相信自己讲的故事，却总想显得比上天给他们的才智还要机灵。
    - id: ch04
      title: 应当感谢的人
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            这一回，我们暂且把最后一批古老故事交给你们。愿你们读得开心，也别忘了感谢许多人。格林兄弟听老奶奶讲故事，再把故事记下来。塞比约先生和夏尔·马雷勒先生从法国乡亲那里借来一些故事，送给我们。福特先生为书画了插图。布莱克利小姐、阿尔玛·阿莱恩小姐、埃莉诺·塞勒小姐、梅·塞勒小姐、赖特小姐和兰格夫人，则把许多法文、德文和其他文字的故事译了出来。
    - id: ch05
      title: 再见，小读者
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            如果明年我们还送一本书给你们，那就不再是童话书了。新书究竟是什么，现在先保密，只希望它不会让你们觉得无聊。那么，再见吧。读完一本童话书，不妨把它借给没有童话书的孩子。你们也可以用自己的话，把故事讲给他们听。这样度过一段时光，可真是一件愉快的事。
