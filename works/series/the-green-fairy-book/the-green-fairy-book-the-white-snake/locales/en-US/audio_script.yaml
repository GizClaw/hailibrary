  chapters:
    - id: ch01
      title: The Secret Dish
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Not very long ago, there lived a King whose wisdom was famous far and wide. He seemed to know everything, even the most closely guarded secrets. It was almost as though the winds carried every hidden piece of news straight to him.
        - id: ch01-b02
          speaker: narrator
          text: The King had one very strange habit. Each day, after dinner was cleared away and everyone had left, a trusted servant brought him a covered dish. No one knew what lay beneath the cover. The King never lifted it or ate from the dish until he was entirely alone.
        - id: ch01-b03
          speaker: narrator
          text: This went on for some time. Then one day, the servant who carried the dish away could no longer master his curiosity. He took it to his own room and carefully locked the door. When he raised the cover, he found a white snake lying on the dish. He wanted so badly to know how it tasted that he cut off a small piece and put it in his mouth.
        - id: ch01-b04
          speaker: narrator
          text: The instant it touched his tongue, he heard tiny voices whispering beyond his window. He went closer and listened. Sparrows were talking to one another, telling everything they had seen in the fields and woods. By eating the white snake, the servant had gained the power to understand the language of animals.
        - id: ch01-b05
          speaker: narrator
          text: That very day, the Queen lost her favorite ring. Suspicion fell on the trusted servant because he could go anywhere in the palace. The King summoned him and spoke in anger.
        - id: ch01-b06
          speaker: king
          text: Find the thief by tomorrow. If you fail, you will be arrested and put on trial yourself.
          emotion: angry
        - id: ch01-b07
          speaker: narrator
          text: The servant insisted that he was innocent, but it did no good. He was sent away without another word. Troubled and frightened, he went down to the yard to think. Several ducks were resting beside a little stream. They preened their feathers and talked excitedly about where they had waddled that morning and all the good things they had eaten. One duck sounded unhappy.
        - id: ch01-b08
          speaker: duck
          text: Something is sitting terribly heavy in my stomach. I was in such a hurry that I swallowed a ring lying right under the Queen's window.
          emotion: sad
        - id: ch01-b09
          speaker: narrator
          text: As soon as the servant heard that, he caught the duck by the neck and carried her to the kitchen.
        - id: ch01-b10
          speaker: servant
          text: Why not cook this duck? Look how nice and fat she is.
        - id: ch01-b11
          speaker: cook
          text: She certainly worked hard at stuffing herself. I'd say she's been ready for the roasting spit for quite a while.
        - id: ch01-b12
          speaker: narrator
          text: The cook weighed the duck in his hand, then cut off her head. When he opened her, there was the Queen's ring inside her stomach. The servant could now prove that he had taken nothing.
        - id: ch01-b13
          speaker: narrator
          text: The King knew he had treated the servant unjustly and wanted to make amends. He told the young man to choose any reward and promised him the highest position at court that he could desire. But the servant refused every honor. He asked only for a horse and enough money to travel, because he wished to see something of the world. The King granted his request, and the young man set out.
    - id: ch02
      title: Three Acts of Kindness
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: During his journey, the young man came one day to a large pond. At the edge, three fish had become tangled in the reeds. They were out of the water and gasping. Fish are usually thought to be silent, but he could hear them grieving because they were about to die in such a miserable way.
        - id: ch02-b02
          speaker: narrator
          text: The young man had a very kind heart. He got down from his horse, freed the three prisoners, and placed them back in the pond. They splashed with joy and raised their heads above the water.
        - id: ch02-b03
          speakers: [fish_one, fish_two, fish_three]
          ensemble: chorus
          text: We will remember this, and one day we will reward you for saving us!
          emotion: happy
        - id: ch02-b04
          speaker: narrator
          text: He rode on. After a while, he thought he heard a voice coming from the sand beneath his feet. He stopped to listen. It was the King of the Ants, crying out in complaint.
        - id: ch02-b05
          speaker: ant_king
          text: If only people and their clumsy animals would stay away from us! That foolish horse is crushing my subjects beneath its great hooves without mercy!
          emotion: angry
        - id: ch02-b06
          speaker: narrator
          text: The young man immediately guided his horse onto a side path. The Ant-King called after him.
        - id: ch02-b07
          speaker: ant_king
          text: We will remember what you did, and we will reward you!
        - id: ch02-b08
          speaker: narrator
          text: Next the road entered a wood. There he saw a father raven and a mother raven standing beside their nest. They were throwing their young birds out.
        - id: ch02-b09
          speakers: [father_raven, mother_raven]
          ensemble: duo
          text: Off you go, you young rascals! We cannot feed you any longer. You are big enough now to find food for yourselves!
        - id: ch02-b10
          speaker: narrator
          text: The little ravens lay on the ground, flapping and beating their wings. They shrieked in despair.
        - id: ch02-b11
          speakers: [raven_one, raven_two, raven_three]
          ensemble: chorus
          text: How can we poor, helpless children feed ourselves? We cannot even fly yet! What can we do except starve?
          emotion: fearful
        - id: ch02-b12
          speaker: narrator
          text: The kind young man dismounted. He drew his sword and killed his horse, leaving it as food for the young ravens. They hopped over, ate until they were satisfied, and called to him.
        - id: ch02-b13
          speakers: [raven_one, raven_two, raven_three]
          ensemble: chorus
          text: We will remember your kindness, and we will reward you!
          emotion: happy
        - id: ch02-b14
          speaker: narrator
          text: With his horse gone, the young man had to continue on foot.
    - id: ch03
      title: The Ring in the Lake
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: After walking a long way, he reached a great town. Crowds filled the streets, and everyone was in an uproar. A herald rode through the town making an announcement.
        - id: ch03-b02
          speaker: herald
          text: The King's daughter is looking for a husband. Any man who wishes to marry her must first complete a difficult task. If he fails, he must give up his life!
        - id: ch03-b03
          speaker: narrator
          text: Many men had tried and lost their lives. But when the young man saw the King's daughter, her beauty dazzled him so completely that he forgot the danger. He went before the King and offered himself as a suitor.
        - id: ch03-b04
          speaker: narrator
          text: He was taken to a large lake. There, as he watched, a golden ring was thrown into the water. The King ordered him to dive down and bring it back.
        - id: ch03-b05
          speaker: king
          text: If you come up without the ring, you will be thrown back into the lake again and again, until you drown in its depths.
        - id: ch03-b06
          speaker: narrator
          text: Everyone pitied the handsome young man, but they left him alone on the shore. He stood there wondering what he could possibly do. Then, all at once, he saw three fish swimming toward him. They were the same three whose lives he had saved.
        - id: ch03-b07
          speaker: narrator
          text: The middle fish carried a mussel in its mouth and laid it at the young man's feet. He picked up the mussel and opened it. Inside lay the golden ring.
        - id: ch03-b08
          speaker: narrator
          text: Delighted, he took the ring to the King's daughter and expected to receive the reward he had been promised. But the proud Princess heard that he was not of equal birth and looked down on him. Instead, she demanded that he complete a second task.
    - id: ch04
      title: Ten Sacks of Millet
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The Princess went into the garden. With her own hands, she scattered ten full sacks of millet across the grass.
        - id: ch04-b02
          speaker: princess
          text: By tomorrow morning, before the sun rises, he must gather every bit of this millet. All ten sacks must be filled, and not one grain may be missing.
        - id: ch04-b03
          speaker: narrator
          text: The young man sat down in the garden and tried to imagine how anyone could finish such a task. He could think of no way at all. Sadly, he stayed where he was and waited for death to come at daybreak.
        - id: ch04-b04
          speaker: narrator
          text: But when the first sunlight touched the garden, he saw all ten sacks standing in a row, completely full. Not a single grain was missing. During the night, the Ant-King had arrived with thousands upon thousands of his subjects. The grateful ants had worked busily until every grain of millet was gathered and returned to the sacks.
        - id: ch04-b05
          speaker: narrator
          text: The King's daughter came down to inspect the garden herself. She was amazed to see that her suitor had completed the task. Even then, her proud heart would not give way.
        - id: ch04-b06
          speaker: princess
          text: He may have completed two tasks, but I still will not marry him. First he must bring me an apple from the tree of life.
    - id: ch05
      title: The Golden Apple
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The young man had no idea where the tree of life might grow. Still, he set out to search for it. He meant to walk as far as his legs could carry him, though he had no hope of finding the tree.
        - id: ch05-b02
          speaker: narrator
          text: He traveled through three different kingdoms. One night, he came to a wood and lay down beneath a tree to sleep. Suddenly, he heard something moving in the branches above him. A golden apple dropped straight into his hand.
        - id: ch05-b03
          speaker: narrator
          text: At that same moment, three ravens flew down and perched on his knee.
        - id: ch05-b04
          speakers: [raven_one, raven_two, raven_three]
          ensemble: chorus
          text: We are the three young ravens you saved from starving. When we grew up and heard that you were searching for the golden apple, we flew far across the seas. We went all the way to the end of the world, where the tree of life grows, and brought this apple back for you.
          emotion: happy
        - id: ch05-b05
          speaker: narrator
          text: The young man was filled with joy. He immediately began the journey back, carrying the golden apple to the lovely Princess.
    - id: ch06
      title: The Apple of Life
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: When the young man placed the golden apple before her, the Princess had no objection left to make. They divided the apple of life and ate it together. Her heart filled with love for him, and the two of them lived side by side to a great age, happy and undisturbed.
