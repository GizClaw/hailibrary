audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，像编书人面对孩子娓娓而谈，幽默处轻巧含笑
        timbre: 温暖清朗
        pace: 舒缓而有自然起伏
        pitch: 中音
    first_king:
      display_name: 智慧的国王
      tts:
        delivery: 威严自信，发怒时冷厉逼人，认错后坦率大方
        timbre: 浑厚成熟
        pace: 稳重
        pitch: 低音
    servant:
      display_name: 贴身侍从
      tts:
        delivery: 年轻诚恳，好奇时小心试探，历险时善良坚定
        timbre: 清朗温厚
        pace: 自然明快
        pitch: 中音
    duck:
      display_name: 鸭子
      tts:
        delivery: 絮絮叨叨，难受时带着委屈和愁苦
        timbre: 略显沙哑
        pace: 稍快
        pitch: 中高音
    cook:
      display_name: 厨师
      tts:
        delivery: 爽快务实，带一点粗犷的玩笑口吻
        timbre: 粗实响亮
        pace: 自然
        pitch: 中低音
    fish_1:
      display_name: 第一条鱼
      tts:
        delivery: 感激真挚，许诺时郑重清楚
        timbre: 清亮轻柔
        pace: 轻快
        pitch: 中高音
    fish_2:
      display_name: 第二条鱼
      tts:
        delivery: 感激真挚，许诺时郑重清楚
        timbre: 清亮轻柔
        pace: 轻快
        pitch: 中高音
    fish_3:
      display_name: 第三条鱼
      tts:
        delivery: 感激真挚，许诺时郑重清楚
        timbre: 清亮轻柔
        pace: 轻快
        pitch: 中高音
    ant_king:
      display_name: 蚁王
      tts:
        delivery: 爱护臣民，抱怨时气恼，许诺时庄重有力
        timbre: 细而坚实
        pace: 稍快
        pitch: 高音
    father_raven:
      display_name: 乌鸦爸爸
      tts:
        delivery: 严厉急躁，说话直截了当
        timbre: 低哑
        pace: 稍快
        pitch: 中低音
    mother_raven:
      display_name: 乌鸦妈妈
      tts:
        delivery: 严厉急躁，说话直截了当
        timbre: 沙哑清楚
        pace: 稍快
        pitch: 中音
    young_raven_1:
      display_name: 第一只小乌鸦
      tts:
        delivery: 年幼急切，受委屈时尖声争辩，报恩时欢快真诚
        timbre: 稚嫩清脆
        pace: 较快
        pitch: 高音
    young_raven_2:
      display_name: 第二只小乌鸦
      tts:
        delivery: 年幼急切，受委屈时尖声争辩，报恩时欢快真诚
        timbre: 稚嫩清脆
        pace: 较快
        pitch: 高音
    young_raven_3:
      display_name: 第三只小乌鸦
      tts:
        delivery: 年幼急切，受委屈时尖声争辩，报恩时欢快真诚
        timbre: 稚嫩清脆
        pace: 较快
        pitch: 高音
    herald:
      display_name: 传令官
      tts:
        delivery: 公事公办，宣告时响亮清晰
        timbre: 洪亮厚实
        pace: 稳健
        pitch: 中低音
    princess_king:
      display_name: 公主的父王
      tts:
        delivery: 威严冷峻，宣布考验和惩罚时不容置疑
        timbre: 深沉浑厚
        pace: 缓慢
        pitch: 低音
    princess:
      display_name: 公主
      tts:
        delivery: 起初高傲挑剔，态度冷淡，最后变得温柔真挚
        timbre: 年轻明亮
        pace: 从容
        pitch: 中高音
  chapters:
    - id: ch01
      title: 国王盘中的秘密
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            就在不久以前，有一位国王，他的智慧天下闻名。世上好像没有什么能瞒过他，连最隐秘的消息，也仿佛会随着风飘到他耳边。不过，这位国王有个很古怪的习惯。每天吃过饭，等餐桌收拾干净、所有人都退下以后，一名贴身侍从便会送来一只盖着盖子的盘子。盘里装的是什么，谁也不知道。国王总要等到身边一个人也没有，才肯揭开盖子享用。
        - id: ch01-b02
          speaker: narrator
          text: >-
            这样的日子过了很久。终于有一天，侍从来收盘子时，再也忍不住心里的好奇。他悄悄把盘子带回房间，仔细锁上门，这才揭开盖子。盘里竟躺着一条白蛇。看着看着，他忽然很想尝尝味道，便割下一小片，放进嘴里。
        - id: ch01-b03
          speaker: narrator
          text: >-
            蛇肉才碰到他的舌头，窗外就传来一阵奇怪的细语。侍从走近窗户，侧耳一听，原来是几只麻雀在聊天。它们正争着讲自己在田野和树林里见到的事。他这才明白，那片白蛇肉让他听懂了动物的话。
        - id: ch01-b04
          speaker: narrator
          text: >-
            偏巧这一天，王后最心爱的戒指丢了。贴身侍从能出入宫中各处，大家便怀疑是他偷的。国王把他叫来，怒气冲冲地下了命令。
        - id: ch01-b05
          speaker: first_king
          text: >-
            明天以前，你必须找出偷戒指的人。要是找不到，就把你抓起来受审！
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: >-
            侍从怎样申辩也没有用，国王说完便把他赶了出去。他又惊又愁，走到院子里，苦苦盘算该怎么逃过这场祸事。小溪旁歇着一群鸭子，它们一边用嘴梳理羽毛，一边热热闹闹地交谈。侍从停下来听，只听它们说起一早去过的地方，还有一路找到的美食。说着说着，其中一只鸭子难过地开了口。
        - id: ch01-b07
          speaker: duck
          text: >-
            唉，我肚子里有样东西沉得要命，压得我真难受。我刚才太着急，竟把王后窗户下面的一枚戒指吞了。
          emotion: sad
        - id: ch01-b08
          speaker: narrator
          text: >-
            侍从一听，马上掐住鸭子的脖子，把它送进厨房。
        - id: ch01-b09
          speaker: servant
          text: >-
            厨师，你看这只鸭子又肥又壮，不如把它杀了吧。
        - id: ch01-b10
          speaker: cook
          text: >-
            说得对。它为了把自己喂得这么肥，准没少下功夫。看样子，它早就在等着上烤叉啦。
        - id: ch01-b11
          speaker: narrator
          text: >-
            厨师把鸭子托在手里掂了掂，随后一刀砍下鸭头。等他剖开鸭肚，王后的戒指果然躺在里面。

    - id: ch02
      title: 走向外面的世界
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            侍从有了戒指，很快就证明了自己的清白。国王知道冤枉了他，很想补偿自己的过错，便让他随意提出一个愿望，还答应把宫里他想要的最高职位赐给他。
        - id: ch02-b02
          speaker: servant
          text: >-
            陛下，我不要职位。请给我一匹马，再给我一些路上的盘缠。我想到外面走一走，看看这个世界。
        - id: ch02-b03
          speaker: narrator
          text: >-
            国王答应了，侍从就骑马踏上旅途。一天，他来到一片大池塘边，看见三条鱼被芦苇缠住，离开水面，正艰难地喘气。人们总以为鱼儿不会说话，他却清楚听见它们在哀叹，自己就要这样凄惨地死去。
        - id: ch02-b04
          speaker: narrator
          text: >-
            侍从心地善良，赶紧下马，把三条鱼从芦苇里救出来，放回水中。鱼儿快活地拍着水，纷纷把脑袋伸出水面。
        - id: ch02-b05
          speakers: [fish_1, fish_2, fish_3]
          ensemble: chorus
          text: >-
            你救了我们的命！我们一定记住你的恩情，以后一定报答你！
          emotion: happy
        - id: ch02-b06
          speaker: narrator
          text: >-
            他接着往前走。没过多久，脚下的沙土里好像传出了说话声。他勒住马细听，听见蚁王正在气恼地抱怨。
        - id: ch02-b07
          speaker: ant_king
          text: >-
            人们带着这些笨重的牲口，为什么不能躲我们远一点？这匹蠢马正用它的大蹄子踩死我的臣民，一点也不留情！
          emotion: angry
        - id: ch02-b08
          speaker: narrator
          text: >-
            侍从立刻掉转方向，骑进旁边的一条小路。蚁王在他身后大声喊起来。
        - id: ch02-b09
          speaker: ant_king
          text: >-
            你的好意我们记住了，以后一定报答你！
        - id: ch02-b10
          speaker: narrator
          text: >-
            再往前，道路进入一片树林。侍从看见乌鸦夫妇站在巢边，正把三只小乌鸦赶出窝去。
        - id: ch02-b11
          speakers: [father_raven, mother_raven]
          ensemble: duo
          text: >-
            快走，你们这些小坏蛋！我们再也喂不起你们了。你们已经长得够大，该自己找东西吃了！
        - id: ch02-b12
          speaker: narrator
          text: >-
            可怜的小乌鸦跌在地上，只能不停拍打翅膀。它们急得尖声叫嚷。
        - id: ch02-b13
          speakers: [young_raven_1, young_raven_2, young_raven_3]
          ensemble: chorus
          text: >-
            我们连飞都不会，怎么自己找吃的？除了活活饿死，我们还能怎么办？
          emotion: fearful
        - id: ch02-b14
          speaker: narrator
          text: >-
            善良的年轻人下了马，拔剑杀死自己的坐骑，把马留给小乌鸦充饥。三只小鸟蹦跳着围上去，填饱了肚子，又一齐啾啾叫起来。
        - id: ch02-b15
          speakers: [young_raven_1, young_raven_2, young_raven_3]
          ensemble: chorus
          text: >-
            你的恩情我们不会忘，以后一定报答你！
          emotion: happy

    - id: ch03
      title: 湖底的金戒指
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            没有了马，年轻人只好步行。他走了很远很远，终于来到一座大城。街上挤满了人，到处闹哄哄的。一名传令官骑着马穿过人群，高声宣告国王的旨意。
        - id: ch03-b02
          speaker: herald
          text: >-
            国王的女儿要挑选丈夫！想向公主求婚的人，必须先完成一项艰难的考验。谁要是失败，就得交出性命！
        - id: ch03-b03
          speaker: narrator
          text: >-
            已经有许多人拿性命尝试过，却都没能成功。年轻人一见公主，便被她的美貌迷住，所有危险都抛到了脑后。他走进王宫，告诉国王，自己愿意接受考验，向公主求婚。
        - id: ch03-b04
          speaker: narrator
          text: >-
            有人领他来到一片大湖边，当着他的面把一枚金戒指扔进湖中。国王命他下水寻找，又冷冷补了一句。
        - id: ch03-b05
          speaker: princess_king
          text: >-
            你要是没带回戒指，就会一次次被扔进湖里，直到沉到湖底淹死。
        - id: ch03-b06
          speaker: narrator
          text: >-
            众人都替这个英俊的年轻人难过，纷纷离开了湖岸。年轻人独自站在那里，想来想去，也不知道该怎么办。就在这时，三条鱼忽然向岸边游来。他一眼认出，这正是自己从芦苇中救出的鱼儿。中间那条嘴里衔着一只河蚌，把它放在年轻人的脚边。他捡起河蚌，打开一看，那枚金戒指就在里面。
        - id: ch03-b07
          speaker: narrator
          text: >-
            年轻人喜出望外，立刻把戒指送到公主面前，以为终于能得到许诺的奖赏。可公主听说他出身低微，觉得他配不上自己，眼中满是轻蔑。她拒绝嫁给他，又提出了第二项考验。

    - id: ch04
      title: 一粒也不能少
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            公主亲自走进花园，将十袋小米一把把撒到草地上。等所有袋子都空了，她才说出自己的要求。
        - id: ch04-b02
          speaker: princess
          text: >-
            明天太阳升起以前，他得把这些小米全都捡回来。一粒也不能少。
        - id: ch04-b03
          speaker: narrator
          text: >-
            年轻人坐在花园里，怎么想也想不出办法。他只能满心愁苦地等下去，以为天一亮，自己就要送命。
        - id: ch04-b04
          speaker: narrator
          text: >-
            可是，清晨的第一缕阳光照进花园时，他抬头一看，十只袋子已经装得满满的，还整齐地排成一行。地上连一粒小米都没有落下。原来，蚁王趁着夜色，带来了成千上万的臣民。心怀感激的小蚂蚁们忙了一整夜，把每一粒小米都收进袋中。
        - id: ch04-b05
          speaker: narrator
          text: >-
            公主亲自来到花园，发现求婚者真的完成了考验，惊讶得说不出话来。可她那颗骄傲的心还是不肯低头。
        - id: ch04-b06
          speaker: princess
          text: >-
            就算他完成了两项考验，我也不会嫁给他。除非，他能从生命树上带一只苹果回来。

    - id: ch05
      title: 世界尽头的苹果
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            年轻人根本不知道生命树长在哪里，还是迈开双腿，动身去寻找。他并不指望真能找到，只是下定决心，只要还走得动，就一直往前走。
        - id: ch05-b02
          speaker: narrator
          text: >-
            他接连穿过三个王国。一天夜里，他走进一片树林，实在累了，便躺到一棵树下，准备在那里睡一晚。忽然，头顶的树枝发出一阵响声。一只金苹果掉下来，正好落进他手中。紧接着，三只乌鸦飞到他身边，停在他的膝头。
        - id: ch05-b03
          speakers: [young_raven_1, young_raven_2, young_raven_3]
          ensemble: chorus
          text: >-
            我们就是你救过的三只小乌鸦。那时，我们差点饿死，是你给了我们食物。长大以后，我们听说你在找金苹果，就越过遥远的大海，一直飞到世界尽头。生命树长在那里，这只金苹果就是我们为你取来的。
          emotion: happy

    - id: ch06
      title: 生命之果
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            年轻人欢喜极了，立刻踏上归途，把金苹果带回公主面前。这一次，公主再也没有理由反对。他们把生命之果分开，一同吃了下去。
        - id: ch06-b02
          speaker: narrator
          text: >-
            从那以后，公主的心里充满了对年轻人的爱。两个人相守到很老很老的年纪，一生平静，再也没有什么扰乱他们的幸福。
        - id: ch06-b03
          speaker: narrator
          text: >-
            这个故事，是格林兄弟写下的。
