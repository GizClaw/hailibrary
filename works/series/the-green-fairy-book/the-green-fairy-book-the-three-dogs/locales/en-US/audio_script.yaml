  chapters:
    - id: ch01
      title: The Three Black Dogs
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a shepherd with two children, a son and a daughter. As he lay dying, he called them to him.
        - id: ch01-b02
          speaker: father
          text: All I can leave you is our little house and three sheep. Divide them however you choose, but whatever happens, do not quarrel over them.
        - id: ch01-b03
          speaker: narrator
          text: After their father died, the brother asked his sister which she wanted, the sheep or the house. She chose the house.
        - id: ch01-b04
          speaker: shepherd
          text: Then the sheep are mine. I'll take them out into the wide world and seek my fortune. Plenty of others have found good luck that way. Besides, I was born on a Sunday, and that must count for something.
        - id: ch01-b05
          speaker: narrator
          text: So he set off with the three sheep walking ahead of him. For a long while, fortune seemed to want nothing to do with him. One day he sat sadly at a crossroads. A man suddenly appeared there with three black dogs, each larger than the one before it.
        - id: ch01-b06
          speaker: stranger
          text: Well, my fine fellow, those are three fat sheep. Give them to me, and I'll give you my three dogs in return.
        - id: ch01-b07
          speaker: narrator
          text: Even in his misery, the young man had to smile.
        - id: ch01-b08
          speaker: shepherd
          text: What use would your dogs be to me? My sheep find their own food. I'd have to feed those three myself.
        - id: ch01-b09
          speaker: stranger
          text: These are no common dogs. They will feed you, protect you, and make your fortune. The smallest is Salt. Whenever you want food, he will fetch it. The second is Pepper. Anyone who tries to hurt you will be torn to pieces. The biggest and strongest is Mustard. His teeth can break through iron and steel.
        - id: ch01-b10
          speaker: narrator
          text: At last the shepherd agreed and handed over his sheep. He decided to test the stranger's promise at once.
        - id: ch01-b11
          speaker: shepherd
          text: Salt, I'm hungry.
        - id: ch01-b12
          speaker: narrator
          text: Before he had finished speaking, Salt vanished. A few minutes later, the dog returned with a large basket of delicious food. The shepherd knew he had made a wonderful bargain, and he went on his way in the highest spirits.
    - id: ch02
      title: The Dragon on the Mountain
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: One day he met a carriage drawn by two horses. Black cloth covered the carriage and the horses, and the coachman wore mourning clothes from head to foot. Inside sat a beautiful girl in a black dress, weeping bitterly. Even the horses moved slowly, their heads hanging low.
        - id: ch02-b02
          speaker: shepherd
          text: Coachman, why is everyone grieving?
        - id: ch02-b03
          speaker: narrator
          text: The coachman refused to answer at first. The shepherd kept asking until at last the man gave in.
        - id: ch02-b04
          speaker: coachman
          text: A huge dragon lives near here, and every year it demands that we sacrifice a beautiful maiden. This year the lot fell on the King's daughter. That is why the whole country is mourning.
        - id: ch02-b05
          speaker: narrator
          text: The shepherd felt deeply sorry for the Princess, so he followed her carriage. Before long, it stopped at the foot of a high mountain. The girl stepped out and began the sad, slow walk toward her terrible fate. When the coachman saw the shepherd going after her, he called out a warning.
        - id: ch02-b06
          speaker: coachman
          text: Turn back! If you value your life, do not follow her up that mountain.
        - id: ch02-b07
          speaker: narrator
          text: The young man would not listen. He kept climbing with the Princess. Halfway up the mountain, they saw the monster coming toward them. It had the body of a snake, enormous wings and claws, and flames poured from its mouth as it prepared to seize its victim.
        - id: ch02-b08
          speaker: shepherd
          text: Pepper, save her!
        - id: ch02-b09
          speaker: narrator
          text: Pepper sprang at the dragon. They fought fiercely until the dog sank his teeth deep into its neck. The monster rolled over and soon lay dead. Pepper ate the whole body except for its two front teeth. The shepherd picked those up and slipped them into his pocket.
        - id: ch02-b10
          speaker: narrator
          text: Terror and joy overwhelmed the Princess, and she fainted at her rescuer's feet. When she came to herself, she looked up at him and pleaded with him.
        - id: ch02-b11
          speaker: princess
          text: Please come back with me to my father. He will reward you richly for saving my life.
        - id: ch02-b12
          speaker: shepherd
          text: I still want to see the world. Three years from now, I'll come back. Nothing will make me change my mind.
        - id: ch02-b13
          speaker: narrator
          text: The Princess climbed into her carriage again. She and the shepherd said farewell, then went their separate ways. She headed home, while he continued out into the world.
    - id: ch03
      title: The Coachman's Lie
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: As the Princess's carriage crossed a bridge, it suddenly stopped. The coachman turned around to face her.
        - id: ch03-b02
          speaker: coachman
          text: The man who saved you has gone away without taking any reward. Now you can make a poor man happy. Tell your father that I killed the dragon. If you refuse, I'll throw you into the river. No one will ever know. They'll think the dragon ate you.
        - id: ch03-b03
          speaker: narrator
          text: The Princess was terrified. She had no choice but to swear that she would name the coachman as her rescuer and never reveal the secret.
        - id: ch03-b04
          speaker: narrator
          text: When they reached the capital, everyone rejoiced to see her alive. Bright flags replaced the black ones on every palace tower. The King embraced his daughter and the man he believed had saved her, with tears of joy in his eyes.
        - id: ch03-b05
          speaker: king
          text: You saved my child's life, and you freed my kingdom from a dreadful curse. You deserve a great reward. My daughter shall be your wife. She is still very young, though, so the wedding must wait one year.
        - id: ch03-b06
          speaker: narrator
          text: The coachman thanked the King. Servants took him away, dressed him richly, and began teaching him all the skills and manners his new position required. The poor Princess could only weep. She dared not share her grief with anyone.
        - id: ch03-b07
          speaker: narrator
          text: When the year was over, the Princess went to her father and begged him to delay the marriage.
        - id: ch03-b08
          speaker: princess
          text: Father, please give me one more year before I must marry him.
        - id: ch03-b09
          speaker: narrator
          text: The King granted her request. But the second year passed too, and the wedding drew near again. This time she threw herself at her father's feet and pleaded more desperately than before.
        - id: ch03-b10
          speaker: princess
          text: Please, Father, let me wait just one last year.
        - id: ch03-b11
          speaker: narrator
          text: Her sorrow touched the King's heart, and he agreed once more. The Princess was filled with joy, because she knew her true rescuer had promised to return at the end of the third year.
        - id: ch03-b12
          speaker: narrator
          text: That final year passed like the other two. Then the wedding day was fixed, and all the people prepared to feast and celebrate.
    - id: ch04
      title: The True Rescuer Returns
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: On that very day, a stranger entered the town with three black dogs. He asked why there was so much feasting and excitement.
        - id: ch04-b02
          speaker: townsman
          text: The King's daughter is about to marry the man who killed the terrible dragon.
        - id: ch04-b03
          speaker: narrator
          text: The stranger declared that the coachman was a liar and could not possibly have killed the dragon. No one would listen to him. Instead, they seized him, dragged him away from the celebration, and locked him in a cell behind an iron door.
        - id: ch04-b04
          speaker: narrator
          text: He lay sadly on his straw bed, wondering what would become of him. Then he thought he heard his dogs whining softly outside. An idea came to him.
        - id: ch04-b05
          speaker: shepherd
          text: Mustard, come and help me!
        - id: ch04-b06
          speaker: narrator
          text: A moment later, the great dog's paws appeared at the cell window. Before the shepherd could count to two, Mustard had bitten through the iron bars and stood beside him. Together they climbed out through the window. The young man was free again, though his heart was still heavy.
        - id: ch04-b07
          speaker: narrator
          text: Still, he was miserable to think that someone else would receive the reward that belonged to him. He was hungry as well, so he called Salt and sent him to find food. The faithful dog soon returned with delicious food wrapped in a table napkin. A royal crown was embroidered on it.
        - id: ch04-b08
          speaker: narrator
          text: The King and his whole court had just sat down to the wedding feast when Salt appeared. The dog went to the Princess and licked her hand as if asking for help. She recognized him with a joyful start and tied her own table napkin around his neck.
        - id: ch04-b09
          speaker: narrator
          text: Then the Princess found her courage. She told her father about the shepherd, the dragon, and the threat on the bridge. At last the King knew the whole truth. He immediately ordered a servant to follow the dog, and before long the stranger was led into the King's presence.
        - id: ch04-b10
          speaker: narrator
          text: The former coachman turned white as a sheet when he saw the shepherd. He dropped to his knees.
        - id: ch04-b11
          speaker: coachman
          text: Have mercy on me! Please forgive me!
          emotion: fearful
        - id: ch04-b12
          speaker: narrator
          text: The Princess knew her true rescuer at once. She needed no proof at all, though he reached into his pocket and brought out the dragon's two front teeth. The King had the false rescuer thrown into a dark dungeon. The shepherd took his rightful place beside the Princess, and this time, you may be sure, she did not ask to delay the wedding.
    - id: ch05
      title: The Dogs' Work Is Done
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The young couple lived together in peace and happiness for some time. Then one day, the former shepherd remembered his poor sister. He wished to see her again and share his good fortune with her.
        - id: ch05-b02
          speaker: narrator
          text: The couple sent a carriage to bring his sister to the palace. Before long she arrived at court. After all their time apart, brother and sister were in each other's arms once more, and now she could share in his happiness.
        - id: ch05-b03
          speaker: dog
          text: Our work is finished, and you no longer need us. We stayed only until we knew that good fortune would not make you forget your sister.
        - id: ch05-b04
          speaker: narrator
          text: As the dog finished speaking, all three dogs changed into birds and flew away into the heavens.
