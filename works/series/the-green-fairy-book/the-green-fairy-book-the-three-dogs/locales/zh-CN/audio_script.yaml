audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，像编书人面对孩子娓娓而谈，幽默处轻巧含笑
        timbre: 温暖清朗
        pace: 舒缓而有自然起伏
        pitch: 中音
    shepherd:
      display_name: 牧羊人
      tts:
        delivery: 年轻坦率，心地善良，遇到危险时勇敢果断
        timbre: 清朗结实
        pace: 中速，呼救时急促有力
        pitch: 中音
    father:
      display_name: 老牧羊人
      tts:
        delivery: 临终时虚弱而慈爱，叮嘱郑重
        timbre: 苍老低沉
        pace: 缓慢
        pitch: 低音
    stranger:
      display_name: 陌生人
      tts:
        delivery: 神秘随和，说起三只狗时笃定从容
        timbre: 沉稳略带沙哑
        pace: 中速偏慢
        pitch: 中低音
    coachman:
      display_name: 车夫
      tts:
        delivery: 起初冷淡，威胁公主时阴狠，败露后惊慌卑微
        timbre: 粗硬暗哑
        pace: 中速，求饶时急促
        pitch: 中低音
    princess:
      display_name: 公主
      tts:
        delivery: 温柔端庄，受困时悲伤克制，真相大白时坚定
        timbre: 柔和清澈
        pace: 从容偏慢
        pitch: 中高音
    king:
      display_name: 国王
      tts:
        delivery: 威严厚重，对女儿慈爱，奖赏功臣时慷慨郑重
        timbre: 洪亮醇厚
        pace: 稳健
        pitch: 中低音
    dog:
      display_name: 三只狗中的一只
      tts:
        delivery: 忠诚平静，完成使命后庄重温和
        timbre: 清晰而略带奇异感
        pace: 舒缓
        pitch: 中音
  chapters:
    - id: ch01
      title: 三只神奇的狗
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，有个牧羊人，家里只有一儿一女。临终前，他把两个孩子叫到床边。能留给他们的东西实在不多，只有三只羊和一所小屋。
        - id: ch01-b02
          speaker: father
          text: >-
            这些东西，你们喜欢怎么分就怎么分。只是答应我，无论怎样都不要为它们争吵。
        - id: ch01-b03
          speaker: narrator
          text: >-
            父亲去世后，哥哥问妹妹想要羊还是小屋。妹妹选了小屋，哥哥也很满意。
        - id: ch01-b04
          speaker: shepherd
          text: >-
            那我就带着羊，到广阔的世界里碰碰运气。别人出门能交好运，我为什么不能？我生在星期日，这个好日子总不会白占吧。
        - id: ch01-b05
          speaker: narrator
          text: >-
            他赶着三只羊出发了。可走了很久，好运始终没有露面。一天，他正垂头丧气地坐在十字路口，一个男人忽然出现在眼前，身旁还跟着三只黑狗。那三只狗，一只比一只大。
        - id: ch01-b06
          speaker: stranger
          text: >-
            好小伙子，你这三只羊养得真肥。把它们给我吧，我拿这三只狗跟你换。
        - id: ch01-b07
          speaker: shepherd
          text: >-
            我要狗有什么用？羊会自己吃草，换成狗，我还得找东西喂它们呢。
        - id: ch01-b08
          speaker: stranger
          text: >-
            它们可不是普通的狗。你不用养活它们，它们会养活你，还会让你交上好运。最小的叫“盐”，想吃什么，只要叫它去找。第二只叫“胡椒”，谁想伤你，它就把谁撕碎。最大最壮的叫“芥末”，它那副牙齿，连钢铁也咬得断。
        - id: ch01-b09
          speaker: narrator
          text: >-
            年轻人终于答应交换。他刚把羊交出去，就想试试这番话是真是假。
        - id: ch01-b10
          speaker: shepherd
          text: >-
            盐，我饿了。
        - id: ch01-b11
          speaker: narrator
          text: >-
            话还没说完，狗已经跑得无影无踪。只过了几分钟，它便带回一只大篮子，里面全是可口的食物。年轻人知道自己换对了，心情一下亮堂起来，又高高兴兴地上路了。

    - id: ch02
      title: 巨龙与冒牌英雄
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            一天，年轻人遇见一辆双马马车。车上蒙着黑布，马匹披着黑饰，车夫从头到脚也是一身丧服。车里的美丽姑娘穿着黑裙，哭得十分伤心。马匹低着头，脚步沉重，走得很慢。
        - id: ch02-b02
          speaker: shepherd
          text: >-
            车夫，为什么大家都这样悲伤？
        - id: ch02-b03
          speaker: narrator
          text: >-
            车夫起先不肯回答。年轻人再三追问，他才说出缘由。附近住着一条巨龙，每年都要吃掉一位美丽的少女。今年抽中了国王的女儿，所以整个国家都在哀哭。
        - id: ch02-b04
          speaker: narrator
          text: >-
            年轻人同情公主，便一路跟着马车。车停在高山脚下，公主独自下来，悲伤地走向等候她的厄运。车夫警告年轻人，若想保命就别跟去，可他根本不听。
        - id: ch02-b05
          speaker: narrator
          text: >-
            走到半山腰，一个可怕的怪物迎面扑来。它有蛇一样的身体，长着巨翅和利爪，嘴里喷着火，正要抓住公主。
        - id: ch02-b06
          speaker: shepherd
          text: >-
            胡椒，快来救人！
        - id: ch02-b07
          speaker: narrator
          text: >-
            第二只狗扑向巨龙，跟它狠狠斗了一场，最后一口咬住了它的脖子。巨龙倒在地上，很快就断了气。胡椒把它吃得一干二净，只剩两颗门牙。年轻人拾起牙齿，收进衣袋。
        - id: ch02-b08
          speaker: narrator
          text: >-
            公主又怕又喜，昏倒在救命恩人脚边。醒来以后，她请年轻人跟自己回去，父王一定会重重奖赏他。
        - id: ch02-b09
          speaker: shepherd
          text: >-
            我还想看看外面的世界。三年以后我会回来，这个主意，谁也不能让我改变。
        - id: ch02-b10
          speaker: narrator
          text: >-
            公主重新坐进马车，两人互道珍重，就此分手。她回王宫，年轻人继续到世上游历。可是，马车驶到一座桥上，突然停了下来。车夫转身面对公主。
        - id: ch02-b11
          speaker: coachman
          text: >-
            救你的人已经走远了，他根本不在乎你的感激。你就成全我这个穷人吧，回去告诉国王，是我杀了巨龙。你敢不答应，我就把你扔进河里。没人会知道，只会当你早已被巨龙吃了。
          emotion: angry
        - id: ch02-b12
          speaker: narrator
          text: >-
            公主吓坏了，又没有办法逃脱，只好发誓称车夫为救命恩人，并且对谁也不说出秘密。回到都城时，众人见她没有被巨龙吃掉，无不欢喜。王宫每座塔楼上的黑旗全被降下，换成了鲜艳的彩旗。国王流下喜悦的眼泪，先抱住女儿，又拥抱了那个冒牌英雄。
        - id: ch02-b13
          speaker: king
          text: >-
            你救了我的女儿，也替整个国家除掉大祸，应该得到最丰厚的奖赏。我要把女儿嫁给你。不过她还年轻，婚礼一年以后再举行。

    - id: ch03
      title: 三年的等待
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            车夫连忙谢恩。人们带他去换上华服，又教他种种符合新身份的礼仪和本领。公主却只能暗自哭泣，心里的苦楚不敢告诉任何人。第一年过去，她苦苦请求父王再等一年，国王答应了。第二年结束时，她又跪在父王脚边，哭着求他最后宽限一年。那哭声实在凄惨，国王心软了，再次答应下来。
        - id: ch03-b02
          speaker: narrator
          text: >-
            公主终于有了希望，因为真正救她的人说过，三年以后一定回来。最后一年也过去了，婚期再不能拖延。整个都城都准备好了宴席，只等着尽情庆贺。
        - id: ch03-b03
          speaker: narrator
          text: >-
            偏偏就在婚礼当天，一个带着三只黑狗的陌生人走进城里。他问大家为何如此热闹。有人告诉他，公主就要嫁给杀死巨龙的英雄。年轻人当场揭穿车夫，说他是个骗子。可是没人肯听，反而把年轻人抓起来，关进铁门牢房。
        - id: ch03-b04
          speaker: narrator
          text: >-
            他躺在草铺上，为自己的命运发愁，忽然听见牢房外传来狗的低声呜咽。一个办法闪过心头，他立刻高声呼喊。
        - id: ch03-b05
          speaker: shepherd
          text: >-
            芥末，快来帮我！
        - id: ch03-b06
          speaker: narrator
          text: >-
            转眼间，大狗的爪子搭上了窗口。还没等年轻人数到二，芥末已经用牙咬断铁栏，跳进牢房。一人一狗从窗口爬出去，终于逃离监牢。年轻人虽说恢复了自由，想到别人就要夺走本该属于自己的奖赏，仍然十分难过。
        - id: ch03-b07
          speaker: narrator
          text: >-
            这时，他又觉得饿了，便叫“盐”去找食物。忠心的狗很快回来，嘴里叼着一条餐巾，包着许多美味。更特别的是，餐巾上绣着一顶王冠。

    - id: ch04
      title: 真正的救命恩人
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            国王刚刚和满朝宾客坐上婚宴，盐就跑进宫来，轻轻舔着公主的手，像是在求她跟自己走。公主猛地认出了它，惊喜之下，把自己的餐巾系在狗的颈上。随后，她终于鼓足勇气，把三年前发生的一切都告诉父王。
        - id: ch04-b02
          speaker: narrator
          text: >-
            国王立刻命仆人跟上那只狗。不多时，年轻人便被带到王前。车夫看见真正的牧羊人，脸色顿时白得像纸，扑通一声跪了下来。
        - id: ch04-b03
          speaker: coachman
          text: >-
            求您饶了我吧！请宽恕我！
          emotion: fearful
        - id: ch04-b04
          speaker: narrator
          text: >-
            公主一眼就认出了恩人，所以年轻人连衣袋里的两颗龙牙都不必拿出来作证。车夫被投入阴暗的地牢，牧羊人代替他，坐到了公主身边。这一回，公主再也不请求延期，婚礼终于属于真正的英雄。

    - id: ch05
      title: 三只狗的使命
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            年轻夫妇平安幸福地过了一段日子。一天，从前的牧羊人忽然想起贫苦的妹妹。他想再见她一面，也想让妹妹分享自己的好运，于是派出一辆马车，把她接到宫廷。妹妹很快赶来，兄妹终于又拥抱在一起。
        - id: ch05-b02
          speaker: dog
          text: >-
            我们的事情已经办完，你不再需要我们了。我们等到今天，只想看看你富贵以后，会不会忘了自己的妹妹。
        - id: ch05-b03
          speaker: narrator
          text: >-
            话音刚落，三只狗变成三只鸟，一起飞上了天空。
        - id: ch05-b04
          speaker: narrator
          text: >-
            这个故事，是格林讲给我们听的。
