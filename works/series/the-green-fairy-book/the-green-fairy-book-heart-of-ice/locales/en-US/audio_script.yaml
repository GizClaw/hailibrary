  chapters:
    - id: ch01
      title: The Prince Called Mannikin
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there lived a King and Queen who were foolish beyond telling, though they were extremely fond of each other. Spiteful people claimed that their affection was one more proof of their foolishness. Naturally, no courtier would have dared say such a thing about a King and Queen. Besides, the royal pair had always prospered. In those days, governing a kingdom seemed to depend upon one matter above all others. A ruler had to stay on good terms with every Fairy and Enchanter. None of them could be denied the cakes, lengths of ribbon, and other little gifts that were their due. At a christening, it was most important to invite every last one, whether good, bad, or somewhere in between.
        - id: ch01-b02
          speaker: narrator
          text: The Queen had one little son who was about to be christened. For several months she worked hard at an enormous guest list, but she never considered that reading it might take almost as long as writing it. When the moment of the christening arrived, the King was given the task. He had barely finished the second page. His tongue stumbled from weariness and haste as he repeated the same formal invitation. First he begged Fairy so-and-so, then Enchanter such-and-such, to honor him with a visit and graciously bestow a gift upon his son.
        - id: ch01-b03
          speaker: narrator
          text: Then word came that the Fairies from the first page had already arrived. They were waiting in the Great Hall and grumbling because no one had welcomed them. The King abandoned the list and hurried to receive those he had managed to invite. He pleaded so humbly that most were touched and promised not to harm the child.
        - id: ch01-b04
          speaker: narrator
          text: Among them was a Fairy from a distant country. Her name happened to be on the first page, but no one knew anything about her. She had hurried there upon a great ostrich, only to find no one ready to help her down. Now she muttered in a most alarming way while the King kept talking.
        - id: ch01-b05
          speaker: distant_fairy
          text: Oh, go on with your prattle. You will never have reason to boast of this son. Whatever you say, he will be nothing but a Mannikin.
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: She might have given the unhappy baby half a dozen more dreadful gifts, but good Fairy Genesta hurried in just in time. Genesta watched over the kingdom. With compliments and entreaties she calmed the stranger and persuaded her to say no more. Then she hinted that the King should distribute the presents. When that ceremony ended, all the visitors departed except Genesta. She went to the Queen.
        - id: ch01-b07
          speaker: genesta
          text: What a fine mess you have made, madam. Why didn't you consult me? Foolish people always imagine they need no help or advice. After all my kindness, you did not even have the courtesy to invite me.
        - id: ch01-b08
          speaker: narrator
          text: The King threw himself at her feet.
        - id: ch01-b09
          speaker: king
          text: Dear madam, how could I ever have reached your name? Look at the mark where I gave up. I had only just begun that hopeless list!
        - id: ch01-b10
          speaker: genesta
          text: There, there. I am not offended. Little mistakes do not upset me when I truly care for someone. But now we must speak of your son. I saved him from many unpleasant gifts. You must let me take him away and raise him, and you will not see him again until he is covered with fur.
        - id: ch01-b11
          speaker: narrator
          text: The mysterious words made the King and Queen burst into tears. Their country was so hot that they could not imagine why the Prince would ever be covered with fur. Surely it foretold some terrible misfortune. Genesta told them not to distress themselves.
        - id: ch01-b12
          speaker: genesta
          text: If you raised him, you would certainly make him as foolish as you are. I will not even tell him that he is your son. You two had better turn your attention to governing the kingdom properly.
        - id: ch01-b13
          speaker: narrator
          text: With that, she opened the window and lifted the little Prince, cradle and all. She glided away through the air as smoothly as if she were skating over ice, leaving the King and Queen in the deepest misery. They asked everyone who came near what Genesta could have meant by saying their son would return covered with fur. No one could solve the mystery. Everyone did seem to agree that it must mean something frightful, and that agreement made the royal pair more miserable than ever. They wandered through their palace in such sorrow that anyone who saw them would have felt pity.
        - id: ch01-b14
          speaker: narrator
          text: Meanwhile, Genesta carried the child to her castle. She placed him with a young peasant woman and enchanted the woman into believing that the new baby was one of her own. The Prince grew healthy and strong in the simple life of a peasant boy. Genesta believed he could have no better beginning. As he grew older, she kept him more often beside her so that his mind would be trained as carefully as his body.
        - id: ch01-b15
          speaker: narrator
          text: Her care did not end with a sound body and a trained mind. She meant him to be tested by hardship and disappointment and to gain knowledge of his fellow human beings. Genesta knew he would need every advantage she could give him, because the years passed without adding anything to his height. He remained the tiniest of princes. Yet he was remarkably active and perfectly formed. He was so handsome and agreeable that his small size had no real importance. He knew very well that people called him by the ridiculous name Mannikin. He comforted himself with a promise that, whatever happened, he would make that name famous.
        - id: ch01-b16
          speaker: narrator
          text: To carry out her plan, Genesta began sending him marvelous dreams of adventures on sea and land. In every dream, Mannikin himself was the hero. Sometimes he rescued a lovely Princess from terrible danger. At other times, one brave deed earned him an entire kingdom. Dream after dream filled him with longing. He wanted to seek his fortune in a distant country where no one knew of his humble birth, and where courage might earn him honor and riches.
        - id: ch01-b17
          speaker: narrator
          text: One day he rode into a great city near Genesta's castle, full of ambitious hopes. He had meant only to hunt in the nearby forest, so he wore simple clothes and carried a bow, arrows, and a light spear. Even so, he looked graceful and distinguished. Everyone in the city was rushing toward the marketplace. Curious, Mannikin turned his horse and followed.
        - id: ch01-b18
          speaker: narrator
          text: In the square, strange-looking foreigners were preparing to address the crowd. Mannikin pushed close enough to hear their spokesman, a venerable old man.
        - id: ch01-b19
          speaker: herald
          text: Let the whole world know this. Whoever reaches the summit of the Ice Mountain will receive the incomparable Sabella, fairest of the fair, and every realm over which she rules. Here is the list of Princes who saw her beauty and died in the attempt. Here too are the names of those who have just begun the great adventure.
        - id: ch01-b20
          speaker: narrator
          text: Mannikin desperately wanted to add his name, but he remembered his dependent position and his lack of money. As he hesitated, the old man ceremoniously unveiled a portrait of Sabella. One glance settled the matter. Mannikin hurried forward and demanded permission to sign. The ambassadors saw his tiny figure and plain clothing. They looked doubtfully at one another, unable to decide whether to accept him.
        - id: ch01-b21
          speaker: mannikin
          text: Give me the paper. I will sign it.
        - id: ch01-b22
          speaker: narrator
          text: They obeyed. Excitement over the Princess and annoyance with the ambassadors left him too flustered to choose any name but the one everyone used. Beneath all the magnificent titles of other Princes, he wrote only Mannikin. The ambassadors burst out laughing.
        - id: ch01-b23
          speaker: mannikin
          text: Miserable wretches! If that lovely portrait were not here, I would cut off your heads.
          emotion: angry
        - id: ch01-b24
          speaker: narrator
          text: Then he remembered that Mannikin truly was a funny name and that he had not yet made it famous. He calmed himself and asked the way to Sabella's country. He knew the journey would be difficult. He also decided to leave at once without saying farewell to Genesta, in case she tried to stop him. Everyone who knew him laughed at the expedition. Even the foolish King and Queen heard of it and laughed harder than anyone, never guessing that this bold Mannikin was their own son.
        - id: ch01-b25
          speaker: narrator
          text: His directions were hardly useful. He was told to travel four hundred leagues north of Mount Caucasus and wait there for instructions about conquering the Ice Mountain. Those were fine orders for someone starting near the land now called Japan. Still, Mannikin went east. He avoided towns because he feared more laughter at his name. He had not traveled enough to enjoy a joke made at his expense.
        - id: ch01-b26
          speaker: narrator
          text: At first he slept in forests and ate wild fruit. Genesta watched him kindly from afar and decided that hunger was no proper part of his trial. While he slept, she fed him all sorts of good things. Mannikin wondered why he never felt hungry when he awoke. The Fairy also sent adventures to test his courage, and he survived them all. In the last, he fought a furious beast rather like a tiger and lost his horse.
        - id: ch01-b27
          speaker: narrator
          text: Losing his horse did not discourage him. He struggled onward on foot until he reached a seaport. There he found a boat bound for the very coast he needed, and he had just enough money left to pay the fare. They sailed, but after several days a terrible storm arose and completely wrecked the little ship. Mannikin saved his life by swimming a long, long way toward the only land he could see. It proved to be a desert island. There he survived by fishing and hunting, always hoping that good Genesta would soon come to rescue him.
        - id: ch01-b28
          speaker: narrator
          text: One day, as he gazed sadly across the sea, he noticed a curious boat drifting toward shore. It entered a creek and stuck in the sand. Mannikin ran down to inspect it. Branches and thick leaves covered every mast and spar until the vessel looked like a floating wood. Everything was silent. Thinking no one could be aboard, he pushed through the branches and jumped over the side.
        - id: ch01-b29
          speaker: narrator
          text: The crew lay around him, motionless as dead men and in a dreadful state. They too had become almost like trees. Each man was growing into whatever he had touched when the enchantment struck, whether deck, mast, or side of the ship. Pity filled Mannikin. Using the sharp point of an arrow, he gently freed their hands and feet from the wood. He carried them ashore one by one, rubbed their stiff limbs, and bathed them in herbal mixtures.
        - id: ch01-b30
          speaker: narrator
          text: Mannikin worked over their rigid limbs with such success that within a few days the sailors were completely well and fit to handle a boat again. You may be sure that Genesta had something to do with that marvelous cure. She also put it into Mannikin's mind to rub the vessel itself with the same herbs. The growth cleared away completely, and not a moment too soon. At the speed the wood had been spreading, the boat would shortly have become an entire forest. The sailors could not thank Mannikin enough. They gladly promised to land him on any coast he chose.
        - id: ch01-b31
          speaker: narrator
          text: When he asked what had happened, they could explain only what they remembered. One sailor spoke for them.
        - id: ch01-b32
          speaker: sailor
          text: We were passing a heavily wooded coast when a gust rushed out from the land. It wrapped us in a thick cloud of dust. After that, everything aboard that was not metal began to sprout and flower. We grew numb and heavy, little by little. Then we knew nothing more.
        - id: ch01-b33
          speaker: narrator
          text: Mannikin found the tale fascinating. He gathered some of the dust from the bottom of the boat and kept it carefully, thinking its strange power might help him one day.
    - id: ch02
      title: The Kingdom of Spaniels
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: They gladly left the desert island. After a long, peaceful voyage, land appeared. They decided to go ashore for fresh water and provisions, and to discover where they were and which way they should continue.
        - id: ch02-b02
          speaker: narrator
          text: As they drew close, they wondered whether this was another uninhabited land. No human being could be seen anywhere. Yet something certainly moved near the ground. Small dark shapes showed dimly inside clouds of dust, gathering at the exact place where the sailors meant to land. To everyone's amazement, they were neither people nor wild beasts. They were large and beautiful spaniels. Some stood apart like sentries. Others had formed orderly companies and regiments, and every one of them watched the visitors come ashore.
        - id: ch02-b03
          speaker: narrator
          text: The dogs seemed afraid that Mannikin would order the sailors to shoot. Instead, he greeted them in the friendliest way.
        - id: ch02-b04
          speaker: mannikin
          text: Hello there, good dog!
          emotion: happy
        - id: ch02-b05
          speaker: narrator
          text: The spaniels crowded around him, wagging their tails and offering their paws. Before long they made him understand that he should leave the sailors at the boat and follow them. Mannikin was eager to learn more. He told the sailors to wait fifteen days. If he did not return by then, they were to sail without him.
        - id: ch02-b06
          speaker: narrator
          text: He followed his new friends inland. The fields were neatly cultivated. Horses and oxen pulled carts and plows just as they did in any country. Every village had trim cottages and every sign of prosperity. In one village, the Prince was served a delicate meal. Then a carriage arrived, drawn by two splendid horses and skillfully driven by a large spaniel.
        - id: ch02-b07
          speaker: narrator
          text: Mannikin continued his journey in great comfort. Many similar carriages passed on the road, and the spaniels riding in each one saluted him with perfect courtesy. At last his carriage drove rapidly into a large city that could only be the capital. News of his approach had plainly gone ahead of him. The inhabitants waited at every door and window, while all the little spaniels had climbed onto the walls and gates for a better look. Mannikin was delighted by their hearty welcome and gazed around with the deepest interest.
        - id: ch02-b08
          speaker: narrator
          text: The carriage crossed broad, well-paved streets lined with fine trees and entered a grand palace courtyard. Spaniel soldiers filled it. Mannikin guessed they were the royal guard and returned their salutes. Inside, the King lay upon a rich Persian carpet. Several little spaniels chased away every fly that might disturb His Majesty.
        - id: ch02-b09
          speaker: narrator
          text: The King was the most beautiful spaniel of all. Sadness filled his large eyes, but it vanished when he sprang up to welcome Mannikin with every possible sign of delight. Then he motioned to his courtiers, who came forward one by one and paid their respects to the visitor. Mannikin returned their greetings, but he wondered how any real conversation could be possible. Once the courtiers left and he was alone with the King, a Secretary of State was summoned. The secretary could write down every word that His Majesty dictated.
        - id: ch02-b10
          speaker: king_bayard
          text: I deeply regret that we must speak through writing. The language of dogs is difficult for you to understand. Fortunately, our written language has not changed and is the same as yours.
        - id: ch02-b11
          speaker: narrator
          text: Mannikin wrote a polite reply and asked for an explanation of everything he had seen. The question brought back painful memories. The King wrote that his name was Bayard. A Fairy from a neighboring kingdom had fallen violently in love with him and tried every means of persuading him to marry her. He could not agree, for he loved the Queen of the Spice Islands with all his heart.
        - id: ch02-b12
          speaker: narrator
          text: Furious that he did not return her love, the Fairy transformed him into a spaniel. His mind remained unchanged, but his power of speech was gone. Her revenge did not stop with Bayard. She condemned every one of his subjects to the same form and pronounced her sentence.
        - id: ch02-b13
          speaker: angry_fairy
          text: Bark and run on four feet until virtue is rewarded by love and fortune.
          emotion: angry
        - id: ch02-b14
          speaker: narrator
          text: Poor Bayard observed that she might just as well have said they must remain spaniels forever. Mannikin privately agreed, though he offered the comfort anyone would have tried to give.
        - id: ch02-b15
          speaker: mannikin
          text: Your Majesty, you must be patient.
        - id: ch02-b16
          speaker: narrator
          text: He truly felt sorry for poor Bayard. He offered every consolation he could think of and promised to help with all his strength if anything at all could be done. Before long, the two became firm friends. Bayard proudly brought out a portrait of the Queen of the Spice Islands. Once Mannikin saw it, he understood the King's devotion and agreed that someone so lovely was worth any hardship. Then it was Mannikin's turn to trust his new friend with the hopes and troubles of his own journey.
        - id: ch02-b17
          speaker: narrator
          text: In return, Mannikin told his own history and described the great task ahead of him. Bayard gave useful advice about the best road to take. Then they returned together to the shore. The sailors were delighted to see the Prince, though they had known he was safe. Once Bayard's supplies were loaded aboard, the voyage began again.
        - id: ch02-b18
          speaker: narrator
          text: The friends parted with real sadness. Bayard insisted that Mannikin take one of his pages, a spaniel named Mousta. Mousta was charged to attend the Prince everywhere and serve him faithfully, which he promised to do. A favorable wind soon carried the boat beyond the sound of a great howl from Bayard's whole army, given by royal command as a high compliment.
        - id: ch02-b19
          speaker: narrator
          text: Nothing else remarkable happened at sea. When the ship came within two leagues of its harbor, Mannikin chose to land before they reached the town. He had no money left and no clear idea what to do next. The sailors sadly put him and Mousta ashore, then returned to the boat.
        - id: ch02-b20
          speaker: narrator
          text: Mannikin and Mousta walked away in whichever direction looked most promising. Soon they reached a lovely green meadow at the edge of a wood. After their long voyage, the soft grass and cool shade were so pleasant that they sat down to rest. They passed the time by watching the leaps and antics of a pretty little monkey in the nearby trees. Mannikin became so fascinated by the tiny creature that he sprang up and tried to catch it.
        - id: ch02-b21
          speaker: narrator
          text: The monkey stayed just beyond his reach until he promised to follow wherever it led. Then it sprang onto his shoulder and whispered into his ear.
        - id: ch02-b22
          speaker: monkey_fairy
          text: My poor Mannikin, we have no money. We are in a very bad position, and we do not know what to do next.
        - id: ch02-b23
          speaker: mannikin
          text: That is quite true. I cannot even offer you sugar or biscuits or anything else you might enjoy, my pretty little friend.
          emotion: sad
        - id: ch02-b24
          speaker: monkey_fairy
          text: You are thoughtful about me and patient about your own troubles. Because of that, I will show you the way to the Golden Rock. But Mousta must stay here and wait for you.
        - id: ch02-b25
          speaker: narrator
          text: Mannikin readily agreed. The monkey leaped from his shoulder to a branch and raced through the wood from tree to tree.
        - id: ch02-b26
          speaker: monkey_fairy
          text: Follow me!
        - id: ch02-b27
          speaker: narrator
          text: Following was not so easy for Mannikin on the ground. The monkey waited whenever he fell behind and showed him the easiest way. At last the trees thinned, and they entered a grassy clearing at the foot of a mountain. A single rock stood in the middle, about ten feet tall.
        - id: ch02-b28
          speaker: monkey_fairy
          text: That stone looks hard. Strike it with your spear, and we will see what happens.
        - id: ch02-b29
          speaker: narrator
          text: Mannikin drove his spear into the rock with all his force. Several pieces split away. Only a thin skin was stone. Beneath it, the whole rock was solid gold. The monkey laughed at his astonishment.
        - id: ch02-b30
          speaker: monkey_fairy
          text: I give you the pieces you broke away. Take as much as you think you need.
        - id: ch02-b31
          speaker: narrator
          text: Mannikin thanked her and chose one of the smallest lumps. At once, the monkey became a tall and gracious lady.
        - id: ch02-b32
          speaker: monkey_fairy
          text: If you remain this kind, persistent, and easily satisfied, you may hope to accomplish the hardest tasks. Continue your journey without fear of running short of gold. The little piece you chose so modestly will never grow smaller, however often you use it. Now come with me, and I will show you the danger your moderation helped you escape.
        - id: ch02-b33
          speaker: narrator
          text: She led him back through the wood by a different path. It was full of men and women whose faces looked pale, hungry, and worn. Some searched madly over the ground while others seemed to search the very air. They ran this way and that, started at every sound, and pushed or trampled anyone who stood in their path. Each person was frantic to discover the way to the Golden Rock, yet none of them could find it.
        - id: ch02-b34
          speaker: monkey_fairy
          text: Look at their struggle. It gains them nothing. In the end, they will die of despair, just as hundreds before them have died.
          emotion: sad
        - id: ch02-b35
          speaker: narrator
          text: As soon as they returned to the place where Mousta waited, the Fairy disappeared. The faithful spaniel greeted Mannikin with every possible sign of joy, and together they took the nearest road into the city. They remained there for several days. With his unfailing gold, the Prince bought horses and gathered attendants. He made many inquiries about Sabella and the road to her kingdom. She was still so far away that the answers were few and vague. When the travelers finally reached Mount Caucasus, the situation changed completely. People seemed to speak of nothing but Princess Sabella. Strangers from every part of the world filled the roads toward her father's court.
    - id: ch03
      title: The Princess Without a Heart
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Mannikin heard endless praise of Sabella's beauty and riches, but he also learned how numerous and powerful his rivals were. One Prince brought an army behind him. Another carried vast treasure. A third was as handsome and accomplished as anyone could possibly be. Poor Mannikin had none of those advantages. He possessed only his determination to succeed, faithful Mousta, and a ridiculous name. The name was hardly likely to help him, but since he could not change it, he wisely decided to think of it no more.
        - id: ch03-b02
          speaker: narrator
          text: After two full months of travel, they reached Trelintin, the capital of Sabella's kingdom. There Mannikin heard terrible stories about the Ice Mountain. No one who attempted the climb had ever returned. He also learned how the trouble had begun with Sabella's father, King Farda-Kinbras.
        - id: ch03-b03
          speaker: narrator
          text: The rich and powerful King had married a lovely Princess named Birbantine. They were as happy as the day was long. Their happiness seemed so complete that, one day while riding together in a sleigh, they were foolish enough to challenge fate itself to spoil it. An old woman sat beside the road, blowing on her cold fingers to warm them. She heard the proud words and muttered an answer.
        - id: ch03-b04
          speaker: gorgonzola
          text: We shall see about that.
        - id: ch03-b05
          speaker: narrator
          text: The King angrily wanted the woman punished, but the Queen stopped him.
        - id: ch03-b06
          speaker: birbantine
          text: Please, sire, do not make matters worse. This may be a Fairy.
          emotion: fearful
        - id: ch03-b07
          speaker: gorgonzola
          text: You are right about that.
        - id: ch03-b08
          speaker: narrator
          text: The old woman rose before their terrified eyes and grew gigantic. Her staff became a fiery dragon with spread wings. Her ragged cloak changed to a golden mantle, and her wooden shoes became two bundles of rockets.
        - id: ch03-b09
          speaker: gorgonzola
          text: Yes, you are right. Soon you will see what comes of your fine behavior. Remember Fairy Gorgonzola!
          emotion: angry
        - id: ch03-b10
          speaker: narrator
          text: She mounted the dragon and flew away. Rockets shot in every direction and left long trails of sparks. Farda-Kinbras and Birbantine begged her to return and tried to soothe her with humble apologies. She never looked back. Soon she vanished, leaving them with the darkest fears.
        - id: ch03-b11
          speaker: narrator
          text: Not long afterward, the Queen had a daughter more beautiful than any child ever seen. All the Fairies of the North were invited to the christening and warned about Gorgonzola. Gorgonzola received an invitation too, but she neither attended the feast nor accepted her gift.
        - id: ch03-b12
          speaker: narrator
          text: Once the other Fairies had given their gifts and taken their places at the banquet, Gorgonzola slipped secretly into the palace disguised as a black cat. She crept beneath the cradle and hid there. The nurses and women rocking the cradle eventually turned their backs. Gorgonzola sprang out, stole the little Princess's heart in a single instant, and escaped. By the time anyone noticed her, only a few dogs and kitchen servants were able to chase her across the courtyard.
        - id: ch03-b13
          speaker: narrator
          text: Outside, she climbed into her chariot and flew straight to the North Pole. She locked the stolen heart on the summit of the Ice Mountain and surrounded it with so many dangers that she felt certain it would remain there for the whole of Sabella's life. Then she went home, delighted with her success.
        - id: ch03-b14
          speaker: narrator
          text: The other Fairies went home after the banquet without discovering that anything was wrong, so the King and Queen remained perfectly happy. Sabella grew lovelier every day. She learned everything a Princess ought to know without the least difficulty, and everyone admired her. Yet something was always missing from her charm. She had an exquisite voice and sang every note perfectly. But whether the song was grave or gay made no difference to her. She never seemed to understand what the music meant.
        - id: ch03-b15
          speaker: courtier
          text: Her singing is perfect, but there is no tenderness in it. There is no heart in her voice.
        - id: ch03-b16
          speaker: narrator
          text: Poor Sabella could hardly have put heart into a song when her own heart lay far away on the Ice Mountain. The same emptiness showed in every other thing she did. Time passed. The whole court admired her, and the King and Queen remained blindly fond of their beautiful daughter. Even that was not enough to hide the truth forever. It became clearer and clearer that something was terribly wrong, because a person who loves no one cannot remain loved for long.
        - id: ch03-b17
          speaker: narrator
          text: At last the King called a great assembly and invited the Fairies, hoping they could discover the trouble. He explained the royal grief as well as he could and asked them to examine Sabella themselves.
        - id: ch03-b18
          speaker: farda_kinbras
          text: Something is wrong with my daughter. I cannot tell you what it is, but somehow your work is incomplete.
          emotion: sad
        - id: ch03-b19
          speaker: narrator
          text: The Fairies insisted that they had done everything possible for the child of such a good neighbor. They had forgotten no gift. Then they entered Sabella's presence. The moment they saw her, they all cried out together.
        - id: ch03-b20
          speakers: [fairy_voice_1, fairy_voice_2, fairy_voice_3]
          ensemble: chorus
          text: Oh, how dreadful! She has no heart!
          emotion: surprised
        - id: ch03-b21
          speaker: narrator
          text: The King and Queen cried in despair and begged for a cure to this unheard-of disaster. The eldest Fairy opened her Book of Magic, which hung from her belt on a thick silver chain. At once she learned that Gorgonzola had stolen Sabella's heart and discovered where it was hidden.
        - id: ch03-b22
          speakers: [farda_kinbras, birbantine]
          ensemble: duo
          text: What can we do? What can we possibly do?
          emotion: fearful
        - id: ch03-b23
          speaker: eldest_fairy
          text: Loving Sabella will cause you great pain, because she is only a beautiful image. That sorrow will continue for a long while. Still, I believe she will regain her heart in the end. Send her portrait throughout the world at once. Promise her hand and all her lands to the Prince who succeeds in reaching her heart. Her beauty alone will send every Prince in the world upon the quest.
        - id: ch03-b24
          speaker: narrator
          text: The King followed her advice. Sabella's portrait was carried all over the world, along with the promise of her hand and her realms. The plan drew adventurers exactly as the eldest Fairy had predicted. By the time Mannikin arrived, five hundred Princes had already died among the snow and ice, not to mention their squires and pages. Still more came every day, each eager to try his fortune. Mannikin considered all he had heard and decided to present himself at court.
        - id: ch03-b25
          speaker: narrator
          text: His arrival caused no excitement. His company was as small as he was, while the splendor of his rivals was enough to make even Farda-Kinbras look plain. Mannikin greeted the King with perfect grace and asked to kiss the Princess's hand in the usual way. When he gave his name, the King barely hid a smile. The surrounding Princes laughed openly.
        - id: ch03-b26
          speaker: mannikin
          text: Your Majesty may laugh if it pleases you. I am glad to provide the King with some amusement. But I am no plaything for these gentlemen, and they must put that idea out of their minds at once.
        - id: ch03-b27
          speaker: narrator
          text: With great dignity, he challenged the loudest mocker to single combat. That Prince was named Fadasse. Certain that tiny Mannikin had no chance against him, he accepted with scorn. Their meeting was fixed for the following day.
        - id: ch03-b28
          speaker: narrator
          text: Mannikin left the King and was taken to Sabella's audience hall. Her beauty and magnificence stole his breath for a moment. He gathered himself and addressed her.
        - id: ch03-b29
          speaker: mannikin
          text: Lovely Princess, your portrait drew me here from the other end of the world. I have come to serve you, and my devotion has no limit. But my absurd name has already caused a quarrel with one of your courtiers. Tomorrow I must fight that ugly, overgrown Prince. Please honor the contest with your presence. Let the world see that a name means nothing, and accept Mannikin as your knight.
        - id: ch03-b30
          speaker: narrator
          text: Even without a heart, Sabella had a sense of humor. Mannikin's speech amused her. She graciously agreed to attend, and he went on to ask that she show his opponent no favor.
        - id: ch03-b31
          speaker: sabella
          text: I favor none of these foolish men. They tire me with their feelings and nonsense. I am perfectly well as I am, yet all year long they talk of rescuing me from an affliction that exists only in their minds. I understand nothing they say about love, or whatever other dull subjects they mention. I cannot even remember them.
        - id: ch03-b32
          speaker: narrator
          text: Mannikin quickly understood that amusement would win more favor than joining the crowd who pestered her about the mysterious thing called love. He began making fun of his rivals, finding something ridiculous in each one. Sabella joined in heartily. Before long, she declared that she preferred talking with him to anyone else at court.
        - id: ch03-b33
          speaker: narrator
          text: The next day, the King, Queen, and Princess took their places for the combat. The whole court and town gathered to watch. Fadasse rode into the field in magnificent armor. Twenty-four squires and a hundred armed men followed him, each leading another splendid horse. From the opposite side came Mannikin, carrying only his spear, with faithful Mousta behind him. The enormous difference made the entire crowd laugh.
        - id: ch03-b34
          speaker: narrator
          text: A trumpet sounded, and the champions rushed at one another. Fadasse struck with confidence, but Mannikin slipped past the blow. In the same movement, the little Prince thrust so skillfully that he drove Fadasse out of the saddle and pinned him to the sand with his spear. The laughter of the enormous crowd changed at once to a low murmur of astonishment and admiration. With his furious enemy completely at his mercy, Mannikin turned toward Sabella.
        - id: ch03-b35
          speaker: mannikin
          text: I have no wish to kill a man who calls himself your courtier, Princess.
        - id: ch03-b36
          speaker: narrator
          text: He ordered the furious, humiliated Fadasse to stand and thank the Princess for his life. Then Mannikin and Mousta left the field with solemn dignity while trumpets sounded and the people cheered.
        - id: ch03-b37
          speaker: narrator
          text: The King soon summoned Mannikin to congratulate him on his success and offered him rooms in the palace. Mannikin gladly accepted the honor. Sabella then asked to have Mousta brought before her. The spaniel's courtly manners and marvelous intelligence delighted her so much that she begged Mannikin to give Mousta to her. The Prince agreed at once. Politeness alone would have led him to consent, but he also understood that a loyal friend who stayed near Sabella might someday prove invaluable.
        - id: ch03-b38
          speaker: narrator
          text: These events made Mannikin important at court. Soon afterward, an ambassador arrived at the border from a very powerful King. He demanded permission to enter the capital in state and receive an answer to a letter from his master.
        - id: ch03-b39
          speaker: brandatimor
          text: I, Brandatimor, send greetings to Farda-Kinbras. Had I seen your beautiful daughter's portrait sooner, I would never have allowed petty Princes and adventurers to dance around her and freeze themselves in the absurd hope of earning her hand. I fear no rivals. Now that I have declared my intention to marry Sabella, they will surely abandon their claims.
        - id: ch03-b40
          speaker: brandatimor
          text: My Ambassador will arrange for the Princess to come and marry me without delay. I give no importance to the nonsense you have spread about an Ice Mountain. If Sabella truly has no heart, that does not trouble me. If anyone can help her discover one, I can. Farewell, my worthy father-in-law.
        - id: ch03-b41
          speaker: narrator
          text: The letter left the King and Queen both embarrassed and deeply offended. Sabella was furious at the insolence of the demand. All three agreed that no one else must hear its contents until they had chosen an answer. Their secrecy did not deceive Mousta. The clever spaniel found a way to send Mannikin a full account of everything that had happened. The Prince was naturally alarmed and indignant. After thinking for a while, he requested an audience with Sabella.
        - id: ch03-b42
          speaker: narrator
          text: He guided the conversation so cleverly toward what filled both their minds that Sabella soon told him the entire matter and asked his advice. Mannikin had not yet decided what to do. Still, he advised her to gain time by promising an answer after the Ambassador's grand entrance. Sabella followed his suggestion.
        - id: ch03-b43
          speaker: narrator
          text: The delay displeased the Ambassador, but he had to accept it.
        - id: ch03-b44
          speaker: ambassador
          text: My equipages will arrive very soon. Then this city, and all the foreign Princes crowding it, will understand the true power and magnificence of my master.
        - id: ch03-b45
          speaker: narrator
          text: In despair, Mannikin decided to ask Genesta for help. He always remembered her gratefully, but when he began his journey he had vowed to seek her aid only in the greatest need. That night he fell asleep exhausted from thinking over every difficulty. In his dream, Genesta stood beside him.
        - id: ch03-b46
          speaker: genesta
          text: Mannikin, you have done very well. Continue to please me, and good friends will always appear when you need them most. Tell Sabella she may calmly await the Ambassador's triumphal entrance. In the end, everything will turn out well for her.
          emotion: calm
        - id: ch03-b47
          speaker: narrator
          text: Mannikin tried to kneel and thank her, only to wake and discover it had been a dream. Even so, courage returned. The next day he gave Sabella mysterious assurances that all would be well. He asked whether she would feel deeply grateful to someone who freed her from Brandatimor. She answered that her gratitude would have no limit. Then he asked what she would wish for such a person.
        - id: ch03-b48
          speaker: sabella
          text: I would wish that person to be as untouched by the foolish thing called love as I am.
        - id: ch03-b49
          speaker: narrator
          text: For a devoted lover, the answer was crushing. Mannikin hid his pain bravely.
    - id: ch04
      title: The War for Sabella
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The Ambassador announced that he would enter in state the following day and receive his answer. From the earliest light of dawn, the people of the capital were awake and moving. Everyone wanted the best possible place from which to admire the promised spectacle. They expected uniforms, horses, jewels, music, and carriages grander than anything they had ever seen. Good Genesta had prepared a kind of amusement that none of them expected. Before the procession arrived, she enchanted the eyes of every spectator.
        - id: ch04-b02
          speaker: narrator
          text: When the magnificent procession appeared, its splendid uniforms looked like rags too miserable for a beggar. The prancing horses seemed to be wretched skeletons that could barely drag one leg after another. Their harness, though covered in gold and jewels, appeared to be old sheepskins unfit even for a plow horse.
        - id: ch04-b03
          speaker: narrator
          text: The pages looked like the ugliest chimney sweeps. The trumpets sounded no better than whistles made from onion stalks or combs wrapped in paper. Fifty fine carriages became fifty donkey carts in the people's eyes. In the final carriage sat the Ambassador, wearing the proud, scornful expression he thought proper for the representative of a mighty King.
        - id: ch04-b04
          speaker: narrator
          text: That pride completed the joke. Every person in the procession looked vain and pleased with an appearance they believed dazzling. The crowd's laughter and mocking cries grew louder as the strange parade moved through the streets. Their roar reached Farda-Kinbras in the audience hall. Before the Ambassador arrived, the King heard what the procession looked like. Believing it meant to insult him, he ordered the palace gates shut.
        - id: ch04-b05
          speaker: narrator
          text: You can imagine the Ambassador's fury. After arranging so much pomp and displaying so much pride, he could not understand why the King absolutely refused to receive him. He raved against King and people alike. The whole procession turned back in confusion while the angry crowd jeered and pelted it with mud and stones. The Ambassador fled the country as quickly as his horses could carry him. But before he crossed the border, he declared war. With the most terrible threats, he promised to lay waste to the kingdom with fire and sword.
        - id: ch04-b06
          speaker: narrator
          text: A few days later, couriers came from King Bayard with a warm letter for Mannikin. Bayard offered help in any difficulty and eagerly asked how his friend was doing. Mannikin replied at once. He described everything since their parting, including the quarrel that now set Farda-Kinbras against Brandatimor. He ended by begging Bayard to send several thousand veteran spaniels.
        - id: ch04-b07
          speaker: narrator
          text: Neither the King, the Queen, nor Sabella could explain the Ambassador's astonishing behavior. Even so, preparations for war moved quickly. Every Prince who had not left for the Ice Mountain offered his services while demanding the finest position in the army. Mannikin volunteered among the first. He asked only to serve as aide to the commander, a brave soldier famous for many victories.
        - id: ch04-b08
          speaker: narrator
          text: As soon as the army could be assembled, it marched to the border. Brandatimor himself led the opposing force. He meant to avenge the insult to his Ambassador and seize Sabella. His army greatly outnumbered Farda-Kinbras's soldiers, who could do little but defend themselves.
        - id: ch04-b09
          speaker: narrator
          text: Before long, Mannikin earned the officers' respect through his judgment and ability. The ordinary soldiers admired him just as much for his courage and for the care he took of their welfare. Whenever he commanded one of the smaller clashes, he had the good fortune to defeat the enemy. At last Brandatimor threw his entire army into a terrible battle. The troops of Farda-Kinbras fought with desperate courage, but their celebrated commander was killed. With no leader and immense losses, they were forced to retreat.
        - id: ch04-b10
          speaker: narrator
          text: Mannikin performed wonders while the army fell back. No fewer than six times, he turned the retreating soldiers around and drove the pursuing enemy away. After the main defeat, he gathered enough remaining troops to keep Brandatimor in check and prevent complete disaster. Then the severe winter arrived and put a temporary end to the fighting. Mannikin returned from the frontier to a court filled with fear and confusion.
        - id: ch04-b11
          speaker: narrator
          text: Farda-Kinbras despaired over the death of his trusted commander. At last he begged Mannikin to take command of the army, and soon everyone followed the Prince's advice in matters of state. Mannikin continued amusing Sabella and carefully avoided reminding her of that tiresome subject called love. She was always glad to see him, and the winter passed happily for them both.
        - id: ch04-b12
          speaker: narrator
          text: All the while, Mannikin secretly planned the next campaign. Word came that a powerful body of spaniels had reached the country. He ordered them to hide along the border. As soon as he could, he met their commander, an old and experienced warrior. Following the spaniel's advice, Mannikin decided to fight a full battle the moment the enemy advanced.
        - id: ch04-b13
          speaker: narrator
          text: Brandatimor wasted no time in advancing. He was completely certain that this campaign would end the war and utterly defeat Farda-Kinbras. But the instant he ordered his cavalry to charge, the hidden spaniels put their plan into action. They had mingled among his troops without being noticed. Each dog leaped onto the nearest horse. Their sudden appearance terrified the animals and threw the whole squadron into confusion. The spaniels sprang at the riders' throats, unseated many of them, and turned the frightened horses toward the rear. Panic spread through every part of the army.
        - id: ch04-b14
          speaker: narrator
          text: The confusion gave Mannikin a complete victory. In single combat, he defeated Brandatimor and took him prisoner. But the proud King never reached the court where Mannikin sent him. The thought of appearing before Sabella as a captive was more than his pride could bear, and it killed him.
        - id: ch04-b15
          speaker: narrator
          text: During the war, Fadasse and the other rival Princes had hurried toward the Ice Mountain. They feared Mannikin might succeed there as he had everywhere else. When Mannikin returned, the news greatly troubled him. He had served Sabella faithfully, yet she only praised his brave deeds. She seemed no closer to giving him the love he desired.
        - id: ch04-b16
          speaker: narrator
          text: Mousta could offer only one comfort. Sabella loved no one else. Mannikin had to be satisfied with that. But he decided he would wait no longer. Whatever happened, he would attempt the great task that had brought him so far.
        - id: ch04-b17
          speaker: narrator
          text: The King and Queen begged him not to go. News had just arrived that Fadasse and every companion with him had died in the snow. Mannikin would not change his mind. Sabella offered her hand to be kissed with exactly the same gracious indifference she had shown at their first meeting. The farewell took place before the whole court, and Mannikin had become such a favorite that everyone resented her coldness.
        - id: ch04-b18
          speaker: farda_kinbras
          text: Prince, you have always refused every gift I offered in gratitude for your priceless service. I want the Princess to give you her marten-fur cloak. I hope you will accept this one.
        - id: ch04-b19
          speaker: narrator
          text: It was a magnificent mantle that Sabella loved to wear. She cared for it not because she felt the cold, but because the rich fur set off her delicate complexion and brilliant golden hair. Still, she removed it and courteously asked Mannikin to take it. He was delighted to accept.
        - id: ch04-b20
          speaker: narrator
          text: The Prince set out with the mantle, a small bundle containing many kinds of wood, and two of the fifty spaniels who had stayed after the war. In every town along the way, people gave him signs of affection and favor. At the final village, he left his horse and began the hard march across snow that stretched blank and terrible in every direction.
        - id: ch04-b21
          speaker: narrator
          text: The other forty-eight spaniels were waiting at the village as Mannikin had arranged. They received him joyfully, and every one assured him that, whatever might happen on the terrible road ahead, they would follow and serve him faithfully. The little Prince now had all fifty of Bayard's brave dogs beside him. Together they turned toward the endless snow and began the journey full of courage and hope.
    - id: ch05
      title: The Heart on the Ice Mountain
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: At first, a faint track led through the snow. It was difficult but not impossible to follow. The company could still see where earlier travelers had passed. Before long, even that poor track disappeared beneath the white emptiness. From then on, the Pole Star was their only guide. When it was time to halt for the first night, Mannikin put into action a plan he had considered with great care before leaving the court.
        - id: ch05-b02
          speaker: narrator
          text: He took a few twigs from the bundle of many kinds of wood and planted them upright in the snow. Then he scattered a small pinch of dust from the enchanted ship over them. To his great delight, the bare twigs sprouted at once. They thickened and rose so quickly that a perfect grove of many kinds of trees soon surrounded the camp. Flowers opened among the leaves, and ripe fruit followed immediately. The travelers had all the food they needed. They could also cut enough wood to build enormous fires and protect themselves from the killing cold.
        - id: ch05-b03
          speaker: narrator
          text: Mannikin sent several spaniels to explore nearby. They had the good fortune to find a horse trapped in the snow and loaded with provisions. The dogs fetched their companions and brought the prize triumphantly to camp. Most of the load was biscuits, so every spaniel went to sleep with a full stomach.
        - id: ch05-b04
          speaker: narrator
          text: In this way they moved forward day after day and camped safely every night. Before leaving each grove, they remembered to take enough living branches to make another one. The magic supplied food, shelter, and fire at every halt. Along the road they passed whole armies of people who had attempted the dangerous quest before them. Princes, knights, squires, and servants stood frozen stiff, without sense or movement. Mannikin strictly forbade the spaniels to waste strength trying to thaw them while Sabella's heart still waited ahead.
        - id: ch05-b05
          speaker: narrator
          text: For more than three months they struggled onward through the frozen country. They had seen the Ice Mountain in the distance for a long time. Day after day it grew sharper and clearer until at last they stood close beneath it. Even the brave travelers shuddered when they looked up at its terrible height and steep sides. Still they began to climb. Patience and persistence carried them upward, foot by foot. At every stopping place, fires made from the magic wood kept them alive in cold that would otherwise have killed them.
        - id: ch05-b06
          speaker: narrator
          text: Finally they reached the gates of the magnificent Ice Palace at the mountain's crown. Somewhere inside, in deadly silence and frozen sleep, lay Sabella's heart. Now the danger became greater than ever. Without strong fires, Mannikin and the spaniels would freeze. With too much heat, the solid blocks of the palace would melt and crash down upon them.
        - id: ch05-b07
          speaker: narrator
          text: They moved both quickly and carefully through the palace, carrying only enough warmth to live. One icy courtyard led to another. Silent halls opened before them, all built from clear, solid blocks. At last they found themselves at the foot of an enormous throne. A cushion of pure snow rested upon it. On that cushion lay a huge diamond that flashed brilliantly in the cold light. The heart of Princess Sabella was sealed inside. On the lowest step of the throne, words had been carved in letters of ice.
        - id: ch05-b08
          speaker: narrator
          text: They promised that whoever won Sabella's heart through courage and virtue might peacefully enjoy the happiness so richly deserved.
        - id: ch05-b09
          speaker: narrator
          text: Mannikin sprang forward. He had only enough strength left to seize the precious diamond, the one thing he desired above all else. Then he fell unconscious upon the snowy cushion.
        - id: ch05-b10
          speaker: narrator
          text: His loyal spaniels lost no time in rushing to save him. Several seized the unconscious Prince, and between them they carried him out of the hall as fast as they could. They escaped with not a moment to spare. Around them came the crash and clang of enormous falling blocks. The heat they needed for life was slowly bringing the Fairy Palace down upon their heads. The dogs hurried through hall after hall, crossed the courtyards, and descended the mountain. They did not stop until they had reached its foot.
        - id: ch05-b11
          speaker: narrator
          text: There they restored Mannikin to consciousness. When he opened his eyes and found Sabella's heart safely in his possession, his joy had no limit. The whole company turned back at once and traveled as quickly as possible toward the kingdom.
        - id: ch05-b12
          speaker: narrator
          text: On the outward journey, Mannikin had forbidden any attempt to rescue the frozen travelers. This time, the happy Prince could not endure the sight of his defeated and disappointed rivals standing helpless beside his triumphant path. He ordered the spaniels to spare no effort in restoring them to life. The magic warmth and the dogs' care succeeded so well that the returning company grew larger day after day.
        - id: ch05-b13
          speaker: narrator
          text: By the time Mannikin reached the village where his horse waited, five hundred sovereign Princes escorted him. Knights and squires beyond counting followed too. Mannikin treated them all with such courtesy and modesty that they gladly remained with him and wished to honor him. He was so full of happiness himself that peace with the entire world came easily.
        - id: ch05-b14
          speaker: narrator
          text: Soon he saw Mousta racing toward him. The faithful spaniel hoped to meet his master and report a sudden, wonderful change in Sabella. She had become gentle and thoughtful. She spoke of no one but Mannikin, worried about the hardships he might be suffering, and expressed her affection in a hundred tender ways. The news completed the Prince's delight.
        - id: ch05-b15
          speaker: narrator
          text: Then a royal courier arrived with congratulations from the King and Queen, who had just learned that Mannikin was returning in triumph. Even Sabella had sent him a graceful message of her own. Every new word from the capital made his happiness greater. Mannikin sent Mousta back to her, and she welcomed the spaniel joyfully. After all, Mousta had been a gift from the man she now loved.
    - id: ch06
      title: The Fur-Covered Prince
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: At last the great company reached the capital. The city received the travelers with all the magnificence that royalty could provide. Streets and public places filled with people eager to welcome the successful Prince and the hundreds he had saved. The long road ended in celebration, and the rescued rulers came behind Mannikin to do him honor. Farda-Kinbras and Birbantine came forward and embraced him. Before everyone, they declared that they already considered him their heir and the future husband of their daughter. The little Prince, who had returned at the head of five hundred sovereign Princes as well as countless knights and squires, answered with his usual modesty that they honored him far too greatly.
        - id: ch06-b02
          speaker: narrator
          text: Then he entered Sabella's presence. For the first time in her life, the Princess blushed when he kissed her hand. She could not find a single word. Mannikin knelt beside her and held out the brilliant diamond.
        - id: ch06-b03
          speaker: mannikin
          text: Madam, this treasure belongs to you. None of the dangers and hardships I endured could ever make me worthy of it.
        - id: ch06-b04
          speaker: sabella
          text: Ah, Prince, if I accept it, I will do so only to give it back to you. Truly, it is yours already.
          emotion: happy
        - id: ch06-b05
          speaker: narrator
          text: At that moment, the King and Queen hurried in and interrupted the pair with every question imaginable. They asked about the journey, the mountain, the palace, and the diamond. Quite often they repeated the same question two or three times without noticing. Whenever something remarkable happens, there seems to be one particular remark that everyone feels bound to make. On this occasion, more than a thousand people asked Mannikin exactly the same question.
        - id: ch06-b06
          speakers: [crowd_voice_1, crowd_voice_2, crowd_voice_3]
          ensemble: chorus
          text: And didn't you find it very cold?
        - id: ch06-b07
          speaker: narrator
          text: The King had come for a reason beyond asking questions. He requested that Mannikin and Sabella follow him into the Council Chamber. They obeyed without knowing what he intended. All the nobles of the kingdom were assembled there, and the King meant to present Mannikin publicly as his son-in-law and successor. When the Prince understood what was about to happen, he stopped the ceremony and begged permission to speak first.
        - id: ch06-b08
          speaker: narrator
          text: Mannikin told his entire history. He explained his childhood, his life with Genesta, and even his belief that he was the son of peasants. The moment he finished, the sky turned black. Thunder growled and lightning flashed. In that blaze of light, good Fairy Genesta suddenly appeared.
        - id: ch06-b09
          speaker: genesta
          text: Mannikin, I am satisfied with you. You have shown courage, and you have also shown a good heart.
        - id: ch06-b10
          speaker: narrator
          text: Genesta turned to Farda-Kinbras and revealed the Prince's true history. She told him about the foolish King and Queen, the distant Fairy's curse, and the child she had carried away. She explained that Mannikin's simple childhood, education, trials, and disappointments were all chosen to prepare him. A man who would one day command others needed exactly that upbringing. Then she spoke again to the Prince.
        - id: ch06-b11
          speaker: genesta
          text: You have already learned the value of a faithful friend. Now, as a reward for his kindness to you, you will have the pleasure of seeing King Bayard and all his subjects regain their proper forms.
        - id: ch06-b12
          speaker: narrator
          text: Just then, a chariot drawn by eagles swept into view. Inside were the foolish King and Queen who had mourned their child for so many years. They rushed to embrace their long-lost son with enormous joy. Through all their happiness, one detail particularly amazed them. Genesta's mysterious promise had come true after all. When they saw Mannikin again, Sabella's magnificent marten cloak covered him in fur.
        - id: ch06-b13
          speaker: narrator
          text: The foolish pair welcomed Sabella just as warmly. They caressed her and wrung her hands, which was one of their favorite ways of showing affection. While they crowded happily around the young couple, more wonders appeared outside. Chariots could be seen approaching the palace from every point of the compass, and each one carried more Fairies to the gathering.
        - id: ch06-b14
          speaker: genesta
          text: Sire, I have taken the liberty of making your court the meeting place for every Fairy who had time to come. I hope you can arrange for our great ball, which is held once in a hundred years, to take place here.
        - id: ch06-b15
          speaker: narrator
          text: Farda-Kinbras properly thanked Genesta for the honor she had done his court and began the preparations. He was also reconciled with Gorgonzola, and before long the King and the once-hostile Fairy opened the great ball together. During the celebration, Fairy Marsontine lifted the old enchantment from King Bayard and every one of his subjects. The spaniels all regained their human shapes, and Bayard once again appeared as handsome a King as anyone could wish to see.
        - id: ch06-b16
          speaker: narrator
          text: One of the Fairies immediately sent her own chariot to fetch the Queen of the Spice Islands. Bayard's long faithfulness was rewarded when he married his beloved Queen at the same celebration where Mannikin married the lovely and now gracious Sabella. Both weddings took place amid the once-in-a-century gathering of Fairies. Mannikin and Sabella lived happily ever after, and in time their vast kingdoms were divided among their children.
        - id: ch06-b17
          speaker: narrator
          text: Prince Mannikin never forgot the first gift Sabella had given him, the fur cloak that kept him warm on his journey and fulfilled Genesta's old promise. In grateful remembrance of that gift, he granted the loveliest martens the right to bear the Princess's name. That is why the most beautiful martens are called sables to this day.
