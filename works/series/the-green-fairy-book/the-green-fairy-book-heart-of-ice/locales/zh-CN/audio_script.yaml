  chapters:
    - id: ch01
      title: 诅咒与成长
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前有一位国王和一位王后，两人愚蠢得简直没法形容，却彼此爱得不得了。有些刻薄的人说，这恰好又证明了他们有多愚蠢。当然，你一定明白，说这种话的绝不会是他们自己的朝臣。毕竟他们是国王和王后，而且一直以来万事顺遂。那个年月，治理王国只有一件真正要紧的事，那就是同所有仙女和魔法师处好关系。该给他们的糕饼、成匹的缎带，还有种种小礼物，一样也不能少。尤其举行洗礼时，不管对方是好是坏，还是不好不坏，都得一个不漏地请来。王后的小儿子眼看就要受洗。几个月来，她一直忙着拟一份长得吓人的宾客名单，却完全忘记，读完名单差不多也要花上写名单那么久。洗礼时刻到了，负责邀请的国王才勉强念到第二页。他又累又急，舌头直打结，只能不断重复那套邀请仙女和魔法师光临、赐福王子的客气话。
        - id: ch01-b02
          speaker: birth_king
          text: 我恳请这位仙女，还有那位魔法师，前来参加洗礼，赐福给我的儿子。
        - id: ch01-b03
          speaker: narrator
          text: >-
            偏偏有人来报，第一页上的仙女早已等在大厅里，正抱怨没人迎接。国王只好丢下名单，跑去赔礼，求她们别伤害王子。大多数仙女都答应了。可其中一位从远方赶来，连她骑来的大鸵鸟都没人扶她下来。她越想越恼，低声念起了可怕的咒语。
        - id: ch01-b04
          speaker: distant_fairy
          text: 哼，漂亮话随你说。你儿子将来没有什么值得夸耀的。不管怎样，他都只会是个小不点儿。
          emotion: angry
        - id: ch01-b05
          speaker: narrator
          text: >-
            她本来还要送出五六样可怕的礼物。幸好一直庇护这个王国的吉内斯塔仙女及时赶到，又恭维又恳求，总算把她安抚下来。仪式结束，别的仙女和魔法师都走了，吉内斯塔却留下来责问王后，为什么不肯向她求教，甚至连邀请也没有送到。
        - id: ch01-b06
          speaker: birth_king
          text: 亲爱的夫人，我根本没来得及念到您的名字！我刚开了个头，就明白这件事办不成了。您看，我还在放弃的地方做了记号。
        - id: ch01-b07
          speaker: ginesta
          text: >-
            好了，我没有生气。我不会为这种小事同真正喜欢的人计较。说回你们的儿子吧。我替他挡掉了不少灾祸，可你们必须让我带走他，由我来抚养。等他浑身披满毛皮，你们才能再见到他。
        - id: ch01-b08
          speaker: narrator
          text: >-
            国王和王后听了放声大哭。他们住在炎热的地方，实在想不出儿子为何会披满毛皮，只当那预示着大灾难。吉内斯塔叫他们别担心。
        - id: ch01-b09
          speaker: ginesta
          text: >-
            让你们来养，他一定会变得和你们一样糊涂。我也不准备告诉他，你们就是他的父母。你们还是专心把王国治理好吧。
        - id: ch01-b10
          speaker: narrator
          text: >-
            她推开窗户，抱起婴儿，连摇篮也一起带走，像在冰面上滑行那样凌空飞远了，只留下伤心欲绝的国王和王后。从此，只要有人靠近，两人就要追问，“披满毛皮”到底是什么意思。谁也解不开这个谜，大家却都认定，那一定是件可怕的事。国王和王后越想越痛苦，整天失魂落魄地在宫里游荡，叫人看了都可怜。与此同时，吉内斯塔已经把王子带回城堡，交给一位年轻农妇，还施法让她相信，这个新来的婴儿也是自己的孩子。王子像普通农家孩子那样过着简朴生活，身体长得健康强壮。仙女认为，没有比这更好的磨炼。等他年纪大些，她把他留在身边的时间越来越长，让他的头脑和身体一起受到教养和锻炼。她还故意让他经历困难和失望，也让他看清世间人情，因为她知道，王子需要自己能够赐予的一切长处。
        - id: ch01-b11
          speaker: narrator
          text: >-
            王子的年岁一年年增长，个头却始终不长。他成了世上最小的王子。不过，他身手格外灵活，体态十分匀称，模样也俊美可亲，所以身材矮小其实没有那么要紧。人人都叫他“小不点儿”。他知道这名字实在可笑，便安慰自己，不管发生什么，总有一天，他都要让这个名字变得声名显赫。为了成全他，吉内斯塔开始送来一个又一个奇妙的梦。梦里有陆地上的冒险，也有海上的远征，而他永远都是英雄。有时，他从可怕的危险中救出美丽的公主。有时，他靠勇敢的壮举赢得一个王国。这样的梦越来越多，他也越来越渴望远走异乡，寻找自己的命运。在陌生的地方，没有人会因为他出身卑微就拦住他，他可以凭勇气赢得荣誉和财富。
        - id: ch01-b12
          speaker: narrator
          text: >-
            一天，王子本想去森林打猎，却骑马进了附近的大城。人们正朝市集飞奔，他也跟了过去。那里站着一群衣着古怪的异乡人，一位白发老人正在宣告消息。
        - id: ch01-b13
          speaker: herald
          text: >-
            天下人都听好！谁能登上冰山之巅，谁就能娶到举世无双的萨贝拉公主，还能得到她统治的全部疆土。这边列着为她倾倒、却死在求婚路上的王子，那边列着刚刚出发的人。
        - id: ch01-b14
          speaker: narrator
          text: >-
            王子立刻生出强烈的愿望，也想把自己的名字写上去。可他想到自己寄人篱下，手里又没有财富，不免迟疑。老人这时郑重地揭开随从捧着的画像，画中正是美丽的萨贝拉。王子只看了一眼，就再也不肯耽搁。他冲到前面，请求在名单上署名。那些异乡使者看看他小小的个头，又看看他朴素的衣裳，彼此疑惑地对望，不知道该答应，还是干脆拒绝。
        - id: ch01-b15
          speaker: prince
          text: 把纸给我。我要签名。
        - id: ch01-b16
          speaker: narrator
          text: >-
            王子心里又爱慕公主，又气恼使者的迟疑，竟只写下自己平日的称呼。长长一串显赫名号后面，单单添上“小不点儿”，使者们立刻大笑起来。
        - id: ch01-b17
          speaker: prince
          text: 无耻的家伙！要不是公主的画像就在这里，我一定砍下你们的脑袋！
          emotion: angry
        - id: ch01-b18
          speaker: narrator
          text: >-
            他随即想起，这名字确实可笑，而自己还没有来得及让它扬名，于是压下怒火，平静地询问前往萨贝拉王国的道路。他没有半点气馁，却也明白前方困难重重，所以决定马上出发。他甚至没有向吉内斯塔告别，生怕仙女设法拦住自己。城里认识他的人听说以后，都嘲笑小不点儿竟敢踏上这样的远征。消息还传到了他的亲生父母耳中。那对糊涂的国王和王后笑得比谁都厉害，根本没有想到，这个狂妄的小不点儿，正是他们失散多年的独生子。

    - id: ch02
      title: 远行与奇异的盟友
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 王子得到的指路话实在含糊得可怜。
        - id: ch02-b02
          speaker: herald
          text: 从高加索山往北走四百里格，你会在那里得到征服冰山的命令和指示。
        - id: ch02-b03
          speaker: narrator
          text: >-
            可王子是从今日日本附近的国度出发的，这种指示能有多大用处呢？他还是向东走去，并且一路避开城镇，免得别人听见名字又取笑他。你看，他那时还没有多少旅行经验，尚未学会别人拿自己开玩笑时，也跟着轻松一笑。夜里，他睡在树林，起先只靠野果填肚子。一直暗中照看他的吉内斯塔觉得，再这样下去，王子非饿个半死不可。于是，她每天趁他熟睡时，喂他吃下各种美味。王子只觉得奇怪，自己明明醒着时没有吃什么，怎么从来不饿。仙女依照计划，还不断安排种种奇遇来考验他的勇气，而王子每次都顺利闯过。只有最后一次，他同一头形似猛虎的凶兽搏斗，虽然没有害怕，却失去了坐骑。此后，他徒步艰难前行，终于来到一座海港。他找到一条正要驶往自己所需海岸的船，而身上的钱刚好够付船费，便登船启程。
        - id: ch02-b04
          speaker: narrator
          text: >-
            几天后，一场可怕的暴风雨彻底毁掉了小船。王子朝视野里唯一的陆地游了很远很远，才保住性命，却发现那只是一座荒岛。他靠捕鱼和打猎维持生活，始终盼着善良的仙女很快来救自己。一天，他正忧伤地望着大海，忽然看见一条模样古怪的船缓缓漂来，最后驶进小湾，搁在沙里。王子急忙跑去查看，惊讶地发现，船桅和帆桁全都生出枝杈，枝叶密密层层，整条船简直像一片小树林。四周没有一点声音，他以为船上无人，便拨开树枝，跳过船舷。不料船员全在里面，却一个个像死人似的纹丝不动。有的长在甲板上，有的同桅杆或船帮连在一起。魔法降临时，他们碰着什么，就同什么长到了一处。王子见他们如此可怜，立即拼尽全力搭救。他用一支箭的尖头，小心地把众人的手脚从木头上剥开，再一个接一个抱到岸上。他揉搓那些僵硬的手脚，又找来各种药草，泡出汁水替他们擦洗。几天以后，所有人竟完全康复，又能像从前那样驾船了。
        - id: ch02-b05
          speaker: narrator
          text: >-
            当然，这种神奇的疗效少不了吉内斯塔暗中相助。也是她让王子想到，可以用相同的魔法药草擦洗船身。王子把整条船清理干净，幸好动手及时，因为照先前的长势，再过不久，它真要变成一片森林了。水手们感激不尽，欣然答应把他送到任何想去的海岸。可是说到他们和船为何变成这样，谁也解释不清。他们只记得，船驶过一片覆盖着密林的海岸时，陆地突然刮来一阵风，把整条船裹在浓密的尘云里。此后，船上凡是不是金属的东西，都像王子看见的那样发芽开花。水手的身体也越来越麻木沉重，最后完全失去知觉。王子对这个故事很感兴趣，便到船底收集了许多尘土，小心保存起来。他想，这种怪异的力量将来或许能帮自己一个大忙。
        - id: ch02-b06
          speaker: narrator
          text: >-
            众人欢欢喜喜地离开荒岛，在平静的海上顺风航行了很久。终于看见陆地时，他们决定上岸补充淡水和食物，也想弄清自己到了哪里，下一步又该往哪个方向走。靠近海岸以后，他们怀疑这里会不会又是无人居住的地方，因为岸上一个人影也没有。可是贴地翻滚的尘云里，分明有许多黑色小身影在活动，还都朝他们准备登陆的地方聚拢。等到看清那是一群又大又漂亮的长毛猎犬，水手们别提多惊讶了。有些狗骑着马担任哨兵，另一些排成队伍和军阵，全都热切地看着众人下船。猎犬原本担心小不点儿会命令手下朝它们开枪，没想到王子却亲热地招呼好狗儿。它们立刻摇着尾巴，伸出爪子，一下全围了上来。很快，它们便让王子明白，它们希望他把水手留在岸边，独自跟随。王子正想多了解这些猎犬，欣然答应。他同水手约好等候十五天，若自己还没有回来，他们就自行离开。安排妥当，他才跟着新朋友走进内陆。
        - id: ch02-b07
          speaker: narrator
          text: >-
            道路一直伸向内陆。小不点儿惊讶地看见，田地耕作得井井有条，马和牛照常拉着车与犁，同别的国家没有两样。经过村庄时，农舍整洁漂亮，到处都是富足的景象。一个村子还为王子摆上一顿精巧的小餐。他正吃着，一辆双马华车驶来，驾车的大猎犬技术十分娴熟。王子舒舒服服地坐车继续前行。沿途遇到许多类似的车驾，上面的猎犬都彬彬有礼地向他致意。最后，马车飞快驶进一座大城。小不点儿认定，这里一定是王国的都城。居民显然早已听说他要来，全都守在门边和窗口。许多小猎犬甚至爬到城墙和城门上，只为看他进城。大家热烈欢迎，王子也兴味盎然地四处张望。他们穿过几条宽阔平整、两旁种着美丽树木的大街，驶入一座宏伟宫殿的庭院。院里满是军人模样的猎犬，王子猜它们便是国王的卫队。马车停下后，他被领去觐见国王。一只极其美丽的猎犬卧在华丽的波斯地毯上，身旁的小猎犬正忙着赶苍蝇，免得惊扰陛下。国王的大眼睛里原本含着忧伤，可他跳起来欢喜迎接小不点儿时，那忧伤立刻消失了。他让朝臣一个接一个上前致敬，又在两人独处时叫来国务秘书，照着口授写下一篇客气的致辞。他很遗憾彼此只能用文字交谈，因为狗的语言实在难懂。好在这里的文字，恰好和王子使用的一模一样。
        - id: ch02-b08
          speaker: narrator
          text: >-
            巴亚尔王写道，邻国一位仙女疯狂地爱上他，逼他娶她。可他深爱香料群岛的女王，不能答应。那仙女恼羞成怒，把国王和臣民全变成长毛猎犬，保留了他们的心智，却夺去了说话的能力。她还留下了一句判词。
        - id: ch02-b09
          speaker: gorgonzola
          text: 用四条腿奔跑，汪汪叫去吧，直到美德得到爱情与好运的回报。
        - id: ch02-b10
          speaker: narrator
          text: 巴亚尔王认为，这话其实就是叫他们永远做狗。小不点儿也觉得有道理，但还是努力安慰他。
        - id: ch02-b11
          speaker: prince
          text: 陛下，请您耐心等待。只要我能找到办法，就一定尽全力帮助您。
        - id: ch02-b12
          speaker: narrator
          text: >-
            小不点儿深深同情巴亚尔王，想出一切安慰的话，还答应只要有办法，就一定全力相助。两人因此成了亲密朋友。巴亚尔王骄傲地拿出香料群岛女王的画像。王子看过以后也承认，为这样美丽的人，无论受多少苦都值得。接着，小不点儿讲出自己的身世，还有这次远行肩负的伟大任务。巴亚尔王替他指出最适宜的前路，又给了许多宝贵指点，然后亲自陪他回到停船的海岸。水手虽然早已知道王子平安，见他回来还是欣喜不已。他们把国王送来的全部补给装上船，再次准备启航。两位朋友依依惜别。巴亚尔王坚持派名叫穆斯塔的侍从随行，命它一路照料王子，忠心为他效劳。穆斯塔也郑重答应。风向正好，船很快驶远。岸上的整支猎犬军队遵照国王命令，一起发出哀伤的长嚎。这是它们特意献给王子的崇高敬意。过了不久，叫声听不见了，陆地也从视野里完全消失。
        - id: ch02-b13
          speaker: narrator
          text: >-
            到了离目的港两里格的地方，王子因为钱已用尽，又不愿进城，便和穆斯塔提前上岸。他们在林边草地休息，看见一只漂亮小猴在树上翻腾。王子想捉住它，小猴总躲在手够不着的地方，直到哄得他答应跟随，才跳上他的肩。
        - id: ch02-b14
          speaker: monkey_fairy
          text: 可怜的小不点儿，咱们身上一分钱也没有，连下一步该怎么办都不知道。
        - id: ch02-b15
          speaker: prince
          text: 是啊。我连糖和饼干都没有，拿不出一样你爱吃的东西，我漂亮的小家伙。
          emotion: sad
        - id: ch02-b16
          speaker: monkey_fairy
          text: 你在困境里还这样有耐心，又肯替我着想。那我就带你去黄金岩。不过，穆斯塔得留在这里等。
        - id: ch02-b17
          speaker: narrator
          text: >-
            王子欣然答应。小猴从他肩头跳上最近的树，沿着枝头穿过树林，一边叫他跟来。可王子毕竟不能在树枝上跳跃，这段路对他并不容易。小猴不时停下来等候，还专门把最好走的地方指给他。渐渐地，树林变得稀疏，他们来到山脚一小片铺着青草的空地。空地中央孤零零立着一块岩石，大约有十英尺高。
        - id: ch02-b18
          speaker: monkey_fairy
          text: 别看它外表坚硬。用长矛刺一下，看看里面是什么。
        - id: ch02-b19
          speaker: narrator
          text: 王子一矛刺落石片，才发现薄薄石皮之下，整块岩石都是纯金。他惊得说不出话来。
        - id: ch02-b20
          speaker: monkey_fairy
          text: 刚才打落的金子都送给你。你觉得该拿多少，就拿多少。
        - id: ch02-b21
          speaker: narrator
          text: >-
            王子感激地道谢，却只拿起最小的一块。小猴立刻变成了一位高挑端庄的夫人。
        - id: ch02-b22
          speaker: monkey_fairy
          text: >-
            只要你始终像现在这样善良、坚定又知足，再难的任务也有成功的希望。这小块金子无论怎么使用，都永远不会变小。现在跟我来，看看节制让你逃过了什么危险。
        - id: ch02-b23
          speaker: narrator
          text: >-
            她沿另一条小路领王子走回树林。只见林中挤满了男男女女，每个人都面容苍白，身体憔悴。有的趴在地上寻找，有的仰头朝空中搜索，所有人都像发疯一样四处乱窜。他们只要听见一点声响，就会猛然转身，为了找到通往黄金岩的道路，不惜狂热地推搡践踏彼此。
        - id: ch02-b24
          speaker: monkey_fairy
          text: 你看，他们费尽力气也只是徒劳。最后，他们会像先前几百人那样，在绝望里死去。
        - id: ch02-b25
          speaker: narrator
          text: >-
            回到穆斯塔等候的地方，仙女便消失了。忠实的侍从见王子平安归来，高兴得又蹦又跳。主仆取最近的道路进城，在那里停留了几天。王子置办马匹，雇好随从，又四处打听萨贝拉公主和通往她王国的路。目的地依旧非常遥远，他只能听到一点含糊的消息。可一到高加索山，情形就完全不同了。这里的人谈来谈去只有萨贝拉，世界各地的异乡人也都在赶往她父王的宫廷。王子一路听见人们称赞公主的美貌和财富，也听说对手人数众多、势力强大。有的王子带着一支军队，有的拥有无尽财宝，还有的俊美多才，仿佛没有一点缺陷。可怜的小不点儿，除了必胜的决心、忠实的长毛猎犬和那个可笑的名字以外，几乎一无所有。那个名字大概帮不上忙，但既然改不了，他便聪明地不再多想。整整赶了两个月，他们终于抵达萨贝拉王国的都城特雷林廷。在那里，王子听到许多关于冰山的可怕传闻。所有试图攀登的人，没有一个能够回来。他也终于听到了冰山和无心公主的完整故事。

    - id: ch03
      title: 无心的萨贝拉
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            萨贝拉的父亲法尔达—金布拉斯富有而强大，同美丽的比尔班蒂娜王后过得幸福极了。一天，两人乘雪橇出游，竟得意地向命运挑战，说它休想破坏他们的快乐。路边一位呵着手取暖的老太婆听见了。
        - id: ch03-b02
          speaker: gorgonzola
          text: 那可得走着瞧。
        - id: ch03-b03
          speaker: narrator
          text: 国王听了大怒，正要惩罚她，王后连忙拦住他。
        - id: ch03-b04
          speaker: birbantina
          text: 陛下，别把事情弄得更糟。她说不定是一位仙女！
        - id: ch03-b05
          speaker: gorgonzola
          text: 这回你说对了。你们这样得意忘形会招来什么后果，很快就会明白。记住戈尔贡佐拉仙女！
          emotion: angry
        - id: ch03-b06
          speaker: narrator
          text: >-
            老太婆立刻站起身，在两人惊恐的注视下越长越高，化成一个庞大而可怕的巨人。她手里的拐杖成了一条展开翅膀、口吐烈火的巨龙，破斗篷成了金色披风，两只木鞋则变成两捆火箭。她骑上巨龙飞走，火箭朝四面八方射去，在空中拖出一道道长长的火星。国王和王后苦苦求她回来，又低声下气地赔罪，希望她平息怒火。可是戈尔贡佐拉连看也不看他们一眼，很快就消失在远方，只留下两人被种种不祥的预感折磨。没过多久，王后生下一个小女儿，那是世间从未见过的美人。北方所有仙女都受邀参加洗礼，也事先得到警告，要提防恶毒的戈尔贡佐拉。她同样收到了邀请，却不肯赴宴，也拒绝收下礼物。等其他仙女为小公主送完祝福，在宴席旁坐好，她才变成一只黑猫，偷偷潜进宫殿，藏到摇篮下面。乳母和摇摇篮的女仆刚一转身，她便猛扑出来，眨眼间偷走公主的心，逃了出去。只有几条狗和几个厨役追着她跑过庭院。到了宫外，她登上马车，径直飞往北极，把偷来的宝物锁在冰山之巅，又在周围布下重重险阻。她确信，只要公主活着，这颗心就会一直留在那里，这才得意地笑着回家。
        - id: ch03-b07
          speaker: narrator
          text: >-
            宴会结束以后，没有一位仙女发现异样，大家各自回去，国王和王后自然也毫不担心。萨贝拉一天比一天美丽。凡是公主应该学习的东西，她都能毫不费力地掌握。可她身上仿佛总少了些什么，始终无法真正打动人。她的歌喉美妙极了，但无论唱庄严的曲子，还是唱欢快的歌谣，都像完全不懂其中的意思。听过的人都说，她确实唱得尽善尽美，可声音里没有温情，也没有心。她的心远在冰山之上，歌声里又怎么会有心呢？她做其他事情时也是一样。岁月过去，全宫廷仍赞叹她，国王和王后也宠爱得近乎盲目，可那个致命的缺憾越来越明显。一个不爱任何人的人，也不会永远得到别人的爱。国王终于召集大会，请来众位仙女，希望她们查明问题究竟在哪里。他尽力讲述夫妻两人的悲苦，最后请求仙女亲眼看看公主。
        - id: ch03-b08
          speaker: falda
          text: 一定有什么地方不对，可我就是说不清。请你们亲眼看看她吧。你们赐给她的福分并不圆满。
        - id: ch03-b09
          speaker: narrator
          text: 仙女们保证没有漏掉任何祝福。可她们一走到萨贝拉面前，就同时惊叫起来。
        - id: ch03-b10
          speakers: [fairy_1, fairy_2, fairy_3]
          ensemble: chorus
          text: 太可怕了，她没有心！
          emotion: surprised
        - id: ch03-b11
          speaker: narrator
          text: >-
            国王和王后绝望极了，求仙女挽救女儿。最年长的仙女翻开挂在腰间的《魔法书》，查出是戈尔贡佐拉偷了公主的心，也查到那颗心藏在何处。
        - id: ch03-b12
          speakers: [falda, birbantina]
          ensemble: duo
          text: 我们该怎么办？怎样才能救她？
          emotion: fearful
        - id: ch03-b13
          speaker: elder_fairy
          text: >-
            你们看着萨贝拉，也爱着萨贝拉，她却只是一尊美丽的偶像，所以你们还要受苦很久。不过，她最终会找回自己的心。立刻把她的画像送到世界各地，再宣布，哪位王子能寻回她的心，公主和她的领地便都归他。她的美貌足以让天下王子踏上这场寻找。
        - id: ch03-b14
          speaker: narrator
          text: >-
            国王果然照办了，把公主的画像送往世界各地，也宣布了寻找她的心能够得到的奖赏。等小不点儿来到这里，已有五百位王子葬身冰雪，这还不包括他们的侍从和侍童。尽管如此，每天仍有更多人赶来，都急着碰碰运气。小不点儿仔细思量以后，决定进宫拜见。他的随从和他的个头一样不起眼，到达时没有引起半点轰动。那些对手的排场却惊人得很，光彩之盛，连法尔达—金布拉斯本人都要被比下去。小不点儿没有退缩，仍然举止优雅地拜见国王，又依照礼节，请求获准亲吻公主的手。可是，当他说自己名叫“小不点儿”时，国王几乎忍不住笑出来，站在旁边的王子们更是放声大笑。
        - id: ch03-b15
          speaker: prince
          text: 陛下若觉得有趣，只管笑吧。能让您高兴，我很荣幸。不过，我不是供这些先生取乐的玩意儿。请他们趁早明白这一点。
        - id: ch03-b16
          speaker: narrator
          text: >-
            他转向笑得最响的法达斯王子，当场提出决斗。法达斯料定他不是对手，轻蔑地答应第二天交锋。随后，小不点儿来到萨贝拉的接见大厅。眼前的美丽与华贵几乎令他透不过气来，可他还是镇定开口。
        - id: ch03-b17
          speaker: prince
          text: >-
            美丽的公主，我从世界另一端赶来，只因被您的画像吸引，也愿意永远效忠您。可我这荒唐的名字惹来了一场争执。明天，我要同那个又丑又笨重的王子决斗。请您亲临观战，让大家明白名字根本算不了什么，也让他们知道，您肯让小不点儿做您的骑士。
        - id: ch03-b18
          speaker: narrator
          text: 公主虽然没有心，却很懂幽默。她觉得王子有趣，彬彬有礼地答应了。小不点儿又请她不要偏袒法达斯。
        - id: ch03-b19
          speaker: sablella
          text: >-
            我才不偏袒那些傻瓜。他们整天拿多愁善感的话来烦我，说要把我从什么苦难里救出去。他们还总说“爱情”，那种乏味的东西我一点也不懂，老实说，连记都记不住。
        - id: ch03-b20
          speaker: narrator
          text: >-
            小不点儿立刻明白，与其拿公主不懂的爱情纠缠她，不如逗她开心。他谈起那些对手，从每个人身上找出可笑之处。公主兴致勃勃地一起取笑，很快便说，全宫廷里她最喜欢同小不点儿交谈。
        - id: ch03-b21
          speaker: narrator
          text: >-
            第二天，决斗的时刻到了。国王、王后和公主各自坐好，全宫廷和城中百姓也都聚来观看。法达斯王子披着金光灿烂的铠甲，威风凛凛地骑进赛场。他身后跟着二十四名侍从和一百名全副武装的士兵，每个人还牵着一匹骏马。小不点儿从另一边入场，手里只有一支长矛，身后也只有忠实的穆斯塔。两边的差距实在太大，全场顿时又爆发出笑声。可号角一响，两位斗士纵马冲向彼此。小不点儿轻巧地闪过迎面一击，又挺起长矛，将法达斯挑落马背，牢牢钉在沙地上。刚才的笑声立刻消失，变成一片赞叹的低语。
        - id: ch03-b22
          speaker: prince
          text: 我不会杀死自称是公主朝臣的人。法达斯，起来吧，去感谢公主赐你性命。
        - id: ch03-b23
          speaker: narrator
          text: >-
            他和穆斯塔在号角与欢呼中退场。国王祝贺他的胜利，赐给他宫中住所。萨贝拉想见穆斯塔，又因为它高雅聪明，恳求王子把它留下。小不点儿欣然答应。他既愿意礼让公主，也相信忠实的朋友留在她身边，将来会给自己很大帮助。

    - id: ch04
      title: 傲慢的使者与漫长的战争
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 小不点儿在宫廷里越来越受重视。这时，一位强大君主的使者来到边境，要求带着盛大仪仗入城，还送来主人布兰达蒂莫尔写给国王的信。
        - id: ch04-b02
          speaker: brandatimor
          text: >-
            法尔达—金布拉斯，若我早些看见萨贝拉的画像，就绝不会容许那群微不足道的王子围着她献殷勤，又跑去冰山送死。我既已宣布娶她，所有对手自然该马上退开。立刻让公主来同我成婚。你传遍天下的冰山故事，我根本不放在眼里。她若真的没有心，我也不在乎。世上若有人能替她找到一颗心，也只能是我。
        - id: ch04-b03
          speaker: narrator
          text: >-
            国王和王后又窘又恼，萨贝拉更是大发雷霆。三人决定先把信保密，再商量答复。穆斯塔却设法把消息送给小不点儿。王子惊怒交加，便去见公主，巧妙地把话题引到此事上。公主很快全说了出来，还问他该怎么办。王子也没有现成答案，只建议拖延到使者举行入城式以后。公主照办了。
        - id: ch04-b04
          speaker: narrator
          text: >-
            使者傲慢地答应等候，还夸口说，他的仪仗定会让全城和各国王子见识主人的威风。小不点儿实在无计可施，只得破例向吉内斯塔求助。他一向感激仙女，却早已发誓，不到天大的难关绝不求她。当夜，他疲惫地睡去，梦见吉内斯塔站在身边。
        - id: ch04-b05
          speaker: ginesta
          text: 小不点儿，你一直做得很好。只要继续让我满意，最需要的时候就会遇到朋友。告诉萨贝拉，安心等着使者凯旋入城吧。到头来，一切都会对她有利。
        - id: ch04-b06
          speaker: narrator
          text: >-
            王子醒来后重新有了勇气。他向公主保证，事情会圆满解决，又问她，若有人替她摆脱布兰达蒂莫尔，她是否会无限感激。公主说当然。王子接着问，她最希望那个人得到什么。
        - id: ch04-b07
          speaker: sablella
          text: 我会祝愿他和我一样，永远感觉不到所谓“爱情”那种蠢事。
        - id: ch04-b08
          speaker: narrator
          text: >-
            这话重重刺痛了小不点儿这样痴心的爱慕者，可他非常勇敢，把心里的痛苦完全藏了起来。使者这时派人传话，说自己第二天便会带着全副仪仗，亲自前来听取答复。从天刚蒙蒙亮开始，全城居民就纷纷行动，抢占观看盛景的最好位置。可善良的吉内斯塔已经替他们准备好一场乐子，远远超出所有人的预料。她在观众眼前施了魔法。使者华美的队伍终于出现，可那些灿烂的制服在人们眼里，竟成了连乞丐都羞于穿上身的破布。昂首腾跃的骏马变成可怜的骨头架子，仿佛连一条腿也拖不动。本来闪着黄金珠宝光芒的马饰，看起来却像连耕马都不配披的旧羊皮。侍童们一个个像世上最丑的扫烟囱工。号角发出的声音，还不如洋葱梗做成的哨子，也不如包着纸吹响的梳子。队伍里的五十辆华丽马车，也不过是五十辆驴车的模样。最后一辆车里，使者满脸高傲和轻蔑，自以为这一切才配得上强大君主的代表。整场荒唐仪仗最妙的地方就在这里，队伍中人人都洋洋自得，神色虚荣傲慢，对自己和周围的一切满意极了，还以为这份得意完全配得上眼前的豪华排场。
        - id: ch04-b09
          speaker: narrator
          text: >-
            这支古怪队伍一路向前，人群的笑声和嘲弄的叫喊也越来越响，最后一直传到正在接见大厅等候的国王耳中。仪仗还没有抵达宫殿，国王已经听人把它的模样讲得一清二楚。他以为对方存心侮辱自己，立刻下令关闭宫门。使者摆足了威风而来，国王却毫无缘由地拒绝接见，他自然暴跳如雷。他像发疯一样痛骂国王和百姓，整支队伍则在一片混乱中退走。愤怒的人群一路跟着嘲笑，还拿石块和泥巴砸他们。使者只得骑上快马，用最快速度逃出这个国家。可在离开以前，他发出了最可怕的威胁。他正式宣战，扬言要用刀剑和烈火，把整个王国夷为废墟。
        - id: ch04-b10
          speaker: narrator
          text: >-
            这场倒霉的出使过去几天后，巴亚尔王派信使送来一封极其亲切的信。他先问候小不点儿近况如何，又说朋友不管遇到什么困难，自己都愿意效劳。小不点儿立即回信，把两人分别以后发生的一切都讲了一遍，自然也没有忘记，那件刚刚让法尔达—金布拉斯和布兰达蒂莫尔结下死仇的事。信的末尾，他恳求忠实的朋友派来几千名久经战阵的长毛猎犬。国王、王后和公主谁也不明白，使者为什么会做出那番惊人的举动。尽管如此，宫廷仍在紧锣密鼓地备战。尚未出发去冰山的王子纷纷主动请战，还争着索取国王军中最好的职位。小不点儿也是最早请战的人之一，却只请求担任统帅的副官。那位统帅英勇善战，立下过许多战功。军队刚刚集结完毕，便立即开往边境，迎上布兰达蒂莫尔亲自率领的大军。敌人怒火冲天，不仅要替使者复仇，还想把萨贝拉据为己有。王国军队人数远远少于对方，只能采取守势。可是没过多久，小不点儿便凭才干赢得军官敬重，又凭勇气和对士兵的爱护，赢得全军爱戴。他指挥的每一场小规模战斗，也都幸运地击败了敌人。
        - id: ch04-b11
          speaker: narrator
          text: >-
            布兰达蒂莫尔终于发动惨烈大战。王国的统帅阵亡，全军败退。小不点儿六次扭转溃势，击退追兵，又聚拢足够兵力牵制敌军，直到严冬迫使双方停战。宫廷正一片惊慌，国王便恳求他接掌全军，连大小事务也听取他的意见。整个冬天，王子仍用笑话陪伴公主，从不拿她厌烦的爱情提醒她，所以萨贝拉见到他总很高兴。
        - id: ch04-b12
          speaker: narrator
          text: >-
            与此同时，王子一直暗中筹划下一场战役。他秘密得知，强大的长毛猎犬援军已经抵达，便命它们悄悄散布在边境沿线，千万不可引人注意。随后，他尽快同猎犬的统帅商议。那是一位年迈而经验丰富的战士。小不点儿听从它的建议，决定敌军一开始推进，就立刻进行正面决战。布兰达蒂莫尔深信自己马上能结束战争，彻底击溃法尔达—金布拉斯，所以一刻也不肯耽搁。可他的冲锋命令刚刚下达，早已神不知鬼不觉混入敌军的猎犬，就各自扑向离自己最近的战马。马匹受到惊吓，整个骑兵队顿时陷入混乱。猎犬又扑向骑手的咽喉，攻势来得太突然，许多人当场跌下马背。随后，猎犬掉转马头冲向敌军后方，到处制造恐慌，小不点儿就这样轻易取得全胜。他还在单独交锋中迎战布兰达蒂莫尔，把对方活捉。可是，这名俘虏没能活着到达王子命人押送的宫廷。他只要想到，自己将以这样的处境出现在萨贝拉面前，傲气就让他再也承受不住，最后竟送了命。
        - id: ch04-b13
          speaker: narrator
          text: >-
            与此同时，留在都城的法达斯等王子正全速赶去征服冰山。他们害怕小不点儿在这件事上，也会像做其他事一样成功。王子归来听到消息，十分懊恼。他的确一直在替公主效劳，可她只是钦佩他的英勇事迹，对他赞不绝口，却没有一丝更接近他热切渴求的爱情。穆斯塔只能用一件事安慰他，那就是公主至少也不爱别人。小不点儿只好以此为满足。不过，他已经下定决心，不管发生什么，都不能再拖延，必须去完成那件让自己万里迢迢赶来的伟业。王子向国王和王后辞行，两人苦苦恳求他不要去。他们刚刚听说，法达斯和所有同行的人已经葬身雪中。小不点儿仍然坚持自己的决定。至于萨贝拉，她只是伸手让他亲吻，态度同两人初见时一样亲切，却也一样漠然。这场告别恰好发生在整个宫廷面前。王子早已深受众人爱戴，大家看见公主对他这样冷淡，全都替他气愤。
        - id: ch04-b14
          speaker: falda
          text: 王子，你为我们立下的功劳无法估量，可我送的礼物都被你拒绝了。现在，请公主把她的紫貂皮斗篷送给你。这一次，你可不能再推辞。
        - id: ch04-b15
          speaker: narrator
          text: >-
            那件斗篷华美无比，萨贝拉很喜欢，因为它正衬她细腻的肤色和灿烂金发。她仍然脱下来，彬彬有礼地送给小不点儿。王子万分欣喜。除此之外，他只带上一捆树枝和两只猎犬，便踏上前往冰山的道路。

    - id: ch05
      title: 冰山之巅
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            王子一路经过一座又一座城镇，百姓都向他表达爱戴和善意。到了最后一个小村庄，他把坐骑留在那里，开始在雪地中艰难跋涉。举目望去，白雪一直铺到天边，四周空旷得令人害怕。王子已经同其余四十八只猎犬约好在这里会合。它们欢喜地迎上来，向王子保证，不管发生什么，都要忠实地追随他、侍奉他。于是，整支队伍满怀勇气和希望出发。起初，雪地里还有一条浅浅的踪迹。虽然走起来很难，至少还能跟随。可没过多久，连这点踪迹也完全消失了，茫茫雪地上，只剩北极星替他们指引方向。
        - id: ch05-b02
          speaker: narrator
          text: >-
            每到扎营时，王子便照着事先仔细想好的计划，命大家把带来的几根树枝插进雪里，再撒上一小撮从魔法船收集的神奇尘土。叫他万分欢喜的是，枝条立刻生根抽芽，飞快地生长起来。只过了短短一会儿，营地四周便围起一片由各种树木组成的浓密林子。树上鲜花盛开，还结满成熟的果实。他们很容易就有了需要的一切，也能燃起熊熊篝火来抵挡寒冷。王子又派几只猎犬外出侦察。它们幸运地发现一匹驮满食物的马，那匹马正陷在雪里，动弹不得。猎犬立刻叫来同伴，兴高采烈地把这份战利品带回营地。货物大多是饼干，所以那天夜里，没有一只猎犬饿着肚子入睡。
        - id: ch05-b03
          speaker: narrator
          text: >-
            他们就这样白天赶路，夜里安全扎营，每次离开时都记得带上几根树枝，好在下一处营地得到食物和遮蔽。一路上，他们经过了许多远征者的队伍。那些人冻得僵直，早已失去知觉，一动也不动。小不点儿严令猎犬，绝对不可试着给他们解冻。队伍不停向前，足足走了三个多月。冰山早已出现在远方，又随着他们每天前进，变得越来越清晰。最后，大家终于站到山脚，仰望那座陡峭高峰，忍不住浑身发抖。可他们没有退缩，而是凭着耐心和坚毅，一步一步向上爬。魔法木柴燃起的火焰也始终帮助他们抵御严寒。若没有那些火，王子和猎犬早已在半路丧命。
        - id: ch05-b04
          speaker: narrator
          text: >-
            他们终于站在雄踞山巅的宏伟冰宫门前。萨贝拉的心就在这座宫殿里，陷在死一般寂静而冰冷的沉睡中。到了这里，困难反而变得更大。若是燃起足以保住性命的热量，这座完全由坚冰砌成的宫殿随时可能融化，整个坍塌在众人头顶。王子和猎犬只好既谨慎又迅速地前进。他们穿过一重又一重庭院，再穿过一间又一间大厅，最后来到一座巨大宝座脚下。宝座上铺着雪做的垫子，一颗硕大而光辉灿烂的钻石正躺在那里。美丽的萨贝拉公主之心，就藏在这颗钻石里面。宝座最低一级台阶上，还刻着一行冰字。
        - id: ch05-b05
          speaker: narrator
          text: 无论你是谁，只要凭勇气与美德赢得萨贝拉之心，便安心享受你应得的福分吧。
        - id: ch05-b06
          speaker: narrator
          text: >-
            小不点儿向前一跃，用尽最后一点力气，终于抓住那颗珍贵的钻石。它里面装着王子在世间最渴求的一切。随后，他再也支撑不住，昏倒在宝座的雪垫上。忠实的猎犬一刻也没有耽搁，立即冲上来搭救。它们合力抬起王子，用最快速度逃出大厅，总算赶在最后一刻冲出了宫殿。四面八方不断传来冰块坠落的轰响。在那股异乎寻常的热气之下，仙女的宫殿正一点一点地融化，缓缓坍塌。猎犬没有停步，一直抬着王子逃到山脚，才敢停下来把他救醒。小不点儿睁开眼睛，发现自己已经拥有萨贝拉的心，欢喜得简直没有止境。
        - id: ch05-b07
          speaker: narrator
          text: >-
            他们立刻用最快速度踏上归途。这一次，幸福的王子再也不忍心看着失败而绝望的对手冻僵在胜利道路两旁。他命猎犬无论要付出多少辛苦，都必须让这些人重新获得生命。救援进行得非常成功，王子的队伍也一天天壮大。等他们回到寄放坐骑的小村庄时，护送小不点儿的已经有五百位君王和王子，此外还有数也数不清的骑士和侍从。王子始终谦逊有礼，众人便全都心甘情愿地跟随左右，急着向他表达敬意。何况，他自己正沉浸在无边的幸福里，自然很容易同全世界和睦相处。
        - id: ch05-b08
          speaker: narrator
          text: >-
            没过多久，他遇见忠实的穆斯塔。猎犬正在用最快速度赶来迎接王子，还要告诉他，公主身上突然发生了奇妙的变化。萨贝拉变得温柔又体贴，开口闭口只谈小不点儿。她担心王子正在经历怎样的艰难，又时刻为他的安危焦虑，还说了无数更加深情的话。这个消息让王子的喜悦达到顶点。接着，一名信使又带来国王和王后的祝贺。他们刚刚听说，王子已经成功归来。甚至萨贝拉本人，也托人送来一句温雅的赞美。小不点儿随即让穆斯塔回到她身边。公主欢喜地迎接了它。如今在她看来，这不是心上人送给自己的礼物吗？

    - id: ch06
      title: 找回的心
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            旅行者终于回到都城，受到了迎接君王一般隆重的欢迎。法尔达—金布拉斯和比尔班蒂娜一见小不点儿，便亲热地拥抱他，还宣布从此把他看作自己的继承人，也是公主未来的丈夫。王子谦逊地回答说，两位赐给自己的荣耀实在太多。随后，他终于获准去见萨贝拉。王子走到她面前，低头亲吻她的手。公主一生中第一次红了脸，竟羞得一句话也说不出来。小不点儿在她身旁跪下，郑重捧出那颗装着她的心、如今依旧灿烂夺目的钻石。
        - id: ch06-b02
          speaker: prince
          text: 夫人，这件宝物属于您。我经历的那些艰难和危险，还不足以让我配得上它。
        - id: ch06-b03
          speaker: sablella
          text: 王子，就算我收下，也只是为了再把它送给你。因为这颗心，其实早已属于你了。
          emotion: happy
        - id: ch06-b04
          speaker: narrator
          text: >-
            就在这时，国王和王后走进房间。他们把所有能够想到的问题全问了一遍，还常常把同一个问题翻来覆去地问。每逢发生一件大事，人们似乎总有一句非说不可的话。小不点儿这一次就发现，前前后后竟有一千多人问了他完全相同的问题。
        - id: ch06-b05
          speakers: [fairy_1, fairy_2, fairy_3]
          ensemble: chorus
          text: 那里是不是冷极了？
        - id: ch06-b06
          speaker: narrator
          text: >-
            国王来到这里，其实是要请王子和公主一同前往议事厅。两人跟着他去了，却不知道国王打算把小不点儿当众介绍给聚集在那里的全部贵族，再宣布王子是自己的女婿和继承人。小不点儿察觉了国王的意图，请求让自己先开口。他面对众人讲出全部身世，连自己一直相信是农夫之子这件事也没有隐瞒。话音刚落，天空突然变黑，低沉的雷声在头顶滚动，一道闪电划破黑暗。耀眼的电光之中，善良的吉内斯塔仙女骤然出现在众人面前。
        - id: ch06-b07
          speaker: ginesta
          text: >-
            小不点儿，我对你很满意。你显出的不只是勇气，还有一颗善良的心。陛下，这位王子本是国王的儿子。我把他带走，是为了给他最合适的教育，让他有一天能够统领别人。小不点儿，你已经明白忠实朋友的可贵。现在，巴亚尔王和他的臣民也会恢复原形，回报他们对你的善意。
        - id: ch06-b08
          speaker: narrator
          text: >-
            正在这时，一辆由雄鹰牵引的车驾来到宫廷。车里坐着的，竟是那对糊涂的国王和王后。两人满心欢喜地拥抱失散多年的儿子，又惊讶地发现，再见王子的时候，他果然浑身披满了毛皮。原来，吉内斯塔当年的预言，说的正是萨贝拉送给他的紫貂斗篷。两人又亲吻萨贝拉，还不停抓住她的手使劲摇。愚蠢的人总觉得，这样最能表达自己的亲昵。与此同时，来自四面八方的车驾纷纷出现，每一辆车里都坐着赶来相聚的仙女。
        - id: ch06-b09
          speaker: ginesta
          text: >-
            陛下，我擅自把您的宫廷定作聚会地点，请来了所有抽得出时间的仙女。希望您能趁这个机会，替我们举办那场每一百年才举行一次的盛大舞会。
        - id: ch06-b10
          speaker: narrator
          text: >-
            法尔达—金布拉斯恰如其分地感谢了这份荣耀。随后，他又同戈尔贡佐拉仙女和解。没过多久，两人竟一起为百年舞会开了舞。马松蒂娜仙女施展魔法，让巴亚尔王和他的所有臣民恢复原本的模样。巴亚尔不再是一只忧伤的长毛猎犬，重新成为一位俊美得无可挑剔的国王。一位仙女立刻派出车驾，前去迎接香料群岛的女王。她和巴亚尔王的婚礼，同小不点儿王子和美丽温柔的萨贝拉的婚礼，在同一天举行。从此，两对新人都永远幸福地生活在一起。后来，他们各自辽阔的王国，又分别传给了自己的孩子。
        - id: ch06-b11
          speaker: narrator
          text: >-
            故事到这里还没有完全结束。小不点儿王子始终记得，萨贝拉公主最初送给自己的那件珍贵礼物，正是紫貂皮斗篷。为了表达感念，他把使用公主名字的权利，赐给了世上最美丽的貂。从那以后，这种貂便被称作“萨贝尔”。这个名字一直流传下来，也就是我们如今所说的紫貂。
