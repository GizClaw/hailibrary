audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，像编书人面对孩子娓娓而谈，幽默处轻巧含笑
        timbre: 温暖清朗
        pace: 舒缓而有自然起伏
        pitch: 中音
    vivien:
      display_name: 维维安王子
      tts:
        delivery: 热烈爽直，急躁时语流飞快，勇敢时坚定有力
        timbre: 明亮清越
        pace: 偏快
        pitch: 中高音
    placida:
      display_name: 普拉西达公主
      tts:
        delivery: 温柔懒散，话语从容，偶尔带一点不动声色的俏皮
        timbre: 柔和清甜
        pace: 偏慢
        pitch: 中高音
    patience:
      display_name: 耐心婆婆
      tts:
        delivery: 慈和安定，句句慢条斯理，绝不受催促影响
        timbre: 苍老柔暖
        pace: 缓慢
        pitch: 中低音
    blackbird:
      display_name: 黑鸟
      tts:
        delivery: 神秘庄重，吐字清晰，带有不可违逆的威严
        timbre: 深沉浑厚
        pace: 缓慢
        pitch: 低音
    green_giant:
      display_name: 绿巨人
      tts:
        delivery: 粗暴强硬，悲号时夸张响亮，发怒时咄咄逼人
        timbre: 粗砺洪亮
        pace: 适中
        pitch: 低音
    millifish:
      display_name: 米尔利菲什仙女
      tts:
        delivery: 严肃果断，命令简洁有力，试探时不露声色
        timbre: 清冷端正
        pace: 适中
        pitch: 中音
    farm_queen:
      display_name: 农庄王后
      tts:
        delivery: 客气温和，劝说时诚恳又带着为难
        timbre: 温厚柔婉
        pace: 适中
        pitch: 中音
    bird_lady:
      display_name: 百鸟夫人
      tts:
        delivery: 高傲威严，问话锐利，斥责时毫不留情
        timbre: 清亮冷峻
        pace: 适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 两种截然相反的性情
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，格里德林国王和桑托丽娜王后十分恩爱。王后美丽又善良，国王也几乎集齐了所有美德。为他主持洗礼的仙女曾召来历代祖先的亡灵，从每一位身上取出一种长处，放进他的性情里。只是仙女给他的好心肠多了些，而人好心过了头，难免会给自己惹麻烦。那时候，国王的日子一直很顺利，可这样的好运并没有长久。
        - id: ch01-b02
          speaker: narrator
          text: >-
            王后生下一个可爱的女儿，取名普拉西达。国王觉得，女儿只要容貌和性情都像母亲，就什么也不缺了，所以洗礼时一位仙女也没请。这可把仙女们得罪透了。她们认为国王夺走了自己应有的权利，决心重重地惩罚他。不久，王后先是病倒，后来竟消失得无影无踪。国王亲眼看着这一切，悲痛万分。要不是还有小公主等他抚养，真不知道他会变成什么样。
        - id: ch01-b03
          speaker: narrator
          text: >-
            好在洛洛特仙女不计较那场洗礼，主动来照顾普拉西达，也照顾她的小表兄维维安。维维安从小失去父母，还是婴儿时就交给舅父格里德林国王抚养。洛洛特对两个孩子尽心尽力。可等他们渐渐长大，谁都看得出来，教养能让天生的缺点柔和一点，却不能把它们彻底除掉。
        - id: ch01-b04
          speaker: narrator
          text: >-
            普拉西达美得无人能比，也聪明得很，什么都是一学就会，一听就懂。可她偏偏懒散又冷淡，简直到了极点。维维安正好相反。他活泼得过了头，总是兴冲冲地抓住一件新鲜事，转眼就腻了，又扑向另一件只能让他高兴一会儿的事。
        - id: ch01-b05
          speaker: narrator
          text: >-
            两个孩子将来都有可能继承王国，百姓当然格外留意他们。安静温和、喜欢和平的人盼着普拉西达做女王，鲁莽好斗的人却一心拥戴维维安。两派针锋相对，国家眼看就要发生内战，还会跟着闹出种种乱子，连宫里的人也常起冲突。两个孩子教养很好，不至于争吵，可他们的性情和喜好没有一处相同，根本亲近不起来，更别说同意结婚了。偏偏只有他们成婚，才能让两派都满意，这实在叫人遗憾。
        - id: ch01-b06
          speaker: narrator
          text: >-
            维维安知道有许多人支持自己。他心地正直，不愿伤害美丽的表妹。也许他实在太急躁、太善变，从来不肯把事情认真想完，忽然就决定独自出门寻找奇遇。这个念头恰好在他骑马时冒出来，不然他为了省下片刻，准会徒步出发。他立刻掉转马头，只想着尽快离开王国。
        - id: ch01-b07
          speaker: narrator
          text: >-
            王子突然失踪，举国震惊，因为谁也不知道他去了哪里。王后失踪以后，格里德林国王本来对什么都提不起精神，这回总算惊醒了。他一看普拉西达就会泪流不止，却还是决心亲自瞧瞧女儿究竟有什么才干。很快，他发现公主本来就懒，洛洛特还一天比一天纵容她，简直像个溺爱孙女的祖母。国王只好郑重劝告仙女。洛洛特温顺地听完，诚恳答应不再助长公主的懒散和冷淡。
        - id: ch01-b08
          speaker: narrator
          text: >-
            从那一刻起，可怜的普拉西达便开始受苦了。人们竟要她自己挑衣裳、保管珠宝，还得自己想办法找乐子。她宁可从早到晚穿着同一条旧裙子，也不愿操这些心。只要能不公开露面，她就绝不出现。可事情还不止这些。国王坚持让人给她讲解国事，要她参加每一次会议。别人问起她手头正在处理的事务，她还必须说出自己的意见。生活一下成了沉重的负担，她哭着苦苦央求洛洛特，把她带离这个对一位不幸公主要求太多的国家。
        - id: ch01-b09
          speaker: narrator
          text: >-
            洛洛特起初十分坚决，不肯答应。可普拉西达那么美，又流着泪苦苦哀求，谁能一直拒绝她呢？最后，仙女施了魔法，把公主送进自己的岩洞。公主连姿势都没换，依旧舒舒服服地蜷在最喜欢的卧榻上。她这一消失，全国又陷入绝望，格里德林国王更是神魂不定。
        - id: ch01-b10
          speaker: narrator
          text: >-
            再回头看看维维安吧。那颗闲不住的心已经把他带到了王国边界，骏马再也走不动了。王子只得下马步行，缓慢的脚程把他的耐性折磨得够呛。在他看来，自己走了长得不得了的一段路，才孤零零地进入一片广阔的森林。林中又暗又深，他暗自打了个寒战，仍选中一条看起来最有希望的小路，鼓起勇气，尽快往前赶。可天黑时，他还是没能走出树林。
        - id: ch01-b11
          speaker: narrator
          text: >-
            他摸着黑，沿小路跌跌撞撞地走。就在精疲力尽的时候，前方忽然闪出一点亮光。

    - id: ch02
      title: 耐心婆婆和黑鸟神谕
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            那点亮光让维维安重新有了精神。他以为住处和晚餐就在前面，可越往亮光走，它反而越远，有时还彻底消失。等他终于来到透出灯光的破旧小屋前，已经恼火得不得了。他砰砰敲门，屋里传来一个老妇人的声音。见她迟迟不开门，他越敲越重，还傲慢地命令她马上放自己进去，完全忘了这里早已不是他的王国。老妇人一点也不受影响，只温和地回答。
        - id: ch02-b02
          speaker: patience
          text: >-
            你得耐心一点。
          emotion: calm
        - id: ch02-b03
          speaker: narrator
          text: >-
            老妇人确实在来开门，只是慢得出奇。她先把猫赶开，免得猫趁开门跑出去。接着，她自言自语地说，油灯的灯芯得修一修，才看得清来客。灯油又不够，还得添满。她为了这件事、那件事，慢吞吞地来回走了很久，还不时叫王子耐心等着。
        - id: ch02-b04
          speaker: narrator
          text: >-
            维维安总算进了小屋，却绝望地发现这里穷得一眼就能看完，连一点吃的也没有。他告诉老妇人，自己又饿又累，快要死了。她仍平静地要他耐心，又指给他看一捆可以当床的稻草。
        - id: ch02-b05
          speaker: vivien
          text: >-
            那我吃什么？
        - id: ch02-b06
          speaker: patience
          text: >-
            等等，再等等。你要是肯耐心，我现在就去园子里摘豌豆。我们慢慢剥好，再生火把豆子煮透，然后安安稳稳地吃。根本不用着急。
          emotion: calm
        - id: ch02-b07
          speaker: vivien
          text: >-
            等你全做完，我早就饿死了。
        - id: ch02-b08
          speaker: patience
          text: >-
            耐心，耐心。我是急不来的。你一定听人说过吧，肯等待的人，什么都等得到。
          emotion: calm
        - id: ch02-b09
          speaker: narrator
          text: >-
            维维安气得发狂，却一点办法也没有。老妇人又慢慢开口。
        - id: ch02-b10
          speaker: patience
          text: >-
            来吧，我去摘豌豆，你替我举着灯。
        - id: ch02-b11
          speaker: narrator
          text: >-
            王子一把抢过油灯，动作太猛，灯一下灭了。他只好从壁炉灰里刨出两小块红炭，费了很久才把灯重新点亮。豌豆终于摘来剥好，火也生起来了。可老妇人说自己只煮五十四颗，一颗不能多，所以还得仔细数豆子。王子一再抱怨自己快饿昏了，五十四颗根本不够吃，多几颗少几颗又有什么关系，可全都没用。他只好数出五十四颗。偏偏匆忙中又掉了一两颗，为了弄准数目，只能从头再数。
        - id: ch02-b12
          speaker: narrator
          text: >-
            豆子刚熟，老妇人便从柜子里拿出一架秤和一小块面包，准备把面包分开。维维安再也等不下去，一把抢过整块面包，全吞进肚子，还回敬了她一句“耐心”。
        - id: ch02-b13
          speaker: patience
          text: >-
            你是在拿这个词开玩笑。可我真的就叫耐心。总有一天，你会知道更多关于我的事。
          emotion: calm
        - id: ch02-b14
          speaker: narrator
          text: >-
            随后，他们一人吃了二十七颗豌豆。王子惊讶地发现，自己竟然什么也不想再吃了。那天夜里，他睡在稻草上，和从前睡在王宫里一样香甜。
        - id: ch02-b15
          speaker: narrator
          text: >-
            第二天早晨，老妇人给他牛奶和面包。他吃得心满意足，也庆幸这回没有东西需要摘、需要数、需要煮。吃过早饭，他请老妇人说说她究竟是谁。
        - id: ch02-b16
          speaker: patience
          text: >-
            我很愿意告诉你，不过这个故事很长。
        - id: ch02-b17
          speaker: vivien
          text: >-
            要是很长，我可听不了！
        - id: ch02-b18
          speaker: patience
          text: >-
            你这个年纪，该听听老人家的话，也该学会耐心。
        - id: ch02-b19
          speaker: vivien
          text: >-
            可是，可是，老人家也不该说个没完！你只告诉我这是什么地方，别的都不用讲。
        - id: ch02-b20
          speaker: patience
          text: >-
            那当然可以。这里叫黑鸟森林，黑鸟就在这里降下神谕。
        - id: ch02-b21
          speaker: vivien
          text: >-
            神谕！那我一定要去请示它。
          emotion: surprised
        - id: ch02-b22
          speaker: narrator
          text: >-
            他掏出一把金币递给老妇人。她不肯收，他就把钱扔在桌上，像闪电一样冲出门，连路都没问。他随便选了眼前第一条小径，一路飞奔，不是迷路，就是被石头绊倒，或是一头撞上树。他毫不留恋地把小屋丢在身后，因为屋子和主人一样，都不合他的心意。
        - id: ch02-b23
          speaker: narrator
          text: >-
            走了一阵，他远远望见一座巨大的黑城堡，高高俯瞰整片森林。王子认定神谕就住在那里，日落时正好赶到了最外层的城门。城堡四周环绕着一道深壕沟。吊桥、城门、沟里的水，还有城墙和塔楼，全都阴沉漆黑。门上挂着一口巨钟，钟面用红字警告来客，凡人若好奇自己的命运，就敲响此钟，并甘愿承受随后降临的一切。
        - id: ch02-b24
          speaker: narrator
          text: >-
            王子毫不犹豫，抓起大石头敲响巨钟。低沉可怕的钟声一响，城门轰然打开。他刚走进去，门就在身后发出雷鸣般的巨响，猛地合拢。无数蝙蝠尖叫着从塔楼和城垛间飞起，遮黑了天空。换成别人早就吓坏了，维维安却大步走向第二道门。六十名从头到脚裹着长斗篷的仆人替他开了门。
        - id: ch02-b25
          speaker: narrator
          text: >-
            维维安想跟他们说话，却发现他们讲的语言完全陌生，自己一个字也听不懂。他最不习惯把话憋在心里，这下气坏了，甚至真心想念起老朋友耐心来。他只能默默跟着向导，走进一座华丽的大厅。地板铺着乌木，墙由黑玉砌成，帷幔也全是黑天鹅绒。王子找不到任何食物，只能打手势说自己饿了。对方也客客气气地打手势，叫他等待。
        - id: ch02-b26
          speaker: narrator
          text: >-
            几个钟头以后，那六十个裹着长袍的身影再次出现，用隆重的礼节和慢得不能再慢的脚步，把他带进宴会厅。长桌中央依次摆着菜。王子急忙去拉面前的盘子，才发现盘子牢牢钉在桌上。身边那些严肃阴郁的人，每人手里都有一根细长的空心芦管，正慢慢从管子里吸取食物。维维安只好照做，心里觉得这种吃法烦透了。
        - id: ch02-b27
          speaker: narrator
          text: >-
            饭后，众人又带他回到乌木大厅，逼他看一盘又一盘下不完的棋。等他无聊得几乎要死，才慢慢把他送进寝室。第二天一早，他想到终于能请示神谕，醒来就要求去见黑鸟。仆人一声不答，只把他带到一座巨大的大理石浴池前。浴池一头很浅，一头很深。他们示意王子走进去。王子正想跳进深水，却被温和而坚决地拦住，只许站在一寸深的水里。
        - id: ch02-b28
          speaker: narrator
          text: >-
            不管维维安怎样抗议，这套手续每天都要重复，水位每天只升一寸。整整六十天，他不能开口说话，只能任人用隆重的礼节带来带去。每一顿饭都得从长芦管里慢慢吸食，还要看完一盘又一盘下不完的棋，而下棋恰恰是他最厌恶的事情。终于，水涨到他的下巴，漫长的沐浴仪式才算结束。
        - id: ch02-b29
          speaker: narrator
          text: >-
            那一天，黑袍仆人排成缓慢的队伍，把王子围在中间，每人头顶都停着一只大蝙蝠。他们唱着忧郁的歌，走向通往神殿的铁门。另一队仆人随歌声出现，接过了维维安。这一队看起来和前一队一模一样，只是走得更慢，手腕上还栖着乌鸦。乌鸦的沙哑叫声在阴森的地方回荡。仆人挽住王子的手臂，与其说在向他致敬，不如说是在压住他的急躁。
        - id: ch02-b30
          speaker: narrator
          text: >-
            他们一步一步爬上神殿台阶。好不容易到了顶端，王子以为等待终于结束，谁知众人先慢吞吞地给他裹上一件黑袍，又让他看完一项接一项的冗长仪式。维维安那股躁动的不耐烦，早已被磨成无精打采的厌倦。他不停打哈欠，虽然很失礼，却没有人理会。
        - id: ch02-b31
          speaker: narrator
          text: >-
            他绝望地盯着眼前厚重的黑帘。过了一会儿，帘子竟向旁边滑开。维维安几乎不敢相信自己的眼睛。黑鸟就在面前，身躯大得惊人，停在一根横贯整座神殿的粗铁杆上。仆人们立刻跪倒，掩住面孔。黑鸟扇了三次巨翼，清清楚楚地用王子的语言开口。
        - id: ch02-b32
          speaker: blackbird
          text: >-
            王子，你能不能得到幸福，全看那件与你天性最为相反的事。
        - id: ch02-b33
          speaker: narrator
          text: >-
            黑帘再次落下。又经过许多仪式，一只乌鸦被放在王子手腕上，他才由人缓慢地送回铁门。乌鸦离开以后，第一队仆人重新接手，一只大蝙蝠自己落在王子头顶。他们把他带回浴池，让整套过程倒着再来一次。这回从深水开始，水位每天退一寸。
        - id: ch02-b34
          speaker: narrator
          text: >-
            维维安终于把这一切熬完了。仆人把他送到外门，用种种恭敬有礼的姿态向他告别。王子的回应恐怕相当冷淡，因为城门刚打开，他就拔腿狂奔，一心只想离那座阴郁的城堡越远越好。他为了请示一个啰唆的神谕，竟然这么鲁莽地闯进去，结果神谕几乎什么也没告诉他。他当真为自己的愚蠢反省了大约五秒钟，最后得出一个结论，有时候，行动以前也许最好先想一想。

    - id: ch03
      title: 白纸船与绿城堡
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            维维安又在外面游荡了好几天，走得又累又饿，总算离开了森林。不久，他来到一条宽阔湍急的河边，便顺着河走，希望找到过河的办法。第二天太阳升起时，他看见河心有一团耀眼的白色。仔细一瞧，那是一艘漂亮极了的船，附带的小划艇就系在附近岸边。
        - id: ch03-b02
          speaker: narrator
          text: >-
            王子立刻强烈地想登上那艘船。他高声呼喊，却没有船员回应。于是他跳进小艇，划向大船。小艇全由白纸做成，轻得像一片玫瑰花瓣，划起来毫不费力。到了跟前，他才发现大船也是白纸做的。船上没有人，船舱里却有一张舒服的小床，还有充足的美食和美酒。王子决定，在下一件新鲜事发生以前，先尽情享受这些东西。
        - id: ch03-b03
          speaker: narrator
          text: >-
            他在格里德林国王的宫廷里受过很好的教育，当然懂得航海。可是船一动，水流就带着它飞快冲向下游。维维安还没弄清自己在哪里，船已经出了海。背后恰好起了风，很快把他吹得再也看不见陆地。王子有些惊慌，努力调转船头，想回到河里，可风浪和潮水太强了。
        - id: ch03-b04
          speaker: narrator
          text: >-
            他想起自己从小不知听过多少次告诫，千万不要摆弄水上的东西。现在后悔已经太晚。他只能徒劳地盼着自己当初留在岸上，同时对船、大海和一切相关的东西厌烦到了极点。这两件事，他做得都再彻底不过。更倒霉的是，船很快停在海中央，一点风也没有。这样的处境连最有耐性的人都难熬，何况是维维安。他甚至宁愿回到黑鸟城堡，那里至少还能看见活物。白纸船上只有他孤零零一个人，他想不出任何办法逃离这座无聊的牢狱。
        - id: ch03-b05
          speaker: narrator
          text: >-
            过了漫长得不得了的一段时间，他终于看见陆地。王子急着上岸，翻过船舷就想游过去。可不管他跳得多远，还没落进水里，白纸船总会重新出现在脚下。他只能认命，勉强拿出一点耐心，等风浪把船送进一道伸入陆地的天然港湾。被困海上那么久以后，他看见参天大树一直长到水边，欢喜极了。他轻快地跳上岸，又很快迷失在茂密的森林里。
        - id: ch03-b06
          speaker: narrator
          text: >-
            走了很远，他在一眼清泉旁停下来休息。刚躺上长满苔藓的岸边，附近的灌木丛就剧烈响动，一只漂亮的小瞪羚猛地蹿出来。它累得喘不过气，倒在王子脚边。
        - id: ch03-b07
          speaker: placida
          text: >-
            啊，维维安，救救我！
          emotion: fearful
        - id: ch03-b08
          speaker: narrator
          text: >-
            王子大吃一惊，一跃而起。剑才出鞘，一头追赶瞪羚的绿色巨狮就扑到面前。维维安勇敢迎战。恶斗没有持续多久，王子猛力一剑击倒了狮子。狮子倒下时用尽力气，响亮地吹了三声口哨，整座森林都在回响，两里格外大概也听得见。吹完以后，它似乎再没有别的事可做，翻身侧躺，死了。王子不去理会它，也没多想那三声口哨，只回到瞪羚身边。
        - id: ch03-b09
          speaker: vivien
          text: >-
            这下你满意了吧？既然你会说话，就快告诉我发生了什么，你又怎么知道我的名字。
        - id: ch03-b10
          speaker: placida
          text: >-
            啊，我得休息很久才能说话。而且我很怀疑你有没有时间听，因为事情还远远没有结束。其实，你现在最好回头看看。
        - id: ch03-b11
          speaker: narrator
          text: >-
            瞪羚说话还是那样懒洋洋的。王子猛地转身，惊恐地看见一个巨人正大步逼近，还恶狠狠地喊起来。
        - id: ch03-b12
          speaker: green_giant
          text: >-
            我倒要看看，是谁害我的狮子吹了口哨？
          emotion: angry
        - id: ch03-b13
          speaker: vivien
          text: >-
            是我。不过我敢保证，它以后再也吹不了了！
        - id: ch03-b14
          speaker: narrator
          text: >-
            巨人一听，立刻号啕大哭。
        - id: ch03-b15
          speaker: green_giant
          text: >-
            唉，我可怜的小不点儿，我心爱的小宝贝！至少我还能替你报仇！
          emotion: sad
        - id: ch03-b16
          speaker: narrator
          text: >-
            他挥舞着缠在手腕上的巨蛇，朝王子猛冲过来。维维安沉着挥剑，可剑刚碰到蛇，蛇就变成巨人，巨人又变回蛇，快得叫他头晕。这样至少反复了六次。最后，王子幸运地把蛇斩成两段，捡起一截，用尽全力掷中巨人的鼻子。巨人昏倒在狮子身上。一团浓黑的云立刻滚来，把他们全遮住。云散以后，他们全都不见了。
        - id: ch03-b17
          speaker: narrator
          text: >-
            王子连剑都顾不上收回鞘里，便冲回瞪羚身边。
        - id: ch03-b18
          speaker: vivien
          text: >-
            现在你有时间恢复精神，也没什么可怕的了。快说你是谁，那个巨人、他的狮子和蛇又跟你有什么关系。看在老天的分上，快一点！
        - id: ch03-b19
          speaker: placida
          text: >-
            我很愿意告诉你，可为什么要着急呢？我想请你跟我回绿城堡，不过我不愿意走回去。那里太远，走路又太累。
        - id: ch03-b20
          speaker: vivien
          text: >-
            那我们马上出发，不然我真要把你留在这里了。你年轻又灵活，还是一只瞪羚，连几步路也不肯走，不觉得难为情吗？城堡越远，就越该快走。不过你不喜欢赶路，我答应慢慢走，我们边走边谈。
        - id: ch03-b21
          speaker: placida
          text: >-
            你肯抱着我就更好了。不过我不喜欢看别人受累。你可以抱我，再让那只蜗牛驮着你。
        - id: ch03-b22
          speaker: narrator
          text: >-
            它懒懒地抬起一只小蹄子，指向王子原以为是石头的东西。维维安这才看清，那是一只硕大的蜗牛。
        - id: ch03-b23
          speaker: vivien
          text: >-
            什么，让我骑蜗牛？你是在取笑我！这样走，一年也到不了。
          emotion: surprised
        - id: ch03-b24
          speaker: placida
          text: >-
            那就别骑好了。我很愿意留在这里，青草这么绿，泉水这么清。不过换成我，我会听从忠告，骑上蜗牛。
        - id: ch03-b25
          speaker: narrator
          text: >-
            王子满心不情愿，还是把瞪羚抱在怀里，骑上蜗牛的背。蜗牛一路安安稳稳地滑行。维维安不断用脚后跟踢它，它却一点也不肯加快。瞪羚再三告诉他，自己快活得很，这是它找到的最省力的旅行方式，可说什么也没有用。王子急得发狂，只觉得绿城堡永远也到不了。可他们终究还是到了。城堡里所有人都跑了出来，看王子怎样从这匹奇怪的坐骑上下来。
        - id: ch03-b26
          speaker: narrator
          text: >-
            更惊人的事还在后面。按照瞪羚的请求，维维安把它轻轻放在城堡台阶上。瞪羚突然变成一位迷人的公主，正是他美丽的表妹普拉西达。她仍像往常一样温柔沉静地向他问候。王子喜出望外，急忙跟她走进城堡，迫不及待地想知道她为何会来到这里。
        - id: ch03-b27
          speaker: narrator
          text: >-
            可他还得再等一阵。绿国居民听说巨人死了，全都赶来，要把王国献给打败巨人的英雄。维维安不得不听完一篇又一篇赞辞。这些演说拖了很久，虽然他已经把它们缩到礼貌允许的最短程度，甚至可能比那还短。最后，他总算回到普拉西达身边，公主马上讲起了自己的遭遇。

    - id: ch04
      title: 普拉西达的故事
      blocks:
        - id: ch04-b01
          speaker: placida
          text: >-
            你走以后，他们想教我治理国家，简直把我烦死了。我苦苦求洛洛特带我离开，她过了一阵终于答应，却很不情愿。她把我和最喜欢的卧榻一起送进岩洞，我在那里舒舒服服地过了几天。洞里有柔和的绿光，像春天的山毛榉林。蜜蜂低声嗡鸣，流水叮咚响着，听起来真叫人安宁。
        - id: ch04-b02
          speaker: placida
          text: >-
            可洛洛特不得不去参加仙女大会。她回来时惊慌极了，说自己因为纵容我，付出了很大的代价。她受了严厉的责备，还奉命把我交给米尔利菲什仙女。那位仙女已经在管教你，而且大家都夸她把你管得特别好。
        - id: ch04-b03
          speaker: vivien
          text: >-
            管得可真好！要是我那些奇遇全是她安排的，那简直好极了。表妹，你接着说吧。一会儿我也把自己的事全告诉你，到时候你亲自判断。
        - id: ch04-b04
          speaker: placida
          text: >-
            开始时，我看见洛洛特哭，心里很难过。可我很快发现，难过也是一件累人的事，还是平静下来好。不久，米尔利菲什骑着一头高大的独角兽来到洞口，命令洛洛特把我带出去。洛洛特哭得更厉害，亲了我十二次，却不敢拒绝。我被扶上独角兽，坐在仙女身后。
        - id: ch04-b05
          speaker: millifish
          text: >-
            小姑娘，不想摔断脖子，就给我牢牢抓紧。
        - id: ch04-b06
          speaker: placida
          text: >-
            我确实只好使出全身力气抓住她。那匹可怕的坐骑一路颠得太厉害，叫我几乎喘不过气。最后，我们总算停在一座大农庄前。农夫和他的妻子一看见仙女，就立刻跑出来扶我们下去。
        - id: ch04-b07
          speaker: placida
          text: >-
            我知道他们其实是一位国王和一位王后，因为又无知又懒惰，才受到了仙女的惩罚。我已经累得半死，米尔利菲什却坚持让我先喂独角兽，没喂完以前，别的什么都不许做。为了喂它，我得爬上一架长梯，进到干草棚里，再一把接一把地抱下二十四把干草。我这一辈子从没做过这么累的事，现在想起来还会发抖。可事情并没有结束，我还得把那二十四把干草一把一把送进马厩。
        - id: ch04-b08
          speaker: placida
          text: >-
            到了晚餐时间，我又得伺候所有人。我真以为把这些活全做完，总该让我安安静静地上小床睡觉了吧。唉，才没有呢！我先要自己铺床，因为床铺乱成一团。然后还得替仙女铺床，给她盖好被子，拉拢床帘，再做十来件我从没做过的小事。我终于累得筋疲力尽，总算能自己睡了。可我以前从没亲手脱过衣服，根本不知道该从哪里开始，干脆穿着衣服躺下。
        - id: ch04-b09
          speaker: placida
          text: >-
            不幸的是，仙女发现了。就在我快要甜甜睡去的时候，她又把我叫起来。即使这样，我还是想办法躲过她的眼睛，只脱掉了外袍。悄悄告诉你，我一直觉得不听话很划算。挨骂固然是常有的事，可也能省下不少麻烦。
        - id: ch04-b10
          speaker: placida
          text: >-
            天才蒙蒙亮，米尔利菲什就叫醒我。她要我一次又一次跑去马厩，再回来报告独角兽睡得怎样，吃了多少干草。接着，她又要我弄清现在几点，天气好不好。我动作太慢，差事也做得很糟。临走前，她叫来国王和王后。
        - id: ch04-b11
          speaker: millifish
          text: >-
            今年你们做得比以前好多了。想回自己的王国，就继续把农庄好好经营下去。还要替我照顾这位小公主，教她做个有用的人。等我再来，要看见她已经改掉缺点。不然的话……
        - id: ch04-b12
          speaker: placida
          text: >-
            她说到这里停下来，很有深意地看了我们一眼，随后骑上我的仇敌，那头独角兽，飞快地消失了。国王和王后转过来，问我会做什么。
        - id: ch04-b13
          speaker: placida
          text: >-
            我向你们保证，我什么也不会。
        - id: ch04-b14
          speaker: placida
          text: >-
            我说话的口气，本来应该足以让他们相信。可他们还是不断列举各种活计，想找出一件合我心意的。最后，我总算说服他们，只有什么都不做才适合我。他们若真想善待我，就该让我上床睡觉，不要再拿做事来烦我。让我高兴极了的是，他们答应了。吃饭时，王后还把我的那份送到楼上。可第二天一早，她就来到我床前。
        - id: ch04-b15
          speaker: farm_queen
          text: >-
            漂亮的孩子，恐怕你今天真的得下决心起床了。我很明白，彻底闲着有多舒服。我和丈夫还是国王王后时，从早到晚也什么都不做。我真盼着那些幸福的日子快些回来。可现在还没到时候，你也一样。仙女说过，我们要是不听命，或许会有更糟的事。求你快点下楼吃早饭吧，我给你留了鲜美的奶油。
        - id: ch04-b16
          speaker: placida
          text: >-
            真是烦人，可又没有别的办法，我只好下楼。谁知早餐刚结束，他们又像杜鹃一样，翻来覆去地问我想做什么。不管我怎么回答都没用。
        - id: ch04-b17
          speaker: placida
          text: >-
            夫人，如果您允许，我什么也不想做。
        - id: ch04-b18
          speaker: placida
          text: >-
            最后，王后给我一根纺锤，纺杆上还装了大约四磅大麻，然后叫我出去放羊。她向我保证，世上再没有比这更舒服的差事，而且我想休息多久都可以。我当然很不愿意，可你也能想到，我最后还是出发了。
        - id: ch04-b19
          speaker: placida
          text: >-
            没走多远，我来到一处阴凉的坡岸，觉得那里可爱极了。我舒舒服服地躺在软草上，把那捆大麻当枕头，很快睡着了，仿佛世上根本没有羊。羊群也到处乱走，仿佛世上根本没有牧羊女。它们闯进一块又一块田地，专吃那些不许碰的好东西。农民们看见庄稼遭殃，惊慌地吵起来，声音终于传到国王和王后耳中。
        - id: ch04-b20
          speaker: placida
          text: >-
            他们跑出来看清骚乱的原因，连忙把羊群赶拢。自然是越快越好，因为所有损失都得由他们赔偿。至于我，我舒舒服服地躺在那里看他们奔跑，一动也没动。那地方实在太舒服了。要不是他们气喘吁吁地赶来，硬逼我起身跟着回去，我也许到现在还躺在那里。他们狠狠责备了我，不过不用我告诉你，他们当然也再没把羊群交给我。
        - id: ch04-b21
          speaker: placida
          text: >-
            可不管他们给我找什么活，结果都一样。我样样弄坏，样样做糟，连最有耐心的人也会被我惹恼。一天，我从农庄逃了，因为我真怕王后会忍不住揍我。我来到国王常去钓鱼的小河边，看见一条船系在树上，就跨进去解开缆绳，顺着水流慢慢漂走。船身轻轻滑动，舒服得让人昏昏欲睡。王后发现以后，沿着岸追来，大声喊我，我懒得理她。
        - id: ch04-b22
          speaker: farm_queen
          text: >-
            我的船！丈夫，快来抓住这个偷了我的船逃跑的小公主！
          emotion: angry
        - id: ch04-b23
          speaker: placida
          text: >-
            水流很快把我带到听不见她呼喊的地方。我伴着涟漪的歌声和树木的低语做起梦，直到小船忽然停住。它搁浅在一片青翠的草地旁，太阳也正在升起。远处有几座形状很奇怪的小房子。我饿了，便朝那边走。可没走几步，就看见空中到处是闪亮的东西。它们似乎固定在那里，我却看不出挂在什么上面。
        - id: ch04-b24
          speaker: placida
          text: >-
            我走近以后，看见一根丝绳垂到地面。它正好在手边，我便拉了一下。霎时间，银铃一起奏出悦耳的乐声，响遍整片草地。那声音太好听了，我坐下来听，望着银铃在阳光中闪耀摇摆。铃声还没停，一大群鸟飞过来，每只都落在一枚铃铛上，把自己的歌声添进合奏里。
        - id: ch04-b25
          speaker: placida
          text: >-
            歌声结束时，我抬头看见一位高挑庄严的夫人向我走来。她周围和身后，簇拥着数不清的各色鸟儿。
        - id: ch04-b26
          speaker: bird_lady
          text: >-
            小姑娘，你是谁？我不许凡人住在这里，免得惊扰我的鸟儿，你竟敢闯进来！不过你若有点本领，我也许还能容你留下。
          emotion: angry
        - id: ch04-b27
          speaker: placida
          text: >-
            夫人，请您放心，我绝不会做任何惊扰鸟儿的事。我只求您可怜我，给我一点吃的。
        - id: ch04-b28
          speaker: bird_lady
          text: >-
            我会给你食物，然后把你送到该去的地方。
        - id: ch04-b29
          speaker: placida
          text: >-
            她派六只做侍从的松鸦替我取来各种饼干，别的鸟又衔来成熟的水果。总之，我吃了一顿十分可口的早饭，只是不喜欢它们这样迅速地伺候我。被人催着赶着，实在太不舒服。我渐渐觉得，能留在这个宜人的国度也很好，就把自己的想法告诉那位庄严的夫人。她却很轻蔑地回答。
        - id: ch04-b30
          speaker: bird_lady
          text: >-
            你以为我会留下你？就凭你！这里人人精神十足，整天忙个不停，要你有什么用？不行。我给你的款待只有这些。
          emotion: disgusted
        - id: ch04-b31
          speaker: placida
          text: >-
            她转身用力拉动那根丝绳。这回响起的不再是悦耳的铃声，而是一阵可怕的铿锵巨响，吓得我魂都要飞了。一只硕大的黑鸟突然出现，落在仙女脚边，用骇人的嗓音问她。
        - id: ch04-b32
          speaker: blackbird
          text: >-
            姐姐，你要我做什么？
        - id: ch04-b33
          speaker: bird_lady
          text: >-
            立刻把这个小公主送到我表兄绿城堡巨人那里。代我请他让她日夜不停地织那幅美丽的挂毯。
        - id: ch04-b34
          speaker: placida
          text: >-
            大鸟根本不理会我的哭喊，一把抓起我，以可怕的速度飞走了。
          emotion: fearful
        - id: ch04-b35
          speaker: vivien
          text: >-
            表妹，你是在开玩笑吧！应该是慢得不能再慢才对。我认识那只可怕的黑鸟。它不管做什么，连它周围的一切，都会拖得没完没了。
        - id: ch04-b36
          speaker: placida
          text: >-
            随你怎么说，我受不了争辩。也许根本不是同一只鸟。总之，它以惊人的速度带走我，又轻轻把我放进这座现在由你作主的城堡。我们从窗户进去。大鸟把我交给那个刚才被你除掉的巨人，转达仙女的话，随后飞走了。
          emotion: calm
        - id: ch04-b37
          speaker: green_giant
          text: >-
            原来你是个懒虫！很好，我们一定要教会你干活。你可不是第一个被我们治好懒病的人。看看我的客人们有多忙吧！
        - id: ch04-b38
          speaker: placida
          text: >-
            我照他的话抬头一看，一条巨大的回廊围着整座大厅。回廊里到处都是挂毯架、纺锤、一绞绞羊毛、图样，还有需要用到的各种东西。每只架子前大约坐着十二个人，全在埋头苦干。看到这幅可怕的景象，我当场昏了过去。刚一醒来，他们就问我会做什么。我仍像以前那样回答，我什么也不会。我怀着最强烈的愿望，希望他们真的相信，可这句话完全没用。
        - id: ch04-b39
          speaker: green_giant
          text: >-
            那你就必须学会做点事。这个世界上的活，多得足够每个人来做。
        - id: ch04-b40
          speaker: placida
          text: >-
            原来，他们正在把仙女们最喜欢的故事全织进挂毯。大家开始教我帮忙。可我从最初的头等班一路往下降，越降越低，最后连最简单的针法也没学会。
        - id: ch04-b41
          speaker: placida
          text: >-
            他们把所有寻常的惩罚全试过了，没有用。巨人又带我参观他的动物园，里面关的全是不肯做事的孩子，还是没有用。最后，我一路沦落到只配给染羊毛的工坊打水。就连这件事，我也做得慢得出奇。今天早晨，巨人终于大发雷霆，把我变成一只瞪羚，正要把我关进动物园。我碰巧看见一条狗，吓得拔腿就跑，穿过城堡外院逃了出来。
        - id: ch04-b42
          speaker: placida
          text: >-
            巨人怕我彻底跑掉，就派绿狮子追我，命令它不管用什么办法都把我带回去。要不是在泉边幸运地遇见你，我宁可站着被捉、被吃掉，或是随便怎样，也不愿再多跑一步。啊，现在总算能安安静静坐着了，真舒服。我早就学东西学烦了。
        - id: ch04-b43
          speaker: narrator
          text: >-
            维维安说，自己却是被迫安静了太久，一点也不好玩。接着，他上气不接下气地讲完全部奇遇。他说了怎样在耐心婆婆家过夜，怎样请示神谕，又怎样乘着纸船航行。

    - id: ch05
      title: 爱让他们改变
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            随后，维维安和普拉西达手牵着手，放出了关在城堡里的所有囚犯。他们又打开动物园的一只只笼子，救出被关在那里的王子和公主。绿巨人一死，这些人立刻恢复了原来的模样，大家对两位救命恩人感激万分。普拉西达恳求他们，只要还活着，就永远、永远不要再缝一针。众人马上在院子里点起一堆大火，郑重地烧掉所有刺绣架和纺车。
        - id: ch05-b02
          speaker: narrator
          text: >-
            随后，公主送给他们丰厚的礼物。说得更准确一点，是公主舒舒服服地坐在一旁，由维维安替她把礼物一件件送出去。绿城堡里一片欢腾，人人都使出全力讨王子和公主欢心。可他们虽然好意十足，还是常常把事情弄错，因为维维安和普拉西达的打算从来不一样，实在让人不知道该听谁的。人们往往用慢得不能再慢的速度执行王子的命令，却像闪电一样冲去做一件公主压根不希望别人做的事。
        - id: ch05-b03
          speaker: narrator
          text: >-
            渐渐地，这对表兄妹遇到小麻烦时，会彼此商量，也会彼此安慰，最后竟变得非常亲爱。为了普拉西达，维维安变得很有耐心。为了维维安，普拉西达也肯付出从未有过的努力。
        - id: ch05-b04
          speaker: narrator
          text: >-
            仙女们一直兴致勃勃地看着这一切。她们觉得，现在该插手了。她们要用更进一步的考验，看看这番改变能不能长久，也想弄清两个人是不是真心相爱。于是，她们让普拉西达看起来像是发起高烧，又让维维安变得憔悴迟钝。两个人看到对方的样子，都忧心不已，担心得不得了。
        - id: ch05-b05
          speaker: narrator
          text: >-
            趁他们分开时，米尔利菲什忽然出现在普拉西达面前。
        - id: ch05-b06
          speaker: millifish
          text: >-
            我刚见过维维安王子。他看起来病得很重。
        - id: ch05-b07
          speaker: placida
          text: >-
            唉，是的，夫人。只要您肯治好他，您把我送回农庄也好，让绿巨人复活也好。我一定让您看到，我会多么听话。
          emotion: sad
        - id: ch05-b08
          speaker: millifish
          text: >-
            你真想让他康复，就捉到奔跑鼠和飞翔苍头燕雀，把它们带给我。别忘了，时间很紧！
        - id: ch05-b09
          speaker: narrator
          text: >-
            话音刚落，公主便一头冲出城门。仙女一直望着她，直到她的身影彻底消失，才轻轻笑了一声，然后转身去找王子。维维安恳切地求她，只要肯救普拉西达一命，就算把他送回黑城堡，或是送回那条白纸船上都行。仙女神情十分严肃，只是摇了摇头。她完全同意王子的判断，公主的情况确实很不妙。
        - id: ch05-b10
          speaker: millifish
          text: >-
            不过，你只要找到玫瑰鼹鼠，把它交给普拉西达，她就会痊愈。
        - id: ch05-b11
          speaker: narrator
          text: >-
            这回轮到王子匆匆出发。偏偏他刚离开城堡，就朝着和普拉西达完全相反的方向去了。你可以想象，这两个情深意切的人怎样没日没夜地寻找。公主在树林里不停奔跑，也不停侧耳倾听。那两只小动物在她看来实在太难捕捉，她却一直紧紧追逐，从来不肯放弃。
        - id: ch05-b12
          speaker: narrator
          text: >-
            王子则不停走过一片又一片草地，双眼紧盯着地面，留意鼹鼠的每一点动静。他不得不慢慢地走，踮着脚尖，轻得几乎不敢呼吸。他常常像一尊石像，一动不动地站上几个钟头。要是渴望成功的心能够帮忙，他早就捉到玫瑰鼹鼠了，可惜他抓到的总是普通的黑鼹鼠。
        - id: ch05-b13
          speaker: narrator
          text: >-
            奇怪的是，维维安从没有不耐烦。他总是准备好重新开始这场烦琐的寻找。不过，爱情能改变人的性情，本来就是它最常见的奇迹之一。王子和公主心里只有寻找，根本没有想别的，甚至没问过自己走进了哪个国家。
        - id: ch05-b14
          speakers: [placida, vivien]
          ensemble: duo
          text: >-
            我终于救下我心爱的人了！
          emotion: happy
        - id: ch05-b15
          speaker: narrator
          text: >-
            经过漫长又疲惫的追逐，两个人终于各自成功，却都没想到会在同一刻喊出这句话。他们听见彼此的声音，惊讶地抬头一看，随即欣喜若狂地奔向对方。巨大的惊喜让他们一时说不出话，只是静静地彼此凝望，一起度过了无比美妙的一瞬。
        - id: ch05-b16
          speaker: narrator
          text: >-
            就在这个时候，迎面走来的不是别人，正是格里德林国王。原来，他们只顾着寻找，竟然不知不觉回到了他的王国。国王也认出了他们，满心欢喜地迎上来。后来，大家回头去找那只玫瑰鼹鼠、飞翔的苍头燕雀和奔跑鼠。三只动物却已经不见了，原地站着一位从未见过的美丽夫人，还有黑鸟和绿巨人。
        - id: ch05-b17
          speaker: narrator
          text: >-
            格里德林国王一看见那位夫人，便发出一声欢呼，把她紧紧抱进怀里。她不是别人，正是失踪已久的妻子桑托丽娜王后。至于她被囚禁在仙境里的经历，也许有一天你会读到。接着，黑鸟和绿巨人也恢复了本来的模样，原来他们都是魔法师。洛洛特和米尔利菲什也乘着各自的车，从天空中降落下来。
        - id: ch05-b18
          speaker: narrator
          text: >-
            随后，那里到处都是热烈的亲吻和欢喜的道贺。每个人都重新找回了自己所爱的人，心中的喜悦自然说也说不完。就连那两位魔法师也不例外，因为他们深爱着自己本来的模样。所有人一起回到王宫以后，维维安王子和普拉西达公主没有再耽搁，立刻举行了婚礼。那场婚礼盛大无比，场面极尽辉煌。
        - id: ch05-b19
          speaker: narrator
          text: >-
            格里德林国王和桑托丽娜王后经历了这一切以后，再也没有心思继续统治。他们幸福地退隐到一个安宁清静的地方，从此在那里安安静静地生活，把整个王国交给维维安王子和普拉西达公主。两个人共同治理王国，深受全体臣民爱戴。终其一生，对他们来说，世上最大的幸福始终都是让别人得到幸福。
