  chapters:
    - id: ch01
      title: The Two Young Heirs
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there were a King and Queen who loved each other dearly. Queen Santorina was so beautiful and kind-hearted that no one could wonder at her husband's love for her. King Gridelin was a bundle of good qualities himself. At his christening, the Fairy in charge had called up the shades of all his ancestors and taken one good thing from each of them to build his character. Unfortunately, she gave him rather too much kindness of heart. That gift often brings its owner trouble, though so far everything in Gridelin's life had prospered.
        - id: ch01-b02
          speaker: narrator
          text: Such good fortune could not last forever. Their lovely daughter, Placida, was born soon afterward. The King thought that if she had her mother's face and nature, she could need no other gift. He did not bother to invite any Fairies to the christening. The Fairies believed he had denied them one of their rights. They were mortally offended and decided on a severe punishment. First Santorina became very ill. Then she vanished altogether. Gridelin was overcome with grief. No one could say what might have become of him if the little Princess had not still needed to be raised.
        - id: ch01-b03
          speaker: narrator
          text: The good Fairy Lolotte took charge of Placida and of her orphaned cousin, Prince Vivien, who had lived under his uncle's care since he was a baby. Lolotte did everything she could for them, but education could only soften their natural faults. It could not remove them.
        - id: ch01-b04
          speaker: narrator
          text: Placida was lovely and clever enough to learn anything, yet she was as lazy and indifferent as anyone could be. Vivien was just the opposite. He was far too lively. He began one new pursuit after another, tired of each almost at once, and flew to whatever caught his fancy next.
        - id: ch01-b05
          speaker: narrator
          text: Either child might one day inherit the kingdom, so the people watched them closely. Every quiet, peace-loving citizen wanted Placida for a future Queen. The rash and quarrelsome expected great things from Vivien. Those rival hopes threatened civil war and every kind of public trouble. Even inside the palace, the two parties often collided. The cousins themselves were too well brought up to quarrel, but they differed in every taste and feeling. They found it impossible to like each other. A marriage between them was the one answer that would have satisfied both parties, and there seemed no chance that either would ever consent to it.
        - id: ch01-b06
          speaker: narrator
          text: Vivien knew that many people supported him. He was too honorable to harm his cousin, and much too restless to think seriously for long. One day, while already on horseback, he decided to ride away in search of adventure. Had he been walking, he would have left on foot rather than lose a moment. He simply turned his horse toward the border and went.
        - id: ch01-b07
          speaker: narrator
          text: His sudden disappearance struck the whole country hard, especially because no one knew what had become of him. Even the sorrowful King roused himself after this new loss. Since Santorina vanished, he had cared for almost nothing. He could not even look at Placida without shedding floods of tears for her mother. Now he forced himself to examine the Princess's talents and the way she was being raised. He soon discovered that, besides her natural laziness, she was indulged and spoiled every day as thoroughly as if Lolotte had been her grandmother. He spoke to the Fairy very seriously. Lolotte accepted the rebuke meekly and faithfully promised not to encourage Placida's idleness or indifference again.
        - id: ch01-b08
          speaker: narrator
          text: Placida's troubles began at once. She had to choose her dresses, care for her jewels, and find her own amusements. Rather than make the effort, she wore one old gown all day and avoided appearing in public. Worse still, the King made her attend councils, learn the business of the kingdom, and give an opinion whenever anyone asked. Life became such a burden that she begged Lolotte to carry her away.
        - id: ch01-b09
          speaker: narrator
          text: Lolotte refused firmly at first, but Placida was very pretty and pleaded through her tears. In the end, the Fairy transported her to her own grotto, still tucked comfortably on her favorite couch. This second disappearance plunged the people into despair, and Gridelin became more distracted than ever.
        - id: ch01-b10
          speaker: narrator
          text: Meanwhile, Vivien's horse had carried him to the edge of the large kingdom and could go no farther. The Prince continued on foot, though such slow travel sorely tried him. At last he entered an immense, gloomy forest. He secretly shuddered, chose the likeliest path, and marched on as fast as he could. Night overtook him before he found the way out.
    - id: ch02
      title: Dame Patience
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: For a long while Vivien stumbled through the darkness, doing his best to keep to the path. Just as his strength was nearly gone, he saw a gleam ahead. His spirits rose at once. He felt certain that food and shelter must be close. But the farther he walked toward the light, the farther away it seemed. Sometimes he lost sight of it entirely. He kept following until he finally reached the miserable cottage from which it shone, and by then hunger, fatigue, and delay had made him thoroughly angry.
        - id: ch02-b02
          speaker: narrator
          text: He knocked loudly. An old woman's voice answered, but the door did not open. He pounded harder and demanded entrance, forgetting that he was no longer in his own country.
        - id: ch02-b03
          speaker: patience
          text: You must have patience.
        - id: ch02-b04
          speaker: narrator
          text: She really was coming, only very slowly. First she chased away her cat so it could not escape. Then she noticed that her lamp needed trimming, and after that it needed fresh oil. She trotted back and forth, reminding Vivien now and then to be patient.
        - id: ch02-b05
          speaker: narrator
          text: When he finally entered, he saw a hut so poor that there was not one crumb of food in sight. He said he was dying of hunger and weariness. The old woman quietly told him to be patient and showed him a bundle of straw for a bed.
        - id: ch02-b06
          speaker: vivien
          text: But what am I supposed to eat?
        - id: ch02-b07
          speaker: patience
          text: Wait a little. If you are patient, I will gather peas from the garden. We can shell them slowly, light the fire, cook them thoroughly, and eat them in peace. There is no need to hurry.
        - id: ch02-b08
          speaker: vivien
          text: I will starve before you finish all that!
        - id: ch02-b09
          speaker: patience
          text: Patience, patience. I cannot be hurried. Everything comes at last to the person who waits. Surely you have heard that before.
        - id: ch02-b10
          speaker: narrator
          text: Vivien was furious, but he could do nothing about it.
        - id: ch02-b11
          speaker: patience
          text: Come along, then. Hold the lamp while I pick the peas.
        - id: ch02-b12
          speaker: narrator
          text: The Prince snatched up the lamp so quickly that it went out. There were no easy flames waiting for him. He had to search through the heap of ashes on the hearth, dig out two tiny pieces of glowing charcoal, and coax the lamp alight again. That took a long time. At last they gathered the peas, shelled them, and lit the cooking fire. Then the old woman announced that she would cook fifty-four peas, exactly, and not one more. Vivien told her he was famished. Fifty-four peas could never satisfy him, and surely one or two extra could make no difference. Nothing moved her. He had to count all fifty-four himself. In his hurry he dropped a pea, then another, and each time she made him begin again from the very first so there could be no doubt about the number.
        - id: ch02-b13
          speaker: narrator
          text: When the peas were ready, the old woman brought out scales and a piece of bread to divide. Vivien could bear no more. He seized the whole piece, ate it, and used her own favorite word.
        - id: ch02-b14
          speaker: vivien
          text: Patience!
        - id: ch02-b15
          speaker: patience
          text: You meant that as a joke, but Patience really is my name. One day you will learn more about me.
        - id: ch02-b16
          speaker: narrator
          text: They ate twenty-seven peas apiece. To Vivien's surprise, he wanted nothing else. He slept on the straw as sweetly as he had ever slept in his palace. In the morning, the old woman gave him bread and milk. He was pleased that nothing had to be gathered, counted, or cooked, and afterward he asked who she was.
        - id: ch02-b17
          speaker: patience
          text: I will gladly tell you, though it is a long story.
        - id: ch02-b18
          speaker: vivien
          text: If it is long, I cannot listen to it.
        - id: ch02-b19
          speaker: patience
          text: At your age, you should listen to older people and learn patience.
        - id: ch02-b20
          speaker: vivien
          text: Older people should not take so long to speak. Just tell me what country this is.
        - id: ch02-b21
          speaker: patience
          text: Very well. This is the Forest of the Black Bird. He gives his oracles here.
        - id: ch02-b22
          speaker: vivien
          text: An oracle? I must consult him at once!
        - id: ch02-b23
          speaker: narrator
          text: The word oracle set Vivien on fire. He pulled a handful of gold from his pocket and offered it to the old woman. She would not accept it, so he threw the coins onto her table and flashed out of the cottage. He did not stay long enough even to ask which road led to the Black Bird. He chose the first path he saw and followed it at top speed. Again and again he lost the way, stumbled over stones, or ran straight into a tree. None of that made him regret the cottage behind him. Its slow habits had suited him no better than the patient character of its owner.
    - id: ch03
      title: The Oracle of the Black Bird
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: In time Vivien saw a vast black castle overlooking the forest. He was sure the Oracle lived there. At sunset he reached its outer gate. The moat, drawbridge, gates, walls, and towers were all equally dark. A great bell hung above an inscription warning curious mortals to strike and then submit to whatever followed.
        - id: ch03-b02
          speaker: narrator
          text: Without the smallest hesitation, Vivien snatched up a heavy stone and hammered the bell with all his strength. A deep and terrible note rolled over the castle. The outer gate flew open. The instant he stepped through, it slammed behind him with a thunderous clang. From every tower and battlement, bats rose wheeling and screaming in such numbers that they darkened the entire sky. Almost anyone else would have been terrified by the unearthly sight. Vivien marched stoutly onward until he reached a second gate. It opened to reveal sixty servants, every one hidden from head to foot beneath a long black mantle.
        - id: ch03-b03
          speaker: narrator
          text: They spoke a language he did not know and understood nothing he said. Keeping his thoughts to himself was so aggravating that he actually wished for Dame Patience. His guides led him silently into a splendid hall with an ebony floor, jet-black walls, and black velvet hangings. There was no food. When he gestured that he was hungry, they politely gestured that he must wait.
        - id: ch03-b04
          speaker: narrator
          text: Several hours passed before the sixty hooded figures returned. With great ceremony, and at an almost unbearable pace, they led him to a banquet hall and seated themselves along a long table. Dishes stood down its center. In his usual headlong way, Vivien seized the one before him and tried to pull it close. It was fixed firmly in place. He looked at his gloomy neighbors and saw a long hollow reed before each one. They slowly sucked their portions through the reeds. There was nothing for him to do but imitate them, though every mouthful took an age. After supper, they moved just as slowly back to the ebony hall. There Vivien had to watch one endless game of chess after another. Of all games, he detested chess most. Not until he felt nearly dead from boredom did they ceremoniously conduct him to his sleeping room.
        - id: ch03-b05
          speaker: narrator
          text: Hope of seeing the Oracle woke Vivien very early. His first demand was to be taken before it. The servants gave no answer. Instead they led him to an enormous marble bath, almost flat at one end and very deep at the other, and indicated that he must enter. Vivien was quite willing and prepared to spring straight into the deepest water. Gentle but powerful hands held him back. They allowed him to stand only at the shallow edge, where one inch of water covered his feet. The next day they repeated the ceremony with the water another inch higher. No argument, struggle, or demand changed their plan. For sixty days Vivien lived in complete silence. He was ceremoniously led back and forth, drew every meal through a long reed, watched countless games of the chess he hated, and entered the bath while the water rose inch by inch toward his chin.
        - id: ch03-b06
          speaker: narrator
          text: When the water finally reached his chin, servants in black robes came with large bats perched on their heads. They marched around Vivien in a slow procession, singing a mournful chant, and brought him to an iron temple gate. Another band received him. These servants moved even more slowly and carried ravens on their wrists. The birds' harsh cries echoed through the gloomy place.
        - id: ch03-b07
          speaker: narrator
          text: They held Vivien by both arms, more to restrain him than to honor him, and climbed the temple steps by slow degrees. At the top, they wrapped him in a black robe and made him endure one long ceremony after another. His fierce impatience faded into helpless weariness. He yawned scandalously, but no one noticed.
        - id: ch03-b08
          speaker: narrator
          text: At last the thick curtain before him moved aside. An enormous Black Bird sat on an iron bar that crossed the temple. Every servant knelt and hid his face. The Bird beat its mighty wings three times, then spoke clearly in Vivien's own language.
        - id: ch03-b09
          speaker: black_bird
          text: Prince, your only chance of happiness depends upon that which is most opposed to your own nature.
        - id: ch03-b10
          speaker: narrator
          text: The curtain dropped across the Bird again. The ceremonies were still not finished. At last the temple servants presented Vivien with a raven, which perched on his wrist, and conducted him by slow stages back to the iron gate. There the raven left him. The first band of servants received him, while a large bat fluttered down and settled on his head without being placed there. They returned him to the marble bath. This time he had to begin in the deepest water. Day after day it receded by one inch. Every slow meal, every silent procession, every hated game of chess, and every part of the bathing ritual had to be endured all over again before they would release him.
        - id: ch03-b11
          speaker: narrator
          text: When the second course of bathing was finally over, the servants escorted him to the outer gate. They bowed and took leave with every sign of esteem and politeness. Vivien's response was far less gracious. The gate had barely opened before he took to his heels and fled with all his strength. His only thought was to put as much distance as possible between himself and the dismal place he had entered so rashly. He had suffered all that delay merely to consult a tedious Oracle, and as far as he could tell, it had told him nothing. For perhaps five seconds he reflected on his own foolishness. He even reached the conclusion that now and then, it might be wise to think before he acted.
    - id: ch04
      title: The White Ship and the Green Castle
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Vivien wandered for days, tired and hungry, before he escaped the forest. He came to a broad, swift river and followed it in search of a crossing. At sunrise he saw something dazzlingly white in midstream. It was a beautiful little ship, with its boat tied near him on the bank. He called to the crew, but no one answered. He jumped into the boat and rowed easily, for it was made of white paper and weighed no more than a rose leaf.
        - id: ch04-b02
          speaker: narrator
          text: When Vivien reached the vessel, he discovered that the ship itself was made of white paper. Not a single soul was aboard. In the cabin, however, he found a wonderfully comfortable little bed and a generous supply of good things to eat and drink. He decided to enjoy them until something new happened. His education at Gridelin's court had included navigation, so he knew how to handle a ship. But once he got under way, the river current swept the vessel along so quickly that he was out at sea before he understood his danger. At that moment a wind rose behind him and soon drove him beyond sight of land. Alarmed now, Vivien worked hard to turn the ship and regain the river. Wind and tide were too strong. He remembered how often, from early childhood onward, people had warned him not to meddle with water. That wisdom had come too late. All he could do was wish he had stayed ashore and grow utterly weary of the boat, the sea, and everything connected with either one.
        - id: ch04-b03
          speaker: narrator
          text: Then the ship lay becalmed in the open sea. Vivien grew heartily sick of the vessel, the ocean, and everything connected with them. He even wished himself back at the Black Castle, where at least other beings were alive. Here he was alone, with no idea how to escape his tiresome prison.
        - id: ch04-b04
          speaker: narrator
          text: At last land appeared. Vivien was so eager to reach it that he leaped overboard, hoping to swim. But however far he sprang, the paper ship was beneath his feet before he touched the water. He had to wait until wind and waves carried it into a natural harbor. Great trees grew to the water's edge. The delighted Prince jumped ashore and quickly lost himself in the thick woods.
        - id: ch04-b05
          speaker: narrator
          text: He stopped beside a clear spring. The bushes suddenly thrashed, and a pretty gazelle sprang out, panting and exhausted. It fell at his feet.
        - id: ch04-b06
          speaker: gazelle
          text: Oh, Vivien, save me!
          emotion: fearful
        - id: ch04-b07
          speaker: narrator
          text: Astonished to hear his name, Vivien sprang up and drew his sword just as a large green lion burst from the bushes after the gazelle. He attacked boldly, and a fierce fight began. The green lion was large and had pursued the exhausted creature hard, but Vivien met it without hesitation. The struggle did not last long. A tremendous stroke from the Prince brought his enemy crashing to the earth. As the lion fell, it whistled loudly three times, with such force that the whole forest rang. The sound must have traveled for more than two leagues. Once it had given that signal, the lion seemed to have no further business in the world. It rolled onto its side and died.
        - id: ch04-b08
          speaker: vivien
          text: Are you satisfied now? Since you can speak, tell me at once what this means and how you know my name.
        - id: ch04-b09
          speaker: gazelle
          text: I need a long rest before I can explain. Besides, I doubt you will have time to listen. This is not over. You had better look behind you.
        - id: ch04-b10
          speaker: narrator
          text: Vivien spun around. A huge Giant was striding toward him.
        - id: ch04-b11
          speaker: green_giant
          text: Who made my lion whistle?
          emotion: angry
        - id: ch04-b12
          speaker: vivien
          text: I did, and I promise you he will never whistle again.
        - id: ch04-b13
          speaker: narrator
          text: The Giant howled with grief.
        - id: ch04-b14
          speaker: green_giant
          text: Oh, my poor Tiny! My sweet pet! At least I can avenge your death.
          emotion: sad
        - id: ch04-b15
          speaker: narrator
          text: The Giant rushed at Vivien to avenge his pet. Instead of a sword or club, he brandished an immense serpent that had been coiled around his wrist. Vivien did not lose his coolness. He aimed a mighty sword stroke at the snake. The instant his blade touched it, the serpent turned into a Giant and the Giant turned into a serpent. Then they changed back. They exchanged shapes with such speed that Vivien became completely dizzy, and the bewildering trick happened at least half a dozen times. At last, one fortunate stroke met the serpent in the right form and cut it in half. Vivien snatched up one piece and hurled it with all his force at the Giant's nose. The Giant toppled senseless onto the dead lion. In that instant, a thick black cloud rolled around them and hid everything. When the cloud cleared, Giant, serpent, and lion had all disappeared.
        - id: ch04-b16
          speaker: vivien
          text: You have had time to recover, and there is nothing left to fear. Tell me who you are and what that Giant, lion, and serpent wanted with you. Please be quick.
        - id: ch04-b17
          speaker: gazelle
          text: Gladly, but why hurry? I want you to come with me to the Green Castle. I do not want to walk there. It is far away, and walking is so tiring.
        - id: ch04-b18
          speaker: vivien
          text: Then we must leave now, or I shall leave you here. A young gazelle should manage a short walk. The farther it is, the faster we should go. Still, I promise to walk gently, and you can talk on the way.
        - id: ch04-b19
          speaker: gazelle
          text: It would be better if you carried me. I dislike seeing anyone take trouble, so you may carry me while that snail carries you.
        - id: ch04-b20
          speaker: narrator
          text: She pointed one small hoof at what Vivien had mistaken for a stone. It was an enormous snail.
        - id: ch04-b21
          speaker: vivien
          text: Ride a snail? You must be laughing at me. We would not arrive for a year!
        - id: ch04-b22
          speaker: gazelle
          text: Then do not. I can stay here quite happily. The grass is green, and the water is clear. But in your place, I would follow the advice I was given and ride the snail.
        - id: ch04-b23
          speaker: narrator
          text: Vivien disliked the plan, but he lifted the gazelle and mounted. The snail glided along peacefully and refused to hurry, no matter how often the Prince struck its sides with his heels. The gazelle said she had never found an easier way to travel and was enjoying herself greatly. Vivien thought they would never arrive. At last the Green Castle appeared, and everyone inside ran to watch him dismount from his remarkable steed.
        - id: ch04-b24
          speaker: narrator
          text: At the gazelle's request, Vivien set her gently on the steps. She changed into a charming Princess. It was his cousin Placida, greeting him with her usual tranquil sweetness. Overjoyed, he followed her inside, eager to hear what had brought her there. Once again he had to wait. The people of the Green Lands had heard that the Giant was dead, and they came to offer his kingdom to the victor. Vivien endured their long speeches, cutting them as short as politeness allowed, and finally rejoined Placida.
    - id: ch05
      title: Placida's Adventures
      blocks:
        - id: ch05-b01
          speaker: placida
          text: After you left, they tried to teach me to govern, and it wearied me terribly. I begged Lolotte to take me away. She did, though she hated to give in. I spent lovely days on my couch in her grotto, under green light like a beech wood in spring, listening to bees and falling water. Then Lolotte went to an assembly of Fairies. She returned in distress. She had been scolded for indulging me and ordered to give me to Mirlifiche, who was already managing you and had been praised for it.
        - id: ch05-b02
          speaker: vivien
          text: Managing me? If Mirlifiche caused my adventures, that is a fine claim! Go on, cousin. I will tell you what happened to me afterward, and you may judge.
        - id: ch05-b03
          speaker: placida
          text: Lolotte's crying saddened me at first, but grief was too troublesome, so I soon became calm. Mirlifiche arrived on a huge unicorn and ordered Lolotte to bring me out. Lolotte wept harder and kissed me twelve times, but she had to obey. They lifted me onto the unicorn behind Mirlifiche.
        - id: ch05-b04
          speaker: mirlifiche
          text: Hold tight, little girl, unless you want to break your neck.
        - id: ch05-b05
          speaker: placida
          text: I had to cling with all my strength. The dreadful animal trotted so violently that I could hardly breathe. We stopped at a large farm, where a farmer and his wife helped us down. I knew they were really a King and Queen whom the Fairies were punishing for ignorance and laziness. Though I was exhausted, Mirlifiche made me feed the unicorn first.
        - id: ch05-b06
          speaker: placida
          text: Feeding the unicorn meant climbing a long ladder into the hayloft. I had to bring down twenty-four handfuls of hay, one after another. Never in my life had I faced such a weary task. Even remembering it makes me shudder. And carrying the hay down was not enough. I then carried all twenty-four handfuls across to the stable. By that time supper had begun, but instead of resting, I had to wait upon everyone else. I truly believed they would finally let me go peacefully to my little bed. Not at all. My bed was in confusion, so first I had to make it. Then I made Mirlifiche's bed, tucked her in, drew the curtains around her, and performed a dozen small services I had never been expected to do. When all that toil had exhausted me, I was at last free. But I had never undressed myself and did not know where to begin, so I lay down exactly as I was. Just as I was falling into a sweet sleep, Mirlifiche discovered me and made me get up again. Even then I escaped her watchfulness and removed only my outer robe. Between ourselves, I have often found that disobedience answers very well. It brings a scolding, certainly, but by then one has saved some trouble.
        - id: ch05-b07
          speaker: placida
          text: At dawn she woke me and sent me repeatedly to ask how the unicorn had slept and how much hay it had eaten, then to learn the time and the weather. I moved so slowly and did so badly that before leaving she called the King and Queen.
        - id: ch05-b08
          speaker: mirlifiche
          text: You have pleased me more this year. Keep improving the farm if you hope to regain your kingdom. Take charge of this Princess too. Teach her to be useful, so that when I return, I find her faults cured. If they are not...
        - id: ch05-b09
          speaker: placida
          text: She left the threat unfinished, gave them a meaningful look, mounted my enemy the unicorn, and vanished. The King and Queen asked what I could do.
        - id: ch05-b10
          speaker: placida
          text: Nothing at all, I assure you.
        - id: ch05-b11
          speaker: placida
          text: They suggested one task after another. At last I convinced them that only doing nothing suited me. If they wished to be kind, they should let me sleep and stop troubling me about work. To my joy, they agreed, and the Queen even carried my meals upstairs. But early next morning she came to my bed.
        - id: ch05-b12
          speaker: farmer_queen
          text: My pretty child, I am afraid you must get up today. I know how delightful perfect idleness is. When my husband and I ruled, we did nothing all day, and I hope those happy times soon return. But they have not returned yet, and the Fairy may punish us worse if we disobey. Please hurry down. I saved some delicious cream for you.
        - id: ch05-b13
          speaker: placida
          text: It was tiresome, but I went. The moment breakfast ended, they began asking what I would do.
        - id: ch05-b14
          speaker: placida
          text: Nothing at all, if you please, madam.
        - id: ch05-b15
          speaker: placida
          text: The Queen gave me a spindle and four pounds of hemp on a distaff, then sent me to mind the sheep. She promised it was pleasant and I could rest. I unwillingly set out, found a shady bank, and lay on the grass with the hemp for my pillow. I slept as if sheep did not exist. They wandered as if no shepherdess existed, invading fields and eating every forbidden thing they found.
        - id: ch05-b16
          speaker: placida
          text: The sheep wandered wherever they pleased, as though there were no shepherdess in the world. They pushed into field after field and browsed on every forbidden delicacy they could find. The peasants saw the havoc and raised a great clamor. At last the noise reached the King and Queen, who ran from the farm, understood what had happened, and hurried to collect their flock. They had good reason to hurry, since they were forced to pay for all the damage. As for me, I remained stretched on the bank and watched them run. I was much too comfortable to move. I might be lying there still if they had not climbed up to me, panting and breathless, and made me rise and follow. They reproached me bitterly all the way home. I hardly need tell you that they never entrusted the flock to me again.
        - id: ch05-b17
          speaker: placida
          text: Every task ended the same way. I spoiled it and provoked even patient people. At last I feared the Queen might have to beat me, so I ran away. I found the King's fishing boat tied beside the river, stepped in, and floated downstream. Its gentle motion soothed me. Even when the Queen ran along the bank, I did not trouble myself.
        - id: ch05-b18
          speaker: farmer_queen
          text: My boat! Husband, catch the little Princess! She is running away with my boat!
        - id: ch05-b19
          speaker: placida
          text: The current carried me beyond her voice. I dreamed to the ripple of water and whisper of trees until the boat stopped beside a green meadow at sunrise. Strange little houses stood far away. I was hungry and walked toward them. The air seemed full of shining objects hanging from nothing.
        - id: ch05-b20
          speaker: placida
          text: As I drew nearer, I saw a silk cord hanging all the way to the ground. I pulled it for no better reason than that it hung close to my hand. At once, the whole meadow filled with the musical chiming of silver bells. The sound was so pretty that I sat down to listen. I watched the bells swing and shine in the sunbeams. Before their music ended, a great flight of birds swept in. One bird perched upon each bell and added its own beautiful song to the concert. When bells and birds finally fell silent, I looked up. A tall and stately lady was coming toward me, surrounded and followed by a vast flock containing every sort of bird.
        - id: ch05-b21
          speaker: bird_fairy
          text: Who are you, little girl, and how dare you enter a place where I allow no mortal to live? Mortals disturb my birds. If you have some useful skill, perhaps I could tolerate you.
        - id: ch05-b22
          speaker: placida
          text: Madam, I promise I shall not frighten them. Please, give me something to eat.
        - id: ch05-b23
          speaker: bird_fairy
          text: I will feed you before sending you where you deserve to go.
        - id: ch05-b24
          speaker: placida
          text: Six jays who served as her pages fetched biscuits, and other birds brought ripe fruit. It was a delicious breakfast, though they served it too quickly. Being hurried is so unpleasant. I said I would enjoy staying in that charming country.
        - id: ch05-b25
          speaker: bird_fairy
          text: Keep you here? You? What possible use would you be where everyone is awake and busy? No. You have received all the hospitality I mean to give.
        - id: ch05-b26
          speaker: placida
          text: She pulled the silk rope. Instead of sweet bells, a dreadful clanging terrified me. A huge Black Bird landed at her feet.
        - id: ch05-b27
          speaker: black_bird
          text: What do you want of me, sister?
        - id: ch05-b28
          speaker: bird_fairy
          text: Take this Princess to our cousin, the Giant of the Green Castle, at once. Ask him to make her work day and night on his beautiful tapestry.
        - id: ch05-b29
          speaker: placida
          text: The Bird seized me despite my cries and flew away at tremendous speed.
        - id: ch05-b30
          speaker: vivien
          text: You must mean as slowly as possible! I know that dreadful Bird and how long every part of his business takes.
        - id: ch05-b31
          speaker: placida
          text: Believe what you like. I cannot bear an argument. Perhaps it was another bird. This one flew very fast and set me gently inside this castle. He handed me to the Giant, delivered the message, and left.
        - id: ch05-b32
          speaker: green_giant
          text: So, you are an idler. We shall teach you to work. You are not the first person we have cured of laziness. Look how busy my guests are.
        - id: ch05-b33
          speaker: placida
          text: A gallery ran around the hall, filled with tapestry frames, wool, spindles, and patterns. A dozen people worked at every frame. The sight was so terrible that I fainted. When I recovered, they asked what I could do. I told them, with every wish to be believed, that I could do nothing.
        - id: ch05-b34
          speaker: green_giant
          text: Then you must learn something. There is enough work in this world for everyone.
        - id: ch05-b35
          speaker: placida
          text: They were weaving the Fairies' favorite stories. They tried to teach me, but I fell from the first class to lower ones and could not learn even the simplest stitch. Punishment did nothing. The Giant showed me his menagerie, filled entirely with children who refused to work, but even that failed. They reduced me to drawing water for the dyes. I did it so slowly that this morning the Giant lost his temper and turned me into a gazelle.
        - id: ch05-b36
          speaker: placida
          text: He was putting me in the menagerie when I saw a dog. Terror sent me racing through the outer court. Afraid of losing me, the Giant ordered his green lion to bring me back at any cost. I would have let it catch or eat me rather than run farther, if I had not met you beside the spring. How delightful it is to sit quietly again. I was so tired of trying to learn things.
    - id: ch06
      title: The Fairies' Final Test
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Vivien replied that he had been kept much too still and had not enjoyed it either. In one breathless rush he told Placida about Dame Patience, the Oracle, and the paper ship. Then the cousins went hand in hand through the castle, freeing the tapestry workers and opening the cages in the menagerie. The Green Giant's death had already restored every captive Prince and Princess to a human form.
        - id: ch06-b02
          speaker: narrator
          text: The prisoners were deeply grateful. Placida begged them never to sew another stitch as long as they lived. They promptly built a great fire in the courtyard and solemnly burned every embroidery frame and spinning wheel. Placida gave them magnificent presents, or rather, she sat nearby while Vivien gave the presents for her. The Green Castle filled with celebration, and everyone tried to please the cousins.
        - id: ch06-b03
          speaker: narrator
          text: Good intentions were not enough. Vivien and Placida never wanted things done in the same way. Their servants would obey Vivien's orders very, very slowly, then dash off at lightning speed to do something Placida had never wanted at all. The confusion vexed both cousins. Little by little, though, they began consulting and comforting each other. They grew so fond of one another that Vivien learned patience for Placida's sake, while Placida made unheard-of efforts for his.
        - id: ch06-b04
          speaker: narrator
          text: The Fairies had watched with interest. They decided to test whether this improvement would last and whether the cousins truly loved each other. They made Placida appear violently feverish. Vivien became dull and weak. Each was desperately anxious about the other. When they were apart, Mirlifiche appeared first to Placida.
        - id: ch06-b05
          speaker: mirlifiche
          text: I have just seen Prince Vivien. He looked very ill.
        - id: ch06-b06
          speaker: placida
          text: Alas, he is! Cure him, and you may send me back to the farm or bring the Green Giant to life. I will obey you in everything.
          emotion: fearful
        - id: ch06-b07
          speaker: mirlifiche
          text: If you truly want him well, catch the Trotting Mouse and the Chaffinch-on-the-Wing, then bring them to me. Remember, there is no time to lose.
        - id: ch06-b08
          speaker: narrator
          text: Before the Fairy had quite finished, Placida rushed headlong through the castle gate. Mirlifiche watched until she vanished, gave a little chuckle, and went to Vivien. He earnestly offered to return to the Black Castle or the paper ship if only Placida could be saved. Mirlifiche looked grave and agreed that the Princess was in danger.
        - id: ch06-b09
          speaker: mirlifiche
          text: Find the Rosy Mole and give it to Placida. Then she will recover.
        - id: ch06-b10
          speaker: narrator
          text: Vivien hurried out, choosing exactly the opposite direction from Placida. Night and day, the devoted pair searched. Placida ran endlessly through the woods, always listening and chasing the two creatures that escaped her again and again. Yet she never stopped.
        - id: ch06-b11
          speaker: narrator
          text: Vivien crossed meadow after meadow, staring at the ground for the smallest movement. He had to creep on tiptoe, hardly breathing. Sometimes he stood as still as a statue for hours. Every mole he caught was ordinary and black, never rosy. Still, he did not grow impatient. Each time, he calmly began the tedious search again. Love had worked its ordinary miracle on them both.
        - id: ch06-b12
          speaker: narrator
          text: Neither thought of anything but the quest, and neither wondered what country they had entered. After a long and weary chase, each finally succeeded. At the same instant, they cried out.
        - id: ch06-b13
          speakers: [vivien, placida]
          ensemble: duo
          text: At last I have saved my beloved!
          emotion: happy
        - id: ch06-b14
          speaker: narrator
          text: They recognized each other's voice, looked up, and ran together in wild joy. For one perfect moment, surprise left them silent as they gazed into each other's eyes. Then King Gridelin came upon them. Without knowing it, they had wandered back into his kingdom. He knew them at once and welcomed them joyfully.
        - id: ch06-b15
          speaker: narrator
          text: When they looked again for the Rosy Mole, the Chaffinch-on-the-Wing, and the Trotting Mouse, the creatures were gone. In their place stood a beautiful lady they did not know, the Black Bird, and the Green Giant. Gridelin gave a cry of joy and embraced the lady. She was Santorina, his long-lost Queen, who had been held in Fairyland.
        - id: ch06-b16
          speaker: narrator
          text: The Black Bird and Green Giant returned to their own shapes, for both were enchanters. Lolotte and Mirlifiche flew down in their chariots. Everyone kissed and congratulated everyone else. Each had regained someone dearly loved, including the enchanters, who were very fond of their natural forms.
        - id: ch06-b17
          speaker: narrator
          text: They all went to the palace, and Prince Vivien married Princess Placida at once in the most splendid wedding imaginable. After everything they had endured, Gridelin and Santorina no longer wished to rule. They retired happily to a peaceful place and left the kingdom to the young couple.
        - id: ch06-b18
          speaker: narrator
          text: Their subjects loved them, and all their lives, Vivien and Placida found their greatest happiness in making other people happy.
