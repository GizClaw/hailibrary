  chapters:
    - id: ch01
      title: Lost in the Wood
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Never say that a poor tailor cannot rise in the world, or even win the highest honor. He only needs to set about things in the right way. Of course, the most important part is succeeding.
        - id: ch01-b02
          speaker: narrator
          text: Once, a clever and energetic young tailor set out on his travels. His road led into a wood, and before long he had lost his way. Night fell. He might have made a soft bed of moss, but the thought of wild beasts would not let him rest. In the end, he decided to spend the night in a tree.
        - id: ch01-b03
          speaker: narrator
          text: He found a tall oak and climbed right to the top. The wind blew so fiercely among the branches that he was deeply thankful for the heavy smoothing iron in his pocket. Without its weight, he feared he might be blown clean out of the tree.
        - id: ch01-b04
          speaker: narrator
          text: He passed several fearful, trembling hours up there. Then he noticed a light in the distance. Perhaps it came from a house where he could find better shelter. He climbed down with care and followed it.
        - id: ch01-b05
          speaker: narrator
          text: The light brought him to a little hut woven from reeds and rushes. He knocked boldly. The door opened, and in the glow from within he saw a gray-haired old man wearing a coat of brightly colored patches.
        - id: ch01-b06
          speaker: old_man
          text: Who are you? What do you want?
        - id: ch01-b07
          speaker: tailor
          text: I am a poor tailor. Night caught me in the forest. Please let me shelter in your hut until morning.
        - id: ch01-b08
          speaker: old_man
          text: Go away. I want nothing to do with wandering tramps. Find somewhere else.
        - id: ch01-b09
          speaker: narrator
          text: With that, the old man tried to slip back inside, but the tailor caught hold of the tails of his coat and would not let go. He pleaded so earnestly that the old fellow was touched and gave in. He was not nearly as cross as he seemed. He let the tailor enter, gave him enough to eat, and showed him a comfortable bed in one corner of the room.
        - id: ch01-b10
          speaker: narrator
          text: The weary young man needed no rocking. He slept soundly until early morning, when a tremendous noise woke him. Screams and shouts rang through the hut's thin walls. With courage he had not known the night before, the tailor sprang up, dressed as fast as he could, and rushed outside.
        - id: ch01-b11
          speaker: narrator
          text: A huge black bull and a magnificent stag were locked in a terrible fight. They charged each other so furiously that the ground seemed to tremble and their cries filled the air. For a long while, no one could tell which would win. At last, the stag drove its antlers deep into the bull. The bull fell with a dreadful roar, and a few more blows finished the battle.
    - id: ch02
      title: The Door in the Rock
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The tailor had watched in amazement, and he still stood frozen in place. Suddenly, the stag bounded toward him. Before he could escape, it caught him up on its great antlers and galloped away.
        - id: ch02-b02
          speaker: narrator
          text: The stag set off at full gallop. They flew over hedges and ditches, up hill and down dale, through woods and water. The tailor could only grip the stag's horns with both hands and leave the rest to fate. It felt as though he were flying through the air. At last, the animal stopped beside a steep rock and gently lowered him to the ground.
        - id: ch02-b03
          speaker: narrator
          text: He felt more dead than alive and needed a moment to gather his scattered senses. Once he had recovered a little, the stag struck a hidden door in the rock. The blow sent it flying open. Flames rushed out, followed by such thick clouds of steam that even the stag had to turn its eyes away.
        - id: ch02-b04
          speaker: narrator
          text: The tailor had no idea what to do. He longed to escape that dreadful wilderness and find his way back to other people, but he could not tell which way to turn. While he hesitated, a voice called from inside the rock.
        - id: ch02-b05
          speaker: rock_voice
          text: Come in without fear. No harm will come to you.
        - id: ch02-b06
          speaker: narrator
          text: Still he lingered. Then some mysterious power seemed to draw him forward. He passed through the doorway and entered a vast hall. Its ceiling, walls, and floor were covered in polished tiles carved with strange figures he did not know.
        - id: ch02-b07
          speaker: narrator
          text: He stared all around in wonder. Just as he was about to leave again, the same voice spoke.
        - id: ch02-b08
          speaker: rock_voice
          text: Step onto the stone in the center of the hall, and good fortune will follow you.
        - id: ch02-b09
          speaker: narrator
          text: By now the tailor's courage had grown, so he obeyed at once. The moment his foot touched the stone, it began to carry him gently down into the depths below.
        - id: ch02-b10
          speaker: narrator
          text: When he reached solid ground, he found another hall about the same size as the first, but filled with far stranger sights and many more things to admire. Niches lined the walls. In each one stood a glass vessel holding a brightly colored liquid or a curl of bluish smoke. On the floor, two large crystal boxes faced each other. They caught his attention at once, and he went straight toward them.
        - id: ch02-b11
          speaker: narrator
          text: He approached the first box. Inside stood a perfect little castle, surrounded by tiny farms, barns, stables, and many other buildings. Everything was so small and so beautifully made that it seemed to be the work of a master. He might have gazed much longer, but the voice told him to turn and look at the crystal coffin behind him.
        - id: ch02-b12
          speaker: narrator
          text: A maiden of surpassing beauty lay inside. She looked asleep. Her long fair hair wrapped around her like a costly cloak. Her eyes were closed, yet color glowed in her face, and a ribbon rose and fell with every breath. She was alive.
        - id: ch02-b13
          speaker: narrator
          text: The tailor watched her, his heart beating hard. All at once, she opened her eyes and started in joyful surprise.
        - id: ch02-b14
          speaker: maiden
          text: Great heavens, my rescue is near! Quickly, help me out of this prison. Push back the bolt, and I will be free.
          emotion: surprised
        - id: ch02-b15
          speaker: narrator
          text: The tailor did as she asked. She pushed back the crystal lid, stepped out, and hurried to a corner of the hall, where she wrapped herself in a large cloak. Then she sat upon a stone and called the young man closer. She gave him an affectionate kiss before she spoke.
        - id: ch02-b16
          speaker: maiden
          text: You are the deliverer I have waited for so long. Kind heaven has led you to me and ended all my suffering. You are meant to be my husband. You will be loved, and you will have riches and power of every kind. We shall spend the rest of our lives in peace and happiness. Now sit beside me and hear my story.
    - id: ch03
      title: The Stranger at the Castle
      blocks:
        - id: ch03-b01
          speaker: maiden
          text: I am the daughter of a wealthy nobleman. My parents died when I was very young, so they left me in the care of my eldest brother. He looked after me faithfully and saw that I was well educated. We loved each other dearly. Our interests and tastes were so much alike that we decided neither of us would marry. We meant to spend our whole lives together.
        - id: ch03-b02
          speaker: maiden
          text: Our home was never lonely. Friends and neighbors visited often, and our doors stood open to them all. Then one evening, a stranger rode up to the castle. He asked to stay the night because he could not reach the nearest town before dark. We welcomed him readily and gave him the hospitality he asked for.
        - id: ch03-b03
          speaker: maiden
          text: At supper, he entertained us with pleasant conversation and amusing stories. My brother liked him so much that he urged him to remain for a few days. The stranger hesitated at first, then agreed.
        - id: ch03-b04
          speaker: maiden
          text: We stayed late at the table. While my brother showed our guest to his room, I hurried to my own chamber. I was very tired and wanted nothing but sleep. I had barely dozed off when soft, beautiful music woke me.
        - id: ch03-b05
          speaker: maiden
          text: I wondered where it came from and was about to call the maid who slept in the next room. But then a terrible weight pressed down on my chest. All my strength left me. I could not make the smallest sound.
        - id: ch03-b06
          speaker: maiden
          text: By the light of my night lamp, I saw the stranger enter, though both doors had been securely locked. He came close and said his magic had made the music wake me. The same magic had carried him through every bolt and bar so that he could offer me his hand and his heart.
        - id: ch03-b07
          speaker: maiden
          text: His magic filled me with such disgust that I would not even lower myself to answer. He stood there without moving for a long time, waiting and hoping I would accept him. When I remained silent, he grew angry. He swore that he would find a way to punish my pride, and then he left my room in a rage.
          emotion: disgusted
        - id: ch03-b08
          speaker: maiden
          text: I spent the night in terrible distress and slept only a little near morning. As soon as I woke, I jumped up and hurried to tell my brother everything. But he had already left his room. His servant said he had gone hunting at daybreak with the stranger.
        - id: ch03-b09
          speaker: maiden
          text: I feared something was wrong. I dressed in haste, ordered my palfrey saddled, and galloped toward the forest with only one servant beside me. I did not stop. Before long, I saw the stranger coming toward us, leading a magnificent stag. The stag's great eyes were overflowing with tears.
        - id: ch03-b10
          speaker: maiden
          text: I demanded to know where he had left my brother and how he had come by that stag. He only laughed. I flew into a rage, drew a pistol, and fired. The bullet bounced from his chest and struck my horse in the forehead. I fell to the ground. Then the stranger muttered a few words, and I lost my senses.
          emotion: angry
    - id: ch04
      title: The Enchantment
      blocks:
        - id: ch04-b01
          speaker: maiden
          text: When I awoke, I was lying in this crystal coffin, deep in the underground vault. The magician appeared again. He told me he had turned my brother into a stag. He had made our castle and all its defenses tiny and locked them in a glass box.
        - id: ch04-b02
          speaker: maiden
          text: He had changed everyone in our household into different vapors and trapped them in glass vessels. If I would only give in to him, he said, he could open the vessels with ease and restore them all to their proper forms.
        - id: ch04-b03
          speaker: maiden
          text: I would not say one word more than I had said in my chamber. The magician vanished and left me alone in this prison. Before long, a deep sleep came over me.
        - id: ch04-b04
          speaker: maiden
          text: Many dreams passed through my mind, but one gave me hope. It showed me a young man who would come and set me free. Today, when I opened my eyes, I knew you at once. My dream had come true.
          emotion: happy
        - id: ch04-b05
          speaker: maiden
          text: Now help me finish what the vision showed me. First, we must put the glass box that holds my castle on this large stone.
        - id: ch04-b06
          speaker: narrator
          text: Together they placed the box on the stone. It rose softly through the air, carrying them back to the upper hall. From there, they easily bore the box outside.
        - id: ch04-b07
          speaker: narrator
          text: The lady lifted the lid. Before their eyes, the castle began to grow. The houses and farmyards spread outward beside it, larger and larger, until every building had returned to its true size.
        - id: ch04-b08
          speaker: narrator
          text: The young couple went down again on the moving stone. One by one, they carried up every glass vessel filled with smoke.
    - id: ch05
      title: The Castle Restored
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: As soon as they pulled out the stoppers, blue vapors streamed from the vessels. The clouds took shape and became living people. With joy, the lady recognized her many servants and attendants among them.
        - id: ch05-b02
          speaker: narrator
          text: Then her happiness was complete. Her brother came out of the forest in his own shape once more. It was he, while trapped in the form of the stag, who had killed the magician in the form of the black bull.
        - id: ch05-b03
          speaker: narrator
          text: That very day, just as she had promised, the nobleman's daughter gave her hand in marriage to the happy young tailor.
