audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and attentive fairy-tale storytelling
        timbre: clear and gently resonant
        pace: measured
        pitch: medium
    tailor:
      display_name: The Young Tailor
      tts:
        delivery: earnest, lively, and courageous
        timbre: bright and clear
        pace: natural
        pitch: medium-high
    old_man:
      display_name: The Old Man
      tts:
        delivery: gruff on the surface but quietly kind
        timbre: dry and weathered
        pace: unhurried
        pitch: low
    rock_voice:
      display_name: The Voice in the Rock
      tts:
        delivery: mysterious, steady, and commanding
        timbre: resonant and distant
        pace: deliberate
        pitch: medium-low
