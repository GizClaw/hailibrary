audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，像编书人面对孩子娓娓而谈，幽默处轻巧含笑
        timbre: 温暖清朗
        pace: 舒缓而有自然起伏
        pitch: 中音
    tailor:
      display_name: 小裁缝
      tts:
        delivery: 年轻爽朗，害怕时声音发紧，鼓起勇气后利落真诚
        timbre: 明亮清澈
        pace: 适中偏快
        pitch: 中高音
    old_man:
      display_name: 灰发老人
      tts:
        delivery: 表面粗鲁不耐烦，话音里藏着并不冷硬的心肠
        timbre: 苍老粗哑
        pace: 稍慢
        pitch: 低音
    mysterious_voice:
      display_name: 神秘声音
      tts:
        delivery: 沉静明确，带着不可抗拒的召唤感
        timbre: 空灵清晰
        pace: 舒缓
        pitch: 中音
    maiden:
      display_name: 贵族姑娘
      tts:
        delivery: 高贵真挚，获救时急切欣喜，讲述苦难时克制而坚定
        timbre: 年轻柔亮
        pace: 适中
        pitch: 中高音
  chapters:
    - id: ch01
      title: 林中小屋
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            谁说穷裁缝不能出人头地，甚至赢得极高的荣耀？只要找对做事的路子，当然，还得真能把事情办成。
        - id: ch01-b02
          speaker: narrator
          text: >-
            从前，有个聪明勤快的年轻裁缝出门游历。他走进一片树林，不认识路，很快便迷了方向。天渐渐黑下来，他只好找地方过夜。柔软的苔藓本能铺成舒服的床，可他害怕野兽，怎么也放不下心，最后决定睡到树上去。
        - id: ch01-b03
          speaker: narrator
          text: >-
            他挑中一棵高大的橡树，一直爬到树顶。树梢上的风刮得那么猛，他万分庆幸口袋里装着沉甸甸的熨斗。若没有那份重量压着，自己没准早被风吹走了。
        - id: ch01-b04
          speaker: narrator
          text: >-
            他提心吊胆地熬了大半夜，忽然瞧见不远处有一点灯光。那里也许有人家，总比树顶更能遮风。裁缝小心爬下树，循着灯光走到一间小屋前。屋子是用芦苇和灯芯草编成的。他壮着胆子敲门，门开以后，屋里的光照出一个满头灰发的老人。老人穿着一件缀满鲜艳补丁的外套。
        - id: ch01-b05
          speaker: old_man
          text: >-
            你是什么人？跑到这里来干什么？
        - id: ch01-b06
          speaker: tailor
          text: >-
            我是个穷裁缝，天黑以后迷失在树林里了。求您让我在小屋里躲一夜吧，我明早就走。
        - id: ch01-b07
          speaker: old_man
          text: >-
            走开！我不收留四处游荡的人。你上别处去。
        - id: ch01-b08
          speaker: narrator
          text: >-
            老人说完便想缩回屋里。裁缝连忙揪住他的衣襟，再三苦求。其实，老人并不像表面那么凶。他终于动了心，把年轻人放进屋，给他拿了些吃的，又领他看了屋角那张挺不错的床。
        - id: ch01-b09
          speaker: narrator
          text: >-
            裁缝累坏了，根本不用人哄，躺下便沉沉睡去。

    - id: ch02
      title: 雄鹿的引路
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            第二天一早，一阵惊天动地的响声把裁缝猛然惊醒。尖厉的嘶叫和吼声穿过小屋薄薄的墙壁。他不知从哪里生出一股勇气，跳下床，飞快穿好衣裳，冲了出去。
        - id: ch02-b02
          speaker: narrator
          text: >-
            屋外，一头硕大的黑公牛正在同一只高大健壮的雄鹿拼死搏斗。它们一次又一次凶猛地撞向对方，大地像在脚下发抖，四周全是吼叫声。谁也看不出哪一边会赢。最后，雄鹿使尽全力，把角深深刺进公牛的身体。公牛发出一声可怕的怒吼，倒在地上。雄鹿又撞了几下，终于杀死了它。
        - id: ch02-b03
          speaker: narrator
          text: >-
            裁缝看得目瞪口呆，还愣在那里。雄鹿一下跃到他跟前，不等他逃走，就用巨大的鹿角把他挑了起来。它驮着裁缝全速飞奔，越过篱笆，跨过沟渠，翻过山谷，穿过树林和水流。裁缝只能双手死死抱住鹿角，把命运全交出去。他觉得自己像在空中飞一样。
        - id: ch02-b04
          speaker: narrator
          text: >-
            雄鹿终于停在一面陡峭的岩壁前，轻轻把裁缝放到地上。年轻人惊魂未定，站了好一会儿才找回神来。就在这时，雄鹿猛地撞向岩壁上的一扇门，门竟然开了。火焰从里面蹿出来，滚滚热汽紧随其后，连雄鹿也不得不转开眼睛。
        - id: ch02-b05
          speaker: narrator
          text: >-
            裁缝站在这片可怕的荒野里，完全不知所措。他不知道该往哪边逃，更不知道怎样才能回到人烟之中。忽然，岩石里面传出了声音。
        - id: ch02-b06
          speaker: mysterious_voice
          text: >-
            放心进来吧。这里不会有人伤害你。
        - id: ch02-b07
          speaker: narrator
          text: >-
            裁缝还是迟迟不敢迈步，可仿佛有一股看不见的力量推着他。他穿过门，走进一座宽阔的大厅。天花板、墙壁和地面都铺着光滑的石板，每一块上面都刻着陌生的图案。他惊奇地四下打量，正准备退出去，那个声音又响了起来。
        - id: ch02-b08
          speaker: mysterious_voice
          text: >-
            踩到大厅中央那块石头上。好运会来到你身边。
        - id: ch02-b09
          speaker: narrator
          text: >-
            这一路走来，裁缝的胆子已经大了。他马上踩上石头，石头便托着他，缓缓沉向地下。

    - id: ch03
      title: 地下的水晶棺材
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            双脚重新踏上坚实的地面时，裁缝发现下面也有一座大厅，大小同上面那座差不多，奇妙的东西却更多。四周的墙上凿着不少壁龛，每个里面都有玻璃瓶。有的瓶中盛着颜色鲜亮的液体，有的困着淡蓝色的烟雾。地面上还面对面摆着两只巨大的水晶箱，立刻吸引了他的目光。
        - id: ch03-b02
          speaker: narrator
          text: >-
            他走到第一只箱子前。里面竟有一座缩得极小的城堡，四周还有农庄、谷仓、马厩和许多房舍。每样东西都小得出奇，每个地方又做得精美细致，仿佛出自技艺最高明的工匠。他原本还想多看一会儿，那个声音却叫他转过身，去瞧对面的水晶棺材。
        - id: ch03-b03
          speaker: narrator
          text: >-
            棺材里躺着一位美貌绝伦的姑娘，裁缝惊讶得说不出话。她仿佛只是在安睡。金色长发披裹着全身，像一件名贵的斗篷。她闭着眼睛，脸色却明艳红润。胸前的丝带随着呼吸一起一伏，分明还活着。
        - id: ch03-b04
          speaker: narrator
          text: >-
            裁缝望着姑娘，心跳得越来越快。就在这时，她忽然睁开双眼，又惊又喜地坐起身来。
        - id: ch03-b05
          speaker: maiden
          text: >-
            天哪，救我的人终于来了！快帮我出去。只要推开棺材上的门闩，我就自由了。
          emotion: happy
        - id: ch03-b06
          speaker: narrator
          text: >-
            裁缝立刻推开门闩。姑娘掀开水晶棺盖，跨了出来，赶到大厅一角，用一件宽大的斗篷裹住身体。随后，她在石头上坐下，请年轻人走近，还亲昵地吻了吻他。
        - id: ch03-b07
          speaker: maiden
          text: >-
            我盼望已久的救命恩人，是仁慈的上天把你带到我身边，让我的苦难终于结束。你命中注定要做我的丈夫。我会爱你，也会让你拥有数不尽的财富和权势。今后的日子，你将过得平安又幸福。请坐下，听我讲讲自己为什么会被关在这里。

    - id: ch04
      title: 姑娘的遭遇
      blocks:
        - id: ch04-b01
          speaker: maiden
          text: >-
            我是一位富有贵族的女儿。父母在我很小的时候便去世了，他们把我托付给大哥。大哥尽心教养我，我们兄妹感情很深，脾气和喜好也十分相投。我们约好谁都不结婚，就这样相伴一生。
        - id: ch04-b02
          speaker: maiden
          text: >-
            家里总有客人。亲朋邻里常来拜访，我们也一向敞开大门招待他们。一天傍晚，一个陌生人骑马来到城堡，请求住上一夜，因为他来不及在天黑前赶到最近的城镇。我们爽快地答应了。晚餐时，他谈吐风趣，还讲了不少逗人的轶事。大哥很喜欢他，极力请他再住两天。陌生人迟疑片刻，还是留了下来。
        - id: ch04-b03
          speaker: maiden
          text: >-
            那天散席很晚。大哥领客人去他的房间，我困得厉害，也赶紧回房睡觉。可我才刚刚入睡，一阵轻柔悦耳的音乐便把我唤醒了。我不知道声音从哪里来，正想叫睡在隔壁的女仆，胸口却像压上了沉重的东西。我全身动弹不得，连一点声音也发不出。
        - id: ch04-b04
          speaker: maiden
          text: >-
            更可怕的是，借着夜灯的光，我看见那个陌生人走进房间。两道门明明都锁得牢牢的。他来到床边，说自己用魔法奏出音乐，把我唤醒，又穿过所有门闩和锁链，要把他的手和真心都献给我。我厌恶他的魔法，根本不屑回答。他一动不动地等了很久，大概还盼着我答应。可我始终沉默。他恼羞成怒，说一定会想办法惩罚我的傲慢，接着怒气冲冲地走了。
        - id: ch04-b05
          speaker: maiden
          text: >-
            那一夜，我心里乱极了，直到天快亮才迷迷糊糊睡了一会儿。醒来后，我马上去找大哥，要把一切都告诉他，可他已经不在房里。仆人说，大哥天一亮就跟那个陌生人打猎去了。
        - id: ch04-b06
          speaker: maiden
          text: >-
            我顿时有了不祥的预感。我赶紧穿好衣服，命人备好小马，只带一个仆人，便朝树林飞奔。我一路没停，很快就看见那个陌生人迎面走来，手里还牵着一只漂亮的雄鹿。那只鹿的大眼睛里满是泪水。
        - id: ch04-b07
          speaker: maiden
          text: >-
            我问他把大哥留在了什么地方，又问那只雄鹿是从哪里来的。他不回答，反而放声大笑。我气得拔出手枪，朝他开了一枪。谁知子弹从他胸前弹回来，正中我的马的额头。我从马背摔到地上。陌生人低声念了几句话，我便什么都不知道了。
        - id: ch04-b08
          speaker: maiden
          text: >-
            等我醒来，已经躺在这座地下密室的水晶棺材里。魔法师再次出现。他说，他把我大哥变成了雄鹿，把我们的城堡和全部防御工事缩小，锁进玻璃箱，还把家里所有人变成各种烟雾，关在一只只玻璃瓶里。只要我顺从他的心意，他就能轻易打开这些容器，让人和东西全都恢复原样。
        - id: ch04-b09
          speaker: maiden
          text: >-
            我还是一个字也不肯说。魔法师消失了，把我独自留在棺材里。不久，我沉沉睡去，做了许多梦。其中有一个梦给了我希望。我梦见一位年轻人来到这里，把我救出去。今天一睁眼，我马上认出了你，也知道那个梦已经成真。
        - id: ch04-b10
          speaker: maiden
          text: >-
            现在，请你帮我完成梦里剩下的事。先把装着我家城堡的玻璃箱，放到这块大石头上。

    - id: ch05
      title: 城堡重现
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            两人把玻璃箱放稳，石头便轻轻升到空中，托着他们回到上面的大厅。他们很容易就把箱子搬到了外面。姑娘揭开箱盖，奇妙的景象出现了。城堡、房屋和农庄不停长大，向四周伸展开来，终于恢复了原来的模样。
        - id: ch05-b02
          speaker: narrator
          text: >-
            接着，姑娘和年轻人又乘那块活动的石头回到地下，把所有盛着烟雾的玻璃瓶一只只运上来。他们一拔掉瓶塞，蓝色烟雾便纷纷涌出，在眼前变成一个个活生生的人。姑娘满心欢喜地认出，这些正是家里众多的仆人和侍从。
        - id: ch05-b03
          speaker: narrator
          text: >-
            最后，她看见大哥从树林里走了出来，已经恢复了原本的模样，这才真正欢喜圆满。原来，大哥变成雄鹿以后，杀死了化作黑公牛的魔法师。
        - id: ch05-b04
          speaker: narrator
          text: >-
            就在当天，姑娘守住自己的诺言，同那位幸福的小裁缝结为了夫妻。这个故事，是格林兄弟讲下来的。
