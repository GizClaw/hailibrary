audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，像编书人面对孩子娓娓而谈，幽默处轻巧含笑
        timbre: 温暖清朗
        pace: 舒缓而有自然起伏
        pitch: 中音
    great_bear:
      display_name: 高大熊
      tts:
        delivery: 威严直率，每句话都说得沉稳有力
        timbre: 粗厚低沉
        pace: 偏慢
        pitch: 低音
    middle_bear:
      display_name: 中等熊
      tts:
        delivery: 朴实清楚，语气不急不缓
        timbre: 温和结实
        pace: 适中
        pitch: 中音
    little_bear:
      display_name: 小小熊
      tts:
        delivery: 稚气直率，着急时声音清亮急促
        timbre: 细小清脆
        pace: 稍快
        pitch: 高音
  chapters:
    - id: ch01
      title: 树林里的三只熊
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，树林里住着三只熊，他们有一座自己的房子。一只是小小熊，一只是中等熊，还有一只是高大熊。三只熊各有一只粥碗。小小熊的是小碗，中等熊的是中碗，高大熊的是大碗。他们的椅子也是一小、一中、一大，睡觉的床同样一小、一中、一大，各自用各自的，正合适。
        - id: ch01-b02
          speaker: narrator
          text: >-
            有一天，他们把早餐的粥煮好，盛进三只碗里，便出门到树林中走一走，好让粥凉下来，吃的时候不会烫嘴。就在这时，一个小老太婆来到门外。她先贴着窗口往里看，又对准钥匙孔偷偷瞧。见屋里没人，她抬起门闩，推门走了进去。
        - id: ch01-b03
          speaker: narrator
          text: >-
            三只熊从不伤害别人，也想不到别人会伤害他们，所以只扣了门闩，并没有锁门。可见，这个老太婆不是什么善良正派的人。要是她肯等主人回来，那些和善好客的熊虽然难免有点粗野，说不定还会请她一起吃早饭。可她一看见桌上的三碗粥，马上高兴起来，根本不等主人，径自坐下来吃了。
        - id: ch01-b04
          speaker: narrator
          text: >-
            她先尝高大熊的粥。太烫了，她便骂了句难听的话。再尝中等熊的粥，又太凉了，她照样骂了一句。等她尝到小小熊的粥，这一碗不冷不热，恰好合口。她喜欢极了，一口接一口，把粥吃了个精光。吃完以后，这个坏老太婆还嫌碗太小，装的粥不够多，对着小碗又骂了一句。

    - id: ch02
      title: 椅子和小床
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            吃完粥，小老太婆坐上高大熊的大椅子。她嫌太硬，又换到中等熊的中椅子上，却嫌太软。最后，她坐进小小熊的小椅子里。这一把不硬也不软，正合她的心意。她舒舒服服地坐在那里，一直坐到椅面“喀嚓”一下塌掉，整个人扑通跌在地上。为这件事，她又恶狠狠地骂了一句。
        - id: ch02-b02
          speaker: narrator
          text: >-
            接着，她走上楼，进了三只熊共用的卧室。她先躺上高大熊的大床，可床头太高。再躺上中等熊的中床，床脚又太高。最后，她躺到小小熊的小床上。这一张床，床头和床脚都不高，睡起来刚刚好。她把自己舒舒服服地盖好，躺着躺着，便沉沉睡熟了。
        - id: ch02-b03
          speaker: narrator
          text: >-
            这时候，三只熊觉得粥已经凉了，便回来吃早饭。老太婆离开大碗时，没有拿走高大熊的勺子，那把勺子还直直地立在粥里。
        - id: ch02-b04
          speaker: great_bear
          text: >-
            有人碰过我的粥！
        - id: ch02-b05
          speaker: narrator
          text: >-
            高大熊的嗓门又大又粗。中等熊低头看看自己的碗，发现勺子也立在里面。幸好这些都是木勺。要是银勺，那个坏老太婆早把它们装进口袋了。
        - id: ch02-b06
          speaker: middle_bear
          text: >-
            我的粥也让人碰过了！
        - id: ch02-b07
          speaker: narrator
          text: >-
            中等熊的声音不高也不低。轮到小小熊看自己的碗，勺子还在，粥却一口也没剩。
        - id: ch02-b08
          speaker: little_bear
          text: >-
            有人碰过我的粥，还把它全吃光了！

    - id: ch03
      title: 谁动过他们的东西
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            小小熊用他又细又小的嗓音喊出了这句话。三只熊这才知道，有人闯进过他们的家，还吃掉了小小熊的整份早饭。他们决定把屋子再仔细找一遍。高大熊先看见，自己椅子上的硬坐垫已经不在原来的位置。
        - id: ch03-b02
          speaker: great_bear
          text: >-
            有人坐过我的椅子！
        - id: ch03-b03
          speaker: narrator
          text: >-
            高大熊仍旧用他粗沉的大嗓门喊着。中等熊再看自己的椅子，那块软坐垫也让人压得扁扁的。
        - id: ch03-b04
          speaker: middle_bear
          text: >-
            我的椅子也有人坐过！
        - id: ch03-b05
          speaker: narrator
          text: >-
            至于第三把椅子，你当然记得老太婆做了什么。小小熊一看，椅面已经整个塌了。
        - id: ch03-b06
          speaker: little_bear
          text: >-
            有人坐过我的椅子，还把椅面坐塌了！
        - id: ch03-b07
          speaker: narrator
          text: >-
            三只熊觉得这件事还没查清，必须接着找，于是又一同上了楼。走进卧室，高大熊发现自己的枕头也让人扯离了原来的位置。
        - id: ch03-b08
          speaker: great_bear
          text: >-
            有人睡过我的床！
        - id: ch03-b09
          speaker: narrator
          text: >-
            中等熊床上的长枕也不在原来的地方。
        - id: ch03-b10
          speaker: middle_bear
          text: >-
            我的床也有人睡过！
        - id: ch03-b11
          speaker: narrator
          text: >-
            小小熊走到自己的床边。长枕还在原处，枕头也好好地摆在长枕上。可枕头上多了一颗又丑又脏的脑袋。那个小老太婆还躺在那里呢，她根本就不该睡在这张床上。
        - id: ch03-b12
          speaker: little_bear
          text: >-
            有人睡过我的床——她就在这里！

    - id: ch04
      title: 小老太婆逃走了
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            其实，三只熊说话的时候，小老太婆全都听见了。高大熊那粗沉的声音传进梦里，她只觉得像风在怒吼，又像雷声在滚动。中等熊开口时，她仿佛听见梦里有人说话，还是没有醒。
        - id: ch04-b02
          speaker: narrator
          text: >-
            可小小熊的嗓音又尖又亮，一下子就把她惊醒了。她猛然坐起，看见三只熊全站在床的一边，连忙从另一边滚下去，直奔窗户。
        - id: ch04-b03
          speaker: narrator
          text: >-
            那扇窗正好开着。三只熊爱干净，也有好习惯，每天早晨起床以后，总要把卧室的窗户打开。小老太婆纵身跳出窗外。她是不是摔断了脖子？是不是逃进树林，从此迷了路？还是她走出了树林，却让警察当成流浪汉抓起来，送进了感化院？这些事，我可说不准。
        - id: ch04-b04
          speaker: narrator
          text: >-
            不过，从那以后，三只熊再也没有见过她。
