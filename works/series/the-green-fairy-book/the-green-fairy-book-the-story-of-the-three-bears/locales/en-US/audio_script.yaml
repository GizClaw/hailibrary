audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and attentive fairy-tale storytelling
        timbre: clear and gently resonant
        pace: measured
        pitch: medium
    great_huge_bear:
      display_name: Great, Huge Bear
      tts:
        delivery: strong, direct, and imposing
        timbre: deep and rough
        pace: deliberate
        pitch: low
    middle_bear:
      display_name: Middle Bear
      tts:
        delivery: clear, alert, and matter-of-fact
        timbre: smooth and full
        pace: measured
        pitch: medium
    little_small_wee_bear:
      display_name: Little, Small, Wee Bear
      tts:
        delivery: bright, earnest, and quick
        timbre: light and clear
        pace: natural
        pitch: high
  chapters:
    - id: ch01
      title: The Bears' House in the Wood
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, three bears lived together in a house of their own in a wood. There was a Little, Small, Wee Bear, a Middle Bear, and a Great, Huge Bear.
        - id: ch01-b02
          speaker: narrator
          text: Each bear had a porridge pot. The Little, Small, Wee Bear had a little pot. The Middle Bear had a middle-sized pot, and the Great, Huge Bear had a great pot. Each bear had a chair in the right size too. There was a little chair for the wee bear, a middle-sized chair for the Middle Bear, and a great chair for the Great, Huge Bear. Their beds matched them in just the same way. One was little, one was middle-sized, and one was great.
        - id: ch01-b03
          speaker: narrator
          text: One morning, the bears made porridge for breakfast and poured it into their pots. It was too hot to eat, so they went for a walk in the wood while it cooled. That way, none of them would burn their mouth by starting too soon.
        - id: ch01-b04
          speaker: narrator
          text: While they were away, a little old woman came to the house. She was not a good, honest old woman. First she looked through the window. Then she peeped through the keyhole. When she saw that no one was home, she lifted the latch.
        - id: ch01-b05
          speaker: narrator
          text: The bears had not fastened the door. They never harmed anyone, and it never occurred to them that anyone might harm them. The little old woman opened the door, walked in, and was delighted to see the porridge on the table.
        - id: ch01-b06
          speaker: narrator
          text: A good visitor would have waited for the bears to come home. They might even have invited her to breakfast. Though bears are naturally a little rough, these three were kind and welcoming. But this woman was rude and badly behaved. She began helping herself.
    - id: ch02
      title: Just Right
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: First she tried the Great, Huge Bear's porridge. It was too hot for her, and she said a bad word about it.
        - id: ch02-b02
          speaker: narrator
          text: Next she tasted the Middle Bear's porridge. That was too cold for her, so she said a bad word about that too.
        - id: ch02-b03
          speaker: narrator
          text: Last of all, she tasted the Little, Small, Wee Bear's porridge. It was neither too hot nor too cold. It was just right. She liked it so much that she ate every bit. Even then she was not satisfied. The naughty old woman said a bad word about the little porridge pot because it had not held enough for her.
        - id: ch02-b04
          speaker: narrator
          text: Then the little old woman sat in the Great, Huge Bear's chair. It was too hard. She tried the Middle Bear's chair, but that one was too soft. At last she sat in the Little, Small, Wee Bear's chair. It was neither too hard nor too soft. It was just right.
        - id: ch02-b05
          speaker: narrator
          text: She settled into the little chair and stayed there until its bottom gave way. Down she fell, plump onto the floor. Once again, the naughty old woman said something wicked.
        - id: ch02-b06
          speaker: narrator
          text: After that, she went upstairs to the bedroom where the three bears slept. First she lay down on the Great, Huge Bear's bed, but it was too high at the head for her. Next she lay on the Middle Bear's bed. That one was too high at the foot. Then she tried the Little, Small, Wee Bear's bed. It was neither too high at the head nor too high at the foot. It was just right.
        - id: ch02-b07
          speaker: narrator
          text: The little old woman pulled the covers around herself and settled comfortably into the little bed. She lay there until she was fast asleep.
    - id: ch03
      title: Somebody Has Been Here
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: By then, the three bears thought their porridge must be cool enough. They came home for breakfast. The little old woman had left the Great, Huge Bear's spoon standing in his porridge.
        - id: ch03-b02
          speaker: great_huge_bear
          text: Somebody has been tasting my porridge!
          emotion: surprised
        - id: ch03-b03
          speaker: narrator
          text: The Great, Huge Bear said it in his great, gruff voice. Then the Middle Bear looked into the middle-sized pot and saw another spoon standing there. Both spoons were wooden. If they had been silver, the naughty old woman would have put them in her pocket.
        - id: ch03-b04
          speaker: middle_bear
          text: Someone has tasted my porridge too!
          emotion: surprised
        - id: ch03-b05
          speaker: narrator
          text: The Middle Bear spoke in a middle-sized voice. Then the Little, Small, Wee Bear looked into the little pot. The spoon was still standing there, but all the porridge was gone.
        - id: ch03-b06
          speaker: little_small_wee_bear
          text: Somebody has tasted my porridge and eaten every bit!
          emotion: surprised
        - id: ch03-b07
          speaker: narrator
          text: The Little, Small, Wee Bear cried out in a little, small, wee voice. Now all three bears knew that someone had entered their house and eaten the wee bear's breakfast. They began to look around. When the old woman rose from the Great, Huge Bear's chair, she had left its hard cushion crooked.
        - id: ch03-b08
          speaker: great_huge_bear
          text: Somebody has been sitting in my chair!
          emotion: surprised
        - id: ch03-b09
          speaker: narrator
          text: The Great, Huge Bear spoke in his great, rough, gruff voice. The soft cushion on the Middle Bear's chair had been crushed down where the little old woman sat.
        - id: ch03-b10
          speaker: middle_bear
          text: Someone has been sitting in my chair too!
          emotion: surprised
        - id: ch03-b11
          speaker: narrator
          text: The Middle Bear said it in a middle-sized voice. And everyone knows what the little old woman had done to the third chair.
        - id: ch03-b12
          speaker: little_small_wee_bear
          text: Somebody sat in my chair and broke the bottom right out!
          emotion: surprised
        - id: ch03-b13
          speaker: narrator
          text: The Little, Small, Wee Bear said it in a little, small, wee voice. The three bears decided they must search farther. Together they went upstairs into their bedroom. The old woman had pulled the Great, Huge Bear's pillow out of place when she tried his bed.
        - id: ch03-b14
          speaker: great_huge_bear
          text: Somebody has been lying in my bed!
          emotion: surprised
        - id: ch03-b15
          speaker: narrator
          text: The Great, Huge Bear said it in his great, rough, gruff voice. The little old woman had pulled the Middle Bear's bolster out of place as well.
        - id: ch03-b16
          speaker: middle_bear
          text: Someone has been lying in my bed too!
          emotion: surprised
        - id: ch03-b17
          speaker: narrator
          text: The Middle Bear spoke in a middle-sized voice. Then the Little, Small, Wee Bear came to the little bed. The bolster was in its place, and the pillow was in its place on top of the bolster. But lying on the pillow was the little old woman's ugly, dirty head. That head certainly was not in its proper place, because she had no business being there.
        - id: ch03-b18
          speaker: little_small_wee_bear
          text: Somebody has been lying in my bed, and here she is!
          emotion: surprised
    - id: ch04
      title: Out the Window
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The little old woman had heard the Great, Huge Bear's rough, gruff voice in her sleep. But she was sleeping so deeply that it sounded no more important than roaring wind or rumbling thunder. She heard the Middle Bear's voice too, but it seemed like nothing more than someone talking in a dream.
        - id: ch04-b02
          speaker: narrator
          text: But when she heard the Little, Small, Wee Bear, his little voice sounded so sharp and shrill that it woke her at once. Up she sprang. The three bears were standing on one side of the bed, so she tumbled out on the other side and ran straight to the window.
        - id: ch04-b03
          speaker: narrator
          text: The window was open. The bears were good, tidy bears, and they always opened their bedroom window when they got up in the morning. The little old woman jumped out.
        - id: ch04-b04
          speaker: narrator
          text: Perhaps she broke her neck in the fall. Perhaps she ran into the wood and became lost. Or perhaps she found her way out, only to be caught by the constable and sent to the House of Correction for wandering about as a vagrant. I cannot tell you which it was.
        - id: ch04-b05
          speaker: narrator
          text: But the Three Bears never saw her again.
