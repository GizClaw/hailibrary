audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and attentive fairy-tale storytelling
        timbre: clear and gently resonant
        pace: measured
        pitch: medium
    young_man:
      display_name: Young Man
      tts:
        delivery: brave, earnest, and steadfast
        timbre: clear and youthful
        pace: natural
        pitch: medium-low
    king:
      display_name: King
      tts:
        delivery: commanding, dignified, and direct
        timbre: deep and resonant
        pace: measured
        pitch: low
    princess:
      display_name: Princess
      tts:
        delivery: proud, changeable, and poised
        timbre: clear and refined
        pace: measured
        pitch: medium-high
    servant:
      display_name: Faithful Servant
      tts:
        delivery: loyal, alert, and plainspoken
        timbre: steady and clear
        pace: natural
        pitch: medium
  chapters:
    - id: ch01
      title: The Soldier Who Saved the Kingdom
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a poor man who could no longer afford to keep his only son at home. The son saw how things stood and spoke to his father.
        - id: ch01-b02
          speaker: young_man
          text: Dear Father, you have so little, and keeping me here only makes life harder for you. I would rather go out into the world and try to earn my own living.
        - id: ch01-b03
          speaker: narrator
          text: His father gave him his blessing, and they parted in great sorrow. At that time, the King of a powerful kingdom was at war. The young man joined the King's service and marched away with the army.
        - id: ch01-b04
          speaker: narrator
          text: When they met the enemy, a fierce battle began. Bullets came down so thickly that the young man's comrades fell on every side. Then their leader fell too, and the others wanted to run.
        - id: ch01-b05
          speaker: young_man
          text: We cannot run away and let our country be ruined!
        - id: ch01-b06
          speaker: narrator
          text: He stepped forward, and the other soldiers followed him. He drove on against the enemy and defeated them. When the King learned that this young man alone had turned the battle and won the victory, he raised him above everyone else. He gave him great treasures and made him the first man in the kingdom.
    - id: ch02
      title: The Princess's Vow
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The King had a beautiful daughter, but she was very capricious. She had sworn that she would marry only a man who promised to be buried alive with her if she died first.
        - id: ch02-b02
          speaker: princess
          text: If he truly loves me, what use would his life be after I die?
        - id: ch02-b03
          speaker: narrator
          text: She promised the same in return. If her husband died first, she would be buried with him. This strange vow had frightened every suitor away. But the young man was so taken by her beauty that the danger did not stop him. He went to the King and asked to marry her.
        - id: ch02-b04
          speaker: king
          text: Do you understand what you must promise?
        - id: ch02-b05
          speaker: young_man
          text: If I live longer than she does, I must enter her grave with her. But I love her so deeply that I will not turn away because of that risk.
        - id: ch02-b06
          speaker: narrator
          text: The King gave his consent, and the wedding was celebrated with great splendor.
        - id: ch02-b07
          speaker: narrator
          text: For a long time, the young couple lived happily together. Then the young Queen became terribly ill. No doctor could save her, and at last she died. The young King remembered his promise. He shuddered at the thought of lying alive inside her grave, but there was no escape. The old King had guards placed at every gate, so he could not avoid his fate.
        - id: ch02-b08
          speaker: narrator
          text: On the day the Queen's body was carried into the royal vault, the young King was led inside after her. Then the entrance was bolted shut.
    - id: ch03
      title: The Three Snake-leaves
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Beside the coffin stood a table with four candles, four loaves of bread, and four bottles of wine. When those supplies were gone, the young King would die. He sat in grief and misery, eating only a tiny piece of bread each day and drinking just one mouthful of wine. All the while, he felt death drawing nearer.
        - id: ch03-b02
          speaker: narrator
          text: One day, as he stared gloomily before him, a snake crept out of a corner and moved toward the Queen's body. He thought it meant to touch her. He drew his sword.
        - id: ch03-b03
          speaker: young_man
          text: As long as I am alive, you will not harm her!
        - id: ch03-b04
          speaker: narrator
          text: With one stroke, he cut the snake into three pieces. After a while, a second snake came from the same corner. It saw the first snake lying there in pieces, turned back, and soon returned with three green leaves in its mouth.
        - id: ch03-b05
          speaker: narrator
          text: The second snake placed the three pieces in their proper order and laid one green leaf on each wound. At once, the pieces joined together. The dead snake began to move, came alive, and hurried away with its companion. The three leaves were left on the floor.
        - id: ch03-b06
          speaker: narrator
          text: The unhappy young King had watched it all. Now a thought came to him. Perhaps the wonderful power of those leaves would work on a human being too.
        - id: ch03-b07
          speaker: narrator
          text: He picked them up. He placed one leaf on the dead Queen's mouth and the other two on her eyes. Almost at once, her blood began to flow again, and color rose into her pale face. She drew a breath and opened her eyes.
        - id: ch03-b08
          speaker: princess
          text: Ah! Where am I?
          emotion: surprised
        - id: ch03-b09
          speaker: young_man
          text: You are here with me, my dear.
        - id: ch03-b10
          speaker: narrator
          text: He told her everything that had happened and how he had brought her back to life. Then he gave her bread and wine. When her strength returned, she rose, and together they went to the sealed door. They knocked and shouted until the guards heard them and carried the news to the old King.
        - id: ch03-b11
          speaker: narrator
          text: The King himself came and opened the vault. He found them both alive, well, and full of joy. He rejoiced with them because he believed all their trouble was over.
        - id: ch03-b12
          speaker: narrator
          text: The young King handed the three snake-leaves to a servant.
        - id: ch03-b13
          speaker: young_man
          text: Guard these carefully for me, and keep them with you wherever you go. Who knows? One day, they may help us when we need them.
    - id: ch04
      title: Treachery at Sea
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Yet the young Queen seemed changed after she returned to life. It was as if all the love she had felt for her husband had faded from her heart.
        - id: ch04-b02
          speaker: narrator
          text: Some time later, the young King decided to cross the sea and visit his old father. The Queen went aboard the ship with him. During the voyage, she forgot his great love and faithfulness. She forgot that he had saved her from death. Instead, she fell in love with the captain.
        - id: ch04-b03
          speaker: narrator
          text: One day, while the young King lay asleep, she called the captain over. She took her sleeping husband by the head and ordered the captain to take his feet. Together, they threw him into the sea.
        - id: ch04-b04
          speaker: princess
          text: Now we will sail home and say that he died during the voyage. I will praise you so highly to my father that he will let me marry you and make you heir to the throne.
        - id: ch04-b05
          speaker: narrator
          text: But the faithful servant had seen everything. Without being noticed, he lowered a little boat into the water and rowed after his master while the traitors sailed away. He pulled the drowned man from the sea. Then he placed the three snake-leaves on his master's mouth and eyes, just as before, and brought him back to life.
        - id: ch04-b06
          speaker: narrator
          text: The young King and his servant rowed with all their strength, day and night. Their little boat moved so quickly that they reached the old King before the great ship did.
        - id: ch04-b07
          speaker: narrator
          text: The old King was astonished to see the two men return alone. He asked what had happened, and they told him of his daughter's wicked deed.
        - id: ch04-b08
          speaker: king
          text: I cannot believe that my daughter has done something so evil. Still, the truth will soon show itself.
        - id: ch04-b09
          speaker: narrator
          text: He hid the young King and the servant in a secret chamber and allowed no one to see them.
    - id: ch05
      title: The Truth Comes to Light
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Soon afterward, the great ship arrived. The wicked Queen came before her father wearing a sorrowful face.
        - id: ch05-b02
          speaker: king
          text: Why have you returned alone? Where is your husband?
        - id: ch05-b03
          speaker: princess
          text: Oh, dear Father, I have come home in terrible grief. My husband suddenly fell ill during the voyage and died. If the good captain had not helped me, I would have died too. He stood beside my husband at the end, and he can tell you everything.
        - id: ch05-b04
          speaker: king
          text: Then I will bring the dead man back to life.
        - id: ch05-b05
          speaker: narrator
          text: The King opened the secret chamber and called the young King and his servant out. At the sight of her husband, the Queen stood as if thunder had struck her. Then she dropped to her knees and begged for mercy.
        - id: ch05-b06
          speaker: king
          text: You will have no mercy. This man was willing to die beside you, and he brought you back to life. You murdered him while he slept. Now you will receive the punishment you deserve.
        - id: ch05-b07
          speaker: narrator
          text: So the Queen and the captain who had helped her were placed in a ship bored through with holes. The ship was drawn out to sea, and before long, they perished beneath the waves.
