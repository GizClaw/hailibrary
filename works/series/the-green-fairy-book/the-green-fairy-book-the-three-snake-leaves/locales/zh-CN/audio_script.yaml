audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，像编书人面对孩子娓娓而谈，幽默处轻巧含笑
        timbre: 温暖清朗
        pace: 舒缓而有自然起伏
        pitch: 中音
    young_man:
      display_name: 年轻人
      tts:
        delivery: 勇敢真诚，面对危险坚定有力，对爱人温柔恳切
        timbre: 年轻明亮
        pace: 适中
        pitch: 中音
    king:
      display_name: 国王
      tts:
        delivery: 威严审慎，查明真相后冷峻果断
        timbre: 浑厚沉稳
        pace: 从容
        pitch: 低音
    princess:
      display_name: 公主
      tts:
        delivery: 年轻高傲，前段任性明快，复生后逐渐冷漠而虚伪
        timbre: 清亮冷艳
        pace: 适中
        pitch: 中高音
  chapters:
    - id: ch01
      title: 从穷人之子到王国第一人
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，有个穷人，穷得再也养不起唯一的儿子。儿子看着家里的日子一天比一天难过，便向父亲辞行。
        - id: ch01-b02
          speaker: young_man
          text: >-
            父亲，您已经这样贫苦，我留在家里，只会多添一份负担。我想出去闯一闯，靠自己挣口饭吃。
        - id: ch01-b03
          speaker: narrator
          text: >-
            父亲为儿子祝福，满怀悲伤地送他离开。那时，一个强大王国的国王正在打仗。年轻人投到国王麾下，跟着军队上了战场。
        - id: ch01-b04
          speaker: narrator
          text: >-
            两军一相遇，恶战就开始了。子弹密得像雨，同伴们一个接一个倒在年轻人身边。后来，连领兵的将军也倒下了。余下的士兵转身想逃，年轻人却挺身站了出来。
        - id: ch01-b05
          speaker: young_man
          text: >-
            别逃！我们绝不能眼看着自己的国家毁掉！
        - id: ch01-b06
          speaker: narrator
          text: >-
            士兵们受到鼓舞，跟着他重新冲向敌军。年轻人一鼓作气，赢下了这场战斗。国王得知胜利全靠他挽回，便把他的官职升到众人之上，赏给他大批财宝，让他成了王国里地位最高的大臣。

    - id: ch02
      title: 生死誓言
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            国王有个女儿，容貌十分美丽，性情却很任性。她早已立下一个古怪的誓言。无论谁想娶她，都得答应，假如她先死，就让人把自己和她一同活埋。
        - id: ch02-b02
          speaker: princess
          text: >-
            他若真心爱我，我死了以后，他一个人活着还有什么意思？
        - id: ch02-b03
          speaker: narrator
          text: >-
            公主也肯作出同样的承诺。若是丈夫先死，她便陪他一同下葬。求婚的人全被这誓言吓跑了。可是，年轻人迷上了公主的美貌，什么危险都不顾，向国王求娶她。
        - id: ch02-b04
          speaker: king
          text: >-
            你可知道，为了娶她，你必须答应什么？
        - id: ch02-b05
          speaker: young_man
          text: >-
            如果我比她活得久，就要随她下墓。可是我太爱她了，不愿去想其中的凶险。
        - id: ch02-b06
          speaker: narrator
          text: >-
            国王答应了这门婚事，为他们举行了盛大的婚礼。两个人幸福地生活了很久。谁知后来，年轻的王后忽然得了重病，所有医生都救不了她。
        - id: ch02-b07
          speaker: narrator
          text: >-
            王后死后，年轻国王想起自己的誓言。一想到要活着躺进墓穴，他就浑身发冷。可是每一道城门前都有老国王派来的卫兵，他根本逃不掉。
        - id: ch02-b08
          speaker: narrator
          text: >-
            安放遗体的日子到了。年轻国王被领进王家墓穴，入口随即上了闩，封得严严实实。

    - id: ch03
      title: 三片蛇叶
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            棺材旁放着一张桌子，桌上只有四支蜡烛、四个面包和四瓶葡萄酒。这些东西一旦用完，年轻国王就只能等死。
        - id: ch03-b02
          speaker: narrator
          text: >-
            他悲苦地守在那里，每天只吃一点点面包，喝一小口酒。食物越来越少，死亡也越来越近。一天，他正闷闷地望着地面，一条蛇忽然从墙角爬出来，朝王后的遗体游去。他以为蛇要伤害她，立刻拔出剑。
        - id: ch03-b03
          speaker: young_man
          text: >-
            只要我还有一口气，就不许你碰她！
        - id: ch03-b04
          speaker: narrator
          text: >-
            他挥剑把蛇斩成三段。过了一会儿，又一条蛇爬出墙角。它看到同伴断成几截，死在地上，马上退了回去。不久，它衔着三片绿叶再次出现。
        - id: ch03-b05
          speaker: narrator
          text: >-
            第二条蛇把三截身体依次摆好，在每道伤口上放了一片叶子。转眼间，断开的身体重新接在一起。死蛇扭动几下，活了过来。两条蛇匆匆游走，把三片叶子留在地上。
        - id: ch03-b06
          speaker: narrator
          text: >-
            年轻国王亲眼看见这一切，心里忽然有了希望。这些叶子既然能救活一条蛇，会不会也能救活一个人？他拾起叶子，把一片放在王后嘴上，另外两片放在她的双眼上。
        - id: ch03-b07
          speaker: narrator
          text: >-
            王后的血重新流动起来，渐渐涌上脸颊。苍白的脸有了颜色。她吸进一口气，睁开了双眼。
        - id: ch03-b08
          speaker: princess
          text: >-
            啊，我这是在哪儿？
          emotion: surprised
        - id: ch03-b09
          speaker: young_man
          text: >-
            亲爱的夫人，你和我在一起。
        - id: ch03-b10
          speaker: narrator
          text: >-
            他把墓穴里发生的事，还有自己怎样救活她，都说了一遍，又拿面包和酒给她吃喝。王后恢复力气后站起身，同丈夫一起走到门边。两人用力敲门，高声呼喊。卫兵听见了，赶紧禀告国王。
        - id: ch03-b11
          speaker: narrator
          text: >-
            国王亲自打开墓门，看见两个人都活着，平安无事，高兴得不得了。他以为所有苦难都过去了。年轻国王却把三片蛇叶交给一名仆人。
        - id: ch03-b12
          speaker: young_man
          text: >-
            你替我仔细收好，随时带在身边。说不定哪一天，我们还要靠它们相救。

    - id: ch04
      title: 海上的背叛
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            可是，王后从死亡中回来以后，仿佛换了一个人。她心里对丈夫的爱，一点点也没有留下。
        - id: ch04-b02
          speaker: narrator
          text: >-
            过了一段日子，年轻国王想渡海探望自己的老父亲，王后便同他一起上了船。丈夫怎样深爱她，怎样守信陪她下墓，又怎样把她救活，她全都忘了。她爱上了船长。
        - id: ch04-b03
          speaker: narrator
          text: >-
            一天，年轻国王躺着睡着了。王后把船长叫到身边。她抓住熟睡之人的头，叫船长抬起他的双脚。两人合力把年轻国王扔进了海里。
        - id: ch04-b04
          speaker: princess
          text: >-
            现在我们回去，就说他在路上死了。我会在父王面前好好夸你，让他把我嫁给你，再立你做王位继承人。
        - id: ch04-b05
          speaker: narrator
          text: >-
            可那名忠仆看见了全部经过。他趁两人不留意，悄悄放下一只小船，划去追自己的主人。两个叛徒乘着大船继续前行，根本没有发现。
        - id: ch04-b06
          speaker: narrator
          text: >-
            忠仆从海里捞起已经溺死的主人，又取出一直随身带着的三片蛇叶，分别放在他的嘴和双眼上。年轻国王就这样再一次活了过来。
        - id: ch04-b07
          speaker: narrator
          text: >-
            主仆二人不分白天黑夜，使出全身力气划船。小船快得出奇，竟抢在另外两人前面，来到了老国王那里。老国王只见他们两人回来，十分惊讶，立刻追问出了什么事。
        - id: ch04-b08
          speaker: narrator
          text: >-
            听完女儿的恶行，老国王还是难以相信。
        - id: ch04-b09
          speaker: king
          text: >-
            我不敢相信，她竟会做出这样的坏事。不过，真相很快就会大白。
        - id: ch04-b10
          speaker: narrator
          text: >-
            他让主仆二人藏进一间密室，不许任何人看见他们。

    - id: ch05
      title: 真相大白
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            没过多久，大船靠岸了。狠毒的王后带着一脸悲伤，来到父亲面前。
        - id: ch05-b02
          speaker: king
          text: >-
            你怎么独自回来了？你的丈夫在哪里？
        - id: ch05-b03
          speaker: princess
          text: >-
            父亲，我心里悲痛极了。我的丈夫在航程中忽然病倒，死去了。要不是这位好心的船长帮助我，只怕我也活不成。他守在我丈夫临终的床前，所有事情都能告诉您。
          emotion: sad
        - id: ch05-b04
          speaker: king
          text: >-
            那好，我就让死人重新活过来。
        - id: ch05-b05
          speaker: narrator
          text: >-
            国王打开密室的门，把年轻国王和忠仆叫了出来。王后一看到自己的丈夫，顿时像被雷劈中一样。她跪倒在地，苦苦请求父亲饶命。
        - id: ch05-b06
          speaker: king
          text: >-
            你别想得到宽恕。他甘愿陪你去死，又亲手把你救活。你却趁他熟睡时杀了他。现在，你必须为自己的罪行付出代价。
        - id: ch05-b07
          speaker: narrator
          text: >-
            王后和她的同谋被放进一艘处处凿穿了孔洞的船里，拖到大海深处。没过多久，两人便沉进波涛，再也没有回来。
        - id: ch05-b08
          speaker: narrator
          text: >-
            这个故事，是格林兄弟讲下来的。
