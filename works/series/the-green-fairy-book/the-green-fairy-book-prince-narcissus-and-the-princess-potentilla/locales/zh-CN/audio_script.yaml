audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，像编书人面对孩子娓娓而谈，讽刺处轻巧含笑
        timbre: 温暖清朗
        pace: 舒缓而有自然起伏
        pitch: 中音
    potentilla:
      display_name: 波坦蒂拉公主
      tts:
        delivery: 温柔真挚，困境中仍有坚定的少女气质
        timbre: 清澈柔美
        pace: 适中
        pitch: 中高音
    narcissus:
      display_name: 纳西瑟斯王子
      tts:
        delivery: 年轻诚挚，热情中带着温柔克制
        timbre: 明亮清润
        pace: 适中
        pitch: 中音
    melinette:
      display_name: 梅利内特仙女
      tts:
        delivery: 从容威严，保护他人时果断有力
        timbre: 明净沉稳
        pace: 从容
        pitch: 中高音
    grumedan:
      display_name: 格鲁梅丹魔法师
      tts:
        delivery: 粗鲁自负，说话结巴而爱卖弄威风
        timbre: 粗哑厚重
        pace: 偏慢而顿挫
        pitch: 中低音
    cleaverleaf:
      display_name: 三叶草国王
      tts:
        delivery: 懒散随和，遇到麻烦时犹豫尴尬
        timbre: 浑厚松弛
        pace: 偏慢
        pitch: 中低音
    frivola:
      display_name: 弗里沃拉王后
      tts:
        delivery: 矫饰傲慢，虚假的关怀中藏着嫉妒
        timbre: 华丽偏尖
        pace: 适中
        pitch: 中高音
    philomel:
      display_name: 夜莺菲洛梅尔
      tts:
        delivery: 忠诚灵巧，歌唱般轻盈悦耳
        timbre: 清脆婉转
        pace: 轻快
        pitch: 高音
    cleopatra:
      display_name: 克利奥帕特拉女王
      tts:
        delivery: 庄严高贵，话语中带着清醒的告诫
        timbre: 丰满明亮
        pace: 舒缓
        pitch: 中音
    frog_1:
      display_name: 青蛙甲
      tts:
        delivery: 卖力而机械地反复高唱
        timbre: 低沉呱哑
        pace: 适中
        pitch: 中低音
    frog_2:
      display_name: 青蛙乙
      tts:
        delivery: 卖力而机械地反复高唱
        timbre: 沙哑短促
        pace: 适中
        pitch: 中音
    frog_3:
      display_name: 青蛙丙
      tts:
        delivery: 卖力而机械地反复高唱
        timbre: 尖细呱哑
        pace: 适中
        pitch: 中高音
  chapters:
    - id: ch01
      title: 被藏起来的公主
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前有一位三叶草国王和一位弗里沃拉王后。他们虽已离世很久，爱好却和今天许多人差不多。国王最喜欢打猎，但也会尽力照管国家。他所谓的尽力，就是把公文折起来，再打开，然后又折起来，永远也处理不完。王后年轻时很漂亮，并且乐意相信自己如今依旧美丽。要让一位王后相信这种事，当然总是不难。
        - id: ch01-b02
          speaker: narrator
          text: >-
            王后一生只顾寻欢作乐。她能多快安排，舞会、化装舞会和野餐会就多快地一场接一场。你大概想得到，国家就这样荒废了。谁看中一座城或一个省，只管拿走便是。只要国王还有马匹和猎犬，王后还有乐师和演员，两人根本不理会这些事。
        - id: ch01-b03
          speaker: narrator
          text: >-
            他们只有一个女儿。小公主从出生起就美得惊人，才四岁，王后已经嫉妒得发狂，生怕女儿长大后比自己更受人爱慕。于是，她命人在宫苑外不远处的河岸边盖了一幢小屋，又筑起高墙，把可爱的波坦蒂拉囚禁在里面。不能说话的乳母照料她，吃穿用度都从墙上一扇小窗递进去。墙外总有卫兵来回巡逻，奉命砍下每个胆敢靠近之人的脑袋。他们执行起来，准会毫不犹豫。
        - id: ch01-b04
          speaker: narrator
          text: >-
            王后装出悲痛的样子，到处说公主奇丑无比，性情麻烦，根本没有人能爱，只好永远藏起来。这谎话重复得太多，最后整个宫廷都相信了。等波坦蒂拉大约十五岁时，纳西瑟斯王子听说王后的宫廷热闹非凡，便前来拜访。
        - id: ch01-b05
          speaker: narrator
          text: >-
            王子只比公主大一点儿，俊美得百里难寻，而且以他的年纪来说，也不算太轻浮。他的父母也是国王和王后，他们的故事，也许有一天你会读到。两人几乎同时去世，把王国留给长子，又将小儿子纳西瑟斯托付给梅利内特仙女。这项安排对他再好不过。仙女既仁慈又法力无边，凡是对小王子有益的知识都认真教给他，甚至传授了一些仙家秘术。
        - id: ch01-b06
          speaker: narrator
          text: >-
            王子长大后，梅利内特让他独自出门见识世界，自己仍在暗中照看。临行前，她送给王子一枚戒指。只要把戒指戴在手上，他便会隐形。这种戒指似乎并不少见。你即使没亲眼看过，也一定常听人提起。王子四处游历时来到弗里沃拉王后的宫廷，受到了热烈欢迎。王后喜欢他，贵妇们也喜欢他。国王虽然不懂大家为什么这样大惊小怪，对他倒也很客气。
    - id: ch02
      title: 溪边的秘密
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            纳西瑟斯很享受宫里的种种娱乐。没多久，他听见了波坦蒂拉公主的传闻。故事传过无数遍，又被人添油加醋，公主已经成了一个丑陋得吓人的怪物。王子好奇极了，决定用隐形戒指亲眼看一看。他隐去身形，从卫兵面前走过，无人察觉。高墙不太好爬，可他终于翻了进去。
        - id: ch02-b02
          speaker: narrator
          text: >-
            墙内的小天地安静又美丽。一个纤秀的少女正在花间漫步，比园子更叫王子惊喜。他找遍各处，也没有发现传说中的怪物，这才明白少女就是公主。这时，他已经深深爱上她了。要找出比波坦蒂拉更美的人，实在很难。她坐在溪边，把蓝色勿忘我编成花冠，戴在波浪般的金发上。她温柔地照料园中的飞禽走兽，它们全都爱她，跟在她身旁。比这更温柔的情景，也很难想象。
        - id: ch02-b03
          speaker: narrator
          text: >-
            王子像在美梦里一样，守着她的一举一动，却不敢现身。到了她面前，他忽然谦卑起来。傍晚，乳母来接公主回小屋，王子只好赶回王宫，免得失踪太久，让别人发现这份新得的珍宝。
        - id: ch02-b04
          speaker: narrator
          text: >-
            可他忘了，自己先前还对一切热心又快活，如今回来却心不在焉，神思恍惚，对什么都没兴趣，这才最容易惹人猜疑。贵妇们拿这件事开玩笑，一遍又一遍地追问，他只会脸红，再给出一些含糊的回答。大家立刻断定，他已经把心丢给了谁，并且竭力想查出，究竟是哪位幸运的姑娘得到了它。
        - id: ch02-b05
          speaker: narrator
          text: >-
            纳西瑟斯一天比一天爱波坦蒂拉。他只有一个念头，就是始终隐着身陪她，帮她做每一件事，把一切可能令她高兴的东西送来，放在她必会发现的地方。公主在安静的生活里，早已学会从极小的事情中得到快乐，因此天天都有惊喜。后来，王子求忠实的朋友梅利内特，把关于他的梦送给公主。等他真正出现在她眼前时，她就会认出他是朋友。
        - id: ch02-b06
          speaker: narrator
          text: >-
            这办法十分成功。波坦蒂拉梦见一个名叫纳西瑟斯的王子，他既是体贴的恋人，也是可爱的伙伴。她喜欢那些梦，甚至害怕它们有一天会停止。王子接着开始和她长谈，却仍不肯显形。她恳求了许多次，他终于无法拒绝，只请她先答应一件事。
        - id: ch02-b07
          speaker: narcissus
          text: >-
            不论我长得什么模样，你都还会爱我吗？
        - id: ch02-b08
          speaker: narrator
          text: >-
            公主答应了。王子摘下戒指，波坦蒂拉惊喜地看见，他的容貌和性情一样讨人喜欢。如今，两人当真幸福极了。他们在波坦蒂拉最爱的溪边度过整个漫长的夏日。最后，王子不得不离开时，他们都觉得那些时光过得快得不可思议。
        - id: ch02-b09
          speaker: narrator
          text: >-
            公主独自留在溪边，仍沉浸在对心爱王子的遐想中，世上再没有什么比灾祸更远离她的心。谁知魔法师格鲁梅丹突然卷着一团尘土和木屑经过，偏偏看见了她。他立即从空中降下来，落在公主脚边。只看了一眼她迷人的蓝眼睛和含笑的嘴唇，他就认定非得马上现身不可，只可惜想起自己穿的只是第二好的斗篷，心里颇为懊恼。
        - id: ch02-b10
          speaker: narrator
          text: >-
            波坦蒂拉被这个突然出现的怪物吓得叫出声来，一下子站起身，因为格鲁梅丹实在谈不上好看。他身躯庞大又笨拙，只有一只眼睛，牙齿很长，说话还结巴得厉害。偏偏他自视甚高，竟把公主惊恐的叫声当成了惊喜的欢呼。他特意停了一会儿，让她好好欣赏自己，然后说了一大篇他所能想出的最动听的恭维话。公主一点儿也不喜欢，只是浑身发抖，他自己倒满意极了。
        - id: ch02-b11
          speaker: potentilla
          text: >-
            啊！我的纳西瑟斯在哪里？
          emotion: fearful
        - id: ch02-b12
          speaker: grumedan
          text: >-
            夫人想要水仙花？那东西可不稀罕。你想要多少，我就给你多少。
        - id: ch02-b13
          speaker: narrator
          text: >-
            格鲁梅丹得意地笑着挥动魔杖，芬芳的水仙花立刻包围了公主，几乎把她埋住。她正要让他知道，自己说的不是这种水仙花，梅利内特却已经暗中看了许久。仙女觉得该出手了，便模仿王子的声音，在公主耳边低语。
        - id: ch02-b14
          speaker: melinette
          text: >-
            大难正威胁着我们，可我只担心你。求你先藏住真心，我们一定能找到脱身的办法。
          emotion: calm
        - id: ch02-b15
          speaker: narrator
          text: >-
            波坦蒂拉心里很乱，怕魔法师听见。幸好格鲁梅丹正高声叫她看花，还在夸耀自己的聪明。公主冷冷地说，这些不是她喜欢的花，请他全部送走。格鲁梅丹照办后，又想亲吻她的手，当作自己的奖赏。梅利内特当然不会允许。她周身闪耀着光华，突然现身。
        - id: ch02-b16
          speaker: melinette
          text: >-
            住手，格鲁梅丹！公主受我保护。你有半点无礼，我就囚禁你一千年。你若用正当的方法赢得她的心，我不能阻拦。可你惯用的那些把戏，我绝不会容忍。
          emotion: angry
    - id: ch03
      title: 两位追求者的较量
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            格鲁梅丹一点儿也不喜欢这番警告，可他没有别的选择，只能规矩行事，想出所有能够想到的体贴举动来讨好公主，哪怕这完全不是他做惯的事。为了赢得这样的美人，他觉得费些力气也值得。梅利内特见公主暂时安全，可以独自留下，便匆匆赶去，把发生的一切告诉纳西瑟斯。
        - id: ch03-b02
          speaker: narrator
          text: >-
            王子听说来了一个情敌，顿时怒不可遏。若非梅利内特安抚，真不知他会做出多少蠢事。仙女提醒他，格鲁梅丹法力强大，一旦被激怒，很可能伤害公主。他是所有魔法师中最不讲理、最粗暴的一个，因为作恶，早已几次受到仙后惩罚。
        - id: ch03-b03
          speaker: narrator
          text: >-
            他曾被关进一棵树里，直到狂风吹倒大树才逃出来。另一次，他被压在河底的巨石下，必须等到有人碰巧翻动石头才能脱身。可惜，什么惩罚都不能让他真正变好。梅利内特最后要王子答应，陪伴公主时继续隐形，这样对大家都安全些。
        - id: ch03-b04
          speaker: narrator
          text: >-
            于是，王子借着梅利内特的名义，同格鲁梅丹展开较量，看谁最能取悦公主，为她解闷，赢得她的赞许。纳西瑟斯先和园里的鸟儿交上朋友，教它们用最甜美的啭鸣和最动人的曲调，歌唱波坦蒂拉的名字，赞颂她的美好，从早到晚告诉她，王子有多爱她。
        - id: ch03-b05
          speaker: grumedan
          text: >-
            这有什么新鲜？从世界诞生那天起，鸟儿就会唱歌。每一个恋人都以为，它们只唱给自己听。我要亲自写一出歌剧，那才是真正前所未有、值得一听的东西！
        - id: ch03-b06
          speaker: narrator
          text: >-
            演出终于开始，而且足足折磨了人五个钟头。公主惊恐地发现，整出歌剧只有四句不怎么样的诗，由一万只青蛙拼命反复高唱。
        - id: ch03-b07
          speakers: [frog_1, frog_2, frog_3]
          ensemble: chorus
          text: >-
            可敬可爱的波坦蒂拉，你这样蓦然用明眸杀人，害死一位可怜的魔法师，难道算得上善良聪明？
        - id: ch03-b08
          speaker: narrator
          text: >-
            这几个声音只代表那一万只青蛙。第一次听见这番荒唐话时，公主还觉得有一点好笑。可五个漫长的钟头还没结束，她已经快要无聊死了。要不是隐形的纳西瑟斯一直在她耳边说话，想办法转移她的注意，真不知道可怜的波坦蒂拉会怎样。格鲁梅丹丝毫没有发现。他只顾挥鞭催促青蛙，一刻也不准它们休息。许多青蛙精疲力竭，就这样凄惨地死去。
        - id: ch03-b09
          speaker: narrator
          text: >-
            王子接着想出新的消遣。他让一队与埃及艳后克利奥帕特拉的船一模一样的舟船驶上小河。你在历史书里想必读到过那些船。最华丽的一艘船上，斜倚着那位伟大的女王本人。船来到波坦蒂拉凝神观看的地方，女王威严地登岸，把那颗远近闻名的珍珠送给公主。关于这颗珍珠，你一定也听过许多故事。
        - id: ch03-b10
          speaker: cleopatra
          text: >-
            你比我昔日更美。愿我的前车之鉴，教你更好地运用自己的美貌！
        - id: ch03-b11
          speaker: narrator
          text: >-
            小船队顺着弯曲的河道远去，最后消失不见。格鲁梅丹也看完了这场奇景，却满脸轻蔑。
        - id: ch03-b12
          speaker: grumedan
          text: >-
            这些牵线木偶一点儿也不好玩。为一颗珍珠，竟闹出这么大的阵仗！不过，夫人若喜欢珍珠，我马上就叫你心满意足。
        - id: ch03-b13
          speaker: narrator
          text: >-
            他拿出一只哨子，刚一吹响，河水便翻腾起来，变得浑浊。几十万只大牡蛎浮出水面，吃力地向公主爬去，把壳里的珍珠全都堆在她脚边。
        - id: ch03-b14
          speaker: grumedan
          text: >-
            瞧瞧，这才叫珍珠！
          emotion: happy
        - id: ch03-b15
          speaker: narrator
          text: >-
            珍珠多得足以铺满波坦蒂拉花园里每一条小径，铺完还有富余。第二天，纳西瑟斯为了让公主开心，用枝叶搭了一座美丽的凉亭。亭里铺着青草，摆着苔藓卧榻，到处挂满花环。不同颜色的花朵拼出了公主的名字。一桌精致的小宴席已经摆好，隐身的乐师轻轻奏乐，银亮的喷泉哗啦啦地落入大理石水池。
        - id: ch03-b16
          speaker: narrator
          text: >-
            乐声停下后，一只夜莺用婉转的歌声打破了寂静。公主听出这是自己最爱的鸟儿。
        - id: ch03-b17
          speaker: potentilla
          text: >-
            菲洛梅尔，我亲爱的，是谁教会你这支新歌？
          emotion: happy
        - id: ch03-b18
          speaker: philomel
          text: >-
            是爱情，我的公主。
        - id: ch03-b19
          speaker: narrator
          text: >-
            格鲁梅丹却说这场款待无聊透顶。
        - id: ch03-b20
          speaker: grumedan
          text: >-
            你们这地方，除了吱吱叫的小鸟，就想不出别的花样吗？办一场宴会，竟然连一盎司银器都没有！
    - id: ch04
      title: 魔法师的骗局
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            第二天，花园里出现了一座纯金凉亭，内外都装饰着公主和魔法师姓名的首字母。亭中摆着盛宴，桌上挤满金杯、金盘、金酒壶、金烛台，还有上百种金器，亮得让人睁不开眼。格鲁梅丹吃下了六个食人魔的分量，公主却一口也吃不下。
        - id: ch04-b02
          speaker: grumedan
          text: >-
            我没有请乐师，也没请歌手。不过你喜欢音乐，那就由我亲自唱给你听。
        - id: ch04-b03
          speaker: narrator
          text: >-
            他扯着角鸮般刺耳的嗓子，又唱起自己的歌剧。幸好这次没有唱太久，也没有青蛙伴唱。接着，纳西瑟斯再次请鸟儿朋友们帮忙。他召集方圆各处的飞鸟，在每只鸟的颈上系一盏颜色明亮的小灯。夜幕降临后，鸟群在公主面前变出上百种美妙的花样。
        - id: ch04-b04
          speaker: narrator
          text: >-
            波坦蒂拉看见自己的名字化作点点灯火，映在幽暗的树前。整群火花又聚成不同颜色的花束，仿佛活生生的花朵。她高兴得拍起小手。格鲁梅丹却靠在椅子里，跷着腿，鼻孔朝天，满脸不屑。
        - id: ch04-b05
          speaker: grumedan
          text: >-
            哦，原来公主喜欢的是焰火。
        - id: ch04-b06
          speaker: narrator
          text: >-
            第二天夜里，全国的鬼火都来到公主窗外可以望见的平原上跳舞。公主站在窗口看着，起初倒觉得颇有趣味。谁知一座可怕的火山突然从地下升起，不断向外喷出浓烟和烈焰，吓得她魂不附体。格鲁梅丹看见她害怕，却开心极了，那笑声就像一整群正在争斗的恶狼。
        - id: ch04-b07
          speaker: narrator
          text: >-
            接着，鬼火能挤进多少，就挤进多少，全都拥入波坦蒂拉的花园。借着它们的光，高大的紫杉树跳起小步舞。公主一直看到筋疲力尽，只好请求今晚别再让她看任何表演了。她非常厌恶这个讨人嫌的老魔法师，却仍努力客气待他。格鲁梅丹终于看出，自己怎么也讨不了她欢心。他越来越怀疑公主另有所爱，也猜到自己见过的那些美妙宴会，除了梅利内特，还有别人暗中操办。
        - id: ch04-b08
          speaker: narrator
          text: >-
            格鲁梅丹苦苦思量，想出了一个查明真相的计策。他突然来向公主告别，说自己万般不舍，却不得不离开。波坦蒂拉几乎藏不住喜悦。他一转身，她就央求王子重新现形。纳西瑟斯这些天又焦虑又气恼，人都瘦了，听到请求自然十分高兴。
        - id: ch04-b09
          speaker: narrator
          text: >-
            两人欣喜若狂地相见，刚要坐下来，把一切亲亲密密地说个明白，再一起笑一笑魔法师的失败，格鲁梅丹便怒气冲冲地从灌木后蹿了出来。他一直躲在那里。他抡起巨棒，朝纳西瑟斯狠狠砸去。梅利内特恰好及时赶到，一把抓起王子，以闪电般的速度飞回自己的空中城堡。要不是仙女动作敏捷，这一棒一定会杀死他。
        - id: ch04-b10
          speaker: narrator
          text: >-
            波坦蒂拉却不知道王子得救了。她看见格鲁梅丹威胁心爱的人，只尖叫一声便昏倒在地。等她醒来，梅利内特也不见了，身边再没有人保护她。她越发相信，王子已经死去。偏偏格鲁梅丹还在大发脾气，气势汹汹地来到她面前。
        - id: ch04-b11
          speaker: grumedan
          text: >-
            夫人，我把话说明白。你爱不爱那个乳臭未干的王子，根本不重要。你一定得嫁给我，趁早死了别的心思。我马上去安排婚事。为免我不在时你闹出乱子，还是先睡一觉吧。
          emotion: angry
        - id: ch04-b12
          speaker: narrator
          text: >-
            他挥动魔杖。公主拼命想保持清醒，最后还是坠入沉沉的无梦之眠。
    - id: ch05
      title: 金车驶进王宫
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            格鲁梅丹觉得，自己去见国王，入宫的排场必须配得上身份。他走出公主的小天地，登上一辆巨大得惊人的战车。车轮又大又厚，车辕粗得像橡树树干，整辆车却全由纯金铸成。四十八头强壮的公牛费尽力气才拉得动车，魔法师则舒舒服服地斜倚着，一边靠住巨棒，一边漫不经心地把一头黄褐色的非洲雄狮搁在膝头，仿佛那只是一条小哈巴狗。
        - id: ch05-b02
          speaker: narrator
          text: >-
            清晨七点左右，战车抵达宫门。国王早已起床，正要出门打猎。王后却刚刚睡熟，谁敢叫醒她，那可真需要天大的勇气。国王这时候还得接见客人，心里非常恼火。他做着怪相，又脱掉猎靴。魔法师在大厅里迈着沉重的步子，来回乱走。
        - id: ch05-b03
          speaker: grumedan
          text: >-
            国王在哪儿？告诉他，我一定要见他，也要见他的妻子！
        - id: ch05-b04
          speaker: narrator
          text: >-
            国王站在楼梯顶端偷听，觉得这话不太客气。他问过最宠信的猎手，最后还是下楼了。那辆金车让他看得目瞪口呆。格鲁梅丹大步走到他面前。
        - id: ch05-b05
          speaker: grumedan
          text: >-
            握个手吧，三叶草，老伙计！你不认识我啦？
        - id: ch05-b06
          speaker: cleaverleaf
          text: >-
            不，我恐怕确实不认识。
        - id: ch05-b07
          speaker: grumedan
          text: >-
            怎么，我是魔法师格鲁梅丹。我来是要叫你发大财的。咱们进去，好好商量一下。
        - id: ch05-b08
          speaker: narrator
          text: >-
            他吩咐公牛自行离去。它们顿时像雄鹿一样飞奔，转眼消失不见。接着，他只挥了一下巨棒，沉重的战车就变成一座金币大山。
        - id: ch05-b09
          speaker: grumedan
          text: >-
            这些钱赏给你的仆役，让他们喝酒祝我健康。
        - id: ch05-b10
          speaker: narrator
          text: >-
            一大堆金币摆在眼前，众人自然立刻哄抢起来。笑声和喊声越来越响，终于惊醒王后。她摇铃叫来女仆，追问外面为什么出现这样少见的喧闹。女仆们说有客人求见，又人人上气不接下气，各讲各的奇闻。王后只听清了公牛、黄金、巨棒、巨人、狮子几个词，便以为她们全都疯了。
        - id: ch05-b11
          speaker: narrator
          text: >-
            国王询问格鲁梅丹为何大驾光临，魔法师坚持等王后到场才肯开口。使者一个接一个去请她，她却因为被人唐突地吵醒，心情坏透了。她宣称自己小指疼痛，无论发生什么都不肯露面。格鲁梅丹听说后，仍旧坚持。
        - id: ch05-b12
          speaker: grumedan
          text: >-
            把我的巨棒送去给王后。告诉她，只要闻一闻棒头，立刻就会精神起来。
        - id: ch05-b13
          speaker: narrator
          text: >-
            国王手下四名最强壮的披甲侍卫，踉踉跄跄地抬走巨棒。经过好一番劝说，王后终于肯试试这种新奇的疗法。她才闻了一下，马上宣布自己彻底康复。究竟是木头的气味治好了她，还是因为她刚一碰巨棒，华美绝伦的珠宝就像雨一样落下来，那就由你判断吧。
        - id: ch05-b14
          speaker: narrator
          text: >-
            王后这时一心急着见神秘的来客。她匆匆披上王室斗篷，把第二好的钻石王冠扣在睡帽上，两颊各拍一大团胭脂。她不习惯在光天化日下露面，还用最大的一把扇子挡在鼻子前，扭扭捏捏地走进大厅。格鲁梅丹一直等到国王和王后在宝座上坐好，才站到两人中间，庄严地开了口。
        - id: ch05-b15
          speaker: grumedan
          text: >-
            我叫格鲁梅丹，门第极高，法力无边。可令爱波坦蒂拉还是迷住了我。没有她，我就活不下去。她以为自己爱上了一个叫纳西瑟斯的卑贱小狗崽，不过我已经收拾了他。你们同不同意这门婚事，我毫不在乎。只是有个爱管闲事的梅利内特仙女，我不想同她把关系弄僵，所以才来征求你们的同意。
        - id: ch05-b16
          speaker: narrator
          text: >-
            国王和王后不知该怎样回答这位可怕的求婚者。最后，他们请求用一两天商议。他们说，臣民或许会觉得，王位继承人的婚事不该像挤奶女工出嫁那样轻率。
        - id: ch05-b17
          speaker: grumedan
          text: >-
            你们想商量一两天，那就商量吧。不过，我要先把令爱接来。也许你们能劝她讲点道理。
        - id: ch05-b18
          speaker: narrator
          text: >-
            魔法师掏出哨子，吹出一声刺耳的尖音。那头在庭院阳光下打盹的巨狮，立刻迈着厚实柔软的脚掌飞奔进来。
        - id: ch05-b19
          speaker: grumedan
          text: >-
            俄里翁，去把公主接来，立刻带到这里。动作可要轻柔！
        - id: ch05-b20
          speaker: narrator
          text: >-
            俄里翁飞奔到花园另一头，把卫兵撞得东倒西歪，一跃越过高墙。它叼起沉睡的公主，甩到自己背上，再咬住她的长袍，把她固定在那里。随后，它轻轻跑回去，不到五分钟便站在大厅中，来到惊愕的国王和王后面前。
    - id: ch06
      title: 被迫举行的婚礼
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            格鲁梅丹把巨棒凑到公主小巧的鼻子前。波坦蒂拉醒了，一看自己身处陌生地方，可恨的魔法师就在身旁，顿时害怕地尖叫。弗里沃拉一见女儿如此美丽，气得浑身僵硬。她走上前，装出关怀的样子，说要带公主去自己的寝宫安静休息。其实，她只想尽量不让别人看见波坦蒂拉。她给公主蒙上面纱，把她带走，牢牢锁了起来。
        - id: ch06-b02
          speaker: narrator
          text: >-
            与此同时，纳西瑟斯仍被梅利内特关在空中城堡。他满心阴郁和绝望。四周虽然华美无比，又有许多乐趣本可供他享受，他却一点也不在意，只想回到波坦蒂拉身边。仙女答应一定竭尽全力相助，又命自己的燕子和蝴蝶侍候王子，听从他的一切吩咐，随后把他留在城堡里。
        - id: ch06-b03
          speaker: narrator
          text: >-
            一天，王子正在悲伤地来回踱步，忽然听见一个熟悉的声音。原来是忠实的菲洛梅尔，波坦蒂拉最爱的那只夜莺。它带来了公主的消息。
        - id: ch06-b04
          speaker: philomel
          text: >-
            公主沉睡时，那头狮子闯进花园，把她掳走了。她那些有四只脚、长着羽毛的臣民都伤心极了。我不知道该怎么办，只好四处寻找。后来，我听见燕子们说起空中城堡里的一位王子，就赶来看看那是不是你。
          emotion: sad
        - id: ch06-b05
          speaker: narrator
          text: >-
            纳西瑟斯比先前更加心乱如麻。他想尽办法逃离城堡，甚至从屋顶跳进云端。可每一次，云朵都会接住他，柔软地翻卷起来，把他送回起跳的地方。一次又一次全都如此。最后，他只能放弃，带着绝望的耐心，等待梅利内特回来。
        - id: ch06-b06
          speaker: narrator
          text: >-
            三叶草国王的宫廷里，事情却进行得飞快。王后已经下定决心，波坦蒂拉如此美丽，一定要尽早赶走。她秘密召见格鲁梅丹，要他保证两件事。他永远不能把她和三叶草国王赶出王国，还得把波坦蒂拉带到很远的地方，让王后从此再也见不到她。魔法师答应以后，王后就把婚礼定在后天。
        - id: ch06-b07
          speaker: narrator
          text: >-
            波坦蒂拉哀叹自己的命运，苦苦恳求王后饶过她。弗里沃拉给她的唯一安慰，却比绝望还要残酷。
        - id: ch06-b08
          speaker: frivola
          text: >-
            如果你宁愿喝一杯毒药，也不肯嫁给一个富有的丈夫，我当然可以替你准备。
        - id: ch06-b09
          speaker: narrator
          text: >-
            致命的日子终于到了。国王和王后把不幸的波坦蒂拉夹在中间，领进大厅。四面立即响起赞叹她美貌的低语，王后听在耳中，嫉妒得几乎发狂。片刻后，格鲁梅丹从对面的门走进来。他的头发根根直立，身上挂着一个巨大的钱袋，领巾扎成蝴蝶结。斗篷像是用一阵银币雨织成的，里面衬着玫瑰色。
        - id: ch06-b10
          speaker: narrator
          text: >-
            格鲁梅丹对自己的模样满意得没有边。他从来没想过，世上竟会有公主宁愿喝毒药，也不愿嫁给他。事情却偏偏如此。王后开玩笑似的把毒酒递过去，波坦蒂拉立刻接过杯子。
        - id: ch06-b11
          speaker: potentilla
          text: >-
            啊！亲爱的纳西瑟斯，我来找你了！
          emotion: sad
        - id: ch06-b12
          speaker: narrator
          text: >-
            她正要把那杯致命的毒酒送到唇边，大厅的窗户突然砰然洞开。梅利内特仙女乘着一朵被夕阳照得通红发亮的云彩飘了进来，纳西瑟斯王子紧随其后。满朝的人都望着他们，被眼前耀眼的光彩惊呆了。波坦蒂拉一看见心爱的王子，立刻丢下杯子，欢天喜地地向他跑去。
          
    - id: ch07
      title: 水晶球里的魔法师
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: >-
            格鲁梅丹看见梅利内特，第一念头就是保护自己。仙女却灵巧地绕到他瞎眼的一边，揪住他的睫毛，一路把他拖到大厅的天花板上。她把他吊在那里，任他踢动双腿挣扎了一会儿，好让他记住这个教训。接着，她用魔杖轻轻一点，把他关进一颗悬在屋顶的水晶球，一关就是一千年。
        - id: ch07-b02
          speaker: melinette
          text: >-
            这回你总该学会了。下次一定要听我的话。
          emotion: angry
        - id: ch07-b03
          speaker: narrator
          text: >-
            仙女转向国王和王后，请他们继续举行婚礼，因为她已经带来了一位合适得多的新郎。她又夺走两人的王国。他们的所作所为已经证明，他们实在不配治理国家。仙女把王国交给王子和公主。两人其实并不情愿接受，却没有别的选择，只能服从仙女。不过，他们一直好好照料从前的国王和王后，确保两人想要什么都能得到。
        - id: ch07-b04
          speaker: narrator
          text: >-
            纳西瑟斯王子和波坦蒂拉公主幸福地生活了许多年，受到王国里全体臣民由衷的爱戴。至于那个被关进水晶球的魔法师，我可不相信他如今已经被放出来了。
        - id: ch07-b05
          speaker: narrator
          text: >-
            这个故事原名《潘普雷内拉公主与罗马兰王子》。
