  chapters:
    - id: ch01
      title: The Hidden Princess
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, there lived a King and Queen. Though they died a very long while ago, their tastes and pursuits were much like those of people today. King Cloverleaf loved hunting more than anything. Even so, he gave his kingdom all the care he felt able to spare. That meant he never quite finished folding and unfolding the papers of state. Queen Frivola had once been very pretty and liked to believe she still was. Queens can always arrange that rather easily. Her one occupation in life was the pursuit of amusement. She filled her days with balls, masquerades, and picnics, arranging them one after another as quickly as she could.
        - id: ch01-b02
          speaker: narrator
          text: With the King busy among his horses and dogs, and the Queen surrounded by musicians and actors, the kingdom was badly neglected. Anyone who fancied a town or province simply helped himself to it. Neither ruler troubled about that. They had only one child, Princess Potentilla. She had been beautiful from babyhood, and by the time she was four, Frivola was desperately jealous. The Queen feared that when Potentilla grew up, everyone would admire the Princess more than her.
        - id: ch01-b03
          speaker: narrator
          text: So Frivola had a little house built beyond the palace gardens, beside a river. A high wall surrounded it, and there she imprisoned Potentilla. A nurse who could not speak cared for the child. Everything they needed came through a tiny window in the wall. Guards marched outside with orders to behead anyone who tried to come near, and they would have obeyed without a second thought.
        - id: ch01-b04
          speaker: narrator
          text: The Queen told everyone, with a great show of sorrow, that her daughter was ugly, troublesome, and impossible to love. Hiding her away, she said, was the only thing anyone could do. Frivola repeated the lie so often that the whole court finally believed it.
        - id: ch01-b05
          speaker: narrator
          text: Things remained that way until Potentilla was about fifteen. Then Prince Narcissus arrived at the court, drawn there by all the talk of Queen Frivola's splendid entertainments. He was only a little older than the Princess and as handsome a Prince as anyone could hope to see in a day's journey. For someone his age, he was not terribly scatterbrained either. His father and mother were a King and Queen whose own story may be told another day. They died at almost the same time. Their kingdom went to the eldest of their children, while their youngest son, Narcissus, was placed in the care of the Fairy Melinette.
        - id: ch01-b06
          speaker: narrator
          text: That was a fortunate choice. Melinette was powerful and kind. She taught Narcissus everything that would be useful to him, and even shared some fairy knowledge. When he grew up, she sent him out to discover the world for himself, while secretly watching over him in case he needed help. Before he left, she gave him a ring that made him invisible whenever he slipped it onto his finger. Such rings seem common in fairy tales. You have surely heard of one, even if you have never seen one.
        - id: ch01-b07
          speaker: narrator
          text: During his travels, Narcissus came to Queen Frivola's court. The Queen and all her ladies were delighted with him. The King was very polite too, though he could not understand why everyone was making such a fuss. Narcissus enjoyed the festivities, and the days passed pleasantly. Before long, he heard the court's tale about Potentilla. After years of retelling and exaggeration, the hidden Princess had become a dreadful monster in everyone's imagination.
        - id: ch01-b08
          speaker: narrator
          text: Narcissus grew curious enough to see this supposed monster for himself and decided that the ring would help him do it. He put it on and walked invisibly past the guards. They never even suspected that anyone was near. Climbing the high wall was more difficult. Once he finally reached the other side, though, the quiet beauty of the little garden charmed him. Then he saw a slender, lovely girl wandering among the flowers. For some time he searched in vain for the hideous creature he had heard about. Only then did he understand that the lovely girl must be Potentilla herself. By the time he realized it, he had already fallen deeply in love with her.
        - id: ch01-b09
          speaker: narrator
          text: It would have been hard to find anyone prettier. Potentilla sat beside the brook, weaving blue forget-me-nots into a crown for her flowing golden hair. She cared tenderly for every bird and beast in her little kingdom, and they all loved her and followed her. Narcissus watched her move through the garden as if in a happy dream. Her presence made him suddenly humble, and he did not yet dare to let her see him.
        - id: ch01-b10
          speaker: narrator
          text: At evening, the nurse called Potentilla into the house. Narcissus had to return to the palace before anyone noticed his absence and discovered his secret treasure. Yet he forgot that his changed behavior would give him away. He had once been eager and cheerful about everything. Now he came back dreamy, distant, and quiet. When the ladies teased him with questions, he only blushed and avoided answering. They were certain he had lost his heart, and each of them meant to discover who had won it.
    - id: ch02
      title: A Voice in the Garden
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Every day, Narcissus became more devoted to Potentilla. She filled his thoughts. Invisible, he stayed near her, helped with whatever she did, and searched for anything that might please or amuse her. He always laid his gifts in places where she could not fail to discover them. Potentilla had learned to find pleasure in the smallest things during her quiet, lonely life. Imagine her delight when one unexpected treasure after another began appearing in her path. She was continually wondering what she might find next.
        - id: ch02-b02
          speaker: narrator
          text: Narcissus begged his faithful friend Melinette to send Potentilla dreams about him, so she would recognize him as a friend when he finally appeared. The plan worked so well that Potentilla dreaded waking from those delightful dreams, where a certain Prince Narcissus was always her loving companion.
        - id: ch02-b03
          speaker: narrator
          text: After the dreams had made his name and friendship familiar to her, the invisible Prince took another step. He began talking to Potentilla in the garden. Their conversations grew longer and longer, though he still kept himself hidden from her eyes. At last she begged him so earnestly to appear that he could resist no longer. Before he did, he asked for one promise. No matter what sort of face or figure she saw, she must still love the friend whose voice she knew. Potentilla promised. Narcissus drew the ring from his finger, and to her delight, the Prince standing before her was every bit as handsome as he was charming.
        - id: ch02-b04
          speaker: narrator
          text: Now they were perfectly happy. They spent the whole summer day in Potentilla's favorite place beside the brook. When Narcissus finally had to leave, neither could believe how quickly the hours had passed. Potentilla remained there, dreaming of her wonderful Prince. Trouble was the very last thing in her thoughts.
        - id: ch02-b05
          speaker: narrator
          text: Just then, in a cloud of dust and wood shavings, the enchanter Grumedan came rushing past and caught sight of her. He dropped straight down at her feet. One look at her blue eyes and smiling lips convinced him that he must present himself at once, though he was annoyed to remember that he wore only his second-best cloak.
        - id: ch02-b06
          speaker: narrator
          text: Potentilla sprang up with a terrified cry. Grumedan was no beauty. He was enormous and clumsy, with one eye, long teeth, and a terrible stammer. Still, he thought extremely well of himself. He mistook her terror for delighted surprise, paused to let her admire him, and delivered the finest compliment he could invent. It pleased him greatly. It did not please Potentilla at all. She shuddered and cried out.
        - id: ch02-b07
          speaker: potentilla
          text: Oh, where is my Narcissus?
          emotion: fearful
        - id: ch02-b08
          speaker: grumedan
          text: You want a narcissus, madam? Those flowers are common enough. You shall have all you could wish for.
        - id: ch02-b09
          speaker: narrator
          text: Grumedan gave a pleased chuckle and waved his wand. At once, heaps of fragrant narcissus flowers rose around the Princess until she was half buried. Potentilla would certainly have shown him that these were not the kind of Narcissus she meant. But Melinette had watched the meeting anxiously and decided it was time to interfere. Using the Prince's voice, she whispered into Potentilla's ear.
        - id: ch02-b10
          speaker: melinette
          text: We are in great danger, but I fear only for you, my Princess. Please hide what you truly feel. We must hope a way out will appear.
        - id: ch02-b11
          speaker: narrator
          text: Potentilla was badly shaken by the warning. She feared that Grumedan must have overheard every word. Fortunately, he had been talking loudly all the while, calling her attention to the narcissus flowers and chuckling over his cleverness in producing them. He heard none of Melinette's whispered warning. Potentilla mastered her feelings and answered him very coldly. Her lack of admiration came as a painful blow to his pride.
        - id: ch02-b12
          speaker: potentilla
          text: These are not the flowers I prefer. Please send every one of them away.
        - id: ch02-b13
          speaker: narrator
          text: Grumedan obeyed, then asked to kiss her hand as his reward. Melinette had no intention of allowing that. She appeared in all her fairy splendor and called out to him.
        - id: ch02-b14
          speaker: melinette
          text: Stop, Grumedan. This Princess is under my protection. The smallest impertinence will cost you a thousand years of captivity. If you win Potentilla's heart by ordinary means, I cannot stand against you. But try one of your usual tricks, and I will not tolerate it.
        - id: ch02-b15
          speaker: narrator
          text: Grumedan disliked this declaration very much, but he knew he had no choice. He would have to behave properly and offer Potentilla every delicate attention he could think of, though such manners were quite new to him. Winning so great a beauty seemed worth the effort. Once Melinette felt the Princess was safe, she hurried away to tell Narcissus what had happened.
        - id: ch02-b16
          speaker: narrator
          text: The mere thought of Grumedan as a rival made Narcissus furious. There was no telling what foolish thing he might have done if Melinette had not calmed him. She reminded him how powerful Grumedan was. If provoked, he might take revenge on Potentilla. He was the most unjust and ill-tempered of all the enchanters, and the Fairy Queen had often punished his wicked deeds.
        - id: ch02-b17
          speaker: narrator
          text: Once, Grumedan had been imprisoned inside a tree and escaped only when a furious wind blew it down. Another time, he was trapped beneath a huge stone at the bottom of a river until chance turned the stone over. Nothing ever improved him. At last, Melinette made Narcissus promise to remain invisible whenever he visited Potentilla. She was sure that would make everything easier for them all.
    - id: ch03
      title: A Contest for Potentilla
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: And so a contest began. Narcissus acted under Melinette's name, and he and Grumedan each tried to delight Potentilla and win her approval. First, the Prince befriended every bird in her little garden. He taught them to sing her name and praise her through their sweetest trills and most tender melodies. All day, their songs told Potentilla how dearly he loved her.
        - id: ch03-b02
          speaker: narrator
          text: Grumedan declared that there was nothing new in that. Birds had sung since the world began, he said, and every lover imagined that they sang for him alone. He would write an opera himself, something completely new and truly worth hearing.
        - id: ch03-b03
          speaker: narrator
          text: When the performance began, it lasted for five weary hours. Ten thousand frogs chanted one rather poor little verse with all their strength.
        - id: ch03-b04
          speakers: [first_frog, second_frog, third_frog]
          ensemble: chorus
          text: Admirable Potentilla, do you think it kind or wise to strike a poor enchanter dead with those two eyes?
        - id: ch03-b05
          speaker: narrator
          text: The absurd verse amused Potentilla a little the first time she heard it. Then the frogs repeated it again and again. Before the five hours ended, she was nearly dead from weariness. Narcissus stayed invisibly beside her, whispering into her ear and turning her attention away from the performance. Without him, there was no telling how the poor Princess could have endured it. Grumedan noticed none of her misery. He was too busy urging the ten thousand frogs to greater effort. He never allowed them a moment's rest, and many of the poor creatures died from exhaustion before the opera was done.
        - id: ch03-b06
          speaker: narrator
          text: For his next entertainment, Narcissus sent a fleet of boats up the little river. They looked exactly like the famous ships of Cleopatra. The great Queen reclined upon the most richly decorated vessel. Potentilla watched in wonder as Cleopatra stepped majestically ashore and placed her celebrated pearl in the Princess's hands.
        - id: ch03-b07
          speaker: cleopatra
          text: You are more beautiful than I ever was. Learn from my example, and use your beauty more wisely than I used mine.
        - id: ch03-b08
          speaker: narrator
          text: Then the little fleet sailed away and disappeared around the bends of the river. Grumedan had watched the whole display. He spoke with great contempt.
        - id: ch03-b09
          speaker: grumedan
          text: I cannot see what is amusing about those puppets. Such a commotion over one pearl! If pearls please you, madam, I can give you something better.
        - id: ch03-b10
          speaker: narrator
          text: He pulled a whistle from his pocket and blew it. At once, the river began to bubble, and its clear water turned muddy. A moment later, hundreds of thousands of enormous oysters rose from the depths. They dragged themselves out of the river and climbed toward Potentilla, slowly and with great difficulty. One after another, they opened their shells and laid every pearl they possessed at her feet.
        - id: ch03-b11
          speaker: grumedan
          text: Now those are what I call pearls!
          emotion: happy
        - id: ch03-b12
          speaker: narrator
          text: There were enough to pave every path in the garden, with plenty left over. The following day, Narcissus prepared a leafy arbor for Potentilla. Moss covered its couches, grass carpeted its floor, and garlands hung everywhere. Her name appeared in blossoms of many colors. A delicate feast waited inside while hidden musicians played softly and silver fountains fell into marble basins.
        - id: ch03-b13
          speaker: narrator
          text: When the music ended, a single nightingale filled the stillness with a lovely new song. Potentilla knew the voice of one of her favorite birds.
        - id: ch03-b14
          speaker: potentilla
          text: Philomel, my sweet friend, who taught you that new song?
        - id: ch03-b15
          speaker: philomel
          text: Love taught me, my Princess.
        - id: ch03-b16
          speaker: narrator
          text: Grumedan was deeply displeased. He called the whole entertainment unbearably dull.
        - id: ch03-b17
          speaker: grumedan
          text: Is there nothing in this place except little birds that squeak? And who gives a banquet without a single piece of plate?
        - id: ch03-b18
          speaker: narrator
          text: The next morning, when Potentilla entered her garden, she found a summerhouse made of solid gold. Inside and out, it bore her initials joined with Grumedan's. An enormous meal had been spread within it. The table glittered with golden cups and plates, pitchers and serving dishes, candlesticks, and a hundred other objects. Everything shone so fiercely that Potentilla could hardly look at it for long. Grumedan sat down and ate as much as six ogres. The Princess, sickened by the entertainment and its giver, could not bring herself to touch a single morsel. After some time, the enchanter looked up from his feast and grinned at her.
        - id: ch03-b19
          speaker: grumedan
          text: I brought no musicians or singers. Since you seem so fond of music, I shall sing for you myself.
        - id: ch03-b20
          speaker: narrator
          text: His voice sounded like a screech owl. He began chanting the words of his opera again. Fortunately, this performance was shorter, and there were no frogs to join him.
        - id: ch03-b21
          speaker: narrator
          text: Narcissus next called on his friends the birds. They came from all the country around, and he fastened a tiny lamp of brilliant color around each neck. After dark, the birds performed a hundred graceful tricks for Potentilla. She clapped with delight when they wrote her name in points of light against the dark trees. Then the whole flock became bouquets of glowing color, like flowers alive in the night.
        - id: ch03-b22
          speaker: narrator
          text: Grumedan leaned back in his chair with one knee over the other and his nose in the air. He watched disdainfully.
        - id: ch03-b23
          speaker: grumedan
          text: Oh, so fireworks are what you like, Princess.
        - id: ch03-b24
          speaker: narrator
          text: The next night, every will-o'-the-wisp in the country came dancing across the plain below Potentilla's windows. She stood looking out and began to enjoy the strange lights. Without warning, a terrible volcano sprang from the ground. Smoke and flames poured upward, and the sight terrified her. Instead of caring that he had frightened the Princess he hoped to please, Grumedan found her fear intensely amusing. His laughter sounded like a whole pack of wolves fighting among themselves.
        - id: ch03-b25
          speaker: narrator
          text: Then as many will-o'-the-wisps as could fit crowded into the garden. By their light, the tall yew trees danced minuets. At last, Potentilla was exhausted and begged not to see another entertainment that night.
        - id: ch03-b26
          speaker: narrator
          text: Potentilla tried to remain polite to the tiresome old enchanter, though she detested him. Even Grumedan could see that he had failed to please her. He began to suspect that she loved someone else, and that Melinette was not the only person behind the wonders he had seen. After much thought, he formed a plan to learn the truth.
    - id: ch04
      title: Grumedan's Trap
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Grumedan went to Potentilla without warning. He announced that he was most unwillingly forced to leave her and had come to say farewell. The Princess could barely hide her delight. The moment his back was turned, she begged Narcissus to become visible again.
        - id: ch04-b02
          speaker: narrator
          text: Anxiety and annoyance had made the poor Prince quite thin. He was only too glad to grant her request. They greeted each other joyfully, sat down for a comfortable talk, and began enjoying the thought that Grumedan had finally failed.
        - id: ch04-b03
          speaker: narrator
          text: They had scarcely settled down when Grumedan burst from behind a bush in a fury. His farewell had been nothing but a trap. He raised his enormous club and aimed a terrible blow straight at Narcissus. It would certainly have killed the Prince. But the watchful Melinette reached the garden at that very instant. Before the club could fall, she snatched Narcissus out of its path and carried him away at lightning speed to her castle in the air.
        - id: ch04-b04
          speaker: narrator
          text: Poor Potentilla had no comfort from knowing this, because she had not seen the rescue. The moment Grumedan threatened her beloved Prince, she gave one piercing scream and fell backward, unconscious. When her senses returned, Narcissus was gone. She felt more certain than ever that Grumedan had killed him. Melinette was nowhere near her now, and Potentilla believed that no one remained to defend her from the hateful old enchanter.
        - id: ch04-b05
          speaker: narrator
          text: Grumedan was in a dreadful temper. He stormed toward the helpless Princess.
        - id: ch04-b06
          speaker: grumedan
          text: Listen to me, madam. Whether you love that worthless young Prince does not matter. You are going to marry me, so accept it. I am leaving now to arrange everything. And to keep you out of mischief while I am gone, I had better put you to sleep.
          emotion: angry
        - id: ch04-b07
          speaker: narrator
          text: He waved his wand over Potentilla. She fought with all her strength to keep her eyes open, but she fell into a deep, dreamless sleep.
        - id: ch04-b08
          speaker: narrator
          text: Grumedan wanted an entrance worthy of him at the King's palace. Outside the garden, he climbed into a gigantic chariot. Its heavy wheels and oak-trunk shafts were made of solid gold. Forty-eight strong oxen struggled to pull it. Grumedan lounged at ease against his great club with a tawny African lion on his knee, as carelessly as if it were a lapdog.
        - id: ch04-b09
          speaker: narrator
          text: The forty-eight oxen hauled that extraordinary chariot to the palace gates at about seven in the morning. King Cloverleaf was already awake and preparing to set out on a hunting expedition. Queen Frivola, after a long night of amusement, had only just fallen into her first sleep. Anyone who dared to wake her then would have needed a great deal of courage.
        - id: ch04-b10
          speaker: narrator
          text: The King was greatly annoyed at having to receive a visitor. He pulled off his hunting boots again, making faces all the while. In the hall, Grumedan stamped about and shouted.
        - id: ch04-b11
          speaker: grumedan
          text: Where is the King? Tell him I must see him, and his wife as well!
          emotion: angry
        - id: ch04-b12
          speaker: narrator
          text: Cloverleaf listened from the top of the stairs and thought this very impolite. He consulted his favorite huntsman, then followed the man's advice and went down. The golden chariot stopped him in amazement. While the King stared, Grumedan strode up.
        - id: ch04-b13
          speaker: grumedan
          text: Shake my hand, Cloverleaf, old fellow! Surely you know me.
        - id: ch04-b14
          speaker: king_cloverleaf
          text: No, I am afraid I cannot say that I do.
        - id: ch04-b15
          speaker: grumedan
          text: Why, I am the enchanter Grumedan, and I have come to make your fortune. Let us go inside and discuss it.
        - id: ch04-b16
          speaker: narrator
          text: Grumedan dismissed the oxen. They bounded away like stags and vanished almost at once. With one strike of his club, he turned the massive chariot into a mountain of gold coins.
        - id: ch04-b17
          speaker: grumedan
          text: That is for your servants, so they can drink to my health.
        - id: ch04-b18
          speaker: narrator
          text: Naturally, the servants rushed toward the mountain of coins, and a great scramble followed. Their laughter and shouting grew so loud that it finally woke the Queen. Frivola rang for her maids and demanded to know why the palace was in such an uproar. Each maid tried to tell the story first. All of them spoke breathlessly, and every account was different. The Queen could distinguish only a jumble of words about oxen, gold, a club, a giant, and a lion. She decided that every one of her maids had lost her mind.
        - id: ch04-b19
          speaker: narrator
          text: Meanwhile, Cloverleaf asked what honor had brought the enchanter to his palace. Grumedan refused to explain until the Queen appeared. Messenger after messenger hurried to beg her to come. Frivola was furious at being awakened so rudely. She declared that her little finger hurt and that nothing could persuade her to leave her room.
        - id: ch04-b20
          speaker: narrator
          text: When Grumedan heard this, he insisted.
        - id: ch04-b21
          speaker: grumedan
          text: Take my club to Her Majesty. Tell her to smell the end of it. She will find it wonderfully refreshing.
        - id: ch04-b22
          speaker: narrator
          text: Four of the King's strongest men staggered away beneath the club. After some persuasion, the Queen agreed to try the strange cure. The instant she smelled it, she announced that she felt perfectly restored. Perhaps the wood had a healing scent. Or perhaps it was because a shower of magnificent jewels tumbled from the club as soon as she touched it. You may decide.
        - id: ch04-b23
          speaker: narrator
          text: Now Frivola could hardly wait to meet the stranger. She threw on her royal mantle, set her second-best diamond crown over her nightcap, and dabbed plenty of rouge onto both cheeks. Since she was not accustomed to appearing in full daylight, she held her largest fan before her nose and minced into the great hall.
        - id: ch04-b24
          speaker: narrator
          text: The Enchanter waited for the King and Queen to sit upon their throne. Then he placed himself between them and began his speech.
        - id: ch04-b25
          speaker: grumedan
          text: My name is Grumedan. I am an enchanter with excellent connections and immense power. Your daughter Potentilla has charmed me so completely that I cannot live without her. She imagines she loves a contemptible puppy named Narcissus, but I have dealt with him. I do not care whether you approve of our marriage. Still, I must ask because that meddling Fairy Melinette is someone I prefer not to offend.
        - id: ch04-b26
          speaker: narrator
          text: This terrible suitor left the King and Queen unsure what to say. At last, they asked for time to discuss the matter. Their subjects, they explained, might object if the heir to the throne married with no more thought than a dairymaid.
        - id: ch04-b27
          speaker: grumedan
          text: Take a day or two if you must. For now, I shall send for your daughter. Perhaps you can persuade her to be reasonable.
        - id: ch04-b28
          speaker: narrator
          text: He drew out his favorite whistle and blew one piercing note. The great lion had been sleeping in the sunny courtyard. Now it bounded into the hall on silent, heavy paws.
        - id: ch04-b29
          speaker: grumedan
          text: Orion, fetch the Princess and bring her here at once. Be gentle with her.
        - id: ch04-b30
          speaker: narrator
          text: Orion raced through the gardens, scattering the guards in every direction. He cleared the wall in one leap, lifted the sleeping Princess onto his back, and held her safely there by gripping her robe between his teeth. In less than five minutes, he stood with her before the astonished King and Queen.
        - id: ch04-b31
          speaker: narrator
          text: Grumedan held his club close to Potentilla's nose. Its strange power woke her at once. She opened her eyes in an unfamiliar hall, saw the detested Grumedan beside her, and screamed in terror. Frivola had stood watching, rigid with displeasure at the sight of the lovely Princess. Now the Queen stepped forward with a great show of motherly concern. She suggested taking Potentilla to her private rooms, where the poor girl could enjoy the peace and quiet she so plainly needed.
        - id: ch04-b32
          speaker: narrator
          text: In truth, Frivola wanted as few people as possible to see her daughter. She covered Potentilla with a veil, led her away, and locked her securely inside.
    - id: ch05
      title: The Wedding in the Great Hall
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: All this while, Narcissus remained Melinette's prisoner in her castle in the air. Splendor surrounded him, and he might have enjoyed countless pleasures, but he thought only of returning to Potentilla. The Fairy left him there, promising to do everything she could. She ordered her swallows and butterflies to wait on him and obey his wishes.
        - id: ch05-b02
          speaker: narrator
          text: One day, as Narcissus paced sadly back and forth, he thought he heard a familiar voice calling his name. Soon he saw faithful Philomel, Potentilla's favorite bird. The nightingale told him everything that had happened. While the Princess slept, the lion had carried her away. All the birds and four-footed creatures in her little kingdom were grieving over her loss. None of them knew what to do. Philomel had wandered helplessly until he overheard some swallows talking among themselves. They spoke of a Prince who was living in their airy castle, so Philomel flew up to learn whether the prisoner could be Narcissus.
        - id: ch05-b03
          speaker: narrator
          text: The news drove Narcissus nearly wild. Again and again, he tried to escape by leaping from the roof into the clouds. Each time, the clouds caught him, rolled softly upward, and set him back exactly where he had begun. At last, he abandoned the attempt and waited with desperate patience for Melinette to return.
        - id: ch05-b04
          speaker: narrator
          text: Meanwhile, events moved quickly at King Cloverleaf's court. Queen Frivola had made up her mind that a beauty like Potentilla must be removed as soon as possible. She secretly summoned Grumedan and began bargaining with him. First she made him swear that after the marriage, he would never drive her or King Cloverleaf out of their kingdom. Then she required him to take Potentilla far away, to some place where Frivola would never be forced to set eyes on her daughter again. Once Grumedan agreed to both conditions, the Queen arranged for the wedding to take place the day after next.
        - id: ch05-b05
          speaker: narrator
          text: Poor Potentilla mourned her fate and begged to be spared. Frivola offered only one comfort.
        - id: ch05-b06
          speaker: queen_frivola
          text: If you would rather have a cup of poison than a wealthy husband, I can certainly provide one.
        - id: ch05-b07
          speaker: narrator
          text: The fatal day arrived. King Cloverleaf and Queen Frivola led the unhappy Princess into the great hall. Murmurs of admiration rose on every side at Potentilla's beauty, and the Queen nearly went mad with envy.
        - id: ch05-b08
          speaker: narrator
          text: A moment later, Grumedan entered through the door opposite Potentilla. His hair stood straight up on his head. He wore an enormous bag-shaped purse and a cravat tied into a great bow. His mantle appeared to be made from a shower of silver coins, with a rose-colored lining beneath them. The enchanter was boundlessly delighted with his own appearance. It never entered his mind that any Princess could look at such magnificence and still prefer a cup of poison to marrying him.
        - id: ch05-b09
          speaker: narrator
          text: Yet that was exactly what happened. As a cruel joke, Frivola offered Potentilla the fatal cup. The Princess seized it eagerly.
        - id: ch05-b10
          speaker: potentilla
          text: Ah, my beloved Narcissus, I am coming to you!
          emotion: sad
        - id: ch05-b11
          speaker: narrator
          text: Potentilla was lifting the poison to her lips when the great hall's window burst open. Fairy Melinette floated through it upon a glowing cloud of sunset, and Prince Narcissus followed her.
        - id: ch05-b12
          speaker: narrator
          text: The whole court stared in dazzled amazement. The instant Potentilla saw her beloved, she dropped the cup and ran joyfully to meet him.
        - id: ch05-b13
          speaker: narrator
          text: When Grumedan saw Melinette, his first thought was to defend himself. But she slipped around his blind side, caught him by the eyelashes, and dragged him up to the ceiling. She held him there kicking for a while, just to teach him a lesson. Then one touch of her wand shut him inside a crystal ball for a thousand years. The ball hung from the roof of the hall.
        - id: ch05-b14
          speaker: melinette
          text: Perhaps next time, you will remember to do as I tell you.
          emotion: angry
        - id: ch05-b15
          speaker: narrator
          text: With Grumedan safely imprisoned overhead, Melinette turned to Cloverleaf and Frivola. She asked them to proceed with the wedding, because she had brought a much more suitable bridegroom for Potentilla. The Fairy also deprived the King and Queen of their kingdom. Their neglect and their treatment of their daughter had shown that they were truly unfit to manage it. Melinette bestowed the realm upon Narcissus and Potentilla instead. The Prince and Princess were unwilling to take it from Potentilla's parents, but the Fairy gave them no choice except to obey. For their part, the new rulers made certain that Cloverleaf and Frivola were always supplied with everything they could possibly wish for.
        - id: ch05-b16
          speaker: narrator
          text: Prince Narcissus and Princess Potentilla lived long and happily, loved by all their subjects.
        - id: ch05-b17
          speaker: narrator
          text: As for the Enchanter, I do not believe anyone has let him out yet.
