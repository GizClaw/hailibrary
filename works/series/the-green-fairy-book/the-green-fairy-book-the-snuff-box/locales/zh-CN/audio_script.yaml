audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，像编书人面对孩子娓娓而谈，讽刺处轻巧含笑
        timbre: 温暖清朗
        pace: 舒缓而有自然起伏
        pitch: 中音
    young_man:
      display_name: 年轻人
      tts:
        delivery: 坦率机敏，历尽艰辛时疲惫却执着
        timbre: 清朗温厚
        pace: 适中
        pitch: 中音
    snuff_box:
      display_name: 鼻烟盒
      tts:
        delivery: 简短神秘，不动声色
        timbre: 清脆空灵
        pace: 稍慢
        pitch: 中高音
    king:
      display_name: 国王
      tts:
        delivery: 威严直率，面对奇迹时惊叹而热切
        timbre: 洪亮厚实
        pace: 适中
        pitch: 中低音
    queen:
      display_name: 王后
      tts:
        delivery: 嫉妒冷酷，得意时急切果断
        timbre: 冷峭清晰
        pace: 适中偏快
        pitch: 中音
    moon_mother:
      display_name: 月亮的母亲
      tts:
        delivery: 年迈谨慎，心软时慈和恳切
        timbre: 苍老柔和
        pace: 舒缓
        pitch: 中低音
    moon:
      display_name: 月亮
      tts:
        delivery: 神秘警觉，回答时沉稳直接
        timbre: 清冷悠远
        pace: 缓慢
        pitch: 中低音
    sun_mother:
      display_name: 太阳的母亲
      tts:
        delivery: 年迈警惕，听人诉苦后温厚怜悯
        timbre: 苍老温暖
        pace: 舒缓
        pitch: 中低音
    sun:
      display_name: 太阳
      tts:
        delivery: 炽烈威严，答话时明快笃定
        timbre: 明亮浑厚
        pace: 适中
        pitch: 中低音
    wind_mother:
      display_name: 风的母亲
      tts:
        delivery: 忙碌爽直，劝解儿子时慈爱镇定
        timbre: 苍老朴实
        pace: 适中
        pitch: 中低音
    south_wind:
      display_name: 南风
      tts:
        delivery: 来势猛烈，急躁中带着豪爽
        timbre: 粗犷响亮
        pace: 偏快
        pitch: 低音
  chapters:
    - id: ch01
      title: 会说话的鼻烟盒
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            世上的事往往就是这样。从前有个年轻人，成天在外游历。一天，他走在路上，捡到一只鼻烟盒。盒盖才打开，里面竟传出一句西班牙语。
        - id: ch01-b02
          speaker: snuff_box
          text: 你想要什么？
        - id: ch01-b03
          speaker: narrator
          text: >-
            年轻人吓了一大跳。幸好，他没把盒子扔掉，只赶紧盖紧，收进口袋。他继续走啊，走啊，走啊，心里盘算着，下次再听见这个问题，自己可要好好回答。于是，他又掀开盒盖。
        - id: ch01-b04
          speaker: snuff_box
          text: 你想要什么？
        - id: ch01-b05
          speaker: young_man
          text: 给我满满一帽子金子。
        - id: ch01-b06
          speaker: narrator
          text: >-
            转眼间，帽子就装满了金子。年轻人喜出望外，觉得从此再也不会缺少任何东西。他穿过一片又一片密林，来到一座美丽的城堡前。年轻人围着城堡转来转去，根本不在乎别人看见。住在里面的国王终于注意到了他。
        - id: ch01-b07
          speaker: king
          text: 你在这里做什么？
        - id: ch01-b08
          speaker: young_man
          text: 我只是在看看您的城堡。
        - id: ch01-b09
          speaker: king
          text: 你也想有一座这样的城堡吧？
        - id: ch01-b10
          speaker: narrator
          text: 年轻人没有作声。天黑后，他取出鼻烟盒。
        - id: ch01-b11
          speaker: snuff_box
          text: 你想要什么？
        - id: ch01-b12
          speaker: young_man
          text: >-
            给我造一座城堡。房椽要用金子，屋瓦要用钻石，所有家具都要用金银打造。
        - id: ch01-b13
          speaker: narrator
          text: >-
            他还没说完，一座分毫不差的城堡便立在眼前，正对着国王的王宫。第二天，阳光照得整座华美宅邸闪闪发亮。国王惊得说不出话，仆人们只顾张望，连手里的活儿也忘了。国王穿戴整齐，亲自登门。他直截了当地认定，年轻人一定是位法力强大的王子。他希望大家从此能同住在两座宫殿中的一座，还愿意把女儿嫁给年轻人。一切果然如国王所愿。年轻人娶了公主，夫妻俩住在金碧辉煌的宫殿里，生活得十分快乐。

    - id: ch02
      title: 宫殿越过红海
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            王后却妒忌女婿，也妒忌自己的女儿。公主把鼻烟盒的秘密告诉了母亲，说它能满足他们的一切愿望。王后便收买一名女仆，叫她把宝物偷来。两人天天仔细察看，年轻人晚上究竟把盒子收在哪里。终于有一天，世上的人全都睡熟了，女仆悄悄偷出鼻烟盒，交给从前的女主人。王后欢喜极了，立刻打开盒盖。
        - id: ch02-b02
          speaker: snuff_box
          text: 你想要什么？
        - id: ch02-b03
          speaker: queen
          text: >-
            把我、我丈夫、我的仆人和这座美丽的房子，全都送到红海另一边。我的女儿和她丈夫留下。
        - id: ch02-b04
          speaker: narrator
          text: >-
            年轻夫妻醒来，发现自己回到了旧城堡，鼻烟盒却没了。他们翻遍高处低处，仍然什么也没找到。年轻人明白一刻都不能耽搁，便骑上马，在口袋里塞进尽可能多的金子，马上出发。他走啊，走啊，走啊，把附近的国家踏遍了，却始终找不到盒子。很快，金子花得一文不剩。他仍旧催马赶路，马还有多少力气就跑多快，自己则沿途乞讨为生。
        - id: ch02-b05
          speaker: narrator
          text: >-
            有人劝他去问月亮。月亮走过很远的地方，说不定知道消息。年轻人走啊，走啊，走啊，也不知怎么，竟真的到了月亮的国度。那里有个小老太太，一见他就发出警告。
        - id: ch02-b06
          speaker: moon_mother
          text: >-
            你到这里来做什么？我儿子见到活物就吃。听我的话，别再往前走了，赶紧离开吧。
        - id: ch02-b07
          speaker: narrator
          text: >-
            年轻人没有离开。他把不幸的经历全讲了出来。那只神奇的鼻烟盒被偷走以后，他同妻子分离，也失去了所有东西，如今什么都缺。他想问问走遍远方的月亮，有没有见过一座黄金作房椽、钻石作屋瓦、家具全用金银打造的宫殿。话刚说到这里，月亮就回来了。
        - id: ch02-b08
          speaker: moon
          text: 我闻到了凡人的血肉气味。
        - id: ch02-b09
          speaker: narrator
          text: >-
            月亮的母亲解释说，这是个失去一切的可怜人，不远万里赶来求助。她让年轻人别怕，只管出来。年轻人壮起胆子走到月亮面前。
        - id: ch02-b10
          speaker: young_man
          text: >-
            您有没有碰巧见过一座宫殿？它的房椽是金的，屋瓦是钻石的，家具全由金银打造。那本来是我的房子，现在却让人偷走了。
        - id: ch02-b11
          speaker: moon
          text: 我没见过。不过太阳走得比我远，你最好去问问他。

    - id: ch03
      title: 月亮、太阳与南风
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            年轻人再次上路，马儿能跑多快就跑多快。他还是一路乞讨，也不知怎么，最后来到了太阳的国度。那里也住着一个小老太太。
        - id: ch03-b02
          speaker: sun_mother
          text: 你跑来做什么？快走！难道你没听说，我儿子专吃基督徒吗？
        - id: ch03-b03
          speaker: young_man
          text: >-
            我没听说，可我不会走。我已经苦成这样，死不死都一样。我的东西全没了，尤其是那座举世无双的宫殿。它有黄金房椽、钻石屋瓦，家具也全由金银打造。我找了那么久、走了那么远，世上再没有比我更不幸的人了。
        - id: ch03-b04
          speaker: narrator
          text: >-
            小老太太听得心软，答应把他藏起来。太阳回家以后，马上说自己闻到了基督徒的血肉气味，非要拿那个人当晚餐不可。母亲把年轻人的凄惨遭遇讲给他听，说这个人失去一切，从遥远的地方赶来，只为求他帮忙。太阳终于答应见一见。年轻人走出藏身处，再次询问那座举世无双的宫殿。
        - id: ch03-b05
          speaker: young_man
          text: >-
            您巡游各地时，可曾见过一座宫殿？那里的房椽用金子做成，屋瓦是钻石，家具也全是金银的。
        - id: ch03-b06
          speaker: sun
          text: >-
            我没有见过。风无处不去，能看到别人看不到的东西。要是有谁知道那座宫殿在哪里，那一定是风。
        - id: ch03-b07
          speaker: narrator
          text: >-
            可怜的年轻人又出发了。马儿能走多快，他便走多快，一面赶路，一面乞讨，终于来到风的家。风的母亲正忙着往一只只大桶里灌水。
        - id: ch03-b08
          speaker: wind_mother
          text: >-
            你怎么会想到这里来？我儿子见什么吃什么。他马上就要怒气冲冲地回来了，你可得当心。
        - id: ch03-b09
          speaker: young_man
          text: >-
            我已经什么都不怕了，就算被吃掉也无所谓。有人抢走了我那座举世无双的宫殿，也夺走了里面的一切。我连妻子都离开了，非要走遍世界，把宫殿找回来不可。是太阳叫我来请教风的。
        - id: ch03-b10
          speaker: narrator
          text: >-
            风的母亲把他藏在楼梯下面。不久，南风回来了，整座房子都被吹得根基摇晃。他渴得厉害，却连水也没喝一口。
        - id: ch03-b11
          speaker: south_wind
          text: >-
            我闻到一个基督徒男子的血腥气。快把他交出来，收拾好了给我吃！
        - id: ch03-b12
          speaker: narrator
          text: >-
            母亲劝南风先把眼前的东西吃完喝完，又说这个年轻人十分可怜，连太阳都饶了他的性命，让他来向风求助。接着，她领出年轻人。年轻人说，那座宫殿被人无耻地夺走了，世上一直没人能告诉他宫殿的下落。那里的房椽是金的，屋瓦是钻石的，家具全由金银打造。
        - id: ch03-b13
          speaker: young_man
          text: 你四处游荡时，有没有见过这样的宫殿？
        - id: ch03-b14
          speaker: south_wind
          text: >-
            我见过。今天一整天，我都在那座宫殿上空来回猛吹，可连一片屋瓦也吹不动。
        - id: ch03-b15
          speaker: young_man
          text: 求求你，快告诉我它在哪里！
        - id: ch03-b16
          speaker: south_wind
          text: 那地方远得很，就在红海的另一边。
        - id: ch03-b17
          speaker: narrator
          text: 年轻人已经走了这么远，这句话当然吓不退他。

    - id: ch04
      title: 城堡里的花匠
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            他马上动身，也不知怎么，终于到了那片遥远的土地。年轻人四处打听谁家缺花匠。别人告诉他，城堡的花匠刚刚离开，他也许能得到这个差事。他立刻赶到城堡询问，果然被雇用了，心里别提有多高兴。
        - id: ch04-b02
          speaker: narrator
          text: >-
            此后，他每天大半时间都在同仆人们闲谈，打听主人有多少财富，屋里又收藏着哪些奇妙东西。他渐渐同一个女仆成了朋友。女仆把鼻烟盒的全部来历讲给他听，他便软磨硬泡，求她让自己看上一眼。一天晚上，女仆终于设法拿到了盒子。
        - id: ch04-b03
          speaker: narrator
          text: >-
            在年轻人的央求下，女仆让他看了一眼。年轻人仔细盯着，看她把鼻烟盒藏进女主人卧房里的一个隐秘角落。第二天夜里，所有人都睡熟以后，他悄悄溜进卧房，取回了盒子。想想看，他掀开盒盖时有多欢喜！那个熟悉的问题立刻响了起来。
        - id: ch04-b04
          speaker: snuff_box
          text: 你想要什么？

    - id: ch05
      title: 回到原来的地方
      blocks:
        - id: ch05-b01
          speaker: young_man
          text: >-
            我想要什么？我想要什么？我要和我的宫殿回到原来的地方，还要国王、王后和他们所有的仆人，全都淹死在红海里。
        - id: ch05-b02
          speaker: narrator
          text: >-
            他的话还没有说完，自己已经回到了妻子身边。至于宫殿里其余的人，此刻全都躺在红海海底。故事到这里便结束了。讲述这个故事的人，是塞比约。
