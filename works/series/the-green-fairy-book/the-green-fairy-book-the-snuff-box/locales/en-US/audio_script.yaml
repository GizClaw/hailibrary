  chapters:
    - id: ch01
      title: The Box and the Golden Palace
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: There was once a young man who spent all his time traveling. One day, as he walked along, he found a snuff-box on the ground. He picked it up and opened it.
        - id: ch01-b02
          speaker: snuff_box
          text: What do you want?
        - id: ch01-b03
          speaker: narrator
          text: The box spoke in Spanish, and the young man was terribly frightened. Luckily, he did not throw it away. He snapped it shut, put it in his pocket, and went on, away, away, away. As he walked, he began to think.
        - id: ch01-b04
          speaker: young_man
          text: If it asks me again, I'll be ready with an answer this time.
        - id: ch01-b05
          speaker: narrator
          text: He took out the snuff-box and lifted the lid once more.
        - id: ch01-b06
          speaker: snuff_box
          text: What do you want?
        - id: ch01-b07
          speaker: young_man
          text: Fill my hat with gold.
        - id: ch01-b08
          speaker: narrator
          text: At once, his hat was full. The young man was enchanted. From that day on, he thought, he would never need anything again. He traveled away, away, away through thick forests until he came to a beautiful castle where a King lived.
        - id: ch01-b09
          speaker: narrator
          text: The young man walked round and round the castle without caring who saw him. At last, the King noticed and asked what he was doing there.
        - id: ch01-b10
          speaker: young_man
          text: I was only looking at your castle.
        - id: ch01-b11
          speaker: king
          text: You would like a castle like this one, wouldn't you?
        - id: ch01-b12
          speaker: narrator
          text: The young man gave no answer. But when darkness came, he opened the snuff-box.
        - id: ch01-b13
          speaker: snuff_box
          text: What do you want?
        - id: ch01-b14
          speaker: young_man
          text: Build me a castle with golden laths and diamond tiles. Fill it with furniture made of silver and gold.
        - id: ch01-b15
          speaker: narrator
          text: He had hardly finished before the castle stood in front of him, exactly opposite the King's palace and exactly as he had ordered. When the King woke, the magnificent house was shining in the morning sun. The sight left him speechless. Even his servants kept stopping their work to stare.
        - id: ch01-b16
          speaker: narrator
          text: The King dressed and went to visit the young man. The young man told him plainly that he was a powerful Prince. The King hoped they might all live together in one palace or the other, and he offered the Prince his daughter as a wife. Everything turned out as the King wished. The young man married the Princess, and they lived happily in the palace of gold.
    - id: ch02
      title: The Stolen Palace
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: But the King's wife was jealous of the young man and of her own daughter. The Princess told her mother about the snuff-box that gave them whatever they asked for. So the Queen bribed a servant to steal it.
        - id: ch02-b02
          speaker: narrator
          text: The Queen and the servant watched carefully to see where the box was put away each night. Then, one evening, while the whole world slept, the servant slipped in, stole it, and carried it to her old mistress. The Queen could hardly contain her happiness. At last, the box and all its power belonged to her. She opened the lid.
        - id: ch02-b03
          speaker: snuff_box
          text: What do you want?
        - id: ch02-b04
          speaker: queen
          text: Take me, my husband, my servants, and this beautiful house to the other side of the Red Sea. Leave my daughter and her husband behind.
        - id: ch02-b05
          speaker: narrator
          text: When the young couple woke, they found themselves back in the old castle. Their golden palace and the snuff-box were gone. They searched every place they could think of, high and low, but it was no use. The box had vanished with the palace.
        - id: ch02-b06
          speaker: narrator
          text: The young man knew there was no time to lose. He mounted his horse and filled his pockets with all the gold he could carry. Then he rode away, away, away, searching every neighboring country for the snuff-box. Before long, all his money was gone. Still he pressed on as fast as his horse could carry him, begging for food along the way.
    - id: ch03
      title: The Moon and the Sun
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Someone told the young man to ask the moon for help. The moon traveled far and might know something. So the young man went away, away, away and somehow reached the land of the moon. There he met a little old woman.
        - id: ch03-b02
          speaker: moon_mother
          text: What are you doing here? My son eats every living thing he sees. If you're wise, you'll turn back now.
        - id: ch03-b03
          speaker: narrator
          text: The young man told her his whole sad story. He had owned a wonderful snuff-box that gave him whatever he needed, but someone had stolen it. Now he was separated from his wife, with nothing left to help him. Her son traveled so far that perhaps he had seen a palace with golden laths, diamond tiles, and furniture of silver and gold.
        - id: ch03-b04
          speaker: narrator
          text: Just as he finished, the moon came in.
        - id: ch03-b05
          speaker: moon
          text: I smell mortal flesh and blood.
        - id: ch03-b06
          speaker: moon_mother
          text: An unhappy man has lost everything and traveled all this way to ask for your help. Young man, don't be afraid. Step forward and let him see you.
          emotion: calm
        - id: ch03-b07
          speaker: narrator
          text: The young man went boldly up to the moon.
        - id: ch03-b08
          speaker: young_man
          text: In all your travels, have you happened to see a palace with golden laths, diamond tiles, and furniture of silver and gold? That palace was mine, but someone stole it.
        - id: ch03-b09
          speaker: moon
          text: No, I haven't seen it. The sun travels farther than I do. You had better ask him.
        - id: ch03-b10
          speaker: narrator
          text: The young man left and rode away, away, away as well as his horse could manage. He begged for food as he went, and somehow he reached the land of the sun. There he found another little old woman.
        - id: ch03-b11
          speaker: sun_mother
          text: What are you doing here? Go away! Haven't you heard that my son feeds on Christians?
        - id: ch03-b12
          speaker: young_man
          text: No, I won't go. I am so miserable that I no longer care whether I die. I have lost everything, especially a palace unlike any other in the world. It had golden laths, diamond tiles, and furniture of silver and gold. I've searched far and long, and no one on earth is more unhappy than I am.
          emotion: sad
        - id: ch03-b13
          speaker: narrator
          text: The old woman's heart softened, and she agreed to hide him. When the sun arrived, he knew at once that someone was there.
        - id: ch03-b14
          speaker: sun
          text: I smell Christian flesh. I mean to have it for my dinner.
        - id: ch03-b15
          speaker: narrator
          text: His mother told him the pitiful story of a miserable man who had lost everything and come from far away to ask for help. At last, the sun promised to see him. The young man came out of hiding and begged for news.
        - id: ch03-b16
          speaker: young_man
          text: During your travels, have you seen a palace unlike any other? Its laths are gold, its tiles are diamond, and all its furniture is silver and gold.
        - id: ch03-b17
          speaker: sun
          text: No. But perhaps the wind has seen it. He goes everywhere and sees things no one else can see. If anyone knows where your palace is, the wind does.
    - id: ch04
      title: The Home of the Wind
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Once again, the poor young man set out. His horse carried him as well as it could, and he begged for food along the way. Somehow, at last, he reached the home of the wind. A little old woman was there, busy filling great barrels with water.
        - id: ch04-b02
          speaker: wind_mother
          text: Whatever made you come here? My son eats everything he sees. He'll be home soon, and he'll arrive quite wild. You had better watch out.
        - id: ch04-b03
          speaker: young_man
          text: I am so unhappy that I don't even care if he eats me. Someone robbed me of a palace with no equal anywhere, and took everything inside it too. I have even left my wife behind. I will wander the world until I find it. The sun sent me here to ask the wind for help.
        - id: ch04-b04
          speaker: narrator
          text: The old woman hid him under the staircase. Soon they heard the south wind coming. He swept in with such force that the whole house shook down to its foundations. He was terribly thirsty after his travels, but before he touched the water his mother had prepared, he stopped.
        - id: ch04-b05
          speaker: south_wind
          text: I smell the blood of a Christian man. Bring him out at once and get him ready for me to eat.
        - id: ch04-b06
          speaker: wind_mother
          text: First eat and drink what's here. That poor young man deserves our pity. The sun spared his life so he could come and ask you for help.
        - id: ch04-b07
          speaker: narrator
          text: Then she brought the young man out. He explained that no one had been able to tell him where his palace was, so he had come to the wind.
        - id: ch04-b08
          speaker: young_man
          text: I was shamefully robbed. My palace had golden laths, diamond tiles, and furniture of silver and gold. Have you seen it anywhere in your travels?
        - id: ch04-b09
          speaker: south_wind
          text: Yes. I've been blowing back and forth over it all day, but I couldn't move a single tile.
        - id: ch04-b10
          speaker: young_man
          text: Oh, please tell me where it is!
        - id: ch04-b11
          speaker: south_wind
          text: It's a long way from here, on the other side of the Red Sea.
        - id: ch04-b12
          speaker: narrator
          text: But the traveler was not discouraged. He had already journeyed too far to turn back.
    - id: ch05
      title: The Snuff-box Recovered
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: He set out at once and somehow made his way to that distant land. When he arrived, he asked whether anyone needed a gardener. He heard that the head gardener at the castle had just left, so there might be a place for him.
        - id: ch05-b02
          speaker: narrator
          text: The young man wasted no time. He went straight to the castle and asked for the gardener's position. How happy he was when they hired him!
        - id: ch05-b03
          speaker: narrator
          text: He spent much of each day talking with the servants. He asked about their masters' wealth and listened to everything they said about the marvelous things inside the palace. Before long, he became friendly with one of the maids. She told him the history of the snuff-box and how it had brought the palace there. Then he coaxed her into letting him see the box for himself.
        - id: ch05-b04
          speaker: maid
          text: I'll try to get the snuff-box for you this evening.
        - id: ch05-b05
          speaker: narrator
          text: That evening, the maid managed to get hold of it. The young man watched closely as she hid it in a secret place in her mistress's bedchamber.
        - id: ch05-b06
          speaker: narrator
          text: The next night, when everyone was fast asleep, he crept into the room and took the snuff-box. Imagine his joy when he lifted the lid!
        - id: ch05-b07
          speaker: snuff_box
          text: What do you want?
        - id: ch05-b08
          speaker: young_man
          text: What do I want? What do I want? I want my palace and me returned to the old place. And I want the King, the Queen, and all their servants drowned in the Red Sea.
        - id: ch05-b09
          speaker: narrator
          text: He had barely finished speaking when he found himself back with his wife. Every other person who had lived in the palace was lying at the bottom of the Red Sea.
