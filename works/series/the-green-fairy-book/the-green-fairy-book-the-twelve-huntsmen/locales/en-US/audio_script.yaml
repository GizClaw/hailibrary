  chapters:
    - id: ch01
      title: A Promise at the King's Bedside
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, a King's son was engaged to a Princess he dearly loved. One happy day, while he was sitting beside her, word came that his father was dying and wished to see him before the end.
        - id: ch01-b02
          speaker: young_king
          text: Alas, I have to leave you. Take this ring and wear it to remember me. When I am King, I will come back and bring you home.
          emotion: sad
        - id: ch01-b03
          speaker: narrator
          text: He rode away. When he reached his father, he found the old King gravely ill and close to death.
        - id: ch01-b04
          speaker: old_king
          text: My dearest son, I wanted to see you once more before I die. Please promise that you will marry the woman I have chosen for you.
        - id: ch01-b05
          speaker: narrator
          text: The old King named the daughter of a neighboring King. He was determined that she should become his son's wife. The Prince was so overcome with grief that he could think of nothing but his dying father.
        - id: ch01-b06
          speaker: young_king
          text: Yes, dear Father. Whatever you wish, I will do.
          emotion: sad
        - id: ch01-b07
          speaker: narrator
          text: At that, the King closed his eyes and died. The Prince was proclaimed King. When the customary time of mourning had passed, he believed he must honor the promise he had made. He asked for the neighboring King's daughter in marriage, and her hand was granted at once.
        - id: ch01-b08
          speaker: narrator
          text: His first love heard the news. She grieved so deeply over his desertion that she began to waste away and nearly died.
        - id: ch01-b09
          speaker: princess_father
          text: My dearest child, why are you so unhappy? Tell me what you want, and you shall have it.
        - id: ch01-b10
          speaker: narrator
          text: His daughter thought for a moment before answering.
        - id: ch01-b11
          speaker: first_princess
          text: Dear Father, I want eleven girls who are as close as possible to my own height, age, and appearance.
        - id: ch01-b12
          speaker: princess_father
          text: If it can be done, I will see that you have them.
        - id: ch01-b13
          speaker: narrator
          text: The King had his whole kingdom searched. At last, eleven maidens were found who matched his daughter in height, size, and appearance.
    - id: ch02
      title: The Twelve Royal Huntsmen
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The Princess ordered twelve complete huntsmen's suits, every one exactly alike. The eleven maidens put on eleven of them, and she wore the twelfth. Then she said farewell to her father and rode with the others to the court of the man she had once expected to marry.
        - id: ch02-b02
          speaker: first_princess
          text: Does the King need any huntsmen? If he does, will he take all twelve of us into his service?
        - id: ch02-b03
          speaker: narrator
          text: The King saw the Princess, but he did not recognize her. The twelve looked like fine young men.
        - id: ch02-b04
          speaker: young_king
          text: Yes, I will gladly hire all of you.
        - id: ch02-b05
          speaker: narrator
          text: And so they became the twelve royal huntsmen.
        - id: ch02-b06
          speaker: narrator
          text: Now, the King owned a most remarkable Lion. The Lion knew every hidden and secret thing. One evening, it spoke to the King.
        - id: ch02-b07
          speaker: lion
          text: So, you believe you have twelve huntsmen, do you?
        - id: ch02-b08
          speaker: young_king
          text: Of course I do. They are twelve huntsmen.
        - id: ch02-b09
          speaker: lion
          text: You are wrong. Those twelve are maidens.
        - id: ch02-b10
          speaker: young_king
          text: That cannot be true. How could you prove it?
          emotion: surprised
        - id: ch02-b11
          speaker: lion
          text: Scatter plenty of peas across the floor of your antechamber, and you will soon see. Men step hard and firmly. If they walk over peas, not one will move. Girls step lightly. They slip and slide, and the peas roll everywhere.
        - id: ch02-b12
          speaker: narrator
          text: The King liked the Lion's advice and ordered peas to be scattered across the floor of the antechamber.
    - id: ch03
      title: The Test of the Peas
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Luckily, one of the King's servants had grown very fond of the young huntsmen. He heard about the test and went to warn them.
        - id: ch03-b02
          speaker: servant
          text: The Lion is trying to convince the King that all of you are girls. The King has ordered peas scattered across the antechamber. The Lion says your steps will make them roll about and reveal who you are.
        - id: ch03-b03
          speaker: narrator
          text: The Princess thanked him. After he had gone, she turned to her maidens.
        - id: ch03-b04
          speaker: first_princess
          text: When we cross those peas, do everything you can to tread firmly.
        - id: ch03-b05
          speaker: narrator
          text: The next morning, the King sent for the twelve huntsmen. The antechamber floor was thick with peas, but they walked over them with strong, steady steps. Not one pea rolled away. Not a single pea even stirred. After they left, the King spoke to the Lion.
        - id: ch03-b06
          speaker: young_king
          text: There, you see? You were lying to me. They walk like men.
        - id: ch03-b07
          speaker: lion
          text: They knew you were testing them, so they made themselves walk that way. Put twelve spinning wheels in the antechamber instead. When they pass through, you will see how delighted they are. No man would react like that.
        - id: ch03-b08
          speaker: narrator
          text: Once again, the King liked the advice. He ordered twelve spinning wheels to be placed in the antechamber.
    - id: ch04
      title: The Test of the Spinning Wheels
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The kind servant went straight back to the huntsmen and told them about this new plan. As soon as the Princess was alone with her maidens, she warned them.
        - id: ch04-b02
          speaker: first_princess
          text: Please, do your very best. Do not even look at those spinning wheels.
        - id: ch04-b03
          speaker: narrator
          text: The next morning, the King sent for his twelve huntsmen again. They crossed the antechamber without so much as glancing at the spinning wheels.
        - id: ch04-b04
          speaker: young_king
          text: You have misled me again. They must be men, because they never once looked at the spinning wheels.
        - id: ch04-b05
          speaker: lion
          text: They knew this was another test, so they forced themselves not to look.
        - id: ch04-b06
          speaker: narrator
          text: But the King would no longer believe the Lion. The twelve huntsmen remained in his service and followed him wherever he went. Each day, the King grew fonder of them.
    - id: ch05
      title: The Ring and the True Bride
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: One day, they were all out hunting when a message arrived. The Princess whom the King had promised to marry was on her way and would soon reach the court.
        - id: ch05-b02
          speaker: narrator
          text: When the true bride heard this, it felt as though a knife had pierced her heart. She fainted and fell to the ground.
        - id: ch05-b03
          speaker: narrator
          text: The King feared that something had happened to his dear huntsman. He hurried over to help and began pulling off the huntsman's gloves. Then he saw the ring he had once given his first love.
        - id: ch05-b04
          speaker: narrator
          text: He looked into her face and knew her again. His heart was deeply moved. He kissed her, and when she opened her eyes, he spoke.
        - id: ch05-b05
          speaker: young_king
          text: I am yours, and you are mine. No power on earth can ever change that.
        - id: ch05-b06
          speaker: narrator
          text: The King sent a messenger to the other Princess, asking her to return to her own kingdom without delay.
        - id: ch05-b07
          speaker: young_king
          text: I have found my wife. When a man finds his old key again, he has no need of a new one.
        - id: ch05-b08
          speaker: narrator
          text: The King and his true bride celebrated their wedding with great splendor. And the Lion returned to the King's favor, because it had been telling the truth all along.
