audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，像编书人面对孩子娓娓而谈，幽默处轻巧含笑
        timbre: 温暖清朗
        pace: 舒缓而有自然起伏
        pitch: 中音
    father_king:
      display_name: 公主的父亲
      tts:
        delivery: 威严而感情外露，受奉承时慈爱，醒悟后坦率真诚
        timbre: 洪亮厚实
        pace: 适中偏慢
        pitch: 低音
    elder_princess:
      display_name: 大公主
      tts:
        delivery: 端庄顺从，回答父亲时亲昵而笃定
        timbre: 柔亮圆润
        pace: 适中
        pitch: 中高音
    younger_princess:
      display_name: 小公主
      tts:
        delivery: 真挚聪慧，遭难时坚忍，表明身份与心意时勇敢清楚
        timbre: 清澈明亮
        pace: 适中
        pitch: 中高音
  chapters:
    - id: ch01
      title: 盐一样的爱
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，一位国王有两个女儿，他把她们看得比什么都宝贵。等女儿们长大，国王忽然想知道，她们是否也真心爱自己。他决定，谁最能证明对父亲的一片深情，谁就能继承王国。他先叫来大女儿，问她究竟有多爱父亲。
        - id: ch01-b02
          speaker: elder_princess
          text: >-
            我像爱护自己的眼珠一样爱您！
        - id: ch01-b03
          speaker: narrator
          text: >-
            国王温柔地吻了她，十分满意。
        - id: ch01-b04
          speaker: father_king
          text: >-
            啊，你果然是个好女儿。
          emotion: happy
        - id: ch01-b05
          speaker: narrator
          text: >-
            接着，他把小女儿也叫到面前，问了同样的问题。
        - id: ch01-b06
          speaker: younger_princess
          text: >-
            父亲，我看重您，就像看重饭菜里的盐。
        - id: ch01-b07
          speaker: narrator
          text: >-
            国王一听就沉下了脸。他下令赶小女儿出宫，从此不许她再出现在自己面前。可怜的公主伤心地回到房间，哭个不停。有人提醒她，国王的命令不能违抗，她这才擦干眼泪，把珠宝和最好的衣裳扎成包袱，匆匆离开了自己出生的城堡。

    - id: ch02
      title: 变成牧羊女
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            公主沿着眼前的大路一直走，不知道要去哪里，也不知道今后靠什么生活。她从没学过干活，只记得母亲早年教过的几条持家规矩和几样菜的做法。她担心自己的美貌反而让农妇不肯雇用，便脱下衣裙，换上乞丐穿过的破衣。那身衣服满是裂口，还糊着泥。她又把脸和手涂脏，揉乱头发，四处求一份放鹅或牧羊的差事。农妇们见她这副模样，谁也不肯留下她，只因可怜她，才给一小块面包充饥。
        - id: ch02-b02
          speaker: narrator
          text: >-
            她一连走了许多天，始终找不到活儿，最后才来到一座大农庄。那里正缺牧羊女，主人高高兴兴地雇下了她。一天，她独自在一片荒僻的地方放羊，忽然很想再穿一次自己的华服。她在溪里仔细洗净身体，从一直随身带着的包袱里取出衣裙。破衣一脱，华服一换，不过片刻，那个肮脏的牧羊女便成了一位高贵的小姐。
        - id: ch02-b03
          speaker: narrator
          text: >-
            恰好有位王子打猎迷了路。他远远看见这个美丽姑娘，便想走近瞧清楚。公主发现有人过来，像鸟一样飞进树林。王子追赶时被树根绊倒，爬起来以后，姑娘早已无影无踪。
        - id: ch02-b04
          speaker: narrator
          text: >-
            公主确定自己安全以后，又穿回破衣，把脸和手抹脏。又热又渴的王子随后摸到农庄，讨一杯苹果酒喝，还打听那位放羊的美丽小姐叫什么名字。众人听得大笑，说这里的牧羊女又丑又脏，世上都少见。王子认定其中一定有巫术，赶在牧羊女回来前匆匆离开了。到了晚上，她还成了全农庄的笑柄。

    - id: ch03
      title: 面包里的戒指
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            王子却忘不了林中那惊鸿一瞥。在他看来，宫廷里的小姐没有一个比得上她。后来，他满脑子只有那个姑娘，身体一天天消瘦。父母问他出了什么事，还答应尽力让他恢复快乐。他不敢说真话，怕被人取笑，只说想吃远方那座农庄里的厨娘烤的面包。
        - id: ch03-b02
          speaker: narrator
          text: >-
            这个要求虽怪，国王和王后仍赶紧照办。农庄主人接到王子的命令，牧羊女却一点也不惊讶。她只要了面粉、盐和水，又请大家把烤炉旁边那间放着揉面槽的小屋留给她独用。动手前，她仔仔细细洗净身体，甚至把戒指也戴在手上。烘烤时，一枚戒指不巧从手指滑落，掉进了面团。面包做好，她又抹脏自己，还故意让一团团面糊粘在手指上，恢复了原来的丑模样。
        - id: ch03-b03
          speaker: narrator
          text: >-
            那只面包小得很，送到王子手里以后，他吃得十分香甜。可是刀一切下去，他竟在面包里发现了那枚戒指。王子当即向父母宣布，谁能戴上它，他就娶谁。国王传令全国，远近的贵族小姐都赶来争这份荣耀。可戒指实在太小，连手最纤细的人也只能勉强套进小指。不久，全国的年轻姑娘连同农家姑娘都试过了。国王正要宣布无人合适，王子忽然想起，还有牧羊女没有来。

    - id: ch04
      title: 公主现身
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            牧羊女被带到宫里。她身上仍裹着破衣，双手却比往常干净，戒指轻轻一套就戴上了。王子当众表示，自己一定履行诺言。父母委婉地提醒他，这姑娘不过是个放羊的，而且长得实在难看。她却毫不退缩，勇敢地说出了自己的身份。
        - id: ch04-b02
          speaker: younger_princess
          text: >-
            我生来就是公主。请给我一点水，再让我独自在房间里待几分钟。我会让各位看到，我穿上华服，并不比任何人逊色。
        - id: ch04-b03
          speaker: narrator
          text: >-
            大家给了她水，也让她独自在房间里待了一会儿。公主换上华丽长裙，再次走到众人面前。她美得让所有人立刻明白，眼前正是一位乔装的公主。王子也认出了林中那个曾让自己一见难忘的姑娘。他扑到她脚边，请她嫁给自己。公主讲完身世，又说必须派使者去向父亲请求允准，并请他来参加婚礼。
        - id: ch04-b04
          speaker: narrator
          text: >-
            她的父亲这些日子一直后悔当初太过无情。他找遍全国，却无人知道女儿去了哪里，只好以为她已经死了。如今听说小女儿还活着，又有一位王子向她求婚，他喜出望外，马上带着大女儿赶来参加婚礼。

    - id: ch05
      title: 没有盐的婚宴
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            婚礼宴席上，新娘特意吩咐，只给父亲端不放盐的面包和不加调味的肉。国王吃得愁眉苦脸，几乎没有动筷。坐在一旁的女儿便问，饭菜是不是不合他的口味。
        - id: ch05-b02
          speaker: father_king
          text: >-
            是不合口味。每道菜都做得用心，端上来也很讲究，可实在淡得叫人咽不下去。
          emotion: disgusted
        - id: ch05-b03
          speaker: younger_princess
          text: >-
            父亲，我早就告诉过您，盐是人生中最珍贵的东西。我把您比作盐，是想让您明白我有多爱您。可您以为我轻慢了您，还把我赶走了。
        - id: ch05-b04
          speaker: narrator
          text: >-
            国王紧紧抱住女儿，承认自己误解了她，也承认自己做错了。接下来的婚宴上，人们给他换成放了盐的面包和调好味的菜肴。国王说，这是他一生吃过最美味的一餐。
        - id: ch05-b05
          speaker: narrator
          text: >-
            故事最后，署着塞比约的名字。
