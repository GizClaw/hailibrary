audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and attentive fairy-tale storytelling
        timbre: clear and gently resonant
        pace: measured
        pitch: medium
    princess_father:
      display_name: The Princess's Father
      tts:
        delivery: regal, affectionate, and quick to judgment
        timbre: deep and dignified
        pace: measured
        pitch: low
    elder_princess:
      display_name: The Elder Princess
      tts:
        delivery: polished and eager to please
        timbre: smooth and youthful
        pace: natural
        pitch: medium-high
    younger_princess:
      display_name: The Younger Princess
      tts:
        delivery: sincere, resourceful, and quietly bold
        timbre: clear and youthful
        pace: natural
        pitch: medium
    prince:
      display_name: The Prince
      tts:
        delivery: earnest, romantic, and determined
        timbre: warm and youthful
        pace: natural
        pitch: medium
  chapters:
    - id: ch01
      title: Salt in My Food
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a King with two daughters, and he loved them with all his heart. When they were grown, he suddenly wondered whether they truly loved him in return. He decided to leave his kingdom to the daughter who proved her love best. First he called for the elder Princess.
        - id: ch01-b02
          speaker: princess_father
          text: Tell me, my daughter. How dearly do you love me?
        - id: ch01-b03
          speaker: elder_princess
          text: I love you as dearly as the apple of my eye.
        - id: ch01-b04
          speaker: narrator
          text: The King kissed her tenderly.
        - id: ch01-b05
          speaker: princess_father
          text: Ah, you truly are a good daughter.
          emotion: happy
        - id: ch01-b06
          speaker: narrator
          text: Then he sent for his younger daughter and asked her the same question.
        - id: ch01-b07
          speaker: younger_princess
          text: Father, I think of you as I think of salt in my food.
        - id: ch01-b08
          speaker: narrator
          text: Her answer displeased the King. He ordered her out of his court and told her never to appear before him again. The poor Princess went to her room and wept. But she remembered his command, dried her eyes, and hurried away from the castle where she had been born. She carried a bundle of jewels and her finest dresses.
        - id: ch01-b09
          speaker: narrator
          text: She followed the road without knowing where it led or what would happen to her. No one had ever taught her to earn a living. She knew only a few household rules and some recipes her mother had taught her long ago. She feared that no housewife would hire a girl with such a pretty face, so she chose to make herself look as ugly as she could.
        - id: ch01-b10
          speaker: narrator
          text: She traded her dress for a beggar's dreadful old rags, torn and caked with mud. She rubbed mud over her face and hands and tangled her hair. Then she went from place to place, asking for work as a goose girl or a shepherdess. The farmers' wives wanted nothing to do with such a dirty maiden. They sent her away with only a piece of bread out of charity.
        - id: ch01-b11
          speaker: narrator
          text: Many days passed before she found a large farm that needed a shepherdess. There, at last, they gladly gave her work.
    - id: ch02
      title: The Lady Among the Sheep
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: One day, while the Princess watched the sheep in a lonely stretch of country, she longed to wear her splendid clothes again. She washed carefully in the stream. Since she always kept her bundle near her, she soon cast off the rags and dressed herself like a great lady.
        - id: ch02-b02
          speaker: narrator
          text: The King's son had lost his way while hunting. From far off, he saw the lovely young woman and went closer to look at her. The moment she noticed him, she darted into the woods as swiftly as a bird. He raced after her, but his foot caught on a tree root and he fell. By the time he stood again, she had vanished.
        - id: ch02-b03
          speaker: narrator
          text: Once she knew she was safe, the Princess put her rags back on and covered her face and hands with mud. Meanwhile, the Prince was hot and thirsty. He found the farm and asked for some cider. Then he asked who the beautiful lady was who tended the sheep.
        - id: ch02-b04
          speaker: narrator
          text: Everyone laughed. They told him their shepherdess was among the ugliest and dirtiest creatures under the sun. The Prince decided some witchcraft must be at work. He hurried away before the shepherdess returned, and that evening everyone at the farm made jokes at her expense.
        - id: ch02-b05
          speaker: narrator
          text: Yet the Prince could not forget the lovely maiden he had glimpsed for only a moment. To him, she was more enchanting than any lady at court. Soon he dreamed of no one else. He grew thinner every day until his father and mother asked what troubled him. They promised they would do anything they could to make him happy again.
        - id: ch02-b06
          speaker: narrator
          text: He was afraid they would laugh if he told them the truth. Instead, he made a strange request.
        - id: ch02-b07
          speaker: prince
          text: I would like some bread baked by the kitchen girl at that distant farm.
        - id: ch02-b08
          speaker: narrator
          text: His parents found the wish rather odd, but they hurried to grant it. A message was sent to the farmer, telling him what the Prince wanted.
    - id: ch03
      title: The Ring in the Loaf
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The maiden showed no surprise when she heard the order. She asked for flour, salt, and water. She also asked to work alone in the little room beside the oven, where the kneading trough stood.
        - id: ch03-b02
          speaker: narrator
          text: Before she began, she washed herself carefully and even put on her rings. As she baked, one ring slipped into the dough. When her work was done, she made herself dirty again and left lumps of dough clinging to her fingers until she looked as ugly as before.
        - id: ch03-b03
          speaker: narrator
          text: The tiny loaf was carried to the Prince, and he ate it eagerly. When he cut into it, he discovered the Princess's ring.
        - id: ch03-b04
          speaker: prince
          text: I will marry the girl whose finger fits this ring.
        - id: ch03-b05
          speaker: narrator
          text: The King sent a proclamation throughout the kingdom. Ladies came from far away, each hoping to claim the honor. But the ring was so small that even the women with the tiniest hands could only push it onto a little finger.
        - id: ch03-b06
          speaker: narrator
          text: Before long, every maiden in the kingdom had tried it, including all the peasant girls. The King was ready to announce that no one had succeeded when the Prince realized one woman was missing.
        - id: ch03-b07
          speaker: prince
          text: The shepherdess has not tried the ring yet.
        - id: ch03-b08
          speaker: narrator
          text: They sent for her. She came dressed in rags, though her hands were cleaner than usual. The little ring slipped easily onto her finger.
        - id: ch03-b09
          speaker: prince
          text: Then I will keep my promise and marry her.
    - id: ch04
      title: The Princess Revealed
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The Prince's parents gently pointed out that the girl was only a keeper of sheep, and a very ugly one at that. The maiden answered them boldly.
        - id: ch04-b02
          speaker: younger_princess
          text: I was born a princess. Give me some water and let me have a room to myself for a few minutes. Then I will show you that I can look as fine as anyone in beautiful clothes.
        - id: ch04-b03
          speaker: narrator
          text: They agreed. When she returned in a magnificent dress, she was so beautiful that everyone could see she must truly be a princess in disguise. The King's son recognized the charming maiden he had once seen from afar. He threw himself at her feet.
        - id: ch04-b04
          speaker: prince
          text: Will you marry me?
        - id: ch04-b05
          speaker: narrator
          text: The Princess told them her whole story. She said they would have to send an ambassador to her father, both to ask his consent and to invite him to the wedding.
        - id: ch04-b06
          speaker: narrator
          text: Her father had never stopped regretting how harshly he had treated her. He had searched throughout the land, but no one could tell him where she was. At last he had come to believe she was dead.
        - id: ch04-b07
          speaker: narrator
          text: So he was overjoyed to learn that she lived and that a King's son wished to marry her. He left his kingdom with his elder daughter and traveled to attend the ceremony.
    - id: ch05
      title: The Wedding Feast
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: At the wedding breakfast, the bride gave special orders for her father's meal. His bread was made without salt, and his meat came without any seasoning. He pulled faces at the food and ate very little. His daughter sat beside him and noticed.
        - id: ch05-b02
          speaker: younger_princess
          text: Father, is your dinner not to your liking?
        - id: ch05-b03
          speaker: princess_father
          text: The dishes are prepared with care, but everything tastes dreadfully bland.
          emotion: disgusted
        - id: ch05-b04
          speaker: younger_princess
          text: Didn't I tell you that salt was the best thing in life? When I compared you to salt, I was showing how much I loved you. But you thought I meant little of you, and you drove me away.
        - id: ch05-b05
          speaker: narrator
          text: The King embraced his daughter and admitted that he had been wrong to misunderstand her words. For the rest of the wedding feast, they served him bread made with salt and dishes rich with seasoning.
        - id: ch05-b06
          speaker: princess_father
          text: This is the finest food I have ever tasted.
