audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and attentive fairy-tale storytelling
        timbre: clear and gently resonant
        pace: measured
        pitch: medium
    simon:
      display_name: Simon
      tts:
        delivery: blunt, stubborn, and certain of himself
        timbre: firm and weathered
        pace: deliberate
        pitch: medium-low
    susan:
      display_name: Susan
      tts:
        delivery: kindhearted, earnest, and gently reproachful
        timbre: warm and clear
        pace: natural
        pitch: medium
    cat:
      display_name: The Cat
      tts:
        delivery: weary, alert, and quietly determined
        timbre: light and slightly rough
        pace: natural
        pitch: medium-high
    dog:
      display_name: The Dog
      tts:
        delivery: loyal, plainspoken, and steadfast
        timbre: deep and worn
        pace: unhurried
        pitch: low
    fox:
      display_name: The Fox
      tts:
        delivery: clever, confident, and quick-thinking
        timbre: smooth and bright
        pace: lively
        pitch: medium
    bear:
      display_name: The Bear
      tts:
        delivery: gruff, eager, and easily frustrated
        timbre: deep and rough
        pace: deliberate
        pitch: low
  chapters:
    - id: ch01
      title: Driven from Home
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, a man named Simon lived with his wife, Susan. They had an old cat and an old dog. One day, Simon spoke to his wife about the cat.
        - id: ch01-b02
          speaker: simon
          text: Why should we keep that old cat any longer? She never catches mice now, and she is no use at all. I have decided to drown her.
        - id: ch01-b03
          speaker: susan
          text: Please don't do that. I'm sure she can still catch mice.
        - id: ch01-b04
          speaker: simon
          text: Nonsense. Mice could dance on top of her, and she still wouldn't catch one. The next time I see her, into the water she goes.
        - id: ch01-b05
          speaker: narrator
          text: Susan was miserable when she heard this. So was the cat, who had listened from behind the stove. After Simon left for work, the poor creature mewed pitifully and gazed up into Susan's face. Susan hurried to open the door.
        - id: ch01-b06
          speaker: susan
          text: Run for your life, my poor little cat. Get far away before your master comes home.
        - id: ch01-b07
          speaker: narrator
          text: The cat followed her advice. Her old legs carried her as quickly as they could into the woods. When Simon came home, Susan told him the cat had disappeared.
        - id: ch01-b08
          speaker: simon
          text: She is better off, then. Now that she is gone, we must decide what to do with the old dog. He is deaf and blind. He barks when nothing is wrong and stays quiet when danger comes. I had better hang him.
        - id: ch01-b09
          speaker: susan
          text: Oh, please don't. Surely he isn't completely useless.
        - id: ch01-b10
          speaker: simon
          text: Don't be silly. Thieves could fill the courtyard, and he would never notice. The first time I see him, that will be the end of him.
        - id: ch01-b11
          speaker: narrator
          text: Again, Susan was deeply unhappy. The dog was lying in a corner, and he had heard every word. As soon as Simon left for work, the dog rose and howled so sadly that Susan opened the door at once.
        - id: ch01-b12
          speaker: susan
          text: Run for your life, poor dog, before your master gets home.
        - id: ch01-b13
          speaker: narrator
          text: The dog fled into the woods with his tail between his legs. When Simon returned, Susan told him the dog had vanished too.
        - id: ch01-b14
          speaker: simon
          text: That was lucky for him.
        - id: ch01-b15
          speaker: narrator
          text: But Susan sighed. She had been very fond of the poor old dog.
    - id: ch02
      title: The Fox's War
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: As they wandered through the woods, the cat and dog happened to meet. They had not been the best of friends at home, but among strangers, each was glad to see the other. They sat beneath a holly tree and told each other all their troubles.
        - id: ch02-b02
          speaker: narrator
          text: Before long, a fox came past. He saw the unhappy pair sitting together and asked why they were there and what they had to complain about.
        - id: ch02-b03
          speaker: cat
          text: I have caught many mice in my time. But now I'm old and can no longer work as I once did, so my master wants to drown me.
        - id: ch02-b04
          speaker: dog
          text: Night after night, I watched over my master's house. Now I'm old and deaf, and he wants to hang me.
        - id: ch02-b05
          speaker: fox
          text: That is the way of the world. I will help you win back your master's favor, but first you must help me with a trouble of my own.
        - id: ch02-b06
          speaker: narrator
          text: The cat and dog promised to do all they could. Then the fox explained what had happened.
        - id: ch02-b07
          speaker: fox
          text: The wolf has declared war on me. He is marching this way with the bear and the wild boar, and tomorrow we must fight a fierce battle.
        - id: ch02-b08
          speakers: [dog, cat]
          ensemble: duo
          text: We will stand beside you. If we are killed, it is better to die in battle than to meet a shameful death at home.
        - id: ch02-b09
          speaker: narrator
          text: They shook paws, and the bargain was made. The fox sent word telling the wolf where to meet him. Then the fox, the dog, and the cat set out to face their enemies.
    - id: ch03
      title: The Battle beneath the Oak
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The wolf, the bear, and the wild boar reached the meeting place first. After they had waited a while for the fox and his companions, the bear offered to climb the oak tree and watch for them.
        - id: ch03-b02
          speaker: bear
          text: I'll climb up and see whether they are coming.
        - id: ch03-b03
          speaker: narrator
          text: The first time the bear looked around, he saw nothing.
        - id: ch03-b04
          speaker: bear
          text: There is no sign of them.
        - id: ch03-b05
          speaker: narrator
          text: The bear looked a second time.
        - id: ch03-b06
          speaker: bear
          text: I still can't see anything.
        - id: ch03-b07
          speaker: narrator
          text: When he looked for the third time, something appeared in the distance.
        - id: ch03-b08
          speaker: bear
          text: A mighty army is coming, and one warrior is carrying the biggest lance I have ever seen!
        - id: ch03-b09
          speaker: narrator
          text: The great lance was really the cat's tail, held straight up as she marched. The wolf, the bear, and the boar laughed and mocked their approaching enemies. The day was hot, and the bear decided they still had hours to wait.
        - id: ch03-b10
          speaker: bear
          text: At this pace, they won't arrive for a long time. I'll curl up in the fork of the tree and take a little nap.
        - id: ch03-b11
          speaker: narrator
          text: The wolf lay down beneath the oak. The wild boar burrowed into some straw until only one ear could be seen. While all three rested there, the fox, the cat, and the dog arrived.
        - id: ch03-b12
          speaker: narrator
          text: The cat spotted the wild boar's ear among the straw. She mistook it for a mouse and pounced on it. The boar sprang up in a dreadful fright, let out one loud grunt, and vanished into the woods.
        - id: ch03-b13
          speaker: narrator
          text: The cat was even more frightened than the boar. Spitting in terror, she scrambled into the fork of the oak and landed right in the bear's face. Now the bear was alarmed. With a mighty growl, he leaped from the tree, fell straight onto the wolf, and killed him as dead as a stone.
    - id: ch04
      title: The Cat Comes Home
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: On the way home from the war, the fox caught twenty mice. When they reached Simon's cottage, he placed every mouse on the stove. Then he turned to the cat.
        - id: ch04-b02
          speaker: fox
          text: Fetch the mice one by one, and lay each of them before your master.
        - id: ch04-b03
          speaker: cat
          text: Very well. I'll do just as you say.
        - id: ch04-b04
          speaker: narrator
          text: And that was exactly what she did. When Susan saw the cat carrying in the mice, she called to her husband.
        - id: ch04-b05
          speaker: susan
          text: Look! Our old cat has come home. Just see how many mice she has caught.
        - id: ch04-b06
          speaker: simon
          text: Wonders will never cease! I never imagined that old cat would catch another mouse.
          emotion: surprised
        - id: ch04-b07
          speaker: susan
          text: There, you see? I always said she was an excellent cat. But you men always think you know best.
    - id: ch05
      title: The Dog's Warning
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Meanwhile, the fox had another plan. Simon had just killed a pig, and the fox told the dog what to do once darkness came.
        - id: ch05-b02
          speaker: fox
          text: Wait until it grows a little darker. Then go into the courtyard and bark with all your might.
        - id: ch05-b03
          speaker: dog
          text: All right. I will.
        - id: ch05-b04
          speaker: narrator
          text: As soon as dusk fell, the dog began barking loudly. Susan heard him first.
        - id: ch05-b05
          speaker: susan
          text: Our dog must be back. I can hear him barking with all his strength. Please go outside and see what is wrong. Thieves may be taking our sausages.
        - id: ch05-b06
          speaker: simon
          text: That foolish animal is as deaf as a post. He always barks at nothing.
        - id: ch05-b07
          speaker: narrator
          text: Simon refused to get up. Early the next morning, Susan prepared to walk to church in the neighboring town. She meant to take some sausages to her aunt, who lived there. But when Susan entered the larder, every sausage was gone, and a great hole had been torn in the floor. She called out to Simon.
        - id: ch05-b08
          speaker: susan
          text: I was right! Thieves came here last night, and they didn't leave us a single sausage. If only you had gotten up when I asked you!
        - id: ch05-b09
          speaker: narrator
          text: Simon scratched his head.
        - id: ch05-b10
          speaker: simon
          text: I don't understand it at all. I truly never thought the old dog could hear so well.
        - id: ch05-b11
          speaker: susan
          text: I always told you he was the best dog in the world. But as usual, you thought you knew better. Men are the same everywhere.
        - id: ch05-b12
          speaker: narrator
          text: The fox had won something too. He was the one who had carried away all the sausages!
