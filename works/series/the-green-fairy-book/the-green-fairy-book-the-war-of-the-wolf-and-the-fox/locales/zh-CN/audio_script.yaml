audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，像编书人面对孩子娓娓而谈，幽默处轻巧含笑
        timbre: 温暖清朗
        pace: 舒缓而有自然起伏
        pitch: 中音
    simon:
      display_name: 西蒙
      tts:
        delivery: 粗直固执，说起话来总认定自己不会错
        timbre: 坚实而略显苍老
        pace: 稍慢
        pitch: 中低音
    susan:
      display_name: 苏珊
      tts:
        delivery: 心地柔软，言语恳切，责备丈夫时温和却有分量
        timbre: 温暖清晰
        pace: 自然
        pitch: 中音
    cat:
      display_name: 老猫
      tts:
        delivery: 年迈疲惫，却仍警醒而有决断
        timbre: 轻细微哑
        pace: 自然
        pitch: 中高音
    dog:
      display_name: 老狗
      tts:
        delivery: 忠厚朴实，语气坚定
        timbre: 低沉沧桑
        pace: 从容
        pitch: 低音
    fox:
      display_name: 狐狸
      tts:
        delivery: 机敏自信，出主意时爽快利落
        timbre: 圆润明亮
        pace: 轻快
        pitch: 中音
    bear:
      display_name: 熊
      tts:
        delivery: 粗声粗气，自信却容易慌张
        timbre: 低沉粗粝
        pace: 稍慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 被赶出家门
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，西蒙和妻子苏珊养着一只老猫和一条老狗。有一天，西蒙对苏珊说起了那只猫。
        - id: ch01-b02
          speaker: simon
          text: >-
            这只老猫留着还有什么用？它现在连一只耗子也捉不到。我已经想好了，要把它淹死。
        - id: ch01-b03
          speaker: susan
          text: >-
            别这么做。我相信它还能捉耗子。
        - id: ch01-b04
          speaker: simon
          text: >-
            胡说。耗子就是在它身上跳舞，它也抓不住。下次让我见到它，我就把它扔进水里。
        - id: ch01-b05
          speaker: narrator
          text: >-
            苏珊听了很难过。躲在火炉后面的猫也听见了，更是伤心。西蒙一出门干活，它就凄惨地叫起来，还抬头眼巴巴地望着苏珊。苏珊心一软，赶忙打开门。
        - id: ch01-b06
          speaker: susan
          text: >-
            快逃命吧，可怜的小东西！趁主人没回来，逃得越远越好。
        - id: ch01-b07
          speaker: narrator
          text: >-
            老猫听了她的话，用那双衰老的腿拼命跑进树林。西蒙回家以后，苏珊告诉他，猫已经不见了。
        - id: ch01-b08
          speaker: simon
          text: >-
            那是它运气好。猫走了，现在该想想怎么处置老狗。它又聋又瞎，没事的时候乱叫，真出事却一声不响。最好还是把它吊死。
        - id: ch01-b09
          speaker: susan
          text: >-
            求你别这么做。它总不会一点用也没有。
        - id: ch01-b10
          speaker: simon
          text: >-
            别犯傻。哪怕院子里站满了贼，它也发现不了。下次让我看见它，它就活到头了。
        - id: ch01-b11
          speaker: narrator
          text: >-
            这番话让苏珊难受极了。躺在屋角的老狗也把每个字都听进了耳朵。西蒙才出门，它就站起来，哀哀地长嗥。苏珊立刻又打开了门。
        - id: ch01-b12
          speaker: susan
          text: >-
            可怜的老狗，快逃吧，别等主人回来！
        - id: ch01-b13
          speaker: narrator
          text: >-
            老狗夹着尾巴逃进树林。西蒙回家时，苏珊告诉他，狗也不见了。
        - id: ch01-b14
          speaker: simon
          text: >-
            那也算它运气好。
        - id: ch01-b15
          speaker: narrator
          text: >-
            苏珊却叹了口气。她一直很疼爱这条可怜的老狗。

    - id: ch02
      title: 狐狸的战争
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            猫和狗在路上碰巧遇见了。它们从前在家里不算要好，如今到了陌生地方，能见到老相识，彼此都很高兴。它们坐在冬青树下，把自己的苦处一股脑儿说了出来。
        - id: ch02-b02
          speaker: narrator
          text: >-
            没过多久，一只狐狸从旁边经过。它见两个伙伴愁眉苦脸地坐着，便问它们为什么待在这里，又有什么可抱怨的。
        - id: ch02-b03
          speaker: cat
          text: >-
            我年轻时捉过不知多少耗子。现在我老了，干不动了，主人就想淹死我。
        - id: ch02-b04
          speaker: dog
          text: >-
            我替主人守了多少个夜晚。如今我又老又聋，他却要把我吊死。
        - id: ch02-b05
          speaker: fox
          text: >-
            世道就是这样。我能让你们重新得到主人的欢心，不过，你们得先替我解决一个麻烦。
        - id: ch02-b06
          speaker: narrator
          text: >-
            猫和狗都答应尽力帮忙，狐狸这才说出了自己的难处。
        - id: ch02-b07
          speaker: fox
          text: >-
            狼向我宣战了。它正带着熊和野猪往这边来。明天，我们免不了一场恶战。
        - id: ch02-b08
          speakers: [dog, cat]
          ensemble: duo
          text: >-
            好，我们跟你并肩作战！就算战死，也比窝窝囊囊地死在家里强。
        - id: ch02-b09
          speaker: narrator
          text: >-
            它们握了握爪子，就这样说定了。狐狸派人送信，约狼到一个地方相见。随后，狐狸带着猫和狗出发，去迎战狼和它的伙伴。

    - id: ch03
      title: 橡树下的大战
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            狼、熊和野猪先到了约定的地方。它们等了好一阵，还不见狐狸一伙的影子，熊便打算爬到橡树上瞭望。
        - id: ch03-b02
          speaker: bear
          text: >-
            我爬上去看看，它们到底来了没有。
        - id: ch03-b03
          speaker: narrator
          text: >-
            熊第一次四下张望，什么也没发现。
        - id: ch03-b04
          speaker: bear
          text: >-
            一个影子也没有。
        - id: ch03-b05
          speaker: narrator
          text: >-
            它又看了一次。
        - id: ch03-b06
          speaker: bear
          text: >-
            还是什么也看不见。
        - id: ch03-b07
          speaker: narrator
          text: >-
            等到第三次张望，远处终于有东西出现了。
        - id: ch03-b08
          speaker: bear
          text: >-
            远处来了一支大军！有个战士还扛着一根长矛，那可是我见过最大的一根！
        - id: ch03-b09
          speaker: narrator
          text: >-
            那根了不得的长矛，其实只是老猫高高竖起的尾巴。它正跟在狐狸身旁，一步步朝这边走来。狼、熊和野猪听明白后，都放声嘲笑起来。天气热得很，熊觉得敌人还要很久才能走到。
        - id: ch03-b10
          speaker: bear
          text: >-
            照这个走法，它们几个钟头也到不了。我蜷在树杈上，先睡一会儿。
        - id: ch03-b11
          speaker: narrator
          text: >-
            狼躺在橡树底下。野猪钻进一堆麦秸，只把一只耳朵露在外面。它们刚歇下不久，狐狸、猫和狗就到了。
        - id: ch03-b12
          speaker: narrator
          text: >-
            老猫看见麦秸里露出一只耳朵，还以为那里藏着耗子，猛地扑了上去。野猪吓得跳起来，大声哼叫了一下，转眼逃进树林。
        - id: ch03-b13
          speaker: narrator
          text: >-
            老猫受的惊吓更大。它嘶嘶叫着爬上橡树，偏偏撞到了树杈上的熊脸。熊也慌了。它咆哮一声，从树上跳下去，正好重重砸在狼身上，把狼压得像石头一样死透了。

    - id: ch04
      title: 老猫回家
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            大战过后，狐狸在回去的路上捉了二十只耗子。到了西蒙的小屋，它把耗子全放在火炉上，叫老猫照自己的办法行事。
        - id: ch04-b02
          speaker: fox
          text: >-
            把这些耗子一只只叼过去，摆在你主人面前。
        - id: ch04-b03
          speaker: cat
          text: >-
            好，我就照你说的办。
        - id: ch04-b04
          speaker: narrator
          text: >-
            老猫果然一只接一只地叼了过去。苏珊看见后，连忙叫丈夫来看。
        - id: ch04-b05
          speaker: susan
          text: >-
            快看，我们的老猫回来了！你瞧，它捉了这么多耗子。
        - id: ch04-b06
          speaker: simon
          text: >-
            真是什么怪事都有！我还以为，这只老猫再也捉不到耗子了。
          emotion: surprised
        - id: ch04-b07
          speaker: susan
          text: >-
            这下你看见了吧？我一直说它是只好猫。可你们男人啊，总觉得自己什么都懂。

    - id: ch05
      title: 老狗的警告
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            同一时候，狐狸也替老狗想好了办法。西蒙刚宰了一头猪，狐狸便告诉老狗，天黑以后该怎么做。
        - id: ch05-b02
          speaker: fox
          text: >-
            等天再黑一点，你就到院子里去，用尽力气大叫。
        - id: ch05-b03
          speaker: dog
          text: >-
            好，我照办。
        - id: ch05-b04
          speaker: narrator
          text: >-
            黄昏刚到，老狗就放声吠叫起来。苏珊第一个听见了。
        - id: ch05-b05
          speaker: susan
          text: >-
            一定是我们的狗回来了，它叫得正凶呢。你快出去看看怎么回事，也许有贼在偷香肠。
        - id: ch05-b06
          speaker: simon
          text: >-
            那头蠢东西聋得像木桩，没事也总要乱叫。
        - id: ch05-b07
          speaker: narrator
          text: >-
            西蒙就是不肯起身。第二天清早，苏珊准备去邻近的镇上做礼拜。姑妈也住在那里，她原想顺便带些香肠给姑妈。可她一走进储藏室，就发现香肠一根也不剩，地板上还破了个大洞。苏珊马上喊起丈夫来。
        - id: ch05-b08
          speaker: susan
          text: >-
            我说对了！昨晚果然来了贼，一根香肠也没给我们留下。你要是听我的，起来看看就好了！
        - id: ch05-b09
          speaker: narrator
          text: >-
            西蒙听得直挠头。
        - id: ch05-b10
          speaker: simon
          text: >-
            这可真奇怪。我从没想到，那条老狗的耳朵居然这么灵。
        - id: ch05-b11
          speaker: susan
          text: >-
            我早说过，它是天底下最好的狗。可你还是觉得自己懂得多。天下的男人都一个样。
        - id: ch05-b12
          speaker: narrator
          text: >-
            狐狸也得到了好处。原来，那些香肠全是它自己偷走的！
