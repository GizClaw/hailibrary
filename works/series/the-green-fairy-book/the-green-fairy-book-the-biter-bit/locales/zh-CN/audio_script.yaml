audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，像编书人面对孩子娓娓而谈，幽默处轻巧含笑
        timbre: 温暖清朗
        pace: 舒缓而有自然起伏
        pitch: 中音
    simon:
      display_name: 西蒙
      tts:
        delivery: 精明中带着夸张的老派口吻，受骗时急躁，设局时镇定诙谐
        timbre: 略显苍老而结实
        pace: 适中
        pitch: 中低音
    nina:
      display_name: 妮娜
      tts:
        delivery: 干练爽利，责备主人时直截了当，配合计谋时沉着自然
        timbre: 清晰有力
        pace: 适中偏快
        pitch: 中音
    rogue_1:
      display_name: 第一个无赖
      tts:
        delivery: 油滑自信，装客气时甜腻，动怒时粗暴
        timbre: 尖细灵活
        pace: 适中偏快
        pitch: 中高音
    rogue_2:
      display_name: 第二个无赖
      tts:
        delivery: 自作聪明，跟着同伙起哄，话里常带轻蔑
        timbre: 干涩清楚
        pace: 适中
        pitch: 中音
    rogue_3:
      display_name: 第三个无赖
      tts:
        delivery: 狡诈做作，假装关切时格外殷勤，发怒时急促
        timbre: 粗哑响亮
        pace: 适中
        pitch: 中低音
    wife_1:
      display_name: 第一个无赖的妻子
      tts:
        delivery: 泼辣直率，训斥蠢事时毫不留情
        timbre: 明亮硬朗
        pace: 适中偏快
        pitch: 中高音
    wife_2:
      display_name: 第二个无赖的妻子
      tts:
        delivery: 泼辣直率，训斥蠢事时毫不留情
        timbre: 清脆有力
        pace: 适中偏快
        pitch: 中音
    wife_3:
      display_name: 第三个无赖的妻子
      tts:
        delivery: 泼辣直率，训斥蠢事时毫不留情
        timbre: 稍低而坚实
        pace: 适中偏快
        pitch: 中低音
    shepherd:
      display_name: 牧羊人
      tts:
        delivery: 朴实迟钝，听到好事时充满天真的期待
        timbre: 温厚质朴
        pace: 舒缓
        pitch: 中低音
  chapters:
    - id: ch01
      title: 三个人说是驴
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前有个富翁名叫西蒙。他的钱多得很，人却吝啬极了。家里的事全由管家妮娜照料。妮娜精明能干，做事又细心又尽责，所以西蒙一直很敬重她。年轻时，西蒙是附近最活泼的小伙子之一。可年纪一大，他腿脚僵硬，走几步路都觉得吃力。妮娜心疼他那把老骨头，几次劝他买匹坐骑。西蒙总算听进去了。一天，他在集市上看中一头合用的骡子，花七枚金币买下，骑着它回家。
        - id: ch01-b02
          speaker: narrator
          text: >-
            集市上正有三个无赖闲逛。他们不肯干活，只想拿别人的东西过日子。一看西蒙买了骡子，第一个无赖就有了主意。
        - id: ch01-b03
          speaker: rogue_1
          text: >-
            朋友们，不用等上几个钟头，这头骡子就会归咱们。咱们分头守在老头回家的路上，隔一段站一个。谁见到他，都咬定那是驴，不是骡子。只要三个人说法一样，他一定会信。
        - id: ch01-b04
          speaker: narrator
          text: >-
            两个同伙十分赞成，三人照商量好的办法，分头等在路上。西蒙走到第一处，那无赖先装模作样地祝福他，又夸他是位尊贵的先生。西蒙谢过他的好意。无赖接着问他去了哪里，又从集市买了什么。西蒙便指了指自己骑着的牲口。
        - id: ch01-b05
          speaker: simon
          text: >-
            我刚从集市回来，买的就是身下这头骡子。
        - id: ch01-b06
          speaker: rogue_1
          text: >-
            您不是在开玩笑吧？依我看，您骑的明明是头驴。
        - id: ch01-b07
          speaker: simon
          text: >-
            驴？简直胡说八道！
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: >-
            西蒙气呼呼地骑走了，根本不愿再同那人多说。几百码外，第二个无赖又客客气气地问他从哪儿来。听说他刚去过集市，那人便问，今天的东西是不是很便宜，他自己又有没有买到什么好货。
        - id: ch01-b09
          speaker: simon
          text: >-
            当然买到了。我骑的这头骡子就是。
        - id: ch01-b10
          speaker: rogue_2
          text: >-
            您真把这畜生当成骡子买了？老天爷，这不过是一头驴！
        - id: ch01-b11
          speaker: simon
          text: >-
            又是一头驴？要是再有一个人也这么说，我就把这倒霉畜生送给他。
        - id: ch01-b12
          speaker: narrator
          text: >-
            西蒙说完继续上路。不久，第三个无赖迎面走来。他也先向西蒙祝福，又假意关心他是不是刚从集市回来，在那里做了什么买卖。西蒙说自己买了一头骡子。那人偏偏装出受了冒犯的样子，追问西蒙究竟是在说正经话，还是有意拿他取笑。
        - id: ch01-b13
          speaker: rogue_3
          text: >-
            骡子？您是在拿我当傻瓜吗？这分明是头驴。您准是叫几个混账骗子坑了！
        - id: ch01-b14
          speaker: simon
          text: >-
            两个钟头里，你已经是第三个这么说的人了。我先前一直不信，现在这畜生送给你吧。
        - id: ch01-b15
          speaker: narrator
          text: >-
            西蒙下了骡背。无赖接过牲口，亲热地向他道谢，骑着它去找两个同伙会合。西蒙只好用那双僵硬的腿走回家。进门以后，他把事情全告诉妮娜。他原以为自己花七枚金币买的是骡子，可路上好几个人都保证那是驴。他越想越觉得自己买错了，心里实在厌恶，最后才把牲口白送给别人。
        - id: ch01-b16
          speaker: nina
          text: >-
            你这个糊涂蛋！他们明明是在合伙骗你。亏我还以为你有点脑筋。换成我，他们可别想得手！
          emotion: angry
        - id: ch01-b17
          speaker: simon
          text: >-
            别着急，我会加倍奉还。他们骗走一头牲口，一定还不满足。等他们再来占便宜，我就叫他们尝尝被骗的滋味。

    - id: ch02
      title: 会传话的山羊
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            附近村里有个农夫，养着两只一模一样的山羊，谁也分不清它们。西蒙把两只都买下，还把价钱压得很低。回到家，他叫妮娜准备一桌好饭菜，要请朋友吃饭。小牛肉要烤好，两只鸡要煮熟，还要用香草做一道鲜美的菜，再烤一个最拿手的馅饼。吩咐完，他把一只羊拴在院里的柱子上喂草，另一只则牵去了集市。
        - id: ch02-b02
          speaker: narrator
          text: >-
            那三个无赖一看见西蒙，立刻迎上来，问他是不是又来找便宜货。
        - id: ch02-b03
          speaker: simon
          text: >-
            我来买今天宴客的食材。三位若肯赏光，也请一起到我家吃饭吧。
        - id: ch02-b04
          speaker: narrator
          text: >-
            三人满口答应。西蒙买齐食物，全捆在山羊背上，然后当着他们的面向羊交代起来。
        - id: ch02-b05
          speaker: simon
          text: >-
            你现在回家告诉妮娜，把小牛肉烤好，把鸡煮好，再用香草做一道鲜美的菜，把她最拿手的馅饼也烤出来。都记住了吗？去吧，愿上天保佑你一路平安。
        - id: ch02-b06
          speaker: narrator
          text: >-
            山羊一脱离牵绳，驮着东西撒腿就跑，能跑多快便跑多快，从此谁也不知道它去了哪里。西蒙并不追赶。他带着三个无赖和新结识的几个人，继续在集市上闲逛，过了一阵才领着大家回家。客人们一进院子，就看见柱子旁那只一模一样的山羊正在安静反刍。他们当然以为，它驮着食物赶回来，传完话以后又乖乖等在这里，因此个个惊讶得不得了。西蒙却像什么怪事也没有发生，带他们走进屋，问妮娜山羊捎回的吩咐是不是都办好了。
        - id: ch02-b07
          speaker: nina
          text: >-
            当然办好了。小牛肉烤熟了，两只鸡也煮好了。
        - id: ch02-b08
          speaker: narrator
          text: >-
            烤好的肉摆在眼前，馅饼还在炉里飘出香味，再听见妮娜说得这样肯定，三个无赖惊得几乎发狂。他们认定这只山羊真会替人传话，立刻凑在一起商量，怎样才能把它弄到自己手里。他们想了一个又一个诡计，却没有一个能把山羊从西蒙手上骗走。饭快吃完时，第一个无赖终于忍不住，只好开口直说。
        - id: ch02-b09
          speaker: rogue_1
          text: >-
            好心的主人，这只山羊您一定得卖给我们。
        - id: ch02-b10
          speaker: narrator
          text: >-
            西蒙先说自己实在舍不得这只山羊，因为不管给多少钱，也补不上失去它的损失。他们再三坚持，他才勉强答应，若肯付五十枚金币，就让他们牵走。三个恶棍以为做成了一笔再划算不过的买卖，当场付清金币，欢天喜地地牵羊回家。他们向妻子夸耀自己的新宝贝，还叮嘱她们，第二天先别动手做饭，等山羊把食材和口信一同送回来再说。
        - id: ch02-b11
          speaker: narrator
          text: >-
            次日，三人把山羊带到集市，买了鸡和其他吃食，全都牢牢装在羊背上。他们又对着山羊，把想让妻子准备的每一道菜逐一交代清楚，这才解开牵绳。山羊刚得自由，便没命地往远处跑，很快消失在视野之外，从此再没有消息。三个傻瓜却安心留在集市，直到饭点才空着肚子回家。他们一进门就问各自的妻子，山羊是否送来了食材，又有没有把该做什么菜一一说明。
        - id: ch02-b12
          speakers: [wife_1, wife_2, wife_3]
          ensemble: chorus
          text: >-
            你们这三个蠢货！山羊怎么可能替女仆干活？你们天天骗人，这回总算轮到自己上当了。瞧瞧你们闹出的笑话吧！
          emotion: angry
        - id: ch02-b13
          speaker: narrator
          text: >-
            三人这才明白，西蒙不但胜过他们，还拿走了五十枚金币。他们气得发疯，抄起武器，决定去杀西蒙。

    - id: ch03
      title: 能起死回生的笛子
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            西蒙猜到他们不会罢休，心里也怕三个无赖伤了自己。他拿出一只装满血的膀胱，交给妮娜。
        - id: ch03-b02
          speaker: simon
          text: >-
            把它藏在斗篷下面。等那些人来了，我会把罪过都推给你，装作气疯了，再用刀刺破血袋。你马上倒地装死，剩下的看我来办。
        - id: ch03-b03
          speaker: narrator
          text: >-
            话才说完，三个无赖便闯进来，要取西蒙的性命。
        - id: ch03-b04
          speaker: simon
          text: >-
            朋友们，你们为什么怪我？这事与我无关。也许是我的管家背着我伤害了你们，我根本不知情。
        - id: ch03-b05
          speaker: narrator
          text: >-
            他猛地转向妮娜，一刀刺去，正好扎破血袋。妮娜倒在地上，装得像真死了一样，鲜血流得到处都是。西蒙望着眼前的景象，又装出悔恨万分的模样。
        - id: ch03-b06
          speaker: simon
          text: >-
            我这个不幸的混账啊！我发了疯，竟杀掉了支撑我晚年生活的人。没有她，我以后可怎么活？
          emotion: sad
        - id: ch03-b07
          speaker: narrator
          text: >-
            西蒙随即抓起一支笛子，对着它吹了好一会儿。倒在血泊里的妮娜忽然站起身来，活生生的，身上一点伤也没有。三个无赖从没见过这样的奇事，比看见传话的山羊时还要惊讶。他们只顾盯着那支笛子，连原来的怒气和杀人的来意都忘得一干二净。三人马上凑出两百枚金币，把笛子买走，高高兴兴地回家了。
        - id: ch03-b08
          speaker: narrator
          text: >-
            没过多久，第一个无赖与妻子争吵起来。他怒火上头，一刀刺进妻子的胸口，妻子当场倒地死去。他一点也不担心，立刻拿出西蒙的笛子，使出全身力气吹个不停，满心盼着妻子重新活过来。可是任凭他吹得多响，笛声也毫无用处。可怜的女人已经死得透透的了。第二个无赖听说这件事，却不肯相信笛子是假的，只认定同伙不会使用。
        - id: ch03-b09
          speaker: rogue_2
          text: >-
            你这个木头脑袋，一定是哪里做错了。看我的吧。
        - id: ch03-b10
          speaker: narrator
          text: >-
            为了证明自己更有本事，他揪住妻子的头发，用剃刀割断她的喉咙。等她倒下，他才拿起笛子，使出全身力气吹个不停。妻子当然没有复活。第三个无赖仍不肯吸取教训，也对自己的妻子做了同样的事，结果自然一模一样。就这样，三个人非但没有学会起死回生，反倒全都没了妻子。
        - id: ch03-b11
          speaker: narrator
          text: >-
            这一次，他们怒不可遏，冲进西蒙家，连一句解释也不肯听。他们把老人装进一只口袋，准备扔进附近的河里淹死。走到半路，忽然传来一阵响声。三个人吓得扔下口袋，逃命去了。

    - id: ch04
      title: 口袋里的婚事
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            不久，一个牧羊人赶着羊群经过。羊儿走走停停，低头啃着路边嫩草，他慢慢跟在后面。忽然，口袋里传出一阵可怜巴巴的哀叹，而且翻来覆去总是那几句话。
        - id: ch04-b02
          speaker: simon
          text: >-
            他们非逼我娶她，可我不想娶呀。我这么老，身子又弱，实在不能娶她。
        - id: ch04-b03
          speaker: narrator
          text: >-
            牧羊人听得吃了一惊，因为声音反复响起，他却看不见说话的人。他先朝右边找，又朝左边望，最后才发现路旁的口袋。他走过去解开袋口，看见西蒙藏在里面，还在不停地悲声抱怨。牧羊人不明白这是怎么回事，便问老人为何叫人捆在口袋里，独自丢在路边。
        - id: ch04-b04
          speaker: simon
          text: >-
            本国的国王非要把一个女儿嫁给我。这份荣耀虽好，可我年迈体弱，实在不能接受。
        - id: ch04-b05
          speaker: shepherd
          text: >-
            那么，国王会不会愿意把女儿嫁给我？
        - id: ch04-b06
          speaker: simon
          text: >-
            当然愿意。只要换成你捆在这只口袋里，我知道国王一定会选你。
        - id: ch04-b07
          speaker: narrator
          text: >-
            西蒙爬出袋子，把轻信的牧羊人装进去。牧羊人还特意请他把袋口捆牢。西蒙照办，随后赶着羊群离开。不到一个钟头，三个无赖回到原地。他们看也不看，其中一人抓起口袋便扔进河里。可怜的牧羊人就这样替西蒙淹死了。

    - id: ch05
      title: 自食其果
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            三个无赖以为终于报了仇，这才安心动身回家。路上，他们看见一群羊正在离大路不远的地方吃草，贪心又冒了出来，便想走近些，顺手偷走几只羊羔。可到了羊群跟前，三个人一下子呆住了。替羊群放牧的，竟是刚被他们连人带袋扔进河里的西蒙！他们明明以为老人已经淹死，如今却见他好端端地站在那里，还成了一群羊的主人。三人又惊又怕，连忙问他究竟怎样从河里逃了出来。
        - id: ch05-b02
          speaker: simon
          text: >-
            去你们的吧！你们简直是三头没脑子的蠢驴。要是把我扔进更深的水里，我带回来的羊群准有现在的三倍！
        - id: ch05-b03
          speaker: rogue_1
          text: >-
            亲爱的西蒙先生，请您也把我们装进口袋，扔进河里吧。这样我们就能洗心革面，不再偷东西，还能各自得到一群羊。
        - id: ch05-b04
          speaker: simon
          text: >-
            我很乐意。你们想怎么办，我就怎么办。只要是为你们，世上没有什么事是我不肯做的。
        - id: ch05-b05
          speaker: narrator
          text: >-
            西蒙找来三只结实的口袋，每只装进去一个无赖。他把三个袋口都捆得牢牢的，叫里面的人谁也钻不出来。接着，他把三只口袋一个接一个，全都扔进河里。三个一心算计别人的无赖，就这样送了自己的性命。西蒙赶着从牧羊人那里得来的羊群，带着从骗子手里赚回的金币，回到忠心的妮娜身边。从那以后，他身体健康，日子快活，又安安稳稳地生活了许多年。故事最后，署着克莱特克的名字。
