  chapters:
    - id: ch01
      title: A Mule Becomes a Donkey
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there lived a very rich man named Simon, who was as stingy and miserly as a man could be. His housekeeper was a clever, capable woman named Nina. She took her work seriously and did every task with great care. Because she served him so faithfully, Simon respected her more than anyone else in his household.
        - id: ch01-b02
          speaker: narrator
          text: When Simon was young, he had been one of the liveliest and most active men in the neighborhood. But as he grew old, his joints became stiff, and every walk was difficult. Faithful Nina kept urging him to spare his poor old bones and buy a horse. Simon resisted for a long time. At last her patient persuasion worked. One day he went to the market, found a mule that seemed to suit him perfectly, and paid seven gold pieces for it.
        - id: ch01-b03
          speaker: narrator
          text: Three merry rogues were hanging around the marketplace that day. They had no wish to earn an honest living when they could live on other people's goods instead. The moment they saw Simon pay for the mule and ride away, the first rogue turned to his two close companions.
        - id: ch01-b04
          speaker: rogue_1
          text: Friends, before many hours pass, that mule will belong to us.
        - id: ch01-b05
          speaker: rogue_2
          text: How are we going to manage that?
        - id: ch01-b06
          speaker: rogue_1
          text: We will spread out along the old man's road home. Each of us will tell him the animal he bought is a donkey, not a mule. If all three of us insist, you will see. He will soon hand it over.
        - id: ch01-b07
          speaker: narrator
          text: The others liked the plan, and each man took his place along the road. When Simon reached the first rogue, the fellow greeted him politely.
        - id: ch01-b08
          speaker: rogue_1
          text: God bless you, my fine gentleman.
        - id: ch01-b09
          speaker: simon
          text: Thank you. That is very courteous.
        - id: ch01-b10
          speaker: rogue_1
          text: Where have you been today?
        - id: ch01-b11
          speaker: simon
          text: I have been to the market.
        - id: ch01-b12
          speaker: rogue_1
          text: And what did you buy there?
        - id: ch01-b13
          speaker: simon
          text: This mule.
        - id: ch01-b14
          speaker: rogue_1
          text: Which mule do you mean?
        - id: ch01-b15
          speaker: simon
          text: Why, the one I am riding, of course.
        - id: ch01-b16
          speaker: rogue_1
          text: Are you serious, or are you making a joke?
        - id: ch01-b17
          speaker: simon
          text: What do you mean by that?
        - id: ch01-b18
          speaker: rogue_1
          text: The animal under you looks like a donkey to me. It certainly does not look like a mule.
        - id: ch01-b19
          speaker: simon
          text: A donkey? What nonsense!
          emotion: angry
        - id: ch01-b20
          speaker: narrator
          text: Simon shouted the words, then rode on without another word. Yet the claim stayed in his mind. A few hundred yards farther along, exactly as the rogues had planned, he met the second man waiting by the road.
        - id: ch01-b21
          speaker: rogue_2
          text: Good day, dear sir. Where are you coming from?
        - id: ch01-b22
          speaker: simon
          text: From the market.
        - id: ch01-b23
          speaker: rogue_2
          text: Were things selling cheaply today?
        - id: ch01-b24
          speaker: simon
          text: They certainly were.
        - id: ch01-b25
          speaker: rogue_2
          text: Did you find a good bargain for yourself?
        - id: ch01-b26
          speaker: simon
          text: I bought the mule you see me riding.
        - id: ch01-b27
          speaker: rogue_2
          text: You really bought that animal as a mule?
        - id: ch01-b28
          speaker: simon
          text: Yes, certainly.
        - id: ch01-b29
          speaker: rogue_2
          text: Good heavens! That creature is nothing but a donkey.
        - id: ch01-b30
          speaker: simon
          text: A donkey? Surely you cannot mean it. If one more person tells me that, I will give the wretched animal to him.
          emotion: surprised
        - id: ch01-b31
          speaker: narrator
          text: Simon continued on his way. Very soon, the third rogue appeared and offered him another friendly greeting.
        - id: ch01-b32
          speaker: rogue_3
          text: God bless you, sir. Have you come from the market, by any chance?
        - id: ch01-b33
          speaker: simon
          text: Yes, I have.
        - id: ch01-b34
          speaker: rogue_3
          text: What sort of bargain did you make there?
        - id: ch01-b35
          speaker: simon
          text: I bought the mule I am riding.
        - id: ch01-b36
          speaker: rogue_3
          text: A mule? Are you serious, or are you trying to make a fool of me?
        - id: ch01-b37
          speaker: simon
          text: I am completely serious. I would not joke about it.
        - id: ch01-b38
          speaker: rogue_3
          text: Oh, my poor friend! Cannot you see that this is a donkey? Some miserable cheats have tricked you.
        - id: ch01-b39
          speaker: simon
          text: You are the third person in two hours to say that. I could not believe the others, but now I must. Keep the animal. I give it to you.
        - id: ch01-b40
          speaker: narrator
          text: Simon climbed down and handed over the animal he had bought for seven gold pieces. The rogue thanked him warmly, mounted the mule, and rode away to join his companions. Simon, meanwhile, had to continue the rest of his journey on foot.
        - id: ch01-b41
          speaker: narrator
          text: As soon as he reached home, he told Nina the whole story. He had bought the animal believing it was a mule, but several people along the road had assured him it was really a donkey. Disgusted at being cheated in the market, he had finally given the beast away.
        - id: ch01-b42
          speaker: nina
          text: Oh, Simon, you simpleton! Could you not see that they were playing a trick on you? I thought you had more sense than that. They would never have fooled me so easily.
          emotion: surprised
        - id: ch01-b43
          speaker: simon
          text: Never mind. I will pay them back twice over. They will not be satisfied with taking the donkey from me. Unless I am badly mistaken, they will try another trick to get even more.
    - id: ch02
      title: The Goat That Carried a Message
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Simon began his answer at once. A peasant in a village not far from his house owned two goats that were alike in every possible way. It was impossible to distinguish one from the other. Simon bargained as hard as he could, bought them both for a very small price, and led them home.
        - id: ch02-b02
          speaker: simon
          text: Nina, prepare a fine dinner. I am inviting some friends. Roast veal, boil two chickens, make a savory dish with these herbs, and bake the best tart you can.
        - id: ch02-b03
          speaker: narrator
          text: Simon tied one goat to a post in the courtyard, where it stood eating the grass he gave it. Around the other goat's neck, he fastened a cord. Then he led that goat away to the market, leaving its perfect double behind.
        - id: ch02-b04
          speaker: narrator
          text: The three rogues who had taken his mule spotted him as soon as he arrived. They hurried over to greet him.
        - id: ch02-b05
          speakers: [rogue_1, rogue_2, rogue_3]
          ensemble: chorus
          text: Welcome, Mr. Simon! What brings you here? Are you searching for another bargain?
        - id: ch02-b06
          speaker: simon
          text: I came to buy provisions. Some friends are dining with me today, and I would be very pleased if you three would join us.
        - id: ch02-b07
          speaker: narrator
          text: The rogues gladly accepted. When Simon had bought everything he needed, he loaded it onto the goat's back. Then, while all three men watched, he spoke to the animal.
        - id: ch02-b08
          speaker: simon
          text: Go home now. Tell Nina to roast the veal and boil the chickens. Tell her to make the savory herb dish and bake her best tart. Did you understand? Off you go, and Heaven bless you on the way.
        - id: ch02-b09
          speaker: narrator
          text: The moment it felt the cord loosen, the loaded goat trotted away as fast as its legs could carry it. To this day, no one knows where it went or what became of the provisions. Simon did not follow. He wandered around the market for some time with the three rogues and several other friends he had met there. Only then did he lead the whole company back to his house.
        - id: ch02-b10
          speaker: narrator
          text: As they entered the courtyard, they saw a goat tied to the post, quietly chewing. Of course, the rogues believed it was the very goat Simon had sent home with the food, and they stared in astonishment.
        - id: ch02-b11
          speaker: simon
          text: Well, Nina, did you do everything the goat told you?
        - id: ch02-b12
          speaker: narrator
          text: Nina understood her master's trick at once.
        - id: ch02-b13
          speaker: nina
          text: Certainly. The veal is roasted, and the chickens are boiled.
        - id: ch02-b14
          speaker: simon
          text: Excellent. Then everything is ready.
        - id: ch02-b15
          speaker: narrator
          text: The rogues saw the roasted veal and boiled chickens with their own eyes. They also saw the tart baking in the oven. After hearing Nina say that the goat had delivered every instruction, they were nearly beside themselves with amazement. They began whispering at once about how to get such a marvelous creature. All through the meal they searched for some cunning trick, but none came to them. Near the end, the first rogue finally spoke plainly.
        - id: ch02-b16
          speaker: rogue_1
          text: My worthy host, you must sell us that goat.
        - id: ch02-b17
          speaker: simon
          text: I would hate to part with such a useful creature. No sum could truly repay its loss. Still, if you are determined, I will accept fifty gold pieces.
        - id: ch02-b18
          speaker: narrator
          text: The rogues thought they had made a splendid bargain. They paid the fifty gold pieces immediately and went happily home with the goat. There they gave their wives an order.
        - id: ch02-b19
          speakers: [rogue_1, rogue_2, rogue_3]
          ensemble: chorus
          text: Do not start tomorrow's dinner until we send the provisions home.
        - id: ch02-b20
          speaker: narrator
          text: The next day, the three men took the goat with them to market. They bought chickens and all the other food they wanted for dinner, packed everything onto its back, and carefully told it which dishes their wives should prepare. Then they set it loose, expecting it to carry the message home. The goat ran as quickly as it could and soon vanished from sight. As far as anyone knows, it was never heard of again.
        - id: ch02-b21
          speaker: narrator
          text: The three men stayed away until the dinner hour drew near. Then they went home, hungry and confident, and asked their wives whether the goat had returned with all the provisions and told them what to prepare.
        - id: ch02-b22
          speakers: [wife_1, wife_2, wife_3]
          ensemble: chorus
          text: You fools! How could you believe a goat could do a servant's work? Simon has tricked you beautifully. You spend your lives deceiving other people, and now your own turn has come. He has made all three of you look ridiculous.
          emotion: angry
    - id: ch03
      title: The Pipe That Raised the Dead
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: When the three comrades realized that Simon had beaten them and taken their fifty gold pieces, they flew into a rage. They seized their weapons and set off to kill him.
        - id: ch03-b02
          speaker: narrator
          text: The sly old man had guessed that the rogues might come back and do him harm. Though he was terrified for his life, he was on his guard. He handed Nina a bladder filled with blood and explained exactly what she must do when the angry men arrived.
        - id: ch03-b03
          speaker: simon
          text: Hide this bladder under your cloak. When the thieves arrive, I will blame you for everything. I will pretend to lose my temper and stab at you, but my knife will only pierce the bladder. Fall down as though you are dead, and leave the rest to me.
        - id: ch03-b04
          speaker: narrator
          text: Simon had barely finished when the three rogues burst in and attacked him, meaning to kill him.
        - id: ch03-b05
          speaker: simon
          text: My friends, what have I done to deserve this? None of it is my fault. Perhaps my housekeeper harmed you without my knowing.
        - id: ch03-b06
          speaker: narrator
          text: Simon turned on Nina with his knife and struck the hidden bladder. Nina fell at once as though she were dead, while blood streamed across the ground.
        - id: ch03-b07
          speaker: narrator
          text: At the sight of this dreadful scene, Simon acted as if remorse had overwhelmed him. He cried out loudly.
        - id: ch03-b08
          speaker: simon
          text: Miserable man that I am! What have I done? In my madness, I have killed the woman who supports me in my old age. How can I possibly live without her?
          emotion: sad
        - id: ch03-b09
          speaker: narrator
          text: Then Simon picked up a pipe and blew into it for some time. Nina sprang to her feet, alive and well.
        - id: ch03-b10
          speaker: narrator
          text: The rogues had never been so amazed. For the moment, they forgot why they had come and all their murderous anger disappeared. A pipe that could restore the dead seemed worth any price. They handed Simon two hundred gold pieces, took the pipe, and carried it joyfully home.
    - id: ch04
      title: The Rogues Trust the Pipe
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Not long afterward, the first rogue quarreled with his wife. His temper rose until, in a burst of fury, he drove a knife into her breast. She fell dead on the ground. Certain that no real harm had been done, he snatched up Simon's pipe and blew with all his strength, expecting to call her back to life. He blew again and again, but it did no good. The poor woman remained as dead as a door-nail.
        - id: ch04-b02
          speaker: narrator
          text: When the second rogue heard what had happened, he scoffed at his companion.
        - id: ch04-b03
          speaker: rogue_2
          text: You blockhead! You must have used the pipe incorrectly. Let me show you how it is done.
        - id: ch04-b04
          speaker: narrator
          text: He seized his own wife by the roots of her hair and cut her throat with a razor. Then he took the pipe and blew into it with all his might. No matter how hard he tried, he could not bring her back to life. The third rogue was no wiser. He did the same thing to his own wife and met with the same terrible result. Now all three men were without wives.
        - id: ch04-b05
          speaker: narrator
          text: Burning with rage, they ran to Simon's house. They would not listen to a single explanation or excuse. They grabbed the old man, stuffed him into a sack, and set off to drown him in the nearby river.
        - id: ch04-b06
          speaker: narrator
          text: Before they reached the water, a sudden noise frightened them so badly that they dropped the sack and ran for their lives, leaving Simon tied inside.
    - id: ch05
      title: The Man in the Sack
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Soon afterward, a shepherd came along with his flock. The sheep stopped here and there to nibble tender grass while he followed slowly behind. Then he heard a pitiful voice wailing from somewhere nearby.
        - id: ch05-b02
          speaker: simon
          text: They insist that I take her, but I do not want her. I am far too old. I truly cannot marry her.
        - id: ch05-b03
          speaker: narrator
          text: The voice repeated the complaint several times. Startled, the shepherd looked to his right and left until he noticed the sack. He opened it and found Simon inside, still lamenting. The shepherd asked why anyone had tied him up and left him there.
        - id: ch05-b04
          speaker: simon
          text: The king insists on giving me one of his daughters for a wife. I refused such an honor because I am too old and frail, so they tied me in this sack.
        - id: ch05-b05
          speaker: narrator
          text: The simple shepherd believed every word.
        - id: ch05-b06
          speaker: shepherd
          text: Do you think the king might give his daughter to me instead?
        - id: ch05-b07
          speaker: simon
          text: Yes, certainly. I know he would, if you were tied in this sack in my place.
        - id: ch05-b08
          speaker: narrator
          text: Simon climbed out. At the shepherd's own request, he put the trusting man inside the sack and fastened it securely. Then Simon drove the flock away himself.
        - id: ch05-b09
          speaker: narrator
          text: Less than an hour later, the three rogues returned to the spot. Without opening the sack, one of them picked it up and threw it into the river. And so the poor shepherd drowned in Simon's place.
    - id: ch06
      title: The Biter Bit
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Believing their revenge complete, the three rogues started home. Along the way, they saw a flock grazing near the road and began longing to steal a few lambs. They moved closer, then stopped in shock. The shepherd watching the flock was Simon, the very man they thought they had drowned.
        - id: ch06-b02
          speaker: narrator
          text: They demanded to know how he had escaped from the river. Simon gave them a scornful answer.
        - id: ch06-b03
          speaker: simon
          text: Away with you! You are no wiser than three silly donkeys. If you had drowned me in deeper water, I would have come back with three times as many sheep.
        - id: ch06-b04
          speaker: narrator
          text: The rogues believed him at once and begged for his help.
        - id: ch06-b05
          speakers: [rogue_1, rogue_2, rogue_3]
          ensemble: chorus
          text: Dear Mr. Simon, please tie us in sacks and throw us into the river. Then we can give up thieving and own flocks of our own.
        - id: ch06-b06
          speaker: simon
          text: I am ready to please you. There is nothing in the world I would not do for you.
        - id: ch06-b07
          speaker: narrator
          text: Simon brought three strong sacks. He put one rogue into each, fastened every sack so tightly that no one could escape, and threw all three into the river. That was the end of the rogues.
        - id: ch06-b08
          speaker: narrator
          text: Simon went home to faithful Nina, rich in gold and flocks, and lived for many years in health and happiness.
