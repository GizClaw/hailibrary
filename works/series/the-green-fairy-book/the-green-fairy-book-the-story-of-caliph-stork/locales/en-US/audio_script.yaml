  chapters:
    - id: ch01
      title: I.
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: One fine afternoon in Bagdad, Caliph Chasid rested comfortably on his divan. He smoked a long pipe while a slave brought him little cups of coffee. From time to time he took a sip, then stroked his long beard with obvious pleasure. Anyone could see that he was in an excellent humor. This was always the safest time of day to approach him, because just then he was likely to be both friendly and cheerful. Grand Vizier Mansor knew that well, so he chose this hour for his daily visit.
        - id: ch01-b02
          speaker: narrator
          text: Mansor arrived at the usual time, but today his face looked troubled. The Caliph took the pipe from his lips.
        - id: ch01-b03
          speaker: caliph_chasid
          text: Why do you look so anxious, Grand Vizier?
        - id: ch01-b04
          speaker: narrator
          text: Mansor crossed his arms over his chest and bowed low.
        - id: ch01-b05
          speaker: grand_vizier_mansor
          text: My lord, I cannot say how my face looks. But there is a pedlar in the palace courtyard with such beautiful wares that I am quite annoyed to have so little money to spare.
        - id: ch01-b06
          speaker: narrator
          text: The Caliph had been wanting to give Mansor a present, so he ordered the slave to bring the pedlar up at once. The slave soon returned with a short, stout man behind him. The pedlar had a dark face and very ragged clothes. He carried a box packed with strings of pearls, rings, richly mounted pistols, goblets, combs, and every sort of ware. The Caliph and Mansor inspected the whole collection with care. At last the Caliph chose handsome pistols for himself and his Vizier, and a jeweled comb for Mansor's wife.
        - id: ch01-b07
          speaker: narrator
          text: As the pedlar began to close his box, the Caliph noticed a small drawer and asked what else was for sale. Inside it lay a little box of black powder and a scroll covered in strange writing. Neither the Caliph nor Mansor could read a word of it.
        - id: ch01-b08
          speaker: pedlar_kaschnur
          text: A merchant gave me these. He found them lying in the street at Mecca. I have no idea what they contain, and they are useless to me. You may have them for almost nothing.
        - id: ch01-b09
          speaker: narrator
          text: The Caliph liked collecting old manuscripts for his library, even ones he could not read. He paid for the scroll and the little box, then dismissed the pedlar. As soon as the man was gone, curiosity took hold of him. He wanted very much to know what the strange writing meant, so he asked Mansor whether anyone in Bagdad might be able to decipher it.
        - id: ch01-b10
          speaker: grand_vizier_mansor
          text: Most gracious lord, a man called Selim the Learned lives near the great Mosque. They say he knows every language under the sun. Send for him. Perhaps he can explain these mysterious marks.
        - id: ch01-b11
          speaker: narrator
          text: Selim was summoned immediately. The Caliph held out the scroll.
        - id: ch01-b12
          speaker: caliph_chasid
          text: Selim, I hear that you are a scholar. Study this scroll and tell me whether you can read it. Succeed, and I will give you a robe of honor. Fail, and you will receive twelve blows on the cheeks and twenty-five on the soles of your feet for being falsely called Selim the Learned.
        - id: ch01-b13
          speaker: narrator
          text: Selim threw himself down before the Caliph.
        - id: ch01-b14
          speaker: selim
          text: Let it be as my master commands.
        - id: ch01-b15
          speaker: narrator
          text: He studied the scroll for a long while. Then his face changed.
        - id: ch01-b16
          speaker: selim
          text: May I die, my lord, if this is not Latin!
          emotion: surprised
        - id: ch01-b17
          speaker: caliph_chasid
          text: Then let us hear what the Latin says.
        - id: ch01-b18
          speaker: selim
          text: Whoever finds this should praise Allah for his mercy. Snuff the powder in this box and say the word “Mutabor.” You may then become any creature you choose, and you will understand the speech of every animal. To take back your human form, bow three times toward the east and repeat the same word. But while you wear the shape of a beast or bird, you must not laugh. If you do, you will forget the magic word and remain an animal forever.
        - id: ch01-b19
          speaker: narrator
          text: The Caliph listened with growing delight. When Selim finished, Chasid made the scholar swear that he would not tell anyone what the scroll contained. Then he rewarded Selim with the promised splendid robe and sent him away. The Caliph could hardly contain his excitement as he turned to Mansor.
        - id: ch01-b20
          speaker: caliph_chasid
          text: Now that is a bargain! I can hardly wait to become an animal. Come early tomorrow morning. We will go into the country, take some of this snuff, and listen to what is said in the air, on the earth, and under the water.
    - id: ch02
      title: II.
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The next morning, Caliph Chasid had barely finished dressing and eating breakfast when Mansor arrived as ordered, ready for their adventure. The Caliph tucked the snuffbox securely into his girdle. He told all his servants to stay at home, and the two men set out with no one else attending them. First they wandered through the palace gardens. They looked everywhere, but no creature they saw tempted them to try the magic. At last Mansor proposed a pond beyond the town. He had often found many animals there, especially storks whose solemn looks, stately movements, and endless chatter had caught his attention.
        - id: ch02-b02
          speaker: narrator
          text: At the pond, they saw one stork striding about with great dignity. It hunted frogs and muttered to itself. High overhead, another stork was flying toward the same place.
        - id: ch02-b03
          speaker: grand_vizier_mansor
          text: Most gracious master, I would wager my beard that those two long-legged birds are about to have a fine conversation. Shall we turn ourselves into storks?
        - id: ch02-b04
          speaker: caliph_chasid
          text: An excellent idea. But first, remember how we become men again. We bow three times toward the east and say “Mutabor.” Then I will be the Caliph and you will be my Grand Vizier once more. And whatever happens, do not laugh, or we are lost!
        - id: ch02-b05
          speaker: narrator
          text: The second stork circled above them and began to descend. The Caliph quickly opened the box, took a large pinch of snuff, and passed another to Mansor.
        - id: ch02-b06
          speakers: [caliph_chasid, grand_vizier_mansor]
          ensemble: duo
          text: Mutabor!
        - id: ch02-b07
          speaker: narrator
          text: At once their legs shriveled into thin red sticks. Their smart yellow slippers became clumsy stork feet, and their arms turned into wings. Long necks pushed up between their shoulders until they were a yard long. Their beards vanished, and feathers covered their bodies. For a while, they could only stare at each other.
        - id: ch02-b08
          speaker: caliph_chasid
          text: What a magnificent long bill you have, Sir Vizier! By the Prophet's beard, I have never seen anything like it.
          emotion: surprised
        - id: ch02-b09
          speaker: grand_vizier_mansor
          text: I am deeply grateful, my lord. Still, if I may say so, you are even handsomer as a stork than you were as a Caliph. Now let us join those other birds and discover whether we truly understand them.
        - id: ch02-b10
          speaker: narrator
          text: By then the second stork had reached the ground. She scraped her bill with one claw, carefully smoothed her feathers, and walked over to the first bird. The Caliph and Mansor wasted no time. They edged close enough to hear the conversation, and to their amazement, every word was clear.
        - id: ch02-b11
          speaker: chatterbill
          text: Good morning, Dame Longlegs. You are out early today!
        - id: ch02-b12
          speaker: dame_longlegs
          text: Indeed I am, dear Chatterbill. I am finding myself a little breakfast. Would you care for a piece of lizard or a frog's thigh?
        - id: ch02-b13
          speaker: chatterbill
          text: Thank you kindly, but I have no appetite this morning. I came for something quite different. I must dance before my father's guests today, so I wanted a quiet place to practice.
        - id: ch02-b14
          speaker: narrator
          text: The young stork began stepping about in the most extraordinary fashion. The Caliph and Mansor watched in growing wonder. At last she balanced on one leg in a grand pose and waved her wings gracefully up and down. That finished them. Loud, helpless peals of laughter burst from both their bills, and it was some time before they could control themselves again. By then, the frightened storks had fled.
        - id: ch02-b15
          speaker: caliph_chasid
          text: That was the funniest thing I have ever seen! What a pity our laughter frightened those foolish creatures away. No doubt they would have sung for us next.
          emotion: happy
        - id: ch02-b16
          speaker: narrator
          text: Then Mansor remembered the warning. He told the Caliph what their laughter might have cost them.
        - id: ch02-b17
          speaker: caliph_chasid
          text: By Mecca and Medina, it will be a miserable joke if I must stay a stork all my life! Try to remember that ridiculous word. It has slipped completely out of my mind.
          emotion: fearful
        - id: ch02-b18
          speaker: grand_vizier_mansor
          text: We bow three times toward the east and say, “Mu... mu... mu...”
          emotion: fearful
        - id: ch02-b19
          speaker: narrator
          text: They faced east and bowed until their bills touched the ground. But the magic word was gone. The Caliph bowed again and again. Mansor pleaded, “Mu... mu...” as if the missing syllables might answer him. Nothing worked. The unhappy Chasid and Mansor remained storks.
    - id: ch03
      title: III.
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The two enchanted birds wandered sadly through the meadows. They could not escape their new shapes, and they saw no use in returning to Bagdad. Who would believe a stork that claimed to be the Caliph? And even if the people believed him, would they agree to be ruled by a bird?
        - id: ch03-b02
          speaker: narrator
          text: For several days they drifted around the countryside and lived on fruit. Even that was difficult to eat with their long bills, but neither man could bring himself to enjoy frogs or lizards. Their only comfort was the new power of flight. Again and again they rose into the air and swept above the roofs of Bagdad, watching the city they could no longer enter.
        - id: ch03-b03
          speaker: narrator
          text: During the first few days, the streets below showed signs of confusion and grief. Then, on the fourth day, the storks perched on the palace roof and saw a splendid procession passing beneath them. Drums beat and trumpets sounded. A man in a scarlet mantle embroidered with gold rode a richly decorated horse. Finely dressed slaves surrounded him, and half the people of Bagdad crowded after them.
        - id: ch03-b04
          speakers: [first_citizen, second_citizen, third_citizen]
          ensemble: chorus
          text: Hail, Mirza, Lord of Bagdad!
        - id: ch03-b05
          speaker: narrator
          text: The two storks looked at one another.
        - id: ch03-b06
          speaker: caliph_chasid
          text: Now can you guess why we were enchanted? That is Mirza, the son of my deadliest enemy, the powerful magician Kaschnur. Kaschnur once swore to take revenge on me. But I will not give up. Come, faithful friend. We will fly to the Prophet's grave. Perhaps the spell can be broken at that sacred place.
        - id: ch03-b07
          speaker: narrator
          text: They spread their wings and left the palace roof for Medina. But they had very little practice, and flying was harder than they expected.
        - id: ch03-b08
          speaker: grand_vizier_mansor
          text: My lord, I cannot go any farther. You fly much too quickly for me. Evening is coming too. We should find somewhere to spend the night.
        - id: ch03-b09
          speaker: narrator
          text: The Caliph welcomed Mansor's suggestion. In the valley below, they spotted a ruin that seemed to offer shelter for the night, so they flew down toward it. The building had once been a castle. Fine pillars still rose among heaps of broken stone, and several rooms remained in good enough condition to show their former splendor. Chasid and Mansor wandered through the old passages, searching for a dry place where two storks could rest. Suddenly Mansor stopped in his tracks.
        - id: ch03-b10
          speaker: grand_vizier_mansor
          text: My lord and master, it would be absurd for a Grand Vizier to fear ghosts, and even more absurd for a stork. Still, I confess I am uneasy. Something close to us has sighed and moaned quite clearly.
          emotion: fearful
        - id: ch03-b11
          speaker: narrator
          text: The Caliph stood perfectly still and listened. A low weeping sound came from nearby, and it sounded more human than animal. His curiosity overcame him, and he started toward it. Mansor caught his wing in his bill and begged him not to rush into another unknown danger. But a brave heart still beat beneath the Caliph's feathers. He tore himself free, leaving a few feathers in Mansor's bill, and hurried down a dark passage toward the sound.
        - id: ch03-b12
          speaker: narrator
          text: A door stood partly open. Sighs and sobs came from within. The Caliph pushed it wider with his bill, then froze on the threshold. A large screech owl sat on the floor of a ruined room, dimly lit by one small barred window. Great tears rolled from her round eyes, and a hoarse lament came through her crooked beak.
        - id: ch03-b13
          speaker: narrator
          text: Mansor crept up behind the Caliph. The owl saw both visitors and gave a joyful cry. She gently wiped her eyes with her spotted brown wings. Then, to their astonishment, she spoke to them in clear human Arabic.
        - id: ch03-b14
          speaker: princess_lusa
          text: Welcome, storks! Your arrival promises my deliverance. Long ago, I was told that good fortune would come to me through a stork.
          emotion: happy
        - id: ch03-b15
          speaker: narrator
          text: When the Caliph recovered from his surprise, he drew up his feet, curved his long neck, and answered with great dignity.
        - id: ch03-b16
          speaker: caliph_chasid
          text: Madam Owl, your words make me think that you share our misfortune. But your hope of rescue through us is sadly misplaced. Once you hear our story, you will understand how helpless we are.
        - id: ch03-b17
          speaker: narrator
          text: The screech owl asked him to explain. So the Caliph told her the whole story. He described the pedlar and the mysterious scroll, Selim's translation, the magic powder, and the visit to the pond. He told her how he and Mansor had laughed at the dancing stork, forgotten the one word that could save them, and then watched Mirza take his place in Bagdad.
    - id: ch04
      title: IV.
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: When the Caliph finished, the owl thanked him and began her own tale.
        - id: ch04-b02
          speaker: princess_lusa
          text: My story will show you that I am no less unfortunate than you. My father is the King of the Indies, and I am his only daughter, Princess Lusa. Kaschnur caused my misery too. He once asked my father to give me in marriage to his son Mirza. My father has a quick temper, and he ordered the magician to be thrown downstairs.
        - id: ch04-b03
          speaker: princess_lusa
          text: Not long afterward, Kaschnur found another way to reach me. I was walking in the garden and asked for something to drink. Disguised as a slave, he brought me a potion. The moment I swallowed it, I became this hideous owl. I fainted in terror, and he carried me to these ruins.
          emotion: fearful
        - id: ch04-b04
          speaker: princess_lusa
          text: In his dreadful voice, he told me I would remain here until the end of my days, lonely, ugly, and hated even by animals. Only one thing could free me. Someone must choose, of his own will, to ask me to be his wife. That was how Kaschnur took revenge on me and my proud father.
          emotion: sad
        - id: ch04-b05
          speaker: princess_lusa
          text: Many months have passed since then. I live alone inside these walls, cut off from the world and frightening even the animals. I cannot enjoy the beauty outside because daylight blinds me. Only when the moon shines over the ruins does the darkness lift from my eyes and let me see.
          emotion: sad
        - id: ch04-b06
          speaker: narrator
          text: Lusa paused to wipe away fresh tears. The Caliph thought deeply about her story.
        - id: ch04-b07
          speaker: caliph_chasid
          text: I believe our troubles are connected in some hidden way. The question is how we can discover the key to them.
        - id: ch04-b08
          speaker: princess_lusa
          text: I believe so too, my lord. When I was very young, a wise woman foretold that a stork would bring me great happiness. And I may know a way for all of us to escape.
        - id: ch04-b09
          speaker: narrator
          text: The Caliph stared at her in surprise and asked what she meant.
        - id: ch04-b10
          speaker: princess_lusa
          text: The magician who ruined us comes to these ruins once every month. There is a great hall not far from this room where he feasts with his companions. I have watched them often. They boast to one another about their wicked deeds. Perhaps someone will mention the magic word you forgot.
        - id: ch04-b11
          speaker: caliph_chasid
          text: Dear Princess, when will he come? Where is this hall?
        - id: ch04-b12
          speaker: narrator
          text: The owl hesitated before she answered.
        - id: ch04-b13
          speaker: princess_lusa
          text: Please do not think me cruel, but I can reveal that only on one condition.
        - id: ch04-b14
          speaker: caliph_chasid
          text: Name it! Whatever you ask, I will gladly do.
        - id: ch04-b15
          speaker: princess_lusa
          text: I long to be free as well. That can happen only if one of you offers to marry me.
        - id: ch04-b16
          speaker: narrator
          text: Both storks drew back at this. The Caliph signaled Mansor to follow him outside so they could speak privately.
        - id: ch04-b17
          speaker: caliph_chasid
          text: Grand Vizier, this is rather inconvenient. Still, you can marry her.
        - id: ch04-b18
          speaker: grand_vizier_mansor
          text: I certainly cannot! When I return home, my wife would scratch my eyes out. Besides, I am an old man. Your Highness is young and unmarried, so you would suit a young and lovely princess far better.
        - id: ch04-b19
          speaker: caliph_chasid
          text: But that is exactly the trouble. How do you know she is young and lovely? I would be agreeing to a bargain without knowing what I was getting.
        - id: ch04-b20
          speaker: narrator
          text: They argued for some time, but Mansor would not give way. At last the Caliph saw plainly that his Vizier would rather remain a stork until the end of his life than marry the owl. Chasid's wings drooped at the thought of promising himself to a princess whose human face he had never seen. Even so, he decided that he would meet Lusa's condition himself.
        - id: ch04-b21
          speaker: narrator
          text: Lusa was delighted when the Caliph accepted. She told them they could not have arrived at a better time, because the magicians would probably meet that very night. When darkness came, she led the two storks toward the hall. They followed her through a long, black passage until a bright ray appeared ahead, shining through cracks in a half-ruined wall. As they reached the opening, the owl warned them to keep perfectly quiet.
        - id: ch04-b22
          speaker: narrator
          text: Through the gap beside them, they could see the whole great hall. Splendid carved pillars rose around it, and colored lamps burned in place of daylight. Many dishes covered a round table. Eight men sat on a divan around the feast. The two storks recognized one of those wicked men at once. He was the pedlar who had sold them the powder. The man beside him asked what evil he had done most recently, and Kaschnur proudly told the story of the Caliph and his Vizier.
        - id: ch04-b23
          speaker: old_sorcerer
          text: And what word did you give them?
        - id: ch04-b24
          speaker: pedlar_kaschnur
          text: A very difficult Latin word. It is “Mutabor.”
    - id: ch05
      title: V.
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The moment the storks heard the word, they nearly went wild with joy. They raced toward the castle door so quickly that Lusa could scarcely keep up. Once they were outside, the Caliph turned to her with deep feeling.
        - id: ch05-b02
          speaker: caliph_chasid
          text: You have delivered my friend and me. To prove my gratitude will last forever, I ask you to become my wife.
        - id: ch05-b03
          speaker: narrator
          text: Then he faced east. The sun was just rising above the mountains. Three times the storks bent their long necks toward it.
        - id: ch05-b04
          speakers: [caliph_chasid, grand_vizier_mansor]
          ensemble: duo
          text: Mutabor!
        - id: ch05-b05
          speaker: narrator
          text: In an instant, feathers, wings, long bills, and thin red legs all vanished. They were men again. Overcome with the joy of getting their lives back, master and servant fell into each other's arms, laughing and weeping. For a while they forgot everything else. Then they turned around and stopped in astonishment. A beautiful lady in exquisite clothes stood before them.
        - id: ch05-b06
          speaker: narrator
          text: Smiling, she offered the Caliph her hand.
        - id: ch05-b07
          speaker: princess_lusa
          text: Do you not recognize your screech owl?
        - id: ch05-b08
          speaker: narrator
          text: It was truly Lusa. The Caliph was so charmed by her beauty and grace that he declared his life as a stork the luckiest thing that had ever happened to him.
        - id: ch05-b09
          speaker: narrator
          text: The three travelers immediately set out for Bagdad. Fortunately, the Caliph found both his purse and the box of magic powder still tucked safely inside his girdle. That meant they did not have to continue their journey empty-handed. In the nearest village, he used the money to buy everything the three of them needed for the road. They traveled on until, at last, the familiar gates of Bagdad stood before them.
        - id: ch05-b10
          speaker: narrator
          text: The Caliph's arrival caused a great commotion in Bagdad. Everyone had given him up for dead, and the people rejoiced when they saw their beloved ruler alive again. Their relief was matched by their fury against the man who had taken his throne. They gathered in force, marched to the palace, and seized both Mirza and the old magician Kaschnur.
        - id: ch05-b11
          speaker: narrator
          text: The Caliph sent Kaschnur to the ruined room where Lusa had lived as an owl, and there the magician was hanged. Mirza, however, had known nothing of his father's schemes. The Caliph gave him a choice between death and a pinch of magic snuff. Mirza chose the snuff, and Mansor handed him the box. One large pinch and the magic word changed him into a stork. The Caliph had him shut in an iron cage in the palace gardens.
        - id: ch05-b12
          speaker: narrator
          text: Caliph Chasid lived happily for many years with his wife, Princess Lusa. His merriest time of day was the afternoon, when Grand Vizier Mansor came for his usual visit. Whenever the Caliph was in especially high spirits, he would imitate the way his Vizier had looked as a stork. He strutted solemnly up and down the room on stiff legs, chattered through an imaginary bill, and showed everyone how Mansor had bowed uselessly toward the east while crying, “Mu... mu...”
        - id: ch05-b13
          speaker: narrator
          text: The Caliphess and her children always laughed at the performance. But if the Caliph kept nodding, bowing, and calling “Mu... mu...” for too long, Mansor would laugh and threaten to tell the Caliphess exactly what the two storks had discussed one night outside Princess Screech Owl's door.
