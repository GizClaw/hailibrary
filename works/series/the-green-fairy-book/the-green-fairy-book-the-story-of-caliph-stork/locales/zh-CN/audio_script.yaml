audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，像编书人面对孩子娓娓而谈
        timbre: 温暖清朗
        pace: 舒缓而有自然起伏
        pitch: 中音
    caliph_chasid:
      display_name: 哈里发哈西德
      tts:
        delivery: 威严爽朗，兴致高时诙谐活泼，危急时果断
        timbre: 饱满明亮
        pace: 适中
        pitch: 中低音
    grand_vizier_mansor:
      display_name: 大维齐尔曼苏尔
      tts:
        delivery: 恭谨机敏，偶尔带克制的幽默与忧虑
        timbre: 稳重温厚
        pace: 稍慢
        pitch: 中低音
    kaschnur:
      display_name: 巫师卡施努尔
      tts:
        delivery: 伪装时圆滑谦卑，显露身份时阴沉狠毒
        timbre: 粗哑低沉
        pace: 适中
        pitch: 低音
    selim:
      display_name: 博学者塞利姆
      tts:
        delivery: 谨慎恭敬，辨认文字后笃定清楚
        timbre: 清晰沉静
        pace: 从容
        pitch: 中音
    dame_longlegs:
      display_name: 长腿太太
      tts:
        delivery: 热情随和，带清晨觅食时的轻快
        timbre: 清脆柔和
        pace: 适中
        pitch: 中高音
    chatterbill:
      display_name: 碎嘴小姐
      tts:
        delivery: 年轻轻盈，说起舞蹈时认真又兴奋
        timbre: 明亮轻巧
        pace: 稍快
        pitch: 高音
    citizen_1:
      display_name: 巴格达市民甲
      tts:
        delivery: 随众高呼，响亮热烈
        timbre: 明亮有力
        pace: 适中
        pitch: 中音
    citizen_2:
      display_name: 巴格达市民乙
      tts:
        delivery: 随众高呼，响亮热烈
        timbre: 浑厚开阔
        pace: 适中
        pitch: 中低音
    citizen_3:
      display_name: 巴格达市民丙
      tts:
        delivery: 随众高呼，响亮热烈
        timbre: 清亮高昂
        pace: 适中
        pitch: 中高音
    princess_lusa:
      display_name: 卢莎公主
      tts:
        delivery: 身陷魔法时忧伤克制，得到希望后温柔坚定
        timbre: 柔美清澈，略带沙哑
        pace: 舒缓
        pitch: 中高音
    old_sorcerer:
      display_name: 老巫师
      tts:
        delivery: 阴险好奇，闲谈恶事时漫不经心
        timbre: 干涩苍老
        pace: 稍慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 第一章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            一个晴朗的午后，巴格达的哈里发哈西德舒舒服服地靠在软榻上。他吸着长烟管，不时接过奴隶递来的咖啡。每喝一口，他就心满意足地捋一捋长胡子。谁都看得出，他这会儿心情好极了。一天之中，再没有比这更适合求见他的时刻。大维齐尔曼苏尔深知这一点，所以每天总挑这个时辰来拜见，因为哈里发此刻往往和颜悦色，又有兴致听人说话。
        - id: ch01-b02
          speaker: narrator
          text: >-
            这天下午，曼苏尔也像往常一样准时来了，脸上却一反平日的模样，满是愁容。哈里发把烟管从嘴边移开片刻，问他为什么这样忧心。
        - id: ch01-b03
          speaker: grand_vizier_mansor
          text: >-
            陛下，臣不知道脸上有没有愁色。只是宫殿院子里来了个货郎，卖的东西实在漂亮，臣偏偏没有多少闲钱，想起来就懊恼。
        - id: ch01-b04
          speaker: narrator
          text: >-
            哈里发早想送维齐尔一件礼物，立刻叫黑奴把货郎带来。奴隶很快回来，身后跟着一个又矮又胖的男人。那人脸色黝黑，衣服破破烂烂，背来的货箱里却什么都有。里面放着一串串珍珠、戒指、镶嵌华贵的手枪、酒杯和梳子，件件精美。哈里发和曼苏尔仔细看了一遍。哈里发给自己和曼苏尔各选了一把漂亮的手枪，又给维齐尔的妻子挑了一把宝石梳子。货郎正要关箱子，哈里发发现里面还有个小抽屉，便问那里是否也有东西出售。抽屉打开以后，里面藏着一盒黑粉和一卷怪字，哈里发和曼苏尔谁也读不懂。
        - id: ch01-b05
          speaker: kaschnur
          text: >-
            这两样东西是一个商人在麦加街头捡到的，我从他那里收了来。我也不知道有什么用。您给几个小钱，就都拿去吧。
        - id: ch01-b06
          speaker: narrator
          text: >-
            哈里发一向喜欢往藏书室里收藏古手稿，就算一个字也看不懂，他也不在意。他花钱买下纸卷和盒子，打发货郎离开。可纸卷的内容勾起了他的好奇心。他把那一行行神秘的文字翻来覆去地看，越看越想知道上面究竟写了什么，便问曼苏尔是否认识能辨认这种文字的人。
        - id: ch01-b07
          speaker: grand_vizier_mansor
          text: >-
            陛下，大清真寺附近住着博学者塞利姆，世上的语言他都懂。不如召他来，也许他能解开这些怪字。
        - id: ch01-b08
          speaker: narrator
          text: >-
            塞利姆很快奉召进宫。哈里发说，听说他学问渊博，现在就请他仔细看纸卷。读得出来，便赏一件荣服。读不出来，脸颊各打十二下，脚底再打二十五下，罚他冒领博学者的名号。
        - id: ch01-b09
          speaker: selim
          text: >-
            一切听凭陛下旨意。
        - id: ch01-b10
          speaker: narrator
          text: >-
            塞利姆伏在地上行过礼，对着纸卷看了许久，忽然认出了文字。
        - id: ch01-b11
          speaker: selim
          text: >-
            陛下，倘若这不是拉丁文，我情愿一死！
          emotion: surprised
        - id: ch01-b12
          speaker: caliph_chasid
          text: >-
            既然是拉丁文，就念给我们听听，它到底是什么意思。
        - id: ch01-b13
          speaker: selim
          text: >-
            “拾得此物的人，应当赞美安拉的慈悲。谁嗅取盒中粉末，同时念出‘穆塔博尔’，谁就能变成任何一种生灵，还能听懂所有动物的话。想恢复人形，只要朝东方鞠躬三次，再念一遍这个词。可是，变成飞禽走兽以后千万不能发笑，否则就会忘记咒语，永远做一只动物。”
        - id: ch01-b14
          speaker: narrator
          text: >-
            塞利姆读完以后，哈里发听得喜不自胜。他叫这位智者发誓，不向任何人泄露魔粉和纸卷的秘密，又赏给他一件华美的荣服，这才让他退下。
        - id: ch01-b15
          speaker: caliph_chasid
          text: >-
            曼苏尔，这笔买卖可太值了！我真想马上变成一种动物。明早你早点来，我们到城外去嗅一点粉末，听听天上、地上和水里的生灵都在说什么。
    - id: ch02
      title: 第二章
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            第二天早晨，哈里发才穿戴完、吃过早饭，曼苏尔便依约赶到，要陪他一同探险。哈里发把鼻烟盒塞进腰带，吩咐仆从全留在家里，只同维齐尔出了门。两人先走遍宫廷花园，始终没遇上让他们动心、愿意试用魔法的动物。曼苏尔便提起城外的池塘，那里常有许多动物，尤其是鹳鸟。它们神情庄重，姿态威严，又爱不停说话，他早就想知道那些鹳鸟究竟在聊些什么。
        - id: ch02-b02
          speaker: narrator
          text: >-
            到了池塘边，他们看见一只鹳鸟神气地踱来踱去，一边找青蛙，一边嘟囔。高空中还有一只鹳鸟，正朝这里飞来。
        - id: ch02-b03
          speaker: grand_vizier_mansor
          text: >-
            陛下，臣敢拿胡子打赌，这两个长腿家伙一定会聊个痛快。我们何不变成鹳鸟？
        - id: ch02-b04
          speaker: caliph_chasid
          text: >-
            好主意。不过先把变回人的方法记牢。朝东方鞠躬三次，念“穆塔博尔”，我还是哈里发，你还是大维齐尔。看在真主的分上，千万不能笑，否则我们就完了！
        - id: ch02-b05
          speaker: narrator
          text: >-
            第二只鹳鸟正在他们头顶盘旋。哈里发赶紧取出盒子，自己嗅了一大撮，又递给曼苏尔一撮。
        - id: ch02-b06
          speakers: [caliph_chasid, grand_vizier_mansor]
          ensemble: duo
          text: 穆塔博尔！
        - id: ch02-b07
          speaker: narrator
          text: >-
            咒语才一出口，两人的腿立刻缩了起来，转眼变得又细又红。脚上那双精致的黄拖鞋化成笨重的鹳爪，两条胳膊也成了翅膀。接着，脖子从肩膀中间一直往外伸，越长越长，最后足有一码。两人的胡子全都消失，身体从头到脚盖满羽毛。他们看着彼此的怪模样，惊呆了，好半天没有出声。
        - id: ch02-b08
          speaker: caliph_chasid
          text: >-
            维齐尔阁下，你这张长嘴可真气派！凭先知的胡子起誓，我从没见过这样的东西！
          emotion: surprised
        - id: ch02-b09
          speaker: grand_vizier_mansor
          text: >-
            多谢陛下。容臣冒昧说一句，陛下做鹳鸟，比做哈里发时还英俊呢。我们过去听听那两位同伴说话吧，也好验证自己是不是真懂鹳鸟的语言。
        - id: ch02-b10
          speaker: narrator
          text: >-
            空中的鹳鸟落了地。它用爪子刮刮长嘴，理顺羽毛，向第一只走去。哈里发和曼苏尔也赶紧凑近。
        - id: ch02-b11
          speaker: chatterbill
          text: >-
            早安，碎嘴小姐。今天出来得真早！
        - id: ch02-b12
          speaker: dame_longlegs
          text: >-
            是呀，亲爱的长腿太太！我正找早饭呢。你要不要吃一截蜥蜴，或者来一只青蛙腿？
        - id: ch02-b13
          speaker: chatterbill
          text: >-
            多谢，可我今天没有胃口。我是来练舞的，待会儿要跳给父亲的客人看。在这片草地上练，清静些。
        - id: ch02-b14
          speaker: narrator
          text: >-
            年轻的鹳鸟马上跳起一连串奇妙得难以形容的舞步。哈里发和曼苏尔惊奇地看了好一阵。最后，它用一条腿稳稳站定，摆出一副如画的姿态，两只翅膀还优雅地上下扇动。两人再也忍不住，长嘴里同时爆发出一阵绵延不绝的大笑。他们笑了许久才恢复平静，那两只真正的鹳鸟早已被笑声吓得飞走了。
        - id: ch02-b15
          speaker: caliph_chasid
          text: >-
            我这辈子没见过更好笑的事！可惜那两个蠢家伙跑了，不然接下来准会唱歌给我们听！
          emotion: happy
        - id: ch02-b16
          speaker: narrator
          text: >-
            曼苏尔猛然想起纸卷上的警告，连忙说出心里的恐惧。
        - id: ch02-b17
          speaker: caliph_chasid
          text: >-
            凭麦加和麦地那起誓！要是我余生都得做鹳鸟，这笑话可糟透了！快想想那个蠢词，我已经忘光了。
          emotion: fearful
        - id: ch02-b18
          speaker: grand_vizier_mansor
          text: >-
            我们朝东方鞠躬三次，然后说“穆……穆……穆……”
          emotion: fearful
        - id: ch02-b19
          speaker: narrator
          text: >-
            两人赶紧转向东方，一遍又一遍地弯腰，弯得长嘴都碰到了地。可怕的是，那个词已经彻底从记忆里消失。哈里发无论鞠多少次躬也没用，曼苏尔无论怎样可怜巴巴地念着“穆……穆……”，也接不出后面的音节。不幸的哈西德和曼苏尔再也变不回人，只能继续做两只鹳鸟。
    - id: ch03
      title: 第三章
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            两只中了魔法的鸟伤心地在草地上游荡，满心愁苦，怎么也想不出下一步该怎么办。他们无法摆脱这副新模样，回城表明身份也没有用。谁会相信一只鹳鸟开口宣称自己是哈里发呢？即使人们真的相信，巴格达的百姓又肯让一只鹳鸟统治他们吗？
        - id: ch03-b02
          speaker: narrator
          text: >-
            他们这样游荡了好几天，只能吃些果子充饥。长嘴吃果子很费劲，可他们又实在不喜欢青蛙和蜥蜴。身陷这样的愁境，唯一能安慰他们的，就是这副身体还会飞。于是他们常掠过巴格达的屋顶，察看城里的动静。头几天，街上处处混乱，人们忧心不安。第四天左右，他们停在宫殿屋顶，看见一支盛大的队伍从下面经过。鼓声和号声一齐响起，一个披着金绣红斗篷的男人骑在装饰华丽的马上，衣着富贵的奴仆簇拥四周。大半个巴格达的人都跟在后面高喊。
        - id: ch03-b03
          speakers: [citizen_1, citizen_2, citizen_3]
          ensemble: chorus
          text: 向巴格达之主米尔扎致敬！
        - id: ch03-b04
          speaker: caliph_chasid
          text: >-
            大维齐尔，现在你明白我为什么会中魔法了吧？这个米尔扎，正是我那死敌、大巫师卡施努尔的儿子。卡施努尔曾在盛怒之下发过毒誓，一定要找我报仇。可我绝不会绝望。忠诚的朋友，跟我去先知的陵墓吧，也许到了那片圣地，我们身上的魔法就能解除。
        - id: ch03-b05
          speaker: narrator
          text: >-
            两人从宫殿屋顶腾空而起，张开翅膀，朝麦地那飞去。可他们才做了几天鹳鸟，还没有多少飞行的经验，这一路远没有想象中轻松。两个钟头以后，曼苏尔已经气喘吁吁，再也追不上前面的哈里发。
        - id: ch03-b06
          speaker: grand_vizier_mansor
          text: >-
            陛下，臣真的飞不动了。您飞得太快，臣跟不上。天也快黑了，我们该找个地方过夜。
        - id: ch03-b07
          speaker: narrator
          text: >-
            哈西德觉得这个建议很有道理。他向下望去，看见山谷里有一片似乎能遮风避雨的废墟，便同曼苏尔收起翅膀，朝那里飞了下去。他们打算在那座建筑里过夜。那里从前显然是一座城堡，虽然如今只剩断壁残垣，瓦砾堆中还立着几根漂亮的柱子，几间屋子也保存得相当完好，处处让人看得出往日的繁华。两人沿着一道道走廊徘徊，寻找一个干燥的落脚处，曼苏尔却忽然停住。
        - id: ch03-b08
          speaker: grand_vizier_mansor
          text: >-
            陛下，一位大维齐尔怕鬼已经够可笑，鹳鸟怕鬼就更可笑了。可臣真有点害怕。附近有什么人，或是什么东西，刚才清清楚楚地叹气呻吟了。
          emotion: fearful
        - id: ch03-b09
          speaker: narrator
          text: >-
            哈里发停下来，果然听见一阵低低的哭声，听着像人，不像动物。他满心好奇，立刻要冲向声音传来的地方。曼苏尔用长嘴衔住他的翅膀，苦苦求他别再闯进陌生的新危险。可哈里发的鹳鸟胸膛里跳着一颗勇敢的心。他硬是挣脱开来，虽然被扯掉了几根羽毛，仍匆匆奔过幽暗的走廊，来到一扇虚掩的门前。门里一声声叹息，还夹杂着抽泣。他用长嘴推开门，却被眼前所见惊得停在门槛上。
        - id: ch03-b10
          speaker: narrator
          text: >-
            残破的房间里，只有一扇带铁栏的小窗透进暗淡的光。地上坐着一只巨大的鸣角鸮，大颗泪珠正从它又圆又大的眼睛里滚下来。它张开弯曲的鸟喙，用沙哑的声音倾诉悲苦。曼苏尔这时也悄悄跟来了。鸣角鸮一看见他们，顿时欢喜地叫了一声。它用带着棕色斑点的翅膀轻轻擦去眼泪，接着竟用一口流利的人类阿拉伯语向两位来客说话。
        - id: ch03-b11
          speaker: princess_lusa
          text: >-
            欢迎你们，两位鹳鸟！你们是我获救的好兆头。曾有人预言，一只鹳鸟会给我带来好运。
          emotion: happy
        - id: ch03-b12
          speaker: narrator
          text: >-
            哈里发回过神来，把脚摆得很优雅，又弯下长脖子。
        - id: ch03-b13
          speaker: caliph_chasid
          text: >-
            鸣角鸮啊，听你的话，我们似乎同病相怜。可你想靠我们获救，恐怕要失望了。等你听过我们的遭遇，就知道我们多么无能为力。
        - id: ch03-b14
          speaker: narrator
          text: >-
            鸣角鸮请他说下去，哈里发便从那个神秘的货郎讲起，把魔粉、变形、池塘边的大笑，以及忘掉咒语的经过全讲了一遍。那正是我们已经知道的故事。
    - id: ch04
      title: 第四章
      blocks:
        - id: ch04-b01
          speaker: princess_lusa
          text: >-
            现在也请听听我的故事。听完以后，你们会承认，我的不幸绝不比你们少。我是印度国王唯一的女儿，名叫卢莎。卡施努尔也正是害苦我的人。他曾替儿子米尔扎向我父亲求婚。父亲脾气急，当场叫人把他扔下楼梯。没过多久，他换了一副模样，设法接近我。一天，我在花园里想喝点东西，他假扮成奴隶，送来一杯饮料。我一喝下去，立刻变成这副可怕的样子。我吓得昏了过去，他又把我带到这里，用骇人的声音诅咒我。
          emotion: sad
        - id: ch04-b02
          speaker: princess_lusa
          text: >-
            他说：“你要孤单又丑陋地留在这里，连野兽也会鄙弃你，直到死去。除非有一个人心甘情愿地向你求婚。我要这样报复你和你骄傲的父亲。”
        - id: ch04-b03
          speaker: princess_lusa
          text: >-
            从那以后，好几个月过去了。我像隐士一样悲伤又孤独地住在这些墙壁里。世人避开我，连动物也把我当成可怕的东西。大自然的美景全藏在我的眼睛之外，因为白天我什么都看不见。只有月亮把苍白的光洒到这里，遮住眼睛的帷幕才会落下，我才能重新看见。
          emotion: sad
        - id: ch04-b04
          speaker: narrator
          text: >-
            她说着停下来，再次用翅膀擦拭双眼。回想这些苦难，新的泪水又涌了出来。哈里发听完公主的故事，陷入深深的思索，许久没有说话。
        - id: ch04-b05
          speaker: caliph_chasid
          text: >-
            如果我没猜错，我们的不幸之间必定藏着联系。可到哪里去找解开谜团的钥匙呢？
        - id: ch04-b06
          speaker: princess_lusa
          text: >-
            陛下，我也这样想。我小时候，一位聪慧的女人预言，鹳鸟会给我带来莫大的幸福。我也许知道怎样救我们大家。
        - id: ch04-b07
          speaker: narrator
          text: >-
            哈里发十分惊讶，赶紧追问她有什么办法。鸣角鸮便告诉他，害苦他们的卡施努尔每个月都会来这片废墟一次。离这间屋子不远有一座大厅，他常同伙伴们在那里饮宴。她已经暗中观察过他们许多回。那些巫师坐在一起，会把各自干过的坏事全都讲出来。只要藏在旁边耐心听着，也许卡施努尔就会说出哈里发已经忘掉的那句咒语。
        - id: ch04-b08
          speaker: caliph_chasid
          text: >-
            最亲爱的公主，他什么时候来？那座大厅又在哪里？
        - id: ch04-b09
          speaker: princess_lusa
          text: >-
            请别以为我无情。我只有一个条件，您答应以后，我才能告诉您。
        - id: ch04-b10
          speaker: caliph_chasid
          text: >-
            快说吧！无论你要什么，我都愿意照办！
        - id: ch04-b11
          speaker: princess_lusa
          text: >-
            我也想重获自由。可只有你们当中一位向我求婚，我才可能得救。
        - id: ch04-b12
          speaker: narrator
          text: >-
            两只鹳鸟都被这个条件弄得措手不及，一时谁也没有回答。哈里发向曼苏尔使了个眼色，示意他暂且退出房间，到门外单独商量。
        - id: ch04-b13
          speaker: caliph_chasid
          text: >-
            大维齐尔，这事真难办。不过，你娶她就好了。
        - id: ch04-b14
          speaker: grand_vizier_mansor
          text: >-
            那臣回家以后，岂不是要让妻子抓瞎双眼？何况臣已经老了。陛下年轻未婚，和一位年轻貌美的公主才更般配。
        - id: ch04-b15
          speaker: caliph_chasid
          text: >-
            麻烦就在这里。你怎么知道她年轻貌美？这不是蒙着眼睛买东西吗？
        - id: ch04-b16
          speaker: narrator
          text: >-
            两人在门外争了好一阵。哈里发终于明白，曼苏尔宁可一辈子做鹳鸟，也不肯娶鸣角鸮，只好下定决心，亲自履行这个条件。鸣角鸮听见答复，喜出望外。她告诉两人，他们来的时机再好不过，因为巫师们很可能就在当天夜里聚会。
        - id: ch04-b17
          speaker: narrator
          text: >-
            她领着两只鹳鸟穿过漫长幽暗的走廊。前方终于有一道亮光从半塌的墙缝里透出。走到近前，鸣角鸮叫他们一声也别出。透过身边的缺口，他们能看清整座华丽大厅。厅里立着精美的雕花柱子，一盏盏彩灯代替了日光。中间的圆桌摆满各样菜肴，桌旁围着一圈软榻，上面坐着八个男人。其中一个正是卖给他们魔粉的货郎。坐在他身旁的人请他讲讲最近干过的事，他便得意地说起自己怎样让哈里发和维齐尔变成鹳鸟，又让他们因为发笑而忘掉咒语。
        - id: ch04-b18
          speaker: old_sorcerer
          text: >-
            你给他们的咒语是什么？
        - id: ch04-b19
          speaker: kaschnur
          text: >-
            一个很难的拉丁词，叫“穆塔博尔”。
    - id: ch05
      title: 第五章
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            两只鹳鸟一听见这个词，欢喜得几乎发狂。他们飞快地奔向破城堡的大门，跑得鸣角鸮几乎追不上。到了门口，天已经快亮了。哈里发转过身，动情地面对这位救了他们的公主。
        - id: ch05-b02
          speaker: caliph_chasid
          text: >-
            是你救了我，也救了我忠诚的朋友。你是我们两人的恩人。为了表明我会永远记住这份恩情，我愿意履行自己的承诺。公主，请你接受我做你的丈夫。
        - id: ch05-b03
          speaker: narrator
          text: >-
            说完，他随即转身面朝东方。太阳正从远处的山峦上升起，把清晨的光洒在破城堡前。两只鹳鸟正对着朝阳，慢慢弯下长长的脖子，一连鞠了三次躬。
        - id: ch05-b04
          speakers: [caliph_chasid, grand_vizier_mansor]
          ensemble: duo
          text: 穆塔博尔！
        - id: ch05-b05
          speaker: narrator
          text: >-
            转眼间，两人便恢复了人形。主仆仿佛重新得到了生命，狂喜之下，又哭又笑地拥抱在一起。过了好一会儿，他们才想起回过身来。一位衣着华美的美丽姑娘正站在面前，那份惊讶简直无法形容。
        - id: ch05-b06
          speaker: princess_lusa
          text: >-
            您认不出自己的鸣角鸮了吗？
        - id: ch05-b07
          speaker: narrator
          text: >-
            果然是她。哈里发被公主的优雅和美貌深深迷住，当即认定变成鹳鸟是自己一生遇到的最大幸事。三人立刻动身返回巴格达。幸运的是，装魔粉的小盒还留在哈里发的腰带里，钱袋也没有遗失。他们便在最近的村子买齐旅途中需要的一切，继续赶路，最后终于来到巴格达城门。
        - id: ch05-b08
          speaker: narrator
          text: >-
            哈里发的归来轰动了全城。自从他消失以后，人们早已认定他死了，如今再见到敬爱的统治者，无不欢喜若狂。可是，他们对篡位者米尔扎的怒火也同样猛烈。百姓聚成声势浩大的队伍，一齐冲进宫殿，捉住老巫师和他的儿子。哈里发把卡施努尔押到卢莎做鸣角鸮时住过的那间房，命人在那里把他绞死。
        - id: ch05-b09
          speaker: narrator
          text: >-
            米尔扎并不知道父亲做过什么，哈里发没有立刻处死他，而是让他在死亡和嗅一撮魔粉之间作出选择。米尔扎选了魔粉。曼苏尔把盒子递过去，他用力嗅下一大撮，又念出咒语，马上变成一只鹳鸟。哈里发命人把这只鹳鸟关进一只铁笼，安置在宫廷花园里。
        - id: ch05-b10
          speaker: narrator
          text: >-
            哈里发哈西德同妻子卢莎公主幸福地生活了许多年。他一天里最快乐的时光，仍是大维齐尔下午来访的时候。每逢兴致格外好，他还会屈尊模仿曼苏尔做鹳鸟时的样子。他绷直双腿，神情庄重地在房间里来回踱步，嘴里喋喋叫着，还表演维齐尔怎样徒劳地朝东方鞠躬，一声声喊着“穆……穆……”。哈里发夫人和孩子们每回都被这番表演逗得开怀大笑。
        - id: ch05-b11
          speaker: narrator
          text: >-
            不过，要是哈里发点头鞠躬太久，“穆……穆……”也叫个不停，曼苏尔就会笑着威胁他，说要把那天夜里他们站在鸣角鸮公主门外商量的内容，一五一十地告诉哈里发夫人。
