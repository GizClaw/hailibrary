audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and attentive fairy-tale storytelling
        timbre: clear and gently resonant
        pace: measured
        pitch: medium
    fiddler:
      display_name: Fiddler
      tts:
        delivery: good-natured, lively, and easily unsettled
        timbre: warm and youthful
        pace: natural
        pitch: medium
    trumpeter:
      display_name: Trumpeter
      tts:
        delivery: hearty, confident, and plainspoken
        timbre: bright and sturdy
        pace: natural
        pitch: medium-low
    flute_player:
      display_name: Flute-Player
      tts:
        delivery: fearless, quick-witted, and resolute
        timbre: clear and youthful
        pace: natural
        pitch: medium
    dwarf:
      display_name: Grey Dwarf
      tts:
        delivery: sly, rasping, and changeable between pleading and menace
        timbre: dry and weathered
        pace: deliberate
        pitch: medium-high
    princess:
      display_name: Princess
      tts:
        delivery: gracious, tender, and serene
        timbre: luminous and clear
        pace: measured
        pitch: medium-high
  chapters:
    - id: ch01
      title: The Haunted Castle
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, three musicians left home to seek their fortune in foreign lands. They had all learned from the same master, and they meant to stay together. They wandered happily from place to place, earning a good living wherever people heard them play.
        - id: ch01-b02
          speaker: narrator
          text: One evening they stopped in a village and filled the room with beautiful music. Everyone listening was delighted. When the playing was done, the musicians sat down to eat and drink, and they listened as the villagers traded gossip and told one wonderful tale after another. Before long, everyone was talking about a castle nearby. Strange and marvelous stories surrounded the place. One person claimed that treasure lay hidden there. Another said the empty castle was always stocked with the richest food, though no one lived inside. A third warned that a dreadful spirit haunted its walls, and anyone who forced a way in came out more dead than alive.
        - id: ch01-b03
          speaker: narrator
          text: Later, alone in their bedroom, the musicians agreed to explore the mysterious place and carry away the treasure if they could. They would go separately, from oldest to youngest, and each man would have one full day to try his luck.
        - id: ch01-b04
          speaker: narrator
          text: The fiddler went first, cheerful and full of courage. The castle gate stood open as though someone expected him. But the moment he crossed the entrance, the heavy door slammed behind him. A great iron bar shot into place, just as if an unseen guard had locked it. Not a soul was there.
        - id: ch01-b05
          speaker: narrator
          text: Terror swept over him. There was no hope of turning back, and standing still would do no good. So he fixed his mind on the gold and treasure he hoped to find, and that gave him enough courage to press on. He searched upstairs and down, passing through high halls, grand rooms, and pretty little private chambers. Everything was beautifully arranged and perfectly kept, as though unseen servants cared for it each day. Yet the silence was like death. There was no living creature anywhere, not even a fly.
        - id: ch01-b06
          speaker: narrator
          text: His courage returned when he reached the rooms below. The kitchen held every tempting food he could imagine. The cellars were full of the costliest wines, and the storeroom was packed with pots of every kind of jam. A bright fire burned in the kitchen. A roast turned before it and was basted by unseen hands, while vegetables and other fine dishes were prepared in the same mysterious way. Before the fiddler had time to think about any of it, invisible hands guided him into a small room. There they spread a table with all the delicious food he had just seen cooking.
        - id: ch01-b07
          speaker: narrator
          text: He took up his fiddle first and played a lovely tune. It rang through the silent halls. Then he settled down to a hearty meal.
        - id: ch01-b08
          speaker: narrator
          text: Soon the door opened, and in walked a man no more than three feet tall. He wore a dressing gown over his little body. His face was wrinkled, and his grey beard hung all the way to the silver buckles on his shoes. The tiny man sat beside the fiddler and shared his dinner.
        - id: ch01-b09
          speaker: fiddler
          text: Here, take the knife and fork. Help yourself first, then pass the dish to me.
        - id: ch01-b10
          speaker: narrator
          text: The dwarf nodded. But as he carved a piece of game, he fumbled it and let it fall to the floor. The good-natured fiddler bent to pick it up.
        - id: ch01-b11
          speaker: narrator
          text: In the blink of an eye, the little man leaped onto his back. He beat the fiddler over the head and body until the poor young man was bruised black and blue and nearly dead. Only then did the wretch stop. He dragged the fiddler away and shoved him through the iron gate he had entered in such high spirits only a few hours before.
        - id: ch01-b12
          speaker: narrator
          text: The fresh air revived the fiddler enough for him to stagger back to the inn on aching legs. It was night when he arrived, and his companions were already asleep. In the morning they were amazed to find him in bed beside them. They crowded around with questions, but he hid his battered face and back and gave them only a short answer.
        - id: ch01-b13
          speaker: fiddler
          text: Go and find out for yourselves. I can tell you this much. It is dangerous business.
    - id: ch02
      title: The Third Musician
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The second musician, the trumpeter, set off for the castle next. Everything happened just as it had to the fiddler. The open gate let him in and shut behind him. The silent castle offered him its wonderful food as though he were an honored guest. Then the dwarf tricked him and beat him just as cruelly. He struggled back to the inn, and the following morning he too lay in bed like a wounded hare.
        - id: ch02-b02
          speaker: trumpeter
          text: Believe me, getting into that haunted castle is no pleasant task.
        - id: ch02-b03
          speaker: narrator
          text: In spite of both warnings, the youngest musician was determined to take his turn. He played the flute, and he set out with courage, meaning to find the hidden treasure and make it his if he possibly could.
        - id: ch02-b04
          speaker: narrator
          text: He roamed through every part of the castle without fear. As he passed through its splendid empty rooms, he thought how pleasant it would be to live there always, especially with a full pantry and cellar ready whenever he wanted them.
        - id: ch02-b05
          speaker: narrator
          text: A table was spread for him too. He wandered for some time first, singing and playing his flute as he passed through the rooms. Then he sat before the delicious meal, ready to enjoy it. The bearded little man came in just as he had before and took a seat beside him. The flute-player did not start or shrink at the strange sight. He chatted as freely as if they had known each other all their lives, though the dwarf answered very little.
        - id: ch02-b06
          speaker: narrator
          text: At last the dish of game arrived. Just as before, the dwarf dropped his piece onto the floor. The flute-player kindly began to bend down, but this time he saw the little man preparing to spring onto his back.
        - id: ch02-b07
          speaker: narrator
          text: The young man spun around, seized the dwarf by his beard, and shook him so fiercely that the whole beard tore free. The dwarf fell to the floor, groaning.
        - id: ch02-b08
          speaker: narrator
          text: The instant the flute-player held that beard, strength rushed through him until he felt ready for anything. His sight changed too. All sorts of things in the castle that he had never noticed before became clear to him. The dwarf suffered the opposite change. With his beard gone, all his strength seemed to leave him. Helpless on the floor, he began to whine and sob.
        - id: ch02-b09
          speaker: dwarf
          text: Please, give me back my beard! I will teach you all the magic that surrounds this castle. I will even help you carry away the hidden treasure. You will be rich and happy for the rest of your life.
          emotion: fearful
        - id: ch02-b10
          speaker: flute_player
          text: You may have your beard when you have helped me as you promised. Until then, it stays in my hands.
        - id: ch02-b11
          speaker: narrator
          text: The old man had never meant to keep his promise. He had only wanted his beard back. Now he had no choice. He led the flute-player through dark secret passages, underground vaults, and walls of grey rock. At last they stepped into an open field that seemed to belong to a world more beautiful than their own.
        - id: ch02-b12
          speaker: narrator
          text: A rushing river blocked their way. The dwarf drew out a wand and touched the waves. At once the water divided and stood still, and the two of them walked across on dry ground.
    - id: ch03
      title: The Enchanted Princess
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Everything beyond the river was wonderfully beautiful. Fresh green paths wound through woods and across fields covered with flowers. Birds with feathers of gold and silver sang from the branches. Lovely butterflies fluttered through the air, glittering beetles crawled below, and gentle little creatures peeped from their hiding places in the bushes and hedges.
        - id: ch03-b02
          speaker: narrator
          text: Even the sky was different. Instead of blue, it shone like rays of pure gold. The stars looked twice as large as the stars on earth, and far more brilliant.
        - id: ch03-b03
          speaker: narrator
          text: The young man grew more amazed with every step. The grey dwarf led him to another castle, much larger and finer than the one they had left. Deep silence ruled this place too.
        - id: ch03-b04
          speaker: narrator
          text: They went from room to room until they reached a chamber with a curtained bed at its center. Above the bed hung a cage. Inside it, a bird poured beautiful songs into the silent room.
        - id: ch03-b05
          speaker: narrator
          text: The dwarf pulled back the heavy curtains and motioned the flute-player nearer. A lovely maiden slept on cushions of rich silk embroidered with gold. She was as beautiful as an angel. Golden hair fell in curls over her pale, marble-like shoulders, and a diamond crown sparkled on her forehead. The young man could only stare. A sleep like death held her fast, and no noise, however loud, seemed able to wake her.
        - id: ch03-b06
          speaker: dwarf
          text: Look at this sleeping maiden. She is a mighty Princess. This enchanted land and this splendid castle belong to her, but she has slept under a spell for hundreds of years. In all that time, no other human being has found a way here.
        - id: ch03-b07
          speaker: dwarf
          text: I alone have guarded her. Every day I went back to my own castle for food, and I beat the greedy treasure hunters who broke into my home. I made sure no stranger came near the Princess.
        - id: ch03-b08
          speaker: dwarf
          text: All my magic was held in my beard. Now that you have taken it, I am helpless. I cannot keep the Princess asleep, and I must reveal the secret I protected.
        - id: ch03-b09
          speaker: dwarf
          text: Do exactly as I tell you. Take the bird above her bed. Its song cast the spell, and it has sung without stopping ever since. Kill the bird, cut out its heart, and burn the heart to powder. Put that powder into the Princess's mouth. She will wake at once, give you her heart and hand, and make her kingdom, castle, and treasures yours.
        - id: ch03-b10
          speaker: narrator
          text: Worn out by this speech, the dwarf fell silent. The young man acted without delay. He carefully did everything he had been told. He took the little bird's heart, burned it into powder, and placed the powder in the Princess's mouth.
        - id: ch03-b11
          speaker: narrator
          text: At once she opened her lovely eyes. She looked into the happy young man's face, kissed him tenderly, and spoke.
        - id: ch03-b12
          speaker: princess
          text: Thank you for freeing me from that magic sleep. I will gladly become your wife.
          emotion: happy
        - id: ch03-b13
          speaker: narrator
          text: At that same moment, a noise like thunder rolled through the whole castle. Footsteps and voices sounded on every staircase and in every room as the long enchantment broke. Men and women servants streamed into the chamber where the happy couple sat. They wished the Princess and her bridegroom joy, then scattered through the castle and returned to all their different duties.
    - id: ch04
      title: The Dwarf's Last Trick
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Now the grey dwarf began demanding his beard. Wicked thoughts were already stirring in him. He knew that once the beard was back on his chin, his magic would return, and then he could put an end to all their happiness.
        - id: ch04-b02
          speaker: narrator
          text: But the clever flute-player was every bit as cunning as the dwarf.
        - id: ch04-b03
          speaker: flute_player
          text: Do not worry. You will get your beard back before we part. First, you must let my bride and me go with you for a little way on your journey home.
        - id: ch04-b04
          speaker: narrator
          text: The dwarf could not refuse while the young man still held his beard. So all three set off together on what the dwarf believed was his journey home. They followed the beautiful green paths through woods and meadows full of flowers until they came once more to the river. It flowed for miles around the Princess's land and formed the border of her whole kingdom.
        - id: ch04-b05
          speaker: narrator
          text: There was no bridge and no ferryboat. The current was so fierce and the waters roared so loudly that even the boldest swimmer would not have tried to cross.
        - id: ch04-b06
          speaker: flute_player
          text: Give me your wand so I can part the waves.
        - id: ch04-b07
          speaker: narrator
          text: Again, the dwarf had to obey because his beard was still in the flute-player's hands. Yet the wicked creature chuckled to himself. He believed the foolish young man would return the beard as soon as they crossed. Then his power would come back. He would seize his wand and keep the couple from ever reaching their beautiful country again.
        - id: ch04-b08
          speaker: narrator
          text: His plan came to nothing. The flute-player struck the water with the wand, and the waves parted and stood still. The dwarf walked ahead and crossed the stream alone.
        - id: ch04-b09
          speaker: narrator
          text: The moment he reached the far bank, the waters closed behind him. The young man and his bride remained safely on the side of the Princess's kingdom. They tossed the beard across the river to its owner, but they kept the wand. Without it, the wicked dwarf could never enter their land again.
    - id: ch05
      title: Gone to Play the Flute
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The happy couple returned to their beautiful castle. There they lived in peace and plenty for the rest of their lives.
        - id: ch05-b02
          speaker: narrator
          text: The other two musicians waited and waited for their companion, but he never came back.
        - id: ch05-b03
          speakers: [fiddler, trumpeter]
          ensemble: duo
          text: Ah, he has gone to play the flute.
        - id: ch05-b04
          speaker: narrator
          text: In time, those words became a proverb. Whenever someone set out to do a task and never returned, people would say that he had gone to play the flute.
