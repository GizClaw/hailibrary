audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，像编书人面对孩子娓娓而谈，幽默处轻巧含笑
        timbre: 温暖清朗
        pace: 舒缓而有自然起伏
        pitch: 中音
    violinist:
      display_name: 小提琴手
      tts:
        delivery: 起初豪爽乐观，受挫后警惕而不愿多谈
        timbre: 明亮结实
        pace: 中速
        pitch: 中音
    trumpeter:
      display_name: 小号手
      tts:
        delivery: 直率谨慎，受伤后语气虚弱而郑重
        timbre: 浑厚微哑
        pace: 中速偏慢
        pitch: 中低音
    flutist:
      display_name: 长笛手
      tts:
        delivery: 勇敢机敏，待人随和，识破诡计时干脆坚定
        timbre: 清亮温和
        pace: 中速，关键处利落
        pitch: 中高音
    dwarf:
      display_name: 小矮人
      tts:
        delivery: 平日阴沉寡言，失去胡须后哀求急促，暗藏狡诈
        timbre: 苍老干涩
        pace: 忽慢忽快
        pitch: 中高音
    princess:
      display_name: 公主
      tts:
        delivery: 初醒时温柔感激，言语端庄真诚
        timbre: 柔和清澈
        pace: 从容
        pitch: 中高音
  chapters:
    - id: ch01
      title: 三人结伴远游
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，有三个乐师离开家乡，一起到外面的世界闯荡。他们拜同一位老师学过音乐，也早早说定，无论走到哪里都不分开，要在异国寻找各自的前程。三个人一路演奏，一路旅行，日子过得快活，收入也很不错。听过他们演奏的人，没有一个不喜欢。
        - id: ch01-b02
          speaker: narrator
          text: >-
            一天傍晚，他们来到一座村庄。美妙的乐声让在场的人听得入迷。等到演奏结束，三位乐师坐下来吃饭喝酒，也听起周围人的闲谈。村里的传闻可真不少，众人讲了一件又一件怪事，最后说到了附近的一座城堡。
        - id: ch01-b03
          speaker: narrator
          text: >-
            关于那座城堡，大家说什么的都有。有人说，那里藏着一批宝物。有人说，城堡里虽然一个人也没有，却永远备着最丰盛的饭菜。还有人说，里面住着一个凶恶可怕的精怪。谁敢硬闯进去，出来时就算没有丧命，也只剩下半条命了。
        - id: ch01-b04
          speaker: narrator
          text: >-
            回到卧房，四下只剩他们三个，乐师们马上商量起来。他们决定到神秘的城堡里看个究竟，要是能找到宝藏，就把它带走。不过，三个人不能一起进去。他们按年纪排好次序，每人单独尝试一天，看谁能交上好运。

    - id: ch02
      title: 两位乐师的遭遇
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            第一个动身的是小提琴手。他兴冲冲地来到城堡，满心都是勇气。外门大敞着，就像主人早知道有客人要来。可是，他才跨过门槛，身后的大门就砰地关上了。一根粗大的铁闩自己落下，牢牢封住出口，仿佛有个看不见的卫兵守在那里。
        - id: ch02-b02
          speaker: narrator
          text: >-
            小提琴手吓坏了。回头已经没有路，停在原地也没用。想到城堡里的黄金和宝物，他才壮起胆子，继续往里走。他楼上楼下找了个遍，穿过高大的厅堂、华丽的房间，还有一间间精巧的小客厅。每一处都收拾得整齐漂亮，可整座城堡静得像死去了一样，连一只苍蝇也看不见。
        - id: ch02-b03
          speaker: narrator
          text: >-
            等他走到下层，心情很快又好了起来。厨房里摆满香喷喷的食物，地窖存着名贵的美酒，储藏室里的果酱多得数也数不清。炉火烧得正旺，一双双看不见的手给烤肉浇着汁，也忙着烹调蔬菜和各样好菜。小提琴手还没弄明白是怎么回事，又有无形的手把他请进一间小屋。刚才见过的美味，已经全摆到了桌上。
        - id: ch02-b04
          speaker: narrator
          text: >-
            他先拉起小提琴。优美的曲调传遍寂静的厅堂，随后，他便坐下大吃起来。没过多久，门开了。一个身高不到三英尺的小人走进来。他穿着晨衣，小脸皱巴巴的，灰胡子一直垂到鞋上的银搭扣。小人坐在小提琴手旁边，跟他一起吃饭。吃到野味时，小提琴手把刀叉递过去，请他先切肉，再把盘子传回来。谁知小人手脚不灵，刚切好的肉掉到了地上。
        - id: ch02-b05
          speaker: narrator
          text: >-
            好心的小提琴手俯身去捡。就在这一眨眼的工夫，小人扑到他背上，朝着他的头和身子狠命捶打，把他打得浑身青紫。直到年轻人快没命了，小恶棍才停下来，把他从铁门推出城堡。几个钟头前，小提琴手进门时还那么神气，现在却只能躺在外面喘气。
        - id: ch02-b06
          speaker: narrator
          text: >-
            新鲜空气让他慢慢醒过神来。他忍着全身的疼痛，一步一晃地挪回客店。到那里时已是深夜，两个同伴都睡熟了。第二天一早，他们发现小提琴手躺在身边，惊讶得围住他问个没完。可他遮着脸和后背，根本不想细说。
        - id: ch02-b07
          speaker: violinist
          text: >-
            你们自己去看看吧！我只能告诉你们，那地方可不好对付。
        - id: ch02-b08
          speaker: narrator
          text: >-
            第二个上路的是小号手。他进了城堡，先受到同样周到的招待，接着又挨了同样凶狠的痛打。到了第二天，他也像一只受伤的野兔，躺在客店的床上。
        - id: ch02-b09
          speaker: trumpeter
          text: >-
            要闯那座鬼城堡，可不是一件让人羡慕的差事。
        - id: ch02-b10
          speaker: narrator
          text: >-
            两个同伴都劝第三位乐师别去。可吹长笛的年轻人仍旧不肯放弃。他胆子大，又有一股不服输的劲头，决意亲自碰碰运气。只要真有宝藏，他就要设法把它找出来，牢牢拿到手里。

    - id: ch03
      title: 胡须里的魔力
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            长笛手走进城堡，毫无惧色地到处查看。富丽堂皇的房间全都空荡荡的。他边走边想，要是能一直住在这里，那该多舒服，况且还有满满的食品储藏室和酒窖，想吃想喝都不成问题。
        - id: ch03-b02
          speaker: narrator
          text: >-
            城堡也为他准备了一桌佳肴。他唱着歌，吹着长笛，游逛了好一阵，才像同伴们那样坐到桌边。留着长胡子的小人果然又来了。长笛手一点也没吃惊，还热络地同他聊天，就像两人认识了许多年。可无论他怎么说，小人都不大理睬。
        - id: ch03-b03
          speaker: narrator
          text: >-
            吃到野味，小人照例把肉掉在地上。长笛手好心地准备去捡，却及时瞧见矮人正要扑到自己背上。他猛地转身，揪住那把长胡子，用力一摇，竟把胡须整个扯了下来。矮人呻吟着倒在地上。
        - id: ch03-b04
          speaker: narrator
          text: >-
            胡须一到手，长笛手立刻觉得身上充满力量，仿佛再难的事情也做得到。城堡里那些原先看不见的东西，现在也全显露出来。小人的情形却正好相反，他的力气一下消失，急得又哭又求。
        - id: ch03-b05
          speaker: dwarf
          text: >-
            把胡须还给我吧，求你了！只要你肯还，我就把笼罩城堡的所有魔法都告诉你。我还会帮你带走藏起来的宝物，让你从此永远富有，永远幸福。
          emotion: fearful
        - id: ch03-b06
          speaker: flutist
          text: >-
            我会还给你。不过，你得先照自己答应的去做。事情办完以前，胡须还得留在我手里。
        - id: ch03-b07
          speaker: narrator
          text: >-
            老人原本只想骗回胡须，根本没打算兑现诺言。这会儿，他却只能乖乖带路。两人穿过阴暗的秘密通道，走过地下洞窟和灰色岩石，最后来到一片开阔的原野。这里美得出奇，就像已经不在我们这个世界。

    - id: ch04
      title: 河对岸的魔法国土
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            前方有一条水流湍急的河。小人拿出魔杖，在波浪上轻轻一点，河水马上分向两边，再也不动。两个人就这样踩着干地，走到了对岸。
        - id: ch04-b02
          speaker: narrator
          text: >-
            对岸的一切简直美不胜收。绿荫小路从树林和花海间穿过。披着金银羽毛的鸟儿在枝头歌唱。可爱的蝴蝶飞来飞去，闪亮的甲虫在地上爬行，温驯的小兽藏在灌木和树篱里。连天空也不是蓝色的，倒像一道道纯金的光。天上的星星比平常大了一倍，也比人间的星辰明亮得多。
        - id: ch04-b03
          speaker: narrator
          text: >-
            小人又把长笛手领进一座城堡。这座城堡比他们离开的那座更大，也更壮丽，年轻人越看越惊讶。这里依然没有一点声息。他们把各处走遍，终于来到一间屋子。屋子正中摆着一张床，四周垂着厚厚的帷幔。床顶悬着鸟笼，一只鸟儿正对着空荡的房间唱出悦耳的歌。
        - id: ch04-b04
          speaker: narrator
          text: >-
            小人掀开床帐，示意年轻人走近。铺着华贵丝垫的床上，躺着一位沉睡的少女。她美得像天使。卷曲的金发落在大理石般的肩头，额前的钻石王冠闪闪发亮。可是，魔法让她睡得如同死去，任何声音都没法将她唤醒。
        - id: ch04-b05
          speaker: dwarf
          text: >-
            你看，这就是沉睡的姑娘。她是一位强大的公主，这座城堡和外面的魔法国土都属于她。可她已经这样睡了几百年，从来没有人找到过这里。只有我一直守着她。我每天回自己的城堡取食物，也把那些贪图黄金、强闯进来的人痛打一顿。这些年来，我不许任何陌生人靠近公主。
        - id: ch04-b06
          speaker: dwarf
          text: >-
            我所有的魔力都在胡须里。你拿走了它，我就再也没有力量把公主困在沉睡中，也只能把秘密告诉你。现在照我的话去做。取下她头顶的鸟笼。正是这只鸟用歌声让她睡着，从那以后，它一直唱到今天。你要杀死它，取出心脏，把心烧成粉末，再送进公主口中。她马上就会醒来，把她的真心和婚约、王国、城堡，还有全部宝藏都交给你。

    - id: ch05
      title: 公主醒来
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            小矮人说到这里，已经累得精疲力尽。长笛手没有耽搁，仔仔细细照着吩咐去做。他杀死小鸟，取出那颗小小的心，又把它烧成了粉末。
        - id: ch05-b02
          speaker: narrator
          text: >-
            粉末刚放进公主口中，她立刻睁开美丽的眼睛。她望着眼前欢喜的年轻人，温柔地吻了他。
        - id: ch05-b03
          speaker: princess
          text: >-
            谢谢你救我离开这场魔法沉睡。我愿意嫁给你。
          emotion: happy
        - id: ch05-b04
          speaker: narrator
          text: >-
            就在这一刻，雷鸣般的响声传遍城堡。每一道楼梯、每一个房间都重新有了动静。一群群男女仆从涌进屋里，向公主和她的新郎道喜，随后又各自散开，回到城堡各处忙起了自己的差事。
        - id: ch05-b05
          speaker: narrator
          text: >-
            灰白的小矮人马上来讨自己的胡须。他心里藏着恶毒的打算。只要胡须重新长回下巴，他就能恢复魔力，想怎样摆布众人都行。他要亲手毁掉眼前的幸福。可是，长笛手早已看透了他，并不比他少一分机灵。
        - id: ch05-b06
          speaker: flutist
          text: >-
            好了，别担心。等我们分别时，我一定把胡须还你。不过，我和新娘要陪你走一段回家的路，你得答应。
        - id: ch05-b07
          speaker: narrator
          text: >-
            矮人拒绝不了。于是三个人一同沿着翠绿的小路向前走，又穿过开满鲜花的草地，终于来到先前那条河边。

    - id: ch06
      title: 最后一次过河
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            这条河绵延数英里，环绕着公主的国土，也是她王国的边界。河上没有桥，也找不到渡船。水流又急又猛，发出震耳的咆哮，就算最勇敢的游泳好手，也不敢冒险下水。
        - id: ch06-b02
          speaker: flutist
          text: >-
            把魔杖给我，让我来分开河水。
        - id: ch06-b03
          speaker: narrator
          text: >-
            胡须还在长笛手手里，矮人只好交出魔杖。可这个邪恶的小东西心里却乐开了花。他认定，年轻人过河以后就会归还胡须。到那时，他的魔力一回来，就能夺走魔杖，让这对新人永远回不了美丽的王国。
        - id: ch06-b04
          speaker: narrator
          text: >-
            然而，这番恶毒盘算注定不能得逞。长笛手用魔杖一击水面，波浪马上向两旁分开，静静停住。矮人走在最前面，独自跨过河床。就在他踏上对岸的一瞬间，河水从他身后重新合拢。长笛手和美丽的新娘安然站在河的另一边。
        - id: ch06-b05
          speaker: narrator
          text: >-
            他们隔着河，把胡须扔还给老人，却将魔杖留在了手里。从此，邪恶的矮人再也无法踏进他们的王国。长笛手带着新娘回到城堡，两人从此平安富足，幸福地生活下去。
        - id: ch06-b06
          speaker: narrator
          text: >-
            至于另外两个乐师，他们始终等不到同伴回来，只好说，他是吹长笛去了。后来，这句话竟成了一句俗语。只要有人出门办事，从此一去不回，人们就会说，那个人吹长笛去了。
