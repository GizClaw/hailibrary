audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and attentive fairy-tale storytelling
        timbre: clear and gently resonant
        pace: measured
        pitch: medium
    flower_fairy:
      display_name: The Flower Fairy
      tts:
        delivery: gracious, affectionate, and quietly wise
        timbre: luminous and gentle
        pace: measured
        pitch: medium-high
    sylvia:
      display_name: Princess Sylvia
      tts:
        delivery: thoughtful, candid, and warmly expressive
        timbre: clear and youthful
        pace: natural
        pitch: medium-high
    observer:
      display_name: An Observer
      tts:
        delivery: sympathetic and sincere
        timbre: soft and clear
        pace: natural
        pitch: medium
  chapters:
    - id: ch01
      title: The Flower Fairy's Court
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: A person's home often tells you something about the person who lives there. Perhaps that was why the Flower Fairy lived in a lovely palace, surrounded by the most delightful garden you could imagine. There were flowers and trees, fountains and fishponds, and every pleasant thing.
        - id: ch01-b02
          speaker: narrator
          text: The Fairy herself was so kind and charming that everyone loved her. The young princes and princesses at her court were happy all day simply because they were near her. They came to her when they were tiny and stayed beside her as they grew. When they were grown and had to go out into the great world, she gave each of them whatever gift they asked for.
        - id: ch01-b03
          speaker: narrator
          text: This story is chiefly about Princess Sylvia. The Fairy loved her with all her heart, for Sylvia was both original and gentle. She was nearly old enough to receive her gift and go out into the world herself. Before that time came, the Fairy wanted to learn how the princesses who had already left her were getting on. She decided that Sylvia should visit some of them.
        - id: ch01-b04
          speaker: narrator
          text: One day, the Fairy's chariot was made ready, with butterflies to draw it.
        - id: ch01-b05
          speaker: flower_fairy
          text: Sylvia, I am sending you to Princess Iris's court. She will be glad to welcome you, both for my sake and for your own. Come back in two months and tell me what you think of her.
        - id: ch01-b06
          speaker: narrator
          text: Sylvia did not want to leave at all. Still, because the Fairy wished it, she said nothing. The moment the two months were over, she climbed joyfully into the butterfly chariot and hurried home. The Flower Fairy was just as delighted to see her.
        - id: ch01-b07
          speaker: flower_fairy
          text: Now, my child, tell me. What did you make of Iris?
        - id: ch01-b08
          speaker: sylvia
          text: Madam, you gave Iris the gift of beauty. She never tells anyone that the beauty came from you, though she often speaks of your kindness in other ways. When I first saw her, she was so lovely that she dazzled me. But it seemed as if her beauty had stopped her from using any of her other gifts. She thought that merely letting people look at her was all anyone could ask.
        - id: ch01-b09
          speaker: sylvia
          text: Then, while I was there, she became seriously ill. She recovered, but her beauty was completely gone. Now she cannot bear to see herself, and she is in despair. She begged me to tell you what happened and ask you, out of pity, to make her beautiful again.
          emotion: sad
        - id: ch01-b10
          speaker: sylvia
          text: And truly, she needs that beauty terribly. Qualities that seemed tolerable, or even pleasant, while she was pretty look quite different now. It has been so long since she used her mind or her natural cleverness that I do not think she has any left. Iris knows all this herself. You can imagine how unhappy she is, and how earnestly she begs for your help.
          emotion: sad
        - id: ch01-b11
          speaker: flower_fairy
          text: You have told me exactly what I wanted to know. But alas, I cannot help Iris. I can give each gift only once.
          emotion: sad
    - id: ch02
      title: The Gift of Eloquence
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Some time passed amid all the usual delights of the Flower Fairy's palace. Then she called for Sylvia again. This time, Sylvia was to stay for a while with Princess Daphne. The butterflies whisked her away and set her down in a very strange kingdom.
        - id: ch02-b02
          speaker: narrator
          text: Sylvia had been there only a short time when a wandering butterfly carried a message back to the Fairy. Sylvia begged to be sent for as soon as possible, and before long she was allowed to return.
        - id: ch02-b03
          speaker: sylvia
          text: Oh, madam! What a place you sent me to this time!
          emotion: disgusted
        - id: ch02-b04
          speaker: flower_fairy
          text: Why? What was wrong? If I remember rightly, Daphne was one of the princesses who asked for the gift of eloquence.
        - id: ch02-b05
          speaker: sylvia
          text: Well, the gift of eloquence becomes a woman very badly. Daphne does speak well, and she chooses her words beautifully. The trouble is that she never stops. At first she may amuse you, but in the end she wears you to death.
          emotion: disgusted
        - id: ch02-b06
          speaker: sylvia
          text: More than anything, she loves meetings where the affairs of her kingdom are settled. There she can talk and talk without anyone interrupting her. Yet the moment the meeting ends, she is ready to begin again, whether she has something to say or nothing at all. I cannot tell you how glad I was to escape!
          emotion: disgusted
        - id: ch02-b07
          speaker: narrator
          text: The Fairy smiled at Sylvia's perfectly sincere disgust with her visit. She gave the princess a little time to recover before sending her away again.
    - id: ch03
      title: The Gift of Pleasing
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Next the Fairy sent Sylvia to Princess Cynthia's court and left her there for three months. When the time was over, Sylvia came home with all the joy and contentment anyone feels on returning to a dear friend. As always, the Fairy wanted to hear what Sylvia thought. Cynthia had always been amiable, and the Fairy had given her the gift of pleasing.
        - id: ch03-b02
          speaker: sylvia
          text: At first, I thought Cynthia must be the happiest princess in the world. She had a thousand lovers, and every one of them tried to outdo the others in pleasing her and giving her whatever she wanted. I came very close to deciding that I would ask for the same gift.
        - id: ch03-b03
          speaker: flower_fairy
          text: Then you have changed your mind?
        - id: ch03-b04
          speaker: sylvia
          text: Yes, indeed, madam, and I will tell you why. The longer I stayed, the more clearly I saw that Cynthia was not truly happy. She wanted so much to please everyone that she stopped being sincere. She became nothing more than a flirt.
        - id: ch03-b05
          speaker: sylvia
          text: Even her lovers began to feel that her charms meant nothing, because she used them on everyone who came near her, without distinction. In the end, they no longer cared for her attention. They turned away from her and left.
        - id: ch03-b06
          speaker: flower_fairy
          text: I am pleased with you, my child. Enjoy yourself here for a while. Soon you shall visit Phyllida.
        - id: ch03-b07
          speaker: narrator
          text: Sylvia was glad to have time to think. She still could not decide what gift to ask for herself, and the day of choosing was drawing very near.
    - id: ch04
      title: The Gift of Wit
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Before long, the Fairy sent Sylvia to Princess Phyllida and waited with as much interest as ever to hear her report. When Sylvia returned, she described what she had found.
        - id: ch04-b02
          speaker: sylvia
          text: I reached Phyllida's court safely. She welcomed me very kindly and at once began using the brilliant wit you gave her. I admit that she fascinated me. For a whole week, I thought no gift could be more desirable. Her company was so charming that the hours passed like magic.
        - id: ch04-b03
          speaker: sylvia
          text: But in the end, I wanted her gift no more than any of the others. Like the gift of pleasing, wit cannot bring real satisfaction. Little by little, I grew tired of what had delighted me at first. I saw more plainly each day that no one can always be clever and amusing without often becoming unkind. Phyllida was far too ready to turn everything, even the most serious matters, into an excuse for a brilliant joke.
        - id: ch04-b04
          speaker: narrator
          text: In her heart, the Flower Fairy agreed with Sylvia. She was pleased with herself for having brought the princess up so well.
    - id: ch05
      title: A Quiet Spirit
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Now the time had come for Sylvia to receive her own gift. All her companions gathered together, and the Fairy stood among them. As she always did on such occasions, she asked what Sylvia wished to carry with her into the great world.
        - id: ch05-b02
          speaker: narrator
          text: Sylvia paused for a moment before she answered.
        - id: ch05-b03
          speaker: sylvia
          text: A quiet spirit.
        - id: ch05-b04
          speaker: narrator
          text: The Fairy granted her request.
        - id: ch05-b05
          speaker: narrator
          text: This lovely gift makes life a constant happiness for Sylvia and for everyone who comes near her. Her sweet face holds all the beauty of gentleness and contentment. Sometimes grief or worry makes it seem a little less lovely, but even then, the harshest thing anyone says is this.
        - id: ch05-b06
          speaker: observer
          text: Sylvia's dear face is pale today. It grieves me to see her so.
          emotion: sad
        - id: ch05-b07
          speaker: narrator
          text: And when Sylvia is cheerful and joyful, the sunshine of her presence brings joy to everyone fortunate enough to be near her.
