audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，像编书人面对孩子娓娓而谈
        timbre: 温暖清朗
        pace: 舒缓而有自然起伏
        pitch: 中音
    flower_fairy:
      display_name: 花仙女
      tts:
        delivery: 慈爱优雅，询问时温和而专注
        timbre: 柔和明净
        pace: 舒缓
        pitch: 中高音
    sylvia:
      display_name: 西尔维娅
      tts:
        delivery: 坦率聪慧，少女般真挚而有主见
        timbre: 清亮柔美
        pace: 适中
        pitch: 中高音
    court_companion:
      display_name: 宫廷同伴
      tts:
        delivery: 亲切含蓄，真心关怀公主
        timbre: 温润清晰
        pace: 适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 美貌的礼物
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            人的住处，常常会映出他的心性。也许正因为这样，花仙女才住在一座美丽的宫殿里。宫殿四周，是你所能想象的最宜人的花园。那里鲜花遍地，树木成荫，喷泉和鱼池散布其间，凡是美好的东西，一样也不缺。花仙女自己也温柔可爱，人人都喜欢她。
        - id: ch01-b02
          speaker: narrator
          text: >-
            许多年轻的王子和公主在她的宫廷里长大。他们年纪还很小时就来到这里，只因陪在仙女身边，从早到晚都过得快活。等到成年，不得不离开她、走进外面的广阔世界时，仙女就会把每个人想要的天赋送给他。
        - id: ch01-b03
          speaker: narrator
          text: >-
            我们眼下要讲的，是西尔维娅公主。她很有主见，性情又温柔，花仙女一心疼爱她。眼看西尔维娅也快到接受礼物的年纪，仙女忽然想知道，那些已经长大、早早离开自己的公主，如今过得怎么样。于是，她决定趁西尔维娅还没离开，派她去探望其中几位。
        - id: ch01-b04
          speaker: flower_fairy
          text: >-
            西尔维娅，我要送你去伊里斯的宫廷。看在我和你的情分上，她一定会高兴地接待你。两个月后你再回来，告诉我你怎么看她。
        - id: ch01-b05
          speaker: narrator
          text: >-
            蝴蝶拉的车驾已经备好。西尔维娅虽然不愿离开，却没有违背仙女的心愿。两个月一到，她便欢欢喜喜登上车，恨不得马上回到花仙女身旁。花仙女见她归来，也同样欢喜。
        - id: ch01-b06
          speaker: flower_fairy
          text: >-
            好孩子，这一趟给你留下了什么印象？都说给我听听吧。
        - id: ch01-b07
          speaker: sylvia
          text: >-
            夫人，您赐给伊里斯的是美貌。她常说您待她仁慈，却从不告诉别人，她的美貌也是您送的。刚见面时，我真被她迷住了。可我很快发现，她有了这副容貌，别的才智和长处便全都不用了。她仿佛觉得，只要让别人看见自己，就算做完了所有该做的事。
        - id: ch01-b08
          speaker: sylvia
          text: >-
            我还在那里时，她生了一场重病。病虽然好了，美貌却全没了。她如今不愿看见自己的脸，绝望得很。她求我把事情禀告您，请您可怜她，把美貌还给她。
          emotion: sad
        - id: ch01-b09
          speaker: sylvia
          text: >-
            她实在太需要它了。从前她漂亮，身上那些勉强过得去、甚至还算讨喜的地方，也跟着显得可爱。如今容貌变丑，一切看起来都不同了。她太久没有动过脑筋，也太久没有用过天生的聪慧，我真觉得如今一点都没剩。她自己明白得很。您自然能想象她有多痛苦，才会这样恳切地求您帮忙。
        - id: ch01-b10
          speaker: flower_fairy
          text: >-
            我想知道的，你都告诉我了。可惜我救不了她，我的礼物只能送出一次。
          emotion: sad
    - id: ch02
      title: 永不停歇的口才
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            西尔维娅回到花仙女的宫殿，照旧享受那里种种快乐。过了一阵，仙女又叫她去达芙妮公主那里小住。蝴蝶们拉起车，把她送进一个陌生的国度。
        - id: ch02-b02
          speaker: narrator
          text: >-
            可她才住了很短的时间，就托一只四处飞游的蝴蝶捎回口信，请仙女尽快派车接她。没过多久，她便获准回到花仙女身边。西尔维娅一见仙女，就再也忍不住了，立刻叫了起来。
        - id: ch02-b03
          speaker: sylvia
          text: >-
            哎呀，夫人，您这次到底把我送到了什么地方！
          emotion: surprised
        - id: ch02-b04
          speaker: flower_fairy
          text: >-
            怎么了？要是我没记错，达芙妮从前求取的礼物是口才。
        - id: ch02-b05
          speaker: sylvia
          text: >-
            口才放在女人身上，真是一份糟糕的礼物。她说得确实动听，句句也都得体，可她一开口就再也不停。起初听着还有趣，到后来简直要把人烦死。
          emotion: disgusted
        - id: ch02-b06
          speaker: sylvia
          text: >-
            她最爱召集众人商议国事，因为在那里可以一直说下去，不怕有人打断。就算散会了，她也马上另起话头。说正事也好，说废话也好，只要想到什么，她都能讲个没完。我有多庆幸终于离开，真是说也说不尽！
          emotion: disgusted
        - id: ch02-b07
          speaker: narrator
          text: >-
            花仙女看她这样毫不掩饰地厌烦，不由得笑了。她让西尔维娅好好歇了一阵，等姑娘从这次经历中恢复过来，才送她去辛西娅公主的宫廷，在那里住了三个月。
    - id: ch03
      title: 取悦众人的代价
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            三个月后，西尔维娅回到亲爱的朋友身边，满心都是欢喜和满足。那正是一个人终于与好友重逢时才有的心情。辛西娅一向和蔼，花仙女赐给她的又是取悦众人的本领。仙女照例急着想听听，西尔维娅怎么看她，这份礼物究竟给她带来了什么。
        - id: ch03-b02
          speaker: sylvia
          text: >-
            起初，我以为她一定是世上最幸福的公主。她有一千个爱慕者，人人争着讨她高兴，想满足她的每个愿望。我差一点就决定，也向您求一份这样的礼物。
        - id: ch03-b03
          speaker: flower_fairy
          text: >-
            那么，你后来改主意了？
        - id: ch03-b04
          speaker: sylvia
          text: >-
            是的，夫人。我住得越久，越能看出她并不真正幸福。为了让每个人都喜欢自己，她渐渐不再真诚，只顾着卖弄风情。她不分对象，对每个走近的人都使出同样的娇媚。连那些爱慕她的人也觉得，这种人人都能得到的魅力根本不值什么。最后，他们不再在意她，一个个轻蔑地走了。
        - id: ch03-b05
          speaker: flower_fairy
          text: >-
            好孩子，你让我很满意。先在我这里快活一阵，过些时候，我再送你去菲莉达那里。
        - id: ch03-b06
          speaker: narrator
          text: >-
            西尔维娅正需要时间好好想一想。她自己的日子已经临近，却仍不知道该求取什么。没过多久，花仙女便送她去见菲莉达，仍旧兴致勃勃地等着听她回来讲述。
    - id: ch04
      title: 过人的才智
      blocks:
        - id: ch04-b01
          speaker: sylvia
          text: >-
            我平安到了菲莉达的宫廷。她待我很亲切，一见面就让我领教了您赐给她的过人才智。我完全被迷住了。整整一个星期，我都觉得世上再没有更值得渴求的天赋。和她在一起太有趣，日子简直像中了魔法，一转眼就过去了。
        - id: ch04-b02
          speaker: sylvia
          text: >-
            可到最后，我也不再羡慕它了，并不觉得它胜过之前见到的那些礼物。这份天赋和取悦众人的本领一样，不能叫人真正满足。那些最初让我惊喜的话，渐渐只让我疲倦。我也越来越明白，一个人若要时时机敏风趣，就难免常常说出刻薄的话。哪怕碰上最严肃的事情，她也太容易只想着拿它说个漂亮的笑话。
        - id: ch04-b03
          speaker: narrator
          text: >-
            花仙女心里十分赞同，也暗暗高兴，觉得自己没有白白教养西尔维娅。
    - id: ch05
      title: 一颗宁静的心
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            终于，西尔维娅接受礼物的时刻到了。伙伴们全都聚集起来，花仙女站在众人中间，照往常一样问她，走进外面的广阔世界时，想带上什么礼物。
        - id: ch05-b02
          speaker: narrator
          text: >-
            西尔维娅安静地想了一会儿，才开口回答。
        - id: ch05-b03
          speaker: sylvia
          text: >-
            我想要一颗宁静的心。
          emotion: calm
        - id: ch05-b04
          speaker: narrator
          text: >-
            花仙女答应了她。这份可爱的礼物，让西尔维娅一生都生活在幸福里，也把幸福带给每个与她相处的人。她甜美的脸上，总有温柔与知足带来的美丽。
        - id: ch05-b05
          speaker: narrator
          text: >-
            偶尔遇上什么悲伤或烦忧，她的脸也会显得不如平日明亮动人。可就算在这种时候，别人说得最重的话，也不过是这样一句。
        - id: ch05-b06
          speaker: court_companion
          text: >-
            今天，亲爱的西尔维娅脸色有些苍白。看见她这样，真让人难过。
          emotion: sad
        - id: ch05-b07
          speaker: narrator
          text: >-
            反过来，当西尔维娅快活欢欣时，她整个人就像阳光一样。每一个有幸陪在她身边的人，也都因她的陪伴而满心喜悦。
        - id: ch05-b08
          speaker: narrator
          text: >-
            这个故事的作者是卡吕斯伯爵。
