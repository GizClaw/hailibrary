  chapters:
    - id: ch01
      title: Three Sons Set Out
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a great lord with three sons. He became terribly ill. Doctors of every kind came to him, even bonesetters, but none could discover what was wrong or ease his suffering. At last, a foreign doctor declared that only the Golden Blackbird could cure him.
        - id: ch01-b02
          speaker: narrator
          text: The old lord sent his eldest son to find this wonderful bird and promised him great riches if he brought it home. The young man soon reached a place where four roads met. Since he did not know which road to take, he threw his cap into the air and followed the way it pointed when it fell.
        - id: ch01-b03
          speaker: narrator
          text: After two or three days, he was tired of walking without knowing how far he must go. He stopped at an inn full of merrymakers and ordered food and drink.
        - id: ch01-b04
          speaker: eldest_son
          text: Honestly, it is foolish to waste any more time searching for that bird. My father is old. If he dies, all his goods will come to me.
        - id: ch01-b05
          speaker: narrator
          text: The old lord waited patiently for some time. When his eldest son did not return, he sent the second son after the Golden Blackbird. This son took the same direction. At the crossroads, he also tossed his cap to choose a road, and it fell toward the very same one. He walked on until he reached the inn where his brother had stopped. The eldest son was leaning from a window. He called down and urged his brother to stay there and enjoy himself.
        - id: ch01-b06
          speaker: second_son
          text: You are right. I might search the whole world and still never find the Golden Blackbird. If the old man dies, the worst that can happen is that we divide his property.
        - id: ch01-b07
          speaker: narrator
          text: He went inside. The brothers feasted and made merry until all their money was gone. Soon they even owed the innkeeper, who kept them there as hostages until their debt could be paid.
        - id: ch01-b08
          speaker: narrator
          text: Then the youngest son set out. When he reached the inn, his brothers called to him and tried their best to keep him from going farther.
        - id: ch01-b09
          speaker: youngest_son
          text: No. My father trusted me. I will travel all over the world until I find the Golden Blackbird.
        - id: ch01-b10
          speaker: eldest_son
          text: Nonsense. You will do no better than we did. Let him die if he wants to, and we will divide the property.
    - id: ch02
      title: The Little Hare's Warning
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The youngest son continued on his way. Before long, he met a little hare. The hare stopped and looked at him.
        - id: ch02-b02
          speaker: little_hare
          text: Where are you going, my friend?
        - id: ch02-b03
          speaker: youngest_son
          text: I do not really know. My father is ill, and only the Golden Blackbird can cure him. I have been traveling for a long time, but no one can tell me where the bird is.
        - id: ch02-b04
          speaker: little_hare
          text: Ah, you still have a long journey ahead. The bird is at least seven hundred miles from here.
        - id: ch02-b05
          speaker: youngest_son
          text: How can I possibly travel so far?
        - id: ch02-b06
          speaker: little_hare
          text: Climb onto my back. I will take you there.
        - id: ch02-b07
          speaker: narrator
          text: The young man obeyed. The little hare covered seven miles with every bound, so they soon arrived at a castle as large and beautiful as any castle could be.
        - id: ch02-b08
          speaker: little_hare
          text: The Golden Blackbird is in a small cabin nearby, and you will find it easily. It lives in a plain little cage. Beside that cage stands another one made entirely of gold. Whatever happens, do not put the bird into the beautiful cage. If you do, everyone in the castle will know you have taken it.
    - id: ch03
      title: The Golden Cage
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The young man entered the cabin. He found the Golden Blackbird on a wooden perch, stiff and still as though it were dead. Close beside it stood the golden cage.
        - id: ch03-b02
          speaker: youngest_son
          text: Perhaps this lovely cage will bring the bird back to life.
        - id: ch03-b03
          speaker: narrator
          text: The instant the Golden Bird touched the shining bars, it woke and began to whistle. The sound brought every servant in the castle running to discover what had happened. When they saw the young man with the bird, they called him a thief and declared that he must be put in prison.
        - id: ch03-b04
          speaker: youngest_son
          text: I am not a thief. I took the Golden Blackbird only because my father is ill and this bird can cure him. I have traveled more than seven hundred miles to find it.
        - id: ch03-b05
          speaker: castle_servant
          text: Then we will let you go, and we will even give you the Golden Bird, if you can bring us the Porcelain Maiden.
        - id: ch03-b06
          speaker: narrator
          text: The young man left the castle in tears. He found the little hare nearby, eating wild thyme.
        - id: ch03-b07
          speaker: little_hare
          text: Why are you crying, my friend?
        - id: ch03-b08
          speaker: youngest_son
          text: The castle people will not let me take the Golden Blackbird unless I give them the Porcelain Maiden in exchange.
          emotion: sad
        - id: ch03-b09
          speaker: little_hare
          text: You did not follow my warning. You put the Golden Bird into the fine cage, didn't you?
        - id: ch03-b10
          speaker: youngest_son
          text: Alas, I did.
          emotion: sad
        - id: ch03-b11
          speaker: little_hare
          text: Do not despair. The Porcelain Maiden is a young woman as beautiful as Venus, and she lives two hundred miles away. Jump on my back, and I will carry you to her.
    - id: ch04
      title: The Porcelain Maiden
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: With seven miles in every stride, the hare reached the place in no time. He stopped at the edge of a lake.
        - id: ch04-b02
          speaker: little_hare
          text: The Porcelain Maiden will soon come here to bathe with her friends. I am going to eat a little thyme and refresh myself. When she enters the lake, hide her dazzling white clothes. Give them back only if she agrees to follow you.
        - id: ch04-b03
          speaker: narrator
          text: The hare left him. Almost at once, the Porcelain Maiden arrived with her friends. She undressed and went into the water. The young man slipped forward without a sound, took her clothes, and hid them beneath a rock some distance away.
        - id: ch04-b04
          speaker: narrator
          text: When the Porcelain Maiden grew tired of playing in the lake, she came ashore to dress. She hunted high and low, but her clothes had vanished. Her friends joined the search and looked everywhere too. At last, they decided it was useless. They went away and left her alone on the bank, weeping bitterly.
        - id: ch04-b05
          speaker: youngest_son
          text: Why are you crying?
        - id: ch04-b06
          speaker: porcelain_maiden
          text: While I was bathing, someone stole my clothes. Now my friends have abandoned me.
          emotion: sad
        - id: ch04-b07
          speaker: youngest_son
          text: I will find your clothes if you agree to come with me.
        - id: ch04-b08
          speaker: narrator
          text: The Porcelain Maiden agreed. The young man returned her clothes and bought her a small horse that ran like the wind. Then the little hare led them both back toward the castle of the Golden Blackbird.
    - id: ch05
      title: The Brothers' Betrayal
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: As they approached the castle, the little hare gave the young man one more warning.
        - id: ch05-b02
          speaker: little_hare
          text: This time, please be wiser than you were before. If you follow my directions, you can carry away both the Golden Blackbird and the Porcelain Maiden. Take the golden cage in one hand. Leave the bird exactly where it is, inside the old cage, and carry that cage away in your other hand.
        - id: ch05-b03
          speaker: narrator
          text: The little hare vanished. The young man followed his instructions, and the castle servants never noticed him carrying off the Golden Bird.
        - id: ch05-b04
          speaker: narrator
          text: On the way home, he came to the inn where his brothers were still being held. He paid their debt and freed them. All three brothers set out together, accompanied by the Porcelain Maiden and the Golden Blackbird.
        - id: ch05-b05
          speaker: narrator
          text: The two elder brothers were jealous of their youngest brother's success. As they passed the shore of a lake, they attacked him, seized the Golden Bird, and threw him into the water. Believing he had drowned, they continued their journey with the Porcelain Maiden.
        - id: ch05-b06
          speaker: narrator
          text: But as he fell, the young man caught hold of a clump of rushes. He shouted loudly for help, and the little hare came running.
        - id: ch05-b07
          speaker: little_hare
          text: Take hold of my leg and pull yourself out of the water.
        - id: ch05-b08
          speaker: narrator
          text: Once the young man was safely ashore, the hare told him what to do next.
        - id: ch05-b09
          speaker: little_hare
          text: Dress like a Breton looking for work as a stable boy. Go to your father's home and offer him your services. Once you are inside, you will find a way to make him understand the truth.
    - id: ch06
      title: The Stable Boy
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: The young man did exactly as the hare advised. Disguised as a Breton stable boy, he went to his father's castle and asked whether they needed anyone to work in the stables.
        - id: ch06-b02
          speaker: old_lord
          text: Yes, we certainly do. But the work is dangerous. There is a small horse in the stable that will not allow anyone near it. It has already kicked several grooms to death.
        - id: ch06-b03
          speaker: youngest_son
          text: I will groom it. I have never yet met a horse that frightened me.
        - id: ch06-b04
          speaker: narrator
          text: The little horse let the stable boy rub it down. It did not toss its head once or give a single kick.
        - id: ch06-b05
          speaker: old_lord
          text: Good gracious! Why does that horse let you touch it when no one else can even go near?
          emotion: surprised
        - id: ch06-b06
          speaker: youngest_son
          text: Perhaps it recognizes me.
        - id: ch06-b07
          speaker: narrator
          text: Two or three days later, the old lord called for him again.
        - id: ch06-b08
          speaker: old_lord
          text: The Porcelain Maiden is here. She is as lovely as the dawn, but she scratches anyone who approaches her. Go and see whether she will accept your help.
        - id: ch06-b09
          speaker: narrator
          text: The young man entered her room. At once, the Golden Blackbird burst into a joyful song. The Porcelain Maiden sang too and leaped for joy.
        - id: ch06-b10
          speaker: old_lord
          text: Good gracious! Do the Porcelain Maiden and the Golden Blackbird recognize you as well?
          emotion: surprised
        - id: ch06-b11
          speaker: youngest_son
          text: Yes. And if she chooses, the Porcelain Maiden can tell you the whole truth.
    - id: ch07
      title: The Truth Revealed
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: The Porcelain Maiden told the old lord everything that had happened. She explained that she had agreed to follow the young man who captured the Golden Blackbird.
        - id: ch07-b02
          speaker: youngest_son
          text: I also freed my brothers when an innkeeper was holding them for their debts. They repaid me by throwing me into a lake. That is why I came here in disguise. I needed to prove the truth to you.
        - id: ch07-b03
          speaker: narrator
          text: The old lord embraced his youngest son and promised that he would inherit all his possessions. The two elder sons had deceived their father and tried to murder their own brother, so the old lord had them put to death.
        - id: ch07-b04
          speaker: narrator
          text: The young man married the Porcelain Maiden, and they celebrated with a splendid wedding feast.
