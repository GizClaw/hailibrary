audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，像编书人面对孩子娓娓而谈，幽默处轻巧含笑
        timbre: 温暖清朗
        pace: 舒缓而有自然起伏
        pitch: 中音
    king_kojata:
      display_name: 科亚塔国王
      tts:
        delivery: 威严厚重，忧虑时低沉克制，受困时急切
        timbre: 苍老浑厚
        pace: 适中偏慢
        pitch: 低音
    magician:
      display_name: 魔法师
      tts:
        delivery: 阴森傲慢，威胁时暴烈，受骗后气急败坏
        timbre: 嘶哑粗粝
        pace: 适中
        pitch: 低音
    prince_milan:
      display_name: 米兰王子
      tts:
        delivery: 勇敢爽朗，面对危难时坦率坚定，偶尔带年轻人的自信
        timbre: 清亮结实
        pace: 适中
        pitch: 中音
    hyacinthia:
      display_name: 风信子公主
      tts:
        delivery: 温柔聪慧，出谋划策时沉着清楚，悲伤时克制深切
        timbre: 柔和清澈
        pace: 适中偏慢
        pitch: 中高音
    old_man:
      display_name: 老人
      tts:
        delivery: 朴实温厚，好奇中带着善意
        timbre: 温暖微哑
        pace: 舒缓
        pitch: 中低音
    witch:
      display_name: 老女巫
      tts:
        delivery: 神秘而干脆，指点办法时胸有成竹
        timbre: 干涩低沉
        pace: 适中偏慢
        pitch: 中低音
    head_cook:
      display_name: 主厨
      tts:
        delivery: 忙碌利落，见到公主后转为客气热心
        timbre: 洪亮饱满
        pace: 适中偏快
        pitch: 中音
    dove_1:
      display_name: 第一只白鸽
      tts:
        delivery: 清脆哀婉，像在真心挽留亲密伴侣
        timbre: 轻盈明亮
        pace: 适中偏慢
        pitch: 高音
  chapters:
    - id: ch01
      title: 井底的债
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前有位科亚塔国王，长胡子一直垂到膝盖以下。他与王后成婚三年，日子过得很美满，只可惜上天始终没有赐给他们一个继承人，国王为此十分苦恼。一天，他离开都城，打算亲自巡游全国。他在国土各处走了将近一年，把该看的地方都看过了，这才踏上归途。途中有一天闷热难当，他叫随从在旷野里搭起帐篷，大家等到傍晚凉快些再赶路。国王自己忽然渴得嗓子冒烟，可四下根本看不见水源。他只好跨上马，到附近寻找泉水。
        - id: ch01-b02
          speaker: narrator
          text: >-
            不久，国王找到一口井。清水一直满到井沿，像水晶一样透亮，水面还漂着一把金壶。国王立刻伸手去捞，先用右手，捞不着又换左手，最后两手一起伸进水里。那把讨厌的金壶却始终不肯让他抓住，像鱼一样从指间溜掉。它一下沉到井底，一下又从别处浮起来，仿佛存心戏弄国王。
        - id: ch01-b03
          speaker: king_kojata
          text: >-
            该死的东西！没有你，我照样能喝水。
          emotion: angry
        - id: ch01-b04
          speaker: narrator
          text: >-
            国王俯身趴在井边，贪婪地大口喝了起来，连脸和长胡子都扎进明净如镜的水中。可他喝足以后，想直起身子，脑袋竟怎么也抬不起来。原来水底有东西死死揪住了他的胡子。国王向下一看，只见一张可怕的脸正从井底仰望着他。两只硕大的绿眼睛亮得像祖母绿，大嘴一直从这边耳朵咧到那边耳朵，露出两排雪亮的白牙。抓住胡子的也不是凡人的手，而是两只尖利的爪子。
        - id: ch01-b05
          speaker: king_kojata
          text: >-
            谁在那里？快放开我！
          emotion: fearful
        - id: ch01-b06
          speaker: magician
          text: >-
            科亚塔国王，别再挣扎了。答应把一件东西给我，我才会放手。那东西如今你还不知道，回家以后却会看见。
        - id: ch01-b07
          speaker: narrator
          text: >-
            国王心想，宫殿里怎么可能有自己不知道的东西？这条件荒唐得很，他根本不必害怕。
        - id: ch01-b08
          speaker: king_kojata
          text: >-
            好，我答应把它交给你。
        - id: ch01-b09
          speaker: magician
          text: >-
            很好。你若不守诺言，可不会有好下场。
        - id: ch01-b10
          speaker: narrator
          text: >-
            利爪终于松开，怪脸也沉入井底。国王把下巴拔出水面，像狗一样使劲抖了抖，随后上马，带着随从若有所思地回宫。快到都城时，全城百姓欢呼着出来迎接。王后亲自在王宫门口等候，首相站在她身旁，手里抱着一只小摇篮。里面躺着一个刚出生的孩子，漂亮得如同明亮的白昼。国王一下子全明白了。他深深呻吟一声，知道自己已经把什么许给了井底的怪物，眼泪顿时滚下脸颊。
        - id: ch01-b11
          speaker: king_kojata
          text: >-
            原来，这就是我不知道的东西。
          emotion: sad
        - id: ch01-b12
          speaker: narrator
          text: >-
            他流着泪抱起孩子，疼爱地亲了亲，又轻轻放回摇篮。廷臣们看见国王这样悲伤，都惊讶极了，却谁也不敢询问原因。国王只好压住心里的痛苦，仍像从前一样治理国家。井边的秘密始终只有他自己知道，可那张忧虑憔悴的脸，任谁都看得出来。可怜的科亚塔害怕孩子随时会被夺走，日日夜夜不得安宁。可是日子一天天过去，什么也没有发生。几个月变成几年，小王子长成了俊美的青年，最后就连国王也渐渐忘记了那笔旧债。

    - id: ch02
      title: 通往地下世界
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            一天，王子外出打猎。他追赶一头野猪，很快便把其他猎人甩在身后，独自来到一片幽暗的密林深处。林中树木挨得又密又近，几乎无法看穿，只有正前方露出一小片草地。那里长满了蓟草和疯长的野草，中央立着一棵枝叶繁茂的椴树。树洞里忽然传出窸窣声，一个模样古怪、眼睛和下巴都是绿色的老头从里面爬了出来。
        - id: ch02-b02
          speaker: magician
          text: >-
            天气真不错啊，米兰王子。你让我等了好多年，也该来拜访我了。
        - id: ch02-b03
          speaker: prince_milan
          text: >-
            你到底是谁？
          emotion: surprised
        - id: ch02-b04
          speaker: magician
          text: >-
            你很快就会知道。回去替我问候科亚塔国王，提醒他那笔早该偿还的债。如今，他非还不可。暂且告辞，我们还会见面的。
        - id: ch02-b05
          speaker: narrator
          text: >-
            老头说完便消失在树里。米兰回宫讲出这番遭遇，父王顿时面如白纸，只得把他出生那天发生的事全部告诉他。
        - id: ch02-b06
          speaker: king_kojata
          text: >-
            我苦命的孩子啊，我们分别的时候到了。
          emotion: sad
        - id: ch02-b07
          speaker: prince_milan
          text: >-
            父王，别担心，也别难过。事情未必真有看起来那么糟。给我一匹赶路的马吧，我敢说，用不了多久您就会看见我回来。
          emotion: calm
        - id: ch02-b08
          speaker: narrator
          text: >-
            国王给了他一匹配着金马镫的骏马和一把宝剑。王后又把一枚小十字架挂到他颈上。大家哭了又哭，叹了又叹，米兰这才一一告别，踏上旅途。他笔直向前骑了两天，第三天来到一座平滑如镜、清澈如水晶的湖边。四周没有一丝风，连一片叶子也不动，安静得像坟墓。只有三十只羽毛绚丽的鸭子在平静的水面游动。离岸不远的草地上放着三十件洁白的小衣裳。米兰翻身下马，悄悄钻进高高的灯心草丛，拿走其中一件，又带着它藏到环湖的灌木后面。
        - id: ch02-b09
          speaker: narrator
          text: >-
            鸭子们游遍湖面，一会儿潜进深水，一会儿浮上来，贴着波浪滑行。玩累以后，它们纷纷游回岸边。其中二十九只穿上白衣，立刻变成二十九位美丽的少女。她们穿戴整齐，很快离开。最后一只小鸭子却无法上岸，只能贴着岸来回游动。它发出尖厉的叫声，怯生生地伸长脖子，惊慌地四下张望，接着又一头潜进水里。米兰见这可怜的小东西如此无助，心里实在不忍，便从藏身处走出来，想看看能不能帮上忙。
        - id: ch02-b10
          speaker: hyacinthia
          text: >-
            亲爱的米兰王子，看在上天的分上，把衣裳还给我吧。我一定会报答你的。
        - id: ch02-b11
          speaker: narrator
          text: >-
            王子把那件小衣裳放到鸭子身旁的岸边，自己退回灌木后面。只过了片刻，一位身穿白袍的姑娘便站在他面前。她是那么秀美、温柔而年轻，世上任何一支笔都描绘不出她的模样。姑娘向王子伸出手，向他道谢。
        - id: ch02-b12
          speaker: hyacinthia
          text: >-
            谢谢你这样宽厚地待我。我叫风信子，是邪恶魔法师的女儿。父亲统治着地下世界，拥有许多城堡和财富，也有三十个年轻的女儿。他等你很久了。不过，只要听我的话，你就不必害怕。见到他以后立刻伏在地上，跪着向前走。他再怎样跺脚咒骂，你也不要理会。剩下的事交给我。现在快走吧。
        - id: ch02-b13
          speaker: narrator
          text: >-
            风信子用小脚在地上一跺，大地随即裂开，两人一同沉入地下世界。魔法师的宫殿由一整块红宝石凿成，宝石发出的光照亮了周围整片地域。米兰快活地走进宫殿，看见魔法师头戴闪耀的王冠，坐在宝座上。他的双眼燃着绿色的火焰，双手的位置却长着一对利爪。王子一进门便跪倒在地，一路向宝座挪去。魔法师用脚跺得震天响，绿眼睛恶狠狠地瞪着他，咒骂声大得整个地下世界都在摇晃。米兰始终记着风信子的嘱咐，一点也不害怕，仍旧跪着向前走。
        - id: ch02-b14
          speaker: magician
          text: >-
            你这个小滑头，准有人教过你，知道怎么逗我发笑。我不再把你当仇人了，欢迎来到地下世界！不过你迟来了这么久，仍要替我办三件事。今天先去休息，明天我再吩咐你。
        - id: ch02-b15
          speaker: narrator
          text: >-
            魔法师说完，两名仆人把王子领进一间华美的寝室。里面早已为他铺好一张柔软的床。米兰把那些威胁暂时放到一旁，毫无惧色地躺下，很快便沉沉睡着了。

    - id: ch03
      title: 魔法师的三件差事
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            第二天一早，魔法师叫来米兰，说要瞧瞧他学会了什么。第一件差事，是在一夜之间造好一座宫殿。屋顶必须用最纯的黄金，墙壁必须用大理石，窗户必须用水晶。宫殿四周还要建起美丽的花园，里面既有鱼池，也有精巧的瀑布。全都办成，便有重赏，办不成就要砍头。米兰心想，这邪恶的怪物还不如立刻杀了自己。他悲伤地回到房里，低着头坐在那里，为残酷的命运苦苦发愁，直到天黑。一只小蜜蜂飞来，轻轻敲响了窗户。
        - id: ch03-b02
          speaker: hyacinthia
          text: >-
            开开窗，让我进去。
        - id: ch03-b03
          speaker: narrator
          text: >-
            米兰打开窗户，蜜蜂立刻变成风信子。
        - id: ch03-b04
          speaker: hyacinthia
          text: >-
            晚上好，米兰王子。你怎么这样难过？
        - id: ch03-b05
          speaker: prince_milan
          text: >-
            我怎能不难过？你父亲拿死亡威胁我，我觉得脑袋已经不在脖子上了。
        - id: ch03-b06
          speaker: hyacinthia
          text: >-
            那你打算怎么办？
        - id: ch03-b07
          speaker: prince_milan
          text: >-
            根本没有办法。反正一个人只能死一回。
        - id: ch03-b08
          speaker: hyacinthia
          text: >-
            别犯傻了，亲爱的王子。你只管睡觉，明早宫殿自然会造好。醒来以后绕着它走一圈，这里敲敲，那里拍拍，装成刚刚完工的样子。
          emotion: calm
        - id: ch03-b09
          speaker: narrator
          text: >-
            事情果然和风信子说的一模一样。天一亮，米兰走出房间，看见一座宫殿已经拔地而起。它精美绝伦，连最小的细节也无可挑剔，整座宫殿简直是一件艺术珍品。米兰照她的话绕着宫殿检查，这里敲一敲，那里拍一拍，仿佛自己刚刚完成全部工程。就连魔法师也为宫殿的美丽大吃一惊，几乎不敢相信自己的眼睛。
        - id: ch03-b10
          speaker: magician
          text: >-
            你的手艺确实出色，看来有一双巧手。现在让我看看，你的脑子是不是也这么聪明。我家里有三十个女儿，个个都是美丽的公主。明天，她们会排成一行。你从她们面前走过三次，到第三次时，必须指出最小的风信子。认错了，照样砍头。
        - id: ch03-b11
          speaker: narrator
          text: >-
            米兰回房坐在窗前，心想自己绝不可能认错风信子。这时，小蜜蜂又从窗边飞过。
        - id: ch03-b12
          speaker: hyacinthia
          text: >-
            没有你想得那么容易。我们三十姐妹一模一样，连父亲都很难分清。明天，我会让一只小苍蝇停在左脸颊上。你要仔细看，千万别认错。
        - id: ch03-b13
          speaker: narrator
          text: >-
            第二天，三十位公主穿着同样的衣裳，低垂双眼，整齐地站在魔法师面前。
        - id: ch03-b14
          speaker: magician
          text: >-
            来吧，大天才。把这些美人看上三遍，再告诉我哪一个是风信子。
        - id: ch03-b15
          speaker: narrator
          text: >-
            米兰从三十位公主面前走过，一个个仔细端详。她们实在太像了，就像同一张脸映在三十面镜子里，根本看不见小苍蝇。第二遍走过，他仍旧一无所获。到第三遍，他终于看到一只小苍蝇正悄悄爬过一位姑娘的脸颊，惹得那张脸泛起淡淡的粉红。王子再不迟疑，一把握住她的手。
        - id: ch03-b16
          speaker: prince_milan
          text: >-
            这就是风信子公主！
        - id: ch03-b17
          speaker: magician
          text: >-
            又让你答对了。不过还有最后一件差事。我现在点燃一支蜡烛，在它烧到烛台以前，你要做出一双高及膝盖的靴子。做不完，你就得掉脑袋。
        - id: ch03-b18
          speaker: narrator
          text: >-
            米兰绝望地回到房间。风信子再次化作蜜蜂来见他，问他为何难过。王子告诉她，魔法师已经点燃一支蜡烛，命他在蜡烛烧到烛台以前做出一双靴子。一个王子哪里懂得做鞋？若不能完成，脑袋就保不住了。
        - id: ch03-b19
          speaker: hyacinthia
          text: >-
            那你准备怎么做？
        - id: ch03-b20
          speaker: prince_milan
          text: >-
            他要的东西我不会做，也不肯做，只能让他结束我的性命。
        - id: ch03-b21
          speaker: hyacinthia
          text: >-
            不能这样。我深深爱着你，也一定要嫁给你。我若救不了你，就同你一起死。我们必须马上逃走，这是唯一的活路。
        - id: ch03-b22
          speaker: narrator
          text: >-
            她朝窗户呵了一口气，那团气息立刻在玻璃上结成霜。随后，她领着米兰走出房间，关好房门，又把钥匙远远扔掉。两人手牵着手，匆匆赶向当初进入地下世界的地方，终于回到湖岸。米兰的骏马仍在水边的草地上吃草。它刚认出主人，便欢喜地放声嘶鸣，朝他飞奔过来，又稳稳站住，仿佛四蹄在地上生了根。米兰和风信子双双跃上马背，骏马随即像离弦的箭一样飞驰而去。

    - id: ch04
      title: 三次追逐
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            与此同时，魔法师正不耐烦地等待米兰。约定的时限早已过去，他气得派仆人去催。房门锁着，仆人只好在外面敲门。窗上的霜气竟用米兰的声音回答，说自己马上就来。仆人带着这句话回去复命，可王子迟迟没有露面。过了一阵，魔法师第二次叫人去带他来，霜气还是那句回答，王子却依旧不见踪影。魔法师终于耗尽耐心，命人撞开房门。屋里空空荡荡，只有霜气放声大笑。他气得发狂，立刻命令仆人追赶逃走的王子。
        - id: ch04-b02
          speaker: hyacinthia
          text: >-
            我听见身后有马蹄声。
        - id: ch04-b03
          speaker: narrator
          text: >-
            米兰跳下马，把耳朵贴在地上细听。
        - id: ch04-b04
          speaker: prince_milan
          text: >-
            没错，他们追得很近了。
        - id: ch04-b05
          speaker: hyacinthia
          text: >-
            一刻也不能耽搁。
        - id: ch04-b06
          speaker: narrator
          text: >-
            风信子立刻把自己变成一条河，把米兰王子变成一座铁桥，又把骏马变成一只乌鸫。桥后面的道路恰好分成三岔。魔法师的仆人顺着新鲜的蹄印匆匆追来，到了桥边，足迹却突然消失。他们望着眼前的三条路，根本不知道该选哪一条。追兵们又怕又慌，只能回去向魔法师禀报这里发生的事。
        - id: ch04-b07
          speaker: magician
          text: >-
            一群蠢货！河和桥就是他们！马上回去抓人，否则有你们好受的！
          emotion: angry
        - id: ch04-b08
          speaker: narrator
          text: >-
            追兵再次出发。风信子又听见马蹄声，米兰下马，把耳朵贴到地面，知道他们正飞快赶来，已经逼到近前。公主转眼把自己、王子和骏马变成一片茂密的森林，林中纵横交错着一千条小径和道路。追兵闯进森林，到处搜寻米兰王子和他的新娘，却怎么也找不到。最后，他们竟绕回了出发的地方，只得绝望地又一次空手复命。
        - id: ch04-b09
          speaker: magician
          text: >-
            这回我亲自去追！马上牵马来，他们休想逃掉！
          emotion: angry
        - id: ch04-b10
          speaker: narrator
          text: >-
            风信子第三次听见马蹄声，米兰也听出追兵近在身后。
        - id: ch04-b11
          speaker: hyacinthia
          text: >-
            这回是我父亲亲自来了。只要赶到前面的第一座教堂，他的法力就会失效。快把你的十字架给我。
        - id: ch04-b12
          speaker: narrator
          text: >-
            米兰解下母后临行前送给他的金色小十字架。风信子刚一握住它，便把自己变成一座教堂，把米兰变成一名修士，又把骏马变成一座钟楼。他们刚刚变好，魔法师就带着仆人骑马赶到，根本没有看出眼前景物的真相。
        - id: ch04-b13
          speaker: magician
          text: >-
            神父，刚才有人骑马经过吗？
        - id: ch04-b14
          speaker: prince_milan
          text: >-
            米兰王子和风信子公主刚刚离开。他们在教堂里祷告了片刻，还请我替您点燃这支蜡烛，并向您问好。
        - id: ch04-b15
          speaker: magician
          text: >-
            我真想拧断他们的脖子！
          emotion: angry
        - id: ch04-b16
          speaker: narrator
          text: >-
            魔法师满心只想拧断两人的脖子，听完回答便飞快赶回家。他在那里把每个仆人都打得只剩一口气。米兰和新娘则骑着马缓缓前行，从此再也不怕有人追来。太阳正要落山，最后几道光照亮了他们正在接近的一座大城。米兰望见城池，忽然生出一个强烈的念头，一心想进去看看。
        - id: ch04-b17
          speaker: hyacinthia
          text: >-
            我心爱的人，请别进城。我很害怕，总觉得会出事。
          emotion: fearful
        - id: ch04-b18
          speaker: prince_milan
          text: >-
            你怕什么？我们只进去看一个钟头，再继续赶往父王的国土。
        - id: ch04-b19
          speaker: hyacinthia
          text: >-
            进城容易，出来却难。既然你一定要去，我就留在这里，变成一块白色里程碑等你。城里的国王和王后会牵着一个孩子来迎接。千万不要亲那孩子，否则你会忘记我，也忘记我们经历的一切。我会等你三天。
        - id: ch04-b20
          speaker: narrator
          text: >-
            米兰匆匆进城，风信子化作白色里程碑留在路边。第一天过去了，接着是第二天，最后第三天也过去了，王子始终没有回来。原来，他没有听从风信子的劝告。城里的国王和王后果然前来迎接，身旁还牵着一个可爱的金发小女孩，眼睛像两颗清亮的星星。孩子一见米兰便亲昵地依偎着他。王子被她的美丽迷住，俯身亲了亲她的脸颊。就在那一刻，他的记忆变成一片空白，把美丽的风信子和两人共同经历的一切忘得一干二净。

    - id: ch05
      title: 蓝花与白鸽
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            第一天过去了，第二天过去了，第三天也过去了，米兰始终没有回来。风信子伤心地流下眼泪，从里程碑变成路旁一朵蓝色的小野花。
        - id: ch05-b02
          speaker: hyacinthia
          text: >-
            我要长在这里，直到有过路人把我踩在脚下。
          emotion: sad
        - id: ch05-b03
          speaker: narrator
          text: >-
            她的一滴泪化作露珠，留在蓝色花瓣上闪闪发亮。不久，一位老人恰好经过，看见这朵花，被它的美丽深深打动。他小心地把花连根挖起，带回家栽进花盆，又天天浇水照料。从那以后，老人家里发生了怪事。每天早晨醒来，他总发现屋子已经收拾得整整齐齐，连一粒灰尘也找不到。中午回家，桌上又总摆满精美食物，他只需坐下来，便能尽情享用。起初，老人惊讶得不知道该怎么想。过了一阵，他渐渐觉得不安，只好去向老女巫讨教。
        - id: ch05-b04
          speaker: witch
          text: >-
            在公鸡啼叫以前起床，一直盯着，看见有东西动起来，就赶快把这块布罩上去。接下来会发生什么，你自己就知道了。
        - id: ch05-b05
          speaker: narrator
          text: >-
            老人听从女巫的话，整整一夜没有合眼。第一线晨光照进房间时，他看见蓝色小花开始轻轻颤动。花儿终于升出花盆，在房间里飞来飞去，把每样东西收拾妥当，扫去所有灰尘，又点起炉火。老人急忙从床上跳下来，拿起女巫交给他的布，迅速罩住那朵花。转眼之间，美丽的风信子公主便活生生地站到了他面前。
        - id: ch05-b06
          speaker: hyacinthia
          text: >-
            你为什么把我唤回人世？我的未婚夫米兰王子已经抛弃我，我再也不想活下去了。
          emotion: sad
        - id: ch05-b07
          speaker: old_man
          text: >-
            米兰王子就要成婚了。婚宴已经准备好，宾客正从四面八方赶往王宫。
        - id: ch05-b08
          speaker: narrator
          text: >-
            美丽的风信子听说米兰就要成婚，伤心得失声痛哭。哭过以后，她擦干眼泪，换上农家姑娘的衣裳，独自走进城里。她没有去别处，径直来到王宫的厨房。厨房中一片忙乱，系着白围裙的厨师们正为婚宴四处奔忙。风信子穿过人群，走到主厨面前，请他听一听自己的请求。
        - id: ch05-b09
          speaker: hyacinthia
          text: >-
            好心的厨师，请答应我的请求，让我为米兰王子做一个婚礼蛋糕吧。
        - id: ch05-b10
          speaker: narrator
          text: >-
            主厨正要赶她出去，转身看清她的模样，到了嘴边的话又咽了回去。
        - id: ch05-b11
          speaker: head_cook
          text: >-
            美丽的姑娘，你来得正是时候。尽管做吧，我会亲自把蛋糕送到王子面前。
        - id: ch05-b12
          speaker: narrator
          text: >-
            风信子很快做好了蛋糕。受邀的宾客已经从各处来到王宫，围满了婚宴的长桌。主厨依照承诺亲自走进大厅，用银盘托着精美的婚礼蛋糕，把它郑重放到米兰面前。宾客们全都看得入迷，纷纷赞叹，因为那蛋糕精巧得简直像一件艺术珍品。米兰也十分喜欢，立刻拿刀去切。刀刚落下，两只白鸽便出人意料地从蛋糕里跳了出来。其中一只转向自己的白鸽伴侣，开口说道：
        - id: ch05-b13
          speaker: dove_1
          text: >-
            亲爱的伴侣，别飞走，别丢下我。不要像米兰王子忘记心爱的风信子那样，把我也忘掉。
          emotion: sad
        - id: ch05-b14
          speaker: narrator
          text: >-
            听见小白鸽这句话，米兰深深叹了一口气。遗忘的往事重新回到心里，他忽然从宴席前跳起来，飞快奔向门口。美丽的风信子果然在那里等着他，忠诚的骏马也站在门外，不停地用蹄子刨着地面。两人片刻没有耽搁，一同跨上马背，以最快的速度奔向科亚塔国王的国土。国王和王后见他们回来，欢天喜地地迎接。那样的喜悦，从来没有人听说过。从此以后，他们所有人都幸福地生活了一辈子。
