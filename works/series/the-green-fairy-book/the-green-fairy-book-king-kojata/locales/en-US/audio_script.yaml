  chapters:
    - id: ch01
      title: The Promise in the Well
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a king named Kojata, whose beard hung below his knees. He and his wife had been happily married for three years, but Heaven had given them no child, and this caused him great sorrow. One day he left his capital to make a journey through his kingdom. For nearly a year, he traveled through one part of his lands after another. When he had seen all there was to see, he finally turned toward home.
        - id: ch01-b02
          speaker: narrator
          text: On a hot, heavy day, he ordered his servants to pitch their tents in an open field and wait for the cool evening. A terrible thirst came over him. There was no water nearby, so he mounted his horse and rode off to search for a spring.
        - id: ch01-b03
          speaker: narrator
          text: Before long, he found a well filled to the brim with water as clear as crystal. A golden jug floated on its surface. Kojata reached for it with his right hand, but it escaped. He tried his left and missed again. Then he reached with both hands at once. The jug slipped through his fingers like a fish, sank out of sight, and bobbed up in a different place, as if it were mocking him.
        - id: ch01-b04
          speaker: king_kojata
          text: A plague on you! I can drink without your help.
          emotion: angry
        - id: ch01-b05
          speaker: narrator
          text: He bent over the well and drank so greedily that his face and his long beard plunged straight into the shining water. When his thirst was gone, he tried to lift his head. He could not move. Something beneath the water had caught his beard.
        - id: ch01-b06
          speaker: king_kojata
          text: Who is down there? Let me go!
          emotion: fearful
        - id: ch01-b07
          speaker: narrator
          text: No one answered. Only an awful face stared up from the bottom of the well. Two great green eyes glowed like emeralds in the water. Its wide mouth stretched from ear to ear, showing two rows of gleaming white teeth. Kojata saw then that no mortal hands held him. Two sharp claws were twisted into his beard. At last, a hoarse voice rose from the depths.
        - id: ch01-b08
          speaker: magician
          text: Struggling will do you no good, King Kojata. I will release you only if you give me something you know nothing about, something you will find when you return home.
        - id: ch01-b09
          speaker: narrator
          text: Kojata scarcely stopped to think. Surely nothing could be waiting in his own palace without his knowledge. The whole condition seemed absurd.
        - id: ch01-b10
          speaker: king_kojata
          text: Yes. I promise it shall be yours.
        - id: ch01-b11
          speaker: magician
          text: Very well. But if you break your promise, you will suffer for it.
        - id: ch01-b12
          speaker: narrator
          text: The claws opened, and the dreadful face vanished. Kojata pulled his chin from the water and shook himself like a dog. Then he mounted his horse and rode home with his retinue, deep in thought.
        - id: ch01-b13
          speaker: narrator
          text: As they neared the capital, the people came out cheering. At the palace door, the Queen waited beside the Prime Minister. In his hands was a little cradle, and inside lay a newborn child as beautiful as the day. Kojata understood at once what he had promised away.
        - id: ch01-b14
          speaker: king_kojata
          text: So this is what I knew nothing about.
          emotion: sad
        - id: ch01-b15
          speaker: narrator
          text: He groaned, and tears rolled down his cheeks. The courtiers standing around him could not understand why their King grieved at such joyful news, but none dared ask the reason. Kojata lifted the child into his arms and kissed him tenderly. Then he laid him back in the cradle, forced his feelings under control, and returned to ruling as before.
        - id: ch01-b16
          speaker: narrator
          text: The King's secret stayed hidden, though everyone saw the care in his face. For fear that his child would be taken, he could rest neither day nor night. Yet nothing happened. Days became months, and months became years. The child grew into a handsome young man, and at last Kojata forgot the thing that had happened so long ago.
    - id: ch02
      title: The Debt Comes Due
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: One day Prince Milan went hunting. He chased a wild boar so far that he lost all the other huntsmen and found himself alone in a dark wood. The trees stood so thick and close that he could hardly see between them. Only straight ahead was there a small open meadow. Thistles and tall weeds covered it, and a leafy lime tree rose from its center.
        - id: ch02-b02
          speaker: narrator
          text: A rustle came from the hollow trunk. Out crept a strange old man with green eyes and a green chin.
        - id: ch02-b03
          speaker: magician
          text: A fine day to you, Prince Milan. You have kept me waiting for many years. It is well past time you came to see me.
        - id: ch02-b04
          speaker: prince_milan
          text: Who in the world are you?
          emotion: surprised
        - id: ch02-b05
          speaker: magician
          text: You will learn soon enough. For now, take a message to your father. Give King Kojata my greetings and remind him of his debt. The payment is long overdue, and now he must make it. Farewell until we meet again.
        - id: ch02-b06
          speaker: narrator
          text: The old man disappeared into the tree. Milan returned home, badly startled, and told his father everything he had seen and heard. At the story, Kojata turned as white as a sheet.
        - id: ch02-b07
          speaker: king_kojata
          text: Alas, my son. The time has come for us to part.
          emotion: sad
        - id: ch02-b08
          speaker: narrator
          text: With a heavy heart, the King told Milan what had happened at the well when the Prince was born.
        - id: ch02-b09
          speaker: prince_milan
          text: Do not torment yourself, dear Father. Things may not be as terrible as they seem. Give me a horse for the journey, and I am sure you will see me home again soon.
        - id: ch02-b10
          speaker: narrator
          text: The King gave him a splendid charger with golden stirrups, as well as a sword for the road. The Queen placed a little cross around her son's neck. They wept and grieved over him, knowing they could not hold him back from the promise. At last, Prince Milan said farewell to them all, mounted his horse, and rode away.
        - id: ch02-b11
          speaker: narrator
          text: He traveled straight on for two days. On the third, he reached a lake smooth as glass and clear as crystal. No wind blew. No leaf stirred. The place was silent as a grave, except for thirty bright-feathered ducks swimming across the still water.
        - id: ch02-b12
          speaker: narrator
          text: Not far from the shore, Milan noticed thirty little white garments lying on the grass. He dismounted, crept beneath the high bulrushes, took one garment, and hid with it behind the bushes around the lake. The ducks swam from place to place. They dived into the depths, rose again, and glided through the water. When they had played long enough, they came ashore. Twenty-nine put on their white garments and instantly became beautiful maidens. They finished dressing and disappeared from sight.
        - id: ch02-b13
          speaker: narrator
          text: The thirtieth duck could not come onto the land. It swam close to the bank and gave a piercing cry. Timidly, it stretched up its neck and looked wildly in every direction. Then it dived beneath the water again. Milan's heart was so moved by the poor little creature that he stepped out from the bulrushes to see whether he could help.
        - id: ch02-b14
          speaker: hyacinthia
          text: Oh, dear Prince Milan, please give me back my garment. I will be grateful to you with all my heart.
        - id: ch02-b15
          speaker: narrator
          text: Milan laid the garment on the bank and withdrew behind the bushes. A few moments later, a beautiful young woman in a white robe stood before him. She was so lovely that no pen could describe her. She held out her hand.
        - id: ch02-b16
          speaker: hyacinthia
          text: Thank you for treating me so kindly, Prince Milan. My name is Hyacinthia, and I am the daughter of a wicked magician. My father is a mighty ruler in the underworld, where he owns many castles and great riches. He has thirty young daughters, and he has been waiting for you for years.
        - id: ch02-b17
          speaker: hyacinthia
          text: You need not be afraid if you follow my advice. The moment you stand before him, throw yourself to the ground and go toward him on your knees. Let him stamp and curse as much as he likes. I will manage the rest. Now we had better go.
        - id: ch02-b18
          speaker: narrator
          text: Hyacinthia stamped her little foot. The earth opened beneath them, and together they sank into the lower world.
    - id: ch03
      title: Three Impossible Tasks
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The Magician's palace was carved from one enormous glowing carbuncle. Its light shone across the whole country around it, and Prince Milan walked cheerfully inside. The Magician sat high upon a throne with a sparkling crown on his head. His eyes burned like green fire. In place of human hands, he had the same terrible claws Milan's father had once seen in the well.
        - id: ch03-b02
          speaker: narrator
          text: As soon as Milan entered, he dropped to his knees. The Magician stamped his feet, glared with his terrible green eyes, and cursed so loudly that the whole underworld shook. Milan remembered Hyacinthia's warning. He showed no fear and kept moving toward the throne on his knees. At last, the Magician burst out laughing.
        - id: ch03-b03
          speaker: magician
          text: You rogue! Someone taught you just how to make me laugh. I will no longer treat you as an enemy. Welcome to the underworld. Still, you came years too late, so you must perform three tasks for me. You may go now. Tomorrow I will tell you more.
        - id: ch03-b04
          speaker: narrator
          text: Two servants led Milan away from the throne room and took him to a beautiful apartment. A soft bed had been prepared there for him. Although three unknown tasks still lay ahead, the Prince showed no fear. He lay down, closed his eyes, and was soon fast asleep.
        - id: ch03-b05
          speaker: narrator
          text: Early the next morning, the Magician called for him.
        - id: ch03-b06
          speaker: magician
          text: Let us see what you can do. Before morning, build me a palace with a roof of pure gold, marble walls, and crystal windows. Surround it with a beautiful garden, fishponds, and graceful waterfalls. Finish it all, and I will reward you richly. Fail, and I will have your head.
        - id: ch03-b07
          speaker: narrator
          text: Milan thought the monster might as well have killed him at once. He went sadly back to his room and sat with his head bowed, thinking over his cruel fate. Evening came. A little bee flew to the window and tapped upon it.
        - id: ch03-b08
          speaker: hyacinthia
          text: Open the window and let me in.
        - id: ch03-b09
          speaker: narrator
          text: Milan quickly opened it. The moment the bee entered, it changed into beautiful Hyacinthia.
        - id: ch03-b10
          speaker: hyacinthia
          text: Good evening, Prince Milan. Why are you sitting here so sadly?
        - id: ch03-b11
          speaker: prince_milan
          text: How could I be cheerful? Your father has threatened to kill me. I can almost feel that my head is gone already.
          emotion: sad
        - id: ch03-b12
          speaker: hyacinthia
          text: What have you decided to do?
        - id: ch03-b13
          speaker: prince_milan
          text: There is nothing I can do. A man can only die once, I suppose.
        - id: ch03-b14
          speaker: hyacinthia
          text: Do not be foolish, dear Prince. Take heart. There is no reason to give up. Go to sleep, and when you wake, the palace will be complete. Then walk around it and tap the walls here and there, as though you have only just finished the work.
          emotion: calm
        - id: ch03-b15
          speaker: narrator
          text: Everything happened exactly as she promised. At daylight, Milan stepped outside. There stood the golden-roofed palace, perfect in every detail, with its marble walls and crystal windows. The garden, fishponds, and waterfalls were all in their places. Milan walked around tapping the walls as Hyacinthia had told him. Even the Magician was astonished by the palace's beauty and could scarcely believe his own eyes.
        - id: ch03-b16
          speaker: magician
          text: You are certainly a remarkable workman. Your hands are clever enough. Now I will test your head. I have thirty daughters, all beautiful princesses. Tomorrow they will stand in a row. Walk past them three times, and on the third pass, point out my youngest daughter, Hyacinthia. Choose wrongly, and you lose your head.
        - id: ch03-b17
          speaker: narrator
          text: Milan went back to his room and sat beside the window. This task seemed almost laughably easy. How could he fail to recognize beautiful Hyacinthia?
        - id: ch03-b18
          speaker: hyacinthia
          text: It will not be nearly so easy as you think.
        - id: ch03-b19
          speaker: narrator
          text: The little bee was flying past his window.
        - id: ch03-b20
          speaker: hyacinthia
          text: Without my help, you would never know me. All thirty sisters look so much alike that even our father can barely tell us apart.
        - id: ch03-b21
          speaker: prince_milan
          text: Then how am I supposed to find you?
        - id: ch03-b22
          speaker: hyacinthia
          text: Watch for a tiny fly on my left cheek. That will be your sign. Look carefully, or you may still choose the wrong sister.
        - id: ch03-b23
          speaker: narrator
          text: The next day, the Magician had Milan brought before him. All thirty daughters stood in a straight row. They wore identical clothes and kept their eyes lowered.
        - id: ch03-b24
          speaker: magician
          text: Well, clever Prince, look at these beauties three times. Then tell me which one is Princess Hyacinthia.
        - id: ch03-b25
          speaker: narrator
          text: Milan passed slowly before them and studied every face. The sisters looked like one face reflected in thirty mirrors. On his first pass, he saw no fly anywhere. He walked the line a second time and still found nothing. But on the third pass, he noticed a tiny fly creeping down one girl's left cheek. The touch made her cheek turn a faint pink. Milan reached out and caught her hand.
        - id: ch03-b26
          speaker: prince_milan
          text: This is Princess Hyacinthia!
        - id: ch03-b27
          speaker: magician
          text: Right again! But there is one task left. I am about to light this candle. Before it burns to the socket, make me a pair of boots that reach my knees. If the boots are not finished in time, I will cut off your head.
        - id: ch03-b28
          speaker: narrator
          text: Milan returned to his room in despair. The Magician's candle was already burning, and Milan knew he had no skill at all for making boots. Once more, Hyacinthia came to him in the shape of a little bee and found him grieving over the death that seemed certain.
        - id: ch03-b29
          speaker: hyacinthia
          text: Why are you so unhappy this time, Prince Milan?
        - id: ch03-b30
          speaker: prince_milan
          text: Your father has given me an impossible task. Before his candle burns down, I must make him a pair of boots. What does a prince know about making shoes? If I fail, he will take my head.
          emotion: sad
        - id: ch03-b31
          speaker: hyacinthia
          text: And what will you do?
        - id: ch03-b32
          speaker: prince_milan
          text: What can I do? I cannot make those boots, and I will not pretend I can. He must finish me.
        - id: ch03-b33
          speaker: hyacinthia
          text: No, my dearest. I love you, and you shall marry me. I will save your life, or I will die beside you. We must flee at once. There is no other way out.
    - id: ch04
      title: The Flight from the Underworld
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Hyacinthia breathed upon the window, and her breath froze against the pane. Then she took Milan out of the room, locked the door behind them, and threw away the key. Hand in hand, they hurried across the underworld to the place where they had first descended. At last they climbed back to the banks of the lake.
        - id: ch04-b02
          speaker: narrator
          text: Milan's charger was still grazing beside the water. When the horse saw its master, it neighed for joy and bounded toward him. Then it stood perfectly still while Milan and Hyacinthia climbed onto its back. The charger flew away like an arrow from a bow.
        - id: ch04-b03
          speaker: narrator
          text: Meanwhile, the Magician waited impatiently. The appointed time had passed, and the Prince had not come. In a rage, he sent his servants to fetch him. They found Milan's door locked and knocked upon it.
        - id: ch04-b04
          speaker: prince_milan
          text: I am coming at once.
        - id: ch04-b05
          speaker: narrator
          text: It was the frozen breath on the window speaking in Milan's voice. The servants carried the answer back to their master. Still the Prince did not appear. After waiting a while longer, the Magician sent them to fetch him a second time. Again the frozen breath promised he was coming, and again no Prince followed. At last, the Magician's patience ran out. He ordered the servants to burst open the door.
        - id: ch04-b06
          speaker: narrator
          text: The room was empty. The frozen breath only laughed at them. Mad with fury, the Magician ordered his servants to pursue the fugitives.
        - id: ch04-b07
          speaker: narrator
          text: A wild chase began. Hyacinthia listened behind them.
        - id: ch04-b08
          speaker: hyacinthia
          text: I can hear horses' hooves behind us.
        - id: ch04-b09
          speaker: narrator
          text: Milan sprang from the saddle, pressed his ear to the ground, and listened.
        - id: ch04-b10
          speaker: prince_milan
          text: Yes. They are chasing us, and they are very close.
        - id: ch04-b11
          speaker: hyacinthia
          text: Then we have no time to lose.
        - id: ch04-b12
          speaker: narrator
          text: In an instant, Hyacinthia became a river, Milan became an iron bridge, and the charger became a blackbird. Beyond the bridge, the road divided into three paths.
        - id: ch04-b13
          speaker: narrator
          text: The servants hurried along the fresh tracks until they reached the iron bridge. There the footprints suddenly ended. On the far side, three roads opened before them, and they could not tell which one the fugitives had taken. They stood helplessly for a while. Then, trembling at the thought of their master's anger, they returned and told him what they had found.
        - id: ch04-b14
          speaker: magician
          text: Fools! The river and the bridge were the fugitives themselves. Go back and bring them to me, or you will pay for it!
          emotion: angry
        - id: ch04-b15
          speaker: narrator
          text: The pursuit began again. Soon Hyacinthia heard the sound behind them.
        - id: ch04-b16
          speaker: hyacinthia
          text: The horses are coming after us again.
          emotion: fearful
        - id: ch04-b17
          speaker: narrator
          text: Milan dismounted and listened with his ear against the ground.
        - id: ch04-b18
          speaker: prince_milan
          text: They are riding hard, and they are already near.
        - id: ch04-b19
          speaker: narrator
          text: At once, Hyacinthia changed herself, Milan, and the charger into a thick forest. A thousand roads and paths twisted and crossed beneath its trees. The pursuers rode inside and searched everywhere, but they could find no trace of Prince Milan or his bride. After wandering among the paths, they came back to the very place where they had begun. In despair, they returned to the Magician with empty hands once more.
        - id: ch04-b20
          speaker: magician
          text: Then I will hunt the wretches myself! Bring me a horse. They will not escape me!
          emotion: angry
        - id: ch04-b21
          speaker: narrator
          text: The Magician rode after them. Again, Hyacinthia heard the pursuing hooves.
        - id: ch04-b22
          speaker: hyacinthia
          text: I hear horses very near us now.
          emotion: fearful
        - id: ch04-b23
          speaker: prince_milan
          text: They are racing after us. They are almost here.
        - id: ch04-b24
          speaker: hyacinthia
          text: Then we are in great danger, because my father has come himself. His power ends at the first church we reach. He cannot chase us beyond it. Give me your cross.
        - id: ch04-b25
          speaker: narrator
          text: Milan took off the little golden cross his mother had given him. The moment Hyacinthia held it, she became a church, Milan became a monk, and the horse became a belfry. They had barely changed when the Magician and his servants rode up.
        - id: ch04-b26
          speaker: magician
          text: Reverend Father, have you seen a man and woman ride past here?
        - id: ch04-b27
          speaker: prince_milan
          text: Prince Milan and Princess Hyacinthia left only a moment ago. They stopped in the church to pray. They asked me to light this wax candle for you and send you their love.
        - id: ch04-b28
          speaker: magician
          text: I would like to wring both their necks!
          emotion: angry
        - id: ch04-b29
          speaker: narrator
          text: He hurried home and had every servant beaten nearly to death. Prince Milan and Hyacinthia continued more slowly. They no longer feared pursuit.
    - id: ch05
      title: The White Milestone
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The sun was setting, and its last rays shone on a large city ahead. Suddenly Milan longed to go inside its walls.
        - id: ch05-b02
          speaker: hyacinthia
          text: Oh, my beloved, please do not go. I am frightened that something evil will happen.
          emotion: fearful
        - id: ch05-b03
          speaker: prince_milan
          text: What is there to fear? We will look around the city for an hour, and then we will continue to my father's kingdom.
        - id: ch05-b04
          speaker: hyacinthia
          text: A city may be easy to enter and hard to leave. But if you are determined, then go. I will wait here after changing myself into a white milestone. Please be careful. The King and Queen will meet you with a little child. Whatever happens, do not kiss her. If you do, you will forget me and everything we have been through. I will wait here for three days.
          emotion: fearful
        - id: ch05-b05
          speaker: narrator
          text: Milan hurried toward the city, while Hyacinthia stayed on the road in the shape of a white milestone. The first day passed, then the second, and finally the third. Milan did not return.
        - id: ch05-b06
          speaker: narrator
          text: Everything had happened just as Hyacinthia warned. The King and Queen came out to greet Milan, leading a lovely little fair-haired girl. Her eyes shone like two clear stars. The child came close and caressed the Prince. He was so taken by her beauty that he forgot the warning, bent down, and kissed her cheek. In that very moment, his memory became a blank. Beautiful Hyacinthia vanished from his thoughts, along with everything the two of them had endured together.
        - id: ch05-b07
          speaker: narrator
          text: When Milan failed to return, Hyacinthia wept bitterly. She changed from a milestone into a small blue flower beside the road.
        - id: ch05-b08
          speaker: hyacinthia
          text: I will grow here by the wayside until a passerby crushes me beneath a foot.
          emotion: sad
        - id: ch05-b09
          speaker: narrator
          text: One of her tears remained upon the blue flower, shining like a drop of dew.
    - id: ch06
      title: The Blue Flower
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Not long afterward, an old man came along the road. The flower delighted him with its beauty. He carefully pulled it up with all its roots, carried it home, and planted it in a pot. He watered it and tended it with very great care.
        - id: ch06-b02
          speaker: narrator
          text: From that moment, strange things began to happen in his house. Each morning, he woke to find the whole room neatly arranged. There was not one speck of dust anywhere. Whenever he returned at midday, he found the table already laid with the most delicious food. No one was there to serve it. He only had to sit down and eat as much as he pleased.
        - id: ch06-b03
          speaker: narrator
          text: At first, the old man was too amazed to know what to think. After a while, the mystery made him uneasy, so he went to an old witch for advice.
        - id: ch06-b04
          speaker: old_witch
          text: Rise before the rooster crows and keep watch until something moves. Then throw this cloth over it as quickly as you can. You will soon see what happens.
        - id: ch06-b05
          speaker: narrator
          text: The old man did not close his eyes all night. At the first light of morning, the blue flower began to tremble. Then it lifted itself from the pot and flew around the room. It put everything in order, swept away the dust, and lit the fire.
        - id: ch06-b06
          speaker: narrator
          text: The old man leaped from his bed and covered the flower with the witch's cloth. In a moment, beautiful Princess Hyacinthia stood before him.
        - id: ch06-b07
          speaker: hyacinthia
          text: What have you done? Why did you bring me back to life? I do not wish to live now that my bridegroom, Prince Milan, has abandoned me.
          emotion: sad
        - id: ch06-b08
          speaker: old_man
          text: Prince Milan is about to be married. The feast is being prepared, and guests are coming to the palace from every direction.
        - id: ch06-b09
          speaker: narrator
          text: Hyacinthia wept bitterly when she heard the news. Then she dried her tears, dressed herself as a peasant woman, and went into the city.
    - id: ch07
      title: The Wedding Cake
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: Hyacinthia went straight to the royal kitchen. Cooks in white aprons hurried everywhere in great confusion. She approached the head cook.
        - id: ch07-b02
          speaker: hyacinthia
          text: Dear cook, please grant me one request. Let me bake a wedding cake for Prince Milan.
        - id: ch07-b03
          speaker: narrator
          text: The busy cook was ready to refuse and send her away. Then he turned, saw how beautiful she was, and the angry words died upon his lips.
        - id: ch07-b04
          speaker: head_cook
          text: You have arrived at exactly the right moment, fair maiden. Bake your cake, and I will place it before Prince Milan myself.
        - id: ch07-b05
          speaker: narrator
          text: Hyacinthia soon finished the cake. By then, the invited guests were crowding around the wedding table. The head cook entered carrying the cake on a silver dish and set it before Prince Milan himself. Every guest stopped to admire it, for it was so beautifully made that it looked like a work of art.
        - id: ch07-b06
          speaker: narrator
          text: Milan began to cut it. To his astonishment, two white doves flew out. One dove turned to the other and spoke.
        - id: ch07-b07
          speaker: first_dove
          text: My dear mate, do not fly away and leave me. Do not forget me as Prince Milan forgot his beloved Hyacinthia.
          emotion: sad
        - id: ch07-b08
          speaker: narrator
          text: At the dove's words, Milan gave a deep sigh. His lost memories returned, and he understood whom he had forgotten. He sprang suddenly from the wedding table and ran straight to the door. Beautiful Hyacinthia was waiting for him there. Outside stood his faithful charger, pawing the ground and ready to carry them away.
        - id: ch07-b09
          speaker: narrator
          text: Without a moment's delay, Milan and Hyacinthia climbed onto the horse and galloped as fast as they could to the country of King Kojata.
        - id: ch07-b10
          speaker: narrator
          text: The King and Queen welcomed them with greater joy than anyone had ever known. And there they all lived happily for the rest of their lives.
