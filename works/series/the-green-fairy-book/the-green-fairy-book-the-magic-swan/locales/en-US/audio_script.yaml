  chapters:
    - id: ch01
      title: Peter Leaves Home
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there were three brothers. The eldest was Jacob, the second was Frederick, and the youngest was Peter. Jacob and Frederick made Peter the target of all their cruelty. Whenever anything went wrong, they blamed him and forced him to set it right. Peter was weak and delicate, and he could not defend himself against them. His life was hard from morning until night, and he was always wondering how he might change it.
        - id: ch01-b02
          speaker: narrator
          text: One day, Peter was gathering sticks in the woods and weeping bitterly. A little old woman came upon him and asked what troubled him. Peter told her everything his brothers had done.
        - id: ch01-b03
          speaker: old_woman
          text: My good young man, the world is wide. Why not leave this place and seek your fortune somewhere else?
        - id: ch01-b04
          speaker: narrator
          text: Peter took her advice to heart. Early one morning, he left his father's house to seek his fortune in the wide world. Still, leaving the place where he had been born was painful. At least he had known a few happy years there as a child. He sat on a hill and looked fondly back at his old home one last time.
        - id: ch01-b05
          speaker: narrator
          text: All at once, the little old woman stood beside him and tapped his shoulder.
        - id: ch01-b06
          speaker: old_woman
          text: You have made a good start, my boy. But what will you do now?
        - id: ch01-b07
          speaker: narrator
          text: Peter had no answer. Until then, he had imagined that good fortune might simply fall into his mouth like a ripe cherry. The old woman understood what he was thinking and laughed kindly.
        - id: ch01-b08
          speaker: old_woman
          text: I will tell you what to do. I have grown fond of you, and I am sure you will remember me after you have made your fortune.
        - id: ch01-b09
          speaker: narrator
          text: Peter gave her his solemn promise. Then the old woman pointed toward a pear tree at the crossroads.
        - id: ch01-b10
          speaker: old_woman
          text: Go to that pear tree at sunset. A man will be asleep beneath it, and a beautiful great swan will be tied nearby. Do not wake the man. Untie the swan and take it with you. Everyone will admire its feathers, and you must let anyone who wishes try to pull one out. The moment a finger touches the bird, it will scream. Then say, "Swan, hold fast." That person's hand will be gripped as tightly as if it were caught in a vise. Nothing can free it except a touch from this little stick, which I give to you.
        - id: ch01-b11
          speaker: old_woman
          text: Once you have caught a whole train of people, lead them onward. You will reach a great town where a princess lives who has never laughed. Make her laugh, and your fortune will be made. When that happens, please remember your old friend.
        - id: ch01-b12
          speaker: narrator
          text: Peter promised once more that he would remember her.
    - id: ch02
      title: The Swan Holds Fast
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: At sunset, Peter went to the tree. The man was fast asleep beneath it, and beside him a large, beautiful swan was tied to the trunk with a red cord. Peter quietly loosened the cord and led the bird away without waking its master.
        - id: ch02-b02
          speaker: narrator
          text: After walking for some time, Peter came to a building yard where several men were hard at work. They stopped to admire the swan's magnificent feathers. One bold young worker, covered in clay from head to foot, called out to him.
        - id: ch02-b03
          speaker: clay_worker
          text: Oh, how happy I would be if I could have just one of those feathers!
        - id: ch02-b04
          speaker: peter
          text: Then go ahead and pull one out.
        - id: ch02-b05
          speaker: narrator
          text: The youth seized a feather from the swan's tail. At once, the bird screamed.
        - id: ch02-b06
          speaker: peter
          text: Swan, hold fast.
        - id: ch02-b07
          speaker: narrator
          text: No matter how he struggled, the poor youth could not pull his hand free. He howled while the other workers laughed harder and harder. A girl who had been washing clothes in a nearby stream hurried over to see what had happened. She felt sorry for the youth when she saw him stuck to the swan, so she reached out to release him. The bird screamed again.
        - id: ch02-b08
          speaker: peter
          text: Swan, hold fast.
        - id: ch02-b09
          speaker: narrator
          text: Now the girl was caught as well. Peter continued on with both captives behind the swan.
        - id: ch02-b10
          speaker: narrator
          text: Before long, they met a chimney sweep. He laughed loudly at the strange procession and asked the girl what she was doing there.
        - id: ch02-b11
          speaker: washer_girl
          text: Oh, dear John, give me your hand and free me from this horrible young man!
        - id: ch02-b12
          speaker: chimney_sweep
          text: Of course I will, if that is all you need.
        - id: ch02-b13
          speaker: narrator
          text: The sweep took her hand. The swan screamed.
        - id: ch02-b14
          speaker: peter
          text: Swan, hold fast.
        - id: ch02-b15
          speaker: narrator
          text: And so the soot-blackened chimney sweep joined the line.
    - id: ch03
      title: The Procession at the Fair
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The travelers soon reached a village where a fair was under way. A crowd had gathered around a traveling circus, and its clown was in the middle of performing his tricks. Then the procession came into view. When the clown saw the remarkable three-person chain fastened behind the swan, his eyes opened wide with amazement.
        - id: ch03-b02
          speaker: clown
          text: Have you completely lost your mind, Blackie?
        - id: ch03-b03
          speaker: narrator
          text: The clown could hardly get the question out because he was laughing so much.
        - id: ch03-b04
          speaker: chimney_sweep
          text: This is nothing to laugh about. This girl is holding me so tightly, I might as well be glued to her. Be a good clown and set me free. I will repay you someday.
        - id: ch03-b05
          speaker: narrator
          text: Without stopping to think, the clown grasped the sweep's outstretched hand. The swan screamed.
        - id: ch03-b06
          speaker: peter
          text: Swan, hold fast.
        - id: ch03-b07
          speaker: narrator
          text: The clown became the fourth captive in the procession.
        - id: ch03-b08
          speaker: narrator
          text: The village mayor sat in the front row among the spectators. He was respected and popular, and he was thoroughly annoyed by what he considered a foolish trick. He grabbed the clown's hand and pulled hard, intending to free him and hand him over to the police. The bird screamed once more.
        - id: ch03-b09
          speaker: peter
          text: Swan, hold fast.
        - id: ch03-b10
          speaker: narrator
          text: The dignified mayor was caught like all the others. His wife was a tall, thin woman, and she was furious at the insult to her husband. She seized his free arm and pulled with all her strength. That only added her to the procession too. After seeing what happened to her, no one else wished to join them.
    - id: ch04
      title: The Princess Laughs
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Soon the towers of the capital appeared ahead of Peter. Just before he entered the city, a glittering carriage came toward him. Inside sat a young lady as beautiful as the day, though her face was solemn and serious. Then she saw the motley crowd fastened to the swan's tail, and she burst into loud laughter. All her servants and ladies joined her.
        - id: ch04-b02
          speakers: [attendant_1, attendant_2, attendant_3]
          ensemble: chorus
          text: The Princess has laughed at last!
          emotion: happy
        - id: ch04-b03
          speaker: narrator
          text: The Princess stepped from the carriage for a closer look. The poor captives were leaping and stumbling along, and the sight made her laugh again. She ordered the carriage turned around. Then she rode slowly back into town, keeping her eyes on Peter and his procession the whole way.
    - id: ch05
      title: Peter's Fortune
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: When the King heard that his daughter had truly laughed, he was delighted. He ordered Peter and his marvelous train to be brought before him. The moment he saw them, he laughed until tears rolled down his cheeks.
        - id: ch05-b02
          speaker: king
          text: My good friend, do you know what I promised to whoever could make the Princess laugh?
        - id: ch05-b03
          speaker: peter
          text: No, I do not.
        - id: ch05-b04
          speaker: king
          text: Then I will tell you. You may have a thousand gold crowns or a piece of land. Which do you choose?
        - id: ch05-b05
          speaker: narrator
          text: Peter chose the land. Then he touched the clay-covered youth, the washer girl, the chimney sweep, the clown, the mayor, and the mayoress with the little stick. At once, they were free. They raced home as though a fire were burning behind them, and the sight of their flight made everyone laugh all over again.
        - id: ch05-b06
          speaker: narrator
          text: Then the Princess admired the swan's beautiful feathers and reached out to stroke the bird. The instant her hand touched it, the swan screamed.
        - id: ch05-b07
          speaker: peter
          text: Swan, hold fast.
        - id: ch05-b08
          speaker: narrator
          text: The Princess was caught fast, and that was how Peter won her as his bride. Then the swan rose into the air and vanished far away on the blue horizon.
        - id: ch05-b09
          speaker: narrator
          text: Peter was given a duchy and became a very great man. But he never forgot the little old woman who had brought him such good fortune. He made her head housekeeper for himself and his royal bride in their magnificent castle.
