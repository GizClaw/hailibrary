audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，像编书人面对孩子娓娓而谈，幽默处轻巧含笑
        timbre: 温暖清朗
        pace: 舒缓而有自然起伏
        pitch: 中音
    peter:
      display_name: 彼得
      tts:
        delivery: 善良朴实，起初怯弱忧郁，得到指引后逐渐坚定
        timbre: 清亮柔和
        pace: 适中
        pitch: 中音
    old_woman:
      display_name: 老婆婆
      tts:
        delivery: 慈爱机敏，说话胸有成竹，叮嘱时清楚郑重
        timbre: 苍老温厚
        pace: 稍慢
        pitch: 中低音
    young_worker:
      display_name: 年轻工人
      tts:
        delivery: 莽撞直爽，吃痛时慌乱夸张
        timbre: 年轻明亮
        pace: 适中偏快
        pitch: 中高音
    laundry_girl:
      display_name: 洗衣姑娘
      tts:
        delivery: 热心爽快，受困后焦急恼火
        timbre: 清脆自然
        pace: 适中偏快
        pitch: 中高音
    john_sweep:
      display_name: 扫烟囱的约翰
      tts:
        delivery: 粗声爽朗，爱说笑，发现自己受困后急切求助
        timbre: 粗哑结实
        pace: 适中
        pitch: 中低音
    clown:
      display_name: 小丑
      tts:
        delivery: 活泼滑稽，笑声里带着戏谑和好奇
        timbre: 明亮灵活
        pace: 偏快
        pitch: 中高音
    king:
      display_name: 国王
      tts:
        delivery: 威严宽厚，兴致高昂时爽朗亲切
        timbre: 洪亮厚实
        pace: 适中偏慢
        pitch: 低音
    princess:
      display_name: 公主
      tts:
        delivery: 高贵端庄，平日严肃，笑起来明朗而毫无拘束
        timbre: 清澈明亮
        pace: 适中
        pitch: 中高音
    lady_in_waiting:
      display_name: 侍女
      tts:
        delivery: 恭敬活泼，惊喜时声音轻快
        timbre: 柔亮清晰
        pace: 适中偏快
        pitch: 高音
    servant:
      display_name: 仆人
      tts:
        delivery: 恭敬利落，报喜时兴奋爽朗
        timbre: 清朗自然
        pace: 适中偏快
        pitch: 中音
  chapters:
    - id: ch01
      title: 离家寻找好运
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，有兄弟三人。老大雅各布，老二弗雷德里克，老三彼得。两个哥哥总拿彼得取笑，待他也刻薄得很。他们办事一出岔子，就把错全推给彼得，还逼他去收拾残局。彼得身体单薄，又敌不过两个强壮的哥哥，只能忍下所有欺负。可怜的孩子从早到晚都在想，怎样才能换一种活法。有一天，他去树林里捡柴，越想越伤心，忍不住哭了起来。一个矮小的老婆婆走到他身边，问清缘故，听他讲完了所有苦恼。
        - id: ch01-b02
          speaker: old_woman
          text: >-
            好孩子，世界这么大，你何必一直留在这里受苦？走出去，到别处找找自己的好运吧。
        - id: ch01-b03
          speaker: narrator
          text: >-
            彼得记住了这句话。一天清早，他离开父亲的家，独自走向广阔的世界。可真要告别出生的地方，他又难过起来。这里毕竟留着一段短暂却快乐的童年。彼得坐在小山上，恋恋不舍地回望故乡。忽然，老婆婆又站到了他面前，还轻轻拍了拍他的肩膀。
        - id: ch01-b04
          speaker: old_woman
          text: >-
            孩子，你能走到这里，已经不错了。可是下一步呢？你准备怎么寻找好运？
        - id: ch01-b05
          speaker: narrator
          text: >-
            彼得答不上来。原来他一直以为，好运会像熟透的樱桃一样，自己掉进嘴里。老婆婆猜中了他的心思，慈爱地笑了。
        - id: ch01-b06
          speaker: old_woman
          text: >-
            我很喜欢你，就告诉你该怎样做吧。我相信，你将来有了好运，一定不会忘记我。
        - id: ch01-b07
          speaker: narrator
          text: >-
            彼得郑重地答应了她。
        - id: ch01-b08
          speaker: old_woman
          text: >-
            太阳落山时，到那边十字路口的梨树下去。那里会有一个熟睡的人，树上还拴着一只美丽的大天鹅。别惊醒那个人，只管解开天鹅，把它带走。人人都会喜欢它的羽毛，谁想拔一根，你就让谁拔。只要有手指碰到天鹅，它就会叫。这时，你要喊：“天鹅，牢牢抓住！”那只手会像被老虎钳夹住一样，再也挣不脱。只有用我送你的这根小棍碰一下，才能把人放开。等身后粘住了一大群人，你就领着他们继续往前走。前面有座大城，城里有位从来不笑的公主。只要逗笑她，你就交上好运了。到那时，可别忘了你的老朋友。
        - id: ch01-b09
          speaker: narrator
          text: >-
            彼得再次许下承诺。黄昏时，他来到那棵梨树下。一个人果然睡得正沉，旁边的树上用红绳拴着一只美丽的大天鹅。彼得悄悄解开绳子，领走天鹅，没有惊醒它的主人。

    - id: ch02
      title: 天鹅尾巴上的队伍
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            走了一阵，他们来到一处建筑工地。工人们正忙着干活，一见天鹅漂亮的羽毛，全都看呆了。一个浑身沾满泥巴的年轻人最沉不住气。
        - id: ch02-b02
          speaker: young_worker
          text: >-
            我要是能有一根这样的羽毛，那可真叫人高兴！
        - id: ch02-b03
          speaker: peter
          text: >-
            你喜欢，就自己拔一根吧。
        - id: ch02-b04
          speaker: narrator
          text: >-
            年轻人抓住天鹅尾巴上的一根羽毛。天鹅立刻尖叫起来。
        - id: ch02-b05
          speaker: peter
          text: 天鹅，牢牢抓住！
        - id: ch02-b06
          speaker: narrator
          text: >-
            年轻人再怎样用力，也抽不回那只手。他急得大喊大叫，旁边的人却越笑越响。附近溪边有个姑娘正在洗衣服，听见动静，赶忙跑过来。她见那小伙子粘在天鹅身上，觉得他实在可怜，便伸手去救。天鹅又叫了。
        - id: ch02-b07
          speaker: peter
          text: 天鹅，把她也牢牢抓住！
        - id: ch02-b08
          speaker: narrator
          text: >-
            姑娘也挣脱不了了。彼得带着两个俘虏继续赶路，不久遇见一个扫烟囱的工人。那人见了这支怪队伍，放声大笑，还问姑娘究竟在做什么。
        - id: ch02-b09
          speaker: laundry_girl
          text: >-
            亲爱的约翰，快拉住我的手，把我从这个可恶的小子手里救出去！
          emotion: angry
        - id: ch02-b10
          speaker: john_sweep
          text: >-
            原来你只求这件事？那当然没问题，把手给我吧。
        - id: ch02-b11
          speaker: narrator
          text: >-
            约翰握住姑娘伸来的手，天鹅马上又叫了一声。
        - id: ch02-b12
          speaker: peter
          text: 天鹅，牢牢抓住！
        - id: ch02-b13
          speaker: narrator
          text: >-
            于是，这个被烟灰染得浑身漆黑的人也加入了队伍。

    - id: ch03
      title: 集市上的热闹
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            他们来到一个村庄，那里正在赶集。巡回马戏团搭起场子，小丑正在台上耍把戏。他忽然看见，天鹅尾巴后面竟粘着三个人，顿时惊得瞪圆了眼睛，笑得连一句完整的话都快说不出来了。
        - id: ch03-b02
          speaker: clown
          text: >-
            黑家伙，你这是怎么啦？难道真的疯了？
        - id: ch03-b03
          speaker: john_sweep
          text: >-
            这事一点也不好笑。这个丫头抓着我不放，我简直像粘在她身上了。好心的小丑，快拉我出去吧。改天我一定报答你。
        - id: ch03-b04
          speaker: narrator
          text: >-
            小丑一点也没犹豫，伸手就抓住了约翰那只黑乎乎的手。天鹅又叫了。
        - id: ch03-b05
          speaker: peter
          text: 天鹅，牢牢抓住！
        - id: ch03-b06
          speaker: narrator
          text: >-
            小丑成了队伍里的第四个人。观众席第一排坐着本村的镇长。他德高望重，也很受人爱戴，可眼前这场闹剧让他十分恼火。镇长认定，这不过是愚蠢的恶作剧，便抓住小丑的手，拼命想把他扯下来，再交给警察。天鹅一叫，彼得照例喊出咒语。于是，这位体面的镇长也和前面几个人粘到了一起。
        - id: ch03-b07
          speaker: narrator
          text: >-
            镇长夫人又瘦又长，活像一根竹竿。她见丈夫受了侮辱，气得一把抓住他另一条胳膊，使出浑身力气往外拉。结果，她没能救出丈夫，自己反倒也粘住了。到了这一步，再没有人愿意上前凑热闹。

    - id: ch04
      title: 从不发笑的公主
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            彼得很快看见了都城的尖塔。还没进城，一辆闪闪发亮的马车就从城里迎面驶来。车上坐着一位年轻姑娘，美得像明媚的白昼，脸上的神情却庄重又严肃。她就是那位从来不笑的公主。可是，她一看见天鹅身后粘着一群形形色色的人，立刻放声大笑。仆人和侍女们也全笑了起来。
        - id: ch04-b02
          speakers: [lady_in_waiting, servant]
          ensemble: duo
          text: 公主终于笑了！
          emotion: happy
        - id: ch04-b03
          speaker: narrator
          text: >-
            公主走下马车，想把这件奇事看得更清楚些。几个可怜的俘虏扭来跳去，又把她逗得笑个不停。她吩咐车夫调转方向，缓缓驶回城里，一路都没有把目光从彼得和那支队伍身上移开。
        - id: ch04-b04
          speaker: narrator
          text: >-
            国王听说女儿真的笑了，欢喜得不得了。他马上命人把彼得和那支奇妙的队伍带进宫。亲眼看见以后，国王自己也笑得眼泪直流。
        - id: ch04-b05
          speaker: king
          text: >-
            好朋友，你知道我答应过什么吗？谁能让公主发笑，我就会给他一份赏赐。
        - id: ch04-b06
          speaker: peter
          text: >-
            我不知道，陛下。
        - id: ch04-b07
          speaker: king
          text: >-
            那我告诉你。你可以要一千枚金克朗，也可以要一块领地。你选哪一样？
        - id: ch04-b08
          speaker: narrator
          text: >-
            彼得选择了领地。接着，他拿出老婆婆送的小棍，依次碰过年轻工人、洗衣姑娘、扫烟囱的约翰、小丑、镇长和镇长夫人。六个人一下子全恢复了自由，立刻飞奔回家，仿佛身后有一场大火正在追赶。看见他们没命逃跑的样子，众人又笑成一片。

    - id: ch05
      title: 彼得的好运
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            公主仍在赞叹天鹅美丽的羽毛。她忍不住走上前，伸手轻轻摸了一下。天鹅顿时叫了起来。
        - id: ch05-b02
          speaker: peter
          text: 天鹅，牢牢抓住！
        - id: ch05-b03
          speaker: narrator
          text: >-
            这一次，彼得用天鹅赢得了公主做新娘。那只神奇的鸟却在此时展开翅膀，飞上高空，最后消失在蔚蓝的天边。彼得得到一片公爵领地，从此成了一位真正的大人物。可他没有忘记为自己带来好运的老婆婆。他把她接到自己和公主居住的华丽城堡，请她做了城堡的总管家。
        - id: ch05-b04
          speaker: narrator
          text: >-
            故事最后，署着克莱特克的名字。
