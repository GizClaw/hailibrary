audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and attentive fairy-tale storytelling
        timbre: clear and gently resonant
        pace: measured
        pitch: medium
    witch:
      display_name: The Witch
      tts:
        delivery: sharp, watchful, and commanding
        timbre: dry and aged
        pace: deliberate
        pitch: medium-low
    parsley:
      display_name: Parsley
      tts:
        delivery: kind, assured, and quietly magical
        timbre: clear and youthful
        pace: unhurried
        pitch: medium-high
    prince:
      display_name: The Prince
      tts:
        delivery: earnest, romantic, and determined
        timbre: warm and youthful
        pace: natural
        pitch: medium
    king:
      display_name: The King
      tts:
        delivery: fatherly, regal, and decisive
        timbre: deep and aging
        pace: measured
        pitch: low
  chapters:
    - id: ch01
      title: Parsley and the Witch
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a poor woman with one little daughter. The child was called Parsley because she loved parsley more than any other food. In fact, she would scarcely eat anything else.
        - id: ch01-b02
          speaker: narrator
          text: Her mother could not afford to buy parsley every day. But the child was so beautiful that her mother could refuse her nothing. Every night, the poor woman crept into the garden of an old witch who lived nearby. There she stole great branches of parsley for her daughter.
        - id: ch01-b03
          speaker: narrator
          text: Before long, everyone knew about the beautiful girl's remarkable appetite, and the witch discovered the theft. She summoned Parsley's mother and offered her a bargain.
        - id: ch01-b04
          speaker: witch
          text: Let your daughter come and live with me. Then she may eat all the parsley she wants.
        - id: ch01-b05
          speaker: narrator
          text: The mother was quite pleased with the idea. And so beautiful Parsley left her home and went to live with the old witch.
        - id: ch01-b06
          speaker: narrator
          text: One day, three Princes came to the town. Their father had sent them abroad to travel, and as they passed the witch's house, they saw Parsley at the window. She was combing and braiding her long black hair.
        - id: ch01-b07
          speaker: narrator
          text: All three fell hopelessly in love with her at once. Each longed to make her his wife. But the moment they admitted what they wanted, jealousy took hold of them. They drew their swords and attacked one another.
        - id: ch01-b08
          speaker: narrator
          text: The fight was so fierce, and the clatter so loud, that the witch heard it.
        - id: ch01-b09
          speaker: witch
          text: Parsley must be the cause of all this.
        - id: ch01-b10
          speaker: narrator
          text: She looked for herself and saw that she was right. Furious at all the quarrels and feuds caused by Parsley's beauty, the witch turned upon the girl.
        - id: ch01-b11
          speaker: witch
          text: I wish you were an ugly toad, sitting beneath a bridge at the far end of the world!
          emotion: angry
        - id: ch01-b12
          speaker: narrator
          text: The words had scarcely left her mouth when Parsley became a toad and vanished. With the cause of their quarrel gone, the three Princes sheathed their swords. They kissed one another affectionately and returned to their father.
    - id: ch02
      title: The First Task
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The King was growing old and weak. He wished to give his crown and scepter to one of his sons, but he could not decide which son should succeed him. At last, he chose to let fate decide and called the three Princes before him.
        - id: ch02-b02
          speaker: king
          text: My dear sons, I am old now, and I have grown tired of ruling. I love all three of you equally, so I cannot choose which of you should have my crown. Still, I want the best and cleverest among you to govern my people. I will give you three tasks. Whoever performs them best will be my heir.
        - id: ch02-b03
          speaker: king
          text: For your first task, bring me a piece of linen one hundred yards long. It must be fine enough to pass through a gold ring.
        - id: ch02-b04
          speaker: narrator
          text: The sons bowed deeply. They promised to do their best and set out without delay. The two elder brothers took servants and carriages, while the youngest Prince traveled alone.
        - id: ch02-b05
          speaker: narrator
          text: Soon they reached a place where three roads met. Two roads were bright and crowded. The third was dark and lonely. The elder brothers chose the busy roads. The youngest said farewell to them and followed the dreary one.
        - id: ch02-b06
          speaker: narrator
          text: The elder Princes hurried to every place where linen was sold. They filled their carriages with bales of the finest cloth they could find, then headed home.
        - id: ch02-b07
          speaker: narrator
          text: Their younger brother walked wearily for many days. He found no linen that could possibly meet his father's demand, and with every step his hopes sank lower.
        - id: ch02-b08
          speaker: narrator
          text: At last he came to a bridge over a deep river. Flat, marshy land spread all around it. Before crossing, he sat on the bank and gave a miserable sigh. Then a misshapen toad crawled from the swamp and settled opposite him.
        - id: ch02-b09
          speaker: parsley
          text: What is troubling you, my dear Prince?
        - id: ch02-b10
          speaker: prince
          text: There is little use in telling you, Puddocky. Even if I did, you could not help me.
        - id: ch02-b11
          speaker: parsley
          text: You cannot be certain of that. Tell me your trouble, and we shall see.
        - id: ch02-b12
          speaker: narrator
          text: The Prince decided to trust the little creature. He explained why he had been sent away from his father's kingdom.
        - id: ch02-b13
          speaker: parsley
          text: Prince, I will certainly help you.
        - id: ch02-b14
          speaker: narrator
          text: Puddocky crawled into the swamp. When she returned, she dragged a roll of linen no bigger than a finger and placed it before him.
        - id: ch02-b15
          speaker: parsley
          text: Take this home with you. You will find that it gives you the help you need.
        - id: ch02-b16
          speaker: narrator
          text: The Prince had no wish to carry such a tiny, unimpressive bundle. Still, he did not want to hurt Puddocky's feelings by refusing. He slipped the packet into his pocket, said goodbye, and went on. Puddocky watched until he disappeared, then crept back into the water.
        - id: ch02-b17
          speaker: narrator
          text: As the Prince traveled, the pocket holding the linen grew heavier and heavier. His heart grew lighter by the same measure. Much comforted, he returned to his father's court and arrived just as his brothers came in with their caravans.
        - id: ch02-b18
          speaker: narrator
          text: The King welcomed all three sons and drew a gold ring from his finger. The trial began. Not one piece among all the wagonloads was fine enough for even a tenth of it to pass through the ring. The elder brothers had mocked the youngest for bringing no baggage. Now they began to feel foolish.
        - id: ch02-b19
          speaker: narrator
          text: Then the youngest Prince reached into his pocket and drew out a whole bale of linen. No cloth could match its fineness, softness, or pure color. Its threads were almost invisible. All one hundred yards slipped through the gold ring without the least difficulty.
        - id: ch02-b20
          speaker: narrator
          text: The delighted King embraced his fortunate son and ordered the other linen thrown into the water. Then he faced the Princes again.
        - id: ch02-b21
          speaker: king
          text: Now prepare yourselves for the second task. Bring me a little dog that can sit comfortably inside a walnut shell.
    - id: ch03
      title: The Second Task
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: All three sons despaired when they heard this demand. But each one wanted the crown, so each resolved to try. A few days later, they set off once more.
        - id: ch03-b02
          speaker: narrator
          text: At the crossroads they separated again. The youngest Prince took the lonely road by himself, though this time he felt far more hopeful. He had barely sat beneath the bridge and sighed when Puddocky came out of the swamp.
        - id: ch03-b03
          speaker: parsley
          text: What is wrong now, dear Prince?
        - id: ch03-b04
          speaker: narrator
          text: This time the Prince did not doubt that the little toad might help him. He told her his difficulty at once.
        - id: ch03-b05
          speaker: parsley
          text: Prince, I will help you again.
        - id: ch03-b06
          speaker: narrator
          text: She hurried into the swamp as fast as her short legs could carry her. Soon she returned, dragging a hazelnut behind her. She laid it at the Prince's feet.
        - id: ch03-b07
          speaker: parsley
          text: Take this nut home. Ask your father to crack it very carefully, and then you will see what happens.
        - id: ch03-b08
          speaker: narrator
          text: The Prince thanked her with all his heart and started home in the best of spirits. Puddocky slowly crept back into the water.
        - id: ch03-b09
          speaker: narrator
          text: When the Prince reached the palace, his brothers had just arrived with wagonloads of little dogs of every sort. The King had a walnut shell ready, and the trial began. But not one of the elder brothers' dogs came close to fitting inside it.
        - id: ch03-b10
          speaker: narrator
          text: Once every dog had been tried, the youngest son stepped forward. With a modest bow, he handed his father the hazelnut and asked him to crack it carefully.
        - id: ch03-b11
          speaker: narrator
          text: The moment the old King opened the shell, a lovely tiny dog sprang out. It ran across the King's hand, wagged its tail, and barked loudly at all the other little dogs. The whole court rejoiced.
        - id: ch03-b12
          speaker: narrator
          text: Once again, the King embraced his fortunate son. He ordered all the other little dogs thrown into the water and drowned. Then he spoke to his sons for the third time.
        - id: ch03-b13
          speaker: king
          text: You have completed the two hardest tasks. Now hear the third and final one. Whoever brings home the fairest wife will be my heir.
    - id: ch04
      title: Puddocky's Promise
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: This last demand sounded easy and pleasant, and the reward could not have been greater. The Princes wasted no time before setting out.
        - id: ch04-b02
          speaker: narrator
          text: At the crossroads, the elder brothers wondered whether they should follow the youngest Prince. But his road looked as empty and gloomy as ever. They decided no one could find a beautiful bride in such a wilderness, so they kept to the roads they had taken before.
        - id: ch04-b03
          speaker: narrator
          text: The youngest Prince was deeply discouraged. He thought Puddocky could have helped him with almost anything else, but surely finding him a beautiful wife was beyond her power. Her swamps were wide and empty. No people lived there, only frogs, toads, and creatures like them.
        - id: ch04-b04
          speaker: narrator
          text: Even so, he went to his usual place beneath the bridge. He sat down and sighed from the bottom of his heart. Within minutes, the toad stood before him.
        - id: ch04-b05
          speaker: parsley
          text: What is troubling you now, my dear Prince?
        - id: ch04-b06
          speaker: prince
          text: Oh, Puddocky, you cannot help me this time. This task is beyond even your power.
          emotion: sad
        - id: ch04-b07
          speaker: parsley
          text: You may as well tell me what the difficulty is. Who knows? Perhaps I can help you this time too.
        - id: ch04-b08
          speaker: narrator
          text: So the Prince told her about the final task.
        - id: ch04-b09
          speaker: parsley
          text: I can help you with that, my dear Prince. Go home now, and I will follow very soon.
        - id: ch04-b10
          speaker: narrator
          text: With that, Puddocky gave a leap quite unlike her usual slow movements. She plunged into the water and disappeared.
        - id: ch04-b11
          speaker: narrator
          text: The Prince rose and walked sadly onward. He could not believe that the little toad could truly help him now. He had gone only a few steps when he heard something behind him and turned around.
        - id: ch04-b12
          speaker: narrator
          text: A cardboard carriage was rolling toward him, drawn by six large rats. Two hedgehogs rode ahead of it. A fat mouse sat on the box as coachman, and two little frogs stood behind as footmen. Inside the carriage sat Puddocky, blowing the Prince a kiss as she passed.
        - id: ch04-b13
          speaker: narrator
          text: The Prince hardly noticed the ridiculous carriage. He was thinking about the strange turns of fortune. It had granted him two wishes, but now it seemed ready to deny him the last and best one. He was in no mood to laugh at the comical sight.
        - id: ch04-b14
          speaker: narrator
          text: The little carriage traveled ahead of him for a while, then vanished around a corner.
    - id: ch05
      title: The Fairest Bride
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Then the Prince reached that same corner. To his joy and astonishment, a magnificent coach suddenly came toward him. Six splendid horses drew it. Outriders, coachmen, footmen, and other servants attended it, all dressed in the richest liveries.
        - id: ch05-b02
          speaker: narrator
          text: The most beautiful woman the Prince had ever seen sat inside. He knew her at once. She was beautiful Parsley, the girl he had loved before the witch's curse.
        - id: ch05-b03
          speaker: narrator
          text: The coach stopped beside him. The footmen jumped down and opened the door. The Prince climbed in and took his place beside Parsley.
        - id: ch05-b04
          speaker: prince
          text: Thank you with all my heart for everything you have done. Parsley, I love you dearly.
          emotion: happy
        - id: ch05-b05
          speaker: narrator
          text: Together they traveled to the King's capital. They arrived at the very moment the elder brothers returned with carriage after carriage filled with beautiful women.
        - id: ch05-b06
          speaker: narrator
          text: All the women were brought before the King. The entire court agreed with one voice that fair Parsley was the most beautiful of them all.
        - id: ch05-b07
          speaker: narrator
          text: The old King was delighted. He tenderly embraced his fortunate youngest son and his new daughter-in-law. Then he named them as the heirs who would succeed him on the throne.
        - id: ch05-b08
          speaker: narrator
          text: But just as he had ordered the unwanted linen and little dogs destroyed, the King commanded that the other women be thrown into the water and drowned.
        - id: ch05-b09
          speaker: narrator
          text: The Prince married Puddocky, who was Parsley once more, and they ruled together for a long and happy time.
        - id: ch05-b10
          speaker: narrator
          text: And if they have not died, I suppose they are living still.
