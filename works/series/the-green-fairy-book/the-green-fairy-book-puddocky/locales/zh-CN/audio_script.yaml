audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，像编书人面对孩子娓娓而谈，幽默处轻巧含笑
        timbre: 温暖清朗
        pace: 舒缓而有自然起伏
        pitch: 中音
    witch:
      display_name: 老巫婆
      tts:
        delivery: 冷硬专断，发怒时尖刻而有威势
        timbre: 苍老沙哑
        pace: 适中偏慢
        pitch: 中低音
    king:
      display_name: 老国王
      tts:
        delivery: 年迈庄重，下令时不容置疑
        timbre: 低沉浑厚
        pace: 舒缓
        pitch: 低音
    youngest_prince:
      display_name: 小王子
      tts:
        delivery: 年轻坦率，失意时低落，重燃希望后明快热诚
        timbre: 清亮温和
        pace: 适中
        pitch: 中音
    puddocky:
      display_name: 小癞蛤蟆
      tts:
        delivery: 温柔机敏，帮助王子时笃定而亲切
        timbre: 柔和清脆
        pace: 从容
        pitch: 中高音
  chapters:
    - id: ch01
      title: 欧芹姑娘的诅咒
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，有个穷苦女人，只有一个小女儿。孩子最爱吃欧芹，别的东西几乎一口也不肯吃，人们便叫她“欧芹”。母亲手里没有多少钱，哪能总给她买欧芹呢？可女儿生得实在美丽，只要她想要什么，母亲就狠不下心拒绝。于是每到夜里，这个可怜的女人就偷偷溜进附近老巫婆的菜园，折下大把欧芹带回家，好让女儿吃个够。
        - id: ch01-b02
          speaker: narrator
          text: >-
            欧芹姑娘的怪口味很快传开了，偷菜的秘密也跟着败露。老巫婆把母亲叫来，提议让姑娘住到自己家里。这样一来，欧芹往后想吃多少欧芹，就能吃多少。母亲听了十分满意，美丽的欧芹就这样离开她，搬进了老巫婆家。
        - id: ch01-b03
          speaker: narrator
          text: >-
            一天，国王派三个儿子到远方游历。他们来到欧芹居住的城里，望见美丽的姑娘坐在窗边，正梳理、编结一头乌黑的长发。三位王子只看了一眼，就爱得无可救药，都恨不得马上娶她做妻子。三个人才异口同声地说出心愿，妒火就冒了起来。他们拔出剑，狠狠打成一团，争斗又凶，动静又大，很快便惊动了老巫婆。
        - id: ch01-b04
          speaker: witch
          text: >-
            这还用问？准是欧芹又惹出了乱子！
          emotion: angry
        - id: ch01-b05
          speaker: narrator
          text: >-
            老巫婆出去一看，果真如此。她恨欧芹的美貌总会招来争斗，怒气冲冲地走到姑娘面前。
        - id: ch01-b06
          speaker: witch
          text: >-
            我但愿你马上变成一只丑癞蛤蟆，蹲到世界另一头的桥底下去！
          emotion: angry
        - id: ch01-b07
          speaker: narrator
          text: >-
            她刚说完，欧芹便化成癞蛤蟆，从大家眼前消失了。三位王子没了争夺的对象，马上收起剑，亲热地彼此亲吻，然后一同回父王那里去了。

    - id: ch02
      title: 金戒指与细麻布
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            国王已经年老体弱，很想卸下王冠和权杖，让一个儿子接替自己。可三个儿子当中究竟该选谁，他怎么也拿不定主意。最后，他决定让命运替自己选择，便把三个儿子都叫到身边。
        - id: ch02-b02
          speaker: king
          text: >-
            儿子们，我年纪大了，也不想再治理国家。你们三个，我一样疼爱，可我希望让最聪明、最出色的那一个继承王位。我要交给你们三项任务，谁做得最好，王冠就归谁。先去找一匹一百码长的细麻布，要细得能从我的金戒指里穿过去。
        - id: ch02-b03
          speaker: narrator
          text: >-
            三个儿子深深鞠躬，答应一定尽力，随即出发。两个哥哥带着大队仆人和许多马车，小弟却孤身上路。他们很快来到三岔路口，两条路热闹拥挤，来往的人很多，剩下一条却又暗又冷清。哥哥们各自选了人多的道路，小弟同他们告别，独自踏上那条荒凉的路。
        - id: ch02-b04
          speaker: narrator
          text: >-
            两个哥哥跑遍卖布的地方，把最好的细麻布一捆捆装上车，满载而归。小弟走了许多天，却连一块合用的布也没见到。他越走越灰心，后来来到一座横跨深河的桥。河水穿过低洼的沼泽，他在岸边坐下来，为自己的坏运气长长叹了口气。一只模样难看的癞蛤蟆忽然爬出泥沼，坐在他对面。
        - id: ch02-b05
          speaker: puddocky
          text: >-
            亲爱的王子，是什么事让你这样发愁？
        - id: ch02-b06
          speaker: youngest_prince
          text: >-
            告诉你也没有用，小癞蛤蟆。你知道了，又能怎么帮我呢？
        - id: ch02-b07
          speaker: puddocky
          text: >-
            先别急着这么说。把你的难处讲给我听，看看再说。
        - id: ch02-b08
          speaker: narrator
          text: >-
            王子这才把父王的任务全告诉她。小癞蛤蟆听完，答应一定帮忙，转身爬进泥沼。回来时，她拖着一卷还没手指大的细麻布，放到王子面前。
        - id: ch02-b09
          speaker: puddocky
          text: >-
            带它回家吧。等你到了父王面前，就会知道它有什么用。
        - id: ch02-b10
          speaker: narrator
          text: >-
            王子看不上这么小的布卷，可又不愿伤她的心，只好把布塞进口袋，向她告别。小癞蛤蟆望着他走远，才重新爬进水里。一路上，王子觉得口袋越来越沉，心里反倒越来越轻快。
        - id: ch02-b11
          speaker: narrator
          text: >-
            他带着满心安慰回到宫廷，恰好和哥哥们的长长车队同时到家。国王看见三个儿子平安回来，高兴极了。他立刻从手指上褪下金戒指，当场检验。哥哥们带回的细麻布足有一车又一车，竟没有一匹能把十分之一穿过戒指。他们原本还嘲笑小弟没有行李，这下自己倒难堪起来，再也笑不出来了。
        - id: ch02-b12
          speaker: narrator
          text: >-
            可当小弟从口袋里抽出一整匹布时，哥哥们简直不知道该说什么。那布细得几乎看不见丝线，摸起来无比柔软，颜色又纯净得没有一丝杂质。它轻轻松松就穿过了金戒指，量起来也一分不差，正好一百码。国王高兴地拥抱这个交了好运的儿子，随后命人把其余的布统统扔进水里。

    - id: ch03
      title: 榛子里的小狗
      blocks:
        - id: ch03-b01
          speaker: king
          text: >-
            王子们，该做第二项任务了。给我带一只小狗回来，它得小到能舒舒服服地待在半个核桃壳里。
        - id: ch03-b02
          speaker: narrator
          text: >-
            三兄弟都觉得这件事实在难办。可人人都想赢得王冠，过了几天，他们还是再次出发。到了三岔路口，三人照旧分开。小弟走上那条冷清的老路，这一回却比上次有信心得多。他刚在桥下坐好，叹了一口气，小癞蛤蟆便来到对面。
        - id: ch03-b03
          speaker: puddocky
          text: >-
            亲爱的王子，这回碰上什么难题了？
        - id: ch03-b04
          speaker: narrator
          text: >-
            王子早已相信她的本领，马上把难处说了。小癞蛤蟆答应帮助他，迈开两条短腿，飞快爬进泥沼。不一会儿，她拖回一颗榛子，放在王子脚边。
        - id: ch03-b05
          speaker: puddocky
          text: >-
            把这颗榛子带回去，请你父王小心敲开。打开以后，自然会有答案。
        - id: ch03-b06
          speaker: narrator
          text: >-
            王子热诚地向她道谢，快快乐乐地往家走，小癞蛤蟆则慢慢爬回水中。等他抵达王宫，哥哥们也才刚刚回来。他们带回好几大车小狗，各种各样，什么品种都有。国王早已准备好一个核桃壳，立刻让人一只只试过去。可是哥哥们所有的小狗都试遍了，没有一只能挤进那小小的壳里。
        - id: ch03-b07
          speaker: narrator
          text: >-
            这时，小王子谦逊地鞠了一躬，把榛子递给父亲，请他千万小心地敲开。老国王刚把果壳敲裂，一只可爱得不得了的小狗便从里面蹦了出来。它站在国王的手掌上跑来跑去，一边摇着尾巴，一边冲满屋的小狗响亮地汪汪叫。宫廷里人人又惊又喜，顿时一片欢腾。
        - id: ch03-b08
          speaker: narrator
          text: >-
            国王又抱了抱幸运的小儿子，随后下令把别的小狗都扔进水里淹死。接着，他宣布了最后一项任务。
        - id: ch03-b09
          speaker: king
          text: >-
            最难的两件事已经做完了。现在听好，谁能把最美丽的妻子带回来，谁就继承我的王位。

    - id: ch04
      title: 荒唐车驾与美丽姑娘
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            这项任务听起来轻松愉快，奖赏又大，王子们立刻动身。到了三岔路口，两个哥哥也想过要跟小弟走，可那条路实在荒凉，他们认定野地里绝不会有美丽姑娘，最后还是各走各的老路。
        - id: ch04-b02
          speaker: narrator
          text: >-
            小王子这次却格外沮丧。他心想，换成别的难题，小癞蛤蟆或许能解决，可替他找妻子，实在远远超出了她的本领。那片又宽又空的沼泽里连一个人也没有，只有青蛙、癞蛤蟆和这类小东西，她到哪里去找一位美丽女子呢？尽管这样，他仍旧来到桥下坐好，发自心底地叹了一口气。没过多久，小癞蛤蟆便站在他面前。
        - id: ch04-b03
          speaker: puddocky
          text: >-
            亲爱的王子，这一次又为什么叹气呢？
        - id: ch04-b04
          speaker: youngest_prince
          text: >-
            唉，这回连你也帮不了我。这个任务已经超出你的本领了。
          emotion: sad
        - id: ch04-b05
          speaker: puddocky
          text: >-
            你不妨还是说一说。没准这一次，我也能想出办法。
        - id: ch04-b06
          speaker: narrator
          text: >-
            王子告诉她，父王要他们带一位最美丽的妻子回去。小癞蛤蟆听完，一点也没有为难。
        - id: ch04-b07
          speaker: puddocky
          text: >-
            这件事，我当然帮得上。你只管回家，我很快就来追你。
        - id: ch04-b08
          speaker: narrator
          text: >-
            话一说完，她猛地跃入水里，转眼不见了。她平常总是慢吞吞的，这一跳却敏捷得很。王子站起来，还是愁眉不展。他不相信小癞蛤蟆真能解决这个难题。
        - id: ch04-b09
          speaker: narrator
          text: >-
            王子刚走几步，就听见背后有动静。回头一看，一辆硬纸板马车正朝他驶来，拉车的是六只大老鼠。两只刺猬骑马开道，一只胖耗子坐在车夫座上，两只小青蛙站在车后当仆从。小癞蛤蟆坐在车厢里，经过王子身边时，还从窗口送给他一个飞吻。
        - id: ch04-b10
          speaker: narrator
          text: >-
            王子只顾想着命运的无常。它已经实现了自己的前两个愿望，如今却好像偏要夺走最后一个，而这个愿望又是三个当中最珍贵的。他完全陷在这些念头里，几乎没注意那副荒唐车驾，更谈不上取笑它可笑的样子。
        - id: ch04-b11
          speaker: narrator
          text: >-
            纸马车在前面行驶了一阵，转过拐角。王子随后走过去，竟看见一辆华美的马车迎面而来。六匹骏马拉着车，开道骑手、车夫和随从都穿着无比绚丽的制服。车厢中坐着他生平见过的最美丽的女子。
        - id: ch04-b12
          speaker: narrator
          text: >-
            王子一眼便认出，她正是自己从前深爱过的欧芹姑娘。那份爱曾在他心里燃烧，如今一下子又醒了。马车来到面前停下，仆从赶紧跳下来，为王子打开车门。他坐到美丽的欧芹身旁，诚心诚意地感谢她一次次相助，还把自己有多么爱她，全都说了出来。

    - id: ch05
      title: 三次交上好运
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            他们一同回到父王的都城，恰好和两个哥哥同时抵达。哥哥们带回的美丽女子坐满了许多马车，一队接着一队。等所有人都被领到国王面前，满朝上下一致认定，美貌的桂冠只能属于欧芹，她才是其中最美的一位。
        - id: ch05-b02
          speaker: narrator
          text: >-
            老国王喜不自胜，温柔地拥抱三次交上好运的小儿子，又满怀疼爱地拥抱新儿媳。他当场指定两人继承王位，却命人把别的女子全扔进水里淹死，就和那些细麻布、小狗的下场一样。
        - id: ch05-b03
          speaker: narrator
          text: >-
            王子娶了小癞蛤蟆，同她一起长久而幸福地治理这个国家。他们若是还没有死，我想，直到今天也一定活得好好的。
