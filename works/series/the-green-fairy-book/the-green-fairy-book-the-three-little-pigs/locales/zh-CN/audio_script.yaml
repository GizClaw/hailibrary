audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，像编书人面对孩子娓娓而谈，讽刺处轻巧含笑
        timbre: 温暖清朗
        pace: 舒缓而有自然起伏
        pitch: 中音
    mother_pig:
      display_name: 猪妈妈
      tts:
        delivery: 慈爱稳重，劝诫孩子时忧心而恳切
        timbre: 温厚柔和
        pace: 舒缓
        pitch: 中音
    browny:
      display_name: 小棕
      tts:
        delivery: 憨直贪玩，受惊时慌张急促
        timbre: 粗圆稚嫩
        pace: 适中
        pitch: 中音
    whitey:
      display_name: 小白
      tts:
        delivery: 机灵贪嘴，害怕时带着哭腔
        timbre: 清脆稚嫩
        pace: 偏快
        pitch: 中高音
    blacky:
      display_name: 小黑
      tts:
        delivery: 聪明沉着，语气礼貌而坚定
        timbre: 明亮清润
        pace: 适中
        pitch: 中音
    fox:
      display_name: 狐狸
      tts:
        delivery: 狡猾善变，假意温柔时油滑，发怒时凶狠粗暴
        timbre: 低沉沙哑
        pace: 适中
        pitch: 低音
  chapters:
    - id: ch01
      title: 三只小猪的房子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，一座宽敞舒适的老农庄里，住着猪妈妈和三个孩子。老大叫小棕，老二叫小白，最小也最漂亮的叫小黑。小棕总把自己弄得脏兮兮的，一天到晚只想在泥里打滚。下雨时，院里的泥变得又软又稠，他就格外高兴。他会悄悄溜开，专找泥最深的地方滚来滚去。妈妈三番五次劝他，他却怎么也改不掉这个坏习惯。
        - id: ch01-b02
          speaker: mother_pig
          text: 小棕啊，总有一天，你会后悔没听老妈妈的话。
          emotion: sad
        - id: ch01-b03
          speaker: narrator
          text: >-
            小白颇聪明，就是太贪吃。她整天想着下一顿饭，一见农场姑娘提着食桶穿过院子，便兴奋得用后腿站着又蹦又跳。食物刚倒进槽里，她就把哥哥弟弟挤到一边，专抢最大最好的几块。妈妈常责备她自私，说她这样贪嘴又爱抢，早晚会吃苦头。小黑却既干净又懂事，举止也很讲究，至少对一只小猪来说是这样。他一身皮毛像黑缎子那样光滑发亮，比哥哥姐姐聪明得多。农场主的朋友都说，这只小黑猪将来准能得奖，妈妈听了总是满心骄傲。
        - id: ch01-b04
          speaker: narrator
          text: 后来，猪妈妈年老体弱，知道自己活不了多久了。一天，她把三个孩子叫到身边。
        - id: ch01-b05
          speaker: mother_pig
          text: >-
            孩子们，我越来越老，身子也越来越弱，恐怕陪不了你们多久了。咱们在这间老猪圈里快活地住了许多年，可这里就要让给另一家猪，你们必须搬出去。我想在离开你们以前，给你们每人盖一座房子。小棕，你想要什么样的？
          emotion: sad
        - id: ch01-b06
          speaker: browny
          text: 我要泥巴房子。
        - id: ch01-b07
          speaker: narrator
          text: 小棕眼巴巴地望着院角的湿泥。妈妈听见这个愚蠢的选择，心里很失望，又问小白。
        - id: ch01-b08
          speaker: whitey
          text: 我要卷心菜房子。
        - id: ch01-b09
          speaker: narrator
          text: 小白说话时嘴里塞得满满的，鼻子还埋在食槽里找土豆皮。妈妈愁坏了，只好转向最小的儿子。
        - id: ch01-b10
          speaker: mother_pig
          text: 小黑，你要妈妈替你盖什么房子？
        - id: ch01-b11
          speaker: blacky
          text: 请给我盖砖房吧，妈妈。冬天暖和，夏天凉快，一年到头都很安全。
        - id: ch01-b12
          speaker: mother_pig
          text: >-
            这才是懂事的孩子。我马上叫人把三座房子盖好。还有最后一件事，你们一定要记住。等我死了，咱们的老仇敌狐狸听到消息，准会来捉你们，再把你们拖回他的洞穴。他狡猾极了，一定会乔装打扮，假装是你们的朋友。不管他找什么借口，你们都绝不能让他进屋。
        - id: ch01-b13
          speaker: narrator
          text: >-
            三只小猪早就听过许多狐狸的可怕故事，一想到他便害怕，于是马上答应了妈妈。不久，老猪妈妈去世。那座亲爱的老猪圈有了新的主人，小棕、小白和小黑也离开农庄，各自搬进了为自己盖好的新房子。

    - id: ch02
      title: 泥巴房子
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            小棕喜欢极了软软的泥墙和黏糊糊的土地。没住几天，整个地面就像一大块泥饼，换了别人准会嫌弃，他却正好可以从早到晚在里面翻滚，把自己弄得一塌糊涂。一天，小棕躺在泥里昏昏欲睡，忽然听见有人轻轻敲门。
        - id: ch02-b02
          speaker: fox
          text: 小棕少爷，让我进去瞧瞧你漂亮的新房子，好不好？
        - id: ch02-b03
          speaker: browny
          text: 你是谁？
          emotion: fearful
        - id: ch02-b04
          speaker: narrator
          text: 门外的嗓音虽然温柔，小棕却听出那是装出来的，吓得猛然跳起。
        - id: ch02-b05
          speaker: fox
          text: 我是你的朋友，特地来看你呀。
        - id: ch02-b06
          speaker: browny
          text: >-
            不，不，我才不信！你就是妈妈叫我们提防的坏狐狸。我不会放你进来！
          emotion: fearful
        - id: ch02-b07
          speaker: fox
          text: 嘿，你敢这样回答我？咱们马上瞧瞧，这里到底谁说了算！
          emotion: angry
        - id: ch02-b08
          speaker: narrator
          text: >-
            狐狸露出原本粗暴的嗓音，挥起爪子猛刨松软的泥墙。那样的墙哪经得起他的利爪？没多久，墙上便出现一个大洞。他纵身跳进去，一口咬住小棕的后颈，将他甩到肩上，一溜小跑带回了洞穴。

    - id: ch03
      title: 卷心菜房子
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            第二天，小白正从自家墙角扯下几片卷心菜叶，吃得津津有味。狐狸悄悄走到门前，打算把她也捉回去，让她和哥哥一起关在洞里。他又装出哄骗小棕时的温柔嗓音。
        - id: ch03-b02
          speaker: fox
          text: 我是来看你的朋友。你家的卷心菜真不错，让我拿一点当午饭吧。
        - id: ch03-b03
          speaker: whitey
          text: >-
            求求你，千万别吃！卷心菜就是我家的墙。你吃出一个洞，风雨都会钻进来，我会着凉的。你快走！你不是朋友，你就是那只坏狐狸！
          emotion: fearful
        - id: ch03-b04
          speaker: narrator
          text: >-
            小白一边哀求，一边呜呜哭起来。她这才后悔自己从前那么贪吃，更后悔没用比卷心菜结实些的材料盖房子。可现在后悔已经迟了。狐狸张开大嘴，一口接一口，很快就在墙上吃出一条通道。他钻进屋，捉住又颤又抖的小白，把她也带回洞穴。

    - id: ch04
      title: 结实的砖房
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            又过一天，狐狸来到小黑家。他盘算着把三只小猪全关进洞里，等人齐了便杀掉他们，再请所有朋友来吃一顿大餐。可是小黑的砖房不一样。那扇大门不仅上了锁，还插着门闩和门杠。狐狸闯不进去，只好又耍起花招。
        - id: ch04-b02
          speaker: fox
          text: >-
            亲爱的小黑，开开门吧。我给你带了几枚鸡蛋，是路过农庄时捡到的礼物。
        - id: ch04-b03
          speaker: blacky
          text: >-
            不，狐狸先生，我不会开门。我知道你有多狡猾。你捉走了小棕和小白，可你捉不到我。
        - id: ch04-b04
          speaker: narrator
          text: >-
            狐狸听了暴跳如雷，用尽全身力气一次次撞向墙壁，想把房子撞倒。可砖墙砌得又结实又牢固，连晃也不晃一下。他又用爪子拼命抓挠砖块，墙还是好好的，自己的爪子却伤得不轻。最后，他只能放弃，两只前爪鲜血淋漓，疼得一瘸一拐。
        - id: ch04-b05
          speaker: fox
          text: >-
            没关系！改天我一定会捉住你。等你落进我的洞里，我非把你的骨头磨成粉不可！
          emotion: angry
        - id: ch04-b06
          speaker: narrator
          text: >-
            狐狸龇牙咆哮着走了。第二天，小黑不得不到附近的镇上采买，还买了一口大锅。他把锅斜扛在肩头，正走在回家的路上，忽然听见有人轻手轻脚地跟在后面。小黑吓得心都停跳了一下。幸好，他刚走到山顶，低头已经能看见自己的小砖房安安稳稳地卧在山脚树林里。转眼间，他便想出了办法。
        - id: ch04-b07
          speaker: narrator
          text: >-
            小黑一把揭开锅盖，自己跳进去，缩起四条腿，紧紧贴着锅底。他再用一条前腿拉回盖子，将自己遮得严严实实。随后，他从里面轻轻一蹬，大锅便呼呼旋转着滚下山坡。狐狸赶上山顶时，只看见一口黑锅贴着地面飞奔。他失望地正要回头，却发现大锅一路滚到砖房旁才停住。下一刻，小黑从锅里跃出来，带着锅逃进屋，插紧门闩和门杠，还把窗板也关严了。
        - id: ch04-b08
          speaker: fox
          text: 嘿，你以为这样就能逃掉吗？我的朋友，咱们走着瞧！
        - id: ch04-b09
          speaker: narrator
          text: >-
            狐狸没有马上扑向大门。他放轻脚步，悄无声息地绕着砖房转来转去，四处寻找能爬上屋顶的地方。他已经打定主意，要从上面闯进屋里。

    - id: ch05
      title: 狐狸落进大锅
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            屋里，小黑往大锅中装满水，架到火上，自己安静地坐在一旁等着。水快开时，大锅开始呜呜歌唱，锅口也一股股冒出蒸汽。就在这时，头顶传来压得低低的脚步声，啪嗒，啪嗒，啪嗒。声音从屋顶一直来到烟囱边。紧接着，狐狸的脑袋和两只前爪从烟囱里伸了下来。
        - id: ch05-b02
          speaker: narrator
          text: >-
            聪明的小黑早就把锅盖放到一边。狐狸惨叫着掉进滚水，还没来得及逃，小黑便扣上锅盖，把他活活烫死了。
        - id: ch05-b03
          speaker: narrator
          text: >-
            小黑仔细确认狐狸真的死了，这个坏透了的仇敌再也不能伤害他们，便马上去救哥哥姐姐。来到狐狸洞附近，他远远听见小棕和小白凄惨的哼叫和尖叫。他们被绳子绑着，拴在地上的一根木桩上，一直害怕狐狸会杀掉自己、把自己吃了。一看见弟弟出现在洞口，两只小猪简直欢喜得不知如何是好。
        - id: ch05-b04
          speaker: narrator
          text: >-
            小黑赶紧在附近找来一块锋利的石头，把绑住哥哥姐姐的绳子一一割断。三只小猪一刻也不停留，一同离开狐狸洞，回到安全的砖房。从此，他们幸福地住在一起。小棕彻底改掉了在泥里打滚的习惯，小白也不再贪吃。他们永远没有忘记，这两个坏毛病曾险些让自己过早送命。
