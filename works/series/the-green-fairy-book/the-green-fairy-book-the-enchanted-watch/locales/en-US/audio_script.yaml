  chapters:
    - id: ch01
      title: Three Brothers Set Out
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a rich man with three sons. When the eldest was grown, his father sent him out to travel and see the world. Three years went by before the family saw him again. Then he came home in magnificent clothes. His father was so pleased with his behavior that he gave a great feast for him and invited every friend and relation.
        - id: ch01-b02
          speaker: narrator
          text: When the celebrations ended, the second son asked if he might travel next. His father was delighted. He gave the young man plenty of money for the journey and told him what he expected.
        - id: ch01-b03
          speaker: father
          text: Behave as well as your brother did, and I will honor you with a feast just as I honored him.
        - id: ch01-b04
          speaker: narrator
          text: The second son promised to do his best. For three years, he behaved exactly as he should. When he returned, his father welcomed him with a feast even grander than the first.
        - id: ch01-b05
          speaker: narrator
          text: The youngest brother was called Jenik, or Johnnie. Everyone thought he was the greatest fool of the three. At home he did nothing but sit by the stove and cover himself in ashes. Still, he too asked to travel for three years. His father answered him sharply.
        - id: ch01-b06
          speaker: father
          text: Go if you want to, you idiot. But what good can traveling possibly do you?
        - id: ch01-b07
          speaker: narrator
          text: Jenik did not mind those words. He had the permission he wanted. His father gladly watched him leave, happy to be rid of him, though he did give Jenik a handsome sum for the journey.
        - id: ch01-b08
          speaker: narrator
          text: During his travels, Jenik crossed a meadow where some shepherds were about to kill a dog. He begged them to spare it and give it to him instead. They agreed, and the dog followed Jenik down the road. A little farther on, he found someone preparing to kill a cat. Jenik pleaded for that creature too, and the cat joined them. Later he saved a serpent in the same way. Now four travelers went along together, with the dog behind Jenik, the cat behind the dog, and the serpent behind the cat.
        - id: ch01-b09
          speaker: serpent
          text: Follow wherever I lead you.
        - id: ch01-b10
          speaker: narrator
          text: Autumn had come, and all the other serpents were already hidden in their holes. This one was late because he had been searching for his king, the ruler of every snake. He explained what would happen when they arrived.
        - id: ch01-b11
          speaker: serpent
          text: My king will scold me for staying away so long. Everyone else is safely housed for winter. I will tell him about the danger I was in, and how I would have died without you. He will ask what reward you want. Be sure to ask for the watch hanging on the wall. It can do wonderful things. Rub it, and you can have whatever you wish for.
        - id: ch01-b12
          speaker: narrator
          text: Everything happened just as the serpent had said, and Jenik became the owner of the watch.
    - id: ch02
      title: The Watch Proves Its Power
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The moment Jenik came outside, he wanted to test his new treasure. He was hungry. A loaf of fresh bread, a fine beefsteak, and a flask of wine would make a delightful meal there in the meadow. He scratched the watch, and in an instant the whole meal stood before him. How happy he was!
        - id: ch02-b02
          speaker: narrator
          text: Evening soon fell. Jenik rubbed the watch again and wished for a room, a comfortable bed, and a good supper. At once, there they were. He ate, went to bed, and slept until morning, as every honest man ought to do.
        - id: ch02-b03
          speaker: narrator
          text: Then he started home, thinking of the feast that must be waiting for him. But he returned in the same old clothes he had worn when he left. His father flew into a rage and refused to give him anything. So Jenik went back to his old place beside the stove and sat in the ashes. No one paid him any attention.
        - id: ch02-b04
          speaker: narrator
          text: By the third day, Jenik was feeling dull. He imagined a three-story house with beautiful furniture and vessels of silver and gold. One rub of the watch made it all appear. Then he went to find his father.
        - id: ch02-b05
          speaker: jenik
          text: You gave me no welcome feast. Let me give one for you instead. Come and see my fine dishes and silverware.
        - id: ch02-b06
          speaker: narrator
          text: His father was astonished and longed to know where all that wealth had come from. Jenik gave no answer. He only asked his father to invite all their friends and relations to a grand banquet.
        - id: ch02-b07
          speaker: narrator
          text: His father invited everyone. The guests marveled at the splendid house, the gleaming plate, and the many fine dishes spread across the table. After the first course, Jenik asked his father to invite the King and the King's daughter, the Princess.
        - id: ch02-b08
          speaker: narrator
          text: Jenik rubbed the watch and wished for a carriage decorated with gold and silver. Six horses drew it, and precious stones glittered all over their harness. The carriage was so gorgeous that his father was afraid to sit inside. He walked to the palace instead.
        - id: ch02-b09
          speaker: narrator
          text: The King and the Princess were amazed by the carriage. They climbed in at once and set off for Jenik's banquet. Jenik rubbed his watch once more. This time he wished for six miles of marble road leading to the house. The King had never traveled over anything so magnificent.
    - id: ch03
      title: The Princess and the Palace at Sea
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: When Jenik heard the carriage wheels, he rubbed the watch again. He wished for an even finer house, four stories tall, draped in gold, silver, and damask. Inside were marvelous tables covered with dishes finer than any king had tasted.
        - id: ch03-b02
          speaker: narrator
          text: The King, the Queen, and the Princess could not speak for wonder. They had never seen such a splendid palace or such a grand feast. When dessert was served, the King asked Jenik's father to let the young man become his son-in-law. It was settled immediately. Jenik and the Princess were married at once. Then the King returned to his own palace, leaving the couple in the enchanted house.
        - id: ch03-b03
          speaker: narrator
          text: Jenik was not very clever, and before long his wife grew bored with him. She kept asking how he built palaces and found so many precious things. At last he told her everything about the watch. From that moment, she would not rest until she had stolen it.
        - id: ch03-b04
          speaker: narrator
          text: One night, the Princess took the watch and rubbed it. She wished for a carriage drawn by four horses, climbed in, and rode straight to her father's palace. There she summoned her own attendants and ordered them into the carriage. Together they drove to the seashore.
        - id: ch03-b05
          speaker: narrator
          text: The Princess rubbed the watch once more. She wished for a bridge across the sea and a magnificent palace in the middle of the water. Both appeared at once. She crossed the bridge and entered the palace. Then she rubbed the watch again, and the bridge vanished.
        - id: ch03-b06
          speaker: narrator
          text: Jenik was left alone and miserable. His father, mother, brothers, and everyone else laughed at him. Only the cat and dog whose lives he had saved remained. He took them with him and went far away, because he could no longer bear to live with his family.
    - id: ch04
      title: Across the Sea
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: At last, Jenik reached a great desert. He saw a flock of crows flying toward a mountain. One crow lagged far behind. When he finally caught up, his brothers wanted to know why he was so late.
        - id: ch04-b02
          speakers: [first_crow, second_crow]
          ensemble: duo
          text: Winter has come. It is time for us to fly to other countries. What kept you so long?
        - id: ch04-b03
          speaker: narrator
          text: The late crow told them he had seen the most wonderful house in the world, standing in the middle of the sea. Jenik immediately knew that this must be where his wife was hiding. He went straight to the shore with the dog and the cat.
        - id: ch04-b04
          speaker: jenik
          text: Dog, you are a fine swimmer. Little Cat, you are very light. Climb onto the dog's back, and let him carry you to the palace. Dog, hide near the door when you arrive. Cat, slip inside without being seen and try to recover my watch.
        - id: ch04-b05
          speaker: narrator
          text: The two animals crossed the sea. The dog hid close to the house, while the cat crept into the Princess's chamber. She recognized him and guessed why he had come. She carried the watch down to the cellar and locked it inside a box.
        - id: ch04-b06
          speaker: narrator
          text: But the cat wriggled into the cellar. As soon as the Princess turned away, he scratched at the box until he made a hole. He gripped the watch between his teeth and waited quietly for her return. The moment she opened the door, the cat darted out, taking the watch with him.
        - id: ch04-b07
          speaker: narrator
          text: Once the cat was safely beyond the palace gates, he warned the dog.
        - id: ch04-b08
          speaker: cat
          text: We have to cross the sea now. Be careful, and do not speak to me.
        - id: ch04-b09
          speaker: narrator
          text: The dog took the warning seriously and stayed silent. But as they neared the shore, he could not hold back any longer.
        - id: ch04-b10
          speaker: dog
          text: Did you get the watch?
        - id: ch04-b11
          speaker: narrator
          text: The cat made no reply. He was afraid he might drop the precious watch. When they reached the shore, the dog asked once more.
        - id: ch04-b12
          speaker: dog
          text: Do you have it?
        - id: ch04-b13
          speaker: cat
          text: Yes, I do.
        - id: ch04-b14
          speaker: narrator
          text: As the cat spoke, the watch fell from his mouth and dropped into the sea.
    - id: ch05
      title: The Watch Comes Home
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The dog and cat blamed each other. Then they both stared sadly at the place where their treasure had disappeared. Just then, a fish swam close to the water's edge. The cat caught it and thought the fish would make them a good supper.
        - id: ch05-b02
          speaker: fish
          text: I have nine little children! Please spare their father!
          emotion: fearful
        - id: ch05-b03
          speaker: cat
          text: I will let you go, but only if you find our watch.
        - id: ch05-b04
          speaker: narrator
          text: The fish did as the cat asked, and the two friends carried the recovered treasure back to their master.
        - id: ch05-b05
          speaker: narrator
          text: Jenik rubbed the watch and wished for the palace, the Princess, and everyone inside it to be swallowed by the sea. At once, they all disappeared beneath the water.
        - id: ch05-b06
          speaker: narrator
          text: Jenik returned to his parents. He lived happily to the end of his days with his watch, his cat, and his dog.
