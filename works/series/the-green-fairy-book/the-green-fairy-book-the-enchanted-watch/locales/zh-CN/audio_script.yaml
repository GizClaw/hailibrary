audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，像编书人面对孩子娓娓而谈
        timbre: 温暖清朗
        pace: 舒缓而有自然起伏
        pitch: 中音
    father:
      display_name: 父亲
      tts:
        delivery: 势利严厉，得意时显得热情夸张
        timbre: 浑厚偏硬
        pace: 适中
        pitch: 中低音
    jenik:
      display_name: 耶尼克
      tts:
        delivery: 朴实直率，心地善良，说话不多却很坦然
        timbre: 清朗温和
        pace: 稍慢
        pitch: 中音
    serpent:
      display_name: 蛇
      tts:
        delivery: 知恩而机敏，叮嘱事情时认真周密
        timbre: 轻柔细亮
        pace: 适中
        pitch: 中高音
    king:
      display_name: 国王
      tts:
        delivery: 身份尊贵，见到奇景时坦率而果断
        timbre: 洪亮饱满
        pace: 适中
        pitch: 中低音
    princess:
      display_name: 公主
      tts:
        delivery: 娇贵精明，探听秘密时柔和，得手后冷静坚决
        timbre: 明亮柔润
        pace: 适中
        pitch: 中高音
    crow_1:
      display_name: 乌鸦甲
      tts:
        delivery: 匆忙爽利，带着启程前的催促
        timbre: 粗哑清晰
        pace: 稍快
        pitch: 中音
    crow_2:
      display_name: 乌鸦乙
      tts:
        delivery: 匆忙爽利，带着启程前的催促
        timbre: 粗哑清晰
        pace: 稍快
        pitch: 中音
    dog:
      display_name: 狗
      tts:
        delivery: 忠厚热心，心急时藏不住话
        timbre: 温厚结实
        pace: 适中
        pitch: 中低音
    cat:
      display_name: 猫
      tts:
        delivery: 机警利落，行动果断，说话简短
        timbre: 轻巧清晰
        pace: 稍快
        pitch: 中高音
    fish:
      display_name: 鱼
      tts:
        delivery: 遇险时急切哀求，答应报恩后诚恳
        timbre: 细润清亮
        pace: 稍快
        pitch: 高音
  chapters:
    - id: ch01
      title: 三兄弟出门游历
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前有个富人，养着三个儿子。孩子们长大后，他先让老大出门见世面。三年过去，老大才回到家。他穿得华贵，举止也很得体，父亲看了非常满意，便请来所有亲朋好友，为他摆了一场盛大的接风宴。
        - id: ch01-b02
          speaker: narrator
          text: >-
            宴席结束，老二也请求出去闯荡。父亲听了十分高兴，给足了盘缠，还对他说：
        - id: ch01-b03
          speaker: father
          text: >-
            只要你像哥哥那样争气，等你回来，我也照样风风光光地替你庆贺。
        - id: ch01-b04
          speaker: narrator
          text: >-
            老二答应尽力而为。这三年里，他果然处处表现得无可挑剔。回家以后，父亲给他办的接风宴，比哥哥那一场还要气派。
        - id: ch01-b05
          speaker: narrator
          text: >-
            三弟叫耶尼克，小名约翰尼。大家都觉得他是兄弟中最笨的一个。他整天坐在炉边，什么也不做，只把身上蹭得满是炉灰。可这一天，他也来请求父亲，让自己出门游历三年。
        - id: ch01-b06
          speaker: father
          text: >-
            你想去就去吧，傻瓜！不过，就凭你，出去又能有什么出息？
        - id: ch01-b07
          speaker: narrator
          text: >-
            耶尼克并不在意这些话，能得到许可就够了。父亲巴不得摆脱他，欢欢喜喜地看他离开，还给了他一大笔盘缠。
        - id: ch01-b08
          speaker: narrator
          text: >-
            一次，耶尼克走过一片草地，碰见几个牧人正要杀一条狗。他连忙替狗求情，请牧人把狗送给自己。牧人答应了，狗便跟着他上路。没走多远，他又遇见一只正要被人弄死的猫，也替它求了情。后来，他还从别人手里救下一条蛇。于是，四个伙伴排成一队：耶尼克在前，后面依次跟着狗、猫和蛇。
        - id: ch01-b09
          speaker: serpent
          text: >-
            接下来，你看见我往哪里去，就跟着我往哪里走。
        - id: ch01-b10
          speaker: narrator
          text: >-
            秋天到了，群蛇都钻进洞里过冬。这条蛇也要去见统领天下群蛇的王。它接着向耶尼克仔细交代：
        - id: ch01-b11
          speaker: serpent
          text: >-
            我回来得这么迟，大王一定会责备我。别的蛇早就安顿好了，只有我落在后面。我会告诉他，我遇到了什么危险，也会告诉他，要不是你相救，我早已没命。大王会问你想要什么报答。你一定要那只挂在墙上的怀表。只要把它擦一擦，你想要什么，就能得到什么。
    - id: ch02
      title: 怀表显出魔力
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            果然，耶尼克成了怀表的主人。他刚从蛇王那里出来，就想试试这件宝物。肚子饿了，他便想着，要是能坐在草地上，吃新烤的面包和上好的牛排，再喝一瓶葡萄酒，那该多美。他挠挠怀表，所有东西顿时出现在眼前。你说，他能不欢喜吗？
        - id: ch02-b02
          speaker: narrator
          text: >-
            天黑以后，他又擦了擦怀表，想要一间屋子、一张舒服的床和一顿可口的晚餐。转眼间，样样都有了。耶尼克吃饱睡下，像每个正派人都该做的那样，一觉安睡到天亮。随后，他动身回家，一路都在想，父亲会用怎样的宴席迎接自己。
        - id: ch02-b03
          speaker: narrator
          text: >-
            可他身上还穿着离家时的旧衣服。父亲一见就大发雷霆，什么也不肯替他办。耶尼克只好坐回炉边，像从前一样蹭得满身炉灰，谁也不理他。
        - id: ch02-b04
          speaker: narrator
          text: >-
            第三天，耶尼克觉得很无聊，心想，要是眼前有一幢三层大宅，里面摆满漂亮家具和金银器皿，一定很有趣。他一擦怀表，那幢宅子便出现了。他找到父亲说：
        - id: ch02-b05
          speaker: jenik
          text: >-
            您没为我办接风宴，那就让我设宴请您吧。来看看我那些金银餐具。
        - id: ch02-b06
          speaker: narrator
          text: >-
            父亲吃惊极了，一心想问清儿子从哪里弄来了这许多财富。耶尼克一个字也没有解释，只请他邀来全部亲友，办一场盛宴。宴席一开，客人们看着华美的陈设、成堆的金银器皿和满桌好菜，个个惊叹不已。
        - id: ch02-b07
          speaker: narrator
          text: >-
            第一道菜吃完，耶尼克又让父亲去请国王和公主。他用怀表变出一辆金银装饰的马车，由六匹骏马拉着，马具上镶满宝石。父亲连坐都不敢坐，竟步行去了王宫。国王和公主看见这么美的车，立刻坐上去赴宴。
        - id: ch02-b08
          speaker: narrator
          text: >-
            耶尼克再擦一下怀表，从王宫到家门前，六英里道路全铺上了大理石。国王从没走过这样华丽的路，惊奇得不得了。
        - id: ch02-b09
          speaker: narrator
          text: >-
            车轮声越来越近。耶尼克又变出一幢更漂亮的四层宅邸，墙上挂着金银饰物和锦缎，屋里的宴席桌上，摆着连国王也没尝过的佳肴。国王、王后和公主看着这座辉煌的宫殿，望着这场盛宴，已经惊讶得说不出话了。
        - id: ch02-b10
          speaker: narrator
          text: >-
            吃甜点时，国王当场请求耶尼克的父亲，让年轻人做自己的女婿。
        - id: ch02-b11
          speaker: king
          text: >-
            请把你的儿子交给我吧，我愿意让他迎娶公主。
        - id: ch02-b12
          speaker: narrator
          text: >-
            婚事立刻定下，婚礼也马上举行了。国王回到自己的宫殿，只留下耶尼克和新婚妻子住在这座魔法宅邸里。
    - id: ch03
      title: 公主偷走怀表
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            耶尼克实在不算聪明。才过了很短一段日子，妻子就嫌他乏味。她不断追问，那些宫殿和珍宝到底是怎样来的。耶尼克终于把怀表的秘密全告诉了她。从此，公主再也没有安分过，一心只想把宝物偷到手。
        - id: ch03-b02
          speaker: narrator
          text: >-
            一天夜里，她终于偷走怀表。她把表擦了擦，变出一辆四匹马拉的马车，立刻坐车赶回父王的宫殿。到了那里，她召来自己的侍从，让他们全都跟着上车，一行人又直奔海边。
        - id: ch03-b03
          speaker: narrator
          text: >-
            到了那里，公主用怀表在海上变出一座桥，又在大海中央变出一座壮丽的宫殿。她带人进了宫殿，再把怀表一擦，身后的桥立刻消失。
        - id: ch03-b04
          speaker: narrator
          text: >-
            耶尼克孤零零地留在原地，心里难过极了。父母、两个哥哥，还有周围所有人，都在嘲笑他。如今陪着他的，只有从前救下的猫和狗。他无法再跟家人一起生活，便带着两个伙伴远走他乡。
        - id: ch03-b05
          speaker: narrator
          text: >-
            他们来到一片大荒漠，看见几只乌鸦正朝山里飞。其中一只落在很远的后面，等它赶上，兄弟们便问它为什么迟到。
        - id: ch03-b06
          speakers: [crow_1, crow_2]
          ensemble: duo
          text: >-
            冬天都来了，我们该飞到别的地方去了！你怎么现在才到？
        - id: ch03-b07
          speaker: narrator
          text: >-
            迟到的乌鸦说，它在海中央看到了一座世上最奇妙的宫殿。耶尼克马上猜到，妻子就藏在那里。他立刻带着猫和狗赶到海边，又分别叮嘱它们：
        - id: ch03-b08
          speaker: jenik
          text: >-
            狗，你水性最好。猫，你身子很轻，就趴在狗背上，让它驮你去海中的宫殿。上岸后，狗藏在门边，猫悄悄进去，想办法把我的怀表拿回来。
    - id: ch04
      title: 猫和狗夺回宝物
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            两个伙伴马上出发。狗驮着猫游过大海，到了宫殿边，狗躲起来，猫则溜进公主的房间。公主认出它，也猜到了来意，赶紧把怀表拿到地窖，锁在箱子里。
        - id: ch04-b02
          speaker: narrator
          text: >-
            猫扭动身子，也钻进了地窖。公主刚一转身，它便对着箱子抓呀，挠呀，一刻不停，终于挖出一个洞。它用牙衔住怀表，安安静静地等公主回来。地窖门才打开一条缝，猫已经蹿了出去，也把怀表带出了宫殿。
        - id: ch04-b03
          speaker: narrator
          text: >-
            一出大门，猫就认真叮嘱狗：
        - id: ch04-b04
          speaker: cat
          text: >-
            回去要渡过大海。这一路千万别跟我说话。
        - id: ch04-b05
          speaker: narrator
          text: >-
            狗牢牢记着，一路没有开口。可眼看就要到岸边，它实在忍不住了。
        - id: ch04-b06
          speaker: dog
          text: >-
            怀表真的拿到了吗？
        - id: ch04-b07
          speaker: narrator
          text: >-
            猫怕一张嘴就掉了宝物，没有回答。等它们终于踏上岸，狗又问了一遍。
        - id: ch04-b08
          speaker: dog
          text: >-
            现在总能告诉我了吧，怀表在你嘴里吗？
        - id: ch04-b09
          speaker: cat
          text: >-
            拿到了。
        - id: ch04-b10
          speaker: narrator
          text: >-
            这一开口，怀表竟掉进海里。两个朋友先是互相埋怨，接着一起望着宝物沉下去的地方，伤心得不知怎么办。忽然，一条鱼游到海边。猫一把按住它，心想，正好拿来做晚饭。
        - id: ch04-b11
          speaker: fish
          text: >-
            我还有九个年幼的孩子！请别杀我，饶过我这个一家之父吧！
          emotion: fearful
        - id: ch04-b12
          speaker: cat
          text: >-
            好，我放你走。不过，你得替我们找回掉进海里的怀表。
    - id: ch05
      title: 耶尼克回到家中
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            鱼接受了这个条件，马上去完成交给它的任务。过了一会儿，它果然找回沉入海中的怀表，交给猫和狗。两个伙伴终于把失而复得的宝物带回主人身边。
        - id: ch05-b02
          speaker: narrator
          text: >-
            耶尼克拿起怀表擦了擦。他希望海中央那座宫殿，连同公主和里面所有的人，一起被大海吞没。话才说完，一切都照他的愿望发生了。
        - id: ch05-b03
          speaker: narrator
          text: >-
            耶尼克回到了父母身边。从此以后，他和魔法怀表，还有那只猫、那条狗，快快乐乐地生活在一起，直到生命的最后一天。
