audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，像编书人面对孩子娓娓而谈
        timbre: 温暖清朗
        pace: 舒缓而有自然起伏
        pitch: 中音
    fairy_of_the_meadows:
      display_name: 草甸仙女
      tts:
        delivery: 温柔从容，话语中带着不容违背的分量
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中高音
    jocosa:
      display_name: 若科萨
      tts:
        delivery: 真挚明快，少女般自然亲切
        timbre: 清亮柔美
        pace: 适中
        pitch: 中高音
    badi_al_zaman:
      display_name: 巴迪·扎曼
      tts:
        delivery: 倨傲急躁，惯于发号施令
        timbre: 饱满锐利
        pace: 稍快
        pitch: 中低音
  chapters:
    - id: ch01
      title: 草甸仙女的心爱之泉
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，同一个村庄里住着两个孩子。男孩叫西尔万，女孩叫若科萨。他们都生得漂亮，也都聪慧过人。可两家的父母彼此不和，起因是多年前的一场争执。时间太久，他们早忘了当初为什么吵架，只因结仇成了习惯，才一直不肯和好。
        - id: ch01-b02
          speaker: narrator
          text: >-
            西尔万和若科萨可不愿跟着大人敌视对方。他们一分开就闷闷不乐，每天都要一起去放羊。晴朗的日子那么长，两人就在阳光下玩耍，或躺到浓荫覆盖的坡岸上休息。
        - id: ch01-b03
          speaker: narrator
          text: >-
            一天，草甸仙女从这里经过。她喜欢这两个孩子秀美的模样，也喜欢他们温柔的举止，便把两人置于自己的庇护下。孩子们越长大，她越疼爱他们。起初，仙女只在他们常去的地方悄悄留下小礼物，尽挑两人想送给彼此的东西。
        - id: ch01-b04
          speaker: narrator
          text: >-
            西尔万和若科萨实在太爱对方，心里第一个念头总是，若科萨会喜欢什么，或是什么能让西尔万高兴。仙女几乎每天都送来糕饼糖果。看着他们天真快活地分享，她也觉得十分快乐。
        - id: ch01-b05
          speaker: narrator
          text: >-
            等两人长大成人，仙女决定现身相见。一个炎热的正午，西尔万和若科萨正在繁花盛开的树篱下乘凉。眼前忽然出现一位高挑纤细的夫人，一身绿衣，头上还戴着鲜花编成的花冠，把他们吓了一跳。
        - id: ch01-b06
          speaker: narrator
          text: >-
            仙女柔声告诉他们，自己一直疼爱着他们。从前那些意外找到的好东西，也都是她送来的。两人满怀感激地道了谢，又高高兴兴回答她提出的问题。临别时，仙女叮嘱他们，绝不能告诉别人曾经见过她。
        - id: ch01-b07
          speaker: fairy_of_the_meadows
          text: >-
            以后，你们还会常常见到我。就算看不见，我也会时常陪在你们身边。
        - id: ch01-b08
          speaker: narrator
          text: >-
            话一说完，仙女便消失了。两人又惊又喜，久久不能平静。从此，她常来教他们各种知识，还领他们看自己那座美丽王国里的许多奇观。
        - id: ch01-b09
          speaker: narrator
          text: >-
            终于有一天，仙女说，一向都是她在善待两人，如今也该由他们为她做一件事了。她问，他们是否还记得那眼被她称为心爱之泉的泉水。两人当然记得。
        - id: ch01-b10
          speaker: fairy_of_the_meadows
          text: >-
            答应我，每天太阳升起以前，都到泉边去。把挡住水流的石子一颗颗清走，把弄脏泉水的枯叶断枝也一一捡净。只要你们不忘记，也不耽搁，我就知道你们怀着感恩的心。只要清晨第一道阳光照来时，它仍是我全部草甸中最清澈、最甘美的一眼泉，你们两人便永远不会分离。
    - id: ch02
      title: 河流隔开的三年
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            西尔万和若科萨欣然接下这份差事。比起仙女已经赐予和答应赐予的一切，这点小事根本算不得什么。此后很长一段日子，他们把泉水照料得一丝不苟。那成了方圆一带最清澈、最美丽的泉眼。
        - id: ch02-b02
          speaker: narrator
          text: >-
            可在一个春日的早晨，天还远没亮，两人从相反的方向赶往泉边。四下里开满鲜花，数也数不清。他们抵挡不住诱惑，都停下脚步，想为对方采些花。
        - id: ch02-b03
          speaker: jocosa
          text: >-
            我要给西尔万编一顶花环。
        - id: ch02-b04
          speaker: narrator
          text: >-
            西尔万也在心里想着，若科萨戴上这顶花冠，该有多好看啊！两人东走走，西看看，越走越远，因为最鲜艳的花朵仿佛总开在再往前一点的地方。
        - id: ch02-b05
          speaker: narrator
          text: >-
            直到朝阳射出第一道亮光，他们才猛然惊醒，同时转身向泉水跑去。两人从两边赶来，恰好一同抵达。可那眼一向平静的泉水竟在翻滚沸腾。就在他们低头察看时，一股巨流奔涌而过，彻底吞没了泉眼。一条宽阔湍急的河，就这样把两人隔开了。
        - id: ch02-b06
          speaker: narrator
          text: >-
            一切来得太快。他们只来得及惊叫一声，各自举起为对方采来的鲜花。不过，这已经足以说明缘由。西尔万接连二十次扑进汹涌的河水，想游到对岸。可每一次，都有一股无法抗拒的力量，把他推回刚刚离开的岸边。
        - id: ch02-b07
          speaker: narrator
          text: >-
            若科萨看见一棵连根拔起的大树顺流漂来，甚至想踩着它渡河，同样没有成功。两人只得怀着沉重的心，沿河向前走。河面越来越宽，他们已经很难看清对方的身影。
        - id: ch02-b08
          speaker: narrator
          text: >-
            他们日夜不停地走，翻过高山，穿过峡谷。无论严寒酷暑，两人都挣扎着前行，忍受疲惫、饥饿和种种苦难。唯一能安慰他们的，就是终有一天还会重逢。整整三年过去，他们终于来到高高的峭壁上。脚下的大河，正从那里汇入浩瀚的大海。
        - id: ch02-b09
          speaker: narrator
          text: >-
            如今，两人仿佛隔得比任何时候都远。他们彻底绝望了，又一次想投身白浪翻腾的大海。其实，草甸仙女从未停止守护他们。她可不打算让两人到头来葬身水中，于是连忙挥动魔杖。
        - id: ch02-b10
          speaker: narrator
          text: >-
            转眼间，西尔万和若科萨已经肩并肩站在金色的沙滩上。漫长而疲惫的跋涉终于结束，两人又握住了彼此的手，那份欢喜和满足可想而知。他们有满腹的话要说，一时反倒不知从哪一句开始。
        - id: ch02-b11
          speaker: narrator
          text: >-
            不过，两人都痛切地责怪自己。他们明白，全部苦难正是那一次疏忽惹来的。仙女听见这番话，立即出现在面前。他们扑倒在她脚边，请求宽恕。仙女爽快地原谅了他们，又答应既然惩罚已经结束，往后会永远做他们的朋友。
        - id: ch02-b12
          speaker: narrator
          text: >-
            随后，仙女命人牵来自己那辆绿色灯心草编成的马车。车上缀着五月清晨的露珠。她格外珍爱这些露珠，每一滴都精心收集。六只短尾鼹鼠拉起马车，飞快地把他们送回熟悉的牧场。
        - id: ch02-b13
          speaker: narrator
          text: >-
            漂泊了这么久，西尔万和若科萨一看见深爱的家园，简直欣喜若狂。原来，仙女一心要让他们幸福。两人离开以后，她已经化解了双方父母的争执，还说服他们同意这对忠贞的恋人结婚。
        - id: ch02-b14
          speaker: narrator
          text: >-
            仙女带他们来到泉边一座无比精致的小屋。泉水恢复了从前的宁静，轻轻流入一道小溪。小溪绕过属于屋子的花园、果园和牧场。不管是为了这对恋人，还是为了他们的羊群，都再也想不出还缺什么。两人的欢喜，甚至让安排这一切的仙女也心满意足。
        - id: ch02-b15
          speaker: narrator
          text: >-
            他们四处探看，赞叹不已，直到累了，才坐在爬满玫瑰的门廊下休息。仙女邀请的婚礼宾客还没有赶到。为了打发这段时间，她说要讲一个故事。故事的名字叫《黄鸟》。
    - id: ch03
      title: 黄鸟的头与心
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            从前，有位仙女不知怎么惹了祸。仙国最高法庭罚她化身为某种生灵，照那副模样生活好几年。等她恢复本来面貌时，还必须让两个男子交上好运。法庭准她自己挑选要变成什么。她喜欢黄色，于是化成了一只美丽的鸟。那灿烂的金色羽毛，世上从没人见过。
        - id: ch03-b02
          speaker: narrator
          text: >-
            刑期一满，黄鸟便飞到巴格达。她特意选在巴迪·扎曼走出豪华夏宫散步时，让一个捕鸟人捉住。巴迪·扎曼这个名字，意思是“举世奇观”。因为他家财万贯，巴格达人人都把他当成天底下最幸运的人。
        - id: ch03-b03
          speaker: narrator
          text: >-
            其实，他既要为财富忧心，又早已厌倦了一切，还总想得到手中没有的东西，一生从不曾有过片刻真正的快乐。这一天，他离开那座足够五十位国王居住的华丽宫殿，心情照旧烦闷又暴躁。因为他怎么也找不到一件新鲜玩意儿供自己消遣。
        - id: ch03-b04
          speaker: narrator
          text: >-
            捕鸟人觉得机会难得，便把奇异的鸟献了上去。他料定巴迪·扎曼一看就会买下，果然没有猜错。巴迪·扎曼把漂亮的俘虏接到手里，看见右翅下写着，谁吃下我的头，谁就会成为国王。左翅下则写着，谁吃下我的心，每天早晨都会在枕头下找到一百枚金币。
        - id: ch03-b05
          speaker: narrator
          text: >-
            巴迪·扎曼明明已经富得惊人，一看见这番许诺，却立刻想要那些金币。生意很快谈成，可怎样烹调黄鸟又成了难题。他养着一大群仆人，偏偏没有一个值得信任。最后，他问捕鸟人娶妻没有。听说对方有妻子，便命他把鸟带回家，交给妻子烹制。
        - id: ch03-b06
          speaker: badi_al_zaman
          text: >-
            说不定这道菜能让我恢复胃口。我已经好多年不想吃东西了。要是真能如此，我就赏你妻子一百枚银币。
        - id: ch03-b07
          speaker: narrator
          text: >-
            捕鸟人大喜过望，赶紧跑回家。妻子很快把黄鸟炖成一锅香喷喷的菜。巴迪·扎曼来到小屋，迫不及待地在盘中寻找鸟头和鸟心，却一样也没有找到。他顿时暴跳如雷，转身逼问捕鸟人的妻子。
        - id: ch03-b08
          speaker: narrator
          text: >-
            女人吓得跪倒在地。她承认，就在客人到来以前，两个孩子刚巧回家。他们缠着母亲，非要尝尝锅里的菜。她实在拗不过，便把鸟头给了一个，把鸟心给了另一个。反正这两样东西，平常也没什么人看得上。
        - id: ch03-b09
          speaker: narrator
          text: >-
            巴迪·扎曼冲出小屋，赌咒要向他们全家报仇。有钱人的怒火往往不容小看，捕鸟人夫妇决定赶紧把孩子送走，免遭毒手。不过，妻子悄悄告诉丈夫，她早就读懂了黄鸟双翅下的文字。她正是为了孩子的前程，才特意把头和心分给他们。
        - id: ch03-b10
          speaker: narrator
          text: >-
            夫妻俩相信，孩子的好运已经来了。他们拥抱两个孩子，叮嘱他们分头走，走得越远越好，以后别忘了捎回平安的消息。至于夫妇俩自己，则改换装束，藏在城中。这个主意实在颇为聪明。
        - id: ch03-b11
          speaker: narrator
          text: >-
            没过多久，巴迪·扎曼因为失去本该到手的财宝，又气又恼，竟然一命呜呼。捕鸟人夫妇这才回到小屋，等候孩子的消息。
        - id: ch03-b12
          speaker: narrator
          text: >-
            吃下黄鸟心脏的是弟弟。他很快发现那颗心带来了什么。每天早晨一醒来，枕头下面都有一个钱袋，装着整整一百枚金币。不过，世上的穷人不妨记住，再没有什么比一大笔财富更会招惹麻烦，也再没有什么需要花费更多心力照管。
        - id: ch03-b13
          speaker: narrator
          text: >-
            捕鸟人的小儿子花钱毫无节制，人人都猜他藏着一大堆金子。没过多久，强盗便袭击了他。他拼命抵抗，却伤得太重，最后死去了。
    - id: ch04
      title: 意外登位的埃米尔
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            吃下黄鸟头的是哥哥。他走过很远的路，一直没遇上特别的事。最后，他来到亚洲的一座大城。那时，全城正为推选一位新埃米尔，闹得不可开交。
        - id: ch04-b02
          speaker: narrator
          text: >-
            城里的头面人物分成两派，争吵许久才勉强说定，谁身上发生的事情最不同寻常，就让谁做埃米尔。年轻旅人恰在这时进城。他面容讨喜，步履轻快，忽然觉得有什么落到了头上。原来是一只雪白的鸽子。
        - id: ch04-b03
          speaker: narrator
          text: >-
            全城百姓一见，都瞪大眼睛盯着他，跟在他身后奔跑。不一会儿，他头顶着鸽子来到宫殿，居民们也全都尾随而至。还没等年轻人弄清身在何处，众人已经立他为埃米尔，叫他惊讶极了。
        - id: ch04-b04
          speaker: narrator
          text: >-
            世上再没有什么比号令众人更令人惬意，也没有什么能让人更快习惯。年轻的埃米尔很快便安然自得地坐稳了位子。可他照样犯下一个又一个错误，把国家治理得一团糟。
        - id: ch04-b05
          speaker: narrator
          text: >-
            终于，全城百姓揭竿而起，一举夺走了他的权力，也夺走了他的性命。这样的惩罚确实是他应得的。因为得势以后，他不肯再认捕鸟人夫妇做父母，竟任由他们在贫困中死去。
    - id: ch05
      title: 一座小屋的幸福
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            《黄鸟》的故事讲完了。草甸仙女转向西尔万和若科萨，告诉他们，自己讲这个故事，是想让两人明白一个道理。
        - id: ch05-b02
          speaker: fairy_of_the_meadows
          text: >-
            这座小屋和屋里屋外的一切，比许多乍看起来更堂皇、更诱人的东西，更能带给你们幸福和满足。只要你们郑重答应我，好好耕种田地，照料羊群，而且这一次比从前更能信守诺言，我就会看顾你们，绝不让你们缺少任何真正有益的东西。
        - id: ch05-b03
          speaker: narrator
          text: >-
            西尔万和若科萨郑重许下诺言。这一次，他们果真一直信守不渝，因此永远享有安宁和富足。
        - id: ch05-b04
          speaker: narrator
          text: >-
            仙女请来了他们所有的亲友和邻居，婚礼随即在盛大的欢庆中举行。西尔万与若科萨始终相亲相爱，携手活到了很老很老的年纪。
        - id: ch05-b05
          speaker: narrator
          text: >-
            这个故事的作者是卡吕斯伯爵。
