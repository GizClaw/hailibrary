  chapters:
    - id: ch01
      title: The Fairy's Fountain
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once, in the same village, there lived two children named Sylvain and Jocosa. Both were beautiful and clever. Their parents had been enemies for years because of an old quarrel. It had begun so long before that no one even remembered the cause, but habit kept the feud alive. Sylvain and Jocosa shared none of it. They were unhappy whenever they had to be apart.
        - id: ch01-b02
          speaker: narrator
          text: Every day they took their sheep out together. Through the long, sunny hours, they played or rested on a shady bank. One day the Fairy of the Meadows passed that way. Their gentle manners and lovely faces delighted her, so she chose to protect them. As the children grew, she loved them more and more.
        - id: ch01-b03
          speaker: narrator
          text: At first, the fairy stayed hidden. She left little gifts in the places they liked best, things each would be glad to give the other. Sylvain's first thought was always what might please Jocosa, and Jocosa always wondered what Sylvain would like. The fairy took great pleasure in watching them share the cakes and sweets she brought almost every day.
        - id: ch01-b04
          speaker: narrator
          text: When they were grown, she decided to reveal herself. One noon, as they sheltered from the sun beneath a hedge thick with flowers, a tall, slender lady suddenly stood before them. She wore green from head to foot, with a garland of flowers upon her head. Sylvain and Jocosa started in surprise. Then she spoke kindly, and their fear faded. She told them she had always loved them and that all the mysterious gifts had come from her. They thanked her with all their hearts. They were happy to stay with her and answer everything she asked them.
        - id: ch01-b05
          speaker: fairy_of_the_meadows
          text: Tell no one that you have seen me. You will see me many times again, and I will often be near you even when I am hidden from sight.
        - id: ch01-b06
          speaker: narrator
          text: With that, she vanished before their eyes, leaving Sylvain and Jocosa full of wonder and excitement. Afterward, the fairy visited them often. She taught them countless things they had never known and showed them many marvels from her beautiful kingdom. At last, one day, she reminded them how kind she had always been and said it was time for them to do something for her in return.
        - id: ch01-b07
          speaker: fairy_of_the_meadows
          text: You remember the fountain I call my favorite. Every morning, before sunrise, go there and remove any stone that blocks its flow. Clear away every dead leaf and broken twig that clouds the water. If you never forget and never delay, I will accept your care as proof of your gratitude. And as long as the sun's first rays find my spring the clearest and sweetest in all my meadows, you two will never be parted.
        - id: ch01-b08
          speaker: narrator
          text: Sylvain and Jocosa willingly promised. It seemed a very small service in return for everything the fairy had given them and everything she had promised. For a long while, they tended the fountain with perfect care. Its water remained clearer and lovelier than any other spring in the countryside.
    - id: ch02
      title: The River Between Them
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Then came a spring morning, long before sunrise. Sylvain and Jocosa were hurrying toward the fountain from opposite directions. Flowers grew thickly everywhere, thousands of bright blossoms glowing around them. Each stopped to gather a few for the other.
        - id: ch02-b02
          speaker: jocosa
          text: I'll weave these into a garland for Sylvain.
        - id: ch02-b03
          speaker: sylvain
          text: Jocosa will look so lovely in a crown of these flowers.
        - id: ch02-b04
          speaker: narrator
          text: They wandered this way and that. Every time they reached for a blossom, a brighter one seemed to wait just beyond it. They strayed farther and farther until the first brilliant rays of the rising sun startled them. At once, both turned and raced for the fountain. They arrived together, but on opposite sides.
        - id: ch02-b05
          speaker: narrator
          text: They looked down in horror. The water that was usually so still now boiled and churned. As they watched, a mighty flood rushed through and swallowed the fountain completely. In an instant, a broad, swift river divided Sylvain from Jocosa. They had only time to cry out and hold up the flowers they had gathered. Each understood at once what the other had done.
        - id: ch02-b06
          speaker: narrator
          text: Sylvain threw himself into the wild water again and again. Twenty times he tried to swim across to Jocosa, and twenty times an irresistible force swept him back onto the very bank he had left. Jocosa would not give up either. When a tree came floating down with its roots torn out, she climbed onto it and tried to ride across the flood. Her attempt was just as useless as Sylvain's.
        - id: ch02-b07
          speaker: narrator
          text: Heavyhearted, they began to follow the river, one on each side. Soon it grew so wide that they could barely make each other out. Still they struggled onward by night and by day, over mountains and through valleys, through cold and heat. They endured hunger, weariness, and every kind of hardship. Only the hope of meeting again gave them comfort.
        - id: ch02-b08
          speaker: narrator
          text: Three years passed. At last, they reached the cliffs where the river poured into the mighty sea. Now they seemed farther apart than ever. In despair, they each tried once more to cast themselves into the foaming waves.
        - id: ch02-b09
          speaker: narrator
          text: But the Fairy of the Meadows had never stopped watching over them. She would not let them drown. She quickly waved her wand, and suddenly Sylvain and Jocosa stood side by side on the golden sand. Their long struggle was over. Their joy was beyond words as they clasped hands again.
        - id: ch02-b10
          speaker: narrator
          text: They had so much to tell each other that neither knew where to begin. But they agreed on one thing. Their own carelessness at the fountain had caused all their suffering, and they blamed themselves bitterly for forgetting their duty. As soon as the fairy heard them, she appeared. They threw themselves at her feet and begged her to forgive them. She forgave them freely. Their punishment was finished, she told them, and from then on she would always remain their friend.
        - id: ch02-b11
          speaker: narrator
          text: Then she called for her favorite chariot. It was woven from green rushes and decorated with May dewdrops that she collected with special care. Six short-tailed moles drew it, carrying all three travelers back to the familiar pastures in remarkably little time. Sylvain and Jocosa were overjoyed to see their beloved home after all their weary wandering.
        - id: ch02-b12
          speaker: narrator
          text: The fairy had set her heart on making them happy. While they were away, she had completely ended the old quarrel between their parents and won their consent to the faithful young couple's marriage. Now she led Sylvain and Jocosa to the most charming little cottage imaginable. It stood close to the fountain, which had become peaceful once more. Its water flowed gently into a little brook that enclosed the cottage's garden, orchard, and pasture. Nothing more could have been wished for, either for the lovers or for their flocks. Their delight satisfied even the fairy who had planned it all to please them.
        - id: ch02-b13
          speaker: narrator
          text: They explored and admired everything until they were tired. Then they rested beneath the rose-covered porch. The fairy had invited wedding guests, but there was time before they arrived, so she offered to tell Sylvain and Jocosa a story.
    - id: ch03
      title: The Yellow Bird
      blocks:
        - id: ch03-b01
          speaker: fairy_of_the_meadows
          text: Once there was a fairy who had somehow fallen into trouble. The High Court of Fairyland ordered her to spend several years in the shape of some creature. When she regained her true form, she also had to make the fortunes of two men. She could choose the creature herself. Because she loved yellow, she became a beautiful bird with shining golden feathers unlike any ever seen before.
        - id: ch03-b02
          speaker: fairy_of_the_meadows
          text: When the years of her punishment came to an end, the beautiful Yellow Bird flew to Bagdad. She allowed a fowler to catch her at the exact moment Badi-al-Zaman was walking back and forth outside his splendid summer palace. His name meant Wonder-of-the-World, and everyone in Bagdad thought him the most fortunate creature beneath the sun because his wealth was so vast. In truth, he worried constantly over those riches. He was weary of everything and forever desired something he did not possess, so he never knew a single moment of real happiness.
        - id: ch03-b03
          speaker: fairy_of_the_meadows
          text: That day, he had left his palace in a cross and weary mood because nothing could amuse him. The palace itself was grand enough for fifty kings, but even that gave him no pleasure. The fowler saw his chance and offered him the marvelous bird, certain that such a rich man would buy it at once.
        - id: ch03-b04
          speaker: fairy_of_the_meadows
          text: He was right. Badi-al-Zaman took the lovely captive in his hands and found words beneath both wings. Under the right wing was written that whoever ate the bird's head would become a king. Under the left was a promise that whoever ate its heart would find a hundred gold pieces beneath his pillow every morning. Though Badi-al-Zaman already had enormous wealth, he immediately wanted that promised gold. He bought the bird without delay.
        - id: ch03-b05
          speaker: fairy_of_the_meadows
          text: Then he faced a difficulty. He trusted none of his many servants to cook it. At last, he asked whether the fowler had a wife. When the man said yes, Badi-al-Zaman ordered him to take the bird home and have her prepare it.
        - id: ch03-b06
          speaker: badi_al_zaman
          text: Perhaps this bird will restore the appetite I lost so long ago. If it does, your wife shall have one hundred silver pieces.
        - id: ch03-b07
          speaker: fairy_of_the_meadows
          text: The delighted fowler hurried home. His wife soon made a savory stew from the Yellow Bird. But when Badi-al-Zaman arrived at their cottage, he eagerly searched the dish and found neither the head nor the heart. He turned on the fowler's wife in a fury.
        - id: ch03-b08
          speaker: fowlers_wife
          text: Please, spare us! My two children came in just before you arrived and begged me for a taste. I gave the head to one and the heart to the other because people usually care so little for those pieces.
          emotion: fearful
        - id: ch03-b09
          speaker: fairy_of_the_meadows
          text: Badi-al-Zaman rushed from the cottage, swearing revenge upon the whole family. The anger of a rich man was dangerous, so the fowler and his wife decided to send their children beyond his reach. But the wife had one comforting secret for her husband. She had been able to read the writing beneath the bird's wings, and she had given those pieces to the children on purpose.
        - id: ch03-b10
          speaker: fairy_of_the_meadows
          text: Believing their children's fortunes were now assured, the parents embraced them and sent them away from danger. The two were to take separate roads, travel as far as possible, and send word of their welfare. The fowler and his wife stayed in the city, hidden and disguised. It was a clever choice. Very soon, Badi-al-Zaman died from his anger and disappointment over the promised treasure he had lost. Then the parents could safely return to their cottage and wait for news from their children.
        - id: ch03-b11
          speaker: fairy_of_the_meadows
          text: The younger child had eaten the Yellow Bird's heart. He quickly discovered its gift. Every morning when he woke, a purse holding one hundred gold pieces lay beneath his pillow. Yet a great treasure brings endless trouble and demands endless care. The young man spent his gold wildly, and people began to believe he possessed a vast hoard. Before long, robbers attacked him. He fought to defend himself, was terribly wounded, and died.
        - id: ch03-b12
          speaker: fairy_of_the_meadows
          text: The elder brother had eaten the Yellow Bird's head. He traveled a great distance without meeting any special adventure. At last he reached a large city in Asia, where everything was in an uproar over the choice of a new Emir. All the leading citizens had divided themselves into two parties, and neither side would give way. Only after a long and noisy quarrel did they reach an agreement. The person to whom the most extraordinary thing happened would become their ruler.
        - id: ch03-b13
          speaker: fairy_of_the_meadows
          text: Just then, the young traveler entered the city with a pleasant face and a jaunty air. Suddenly, something settled on his head. It was a snow-white pigeon. Everyone stared, then ran after him. With the pigeon still perched above him and the whole city at his heels, he soon arrived at the palace. Before he understood what was happening, they made him Emir. No one was more astonished than he was.
        - id: ch03-b14
          speaker: fairy_of_the_meadows
          text: Nothing is more pleasant than giving orders, and few things become familiar so quickly. The young Emir soon felt perfectly at home in his new position. That did not stop him from making every sort of mistake. He governed so badly that the entire city finally rose against him and took away both his power and his life. He richly deserved his fate. In his prosperous days, he had denied that the fowler and his wife were his parents and had let them die in poverty.
    - id: ch04
      title: Peace and Prosperity
      blocks:
        - id: ch04-b01
          speaker: fairy_of_the_meadows
          text: My dear Sylvain and Jocosa, I told you this story to show that this little cottage, and everything belonging to it, is more likely to bring you happiness and contentment than many gifts that seem grander and more desirable. Promise faithfully to work your fields and care for your flocks. Keep this promise better than the last, and I will make sure you never lack anything that is truly good for you.
        - id: ch04-b02
          speakers: [sylvain, jocosa]
          ensemble: duo
          text: We promise faithfully.
        - id: ch04-b03
          speaker: narrator
          text: And this time, they kept their word. Sylvain and Jocosa always lived in peace and prosperity. The fairy had invited all their friends and neighbors, so the wedding took place at once with great celebration and rejoicing.
        - id: ch04-b04
          speaker: narrator
          text: Sylvain and Jocosa lived to a good old age, and they always loved one another with all their hearts.
        - id: ch04-b05
          speaker: narrator
          text: By the Comte de Caylus.
