audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，像编书人面对孩子娓娓而谈
        timbre: 温暖清朗
        pace: 舒缓而有自然起伏
        pitch: 中音
    medio_pollito:
      display_name: 梅迪奥·波利托
      tts:
        delivery: 任性傲慢，说话干脆，受难时慌乱急促
        timbre: 稚嫩而尖亮
        pace: 偏快
        pitch: 高音
    mother_hen:
      display_name: 母鸡
      tts:
        delivery: 慈爱操心，劝告时恳切而耐心
        timbre: 柔和温厚
        pace: 从容
        pitch: 中高音
    stream:
      display_name: 小溪
      tts:
        delivery: 求助时焦急，回应时平静而严肃
        timbre: 清澈流动
        pace: 适中
        pitch: 中高音
    fire:
      display_name: 火
      tts:
        delivery: 虚弱时断续颤抖，回应时有力而严正
        timbre: 轻微沙哑
        pace: 稍慢
        pitch: 中音
    wind:
      display_name: 风
      tts:
        delivery: 求助时急切，惩罚时冷峻坚定
        timbre: 轻盈而带呼啸感
        pace: 灵活偏快
        pitch: 中音
    cook:
      display_name: 厨子
      tts:
        delivery: 粗声直气，忙碌而利落
        timbre: 浑厚响亮
        pace: 偏快
        pitch: 中低音
  chapters:
    - id: ch01
      title: 不肯留在家里的半只小鸡
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，西班牙有一只漂亮的黑母鸡，养着一大窝胖乎乎的小鸡。只有最小的孩子与众不同。他刚啄开蛋壳，母亲几乎不敢相信自己的眼睛。别的十二只小鸡毛茸茸、软绵绵，都挤在她翅膀下面，这个小家伙却像从中间分成了两半，只有一条腿、一只翅膀、一只眼睛，连脑袋和嘴巴也各有半边。母鸡难过地摇了摇头。
        - id: ch01-b02
          speaker: mother_hen
          text: >-
            我最小的孩子只有半只，永远也长不成哥哥们那样高大漂亮的公鸡。哥哥们以后会到外面的世界去，各自管一座养鸡场。这个可怜的小家伙，只能留在家里陪妈妈了。
          emotion: sad
        - id: ch01-b03
          speaker: narrator
          text: >-
            她给小鸡取名叫梅迪奥·波利托。在西班牙语里，这个名字就是“半只小鸡”。他看起来古怪又弱小，却根本不肯老实待在母亲的翅膀下。他的脾气和他的模样一样，与哥哥姐姐全不相同。哥哥姐姐都是听话的好孩子，一听见母鸡咯咯召唤，马上叽叽叫着跑回来。他呢，明明只有一条腿，偏偏一心想往远处跑。母亲叫他回鸡舍，他就借口自己只有一只耳朵，装作听不见。
        - id: ch01-b04
          speaker: narrator
          text: >-
            母鸡带全家到田野里散步，他总是一个人跳开，钻进玉米丛里藏起来。哥哥姐姐每次都要焦急地找上好一阵，母亲更是又害怕又慌张，咯咯叫着跑来跑去。日子一久，他越发任性，越发不听管教，对母亲常常很无礼，对别的小鸡也总没好脾气。
        - id: ch01-b05
          speaker: narrator
          text: >-
            一天，他在田野里跑了一趟，比平时任何一次都远。回来后，他迈着自己那种一蹦一踢的怪步子，神气活现地走到母亲面前，还大胆地用那只眼睛斜瞧着她。
        - id: ch01-b06
          speaker: medio_pollito
          text: >-
            妈妈，我受够这里了。农家院闷得要命，除了灰扑扑的玉米地，什么也看不见。我要去马德里见国王！
        - id: ch01-b07
          speaker: mother_hen
          text: >-
            去马德里？梅迪奥·波利托，你这傻孩子！那么远的路，连成年的公鸡走起来都吃力。你这么小，走不到一半就累坏了。不行，留下陪妈妈吧。等你大些，我们再一起走一小段路。
          emotion: surprised
        - id: ch01-b08
          speaker: narrator
          text: >-
            可他早已拿定主意。母亲怎么劝，哥哥姐姐怎么求，他一句也听不进去。
        - id: ch01-b09
          speaker: medio_pollito
          text: >-
            大家挤在这个又小又闷的地方，有什么意思？等我在王宫里有了自己的漂亮院子，也许会请你们几个来住上几天。
        - id: ch01-b10
          speaker: narrator
          text: >-
            他连告别也顾不上好好说，就一瘸一跳地踏上通往马德里的大路。母亲追在后面喊他。
        - id: ch01-b11
          speaker: mother_hen
          text: >-
            路上不管遇见谁，都要和气些，要懂礼貌啊！
        - id: ch01-b12
          speaker: narrator
          text: >-
            他只顾赶路，没有回答，也没有回头。
    - id: ch02
      title: 三次求助
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            那天下午，他为了抄近路，从一片田野里穿过，来到一条小溪边。溪沟里长满杂草和水草，堵得严严实实，水只能停在那里，怎么也流不畅。
        - id: ch02-b02
          speaker: stream
          text: >-
            梅迪奥·波利托，快帮帮我吧！把这些草清开，让我能流过去。
        - id: ch02-b03
          speaker: medio_pollito
          text: >-
            还想叫我帮忙？你以为我有空管这种小事吗？自己想办法，别耽误赶路的人。我要去马德里见国王！
        - id: ch02-b04
          speaker: narrator
          text: >-
            他傲慢地扬起脑袋，抖了抖尾巴上寥寥几根羽毛，一蹦一踢，一蹦一踢地走了。又过了一会儿，他在树林里看见吉卜赛人留下的一堆火。火已经烧得很低，光也十分微弱，眼看就要彻底熄灭。
        - id: ch02-b05
          speaker: fire
          text: >-
            梅迪奥·波利托，请你放些树枝和干叶子在我身上吧。再过几分钟，我就彻底熄灭了。帮帮我，不然我会死的！
        - id: ch02-b06
          speaker: medio_pollito
          text: >-
            又要我帮忙？我还有正事呢。树枝你自己去捡，别来烦我。我要去马德里见国王！
        - id: ch02-b07
          speaker: narrator
          text: >-
            他还是一蹦一踢，一蹦一踢地走了。第二天早晨，马德里已经不远。路旁有一棵高大的栗树，风被密密的枝杈缠住，困在了树上。
        - id: ch02-b08
          speaker: wind
          text: >-
            梅迪奥·波利托，快跳上来帮我摆脱这些树枝吧！我出不去，实在难受。
        - id: ch02-b09
          speaker: medio_pollito
          text: >-
            是你自己钻进去的，怪得了谁？我不能把整个早晨都花在你身上。你用力抖一抖，自己出来吧。别挡路，我还要去马德里见国王！
        - id: ch02-b10
          speaker: narrator
          text: >-
            他高高兴兴地继续赶路。马德里的塔尖和屋顶已经看得见了。
    - id: ch03
      title: 国王的鸡汤
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            进了城，他一眼就看见一座宏伟华丽的大房子，大门前站着一排士兵。他马上断定那一定是王宫，便打算一路跳到正门口，守在那里，非等到国王出来不可。可他刚从一扇后窗旁边跳过，就被国王的厨子瞧见了。
        - id: ch03-b02
          speaker: cook
          text: >-
            来得正好！国王刚传话，说晚餐一定要喝鸡汤。
        - id: ch03-b03
          speaker: narrator
          text: >-
            厨子推开窗户，把胳膊伸到外面，一把抓住梅迪奥·波利托，随手就把他扔进火边的汤锅。又湿又黏的水一下没过他的脑袋，浸得每根羽毛都紧紧贴在身上，那滋味可真难受。
        - id: ch03-b04
          speaker: medio_pollito
          text: >-
            水啊，水啊！可怜可怜我，别把我浸成这样！
          emotion: fearful
        - id: ch03-b05
          speaker: stream
          text: >-
            梅迪奥·波利托，我还是田野里的小溪时，请你帮忙，你却不肯。现在，你该受罚了。
        - id: ch03-b06
          speaker: narrator
          text: >-
            随后，锅底的火烧了起来，滚烫的水烫得他钻心地疼。他在锅里又蹦又跳，从这一边逃到另一边，又从那一边逃回来，拼了命也躲不开那股热浪，只能痛苦地大叫。
        - id: ch03-b07
          speaker: medio_pollito
          text: >-
            火啊，火啊！别再烧我了，你根本不知道有多疼！
        - id: ch03-b08
          speaker: fire
          text: >-
            梅迪奥·波利托，我在树林里快要熄灭时，你不肯帮我。如今受罚的滋味，你也尝到了。
        - id: ch03-b09
          speaker: narrator
          text: >-
            梅迪奥·波利托疼得越来越厉害，以为自己马上就要死了。偏在这时，厨子揭开锅盖，想看看国王晚餐要喝的鸡汤煮好了没有。他一看锅里的样子，吓了一大跳。
        - id: ch03-b10
          speaker: cook
          text: >-
            这怎么行！鸡都烧成焦炭了，根本没法吃。我可不能把这种东西端上国王的餐桌。
          emotion: surprised
        - id: ch03-b11
          speaker: narrator
          text: >-
            厨子打开窗户，把梅迪奥·波利托扔到街上。谁知他还没落地，风就一把卷住他，带着他在空中飞快地旋转。风刮得那么急，他连一口气也喘不上来，心在胸膛里怦怦猛撞，仿佛马上就要撞裂了。
    - id: ch04
      title: 尖塔上的身影
      blocks:
        - id: ch04-b01
          speaker: medio_pollito
          text: >-
            风啊！你再这样飞，会要了我的命。让我停下来歇一会儿，不然……
          emotion: fearful
        - id: ch04-b02
          speaker: narrator
          text: >-
            他喘得太厉害，后面的话再也说不出来。
        - id: ch04-b03
          speaker: wind
          text: >-
            梅迪奥·波利托，我被栗树枝困住时，你不肯帮我。现在轮到你受罚了。
        - id: ch04-b04
          speaker: narrator
          text: >-
            风卷着他掠过一座又一座屋顶，一直飞到全城最高的教堂，把他牢牢留在尖塔顶上。
        - id: ch04-b05
          speaker: narrator
          text: >-
            梅迪奥·波利托至今还站在那里。你若到了马德里，沿着街道找到城里最高的教堂，就会看见他单腿立在尖塔上。唯一的翅膀垂在身旁，他用仅有的那只眼睛，忧伤地望着整座城。
        - id: ch04-b06
          speaker: narrator
          text: >-
            这是一个西班牙民间故事。
