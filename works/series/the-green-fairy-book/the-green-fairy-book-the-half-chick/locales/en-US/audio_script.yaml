  chapters:
    - id: ch01
      title: The Youngest Chick
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a handsome black Spanish hen with a large brood of chickens. Twelve were fine, plump little birds, covered in soft down and nestled beneath her wings. But the youngest was nothing like his brothers and sisters. When he first chipped through his shell, his mother could hardly believe her eyes. He was the strangest little creature she had ever seen. He looked exactly as though someone had cut him in two. There was only one leg beneath him and one wing at his side. He had one eye, half a head, and half a beak.
        - id: ch01-b02
          speaker: mother_hen
          text: My youngest is only half a chick. He'll never grow into a tall, handsome cock like his brothers. They'll go out and rule poultry yards of their own, but this poor little fellow will always need to stay home with me.
          emotion: sad
        - id: ch01-b03
          speaker: narrator
          text: She named him Medio Pollito, which means half-chick in Spanish. Odd and helpless as he looked, he had no wish to stay safely under her wing. In his nature, he was as unlike the other chicks as he was in his appearance. His brothers and sisters were good and obedient. Whenever the old hen called for them, they chirped and ran straight back to her side. But Medio Pollito had a wandering spirit, even with only one leg to carry him. When his mother called him back to the coop, he pretended his one ear could not hear her.
        - id: ch01-b04
          speaker: narrator
          text: When the whole family went walking through the fields, Medio Pollito hopped away by himself and hid among the tall Indian corn. His brothers and sisters spent many anxious minutes looking for him. All the while, his frightened mother ran back and forth, cackling in fear and distress. The older Medio Pollito grew, the more stubborn and disobedient he became. He often spoke rudely to his mother, and he showed a thoroughly disagreeable temper toward the other chickens.
    - id: ch02
      title: The Road to Madrid
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: One day Medio Pollito set out on a longer expedition through the fields than usual. At last he came home. He strutted straight up to his mother, walking in his own peculiar way with a hop and then a kick. Then he tilted his head and fixed his one eye boldly upon her.
        - id: ch02-b02
          speaker: medio_pollito
          text: Mother, I'm tired of this dull farmyard and its dreary maize field. I'm going to Madrid to see the King.
        - id: ch02-b03
          speaker: mother_hen
          text: Madrid! Why, you silly chick, that journey would be long even for a grown cock. You'd wear yourself out before you got halfway. No, stay home with me. When you're bigger, we'll take a little journey together.
          emotion: surprised
        - id: ch02-b04
          speaker: narrator
          text: But Medio Pollito had made up his mind before he ever spoke. He would not listen to his mother's sensible advice. He would not listen when his brothers and sisters gathered around to plead with him either.
        - id: ch02-b05
          speaker: medio_pollito
          text: Why should we all crowd into this cramped little place? Once I have my own fine courtyard at the King's palace, perhaps I'll invite some of you for a short visit.
        - id: ch02-b06
          speaker: narrator
          text: He scarcely waited long enough to say goodbye to his family. Off he stumped along the high road that led to Madrid. His mother hurried after him as far as she could and called out one last piece of advice.
        - id: ch02-b07
          speaker: mother_hen
          text: Remember to be kind and polite to everyone you meet!
        - id: ch02-b08
          speaker: narrator
          text: Medio Pollito was far too eager to be gone. He did not stop to answer his mother, and he did not even turn his head to look back at her.
    - id: ch03
      title: Three Pleas for Help
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Later that same day, Medio Pollito left the road and took a shortcut across a field. Before long he came to a stream and began hopping along its bank. The channel was choked with weeds and thick water plants. They had grown so closely together that the stream could no longer flow freely.
        - id: ch03-b02
          speaker: stream
          text: Oh, Medio Pollito, please clear away these weeds and help me flow again.
        - id: ch03-b03
          speaker: medio_pollito
          text: Help you? Do you think I have time to waste on such a trifle? Help yourself, and stop bothering busy travelers. I'm going to Madrid to see the King.
        - id: ch03-b04
          speaker: narrator
          text: Medio Pollito tossed his head and shook the few feathers in his tail. Then, hoppity-kick, hoppity-kick, he stumped away. A little later he entered a wood and came upon a fire that some travelers had left behind. It was burning very low. Without fresh fuel, its last weak flames would soon go out.
        - id: ch03-b05
          speaker: fire
          text: Oh, Medio Pollito, I'll go out in a few minutes unless you feed me some sticks and dry leaves. Please help me, or I'll die!
        - id: ch03-b06
          speaker: medio_pollito
          text: Help you? I have better things to do. Gather your own sticks, and don't trouble me. I'm going to Madrid to see the King.
        - id: ch03-b07
          speaker: narrator
          text: Hoppity-kick, hoppity-kick, away he stumped once more. By the next morning his journey had brought him close to Madrid. Beside the way stood a great chestnut tree, and as Medio Pollito passed it, he heard a voice among the leaves. The wind had blown into the tree and become caught and tangled in its branches.
        - id: ch03-b08
          speaker: wind
          text: Oh, Medio Pollito, hop up here and help me out of these branches. I can't get free, and I'm terribly uncomfortable.
        - id: ch03-b09
          speaker: medio_pollito
          text: It's your own fault for getting caught. I won't waste my morning helping you. Shake yourself loose, and don't hold me up. I'm going to Madrid to see the King.
        - id: ch03-b10
          speaker: narrator
          text: Hoppity-kick, hoppity-kick, Medio Pollito stumped away in great delight. Nothing could slow him now, for beyond the fields he could already see the roofs and towers of Madrid.
    - id: ch04
      title: At the King's Palace
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: In the town, Medio Pollito saw a magnificent house with soldiers at its gates. This had to be the King's palace. He meant to wait at the front gate until the King appeared. But as he hopped past a back window, the King's cook spotted him.
        - id: ch04-b02
          speaker: cook
          text: That's exactly what I need! The King has just sent word that he wants chicken broth for dinner.
        - id: ch04-b03
          speaker: narrator
          text: The cook opened the window, reached out, caught Medio Pollito, and dropped him into the broth pot beside the fire. The clammy water closed over the half-chick's head and pressed his feathers against his side.
        - id: ch04-b04
          speaker: medio_pollito
          text: Water, please have mercy! Don't soak me like this!
          emotion: fearful
        - id: ch04-b05
          speaker: stream
          text: Ah, Medio Pollito. You refused to help me when I was a little stream in the fields. Now you must be punished.
        - id: ch04-b06
          speaker: narrator
          text: Then the fire began to burn and scald him. Medio Pollito danced and hopped from one side of the pot to the other, trying to escape the heat and crying out in pain.
        - id: ch04-b07
          speaker: medio_pollito
          text: Fire, don't scorch me! You can't imagine how much this hurts!
          emotion: fearful
        - id: ch04-b08
          speaker: fire
          text: Ah, Medio Pollito. You would not help me when I was dying in the wood. This is your punishment.
        - id: ch04-b09
          speaker: narrator
          text: At last the pain grew so terrible that Medio Pollito thought he would die. Just then, the cook lifted the lid to see whether the King's broth was ready.
        - id: ch04-b10
          speaker: cook
          text: Look at this! The chicken is useless. It's burned to a cinder, and I can't serve that at the royal table.
        - id: ch04-b11
          speaker: narrator
          text: The cook opened the window and threw Medio Pollito into the street. The wind caught him and whirled him through the air so fast that he could scarcely breathe. His heart hammered against his side as if it would break.
        - id: ch04-b12
          speaker: medio_pollito
          text: Oh, wind! If you rush me along like this, you'll kill me. Let me rest for just a moment, or—
          emotion: fearful
        - id: ch04-b13
          speaker: narrator
          text: He was too breathless to finish.
        - id: ch04-b14
          speaker: wind
          text: Ah, Medio Pollito. When I was trapped in the chestnut branches, you would not help me. Now you are being punished.
        - id: ch04-b15
          speaker: narrator
          text: The wind swept Medio Pollito over the rooftops to the highest church in Madrid and fastened him at the top of its steeple.
        - id: ch04-b16
          speaker: narrator
          text: And there Medio Pollito stands to this day. If you go to Madrid and walk until you find its highest church, you will see him perched on one leg upon the steeple. His one wing droops at his side, and his one eye gazes sadly over the town.
