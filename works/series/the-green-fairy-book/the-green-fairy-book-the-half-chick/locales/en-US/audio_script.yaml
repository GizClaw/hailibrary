audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and attentive fairy-tale storytelling
        timbre: clear and gently resonant
        pace: measured
        pitch: medium
    mother_hen:
      display_name: Mother Hen
      tts:
        delivery: caring, anxious, and sensible
        timbre: warm and motherly
        pace: natural
        pitch: medium
    medio_pollito:
      display_name: Medio Pollito
      tts:
        delivery: proud, impatient, and sharp
        timbre: small and bright
        pace: brisk
        pitch: high
    stream:
      display_name: The Stream
      tts:
        delivery: pleading at first, then firm and reproachful
        timbre: light and flowing
        pace: natural
        pitch: medium-high
    fire:
      display_name: The Fire
      tts:
        delivery: faint at first, then stern and forceful
        timbre: dry and flickering
        pace: measured
        pitch: medium
    wind:
      display_name: The Wind
      tts:
        delivery: restless, insistent, and commanding
        timbre: airy and resonant
        pace: brisk
        pitch: medium
