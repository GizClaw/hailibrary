audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，像编书人面对孩子娓娓而谈，讽刺处轻巧含笑
        timbre: 温暖清朗
        pace: 舒缓而有自然起伏
        pitch: 中音
    john:
      display_name: 约翰
      tts:
        delivery: 勇敢直率，军人般爽快，受骗时懊恼却很快振作
        timbre: 清亮结实
        pace: 适中偏快
        pitch: 中音
    ludovine:
      display_name: 吕多维娜
      tts:
        delivery: 高贵而狡黠，诱哄时柔美，发怒时尖利强硬
        timbre: 明亮华丽
        pace: 适中
        pitch: 中高音
    innkeeper:
      display_name: 女店主
      tts:
        delivery: 热心实在，回话清楚利落
        timbre: 温厚明快
        pace: 适中
        pitch: 中音
    seagull:
      display_name: 海鸥姑娘
      tts:
        delivery: 善良朴实，羞涩时轻柔，做决定时坦荡坚定
        timbre: 柔和清澈
        pace: 稍慢
        pitch: 中高音
    palace_smoker:
      display_name: 宫门前的男人
      tts:
        delivery: 随意爽朗，对古怪问题带着好笑
        timbre: 粗亮自然
        pace: 适中
        pitch: 中低音
    king:
      display_name: 低地国国王
      tts:
        delivery: 傲慢圆滑，以王者口吻掩饰贪婪和冷酷
        timbre: 厚重威严
        pace: 稍慢
        pitch: 低音
    queen:
      display_name: 王后
      tts:
        delivery: 好奇而夸张，宫廷口吻端庄中带惊叹
        timbre: 圆润明亮
        pace: 适中
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第一章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，有个刚从战场回来的小士兵。他身材不高，胆量却不小，打完仗以后，胳膊腿儿也一样不少。如今战争结束，军队解散，他只好回到出生的村庄。士兵本名约翰，不知什么缘故，朋友们一直叫他“小国王”。为什么这样叫呢？从来也没人说得清，反正这个绰号就跟定了他。
        - id: ch01-b02
          speaker: narrator
          text: >-
            约翰没有父母在家等他，也就用不着着急。他背着行囊，腰间佩着长剑，不紧不慢地赶路。一天傍晚，他忽然想抽袋烟，伸手摸火柴盒，却发现盒子已经丢了，心里十分懊恼。好在还没走出一箭之远，他就看见树林里透着灯光。循光找去，前面是一座古老的城堡，大门正敞开着。他走进庭院，从窗外望见一间低矮的大厅，熊熊炉火正在屋子尽头燃烧。于是，他先把烟斗收进口袋，再轻轻敲门。
        - id: ch01-b03
          speaker: john
          text: 能借个火给我吗？
        - id: ch01-b04
          speaker: narrator
          text: >-
            没人回答。约翰等了一会儿，又敲一次，这回用了更大的力气，里面依旧没有动静。他抬起门闩走进去，发现大厅空无一人，便径直来到壁炉边。他拿起火钳，弯下腰，仔细寻找一块红亮的炭火，好点燃烟斗。突然，只听“咔嗒”一声，像是某个弹簧机关松开了。烈焰从中分开，一条巨蛇猛地昂起身子，面孔几乎贴到了他眼前。最怪的是，蛇身上竟长着一颗女人的头。
        - id: ch01-b05
          speaker: narrator
          text: >-
            别人见了，也许早就转身逃命。可约翰有一颗真正的军人之心，只向后退了一步，手便握住了剑柄。
        - id: ch01-b06
          speaker: ludovine
          text: 别拔剑。我一直在等你，只有你能救我。
        - id: ch01-b07
          speaker: john
          text: 你是谁？
        - id: ch01-b08
          speaker: ludovine
          text: 我叫吕多维娜，是低地国国王的女儿。救我脱身，我就嫁给你，让你一生幸福。
        - id: ch01-b09
          speaker: narrator
          text: >-
            一个女人头的巨蛇许诺给人幸福，听来未必可亲，小国王却一点也不害怕。他已经被那双绿眼睛迷住了。那眼睛细长如杏仁，像蛇盯着小鸟一样盯着他，闪动着奇异的光。眼睛四周披散着灿烂金发，那张脸美如天使，脸下却仍是一条蛇。
        - id: ch01-b10
          speaker: john
          text: 我要怎样才能救你？
        - id: ch01-b11
          speaker: ludovine
          text: >-
            打开那扇门，穿过长廊和尽头的屋子。那里有个壁橱，把里面的上衣取来给我。
        - id: ch01-b12
          speaker: narrator
          text: >-
            约翰大胆走进长廊，一路平安到了那间屋子。借着窗外的星光，他看见八只手悬在和自己面孔一样高的地方，全都要朝他打下来。可他不管向哪边看，都找不到这些手连着的身子。他低下头，迎着暴雨般落下的拳掌往前猛冲，同时挥起拳头还击。终于，他赶到壁橱前，打开柜门，取下上衣，气喘吁吁地带回最初那间大厅。
        - id: ch01-b13
          speaker: john
          text: 我把上衣拿来了。
        - id: ch01-b14
          speaker: narrator
          text: >-
            火中又响起“咔嗒”一声。吕多维娜从头到腰变成了女人。她穿上那件绣满珍珠的橙色天鹅绒上衣，可再白的珍珠也不及她的脖颈洁白。
        - id: ch01-b15
          speaker: ludovine
          text: >-
            还没有结束。回到长廊，从左边楼梯上楼。二楼第二间屋子的壁橱里放着我的裙子，把它拿回来。
        - id: ch01-b16
          speaker: narrator
          text: >-
            约翰照她的话，再次走进那间屋子。这回，等着他的不再只是八只手，而是八条完整的胳膊，每一条都握着一根硕大的棍棒。他立刻拔出长剑，左劈右砍，凭着一股猛劲杀开一条路，身上几乎连一点擦伤也没有。他从壁橱里取出裙子，带回给吕多维娜。那是一条蓝丝裙，蓝得就像西班牙的天空。她穿上以后，从头到膝盖都恢复了人形。
        - id: ch01-b17
          speaker: ludovine
          text: 现在只差鞋子和长袜了。它们在三楼的壁橱里，去取来吧。
        - id: ch01-b18
          speaker: narrator
          text: >-
            约翰再次上楼，却撞见八个妖怪。这些怪物都握着铁锤，双眼还喷射着火焰。他这一次没有立刻冲进去，而是在门槛前停下脚步。他知道，自己的剑派不上用场，那些铁锤一砸，就会让它像玻璃一样碎掉。若想不出别的办法，他必死无疑。就在这时，他看见眼前那扇用橡木做成的房门，又厚又沉。约翰用力把整扇门从铰链上扯下来，高高举过头顶，径直冲向妖怪，将他们全都压在门板下面。鞋袜终于取到了。吕多维娜穿上白丝长袜和缀着红宝石的小蓝鞋，最后一点蛇身也消失了。
        - id: ch01-b19
          speaker: ludovine
          text: >-
            现在离开这里，以后无论发生什么，都别再回来。这只钱袋里有两百枚达克特金币。今晚住到林边的客店，明早务必早起。九点钟，我会坐车经过，接你同行。
        - id: ch01-b20
          speaker: john
          text: 我们为什么不能现在就走？
        - id: ch01-b21
          speaker: ludovine
          text: >-
            时候还没到。不过，你可以先喝下这杯酒，祝我平安。
        - id: ch01-b22
          speaker: narrator
          text: >-
            她一边说，一边把一种熔金般闪亮的酒倒进水晶杯。约翰喝下美酒，这才从炉火中取了火，点燃自己惦记已久的烟斗，随后离开古堡。

    - id: ch02
      title: 第二章
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            约翰来到客店，叫人备好晚饭。可他才坐下吃了几口，眼皮就重得抬不起来。他以为自己只是比想象中更疲倦，再三嘱咐店里的人第二天早晨八点一定要叫醒他，便上床睡了。那一夜，他睡得像个死人。八点有人来叫，八点半又来一次，再过一刻钟，还有人来叫。大家想尽办法，约翰就是毫无反应，最后只好决定不再打扰，让他安静地睡下去。
        - id: ch02-b02
          speaker: narrator
          text: >-
            时钟敲响十二下，约翰才猛然惊醒。他跳下床，衣服都来不及穿整齐，就跑去问有没有人找过他。
        - id: ch02-b03
          speaker: innkeeper
          text: >-
            有位美丽的公主坐着金马车来过。她留下这束花，还说明早八点会再来。
        - id: ch02-b04
          speaker: narrator
          text: >-
            小士兵痛骂自己贪睡，只能拿起那束蜡菊安慰自己。他只想到蜡菊象征记忆，却忘了它也是献给死者的花。第二天夜里，他睁着一只眼睡觉，每小时跳起来二十次。鸟儿刚开始歌唱，他索性爬出窗户，坐到门前的大椴树上。可他望着花束出了神，最后又睡熟了。
        - id: ch02-b05
          speaker: narrator
          text: >-
            这一次，阳光、鸟鸣、金马车的声响，还有女店主四处寻找他的呼喊，都没能把他唤醒。中午钟声一响，他才从树上醒来。看见人们已经在摆午饭的桌子，他的心顿时沉了下去。
        - id: ch02-b06
          speaker: john
          text: 公主是不是又来过了？
        - id: ch02-b07
          speaker: innkeeper
          text: >-
            当然来过。她给你留下这条花色丝巾，说她明早七点再来，不过那是最后一次。
        - id: ch02-b08
          speaker: narrator
          text: >-
            约翰认定自己中了魔法。他拿起那条丝巾，闻到一种说不出的奇香，便把它系在左臂上。他想，保持清醒的最好办法，当然是根本不上床。他付清店钱，用剩下的钱买了一匹马。傍晚，他骑在马上守住客店门口，决心整夜都不离开。可是，他不时俯下身去闻丝巾的甜香，而且闻得越来越勤。到后来，他的脑袋终于垂在马颈上，和坐骑一起响亮地打起鼾来。
        - id: ch02-b09
          speaker: narrator
          text: >-
            公主来了。众人摇他、打他、朝他大喊，全都无济于事。直到马车渐渐远去，人和马才同时醒来。约翰立刻策马追赶，一路拼命高呼。
        - id: ch02-b10
          speaker: john
          text: 停下！请停下！
        - id: ch02-b11
          speaker: narrator
          text: >-
            金马车没有减速。小士兵催马追了一天一夜，连一步也没能靠近。他们把一座又一座村镇抛在身后，一直来到大海边。约翰以为马车这回非停不可，没想到真正的怪事才出现。它径直驶上水面，车轮滚过海水，竟和在陆地上一样轻快。约翰的马一路驮着他，再也支撑不住，终于累倒在地。他只能悲伤地坐在岸边，看着金马车越来越小，最后消失在海天尽头。

    - id: ch03
      title: 第三章
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            不过，约翰很快又振作起来。他沿着海滩一路寻找，想找到一条船，驾船去追赶公主。可是岸边连一条小船也没有。走了很久以后，他又累又饿，只好在一间渔屋的台阶上坐下休息。屋里有个年轻姑娘正在补网。她见了约翰，便请他进来，又端上葡萄酒和炸鱼。约翰吃饱喝足，心里总算舒服了一些。姑娘生得很美，皮肤白得像海鸥胸前的羽毛，邻居便叫她“海鸥”。可约翰满心都是公主的绿眼睛，根本没留意眼前的姑娘。
        - id: ch03-b02
          speaker: narrator
          text: >-
            吃饱以后，他从离开战场讲起，把古堡、三次沉睡和追到海边的遭遇全都说了一遍。海鸥姑娘听完，十分同情这个疲惫的小士兵。
        - id: ch03-b03
          speaker: seagull
          text: >-
            上星期打鱼时，我的网忽然沉得拉不动。里面有只大铜罐，罐口用铅封着。我把它放在火上，等铅稍稍熔化，就用刀打开，取出一件红布斗篷和一只装着五十枚克朗的钱袋。斗篷现在盖在床上，钱本来要留作我的嫁妆。你都拿去吧。最近的海港有船开往低地国，等你做了国王，再还我那五十枚克朗。
        - id: ch03-b04
          speaker: john
          text: >-
            等我做了低地国的国王，一定请你当王后的侍女。你的心肠和模样一样美。再见了。
        - id: ch03-b05
          speaker: narrator
          text: >-
            海鸥姑娘告别约翰，又回到海边打鱼。约翰把红斗篷紧紧裹在身上，躺到一堆干草上。他没有立刻动身，只在那里回想着一路遇见的种种怪事。想着想着，他忽然说出了心里的愿望。
        - id: ch03-b06
          speaker: john
          text: 要是我现在就在低地国的都城，那该多好！

    - id: ch04
      title: 第四章
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            话音刚落，小士兵就站在了一座辉煌的宫殿前。他揉揉眼，又掐掐自己，确定不是做梦，便向门前一个抽烟斗的男人问路。
        - id: ch04-b02
          speaker: john
          text: 请问，这是什么地方？
        - id: ch04-b03
          speaker: palace_smoker
          text: 什么地方？你自己看呀，当然是国王的宫殿前面。
        - id: ch04-b04
          speaker: john
          text: 是哪一位国王？
        - id: ch04-b05
          speaker: palace_smoker
          text: 还能是哪一位？低地国国王！
        - id: ch04-b06
          speaker: narrator
          text: >-
            男人说完便笑起来，以为自己遇上了疯子。可约翰也觉得这件事实在奇怪。他为人诚实，一想到海鸥姑娘会以为他偷走了斗篷和钱袋，心里就很不安，只想尽快把东西送还。这时，他终于明白，斗篷藏着一种魔力，能把披着它的人随心所欲地送到任何地方。为了确定自己的猜想，他又许愿去城里最好的客店，转眼果真到了那里。这个发现叫他欣喜不已。他吩咐店里送上晚饭，见天色已经太晚，不便进宫拜见国王，便先上床休息。
        - id: ch04-b07
          speaker: narrator
          text: >-
            第二天，全城的房屋挂满鲜花和彩旗，所有教堂都在鸣钟。原来国王失踪的女儿吕多维娜已经归来，马上要凯旋进城。约翰决定站在门口，看她是否还认得自己。金马车很快驶来，戴着金冠的公主坐在国王和王后身旁。她无意间看见约翰，脸色一白，立刻转过头去。
        - id: ch04-b08
          speaker: narrator
          text: >-
            约翰心里犯起嘀咕。公主是没有认出自己，还是因为他连续三次错过约定，正在生他的气？他跟着人群一直来到宫殿。等国王一家进入宫门，他便告诉卫兵，自己正是解救公主的人，现在要面见国王。可是，他越说得认真，卫兵越相信他疯了，任凭他怎样解释，也不肯让他跨过宫门。
        - id: ch04-b09
          speaker: narrator
          text: >-
            小士兵气坏了，觉得非抽袋烟才能平静，于是走进酒馆，要了一品脱啤酒。他认定，坏事就坏在自己戴着一顶寒酸的士兵头盔。若有钱打扮得像宫廷贵族那样气派，谁还会把他挡在外面？可惜，海鸥姑娘给的五十枚克朗应该已经所剩无几。他掏出钱袋一数，里面却仍有整整五十枚。付过啤酒钱再数，还是五十枚。他特意拿走五枚，第三次细细数过，一枚也没少。约翰索性把钱袋完全倒空，再把袋口合上。等他重新打开，里面照样装满了五十枚克朗。
        - id: ch04-b10
          speaker: narrator
          text: >-
            约翰立刻有了主意。他找到宫廷裁缝，让人赶制一件蓝天鹅绒斗篷和一件背心，两件都要绣满珍珠。他又去找造车匠，要对方仿照公主的座驾打造一辆金马车。只要两人做得够快，他愿意付双倍酬劳。几天后，约翰终于坐着新车驶过全城。车前套着六匹白马，车后站着四个衣着华丽的仆从。约翰身穿蓝天鹅绒礼服，手握蜡菊，臂系丝巾。他绕城走了一圈又一圈，沿途不停向左右撒钱。第三次经过宫殿窗下，他看见吕多维娜掀起窗帘一角，躲在后面偷偷向外张望。

    - id: ch05
      title: 第五章
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            到了第二天，全城再也没有别的话题。人人都在议论那位坐着华丽马车、一路分撒钱币的富贵老爷。这些话很快传进宫廷。王后一向好奇，听说以后，更是一心想见见这位了不得的王子。
        - id: ch05-b02
          speaker: king
          text: 那就请他进宫，陪我打牌吧。
        - id: ch05-b03
          speaker: narrator
          text: >-
            这回，小国王没有错过约定，准时来到宫中。国王叫人取来纸牌，两人坐下，一连玩了六盘。每一盘都是约翰输，赌注则是五十枚克朗。他每回都把钱袋倒空，可那只袋子转眼又会装满。第六次看见这个奇景，国王、王后和公主再也忍不住了。
        - id: ch05-b04
          speaker: king
          text: 这实在太奇妙了！
          emotion: surprised
        - id: ch05-b05
          speaker: queen
          text: 简直叫人不敢相信！
          emotion: surprised
        - id: ch05-b06
          speaker: ludovine
          text: 真让人摸不着头脑！
          emotion: surprised
        - id: ch05-b07
          speaker: john
          text: 可再怎么稀奇，也比不上公主变成一条蛇。
        - id: ch05-b08
          speaker: king
          text: 住口！
          emotion: angry
        - id: ch05-b09
          speaker: john
          text: 我提起这件事，是想告诉诸位，站在这里的就是从妖怪手中救出公主的人。她当时还答应嫁给我。
        - id: ch05-b10
          speaker: king
          text: 吕多维娜，他说的是真的吗？
        - id: ch05-b11
          speaker: ludovine
          text: 是真的。可我也告诉过救我的人，要在马车经过时准备好跟我走。我去了三次，他每回都睡得太沉，谁也叫不醒。
        - id: ch05-b12
          speaker: king
          text: 那么，你叫什么名字？是什么出身？
        - id: ch05-b13
          speaker: john
          text: 我叫约翰，是个士兵，父亲是船夫。
        - id: ch05-b14
          speaker: king
          text: 你不配做我女儿的丈夫。不过，只要把钱袋送给我们，我可以让她嫁给你。
        - id: ch05-b15
          speaker: john
          text: 这钱袋不是我的，我不能把它送人。
        - id: ch05-b16
          speaker: ludovine
          text: 那就借给我吧，等到我们举行婚礼那天再还你。
        - id: ch05-b17
          speaker: narrator
          text: 公主又用那种约翰无法抗拒的眼神看着他。
        - id: ch05-b18
          speaker: john
          text: 婚礼定在什么时候？
        - id: ch05-b19
          speaker: king
          text: 就在复活节。
        - id: ch05-b20
          speaker: ludovine
          text: 恐怕要等到铁树开花吧。
        - id: ch05-b21
          speaker: narrator
          text: >-
            公主声音很低，约翰没有听见，就让她拿走了钱袋。第二天傍晚，他来陪国王玩皮克牌，也想向公主献殷勤，却听说国王下乡收地租去了。隔日再来，回答仍然一样。他要见王后，宫里又说王后头痛。连续碰壁五六次以后，约翰终于明白，他们一直在戏弄他。
        - id: ch05-b22
          speaker: john
          text: 国王哪能这样做事，这个老无赖！等等，我怎么忘了红斗篷？有它在，我想什么时候进去都行。
        - id: ch05-b23
          speaker: narrator
          text: 当晚，他裹着红斗篷来到宫殿前。二楼一扇窗户亮着灯，公主的影子映在窗帘上。
        - id: ch05-b24
          speaker: john
          text: 我要到吕多维娜公主的房间里去。
        - id: ch05-b25
          speaker: narrator
          text: 眨眼之间，他已站在房中。吕多维娜坐在桌边，正数着从无底钱袋里倒出的金币。
        - id: ch05-b26
          speaker: ludovine
          text: 八百五十，九百，九百五十……
        - id: ch05-b27
          speaker: john
          text: 一千。诸位晚上好！
        - id: ch05-b28
          speaker: narrator
          text: 公主猛然跳起，吓得短促地尖叫一声。
        - id: ch05-b29
          speaker: ludovine
          text: 你怎么会在这里？谁准你进来的？马上出去，不然我就叫人了！
          emotion: fearful
        - id: ch05-b30
          speaker: john
          text: 我是来提醒你遵守诺言的。后天就是复活节，我们该准备婚礼了。
        - id: ch05-b31
          speaker: narrator
          text: 吕多维娜听了，忽然放声大笑。
        - id: ch05-b32
          speaker: ludovine
          text: 我们的婚礼？你真傻到以为低地国国王的女儿会嫁给船夫的儿子？
        - id: ch05-b33
          speaker: john
          text: 那就把钱袋还给我。
        - id: ch05-b34
          speaker: ludovine
          text: 绝不还你。
        - id: ch05-b35
          speaker: narrator
          text: 她若无其事地把钱袋塞进口袋。
        - id: ch05-b36
          speaker: john
          text: 随你吧，笑到最后的人才笑得最好。我要我们一起到世界尽头去！
        - id: ch05-b37
          speaker: narrator
          text: 小士兵把公主紧紧抱住，一眨眼，两人已经到了世界尽头。他把她轻轻放在一棵树下。公主仍旧头晕目眩，一时还没回过神来。
        - id: ch05-b38
          speaker: john
          text: 呼，我从没走过这么远的路。夫人，你觉得这一趟怎么样？
        - id: ch05-b39
          speaker: narrator
          text: 吕多维娜知道现在不是说笑的时候，没有回答。

    - id: ch06
      title: 第六章
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            低地国国王算不上讲道义，他的女儿也和他一样。吕多维娜正因如此才被变成蛇。预言说，一个小士兵会救她，而她必须嫁给那个人，除非他连续三次错过约定。狡猾的公主早就照着预言布好了圈套。古堡里的金色美酒、那束蜡菊，还有花色丝巾，都能让人睡得像死去一样。约翰三次沉睡，原因就在这里。
        - id: ch06-b02
          speaker: narrator
          text: 即使被带到世界尽头，吕多维娜也没有慌张。她换上最温柔讨好的语气。
        - id: ch06-b03
          speaker: ludovine
          text: 我原以为你只是个街头流浪汉，没想到你比任何国王都强大。钱袋还给你。我的丝巾和花束还在吗？
        - id: ch06-b04
          speaker: john
          text: 都在我这里。
        - id: ch06-b05
          speaker: narrator
          text: 约翰见她突然软下来，十分高兴，便从怀里掏出花束和丝巾。吕多维娜把花别进他的扣眼，又把丝巾系回他手臂。
        - id: ch06-b06
          speaker: ludovine
          text: 从现在起，你就是我的主人。只要你想，我随时都能嫁给你。
        - id: ch06-b07
          speaker: john
          text: 原来你比我以为的更善良。我爱你，绝不会叫你受委屈。
        - id: ch06-b08
          speaker: ludovine
          text: 那么，我的小丈夫，你怎么能这么快把我带到世界尽头？
        - id: ch06-b09
          speaker: narrator
          text: 小士兵挠着头，不知道她是真心要嫁，还是又在骗他。可公主把声音放得更加温柔。
        - id: ch06-b10
          speaker: ludovine
          text: 你就不能告诉我吗？
        - id: ch06-b11
          speaker: narrator
          text: 约翰无法拒绝。他想，只要不把斗篷交出去，说出秘密也没有关系，便告诉她红斗篷有什么魔力。
        - id: ch06-b12
          speaker: ludovine
          text: 哎呀，我实在累坏了。我们先睡一会儿吧，醒来再商量今后的打算。
        - id: ch06-b13
          speaker: narrator
          text: >-
            公主躺在草地上，约翰也跟着躺下，把头枕在系着丝巾的左臂上，很快就睡熟了。吕多维娜却眯着一只眼观察他。鼾声刚响，她便解开斗篷，轻轻从他身下抽出，披到自己身上，又拿走他口袋里的钱袋。
        - id: ch06-b14
          speaker: ludovine
          text: 我要回到自己的房间。
        - id: ch06-b15
          speaker: narrator
          text: 话音落下，她便带着斗篷和钱袋消失了。

    - id: ch07
      title: 第七章
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: >-
            二十四小时后，约翰终于醒来。他没了钱袋，没了斗篷，也没了公主，觉得自己蠢透了。他扯头发，捶胸口，踩烂花束，还把骗子的丝巾撕得粉碎。更糟的是，他饿得厉害，身边却没有食物。他想遍祖母小时候讲给他的神奇故事，没有一个能帮忙。绝望之中，他抬起头，发现身旁原来是一棵结满金黄果子的李树。
        - id: ch07-b02
          speaker: john
          text: 只好吃李子了。打仗时什么手段都算公平。
        - id: ch07-b03
          speaker: narrator
          text: >-
            约翰爬上树，才吃下两颗，额头上便像有什么东西往外冒。他伸手一摸，竟然长出了两只角。他跳下树，冲到附近的小溪边。水面清清楚楚映出一对可爱的小角，若长在山羊头上，倒是十分体面。小士兵这下泄了气。
        - id: ch07-b04
          speaker: john
          text: 被一个女人欺骗还不算，魔鬼也来插手，把他的角借给我。我要是这副模样回去见人，不知会被笑成什么样！
        - id: ch07-b05
          speaker: narrator
          text: >-
            他还是很饿，反正祸已经闯下，便爬上另一棵树，摘了两颗鲜绿的李子。果子一咽下，两只角立刻消失了。约翰又惊又喜，明白人不能太早绝望。等他吃饱，一个主意冒了出来。
        - id: ch07-b06
          speaker: john
          text: >-
            这些李子也许能帮我从恶毒的公主手里拿回钱袋、斗篷，还有我的心。她已经有母鹿一样的眼睛，我再送她一对鹿角。只要她长出角来，我敢打赌，自己绝不会再想娶她了。长角的姑娘可谈不上好看。
        - id: ch07-b07
          speaker: narrator
          text: >-
            约翰找来长长的柳条，亲手编成一只篮子，再把黄色和绿色两种李子分开放好，小心护着每一颗果子。随后，他徒步走了许多天，身边没有别的食物，只能采摘路旁的浆果充饥。一路上，他多次遇到野兽，也遇到过蛮横凶狠的人，几次身陷险境。可他什么都不怕，唯一担心的就是篮中李子会腐烂。奇怪的是，那些果子始终新鲜。最终，他来到一个文明的国度，卖掉逃离公主那晚随身携带的几件珠宝，用钱买下一张前往低地国的船票。一年零一天以后，他终于回到王国的都城。

    - id: ch08
      title: 第八章
      blocks:
        - id: ch08-b01
          speaker: narrator
          text: >-
            第二天，约翰粘上假胡子，打扮成椰枣商人，把一张小桌摆在教堂门前。他在洁白的布上铺开黄李子。果子新鲜得像刚从树上摘下。公主走出教堂时，他立刻捏起嗓子叫卖。
        - id: ch08-b02
          speaker: john
          text: 上好的李子！又鲜又美的李子！
        - id: ch08-b03
          speaker: ludovine
          text: 这些李子怎么卖？
        - id: ch08-b04
          speaker: john
          text: 每颗五十枚克朗。
        - id: ch08-b05
          speaker: ludovine
          text: >-
            五十枚一颗？它们到底有什么珍贵的地方？能让人更聪明，还是能让人更漂亮？
        - id: ch08-b06
          speaker: john
          text: >-
            美丽的公主，您的容貌已经完美，当然不可能再变美了。不过，这些果子也许能给您添上点别的东西。
        - id: ch08-b07
          speaker: narrator
          text: >-
            滚石不生苔，却有时能越磨越光。约翰在世上漂泊的几个月并没白过，这句恭维说得十分漂亮，公主听了果然很受用。
        - id: ch08-b08
          speaker: ludovine
          text: 那会给我添上什么呢？
        - id: ch08-b09
          speaker: john
          text: 您尝过自然就知道了。那一定会叫您大吃一惊。
        - id: ch08-b10
          speaker: narrator
          text: >-
            吕多维娜的好奇心全被勾了起来。她掏出钱袋，篮子里有多少颗李子，便倒出多少堆五十枚克朗。约翰真想一把夺回钱袋，当众揭穿这个小偷，可他忍住了。李子卖光后，他收摊卸妆，换了客店，躲起来等着看结果。
        - id: ch08-b11
          speaker: narrator
          text: >-
            公主一路带着新买的李子回到宫中。她刚走进自己的房间，就迫不及待地甩掉兜帽，从篮子里挑出两颗果子。
        - id: ch08-b12
          speaker: ludovine
          text: 现在就看看，这些好李子能给我的美貌添上什么。
        - id: ch08-b13
          speaker: narrator
          text: >-
            两颗果子刚下肚，她便感觉额头上有什么东西长了出来。她冲到镜前，看到两只角，顿时发出一声刺耳的尖叫。
        - id: ch08-b14
          speaker: ludovine
          text: >-
            角！原来他答应给我添上的是角！马上把那个卖李子的找来！割掉他的鼻子和耳朵，活剥他的皮，或者用慢火烧死，再把骨灰撒进风里！我简直要羞愤而死了！
          emotion: angry
        - id: ch08-b15
          speaker: narrator
          text: >-
            侍女们听见尖叫，全都赶到她身边。她们抓住那两只角，用尽力气拉扯，角却纹丝不动，只害得公主头痛欲裂。国王得知以后，立刻派传令官四处宣布，谁能除去公主头上这两件怪装饰，谁就可以娶她为妻。低地国和邻近王国的医生、巫师、外科大夫听见消息，纷纷涌进宫里，每个人都带着自创的疗法。可试来试去，没有一种管用，公主反而被他们折磨得苦不堪言。
        - id: ch08-b16
          speaker: narrator
          text: >-
            国王只好再发告示，谁自称能治好公主，最后却失败，就要吊死在最近的树上。可公主这份奖赏实在诱人，还是有求婚者不断上门。那一年，低地国每一座果园结出的果实，都是一个个死人。

    - id: ch09
      title: 第九章
      blocks:
        - id: ch09-b01
          speaker: narrator
          text: >-
            国王早已命人四处搜捕那个李子商，城里城外都查遍了，可无论怎样费力，还是看不到他的影子。约翰一直躲着，等到众人的耐性耗得差不多了，才把绿西梅的汁液挤进一只小药瓶。他买来医生穿的长袍，又戴上一顶假发和一副眼镜，把自己装扮妥当，然后进宫求见国王。他自称是从遥远国度来的名医，只要能和公主单独相处，便保证治好她。
        - id: ch09-b02
          speaker: king
          text: >-
            又来了一个铁了心要上绞架的疯子。好吧，照他说的办。脖子已经套进绳圈的人，提什么要求都可以答应。
        - id: ch09-b03
          speaker: narrator
          text: >-
            小士兵单独见到公主，把几滴药汁倒进杯子。吕多维娜刚尝一口，两只角的尖端就不见了。
        - id: ch09-b04
          speaker: john
          text: >-
            原本应该全消失的，可您身上似乎有东西在抵消药效。这药只能治好灵魂像我手掌一样干净的人。您真的没犯过一点小错吗？仔细想一想。
        - id: ch09-b05
          speaker: narrator
          text: >-
            吕多维娜不用多想就知道答案。可要她低头认罪，实在羞耻。她在这份羞耻和摆脱双角的渴望之间挣扎许久，终于垂下眼睛开口。
        - id: ch09-b06
          speaker: ludovine
          text: 我偷过一个小士兵的皮钱袋。
        - id: ch09-b07
          speaker: john
          text: 把它交给我。钱袋不到我手里，药就不会起效。
        - id: ch09-b08
          speaker: narrator
          text: >-
            要她交出这只取之不尽的钱袋，实在叫公主心疼极了。可她转念想到，如果头上的角永远留着，拥有再多财富也没有福气享用。她只好长长叹了一口气，把钱袋递到医生手里。假医生接过以后，又往杯中加入一些药汁。公主连忙喝下去，再对镜一看，两只角果然都缩短了一半。
        - id: ch09-b09
          speaker: john
          text: >-
            您的良心上肯定还压着另一桩小错。除了钱袋，您没有拿走那个士兵别的东西吗？
        - id: ch09-b10
          speaker: ludovine
          text: 我还偷了他的斗篷。
        - id: ch09-b11
          speaker: john
          text: 那也交给我。
        - id: ch09-b12
          speaker: ludovine
          text: 斗篷就在这里。
        - id: ch09-b13
          speaker: narrator
          text: >-
            吕多维娜交出斗篷，心里却另有打算。只要双角彻底消失，她就立刻叫来侍从，用武力把钱袋和斗篷从医生手里强抢回来。她越想越觉得这个办法稳妥，正暗暗得意，假医生忽然把红斗篷往身上一裹，又甩掉假发和眼镜。出现在女骗子眼前的，正是小士兵约翰的面孔。吕多维娜吓得浑身僵住，连一个字也说不出来，只能呆呆站在他面前。
        - id: ch09-b14
          speaker: john
          text: >-
            我本可以让你一辈子顶着这对角。不过，我是个厚道人，也曾经爱过你。再说，你已经那么像魔鬼，根本不需要他的角。

    - id: ch10
      title: 第十章
      blocks:
        - id: ch10-b01
          speaker: narrator
          text: >-
            约翰披着斗篷许下愿望，来到了海鸥姑娘的屋里。姑娘正坐在窗边补网，目光不时飘向海上，仿佛一直在等谁。听到动静，她抬头看见小士兵，脸立刻红了。
        - id: ch10-b02
          speaker: seagull
          text: 原来是你！你怎么回来的？你已经娶了那位公主吗？
        - id: ch10-b03
          speaker: narrator
          text: >-
            约翰把后来发生的一切都讲给她听，最后归还了钱袋和斗篷。
        - id: ch10-b04
          speaker: seagull
          text: >-
            我要这些宝物还有什么用？你的经历已经让我明白，拥有财宝并不会让人幸福。
        - id: ch10-b05
          speaker: john
          text: >-
            幸福来自劳动，也来自一个诚实女人的爱。亲爱的海鸥姑娘，你愿意嫁给我吗？
        - id: ch10-b06
          speaker: narrator
          text: >-
            小士兵这时才第一次发现，她的眼睛原来那么美。他说完，向姑娘伸出了手。海鸥姑娘的脸红得更厉害了。
        - id: ch10-b07
          speaker: seagull
          text: >-
            我愿意。不过有一个条件。我们要把钱袋和斗篷重新封进铜罐，再把铜罐扔进海里。
        - id: ch10-b08
          speaker: narrator
          text: >-
            于是，他们把两件宝物封回铜罐，一起抛进大海。这个故事，是夏尔·德兰讲给我们的。
