  chapters:
    - id: ch01
      title: I
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a brave little soldier coming home from the war. He had lost neither an arm nor a leg, but the fighting was over and the army had been sent away. So he returned to the village where he was born. His real name was John, though all his friends called him the Kinglet. No one knew why.
        - id: ch01-b02
          speaker: narrator
          text: John had no father or mother waiting for him, so he walked along quietly, with his knapsack on his back and his sword at his side. One evening, he reached for his matchbox to light his pipe and discovered, to his great annoyance, that it was gone. A little farther on, he saw a light among the trees. It came from an old castle whose door stood open.
        - id: ch01-b03
          speaker: narrator
          text: He entered the courtyard and peered through a window. A great fire blazed at the far end of a low hall, but he could see no one beside it. John put away his pipe and went to the door. Since the place was open and lighted, he hoped whoever lived there would not begrudge a traveler one glowing coal. He knocked gently and called through the door.
        - id: ch01-b04
          speaker: john
          text: Could you spare me a light, please?
        - id: ch01-b05
          speaker: narrator
          text: No one answered. He waited, knocked harder, and still heard nothing. At last he lifted the latch. The hall was empty. John went straight to the hearth, picked up the tongs, and bent toward a glowing coal. Then came a sharp click, like a spring snapping loose. Right in the flames, an enormous serpent rose until its face was close to his. Stranger still, it had the head of a woman.
        - id: ch01-b06
          speaker: narrator
          text: Many men would have run for their lives. John stepped back only once and closed his hand around his sword.
        - id: ch01-b07
          speaker: ludovine
          text: Do not draw it. I have been waiting for you. You are the one who must set me free.
        - id: ch01-b08
          speaker: john
          text: Who are you?
        - id: ch01-b09
          speaker: ludovine
          text: I am Ludovine, daughter of the King of the Low Countries. Free me, and I will marry you. I will make you happy for the rest of your life.
        - id: ch01-b10
          speaker: narrator
          text: A serpent with a woman's head might have frightened some people, but not the Kinglet. Ludovine's long green eyes held him as a snake's eyes hold a little bird. Golden hair floated around a face as lovely as an angel's, though below it she still had the body of a serpent.
        - id: ch01-b11
          speaker: john
          text: Tell me what I have to do.
        - id: ch01-b12
          speaker: ludovine
          text: Open that door and cross the gallery. At the far end is another room like this one. Beyond it, you will find a closet. Bring me the tunic inside.
        - id: ch01-b13
          speaker: narrator
          text: John crossed the gallery safely. In the next room, starlight showed him eight hands floating level with his face, ready to strike. There were no bodies attached to them. He ducked his head and charged through a storm of blows, answering with both fists. He reached the closet, seized the tunic, and carried it back.
        - id: ch01-b14
          speaker: john
          text: Here it is. Those hands made me work for it.
        - id: ch01-b15
          speaker: narrator
          text: The flames clicked apart again. Ludovine now had a woman's form down to her waist. She pulled on the orange velvet tunic, magnificent with pearls that were not as white as her neck.
        - id: ch01-b16
          speaker: ludovine
          text: There is more to do. Go back to the gallery and take the stairs on the left. In the second room upstairs, another closet holds my skirt. Bring it to me.
        - id: ch01-b17
          speaker: narrator
          text: John went back through the gallery and climbed the staircase on the left. In the second room, he found eight whole arms instead of floating hands. Each arm swung a huge stick at him. There was no time to duck and fight with his fists now. He drew his sword at once and cut his way between them so fiercely that he escaped with scarcely a scratch. In the closet he found the promised skirt, made of silk as blue as the skies of Spain. He carried it down to the fire. When Ludovine appeared again and put it on, she had become a woman as far as her knees.
        - id: ch01-b18
          speaker: john
          text: Here is your skirt.
        - id: ch01-b19
          speaker: ludovine
          text: Now I need only my shoes and stockings. They are in the closet on the second story.
        - id: ch01-b20
          speaker: narrator
          text: On the second story, eight goblins waited with hammers in their hands and flames shooting from their eyes. John stopped at the threshold. This danger was worse than the others. If he attacked with his sword, those hammers would smash it like glass, and unless he found another weapon, he would be killed. Then his eyes fell on the door itself. It was thick, heavy oak. He wrenched it from its hinges, raised it over his head like a shield, and went straight at the goblins. The great door crushed them beneath it. John opened the closet, found the shoes and stockings, and carried them safely to Ludovine. The moment she put them on, the last of the serpent vanished, and she became a woman from head to foot.
        - id: ch01-b21
          speaker: narrator
          text: Dressed in white silk stockings and little blue slippers dotted with red jewels, Ludovine turned to the man who had freed her.
        - id: ch01-b22
          speaker: ludovine
          text: You must leave now and never return to this castle, whatever happens. Take this purse of two hundred ducats. Sleep tonight at the inn on the edge of the wood and wake early. At nine tomorrow morning, my carriage will pass the door, and I will take you with me.
        - id: ch01-b23
          speaker: john
          text: Why can we not leave together now?
        - id: ch01-b24
          speaker: ludovine
          text: The proper time has not come. Before you go, drink my health in this wine.
        - id: ch01-b25
          speaker: narrator
          text: She filled a crystal goblet with something that shone like melted gold. John drank it, lit his pipe, and went away.
    - id: ch02
      title: II
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: At the inn, John ordered supper. He had barely begun to eat when sleep pulled at him with all its strength.
        - id: ch02-b02
          speaker: john
          text: I must be far more tired than I knew. Be sure to wake me at eight tomorrow morning.
        - id: ch02-b03
          speaker: narrator
          text: He went to bed and slept like a dead man. They tried to wake him at eight, then at half past eight, and again at a quarter to nine. Nothing worked, so at last they left him alone. The clocks were striking noon when he woke. He sprang from bed, hardly stopped to dress, and hurried downstairs to ask whether anyone had called for him.
        - id: ch02-b04
          speaker: landlady
          text: A beautiful princess came in a golden coach. She left this bouquet for you. She says she will pass again tomorrow morning at eight.
        - id: ch02-b05
          speaker: narrator
          text: John cursed his sleep, then tried to comfort himself with the bouquet of immortelles. He remembered that they were the flowers of remembrance, though he forgot that they were also flowers of the dead.
        - id: ch02-b06
          speaker: narrator
          text: When night came, John tried to sleep with one eye open. He started awake perhaps twenty times in an hour, afraid that morning would pass without him. At the first birdsong, he could bear the bed no longer. He climbed through his window and into the branches of a great lime tree outside the inn. Surely he could keep watch from there. But he sat gazing dreamily at the bouquet in his hand until his eyes closed. Once he was asleep, nothing could reach him. Not the bright sun, not the birds singing around him, not the clatter of Ludovine's golden coach, and not the landlady shouting his name in every place she could think to search.
        - id: ch02-b07
          speaker: narrator
          text: At noon, John opened his eyes. His heart sank when he climbed down and saw the table being laid for dinner.
        - id: ch02-b08
          speaker: john
          text: Did the Princess come again?
        - id: ch02-b09
          speaker: landlady
          text: Yes, she did. She left this flower-colored scarf. She will pass tomorrow at seven, but she says it will be the last time.
        - id: ch02-b10
          speaker: narrator
          text: John was sure he had been bewitched. He tied the strangely scented scarf around his left arm. This time he would not go to bed at all. He paid his bill, bought a horse with the money he had left, and spent the evening mounted before the inn door.
        - id: ch02-b11
          speaker: narrator
          text: Now and then he bent to breathe in the scarf's sweet perfume. He did it once too often. His head sank onto the horse's neck, and soon horse and rider were snoring together. When Ludovine arrived, people shook John, struck him, and shouted in his ear. Neither he nor the horse stirred until the golden coach was disappearing far down the road.
        - id: ch02-b12
          speaker: john
          text: Stop! Please, stop!
        - id: ch02-b13
          speaker: narrator
          text: John drove in his spurs and chased the coach for a day and a night, yet never gained a single step. Villages and towns fell behind them until they reached the sea. The coach did not stop. It rolled over the water as easily as over land. John's faithful horse collapsed with exhaustion, and the little soldier sat sadly on the shore while the coach faded into the horizon.
    - id: ch03
      title: III
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: John did not sit in sorrow forever. Before long, he gathered his courage and walked along the beach, searching for a boat in which he might follow Ludovine. He searched until he was tired and hungry, but there was no boat anywhere. At last he rested on the steps of a fisherman's hut. Inside, a young woman sat mending a net. She saw the weary stranger, invited him in, and placed wine and fried fish before him. John ate and drank until he felt comforted. Then he told her about the castle, the serpent princess, the three meetings he had slept through, and the golden coach that had crossed the sea beyond his reach.
        - id: ch03-b02
          speaker: narrator
          text: The fisher girl was very pretty, with skin as white as a gull's breast, so her neighbors called her the Seagull. John scarcely noticed her. His thoughts were still with Ludovine's green eyes. When his story ended, the Seagull pitied him.
        - id: ch03-b03
          speaker: seagull
          text: Last week, my fishing net suddenly grew very heavy. When I pulled it in, I found a large copper vessel sealed with lead. I heated it until the lead softened, opened it with my knife, and drew out a red mantle and a purse holding fifty crowns. The mantle is covering my bed, and I saved the money for my marriage portion. Take both. Go to the nearest port and find a ship for the Low Countries. When you become King, you can return my fifty crowns.
        - id: ch03-b04
          speaker: john
          text: When I am King of the Low Countries, I will make you lady-in-waiting to the Queen. You are as good as you are beautiful. Farewell.
        - id: ch03-b05
          speaker: narrator
          text: The Seagull returned to her fishing. John wrapped himself in the mantle and lay on a heap of dry grass, thinking about all the strange things that had befallen him. Then a wish burst from his lips.
        - id: ch03-b06
          speaker: john
          text: Oh, how I wish I were in the capital of the Low Countries!
    - id: ch04
      title: IV
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: In an instant, John stood before a splendid palace. He rubbed his eyes, pinched himself, and made certain he was awake. A man stood smoking his pipe near the door.
        - id: ch04-b02
          speaker: john
          text: Where am I?
        - id: ch04-b03
          speaker: palace_man
          text: Where are you? Why, right in front of the King's palace. Can you not see it?
        - id: ch04-b04
          speaker: john
          text: Which king?
        - id: ch04-b05
          speaker: palace_man
          text: The King of the Low Countries, of course!
        - id: ch04-b06
          speaker: narrator
          text: The man laughed, thinking John must be mad. John could scarcely believe what had happened. One wish had carried him across the sea and set him at the very palace he had been trying to reach. But another thought soon troubled his honest heart. The Seagull had trusted him with her marriage money and the strange red mantle. If he simply vanished, she might believe he had stolen them both. He began wondering how he could return them as quickly as possible. Then the truth about the mantle came to him. It must contain a hidden charm that carried its wearer from place to place at will. To make certain, he wished himself into the best inn in the city. Before he could take another step, he was standing there.
        - id: ch04-b07
          speaker: narrator
          text: Delighted, he ordered supper. It was too late to call at the palace, so he slept. The next morning, flowers and flags covered every house, and all the church bells rang. Princess Ludovine had been found and was about to enter the city in triumph. John decided to stand at the inn door and see whether she recognized him.
        - id: ch04-b08
          speaker: narrator
          text: John had scarcely finished dressing when Ludovine's golden coach rolled past the inn. She wore a golden crown, and the King and Queen sat beside her while the celebrating crowd pressed close around them. By chance, her eyes fell directly on the little soldier. She recognized something, for her face went pale, but she turned her head away at once. John could not understand it. Perhaps his fine surroundings had kept her from knowing him. Or perhaps she knew him perfectly well and was angry because he had slept through every meeting she offered.
        - id: ch04-b09
          speaker: narrator
          text: He followed the crowd to the palace and told the guards that he had rescued the Princess and wanted to see the King. The more he explained, the more certain they became that he was mad. They would not admit him.
        - id: ch04-b10
          speaker: narrator
          text: Furious, John went to a tavern for a beer and a soothing pipe. His poor soldier's helmet was the trouble, he thought. If he had money, he could dress as finely as a court lord. But only a little of the Seagull's fifty crowns remained. He opened the purse and found all fifty still there. After paying, he counted again. There were still fifty. He took out five, emptied the whole purse, and opened it once more. Every time, fifty crowns appeared inside.
        - id: ch04-b11
          speaker: narrator
          text: John went straight to the court tailor and the coachbuilder. He ordered a pearl-embroidered mantle and vest of blue velvet, and a golden coach like Ludovine's. He promised double payment if they worked quickly.
        - id: ch04-b12
          speaker: narrator
          text: The tailor and coachbuilder worked quickly under the promise of double payment. A few days later, six white horses drew John through the city in a coach that glittered like the Princess's own. Four richly dressed servants stood behind it. Inside sat the little soldier, transformed into a grand lord by blue velvet and pearls. He still held the bouquet of immortelles, and Ludovine's flower-colored scarf was bound around his arm. Twice he circled the city, throwing money to the right and left while people ran after the coins. On the third round, he passed beneath the palace windows. High above him, Ludovine quietly lifted one corner of a curtain and peeped out at the splendid stranger.
    - id: ch05
      title: V
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The next day, everyone talked about the wealthy lord who had thrown money from his coach. The story reached the palace. The curious Queen longed to see this marvelous prince.
        - id: ch05-b02
          speaker: king
          text: Very well. Invite him here to play cards with me.
        - id: ch05-b03
          speaker: narrator
          text: This time, the Kinglet arrived exactly when he should. He and the King played six games, and John lost every one. The stake was fifty crowns. Six times he emptied the purse, and six times it filled again at once.
        - id: ch05-b04
          speaker: king
          text: This is amazing!
          emotion: surprised
        - id: ch05-b05
          speaker: queen
          text: It is astonishing!
          emotion: surprised
        - id: ch05-b06
          speaker: ludovine
          text: I cannot understand it!
          emotion: surprised
        - id: ch05-b07
          speaker: john
          text: It is not nearly as hard to understand as your change into a serpent.
        - id: ch05-b08
          speaker: king
          text: Hush. We do not speak of that.
        - id: ch05-b09
          speaker: john
          text: I mention it because I am the man who freed the Princess from the goblins. She promised to marry me.
        - id: ch05-b10
          speaker: king
          text: Ludovine, is that true?
        - id: ch05-b11
          speaker: ludovine
          text: Yes. But I told my rescuer to be ready when my coach passed. I came three times, and every time he slept so deeply that no one could wake him.
        - id: ch05-b12
          speaker: king
          text: What is your name, and who are you?
        - id: ch05-b13
          speaker: john
          text: My name is John. I am a soldier, and my father is a boatman.
        - id: ch05-b14
          speaker: king
          text: You are no proper husband for my daughter. Still, give us that purse, and you may marry her.
        - id: ch05-b15
          speaker: john
          text: The purse belongs to someone else. I cannot give it away.
        - id: ch05-b16
          speaker: ludovine
          text: Then lend it to me until our wedding day.
        - id: ch05-b17
          speaker: john
          text: And when will we be married?
        - id: ch05-b18
          speaker: king
          text: At Easter.
        - id: ch05-b19
          speaker: ludovine
          text: Or when the moon turns blue.
        - id: ch05-b20
          speaker: narrator
          text: Ludovine murmured so softly that John did not hear. He let her take the purse. The following evening, he returned to the palace, expecting another game of cards and a chance to court the Princess. Instead, the servants told him that the King had gone into the country to collect his rents. He returned the next day and heard exactly the same story. Then he asked for the Queen, but she was said to have a headache and could receive no one. He tried again and again. After five or six visits, the excuses no longer fooled him. The royal family had taken the purse and never meant to welcome him back. They were making sport of a soldier they considered beneath them.
        - id: ch05-b21
          speaker: narrator
          text: Then he remembered the red mantle. That evening, he wrapped it around himself outside the palace. A light burned in an upstairs window, and Ludovine's shadow moved across the curtain.
        - id: ch05-b22
          speaker: john
          text: I wish to be inside Princess Ludovine's room.
        - id: ch05-b23
          speaker: narrator
          text: A second later, he was there. Ludovine sat counting coins from the bottomless purse.
        - id: ch05-b24
          speaker: ludovine
          text: Eight hundred and fifty, nine hundred, nine hundred and fifty...
        - id: ch05-b25
          speaker: john
          text: One thousand. Good evening!
        - id: ch05-b26
          speaker: narrator
          text: The Princess jumped and cried out.
        - id: ch05-b27
          speaker: ludovine
          text: You! How dare you come here? Leave at once, or I will call for help!
          emotion: surprised
        - id: ch05-b28
          speaker: john
          text: I came to remind you of your promise. Easter is the day after tomorrow. It is time we prepared for our wedding.
        - id: ch05-b29
          speaker: narrator
          text: Ludovine burst into laughter.
        - id: ch05-b30
          speaker: ludovine
          text: Our wedding? Did you truly think the daughter of the King of the Low Countries would marry a boatman's son?
        - id: ch05-b31
          speaker: john
          text: Then return my purse.
        - id: ch05-b32
          speaker: ludovine
          text: Never.
        - id: ch05-b33
          speaker: narrator
          text: She calmly slipped it into her pocket. John took Ludovine in his arms.
        - id: ch05-b34
          speaker: john
          text: Have it your way. The last laugh is the best one. I wish us both at the ends of the earth!
        - id: ch05-b35
          speaker: narrator
          text: In one instant, John stood at the ends of the earth, still holding the Princess. He gently set her beneath a tree. The journey had left Ludovine dizzy and speechless, and she knew this was no time for joking.
    - id: ch06
      title: VI
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Now, the King of the Low Countries was not troubled by a very strict conscience, and his daughter had inherited his ways. That was the reason Ludovine had been changed into a serpent. Long before John arrived, a prophecy had declared that a little soldier would free her. Once rescued, she would have to marry him, unless he failed to appear at the appointed meeting place three times in succession. Ludovine wanted her human form back, but she had no wish to become a soldier's wife. So while John fought the hands, the arms, and the goblins for her sake, the cunning Princess was already arranging those three failures.
        - id: ch06-b02
          speaker: narrator
          text: The golden wine, the immortelles, and the scented scarf all caused a sleep as deep as death. Each had done its work on John. Yet even now, Ludovine kept her wits.
        - id: ch06-b03
          speaker: ludovine
          text: I took you for a common wanderer, but you are more powerful than any king. Here is your purse. Do you still have my scarf and bouquet?
        - id: ch06-b04
          speaker: john
          text: Yes, I have them here.
        - id: ch06-b05
          speaker: narrator
          text: Delighted by her gentler voice, John drew them from his coat. Ludovine pinned the flowers to him and tied the scarf around his arm.
        - id: ch06-b06
          speaker: ludovine
          text: Now you are my lord and master. I will marry you whenever you please.
        - id: ch06-b07
          speaker: john
          text: You are kinder than I believed. I love you, and I will never let you be unhappy.
        - id: ch06-b08
          speaker: ludovine
          text: Then tell your little wife how you carried me to the ends of the earth so quickly.
        - id: ch06-b09
          speaker: narrator
          text: John scratched his head. Was she sincere, or was she deceiving him again? Ludovine asked once more in such a tender voice that he could not resist. He decided there was no harm in sharing the secret, as long as he kept the mantle. So he told her what the red cloth could do.
        - id: ch06-b10
          speaker: ludovine
          text: Oh, I am so tired. Let us sleep for a while. Afterward, we can decide what to do.
        - id: ch06-b11
          speaker: narrator
          text: Ludovine stretched out on the grass. John lay beside her with his head on the arm that wore the scarf, and he was soon asleep. Ludovine watched through one half-open eye. As soon as he snored, she gently pulled the mantle from beneath him and wrapped it around herself. Then she took the purse from his pocket.
        - id: ch06-b12
          speaker: ludovine
          text: I wish to be back in my own room.
        - id: ch06-b13
          speaker: narrator
          text: In another instant, she vanished.
    - id: ch07
      title: VII
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: John woke twenty-four hours later with no purse, no mantle, and no Princess. Feeling thoroughly foolish, he tore his hair, beat his chest, trampled the bouquet, and ripped the traitorous scarf to pieces. He was also terribly hungry, with nothing at all to eat.
        - id: ch07-b02
          speaker: narrator
          text: John tried to remember every marvelous tale his grandmother had told him when he was a child. Surely one of those stories contained a charm, a warning, or some clever way for an abandoned traveler to get home. But none of them offered him the least help now. He had been carried to the ends of the earth and left without the two treasures that could save him. Despair was closing over him when he happened to look up. The tree beneath which he had slept was a splendid plum tree, and every branch bent under fruit as yellow as gold.
        - id: ch07-b03
          speaker: john
          text: I am going to eat those plums. All is fair in war.
        - id: ch07-b04
          speaker: narrator
          text: He climbed up and began to eat. He had swallowed only two plums when something seemed to grow from his forehead. He reached up and found two horns. John leaped down and ran to a nearby stream. His reflection showed a charming pair of little horns fit for a goat.
        - id: ch07-b05
          speaker: john
          text: Was it not enough for a woman to trick me? Must the devil lend me his horns as well? I cannot go back into the world looking like this!
        - id: ch07-b06
          speaker: narrator
          text: He was still hungry, and the harm was already done. So he boldly climbed another tree and ate two lovely green plums. At once, the horns disappeared. Surprised and overjoyed, John decided that despair had come too quickly.
        - id: ch07-b07
          speaker: narrator
          text: "When he had eaten his fill of the harmless green fruit, a plan came to him. The yellow plums had given him horns, and the green ones had taken them away. Perhaps these pretty fruits could help him recover everything Ludovine had stolen: his purse, his red mantle, and the heart he had foolishly given her. The Princess already had beautiful eyes like a deer. John decided that a pair of deer's horns would complete the likeness. If he could persuade her to eat the yellow fruit, she would be eager to bargain for a cure. And once he saw her horned, he suspected that his desire to marry her would finally disappear."
        - id: ch07-b08
          speaker: narrator
          text: John wove a basket from long willow branches and carefully packed both kinds of plums. For many days he walked onward, living on roadside berries. Wild beasts and savage men put him in great danger, but his only fear was that the plums might spoil. They never did.
        - id: ch07-b09
          speaker: narrator
          text: At last, he reached a settled country. He sold some jewels he had been wearing on the night Ludovine carried him away and bought passage on a ship. A year and a day after his disappearance, he arrived once more in the capital of the Low Countries.
    - id: ch08
      title: VIII
      blocks:
        - id: ch08-b01
          speaker: narrator
          text: The next morning, John put on a false beard and dressed like a date merchant. He carried a small table to the church door and arranged the yellow plums on a fine white cloth. They looked freshly picked. When Ludovine came out of church, he called to the crowd in a disguised voice.
        - id: ch08-b02
          speaker: john
          text: Fine plums! Beautiful, fresh plums!
        - id: ch08-b03
          speaker: ludovine
          text: How much do they cost?
        - id: ch08-b04
          speaker: john
          text: Fifty crowns for each one.
        - id: ch08-b05
          speaker: ludovine
          text: Fifty crowns? What makes them so precious? Will they make a person wiser, or more beautiful?
        - id: ch08-b06
          speaker: john
          text: Nothing could improve beauty as perfect as yours, fair Princess. Still, they might add something.
        - id: ch08-b07
          speaker: narrator
          text: Months of wandering had taught John a little polish, and his neat compliment pleased Ludovine.
        - id: ch08-b08
          speaker: ludovine
          text: And what will they add?
        - id: ch08-b09
          speaker: john
          text: Taste them and you will see. The surprise is part of their charm.
        - id: ch08-b10
          speaker: narrator
          text: Ludovine's curiosity was fully awake now. She drew out the inexhaustible purse and shook out one little heap of fifty crowns for every plum in the basket. At the sight of his own purse in her hands, John felt a wild desire to snatch it away, tear off his false beard, and tell everyone that the King's daughter was a thief. But that would ruin the better plan he had carried for a year and a day. He controlled himself, accepted the coins, and watched her take every yellow plum. Once his basket was empty, he folded his cloth, packed away the little table, and closed his shop. Then he removed the merchant's disguise, moved to a different inn where no one knew him, and waited quietly to learn what would happen.
        - id: ch08-b11
          speaker: ludovine
          text: Now I will see what these marvelous plums can add to my beauty.
        - id: ch08-b12
          speaker: narrator
          text: In her room, she threw off her hood and ate two. All at once, something pushed from her forehead. She rushed to the mirror and screamed.
        - id: ch08-b13
          speaker: ludovine
          text: Horns! So that was his promised surprise! Find that plum seller and bring him here! Cut off his nose and ears! Skin him alive, or burn him slowly and scatter his ashes to the wind! I will die of shame and despair!
          emotion: angry
        - id: ch08-b14
          speaker: narrator
          text: Her attendants rushed in at the sound of her screams. They seized the horns and pulled with all their strength, but could not loosen them at all. Their efforts only gave Ludovine a violent headache. When the King learned what had happened, he sent a herald through the land. The man proclaimed the same offer in every town and village. Whoever could remove the Princess's strange ornaments would receive her hand in marriage.
        - id: ch08-b15
          speaker: narrator
          text: The reward brought doctors, sorcerers, and surgeons pouring into the palace from every corner of the Low Countries and from the neighboring kingdoms as well. Each visitor had a remedy of his own. Some pulled, some cut, and some covered the horns with medicines, but none made them disappear. Ludovine suffered so much under their experiments that the King was forced to discourage less certain healers. He sent out a second proclamation. From then on, anyone who promised a cure and failed would be hanged from the nearest tree.
        - id: ch08-b16
          speaker: narrator
          text: Even that warning could not keep hopeful suitors away from such a prize. That year, the orchards of the Low Countries bore a harvest of dead men.
    - id: ch09
      title: IX
      blocks:
        - id: ch09-b01
          speaker: narrator
          text: The King ordered a search for the plum seller, but no one could find him. When John judged that the palace had lost patience, he squeezed the green plums into a small bottle. Then he bought a doctor's robe, added a wig and spectacles, and presented himself to the King as a famous physician from a distant land. He promised to cure Ludovine if he could see her alone.
        - id: ch09-b02
          speaker: king
          text: Here is another madman eager to be hanged. Very well. A man with a rope around his neck should be refused nothing.
        - id: ch09-b03
          speaker: narrator
          text: Alone with the Princess, the false doctor poured a few drops of green juice into a glass. Ludovine barely tasted it before the tips of her horns disappeared.
        - id: ch09-b04
          speaker: john
          text: They would have vanished completely if something were not working against the cure. My medicine only heals people whose souls are as clean as my palm. Are you certain you have committed no small sin? Think carefully.
        - id: ch09-b05
          speaker: narrator
          text: Ludovine knew the answer at once. She was torn between the shame of confessing and the longing to lose her horns. At last, she lowered her eyes.
        - id: ch09-b06
          speaker: ludovine
          text: I stole a leather purse from a little soldier.
        - id: ch09-b07
          speaker: john
          text: Give it to me. The remedy cannot work until the purse is in my hands.
        - id: ch09-b08
          speaker: narrator
          text: Surrendering the purse cost Ludovine a terrible struggle. It could supply her with gold forever, and she had gone to great trouble to steal it. Yet endless riches would bring little pleasure if she had to appear before the world with horns on her head. At last, the hope of being beautiful again defeated her greed. With a deep sigh, she handed the leather purse to the doctor. John kept his face hidden behind the wig and spectacles, poured more of the green juice into her glass, and watched her drink. This time, the horns drew inward until only half their length remained.
        - id: ch09-b09
          speaker: john
          text: There must be one more sin troubling your conscience. Did you take anything else from that soldier?
        - id: ch09-b10
          speaker: ludovine
          text: I stole his cloak too.
        - id: ch09-b11
          speaker: john
          text: Then give me the cloak.
        - id: ch09-b12
          speaker: ludovine
          text: Here it is.
        - id: ch09-b13
          speaker: narrator
          text: Ludovine planned to summon her attendants as soon as the horns were gone and take everything back by force. While she pleased herself with this plan, the doctor wrapped the cloak around his shoulders, flung off his wig and spectacles, and showed her the face of the Little Soldier. Ludovine stared at him, speechless with fear.
        - id: ch09-b14
          speaker: john
          text: I could have left you wearing those horns for the rest of your life. But I am a good fellow, and once I loved you. Besides, you are already too much like the devil to need his horns.
    - id: ch10
      title: X
      blocks:
        - id: ch10-b01
          speaker: narrator
          text: John wished himself into the Seagull's house. She sat at the window mending her net, and every so often she looked toward the sea as though expecting someone. At the sound of his arrival, she raised her head and blushed.
        - id: ch10-b02
          speaker: seagull
          text: It is really you! How did you come back? And... did you marry your Princess?
        - id: ch10-b03
          speaker: narrator
          text: John sat beside her and told the whole long story. He described the enchanted castle, the three bewitched sleeps, his arrival at Ludovine's court, and the way she stole the purse and mantle after pretending to love him. He told of the horn-growing plums, his disguises as a merchant and a doctor, and his last meeting with the faithless Princess. When the tale was done, he placed the inexhaustible purse and the red mantle in the Seagull's hands, returning at last what she had lent him.
        - id: ch10-b04
          speaker: seagull
          text: What would I do with these now? You have shown me that treasures do not bring happiness.
        - id: ch10-b05
          speaker: john
          text: Happiness comes from work and the love of an honest woman.
        - id: ch10-b06
          speaker: narrator
          text: For the first time, John noticed how pretty the Seagull's eyes were. He held out his hand.
        - id: ch10-b07
          speaker: john
          text: Dear Seagull, will you marry me?
        - id: ch10-b08
          speaker: seagull
          text: Yes, I will. But only if we seal the purse and the mantle inside the copper vessel and throw it into the sea.
        - id: ch10-b09
          speaker: narrator
          text: And that is exactly what they did.
