audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，像编书人面对孩子娓娓而谈
        timbre: 温暖清朗
        pace: 舒缓而有自然起伏
        pitch: 中音
    queen_balanice:
      display_name: 巴拉妮丝王后
      tts:
        delivery: 优雅温柔，悲喜都真挚而坦率
        timbre: 温暖端庄
        pace: 适中
        pitch: 中音
    rose_maiden_1:
      display_name: 第一位农家姑娘
      tts:
        delivery: 温柔恭敬，吐字轻盈
        timbre: 清亮柔和
        pace: 适中
        pitch: 中高音
    paridamie:
      display_name: 帕里达米
      tts:
        delivery: 从容自信，话语间带着神秘意味
        timbre: 明亮沉着
        pace: 舒缓
        pitch: 中音
  chapters:
    - id: ch01
      title: 仙女们的竞赛
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            谁都知道，仙女能活几百年，可她们也会死。她们每星期都有一天非得变成某种动物不可，那时遇上意外，也就难逃一死。有一回，仙女王正是这样丢了性命。众仙女只好召开大会，再选一位女王。
        - id: ch01-b02
          speaker: narrator
          text: >-
            大家争论了很久，最后只剩下两个人选，一个是叙尔康蒂娜，一个是帕里达米。两人的资格一模一样，选谁都显得不公平。于是众仙女商定，让她们各自向世人展示一件最了不起的奇迹。谁的奇迹更胜一筹，谁就成为女王。当然，搬山这种寻常仙术可不够格。
        - id: ch01-b03
          speaker: narrator
          text: >-
            叙尔康蒂娜决定培养一位王子，让他永远学不会专情。帕里达米想展示的，则是一位魅力无穷的公主，任谁看上一眼，都会爱上她。两位仙女不必赶时间。在结果揭晓以前，仙国先由四位年纪最大的仙女掌管。
        - id: ch01-b04
          speaker: narrator
          text: >-
            帕里达米有一位多年的朋友，名叫巴尔东东，是个才华出众的国王。他的宫廷处处都像宫廷该有的样子。王后巴拉妮丝也十分迷人，而且夫妻俩无论遇到什么事，总能想到一处去。这样同心的夫妇，世上可不多见。
        - id: ch01-b05
          speaker: narrator
          text: >-
            他们只有一个小女儿。孩子雪白的脖颈上，仿佛印着一朵粉红的小玫瑰，所以取名罗莎内拉。她从小便聪明得惊人。廷臣们把她说过的俏皮话全背了下来，不管碰上什么场合，都要拿出来复述一遍。
        - id: ch01-b06
          speaker: narrator
          text: >-
            仙女大会结束后的那天半夜，巴拉妮丝忽然尖叫着醒来。侍女们急忙赶到床前，才知道王后做了一个可怕的梦。
        - id: ch01-b07
          speaker: queen_balanice
          text: >-
            我梦见小女儿变成了一束玫瑰。我正把花捧在手里，一只鸟突然俯冲下来，把花束抢走，衔着飞远了。
          emotion: fearful
        - id: ch01-b08
          speaker: queen_balanice
          text: >-
            快去个人看看，公主是不是平安无事！
          emotion: fearful
        - id: ch01-b09
          speaker: narrator
          text: >-
            侍女们跑去一看，摇篮竟然空了。她们翻遍各处，连罗莎内拉的一点踪迹也找不到。王后伤心得谁也劝不住，国王心里其实同样难过，只是他不大把自己的感受说出口。
        - id: ch01-b10
          speaker: narrator
          text: >-
            过了一阵，国王提议去乡间的一座行宫住几天。巴拉妮丝答应了。她满心悲痛，再也受不了都城里那些热闹的欢宴。
    - id: ch02
      title: 十二位玫瑰姑娘
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            一个美丽的夏日黄昏，国王和王后坐在一片星形的草地上。浓荫笼罩着草地，十二条宽阔的林间大道从这里向外伸展开去。巴拉妮丝四下一望，每条路上都有一个可爱的农家姑娘朝她走来。更奇怪的是，姑娘们人人提着一只篮子，全部心思都放在篮中之物上。
        - id: ch02-b02
          speaker: narrator
          text: >-
            十二个姑娘先后走到王后面前。每个人都把篮子放在她脚边，说出同样一句话：
        - id: ch02-b03
          speaker: rose_maiden_1
          text: >-
            迷人的王后啊，请收下这份薄礼，愿它能稍稍安慰您的不幸。
        - id: ch02-b04
          speaker: narrator
          text: >-
            王后赶紧打开篮子。每只篮里都躺着一个可爱的女婴，年纪和她日夜思念的小公主差不多。起初，孩子们只勾起了她更多的悲伤。可这些小姑娘实在招人喜爱，不久便赢得了她的心。
        - id: ch02-b05
          speaker: narrator
          text: >-
            巴拉妮丝忙着替她们找乳母、摇摇篮的女仆和贴身侍女，又派人到处搜罗秋千、玩偶、陀螺，还有成蒲式耳的精美糖果。一忙起来，她暂时连自己的忧愁也忘了。
        - id: ch02-b06
          speaker: narrator
          text: >-
            说来也怪，每个女婴的脖颈上，都有一朵粉红的小玫瑰。王后一时想不出十二个合适的名字，便先给每个孩子定下一种颜色，照着颜色称呼她们。姑娘们聚在一起，活像一束鲜艳的花。
        - id: ch02-b07
          speaker: narrator
          text: >-
            她们越长越大，也显出不同的性情。十二个人一样聪明，受了同样的教导，也都学得很好。可彼此的脾气，实在相差太远。渐渐地，王后不再喊“珍珠”或“报春花”那些按颜色起的名字了。
        - id: ch02-b08
          speaker: queen_balanice
          text: >-
            我的甜心在哪里？我的美人呢？还有我的开心果，她又跑到哪儿去了？
        - id: ch02-b09
          speaker: narrator
          text: >-
            十二个姑娘有这么多迷人之处，追求者自然数也数不清。本国宫廷里有，远方的王子也听着美名不断赶来。可这十二位头等侍女既美丽又谨慎，从不对任何人另眼相看。
    - id: ch03
      title: 米尔利弗洛王子
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            再来说叙尔康蒂娜。她选中的王子，是巴尔东东国王一位堂兄弟的儿子。王子受洗时，她已经把一位王子需要的才智和好仪表全给了他。为了这场竞赛，她又加倍用心，把想得到的魅力一样样添在他身上。
        - id: ch03-b02
          speaker: narrator
          text: >-
            王子发脾气也好，和颜悦色也好，穿得华丽或朴素，神情严肃或举止轻佻，总之，没有人抵挡得住他。他确实讨人喜欢，因为叙尔康蒂娜给了他世上最聪明的头脑，也给了他世上最善良的心。唯独一样东西，她没有给，那就是专情。
        - id: ch03-b03
          speaker: narrator
          text: >-
            米尔利弗洛王子是个无可救药的风流种，心意比风还多变。到了十八岁，父王的国土上已经没有一颗心留给他征服。人人都爱上了他，他却厌倦了所有人。恰在这时，巴尔东东国王邀请他到宫廷做客。
        - id: ch03-b04
          speaker: narrator
          text: >-
            他一到那里，十二位世上最可爱的姑娘同时出现在眼前。想想看，他会是什么心情！更麻烦的是，十二个人喜欢他，恰好和他喜欢她们每个人一样多。没过多久，只要姑娘们不在身边，王子就一刻也快活不起来。
        - id: ch03-b05
          speaker: narrator
          text: >-
            他可以一面向甜心低声说着柔情蜜语，一面和开心果说笑，眼睛还望着美人。想认真谈谈时，他便到林荫草地上陪端庄姑娘聊天，同时握住多情姑娘的手。其余姑娘也留在近旁，默默体贴着他的心情。
        - id: ch03-b06
          speaker: narrator
          text: >-
            米尔利弗洛生平第一次真的爱上了人。可他爱的不是一个，而是十二个，并且对她们的心意分毫不差。就连叙尔康蒂娜也上了当，以为这一定是朝三暮四的最高境界。帕里达米却什么也没有说。
        - id: ch03-b07
          speaker: narrator
          text: >-
            王子的父亲一次次写信，命令他回家，还接连替他提出好婚事。可什么都没用，世上再没有一样东西，能把米尔利弗洛从十二位迷人的姑娘身边拉走。
    - id: ch04
      title: 蜜蜂与水晶马车
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            一天，王后举办了一场盛大的花园宴会。宾客刚刚到齐，米尔利弗洛也照旧在十二位美人之间忙着献殷勤，忽然，众人听见了蜜蜂的嗡嗡声。玫瑰姑娘们怕被蜇，轻声尖叫着，一齐逃到远离人群的地方。
        - id: ch04-b02
          speaker: narrator
          text: >-
            蜜蜂竟追了上去。在所有人的惊恐注视下，它们忽然长得巨大无比。每只蜜蜂抓住一个姑娘，带着她飞上天空。只一眨眼，十二位姑娘全都不见了。
        - id: ch04-b03
          speaker: narrator
          text: >-
            整个宫廷陷入了深深的悲痛。米尔利弗洛起先悲恸欲绝，随后又一点点沉入绝望之中。大家都担心，要是再没有什么能唤回他的精神，他一定会死。
        - id: ch04-b04
          speaker: narrator
          text: >-
            叙尔康蒂娜匆匆赶来帮助心爱的王子。她拿出一幅又一幅美貌公主的画像，要送给他收藏，可米尔利弗洛全都轻蔑地推开。他的情形糟透了，仙女也不知道还能怎么办。
        - id: ch04-b05
          speaker: narrator
          text: >-
            一天，王子满怀忧愁地四处游荡，忽然听见一片惊呼和赞叹。只要他肯抬头看看，一定会像旁人那样吃惊。一辆水晶马车正从空中缓缓驶来，在阳光下闪闪发亮。
        - id: ch04-b06
          speaker: narrator
          text: >-
            六位生着明亮翅膀的美丽少女牵住玫瑰色丝带，拉着马车。更多少女飞在四周，把长长的玫瑰花环交错举过车顶，织成一幅完整的华盖。帕里达米坐在车中，身边还有一位公主。那位公主美得耀眼，谁看见她都会目眩神迷。
        - id: ch04-b07
          speaker: narrator
          text: >-
            马车停在宏伟的台阶下。帕里达米和公主下了车，朝王后的房间走去。所有人都来观看这番奇景，人群挤得几乎让不出一条路。四面八方不断传来赞叹，都在惊讶陌生公主竟会如此美丽。
        - id: ch04-b08
          speaker: paridamie
          text: >-
            伟大的王后，请让我把您的女儿罗莎内拉送还给您。当初把她从摇篮里偷走的人，正是我。
        - id: ch04-b09
          speaker: narrator
          text: >-
            国王和王后欣喜若狂。最初那阵激动过去以后，巴拉妮丝却又想起了一件事。
        - id: ch04-b10
          speaker: queen_balanice
          text: >-
            那我十二个可爱的姑娘呢？难道我永远失去她们了？以后再也见不到了吗？
          emotion: sad
        - id: ch04-b11
          speaker: paridamie
          text: >-
            用不了多久，您就不会再想念她们了。
        - id: ch04-b12
          speaker: narrator
          text: >-
            那口气分明是在叫王后别再追问。帕里达米重新登上马车，很快消失了。
    - id: ch05
      title: 完整的罗莎内拉
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            美丽的表妹已经到来的消息，很快传到米尔利弗洛耳中。他连去见她的心情都没有，可又不能不去致意。谁知相处还不到五分钟，他便从罗莎内拉一个人身上，看见了十二位玫瑰姑娘各自拥有的优点与魅力。他真心为失去她们悲伤过，如今，那一切似乎都聚在了眼前这个迷人的人儿身上。
        - id: ch05-b02
          speaker: narrator
          text: >-
            说到底，一次只向一个人求爱，总要称心得多。米尔利弗洛还没弄明白是怎么回事，就已经在恳求美丽的表妹嫁给他。
        - id: ch05-b03
          speaker: narrator
          text: >-
            他的话刚说出口，帕里达米便带着胜利的微笑出现了。这一回，她乘坐的是仙女王的马车。众仙女早已得知她成功的消息，一致认定，她为自己赢得了仙国的王位。
        - id: ch05-b04
          speaker: narrator
          text: >-
            帕里达米还得把事情从头讲清。原来，她从摇篮里偷走罗莎内拉以后，把小公主的性情分成了十二份。每一份都变成一个姑娘，能够迷住米尔利弗洛。等十二份重新合在一起，成为完整的罗莎内拉，王子的朝三暮四也就彻底治好了，他从此再不会变心。
        - id: ch05-b05
          speaker: narrator
          text: >-
            还有一件事，最能证明完整的罗莎内拉有多迷人。就连输掉竞赛的叙尔康蒂娜，也送来了一份新婚贺礼，还亲自出席婚礼。等宾客们赶到，婚礼便举行了。
        - id: ch05-b06
          speaker: narrator
          text: >-
            米尔利弗洛果然一辈子忠贞不渝。说真的，换了谁处在他的位置上，难道会不一样吗？罗莎内拉对他的爱，也抵得上十二位美人的爱加在一起。他们平安幸福地统治着王国，直到漫长的生命走到尽头。
        - id: ch05-b07
          speaker: narrator
          text: >-
            这个故事的作者是卡吕斯伯爵。
