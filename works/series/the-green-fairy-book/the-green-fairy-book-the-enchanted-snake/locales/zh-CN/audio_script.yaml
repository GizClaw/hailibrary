audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，像编书人面对孩子娓娓而谈，幽默处轻巧含笑
        timbre: 温暖清朗
        pace: 舒缓而有自然起伏
        pitch: 中音
    sabatella:
      display_name: 萨巴泰拉
      tts:
        delivery: 朴实慈爱，惊讶时直率，答应照料孩子时温柔诚恳
        timbre: 温厚柔和
        pace: 适中偏慢
        pitch: 中音
    enchanted_prince:
      display_name: 魔蛇王子
      tts:
        delivery: 聪慧笃定，作为蛇时沉着有礼，恢复人形后深情而坚定
        timbre: 清亮醇和
        pace: 适中
        pitch: 中低音
    cola_matteo:
      display_name: 科拉-马泰奥
      tts:
        delivery: 老实直白，凡事认真照办，说话带着不加掩饰的憨厚
        timbre: 粗朴厚实
        pace: 适中偏慢
        pitch: 中低音
    starza_longa_king:
      display_name: 斯塔尔扎-隆加国王
      tts:
        delivery: 起初傲慢戏谑，履约时勉强而庄重，惊慌时感情外露
        timbre: 洪亮厚重
        pace: 适中偏慢
        pitch: 低音
    granonia:
      display_name: 格兰诺妮娅
      tts:
        delivery: 镇定勇敢，受难时坚韧，试探爱人时含蓄而真挚
        timbre: 清澈明亮
        pace: 适中
        pitch: 中高音
    fox:
      display_name: 狐狸
      tts:
        delivery: 机敏圆滑，透露秘密时故作神秘，谈条件时警觉干脆
        timbre: 轻巧略带沙哑
        pace: 轻快
        pitch: 中高音
    grosso_king:
      display_name: 格罗索山谷国王
      tts:
        delivery: 威严坦率，忧心儿子时沉重，见他康复后激动而守信
        timbre: 深沉宽厚
        pace: 适中偏慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 蛇儿求亲
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，有个穷苦的女人，一心盼着有个孩子。只要这个愿望能实现，她情愿献出自己所有的一切，可她始终没能如愿。一天，丈夫去树林里捡柴，把柴带回家以后，才发现枝条中间藏着一条漂亮的小蛇。
        - id: ch01-b02
          speaker: narrator
          text: >-
            妻子名叫萨巴泰拉。她望着这个小东西，忍不住深深叹气。
        - id: ch01-b03
          speaker: sabatella
          text: >-
            连蛇都有自己的孩子，偏偏我命苦，一个孩子也没有。
          emotion: sad
        - id: ch01-b04
          speaker: narrator
          text: >-
            她刚说完，小蛇竟抬头看着她，开口说起了人话。萨巴泰拉又害怕又惊奇。
        - id: ch01-b05
          speaker: enchanted_prince
          text: >-
            你既然没有孩子，就做我的母亲吧。你不会后悔的，我会像亲儿子那样爱你。
        - id: ch01-b06
          speaker: narrator
          text: >-
            起初，萨巴泰拉吓得魂都快没了。过了一会儿，她才鼓起勇气回答。
        - id: ch01-b07
          speaker: sabatella
          text: >-
            只为你这份心意，我也愿意答应。我会把你当成自己的孩子，好好爱你、照料你。
        - id: ch01-b08
          speaker: narrator
          text: >-
            她在屋里找了个小洞给蛇当床，又把能想到的好东西都拿来喂它，怎么疼也疼不够。小蛇越长越大，也越来越胖。一天早晨，它对一直当作父亲的科拉-马泰奥说，自己已经到了成婚的年纪。
        - id: ch01-b09
          speaker: enchanted_prince
          text: >-
            亲爱的爸爸，我想娶妻了。
        - id: ch01-b10
          speaker: cola_matteo
          text: >-
            好啊，我一定尽力给你找一条和你一样的蛇，把亲事说成。
        - id: ch01-b11
          speaker: enchanted_prince
          text: >-
            哎呀，你真这么办，我不就和那些蝰蛇、爬虫没两样了吗？我可不愿意。我要娶国王的女儿。请你别耽搁，去告诉国王，有一条蛇想娶他的公主。
        - id: ch01-b12
          speaker: narrator
          text: >-
            科拉-马泰奥头脑简单，真的去求见国王。得到召见后，他把来意说了出来。
        - id: ch01-b13
          speaker: cola_matteo
          text: >-
            陛下，我听人说，开口求人总不会吃亏。有条蛇想娶您的女儿，不知道您肯不肯让鸽子和长蛇结成一对？
        - id: ch01-b14
          speaker: narrator
          text: >-
            国王一看就知道他是个傻瓜，只想随便找件办不到的事把他打发走。
        - id: ch01-b15
          speaker: starza_longa_king
          text: >-
            回去告诉你的蛇朋友。它要是能在明天中午以前，把这座宫殿变成镶满金银的象牙宫，我就把女儿嫁给它。
        - id: ch01-b16
          speaker: narrator
          text: >-
            国王说完放声大笑，把农夫赶了出去。科拉-马泰奥回家带去答复，小蛇却一点也不发愁。
        - id: ch01-b17
          speaker: enchanted_prince
          text: >-
            明天太阳升起以前，你去树林采一束青翠的草药，再拿它们擦擦宫殿的门槛。到时候，你自然会看到结果。

    - id: ch02
      title: 三道难题
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            科拉-马泰奥一句也没多问。第二天日出前，他采来圣约翰草、迷迭香和其他草药，照小蛇的话往宫殿地面上一擦。刚擦完，四周墙壁就变成象牙，上面密密镶着金银。那光亮得刺眼，谁看了都睁不开眼。国王起床看到这番奇景，惊得失魂落魄，怎么也拿不定主意。
        - id: ch02-b02
          speaker: narrator
          text: >-
            第二天，农夫又来替小蛇求亲，国王却不肯痛快答应。
        - id: ch02-b03
          speaker: starza_longa_king
          text: >-
            别急。它真想娶我的女儿，还得继续证明本领。让它在明天中午以前，把花园所有小路和围墙都变成纯金。
        - id: ch02-b04
          speaker: narrator
          text: >-
            农夫把新条件告诉小蛇，小蛇马上给他出了主意。
        - id: ch02-b05
          speaker: enchanted_prince
          text: >-
            明早去街上，把能找到的破烂全收起来，再扔到花园的小路和围墙上。这样就能看出，我们到底胜不胜得过那个老国王。
        - id: ch02-b06
          speaker: narrator
          text: >-
            鸡一叫，科拉-马泰奥就夹着大篮子出门。他仔细捡来破锅、破盆、碎罐子、碎油灯，还有各种垃圾，再把它们撒到御花园里。那些破烂刚落下，小路和围墙就化成一片闪耀的金光，照得人人眼花，人人惊叹。国王也看呆了，可还是舍不得女儿。等农夫来提醒他守约，他又提出第三个要求。
        - id: ch02-b07
          speaker: starza_longa_king
          text: >-
            小蛇要是能把花园里的树和果实全变成宝石，我就答应这门婚事。
        - id: ch02-b08
          speaker: narrator
          text: >-
            小蛇听完，仍旧不慌不忙。
        - id: ch02-b09
          speaker: enchanted_prince
          text: >-
            明早去市场，把看见的水果都买下来，再把果核和种子播进宫廷花园。要是我没有料错，这回国王总该满意了。
        - id: ch02-b10
          speaker: narrator
          text: >-
            天刚亮，科拉-马泰奥就挎着篮子去了市场。他把能找到的石榴、杏子、樱桃和其他水果全买下来，再把果核和种子播进宫廷花园。转眼间，满园树木都燃起宝石的光。红宝石、祖母绿、钻石，还有你想得到的各种珍宝，全都挂满枝头。
        - id: ch02-b11
          speaker: narrator
          text: >-
            这一次，国王知道自己非守信不可。他把女儿格兰诺妮娅叫到身边，告诉她，那些不可能完成的要求原本只是玩笑，如今小蛇全做到了。
        - id: ch02-b12
          speaker: starza_longa_king
          text: >-
            亲爱的孩子，我必须兑现承诺。你要是真爱父亲，就别逼我失信。哪怕命运对你太残酷，也请你尽量安然接受吧。
        - id: ch02-b13
          speaker: granonia
          text: >-
            父王，您愿意怎样安排我都可以。您的意愿，就是我要遵从的律法。
        - id: ch02-b14
          speaker: narrator
          text: >-
            国王便叫科拉-马泰奥把小蛇带进宫，说自己已经准备好接纳这个女婿。

    - id: ch03
      title: 烧掉的蛇皮
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            小蛇坐着黄金马车来到宫廷，拉车的是六头白象。一路上，人们只要看见这条吓人的大蛇，就四散奔逃。它一进宫，从群臣到厨房里地位最低的杂役，全都怕得发抖。国王和王后更吓得浑身瘫软，躲进远处的塔楼。只有格兰诺妮娅镇定地留在原地。父母苦苦催她逃命，她一步也不动。
        - id: ch03-b02
          speaker: granonia
          text: >-
            这是你们替我选的丈夫，我当然不会逃。
        - id: ch03-b03
          speaker: narrator
          text: >-
            小蛇看到格兰诺妮娅，便用尾巴缠住她，吻了她一下。随后，它领她走进房间，关紧房门。蛇皮一褪，格兰诺妮娅眼前出现了一位美丽的年轻人。他有金色的头发，眼睛闪着光。他温柔地拥抱她，对她说了许多甜蜜的话。
        - id: ch03-b04
          speaker: narrator
          text: >-
            国王见小蛇带着女儿关进了房间，忧心忡忡地对王后说起最坏的猜想。
        - id: ch03-b05
          speaker: starza_longa_king
          text: >-
            愿上天可怜我们的孩子。只怕她已经没命了，那条该死的蛇多半把她吞下去了。
          emotion: fearful
        - id: ch03-b06
          speaker: narrator
          text: >-
            两人把眼睛贴到钥匙孔上，想看看里面究竟怎样了。他们没看到蛇，只看到一位俊美青年站在女儿面前，地板上还躺着那张蛇皮。他们惊讶得说不出话，一激动便撞开房门，抓起蛇皮扔进火里。
        - id: ch03-b07
          speaker: enchanted_prince
          text: >-
            你们这些糊涂人！看看自己究竟干了什么！
          emotion: angry
        - id: ch03-b08
          speaker: narrator
          text: >-
            国王和王后还没转过身，年轻人已经变成一只鸽子。他猛地冲向窗户，撞碎一块玻璃，当着众人的面飞走了。
        - id: ch03-b09
          speaker: narrator
          text: >-
            一眨眼，格兰诺妮娅便从欢乐跌进悲伤，从欢欣落入绝望，也从拥有幸福变得一无所有。刚刚到手的幸福竟被夺走，好像盛满欢乐的杯子突然被下了毒。这场飞来的横祸就这样落在她头上。她痛哭不止，把一切全怪在父母身上。父母再三保证绝无恶意，她一句也听不进去。
        - id: ch03-b10
          speaker: narrator
          text: >-
            到了夜里，宫中所有人都睡熟了。格兰诺妮娅扮成农妇，从后门悄悄离开。她下定决心，一定要找回失去的幸福，找不到就绝不罢休。

    - id: ch04
      title: 林中鸟语
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            她借着月光走出城，在路上遇见一只狐狸。狐狸主动提出陪她同行，格兰诺妮娅高兴地答应了。
        - id: ch04-b02
          speaker: granonia
          text: >-
            你肯陪我，真是再好不过。这一带的路，我一点也不认识。
        - id: ch04-b03
          speaker: narrator
          text: >-
            他们结伴走进一片树林。走了很久，两人都累了，便停在树荫下休息。那里有一道泉水，像是在和嫩草嬉戏。晶亮的水珠四处飞洒，润湿了青青的草叶。他们躺在这张绿色的地毯上，很快沉沉睡去，直到太阳高高升起才醒来。
        - id: ch04-b04
          speaker: narrator
          text: >-
            起身后，他们站着听了好一阵鸟儿歌唱。格兰诺妮娅很喜欢那歌声，狐狸便告诉她，鸟儿唱的内容更有意思。
        - id: ch04-b05
          speaker: fox
          text: >-
            你要是也像我一样听得懂鸟语，就会觉得这些歌更有趣了。
        - id: ch04-b06
          speaker: narrator
          text: >-
            这句话勾起了格兰诺妮娅的好奇心。大家都知道，女人天生爱好奇，正像她们天生爱说话一样。她一再央求狐狸，把刚才听见的话说给自己听。狡猾的狐狸起初不肯，最后才透露了消息。
        - id: ch04-b07
          speaker: fox
          text: >-
            鸟儿说，有位俊美的王子遭了大难。一个邪恶女巫把他变成蛇，整整七年。期限到了，他爱上了一位迷人的公主。可他刚在房里褪下蛇皮，公主的父母就闯进来，把皮烧掉了。他只好变成鸽子，从窗户往外飞，却撞碎玻璃，受了重伤。连医生都说，他已经没救了。
        - id: ch04-b08
          speaker: narrator
          text: >-
            格兰诺妮娅立刻听出，鸟儿说的正是自己的爱人。她赶忙追问，那是哪位国王的儿子，还有没有办法救他。
        - id: ch04-b09
          speaker: fox
          text: >-
            他是格罗索山谷国王的儿子。要治好他，只有一个办法。取来刚才那些鸟儿的血，涂在他头上的伤口上。
        - id: ch04-b10
          speaker: narrator
          text: >-
            格兰诺妮娅跪到狐狸面前，温言求它捉住鸟儿，替自己取到那些血，还答应以后一定重重酬谢。
        - id: ch04-b11
          speaker: fox
          text: >-
            好吧，不过你先别急。等天黑以后，小鸟全回巢睡熟了，我再爬上树，一只不漏地捉给你。
        - id: ch04-b12
          speaker: narrator
          text: >-
            这一天，他们一会儿谈王子的美貌，一会儿谈公主的父亲，一会儿又说起那场不幸。终于，夜色降临，鸟儿全在一棵大树的高枝上睡熟了。狐狸悄悄爬上去，用爪子把它们一只只捉住。它杀死所有鸟儿，把血装进身旁的小瓶，再带回来交给格兰诺妮娅。
        - id: ch04-b13
          speaker: narrator
          text: >-
            这次捕猎大获成功，格兰诺妮娅喜不自胜。狐狸却给她泼了一盆冷水。
        - id: ch04-b14
          speaker: fox
          text: >-
            亲爱的姑娘，你先别高兴。没有我的血，这些鸟血一点用也没有。
        - id: ch04-b15
          speaker: narrator
          text: >-
            狐狸说完拔腿就跑。格兰诺妮娅的希望一下落了空，只好用好话和计谋留下它。这两样武器，常常能替女人解围。她在后面高声喊了起来。
        - id: ch04-b16
          speaker: granonia
          text: >-
            狐狸爸爸，你想保住自己的皮，当然没错。可你帮了我这么大的忙，世上也不只有你这一只狐狸。你明知道我很感激你，也知道别处还有许多狐狸，尽管放心跟我走。别像那头才把奶桶装满，转身又一脚踢翻的母牛。陪我到都城去吧，到了那里，你可以把我当女仆卖给国王。
        - id: ch04-b17
          speaker: narrator
          text: >-
            狐狸做梦也想不到，自己也会被人骗。过了一会儿，它答应继续同行。谁知没走多远，聪明的姑娘就抓起木棍，朝它头上猛击一下。狐狸当场倒地死了。格兰诺妮娅取出一些狐狸血，倒进自己的小瓶，随后尽快赶往格罗索山谷。

    - id: ch05
      title: 公主行医
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            到了格罗索山谷，格兰诺妮娅径直前往王宫，请人向国王禀报，说自己能医治年轻王子。国王立刻叫人把她带来。他很惊讶，一个姑娘竟敢尝试连全国最聪明的医生都办不到的事。不过试一试也没有损失，他便准许她出手医治。
        - id: ch05-b02
          speaker: granonia
          text: >-
            我只有一个请求。要是我真能照您的心愿治好王子，请把他许配给我。
        - id: ch05-b03
          speaker: narrator
          text: >-
            国王早已不指望儿子还能康复，当场答应了她。
        - id: ch05-b04
          speaker: grosso_king
          text: >-
            只要你让他恢复性命和健康，他就是你的。你把儿子还给我，我把丈夫给你，这很公平。
        - id: ch05-b05
          speaker: narrator
          text: >-
            他们一同走进王子的房间。格兰诺妮娅刚把瓶里的血涂到伤口上，疾病就立刻退去，王子又像从前一样健康。国王眼看儿子奇迹般活了过来，又惊又喜，转身提醒他，自己已经许下承诺。
        - id: ch05-b06
          speaker: grosso_king
          text: >-
            亲爱的儿子，我原以为你已经死了，现在看到你重新活过来，我实在又惊又喜。我答应过这位姑娘，只要她治好你，就把你的手和心都交给她。既然上天怜悯我们，你就得履行我替你许下的诺言。哪怕只是为了报恩，这笔债也必须还清。
          emotion: happy
        - id: ch05-b07
          speaker: enchanted_prince
          text: >-
            父王，我深深地爱着您，只可惜我的心不能任由别人安排。我已经向另一个姑娘发过誓。您和这位姑娘一定都能明白，我不能背弃承诺，辜负自己爱的人。

    - id: ch06
      title: 爱人重逢
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            格兰诺妮娅听了这番话，知道王子对自己的爱扎得多深，心里十分欢喜。她双颊泛红，又问了他一句。
        - id: ch06-b02
          speaker: granonia
          text: >-
            要是我能让那位姑娘放弃自己的权利，你愿意娶我吗？
        - id: ch06-b03
          speaker: enchanted_prince
          text: >-
            我绝不会把心上人美丽的身影从心里赶走。不管她说什么，我的心意都不会变。就算因此送命，我也不能换一个人。
        - id: ch06-b04
          speaker: narrator
          text: >-
            格兰诺妮娅再也忍不住了。她脱下农妇的伪装，在王子面前露出真容。王子认出美丽的爱人，高兴得几乎发狂。他马上告诉父亲，这姑娘究竟是谁，又讲了她为了自己做过什么、受过多少苦。
        - id: ch06-b05
          speaker: narrator
          text: >-
            后来，他们邀请斯塔尔扎-隆加的国王和王后来到宫中，举行了一场盛大的婚宴。这件事又一次证明，真爱的欢乐要想滋味更浓，再没有比几分痛苦更好的调味料了。
