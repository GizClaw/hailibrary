  chapters:
    - id: ch01
      title: A Son for Sabatella
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a poor woman named Sabatella. More than anything in the world, she longed for a child. She would gladly have given away everything she owned if only she could have a son or daughter of her own.
        - id: ch01-b02
          speaker: narrator
          text: One day, her husband, Cola-Mattheo, went into the woods to gather brushwood. When he carried the bundle home, he found a pretty little snake among the twigs.
        - id: ch01-b03
          speaker: sabatella
          text: Even snakes have little ones. I am the only unfortunate creature with no children at all.
          emotion: sad
        - id: ch01-b04
          speaker: narrator
          text: To her great surprise, the little snake raised its head and looked into her face.
        - id: ch01-b05
          speaker: enchanted_prince
          text: If you have no child, then be my mother. You will never regret it. I will love you as dearly as your own son would.
        - id: ch01-b06
          speaker: narrator
          text: Sabatella was terrified when the snake spoke. Still, she gathered her courage and answered him.
        - id: ch01-b07
          speaker: sabatella
          text: Your kind thought is reason enough. I will take you in, care for you, and love you like a mother.
        - id: ch01-b08
          speaker: narrator
          text: Sabatella gave the little snake a hole inside the house to use as his bed. She fed him every delicious thing she could think of and treated him with such kindness that nothing ever seemed enough. Under her care, he grew bigger and fatter every day. At last, one morning, he spoke to Cola-Mattheo. The snake had always looked upon the peasant as his own father.
        - id: ch01-b09
          speaker: enchanted_prince
          text: Dear Papa, I am old enough now, and I want to marry.
        - id: ch01-b10
          speaker: cola_mattheo
          text: That suits me. I will find another snake like you and arrange the match.
        - id: ch01-b11
          speaker: enchanted_prince
          text: Another snake? Then we would be no better than the vipers and reptiles. That is not what I want. I would much rather marry the King's daughter. Please go to the King at once and tell him that a snake wishes to marry his daughter.
        - id: ch01-b12
          speaker: narrator
          text: Cola-Mattheo was a very simple man. The request did not strike him as strange, so he went straight to the royal palace and asked to see the King. Somehow, he gained an audience and delivered the snake's proposal.
        - id: ch01-b13
          speaker: cola_mattheo
          text: Your Majesty, they say there is no harm in asking. A snake wants to marry your daughter. Will you agree to match a dove with a serpent?
        - id: ch01-b14
          speaker: narrator
          text: The King took one look at Cola-Mattheo and decided that the man must be a fool. He had no intention of marrying his daughter to a snake. Instead of refusing directly, he thought of an impossible task that would send the peasant away.
        - id: ch01-b15
          speaker: king_of_starza_longa
          text: Tell your snake that he may marry my daughter if he turns this palace into ivory, inlaid with gold and silver, by noon tomorrow.
        - id: ch01-b16
          speaker: narrator
          text: The King laughed heartily and sent Cola-Mattheo away.
    - id: ch02
      title: The King's Three Demands
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: When Cola-Mattheo brought the answer home, the snake was not troubled at all.
        - id: ch02-b02
          speaker: enchanted_prince
          text: Before sunrise tomorrow, gather a bunch of green herbs in the woods. Rub them across the palace threshold, and then see what happens.
        - id: ch02-b03
          speaker: narrator
          text: Cola-Mattheo was too simple to question the plan. Before the sun rose, he went into the woods and gathered Saint John's wort, rosemary, and other green herbs. He carried them to the palace and rubbed them across the floor, just as the snake had told him. He had barely finished when every wall turned to ivory, richly inlaid with gold and silver. The palace shone so brightly that everyone who looked at it was dazzled. When the King rose and saw the miracle, amazement overwhelmed him. He had no idea what in the world to do next.
        - id: ch02-b04
          speaker: narrator
          text: The next day, Cola-Mattheo returned to claim the Princess for the snake. But the King delayed him again.
        - id: ch02-b05
          speaker: king_of_starza_longa
          text: There is no need to hurry. Before noon tomorrow, the snake must turn every path and wall in my garden into pure gold.
        - id: ch02-b06
          speaker: enchanted_prince
          text: Early tomorrow, collect every scrap of rubbish you can find in the streets. Throw it across the garden paths and walls. We will see whether the old King can outmatch us.
        - id: ch02-b07
          speaker: narrator
          text: At the first crow of the rooster, Cola-Mattheo rose and tucked a large basket under his arm. He carefully searched the streets and filled it with every scrap he could find. There were broken pieces of pots and pans, shattered jugs and lamps, and all sorts of other rubbish. He carried the basket into the royal garden and scattered the trash over its paths and walls. In an instant, every broken scrap became glittering gold. The whole garden blazed with such brilliance that it dazzled every eye and filled every heart with wonder.
        - id: ch02-b08
          speaker: narrator
          text: The King was amazed too, yet he still could not bear to give up his daughter. When Cola-Mattheo reminded him of his promise, he made one last demand.
        - id: ch02-b09
          speaker: king_of_starza_longa
          text: If the snake turns all the trees and fruit in my garden into precious stones, then I promise he shall marry my daughter.
        - id: ch02-b10
          speaker: enchanted_prince
          text: Go to the market at dawn and buy every kind of fruit you find. Plant all the seeds and stones in the palace garden. I think the result will satisfy the King.
        - id: ch02-b11
          speaker: narrator
          text: At dawn, Cola-Mattheo took his basket to the market. He bought all the pomegranates, apricots, cherries, and other fruit he could find. Then he carried them to the palace garden and planted every seed and stone in the earth. The change came in a single moment. All the garden trees burst into splendor, covered with rubies, emeralds, diamonds, and every other precious stone anyone could imagine.
        - id: ch02-b12
          speaker: narrator
          text: This time, the King knew he must keep his word. He called for his daughter, Princess Grannonia.
        - id: ch02-b13
          speaker: king_of_starza_longa
          text: My dear Grannonia, I was joking when I gave your bridegroom those impossible tasks. Now he has done everything I asked, so I must honor my bargain. Please do not make me break my word. Try to accept this unhappy fate as bravely as you can.
        - id: ch02-b14
          speaker: grannonia
          text: Do with me as you wish, my lord and father. Your will is my law.
        - id: ch02-b15
          speaker: narrator
          text: The King told Cola-Mattheo to bring the snake to the palace. He was ready, he said, to receive the creature as his son-in-law.
    - id: ch03
      title: The Burned Snakeskin
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The snake made a grand journey to court in a carriage made entirely of gold and drawn by six white elephants. Yet the magnificent carriage did nothing to calm the people along the road. Wherever the enormous, frightening reptile appeared, everyone who saw him fled in terror.
        - id: ch03-b02
          speaker: narrator
          text: Fear swept through the palace as soon as the snake arrived. All the courtiers shook and trembled, right down to the lowest kitchen boy. The King and Queen were so overcome that they hid themselves in a tower far away. Grannonia alone kept her presence of mind. Both her father and her mother begged her to escape while she still could, but the Princess refused to move a single step.
        - id: ch03-b03
          speaker: grannonia
          text: I will not run away from the husband you chose for me.
        - id: ch03-b04
          speaker: narrator
          text: As soon as the snake saw Grannonia, he wound his tail around her and kissed her. Then he led her into a private room and closed the door behind them. There, he threw off his snakeskin. In its place stood a beautiful young man with golden curls and eyes that flashed with light. He embraced Grannonia tenderly and filled her ears with loving words.
        - id: ch03-b05
          speaker: narrator
          text: The King had seen the snake close the door behind his daughter. He turned to the Queen in dread.
        - id: ch03-b06
          speaker: king_of_starza_longa
          text: Heaven have mercy on our child. I fear it is all over. That cursed snake has probably swallowed her.
          emotion: fearful
        - id: ch03-b07
          speaker: narrator
          text: The King and Queen hurried to the door and pressed their eyes to the keyhole. What they saw left them speechless with amazement. Their daughter was not in danger at all. A beautiful young man stood before her, while the empty snakeskin lay on the floor beside him. Excitement overcame their judgment. They burst through the door, snatched up the skin, and threw it straight into the fire.
        - id: ch03-b08
          speaker: enchanted_prince
          text: Oh, you wretched people! What have you done?
          emotion: angry
        - id: ch03-b09
          speaker: narrator
          text: Before anyone could turn around, he changed into a dove. He struck the window, broke a pane of glass, and flew out of sight.
        - id: ch03-b10
          speaker: narrator
          text: In that single moment, Grannonia passed from joy to despair, from having everything she wanted to having nothing at all. She wept bitterly over the happiness that had been stolen from her just as she reached it. She blamed her parents for ruining her joy. Though they assured her again and again that they had only meant to save her, the Princess refused every comfort.
        - id: ch03-b11
          speaker: narrator
          text: That night, while everyone in the palace slept, Grannonia disguised herself in a peasant woman's clothes. She stole out through a back door, determined to search for her lost happiness until she found it. The moon lit her path as she made her way to the outskirts of the town. There she met a fox. When he learned that she was traveling alone, he offered to accompany her.
        - id: ch03-b12
          speaker: grannonia
          text: You are very welcome. I do not know my way through this country at all.
    - id: ch04
      title: The Secret in the Birds' Song
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Grannonia and the fox continued side by side until they came to a wood. By then, the long walk had left them tired. They stopped beneath the shade of a tree, beside a spring whose clear spray refreshed the tender grass. The green ground made a soft carpet, so they lay down there and quickly fell fast asleep. Neither one woke again until the sun was already high in the heavens.
        - id: ch04-b02
          speaker: narrator
          text: When they awoke, Grannonia listened for a while to the birds singing. Their music delighted her. The fox noticed her pleasure.
        - id: ch04-b03
          speaker: fox
          text: You would enjoy their song even more if you understood what those little birds were saying, as I do.
        - id: ch04-b04
          speaker: narrator
          text: The fox's words stirred Grannonia's curiosity at once. She could not bear to know that the birds held a secret she could not understand. Again and again, she begged him to repeat their conversation. The sly fox refused her at first and kept what he knew to himself. At last, however, her earnest pleading wore down his resistance.
        - id: ch04-b05
          speaker: fox
          text: They were speaking of a handsome young prince. A wicked enchantress turned him into a snake for seven years. When those years ended, he fell in love with a charming princess. He shed his snakeskin in a room with her, but her parents broke in and burned it. The prince became a dove. As he flew through a window, the glass wounded him so badly that his doctors now believe he will die.
        - id: ch04-b06
          speaker: narrator
          text: Grannonia knew they were speaking of her beloved. She asked whose son he was and whether anything could save him.
        - id: ch04-b07
          speaker: fox
          text: He is the son of the King of Vallone Grosso. The birds say there is only one cure. Their own blood must be rubbed on the wounds on his head.
        - id: ch04-b08
          speaker: narrator
          text: Grannonia knelt before the fox and sweetly begged him to catch the birds and collect their blood. She promised him a rich reward.
        - id: ch04-b09
          speaker: fox
          text: Very well, but do not rush me. We must wait until night, when the little birds are asleep. Then I will climb up and catch them for you.
        - id: ch04-b10
          speaker: narrator
          text: They passed the rest of the day in conversation. Sometimes they spoke of the Prince and his beauty. Sometimes they discussed the Princess's father, or the terrible mistake that had separated the two lovers. At last, night covered the wood, and all the little birds went to sleep high among the branches of a great tree. The fox climbed up without a sound. One by one, he caught the sleeping birds in his paws and killed them. Then he collected their blood in a small bottle that he wore at his side. When he climbed down and showed Grannonia what he had done, she was almost beside herself with joy. But the fox quickly stopped her celebration.
        - id: ch04-b11
          speaker: fox
          text: My dear daughter, you are celebrating too soon. This blood is useless unless you mix some of my blood with it.
        - id: ch04-b12
          speaker: narrator
          text: With that, he ran away. Grannonia saw her hope vanish and quickly turned to flattery and cunning.
        - id: ch04-b13
          speaker: grannonia
          text: Father Fox, you would be right to protect yourself if I were not so grateful to you, and if there were no other foxes in the world. But you know I owe you everything, and there are plenty of other foxes. You can trust me. Do not be like a cow that fills the milk pail and then kicks it over. Keep traveling with me. At the capital, you can sell me to the King as a servant girl.
        - id: ch04-b14
          speaker: narrator
          text: It never entered the fox's mind that someone might be cunning enough to outwit a fox. Grannonia's words reassured him, and after a little thought, he agreed to continue the journey with her. They had not gone very far when the Princess suddenly seized a stick. She struck him so hard on the head that he dropped dead on the spot. Grannonia took the blood she needed from him and poured it into the little bottle with the birds' blood. Then, carrying the only cure for the Prince, she traveled as fast as she could toward Vallone Grosso.
    - id: ch05
      title: The Cure at Vallone Grosso
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: When Grannonia reached Vallone Grosso, she went straight to the royal palace and sent word to the King that she had come to cure the young Prince.
        - id: ch05-b02
          speaker: narrator
          text: The King ordered his servants to bring the stranger before him without delay. He stared in astonishment when he saw that the person offering this cure was only a young woman. All the cleverest doctors in his kingdom had tried and failed to save his son. Yet an attempt could do no further harm, and the King had run out of hope, so he willingly allowed her to try.
        - id: ch05-b03
          speaker: grannonia
          text: I ask only one thing. If I give you what you desire and cure your son, you must let me marry him.
        - id: ch05-b04
          speaker: king_of_vallone_grosso
          text: Bring him back to life and health, and he shall be yours. It is only fair that the woman who gives me back my son should receive him as her husband.
        - id: ch05-b05
          speaker: narrator
          text: The King led Grannonia into the room where the wounded Prince lay near death. She opened her little bottle and rubbed the blood of the birds and the fox over the wounds on his head. The cure worked at once. His terrible illness left him, and he became as sound and healthy as he had ever been. The King had believed his son was lost. Now he saw him restored to life and strength, and he could hardly contain his joy and amazement.
        - id: ch05-b06
          speaker: king_of_vallone_grosso
          text: My dear son, I believed you were dying, and now you are well again. I promised this young woman your hand and heart if she cured you. Heaven has been merciful to us, and gratitude demands that you honor my promise.
        - id: ch05-b07
          speaker: enchanted_prince
          text: My lord and father, I wish my heart were free to obey you, for I love you dearly. But I have already given my word to another maiden. You and this young woman must understand that I cannot break my promise or betray the one I love.
    - id: ch06
      title: The Faithful Lovers
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Grannonia heard how faithfully the Prince still loved her. Happiness filled her, and she blushed a rosy red.
        - id: ch06-b02
          speaker: grannonia
          text: Suppose I persuaded that other lady to give up her claim. Would you agree to marry me then?
        - id: ch06-b03
          speaker: enchanted_prince
          text: No. I will never drive the beautiful image of my beloved from my heart. Whatever she might say, my love and my desire would stay the same. Even if it cost me my life, I could never agree to exchange her for you.
        - id: ch06-b04
          speaker: narrator
          text: Grannonia could keep silent no longer. Before the Prince's eyes, she threw off the peasant disguise that had hidden her identity throughout the journey. He recognized his own beloved Princess and was nearly beside himself with joy. At once, he explained to his father who she truly was. He told the King how they had been separated, and how much Grannonia had done and suffered in order to find him and save his life.
        - id: ch06-b05
          speaker: narrator
          text: They invited the King and Queen of Starza-Longa to their court and held a magnificent wedding feast.
        - id: ch06-b06
          speaker: narrator
          text: And once again, they showed that a few pains of grief can make the joys of true love sweeter.
