  chapters:
    - id: ch01
      title: The Two Princesses
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a King with broad lands and more gold and silver than he could ever spend. None of it mattered to him after his wife died. He shut himself in a little room and struck his head against the walls in grief. His courtiers feared he would badly hurt himself, so they hung feather beds behind the tapestries. Then he could beat his head against the soft walls without doing himself much harm.
        - id: ch01-b02
          speaker: narrator
          text: His subjects came one after another to comfort him. Some spoke gravely and shared his gloom. Others tried to be cheerful. The King scarcely heard any of them. Then a lady arrived wrapped in a black mantle. She wept so deeply that at last he looked up.
        - id: ch01-b03
          speaker: queen
          text: I did not come to lessen your sorrow. I have just lost a good husband myself. I came to add my tears to yours, because I know what you must be feeling.
          emotion: sad
        - id: ch01-b04
          speaker: narrator
          text: The King wept harder than ever. At last he had found someone who seemed to understand him. He told her long stories about his good Queen, remembering one fine quality after another. The lady answered with stories about the virtues of her own departed husband. They passed many hours this way. While they talked, the King quite forgot to strike his head against the feather beds, and the lady needed to wipe the tears from her large blue eyes less and less often. Little by little, their conversation moved beyond the people they had lost. They found other subjects that interested the King, and the sorrow in the small room began to lift. In a wonderfully short time, the whole kingdom heard the astonishing news that the King had married the sorrowful lady.
        - id: ch01-b05
          speaker: narrator
          text: The King had a daughter of fifteen named Fiordelisa. She was lovely, charming, and always merry. The new Queen had a daughter too, and soon sent for her. Turritella had been raised by her godmother, Fairy Mazilla, with every possible care. Even so, she had grown up ill-tempered and ungracious.
        - id: ch01-b06
          speaker: narrator
          text: Beside Fiordelisa, Turritella looked worse than ever. The Queen was desperate. She did everything she could to turn the King against his own child, hoping he would favor Turritella instead. One day he said it was time for both girls to marry. The first suitable prince who came to court could have one of them.
        - id: ch01-b07
          speaker: queen
          text: My daughter must marry first. She is older than yours, and a thousand times more charming.
        - id: ch01-b08
          speaker: king_fiordelisas_father
          text: Very well. I want no quarrel over it. Arrange things however you please.
        - id: ch01-b09
          speaker: narrator
          text: Soon afterward, word came that King Charming was on his way. He was the handsomest and most magnificent prince in all the country. The Queen ordered jewelers, tailors, weavers, and embroiderers to make splendid clothes for Turritella. She claimed Fiordelisa needed nothing new. Then, on the night before the visit, she bribed a waiting woman to steal every dress and jewel Fiordelisa owned.
        - id: ch01-b10
          speaker: narrator
          text: On the morning of the visit, Fiordelisa went to dress as her royal rank required. She searched everywhere, but could not find a gown, a jewel, or so much as one ribbon. It was easy to guess who had arranged this trick, yet she made no complaint. Instead she sent servants to the merchants and asked them to bring rich cloth at once. The merchants refused. The Queen had expressly forbidden them to supply the Princess, and none of them dared disobey her. Fiordelisa was left with nothing but the little white dress she had worn the day before. She smoothed it as best she could and went downstairs at the hour of King Charming's arrival. Then she quietly took a seat in a corner, hoping the visitor would never notice her.
        - id: ch01-b11
          speaker: narrator
          text: The Queen welcomed King Charming with every ceremony the court could provide. She led him straight to Turritella, who glittered from head to foot in the work of the jewelers, tailors, weavers, and embroiderers. Yet all that magnificence only made her plain face and unpleasant manner more obvious. King Charming gave her one look and turned his eyes elsewhere. The Queen chose to believe that such a handsome and powerful visitor must be bashful. She moved Turritella wherever he looked and kept her daughter squarely before him. At last King Charming could bear the performance no longer. He had heard that another princess lived at the palace, a princess named Fiordelisa, and he asked where she was.
        - id: ch01-b12
          speaker: turritella
          text: Yes. There she is in the corner, hiding because she has nothing fine to wear.
        - id: ch01-b13
          speaker: narrator
          text: Fiordelisa blushed. She looked so shy and so lovely that King Charming could only stare. He rose and bowed very low before her.
        - id: ch01-b14
          speaker: king_charming
          text: Madam, beauty like yours needs no ornaments.
        - id: ch01-b15
          speaker: fiordelisa
          text: Sire, I do not usually appear in a wrinkled, untidy dress. I would rather you had not seen me at all today.
        - id: ch01-b16
          speaker: king_charming
          text: That would be impossible. When a princess as beautiful as you is here, I cannot look at anyone else.
          emotion: surprised
        - id: ch01-b17
          speaker: queen
          text: Fiordelisa is vain enough already, Sire. Please do not flatter her any more.
          emotion: angry
        - id: ch01-b18
          speaker: narrator
          text: King Charming understood that the Queen was displeased, but he did not care. He admired Fiordelisa openly and talked with her for three hours. The Queen and Turritella were frantic when they saw which princess he preferred. They complained, begged, and pestered the King until he agreed to hide Fiordelisa for the rest of the visit.
        - id: ch01-b19
          speaker: narrator
          text: That night, four masked figures seized Fiordelisa on her way to bed. They carried her to the highest room of a tall tower and left her there. She knew they wanted to keep King Charming from falling in love with her. That made her captivity harder, because she already cared for him and would gladly have become his bride.
        - id: ch01-b20
          speaker: narrator
          text: King Charming knew nothing about the tower. He looked forward impatiently to meeting Fiordelisa again and tried to make her the subject of every conversation. The Queen had placed courtiers around him with strict orders about what they must say. Not one of them offered a kind word. They told him Fiordelisa was vain, changeable, and bad-tempered. They claimed she tormented her waiting maids. Her father gave her plenty of money, they said, but she was so mean that she refused to spend it and preferred to wander around dressed like a poor shepherdess. These reports vexed King Charming. He fell silent and remembered the crumpled white dress, Fiordelisa's blush, and the shame in her face. The clothes had been poor, certainly, but her embarrassment proved she was not used to wearing them. The courtiers' story did not fit the young woman he had met.
        - id: ch01-b21
          speaker: king_charming
          text: She was poorly dressed, but she was ashamed of it. That proves she is not used to such clothes. I cannot believe that someone with so lovely a face is as hateful as they say. No. The Queen is jealous for her own daughter's sake, and she has spread these stories.
        - id: ch01-b22
          speaker: narrator
          text: One courtier noticed how little the slander pleased him. When the others could not hear, that courtier began to praise Fiordelisa instead. King Charming became cheerful at once and listened eagerly. When the Queen questioned the courtiers later, their report confirmed her worst fears.
        - id: ch01-b23
          speaker: narrator
          text: High in the tower, Fiordelisa cried through the night.
        - id: ch01-b24
          speaker: fiordelisa
          text: It would have been bad enough to be locked in this gloomy tower before I met King Charming. Now he is here, enjoying the palace with everyone else. Keeping me away from him is unbearably cruel.
          emotion: sad
        - id: ch01-b25
          speaker: narrator
          text: The next day the Queen tried another way to win him. She sent King Charming magnificent jewels and lengths of the richest cloth, all supposedly chosen by the princess who wished him to be her knight. The finest piece had been made especially for the expected wedding. One enormous ruby had been cut into the shape of a heart. Several diamond arrows surrounded it, and one arrow pierced its center. Above the heart was a golden lover's knot bearing the words, “Only one can wound me.” A chain of immense pearls held the whole ornament. Since the world began, no jeweler had ever made anything like it. King Charming examined the shining heart and could hardly believe such a gift had been sent to him.
        - id: ch01-b26
          speaker: page
          text: Sire, the Princess asks you to accept these gifts and choose to be her knight.
        - id: ch01-b27
          speaker: king_charming
          text: Does the lovely Fiordelisa truly think of me so kindly?
          emotion: surprised
        - id: ch01-b28
          speaker: page
          text: You have mistaken the name, Sire. I came for Princess Turritella.
        - id: ch01-b29
          speaker: king_charming
          text: So Turritella wants me for her knight. I am sorry, but I cannot accept that honor.
        - id: ch01-b30
          speaker: narrator
          text: He sent every gift back. The Queen and Turritella were furious at his contempt. The next time he entered their hall, he searched everywhere for Fiordelisa and turned at every opening door. The Queen saw his uneasiness but spoke only of the entertainments she was planning. At last he asked directly for Fiordelisa.
        - id: ch01-b31
          speaker: queen
          text: Her father has ordered her to remain in her rooms until my daughter is married.
        - id: ch01-b32
          speaker: king_charming
          text: Why would anyone keep that lovely princess a prisoner?
          emotion: angry
        - id: ch01-b33
          speaker: queen
          text: I do not know. Even if I did, I might not choose to tell you.
        - id: ch01-b34
          speaker: narrator
          text: Certain that Turritella was responsible, King Charming glared at her, took his leave, and returned to his rooms. There he spoke to the young squire who had traveled with him.
        - id: ch01-b35
          speaker: king_charming
          text: I would give everything I own to win the help of one of Fiordelisa's waiting women and speak with the Princess for a single moment.
        - id: ch01-b36
          speaker: squire
          text: That should be easy enough.

    - id: ch02
      title: The Dark Window
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The squire quickly made friends with one of the palace women. She claimed that Fiordelisa would come that evening to a small window overlooking the garden. King Charming could hide below it and speak with her in secret. The woman repeatedly warned him to take the greatest care. No servant was allowed to help the visitor reach Fiordelisa, and if the Queen learned what she had done, the woman would certainly lose her place. The squire was delighted. He promised that neither he nor the King would expose her, thanked her for the precious secret, and ran to announce his success.
        - id: ch02-b02
          speaker: narrator
          text: The delighted squire promised everything and hurried away with the news. The false waiting woman went straight to the Queen. The Queen decided that Turritella would stand at the little window instead, and drilled her so carefully in what to say that even Turritella could not get it wrong.
        - id: ch02-b03
          speaker: narrator
          text: The night was utterly dark. King Charming approached the window without seeing the trick and poured out all the love he had longed to confess to Fiordelisa.
        - id: ch02-b04
          speaker: turritella
          text: I am very unhappy. The Queen will never treat me better until her daughter is married.
        - id: ch02-b05
          speaker: narrator
          text: Turritella repeated the answers the Queen had taught her. She said she was terribly unhappy and could expect no kinder treatment until the Queen's own daughter was married. King Charming believed every word came from Fiordelisa. He begged the hidden woman to marry him and drew his ring from his finger as a pledge. In the darkness, he slipped it onto Turritella's hand. She answered as well as she could, though none of her replies sounded quite like the gentle, clever Princess he remembered. For a moment the difference troubled him. Then he persuaded himself that fear was making Fiordelisa awkward. She must be listening for the Queen's footsteps and choosing every word with care. He would not leave until she promised another meeting on the following night. Turritella gave that promise readily.
        - id: ch02-b06
          speaker: narrator
          text: The Queen rejoiced. The following night King Charming arrived in a chariot given to him by an Enchanter. Flying frogs drew it through the air. He helped the muffled Turritella inside, climbed in beside her, and cried out in triumph.
        - id: ch02-b07
          speaker: king_charming
          text: You are free now, my Princess. Where shall we hold our wedding?
          emotion: happy
        - id: ch02-b08
          speaker: turritella
          text: Fairy Mazilla is my godmother. I want to be married at her castle.
        - id: ch02-b09
          speaker: narrator
          text: Turritella kept her head hidden inside her mantle and named Fairy Mazilla's castle. The flying frogs carried a map of the whole world inside their heads, so no road or mountain could confuse them. At King Charming's command they sprang into the sky, pulling the chariot swiftly over the dark land. Before long, the travelers stood inside Mazilla's brilliantly lighted castle. One clear look should have exposed Turritella at once. She knew it, and held the mantle more tightly around her face. Before the King could question her, she asked to see her godmother alone. She hurried into another room and confessed the whole plan, from the false waiting woman to the ring and the stolen flight.
        - id: ch02-b10
          speaker: fairy_mazilla
          text: Oh, my child, this will not be easy. He loves Fiordelisa far too much to accept you quietly. I am certain he will resist us.
        - id: ch02-b11
          speaker: narrator
          text: King Charming waited in a room whose diamond walls were clear enough for him to see Mazilla and Turritella whispering together. He could not understand it.
        - id: ch02-b12
          speaker: king_charming
          text: Who betrayed us? Why is our enemy here? She must be plotting to stop the wedding. Why does my dear Fiordelisa not come back to me?
        - id: ch02-b13
          speaker: narrator
          text: The truth was worse than anything he imagined. Mazilla entered with Turritella by the hand.
        - id: ch02-b14
          speaker: fairy_mazilla
          text: King Charming, here is Princess Turritella, the lady to whom you gave your promise. We will have the wedding at once.
        - id: ch02-b15
          speaker: king_charming
          text: Me? Marry that little creature? I never promised her anything!
          emotion: surprised
        - id: ch02-b16
          speaker: fairy_mazilla
          text: Enough. Have you no respect for a Fairy?
          emotion: angry
        - id: ch02-b17
          speaker: king_charming
          text: Madam, I will show you every respect a Fairy deserves, as soon as you give me back my Princess.
        - id: ch02-b18
          speaker: turritella
          text: Am I not standing here? Look at the ring you gave me. If you did not speak with me at that little window, who was it?
        - id: ch02-b19
          speaker: king_charming
          text: So every part of it was a trick! Where is my chariot? I will not remain here another moment.
          emotion: angry
        - id: ch02-b20
          speaker: fairy_mazilla
          text: Not so quickly.
        - id: ch02-b21
          speaker: narrator
          text: Mazilla touched his feet, and they stuck to the floor as firmly as if they had been nailed there.
        - id: ch02-b22
          speaker: king_charming
          text: Do anything you wish to me. Turn me to stone if you like. I will never marry anyone but Fiordelisa.
        - id: ch02-b23
          speaker: narrator
          text: After that, King Charming refused to say another word in favor of the marriage. Mazilla scolded him, threatened him, and described every punishment her magic could invent. Turritella tried tears. When tears failed, she shouted at him. She raged at Fiordelisa, at the dark window, and at the King himself. This continued for twenty days and twenty nights. Through it all, King Charming would not yield. He remained fixed to the floor, but his purpose was just as firmly fixed. At last Mazilla was utterly tired of his stubbornness and decided to force him into one final choice.
        - id: ch02-b24
          speaker: fairy_mazilla
          text: Choose. Either marry my goddaughter, or spend seven years doing penance for breaking your promise to her.
          emotion: angry
        - id: ch02-b25
          speaker: king_charming
          text: Choose any punishment you please, as long as it frees me from this ugly scold!
          emotion: happy
        - id: ch02-b26
          speaker: turritella
          text: A scold? Who are you to call me that? You are a miserable King who breaks his word and rides around behind a team of croaking swamp frogs!
          emotion: angry
        - id: ch02-b27
          speaker: fairy_mazilla
          text: No more insults. Fly out that window, ungrateful King, and spend seven years as a Blue Bird!
          emotion: angry
        - id: ch02-b28
          speaker: narrator
          text: Even as Mazilla spoke, King Charming's face began to change. His arms drew close to his sides and spread again as wings. His feet shrank into little crooked black claws. In a moment, the tall young King had become a slender bird covered in shining blue feathers. His new beak gleamed like ivory, and his eyes were as bright as stars. A crown of white feathers stood upon his head, the last sign of the king he had been. When the transformation was complete, he gave one long, sorrowful cry. Then he beat his wings, darted through the open window, and flew into the night. Behind him came the mocking laughter of Turritella and Fairy Mazilla.
        - id: ch02-b29
          speaker: narrator
          text: He flew to the deepest part of the wood and settled on a cypress tree to mourn.
        - id: ch02-b30
          speaker: king_charming
          text: Seven years! What may happen to Fiordelisa in all that time? Her cruel stepmother may marry her to someone else before I am myself again. If that happens, what reason will I have to live?
          emotion: sad
        - id: ch02-b31
          speaker: narrator
          text: Mazilla sent Turritella home. The Queen had waited anxiously for news of the wedding, and when she heard the truth, all her anger fell on Fiordelisa.
        - id: ch02-b32
          speaker: queen
          text: She will regret the day King Charming admired her.
          emotion: angry
        - id: ch02-b33
          speaker: narrator
          text: The Queen and Turritella climbed the long stairs to the tower. Fiordelisa had been left alone with her grief and expected no visitor. She was amazed when the door opened and Turritella entered dressed in a royal mantle with a diamond crown on her head. The Queen announced that her daughter had come to display a few wedding presents. While she spoke, Turritella slowly spread out lace, jewels, heavy brocades, and bright ribbons. She made sure each treasure passed directly before Fiordelisa's unwilling eyes. Most of all, she kept lifting the hand that wore King Charming's ring. It was much too large for her finger, so she had pushed it onto her thumb. Fiordelisa recognized it at once, and the last of her hope gave way.
        - id: ch02-b34
          speaker: queen
          text: My daughter came to show you her wedding gifts. She is King Charming's bride now. They are the happiest pair in the world, and he loves her beyond measure.
        - id: ch02-b35
          speaker: narrator
          text: Turritella spread lace, jewels, brocade, and ribbons before her. Once Fiordelisa recognized the ring, she could no longer doubt the story.
        - id: ch02-b36
          speaker: fiordelisa
          text: Take these wretched ornaments away! What pleasure can they give someone who is locked in a tower?
          emotion: sad
        - id: ch02-b37
          speaker: narrator
          text: She fainted. The Queen laughed and left her on the floor without comfort or help. That night she told the King that Fiordelisa had foolishly fallen in love with King Charming, though he had never preferred her, and should remain imprisoned until she recovered her senses. Her father said the matter belonged to the Queen and she could give any order she liked.

    - id: ch03
      title: The Blue Bird at the Tower
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: When Fiordelisa woke and remembered what she had heard, she wept bitterly. She believed King Charming was lost forever. All night she sat at the open window, sighing and mourning. At dawn she crept into the darkest corner of the room. When night returned, she leaned into the darkness once more.
        - id: ch03-b02
          speaker: narrator
          text: The Blue Bird had been circling the palace, hoping to find her. He dared not go near the windows while Turritella might recognize him. Tired and sad, he perched on a tall fir beside the tower and began to sing himself to sleep. Then he heard a soft voice lamenting.
        - id: ch03-b03
          speaker: fiordelisa
          text: Cruel Queen, what did I ever do to deserve this prison? Was I not unhappy enough already? Why did you have to boast of your daughter's happiness as King Charming's bride?
          emotion: sad
        - id: ch03-b04
          speaker: narrator
          text: Astonished, the Blue Bird waited for daylight. As soon as he could see, he flew toward the voice, but the window was closed. The next night he watched again. In the clear moonlight, he saw Fiordelisa herself.
        - id: ch03-b05
          speaker: king_charming
          text: My Princess! Have I truly found you at last?
          emotion: surprised
        - id: ch03-b06
          speaker: fiordelisa
          text: Who is speaking to me?
          emotion: surprised
        - id: ch03-b07
          speaker: king_charming
          text: You spoke my name only a moment ago, and now you do not know me. I cannot blame you, Fiordelisa. I am only a Blue Bird, and I must stay this way for seven years.
          emotion: sad
        - id: ch03-b08
          speaker: fiordelisa
          text: Little Blue Bird, can you really be the mighty King Charming?
          emotion: surprised
        - id: ch03-b09
          speaker: narrator
          text: She stroked his feathers tenderly.
        - id: ch03-b10
          speaker: king_charming
          text: It is true. I was punished for remaining faithful to you. Even if the spell lasted twice as long, I would bear it gladly rather than give you up.
        - id: ch03-b11
          speaker: fiordelisa
          text: But Turritella came here dressed as your bride. She wore the royal mantle and the diamond crown you gave her. I saw your own ring on her thumb.
        - id: ch03-b12
          speaker: narrator
          text: The Blue Bird grew furious. He told Fiordelisa about the dark window, the stolen journey, and Mazilla's command that he marry Turritella. He explained how refusing had brought the seven-year spell upon him.
        - id: ch03-b13
          speaker: narrator
          text: Fiordelisa was overjoyed to know he had stayed true. She could have listened forever, but sunrise forced them apart. He promised to return after dark, then hid in a hollow in the fir tree. Fiordelisa spent the day afraid that a trap or an eagle would take him.
        - id: ch03-b14
          speaker: narrator
          text: The Blue Bird did not stay hidden for long. He wanted to bring Fiordelisa some sign of his love, though the journey would take him far from the tower. He flew on and on until the roofs of his own palace appeared below. No one there knew the bright bird was their missing King. He slipped inside through a broken window and made his way to the cabinet where his jewels were kept. From all his treasures, he chose a splendid diamond ring for Fiordelisa. Then he carried it through the air all the way back to the tower. By the time he arrived, the Princess was sitting at the open window and watching anxiously for him. She was delighted by the ring, but gently scolded him for taking such a risk merely to find her a present.
        - id: ch03-b15
          speaker: king_charming
          text: Promise me you will always wear it.
        - id: ch03-b16
          speaker: fiordelisa
          text: I promise, if you will visit me by day as well as by night.
        - id: ch03-b17
          speaker: narrator
          text: They talked until morning. The next day he returned to his treasury and brought her two bracelets, each carved from one enormous emerald. Fiordelisa shook her head at him.
        - id: ch03-b18
          speaker: fiordelisa
          text: Do you think I love you so little that I need presents to remember you?
        - id: ch03-b19
          speaker: king_charming
          text: No, my Princess. I love you so much that words never seem enough. These trinkets only show that I was thinking of you while I had to be away.
        - id: ch03-b20
          speaker: narrator
          text: On the following night he gave her a watch set inside a single pearl. Fiordelisa laughed softly.
        - id: ch03-b21
          speaker: fiordelisa
          text: A watch is a fitting gift. Since I found you again, I have lost all sense of time. The hours with you feel like minutes, and the hours without you feel like years.
        - id: ch03-b22
          speaker: king_charming
          text: Those hours cannot feel as long to you as they do to me.
        - id: ch03-b23
          speaker: narrator
          text: Day after day he made the dangerous journey back to his palace and returned with something beautiful. He carried diamonds that flashed in the moonlight, deep red rubies, milky opals, pearls, emeralds, and sapphires. Fiordelisa did not need them as proof of his love, but each night she put them on because their beauty pleased him. Before daylight, she removed every stone and hid the whole treasure inside her straw mattress, where the Queen's servants would not see it. During the day, the Blue Bird stayed among the branches of the tall fir. Whenever the sun shone, he sang to Fiordelisa in a voice so sweet that people passing through the wood stopped to listen. None of them could see the singer. They went on their way saying that a spirit must live among the trees.
        - id: ch03-b24
          speaker: narrator
          text: Two years passed. Fiordelisa remained a prisoner, and Turritella remained unmarried. Every neighboring prince gave the Queen the same answer. He would gladly marry Fiordelisa, but he would never marry Turritella. The Queen blamed her captive stepdaughter.
        - id: ch03-b25
          speaker: queen
          text: Fiordelisa must be plotting with them just to torment me. We will go and accuse her.
        - id: ch03-b26
          speaker: narrator
          text: Near midnight, the Queen and Turritella climbed the tower. Fiordelisa sat at the open window covered in jewels, singing with the Blue Bird. The Queen stopped outside the door and listened.
        - id: ch03-b27
          speakers: [fiordelisa, king_charming]
          ensemble: duo
          text: What an unlucky pair are we, one in a prison and one in a tree. Faithfulness brought us sorrow and pain, but all their cruel tricks are in vain. Nothing can tear our loving hearts apart.
          emotion: happy
        - id: ch03-b28
          speaker: queen
          text: Turritella, there is treachery happening in this room!
          emotion: angry
        - id: ch03-b29
          speaker: narrator
          text: The Queen burst through the door. Fiordelisa quickly shut the window, giving the Blue Bird time to escape, and calmly faced a storm of accusations.
        - id: ch03-b30
          speaker: queen
          text: We have uncovered your schemes, Madam. Do not imagine your royal rank will protect you from punishment.
          emotion: angry
        - id: ch03-b31
          speaker: fiordelisa
          text: Who am I supposed to be plotting with? You have kept me here for two years. I have seen no one except the guards you sent.
        - id: ch03-b32
          speaker: narrator
          text: The Queen and Turritella stared at her beauty and at the blaze of jewels around her.
        - id: ch03-b33
          speaker: queen
          text: Where did you get all these diamonds? Are you going to tell me there is a mine hidden in this tower?
        - id: ch03-b34
          speaker: fiordelisa
          text: I did find them here.
        - id: ch03-b35
          speaker: queen
          text: Then who are you dressing up for? At the grandest court occasions, I have never seen you wear half as much.
        - id: ch03-b36
          speaker: fiordelisa
          text: I dress for myself. You must agree that I have had plenty of free time. Surely I may spend some of it making myself look fine.
        - id: ch03-b37
          speaker: queen
          text: That is a neat answer. I think I will search the room and judge for myself.
        - id: ch03-b38
          speaker: narrator
          text: The Queen and Turritella began a thorough search. They looked behind the hangings, under the few pieces of furniture, along the walls, and in every corner of the little room. At last they pulled apart the straw mattress. Out fell such a quantity of pearls, diamonds, rubies, opals, emeralds, and sapphires that both women stood speechless. They could not understand how a prisoner at the top of a guarded tower had gathered a king's ransom in jewels. Surprise soon gave way to another cruel plan. The Queen had brought a packet of false letters. She meant to hide them in the room and then discover them as proof that Fiordelisa had been writing to her father's enemies. The chimney seemed the perfect hiding place, and the Queen moved toward it with the packet in her hand.
        - id: ch03-b39
          speaker: narrator
          text: Fortunately, the Blue Bird had hidden in that very chimney to watch over Fiordelisa.
        - id: ch03-b40
          speaker: king_charming
          text: Take care, Fiordelisa! Your lying enemy is setting a trap for you.
        - id: ch03-b41
          speaker: narrator
          text: The mysterious voice terrified the Queen. She snatched up the letters and hurried away with Turritella. Together they tried to decide what Fairy or Enchanter was helping the Princess. At last they sent a maid to spy on her night and day. The maid was to pretend she was too stupid to notice anything and report everything she saw.
        - id: ch03-b42
          speaker: narrator
          text: Fiordelisa guessed the maid's purpose. She dared not call the Blue Bird, fearing he would be harmed if anyone discovered him. For a whole month, the days dragged and the nights felt empty. She never approached the window.

    - id: ch04
      title: The Cruel Trap
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: At last, exhaustion overcame the spy and she fell into a deep sleep. The moment Fiordelisa saw this, she ran to the window and called softly into the night.
        - id: ch04-b02
          speaker: fiordelisa
          text: Blue Bird, blue as the sky, fly to me now. There is nobody by.
        - id: ch04-b03
          speaker: narrator
          text: The Blue Bird had never stopped circling close enough to see and hear the tower. He came at once. They were so happy to meet again, and had so much to tell each other, that the whole night seemed no longer than five minutes. At sunrise, he had to fly away.
        - id: ch04-b04
          speaker: narrator
          text: The spy slept soundly the next night too. The lovers began to think they were safe and planned to return to their old happiness. On the third night, however, the maid was less tired. When Fiordelisa opened the window and called, the spy woke but slyly kept her eyes closed.
        - id: ch04-b05
          speaker: fiordelisa
          text: Blue Bird, blue as the sky, fly to me now. There is nobody nigh.
        - id: ch04-b06
          speaker: narrator
          text: Soon the spy heard two voices speaking softly near the window. She waited, breathing slowly so Fiordelisa would believe she was still asleep. Then she peeped cautiously through half-closed eyes. Moonlight filled the little room, and in it she saw the loveliest blue bird in the world. Its feathers shone, its ivory beak moved like a human mouth, and it spoke tenderly with the Princess. Fiordelisa answered it as she would answer someone she loved. She stroked the bird, caressed its feathers, and told it how deeply she had missed these visits. The spy did not lose a single word. She remained still until dawn, when the Blue Bird reluctantly said farewell and flew away. The moment Fiordelisa turned from the window, the maid hurried out and ran straight to the Queen with everything she had seen and heard.
        - id: ch04-b07
          speaker: narrator
          text: The Queen summoned Turritella. They quickly decided the bird must be King Charming himself.
        - id: ch04-b08
          speaker: queen
          text: That insolent Princess! We believed she was miserable, but all this time she has been happy with that faithless King. I know exactly how we will take revenge.
          emotion: angry
        - id: ch04-b09
          speaker: narrator
          text: The spy returned and pretended to sleep more deeply than ever. She even went to bed early and snored convincingly. Fiordelisa trusted the performance and called from her window, but no bird came. She waited, listened, and called through the whole night.
        - id: ch04-b10
          speaker: narrator
          text: The Queen had prepared the tree itself as a weapon. Her servants hung knives and swords among the branches. They fixed razors, shears, billhooks, and sickles wherever a bird might land or pass. In the darkness the shining edges were impossible to see. When the Blue Bird heard Fiordelisa's familiar call, he flew joyfully toward the tower. His wings struck the first blades before he knew there was danger. He tried to turn, but more steel caught him from every side. The knives slashed his blue feathers, the shears clipped his little black feet, and the hooks pierced him again and again. Wounded in twenty places, he fell backward into his hiding place in the tree. There he lay bleeding and groaning. Since only Fiordelisa knew he would come when she called, he believed she must have betrayed his secret to regain her freedom.
        - id: ch04-b11
          speaker: king_charming
          text: Fiordelisa, can someone so lovely truly be so faithless? Then I may as well die now.
          emotion: sad
        - id: ch04-b12
          speaker: narrator
          text: He turned onto his side and began to die. Yet his friend the Enchanter had been searching for him. When the frog chariot came home without King Charming, the Enchanter had grown alarmed. He had traveled around the world eight times, calling everywhere he went. At that very moment he was crossing the wood once more.
        - id: ch04-b13
          speaker: enchanter
          text: Charming! King Charming! Are you here?
        - id: ch04-b14
          speaker: king_charming
          text: I am here.
        - id: ch04-b15
          speaker: narrator
          text: The voice was so faint that the Enchanter could see no one.
        - id: ch04-b16
          speaker: king_charming
          text: I am a Blue Bird.
        - id: ch04-b17
          speaker: narrator
          text: The Enchanter found him at once. Seeing his terrible wounds, he ran through the wood gathering magic herbs. With the herbs and a few spells, he soon made the King whole again.
        - id: ch04-b18
          speaker: enchanter
          text: Now tell me everything. I am certain there is a princess at the bottom of this.
        - id: ch04-b19
          speaker: king_charming
          text: There are two of them.
        - id: ch04-b20
          speaker: narrator
          text: With a bitter smile, King Charming began at the first visit to Fiordelisa's court. He told the Enchanter about the dark window, Turritella's deception, Mazilla's spell, and the two happy years beside the tower. Then he described the hidden blades and the wounds that had nearly killed him. He could imagine only one explanation. Fiordelisa must have revealed the secret of his visits so she could make peace with the Queen and win her freedom. In his pain, he said many harsh things about her changeable heart and her beauty, which now seemed deceptive to him. The Enchanter agreed with every accusation and went further. In his opinion, all princesses were alike except that some were more beautiful than others. King Charming should forget Fiordelisa and be done with the whole unhappy matter. But though the King believed himself betrayed, hearing another person condemn her did not please him at all.
        - id: ch04-b21
          speaker: enchanter
          text: What will you do now? You still have five years left as a Blue Bird.
        - id: ch04-b22
          speaker: king_charming
          text: Take me to your palace. At least you can keep me in a cage where cats and swords cannot reach me.
        - id: ch04-b23
          speaker: enchanter
          text: That is best for now. But I am an Enchanter for a reason. Before long, I will surely think of a way to help you.
        - id: ch04-b24
          speaker: narrator
          text: Meanwhile, Fiordelisa sat at her window day and night, calling in vain. She imagined every dreadful thing that might have happened to the Blue Bird until she became pale and thin. The Queen and Turritella triumphed, but not for long. Fiordelisa's father fell ill and died. Then the people rebelled and came together to the palace, demanding that Fiordelisa be released.
        - id: ch04-b25
          speaker: narrator
          text: The Queen came out onto the palace balcony and tried to frighten the crowd with proud words and threats. The people had endured enough. Their anger rose until they rushed forward together and broke open the heavy palace doors. One of the doors flew backward with such force that it struck the Queen and killed her. Turritella saw what had happened and fled from the palace to seek Fairy Mazilla's protection. The nobles of the kingdom went at once to the tower. They climbed to its highest room, brought Fiordelisa out of the prison where she had spent two long years, and led her before the people. The whole kingdom accepted her as its rightful Queen.
        - id: ch04-b26
          speaker: narrator
          text: With care and kindness, Fiordelisa recovered from her long imprisonment and soon looked more beautiful than ever. She consulted her courtiers and arranged for them to govern while she was away. Then she filled a bag with jewels and secretly set out alone to search for the Blue Bird.

    - id: ch05
      title: Fiordelisa's Journey
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The Enchanter cared faithfully for King Charming, but his magic was not strong enough to undo Mazilla's spell. At last he decided to bargain with her. Fairies and Enchanters are cousins of a sort. After five or six hundred years of quarreling and making peace, they understand one another rather well. Mazilla received him graciously.
        - id: ch05-b02
          speaker: fairy_mazilla
          text: Well, cousin, what brings you here?
        - id: ch05-b03
          speaker: enchanter
          text: You could do me a great kindness. A King who is my friend had the misfortune to offend you.
        - id: ch05-b04
          speaker: fairy_mazilla
          text: Ah, I know the one. I am sorry I cannot oblige you. He will have no mercy from me unless he marries my goddaughter. There she is, looking so pretty and charming. Let him consider my offer.
        - id: ch05-b05
          speaker: narrator
          text: The Enchanter looked toward Turritella and found not one word to say. To him she looked truly frightful, no matter how prettily Mazilla described her. Still, he could not go away without making one more effort for his friend. King Charming was in constant danger as long as he lived inside a cage. Once, the nail holding it to the wall had pulled loose. The cage fell hard to the floor, throwing his feathered Majesty against the bars. On that same occasion, a cat happened to be in the room. Before anyone could stop her, she reached through the bars and scratched the King close to one eye. The wound had nearly blinded him. On another day, his servants forgot that a bird could be thirsty. They left his water cup empty so long that he almost died before anyone noticed.
        - id: ch05-b06
          speaker: narrator
          text: Worse still, his kingdom was in danger. He had been absent so long that his people believed him dead. After considering all this, the Enchanter accepted a bargain. Mazilla would restore the King's human form and bring Turritella to his palace for several months. If he still refused to marry her when the time ended, he would become a Blue Bird again.
        - id: ch05-b07
          speaker: narrator
          text: Mazilla dressed Turritella in gold and silver. They mounted a flying dragon and soon reached King Charming's palace, where the Enchanter had brought him. Three strokes of Mazilla's wand restored his own shape. He was as handsome as ever, but one sight of Turritella made the price of his freedom seem very high. The thought of marrying her made him shudder.
        - id: ch05-b08
          speaker: narrator
          text: Far away, Queen Fiordelisa had begun her search. She disguised herself as a poor peasant girl so no one would stop a queen traveling alone. A broad straw hat shadowed her face, plain clothes hid her rank, and an old sack hung over her shoulder. The journey was long and weary. Sometimes she crossed the sea, though she did not know whether the Blue Bird had ever flown beyond the shore. Sometimes she traveled over land. She went on foot when there was no other way and rode on horseback when she could. No guide could point toward an enchanted bird, and no map showed his hiding place. All the while, one fear followed her. Every difficult mile might be taking her farther from King Charming instead of closer to him.
        - id: ch05-b09
          speaker: narrator
          text: One day she sat exhausted beside a brook. She cooled her feet in the clear water and combed her long golden hair in the sunlight. A bent old woman came by, leaning on a stick, and stopped beside her.
        - id: ch05-b10
          speaker: old_woman_fairy
          text: Why are you all alone, my pretty child?
        - id: ch05-b11
          speaker: fiordelisa
          text: Good mother, I am too sad to want anyone with me.
          emotion: sad
        - id: ch05-b12
          speaker: old_woman_fairy
          text: Do not cry. Tell me honestly what troubles you. Perhaps I can help.
          emotion: calm
        - id: ch05-b13
          speaker: narrator
          text: Fiordelisa told her everything and explained that she was searching for the Blue Bird. At once the bent woman stood straight. She became tall, young, and beautiful, and smiled at the astonished Queen.
        - id: ch05-b14
          speaker: old_woman_fairy
          text: Lovely Queen, the King you seek is no longer a bird. My sister Mazilla gave him back his true form, and he is in his own kingdom. Have no fear. You will reach him, and good fortune will follow you. Take these four eggs. Whenever you face a great difficulty, break one and help will come.
        - id: ch05-b15
          speaker: narrator
          text: The Fairy vanished. Encouraged, Fiordelisa put the eggs in her bag and turned toward King Charming's land. She walked for eight days and eight nights before reaching a towering hill of polished ivory. It was so smooth and steep that no foot could grip it. She tried again and again, scrambling upward and sliding down, only to land where she had begun.
        - id: ch05-b16
          speaker: narrator
          text: Fiordelisa tried to climb the ivory hill a thousand times. She pressed her hands against the polished surface, searched for the smallest hollow, and scrambled upward whenever she found one. Each attempt ended in the same long slide. However hard she worked, she always landed at the exact place where she had started. At last she sat at the foot of the hill in despair. Then she remembered the Fairy's eggs. She took out the first and broke it carefully. Tiny golden hooks spilled into her hands. She fastened them to her fingers, palms, feet, and knees. The hooks caught where ordinary hands and shoes could not. With their help she climbed steadily up the shining slope until at last she stood on top.
        - id: ch05-b17
          speaker: narrator
          text: A new obstacle waited on the other side. The whole valley was one polished mirror, crowded with thousands of people admiring themselves. It was a magic mirror that showed each visitor exactly as that person wished to look, and pilgrims came from every corner of the world to gaze into it.
        - id: ch05-b18
          speaker: narrator
          text: No traveler had ever managed to reach the top of the ivory hill before. When the people in the valley looked up and saw Fiordelisa standing there, they raised a tremendous cry. Their magic mirror mattered more to them than her safety. They shouted that if she set even one foot on the glass, her weight would crack it into pieces and spoil the reflections they had crossed the world to see. Fiordelisa looked back at the steep ivory behind her and knew that climbing down would be more dangerous than climbing up. She could not go forward and dared not go back. So she broke the second egg. From it came a light chariot drawn by two white doves. Fiordelisa climbed inside, and the birds lifted her over the angry crowd. She floated away as softly as a feather.
        - id: ch05-b19
          speaker: narrator
          text: After a night and a day, the doves landed outside King Charming's capital. Fiordelisa kissed and thanked them, then entered the town with her heart pounding. She asked where she could see the King, but the people only laughed at the shabby girl.
        - id: ch05-b20
          speaker: townsman
          text: See the King? Why would a little kitchen maid like you want to see him? Wash your face first. Your eyes are not clear enough to look at a king.
        - id: ch05-b21
          speaker: narrator
          text: Fiordelisa had dirtied her face and pulled her hair over her eyes so no one would know her. She walked farther and asked again. This time she learned that the next day the King would ride through the streets with Princess Turritella. People said he had finally agreed to marry her.
        - id: ch05-b22
          speaker: narrator
          text: The news crushed Fiordelisa. Had she crossed the world only to learn that Turritella had made King Charming forget her? Too tired and miserable to take another step, she sat in a doorway and cried all night.

    - id: ch06
      title: The Chamber of Echoes
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: At daybreak Fiordelisa hurried to the palace. The guards drove her away fifty times, but at last she slipped inside. In the great hall, two thrones stood ready for King Charming and Turritella, whom everyone already treated as a queen. Fiordelisa hid behind a marble pillar.
        - id: ch06-b02
          speaker: narrator
          text: Turritella soon appeared in rich clothes, as ugly as ever. King Charming came beside her, even more handsome and splendid than Fiordelisa remembered. Once Turritella had settled on her throne, the disguised Queen approached.
        - id: ch06-b03
          speaker: turritella
          text: Who are you? How dare you come so close to my royal throne?
        - id: ch06-b04
          speaker: fiordelisa
          text: People call me the little kitchen maid. I have precious things to sell.
        - id: ch06-b05
          speaker: narrator
          text: She reached into the old sack and brought out the emerald bracelets King Charming had given her.
        - id: ch06-b06
          speaker: turritella
          text: Those are pretty pieces of glass. I suppose you expect five silver coins for them.
        - id: ch06-b07
          speaker: fiordelisa
          text: Show them to someone who knows jewels, Madam. Then we can discuss their price.
        - id: ch06-b08
          speaker: narrator
          text: Turritella loved King Charming as much as she could love anyone and seized every excuse to speak with him. She carried the bracelets over and asked their value. The moment he saw them, he remembered the pair he had given Fiordelisa. He turned pale, sighed, and fell into such sad thought that he forgot to answer.
        - id: ch06-b09
          speaker: king_charming
          text: I believe those bracelets are worth as much as my kingdom. I thought only one pair existed anywhere, but it seems there is another.
          emotion: sad
        - id: ch06-b10
          speaker: narrator
          text: Turritella returned to ask the kitchen maid's lowest price.
        - id: ch06-b11
          speaker: fiordelisa
          text: The price may be difficult for you. Let me spend one night in the Chamber of Echoes, and the emeralds are yours.
        - id: ch06-b12
          speaker: turritella
          text: Gladly, little kitchen maid.
          emotion: happy
        - id: ch06-b13
          speaker: narrator
          text: King Charming did not ask where the bracelets had come from. He desperately wanted to know, but asking meant speaking to Turritella, and he avoided that whenever he could.
        - id: ch06-b14
          speaker: narrator
          text: Long ago, as the Blue Bird, he had told Fiordelisa about the Chamber of Echoes. It lay directly beneath his bedroom and was built so cleverly that even its faintest whisper could be heard above. Fiordelisa meant to reproach him there for abandoning her. Once Turritella's servants left her alone in the room, she wept and lamented until dawn.
        - id: ch06-b15
          speaker: narrator
          text: Later, Turritella asked the pages what they had heard. They described a whole night of sighs and sobs. Fiordelisa said she often spoke aloud while dreaming. Yet King Charming had heard nothing. Every night he drank a sleeping potion and did not wake until the sun was high.
        - id: ch06-b16
          speaker: fiordelisa
          text: If he heard me, how could he remain so cruelly silent? But if he did not hear, how can I earn another night? I have many jewels, but nothing strange enough to tempt Turritella.
          emotion: sad
        - id: ch06-b17
          speaker: narrator
          text: She remembered the eggs and broke the third. Out rolled a tiny carriage of polished steel decorated with gold. Six green mice pulled it. A rose-colored rat drove, a gray rat rode behind, and the smallest, most charming figures sat inside. They danced and performed marvelous tricks. Fiordelisa clapped and danced for joy.
        - id: ch06-b18
          speaker: narrator
          text: That evening she waited on a shady garden path where Turritella was sure to pass. She sent the mice galloping and set the tiny passengers dancing.
        - id: ch06-b19
          speaker: turritella
          text: Little kitchen maid, what will you take for that mouse carriage?
          emotion: surprised
        - id: ch06-b20
          speaker: fiordelisa
          text: Let me sleep in the Chamber of Echoes once more.
        - id: ch06-b21
          speaker: turritella
          text: I will not refuse such a small request.
        - id: ch06-b22
          speaker: narrator
          text: Turritella handed the carriage to her ladies and whispered that the foolish girl did not know how to use her chances. That night Fiordelisa spoke every loving word she could think of. Again, it did no good. The sleeping potion kept the King from hearing her.
        - id: ch06-b23
          speaker: first_page
          text: That peasant girl must be out of her mind.
        - id: ch06-b24
          speaker: second_page
          text: Perhaps, but what she says is very sad and touching.
        - id: ch06-b25
          speaker: narrator
          text: Fiordelisa thought King Charming must have a heart of stone if he could hear her sorrow and ignore it. Only one egg remained. She broke it and found the greatest wonder yet, a perfectly cooked pie holding six living birds. They sang, talked, answered questions, and told fortunes in the most amusing way.
        - id: ch06-b26
          speaker: narrator
          text: Carrying this treasure, Fiordelisa waited again in the great hall. One of the King's pages passed her there.
        - id: ch06-b27
          speaker: first_page
          text: It is lucky the King takes a sleeping potion. Otherwise, your sighing would keep him awake all night.
        - id: ch06-b28
          speaker: narrator
          text: At last Fiordelisa understood. She drew a handful of pearls and diamonds from her sack.
        - id: ch06-b29
          speaker: fiordelisa
          text: Promise that the King will not receive his sleeping potion tonight, and all these jewels are yours.
        - id: ch06-b30
          speaker: first_page
          text: I promise gladly.
        - id: ch06-b31
          speaker: narrator
          text: Just then Turritella arrived. At the sight of the savory pie and its chattering birds, she cried out eagerly.
        - id: ch06-b32
          speaker: turritella
          text: What a wonderful pie! Tell me what you want for it.
        - id: ch06-b33
          speaker: fiordelisa
          text: The same price as before. One more night in the Chamber of Echoes.
        - id: ch06-b34
          speaker: turritella
          text: Of course. Only give me the pie.
        - id: ch06-b35
          speaker: narrator
          text: That night Fiordelisa waited until the palace seemed asleep. Then she began to mourn once more. The page had kept his promise and given King Charming a glass of water instead of the potion. He lay awake and heard every word. He even knew her voice, though he could not tell where it came from.
        - id: ch06-b36
          speaker: fiordelisa
          text: Charming, what did I ever do to make you abandon me and marry Turritella? If only you knew what I have suffered, and how far I traveled to find you.
          emotion: sad
        - id: ch06-b37
          speaker: king_charming
          text: Princess, how could you betray me to our cruel enemies after I loved you so dearly?
          emotion: sad
        - id: ch06-b38
          speaker: fiordelisa
          text: Find the little kitchen maid. She will explain everything.
        - id: ch06-b39
          speaker: narrator
          text: King Charming immediately called his pages.
        - id: ch06-b40
          speaker: king_charming
          text: Find the little kitchen maid and bring her to me at once.
        - id: ch06-b41
          speakers: [first_page, second_page]
          ensemble: duo
          text: That is easy, Sire. She is in the Chamber of Echoes.

    - id: ch07
      title: The True Wedding
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: The answer puzzled King Charming. How could the lovely Fiordelisa be a little kitchen maid? How could a kitchen maid have Fiordelisa's voice? He dressed in haste and ran down the hidden staircase to the Chamber of Echoes.
        - id: ch07-b02
          speaker: narrator
          text: There, on a pile of soft cushions, sat his beloved Princess. She had thrown off the ugly disguise and wore a white silk dress. Her golden hair shone in the gentle lamplight. Overjoyed, the King rushed to her feet and asked a thousand questions without waiting for a single answer.
        - id: ch07-b03
          speaker: narrator
          text: Fiordelisa was just as happy to see him. Only the thought of Fairy Mazilla troubled them. At that moment the Enchanter entered with a famous Fairy, the same kind stranger who had given Fiordelisa the four eggs.
        - id: ch07-b04
          speaker: old_woman_fairy
          text: The Enchanter and I are united in helping you. Mazilla has no power against both of us. You may marry Fiordelisa as soon as you wish.
        - id: ch07-b05
          speaker: narrator
          text: King Charming's joy was beyond words. At daylight, the news spread through the palace. Everyone who saw Fiordelisa loved her at once.
        - id: ch07-b06
          speaker: narrator
          text: When Turritella heard what had happened, she ran to the King. The sight of Fiordelisa beside him filled her with rage. Before she could speak, the Enchanter and the Fairy changed her into a great brown owl. She drifted through a palace window, hooting miserably.
        - id: ch07-b07
          speaker: narrator
          text: Then King Charming and Queen Fiordelisa celebrated their wedding with magnificent splendor. At last, after prisons, spells, wounds, and weary journeys, they were together. And they lived happily ever after.
