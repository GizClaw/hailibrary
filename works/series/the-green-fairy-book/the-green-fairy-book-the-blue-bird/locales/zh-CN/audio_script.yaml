audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，像编书人面对孩子娓娓而谈
        timbre: 温暖清朗
        pace: 舒缓而有自然起伏
        pitch: 中音
    old_king:
      display_name: 老国王
      tts:
        delivery: 软弱怕事，情绪来时毫不遮掩
        timbre: 浑厚而略显疲惫
        pace: 偏慢
        pitch: 中低音
    queen:
      display_name: 王后
      tts:
        delivery: 工于心计，傲慢尖刻
        timbre: 冷硬锐利
        pace: 稍快
        pitch: 中高音
    florine:
      display_name: 菲奥黛丽莎
      tts:
        delivery: 温柔真挚，苦难中仍有尊严
        timbre: 清澈柔美
        pace: 从容而自然
        pitch: 中高音
    trout:
      display_name: 图丽特拉
      tts:
        delivery: 骄横任性，得意时夸张卖弄
        timbre: 粗涩尖亮
        pace: 偏快
        pitch: 高音
    charming:
      display_name: 称心国王
      tts:
        delivery: 热烈坦率，坚定而有王者气度
        timbre: 明亮醇厚
        pace: 稳健有力
        pitch: 中音
    courtier:
      display_name: 宫廷臣子
      tts:
        delivery: 谨慎圆滑，话里有所保留
        timbre: 平稳清晰
        pace: 中速
        pitch: 中音
    page:
      display_name: 侍童
      tts:
        delivery: 恭敬机敏，说话干脆
        timbre: 年轻清亮
        pace: 稍快
        pitch: 中高音
    young_attendant:
      display_name: 年轻侍从
      tts:
        delivery: 热心利落，带着年轻人的自信
        timbre: 清朗轻快
        pace: 稍快
        pitch: 中音
    maid:
      display_name: 侍女
      tts:
        delivery: 表面殷勤，暗地狡猾
        timbre: 轻细柔滑
        pace: 中速
        pitch: 中高音
    mazilla:
      display_name: 玛齐拉仙女
      tts:
        delivery: 威严专横，发怒时凌厉逼人
        timbre: 深沉冷峻
        pace: 稍慢
        pitch: 中低音
    magician:
      display_name: 魔法师
      tts:
        delivery: 老练直率，偶尔带一点诙谐
        timbre: 温厚低沉
        pace: 从容
        pitch: 低音
    kind_fairy:
      display_name: 好心仙女
      tts:
        delivery: 慈爱沉静，安慰人时笃定温和
        timbre: 柔和明净
        pace: 舒缓
        pitch: 中音
    passerby:
      display_name: 路人
      tts:
        delivery: 粗声取笑，毫不客气
        timbre: 普通而响亮
        pace: 偏快
        pitch: 中音
    second_page:
      display_name: 另一名侍童
      tts:
        delivery: 心软诚实，语气带着同情
        timbre: 年轻温和
        pace: 中速
        pitch: 中音
  chapters:
    - id: ch01
      title: 白裙子里的公主
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前有个国王，富得金银一袋袋往外冒，疆土也大得望不到边。可王后去世以后，他什么都不在乎了。他把自己锁进小屋，悲痛起来就拿头撞墙。群臣怕他受伤，只得往挂毯后面塞满羽绒褥子，让他想撞便撞。臣民轮番来宽慰他，有人陪着叹气，有人故意逗他开心，他却像一句也没听见。
        - id: ch01-b02
          speaker: narrator
          text: >-
            最后来了一位裹黑斗篷的夫人。她哭得比国王还伤心，又是抽噎，又是擦泪，终于引起了他的注意。夫人说自己刚失去一个好丈夫，完全明白国王心里的滋味。她不敢劝国王少难过，只想把自己的眼泪添到他的眼泪里。国王听了哭得更厉害，也终于肯开口了。他长篇讲起亡后的每一样美德，夫人便细数亡夫的好。两个人聊着聊着，时光竟过得十分惬意。国王忘了再撞墙，夫人那双蓝汪汪的大眼睛也不必总是擦泪。后来，他们谈起别的事情，碰巧每一件都让国王很感兴趣。没过多久，举国上下便惊讶地听说，国王娶了这位哀伤的夫人。
        - id: ch01-b03
          speaker: narrator
          text: >-
            国王有个刚满十五岁的女儿，叫菲奥黛丽莎。她是世间最美丽、最可爱的公主，平日总是快活爱笑。新王后也把自己的女儿图丽特拉接进宫来。图丽特拉从小由教母玛齐拉仙女抚养。可教母无论怎样悉心照料，也没能让她的模样和性情讨人喜欢。王后一看她站在菲奥黛丽莎身边，显得又丑又凶，简直绝望了。她想尽办法挑拨国王和亲生女儿，只盼丈夫不再喜欢菲奥黛丽莎，转而疼爱图丽特拉。一天，国王说两个姑娘都到了出嫁的年纪。下一个身份合适的王子来宫廷拜访，他就从两个女儿中选一个嫁给那位王子。
        - id: ch01-b04
          speaker: queen
          text: 我的女儿当然要先嫁。她年纪更大，也比你的女儿可爱一千倍！
        - id: ch01-b05
          speaker: old_king
          text: 好吧，我不跟你争。你看着办就是。
        - id: ch01-b06
          speaker: narrator
          text: >-
            不久，消息传来，邻近各国最英俊、最显赫的称心国王要来拜访。王后立刻让珠宝匠、裁缝、织工和绣工全都开工，为图丽特拉赶制华服和首饰，却告诉老国王，菲奥黛丽莎什么新东西也不需要。来访前一夜，她又买通侍女，偷光了公主的衣裙和珠宝。第二天，菲奥黛丽莎想照自己的身份打扮起来，竟连一条缎带都找不到。她很快猜到是谁做的，却没有抱怨，只派人去商家购买衣料。商家说王后下了禁令，谁也不敢卖给她。公主只剩前一天穿过的白色小裙子。贵客到来时，她只好穿着那件皱巴巴的裙子下楼，悄悄躲在角落，希望没有人留意。
        - id: ch01-b07
          speaker: narrator
          text: >-
            王后用最盛大的礼节迎接客人，把一身珠光宝气的图丽特拉领到他面前。可华服和首饰不但没帮上忙，反而衬得图丽特拉更加丑陋。称心国王只看她一眼，马上便把目光转开了。王后却以为他只是害羞，想尽办法让女儿一直留在他眼前。称心国王忍了一阵，还是问起宫里是不是另有一位叫菲奥黛丽莎的公主。
        - id: ch01-b08
          speaker: trout
          text: 有啊，她就在那边。她嫌自己穿得不像样，正躲着不肯见人呢。
        - id: ch01-b09
          speaker: narrator
          text: >-
            菲奥黛丽莎羞红了脸，那副羞怯又美丽的样子，让称心国王看得惊叹不已。他起身走到她面前，深深行了一礼。
        - id: ch01-b10
          speaker: charming
          text: 公主殿下，您的美貌谁也比不了，哪里还需要什么装饰？
        - id: ch01-b11
          speaker: florine
          text: 陛下，我平常绝不会穿着这样又皱又乱的裙子见客。您要是没看见我，我倒不会这么难为情。
        - id: ch01-b12
          speaker: charming
          text: 那怎么可能？您一出现，我眼里哪还看得到别人！
        - id: ch01-b13
          speaker: queen
          text: 陛下，她本来就够自负了，您可别再拿这些好听话哄她。
        - id: ch01-b14
          speaker: narrator
          text: >-
            称心国王听出了王后的不快，根本不理会。他一直欣赏着菲奥黛丽莎，同她谈了整整三个钟头。王后和图丽特拉看出他的偏爱，急得近乎绝望。她们回头便缠着老国王，又诉苦又哀求，直到他答应在客人逗留期间，把亲生女儿藏到谁也看不见的地方。那天夜里，菲奥黛丽莎正要回房，四个蒙面人突然抓住她，把她带到高塔最顶上的小屋。她一下便明白，王后是怕称心国王爱上她。她悲痛极了，因为她也已经喜欢上了他，非常愿意被他选作新娘。
        - id: ch01-b15
          speaker: narrator
          text: >-
            称心国王对此毫不知情。他只盼着赶快再见公主，便试着向奉命陪伴自己的臣子谈起她。那些人早得了王后的命令，绝口不肯说她一句好话。他们说公主虚荣任性，脾气坏，最会折磨身边的侍女。老国王明明给了她很多钱，她却吝啬得一文也不肯花，宁愿穿着破旧衣裳，像个穷牧羊女一样四处走动。称心国王越听越烦恼，最后干脆沉默了下来。
        - id: ch01-b16
          speaker: charming
          text: >-
            她那天穿得确实寒酸，可她明明为此很难为情，可见平常不是这样。那张可爱的脸，怎么会藏着他们说的刻薄心肠？一定是王后嫉妒她，故意替自己的丑女儿说这些坏话。
        - id: ch01-b17
          speaker: narrator
          text: >-
            一个机灵的臣子见他不高兴，趁旁人听不见，悄悄称赞起菲奥黛丽莎。称心国王立刻有了精神，听得津津有味。王后盘问臣子之后，知道自己最担心的事已经发生。高塔里，可怜的公主哭了一整夜。
        - id: ch01-b18
          speaker: florine
          text: >-
            要是没见过称心国王就被关进这座阴森森的塔，已经够难受了。如今他明明就在宫里，人人都能陪着他，偏偏只有我被藏起来。他们怎么能这样狠心？
    - id: ch02
      title: 黑夜里的骗局
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            第二天，王后送给称心国王许多华美的珠宝和贵重衣料，还夹着一件为婚礼特制的宝物。那是一整块硕大的红宝石，被雕成一颗心，四周围着几支钻石箭，其中一支从心口穿过。红心上方装着一个金制的同心结，上面刻着“唯有一人能伤我”。整件宝物又悬在一串硕大的珍珠上。自从天地出现以来，还没人见过这样的珍宝。称心国王收到时十分惊讶。送礼的侍童请他收下，说公主已经选中他做自己的骑士。
        - id: ch02-b02
          speaker: charming
          text: 什么？美丽的菲奥黛丽莎竟这样惦记我，还肯给我鼓励？
          emotion: surprised
        - id: ch02-b03
          speaker: page
          text: 陛下，您把名字听错了。这份礼物是图丽特拉公主送的。
        - id: ch02-b04
          speaker: charming
          text: 原来是她想选我做骑士。很遗憾，这份荣幸我不能接受。
        - id: ch02-b05
          speaker: narrator
          text: >-
            他把华贵的礼物原样退了回去，王后和图丽特拉受了这样的轻蔑，气得发狂。后来他一有机会就去见老国王和王后，一进大厅便四下寻找菲奥黛丽莎。每次有人进门，他都猛然回头，整个人坐立不安，满心不快。王后看得清清楚楚，却装作什么也没发现，只顾谈论自己安排的种种娱乐。称心国王心不在焉地应付了几句，终于问自己是否有幸见见公主。
        - id: ch02-b06
          speaker: queen
          text: 她父亲已经下令，在我女儿成婚以前，她不许离开自己的房间。
        - id: ch02-b07
          speaker: charming
          text: 为什么要把那么好的公主关起来？
          emotion: angry
        - id: ch02-b08
          speaker: queen
          text: 我不知道。就算知道，也没有非告诉您的道理。
        - id: ch02-b09
          speaker: narrator
          text: >-
            称心国王认定是图丽特拉捣鬼，狠狠瞪她一眼，转身回到住处。他告诉年轻侍从，只要能打动公主的一名侍女，让他同菲奥黛丽莎说一会儿话，他愿意拿世上的一切来换。
        - id: ch02-b10
          speaker: young_attendant
          text: 这事好办，我一定替您想办法。
        - id: ch02-b11
          speaker: narrator
          text: >-
            年轻侍从很快同一名侍女熟络起来。侍女告诉他，傍晚公主会到一扇朝向花园的小窗前，国王可以在那里同她说话，只是绝不能叫人看见，否则她会丢掉差事。侍从满口答应，欢欢喜喜去报信。可奸诈的侍女转身就把一切告诉王后。王后让图丽特拉守在小窗前，又把该说什么、该做什么一一教给她。
        - id: ch02-b12
          speaker: narrator
          text: >-
            那夜漆黑一片，称心国王根本看不清窗内的人。他欢欢喜喜走到窗前，把藏在心里的话全说了出来，竭力让对方相信自己的爱情。图丽特拉照着王后的吩咐，说自己受尽苦楚，只要王后的女儿还没出嫁，她就不会得到善待。国王立刻恳求她嫁给自己，还摘下指环套在她手上。图丽特拉费了好大力气才把话答对，又答应第二夜再来。国王总觉得她的说话方式不像菲奥黛丽莎，可他替她找了理由，以为她只是怕王后突然撞见，才显得这样笨拙、不自然。
        - id: ch02-b13
          speaker: narrator
          text: >-
            第二天夜色刚落，称心国王驾着朋友魔法师送的车来到窗下，拉车的是一群会飞的青蛙。他接出图丽特拉，扶她上车，自己坐到她身旁。
        - id: ch02-b14
          speaker: charming
          text: 好了，我的公主，您自由了！我们的婚礼想在哪里举行？
          emotion: happy
        - id: ch02-b15
          speaker: trout
          text: 玛齐拉仙女是我的教母，我想去她的城堡成婚。
        - id: ch02-b16
          speaker: narrator
          text: >-
            那些会飞的青蛙脑子里装着全世界的地图，不用任何人指路，很快便把两人送到玛齐拉仙女的城堡。城堡里面灯火通明，照理说，称心国王一走进去就该发现身边的人不对。图丽特拉却早有准备，把斗篷裹得更加严实，又提出要先单独拜见教母。她赶紧找到仙女，把整个经过全说了出来，包括母亲怎样安排骗局，她又怎样在黑暗中冒充菲奥黛丽莎，骗到了称心国王的指环和婚约。
        - id: ch02-b17
          speaker: mazilla
          text: >-
            哎哟，我的孩子，这件事可不好办。他那么爱菲奥黛丽莎，绝不会轻易消气，肯定还要反抗我们！
        - id: ch02-b18
          speaker: narrator
          text: >-
            称心国王独自等在一间华丽的屋子里，四面墙壁全由钻石砌成，澄澈得几乎完全透明。他隔着墙，看见仙女和图丽特拉站在一起窃窃私语，心里迷惑极了。他还以为有人出卖了自己和菲奥黛丽莎，才让仇人一路追到这里。图丽特拉一定又在策划怎样破坏婚礼，可他最亲爱的菲奥黛丽莎为什么迟迟不肯回到身边呢？仙女终于牵着图丽特拉的手走进屋。她一开口，国王才知道，真相比他担心的还要糟糕。
        - id: ch02-b19
          speaker: mazilla
          text: 称心国王，同你订婚的是图丽特拉公主。现在就举行婚礼吧。
        - id: ch02-b20
          speaker: charming
          text: 我娶她？你们把我当什么人了？我从没向她许过婚！
          emotion: surprised
        - id: ch02-b21
          speaker: mazilla
          text: 住口！你竟敢对仙女这样无礼？
          emotion: angry
        - id: ch02-b22
          speaker: charming
          text: 夫人，只要您把我的公主还来，我一定给您一位仙女所能得到的全部敬意。
        - id: ch02-b23
          speaker: trout
          text: 我不就在这里吗？你的指环还在我手上。小窗前同你说话的人不是我，还能是谁？
        - id: ch02-b24
          speaker: charming
          text: 原来这全是骗局！我的车呢？我一刻也不在这里多留！
          emotion: angry
        - id: ch02-b25
          speaker: mazilla
          text: 别急着走呀。
        - id: ch02-b26
          speaker: narrator
          text: 仙女碰了碰他的双脚，那双脚立刻牢牢钉在地板上。
        - id: ch02-b27
          speaker: charming
          text: 随您处置。就算把我变成石头，我也只肯娶菲奥黛丽莎。
        - id: ch02-b28
          speaker: narrator
          text: >-
            此后他一句话也不肯说。仙女又骂又威胁，图丽特拉又哭又闹，足足折腾了二十天二十夜。玛齐拉终于被他的固执逼得筋疲力尽。
        - id: ch02-b29
          speaker: mazilla
          text: 你只有两个选择。娶我的教女，或者因为背弃婚约受罚七年。自己挑！
          emotion: angry
        - id: ch02-b30
          speaker: charming
          text: 只要能摆脱这个丑八怪、这个泼妇，您想怎样罚我都行！
          emotion: happy
        - id: ch02-b31
          speaker: trout
          text: >-
            泼妇？你算什么东西，也敢这样叫我！你不过是个不守信用的可怜国王，坐着沼泽里的呱呱青蛙拉的车到处跑！
          emotion: angry
        - id: ch02-b32
          speaker: mazilla
          text: 都不许再骂了！忘恩负义的国王，从窗户飞出去，做七年蓝鸟吧！
          emotion: angry
        - id: ch02-b33
          speaker: narrator
          text: >-
            话音刚落，国王的脸便改变了模样，双臂化成翅膀，双脚成了弯曲的黑爪。转眼之间，他有了纤细的鸟身，浑身披着闪亮的蓝羽毛，嘴白得像象牙，眼睛亮如星辰，头顶还有一冠白羽。变身一完成，他便发出一声悲鸣，从敞开的窗口飞走，身后追着图丽特拉和仙女嘲弄的笑声。他不停地飞，一直飞到树林最深处，最后落在一棵柏树上，哀叹起自己的命运。
        - id: ch02-b34
          speaker: charming
          text: >-
            唉，这七年里，我的菲奥黛丽莎会遇上什么事？等我恢复人形，她那狠毒的继母说不定早把她嫁给别人了。真到那一天，我活着还有什么意思？
          emotion: sad
    - id: ch03
      title: 高塔窗前的蓝鸟
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            玛齐拉把图丽特拉送回王后身边，王后正在焦急等待婚礼的消息。图丽特拉一回来，便把城堡里发生的事情从头讲了一遍。王后听得勃然大怒，却把满腔怒火全算在菲奥黛丽莎头上。她发誓，称心国王既然爱慕那个公主，就一定要让公主为此后悔。她意味深长地点着头，带上身穿王袍、头戴钻石王冠的图丽特拉，一同登上高塔。
        - id: ch03-b02
          speaker: queen
          text: >-
            我女儿特地来让你看看她的结婚礼物。她已经是称心国王的新娘，他们两个幸福极了，国王爱她爱得发狂呢。
        - id: ch03-b03
          speaker: narrator
          text: >-
            图丽特拉把花边、珠宝、锦缎和缎带一一摊开，还特意亮出拇指上的指环。菲奥黛丽莎一眼认出那是称心国王的东西，再也无法怀疑这桩婚事。
        - id: ch03-b04
          speaker: florine
          text: 把这些可恨的花哨东西拿走！我一个关在塔里的苦命人，看它们有什么乐趣？
          emotion: sad
        - id: ch03-b05
          speaker: narrator
          text: >-
            她说完便昏倒了。王后恶意地笑着，带图丽特拉扬长而去，把她独自丢在那里，没有安慰，也没有援助。当天夜里，王后又告诉老国王，公主单方面迷上了称心国王，对方从没对她表示过半点偏爱。她说最好把公主继续关在塔里，直到恢复理智。老国王仍旧不愿争执，只说一切由王后做主，她想怎样处置公主都行。
        - id: ch03-b06
          speaker: narrator
          text: >-
            菲奥黛丽莎醒来后，以为爱人永远离开了自己。她整夜坐在敞开的窗边哭泣，天亮才缩进屋里最暗的角落。第二夜，她又伏在窗前叹息。这时，蓝鸟一直在宫殿周围寻找她。他怕被图丽特拉认出来，不敢飞得太近，直到又累又伤心，才停在高塔旁的冷杉上唱歌哄自己入睡。一阵轻轻的哀叹忽然传进他耳中。
        - id: ch03-b07
          speaker: florine
          text: >-
            狠毒的王后，我究竟做错了什么，你要把我关在这里？我已经够不幸了，你还非要拿女儿嫁给称心国王的事来嘲弄我吗？
          emotion: sad
        - id: ch03-b08
          speaker: narrator
          text: >-
            蓝鸟焦急地等到天亮，飞近一看，窗户已经关上了。第二夜，他早早守在附近。月光照亮窗前的姑娘，他终于认出了菲奥黛丽莎。
        - id: ch03-b09
          speaker: charming
          text: 我的公主，我总算找到您了！
          emotion: happy
        - id: ch03-b10
          speaker: florine
          text: 是谁？谁在同我说话？
          emotion: surprised
        - id: ch03-b11
          speaker: charming
          text: >-
            您刚才还提到我的名字，现在却认不出我了。也难怪，我如今只是一只蓝鸟，还得这样生活七年。
          emotion: sad
        - id: ch03-b12
          speaker: florine
          text: 小蓝鸟，你真的是那位强大的称心国王吗？
          emotion: surprised
        - id: ch03-b13
          speaker: charming
          text: >-
            真的是我。我因为不肯背弃您，才受了这场惩罚。相信我，就算七年再加一倍，只要不用放弃您，我也甘愿承受。
        - id: ch03-b14
          speaker: florine
          text: >-
            可你在说什么呀？你的新娘图丽特拉刚来看过我。她穿着你的王袍，戴着你的王冠，拇指上还有你的指环。那些东西我绝不会认错。
          emotion: surprised
        - id: ch03-b15
          speaker: narrator
          text: >-
            蓝鸟顿时怒不可遏，把全部经过讲给公主听。他说自己怎样在黑暗中认错了人，怎样把图丽特拉带去仙女城堡，又怎样因为拒绝娶她，被罚作七年蓝鸟。菲奥黛丽莎知道他始终忠贞，欢喜得怎么也听不够。她听着他倾诉爱情，解释所有误会，只恨夜晚太短。可太阳很快升起，为免被人发现，他们只好分开。蓝鸟答应天黑再来，便藏进冷杉的树洞。公主留在塔里，满心忧虑，担心他掉进陷阱，或被鹰抓走。
        - id: ch03-b16
          speaker: narrator
          text: >-
            蓝鸟却没有在藏身处歇多久。他飞啊飞，一直飞回自己的王宫，从一扇破窗钻进去，找到收藏珠宝的密室。面对从前属于自己的无数宝物，他挑出一枚最华美的钻石指环，衔着它重新飞回高塔。等他回来，菲奥黛丽莎早已坐在敞开的窗前等候。公主收下指环，心里虽然欢喜，却温柔地责备他不该为了取礼物，冒这么大的风险。
        - id: ch03-b17
          speaker: charming
          text: 答应我，您会永远戴着这枚指环。
        - id: ch03-b18
          speaker: narrator
          text: >-
            公主答应永远戴着指环，条件是蓝鸟也要答应，往后白天也来见她，不能只在夜里出现。两个人整整谈了一夜。第二天早晨，蓝鸟再次飞回自己的王国，从那扇破窗钻进王宫，在满室珍宝里选出一对手镯。两只手镯各由一整块祖母绿雕成，世上再找不到相同的东西。他把它们带回高塔，送到公主手里。公主接过礼物，却责怪地摇了摇头。
        - id: ch03-b19
          speaker: florine
          text: 你难道以为我不够爱你，非得靠这些礼物提醒才行？
        - id: ch03-b20
          speaker: charming
          text: >-
            不，我的公主。只是我太爱您了，怎么说都觉得说不尽。每次不得不离开，我只能带一点小东西回来，让您知道我一直想着您。
        - id: ch03-b21
          speaker: narrator
          text: 第二夜，他又送来一只嵌在整颗珍珠里的怀表。公主看了，轻轻笑起来。
        - id: ch03-b22
          speaker: florine
          text: >-
            送我一只表正合适。自从认识你，我就不会计算时间了。你在我身边，几个时辰像几分钟。你不在，一点点时间也像过了几年。
        - id: ch03-b23
          speaker: charming
          text: 公主，您觉得难熬的那些时辰，在我心里只会更长！
        - id: ch03-b24
          speaker: narrator
          text: >-
            此后蓝鸟一天又一天带来更美的礼物，有钻石、红宝石，也有蛋白石。公主夜里把它们全戴起来取悦他，白天便仔细藏进草褥。阳光灿烂时，蓝鸟躲在高高的冷杉里，给她唱无比甜美的歌。路过的人听见，无不觉得惊奇，都说树林里一定住着精灵。这样的日子过了两年。公主仍被关着，图丽特拉仍嫁不出去。王后向邻国所有王子提亲，他们个个说，娶菲奥黛丽莎十分乐意，图丽特拉却万万不娶。
        - id: ch03-b25
          speaker: queen
          text: 菲奥黛丽莎一定和他们串通好了，故意气我。我们去问个明白！
          emotion: angry
        - id: ch03-b26
          speaker: narrator
          text: >-
            将近午夜，王后和图丽特拉来到高塔门外。菲奥黛丽莎佩满珠宝，正同蓝鸟合唱他新教的小歌。
        - id: ch03-b27
          speakers: [florine, charming]
          ensemble: duo
          text: >-
            我们两个真不幸，一个囚塔，一个栖林。只因忠贞坏了仇人的计，才受尽忧愁，尝尽苦辛。任凭他们毒计狠，两颗相爱的心永不分。
          emotion: happy
        - id: ch03-b28
          speaker: narrator
          text: 歌词虽然忧伤，两人却唱得很快活。王后猛地推门而入。
        - id: ch03-b29
          speaker: queen
          text: 你这个坏姑娘！你背着我们图谋什么？
          emotion: angry
        - id: ch03-b30
          speaker: florine
          text: >-
            我被你关了整整两年，除了你派来看守我的人，谁也没见过。我还能同谁图谋什么？
        - id: ch03-b31
          speaker: narrator
          text: >-
            王后和图丽特拉被她的美貌和满身珠宝晃花了眼。王后盯着那些钻石，越看越可疑。
        - id: ch03-b32
          speaker: queen
          text: 请问，夫人，这些钻石是哪儿来的？难道你在塔里挖出了一座钻石矿？
        - id: ch03-b33
          speaker: florine
          text: 它们确实是我在这里找到的。
        - id: ch03-b34
          speaker: queen
          text: >-
            宫廷最隆重的时候，我都没见你打扮得这么华丽。如今你戴成这样，究竟想给谁看？
          emotion: angry
        - id: ch03-b35
          speaker: florine
          text: >-
            给我自己看。我整天闲在这里，时间多得很。花一点工夫打扮自己，有什么奇怪？
        - id: ch03-b36
          speaker: queen
          text: 话说得真漂亮。我要亲自把这里搜个明白。
        - id: ch03-b37
          speaker: narrator
          text: >-
            王后和图丽特拉开始搜查，把小屋每个角落都翻了一遍。她们掀开草褥时，无数珍珠、钻石、红宝石、蛋白石、祖母绿和蓝宝石一齐滚落出来。两人看得目瞪口呆，怎么也想不明白这些宝物从哪里来。王后随即生出一条毒计。她带着一包伪造的书信，想把它暗藏在屋里，再当成公主勾结国王仇敌的证据。她选中烟囱作为藏信的地方，却不知道蓝鸟正停在那里监视自己，想替心爱的公主挡开危险。
        - id: ch03-b38
          speaker: charming
          text: 小心，菲奥黛丽莎！那个奸诈的仇人要陷害您！
        - id: ch03-b39
          speaker: narrator
          text: >-
            突然响起的声音吓坏了王后。她顾不上继续藏信，抓着那包东西，带图丽特拉匆匆离开。两人回去商量了很久，想查明究竟是哪位仙女或魔法师在暗中帮助公主。最后，她们派王后的一名侍女进塔服侍菲奥黛丽莎，又命她把自己装得十分愚笨，仿佛什么也看不见，什么也听不见。实际上，她要昼夜守在公主身边，盯住每一个举动，再把看到的事情全报告给王后。菲奥黛丽莎马上猜到来人是个密探，绝望得哭了起来。此后整整一个月，她不敢靠近窗口，更不敢呼唤蓝鸟，唯恐爱人被发现，遭到什么不测。
        - id: ch03-b40
          speaker: narrator
          text: >-
            密探始终盯着公主，终于有一夜累得睡熟了。菲奥黛丽莎连忙奔到窗前，轻声呼唤。
        - id: ch03-b41
          speaker: florine
          text: 蓝鸟蓝鸟，蓝如青天，快快飞来，无人在前。
        - id: ch03-b42
          speaker: narrator
          text: >-
            蓝鸟从未停止在牢房看得见、听得到的地方盘旋。公主一呼唤，他转眼便飞进来。久别重逢的两个人有说不完的话，又因为能够相见而无比欢喜。直到太阳升起，蓝鸟不得不离开，他们还觉得这一整夜仿佛只过了五分钟。第二夜，密探睡得同先前一样熟，蓝鸟又飞来陪伴公主。两个人渐渐以为危险已经过去，开始商量往后的打算，盼着恢复王后来访以前那样幸福的相聚。可是到了第三夜，密探的睡意没有那么沉了。公主毫不知情，仍旧照常打开窗户。
        - id: ch03-b43
          speaker: florine
          text: 蓝鸟蓝鸟，蓝如青天，快快飞来，四下无人。
        - id: ch03-b44
          speaker: narrator
          text: >-
            密探立刻清醒，却仍闭着眼装睡。她偷看见月光下的蓝鸟和公主，也听清了他们的谈话。天亮后，她跑去向王后报告。王后和图丽特拉断定，蓝鸟就是称心国王。
        - id: ch03-b45
          speaker: queen
          text: >-
            好一个放肆的公主！我们还以为她在受苦，原来她一直和那个负心国王快活相聚。等着吧，我知道该怎样报仇！
          emotion: angry
        - id: ch03-b46
          speaker: narrator
          text: >-
            密探奉命回去，故意比平常更早上床，鼾声打得再自然不过。公主来到窗前，又唱起呼唤蓝鸟的小歌，可没有鸟儿飞来。她整夜呼唤、等待、倾听，始终得不到回应。原来王后已命人在冷杉上挂满刀子、长剑、剃刀、剪子、砍刀和镰刀。蓝鸟听见公主呼唤，像往常一样朝高塔飞去，翅膀立刻被割伤，两只黑色小脚也险些被削断。全身留下二十多处伤口以后，他鲜血淋漓地跌回树洞，一面呻吟，一面绝望地认定，公主为了换取自由，已经受王后劝诱，向她出卖了自己。
        - id: ch03-b47
          speaker: charming
          text: >-
            菲奥黛丽莎，你真能一面那么美丽，一面又这样负心吗？既然如此，我还不如现在就死去！
          emotion: sad
        - id: ch03-b48
          speaker: narrator
          text: 蓝鸟侧身倒下，开始等死。
    - id: ch04
      title: 四枚魔法蛋
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            称心国王的朋友魔法师见青蛙车独自回来，早已忧心万分。他绕着世界找了八圈，始终不见国王。这时，他第八次走过树林，又像往常一样高声呼唤。
        - id: ch04-b02
          speaker: magician
          text: 称心！称心国王！你在这里吗？
        - id: ch04-b03
          speaker: charming
          text: 我在这里。
        - id: ch04-b04
          speaker: narrator
          text: 魔法师四下张望，却什么也没找到。
        - id: ch04-b05
          speaker: charming
          text: 我变成一只蓝鸟了。
        - id: ch04-b06
          speaker: narrator
          text: >-
            魔法师这才发现浑身是伤的朋友。他没有多问，立刻奔来跑去，采了一把魔草，又念了几道咒语，很快把蓝鸟治好。
        - id: ch04-b07
          speaker: magician
          text: 现在把事情从头讲给我听吧。这里面准有一位公主。
        - id: ch04-b08
          speaker: charming
          text: 不是一位，是两位！
        - id: ch04-b09
          speaker: narrator
          text: >-
            国王苦笑着讲完全部经过。他认定菲奥黛丽莎泄露了蓝鸟来访的秘密，好借此同王后讲和。他说了许多难听的话，骂公主反复无常，连那副美貌也全是欺骗。魔法师听完完全赞同，甚至比国王说得还远。他断言所有公主其实都一样，彼此之间最多只有美丑的差别。他劝朋友立刻同菲奥黛丽莎一刀两断，把她忘得干干净净。可不知为什么，国王听见朋友这样责骂公主，心里反倒很不舒服，一点也不喜欢这番劝告。
        - id: ch04-b10
          speaker: magician
          text: 那现在怎么办？你还要再做五年蓝鸟呢。
        - id: ch04-b11
          speaker: charming
          text: >-
            带我回你的宫殿吧。至少可以把我关在笼子里，让我躲开猫和刀剑。
        - id: ch04-b12
          speaker: magician
          text: >-
            眼下只能这样。不过我可不是白当魔法师的，用不了多久，一定能替你想出一个好办法。
        - id: ch04-b13
          speaker: narrator
          text: >-
            菲奥黛丽莎仍日夜守在窗前，徒劳地呼唤亲爱的蓝鸟。她把他可能遇到的灾祸一件件想过去，渐渐变得苍白消瘦。王后和图丽特拉却得意扬扬。可她们没能得意多久，老国王病逝了。全国百姓起来反抗她们，成群涌向宫殿，要求交出菲奥黛丽莎。王后走上阳台，仍傲慢地威吓众人。百姓终于失去耐心，撞开了宫门。一扇门向后倒下，正好把王后砸死。图丽特拉见势不妙，逃去了玛齐拉那里。
        - id: ch04-b14
          speaker: narrator
          text: >-
            王国的贵族们登上高塔，把菲奥黛丽莎从牢房接了出来，又拥立她成为女王。大家悉心照料她，帮她从长久囚禁的折磨中恢复过来。没过多久，她的脸色重新红润，甚至比从前更加美丽。她同臣子们仔细商议，把自己离开期间的国事一一安排妥当，随后装上一袋珠宝，独自出发寻找蓝鸟。她没有带随从，也没有告诉任何人自己准备去哪里。
        - id: ch04-b15
          speaker: narrator
          text: >-
            魔法师的力量抵不过玛齐拉的魔法，只好亲自去谈条件。他和仙女算是同族，相识五六百年，争吵过许多回，也和好过许多回。玛齐拉客客气气地接待了他。
        - id: ch04-b16
          speaker: mazilla
          text: 老朋友，你来找我想要什么呀？
        - id: ch04-b17
          speaker: magician
          text: 只要你愿意，就能帮我这个忙。我的一位国王朋友不小心得罪了你……
        - id: ch04-b18
          speaker: mazilla
          text: >-
            哈，我知道你说的是谁。老朋友，这个面子我给不了。他除非肯娶我的教女，否则别想让我发慈悲。你看她多么美丽可爱，叫他好好想想吧。
        - id: ch04-b19
          speaker: narrator
          text: >-
            魔法师看了看图丽特拉，实在说不出她美丽可爱这样的话，只能暂时离开。可他不能不再替朋友努力，因为国王只要继续住在鸟笼里，每天都险象环生。一次挂鸟笼的钉子突然松脱，羽毛加身的国王跟着笼子重重摔了下来。猫夫人恰好在房里，不但扑向他，还抓伤他的一只眼睛，差一点让他失明。另一次，照料的人忘了给水，他几乎活活渴死。最糟的是，国王离开自己的国家太久，臣民全以为他已经死了，他连王位也随时可能丢掉。
        - id: ch04-b20
          speaker: narrator
          text: >-
            魔法师考虑过所有危险，最终同玛齐拉谈成了条件。仙女先让国王恢复人形，再把图丽特拉送去他的宫殿住几个月。期限到了，他若还是拿不定主意娶她，就重新变成蓝鸟。玛齐拉给图丽特拉换上金银交织的华服，两人一起骑上飞龙，很快来到国王的宫殿。忠实的魔法师也刚把朋友带回来。仙女挥动魔杖，在蓝鸟身上点了三下，他便恢复原形，又成了从前那个英俊迷人的国王。可他一眼看见图丽特拉，想到自己竟得娶她，便不由得打了个寒战，只觉得这恢复人形的代价实在太大。
        - id: ch04-b21
          speaker: narrator
          text: >-
            这时，菲奥黛丽莎扮成贫穷的农家姑娘，头戴一顶遮住面孔的大草帽，肩上背着旧布袋，正在漫长而劳顿的旅途中奔波。她已经走过很远的路，有时渡海，有时穿过陆地，有马的时候便骑马，没有马的时候便步行。可无论走了多少路，她始终不知道称心国王究竟在哪个方向。她最害怕的是，自己明明一心想接近爱人，每迈出一步，反而离他更远。
        - id: ch04-b22
          speaker: narrator
          text: >-
            一天，她疲惫地坐在小溪边，让双脚泡在清水里，又梳理阳光下闪着金光的长发。一位拄拐杖、弯腰驼背的小老太太经过，停在她身旁。
        - id: ch04-b23
          speaker: kind_fairy
          text: 漂亮孩子，怎么只有你一个人？
        - id: ch04-b24
          speaker: florine
          text: 是啊，好心的妈妈。我太难过了，一点也不想有人陪。
          emotion: sad
        - id: ch04-b25
          speaker: kind_fairy
          text: 别哭，把出了什么事都告诉我。也许我能帮你。
          emotion: calm
        - id: ch04-b26
          speaker: narrator
          text: >-
            女王把自己的遭遇和寻找蓝鸟的经过全讲了。小老太太忽然挺直身体，变得年轻、高挑又美丽。她微笑着望向惊讶的菲奥黛丽莎。
        - id: ch04-b27
          speaker: kind_fairy
          text: >-
            美丽的女王，你要找的国王已经不是鸟了。我姐姐玛齐拉恢复了他的人形，他就在自己的王国。别怕，你会找到他，也会得偿心愿。收下这四枚蛋，遇到大难题时打破一枚，它会帮助你。
          emotion: calm
        - id: ch04-b28
          speaker: narrator
          text: >-
            仙女说完便消失了。菲奥黛丽莎受到鼓舞，把四枚蛋小心放进袋子，转身朝称心国王的王国走去。她一刻不停地走了八天八夜，终于来到一座高得吓人的象牙山前。整座山打磨得光滑无比，又陡得根本无处落脚。她手脚并用，试了一千次。每次好不容易往上爬了一点，又会一路滑下来，最后总是回到原地。她绝望地坐在山脚，忽然想起魔法蛋，赶紧打破一枚。蛋里出现几枚小金钩。她把钩子绑在手脚上，这回再也不打滑，很快便爬到了山顶。
        - id: ch04-b29
          speaker: narrator
          text: >-
            可刚到山顶，另一边又摆着新的难关。从山坡到整个山谷，全是一面打磨得光亮无比的镜子。那是一面魔镜，每个人都能在里面看到自己最希望成为的样子。成千上万的朝圣者从世界四方赶来，站在镜中欣赏自己的模样，可从来没有人爬到过山顶。如今大家一看菲奥黛丽莎站在上方，立刻大喊大叫，说她只要一脚踏上镜面，就会把他们珍爱的玻璃踩得粉碎。女王站在山顶，不知该怎样前进，原路退下象牙山又同样危险。她只得打破第二枚蛋。一辆由两只白鸽拉着的小车从蛋里驶出，她坐进车中，轻轻飘离了山顶。
        - id: ch04-b30
          speaker: narrator
          text: >-
            白鸽拉着小车飞过一夜又一天，终于落在称心国王的王国城门外。女王走下车，亲吻两只白鸽，认真向它们道谢。随后，她心怦怦直跳地走进城里，向路人打听应该去哪里才能见到国王。可她此刻头戴大草帽，长发又遮住面孔，看起来只是个风尘仆仆的穷姑娘。路人没有指路，反倒拿她取笑。
        - id: ch04-b31
          speaker: passerby
          text: >-
            见国王？你一个小厨娘，找国王做什么？先去洗洗脸吧，你那双脏眼睛连国王都看不清！
        - id: ch04-b32
          speaker: narrator
          text: >-
            女王为了隐藏身份，故意把头发垂下来遮住眼睛。路人不肯回答，她便继续打听。终于有人告诉她，第二天国王会同图丽特拉乘车巡街，据说他已经答应娶她。菲奥黛丽莎听了，只怕自己历尽艰辛赶来，却发现爱人终于忘了她。她又累又痛，坐在一处门洞里哭了一夜。
    - id: ch05
      title: 回声室里的声音
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            菲奥黛丽莎在门洞里哭了整夜。天一亮，她便赶往宫殿。守卫把这个不起眼的小厨娘赶走了五十次，她一次次回来，到底还是设法进去了。大厅里已经为国王和图丽特拉摆好两张宝座，宫里的人也早把图丽特拉当成未来的王后。女王躲到一根大理石柱后，静静等候。不久，图丽特拉穿着无比华贵的衣裳出现了，模样却仍旧丑陋。陪她一同进来的称心国王，比菲奥黛丽莎记忆中更加英俊，也更加气派。图丽特拉在宝座上坐定以后，菲奥黛丽莎才从柱后走出来，来到她面前。
        - id: ch05-b02
          speaker: trout
          text: >-
            你是什么人？我身份这样尊贵，坐的又是金宝座，你竟敢随便走到我面前？
        - id: ch05-b03
          speaker: florine
          text: 人们都叫我小厨娘。我带了几件珍宝来卖。
        - id: ch05-b04
          speaker: narrator
          text: 她从旧布袋里取出称心国王送的祖母绿手镯。
        - id: ch05-b05
          speaker: trout
          text: 嘿，这几块玻璃还挺漂亮。你想卖五枚银币，对不对？
        - id: ch05-b06
          speaker: florine
          text: 夫人，先请懂行的人看一看，我们再谈价钱。
        - id: ch05-b07
          speaker: narrator
          text: >-
            图丽特拉的确爱着称心国王，至少她能爱一个人到什么地步，就已经爱到了什么地步。只要能找到机会同国王说话，她就觉得欢喜。于是，她拿着手镯去见他，请他估一估价钱。国王只看一眼，便想起自己做蓝鸟时送给菲奥黛丽莎的那一对。他顿时脸色惨白，深深叹了一口气，又陷进悲伤的沉思，连回答都忘了。图丽特拉只好把问题再问一遍，他才勉强开口。
        - id: ch05-b08
          speaker: charming
          text: >-
            这对手镯抵得上我的整个王国。我本以为世上只有一对，没想到这里又出现了一对。
          emotion: sad
        - id: ch05-b09
          speaker: narrator
          text: 图丽特拉回到女王面前，问她最低肯卖多少。
        - id: ch05-b10
          speaker: florine
          text: >-
            这个价钱恐怕不容易付。不过，只要你让我在回声室里睡一夜，我便把手镯送给你。
        - id: ch05-b11
          speaker: trout
          text: 当然可以，小厨娘！
          emotion: happy
        - id: ch05-b12
          speaker: narrator
          text: >-
            国王很想追问手镯从哪里来，可唯一的办法便是去问图丽特拉。他厌恶她到了极点，只要能够避免，就绝不同她说话。回声室就在国王卧房下方，是一间构造十分奇妙的小屋。屋里哪怕只有最轻的耳语，楼上的国王也能听得一清二楚。国王做蓝鸟时，曾把这个秘密告诉菲奥黛丽莎。她想亲口责问他为什么负心，再也找不出比这更好的办法。图丽特拉命人把她留在回声室，她便从入夜一直哭泣哀诉到天亮。
        - id: ch05-b13
          speaker: narrator
          text: >-
            第二天，图丽特拉把守夜的侍童叫来盘问。侍童告诉她，回声室里整夜都是哭声和叹息。图丽特拉便问小厨娘究竟出了什么事。女王只说自己常常做梦，一做梦便会说梦话。偏偏国王一个字也没听见。原来他每晚临睡前都要喝一剂安眠药，喝完便睡得无比深沉，一觉总要睡到太阳高高升起。
        - id: ch05-b14
          speaker: florine
          text: >-
            他若听见了，怎会还是这样冷漠？可要是没听见，我还能怎样再争取一次？我虽有不少珠宝，却没有哪件稀奇到能打动图丽特拉。
          emotion: sad
        - id: ch05-b15
          speaker: narrator
          text: >-
            她想起剩下的蛋，便打破一枚。蛋里驶出一辆饰金的亮钢小马车，六只绿老鼠负责拉车。一只玫瑰色耗子坐在车前当车夫，另有一只灰耗子骑在前面的老鼠背上领路。车里坐着世上最小巧、最可爱的几个人儿。他们不但会跳舞，还会表演种种奇妙把戏。菲奥黛丽莎见到这件魔法杰作，高兴得拍手起舞。傍晚，她来到一条荫凉的花园小径，因为知道图丽特拉会从那里经过。她让老鼠飞跑起来，又让小人儿尽情表演。图丽特拉果然被吸引住了。
        - id: ch05-b16
          speaker: trout
          text: 小厨娘，小厨娘！你这辆老鼠车要卖多少钱？
        - id: ch05-b17
          speaker: florine
          text: 让我再去回声室睡一夜。
        - id: ch05-b18
          speaker: trout
          text: 可怜虫，我不会拒绝你的。
        - id: ch05-b19
          speaker: narrator
          text: 图丽特拉转头对身边的贵妇低声说道。
        - id: ch05-b20
          speaker: trout
          text: 这个傻瓜一点也不懂得抓住机会，对我可太有利了。
        - id: ch05-b21
          speaker: narrator
          text: >-
            夜里，菲奥黛丽莎说尽自己能想到的情话，仍旧没有得到回应。国王喝了安眠药，睡得很沉。两个侍童在外面听见她的声音。
        - id: ch05-b22
          speaker: page
          text: 这个乡下姑娘准是疯了。
        - id: ch05-b23
          speaker: second_page
          text: 可她说得那么悲伤，又那么动人。
        - id: ch05-b24
          speaker: narrator
          text: >-
            菲奥黛丽莎以为国王听见自己这样悲痛，却仍不肯理会，觉得他的心一定硬得可怕。她只剩最后一个机会，便打破第四枚蛋。这次出现的宝物比先前任何一样都更奇妙。那是一只用六只鸟烤成的馅饼，明明火候十足，鸟儿却仍旧活着。它们会唱歌，会聊天，会回答人们的问题，也会用极有趣的方式替人算命。菲奥黛丽莎带着这件珍宝，再次坐到图丽特拉必经的大厅里等候。一名国王的侍童正好从旁走过。
        - id: ch05-b25
          speaker: page
          text: >-
            小厨娘，幸好国王每晚都喝安眠药。要不然，你这样叹气哀诉，他整夜也别想睡了。
        - id: ch05-b26
          speaker: narrator
          text: 女王这才明白，国王为什么没有回应。她从袋里抓出一把珍珠和钻石。
        - id: ch05-b27
          speaker: florine
          text: 只要你答应今晚不给国王喝安眠药，这些珠宝便全归你。
        - id: ch05-b28
          speaker: page
          text: 我当然愿意答应！
          emotion: happy
        - id: ch05-b29
          speaker: narrator
          text: 这时图丽特拉走了过来，一眼便看见香喷喷的馅饼和那些唱歌闲聊的小鸟。
        - id: ch05-b30
          speaker: trout
          text: 这只馅饼真了不起！小厨娘，你要拿它换什么？
          emotion: surprised
        - id: ch05-b31
          speaker: florine
          text: 还是原来的价钱，让我在回声室再睡一夜。
        - id: ch05-b32
          speaker: trout
          text: 没问题，把馅饼给我吧。
          emotion: happy
        - id: ch05-b33
          speaker: narrator
          text: >-
            夜深以后，菲奥黛丽莎等到宫里像是人人都睡了，才再次哀诉起来。
        - id: ch05-b34
          speaker: florine
          text: >-
            啊，称心，我究竟做错了什么，你要抛下我去娶图丽特拉？要是你知道我受过多少苦，又走了多么遥远难走的路来找你就好了。
          emotion: sad
        - id: ch05-b35
          speaker: narrator
          text: >-
            侍童信守承诺，只给国王端来一杯清水。国王清醒地躺着，听清了每个字，也认出了菲奥黛丽莎的声音，却不知道声音从哪里传来。
        - id: ch05-b36
          speaker: charming
          text: 公主，我那么爱您，您为什么要把我出卖给我们那些狠毒的仇人？
          emotion: sad
        - id: ch05-b37
          speaker: florine
          text: 找到小厨娘，她会把一切解释给你听。
        - id: ch05-b38
          speaker: narrator
          text: 国王立刻召来侍童。
        - id: ch05-b39
          speaker: charming
          text: 你们要是找到小厨娘，马上把她带来见我！
        - id: ch05-b40
          speakers: [page, second_page]
          ensemble: duo
          text: 这很容易，陛下。她就在回声室里。
        - id: ch05-b41
          speaker: narrator
          text: >-
            国王迷惑极了。美丽的菲奥黛丽莎公主怎么会是小厨娘？一个小厨娘怎么又会有菲奥黛丽莎的声音？他匆匆穿好衣服，找到通往回声室的秘密小楼梯，一路跑了下去。菲奥黛丽莎正坐在一堆柔软的靠垫上。她已经脱去丑陋的伪装，身穿白色丝袍，一头金发在柔和的灯光下闪耀。国王一见她便欣喜若狂，冲过去拜倒在她脚下，一口气问出一千个问题，却连一个问题的回答时间也不给她。菲奥黛丽莎终于能再同他相聚，也同样幸福。
        - id: ch05-b42
          speaker: narrator
          text: >-
            重逢后的两个人只有一件事放心不下，那便是玛齐拉仙女。就在这时，魔法师走进回声室，同行的正是送给菲奥黛丽莎四枚蛋的那位著名仙女。他们先向国王和女王问候，然后告诉两人，既然他们已经齐心帮助称心国王，玛齐拉便再也没有力量伤害他了。称心国王想在什么时候迎娶菲奥黛丽莎，就可以在什么时候举行婚礼。听到这番话，国王欢喜得难以形容。
        - id: ch05-b43
          speaker: narrator
          text: >-
            天一亮，菲奥黛丽莎回来的消息便传遍整个宫廷。每个见到她的人，立刻都喜欢上了她。图丽特拉听说昨夜发生的一切，飞奔着来找国王。她一看见菲奥黛丽莎就在他身边，顿时怒不可遏。她张开嘴，正想大吵大闹，可还没来得及说出一个字，魔法师和好心仙女已经一同施法，把她变成一只棕色的大猫头鹰。她发出凄惨的叫声，拍动翅膀，从宫殿的一扇窗户飘飞出去。
        - id: ch05-b44
          speaker: narrator
          text: >-
            图丽特拉飞走以后，再也没有人能够阻挠他们。随后，一场盛大而无比辉煌的婚礼举行了。称心国王终于迎娶了自己始终深爱的菲奥黛丽莎女王。两个人经历过欺骗、囚禁、变身和漫长的寻找，终于再也不必分离。从此以后，他们永远幸福地生活在一起。
