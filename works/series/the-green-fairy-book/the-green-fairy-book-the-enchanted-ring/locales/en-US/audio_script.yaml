  chapters:
    - id: ch01
      title: Betrayal and the Fairy's Gift
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there were two brothers. The younger, Rosimond, was good and handsome. The elder, Bramintho, was ugly and wicked. Their mother could not bear Bramintho and cared only for Rosimond. Bramintho grew jealous, and he made up a dreadful lie to ruin his brother. He told their father that Rosimond often visited an enemy of the family, revealed everything that happened at home, and was helping the man plan to poison him.
        - id: ch01-b02
          speaker: narrator
          text: Their father flew into a rage. He beat Rosimond until he bled, locked him away without food for three days, and then drove him from the house. If Rosimond ever returned, his father said, he would kill him. His mother could only weep. Miserable as she was, she did not dare speak.
        - id: ch01-b03
          speaker: narrator
          text: Rosimond left home with tears in his eyes and no idea where to go. He wandered on for many hours until he reached a thick wood. By the time he came to the foot of a great rock, night had overtaken him. He lay down on a bank of moss, and the music of a little stream lulled him to sleep.
        - id: ch01-b04
          speaker: narrator
          text: At dawn he awoke and saw a beautiful woman on a gray horse with golden trappings. She looked ready for the hunt.
        - id: ch01-b05
          speaker: fairy
          text: Have you seen a stag pass this way, with deerhounds behind it?
        - id: ch01-b06
          speaker: rosimond
          text: No, madam, I have not.
        - id: ch01-b07
          speaker: fairy
          text: You seem unhappy. What troubles you? Take this ring. It will make you the happiest and most powerful of men, as long as you never use it for evil. Turn the diamond inward, and no one will see you. Turn it outward, and you will appear again. Wear it on your little finger, and you will look like the King's son, with a splendid court following you. Put it on your fourth finger, and you will look like yourself.
        - id: ch01-b08
          speaker: narrator
          text: Rosimond understood that she was a Fairy. As soon as she finished speaking, she rode deep into the woods. He could hardly wait to test the ring, so he went straight home. Everything the Fairy had said was true. Rosimond could see and hear everyone while no one could see him. He now had the power to avenge himself on Bramintho without the slightest danger. Yet he shared the strange story of all that had happened only with his mother.
        - id: ch01-b09
          speaker: narrator
          text: Then Rosimond slipped the ring onto his little finger. At once he looked like the King's son, attended by a hundred fine horses and a guard of richly dressed officers.
    - id: ch02
      title: The False Prince
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Rosimond's father was astonished to find the King's son in his quiet little house. He was also embarrassed, for he had no idea how to behave before such a grand visitor. Rosimond asked how many sons he had.
        - id: ch02-b02
          speaker: father
          text: I have two sons, Your Highness.
        - id: ch02-b03
          speaker: rosimond
          text: Send for them both. I want to take them to court and help them make their fortunes.
        - id: ch02-b04
          speaker: narrator
          text: The father hesitated, uncertain what to say, before presenting Bramintho.
        - id: ch02-b05
          speaker: father
          text: Here is my eldest son, Your Highness.
        - id: ch02-b06
          speaker: rosimond
          text: And the younger one? I wish to see him as well.
        - id: ch02-b07
          speaker: father
          text: He is gone. I had to punish him for doing wrong, and he ran away.
        - id: ch02-b08
          speaker: rosimond
          text: You should have taught him what was right instead of punishing him. Your elder son may come with me. You must follow these two guards. They will take you where I have ordered.
        - id: ch02-b09
          speaker: narrator
          text: The two guards led the father away toward the place Rosimond had chosen. In the forest, the Fairy met him. She beat him with a golden birch rod, then cast him into a cave so deep and dark that he lay there helpless under her enchantment.
        - id: ch02-b10
          speaker: fairy
          text: You will remain here until your son comes to set you free.
        - id: ch02-b11
          speaker: narrator
          text: Rosimond went on to the royal palace. The real Prince was away. He had sailed to war on a distant island, but contrary winds had wrecked his ship on unknown shores, where a savage people took him captive. Rosimond appeared at court in the Prince's shape. Everyone had mourned the Prince as lost, so Rosimond told them that merchants had rescued him when he was close to death.
        - id: ch02-b12
          speaker: narrator
          text: His return became a signal for the whole kingdom to celebrate. The King was so overcome that he could not speak. He could only embrace the son he thought had come home. The Queen's delight was greater still, and she ordered festivals throughout the kingdom.
        - id: ch02-b13
          speaker: narrator
          text: One day, Rosimond called Bramintho before him in his disguise as the Prince.
        - id: ch02-b14
          speaker: rosimond
          text: Bramintho, I brought you from your village to help you prosper. Now I know that you are a liar. Your deceit caused every one of Rosimond's troubles. He is hiding here, and you must face him and hear what he has to say.
        - id: ch02-b15
          speaker: narrator
          text: Bramintho trembled. He threw himself at the false Prince's feet and admitted his crime.
        - id: ch02-b16
          speaker: rosimond
          text: Confessing to me is not enough. You must confess to your brother and ask him to forgive you. If he does, he will be far more generous than you deserve. He is waiting in my anteroom. I will leave you alone with him.
        - id: ch02-b17
          speaker: narrator
          text: Bramintho obeyed and entered the anteroom. Rosimond changed the ring and came in through another door wearing his own face. The sight of his brother filled Bramintho with shame. He begged Rosimond's pardon and promised to make amends for all he had done. Rosimond embraced him with tears and forgave him at once.
        - id: ch02-b18
          speaker: rosimond
          text: The King favors me greatly. I could have you executed or shut in prison for the rest of your life. Instead, I choose to be as good to you as you have been wicked to me.
        - id: ch02-b19
          speaker: narrator
          text: Bramintho stood confused and ashamed. He did not raise his eyes or even remind Rosimond that they were brothers.
        - id: ch02-b20
          speaker: narrator
          text: Soon afterward, Rosimond announced a secret voyage to marry a princess in a neighboring kingdom. In truth, he went to see his mother. He told her everything that had happened at court and gave her money she needed. The King allowed him to take whatever he wished, though Rosimond was always careful not to misuse that freedom.
        - id: ch02-b21
          speaker: narrator
          text: Then a fierce war began between Rosimond's King and the ruler of the country next door, a wicked man who never kept his word. Rosimond went straight to the enemy palace. The ring let him attend every secret council unseen. He learned each plan as it was made, then acted first and brought every scheme to nothing. After that, he took command of the army sent against the wicked King. He defeated him in a glorious battle, and peace was made at once on terms that were fair to everyone.
        - id: ch02-b22
          speaker: narrator
          text: After that, the King wanted only to marry Rosimond to a princess who would inherit a neighboring kingdom and who was as lovely as the day. But one morning, Rosimond was hunting in the forest where he had first met the Fairy. She suddenly appeared and spoke severely.
        - id: ch02-b23
          speaker: fairy
          text: Take care. You must not marry anyone who believes you are a prince. Never deceive another person. The true Prince, whom the whole nation takes you for, must succeed his father. That is only just. Search for him on a distant island. I will send winds to fill your sails and carry you to him. Serve your master quickly, even though it costs you your ambition. Then return honestly to your natural place. Refuse, and you will grow wicked and unhappy, and I will leave you to all your former troubles.
    - id: ch03
      title: The True Prince Returns
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Rosimond took the Fairy's wise warning to heart. He announced a secret mission to a neighboring state and boarded a ship. The winds carried him directly to the island where the Fairy had said he would find the Prince.
        - id: ch03-b02
          speaker: narrator
          text: The unfortunate Prince was a captive there. A savage people had taken him and forced him to guard their sheep. Rosimond made himself invisible and searched the pastures until he found the Prince tending his flock. He covered the captive with his own cloak, carried him away from his cruel masters, and brought him safely aboard. More winds sent by the Fairy swelled the sails for their return. Before long, the two young men entered the King's presence together.
        - id: ch03-b03
          speaker: rosimond
          text: You believed that I was your son. I am not. I have brought your true son home to you.
        - id: ch03-b04
          speaker: narrator
          text: Astonished, the King turned to the real Prince.
        - id: ch03-b05
          speaker: king
          text: My son, was it you who defeated my enemies and won that glorious peace? Or were you truly shipwrecked and taken prisoner until Rosimond freed you?
          emotion: surprised
        - id: ch03-b06
          speaker: prince
          text: It is true, Father. Rosimond found me in captivity and set me free. Because of him, I can see you again. He won the victory, not I.
        - id: ch03-b07
          speaker: narrator
          text: The King could scarcely believe what he heard. Rosimond turned the ring and took the Prince's shape. The King stared wildly at two young men who both looked like his son.
        - id: ch03-b08
          speaker: narrator
          text: The King offered Rosimond immense rewards for all he had done, but Rosimond refused every one. He accepted only a single favor. One of his posts at court was to be given to Bramintho. Rosimond knew how quickly fortune could change. He feared the envy of others, and he feared his own weakness as well. His only wish was to return to his mother and his native village, where he could spend his time working the land.
        - id: ch03-b09
          speaker: narrator
          text: One day, while Rosimond wandered through the woods, the Fairy met him again. She showed him the cave where his father remained a prisoner and taught him the words that would break the spell. Rosimond repeated them joyfully, and his father was set free. All along, Rosimond had longed to bring the old man home and make his last years happy.
        - id: ch03-b10
          speaker: narrator
          text: In this way, Rosimond became the benefactor of his whole family. He had the pleasure of doing good to the very people who had wished to do him evil. He had also given the court great service, yet he asked for no new place there. He wanted only the freedom to live far away from its corruption.
        - id: ch03-b11
          speaker: narrator
          text: One danger remained. Rosimond feared that the ring might tempt him to regain the place he had surrendered. He decided to return it to the Fairy. For many days he searched through the woods. At last he found her and held out the ring.
        - id: ch03-b12
          speaker: rosimond
          text: I want to return this gift. It is as dangerous as it is powerful, and I fear I may use it wrongly. I will never feel safe until I can no longer leave my solitude to satisfy my own desires.
    - id: ch04
      title: Power in Wicked Hands
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: While Rosimond was trying to return the ring, Bramintho had learned nothing from what had happened. He gave in to every desire and tried to persuade the Prince, who was now King, to mistreat Rosimond. The Fairy knew it all. As Rosimond begged her to accept the ring, she answered him.
        - id: ch04-b02
          speaker: fairy
          text: Your wicked brother is trying to poison the King's mind against you and bring about your ruin. He deserves punishment, and he must die. I will give him the ring so that he destroys himself.
        - id: ch04-b03
          speaker: narrator
          text: Rosimond wept when he heard this.
        - id: ch04-b04
          speaker: rosimond
          text: How can giving him the ring be a punishment? He will use it to persecute everyone and make himself their master.
          emotion: sad
        - id: ch04-b05
          speaker: fairy
          text: What heals one person can poison another. Prosperity brings out every evil in a man who is wicked by nature. If you want to punish a scoundrel, begin by giving him power. You will see that he soon hangs himself with that rope.
        - id: ch04-b06
          speaker: narrator
          text: With that, she disappeared. She went straight to the palace disguised as an old woman dressed in rags and approached Bramintho.
        - id: ch04-b07
          speaker: fairy
          text: I have taken this ring from your brother. I lent it to him, and with its help he covered himself in glory. Now I give it to you. Be careful how you use it.
        - id: ch04-b08
          speaker: narrator
          text: Bramintho laughed.
        - id: ch04-b09
          speaker: bramintho
          text: I will certainly not copy my brother. Only a fool would bring back the Prince instead of ruling in his place.
        - id: ch04-b10
          speaker: narrator
          text: Bramintho kept his word. He used the ring only for evil. He discovered the secrets of families and betrayed them. He committed murders and every other kind of wicked act, and he gathered wealth by unlawful means. The crimes could not be traced to anyone, so the people could only wonder at one shocking mystery after another.
        - id: ch04-b11
          speaker: narrator
          text: Secrets from public affairs and private homes alike were exposed. At first, the King was as puzzled as everyone else. Then he looked at Bramintho. The man had become astonishingly wealthy and impossibly insolent. At last, the King began to suspect that the enchanted ring had fallen into Bramintho's hands.
        - id: ch04-b12
          speaker: narrator
          text: To learn the truth, the King bribed a stranger newly arrived at court, a man from a nation with which he was always at war. The stranger was to visit Bramintho at night and promise him limitless honors and rewards if he betrayed the secrets of the state.
        - id: ch04-b13
          speaker: narrator
          text: Bramintho promised to betray everything the stranger wanted. He accepted the first payment for his crime at once. Then he boasted about the ring. It could make him invisible, he said, and let him enter places kept hidden from everyone else. His triumph did not last even a day. The next morning, the King ordered his arrest and took the ring from him. When Bramintho was searched, papers were found on him that proved his crimes.
        - id: ch04-b14
          speaker: narrator
          text: Rosimond himself returned to court and pleaded for his brother's pardon, but the King would not grant it. Bramintho was put to death. So the enchanted ring proved far more deadly in his hands than it had ever been useful in Rosimond's.
    - id: ch05
      title: The Ring Returned
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The King hoped to console Rosimond after his brother's death. He gave the enchanted ring back to him and called it a treasure beyond price. But the grieving Rosimond could not see it that way. To him, the ring was bound to Bramintho's terrible fate. The first thing he did after reaching home was go into the woods and search for the Fairy.
        - id: ch05-b02
          speaker: rosimond
          text: Here is your ring. What happened to my brother has taught me things I never understood before. Keep it. It led only to his destruction. Without it, he might still be alive, and my father and mother would not spend their old age crushed by shame and grief. Perhaps he could have become wise and happy if he had never been able to satisfy every wish.
          emotion: sad
        - id: ch05-b03
          speaker: rosimond
          text: How dangerous it is to hold more power than anyone else. Take the ring back. Misfortune seems to follow everyone who receives it. I beg one favor for myself. Never give it to anyone I love.
          emotion: sad
