audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，像编书人面对孩子娓娓而谈，讽刺处轻巧含笑
        timbre: 温暖清朗
        pace: 舒缓而有自然起伏
        pitch: 中音
    rosimond:
      display_name: 罗西蒙
      tts:
        delivery: 真诚善良，历经诱惑仍谦逊坚定，悲痛时克制深沉
        timbre: 清朗温厚
        pace: 适中
        pitch: 中音
    bramintho:
      display_name: 布拉明托
      tts:
        delivery: 阴沉傲慢，心虚时畏缩，得意时狂妄轻浮
        timbre: 粗哑偏冷
        pace: 适中偏快
        pitch: 中低音
    father:
      display_name: 父亲
      tts:
        delivery: 性情暴烈而拘谨，面对权贵时局促恭敬
        timbre: 浑厚生硬
        pace: 适中
        pitch: 中低音
    fairy:
      display_name: 仙女
      tts:
        delivery: 威严清醒，告诫时严肃有力，道破人性时沉着锐利
        timbre: 清澈庄重
        pace: 从容
        pitch: 中高音
    king:
      display_name: 国王
      tts:
        delivery: 威严而重感情，惊愕时急切，裁断时果决
        timbre: 洪亮厚实
        pace: 适中
        pitch: 中低音
    prince:
      display_name: 王子
      tts:
        delivery: 坦率端正，感恩时诚恳而郑重
        timbre: 明亮清润
        pace: 适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 林中的戒指
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，兄弟俩住在同一个家里。弟弟罗西蒙英俊善良，哥哥布拉明托却又丑又坏。母亲偏爱小儿子，甚至厌恶长子。布拉明托妒恨弟弟，便诬告他常把家事泄露给仇视全家的邻居，还同那人合谋毒害父亲。
        - id: ch01-b02
          speaker: narrator
          text: >-
            父亲听信谎言，气得把罗西蒙打出血来，又关了他三天，一口饭也不给。最后，父亲将他赶出家门，威胁说他若回来，就要杀了他。母亲伤心得只会哭泣，却一个字也不敢替他说。罗西蒙含着泪离开家，根本不知道该去哪里。他漫无目的地走了许多个钟头，才进入一片密林。天黑时，他来到巨岩脚下，躺在溪岸的苔藓上。潺潺水声像乐曲一样哄着他，他很快便睡着了。
        - id: ch01-b03
          speaker: narrator
          text: >-
            黎明醒来，一位美丽女子正骑着配有金鞍辔的灰马，停在他面前，像是准备去打猎。
        - id: ch01-b04
          speaker: fairy
          text: 你有没有看见一头雄鹿和几只猎鹿犬从这里跑过去？
        - id: ch01-b05
          speaker: rosimond
          text: 没有，夫人。
        - id: ch01-b06
          speaker: narrator
          text: 女子看出他满面愁容，又问他遇到了什么烦恼。接着，她递来一枚戒指。
        - id: ch01-b07
          speaker: fairy
          text: >-
            只要你不用这枚戒指作恶，它就能使你成为世上最幸福、最有权势的人。钻石朝里，你便隐身。转到外面，你就现身。戴在小指上，你会变成国王的儿子，还有一队华贵的随从跟着你。戴回无名指，你便恢复本来面目。
        - id: ch01-b08
          speaker: narrator
          text: >-
            罗西蒙这才明白，对方原来是位仙女。话音刚落，仙女就策马冲进树林。他急忙回家试验戒指，发现她说得一点不错。隐身以后，他照样能看见、听见一切，别人却发现不了他。如果愿意，他完全可以报复哥哥，还不用冒半点风险。不过，他并没有动手，也没向别人炫耀，只把所有奇遇告诉了母亲。随后，他把戒指戴上小指，化作王子，带着百匹骏马和一队衣饰华贵的卫士来到家门前。
        - id: ch01-b09
          speaker: narrator
          text: 父亲见王子驾临这幢偏僻小屋，惊讶又慌乱。这里平日从没迎来过这样尊贵的客人，他根本不知该怎样招待。罗西蒙先问他有几个儿子。
        - id: ch01-b10
          speaker: father
          text: 两个。
        - id: ch01-b11
          speaker: rosimond
          text: 马上把他们都叫来。我想带兄弟俩进宫，给他们一个好前程。
        - id: ch01-b12
          speaker: father
          text: 这就是我的长子，请容我将他引见给殿下。
        - id: ch01-b13
          speaker: rosimond
          text: 那么小儿子呢？我也要见他。
        - id: ch01-b14
          speaker: father
          text: 他犯了错，我不得不罚他。后来，他逃走了。
        - id: ch01-b15
          speaker: rosimond
          text: >-
            你应该教他什么是对的，不该责罚他。让长子跟我进宫。你就随这两名卫士走，他们会送你到我指定的地方。
        - id: ch01-b16
          speaker: narrator
          text: 两名卫士听从罗西蒙的安排，把父亲带进森林。仙女随后在林中找到他，用金色桦条抽打了一顿，又把他扔进一个又深又黑的洞穴，让他中了魔法，困在那里。
        - id: ch01-b17
          speaker: fairy
          text: 你就在这里待着，等儿子来救你吧。

    - id: ch02
      title: 假王子的功业
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            罗西蒙来到王宫时，真正的王子恰好失踪了。王子原本乘船去攻打遥远的岛屿，一路却刮着逆风。船毁在陌生海岸，他也落入一群野蛮人手中。宫里的人找不到他，都以为他已经死去。罗西蒙便顶着王子的模样现身，说自己快要丧命时，被几个商人救了下来。这个消息传开，全国顿时欢腾起来。国王激动得一个字也说不出，只能一遍遍拥抱这个“儿子”。王后更是欣喜若狂，下令在王国各地举行庆典。
        - id: ch02-b02
          speaker: narrator
          text: 一天，假王子把亲哥哥叫到面前。
        - id: ch02-b03
          speaker: rosimond
          text: >-
            布拉明托，我带你离开故乡，是想给你一个好前程。如今我已经查清，你撒谎害得弟弟罗西蒙受尽苦难。他正藏在这里。你得去见他，听他当面责问你。
        - id: ch02-b04
          speaker: narrator
          text: 布拉明托吓得浑身发抖，扑倒在王子脚下，承认自己犯下的罪。
        - id: ch02-b05
          speaker: rosimond
          text: >-
            对我认罪还不够。你必须亲口告诉弟弟，再求他宽恕。你根本不配被原谅，他若肯点头，已经是十分宽厚了。他就在前厅。我会去另一个房间，把那里留给你们兄弟。
        - id: ch02-b06
          speaker: narrator
          text: 布拉明托照吩咐走进前厅。罗西蒙换了戒指的戴法，从另一扇门以本来面目进去。哥哥一看见他的脸，羞得无地自容。他苦苦恳求弟弟饶恕，还保证要弥补自己犯下的一切过错。罗西蒙没有让他继续哀求，而是流着泪抱住他，当场原谅了他。
        - id: ch02-b07
          speaker: rosimond
          text: >-
            我深得国王宠信，只消一句话，就能让人砍掉你的头，或叫你一辈子待在牢里。但你从前待我有多恶毒，我现在偏要待你有多仁厚。
        - id: ch02-b08
          speaker: narrator
          text: >-
            布拉明托羞愧得不敢抬头，连一句“我是你哥哥”也说不出口。后来，罗西蒙声称要秘密出行，迎娶邻国公主，其实只是去探望母亲。他把宫里发生的事全告诉她，又送去她急需的钱。国王准许他随意取用财物，他却从不滥用这份信任。
        - id: ch02-b09
          speaker: narrator
          text: >-
            不久，国王与邻国那个邪恶而不守信用的君主开战了。罗西蒙径直进入敌人的宫殿，借戒指隐去身形。他参加了对方一次又一次秘密议事，把所有计谋都听得清清楚楚。有了这些消息，他总能赶在敌人行动以前做好准备，让每一项谋划都落空。随后，罗西蒙亲自统率讨伐恶王的大军，在一场辉煌的战役中击败了他。双方立刻议和，订下的条件对所有人都公平。
        - id: ch02-b10
          speaker: narrator
          text: >-
            国王从此只想让罗西蒙迎娶邻国的王位继承人。那位公主美得像明亮的白昼。一天清晨，罗西蒙正在初遇仙女的森林里打猎，恩人忽然现身，语气十分严厉。
        - id: ch02-b11
          speaker: fairy
          text: >-
            千万不要娶一个误把你当成王子的人。你不该欺骗任何人。全国都以为你是真王子，可继承王位的必须是他本人，这才公平。去遥远的岛上找他吧。我会让风鼓满船帆，把你送到那里。即使这违背你的野心，也要赶快为你的君王做成这件事，再像个诚实的人那样恢复原来的身份。否则，你会变得又坏又不幸，我也会任你重新落入从前的苦难。

    - id: ch03
      title: 真王子归来
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            罗西蒙把仙女的劝告牢牢记住。他宣布要秘密出使邻国，随即登船。仙女遣来的长风鼓起船帆，把他径直送到那座岛上。真正的王子被野蛮人俘虏以后，竟被赶到牧场替他们看守羊群。罗西蒙隐身走进草场，找到这个不幸的年轻人，再用自己的斗篷把他整个罩住，从残忍的主人手里救了出来，一直带回船上。仙女又送来顺风，两人终于一同站在国王面前。
        - id: ch03-b02
          speaker: rosimond
          text: 您一直以为我是您的儿子。其实我不是，不过我已经把真正的王子带回来了。
        - id: ch03-b03
          speaker: narrator
          text: 国王惊得转向亲生儿子。
        - id: ch03-b04
          speaker: king
          text: >-
            我的儿子，击败敌人、赢得和平的难道不是你吗？还是说，你真的遭遇海难，做了俘虏，最后由罗西蒙救了出来？
          emotion: surprised
        - id: ch03-b05
          speaker: prince
          text: >-
            是的，父王。我被囚禁时，是罗西蒙找到并救出了我。我能够再次见到您，全靠他的恩德。赢得胜利的人是他，不是我。
        - id: ch03-b06
          speaker: narrator
          text: >-
            国王听完，几乎不敢相信自己的耳朵。罗西蒙转动戒指，当场变成王子的模样。两个年轻人看起来都是他的儿子，国王来回望着他们，完全不知所措。他要用无比丰厚的赏赐报答罗西蒙的功劳，年轻人却一件也不肯收。最后，他只求国王答应一件事，把自己原先在宫中的一个职位交给哥哥布拉明托。
        - id: ch03-b07
          speaker: narrator
          text: >-
            罗西蒙这样选择，是因为他害怕命运反复，害怕世人嫉妒，也不敢高估自己的意志。他只愿回到母亲身边，在故乡耕种土地。一天，他在林中散步，又遇见仙女。她领他找到囚禁父亲的洞穴，还教给他解除魔法的话。罗西蒙一直盼望接回老人，让父亲安度晚年，于是欢欢喜喜地念出那些话。他终于成了全家的恩人，也体会到善待那些曾想伤害自己的人，是怎样的快乐。
        - id: ch03-b08
          speaker: narrator
          text: >-
            宫廷受过他那么多恩惠，他却不要爵位，也不要财富，只求能够远远离开那里的腐化生活。还有最后一件事叫他放心不下。只要戒指仍在手里，他就可能受到诱惑，用它夺回已经舍弃的地位。罗西蒙决心连这条路也堵死，于是在森林里上上下下寻找了许多天，终于又见到仙女。
        - id: ch03-b09
          speaker: rosimond
          text: >-
            请收回这枚戒指吧。它的力量越强，就越危险。我怕自己拿它作恶。只要我还有可能离开这里，去满足那些欲望，我就永远不能安心。

    - id: ch04
      title: 权力变成毒药
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            罗西蒙想归还戒指的时候，布拉明托仍旧没有吸取半点教训。他放纵欲望，还试图劝说新近登基的真王子去虐待弟弟。仙女知道这一切。
        - id: ch04-b02
          speaker: fairy
          text: >-
            你那邪恶的哥哥正在挑拨国王，想让国王敌视你、毁掉你。他罪有应得，必须死。为了让他自己走向毁灭，我要把戒指交给他。
        - id: ch04-b03
          speaker: narrator
          text: 罗西蒙流着泪问仙女，这怎么能算惩罚。
        - id: ch04-b04
          speaker: rosimond
          text: 他只会靠戒指迫害所有人，最后夺取大权啊。
          emotion: sad
        - id: ch04-b05
          speaker: fairy
          text: >-
            同一样东西，常常能治好一个人，却会毒死另一个人。天性邪恶的人一旦飞黄腾达，祸患就会接连生出来。要惩罚恶棍，先给他权力。你等着瞧吧，有了这根绳子，他很快便会吊死自己。
        - id: ch04-b06
          speaker: narrator
          text: >-
            仙女说完便消失了。她来到王宫，化装成一个衣衫褴褛的老妇人，出现在布拉明托面前。
        - id: ch04-b07
          speaker: fairy
          text: >-
            这戒指原先是我借给你弟弟的，他靠着它建立了赫赫功业。现在我已经取回戒指，要把它送给你。你可要小心使用。
        - id: ch04-b08
          speaker: bramintho
          text: 我才不会学我弟弟。他居然把王子带回来，不肯自己当国王，实在蠢透了。
        - id: ch04-b09
          speaker: narrator
          text: >-
            布拉明托说到做到。他用戒指窥探各家的秘密，再四处泄露。他还犯下凶杀和种种恶行，用非法手段敛取钱财。这些罪行明明接连发生，却没有人查得出凶手，百姓无不惊骇。国王眼看宫外的家事和宫内的政事都被揭露，起初也和大家一样摸不着头脑。直到布拉明托突然暴富，态度又骄横得惊人，他才怀疑魔法戒指已经落到了此人手里。
        - id: ch04-b10
          speaker: narrator
          text: >-
            国王买通一名刚到宫廷的异乡人。那人来自一个常与本国交战的民族。按国王的安排，他趁夜拜访布拉明托，许诺给他数不清的荣华与赏赐，只要他肯出卖国家机密。

    - id: ch05
      title: 戒指的代价
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            布拉明托什么条件都答应，当场收下了这桩罪行的第一笔酬金。他还得意地夸口说，自己有一枚使人隐身的戒指，靠着它，什么隐秘之处都能进去。然而，这份得意极其短暂。第二天，国王便下令逮捕他，夺走戒指。侍卫仔细搜查，又从他身上找出证明一项项罪行的文书。罗西蒙听到消息，亲自赶回宫廷，苦苦请求国王饶哥哥一命，国王依然不肯赦免。布拉明托就这样被处死了。戒指给他带来的灾祸，远远超过它曾给弟弟的帮助。
        - id: ch05-b02
          speaker: narrator
          text: >-
            国王见罗西蒙如此悲痛，便把魔法戒指还给他，说这是一颗无价的明珠。罗西蒙却不这样想。他一回到家，立刻走进森林寻找仙女。
        - id: ch05-b03
          speaker: rosimond
          text: >-
            你的戒指在这里。哥哥的遭遇，让我懂得了许多从前不明白的事。请把它收回去，它只给哥哥带来毁灭。唉，要是没有这枚戒指，他现在还活着。我的父母年纪这样大，也不会被羞耻和悲痛压得直不起腰。假如他从没有机会满足自己的欲望，也许还能变得明智，过上幸福的生活。一个人拥有远胜世人的力量，实在太危险了！请你收回戒指。它落到谁手里，谁仿佛就会遭遇不幸。看在我的情分上，求你永远别把它交给我所爱的人。
          emotion: sad
        - id: ch05-b04
          speaker: narrator
          text: 故事说到这里，便结束了。讲述这个故事的人，是费讷隆。
