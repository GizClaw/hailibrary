audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，像编书人面对孩子娓娓而谈，幽默处轻巧含笑
        timbre: 温暖清朗
        pace: 舒缓而有自然起伏
        pitch: 中音
    helena:
      display_name: 海伦娜
      tts:
        delivery: 温柔真挚，受苦时哀伤克制，抱有希望时坚定而勇敢
        timbre: 柔和清澈
        pace: 适中偏慢
        pitch: 中高音
    fairy:
      display_name: 仙女
      tts:
        delivery: 慈爱安详，安慰人时柔和笃定
        timbre: 温暖轻柔
        pace: 舒缓
        pitch: 中高音
    prince_fickle:
      display_name: 善变王子
      tts:
        delivery: 年轻热诚，倾诉爱意时恳切，悔悟时深沉真挚
        timbre: 清亮醇厚
        pace: 适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 仙女的三次帮助
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前有个美丽的姑娘，名叫海伦娜。她很小就失去了亲生母亲，继母对她却刻薄狠毒。为了赢得继母一点疼爱，海伦娜什么重活都肯做，而且总是尽心做好。可是，她越勤快，继母越要把更多活儿压到她身上，心肠始终没有软下来。
        - id: ch01-b02
          speaker: narrator
          text: >-
            一天，继母拿来十二磅混在一起的羽毛，命她在天黑前全部分开。做不完，就要受重罚。海伦娜含着满眼泪水坐下来，几乎看不清手里的羽毛。她好容易分出一小堆，才叹一口气，那些轻飘飘的羽毛便全吹散了。试了又试，结果总是一样。她越来越难过，只能捧着低垂的头哭泣。
        - id: ch01-b03
          speaker: helena
          text: >-
            这苍天之下，难道没有谁肯可怜我吗？
          emotion: sad
        - id: ch01-b04
          speaker: fairy
          text: >-
            别难过，我的孩子。我来帮你了。
          emotion: calm
        - id: ch01-b05
          speaker: narrator
          text: >-
            海伦娜吓了一跳。抬头时，一位仙女已经站在面前，正温和地问她为什么哭。海伦娜很久没听过这样亲切的声音了，便把自己的苦楚和这件不可能完成的差事全说了出来。
        - id: ch01-b06
          speaker: fairy
          text: >-
            这件事不用再愁。你躺下睡一觉，醒来时，活儿一定妥妥当当地做完了。
          emotion: calm
        - id: ch01-b07
          speaker: narrator
          text: >-
            海伦娜依言睡去。等她醒来，所有羽毛已经分好，扎成一小捆一小捆。她正想道谢，仙女却已经消失。傍晚，继母回来，看见她安静地坐在做完的活儿前面，惊讶极了。她嘴上夸海伦娜勤快，心里却忙着盘算一件更难的差事。
        - id: ch01-b08
          speaker: narrator
          text: >-
            第二天，继母叫海伦娜拿一把满是窟窿的勺子，把屋旁的池塘舀干。姑娘立刻动手，很快就发现这件事根本办不到。她绝望得正要扔掉勺子，仙女又出现了，问她为何这样伤心。听过继母的新要求，仙女再次安慰她。
        - id: ch01-b09
          speaker: fairy
          text: >-
            相信我吧，这件差事也交给我。你先安心睡一会儿。
          emotion: calm
        - id: ch01-b10
          speaker: narrator
          text: >-
            海伦娜放下心来，才躺下不久，仙女就轻轻唤醒她，说池塘已经空了。她又喜悦又感激，赶紧跑去告诉继母，还以为那颗冷硬的心终于会软下来。谁知继母见恶计落空，反而怒火冲天。她一点也不肯疼爱这个辛苦做事的姑娘，只想着还能派下什么更难的活儿。
        - id: ch01-b11
          speaker: narrator
          text: >-
            第三天早晨，继母命她在日落以前造好一座城堡，从阁楼到底层都得布置齐全。海伦娜坐在指定作地基的岩石上，虽然满心沮丧，仍暗暗盼望仙女来帮忙。仙女果然来了。她答应造好城堡，又让姑娘睡一觉。随着她一声令下，岩石和石块自行升起，砌成美丽的城堡。太阳还没落山，里面已经样样齐备。
        - id: ch01-b12
          speaker: narrator
          text: >-
            海伦娜醒来，看见一切都已完成，心中的感激难以言说。继母却从城堡顶层一直查到底层，非要找出一点毛病来惩罚她。最后，她走进一间漆黑的地窖，一脚踏空，从陡峭的楼梯滚下去，当场摔死了。

    - id: ch02
      title: 椴树下的约定
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            海伦娜从此成了城堡的主人，过着安宁幸福的生活。她的美貌远近闻名，许多求婚者纷纷来到城堡。其中有一位名叫善变的王子，很快便赢得了海伦娜的爱。
        - id: ch02-b02
          speaker: narrator
          text: >-
            一天，两人坐在城堡前的椴树下。那里留下过他们许多欢乐时光，可这一次，王子带来了一个令人伤心的消息。他必须回去见父母，请他们答应这桩婚事。
        - id: ch02-b03
          speaker: prince_fickle
          text: >-
            我一得到父母的准许，就会尽快回来。请你留在这棵椴树下，等我回到你身边。
        - id: ch02-b04
          speaker: narrator
          text: >-
            临别时，海伦娜温柔地吻了吻他的左脸颊。
        - id: ch02-b05
          speaker: helena
          text: >-
            我会在这里等你。我们分开的这些日子里，千万不要让别人吻你的左脸颊。
        - id: ch02-b06
          speaker: narrator
          text: >-
            海伦娜从未怀疑王子会忠于自己，也相信他一定会飞快赶回来。她在树下一动不动地坐了三天三夜，王子却始终没有出现。姑娘越来越伤心，终于决定亲自去找他。
        - id: ch02-b07
          speaker: narrator
          text: >-
            她带上尽可能多的珠宝，还取出三件最美的长裙。一件绣着星辰，一件绣着月亮，第三件绣着太阳，所有花纹都由纯金绣成。海伦娜在广阔的世界里走了很远很远，到处打听，却找不到未婚夫的一点踪迹，最后只能绝望地放弃。自己的城堡里处处都是两人幸福相伴的回忆，她不忍回去，宁可在陌生的国度忍受孤独凄凉的日子。
        - id: ch02-b08
          speaker: narrator
          text: >-
            海伦娜到一个农夫家做了牧牛姑娘，把珠宝和三件长裙埋在隐秘安全的地方。每天，她赶着牛群去吃草，心里只想着负心的未婚夫。牛群里有一头小牛犊，她格外疼爱，常常亲手喂它，还教它跪在自己面前。每当小牛跪下，她便凑近它的耳朵轻声唱起来。
        - id: ch02-b09
          speaker: helena
          text: >-
            跪下，小牛，跪下，忠诚永远不改。别学善变王子，从前狠心离开，把美丽的海伦娜，独自留在椴树下等待。
          emotion: sad

    - id: ch03
      title: 被遗忘的声音
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            这样的日子过去了好几年。一天，海伦娜听说本国的公主就要成婚，新郎正是一位名叫善变的王子。人人都为婚事欢喜，只有海伦娜像挨了重重一击。她心底一直相信，爱人仍会忠于自己。
        - id: ch03-b02
          speaker: narrator
          text: >-
            去都城的路正好经过她居住的村庄。海伦娜赶牛去草地时，王子常从她身旁骑马经过。他满脑子都是自己的新娘，从来不看这个可怜的牧牛姑娘一眼。海伦娜终于想到，要试一试他的心，看看能不能让他重新想起自己。又一次看见王子经过，她便把最疼爱的小牛唤到跟前，让它跪下。
        - id: ch03-b03
          speaker: helena
          text: >-
            跪下，小牛，跪下，忠诚永远不改。别学善变王子，从前狠心离开，把可怜的海伦娜，独自留在椴树下等待。
          emotion: sad
        - id: ch03-b04
          speaker: narrator
          text: >-
            这声音让王子觉得似曾相识，可他怎么也记不起在哪里听过。海伦娜唱得很轻，声音还在发颤，他并没听清歌词。姑娘自己也过于激动，不敢抬头观察他的神情。等她终于回头，王子已经走远了。不过，他骑得很慢，整个人都陷在沉思里。看见这一幕，海伦娜没有完全失去希望。
        - id: ch03-b05
          speaker: narrator
          text: >-
            为了庆祝临近的婚礼，都城要举行一场延续许多夜的盛宴。海伦娜决定到宴会上寻找未婚夫，把全部希望都寄托在那里。

    - id: ch04
      title: 三夜宴会
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            第一夜将近时，海伦娜偷偷离开农夫的小屋，来到埋藏珠宝和衣裙的地方。她换上绣满金色太阳的长裙，戴起所有珠宝，又解开一直藏在头巾下的美丽金发。装扮好以后，她向都城走去。
        - id: ch04-b02
          speaker: narrator
          text: >-
            她一踏进舞厅，所有人都转头望着她，惊叹她的美貌，却没人认出她是谁。善变王子也看得目眩神迷，根本没猜到眼前的美人就是昔日的爱人。他整夜都守在海伦娜身旁。回家的时刻到了，姑娘费了很大力气，才借着人群从他身边脱身。
        - id: ch04-b03
          speaker: narrator
          text: >-
            王子在人群里找不到她，又搜遍其他地方，仍不见她的踪影。他只能急切盼望下一夜快些到来。那位神秘的美人已经答应，还会再来赴宴。
        - id: ch04-b04
          speaker: narrator
          text: >-
            第二天傍晚，海伦娜早早出门。这一回，她穿着绣满银色月亮的长裙，金发间还戴了一弯银色新月。王子见她再次出现，欣喜若狂，只觉得她比前一夜更美。他一步也不肯离开她，更不愿跟别人跳舞。
        - id: ch04-b05
          speaker: prince_fickle
          text: >-
            求你告诉我，你究竟是谁？
        - id: ch04-b06
          speaker: narrator
          text: >-
            海伦娜没有回答。王子只得再三恳求她，第二天夜里一定还要来。姑娘终于答应了。
        - id: ch04-b07
          speaker: narrator
          text: >-
            第三天，王子急着再见那位令他倾心的美人，宴会还要过好几个钟头才开始，他已经来到厅中，目光始终守着门口。海伦娜终于出现了。她的长裙缀满金银星辰，腰间系着星辰腰带，发间也戴着星辰头饰。王子对她的爱比任何时候都深，再一次追问她的姓名。
        - id: ch04-b08
          speaker: prince_fickle
          text: >-
            请你别再瞒我了。告诉我你的名字吧。

    - id: ch05
      title: 左脸颊上的一吻
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            海伦娜还是没有开口。她只是走到王子身边，默默吻了吻他的左脸颊。就在那一瞬间，遗忘的一切全都回来了。善变王子终于认出了自己从前的爱人。他心中充满悔恨和悲伤，只能恳求她宽恕。
        - id: ch05-b02
          speaker: prince_fickle
          text: >-
            海伦娜，是我辜负了你。请你原谅我吧。
          emotion: sad
        - id: ch05-b03
          speaker: narrator
          text: >-
            海伦娜好不容易才找回王子，当然不会让他苦等太久。她原谅了他，两人后来结为夫妻，一同回到海伦娜的城堡。毫无疑问，直到今天，他们还幸福地相依坐在那棵椴树下。
