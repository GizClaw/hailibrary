audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and attentive fairy-tale storytelling
        timbre: clear and gently resonant
        pace: measured
        pitch: medium
    helena:
      display_name: Helena
      tts:
        delivery: gentle, sincere, and quietly steadfast
        timbre: clear and youthful
        pace: natural
        pitch: medium-high
    stepmother:
      display_name: Helena's Stepmother
      tts:
        delivery: cold, demanding, and sharp
        timbre: hard and mature
        pace: deliberate
        pitch: medium-low
    fairy:
      display_name: The Fairy
      tts:
        delivery: kind, reassuring, and quietly magical
        timbre: soft and luminous
        pace: unhurried
        pitch: medium-high
    prince_fickle:
      display_name: Prince Fickle
      tts:
        delivery: courtly, romantic, and emotionally open
        timbre: warm and youthful
        pace: natural
        pitch: medium
  chapters:
    - id: ch01
      title: The Fairy's Three Gifts
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a beautiful girl named Helena. Her mother had died when she was very young, and her stepmother treated her with all the cruelty she could manage. Helena worked hard and did every heavy task cheerfully, hoping to win the woman's love. But nothing touched her stepmother's heart. The more Helena did, the more work she was given.
        - id: ch01-b02
          speaker: narrator
          text: One day, her stepmother mixed twelve pounds of feathers together and ordered Helena to sort them all before evening. If she failed, she would be severely punished.
        - id: ch01-b03
          speaker: narrator
          text: Helena sat down with so many tears in her eyes that she could hardly begin. Whenever she gathered one small pile, she sighed so deeply that the feathers scattered again. At last she bent her head into her hands and cried.
        - id: ch01-b04
          speaker: helena
          text: Is there no one under heaven who will take pity on me?
          emotion: sad
        - id: ch01-b05
          speaker: fairy
          text: Take heart, my child. I have come to help you.
          emotion: calm
        - id: ch01-b06
          speaker: narrator
          text: Helena looked up in terror. A Fairy stood before her and spoke with the greatest kindness.
        - id: ch01-b07
          speaker: fairy
          text: Why are you crying, my dear?
        - id: ch01-b08
          speaker: narrator
          text: Helena had not heard a friendly voice for a long time. She told the Fairy about her sorrow, the new task, and how impossible it seemed.
        - id: ch01-b09
          speaker: fairy
          text: Don't trouble yourself anymore. Lie down and sleep. I'll make sure the work is finished properly.
          emotion: calm
        - id: ch01-b10
          speaker: narrator
          text: Helena lay down. When she woke, every feather had been sorted into a neat little bundle. She turned to thank the good Fairy, but the Fairy had disappeared.
        - id: ch01-b11
          speaker: narrator
          text: That evening, her stepmother came home and stared in amazement at Helena sitting quietly beside the finished work. She praised the girl's diligence, while all the time she was trying to invent an even harder task.
        - id: ch01-b12
          speaker: narrator
          text: The next day, she ordered Helena to empty the pond near the house with a spoon full of holes. Helena began at once, but she soon saw that it could never be done. Miserable and desperate, she was about to throw the spoon away when the kind Fairy appeared again and asked what made her so unhappy.
        - id: ch01-b13
          speaker: narrator
          text: Helena explained her stepmother's new demand.
        - id: ch01-b14
          speaker: fairy
          text: Trust me. I will do this task for you. Lie down and sleep while I work.
          emotion: calm
        - id: ch01-b15
          speaker: narrator
          text: Comforted, Helena lay down. Before anyone would have thought it possible, the Fairy gently woke her and told her that the pond was empty.
        - id: ch01-b16
          speaker: narrator
          text: Helena hurried to her stepmother, full of joy and gratitude. Surely the woman's heart would soften now. Instead, her stepmother flew into a rage because her cruel plan had failed. Once again, she thought only of finding something harder for Helena to do.
        - id: ch01-b17
          speaker: narrator
          text: The next morning, she commanded Helena to build a beautiful castle before evening and furnish every room, from the attic to the basement. Helena sat on the rocks where the castle was supposed to stand. She felt deeply discouraged, though she still hoped the Fairy might help her once more.
        - id: ch01-b18
          speaker: narrator
          text: And the Fairy did come. She promised to build the castle and told Helena to sleep while the work was done. At her word, the rocks and stones rose into the air and built themselves into a beautiful castle. Before sunset, every room inside was furnished, and nothing was missing. When Helena woke, her task was complete, and she could hardly contain her gratitude.
    - id: ch02
      title: A Promise Beneath the Lime-Tree
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Helena's stepmother was far from pleased. She searched the castle from top to bottom, hoping to find some fault she could use to punish the girl. At last she went down into one of the cellars. It was so dark there that she fell down the steep stairs and was killed at once.
        - id: ch02-b02
          speaker: narrator
          text: Helena became mistress of the beautiful castle and lived there in peace and happiness. Before long, news of her beauty traveled far and wide, and many suitors came to ask for her hand.
        - id: ch02-b03
          speaker: narrator
          text: One of them was a young man called Prince Fickle. He quickly won fair Helena's love. One day, the two of them were sitting happily beneath the lime-tree in front of the castle when the Prince gave her sad news. He had to return to his parents and ask their consent to the marriage.
        - id: ch02-b04
          speaker: prince_fickle
          text: I promise I will come back as soon as I can. Wait for me here, beneath the lime-tree where we have spent so many happy hours.
        - id: ch02-b05
          speaker: narrator
          text: At their parting, Helena kissed him tenderly on the left cheek.
        - id: ch02-b06
          speaker: helena
          text: While we are apart, please don't let anyone else kiss you here. I will stay beneath this tree and wait for you.
        - id: ch02-b07
          speaker: narrator
          text: Helena never doubted that he would be faithful or that he would hurry back. She sat under the lime-tree without moving for three days and three nights. But her lover did not return. At last, in great unhappiness, she decided to go and find him.
    - id: ch03
      title: The Faithless Prince
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Helena took all the jewels she could carry and three of her finest dresses. One was embroidered with golden stars, one with golden moons, and one with golden suns. She wandered far across the world, but she found no sign of her bridegroom anywhere.
        - id: ch03-b02
          speaker: narrator
          text: Finally, she gave up the search in despair. She could not bear to return to the castle where she and the Prince had been so happy. She chose instead to face her loneliness in a strange country. A peasant hired her as a herd-girl, and she buried her jewels and beautiful gowns in a safe, hidden place.
        - id: ch03-b03
          speaker: narrator
          text: Each day, Helena drove the cattle out to pasture. She thought of her faithless bridegroom all the while. There was one little calf she especially loved. She fed it from her hand, taught it to kneel before her, and whispered a rhyme into its ear.
        - id: ch03-b04
          speaker: helena
          text: Kneel, little calf, kneel. Be faithful and true, unlike Prince Fickle, who once left his fair Helena beneath the lime-tree.
          emotion: sad
        - id: ch03-b05
          speaker: narrator
          text: Several years passed in this way. Then Helena heard that the King's daughter in that country was going to marry a prince whose name was Fickle. Everyone rejoiced at the news except Helena. It struck her like a terrible blow, because somewhere in her heart she had always believed that her lover was true.
        - id: ch03-b06
          speaker: narrator
          text: The road to the capital passed directly by Helena's village. Often, as she led the cattle toward the meadows, Prince Fickle rode past. He never noticed the poor herd-girl. His thoughts were fixed on his new bride.
        - id: ch03-b07
          speaker: narrator
          text: Helena decided to test his heart and see whether she could make him remember her. One day, as he rode by, she spoke again to the little calf.
        - id: ch03-b08
          speaker: helena
          text: Kneel, little calf, kneel. Be faithful and true, unlike Prince Fickle, who once left his poor Helena beneath the lime-tree.
          emotion: sad
        - id: ch03-b09
          speaker: narrator
          text: Her voice stirred some old memory in the Prince, but he could not tell what it was. Helena had spoken so softly, and her voice shook so much, that he had not heard the words clearly. She was too deeply moved to watch his face. By the time she turned around, he was already far away.
        - id: ch03-b10
          speaker: narrator
          text: Still, she saw how slowly he rode and how deeply he had fallen into thought. She did not give up all hope.
    - id: ch04
      title: The Lady in Golden Suns
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: To celebrate the coming wedding, the capital was to hold a feast over many nights. Helena placed all her hopes in those festivities. She would go to the feast and seek out her bridegroom there.
        - id: ch04-b02
          speaker: narrator
          text: As evening approached, she slipped secretly from the peasant's cottage and went to her hiding place. She put on the gown embroidered with golden suns and covered herself in jewels. Then she loosened the beautiful golden hair she had always kept beneath a kerchief and set out for the town.
        - id: ch04-b03
          speaker: narrator
          text: The moment Helena entered the ballroom, every eye turned toward her. Everyone marveled at her beauty, but no one knew who she was. Prince Fickle was dazzled too. He never guessed that the beautiful young woman had once been his own beloved.
        - id: ch04-b04
          speaker: narrator
          text: He stayed by her side the whole night. When it was time for Helena to return home, she escaped him only with great difficulty by slipping into the crowd. Prince Fickle searched everywhere for her. He could hardly wait for the next night, because the mysterious lady had promised to come again.
    - id: ch05
      title: The Lady in Silver Moons
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The next evening, Helena set out early for the feast. This time, she wore the gown embroidered with silver moons and placed a silver crescent in her hair.
        - id: ch05-b02
          speaker: narrator
          text: Prince Fickle was enchanted to see her again. To him, she looked even more beautiful than she had the night before. He would not leave her side or dance with anyone else. Again and again, he begged to know who she was.
        - id: ch05-b03
          speaker: prince_fickle
          text: Please, tell me your name.
        - id: ch05-b04
          speaker: narrator
          text: Helena would not tell him. Then he pleaded with her to return on the following evening, and she promised that she would.
    - id: ch06
      title: The Kiss of Remembrance
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: On the third evening, Prince Fickle was so impatient to see his beautiful enchantress that he arrived hours before the feast began. He never took his eyes from the door.
        - id: ch06-b02
          speaker: narrator
          text: At last, Helena appeared. Her dress was covered with golden and silver stars. A girdle of stars circled her waist, and a band of stars shone in her hair. Prince Fickle fell more deeply in love than ever. Once more, he asked her name.
        - id: ch06-b03
          speaker: prince_fickle
          text: Won't you tell me who you are?
        - id: ch06-b04
          speaker: narrator
          text: Helena gave no answer. She silently kissed him on the left cheek, and in that instant Prince Fickle recognized the love he had left behind.
        - id: ch06-b05
          speaker: narrator
          text: Filled with sorrow and remorse, he begged Helena to forgive him. She was overjoyed to have him back and did not make him wait long for her pardon.
        - id: ch06-b06
          speaker: narrator
          text: So Helena and Prince Fickle were married. They returned to her castle, where, no doubt, they are still sitting happily together beneath the lime-tree.
