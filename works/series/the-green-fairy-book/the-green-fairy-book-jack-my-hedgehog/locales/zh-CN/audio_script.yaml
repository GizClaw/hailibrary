audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，像编书人面对孩子娓娓而谈，幽默处轻巧含笑
        timbre: 温暖清朗
        pace: 舒缓而有自然起伏
        pitch: 中音
    farmer:
      display_name: 农夫
      tts:
        delivery: 直来直去，急躁而实际，说话不留情面
        timbre: 粗实沧桑
        pace: 自然
        pitch: 中低音
    farmers_wife:
      display_name: 农夫妻子
      tts:
        delivery: 朴实谨慎，受惊时语气尖锐，平日说话干脆
        timbre: 成熟清晰
        pace: 自然
        pitch: 中音
    parson:
      display_name: 牧师
      tts:
        delivery: 郑重而实在，判断事情时不绕弯子
        timbre: 干涩成熟
        pace: 稳重
        pitch: 中低音
    maid:
      display_name: 女仆
      tts:
        delivery: 年轻朴素，回答爽快
        timbre: 轻快清楚
        pace: 自然
        pitch: 中高音
    jack:
      display_name: 刺猬杰克
      tts:
        delivery: 机灵大胆，很有主见，面对许诺和背叛时坚定有力
        timbre: 年轻清亮
        pace: 明快
        pitch: 中高音
    first_king:
      display_name: 第一位国王
      tts:
        delivery: 骄傲精明，发号施令时威严，盘算时自以为是
        timbre: 深沉圆润
        pace: 稳重
        pitch: 低音
    first_princess:
      display_name: 第一位公主
      tts:
        delivery: 娇贵傲慢，说到自己的选择时十分任性
        timbre: 年轻华丽
        pace: 自然
        pitch: 中高音
    second_king:
      display_name: 第二位国王
      tts:
        delivery: 守信慈爱，忧愁时沉重，待人温厚庄重
        timbre: 深厚温和
        pace: 稳重
        pitch: 低音
    second_servant:
      display_name: 第二位国王的仆人
      tts:
        delivery: 恭敬务实，问话清楚直接
        timbre: 成熟清晰
        pace: 自然
        pitch: 中音
    second_princess:
      display_name: 第二位公主
      tts:
        delivery: 勇敢真诚，待父亲温柔，履行诺言时坚定
        timbre: 年轻温暖
        pace: 自然
        pitch: 中高音
  chapters:
    - id: ch01
      title: 炉子后面的孩子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，有个农夫，田地不少，钱也不少，日子过得很富足。可他还是觉得不圆满，因为家里一直没有孩子。每次去附近的集镇，别的农夫总拿这件事取笑他。听得多了，他终于忍无可忍，大声嚷了起来。
        - id: ch01-b02
          speaker: farmer
          text: >-
            我一定得有个孩子！不管生出什么都行，哪怕只是只刺猬！
          emotion: angry
        - id: ch01-b03
          speaker: narrator
          text: >-
            不久以后，妻子果真生下一个孩子。孩子腰往下是个健壮的男孩，腰往上却是只刺猬。母亲头一眼看见他，吓坏了，立刻埋怨丈夫。
        - id: ch01-b04
          speaker: farmers_wife
          text: >-
            你看看！是你那句话，把自己的孩子咒成了这样。
          emotion: fearful
        - id: ch01-b05
          speaker: farmer
          text: >-
            现在嚷嚷又有什么用？总得给这东西行洗礼吧。可谁愿意做他的教父教母？咱们又能给他取什么名字？
        - id: ch01-b06
          speaker: farmers_wife
          text: >-
            还能叫什么？就叫刺猬杰克。
        - id: ch01-b07
          speaker: narrator
          text: >-
            夫妻俩把孩子抱去受洗。牧师看了看那满身尖刺，只说了一句。
        - id: ch01-b08
          speaker: parson
          text: >-
            有这一身刺，你们可没法让他睡在像样的床上。
        - id: ch01-b09
          speaker: narrator
          text: >-
            牧师说得没错。他们只能在炉子后面铺些干草，让杰克睡在那里。这一睡就是八年。父亲越来越厌烦这个孩子，常常盼着他死。可杰克偏偏活着，仍旧一年接一年地躺在炉子后面。

    - id: ch02
      title: 风笛和钉蹄铁的公鸡
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            有一天，集镇上要办一场大集市。农夫临出门前，问妻子想让他带什么回来。
        - id: ch02-b02
          speaker: farmers_wife
          text: >-
            给家里带些肉，再买两大条面包。
        - id: ch02-b03
          speaker: narrator
          text: >-
            农夫又去问女仆。
        - id: ch02-b04
          speaker: maid
          text: >-
            我想要一双便鞋，再要几双长袜。
        - id: ch02-b05
          speaker: farmer
          text: >-
            刺猬杰克，你呢？要我给你带点什么？
        - id: ch02-b06
          speaker: jack
          text: >-
            爸爸，请给我带一只风笛。
        - id: ch02-b07
          speaker: narrator
          text: >-
            农夫赶集回来，把肉、面包、便鞋和长袜一一交出去，最后才走到炉子后面，把风笛递给杰克。杰克拿到风笛，马上向父亲提出一件更古怪的事。
        - id: ch02-b08
          speaker: jack
          text: >-
            爸爸，请到铁匠铺去，给咱家的公鸡钉上蹄铁。等它准备好了，我就骑着它走，再也不来烦你。
        - id: ch02-b09
          speaker: narrator
          text: >-
            父亲巴不得早点摆脱他，立刻照办。公鸡钉好蹄铁，杰克便跨上鸡背，朝森林去了。所有交给他照看的猪和驴，也跟在后面。到了林中，他让公鸡驮着自己飞上一棵高得出奇的大树，从树梢上照看地面的牲口。
        - id: ch02-b10
          speaker: narrator
          text: >-
            杰克在那里住了好几年，猪和驴也变成了一大群。这些年来，父亲根本不知道他过得怎么样。

    - id: ch03
      title: 两位迷路的国王
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            杰克坐在高高的树上吹风笛，曲子美妙极了。一天，一位国王在森林里迷了路，恰巧从附近经过。听见乐声，他又惊又奇，便派仆人去找声音的来处。那人四处张望，最后只看见树上停着一只公鸡，鸡背上坐着一个刺猬模样的小东西。
        - id: ch03-b02
          speaker: first_king
          text: >-
            去问问那个怪东西，为什么坐在树上。再问他知不知道去我王国最近的路。
        - id: ch03-b03
          speaker: narrator
          text: >-
            仆人照国王的话问了。杰克骑着公鸡从树上下来，说自己可以领国王平安回去，不过有一个条件。
        - id: ch03-b04
          speaker: jack
          text: >-
            请你写张字据。你回去以后，第一个来迎接你的东西，要归我。
        - id: ch03-b05
          speaker: narrator
          text: >-
            国王心里暗笑。他觉得这个小东西肯定不识字，自己随便写什么都不会被看穿。于是，他拿出笔墨写了一张假字据。杰克给他指了路，国王便安然回到家中。
        - id: ch03-b06
          speaker: narrator
          text: >-
            国王的女儿远远看见父亲，欢喜地奔过来，一头扑进他的怀里。国王这才记起许给杰克的东西。他把迷路和指路的事都告诉女儿，还说那个怪物把公鸡当马骑，风笛却吹得十分好听。
        - id: ch03-b07
          speaker: first_king
          text: >-
            不过，他肯定不识字。我写的是，什么也不会给他。
        - id: ch03-b08
          speaker: first_princess
          text: >-
            父亲，您这个办法真聪明！反正不管发生什么，我都绝不会跟刺猬杰克走。
          emotion: happy
        - id: ch03-b09
          speaker: narrator
          text: >-
            杰克仍旧快快活活地住在森林里。他照看猪和驴，坐在树上吹风笛。后来，又有一位国王带着仆从和卫队，在这片无边无际的森林里迷了路。他也听见了乐声，便让一名手下去找。那人来到树下，抬头就看见杰克跨坐在公鸡背上。
        - id: ch03-b10
          speaker: second_servant
          text: >-
            你坐在那么高的地方做什么？
        - id: ch03-b11
          speaker: jack
          text: >-
            我在看管我的猪和驴。你们有什么事？
        - id: ch03-b12
          speaker: second_servant
          text: >-
            我们走不出这片森林，正需要有人带路。
        - id: ch03-b13
          speaker: narrator
          text: >-
            杰克骑着公鸡落到地面，来到老国王面前。
        - id: ch03-b14
          speaker: jack
          text: >-
            我可以领您走上正路。不过您得郑重答应，把城堡门前第一个来迎接您的东西送给我。
        - id: ch03-b15
          speaker: second_king
          text: >-
            我答应你，也会把这个诺言写下来。
        - id: ch03-b16
          speaker: narrator
          text: >-
            杰克骑在前面，一路指明方向。国王跟着他走出森林，平安回到了自己的国家。
        - id: ch03-b17
          speaker: narrator
          text: >-
            这位国王只有一个女儿，而且美丽极了。她看见父亲回来，跑上前搂住他的脖子，亲了又亲，又问他为什么离开了那么久。国王说，要不是遇见那个半人半刺猬、骑着公鸡吹风笛的怪物，自己也许永远回不了家。他还说，自己已经许诺把城堡门外第一个迎接他的东西送给杰克。想到那个人偏偏是女儿，国王难过极了。
        - id: ch03-b18
          speaker: second_princess
          text: >-
            父亲，别再伤心了。我这么爱您，等刺猬杰克来接我时，我愿意跟他走。
          emotion: calm

    - id: ch04
      title: 杰克带着猪群回来
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            杰克继续放猪。猪越生越多，整座森林好像都装不下了。他决定离开那里，就叫人给父亲捎去口信，让父亲把村里的马厩和棚屋全都腾空。他要赶回一群多得吓人的牲口，村里人想宰多少都行。
        - id: ch04-b02
          speaker: narrator
          text: >-
            农夫听见消息，很不高兴。他早以为杰克死了。可没过多久，杰克便骑着公鸡，把浩浩荡荡的猪群赶进村子，任大家随意宰杀。村里到处响着劈肉剁骨的声音，几英里外都听得见。
        - id: ch04-b03
          speaker: jack
          text: >-
            爸爸，再请铁匠给我的公鸡钉一次蹄铁吧。钉好我就走。只要我还活着，就不会再回来。
        - id: ch04-b04
          speaker: narrator
          text: >-
            父亲让铁匠照办了。想到这回总算能彻底摆脱儿子，他高兴得很。

    - id: ch05
      title: 背信弃义的下场
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            杰克先赶往欺骗他的那个王国。第一位国王早已下令，要是有人骑着公鸡、带着风笛出现，卫兵就得把他赶走，朝他开枪，绝不能让他踏进王宫。
        - id: ch05-b02
          speaker: narrator
          text: >-
            杰克刚到，卫兵便挺起刺刀冲了过来。杰克用脚后跟一夹公鸡，公鸡立刻腾空而起，从大门上方飞过，直奔国王的窗口。杰克落在窗台上，朝里面高声喊话。
        - id: ch05-b03
          speaker: jack
          text: >-
            把答应我的东西交出来！不然，你和女儿都得拿命抵偿！
          emotion: angry
        - id: ch05-b04
          speaker: narrator
          text: >-
            国王没有办法，只好又哄又求，劝女儿跟杰克走，这样他们父女才能保住性命。公主换上一身白衣。父亲给她备好一辆六匹马拉的车，派来穿华丽制服的仆人，还送上许多钱。公主登上马车，杰克带着公鸡和风笛，坐在她身旁。两人告别以后，国王望着他们离开，认定这一生再也见不到女儿了。
        - id: ch05-b05
          speaker: narrator
          text: >-
            可事情并不是这样。马车离城已有一段路，杰克忽然撕掉公主的漂亮衣裳，又用尖刺扎遍她全身。
        - id: ch05-b06
          speaker: jack
          text: >-
            这就是你背信弃义该受的惩罚。回去吧，我再也不想跟你有任何瓜葛。
          emotion: angry
        - id: ch05-b07
          speaker: narrator
          text: >-
            杰克把公主一路赶回父亲身边。从那以后，她一辈子都觉得自己受尽屈辱，再也抬不起头。

    - id: ch06
      title: 信守诺言的公主
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            接着，杰克带着公鸡和风笛，来到第二位国王的国家。这位国王早有吩咐。只要杰克出现，卫兵便要举枪致敬，百姓要欢呼，还要风风光光地把他迎进王宫。
        - id: ch06-b02
          speaker: narrator
          text: >-
            公主一见杰克，着实吓了一跳。他的模样确实古怪。可是她想，自己既然许下诺言，就应该履行。于是，她好好地迎接了杰克，两人定下婚约。晚餐时，他们并肩坐在王室的餐桌旁，一同吃喝。
        - id: ch06-b03
          speaker: narrator
          text: >-
            到了休息的时候，公主害怕杰克吻她，因为那些尖刺会扎人。杰克听了，便安慰她。
        - id: ch06-b04
          speaker: jack
          text: >-
            别害怕，我绝不会伤害你。
          emotion: calm
        - id: ch06-b05
          speaker: narrator
          text: >-
            随后，杰克请老国王派四个人守在卧房门外，再让他们生起一堆旺火。他把接下来该做的事仔细说了一遍。
        - id: ch06-b06
          speaker: jack
          text: >-
            等我要上床时，会从刺猬皮里钻出来，把皮留在床边。那四个人要马上冲进来，把皮扔进火里，一直守到它完全烧尽。
        - id: ch06-b07
          speaker: narrator
          text: >-
            到了夜里，事情果真照他说的发生了。钟敲十一下，杰克回到房间，脱下刺猬皮，把它留在床脚。四个守卫立刻闯进来，抓起那身皮扔进火中，一直看着它烧成灰烬。火焰刚把皮吞尽，魔法便解除了。杰克从头到脚都成了真正的男人，躺在床上。只是他浑身漆黑，像被烈火狠狠烧过。
        - id: ch06-b08
          speaker: narrator
          text: >-
            国王赶紧派人请来宫廷御医。御医用各种香露和药膏替杰克洗遍全身。黑色渐渐褪去，他的皮肤重新变得白净，大家这才看清，杰克原来是个异常英俊的年轻人。公主见了，欢喜极了。第二天，两人举行婚礼，老国王还把整个王国交给了刺猬杰克。
        - id: ch06-b09
          speaker: narrator
          text: >-
            几年以后，杰克带着妻子回乡探望父亲。农夫看着眼前的年轻人，怎么也认不出他。
        - id: ch06-b10
          speaker: farmer
          text: >-
            我没有儿子。从前倒是有过一个孩子，可他生下来就长着刺猬一样的硬刺，后来已经到外面的世界去了。
        - id: ch06-b11
          speaker: narrator
          text: >-
            杰克这才把自己的全部经历说了出来。老父亲听完，又惊又喜，便跟着儿子回到王国。从此，他和杰克住在了一起。
        - id: ch06-b12
          speaker: narrator
          text: >-
            这个故事，是格林兄弟讲下来的。
