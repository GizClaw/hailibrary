  chapters:
    - id: ch01
      title: The Child Behind the Stove
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a farmer who had plenty of land and money. He lived very comfortably, but one thing was missing from his happiness. He had no children. Whenever he met the other farmers at the nearest market town, they teased him about it. At last, he became so angry that he cried out.
        - id: ch01-b02
          speaker: farmer
          text: I must have a child of some kind, even if it is only a hedgehog!
          emotion: angry
        - id: ch01-b03
          speaker: narrator
          text: Not long afterward, his wife gave birth. From the waist down, the child was a fine boy. From the waist up, he was a hedgehog. His mother was frightened when she first saw him.
        - id: ch01-b04
          speaker: farmers_wife
          text: There, you see? You brought this curse on your own child.
          emotion: fearful
        - id: ch01-b05
          speaker: farmer
          text: What good will all this fuss do? I suppose he must be christened. But who could we ask to be his sponsor? And what could we possibly call him?
        - id: ch01-b06
          speaker: farmers_wife
          text: There is only one name we can give him. Jack my Hedgehog.
        - id: ch01-b07
          speaker: narrator
          text: They took the child to be christened. When the parson saw him, he shook his head.
        - id: ch01-b08
          speaker: parson
          text: With all those prickles, you will never put this child into a proper bed.
        - id: ch01-b09
          speaker: narrator
          text: And he was right. Jack's parents could not put him in a bed, so they spread straw for him behind the stove. That was where Jack lay for eight years. His father grew tired of having him there and often wished he would die. But Jack did not die. He remained in that same place, year after year.
    - id: ch02
      title: The Bagpipes and the Cock
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: One day, a great fair was being held in the market town. The farmer meant to go, so he asked his wife what she wanted him to bring home.
        - id: ch02-b02
          speaker: farmers_wife
          text: Bring some meat and two large loaves for the house.
        - id: ch02-b03
          speaker: narrator
          text: Then he asked the maid what she would like.
        - id: ch02-b04
          speaker: maid
          text: I would like a pair of slippers and some stockings.
        - id: ch02-b05
          speaker: farmer
          text: Well, Jack my Hedgehog, what shall I bring for you?
        - id: ch02-b06
          speaker: jack
          text: Daddy, please bring me a bagpipe.
        - id: ch02-b07
          speaker: narrator
          text: When the farmer returned, he gave his wife and the maid what they had asked for. Then he went behind the stove and handed Jack the bagpipes.
        - id: ch02-b08
          speaker: jack
          text: Daddy, go to the smithy and have the house cock shod for me. Then I will ride away, and I will not trouble you anymore.
        - id: ch02-b09
          speaker: narrator
          text: The farmer was delighted at the thought of getting rid of him. He had the cock shod at once. Jack climbed onto its back and rode away to the forest. All the pigs and donkeys he had promised to tend followed behind him.
        - id: ch02-b10
          speaker: narrator
          text: When they reached the forest, Jack made the cock carry him up to the top of a very tall tree. He sat high among the branches and watched over his pigs and donkeys below. He stayed there for several years. By then, the animals had become a great herd, but his father knew nothing about where Jack was or what he had done.
    - id: ch03
      title: Two Kings Lose Their Way
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: High in his tree, Jack played his pipes, and the music was lovely. One day, a King who had lost his way passed nearby. The sound astonished him, and he sent a servant to discover where it came from. The man searched all around. At last, he saw a strange little creature perched in a tree. It looked like a hedgehog riding a cock.
        - id: ch03-b02
          speaker: first_king
          text: Ask that creature why he is sitting up there. Find out whether he knows the shortest road to my kingdom.
        - id: ch03-b03
          speaker: narrator
          text: The servant stood beneath the tree and called up the King's questions. Jack climbed down with his cock. He said he knew the way to the kingdom and would lead the King safely home, but only on one condition.
        - id: ch03-b04
          speaker: jack
          text: Give me a written promise. Whatever comes to meet you first when you return must be mine.
        - id: ch03-b05
          speaker: narrator
          text: The King thought Jack would not understand anything that was written, so he could put down whatever he pleased. He took out pen and ink and wrote a false promise. Then Jack showed him the road, and the King arrived home safely.
        - id: ch03-b06
          speaker: narrator
          text: The King's daughter spotted her father returning in the distance. She was so delighted that she ran out to meet him and threw herself into his arms. Then the King remembered his promise to Jack. He told her about the extraordinary creature who rode a cock as if it were a horse, played beautiful music, and demanded the first thing that met the King when he came home.
        - id: ch03-b07
          speaker: first_king
          text: Of course, that creature cannot read. I simply wrote that I would give him nothing at all.
        - id: ch03-b08
          speaker: first_princess
          text: How clever of you, Father! Nothing could ever make me go away with Jack my Hedgehog.
          emotion: happy
        - id: ch03-b09
          speaker: narrator
          text: Meanwhile, Jack remained cheerful in the forest. He tended his pigs and donkeys, sat in his tree, and played his bagpipes. After a time, another King and his escort lost their way in that vast forest. This King also heard the music and sent a man to look for its source. The servant came beneath the tree and saw Jack sitting on the cock among the branches.
        - id: ch03-b10
          speaker: second_servant
          text: What are you doing all the way up there?
        - id: ch03-b11
          speaker: jack
          text: I am looking after my pigs and donkeys. What do you need?
        - id: ch03-b12
          speaker: second_servant
          text: We have lost our way. We need someone to lead us out of the forest.
        - id: ch03-b13
          speaker: narrator
          text: Jack came down with his cock and spoke to the old King.
        - id: ch03-b14
          speaker: jack
          text: I will show you the right road if you solemnly promise me the first thing that meets you outside your castle.
        - id: ch03-b15
          speaker: second_king
          text: Yes. I give you my solemn promise, and I will put it in writing.
        - id: ch03-b16
          speaker: narrator
          text: Jack rode in front on his cock and pointed out the way. The King followed him out of the forest and reached his own country safely.
        - id: ch03-b17
          speaker: narrator
          text: This King had one daughter, and she was very beautiful. She ran to meet her father, put her arms around his neck, and kissed him. When she asked why he had been gone so long, he told her everything. Without Jack, he might never have found his way home. But he had pledged to give Jack the first thing that met him at the castle gate, and that had been his own daughter. The thought made him very sad.
        - id: ch03-b18
          speaker: second_princess
          text: Do not grieve, Father. I love you dearly. Whenever Jack my Hedgehog comes for me, I will willingly go with him.
          emotion: calm
    - id: ch04
      title: Jack Returns from the Forest
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Jack kept tending his pigs, and their numbers grew until the whole forest seemed full of them. At last, he decided to leave. He sent word to his father to clear every stable and outhouse in the village. Jack was bringing such a vast herd that everyone could kill as many animals as they wished.
        - id: ch04-b02
          speaker: narrator
          text: The farmer was vexed by the message, for he had believed Jack was dead long ago. But Jack mounted his cock and drove the enormous herd into the village. He let everyone kill as many pigs as they chose. Soon the whole place rang with chopping and cutting, and the noise could be heard for miles.
        - id: ch04-b03
          speaker: jack
          text: Daddy, have the blacksmith shoe my cock once more. Then I will ride away, and I promise never to return for as long as I live.
        - id: ch04-b04
          speaker: narrator
          text: His father had the cock shod and rejoiced that he would finally be rid of his son.
    - id: ch05
      title: The Broken Promise
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Jack rode first to the kingdom of the King who had deceived him. That King had given strict orders. If anyone appeared riding a cock and carrying bagpipes, the guards were to drive him off, shoot at him, and never let him enter the palace.
        - id: ch05-b02
          speaker: narrator
          text: When Jack arrived, the guards rushed at him with their bayonets and tried to keep him away from the palace. Jack put his spurs to the cock. It rose into the air, carried him straight over the guarded gate, and flew all the way to the King's windows. Jack lowered himself onto a window sill and called inside.
        - id: ch05-b03
          speaker: jack
          text: Give me what you promised, or you and your daughter will pay for your treachery with your lives!
          emotion: angry
        - id: ch05-b04
          speaker: narrator
          text: The King coaxed his daughter and pleaded with her to leave with Jack so that both their lives would be spared. The Princess dressed entirely in white. Her father gave her a coach drawn by six horses, servants in splendid clothes, and a great deal of money for the journey. She climbed into the coach, while Jack took his place beside her with his cock and bagpipes. They both said farewell, and the King watched them go. He fully expected that he would never set eyes on them again.
        - id: ch05-b05
          speaker: narrator
          text: But that was not what happened. Once they were some distance from the town, Jack tore off the Princess's fine clothes and pricked her all over with his bristles.
        - id: ch05-b06
          speaker: jack
          text: This is what treachery has earned you. Go home. I want nothing more to do with you.
          emotion: angry
        - id: ch05-b07
          speaker: narrator
          text: He drove her back to her father. For the rest of her life, she felt disgraced and ashamed.
    - id: ch06
      title: The Faithful Promise
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Jack rode on with his cock and bagpipes until he reached the second King's country. This King had ordered the guards to present their arms if Jack came. The people were to cheer, and Jack was to be led in triumph to the palace.
        - id: ch06-b02
          speaker: narrator
          text: The King's daughter was startled when she saw him. He certainly looked very strange. Still, she had given her word, and there was nothing more to be said. She welcomed Jack, and they were betrothed. At dinner, he sat beside her at the royal table, and they ate and drank together.
        - id: ch06-b03
          speaker: narrator
          text: When it was time to rest, the Princess was afraid that Jack might kiss her and prick her. He reassured her.
        - id: ch06-b04
          speaker: jack
          text: Do not be frightened. No harm will come to you.
          emotion: calm
        - id: ch06-b05
          speaker: narrator
          text: Then Jack asked the old King to place four men outside his bedroom and have them build a large fire.
        - id: ch06-b06
          speaker: jack
          text: When I lie down, I will slip out of my hedgehog skin and leave it beside the bed. The men must rush in, throw the skin into the fire, and stay there until it has burned away completely.
        - id: ch06-b07
          speaker: narrator
          text: Everything happened as Jack had said. At eleven o'clock, he went to his room, slipped out of the hedgehog skin, and left it at the foot of the bed. The four men hurried through the door, seized the empty skin, and threw it onto the fire. They stood by until every bit of it had burned away. At that very moment, the enchantment broke. Jack lay in the bed as a man from head to foot, though he was black all over, as if the fire had badly scorched him.
        - id: ch06-b08
          speaker: narrator
          text: The King quickly sent for his own physician. The doctor washed Jack all over with different essences and healing salves. Little by little, the blackness disappeared. His skin became white, and everyone could see that he was a remarkably handsome young man. The Princess was overjoyed when she saw him. The next day, she and Jack were married, and the old King gave his kingdom to Jack my Hedgehog.
        - id: ch06-b09
          speaker: narrator
          text: Some years later, Jack and his wife went to visit his father. The farmer did not recognize him.
        - id: ch06-b10
          speaker: farmer
          text: I have no son. I once had a child with bristles like a hedgehog, but he went away into the wide world.
        - id: ch06-b11
          speaker: narrator
          text: Then Jack told him the whole story. His old father rejoiced greatly and went back with Jack. From then on, he lived with his son in Jack's kingdom.
