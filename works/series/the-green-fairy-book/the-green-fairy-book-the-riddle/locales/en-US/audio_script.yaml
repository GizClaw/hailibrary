audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and attentive fairy-tale storytelling
        timbre: clear and gently resonant
        pace: measured
        pitch: medium
    prince:
      display_name: Prince
      tts:
        delivery: thoughtful, assured, and direct
        timbre: clear and noble
        pace: measured
        pitch: medium-low
    witch_daughter:
      display_name: Witch's Daughter
      tts:
        delivery: kindhearted, cautious, and earnest
        timbre: soft and youthful
        pace: natural
        pitch: medium-high
    witch:
      display_name: Witch
      tts:
        delivery: muttering, sly, and falsely welcoming
        timbre: dry and aged
        pace: deliberate
        pitch: low
    servant:
      display_name: Servant
      tts:
        delivery: loyal, alert, and practical
        timbre: sturdy and clear
        pace: natural
        pitch: medium
    princess:
      display_name: Princess
      tts:
        delivery: proud, clever, and commanding
        timbre: polished and bright
        pace: measured
        pitch: medium-high
    judge_1:
      display_name: First Judge
      tts:
        delivery: formal and decisive
        timbre: mature and resonant
        pace: measured
        pitch: medium-low
    judge_2:
      display_name: Second Judge
      tts:
        delivery: formal and attentive
        timbre: mature and clear
        pace: measured
        pitch: medium
    judge_3:
      display_name: Third Judge
      tts:
        delivery: formal and assured
        timbre: mature and firm
        pace: measured
