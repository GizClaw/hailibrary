  chapters:
    - id: ch01
      title: The Witch's House
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: A King's son once longed to travel through the world. He set out with no one but one trusty servant. One evening, after riding deep into a great forest, he could find no shelter. Darkness was coming, and he had no idea where they could spend the night. Then he noticed a young and pretty girl walking toward a little house. He drew closer and spoke to her.
        - id: ch01-b02
          speaker: prince
          text: My dear, may my servant and I stay in that house tonight?
        - id: ch01-b03
          speaker: witch_daughter
          text: You may, if you wish, but I advise you not to. Please, don't go inside.
          emotion: sad
        - id: ch01-b04
          speaker: prince
          text: Why shouldn't we go in?
        - id: ch01-b05
          speaker: narrator
          text: The girl sighed before she answered.
        - id: ch01-b06
          speaker: witch_daughter
          text: My stepmother practices black arts, and she treats strangers badly.
          emotion: sad
        - id: ch01-b07
          speaker: narrator
          text: The Prince understood that this must be a witch's house. Still, darkness had fallen, there was nowhere else to go, and he was not afraid. So he stepped inside.
        - id: ch01-b08
          speaker: narrator
          text: An old woman sat in an armchair beside the fire. She fixed her red eyes on the strangers as they entered.
        - id: ch01-b09
          speaker: witch
          text: Good evening. Come and sit down, won't you?
        - id: ch01-b10
          speaker: narrator
          text: The old woman muttered the words while pretending to be friendly. Then she stirred up the fire beneath a little cooking pot. Her stepdaughter quietly warned the travellers not to eat or drink anything. The old woman's brews, she told them, could be dangerous. The two men went to bed and slept soundly until morning.
    - id: ch02
      title: The Poison Comes Back
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: By morning they were ready to leave, and the Prince was already on his horse.
        - id: ch02-b02
          speaker: witch
          text: Wait a moment. I must bring you a drink for the road.
        - id: ch02-b03
          speaker: narrator
          text: While the witch went to fetch it, the Prince rode away. His servant stayed behind to tighten the saddle girths. When the witch returned, he was there alone.
        - id: ch02-b04
          speaker: witch
          text: Take this to your master.
        - id: ch02-b05
          speaker: narrator
          text: As she spoke, the glass cracked. Poison splashed over the servant's horse, and it was so powerful that the poor animal dropped dead. The servant ran after the Prince and told him what had happened. Then he went back, since he did not want to lose the saddle along with the horse.
        - id: ch02-b06
          speaker: narrator
          text: At the carcass, he found a raven perched there and pecking at it.
        - id: ch02-b07
          speaker: servant
          text: We may not find anything better to eat today.
        - id: ch02-b08
          speaker: narrator
          text: He shot the raven and carried it away. The travellers rode through the forest all day without reaching its end. At nightfall, they came to an inn. The servant gave the raven to the landlord to cook for their supper. But this inn was a meeting place for a band of murderers, and the old witch often went there too.
        - id: ch02-b09
          speaker: narrator
          text: Once darkness fell, twelve murderers arrived, planning to kill and rob the strangers. Before doing that, they sat down to eat. The landlord and the witch joined them, and they all had broth made with the raven's flesh. They had swallowed only a couple of spoonfuls when every one of them fell dead. The poison had passed from the horse into the raven, and from the raven into the broth.
        - id: ch02-b10
          speaker: narrator
          text: Only the landlord's daughter remained in the house. She was good and well-meaning, and she had taken no part in its wicked business. She opened every door and showed the travellers all the treasure the robbers had gathered. The Prince told her to keep it. He wanted none of it, and he rode on with his servant.
    - id: ch03
      title: The Princess's Challenge
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: After travelling for some time, they reached a town where a lovely but very arrogant Princess lived. She had announced a challenge. Any man who gave her a riddle she could not solve would become her husband. But if she guessed it, he would lose his head. She was allowed three days to think, though she was so clever that she always found the answer much sooner. Nine suitors had already lost their lives.
        - id: ch03-b02
          speaker: narrator
          text: When the Prince arrived, her beauty dazzled him. Though he knew what had happened to the nine men before him, he decided to risk his life for the chance to marry her. He came before the Princess and put his riddle to her.
        - id: ch03-b03
          speaker: prince
          text: What is it that slew no one, yet killed twelve?
        - id: ch03-b04
          speaker: narrator
          text: The Princess had no answer. She thought and thought, then searched every book of riddles and puzzles she had. Nothing helped her. For once, all her cleverness failed her, and she did not know where else to turn.
        - id: ch03-b05
          speaker: narrator
          text: She ordered her maid to sneak into the Prince's bedroom that night and listen. Perhaps he would speak in his sleep and give away the secret. But the clever servant took his master's place in the bed. When the maid appeared, he pulled away the cloak around her and drove her out with a whip.
    - id: ch04
      title: Three Nights of Spying
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: On the second night, the Princess sent her lady-in-waiting, hoping she would do better. Once again, the servant was ready. He took her mantle and chased her away too.
        - id: ch04-b02
          speaker: narrator
          text: By the third night, the Prince thought he could safely sleep in his own bed. But halfway through the night, the Princess came herself. She was wrapped in a misty grey mantle, and she sat close beside him. She waited until she believed he was fast asleep. Then she spoke, hoping he might talk aloud in his dreams and answer her. The Prince was awake all the while. He heard and understood every word.
        - id: ch04-b03
          speaker: princess
          text: What was the thing that slew no one?
        - id: ch04-b04
          speaker: prince
          text: A raven that fed on the carcass of a poisoned horse.
        - id: ch04-b05
          speaker: princess
          text: Then what was it that killed twelve?
        - id: ch04-b06
          speaker: prince
          text: Twelve murderers ate that raven, and the poison killed them.
        - id: ch04-b07
          speaker: narrator
          text: Now that she knew the answer, the Princess tried to slip away. But the Prince gripped her mantle so firmly that she had to leave it behind.
    - id: ch05
      title: The Wedding Mantle
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The next morning, the Princess declared that she had solved the riddle. She summoned twelve judges and gave them the answer. But the Prince asked to speak as well.
        - id: ch05-b02
          speaker: prince
          text: She came to question me in the night. Without that, she could never have solved it.
        - id: ch05-b03
          speakers: [judge_1, judge_2, judge_3]
          ensemble: chorus
          text: Then bring us proof.
        - id: ch05-b04
          speaker: narrator
          text: The servant brought out all three cloaks. The judges recognized the grey one that the Princess often wore.
        - id: ch05-b05
          speakers: [judge_1, judge_2, judge_3]
          ensemble: chorus
          text: Have it embroidered with gold and silver. It shall be your wedding mantle.
