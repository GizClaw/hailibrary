audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，像编书人面对孩子娓娓而谈，幽默处轻巧含笑
        timbre: 温暖清朗
        pace: 舒缓而有自然起伏
        pitch: 中音
    godmother:
      display_name: 教母
      tts:
        delivery: 慈爱虔诚，声音虽衰弱，叮嘱时仍温和坚定
        timbre: 苍老柔和
        pace: 缓慢
        pitch: 中低音
    girl:
      display_name: 姑娘
      tts:
        delivery: 温柔真挚，羞怯时含蓄，歌唱时清亮自然
        timbre: 年轻清澈
        pace: 适中
        pitch: 中高音
    prince:
      display_name: 王子
      tts:
        delivery: 沉着坦率，作出决定时笃定，惊讶时自然流露
        timbre: 清朗温厚
        pace: 适中
        pitch: 中低音
  chapters:
    - id: ch01
      title: 教母留下的礼物
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，有个姑娘很小就失去了父母。她的教母独自住在村子尽头的一间小屋里，平日纺纱、织布、缝衣，靠一双手养活自己。老人把这个孤儿接回家，抚养她长大，也教她善良、虔诚，勤勤恳恳地过日子。
        - id: ch01-b02
          speaker: narrator
          text: >-
            姑娘十五岁那年，教母病倒了。老人知道自己的日子不多了，便把孩子叫到床边。
        - id: ch01-b03
          speaker: godmother
          text: >-
            亲爱的女儿，我快要离开人世了。这间小屋留给你，往后至少能替你遮风挡雨。我的纺锤、织布梭和针也都给你，你可以靠它们养活自己。
        - id: ch01-b04
          speaker: narrator
          text: >-
            她把双手放在姑娘头上，为她祝福，最后又叮嘱了一句。
        - id: ch01-b05
          speaker: godmother
          text: >-
            记住，要一直做个善良的人。这样，一切都会顺顺当当。
        - id: ch01-b06
          speaker: narrator
          text: >-
            说完，老人永远闭上了眼睛。送葬那天，姑娘跟在棺木后面，一路伤心地哭着，尽心送了教母最后一程。
        - id: ch01-b07
          speaker: narrator
          text: >-
            此后，她一个人守着小屋，天天纺纱、织布、缝衣。教母的祝福仿佛还留在她身边。亚麻不但用不完，还越积越多。每当她织好一张毯子、一匹麻布，或者缝好一件衬衫，总有客人愿意出好价钱买走。她自己衣食无缺，还能拿出余下的钱帮助穷苦的人。

    - id: ch02
      title: 最穷又最富的姑娘
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            就在这时候，国王的儿子走遍全国，想挑选一位新娘。他不能娶一个穷人家的女子，可他也不想娶富家姑娘。
        - id: ch02-b02
          speaker: prince
          text: >-
            谁既是最穷的，又是最富的，谁就是我的妻子。
        - id: ch02-b03
          speaker: narrator
          text: >-
            王子来到姑娘住的村庄，问起村里最富和最穷的女人。人们先告诉他谁最富，又说最穷的是个年轻姑娘，她独自住在村子尽头的小屋里。
        - id: ch02-b04
          speaker: narrator
          text: >-
            富家姑娘早已换上最华贵的衣裳，坐在门前等候。王子一靠近，她就起身迎上去，向他深深行礼。王子仔细打量了她，却什么也没说，只管骑马继续向前。

    - id: ch03
      title: 小屋窗前
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            到了穷姑娘的小屋，王子没有在门口看见她。原来，她正在屋里忙着做活。王子勒住马，从洒满阳光的窗口望进去，看见姑娘坐在纺车前，手里不停地纺着纱。
        - id: ch03-b02
          speaker: narrator
          text: >-
            姑娘抬起头，发现国王的儿子正望着自己，一张脸顿时红透了。她赶紧垂下眼睛，接着纺纱。至于那根线还像往常一样匀不匀，我可说不准。她就这样一直纺到王子骑远了。
        - id: ch03-b03
          speaker: narrator
          text: >-
            王子一走，姑娘便来到窗边，推开窗格。
        - id: ch03-b04
          speaker: girl
          text: >-
            屋里真热。
        - id: ch03-b05
          speaker: narrator
          text: >-
            嘴上虽然这么说，她的眼睛却一路追着王子，直到帽子上的白羽毛也消失不见。
        - id: ch03-b06
          speaker: narrator
          text: >-
            她又坐回纺车前。纺着纺着，忽然想起教母从前干活时常念的那句老话，于是轻声唱了起来。
        - id: ch03-b07
          speaker: girl
          text: >-
            纺锤，纺锤，快去瞧，看看我的心上人，会不会来到。
        - id: ch03-b08
          speaker: narrator
          text: >-
            真是奇了！纺锤猛地从她手中跳出去，一溜烟冲出屋子。姑娘惊得呆住了。等她回过神来，追到外面一看，只见纺锤欢欢喜喜地舞过田野，身后还拖着一根长长的金线。没过多久，它便从姑娘眼前消失了。

    - id: ch04
      title: 金线铺成的路
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            纺锤跑了，姑娘便拿起梭子，坐到织布机前织起布来。另一边，纺锤还在不停地向前跳舞。等那根金线刚好放到尽头，它也正好赶上了王子。
        - id: ch04-b02
          speaker: prince
          text: >-
            咦，这是什么？这个纺锤好像是特意来给我带路的。
          emotion: surprised
        - id: ch04-b03
          speaker: narrator
          text: >-
            王子立刻掉转马头，顺着地上的金线往回走。
        - id: ch04-b04
          speaker: narrator
          text: >-
            小屋里，姑娘还坐在织布机前。她一边织，一边又唱起歌来。
        - id: ch04-b05
          speaker: girl
          text: >-
            梭子，梭子，来回穿，织好锦毯铺门前，把我心上人迎进院。
        - id: ch04-b06
          speaker: narrator
          text: >-
            梭子马上挣脱她的手，一跳便出了门。它从门槛前织起一张地毯，那美丽的模样，世上谁也没有见过。两旁开满玫瑰和百合，中间像是长出了一片密林。野兔和家兔穿梭奔跑，雄鹿和小鹿从树枝间探出头来。最高的枝头还停着羽毛鲜亮的鸟儿，活灵活现，仿佛随时会唱出声。梭子左右翻飞，地毯也像是自己一点点长了出来。
        - id: ch04-b07
          speaker: narrator
          text: >-
            梭子也跑了，姑娘只好坐下来缝衣。她拿起针，唱了第三首歌。
        - id: ch04-b08
          speaker: girl
          text: >-
            针儿，针儿，快快缝，让我的房间又明亮，又漂亮。
        - id: ch04-b09
          speaker: narrator
          text: >-
            针立刻从她指间溜走，像闪电一样满屋飞。看起来，就像一群看不见的精灵正在忙碌。眨眼之间，桌子和长凳铺上了绿布，椅子蒙上了天鹅绒，窗前也垂下雅致的丝帘。
        - id: ch04-b10
          speaker: narrator
          text: >-
            最后一针刚刚缝好，姑娘向窗外一望，看见了王子帽子上的白羽毛。纺锤拖着金线，已经把他领回来了。

    - id: ch05
      title: 王子的新娘
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            王子下了马，沿着美丽的地毯走进小屋。来到房间里，他看见姑娘站在面前，脸红得像一朵玫瑰。
        - id: ch05-b02
          speaker: prince
          text: >-
            你就是那个最穷、却又最富的姑娘。跟我走吧，做我的新娘。
        - id: ch05-b03
          speaker: narrator
          text: >-
            姑娘没有回答，只向王子伸出了手。王子吻了她，牵她走出小屋，又把她扶上自己的马。他带姑娘回到王宫，两人举行了盛大而喜庆的婚礼。
        - id: ch05-b04
          speaker: narrator
          text: >-
            至于纺锤、梭子和针，都被小心地珍藏在王宫宝库里。从那以后，人们始终以最高的礼遇对待它们。这个故事，是格林兄弟讲下来的。
