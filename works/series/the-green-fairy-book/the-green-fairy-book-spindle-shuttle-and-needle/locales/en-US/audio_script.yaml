audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and attentive fairy-tale storytelling
        timbre: clear and gently resonant
        pace: measured
        pitch: medium
    godmother:
      display_name: Godmother
      tts:
        delivery: loving, devout, and quietly firm
        timbre: soft and aged
        pace: unhurried
        pitch: medium-low
    girl:
      display_name: Girl
      tts:
        delivery: gentle, sincere, and modest
        timbre: clear and youthful
        pace: natural
        pitch: medium-high
    prince:
      display_name: Prince
      tts:
        delivery: thoughtful, assured, and direct
        timbre: clear and noble
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Godmother's Gifts
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, there was a girl whose father and mother died when she was still very small. Her godmother lived alone in a little cottage at the far end of the village. She earned her living by spinning, weaving, and sewing. The old woman took the orphan into her home and raised her to be good, devout, and hardworking.
        - id: ch01-b02
          speaker: narrator
          text: When the girl was fifteen, her godmother became ill. She called the child to her bedside.
        - id: ch01-b03
          speaker: godmother
          text: My dear daughter, I can feel that my life is nearly over. I leave you my cottage, so you will always have a roof above you. I also leave you my spindle, my weaving shuttle, and my needle. With them, you can earn enough to live.
        - id: ch01-b04
          speaker: narrator
          text: She laid her hands on the girl's head and blessed her.
        - id: ch01-b05
          speaker: godmother
          text: Remember to be good, and all will go well with you.
        - id: ch01-b06
          speaker: narrator
          text: Then the old woman closed her eyes for the last time. When she was carried to her grave, the girl followed the coffin, weeping bitterly, and paid her godmother every final honor.
        - id: ch01-b07
          speaker: narrator
          text: After that, the girl lived alone in the little cottage. She worked hard at spinning, weaving, and sewing, and her godmother's blessing seemed to rest on everything she did. Her supply of flax kept growing. Whenever she wove a carpet or a piece of linen, or sewed a shirt, she always found a customer who paid her well. She had enough for herself and could even help people in need.
    - id: ch02
      title: The Poorest and the Richest
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: About this time, the King's son was traveling through the whole country in search of a bride. He could not marry a poor woman, but he did not want a rich one either.
        - id: ch02-b02
          speaker: prince
          text: I will marry the woman who is both the poorest and the richest.
        - id: ch02-b03
          speaker: narrator
          text: When he came to the girl's village, he asked who the richest woman was and who was the poorest. The villagers named the richest one first. Then they told him that the poorest was a young girl who lived alone in a little cottage at the far end of the village.
        - id: ch02-b04
          speaker: narrator
          text: The rich girl was sitting at her door in all her finest clothes. As the King's son approached, she rose, came forward, and made him a deep curtsey. He looked at her closely. He said nothing and rode on.
    - id: ch03
      title: At the Cottage Window
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: When the Prince reached the poor girl's cottage, she was not waiting at the door. She was busy working inside. He drew in his horse and looked through the window, where the sunlight shone brightly. There sat the girl at her wheel, spinning away.
        - id: ch03-b02
          speaker: narrator
          text: She looked up and saw the King's son watching her. Her whole face turned red. She lowered her eyes and kept spinning. I cannot say whether her thread was quite as even as usual, but she did not stop until he had ridden away.
        - id: ch03-b03
          speaker: narrator
          text: Then she went to the window and opened it.
        - id: ch03-b04
          speaker: girl
          text: The room is so hot.
        - id: ch03-b05
          speaker: narrator
          text: Yet she kept looking after him until the white plumes in his hat disappeared from sight.
        - id: ch03-b06
          speaker: narrator
          text: She returned to her work and began spinning again. As she worked, she remembered an old verse that her godmother used to repeat at the wheel. She started to sing.
        - id: ch03-b07
          speaker: girl
          text: Spindle, spindle, go and see, if my love will come to me.
        - id: ch03-b08
          speaker: narrator
          text: At once, the spindle leaped from her hand and raced out of the room. When the girl recovered from her surprise and looked after it, she saw it dancing merrily across the fields. A long golden thread streamed behind it. Soon the spindle vanished from sight.
    - id: ch04
      title: The Golden Thread
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: With her spindle gone, the girl picked up the shuttle, sat at her loom, and began to weave. Meanwhile, the spindle danced farther and farther. Just as it reached the end of the golden thread, it came to the King's son.
        - id: ch04-b02
          speaker: prince
          text: What can this be? This spindle seems to be showing me the way.
          emotion: surprised
        - id: ch04-b03
          speaker: narrator
          text: He turned his horse around and rode back beside the golden thread.
        - id: ch04-b04
          speaker: narrator
          text: Back at the cottage, the girl wove at her loom and sang another verse.
        - id: ch04-b05
          speaker: girl
          text: Shuttle, weave both web and woof. Bring my love beneath my roof.
        - id: ch04-b06
          speaker: narrator
          text: The shuttle slipped from her hand at once and sprang through the door. There on the threshold, it began to weave the loveliest carpet anyone had ever seen. Roses and lilies bloomed along both sides. In the middle stood a thicket where rabbits and hares ran between the plants. Stags and fawns peeped through the branches. Brilliant birds perched in the highest boughs, so lifelike that they seemed ready to sing. As the shuttle flew from side to side, the carpet appeared to grow all by itself.
        - id: ch04-b07
          speaker: narrator
          text: Now the shuttle was gone too, so the girl sat down to sew. She took up her needle and sang.
        - id: ch04-b08
          speaker: girl
          text: Needle, needle, stitch away. Make my chamber bright and gay.
        - id: ch04-b09
          speaker: narrator
          text: The needle promptly slipped from her fingers and flew around the room like lightning. It looked as if invisible spirits had begun to work. Almost at once, green cloth covered the table and benches. Velvet covered the chairs, and elegant silk curtains hung at the windows.
        - id: ch04-b10
          speaker: narrator
          text: The needle had barely made its final stitch when the girl glanced outside. There was the white-plumed hat of the King's son. The spindle and its golden thread were leading him back to her.
    - id: ch05
      title: The Prince's Bride
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The Prince dismounted and walked across the carpet into the cottage. When he entered the room, the girl stood before him, blushing like a rose.
        - id: ch05-b02
          speaker: prince
          text: You are the poorest, and still you are the richest. Come with me and be my bride.
        - id: ch05-b03
          speaker: narrator
          text: The girl did not speak, but she held out her hand. The Prince kissed her, led her outside, and lifted her onto his horse. He took her to the royal palace, where their wedding was celebrated with great rejoicing.
        - id: ch05-b04
          speaker: narrator
          text: The spindle, the shuttle, and the needle were carefully placed in the treasury. From then on, they were always treated with the highest honor.
