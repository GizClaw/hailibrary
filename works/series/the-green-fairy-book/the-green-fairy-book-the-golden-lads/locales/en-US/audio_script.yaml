  chapters:
    - id: ch01
      title: The Golden Fish
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: A poor fisherman and his wife lived in a little cottage beside a river. They survived on the fish he caught and managed as best they could, never knowing how they would find their next meal.
        - id: ch01-b02
          speaker: narrator
          text: One day, the fisherman hauled in his net and found a most remarkable fish inside. It was golden from head to tail. As he stared at it in wonder, the fish opened its mouth and spoke.
        - id: ch01-b03
          speaker: golden_fish
          text: Listen, fisherman. Throw me back into the water, and I will turn your poor little cottage into a splendid castle.
        - id: ch01-b04
          speaker: fisherman
          text: What use is a castle to me when I have no food to eat inside it?
        - id: ch01-b05
          speaker: golden_fish
          text: I will see to that. The castle will have a cupboard filled with every kind of food you could wish for.
        - id: ch01-b06
          speaker: fisherman
          text: Well, if that is so, I am willing to set you free.
        - id: ch01-b07
          speaker: golden_fish
          text: There is one condition. You must never tell anyone where your good fortune came from. Speak one word about it, and everything will vanish.
        - id: ch01-b08
          speaker: narrator
          text: The fisherman threw the golden fish back into the river and went home. Where his little cottage had stood, he found a great and spacious castle. He opened his eyes wide and stepped inside. His wife sat in a splendidly furnished room, dressed in fine clothes and bursting with delight at the change in their fortunes.
        - id: ch01-b09
          speaker: wife
          text: Husband, look at all this! How could it have happened? I am so happy!
          emotion: happy
        - id: ch01-b10
          speaker: fisherman
          text: I am happy too, but I am terribly hungry. I want something to eat right now.
        - id: ch01-b11
          speaker: wife
          text: I have nothing to give you. I do not even know where anything is in this new house.
        - id: ch01-b12
          speaker: fisherman
          text: Never mind. There is a large cupboard over there. Try opening it.
        - id: ch01-b13
          speaker: narrator
          text: Inside the cupboard, they found meat, cakes, fruit, and wine laid out in the most tempting way. The wife clapped her hands for joy.
        - id: ch01-b14
          speaker: wife
          text: My dear, what more could anyone wish for?
          emotion: happy
        - id: ch01-b15
          speaker: narrator
          text: They sat down and ate and drank. When the meal was over, the wife turned to her husband.
        - id: ch01-b16
          speaker: wife
          text: But where did all these riches come from?
        - id: ch01-b17
          speaker: fisherman
          text: Please do not ask me. I dare not tell you. If I reveal the secret to anyone, we will lose everything.
        - id: ch01-b18
          speaker: wife
          text: Very well. If you cannot tell me, then of course I do not want to know.
        - id: ch01-b19
          speaker: narrator
          text: But she did want to know. She had not meant what she said at all. Her curiosity gave her no peace, by day or by night. Again and again, she questioned and pestered her husband. At last, she wore his patience away. He blurted out that a wonderful golden fish had given them everything after he caught it and set it free.
        - id: ch01-b20
          speaker: narrator
          text: The words had hardly left his mouth when the castle and the cupboard vanished. The fisherman and his wife were sitting in their poor little hut once more.
    - id: ch02
      title: The Fish Returns
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The man returned to his old trade and began fishing again. By good luck, he caught the golden fish a second time.
        - id: ch02-b02
          speaker: golden_fish
          text: Now listen. Put me back in the water, and I will restore your castle and the cupboard with all its good things. This time, take care. Never tell where they came from, or you will lose them again.
        - id: ch02-b03
          speaker: fisherman
          text: I promise I will be very careful.
        - id: ch02-b04
          speaker: narrator
          text: He returned the fish to the river. At home, all their former splendor had come back, and his wife was overjoyed. Still, her curiosity kept troubling her. She held it back for two whole days. Then she began asking once more what had happened and how her husband had done it.
        - id: ch02-b05
          speaker: narrator
          text: The fisherman stayed silent for a while. At last, she annoyed him so much that the secret burst out of him. In that very moment, the castle disappeared, and once again they found themselves in their wretched old hut.
        - id: ch02-b06
          speaker: fisherman
          text: There! You simply had to know. Now we will have to live on next to nothing again.
          emotion: angry
        - id: ch02-b07
          speaker: wife
          text: I would rather go without all the riches in the world than have them and never know where they came from. The wondering would never let me rest.
        - id: ch02-b08
          speaker: narrator
          text: So the man took up his nets again. One day, fate brought the golden fish into them for a third time.
        - id: ch02-b09
          speaker: golden_fish
          text: It seems I am destined to fall into your hands. Take me home now and cut me into six pieces. Give two pieces to your wife, two to your horse, and plant the last two in your garden. They will bring you a blessing.
        - id: ch02-b10
          speaker: narrator
          text: The fisherman carried the fish home and followed every instruction exactly. After some time had passed, two golden lilies rose from the pieces planted in the garden. His horse had two golden foals, and his wife gave birth to twin boys who were golden too.
        - id: ch02-b11
          speaker: narrator
          text: The two boys grew tall and handsome. Beside them, the golden foals and the golden lilies grew as well.
        - id: ch02-b12
          speakers: [first_brother, second_brother]
          ensemble: duo
          text: Father, we want to mount our golden horses and ride out to see the world.
        - id: ch02-b13
          speaker: fisherman
          text: How can I bear to let you go? When you are far away, I will know nothing about you.
          emotion: sad
        - id: ch02-b14
          speakers: [first_brother, second_brother]
          ensemble: duo
          text: The golden lilies will tell you how we are. If they droop, you will know we are ill. If they fall and fade away, you will know we are dead.
        - id: ch02-b15
          speaker: narrator
          text: The brothers mounted their golden steeds and rode away together. They came to an inn crowded with people. As soon as everyone saw the two golden lads, they began laughing and jeering at them. One brother heard the mockery and lost heart. He could not face going any farther into the world, so he turned his horse around and rode home to his father. The other brother continued alone.
    - id: ch03
      title: Through the Forest
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The second brother rode on until he reached the edge of a vast forest. People there stopped him and warned him that the road ahead was far too dangerous.
        - id: ch03-b02
          speakers: [forest_warners_1, forest_warners_2]
          ensemble: duo
          text: You must not ride through that forest. It is full of robbers, and you are certain to come to grief. Once they see that you and your horse are made of gold, they will attack and kill you.
        - id: ch03-b03
          speaker: second_brother
          text: I must ride on, and I will.
        - id: ch03-b04
          speaker: narrator
          text: He found some bearskins and covered both himself and his horse. Not one gleam of gold could be seen. Then he rode boldly into the heart of the forest.
        - id: ch03-b05
          speaker: narrator
          text: After he had traveled some distance, bushes rustled nearby and voices whispered from either side of the path.
        - id: ch03-b06
          speaker: robber_1
          text: Someone is coming this way.
        - id: ch03-b07
          speaker: robber_2
          text: Let him pass. He is only a bear keeper, and he is as poor as a church mouse.
        - id: ch03-b08
          speaker: narrator
          text: The robbers were fooled by the bearskins. The golden lad passed safely through the whole forest, and no harm came to him.
        - id: ch03-b09
          speaker: narrator
          text: One day, he reached a village and saw a girl whom he thought the loveliest person in the world. He loved her at once and went to speak to her.
        - id: ch03-b10
          speaker: second_brother
          text: I love you with all my heart. Will you marry me?
        - id: ch03-b11
          speaker: narrator
          text: The girl liked him so much that she placed her hand in his.
        - id: ch03-b12
          speaker: bride
          text: Yes, I will marry you, and I will be true to you for as long as I live.
        - id: ch03-b13
          speaker: narrator
          text: They were married. In the middle of the wedding celebrations, the bride's father came home. He was greatly surprised to find his daughter celebrating her wedding.
        - id: ch03-b14
          speaker: brides_father
          text: Who is the bridegroom?
          emotion: surprised
        - id: ch03-b15
          speaker: narrator
          text: One of the guests pointed to the golden lad, who was still wrapped in his bearskin.
        - id: ch03-b16
          speaker: wedding_guest
          text: That man there is the bridegroom.
        - id: ch03-b17
          speaker: brides_father
          text: A mere bear keeper will never have my daughter!
          emotion: angry
        - id: ch03-b18
          speaker: narrator
          text: The father rushed at the supposed bear keeper and tried to kill him. The bride did everything she could to calm her father. She stood up for her husband and begged hard for his life until her father listened.
        - id: ch03-b19
          speaker: bride
          text: He is my husband now, and I love him with all my heart. Please do not hurt him.
        - id: ch03-b20
          speaker: narrator
          text: At last, her father gave in. Still, he could not put the matter out of his mind. Very early the next morning, he went to see whether his daughter's husband really was no more than a ragged beggar.
        - id: ch03-b21
          speaker: narrator
          text: In his son-in-law's room, he saw a splendid golden man lying in bed, with the rough bearskin thrown on the floor close beside him. The father understood his mistake and slipped quietly away before anyone noticed him.
        - id: ch03-b22
          speaker: brides_father
          text: How fortunate that I controlled my anger. I would have committed a terrible crime.
    - id: ch04
      title: The Witch's Spell
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Meanwhile, the golden lad dreamed that he was hunting a noble stag. When he woke, he told his bride what he meant to do.
        - id: ch04-b02
          speaker: second_brother
          text: I must go hunting.
        - id: ch04-b03
          speaker: narrator
          text: His bride was deeply anxious and begged him to remain at home.
        - id: ch04-b04
          speaker: bride
          text: Please stay. Some terrible accident could happen to you so easily.
          emotion: fearful
        - id: ch04-b05
          speaker: second_brother
          text: I must go, and I will.
        - id: ch04-b06
          speaker: narrator
          text: He rode into the forest. Before long, a magnificent stag stopped directly in front of him, just like the one in his dream. He aimed his weapon and was about to fire, but the stag bounded away.
        - id: ch04-b07
          speaker: narrator
          text: The golden lad chased it through bushes and thorny briars. He kept going hour after hour and did not stop once all day. By evening, the stag had completely vanished. Only then did he look around. He found himself deep in the forest, directly before a hut where a witch lived.
        - id: ch04-b08
          speaker: narrator
          text: He knocked. A little old woman opened the door.
        - id: ch04-b09
          speaker: witch
          text: What do you want here so late, in the middle of this great forest?
        - id: ch04-b10
          speaker: second_brother
          text: Have you seen a stag anywhere near here?
        - id: ch04-b11
          speaker: witch
          text: Yes. I know that stag very well.
        - id: ch04-b12
          speaker: narrator
          text: As she spoke, a little dog ran out of the hut. It barked and snapped at the stranger.
        - id: ch04-b13
          speaker: second_brother
          text: Be quiet, you nasty little creature, or I will shoot you dead.
          emotion: angry
        - id: ch04-b14
          speaker: narrator
          text: The witch flew into a rage.
        - id: ch04-b15
          speaker: witch
          text: What? You would kill my dog?
          emotion: angry
        - id: ch04-b16
          speaker: narrator
          text: In the next moment, the golden lad was turned to stone and lay there unable to move. His bride waited for him, but he never came home.
        - id: ch04-b17
          speaker: bride
          text: The evil I feared must have happened to him. That is why my heart felt so heavy.
          emotion: sad
        - id: ch04-b18
          speaker: narrator
          text: At home, the other brother stood beside the golden lilies. Suddenly, one lily bent over and fell to the ground.
        - id: ch04-b19
          speaker: first_brother
          text: Oh no! Some great misfortune has struck my brother. I must leave at once. Perhaps I can still save him.
          emotion: fearful
        - id: ch04-b20
          speaker: fisherman
          text: Stay here. If I lose you as well, what will become of me?
          emotion: fearful
        - id: ch04-b21
          speaker: first_brother
          text: I must go, and I will.
    - id: ch05
      title: The Lily Blooms Again
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The first brother mounted his golden horse and rode away without delay. At last, he reached the forest where his brother lay turned to stone. The old witch came out of her house and called him closer, hoping to cast her spell on him too. He understood the danger and was careful not to go near her.
        - id: ch05-b02
          speaker: first_brother
          text: Bring my brother back to life at once, or I will shoot you where you stand.
        - id: ch05-b03
          speaker: narrator
          text: The witch did not want to obey, but she reached out and touched the stone with one finger. At once, it took on human form again.
        - id: ch05-b04
          speaker: narrator
          text: The golden brothers threw their arms around each other and kissed each other for joy. Then they rode together to the edge of the forest. There they parted. The first brother returned to their old father, while the second rode home to his bride.
        - id: ch05-b05
          speaker: fisherman
          text: I knew you had saved your brother. All at once, his golden lily stood upright and burst into bloom.
          emotion: happy
        - id: ch05-b06
          speaker: narrator
          text: And so they all lived happily for the rest of their lives, and everything went well with them.
