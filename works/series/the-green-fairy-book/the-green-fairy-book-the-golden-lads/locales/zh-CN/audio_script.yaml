audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，像编书人面对孩子娓娓而谈，幽默处轻巧含笑
        timbre: 温暖清朗
        pace: 舒缓而有自然起伏
        pitch: 中音
    fisher:
      display_name: 渔夫
      tts:
        delivery: 朴实直率，讲究实际，忍耐耗尽时会突然发作
        timbre: 粗实温厚
        pace: 自然
        pitch: 中低音
    fishers_wife:
      display_name: 渔夫妻子
      tts:
        delivery: 快言快语，好奇心强，欢喜和焦躁都毫不遮掩
        timbre: 成熟明亮
        pace: 稍快
        pitch: 中音
    golden_fish:
      display_name: 金鱼
      tts:
        delivery: 神秘而笃定，许诺和警告都说得清楚郑重
        timbre: 清澈空灵
        pace: 从容
        pitch: 中高音
    golden_lad_home:
      display_name: 留在家中的金童
      tts:
        delivery: 起初腼腆退缩，兄弟遇险后变得果断勇敢
        timbre: 年轻清亮
        pace: 明快
        pitch: 中高音
    golden_lad_traveler:
      display_name: 远行的金童
      tts:
        delivery: 勇敢热烈，面对阻拦十分坚定，动怒时锋芒毕露
        timbre: 年轻明朗
        pace: 明快
        pitch: 中高音
    forest_dweller:
      display_name: 森林边的居民
      tts:
        delivery: 好心而急切，警告陌生人时直截了当
        timbre: 朴实清楚
        pace: 自然
        pitch: 中音
    first_robber:
      display_name: 第一个强盗
      tts:
        delivery: 压低声音暗中窥探，说话短促警觉
        timbre: 粗哑
        pace: 稍快
        pitch: 中低音
    second_robber:
      display_name: 第二个强盗
      tts:
        delivery: 漫不经心又轻蔑，判断猎物时十分草率
        timbre: 低沉干涩
        pace: 自然
        pitch: 低音
    bride:
      display_name: 新娘
      tts:
        delivery: 真挚温柔，面对父亲时坚定，担忧丈夫时恳切
        timbre: 年轻温暖
        pace: 自然
        pitch: 中高音
    brides_father:
      display_name: 新娘的父亲
      tts:
        delivery: 威严急躁，发怒时声势逼人，醒悟后克制低沉
        timbre: 浑厚成熟
        pace: 稳重
        pitch: 低音
    witch:
      display_name: 女巫
      tts:
        delivery: 表面像寻常老妇，受冒犯时尖厉凶狠，屈服时冷硬不甘
        timbre: 苍老沙哑
        pace: 缓慢
        pitch: 中低音
  chapters:
    - id: ch01
      title: 金鱼的秘密
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，有一对穷夫妻住在一间小茅屋里。他们靠到附近的河里打鱼糊口，日子总是有一顿没一顿。一天，渔夫收起网，发现里面有条奇鱼，浑身上下全是金的。他正惊讶地看着，那鱼忽然开了口。
        - id: ch01-b02
          speaker: golden_fish
          text: >-
            渔夫，你听我说。把我放回水里，我就把你那间破旧的小茅屋变成一座漂亮的大城堡。
        - id: ch01-b03
          speaker: fisher
          text: >-
            城堡再漂亮，里面没有吃的，对我又有什么用？
        - id: ch01-b04
          speaker: golden_fish
          text: >-
            吃的不用你操心。城堡里会有一只橱柜，你最想吃什么，里面就能找到什么。
        - id: ch01-b05
          speaker: fisher
          text: >-
            要是这样，我愿意放你走。
        - id: ch01-b06
          speaker: golden_fish
          text: >-
            不过我有一个条件。你的好运从哪里来，绝不能告诉任何人。只要泄露一个字，这一切就会消失。
        - id: ch01-b07
          speaker: narrator
          text: >-
            渔夫把鱼放回河里，转身回家。小茅屋不见了，原地立着一座宽敞的城堡。他瞪大眼睛走进去，只见妻子穿着漂亮衣裳，坐在华美的客厅里，整个人高兴得不得了。
        - id: ch01-b08
          speaker: fishers_wife
          text: >-
            丈夫，这到底是怎么回事？我真是太喜欢这里了！
          emotion: happy
        - id: ch01-b09
          speaker: fisher
          text: >-
            我也喜欢。可我现在饿坏了，得马上吃点东西。
        - id: ch01-b10
          speaker: fishers_wife
          text: >-
            我什么也没有呀。这座新房子这么大，我连东西放在哪儿都不知道。
        - id: ch01-b11
          speaker: fisher
          text: >-
            别急。那边有只大橱柜，打开看看吧。
        - id: ch01-b12
          speaker: narrator
          text: >-
            橱门一开，肉、糕点、水果和美酒摆得满满当当，样样都让人馋得很。妻子快活地拍起手来。
        - id: ch01-b13
          speaker: fishers_wife
          text: >-
            哎呀，有了这些，我们还求什么呢？
          emotion: happy
        - id: ch01-b14
          speaker: narrator
          text: >-
            夫妻俩坐下来，痛痛快快地吃喝了一顿。吃饱以后，妻子还是想不明白。
        - id: ch01-b15
          speaker: fishers_wife
          text: >-
            丈夫，这么多好东西，究竟是从哪儿来的？
        - id: ch01-b16
          speaker: fisher
          text: >-
            别问了，我不能说。只要我把秘密告诉别人，咱们拥有的一切就全完了。
        - id: ch01-b17
          speaker: fishers_wife
          text: >-
            好吧。既然不许我知道，那我当然一点儿也不想问。
        - id: ch01-b18
          speaker: narrator
          text: >-
            她嘴上这样说，心里却不是这么想。那份好奇日日夜夜缠着她，一刻也不肯放过。她不停追问，把丈夫逼得忍无可忍。渔夫终于脱口说出，所有这一切都来自一条落进渔网、又被他放走的神奇金鱼。话才说完，城堡、橱柜和里面的东西一下子全没了。夫妻俩又坐回了寒酸的小渔屋。

    - id: ch02
      title: 两次失而复得
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            渔夫没有办法，只好重新下河打鱼。说来也巧，他第二次捕到了那条金鱼。
        - id: ch02-b02
          speaker: golden_fish
          text: >-
            这次听仔细了。你把我放回去，我就还给你城堡，还有装满美食的橱柜。可千万别再说出它们的来历，不然你还会失去一切。
        - id: ch02-b03
          speaker: fisher
          text: >-
            这回我一定小心，绝不会说出去。
        - id: ch02-b04
          speaker: narrator
          text: >-
            他放走金鱼，回到家里，原来的富贵果然都回来了。妻子欢喜极了，可那份好奇也跟着回来了。她拼命忍了两天，到底还是问起先前发生过什么，丈夫又是怎么办到的。渔夫起先闭口不谈，后来被她缠得火冒三丈，又把秘密嚷了出来。转眼间，城堡消失，他们再次坐进了破茅屋。
        - id: ch02-b05
          speaker: fisher
          text: >-
            这下你满意了！你非知道不可，现在咱们只好继续挨饿。
          emotion: angry
        - id: ch02-b06
          speaker: fishers_wife
          text: >-
            要是不能知道财宝从哪里来，那天下所有的富贵，我宁可一样也不要。不弄清楚，我根本安生不了。
        - id: ch02-b07
          speaker: narrator
          text: >-
            渔夫又拿起渔网。有一天，命运让金鱼第三次落进他的网中。
        - id: ch02-b08
          speaker: golden_fish
          text: >-
            看来我注定要落到你手里。这次把我带回家，切成六块。两块给你妻子吃，两块喂你的马，剩下两块种进花园。这样会给你带来福气。
        - id: ch02-b09
          speaker: narrator
          text: >-
            渔夫把金鱼带回家，完全照它说的做了。过了一阵，花园里长出两株金百合，他的马生下两匹金色的小马驹，妻子也生了一对双胞胎男孩。两个孩子从头到脚都是金的。
        - id: ch02-b10
          speaker: narrator
          text: >-
            年复一年，兄弟俩长得高大俊美。两匹小马驹和两株金百合，也陪着他们一同长大。

    - id: ch03
      title: 兄弟分路
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            两个孩子已经长大。这一天，他们一起来向父亲辞行。父亲听了，心里很难过。
        - id: ch03-b02
          speakers: [golden_lad_home, golden_lad_traveler]
          ensemble: duo
          text: >-
            爸爸，我们想骑上金马，到外面的世界去看看。
        - id: ch03-b03
          speaker: fisher
          text: >-
            你们走得那么远，我一点儿消息也听不到，叫我怎么受得了？
        - id: ch03-b04
          speakers: [golden_lad_home, golden_lad_traveler]
          ensemble: duo
          text: >-
            爸爸，您看着那两株金百合，就知道我们怎么样了。花要是垂下去，说明我们病了。花要是倒在地上枯萎了，就说明我们已经死了。
        - id: ch03-b05
          speaker: narrator
          text: >-
            兄弟俩骑上金马，来到一家客店。店里的人一看见两个金光闪闪的少年，就一起哄笑，拿他们取乐。其中一个听着那些嘲笑，心里胆怯起来。他不想再往外闯，便掉转马头，回到父亲身边。另一个继续上路，一直骑到一片大森林边上。那里的人连忙警告他。
        - id: ch03-b06
          speaker: forest_dweller
          text: >-
            千万别骑进这片森林！里面到处是强盗，你一定会遭殃。尤其让他们看见你和马都是金的，他们非扑上来杀了你不可。
        - id: ch03-b07
          speaker: golden_lad_traveler
          text: >-
            这片森林我非过不可。我已经决定了。
        - id: ch03-b08
          speaker: narrator
          text: >-
            少年一点儿也没被吓住。他找来几张熊皮，把自己和金马严严实实地裹住，一点儿金色也没有露出来。随后，他勇敢地骑进森林深处。走了一段路，灌木丛里传来沙沙声，紧接着又有人说起话来。
        - id: ch03-b09
          speaker: first_robber
          text: >-
            你看，那边有人过来了。
        - id: ch03-b10
          speaker: second_robber
          text: >-
            随他去吧。只是个养熊的穷汉，穷得跟教堂里的老鼠一样。
        - id: ch03-b11
          speaker: narrator
          text: >-
            强盗没有动手，金童平安穿过森林，半点伤也没受。

    - id: ch04
      title: 熊皮下的新郎
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            一天，金童来到一个村庄。他在那里遇见一位姑娘，只觉得世上再没有谁比她更美。他一下子爱上了她，便走到姑娘面前。
        - id: ch04-b02
          speaker: golden_lad_traveler
          text: >-
            我是真心爱你的。你愿意做我的妻子吗？
        - id: ch04-b03
          speaker: narrator
          text: >-
            姑娘也很喜欢他。她把手放进金童手里。
        - id: ch04-b04
          speaker: bride
          text: >-
            我愿意嫁给你。只要我还活着，就永远对你忠诚。
        - id: ch04-b05
          speaker: narrator
          text: >-
            两人立刻成了婚。婚礼正热闹，处处都是欢声笑语，新娘的父亲却在这时回到家。他看见女儿正在办婚礼，吃惊极了。
        - id: ch04-b06
          speaker: brides_father
          text: >-
            新郎究竟是谁？
        - id: ch04-b07
          speaker: narrator
          text: >-
            有人指给他看。金童仍然裹着那身粗糙的熊皮，活像一个管熊的穷汉。父亲顿时勃然大怒。
        - id: ch04-b08
          speaker: brides_father
          text: >-
            一个管熊的也想娶我女儿？绝不可能！
          emotion: angry
        - id: ch04-b09
          speaker: narrator
          text: >-
            他冲上前去，想要杀死金童。新娘连忙挡住父亲，竭力安抚他。
        - id: ch04-b10
          speaker: bride
          text: >-
            爸爸，不管您怎么看，他已经是我的丈夫。我是真心爱他的，求您别伤害他。
        - id: ch04-b11
          speaker: narrator
          text: >-
            父亲听了这些恳求，终于让了步。可他心里总惦记着这件事。第二天一大早，他便起床去看女儿的丈夫，非要弄清那人是不是真是个衣衫褴褛的穷叫花子。谁知走进房间，他看见床上躺着一位光彩夺目的金人，熊皮就扔在旁边的地上。他悄悄退了出去。
        - id: ch04-b12
          speaker: brides_father
          text: >-
            幸好我昨天忍住了怒火。不然，我一定会犯下大罪。
        - id: ch04-b13
          speaker: narrator
          text: >-
            就在这时，金童梦见自己在打猎，正追赶一头雄壮的鹿。他一醒来，便告诉新娘自己要出门。
        - id: ch04-b14
          speaker: golden_lad_traveler
          text: >-
            我得进森林打猎。
        - id: ch04-b15
          speaker: bride
          text: >-
            别去了，留在家里吧。我心里很不安，你这一去，说不定会碰上祸事。
          emotion: fearful
        - id: ch04-b16
          speaker: golden_lad_traveler
          text: >-
            我一定得去，谁也拦不住我。

    - id: ch05
      title: 女巫的小屋
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            金童进了森林。没走多久，一头漂亮的鹿停在他面前，正是梦里的那一头。他举枪瞄准，刚要开火，鹿忽然跳开，飞快地逃走了。金童追进灌木和荆棘，一整天都没有停下。傍晚，鹿消失得无影无踪。他四下一看，发现自己站在一间小屋前，里面住着一个女巫。他敲敲门，一位矮小的老妇人走了出来。
        - id: ch05-b02
          speaker: witch
          text: >-
            天都这么晚了，你到大森林深处来做什么？
        - id: ch05-b03
          speaker: golden_lad_traveler
          text: >-
            你有没有看见一头鹿从这里经过？
        - id: ch05-b04
          speaker: witch
          text: >-
            看见了，那头鹿我熟得很。
        - id: ch05-b05
          speaker: narrator
          text: >-
            她刚说完，一条小狗就从屋里蹿出来，冲着陌生人又叫又咬。
        - id: ch05-b06
          speaker: golden_lad_traveler
          text: >-
            安静点，你这只小癞蛤蟆！再不停下，我就一枪打死你。
          emotion: angry
        - id: ch05-b07
          speaker: narrator
          text: >-
            女巫听见这话，顿时怒不可遏，扯着嗓子尖叫起来。
        - id: ch05-b08
          speaker: witch
          text: >-
            什么？你还敢杀我的狗？
          emotion: angry
        - id: ch05-b09
          speaker: narrator
          text: >-
            下一瞬间，金童就变成一块石头，僵在那里，再也不能动弹。新娘在家苦苦等候，始终等不到他回来。
        - id: ch05-b10
          speaker: bride
          text: >-
            唉，我一直害怕的祸事，那个压得我心里发沉的祸事，恐怕真的落到他身上了。
          emotion: sad

    - id: ch06
      title: 金百合重新开花
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            与此同时，另一个兄弟正在家中守着金百合。忽然，其中一株弯下去，倒在地上。
        - id: ch06-b02
          speaker: golden_lad_home
          text: >-
            天哪，我的兄弟一定遭了大难！我得马上出发，也许现在去，还来得及救他。
          emotion: fearful
        - id: ch06-b03
          speaker: fisher
          text: >-
            留在家里吧。要是连你也失去了，我以后可怎么办？
        - id: ch06-b04
          speaker: golden_lad_home
          text: >-
            我非去不可，谁也拦不住我。
        - id: ch06-b05
          speaker: narrator
          text: >-
            他跨上金马，一路来到兄弟化作石头的森林。老女巫走出小屋，招呼他靠近，也想把他变成石头。可这位金童早有防备，始终离她远远的。
        - id: ch06-b06
          speaker: golden_lad_home
          text: >-
            马上让我的兄弟活过来！不照做，我就在这里开枪打死你。
          emotion: angry
        - id: ch06-b07
          speaker: narrator
          text: >-
            女巫很不情愿，却只能伸出一根手指，碰了碰那块石头。石头立刻变回了人。兄弟俩惊喜地拥抱、亲吻，随后一同骑到森林边缘。他们在那里分开，一个回到年迈的父亲身边，另一个回到了新娘身旁。
        - id: ch06-b08
          speaker: narrator
          text: >-
            留在家中的金童回来以后，父亲迎上前告诉他，那株倒下的金百合已经把一切都说清楚了。
        - id: ch06-b09
          speaker: fisher
          text: >-
            我知道你救出了自己的兄弟。那株金百合突然挺直了身子，还开出了花。
        - id: ch06-b10
          speaker: narrator
          text: >-
            从此，他们一生幸福，事事顺遂。
