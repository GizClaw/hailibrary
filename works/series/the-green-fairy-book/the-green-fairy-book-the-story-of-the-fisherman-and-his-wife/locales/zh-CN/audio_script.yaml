audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，像编书人面对孩子娓娓而谈，幽默处轻巧含笑
        timbre: 温暖清朗
        pace: 舒缓而有自然起伏
        pitch: 中音
    fisherman:
      display_name: 渔夫
      tts:
        delivery: 老实怯懦，话里常带迟疑和忧虑
        timbre: 朴实微哑
        pace: 稍慢
        pitch: 中低音
    ilsebel:
      display_name: 伊尔泽贝尔
      tts:
        delivery: 强硬急切，欲望越盛语气越不容反驳
        timbre: 清晰锐利
        pace: 偏快
        pitch: 中高音
    flounder:
      display_name: 比目鱼
      tts:
        delivery: 简短沉静，面对每次请求都不动声色
        timbre: 深沉清澈
        pace: 从容
        pitch: 低音
  chapters:
    - id: ch01
      title: 海里的比目鱼
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，有个渔夫和妻子住在海边一间又小又破的茅屋里。渔夫每天都去海边钓鱼。他握着钓竿坐在那里，望着亮闪闪的海水，一钓就是很久。
        - id: ch01-b02
          speaker: narrator
          text: >-
            有一天，鱼线突然沉到水底。渔夫使劲收线，钓上来一条大比目鱼。没想到，那条鱼竟开口说起话来。
        - id: ch01-b03
          speaker: flounder
          text: >-
            渔夫，请你放了我吧。我不是真的比目鱼，而是一位中了魔法的王子。杀了我对你没有好处，我的肉也不好吃。把我放回海里，让我游走吧。
        - id: ch01-b04
          speaker: fisherman
          text: >-
            好了，你不必这么大声嚷嚷。你既然会说话，我当然还是放你走的好。
        - id: ch01-b05
          speaker: narrator
          text: >-
            渔夫说完，就把鱼放回闪光的海水里。比目鱼慢慢沉向水底，身后拖着一道长长的血痕。渔夫从岸边站起身，收起自己的钓竿，回到那间海边茅屋找妻子去了。
        - id: ch01-b06
          speaker: ilsebel
          text: >-
            丈夫，你今天什么也没钓到吗？
        - id: ch01-b07
          speaker: fisherman
          text: >-
            没有。我钓到一条比目鱼，它说自己是中了魔法的王子，我就把它放走了。
        - id: ch01-b08
          speaker: ilsebel
          text: >-
            那你没向它许个愿？
        - id: ch01-b09
          speaker: fisherman
          text: >-
            没有啊。我有什么可向它要的？
        - id: ch01-b10
          speaker: ilsebel
          text: >-
            一辈子住在这间又小又脏的茅屋里，多糟啊！你本该向它要一栋小房子。现在去叫它来，就说我们想要一栋房子。它一定会答应。
        - id: ch01-b11
          speaker: fisherman
          text: >-
            唉，我为什么还要去找它呢？
        - id: ch01-b12
          speaker: ilsebel
          text: >-
            你捉住了它，又放了它，它当然会答应你。快去！
        - id: ch01-b13
          speaker: narrator
          text: >-
            渔夫很不情愿。可是妻子无论如何也不肯罢休，他只好来到海边。海水已经不再发亮，而是一片青黄。他站在岸上，念起那几句话。
        - id: ch01-b14
          speaker: fisherman
          text: >-
            本是王子遭魔变，化作比目鱼游海间。快来吧，我妻伊尔泽贝尔，心中有愿我难开言。
        - id: ch01-b15
          speaker: narrator
          text: >-
            比目鱼从水里游了上来。
        - id: ch01-b16
          speaker: flounder
          text: >-
            她想要什么？
        - id: ch01-b17
          speaker: fisherman
          text: >-
            唉，我妻子说，我本该留下你，向你许个愿。她不愿再住茅屋，想要一栋小房子。
        - id: ch01-b18
          speaker: flounder
          text: >-
            回去吧。她已经有了。
        - id: ch01-b19
          speaker: narrator
          text: >-
            渔夫回到家，茅屋已经不见了。原来的地方立着一栋漂亮的小房子，妻子正坐在门前的长凳上。她拉着渔夫的手，叫他进去仔细看看，这里究竟比从前好多少。
        - id: ch01-b20
          speaker: ilsebel
          text: >-
            进来吧。这是不是比原来好多了？
        - id: ch01-b21
          speaker: narrator
          text: >-
            房子里有一间小前厅、一间漂亮的起居室，还有一间摆着床的卧室。厨房和饭厅也都置办好了，上好的家具样样齐全，各种锡器和铜器什么都有。屋外还有一座小院，里面养着鸡鸭。旁边的小花园里种满了蔬菜和果树。
        - id: ch01-b22
          speaker: ilsebel
          text: >-
            你瞧，这不是很好吗？
        - id: ch01-b23
          speaker: fisherman
          text: >-
            是啊。我们就留在这里，一定能过得很快活。
        - id: ch01-b24
          speaker: ilsebel
          text: >-
            那可得再看看。
        - id: ch01-b25
          speaker: narrator
          text: >-
            两人就这样吃过晚饭，上床睡了。小房子里的日子样样顺心，这样安稳地过了一个星期，也许两个星期。

    - id: ch02
      title: 石头城堡
      blocks:
        - id: ch02-b01
          speaker: ilsebel
          text: >-
            听着，丈夫。这房子太小，院子和花园也太小。比目鱼为什么不干脆给我们一栋大房子？我想住进宏伟的石头城堡。去叫它送我们一座城堡。
        - id: ch02-b02
          speaker: fisherman
          text: >-
            唉，妻子，这栋小房子已经够好了。我们为什么非得住城堡？
        - id: ch02-b03
          speaker: ilsebel
          text: >-
            哪有那么多为什么？你去就是了，比目鱼办得到。
        - id: ch02-b04
          speaker: fisherman
          text: >-
            不行。它已经给了我们房子，我不想再去求它。它也许会生气的。
        - id: ch02-b05
          speaker: ilsebel
          text: >-
            去！它当然给得起，也该痛痛快快地给。马上去。
        - id: ch02-b06
          speaker: narrator
          text: >-
            渔夫心里沉甸甸的，一点也不愿去。他一路想着，这样做不对，可两只脚还是把他带到了海边。海水变成紫色和深蓝色，阴暗又浑浊，只有海面还算平静。他站定，又念起那首歌谣。
        - id: ch02-b07
          speaker: fisherman
          text: >-
            本是王子遭魔变，化作比目鱼游海间。快来吧，我妻伊尔泽贝尔，心中有愿我难开言。
        - id: ch02-b08
          speaker: flounder
          text: >-
            她现在又想要什么？
        - id: ch02-b09
          speaker: fisherman
          text: >-
            唉，她想住进一座宏伟的石头城堡。
        - id: ch02-b10
          speaker: flounder
          text: >-
            回去吧。她已经站在门口了。
        - id: ch02-b11
          speaker: narrator
          text: >-
            回去的路上，渔夫还担心自己连房子都找不到。等他走近一看，眼前却立着一座宏伟的石头宫殿。妻子站在高高的台阶上，正要走进大门。她迎上来牵住渔夫的手，叫他跟自己一起进去看看。
        - id: ch02-b12
          speaker: narrator
          text: >-
            城堡里有一座宽大的大厅，脚下全是大理石地面。一大群仆人迎上来，替他们推开高高的大门。墙上挂满华丽的织锦，各处房间都摆着镀金的桌椅。水晶枝形吊灯从天花板上垂下来，每一间屋子还铺了漂亮的地毯。他们什么时候想吃饭，最好的食物和美酒就会送到面前。
        - id: ch02-b13
          speaker: narrator
          text: >-
            外面还有宽阔的庭院，马厩、牛棚和车房都造得很精美。花园里开满鲜花，果树结满果实。旁边那座园林足有一里格长，里面跑着雄鹿、獐子和野兔。凡是人能想到的东西，这里都有。
        - id: ch02-b14
          speaker: ilsebel
          text: >-
            现在怎么样？这里不是很美吗？
        - id: ch02-b15
          speaker: fisherman
          text: >-
            确实很美。我们就住在这座城堡里，快快活活地过日子吧。
        - id: ch02-b16
          speaker: ilsebel
          text: >-
            以后再说吧。
        - id: ch02-b17
          speaker: narrator
          text: >-
            说完，两人便上床睡了。

    - id: ch03
      title: 成为国王
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            第二天天刚亮，妻子先醒了。她从床上望出去，美丽的田野一直伸向远方。丈夫还睡着，她就用胳膊肘使劲顶他的腰。
        - id: ch03-b02
          speaker: ilsebel
          text: >-
            丈夫，起来看看窗外。我们为什么不能统治这整片土地？去找比目鱼，告诉它我们要当国王。
        - id: ch03-b03
          speaker: fisherman
          text: >-
            唉，妻子，我们为什么要当国王？我可不想当。
        - id: ch03-b04
          speaker: ilsebel
          text: >-
            你不想当，那就让我来。我一定要当国王。去找比目鱼。
        - id: ch03-b05
          speaker: fisherman
          text: >-
            唉，你为什么非当国王不可？这样的要求，我说不出口。
        - id: ch03-b06
          speaker: ilsebel
          text: >-
            为什么说不出口？马上去。我必须当国王。
        - id: ch03-b07
          speaker: narrator
          text: >-
            渔夫很恼火，妻子竟然还想当国王。一路上，他反复想着，这不对，这不对。他一步也不愿再走，却还是来到了海边。海水已经变成深灰色，不安地起伏着，一阵阵涌向岸边。
        - id: ch03-b08
          speaker: fisherman
          text: >-
            本是王子遭魔变，化作比目鱼游海间。快来吧，我妻伊尔泽贝尔，心中有愿我难开言。
        - id: ch03-b09
          speaker: flounder
          text: >-
            她现在又想要什么？
        - id: ch03-b10
          speaker: fisherman
          text: >-
            唉，她想当国王。
        - id: ch03-b11
          speaker: flounder
          text: >-
            回去吧。她已经是国王了。
        - id: ch03-b12
          speaker: narrator
          text: >-
            渔夫回到宫殿，发现它比原先又大了许多。高塔直插天空，外墙上满是精美的雕饰。一个卫兵守在大门前，旁边还有许多士兵，有的带着铜鼓，有的拿着号角。宫殿里面处处都是纯金和大理石，锦缎窗帘垂下一排金色的穗子。
        - id: ch03-b13
          speaker: narrator
          text: >-
            大厅的门猛地打开。满朝臣子都站在里面，围着渔夫的妻子。她坐在黄金和钻石砌成的高高宝座上，头戴一顶硕大的金冠，手里握着镶满宝石的金权杖。宝座两边各站着六名侍童，排成两列，每一个都比身旁的高出一头。渔夫穿过人群，走到她面前。
        - id: ch03-b14
          speaker: fisherman
          text: >-
            唉，妻子，你现在是国王了吗？
        - id: ch03-b15
          speaker: ilsebel
          text: >-
            是的。我现在是国王。
        - id: ch03-b16
          speaker: narrator
          text: >-
            渔夫站在那里看了好久。
        - id: ch03-b17
          speaker: fisherman
          text: >-
            妻子，你已经当上国王，这下该满足了吧！我们再也没有什么可求的了。
        - id: ch03-b18
          speaker: ilsebel
          text: >-
            不，丈夫。我的愿望没有尽头，我已经压不住了。去找比目鱼。我是国王了，现在还得当皇帝。
        - id: ch03-b19
          speaker: fisherman
          text: >-
            唉，你为什么又想当皇帝？
        - id: ch03-b20
          speaker: ilsebel
          text: >-
            丈夫，去找比目鱼。我要当皇帝。
        - id: ch03-b21
          speaker: fisherman
          text: >-
            它不能让你当皇帝，我也不愿开这个口。一个国家只有一位皇帝。它真的办不到。
        - id: ch03-b22
          speaker: ilsebel
          text: >-
            什么？我是国王，你是我的丈夫。你到底去不去？快去！它能让人当国王，就能让人当皇帝。我非当皇帝不可！
          emotion: angry

    - id: ch04
      title: 登上皇位
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            渔夫不得不走。可他越走越害怕，心里想，当皇帝这样的野心实在太大了，这绝不是什么好事。妻子的要求一次比一次高，比目鱼迟早也会厌烦。
        - id: ch04-b02
          speaker: narrator
          text: >-
            海水已经变得又黑又稠。巨浪高高冲上沙滩，泡沫四处乱飞，风呼呼地刮着，一切都显得阴森可怕。渔夫吓得浑身发冷。
        - id: ch04-b03
          speaker: fisherman
          text: >-
            本是王子遭魔变，化作比目鱼游海间。快来吧，我妻伊尔泽贝尔，心中有愿我难开言。
        - id: ch04-b04
          speaker: flounder
          text: >-
            她现在又想要什么？
        - id: ch04-b05
          speaker: fisherman
          text: >-
            唉，比目鱼，我妻子想当皇帝。
        - id: ch04-b06
          speaker: flounder
          text: >-
            回去吧。她已经是皇帝了。
        - id: ch04-b07
          speaker: narrator
          text: >-
            渔夫回到家，看见整座城堡都是磨得光亮的大理石，上面装饰着雪花石膏雕像和黄金。士兵在大门前整齐地列队行进，一边吹响号角，一边擂起鼓来。宫殿里，男爵、伯爵和公爵都成了服侍人的仆从，来来往往地忙碌着。他们替渔夫打开了一扇捶打成形的金门。
        - id: ch04-b08
          speaker: narrator
          text: >-
            妻子坐在一整块黄金造出的宝座上，那宝座足有六肘高。她头上的金冠足有三码高，镶满钻石和闪闪发光的宝石。她一只手握着权杖，另一只手托着帝国宝球。宝座两边各站着一列手持长戟的卫士，一个比一个矮。从七英尺高的巨人，一直排到只有渔夫小指头那么高的小矮人。许多亲王和公爵都站在她面前。渔夫不敢高声说话，只悄悄走上前去。
        - id: ch04-b09
          speaker: fisherman
          text: >-
            妻子，你现在是皇帝了吗？
        - id: ch04-b10
          speaker: ilsebel
          text: >-
            是的，我是皇帝了。
        - id: ch04-b11
          speaker: narrator
          text: >-
            渔夫望着她那一身威仪，看了好一会儿。
        - id: ch04-b12
          speaker: fisherman
          text: >-
            唉，妻子，你都当上皇帝了，这回该满足了吧。
        - id: ch04-b13
          speaker: ilsebel
          text: >-
            丈夫，你站在那里做什么？我已经是皇帝，现在还要当教皇。去找比目鱼。
        - id: ch04-b14
          speaker: fisherman
          text: >-
            唉，妻子，你还想要什么？你不能当教皇。整个基督教世界只有一位教皇，比目鱼没法让你当教皇。
        - id: ch04-b15
          speaker: ilsebel
          text: >-
            丈夫，我要当教皇。快去，我今天就得当上。
        - id: ch04-b16
          speaker: fisherman
          text: >-
            不行，我不能这样求它。这件事不对，也太过分了。比目鱼做不到。
        - id: ch04-b17
          speaker: ilsebel
          text: >-
            你说的什么蠢话！它能让我当皇帝，也能让我当教皇。马上去！我是皇帝，你是我的丈夫。你到底走不走？
          emotion: angry

    - id: ch05
      title: 三重金冠
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            渔夫害怕了，只好出门。他浑身发软，不停地哆嗦，两条腿直打战，膝盖几乎撑不住身体。狂风猛烈地扫过大地，乌云飞快掠过天空，四下阴沉得像黑夜已经降临。树叶一片片被卷下枝头，海水翻着泡沫，像沸腾一样不断撞向岸边。远处的船只遇上了险情，在浪尖上颠簸摇摆。天空正中还是深蓝色，两边却露出暴风雨般愤怒的红光。
        - id: ch05-b02
          speaker: narrator
          text: >-
            渔夫忧惧得浑身发抖，又站在岸边呼唤。
        - id: ch05-b03
          speaker: fisherman
          text: >-
            本是王子遭魔变，化作比目鱼游海间。快来吧，我妻伊尔泽贝尔，心中有愿我难开言。
        - id: ch05-b04
          speaker: flounder
          text: >-
            那么，她现在又想要什么？
        - id: ch05-b05
          speaker: fisherman
          text: >-
            唉，她想当教皇。
        - id: ch05-b06
          speaker: flounder
          text: >-
            回去吧。她已经是教皇了。
        - id: ch05-b07
          speaker: narrator
          text: >-
            渔夫回去一看，眼前好像立着一座大教堂，四周围满了宫殿。他挤过人群走进去。里面点着成千上万支蜡烛，亮得耀眼。妻子身穿金线织成的长袍，坐在比从前高得多的宝座上，头顶戴着三重硕大的金冠。
        - id: ch05-b08
          speaker: narrator
          text: >-
            无数教会显贵围绕着她。两边各排着一列大蜡烛，最大的像教堂尖塔那么高，最小的只有圣诞树上的小蜡烛那么大。所有皇帝和国王都跪在她面前，亲吻她的脚。
        - id: ch05-b09
          speaker: fisherman
          text: >-
            妻子，你现在是教皇了吗？
        - id: ch05-b10
          speaker: ilsebel
          text: >-
            是的，我是教皇。
        - id: ch05-b11
          speaker: narrator
          text: >-
            渔夫盯着她，像在直视灿烂的太阳。看了好半天，他才开口。
        - id: ch05-b12
          speaker: fisherman
          text: >-
            唉，妻子，你已经当上教皇，这下总该满足了吧。
        - id: ch05-b13
          speaker: narrator
          text: >-
            妻子坐得像一棵树那么笔直，一动不动，连腰也不肯稍稍弯一下。
        - id: ch05-b14
          speaker: fisherman
          text: >-
            妻子，你已经是教皇了，就知足吧。你再也不可能变成别的什么了。
        - id: ch05-b15
          speaker: ilsebel
          text: >-
            那可得再看看。
        - id: ch05-b16
          speaker: narrator
          text: >-
            两人上床以后，妻子还是不满足。贪欲搅得她无法入睡，她不停地想，自己究竟还能变成什么。渔夫这一天来回奔波，做了太多事情，早已累坏，很快就睡得又香又沉。妻子却一夜都没合眼，只顾在床上翻来覆去，想了又想，直到实在想不出还能变成什么。
        - id: ch05-b17
          speaker: narrator
          text: >-
            天终于快亮了，太阳开始升起。妻子看见窗外泛起红色的晨曦，便走到床尾，站在那里望着太阳一点点升上天空。看着看着，她忽然想到，难道自己不能叫太阳和人都听她号令，想升起时才升起吗？

    - id: ch06
      title: 最后的愿望
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            她用胳膊肘捅着丈夫的肋骨。
        - id: ch06-b02
          speaker: ilsebel
          text: >-
            丈夫，醒醒。去找比目鱼，我要成为神。
        - id: ch06-b03
          speaker: narrator
          text: >-
            渔夫还睡得迷迷糊糊，听见这话，却吓得一下子从床上掉了下来。他不敢相信自己的耳朵，以为刚才听错了，连忙睁大眼睛望着妻子，又问了一遍。
        - id: ch06-b04
          speaker: fisherman
          text: >-
            妻子，你刚才说什么？
        - id: ch06-b05
          speaker: ilsebel
          text: >-
            丈夫，如果我出现时，不能叫太阳和人照我的命令升起，我就永远无法安宁。除非我能让太阳和人升起，否则我一刻也安静不了。
        - id: ch06-b06
          speaker: narrator
          text: >-
            渔夫惊恐地望着她，浑身打了个寒战。
        - id: ch06-b07
          speaker: ilsebel
          text: >-
            马上去。我要成为神。
        - id: ch06-b08
          speaker: narrator
          text: >-
            渔夫跪倒在妻子面前，苦苦哀求。
        - id: ch06-b09
          speaker: fisherman
          text: >-
            唉，妻子，比目鱼办不到这件事。它能让你当皇帝，也能让你当教皇。求求你知足吧，就做教皇吧。
          emotion: fearful
        - id: ch06-b10
          speaker: narrator
          text: >-
            妻子顿时大发雷霆。她披头散发，一脚把渔夫推开，尖声叫起来。
        - id: ch06-b11
          speaker: ilsebel
          text: >-
            我不满足，永远也不会满足！你到底去不去？
          emotion: angry
        - id: ch06-b12
          speaker: narrator
          text: >-
            渔夫用最快的速度穿好衣服，发疯似的跑了出去。外面的风暴猛烈得让他几乎站不住脚。房屋和树木一座座被风吹倒，群山也在震颤，碎裂的岩石不断滚进大海。天空黑得像墨，雷声轰鸣，闪电一道接着一道。海浪像教堂尖塔和山岳那么高，每一道浪峰都顶着雪白的泡沫。
        - id: ch06-b13
          speaker: narrator
          text: >-
            渔夫扯开嗓子呼喊，可风暴太响，他连自己的声音也听不见。
        - id: ch06-b14
          speaker: fisherman
          text: >-
            本是王子遭魔变，化作比目鱼游海间。快来吧，我妻伊尔泽贝尔，心中有愿我难开言。
        - id: ch06-b15
          speaker: flounder
          text: >-
            那么，她现在又想要什么？
        - id: ch06-b16
          speaker: fisherman
          text: >-
            唉，她想成为神。
        - id: ch06-b17
          speaker: flounder
          text: >-
            回去吧。她又坐在茅屋里了。
        - id: ch06-b18
          speaker: narrator
          text: >-
            从那以后，他们一直坐在那里，直到今天。
