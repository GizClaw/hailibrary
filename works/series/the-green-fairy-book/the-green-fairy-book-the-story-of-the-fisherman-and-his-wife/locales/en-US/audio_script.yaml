audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and attentive fairy-tale storytelling
        timbre: clear and gently resonant
        pace: measured
        pitch: medium
    fisherman:
      display_name: The Fisherman
      tts:
        delivery: gentle, hesitant, and plainspoken
        timbre: soft and weathered
        pace: unhurried
        pitch: medium-low
    ilsebel:
      display_name: Ilsebel
      tts:
        delivery: demanding, restless, and increasingly imperious
        timbre: firm and clear
        pace: brisk
        pitch: medium
    flounder:
      display_name: The Flounder
      tts:
        delivery: steady, spare, and quietly mysterious
        timbre: smooth and resonant
        pace: measured
        pitch: low
  chapters:
    - id: ch01
      title: The Enchanted Flounder
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a fisherman who lived with his wife in a little hut beside the sea. Every day he went down to fish, and he would fish and fish. He sat there with his rod, gazing into the bright water. Then he would go on gazing and gazing for hours.
        - id: ch01-b02
          speaker: narrator
          text: One day, his line was pulled far beneath the surface. When he hauled it in, a large flounder came up on the hook.
        - id: ch01-b03
          speaker: flounder
          text: Listen, fisherman, please let me go. I am not truly a flounder. I am an enchanted prince. There is no use killing me, for I would not taste good. Put me back and let me swim away.
        - id: ch01-b04
          speaker: fisherman
          text: There is no need to make such a fuss. Of course I will let a talking flounder go free.
        - id: ch01-b05
          speaker: narrator
          text: With that, he put the fish back into the shining water and watched him swim away. The flounder sank all the way to the bottom, leaving a long trail of blood behind him through the clear water. Then the fisherman rose from his place beside the sea and went home to his wife in their little hut.
        - id: ch01-b06
          speaker: ilsebel
          text: Husband, did you catch nothing today?
        - id: ch01-b07
          speaker: fisherman
          text: No. I caught a flounder who told me he was an enchanted prince, so I let him swim away.
        - id: ch01-b08
          speaker: ilsebel
          text: And you did not ask him for anything?
        - id: ch01-b09
          speaker: fisherman
          text: No. What would I have asked for?
        - id: ch01-b10
          speaker: ilsebel
          text: Oh, it is dreadful to spend our whole lives in this tiny, dirty hut. You should have asked for a cottage. Go back and call him. Tell him we want a cottage. He is certain to give us one.
        - id: ch01-b11
          speaker: fisherman
          text: Oh, why should I go down there again?
        - id: ch01-b12
          speaker: ilsebel
          text: Because you caught him and then set him free. Of course he will grant your request. Now hurry down there.
        - id: ch01-b13
          speaker: narrator
          text: The fisherman did not want to go at all. But his wife would not be persuaded, so he returned to the sea. The water was green and yellow now, and it no longer shone.
        - id: ch01-b14
          speaker: fisherman
          text: Once a prince, but changed you be, into a flounder in the sea. Come, for my wife Ilsebel wishes what I dare not tell.
        - id: ch01-b15
          speaker: narrator
          text: The flounder swam up to him.
        - id: ch01-b16
          speaker: flounder
          text: Well, what does she want?
        - id: ch01-b17
          speaker: fisherman
          text: Oh dear. My wife says I should have asked you for something. She no longer wants to live in our hut. She would like a cottage.
        - id: ch01-b18
          speaker: flounder
          text: Go home. She has it already.
        - id: ch01-b19
          speaker: narrator
          text: When the fisherman returned, the hut was gone. In its place stood a beautiful cottage, with his wife sitting on a bench by the door. She took his hand and led him inside.
        - id: ch01-b20
          speaker: ilsebel
          text: Come and see. Is this not much better?
        - id: ch01-b21
          speaker: narrator
          text: The cottage had a tiny hall, a lovely sitting room, a bedroom with a bed, and a kitchen and dining room. Every room was furnished with the best of everything. The kitchen held every kind of tin and copper utensil they could need. Outside stood a little yard where chickens and ducks wandered, and beside it was a garden filled with vegetables and fruit trees.
        - id: ch01-b22
          speaker: ilsebel
          text: Look at it all. Is this not nice?
        - id: ch01-b23
          speaker: fisherman
          text: Yes. We can stay here and live very happily.
        - id: ch01-b24
          speaker: ilsebel
          text: We shall see about that.
        - id: ch01-b25
          speaker: narrator
          text: Then they ate their supper and went to bed.
    - id: ch02
      title: The Stone Castle
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: For a week or two, all went well. Then Ilsebel began to complain again.
        - id: ch02-b02
          speaker: ilsebel
          text: Listen, husband. This cottage is much too small, and so are the yard and garden. The flounder could just as easily have given us a larger house. I want to live in a great stone castle. Go and tell him to send us one.
        - id: ch02-b03
          speaker: fisherman
          text: Oh, wife, this cottage is good enough. Why should we choose to live in a castle?
        - id: ch02-b04
          speaker: ilsebel
          text: Why not? Go down there. The flounder can easily do it.
        - id: ch02-b05
          speaker: fisherman
          text: No, wife. He has already given us the cottage. I do not want to ask him again. He may take it badly.
        - id: ch02-b06
          speaker: ilsebel
          text: Go. He can certainly give us a castle, and he ought to be glad to do it. Go at once.
        - id: ch02-b07
          speaker: narrator
          text: The fisherman's heart grew heavy. He did not want to go, and he told himself that this was not right. Still, he went back to the shore.
        - id: ch02-b08
          speaker: narrator
          text: The sea was violet and dark blue. It looked dull and thick instead of green and yellow, though its surface was still smooth.
        - id: ch02-b09
          speaker: fisherman
          text: Once a prince, but changed you be, into a flounder in the sea. Come, for my wife Ilsebel wishes what I dare not tell.
        - id: ch02-b10
          speaker: flounder
          text: What does she want now?
        - id: ch02-b11
          speaker: fisherman
          text: She wants to live in a great stone castle.
        - id: ch02-b12
          speaker: flounder
          text: Go home. She is standing at the door.
        - id: ch02-b13
          speaker: narrator
          text: The fisherman went home, expecting to find no house at all. But a great stone palace stood there, and his wife waited on the steps. She took his hand and brought him inside.
        - id: ch02-b14
          speaker: ilsebel
          text: Come in.
        - id: ch02-b15
          speaker: narrator
          text: The castle had a vast hall with a marble floor. Crowds of servants hurried forward and threw open the tall doors. Beautiful tapestries covered the walls. In the rooms stood gilded chairs and tables, and crystal chandeliers hung from the ceilings. Fine carpets covered every floor. Whenever the fisherman and his wife wished to dine, the finest food and drink were set before them.
        - id: ch02-b16
          speaker: narrator
          text: Outside was a wide courtyard. Around it stood stables for horses and cows, along with a coach house, and every one of those buildings was as fine as the palace. Beyond them lay a splendid garden filled with the most beautiful flowers and fruit. Then came a park a full league long, where deer, roe, and hares wandered. It seemed to contain everything anyone could wish for.
        - id: ch02-b17
          speaker: ilsebel
          text: Well, is this not beautiful?
        - id: ch02-b18
          speaker: fisherman
          text: Yes, it truly is. Now we can remain in this beautiful castle and be happy.
        - id: ch02-b19
          speaker: ilsebel
          text: We shall consider that.
        - id: ch02-b20
          speaker: narrator
          text: Then they went to bed.
    - id: ch03
      title: Ilsebel Becomes King
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: At daybreak the next morning, Ilsebel woke first and looked from the bed across the beautiful country. Her husband was still asleep, so she drove her elbows into his side.
        - id: ch03-b02
          speaker: ilsebel
          text: Husband, get up and look out the window. Could we not become king over all this land? Go to the flounder and tell him we choose to be king.
        - id: ch03-b03
          speaker: fisherman
          text: Oh, wife, why should we be king? I do not want to be king.
        - id: ch03-b04
          speaker: ilsebel
          text: If you do not want to be king, then I will be king. Go down to the flounder. I will be king.
        - id: ch03-b05
          speaker: fisherman
          text: Oh, wife, why do you want that? I cannot ask him for such a thing.
        - id: ch03-b06
          speaker: ilsebel
          text: Why can you not? Go this instant. I must be king.
        - id: ch03-b07
          speaker: narrator
          text: The fisherman went, though the wish made him very uneasy. Again and again, he thought that it was not right. He did not want to go, but he went all the same.
        - id: ch03-b08
          speaker: narrator
          text: The sea had turned dark gray, and the water heaved against the shore.
        - id: ch03-b09
          speaker: fisherman
          text: Once a prince, but changed you be, into a flounder in the sea. Come, for my wife Ilsebel wishes what I dare not tell.
        - id: ch03-b10
          speaker: flounder
          text: What does she want now?
        - id: ch03-b11
          speaker: fisherman
          text: She wants to be king.
        - id: ch03-b12
          speaker: flounder
          text: Go home. She is king already.
        - id: ch03-b13
          speaker: narrator
          text: When the fisherman came near the palace, he saw that it had grown much larger than before. Great towers rose above it, and splendid ornamental carvings covered the stone. A sentinel stood watch before the gate. Behind him were great numbers of soldiers with kettledrums and trumpets, ready in ordered ranks.
        - id: ch03-b14
          speaker: narrator
          text: Inside, everything was made of pure marble and gold. Damask curtains hung at the windows with tassels of gold. The great doors of the hall flew open, and the whole court stood gathered around Ilsebel. She sat high above them on a throne of gold and diamonds. A great golden crown rested on her head, and in her hand she held a golden scepter set with precious stones. Six pages stood in a row on either side of her, and each page was a full head taller than the one before.
        - id: ch03-b15
          speaker: fisherman
          text: Oh, wife, are you king now?
        - id: ch03-b16
          speaker: ilsebel
          text: Yes. Now I am king.
        - id: ch03-b17
          speaker: narrator
          text: He stood and looked at her for a long while.
        - id: ch03-b18
          speaker: fisherman
          text: Let this be enough, wife. Now that you are king, there is nothing more for us to wish for.
        - id: ch03-b19
          speaker: ilsebel
          text: No, husband. My wishes have no end, and I cannot hold them back any longer. Go to the flounder. I am king now, but next I must be emperor.
    - id: ch04
      title: Ilsebel Becomes Emperor
      blocks:
        - id: ch04-b01
          speaker: fisherman
          text: Oh, wife, why do you want to be emperor?
        - id: ch04-b02
          speaker: ilsebel
          text: Husband, go to the flounder. I will be emperor.
        - id: ch04-b03
          speaker: fisherman
          text: He cannot make you emperor. I do not want to ask it of him. There is only one emperor in the kingdom. Truly, he cannot do this.
        - id: ch04-b04
          speaker: ilsebel
          text: What? I am king, and you are my husband. Go at once. If he can make a king, he can make an emperor. I must and will be emperor. Go!
          emotion: angry
        - id: ch04-b05
          speaker: narrator
          text: The fisherman had to obey. As he walked, fear came over him. He thought this could not be right. Becoming emperor was far too ambitious, and surely the flounder would grow tired of it at last.
        - id: ch04-b06
          speaker: narrator
          text: By the time he reached the shore, the sea was black and thick. Heavy water broke high upon the beach. Foam flew through the air, and the wind blew hard across the land. Everything before him looked cold and bleak, and the fisherman stood there chilled with fear.
        - id: ch04-b07
          speaker: fisherman
          text: Once a prince, but changed you be, into a flounder in the sea. Come, for my wife Ilsebel wishes what I dare not tell.
        - id: ch04-b08
          speaker: flounder
          text: What does she want now?
        - id: ch04-b09
          speaker: fisherman
          text: Oh, flounder, my wife wants to be emperor.
        - id: ch04-b10
          speaker: flounder
          text: Go home. She is emperor already.
        - id: ch04-b11
          speaker: narrator
          text: When the fisherman returned, he found that the entire castle was made of polished marble. Alabaster statues and ornaments of gold covered it. Soldiers marched before the gate, blowing their trumpets and beating their drums. Inside the palace, barons, counts, and dukes walked about as servants. When he approached, they opened a door made of beaten gold.
        - id: ch04-b12
          speaker: narrator
          text: Ilsebel sat on a throne carved from one solid block of gold, and it rose six cubits high. Her great golden crown stood three yards tall and glittered with diamonds and sparkling gems. She held a scepter in one hand and the imperial globe in the other. On either side stood a row of halberdiers, each man smaller than the last. The line began with a giant seven feet tall and ended with a tiny dwarf no higher than a little finger. Many princes and dukes waited before her throne.
        - id: ch04-b13
          speaker: narrator
          text: The fisherman approached her quietly.
        - id: ch04-b14
          speaker: fisherman
          text: Wife, are you emperor now?
        - id: ch04-b15
          speaker: ilsebel
          text: Yes. I am emperor.
        - id: ch04-b16
          speaker: narrator
          text: He gazed at all her magnificence for some time.
        - id: ch04-b17
          speaker: fisherman
          text: Oh, wife, let this be enough now that you are emperor.
        - id: ch04-b18
          speaker: ilsebel
          text: Husband, why are you just standing there? I am emperor now, and I want to be pope as well. Go back to the flounder.
    - id: ch05
      title: Ilsebel Becomes Pope
      blocks:
        - id: ch05-b01
          speaker: fisherman
          text: Oh, wife, what more could you want? You cannot be pope. There is only one pope in all Christendom, and the flounder cannot make you another.
        - id: ch05-b02
          speaker: ilsebel
          text: Husband, I will be pope. Hurry down there. I must become pope today.
        - id: ch05-b03
          speaker: fisherman
          text: No, wife. I cannot ask him for that. It is wrong, and it is too much. The flounder cannot make you pope.
        - id: ch05-b04
          speaker: ilsebel
          text: What nonsense! If he can make an emperor, he can make a pope. Go this instant. I am emperor, and you are my husband. Will you leave at once?
          emotion: angry
        - id: ch05-b05
          speaker: narrator
          text: The fisherman was frightened, so he went. He felt faint. His whole body shook, and his knees nearly gave way beneath him.
        - id: ch05-b06
          speaker: narrator
          text: A fierce wind swept over the land. Clouds raced across the sky and made it as gloomy as night. Leaves tore away from the trees. The sea foamed and seethed and dashed against the shore. Far in the distance, the fisherman could see ships in great distress, dancing and tossing on the waves. Only the middle of the sky remained blue. Along both sides, it burned an angry red, like the edge of a great storm.
        - id: ch05-b07
          speaker: narrator
          text: The fisherman stood there, trembling with dread.
        - id: ch05-b08
          speaker: fisherman
          text: Once a prince, but changed you be, into a flounder in the sea. Come, for my wife Ilsebel wishes what I dare not tell.
        - id: ch05-b09
          speaker: flounder
          text: Well, what does she want now?
        - id: ch05-b10
          speaker: fisherman
          text: She wants to be pope.
        - id: ch05-b11
          speaker: flounder
          text: Go home, then. She is pope already.
        - id: ch05-b12
          speaker: narrator
          text: The fisherman went home and found what looked like a vast church surrounded on every side by palaces. A great crowd had gathered there, and he had to push his way through all those people before he could enter. Inside, thousands upon thousands of burning candles filled the enormous church with light.
        - id: ch05-b13
          speaker: narrator
          text: Ilsebel sat on a throne far higher than any she had occupied before. She was dressed in cloth of gold and wore three great golden crowns. A host of church dignitaries surrounded her. Two long rows of candles stood on either side. The largest were as tall as a church steeple, while the smallest were no bigger than a candle on a Christmas tree. All the emperors and kings knelt before Ilsebel and kissed her foot.
        - id: ch05-b14
          speaker: fisherman
          text: Wife, are you pope now?
        - id: ch05-b15
          speaker: ilsebel
          text: Yes. I am pope.
        - id: ch05-b16
          speaker: narrator
          text: He stared at her as though he were looking into the bright sun. After a while, he spoke.
        - id: ch05-b17
          speaker: fisherman
          text: Oh, wife, let this be enough now that you are pope.
        - id: ch05-b18
          speaker: narrator
          text: But she sat as straight as a tree. She did not move or bend at all.
        - id: ch05-b19
          speaker: fisherman
          text: Wife, be content now that you are pope. There is nothing more you can become.
        - id: ch05-b20
          speaker: ilsebel
          text: We shall see about that.
        - id: ch05-b21
          speaker: narrator
          text: Then they went to bed.
    - id: ch06
      title: The Last Wish
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Ilsebel was still not content. Her greed would not let her sleep. All night she turned from one side to the other, thinking and thinking about what else she might become. The fisherman slept well and soundly, for he had done a great deal that day. But his wife never rested. She searched for one more thing to desire, and went on thinking until she could think no more.
        - id: ch06-b02
          speaker: narrator
          text: At last the sun began to rise. Ilsebel saw the red dawn, moved to the end of the bed, and watched through the window. Then a new thought came to her. Could she not make the sun rise? Could she not make mankind rise as well?
        - id: ch06-b03
          speaker: narrator
          text: She jabbed her elbows into her husband's ribs.
        - id: ch06-b04
          speaker: ilsebel
          text: Husband, wake up. Go to the flounder. I will be a god.
        - id: ch06-b05
          speaker: narrator
          text: The fisherman was still half asleep, but the words frightened him so badly that he fell out of bed. He wondered if he had heard correctly and stared at her with wide eyes.
        - id: ch06-b06
          speaker: fisherman
          text: What did you say, wife?
        - id: ch06-b07
          speaker: ilsebel
          text: If I cannot make the sun and mankind rise when I appear, I will never rest. I shall not have one quiet moment until I can make them rise.
        - id: ch06-b08
          speaker: narrator
          text: The fisherman looked at her in horror, and a shudder passed through him.
        - id: ch06-b09
          speaker: ilsebel
          text: Go at once. I will be a god.
        - id: ch06-b10
          speaker: narrator
          text: The fisherman fell to his knees before her.
        - id: ch06-b11
          speaker: fisherman
          text: Oh, wife, the flounder cannot do that. He can make you emperor and pope, but not a god. I beg you, be content and remain pope.
          emotion: fearful
        - id: ch06-b12
          speaker: narrator
          text: Ilsebel flew into a rage. Her hair hung wildly around her face, and she shoved him with her foot.
        - id: ch06-b13
          speaker: ilsebel
          text: I am not content, and I will not be content! Are you going or not?
          emotion: angry
        - id: ch06-b14
          speaker: narrator
          text: He threw on his clothes as fast as he could and ran away like a madman.
        - id: ch06-b15
          speaker: narrator
          text: The storm raged so fiercely that the fisherman could hardly stay on his feet as he struggled toward the shore. Houses and trees were blown down around him. The mountains themselves shook, and great pieces of rock broke loose, tumbled downward, and rolled into the sea. The whole sky was black as ink. Thunder crashed above him, and lightning split the darkness. The sea tossed up waves as high as church towers and mountains, and every towering wave wore a white crest of foam.
        - id: ch06-b16
          speaker: narrator
          text: The fisherman shouted, though even he could not hear his own voice.
        - id: ch06-b17
          speaker: fisherman
          text: Once a prince, but changed you be, into a flounder in the sea. Come, for my wife Ilsebel wishes what I dare not tell.
        - id: ch06-b18
          speaker: flounder
          text: Well, what does she want now?
        - id: ch06-b19
          speaker: fisherman
          text: She wants to be a god.
        - id: ch06-b20
          speaker: flounder
          text: Go home, then. She is sitting in the hut again.
        - id: ch06-b21
          speaker: narrator
          text: And there they are sitting to this day.
