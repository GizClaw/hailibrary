cover_prompt: |-
  A wordless cover gathers woodland and enchanted-object motifs from The Green Fairy Book in a bright old European forest. Three faithful dogs guard a young traveler, a fisherman and his wife stand near a humble seaside cottage, a tiny prince peers from an iron stove, and three musicians cross a mossy bridge. At the center, the traveler raises an emerald leaf that opens into a path of glowing green birds leading toward a castle. The unfolding path is the focal action, while smaller tale motifs remain clearly separated in surrounding clearings. Use a gently elevated stage-like view with layered foliage, river, and distant towers, leaving generous pale sky above the treetops. Keep all designs original, child-friendly, and rooted in preindustrial folk-tale settings rather than later illustrations or films. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
