audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and attentive fairy-tale storytelling
        timbre: clear and gently resonant
        pace: measured
        pitch: medium
    jorinde:
      display_name: Jorinde
      tts:
        delivery: gentle, tender, and clear
        timbre: bright and lyrical
        pace: natural
        pitch: medium-high
    joringel:
      display_name: Joringel
      tts:
        delivery: earnest, warm, and resolute
        timbre: clear and youthful
        pace: measured
        pitch: medium
    enchantress:
      display_name: Enchantress
      tts:
        delivery: harsh, secretive, and commanding
        timbre: dry and rasping
        pace: deliberate
        pitch: low
  chapters:
    - id: ch01
      title: The Castle in the Wood
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, an old woman lived alone in a castle deep inside a thick wood. She was an enchantress. By day, she could turn herself into a cat or a night owl. Each evening, she took the shape of an ordinary woman again.
        - id: ch01-b02
          speaker: narrator
          text: She could lure animals and birds to her. Then she killed them and cooked them. Any young man who came within a hundred paces of her castle had to stop where he stood. He could not move again unless she chose to free him.
        - id: ch01-b03
          speaker: narrator
          text: But if a pretty girl crossed that boundary, the enchantress changed her into a bird. She shut the bird in a wicker cage and carried it into one of the castle rooms. Nearly seven thousand cages stood there, each holding a rare bird.
    - id: ch02
      title: Too Near the Castle
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Not far away lived a maiden named Jorinde. She was more beautiful than any other maiden. She was betrothed to Joringel, a young man as handsome as she was beautiful. Nothing made them happier than being together.
        - id: ch02-b02
          speaker: narrator
          text: One evening, they went walking in the wood so they could talk for a long while.
        - id: ch02-b03
          speaker: joringel
          text: We must be careful not to go too near the castle.
        - id: ch02-b04
          speaker: narrator
          text: It was a lovely evening. Bright sunlight reached between the tree trunks and through the dark green leaves. On the old may bushes, a turtle dove sang in a clear voice.
        - id: ch02-b05
          speaker: narrator
          text: From time to time, Jorinde wept. She sat down in the sunlight and mourned, and Joringel mourned beside her. They felt as sorrowful as though they had been sentenced to die. When they looked around, nothing seemed familiar. They could no longer remember the way home.
        - id: ch02-b06
          speaker: narrator
          text: The sun was sinking behind the mountain, with half of it still showing. Joringel peered through the trees. The old castle wall stood close beside them. Terror seized him, and he nearly fainted with fright.
        - id: ch02-b07
          speaker: jorinde
          text: My little bird with throat so red sings sorrow, sorrow, sorrow. He sings to the little dove that's dead. He sings sorrow, sor—jug, jug, jug.
          emotion: sad
    - id: ch03
      title: The Nightingale
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Joringel turned toward Jorinde. She had become a nightingale, and now the bird was singing, "Jug, jug." A night owl with glowing eyes circled her three times. Three times it screeched, "Tu-whit, tu-whit, tu-whoo."
        - id: ch03-b02
          speaker: narrator
          text: Joringel could not stir. He stood as still as stone. He could not cry or speak, and he could not move a hand or a foot.
        - id: ch03-b03
          speaker: narrator
          text: The sun went down. The owl flew into a bush, and at once an old, bent woman stepped out. She was thin, with yellow skin, great red eyes, and a hooked nose that almost touched her chin. Muttering under her breath, she caught the nightingale and carried her away in one hand.
        - id: ch03-b04
          speaker: narrator
          text: Joringel still could not speak or move. Jorinde was gone. At last, the old woman returned.
        - id: ch03-b05
          speaker: enchantress
          text: Good evening, Zachiel. When the young moon shines in the basket, you will be freed early, Zachiel.
        - id: ch03-b06
          speaker: narrator
          text: At those words, Joringel was free. He dropped to his knees and begged the enchantress to give Jorinde back to him.
        - id: ch03-b07
          speaker: enchantress
          text: You will never have her again.
        - id: ch03-b08
          speaker: narrator
          text: Then the old woman walked away. Joringel called after her. He wept and grieved, but nothing helped.
        - id: ch03-b09
          speaker: joringel
          text: What will become of me?
          emotion: sad
    - id: ch04
      title: The Blood-Red Flower
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Joringel left the wood and eventually reached a village he did not know. There he tended sheep for a long time. He often walked around the castle, but he never went too close.
        - id: ch04-b02
          speaker: narrator
          text: Then one night, he had a dream. He found a blood-red flower with a great, beautiful pearl at its center. In the dream, he picked the flower and carried it to the castle. Everything he touched with it was released from the enchantment. With that flower, he won Jorinde back.
        - id: ch04-b03
          speaker: narrator
          text: When Joringel woke the next morning, he began searching for such a flower. He looked across mountains and through valleys. Eight days passed. Early on the ninth morning, he found it at last.
        - id: ch04-b04
          speaker: narrator
          text: The flower was blood red. At its center rested a large drop of dew, as lovely and round as a pearl. Holding the flower, Joringel traveled day and night until he came to the castle.
        - id: ch04-b05
          speaker: narrator
          text: He crossed the boundary a hundred paces from the walls, and this time he could still move. He walked all the way to the gate. His heart lifted when he knew the flower had worked. He touched the great gate with it, and the gate sprang open.
    - id: ch05
      title: Jorinde Set Free
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Joringel entered and crossed the courtyard. Then he stopped and listened for birdsong. At last, he heard it. He followed the sound into a great hall. There stood the enchantress, surrounded by seven thousand birds in wicker cages.
        - id: ch05-b02
          speaker: narrator
          text: The moment she saw Joringel, the old woman flew into a rage. She spat bitter, poisonous words at him, but she could not take one step toward him.
        - id: ch05-b03
          speaker: narrator
          text: Joringel paid no attention to her. He moved from cage to cage, looking closely at every bird. But hundreds of them were nightingales. How could he tell which one was Jorinde?
        - id: ch05-b04
          speaker: narrator
          text: While he wondered what to do, he noticed the enchantress secretly lift one cage and carry it toward the door. Joringel sprang after her. He touched the cage with the flower, and then he touched the old woman too.
        - id: ch05-b05
          speaker: narrator
          text: Her power was broken. She could cast no more spells. There was Jorinde, standing before Joringel with her arms around his neck, more beautiful than ever.
        - id: ch05-b06
          speaker: narrator
          text: Joringel changed all the other birds back into maidens. Then he and Jorinde went home together.
        - id: ch05-b07
          speaker: narrator
          text: And they lived a long and happy life.
