audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，像编书人面对孩子娓娓而谈，幽默处轻巧含笑
        timbre: 温暖清朗
        pace: 舒缓而有自然起伏
        pitch: 中音
    jorinde:
      display_name: 约琳德
      tts:
        delivery: 温柔清亮，忧伤时声音轻颤，歌唱时带着幽远的哀愁
        timbre: 清澈柔美
        pace: 适中偏缓
        pitch: 中高音
    joringel:
      display_name: 约林格尔
      tts:
        delivery: 真挚勇敢，警觉时低声提醒，悲痛中仍有坚韧
        timbre: 明朗温厚
        pace: 适中
        pitch: 中低音
    enchantress:
      display_name: 老女巫
      tts:
        delivery: 阴沉粗厉，念咒时神秘冷硬，发怒时恶毒逼人
        timbre: 沙哑干涩
        pace: 缓慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 森林里的城堡
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，一片密林中央立着一座城堡。一个老妇人独自住在里面，可她并不是普通人，而是个女巫。白天，她会变成猫或猫头鹰，直到傍晚才变回老妇人的模样。
        - id: ch01-b02
          speaker: narrator
          text: >-
            她能引来走兽和飞鸟，捉住以后杀掉煮来吃。年轻男子只要走进城堡周围一百步，就会僵在原地，非等女巫放行才能离开。漂亮姑娘一踏进这个圈子，便会被变成鸟儿，关进柳条笼。这样的笼子，城堡里足足有七千只，关着的全是珍奇的鸟。
        - id: ch01-b03
          speaker: narrator
          text: >-
            那时，有一对已经订婚的年轻人。姑娘叫约琳德，比别的姑娘都美。小伙子叫约林格尔，也同她一样出众。两人最喜欢的，就是彼此陪伴。
        - id: ch01-b04
          speaker: narrator
          text: >-
            一天傍晚，他们为了多说一会儿话，一同走进森林散步。出发时，约林格尔特意提醒约琳德。
        - id: ch01-b05
          speaker: joringel
          text: >-
            可得当心，千万别走到城堡附近去。
        - id: ch01-b06
          speaker: narrator
          text: >-
            那是个美丽的傍晚。明亮的阳光从一根根树干之间穿过，照着深绿的树叶。古老的山楂树上，斑鸠的歌声清清楚楚地传来。

    - id: ch02
      title: 夜莺与咒语
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            不知为什么，约琳德不时流下眼泪。她坐在阳光里哭泣，约林格尔也跟着悲叹。他们难过得像是被判了死刑。两人环顾四周，越看越糊涂，竟想不起回家的路了。
        - id: ch02-b02
          speaker: narrator
          text: >-
            太阳一半露在山上，一半已经沉了下去。约林格尔透过树林一望，古老的城墙近在眼前。他顿时吓得魂都快没了。就在这时，约琳德唱了起来。
        - id: ch02-b03
          speaker: jorinde
          text: >-
            红胸脯的小鸟儿，声声唱着悲伤、悲伤、悲伤。它为死去的小斑鸠歌唱，唱着悲伤，悲——啾，啾，啾。
          emotion: sad
        - id: ch02-b04
          speaker: narrator
          text: >-
            约林格尔再抬头时，眼前已经没有约琳德了。她变成了一只夜莺，还在“啾、啾”地唱。一只眼睛发亮的猫头鹰绕着她飞了三圈，也尖叫了三遍“图维特，图维特，图呜——”。
        - id: ch02-b05
          speaker: narrator
          text: >-
            约林格尔像石头一样定在那里。他哭不出来，说不出话，手脚全都不能动。太阳落下去了。猫头鹰飞进灌木，灌木里马上走出一个驼背的老妇人。她又黄又瘦，红眼睛大得吓人，弯钩似的鼻子一直碰到下巴。
        - id: ch02-b06
          speaker: narrator
          text: >-
            老妇人嘴里咕哝着什么，一把捉住夜莺，攥在手里带走了。约林格尔仍旧困在原地，只能眼看着约琳德消失。过了一阵，老妇人回来了。
        - id: ch02-b07
          speaker: enchantress
          text: >-
            晚上好，扎基尔。新月照进篮子，你便早早得自由，扎基尔。
        - id: ch02-b08
          speaker: narrator
          text: >-
            咒语刚念完，约林格尔就能动了。他跪在女巫面前，一遍遍求她放回约琳德。
        - id: ch02-b09
          speaker: enchantress
          text: >-
            你永远也别想再得到她。
        - id: ch02-b10
          speaker: narrator
          text: >-
            女巫转身走了。约林格尔在后面呼喊，又哭又求，可是一点用也没有。
        - id: ch02-b11
          speaker: joringel
          text: >-
            没有约琳德，我今后可怎么办啊！
          emotion: sad

    - id: ch03
      title: 血红的花
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            约林格尔离开森林，最后来到一个陌生的村庄，在那里替人放了很久的羊。那段日子，他常常绕着城堡走，却始终不敢靠得太近。
        - id: ch03-b02
          speaker: narrator
          text: >-
            一天夜里，他做了一个梦。梦里有一朵血红的花，花心嵌着一颗又大又美的珍珠。他摘下花，带着它走进城堡。花碰到哪里，哪里的魔法就会解除。靠着这朵花，他终于救回了约琳德。
        - id: ch03-b03
          speaker: narrator
          text: >-
            第二天一早，约林格尔便出发了。他翻山越谷，四处寻找梦中的花。整整八天过去，仍旧一无所获。到了第九天清晨，他终于看见一朵血红的花，花心托着一大滴露珠，真像世上最美的珍珠。
        - id: ch03-b04
          speaker: narrator
          text: >-
            他带着花日夜赶路，回到城堡。走进百步以内，他的身体没有僵住，双脚依然能够向前。他一直走到大门口，这才知道花真的能破除魔法，心里欢喜极了。
        - id: ch03-b05
          speaker: narrator
          text: >-
            约林格尔拿花轻轻一碰，大门立刻弹开。他穿过庭院，走进城堡，停下来细听鸟鸣。终于，他听见了鸟儿的歌声，便循着声音找到一座大厅。

    - id: ch04
      title: 七千只鸟笼
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            女巫就在大厅里，周围摆着七千只柳条笼，笼里关满了鸟。她看见约林格尔，气得冲他吐出满腔恶毒，却连一步也不能靠近。
        - id: ch04-b02
          speaker: narrator
          text: >-
            约林格尔没有理她，只顾查看一只又一只鸟笼。可这里有好几百只夜莺，他怎么知道哪一只是约琳德呢？
        - id: ch04-b03
          speaker: narrator
          text: >-
            他正在发愁，忽然看见女巫偷偷提起一只笼子，朝门口走去。约林格尔马上追过去，用血红的花碰了鸟笼，又碰了女巫。
        - id: ch04-b04
          speaker: narrator
          text: >-
            女巫的魔法再也不灵了。约琳德出现在约林格尔面前，伸出双臂搂住他的脖子。她比从前还要美丽。
        - id: ch04-b05
          speaker: narrator
          text: >-
            约林格尔又用花解开其余鸟儿身上的魔法，让她们全都变回姑娘。随后，他和约琳德一起回到家乡。两个人从此过了许多年幸福的生活。
        - id: ch04-b06
          speaker: narrator
          text: >-
            这个故事，是格林兄弟讲下来的。
