audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and attentive fairy-tale storytelling
        timbre: clear and gently resonant
        pace: measured
        pitch: medium
    fairy_beech_woods:
      display_name: Fairy of the Beech-Woods
      tts:
        delivery: kindly, perceptive, and gently amused
        timbre: warm and mellow
        pace: measured
        pitch: medium
    saradine:
      display_name: Saradine
      tts:
        delivery: proud, spirited, and sharply expressive
        timbre: bright and ringing
        pace: brisk
        pitch: medium-high
    celandine:
      display_name: Princess Celandine
      tts:
        delivery: graceful, candid, and increasingly tender
        timbre: clear and luminous
        pace: natural
        pitch: medium-high
    featherhead:
      display_name: Prince Featherhead
      tts:
        delivery: charming and self-assured, softening into sincerity
