  chapters:
    - id: ch01
      title: The Valley of the Beech-Woods
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there lived a King and Queen who were the kindest creatures in the world. They could not bear to see any subject in need, so they kept giving away their treasures until nothing remained for their own support. When their neighbor King Bruin heard of it, he raised a great army and marched into their country. The poor King had no means to defend his kingdom. He put on a false beard, took his little son Prince Featherhead in his arms, and fled with the Queen into the wild country.
        - id: ch01-b02
          speaker: narrator
          text: They were fortunate enough to escape King Bruin's soldiers. After weariness and adventures beyond telling, they reached a green valley. A stream as clear as crystal ran beneath beautiful trees, and the place delighted them. They stood looking around until a voice suddenly spoke from nowhere and told them to fish and see what they caught.
        - id: ch01-b03
          speaker: narrator
          text: The King had always loved fishing and carried a hook or two wherever he went. He pulled one from his pocket, and the Queen gave him her girdle for a line. The hook had scarcely touched the stream when it caught a large fish. That fish made an excellent meal, and they badly needed one, for until then they had found only wild berries and roots.
        - id: ch01-b04
          speaker: narrator
          text: For the present, they could think of no better place to stay. The King went straight to work and built a shelter from branches. When it was finished, the Queen was charmed with it. She declared that only one thing was missing from her happiness, a flock of sheep that she and the little Prince could tend while the King fished. The stream held plenty of fish, and catching them was easy. Each one shone with scales of a different color. Before long, the King discovered that he could even teach them to talk and whistle better than parrots.
        - id: ch01-b05
          speaker: narrator
          text: He decided to carry a few fish to the nearest town and see whether anyone would buy them. No one there had ever seen their equal, and people crowded around him eagerly. Soon a house in town was not considered complete without a crystal bowl of his fish. Every customer wanted colors that matched the furniture, and their particular demands gave the King no end of trouble. Still, the money bought the Queen her flock of sheep along with many other things that made life pleasant. The family never once regretted the kingdom they had lost.
        - id: ch01-b06
          speaker: narrator
          text: The Fairy of the Beech-Woods lived in that valley. She had pitied the fugitives and sent good fortune to the King's fishing. She loved children, too, and little Featherhead won her heart. He never cried, and he grew prettier every day. At first she met the King and Queen without saying she was a fairy. They quickly became fond of her and trusted her with their precious son. She carried him to her palace and treated him to cakes, tarts, and every other good thing. That was her chosen way of winning his affection.
        - id: ch01-b07
          speaker: narrator
          text: That was how she first made the child fond of her. As Featherhead grew, she worked hard to educate him as a prince should be educated. Yet all her care went wrong. He became vain and frivolous. He grew tired of the quiet country and hurried after every foolish pleasure in the nearby town. His handsome face and charming manners made him popular there. The King and Queen grieved over the change, but they did not know how to correct a son whom the good Fairy had allowed to become so self-willed.
    - id: ch02
      title: Saradine's Angry Visit
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Around that time, the Fairy of the Beech-Woods received a visit from her old friend Saradine. Saradine rushed into the house so breathless with rage that she could hardly speak.
        - id: ch02-b02
          speaker: fairy_beech_woods
          text: Dear me, what has happened? Tell me quietly.
          emotion: calm
        - id: ch02-b03
          speaker: saradine
          text: What has happened? You shall hear every bit of it! You know Princess Celandine of the Summer Islands. I gave her everything she could need to be charming, and I even took the trouble to raise her myself. Today she came to me with more kisses and coaxing than ever and begged for a favor. I let her persuade me to promise before she named it. And what did she ask? She wanted me to take back every gift I had given her!
          emotion: angry
        - id: ch02-b04
          speaker: narrator
          text: Saradine repeated what Celandine had told her. If she had the good fortune to please someone, the Princess wanted to know whether that person truly liked Celandine herself or merely liked a fairy's gifts. The same doubt would follow her whenever she met anyone, all her life, and she said that would make life wearisome. She insisted that she was not ungrateful for Saradine's kindness. She only wanted to discover what qualities were truly her own.
        - id: ch02-b05
          speaker: saradine
          text: I tried every way I knew to make her change her mind, but she would not. So I performed the usual ceremony and took my gifts back. Then I came here for a little peace. Not that I removed anything terribly important. Nature had already made the provoking girl pretty and had given her a quick wit of her own. She will manage perfectly well without me. But she deserved a lesson, so I whisked her into the desert and left her there!
          emotion: angry
        - id: ch02-b06
          speaker: fairy_beech_woods
          text: What? You left her alone with nothing to live on? Give her into my care. I do not think so badly of her. I shall cure her vanity by teaching her to love someone better than herself. And really, she has shown more spirit and originality than one usually expects from a princess.
          emotion: surprised
        - id: ch02-b07
          speaker: narrator
          text: Saradine willingly agreed. The old Fairy cleared away the dangers around Celandine and guided her along a mossy path beneath the trees. The path led to the shelter where the King and Queen still lived peacefully in the valley.
        - id: ch02-b08
          speaker: narrator
          text: The royal couple were amazed to see her. Thorns and briars had torn her once elegant clothes into miserable rags, while her lovely face moved them to pity at once. They recognized another person overtaken by misfortune. The Queen welcomed her warmly and invited her to share their simple meal. Celandine accepted their hospitality with grace and soon told them all that had happened. The King admired her independent spirit. The Queen thought she had been very daring indeed to oppose the wishes of a fairy.
        - id: ch02-b09
          speaker: celandine
          text: My choice brought me to you, so I cannot regret it. If you will allow me to remain here, I shall be perfectly happy.
        - id: ch02-b10
          speaker: narrator
          text: The King and Queen gladly let her stay. They were delighted to have the charming Princess fill the empty place Featherhead had left in their home. They seldom saw their son now. The Fairy had given him a palace in the nearby town, where he lived in the greatest luxury and did nothing but amuse himself from morning until night. Celandine stayed with them, helped the Queen keep house, and soon became very dear to them both.
        - id: ch02-b11
          speaker: narrator
          text: When the Fairy of the Beech-Woods next visited them, they introduced the Princess and told her story. They never guessed that the Fairy already knew more about Celandine than they did. She showed great delight and often invited the Princess to the Leafy Palace, an enchanting place filled with treasures. Whenever she showed Celandine some marvelous object, she would make the same remark.
        - id: ch02-b12
          speaker: fairy_beech_woods
          text: This might make a fine wedding gift one day.
        - id: ch02-b13
          speaker: narrator
          text: Celandine could not help imagining that the promised wedding gift might be meant for her. Perhaps she would receive the two blue wax torches that burned forever without growing shorter. Perhaps it would be the diamond from which new diamonds continually grew, or the marvelous boat that could sail beneath the water. Whatever treasure they happened to be admiring, the same hope entered her mind. The Fairy never actually promised any of these things, but she certainly allowed Celandine to believe what she pleased. A small disappointment, she thought, would do the Princess good.
        - id: ch02-b14
          speaker: narrator
          text: Her real plan for curing Celandine's vanity depended on Prince Featherhead. She disapproved of the way he lived, but she was too tenderhearted toward him to pull him away from his pleasures unless she could offer him something better. It was certainly the pleasantest kind of correction, though not always the most effective.
    - id: ch03
      title: The Portrait and the Enchantment
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The Fairy never gave Celandine the smallest hint that Featherhead was anything less than perfect. She praised him and spoke of him so often that the Princess formed a wonderfully flattering picture of him in her mind. When the Fairy finally announced his coming visit, Celandine felt sure this delightful Prince would fall in love with her at once. She was quite pleased by the thought. The Fairy expected exactly the same thing, and that was not what she wanted at all.
        - id: ch03-b02
          speaker: narrator
          text: Before Featherhead arrived, the Fairy enchanted Celandine. To everyone else the Princess looked exactly as she always did, but to Featherhead she seemed ugly and awkward. He entered the Leafy Palace even more handsome and fascinating than Celandine had expected. Yet he scarcely looked at her. He gave all his attention to the old Fairy and appeared to have a hundred things to tell her.
        - id: ch03-b03
          speaker: narrator
          text: His indifference astonished Celandine. She became cold and offended, but he never seemed to notice. As a final effort, she brought out all her wit and gaiety to entertain him. That failed too. Featherhead was young enough to care more for beauty than anything else. He answered politely, but his mind was plainly elsewhere.
        - id: ch03-b04
          speaker: narrator
          text: Celandine was deeply hurt, for she liked the Prince very much. For the first time, she bitterly regretted giving up Saradine's gifts. Featherhead was puzzled in his own way. The King and Queen had praised this charming Princess and called her beautiful. To him, that only proved that country people had no taste.
        - id: ch03-b05
          speaker: narrator
          text: He talked endlessly about his charming friends in town. He described the beauties he had once admired, those he admired now, and those he thought he might admire next. Celandine had to listen until she was ready to cry from vexation. The Fairy was shocked by his conceit and formed a plan to cure him. An unknown messenger carried him a portrait of Celandine as she truly looked. Beneath it was a warning that all this beauty and sweetness, a loving heart, and a great kingdom might have belonged to him if he had not been so notoriously fickle.
        - id: ch03-b06
          speaker: narrator
          text: The warning made a strong impression on Featherhead, but the portrait affected him far more. He simply could not tear his eyes away. He declared aloud that never in his life had he seen anyone so lovely or so graceful. Then his pride returned. It was absurd, he thought, for the fascinating Featherhead to fall in love with a picture. He hurried back to town and its amusements, hoping they would drive the portrait's haunting eyes from his mind.
        - id: ch03-b07
          speaker: narrator
          text: But everything in town seemed changed. Its beauties no longer pleased him, and their clever talk had lost all power to amuse him. The change went both ways. His old companions found the Prince far less agreeable than before. They were not sorry when he finally announced that country life suited him best after all and returned to the Leafy Palace.
        - id: ch03-b08
          speaker: narrator
          text: Meanwhile, time had passed slowly for Celandine with the King and Queen. She was only too glad when Featherhead came back and noticed his change at once. Instead of avoiding her, he now sought her company and seemed to enjoy their conversations. Still, she never flattered herself that he was in love with her. It did not take her long to decide that he certainly loved someone else.
        - id: ch03-b09
          speaker: narrator
          text: One day Celandine wandered sadly beside the river and found Featherhead asleep beneath a tree. She crept closer so she could look at his dear face without being seen. Then she noticed the portrait in his hand. It was a portrait of herself. She could not understand it. Why would he treasure her picture while remaining so completely indifferent to her? When she found the chance, she asked the name of the Princess whose portrait he always carried.
        - id: ch03-b10
          speaker: featherhead
          text: Ah, how can I tell you her name?
          emotion: sad
        - id: ch03-b11
          speaker: celandine
          text: Why can you not tell me? What could possibly prevent you?
        - id: ch03-b12
          speaker: featherhead
          text: Prevent me? I have tried everything and still cannot find the beautiful woman in this portrait. Would I be so unhappy if I had found her? I do not even know her name.
          emotion: sad
        - id: ch03-b13
          speaker: narrator
          text: More bewildered than ever, Celandine asked to see the picture. She studied it for several minutes, gave it back, and shyly observed that the woman herself had every reason to be satisfied with such a portrait.
        - id: ch03-b14
          speaker: featherhead
          text: So you think the painter made her prettier than she is. Celandine, I expected better of you. I thought you were above such miserable jealousy, but it seems all women are alike.
          emotion: angry
        - id: ch03-b15
          speaker: celandine
          text: No, I only meant that it looks like her.
          emotion: sad
        - id: ch03-b16
          speaker: featherhead
          text: Then you know her! Tell me who she is, please. Do not leave me wondering any longer!
          emotion: surprised
        - id: ch03-b17
          speaker: narrator
          text: He dropped to his knees beside Celandine.
        - id: ch03-b18
          speaker: celandine
          text: Oh, can you not see? The portrait is meant to be me!
          emotion: surprised
        - id: ch03-b19
          speaker: narrator
          text: Featherhead sprang to his feet. He could barely stop himself from telling her that vanity must have blinded her if she imagined the slightest resemblance between herself and the lovely portrait. For a moment he stared at her with cold astonishment. Then he turned away without another word, and within a few hours he had left the Leafy Palace altogether.
        - id: ch03-b20
          speaker: narrator
          text: Now Celandine was truly unhappy. She could not remain where she had been rejected so cruelly. Without saying farewell even to the King and Queen, she left the valley and wandered sadly away, caring nothing about where she went.
    - id: ch04
      title: The Miserly Old Woman
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Celandine walked until she was exhausted. Then she saw a tiny house in the distance and slowly turned toward it. The closer she came, the smaller and more miserable it looked. At last she reached the door and found a little old woman sitting on the step. The woman watched the weary Princess approach and greeted her with a grim complaint.
        - id: ch04-b02
          speaker: old_woman
          text: Here comes another grand beggar, too lazy to do anything but wander around the country!
          emotion: disgusted
        - id: ch04-b03
          speaker: celandine
          text: Please, madam, misfortune has left me no choice. I must ask you for shelter.
          emotion: sad
        - id: ch04-b04
          speaker: old_woman
          text: There, just as I expected! First you ask for shelter. Next it will be supper, and after supper you will want money for your journey. If I could find a softhearted fool every day, I might enjoy that life myself. But I worked hard to build this house and earn my bit of food. You expect me to give it all to the first traveler who asks. No, indeed! A fine lady like you probably carries more money than I own. I had better search you and find out.
          emotion: angry
        - id: ch04-b05
          speaker: narrator
          text: Leaning on her stick, the old woman hobbled toward Celandine.
        - id: ch04-b06
          speaker: celandine
          text: I wish I had money. I would gladly give it all to you.
          emotion: sad
        - id: ch04-b07
          speaker: old_woman
          text: Those are very fine clothes for someone who lives as you do.
        - id: ch04-b08
          speaker: celandine
          text: What do you mean? Do you think I came here to beg from you?
          emotion: surprised
        - id: ch04-b09
          speaker: old_woman
          text: I cannot say, but you certainly brought me nothing. So what do you want? Shelter costs very little, I suppose. Supper is another matter, and I will hear nothing of that. People your age are always ready to eat. After such a walk, you must be ravenous.
        - id: ch04-b10
          speaker: celandine
          text: Truly, madam, I am much too sad to feel hungry.
          emotion: sad
        - id: ch04-b11
          speaker: old_woman
          text: Very well. Promise to remain sad, and you may spend the night.
        - id: ch04-b12
          speaker: narrator
          text: The old woman made Celandine sit beside her and began rubbing the Princess's silk between her fingers.
        - id: ch04-b13
          speaker: old_woman
          text: Lace above and lace beneath! This must have cost a fortune. You should have saved enough to feed yourself instead of begging from people who need everything they have. What did you pay for these clothes?
        - id: ch04-b14
          speaker: celandine
          text: I did not buy them, madam. I know nothing about money.
        - id: ch04-b15
          speaker: old_woman
          text: Then what do you know?
        - id: ch04-b16
          speaker: celandine
          text: Not very much. But I am terribly unhappy, and if my work could be useful to you...
          emotion: sad
        - id: ch04-b17
          speaker: narrator
          text: Celandine burst into tears, but the old woman cut her off.
        - id: ch04-b18
          speaker: old_woman
          text: Work! Workers expect payment, and I can do my own work.
          emotion: angry
        - id: ch04-b19
          speaker: celandine
          text: I will serve you for nothing. I will do whatever you ask. I only want to live quietly here, far from everyone.
          emotion: sad
        - id: ch04-b20
          speaker: old_woman
          text: I know you are trying to trick me. And if I did keep you, should my servant dress better than I do? Give me your clothes and wear something I provide. I am growing old, after all, and perhaps one day I shall need someone to care for me.
        - id: ch04-b21
          speaker: celandine
          text: Please, take my clothes and do whatever you like with them.
          emotion: sad
        - id: ch04-b22
          speaker: narrator
          text: At once the old woman hobbled away with surprising eagerness and returned with a small bundle. Inside was a miserable dress of a kind the Princess had never even seen before. The woman became wonderfully nimble. She skipped around Celandine, helping her take off the rich robe and put on the wretched dress in its place, all the while crying out over every costly part of the garment she had gained.
        - id: ch04-b23
          speaker: old_woman
          text: Mercy, what a splendid lining! And look at the width. There is enough cloth here for four dresses. Child, how did you ever walk beneath all that weight? You certainly could not have turned around in my house while wearing it.
          emotion: surprised
        - id: ch04-b24
          speaker: narrator
          text: She folded the robe with great care and put it safely away.
        - id: ch04-b25
          speaker: old_woman
          text: My dress suits you wonderfully. Mind that you take very good care of it.
        - id: ch04-b26
          speaker: narrator
          text: At suppertime, the old woman refused every offer of help and went inside alone. Soon she came back with a very small dish.
        - id: ch04-b27
          speaker: old_woman
          text: Now we may have supper.
        - id: ch04-b28
          speaker: narrator
          text: She gave Celandine a small piece of black bread and uncovered two dried plums.
        - id: ch04-b29
          speaker: old_woman
          text: We shall share one plum between us. Since you are my guest, you may have the half with the stone. Be careful not to swallow it. I save plum stones for winter, because they make excellent fuel. Here is some free advice. Fruit with stones is always the most economical kind to buy.
        - id: ch04-b30
          speaker: narrator
          text: Celandine was lost in sorrow and never heard this thrifty advice. She even forgot to eat her half of the plum. The old woman was delighted. She saved it for her own breakfast.
        - id: ch04-b31
          speaker: old_woman
          text: I am very pleased with you. Continue this way and we shall get along beautifully. I can teach you useful secrets most people never learn. Look at my house. I built the whole thing from the seeds of every pear I have eaten. Other people throw those seeds away. Just think how much is wasted because people have no patience or cleverness.
        - id: ch04-b32
          speaker: narrator
          text: Celandine could not make herself care about this advice or the many thrifty lessons that followed. The old woman soon sent her to bed, not out of kindness, but from fear that the night air might give her an appetite. The unhappy Princess spent a sleepless night. In the morning, the woman claimed to have heard how well she slept and announced another economical plan.
        - id: ch04-b33
          speaker: old_woman
          text: I heard how soundly you slept. After a night like that, you cannot need breakfast. Stay in bed while I do my chores. The more a person sleeps, the less she needs to eat. Today is market day, so I shall go to town and buy one penny's worth of bread for our entire week.
        - id: ch04-b34
          speaker: narrator
          text: The old woman chattered on, but Celandine neither heard nor cared. She left the bed, wandered into the empty countryside, and thought about her unhappy fate. The Fairy of the Beech-Woods had no wish to let her starve. She sent unexpected help in the form of a beautiful white cow. The gentle creature found Celandine in that desolate place and followed the Princess all the way back to the little house.
        - id: ch04-b35
          speaker: old_woman
          text: Now we can have milk and cheese and butter! Oh, milk is so good. What a shame it costs such a ruinous amount!
          emotion: happy
        - id: ch04-b36
          speaker: narrator
          text: They made the gentle cow a little shelter from branches. Each day Celandine led it out to graze, and it followed her as faithfully as a dog.
    - id: ch05
      title: The Stranger by the Brook
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: One morning Celandine sat sadly beside a little brook while the cow grazed nearby. She suddenly saw a young stranger coming toward her and quickly rose, intending to avoid him. The stranger was Prince Featherhead. The instant he noticed her, he ran toward her with every sign of joy. He did not recognize the Celandine he had rejected at the Leafy Palace. He saw the beautiful Princess whose portrait he had carried and whose living face he had searched for so vainly across the world.
        - id: ch05-b02
          speaker: narrator
          text: The Fairy of the Beech-Woods had decided that Celandine had suffered enough. She removed the enchantment from the Princess and placed it upon Featherhead instead. In that single moment, the Prince lost the good looks that had done so much to make him fickle. Celandine saw only an unfamiliar young man. He threw himself at her feet and begged her not to leave, asking only that she stay and speak with him. At last she agreed, but only because his wish seemed so earnest.
        - id: ch05-b03
          speaker: narrator
          text: Featherhead returned every day, hoping to meet her again, and often told her how happy her company made him. One day he begged Celandine to love him. She confessed that she could not, because someone else already filled her whole heart.
        - id: ch05-b04
          speaker: celandine
          text: I have the unhappiness of loving a Prince who is fickle, foolish, and proud. Flattery has spoiled him. He cares for no one but himself, and worst of all, he does not love me.
          emotion: sad
        - id: ch05-b05
          speaker: featherhead
          text: How could you possibly love someone so worthless?
          emotion: surprised
        - id: ch05-b06
          speaker: celandine
          text: I know, but I love him all the same.
          emotion: sad
        - id: ch05-b07
          speaker: featherhead
          text: How can he look at you and feel nothing? I have carried your portrait across the whole world while I searched for you. Now that I have found you, you are ten times lovelier than I imagined. I would give everything I own if I could win your love.
        - id: ch05-b08
          speaker: celandine
          text: My portrait? Can Prince Featherhead truly have given it away?
          emotion: surprised
        - id: ch05-b09
          speaker: featherhead
          text: He would sooner give away his life, lovely Princess. I know that because I am Prince Featherhead.
        - id: ch05-b10
          speaker: narrator
          text: At that very moment, the Fairy of the Beech-Woods removed Featherhead's enchantment. Celandine looked again and recognized the Prince she loved. Now he was truly hers. The trials they had both endured had changed and improved them so greatly that each was finally capable of real love. You may imagine their perfect happiness. They had so much to hear and so much to tell that time passed unnoticed.
        - id: ch05-b11
          speaker: narrator
          text: At last they had to return to the little house. On the way, Celandine suddenly remembered her ragged old dress and wondered how strange she must look. Featherhead declared that the dress suited her extremely well and made a most picturesque sight.
        - id: ch05-b12
          speaker: narrator
          text: The old woman greeted them very crossly when they reached the house.
        - id: ch05-b13
          speaker: old_woman
          text: It is always the same. Wherever a girl appears, a young man soon follows! But do not think I shall keep you here, young sir. Not for a moment. Off you go!
          emotion: angry
        - id: ch05-b14
          speaker: narrator
          text: Featherhead almost grew angry at such a rude welcome, but he was too happy to care for long. He demanded that the woman return Celandine's own clothes so the Princess could leave properly dressed.
        - id: ch05-b15
          speaker: narrator
          text: The demand threw the old woman into a fury. She had expected Celandine's rich robes to provide her with clothes for the rest of her life. For some time, Featherhead could not make her listen while he offered to pay. At last the sight of a handful of gold softened her a little.
        - id: ch05-b16
          speaker: old_woman
          text: First you must both promise faithfully that you will never ask me to return this gold. Not for any reason at all.
        - id: ch05-b17
          speaker: narrator
          text: Once they promised, she led Celandine into the house. She grudgingly handed over just enough of the bright clothing to make the Princess presentable and claimed that everything else had been lost.
        - id: ch05-b18
          speaker: narrator
          text: Then the Prince and Princess discovered that they were very hungry. People cannot live on love any more than they can live on air. The old woman's complaints became louder than ever.
        - id: ch05-b19
          speaker: old_woman
          text: Feed two people who are already as happy as this? Why, that would ruin me!
          emotion: angry
        - id: ch05-b20
          speaker: narrator
          text: Featherhead began to look angry. With sighs and muttering, the woman produced a morsel of bread, a bowl of milk, and six plums. The lovers were content. As long as they could gaze at one another, they scarcely knew what they ate.
        - id: ch05-b21
          speaker: narrator
          text: Their memories seemed endless. Featherhead explained how he had wandered all over the world, going from one celebrated beauty to the next. Every meeting had disappointed him because no one resembled the portrait. Celandine kept wondering how he could have spent so long beside her without recognizing her. Over and over, she pardoned him for treating her with such coldness and pride.
        - id: ch05-b22
          speaker: celandine
          text: You see, Featherhead, I love you, and love makes everything right. But we cannot remain here. What shall we do?
        - id: ch05-b23
          speaker: narrator
          text: Featherhead thought they should seek the Fairy of the Beech-Woods and place themselves under her protection once more. They had scarcely agreed when two little chariots appeared, each wreathed with jasmine and honeysuckle. The Prince and Princess stepped inside, and the chariots swept them toward the Leafy Palace.
    - id: ch06
      title: Two Kingdoms Restored
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Just before the little house vanished from sight, they heard the old woman's loud cries and lamentations. They looked back and saw the beautiful cow disappearing while she made frantic efforts to hold it. Later they learned that she spent the rest of her life trying to place Featherhead's handful of gold inside her money bag. The Fairy had chosen that punishment for her greed. Each coin slipped out again as quickly as the old woman dropped it in, so the task could never be finished.
        - id: ch06-b02
          speaker: narrator
          text: At the Leafy Palace, the Fairy of the Beech-Woods ran to meet the Prince and Princess with open arms. She was delighted to find them so greatly improved. Now, with a clear conscience, she could begin spoiling them again.
        - id: ch06-b03
          speaker: narrator
          text: Saradine soon arrived, bringing the King and Queen with her. Celandine begged her old guardian for forgiveness, and Saradine granted it graciously. The Princess was so charming now that Saradine could refuse her nothing. She restored Celandine's rule over the Summer Islands and promised to protect her in everything from that day forward.
        - id: ch06-b04
          speaker: narrator
          text: Then the Fairy of the Beech-Woods gave the King and Queen wonderful news. Their subjects had risen against King Bruin, chased him from the throne, and were waiting to welcome their rightful rulers home. But the King and Queen immediately gave the recovered kingdom to Featherhead. Nothing in the world, they declared, could persuade them to abandon the peaceful life they had made in the valley. They preferred their quiet shelter, the stream, and the life they already loved.
        - id: ch06-b05
          speaker: narrator
          text: The two Fairies took charge of establishing Featherhead and Celandine in their beautiful kingdoms and promised to see that everything was properly arranged. With their families reunited and both realms restored, there was no reason to delay their happiness. The wedding took place the very next day.
        - id: ch06-b06
          speaker: narrator
          text: They lived happily ever after. Celandine was never vain again, and Featherhead was never fickle again.
