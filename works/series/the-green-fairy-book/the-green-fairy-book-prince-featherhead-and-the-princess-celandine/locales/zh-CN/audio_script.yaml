audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，像编书人面对孩子娓娓而谈，讽刺处轻巧含笑
        timbre: 温暖清朗
        pace: 舒缓而有自然起伏
        pitch: 中音
    fairy_beech_woods:
      display_name: 山毛榉林仙女
      tts:
        delivery: 慈爱睿智，温和中带着洞察一切的幽默
        timbre: 温暖醇厚
        pace: 从容
        pitch: 中音
    saradine:
      display_name: 萨拉迪娜仙女
      tts:
        delivery: 骄傲爽利，生气时尖锐而富有戏剧性
        timbre: 明亮清越
        pace: 偏快
        pitch: 中高音
    celandine:
      display_name: 白屈菜公主
      tts:
        delivery: 优雅坦率，历经磨难后愈发真挚温柔
        timbre: 清澈柔美
        pace: 适中
        pitch: 中高音
    featherhead:
      display_name: 羽毛头王子
      tts:
        delivery: 年轻迷人，起初自负轻浮，后来诚恳深情
        timbre: 明朗清润
        pace: 适中
        pitch: 中音
    old_woman:
      display_name: 吝啬的老太婆
      tts:
        delivery: 多疑刻薄，斤斤计较中带着滑稽的得意
        timbre: 干涩沙哑
        pace: 偏快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 山毛榉林的山谷
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前有一位国王和一位王后，心肠好得不能再好。他们看不得任何臣民缺东西，便把王室财宝一样样送出去。送着送着，宝库空了，最后竟连自己的生活也维持不了。邻国的棕熊国王听到风声，马上召集大军，打进他们的国土。可怜的国王连保卫王国的钱都拿不出来，只能粘上一把假胡子乔装改扮。他抱起独生子小羽毛头王子，带着王后逃进荒野，身边连一个随从也没有。
        - id: ch01-b02
          speaker: narrator
          text: >-
            他们侥幸躲过追兵，经过说也说不尽的劳累和奇遇，终于来到一座青翠的山谷。水晶般清澈的溪水从美丽的树下流过。三个人正在惊喜地四下张望，忽然有个声音叫他们下钩试试，看看能钓到什么。国王一向爱钓鱼，无论走到哪里，口袋里总会放上一两枚鱼钩。王后解下腰带给他当鱼线，钩子刚刚碰到水面，一条大鱼便上钩了。这顿饭来得正是时候，因为一路上，他们只找到过几颗野果和几截草根。
        - id: ch01-b03
          speaker: narrator
          text: >-
            眼下再没有比这里更好的住处，他们便决定暂且留下。国王立刻动手，用树枝搭起一座遮风挡雨的棚屋。王后喜欢得不得了，还说幸福中只缺一样东西。她想要一群羊，这样，她和小王子就能放羊，国王则可以专心钓鱼。溪里的鱼多得很，又极容易上钩。每一条的鳞片都闪着不同颜色，国王甚至能教它们说话、吹口哨，教得比任何鹦鹉还好。
        - id: ch01-b04
          speaker: narrator
          text: >-
            国王决定把几条鱼带到最近的城里，看看能不能卖出去。从未见过这种鱼的人们立刻围拢过来，把他带去的鱼抢购一空。消息传开以后，登门的客人越来越多。没过多久，城中若有哪户体面人家没有一只装满彩鱼的水晶缸，那幢房子便算不得齐全。客人还格外挑剔，非要鱼的颜色配得上家具，害得国王一条条挑来选去，好不麻烦。不过，卖鱼的钱不但为王后买来了盼望已久的羊群，也添置了许多使生活愉快的东西。一家人过得舒服，再也不怀念丢掉的王国。
        - id: ch01-b05
          speaker: narrator
          text: >-
            原来，山毛榉林仙女就住在这座山谷。她看到一家人流离失所，心中怜悯，便给国王送来了钓鱼的好运，此后也处处保护他们。仙女本来就喜爱孩子，而小羽毛头从来不哭，还越长越漂亮，很快便赢得了她的心。她最初没有告诉国王和王后自己是仙女，只像普通朋友一样与他们来往。夫妻俩很快喜欢上她，甚至放心把最宝贝的儿子交给她照料。
        - id: ch01-b06
          speaker: narrator
          text: >-
            仙女常把王子带到自己的宫殿，用蛋糕、馅饼和各种好东西款待他。这便是她让孩子先喜欢上自己的办法。等羽毛头长大一些，她又花尽心思，把王子该学的东西一一教给他。可惜，这些心血还是没能拦住他长成一个爱慕虚荣、轻浮贪玩的青年。他厌倦了乡下的平静，整天往附近城里跑，追逐那些无聊的热闹。凭着英俊的脸和迷人的举止，他很快到处都受欢迎。父母看着儿子变成这样，心中难过，却拿这个被好心仙女宠得十分任性的孩子毫无办法。
        - id: ch01-b07
          speaker: narrator
          text: >-
            就在这时，仙女的老朋友萨拉迪娜冲进屋来。她气得喘不过气，几乎连话也说不出。
        - id: ch01-b08
          speaker: fairy_beech_woods
          text: 哎呀，到底出了什么事？别急，慢慢告诉我。
          emotion: calm
        - id: ch01-b09
          speaker: saradine
          text: >-
            什么事？你听了就知道！我把夏岛的白屈菜公主亲手养大，又赐给她一切能讨人喜欢的优点。可她今天又是亲我，又是哄我，骗得我先答应满足她一个愿望。结果，她竟要我收回所有恩赐！
          emotion: angry
        - id: ch01-b10
          speaker: narrator
          text: >-
            白屈菜是这样解释的。倘若她有幸讨一个人喜欢，又怎么知道对方爱的是她本人，还是仙女送来的那些优点？以后每遇见一个人，同样的疑问都会回来。若要一辈子活在这种猜疑里，她只会觉得厌倦。她还特意保证，自己绝不是不感激萨拉迪娜的种种恩惠。
        - id: ch01-b11
          speaker: saradine
          text: >-
            我怎么劝，她都不肯改主意。我只好照规矩收回恩赐，到你这里躲个清静。不过，大自然已经给了她漂亮的脸和聪明的头脑，她少了我的礼物也不会怎样。可这个气人的姑娘总得受点教训，所以我把她卷到荒野里，独自扔下了！
          emotion: angry
        - id: ch01-b12
          speaker: fairy_beech_woods
          text: >-
            什么？你让她孤零零待在那里，连活命的办法也没有？把她交给我吧。我不觉得她有那么坏。只要教她真心爱上一个胜过自己的人，她的虚荣自然会好。说起来，这小淘气倒比寻常公主更有勇气，也更有主见。
          emotion: surprised
        - id: ch01-b13
          speaker: narrator
          text: >-
            萨拉迪娜欣然答应。山毛榉林仙女先替白屈菜扫清四周的危险，再引她沿着树荫下的苔藓小径，来到国王与王后的棚屋。夫妻俩见到公主，惊讶万分。荆棘已经把她原本华美的衣裙扯得破破烂烂，那张动人的脸却马上唤起了他们的同情。他们认出这是又一个被灾祸追上的人。王后热情欢迎她，请她一起享用简单的饭食，白屈菜也优雅地接受了这份好意。
        - id: ch01-b14
          speaker: narrator
          text: >-
            白屈菜坐下来，把萨拉迪娜赐予她的一切、自己提出的请求，还有被送到荒野的经过全都讲了出来。国王听完，很欣赏她敢于选择自己命运的勇气。王后却有另一番看法。她觉得，白屈菜竟敢违背一位仙女的心愿，实在大胆得惊人。
        - id: ch01-b15
          speaker: celandine
          text: >-
            我的选择让我遇见了你们，所以我不后悔。只要你们肯留下我，我就心满意足了。
        - id: ch01-b16
          speaker: narrator
          text: >-
            国王和王后求之不得，很乐意让白屈菜住下，填补羽毛头离家后留下的空缺。他们如今很少见到儿子。仙女早已在附近的城里送给王子一座宫殿，他在那里享尽奢华，从早到晚什么也不做，只顾玩乐。白屈菜却留在棚屋，帮助王后料理家务。没过多久，夫妻俩便像疼爱亲生女儿一样疼爱她。
        - id: ch01-b17
          speaker: narrator
          text: >-
            山毛榉林仙女再次来访时，夫妻俩把白屈菜介绍给她，还将公主的故事从头到尾讲了一遍。他们哪里知道，仙女对白屈菜的了解远比自己多。老仙女也装作初次相识的样子，见了公主欢喜不已。此后，她常邀请白屈菜去绿叶宫做客。那是一个世上难寻的迷人地方，宫中到处藏着神奇的珍宝。每当仙女拿出一件奇物给公主欣赏，她总要说同一句话。
        - id: ch01-b18
          speaker: fairy_beech_woods
          text: 这个呀，将来很适合拿来做结婚礼物。
        - id: ch01-b19
          speaker: narrator
          text: >-
            白屈菜忍不住猜，那礼物也许是两支永远燃烧、却一点也不会变短的蓝蜡烛，也许是不断长出新钻石的钻石，也许是能在水下航行的船。无论两人当时在看什么宝贝，公主总觉得，那一件将来会属于自己。仙女从不明说，却故意让她抱着希望，因为她觉得，一点小小的失望会对公主有好处。不过，要真正治好白屈菜的虚荣，她指望的还是羽毛头王子。

    - id: ch02
      title: 画像与看不见的真容
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            仙女明知羽毛头近来的生活很不像话，却对他心软得很。她舍不得直接夺走王子喜爱的快乐，只想拿更好的东西把他引回来。这种管教最叫人舒服，可不见得最管用。她还总对白屈菜夸奖王子，从不肯暗示他有半点缺点。听得多了，公主心中的羽毛头简直十全十美。等仙女宣布王子要来做客，白屈菜已经确信，他一定会当场爱上自己，还为这个想法暗暗欢喜。
        - id: ch02-b02
          speaker: narrator
          text: >-
            仙女不想让事情这么容易，便施了一道魔法。旁人眼中的白屈菜仍旧漂亮，只有羽毛头觉得她又丑又笨拙。王子来到绿叶宫，比公主想象的还要英俊，可他几乎不看她，只顾同仙女说个不停。
        - id: ch02-b03
          speaker: narrator
          text: >-
            王子的冷淡让白屈菜大吃一惊。她先摆出冷冰冰的样子，让人看出自己受了冒犯，羽毛头却仿佛没有察觉。最后，她拿出全部机智和活泼，想方设法逗他开心，王子依旧无动于衷。这个年纪的羽毛头只看美貌，不大懂得欣赏别的优点。他虽然回答得还算客气，心思却压根不在她身上。公主又羞又恼，因为她自己倒十分喜欢王子。生平第一次，她后悔自己放弃了萨拉迪娜的恩赐。
        - id: ch02-b04
          speaker: narrator
          text: >-
            羽毛头也有自己的困惑。他听父母把这位可爱的公主夸得天花乱坠，还一再说她美貌无双。如今亲眼看过，他只觉得这件事足以证明，住在乡下的人根本没有眼光。他当着公主的面，大谈城里那些迷人的相识，数着自己从前喜欢谁、现在喜欢谁、以后又可能喜欢谁。白屈菜把这一切听在耳里，气得快要掉泪。仙女也被他的自负吓了一跳，这才想出用画像教训他的主意。
        - id: ch02-b05
          speaker: narrator
          text: >-
            仙女很快想出一个办法来医治王子的自负。她派一名陌生信使送去一幅画像，画中正是白屈菜真正的模样。画像下面还写着一段话。这样一位美貌温柔的人，连同她多情的心和一个辽阔的王国，本来都可能属于羽毛头。只因为王子朝三暮四的名声人人皆知，他才与这一切失之交臂。
        - id: ch02-b06
          speaker: narrator
          text: >-
            画像下面的话给王子留下了很深的印象，可画本身更让他震动。他盯着那张脸，怎么也移不开眼，还大声说，自己从未见过如此美丽优雅的人。可他很快又觉得，像羽毛头这样迷人的人物竟爱上一幅画，实在太荒唐，便匆匆跑回城里，想靠从前的享乐忘掉那双萦绕心头的眼睛。谁知城中的一切仿佛都变了。美人再也不能吸引他，她们的俏皮话也变得索然无味。反过来，那些人同样觉得王子不如从前讨喜。等他宣布乡下更适合自己，她们很乐意看他离开。
        - id: ch02-b07
          speaker: narrator
          text: >-
            羽毛头重返绿叶宫以后，白屈菜立刻看出了他的变化。王子不再避开她，反而主动来找她，似乎很喜欢两人之间的谈话。公主当然没有自作多情，以为羽毛头爱上了自己，却很快看出，他心里确实住着另一个人。一天，她忧伤地在河边散步，发现王子睡在树荫下。她悄悄走近，想在无人察觉时看看那张亲爱的脸。不料，羽毛头手里竟握着她的画像。公主怎么也想不明白，他为何珍爱画中的自己，却对眼前的自己那样冷淡。
        - id: ch02-b08
          speaker: narrator
          text: 公主终于问起，画像里的姑娘究竟是谁。
        - id: ch02-b09
          speaker: featherhead
          text: 唉，我怎么能告诉你？
        - id: ch02-b10
          speaker: celandine
          text: 为什么不能呢？又没有什么拦着你。
        - id: ch02-b11
          speaker: featherhead
          text: >-
            没有什么拦着我？我用尽办法也找不到她。要是能找到，我还会这样难过吗？我甚至连她的名字都不知道。
        - id: ch02-b12
          speaker: narrator
          text: >-
            白屈菜听得越发惊讶，便请求亲眼看一看画像。王子把画交给她。公主仔细端详了好一会儿，确认画中的确是自己，才将画像还回去。她羞怯地说，不管怎样，画中真人应当对这幅画像十分满意。
        - id: ch02-b13
          speaker: featherhead
          text: >-
            原来你觉得画像把她画美了。白屈菜，我还以为你不会这样嫉妒别人呢。女人果然全都一样！
        - id: ch02-b14
          speaker: celandine
          text: 我只是说，画得确实很像。
        - id: ch02-b15
          speaker: narrator
          text: 王子猛地跪到她身旁。
        - id: ch02-b16
          speaker: featherhead
          text: 那么你认识她！快告诉我她是谁，别再叫我苦等了！
        - id: ch02-b17
          speaker: celandine
          text: 你还没看出来吗？画中的人就是我呀！
          emotion: surprised
        - id: ch02-b18
          speaker: narrator
          text: >-
            王子猛地跳了起来，差点脱口说出心里话。在他看来，白屈菜准是被虚荣蒙瞎了眼，才会以为自己与画像中的美人有哪怕一点点相像。他勉强把话咽了回去，只带着冰冷的惊讶盯了公主一会儿，便转身离开，一个字也没再说。几小时后，他连绿叶宫也离开了。

    - id: ch03
      title: 吝啬老太婆的小屋
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            白屈菜这次真的伤透了心，再也无法留在自己遭受残酷轻蔑的地方。她甚至没有向国王和王后告别，便独自走出山谷。公主满怀悲伤地四处流浪，连要去哪里也不在意。一直走到精疲力竭，她才看见前方有一间小得可怜的屋子。她拖着沉重的脚步靠近，那屋子看起来越发寒酸，门阶上还坐着一个小老太婆。
        - id: ch03-b02
          speaker: old_woman
          text: >-
            瞧，又来了个体面的叫花子！什么也不肯干，就知道满世界乱跑。
        - id: ch03-b03
          speaker: celandine
          text: 夫人，命运实在太悲惨，我只好求您让我住一夜。
          emotion: sad
        - id: ch03-b04
          speaker: old_woman
          text: >-
            我就知道！先要住处，接着要晚饭，最后还要盘缠。要是每天都能碰上一个又心软又糊涂的傻瓜，我也想过这样的好日子。可这屋子是我辛苦盖的，吃的也是我辛苦挣的，凭什么有个过路人张张嘴，我就全送给她？你这种贵夫人，钱准比我多。让我搜一搜！
        - id: ch03-b05
          speaker: celandine
          text: 我倒希望自己有钱。要是有，我一定全都送给您。
        - id: ch03-b06
          speaker: old_woman
          text: 可你过着这种日子，衣裳倒穿得真阔气。
        - id: ch03-b07
          speaker: celandine
          text: 什么？您以为我是来讨饭的吗？
          emotion: surprised
        - id: ch03-b08
          speaker: old_woman
          text: >-
            这个我不知道，不过你肯定不是来给我送东西的。想住一夜是吧？那倒花不了几个钱。可住下就要吃饭，这可不行。你这么年轻，又走了这么远，准已经饿坏了。
        - id: ch03-b09
          speaker: celandine
          text: 真的没有。我心里太难过，一点也不饿。
          emotion: sad
        - id: ch03-b10
          speaker: old_woman
          text: 那好。只要你答应一直这么难过，今晚就留下吧。
        - id: ch03-b11
          speaker: narrator
          text: >-
            老太婆让公主坐在自己身边，伸手捻着那件丝袍，不停地嘟囔。外面是花边，里面还是花边，这得花掉多少钱！她埋怨公主只顾把钱穿在身上，不知道留下足够的钱填饱肚子，最后反倒来求那些自己都不够用的人。
        - id: ch03-b12
          speaker: old_woman
          text: 这身漂亮衣裳，你到底花了多少钱？
        - id: ch03-b13
          speaker: celandine
          text: 不是我买的。我对钱一无所知。
        - id: ch03-b14
          speaker: old_woman
          text: 那么请问，你到底知道些什么？
        - id: ch03-b15
          speaker: celandine
          text: >-
            知道得不多，可我真的非常不幸。要是我能替您做点什么……
          emotion: sad
        - id: ch03-b16
          speaker: old_woman
          text: 替我做事？请人做事就得付钱。我还没老到干不动自己的活！
          emotion: angry
        - id: ch03-b17
          speaker: celandine
          text: >-
            我不要钱，您叫我做什么都行。我只想在这个僻静地方安静地生活。
        - id: ch03-b18
          speaker: old_woman
          text: >-
            我知道你想骗我。就算我留下你，你穿得比我好这么多，像话吗？你要是肯把衣服给我，换上我给的衣裳，我倒可以考虑。反正我越来越老，以后也许真需要人照顾。
        - id: ch03-b19
          speaker: celandine
          text: 求您可怜我吧。我的衣服随您处置！
          emotion: sad
        - id: ch03-b20
          speaker: narrator
          text: >-
            老太婆听见这话，立刻精神百倍。她一瘸一拐地走开，很快抱来一个小包袱，里面装着一件公主生平从未见过的破衣裙。她的动作忽然灵活得出奇，围着白屈菜跳来跳去，急忙帮她脱下华服，换上那件破衣。每脱下一件，她都要翻来覆去地察看，仿佛已经在盘算这些衣料能给自己做些什么。
        - id: ch03-b21
          speaker: old_woman
          text: >-
            圣人保佑！这衬里多华贵，衣料又这么宽，够我做四件衣裳了。孩子，你压着这么重的东西，怎么走得动？在我这小屋里，你穿着它连身也转不了！
        - id: ch03-b22
          speaker: narrator
          text: 老太婆把长袍仔细叠好，妥善收起来。
        - id: ch03-b23
          speaker: old_woman
          text: 我这件衣裳真是再适合你不过。千万好好爱惜啊。
        - id: ch03-b24
          speaker: narrator
          text: >-
            到了晚饭时间，老太婆拒绝公主的一切帮忙，独自走进屋里。不一会儿，她端出一个小得可怜的盘子，郑重宣布该吃饭了。她先递给白屈菜一小块黑面包，再揭开盘盖。公主一看，盘里只有两颗西梅干。
        - id: ch03-b25
          speaker: old_woman
          text: >-
            咱们两个人分一颗。你是客人，有核的那一半归你。不过别吞掉果核，我要留着冬天烧火。听我一条免费的劝吧，买水果一定要买带核的，这样才省钱。
        - id: ch03-b26
          speaker: narrator
          text: >-
            公主满心悲愁，根本没听见这番精明的教诲，连自己的半颗西梅也忘了吃。老太婆欢欢喜喜地把它收起来，留作早餐。
        - id: ch03-b27
          speaker: old_woman
          text: >-
            我对你很满意。只要你一直像今晚这样，咱们一定处得很好。我还能教你不少寻常人不知道的实用本领。仔细瞧瞧我的屋子吧，它全是用我一辈子吃过的梨核盖成的。别人吃完梨，随手就把梨核丢掉。可见只因为少了那么一点耐心和巧思，人们不知白白浪费了多少能派上用场的东西！
        - id: ch03-b28
          speaker: narrator
          text: >-
            白屈菜实在无法对梨核和这类省钱妙计产生兴趣。老太婆很快便催她上床，生怕多吹一会儿夜风会让客人胃口大开。公主躺了一夜，始终没有合眼。第二天早晨，老太婆却煞有介事地说，自己听见她睡得香甜极了。
        - id: ch03-b29
          speaker: old_woman
          text: >-
            睡了这么好的一夜，你准不用吃早饭。你还是躺着吧，睡得越多，吃得越少。今天赶集，我正好进城花一个便士买面包，够咱们吃上一星期。
        - id: ch03-b30
          speaker: narrator
          text: >-
            老太婆还在喋喋不休，公主却既没听见，也不在意。她独自走到荒凉的乡野里，思量自己的悲惨命运。山毛榉林仙女可不愿让白屈菜活活饿死，便送来一份意想不到的救济，一头温顺美丽的白牛。白牛一路跟着公主回到小屋，老太婆看见以后，欢喜得简直不知道该怎么办才好。
        - id: ch03-b31
          speaker: old_woman
          text: >-
            这下有牛奶、奶酪和黄油了！牛奶多好啊，可惜贵得简直要人破产！

    - id: ch04
      title: 溪边重逢
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            她们给白牛搭了个树枝小棚。这头美丽的牲口性情十分温顺，白屈菜每天带它出去吃草，它总像小狗一样跟着公主。一天早晨，白屈菜坐在一道小溪边，独自伤心地想着心事，忽然看见一个陌生青年向自己走来。她赶紧站起身，打算避开他。
        - id: ch04-b02
          speaker: narrator
          text: >-
            那人正是羽毛头。他也在同一刻看见公主，便满脸欢喜地冲过来。因为他认出的不是自己轻视过的白屈菜，而是画像中那位寻觅已久的美人。原来，山毛榉林仙女认为白屈菜受的惩罚已经够了，便解除了她身上的魔法，再把魔法转到王子身上。羽毛头转眼失去俊美的容貌，而那副好相貌原本正是他变得朝三暮四的一大原因。
        - id: ch04-b03
          speaker: narrator
          text: >-
            王子扑倒在白屈菜脚边，恳求她不要离开，至少停下来同自己说几句话。公主最后答应了，却只是因为看得出，这个陌生人实在太渴望她留下。从此，王子每天都来到小溪附近，希望再次遇见白屈菜。两人一次次交谈，他也常常说，与她相伴令自己多么快乐。可公主一直把他当作不认识的青年。一天，他又苦苦请求公主爱他。白屈菜只好吐露实情，她的整颗心早已完全属于另一个人。
        - id: ch04-b04
          speaker: celandine
          text: >-
            我的不幸，就是爱上了一位王子。他朝三暮四，轻浮傲慢，只关心自己，又被奉承宠坏了。更糟的是，他根本不爱我。
          emotion: sad
        - id: ch04-b05
          speaker: featherhead
          text: 这样一个卑劣无用的人，你怎么还会爱他？
          emotion: surprised
        - id: ch04-b06
          speaker: celandine
          text: 唉，可我就是爱他。
          emotion: sad
        - id: ch04-b07
          speaker: featherhead
          text: >-
            你的美貌竟不能打动他，他的眼睛到底长在哪里？我得到你的画像以后，走遍整个世界寻找你。如今见到真人，才知道你比我能想象的还要美十倍。只要能得到你的爱，我愿意献出一切。
        - id: ch04-b08
          speaker: celandine
          text: 我的画像？难道羽毛头王子竟把它送给你了？
          emotion: surprised
        - id: ch04-b09
          speaker: featherhead
          text: >-
            美丽的公主，他宁可舍弃性命，也不会舍弃这幅画。这一点我最清楚，因为我就是羽毛头王子。
        - id: ch04-b10
          speaker: narrator
          text: >-
            就在这一刻，山毛榉林仙女解除了王子身上的魔法。幸福的白屈菜终于认出了心上人。这一次，王子真正属于她了。两人经受的磨难已经改变了他们，也让他们成为更好的人。他们终于学会怎样真心相爱。你不难想象，两个人有多么幸福，又积攒了多少话要听、多少话要说。
        - id: ch04-b11
          speaker: narrator
          text: >-
            天色渐渐晚了，他们终究得回到小屋。走在路上，白屈菜这才第一次想起，自己身上还穿着老太婆给的破衣服，模样一定古怪极了。羽毛头却坚称，这身衣裳非常衬她，还显得别有一番动人的风致。可两个人一到门前，老太婆便十分不客气地迎了出来。
        - id: ch04-b12
          speaker: old_woman
          text: >-
            果然没错，哪里有个姑娘，过不了多久就会冒出一个小伙子！不过我可不留你。门儿也没有，快滚吧，你这个漂亮家伙！
          emotion: angry
        - id: ch04-b13
          speaker: narrator
          text: >-
            面对如此无礼的接待，王子本来有些生气。可他实在太幸福，懒得计较，只代表白屈菜提出一个要求。老太婆应当归还公主自己的衣服，让她穿戴体面地离开。这个要求顿时让老太婆大发雷霆。她原本打算靠那批华服穿一辈子，气得王子说了半天也插不上话。直到他解释说愿意花钱买回衣服，她才肯听进去。
        - id: ch04-b14
          speaker: narrator
          text: >-
            王子拿出一把金币，老太婆的怒气才稍稍平息。她先逼两个人郑重保证，无论发生什么，绝不会把钱讨回去，才领着公主进屋。她心不甘情不愿，一件一件往外拿，最后只交出刚好够白屈菜穿戴整齐的衣饰，剩下的全推说已经丢了。折腾完以后，两人才发觉肚子饿了。毕竟，人不能靠爱情生活，就像不能靠空气生活。老太婆又放声哀号，仿佛叫这么幸福的人吃一顿饭，足以让她倾家荡产。
        - id: ch04-b15
          speaker: narrator
          text: >-
            王子渐渐面露怒色，她才一边叹气，一边嘟囔着拿出一小块面包、一碗牛奶和六颗西梅。恋人们对此已经十分满足。他们只顾看着对方，根本不知道吃进嘴里的是什么。两个人仿佛永远也回忆不完。王子讲起自己怎样走遍世界，从一个美人找到另一个美人。每次发现对方不像画像，他就失望地继续上路。公主则想不通，王子曾经与她相处那么久，怎么始终认不出来。可她还是一遍又一遍地原谅他从前的冷淡和傲慢。
        - id: ch04-b16
          speaker: celandine
          text: >-
            你瞧，羽毛头，我爱你。只要有爱，一切都会好起来。不过，我们不能一直留在这儿。下一步该怎么办？

    - id: ch05
      title: 回到绿叶宫
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            王子想了想，觉得最好的办法是去找山毛榉林仙女，再次投到她的庇护之下。白屈菜也赞成这个主意。两个人刚刚商量好，还没来得及动身，两辆缠满茉莉和忍冬的小车便凭空出现。他们各自登上一辆。小车立刻飞驰起来，眨眼间便载着恋人奔向绿叶宫。
        - id: ch05-b02
          speaker: narrator
          text: >-
            小屋还没有从视线中消失，他们便听见老太婆高声哭喊，声音里满是心疼。两人回头一看，那头美丽的白牛正在一点点消失。老太婆发疯似的紧紧拉住它，却全无用处。后来他们还听说，她把余生都耗在同一件事上，不停地试着把王子给的那把金币装进钱袋。仙女要惩罚她的贪婪，施了魔法，叫每枚金币刚放进去便立刻滑出来。
        - id: ch05-b03
          speaker: narrator
          text: >-
            山毛榉林仙女张开双臂，跑来迎接王子和公主。她发现两个人经历磨难以后，已经改掉许多缺点，心里欢喜极了。如今，她终于可以问心无愧地重新宠爱他们。没过多久，萨拉迪娜仙女也赶到了绿叶宫，还把羽毛头的父亲和母亲一同带来。
        - id: ch05-b04
          speaker: narrator
          text: >-
            白屈菜来到萨拉迪娜面前，请求她宽恕自己当初的任性。萨拉迪娜大方地答应了。公主这时实在太可爱，叫她无论如何也不忍心拒绝。她不但原谅了白屈菜，还把夏岛归还给公主，又许下承诺，从此无论遇到什么事，都会保护她。
        - id: ch05-b05
          speaker: narrator
          text: >-
            山毛榉林仙女又告诉国王和王后，他们从前的臣民已经把棕熊国王赶下王位，眼下正满怀希望，等着迎接两人回国。夫妻俩听完，却立即宣布退位，把王位让给羽毛头。他们说，自己已经习惯山谷中的溪流、棚屋、羊群和宁静日子，无论什么也不能叫他们放弃这样的生活。两位仙女只好答应妥善安排，让王子和公主回到各自美丽的王国，安安稳稳地登基。
        - id: ch05-b06
          speaker: narrator
          text: >-
            就在所有人重逢后的第二天，羽毛头与白屈菜举行了婚礼。两个人从此永远幸福地生活在一起。这份幸福之所以长久，是因为他们都把磨难中的教训牢牢记住。白屈菜再也没有虚荣过，羽毛头也再没有朝三暮四。
        - id: ch05-b07
          speaker: narrator
          text: 下一个故事，叫作《铃兰王子与扎扎公主》。
