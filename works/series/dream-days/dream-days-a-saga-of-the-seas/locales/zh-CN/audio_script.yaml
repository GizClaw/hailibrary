audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 机智而从容，带着温和的回望
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
  chapters:
    - id: ch01
      title: 被放逐的男人
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 有一天，家里来了几位我不常见的太太。听起来，她们受了莫大的委屈，怨气全冲着“男人”而来。她们说的既是世上的男人，也是“男人”这种东西。那两个字明明只能听见，我却觉得她们尖酸的声音替它加上了一个大写字母。
        - id: ch01-b02
          speaker: narrator
          text: 严格说来，我并没有参加谈话。我在她们脚下那个小世界里忙自己的事。那里有椅子腿、炉前地毯和沙发底。太太们远在头顶说个不停，只把我当成椅子的一条腿，甚至比椅子腿还不如。不过，那时我还不懂得怀疑大人，所以一直恭恭敬敬地听着。
        - id: ch01-b03
          speaker: narrator
          text: 她们列出的罪状很重。说男人不机敏，不体贴，不会正确理解别人，连趣味和审美也样样欠缺。照她们的说法，我们就像大自然还没出师便随手做坏了的学徒作品，穿着短裤，却已经长出胡子。我听得精神都要贫血了，几乎想倒在地毯上。偏偏一位太太转身时裙子一扫，把我整团英勇的锡兵撞倒，却不道歉，也不肯帮忙把战线重新排好。我觉得，她自己在机敏和体贴上也很有进步的余地，于是相当直接地说出了这个意见。
        - id: ch01-b04
          speaker: narrator
          text: 这一下，我的社交生涯当场结束。对客人无礼是绝不能宽恕的罪。两秒钟之内，我就接到命令，只得阴着脸向育儿室那座圣赫勒拿岛进发。踏上楼梯时，我忽然想起当天早晨玩过的木筏游戏。
        - id: ch01-b05
          speaker: narrator
          text: 木筏游戏是永远不会过时的。哪怕海水全干了，树木全砍光了，它还会继续有人玩。我们挤在危险的小平台上，塞莉娜同我占一样多的地方，夏洛特垂在外面的腿也不比哈罗德多。热带烈日公平地晒着每一个人。四周是无边的太平洋，饥饿鲨鱼的背鳍一道道划破水面，而它们绝不会因为谁是男孩或女孩，就改变自己的胃口。最后一块饼干分成四份，最后一桶水也在四个人之间传递，女孩子每人正好拿到四分之一。夏洛特唯一得到的优待，是负责发现天边的救命船帆并大声欢呼，可那只是因为轮到她了，跟她是什么人毫无关系。既然木筏的规矩就是人生的规矩，楼下的太太们究竟在抱怨什么呢？
        - id: ch01-b06
          speaker: narrator
          text: 我既迷惑又不高兴，推门走进空荡荡的育儿室。那条承载过无数希望和恐惧的木筏还停在海面上。只看外表的人会说，那不过是一只圆擦澡盆，放在倒下的松木毛巾架上，既不浪漫，也不像船。就连我爬进盆里，蜷起身子准备独自航行时，也觉得早晨的光彩淡了些。可是毛巾架并不平，浴盆立刻轻轻摇荡起来，而且一直摇个不停。过了几分钟，古老的魔法又涨满四周，我已经真正出海了。楼下的女人不需要我们，又有什么关系？别处还有别的女人需要我们。这不是挤在木筏上的小打小闹，而是“男人”装备齐全、目标明确的一场远航。他要去寻找本该属于自己的东西。
    - id: ch02
      title: 从冰山到海盗船
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 我该往哪里去，又该选什么船？全英格兰的船都可以任我挑选，世界最远的角落也都是我的产业。一个有志气的男孩似乎应该乘巡航舰出发。可头一回便指挥巡航舰，多少有点自高自大，以后的雄心也没地方再长。真正的英雄总会在冒险中赢得大船，把横帆舰留给最后的功业和凯旋。所以，我决定脚下是一艘双桅纵帆船。它的桅杆凶猛地后倾，浪花贴着低矮的黑船舷嘶嘶奔过。冒失的少年也许只坐一艘单桅艇便敢出发，我却谨慎得多。我知道，前面等着我的事情很严肃。
        - id: ch02-b02
          speaker: narrator
          text: 若换个清闲日子，我本可以在港口慢慢挑船，挑伙伴，装货，再把私人舱室布置好，让每样紧急时需要的东西都伸手可取。那本会是很大的乐趣。可这一回，我饿极了似的渴望冒险，一刻也等不得。测深线够不到的远海上，巨浪正向西奔跑，呼唤着我。信天翁停在空中，像是在等我去做同伴。一千座岛各藏着一场新冒险，严严实实地收好，仿佛专门替我封存至今。普通旅客还在把旅行袋和毯子从火车搬上每日一班的乏味客轮，还得去游步甲板找个避风位置，我们早已迎风驶过英吉利海峡。浪花打进眼里，帆索一路奏着音乐。
        - id: ch02-b03
          speaker: narrator
          text: 船还在领航水域时，我像个男子汉一样守住舵轮。这场远航是我的事业，责任自然也是我的。我们绕过一处处难走的岬角和海湾，终于迎上外海巨浪，把陆地留在身后。等大西洋在眼前铺开，我忽然觉得，回自己的舱里独自喝茶应该很舒服。于是，我需要发明几位伙伴，让他们轮班掌舵。
        - id: ch02-b04
          speaker: narrator
          text: 凑齐船员并不困难。我从认识的男孩中挑一两个同龄朋友，从读过的书里请来一两个人物，再从无人之境找一两个天生的水手。我在艉楼上给他们训话，排好值班时辰，又吩咐只要发现海盗、鲸鱼或者法国人，就立刻来叫我。交代完毕，我终于可以下舱，享受理应得到的休息。
        - id: ch02-b05
          speaker: narrator
          text: 舱门在身后咔嗒关上，里面样样合意。首先当然要找武器。架上果然摆着几十支枪，有双筒猎枪、连发步枪、长手枪，还有锃亮的左轮。我按铃点了茶和司康饼，果酱必须连原罐端来，我才不要浅玻璃碟里那一点小气的分量。等衣服沾够果酱，肚子灌足热茶，我又巡视军械库，让步枪和左轮咔咔作响，用拇指试过弯刀的锋刃，把子弹带装得再也塞不进去。所有东西都是上品，仿佛我真在普利茅斯花了两个星期亲自采购。这次航行若是出事，绝不会怪装备不足。
        - id: ch02-b06
          speaker: narrator
          text: 我刚要查看柜子和抽屉，值班水手便报告，左右船头都有冰山，而且冰山上成群结队全是北极熊。我抓起步枪赶上甲板。两边同时出现冰山，景象通常都会很壮丽，眼前这两座又格外巨大。可我不是来画皇家美术院作品的。水手长的哨音还没停，船长艇已经下水，船员也坐齐了。大家使劲向北极熊划去，我带着枪坐在艇尾。
        - id: ch02-b07
          speaker: narrator
          text: 那天下午，我踏遍冰山，射猎痛快极了。也许是我状态特别好，也许是北极熊“飞”得特别漂亮，总之，猎获多得惊人。后来我读到北极熊越来越稀少，良心也曾不安。可在当时，我一点也不后悔，更没觉得那堆猎物有什么过分。等大堆熊皮一张张吊回船上，划船追猎的水手也各自喝过一大杯烈酒，我便命双桅船转向正南。冰山暂时已经玩够，该去找点真正有热带气息的东西了。
        - id: ch02-b08
          speaker: narrator
          text: 后来的事情证明，“热带气息”这几个字实在说得太轻。第二天上午班敲到三响，瞭望手发现一艘海盗双桅横帆船。我第一眼就不喜欢它，立刻吹哨叫全体船员进入战位，又让他们把前甲板的黄铜短炮塞满葡萄弹，一直堆到炮口。
        - id: ch02-b09
          speaker: narrator
          text: 这番准备果然没有白费。那艘恶劣的海盗船挂着瑞士国旗偷偷靠近。当时我们同瑞士的关系明明十分友好，它却忽然在桅顶升起骷髅旗，贴着我们发射实心炮弹，把几名十分要紧的船员轰得四分五裂。我看见散落的手脚，怒火一下升到顶点，马上把整炮葡萄弹还给他们，效果可怕得很。转眼间，两艘船已经挤在一起摩擦。刀剑带着冷光出鞘，死战开始了。
        - id: ch02-b10
          speaker: narrator
          text: 黄铜炮虽然杀伤了不少敌人，海盗的人数仍有我们的三倍。我不能把数字说得更低，那会有损荣誉。对付海盗，至少要以一敌三才像样。何况他们人人都是身带旧刀疤的老兵，我的船员却有许多连十岁所带来的成熟都还没得到。事情来得突然，我也没空再发明一批年长的援军。于是，登船队拿着斧头，嘴里咬着弯刀，一次次杀上海盗船，又一次次退回来。很快，我们自己取用不尽的鲜血便把甲板弄得湿滑。就在最危急的时候，水手长抓住我的手臂，叫我看远处一艘刚刚停住的英国军舰。旗号手举着望远镜说，那艘军舰正在问，我们要不要帮忙，还是打算自己把这件小事做完。
        - id: ch02-b11
          speaker: narrator
          text: 这话说得很客气，实质上却想分走我们的荣誉，我立刻被激起了斗志。我擦掉眼里的血，叫旗号手用现有的六面旗子回答。我们当然钦佩正规军的勇气，也感激各位长官体贴入微。不过，眼前是少年绅士冒险家对阵没刮胡子的海盗，这是最标准不过的局面。女王的海军只须照惯例待在背景里，负责欣赏和喝彩。我重新召集残余的忠实船员，换了一把弯刀。前面三把都已经用坏。随后，我又冲进那场令人愉快的厮杀。
        - id: ch02-b12
          speaker: narrator
          text: 胜负很快便确定下来。我也不能让它继续拖延，因为海盗已经让我有些厌烦，我还想到更南方、更舒服的地方去。我登上后甲板，砍倒海盗头子，认真的抵抗就此结束。那位黑胡子首领按他自己的标准还算威风，只可惜挡刀刺剑的功夫太过时。没被我们砍死的海盗，全按照古老的办法走上自己的跳板。排水孔慢慢清掉甲板上的血，大家终于又能通行。那艘英国军舰则始终在远处欣赏喝彩。
    - id: ch03
      title: 公主与南海群岛
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 割喉和冲洗这些必要工作一做完，船员们便开始搜寻财宝。很快，甲板上铺满金锭、墨西哥银元和教堂银器，亮得耀眼。那里还有成串珍珠、大堆牛轧糖、红宝石、金表和整桶土耳其软糖。我把这些小东西留给船员，自己继续寻找。因为我已经决定，海盗船上理应藏着一位公主。恶人要把她卖给大胆凶狠的摩尔人，而她正在心跳不止地等待我这位梦中的珀耳修斯来救她。
        - id: ch03-b02
          speaker: narrator
          text: 我终于在船尾大客舱里发现了公主。她在公主礼服外穿着麻布围裙，棕色卷发一直垂在背后，像极了某个人。不过这不重要，她有棕色卷发就是了。体面人相见，总要互相客气。我们按照最正确的礼数，说了许多恭维话和回敬的恭维话，我就不拿这些去烦别人了。我平时见了女人容易舌头打结，所以这种舌头忽然灵便起来、话也顺畅流出的场合，实在叫人高兴。等礼节结束，我们并排坐在桌上晃腿，约定从此做最好的朋友。我拿出新刀给她看。那是一把厉害极了的单刃角柄刀，用绳子挂在脖子上。她也打开一只最隐秘、最特别的柜子，给我看船上最好的宝物。一只是玻璃盖的音乐盒，可以看清里面的机件。还有一列火车，配着真正的铁轨和真正的隧道，以及一艘会跟着磁铁走的铁皮装甲舰。它在许多方面都比远处那艘全尺寸的真正军舰好用得多，而那艘军舰仍然停在那里欣赏喝彩。
        - id: ch03-b03
          speaker: narrator
          text: 那天夜里，我的舱里举行盛宴。英国军舰的舰长当然也受到邀请。公主坐在桌子一头，我坐另一头。舰长非常和气，给我们讲童话，请我们明年圣诞节去他家，还答应让我们骑真小马打猎。他走时，我送了几块金锭，又送他坐进小艇。接着，我巡遍全船，向船员作了几篇正式演说，把他们感动得不得了。我还亲手给短炮填满葡萄弹，直到炮口都堆不下。事情办妥，我同公主回舱锁门。我们轮流给音乐盒上发条，又在炉上熬太妃糖，让火车绕屋奔跑，一次次穿过隧道。最后，我们把铁皮装甲舰放在浴盆里，把肥皂碟当作海盗船。
        - id: ch03-b04
          speaker: narrator
          text: 第二天一早，空气中飘满香料气味，鼠海豚在船头附近翻滚玩耍，南海群岛完整地出现在前方。那当然是真正的南海群岛，不是地图上那些布置寒酸、粗制滥造的岛。海盗船和英国军舰后来去了哪里，我也说不清。它们暂时已经把角色演得很好，我不想费神替它们一一安排下场，就让它们安静地消失了。眼前的群岛有的是新事情。银色沙滩的小海湾里爬着陆蟹，棕榈林里的猴子蹦跳追逐，互相扔椰子。岛上到处都是洞穴、适合修建栅寨的地点，还有用骷髅郑重标出的隐秘宝藏，多得简直泛滥。各种颜色、来自各处纬度的飞禽走兽不断发出悦耳声音，叫人一听便想打猎。
        - id: ch03-b05
          speaker: narrator
          text: 岛屿彼此离得很近，船要穿过弯弯曲曲的水道，必须格外小心。舵轮当然不能交给别人。于是我忙了一阵，竟把船上的公主忘得干干净净。男人碰上真正的正事时，往往就是这样。锚一落下，我便重新想起她，赶快下舱安慰，又陪她吃早饭，还让她负责倒茶，这样就算完全补偿了。饭后，我们乘船长艇在各岛之间划来划去，又涉水，又探险，还猎取野牛、甲虫和蝴蝶。凡是想找的东西，我们全找到了。我送她粉红贝壳、乌龟、大颗乳白珍珠和绿色小蜥蜴。她回送我豚鼠、能做背心纽扣的珊瑚、驯服的海獭和真正的海盗火药角。这一天收获太多，时间也长得像不会结束。等我们爬回小艇，划去吃一顿很晚的下午茶，早已被打猎和搜集累坏了。
        - id: ch03-b06
          speaker: narrator
          text: 到了次日，我的良心忽然站起来指责我。出海并不是为了同珍珠和长尾鹦鹉消磨时间，也不是为了在露天吃山药和香蕉。这些事情怎么能叫创造历史？我决定不再耽搁，要照原来的计划夺取法国巡航舰。早潮一到，我们便起锚升帆，直奔圣萨尔瓦多。
    - id: ch04
      title: 夺取法国巡航舰
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 我当然不知道圣萨尔瓦多究竟在哪里，如今也还是不知道。但有一座海湾，湾里停着一艘等人夺取的法国巡航舰，那地方就应该有这样一个响亮的名字。所以，我们驶向圣萨尔瓦多。当晚敲过八响左右，船到了海湾。越过遮蔽港口的岬角，我们看见了法国舰的桅顶，立刻召开军事会议。
        - id: ch04-b02
          speaker: narrator
          text: 军事会议可不是小事。以前对付海盗之类的人，用不着这么庄严。可这回几乎牵涉国际关系，必须严肃地按步骤行事。于是，大家来到我的舱里开会。公主、水手长、一个现实中认识的男孩、一个书里的人、一个无人之境来的家伙，还有担任主席的我，全都出席了。
        - id: ch04-b03
          speaker: narrator
          text: 水手长过去参加过无数次夺舰，会上差不多只有他在说，仿佛他一个人就是整场军事会议。他说，行动要靠小艇。一艇人去砍断锚索，两艇人偷偷爬上巡航舰，制服熟睡的法国船员，另外两艇人把敌舰拖出海湾。我的船员本来没有这么多，可这种场合值得破例。没过多久，我就把人数补足了。
        - id: ch04-b04
          speaker: narrator
          text: 那晚既没有月亮，也没有星星，一切都是我安排的。小艇离开我们的船，驶向那艘被命运挑中、注定载我凯旋回国的巡航舰。我心情极好，跨过船舷时甚至冒出一个大胆得不守规矩的念头。也许舰上还有一位公主，这次会是法国公主。我听说法国的公主相当不错。不过，我马上想起历史上的英雄全以忠贞不移闻名，便放弃了这个打算。
        - id: ch04-b05
          speaker: narrator
          text: 我从舱窗爬进去时，法国舰长正舒舒服服地睡在床上。我把出鞘的弯刀抵住他的喉咙，他自然大吃一惊，也害怕得很。我立刻发表了一篇备好的演说。我告诉他，他的船员已经被关进舱口下面，巡航舰也正在拖出港湾。只要他识趣地接受现实，我就会尊重他本人和他的私有财物，因为他代表着一个伟大国家，而我对这个国家怀有最深的敬佩、仰慕，以及诸如此类的感情。那真是一篇漂亮的演说。法国舰长照惯例保证不逃跑，又作了一篇有力而感人的回答，只求我出去片刻，好让他穿上裤子。我很有风度地同意了，这件事便告结束。
        - id: ch04-b06
          speaker: narrator
          text: 岸上炮台击沉了两艘小艇。争夺巡航舰时，双方贴身搏斗，几名勇敢的船员受了重伤。不过，水手长的战术十分高明，我一开头又冒险控制住法国舰长，所以死的人并不多。这场胜利显得比较温和，是我特意为了公主安排的。若只顾我自己，流点血，挨几发烧红的炮弹，再让碎木片到处乱飞，倒十分合我心意。可身边有女孩子，总要多少照顾她们。
        - id: ch04-b07
          speaker: narrator
          text: 当晚驶到远海后，我的舱里又开了一场晚餐会。法国舰长是主宾，谈兴好得不得了。我们结成生死之交，又互相邀请对方来家里住，最后简直劝不动他离席。好容易，他和船员终于被塞进小艇。我又送他们一些海盗的金银，话说得很婉转，态度却亲切得不许拒绝。这群勇士感动得再也忍不住。我们告别时，彼此都深深体会到对方是多么宽宏，又是多么豪爽。
        - id: ch04-b08
          speaker: narrator
          text: 第二天，我们几乎一直在搬家，搬进那艘正大光明又轻松赢来的新巡航舰。凡是发达以后换过大房子的人，都明白这是多么愉快。两边船舷如今排满森严的黑色大炮，那门没用的黄铜短炮终于可以丢开。我也终于有了真正的横帆舰，上面有真正的桁和像样的后甲板。一次出航能达到的最高处，我已经达到。现在正该回家大出风头，炫耀一番。这个海洋剧场唯一不好的地方，就是没有一群真正懂得欣赏的观众。再精彩的功业若没人看见，终究少了点意思。
        - id: ch04-b09
          speaker: narrator
          text: 抛下南方海域剩余的冒险，当然有些可惜。我还没去捕鲸，也没真正尝到探索未知地方的乐趣。那些从未见过白人的内陆奇城还在等我，沉船和救援的故事更是连封面也没打开。只要留下来，海上还有许多现成的功业可以完成。可是，我已经赢得一艘巡航舰和一位公主。拿第一次冒险来说，成绩很不坏。光凭这两样，已经足够回去大大炫耀，叫那些守在家中绕磨盘、既迟钝又没有冒险精神的人看个明白。
    - id: ch05
      title: 凯旋的铃声
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 归途在速度上创下纪录。我们飞快前进，把一路的冒险轻蔑地留给那些尚未取得荣誉的人。第二天刚过中午，我们已经在普利茅斯湾下锚。钟声使人陶醉，大炮隆隆轰响，激动的人群发出嘶哑的欢呼，涌向码头。听见这一切，我们知道大家终于差不多按真正的价值来赏识我们了。
        - id: ch05-b02
          speaker: narrator
          text: 市长大人和几位海军元帅等在那里。公主和我走在前面，身后是经历战火和风霜、满载财宝的船员。热情的德文郡人从两边推挤上来，给我们让出一条路。所有人都赞叹法国巡航舰、海盗财宝，还有我们年轻手脚上新鲜的伤疤。不过，我最喜欢听的，是他们全说公主可爱极了。她是无与伦比的棕发宝贝，配得上英雄，也确实是最纯正的公主。
        - id: ch05-b03
          speaker: narrator
          text: 四周全是宴请，空气里已经飘来市政宴会做到一半的香味。可我严厉地挥手，推掉了全部庆典。我一上岸便叫来的四马大车堵满整条大街。马嚼着衔铁，蹄子不停刨着碎石，催我们立刻上车。真正的演出还在家里等候，同它相比，眼前这些不过是幕间休息。我把公主安置在镀金最多、最气派的马车中，自己登上她身旁的座位，其余船员则各凭本事挤进别的车。车夫扬鞭，鞭梢啪啪作响。人群一边散开让路，一边追着我们欢呼。车队飞奔回家，喧闹的钟声忽然奏起送别乐章。
        - id: ch05-b04
          speaker: narrator
          text: 不错，那分明是平日召我们去教室吃茶点的铃声。我从浴盆里爬出来，觉得的确该走了。盆底越来越硬，身体上突出的骨头都硌得难受。我比平常更饿，蹬蹬跑下楼。前门那边飘来一声声告别，几位瘦削年长的女客正沿着小路离开，她们的谈话声也越去越远。看来，“男人”仍在挨骂，直到临走还被她们数落得不轻。
        - id: ch05-b05
          speaker: narrator
          text: 可是，“男人”才不在乎。海洋和岛屿全是他的。巡航舰等着他去夺取，海盗和他们的宝藏，也不过要他随手挥上一两刀。在世界的某个地方，还有许多公主正等待着他。她们全是最合适的那一种公主。
