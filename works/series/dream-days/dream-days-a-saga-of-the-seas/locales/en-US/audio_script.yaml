audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: reflective, lightly amused, and intimate
        timbre: warm and clear
        pace: measured
        pitch: medium
  chapters:
    - id: ch01
      title: A Saga of the Seas
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            One day, some ladies came to call. They were not at all like the visitors I knew. As far as I could make out, they had a grievance, and the whole of it was Man. They meant men in general and every man in particular. They only spoke the word, of course, but the sharp way they said it gave Man a capital M.
        - id: ch01-b02
          speaker: narrator
          text: >-
            I was not officially part of the visit. I was down in my own little world among chair legs, hearthrugs, and the spaces beneath sofas, busy with problems that belonged to the floor. The ladies talked far above my head and took no more notice of me than if I had been a chair leg, or perhaps something even lower. All the same, I listened closely. In those days, before I knew better, I treated everything grown-ups said with great respect.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Their case against us sounded serious. They said we had no tact, no consideration, no proper understanding, no taste, and no feeling for beauty. We were rough, unfinished pieces of Nature's work. Before long, I felt ready to sink onto the carpet from sheer weakness of spirit. Then one lady swept her skirt through an entire regiment of my brave tin soldiers. She knocked every one of them flat, but she neither apologized nor offered to help restore the battle line. It seemed to me that she still had something to learn about tact and consideration herself. I told her so, and I did not hide my meaning.
        - id: ch01-b04
          speaker: narrator
          text: >-
            That finished me as far as polite society was concerned. Being rude to visitors was the one sin nobody forgave. Within two seconds I had orders to leave, and I set off sulkily for the lonely exile of the nursery. As I climbed the stairs, I found myself thinking about a game we had played that very morning.
        - id: ch01-b05
          speaker: narrator
          text: >-
            It was the good old game of Rafts. Children will go on playing it until the oceans dry up and every tree has been cut down, and probably after that too. We had all crowded onto one shaky little platform. Selina took up exactly as much space as I did, and Charlotte's legs hung over the edge no more than Harold's. The cruel tropical sun beat upon all four of us without choosing between boys and girls. Hungry sharks circled through the endless Pacific on every side, and their appetites made no difference between one sex and the other.
        - id: ch01-b06
          speaker: narrator
          text: >-
            When we divided the final biscuit and passed around the last keg of water, each girl received exactly one quarter. The only special favor went to Charlotte. She was allowed to spot the saving sail on the horizon and hail it. But that was only because her turn had come, not because she was a girl or anything else. Surely the rules of the raft were the rules of life. So what were those visiting ladies complaining about?
        - id: ch01-b07
          speaker: narrator
          text: >-
            Still puzzled and rather sulky, I opened the nursery door. The room was empty, and the raft that had carried so many hopes and fears still rested on the ocean floor. Anyone who saw only the outside of things might have thought it did not look much like a raft. It was simply a round sponge bath set inside a bare wooden towel horse that lay flat on the floor. Even I felt that some of the morning's magic had gone. Without much thought, I climbed in, curled up, and began a voyage alone.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Then the old mystery rushed back. The uneven wood beneath the bath made it rock. The movement was small, but it was easy and steady, and after a few minutes I was properly launched. So the women downstairs did not want us? There were other women in other places who did. This would be no desperate scramble on a raft. It would be a true voyage of Man, fully equipped and bound upon a purpose, going out to claim what was rightfully his.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Where should I go, and what ship should carry me? I could choose from every vessel in England, and the farthest corners of the world belonged to me. A frigate seemed the natural ship for a spirited boy. Still, commanding one at the very beginning felt a little too grand. It left ambition nowhere to climb. A frigate could always be won later through adventure, and a proper hero usually saved his square-rigged ship for the final triumph and glorious return.
        - id: ch01-b10
          speaker: narrator
          text: >-
            No, I was aboard a schooner. Her masts slanted boldly while leaping seas hissed along her low black side. Plenty of reckless young fellows began in nothing more than a cutter. I was more sensible than that, and I already suspected that serious work lay ahead.
        - id: ch01-b11
          speaker: narrator
          text: >-
            I say I was already aboard because I was far too hungry for adventure to waste time in harbor. On another day, I might have enjoyed choosing the ship and the crew, loading the cargo, and stocking my private cabin with everything I could possibly need in an emergency. This time I could not wait. Beyond the shallow waters, great seas raced west and called to me. Albatrosses hung motionless in the air, waiting for a companion. A thousand islands held a thousand adventures, all stored away for me alone.
        - id: ch01-b12
          speaker: narrator
          text: >-
            In almost no time, we were racing down the Channel with the wind close against us. Spray struck our eyes, and the rigging sang. We had made all that distance before an ordinary traveler could move his bag and rugs from the train and settle them in a sheltered corner of a dull passenger steamer. That was how quickly a ship could get under way when adventure was calling.
        - id: ch01-b13
          speaker: narrator
          text: >-
            While we remained near the coast, I stayed bravely at the wheel. The voyage was mine, so all its duties were mine too. Headlands and bays swept past, and the steering was difficult until we reached the great outer seas and watched the land fall away behind us. Once the Atlantic opened before me, though, I began to think how pleasant it would be to take tea alone in my cabin. That meant I needed to invent one or two companions who could have their turns at the wheel.
        - id: ch01-b14
          speaker: narrator
          text: >-
            That was simple. I chose a few boys my own age from real life, a few friends from books, and a few more from No-man's-land, where every fellow is born a sailor. My crew was complete. I gathered them on the afterdeck, divided them into watches, and ordered them to call me at the first sign of pirates, whales, or Frenchmen. Then I went below for a rest I had thoroughly earned.
        - id: ch01-b15
          speaker: narrator
          text: >-
            The cabin was exactly the sort a captain ought to have. I shut the door with a click and looked first for firearms. There they stood in their racks, dozens of them. I had double-barreled guns, repeating rifles, long pistols, and bright plated revolvers. I called the steward and ordered tea with scones and jam in proper pots, not in those silly shallow glass dishes. Once I was well streaked with jam and filled out with tea, I inspected the whole armory. I clicked the rifles and revolvers, tested the cutlass blades with my thumb, and packed every cartridge belt full.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Everything was there, and everything was the finest quality. It was just as complete as if I had spent two weeks in Plymouth ordering supplies. Whatever happened on this cruise, poor equipment would not be the cause.
        - id: ch01-b17
          speaker: narrator
          text: >-
            I had just begun searching the lockers and drawers when the watch reported icebergs on both bows. More important still, groups of polar bears stood on the icebergs. I seized a rifle or two and rushed on deck. The sight was magnificent. Icebergs usually are magnificent, and these were unusually enormous. But I had not sailed there to paint pictures. Before the boatswain's whistle had finished sounding, the captain's gig was in the water with its crew aboard. They pulled hard toward the bears while I sat in the stern with the rifles.
        - id: ch01-b18
          speaker: narrator
          text: >-
            I have seldom enjoyed better shooting than I found during that afternoon among the icebergs. Perhaps I was in especially fine form. Perhaps the bears rose particularly well. Whatever the reason, the size of the day's bag was tremendous. Years afterward, when I read that polar bears were becoming scarce, my conscience troubled me. That afternoon, it did not trouble me at all.
        - id: ch01-b19
          speaker: narrator
          text: >-
            The great heap of skins was hoisted aboard, and the gig's crew received a strong drink. Then I ordered the schooner to turn due south. For the moment, I had finished with icebergs. It was time for something more tropical.
        - id: ch01-b20
          speaker: narrator
          text: >-
            What came next was far beyond merely tropical. At about three bells during the following morning watch, the lookout spotted a pirate brigantine. I distrusted her at once. I called every hand to battle stations and had the brass cannon on the forward deck packed to its mouth with grapeshot.
        - id: ch01-b21
          speaker: narrator
          text: >-
            That precaution saved us. The wicked pirate vessel crept close under the flag of Switzerland, a country with which we were on excellent terms. Then she suddenly raised the skull and crossbones and fired round shot at us from close range. Several valuable members of my crew were knocked into pieces. The sight of their scattered limbs made me furious. I fired our brass cannon into the pirates with dreadful results. A moment later, the two hulls ground together, steel flashed from its scabbard, and the fight to the death began.
        - id: ch01-b22
          speaker: narrator
          text: >-
            Even after the cannon blast, the enemy still outnumbered us three to one. Honor would not let me give them smaller odds. Three to one was the very least at which a gentleman could fight pirates. They were hardened veterans, with old saber scars across every face. Many of my sailors had not yet reached the mature age of ten. The attack had come too suddenly for me to invent older reinforcements.
        - id: ch01-b23
          speaker: narrator
          text: >-
            My fearless boarding party fought forward with axes in their hands and cutlasses between their teeth. Again and again they reached the pirate deck, and again and again they were driven back. Soon our own freely given and apparently endless blood made the planks slippery. At the worst moment, the boatswain caught my arm and pointed offshore. A splendid British warship had stopped there. Its signalman was asking whether we wanted help or would rather finish the little business ourselves.
        - id: ch01-b24
          speaker: narrator
          text: >-
            The offer was polite, but it was plainly an attempt to share our glory. That made me determined to refuse. I wiped the blood from my eyes and ordered our signalman to answer with the few flags he had. We greatly admired the courage of the regular navy and the delicate feelings of its commanders. Even so, this was the proper old contest between a young gentleman adventurer and an unshaved pirate. Her Majesty's warship had only to provide the usual admiring and applauding background.
        - id: ch01-b25
          speaker: narrator
          text: >-
            I gathered the remains of my faithful crew, chose a fresh cutlass because I had already worn out three, and plunged back into the pleasant slaughter. The result did not remain uncertain for long. I would not allow it to, because pirates were beginning to bore me and I wanted something warmer and more delightful. Once I reached the quarterdeck and cut down the pirate chief, all serious resistance ended. He was a fine black-bearded fellow, but his sword fighting was sadly out of date.
        - id: ch01-b26
          speaker: narrator
          text: >-
            The pirates whom our blades had spared were marched out along their own plank in the proper old style. Before long, the ship's drains had carried off enough blood for people to cross the deck again. Through it all, the British warship stayed offshore, admiring and applauding us.
        - id: ch01-b27
          speaker: narrator
          text: >-
            When the necessary throat-cutting and deck-scrubbing were over, the whole crew searched for treasure. Soon the deck glittered with gold bars, Mexican dollars, and church silver. We found strings of pearls, heaps of nougat, rubies, gold watches, and whole tubs of Turkish delight. I left those little prizes to the crew and searched by myself. By now, I had decided that a Princess must be aboard. The pirates had captured her to sell to the wicked Moors, and she was waiting with a beating heart for me, the hero of her dreams, to rescue her.
        - id: ch01-b28
          speaker: narrator
          text: >-
            At last I found her in the grand cabin at the stern. She wore a holland pinafore over her Princess clothes, and long brown waves of hair fell down her back. Her hair looked exactly like someone else's, but never mind whose. When well-bred people meet, they exchange courtesies. I will not tire anyone with every fine compliment we paid each other, all in the most correct manner. I especially enjoyed occasions when words came easily, because with women I was usually inclined to lose them.
        - id: ch01-b29
          speaker: narrator
          text: >-
            Once the ceremony ended, we sat on the table, swung our legs, and agreed to be close friends. I showed her my newest knife. It had one terrifying blade, a horn handle, and a string that held it around my neck. Then she showed me the finest treasures in the ship, hidden in a very private locker. There was a musical box with a glass top, so we could watch it working. There was a railway train with real track and a real tunnel. Best of all, there was a tin armored ship that followed a magnet. In many ways it was much more useful than the full-sized warship still applauding outside.
        - id: ch01-b30
          speaker: narrator
          text: >-
            That night we held a great feast in my cabin. We invited the captain of the warship, since it seemed only polite. The Princess sat at one end of the table and I sat at the other. The captain was kind and pleasant. He told us fairy tales, invited us both to visit him the next Christmas, and promised us hunting on real ponies. When he left, I gave him some gold bars and other things and watched him climb into his boat.
        - id: ch01-b31
          speaker: narrator
          text: >-
            Afterward, I walked around my ship and made several formal speeches to the crew. They were deeply moved. Then I filled the brass cannon with grapeshot myself until it spilled from the mouth. With that duty done, the Princess and I went into the cabin and locked the door. First we played the musical box and took turns winding it. Then we made toffee on the cabin stove. We ran the train around the room and through the tunnel again and again. Last of all, we floated the tin warship in the bath and used the soap dish as a pirate vessel.
        - id: ch01-b32
          speaker: narrator
          text: >-
            The next morning, spices filled the air. Porpoises rolled and played around our bow, and the South Sea Islands appeared straight ahead. These were the real South Sea Islands, of course, not the poorly supplied, second-rate islands shown on maps. I cannot say what became of the pirate ship or the British warship. They had played their parts very well, but I had no wish to explain them any further. I simply let them fade away.
        - id: ch01-b33
          speaker: narrator
          text: >-
            The islands gave us more than enough to do. Little bays of silver sand were scattered with land crabs. Monkeys jumped through palm groves and threw coconuts at one another. There were caves, perfect places for forts, and hidden treasures everywhere, each one clearly marked by a skull. Birds and beasts from every color and every part of the world made exciting sounds that called out the hunter in me.
        - id: ch01-b34
          speaker: narrator
          text: >-
            The islands lay close together, so I had to steer with great care through their twisting channels. Naturally, nobody else could be trusted at the wheel. For some time, I quite forgot that a Princess was aboard. Men often behave that way when real work needs doing. But I remembered her as soon as we dropped anchor. I went below to comfort her, and we ate breakfast together. I even let her pour the tea, which made up for everything.
        - id: ch01-b35
          speaker: narrator
          text: >-
            After breakfast we ordered the captain's gig and rowed around the islands. We paddled, explored, hunted bison, beetles, and butterflies, and found everything we wanted. I gave the Princess pink shells, tortoises, huge milky pearls, and little green lizards. She gave me guinea pigs, pieces of coral for waistcoat buttons, tame sea otters, and a real pirate's powder horn. It was a wonderfully productive day and seemed to last forever. At last, tired from all our hunting, finding, and gathering, we climbed into the gig and rowed back for a late tea.
        - id: ch01-b36
          speaker: narrator
          text: >-
            The following day, my conscience accused me. I had not sailed away merely to play with pearls and parrots or eat yams and bananas outdoors. None of that was making history. I decided to waste no more time. I would carry out my original plan and capture a French frigate. We raised anchor with the morning tide and set every sail for San Salvador.
        - id: ch01-b37
          speaker: narrator
          text: >-
            I did not know where San Salvador was. For that matter, I still do not. But it sounded like the right name for a place with a bay, and the right bay to hold a French frigate waiting to be taken. So we sailed there. At about eight bells that evening, we entered the bay and saw the frigate's upper masts beyond the headland that sheltered her. I immediately called a Council of War.
        - id: ch01-b38
          speaker: narrator
          text: >-
            A Council of War is a grave affair. We had not needed one before. Pirates and such people did not deserve so much ceremony. But this business was almost international, so it seemed wise to proceed in a serious and orderly way. We gathered in my cabin. The Princess came, along with the boatswain, a real-life boy, a man from a book, a fellow from No-man's-land, and me as chairman.
        - id: ch01-b39
          speaker: narrator
          text: >-
            The boatswain had helped seize so many ships in his career that he did nearly all the talking. In truth, he was almost the whole Council by himself. He explained that we must attack in boats. One boat crew would cut the frigate's anchor cables. Two crews would climb aboard without a sound and overpower the sleeping French sailors. Two more would tow the captured ship out of the bay.
        - id: ch01-b40
          speaker: narrator
          text: >-
            Five boat crews put a heavy demand on my limited supply of men. In a case like this, however, I was willing to stretch things a little. I quickly increased the crew until we had exactly the numbers required.
        - id: ch01-b41
          speaker: narrator
          text: >-
            The night had no moon and no stars. I had arranged both details. Our boats pushed away from the schooner and moved toward the vessel that Fate had chosen to carry me home in triumph. I felt extremely cheerful as I climbed over the side. For one wild moment, I considered discovering another Princess aboard the frigate, a French Princess this time. I had heard that French ones were rather nice. Then I remembered that every hero in history was famous for his unchanging faithfulness, and I gave up the idea at once.
        - id: ch01-b42
          speaker: narrator
          text: >-
            The French captain was sleeping comfortably when I climbed through his cabin window and pressed a bare cutlass to his throat. Naturally, he was surprised and greatly alarmed. I delivered one of my prepared speeches. My men already held his crew below the hatches, I explained, and his ship was being towed out of the harbor at that very moment. If he accepted the facts with good manners, I would treat him and his private belongings with all the respect due to a representative of a great nation for which I felt the deepest admiration, esteem, and so forth.
        - id: ch01-b43
          speaker: narrator
          text: >-
            It was a beautiful speech. The Frenchman immediately gave me his word that he would not resist. Then, in a powerful and touching reply, he asked only that I step outside while he put on his trousers. I agreed with perfect grace, and that ended the matter.
        - id: ch01-b44
          speaker: narrator
          text: >-
            Cannon fire from the forts on shore sank two of my boats. Several brave fellows were badly wounded during the hand-to-hand struggle for the frigate. Even so, the boatswain's excellent plan and my own reckless courage in capturing the French captain at the start kept the number of deaths quite low. I had arranged such a mild victory for the Princess's sake. Personally, I enjoyed a fair amount of bloodshed, red-hot cannonballs, and flying splinters. But if girls are present, a fellow has to consider them at least a little.
        - id: ch01-b45
          speaker: narrator
          text: >-
            Once we were safely out at sea that night, we held another supper in my cabin. The French captain was our guest, and he was in splendid form. We swore eternal friendship and invited each other to visit our homes. In fact, persuading him to leave became quite difficult. At last, he and his crew were packed into their boats.
        - id: ch01-b46
          speaker: narrator
          text: >-
            I pressed some of the pirate gold upon them. I did it delicately, but in such a pleasant, firm way that they could not refuse. The brave fellows broke down completely. We parted with our hearts heaving under the full weight of each other's generosity and good fellowship.
        - id: ch01-b47
          speaker: narrator
          text: >-
            Nearly all the next day went into moving from the schooner to our newly and honorably acquired frigate. It was a delightful day. Anyone who has risen in the world and moved into a larger house will understand. At last, grim black guns lined both sides of my ship. I no longer had to depend on one rotten brass cannon. At last I had a square-rigged vessel with real yards and a proper quarterdeck.
        - id: ch01-b48
          speaker: narrator
          text: >-
            I had climbed about as high as anyone could hope to climb in a single voyage. It seemed time to go home, make an entrance, and show off a little. The great trouble with this ocean theater was that it offered no proper audience. I hated leaving so many adventures untouched in the southern seas. We had not hunted whales. We had not explored unknown lands or found strange inland cities that had never seen a white man. We had not even opened the great book of wrecks and rescues.
        - id: ch01-b49
          speaker: narrator
          text: >-
            Still, I had won a frigate and a Princess. That was not bad for a first voyage. It was certainly enough to impress the dull, unadventurous people who continued going around the same tired circle at home.
        - id: ch01-b50
          speaker: narrator
          text: >-
            Our voyage home broke every record for speed. We swept scornfully past all possible adventures. There was no need to stop for them now, so we left them for other travelers who still had their glory to earn. By noon the next day, we dropped anchor in Plymouth Sound. Bells rang wildly, cannons roared, and excited crowds poured toward the docks with hoarse cheers. At last, people were valuing us at something close to our true worth.
        - id: ch01-b51
          speaker: narrator
          text: >-
            The Lord Mayor waited to welcome us, surrounded by several Admirals of the Fleet. The Princess and I walked ashore between crowds of Devon people who pushed forward in their excitement. Behind us came our crew, scarred by battle, worn by weather, and loaded with treasure. Everyone said very kind things about the captured frigate, the pirate riches, and the fresh wounds on our young arms and legs.
        - id: ch01-b52
          speaker: narrator
          text: >-
            What pleased me most was what they said about the Princess. Every one of them declared that she was a darling, that no brown-haired Princess could equal her, and that she was a true companion for a hero. They all agreed that she came from exactly the right kind of Princess family.
        - id: ch01-b53
          speaker: narrator
          text: >-
            Invitations filled the air, along with the smell of public banquets that were already well under way. I firmly refused every celebration. The coaches and four that I had ordered as soon as we arrived were blocking the entire High Street. Horses champed their bits and struck the ground with their hooves. They called us onward to the real performance. Compared with what waited there, Plymouth was only a pause between acts.
        - id: ch01-b54
          speaker: narrator
          text: >-
            I placed the Princess in the most heavily gilded coach and climbed into the seat beside her. The rest of the crew crowded into the other coaches as well as they could. Whips cracked. The crowd scattered and cheered as the horses broke into a gallop for home. Behind us, the noisy bells burst into one last farewell peal.
        - id: ch01-b55
          speaker: narrator
          text: >-
            Yes. That was certainly the ordinary bell for tea in the schoolroom. It was time, too. I climbed out of the sponge bath, which had begun to feel very hard against the parts of me that stuck out most. Then I trotted downstairs, even hungrier than usual.
        - id: ch01-b56
          speaker: narrator
          text: >-
            Farewells drifted up from the front door. I heard the voices of our thin, elderly visitors as they went down the path. Apparently, Man was still being blamed. Man was still getting a very hot scolding.
        - id: ch01-b57
          speaker: narrator
          text: >-
            And how little Man cared! The seas and all their islands belonged to him. Frigates waited for him to take them. Pirates and their treasure could be won with one or two cutlass strokes that hardly counted. And somewhere, plenty of Princesses were waiting for him. Princesses of the right sort.
