  chapters:
    - id: ch01
      title: Choosing Our People
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            On long winter evenings, we spread the picture books across the floor and lay together with our elbows deep in the hearthrug. Before any story could begin, we had important work to do. Every person in every picture had to be divided among us, with the eldest choosing first and the others following in order for as long as the figures lasted. Once everyone was satisfied, the adventure could move forward. The plot was exciting by itself, but now each of us also had someone of our own inside it. That person's success became a private victory, and every setback felt like a loss.
        - id: ch01-b02
          speaker: narrator
          text: >-
            This arrangement suited Edward perfectly. As the eldest, he took the hero from the front of the book. That hero might meet trouble now and then, but he was certain to perform great deeds and finish in glory. The younger ones were left with less reliable people, and sometimes with complete villains. Still, the rules said we had to defend our chosen characters, however badly they behaved.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Edward grabbed the best parts without shame. In our Buffalo-book, named for its chief picture though it showed killing in every part of the world, he claimed the strong bearded hunter in yellow leggings with a powder horn at his side. That man fired the fatal shot into the shoulder of a charging bull bison when its muzzle was only a yard away. I had to be the lesser friend who had managed to shoot a cow. Harold got the worried-looking fellow in the background who was holding Edward's spare rifle.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Later in the same book, a magnificent chamois sprang stiffly through the air. Edward was the sportsman crouching dizzily against the face of the cliff, with a puff of white smoke drifting from his gun. All I received was the bare-kneed guide. Poor Harold could either be the boy carrying the bag on his back or give up all hope of an Alpine adventure for that occasion.
        - id: ch01-b05
          speaker: narrator
          text: >-
            The girls did even worse in that book. Naturally, they preferred Pilgrim's Progress, where women had a fair chance and there were usually enough of them to share. A good fairy tale worked too, because princesses received proper attention there. In truth, all of us liked a picture best when its people matched our number, our sexes, and the sorts of parts we wanted. To us, that perfect fit was the true test of artistic merit.
        - id: ch01-b06
          speaker: narrator
          text: >-
            We had divided up everyone in the gilt-framed Christmas pictures on the nursery wall long ago. Sooner or later, each of us found a fine, brightly colored part there. Most pictures elsewhere in the house were not so useful. They had too few people, and the people they did have rarely did anything exciting. The picture I am telling you about was dull in that way. Its people did nothing and did not even seem to want to do anything. Still, there were enough of them for all of us, so in time we divided those people too.
        - id: ch01-b07
          speaker: narrator
          text: >-
            The picture hung in a corner of the dining room, inside a black and tortoise-shell frame. We had never cared much about it and might never have divided it at all. Then the girls rebelled against one sporting book after another in which the artist seemed to have forgotten that women existed. One rainy morning, Selina marched over to the picture and chose the lady seated in the middle. Her richly flowered gown fell in straight, severe lines to her feet. A jeweled clasp held her dark blue cloak, and a crown of gold and pearls rested over her long fair hair.
        - id: ch01-b08
          speaker: narrator
          text: >-
            That seemed fair to all of us, and especially to Edward. He instantly seized the young man leaning on his shield at the lady's right hand. I felt a little stab of disappointment, though I knew Edward had chosen by the rules and everything was orderly. This was such a fine, delicate knight, and his armor was exactly what I wanted. It was fluted, scalloped, spotless, and shining. His smooth face and golden hair showed that he was little more than a boy. But the broken spear shaft in his hand proved that he was a true fighter, freshly returned from the sort of work we admired.
        - id: ch01-b09
          speaker: edward
          text: “You can have the fellow on the other side.”
        - id: ch01-b10
          speaker: narrator
          text: >-
            I hung back and said I would think about it. That other fellow had no weapon and no armor. He was only a civilian in a plain jacket with a leather pouch, and one hand pointed to a wound in his thigh. I did not care for him at all. When Harold eagerly put in his claim, I gave way and let him have the man. Only later did I learn why Harold had been so anxious. He coveted the wound. He wanted a great sore injury of his very own so he could go about showing it to people, stirring their envy or winning their respect.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Charlotte happily chose the child angel sitting at the lady's feet and struggling with an instrument much too large for her. Charlotte wanted wings more than almost anything. After wings, her next choice would have been a guitar or a banjo, so this angel offered nearly everything she could ask for. The amber necklace around the angel's neck pleased her enormously too.
        - id: ch01-b12
          speaker: narrator
          text: >-
            That settled the main figures, though two or three smaller angels still peeped or perched behind them. A quiet mischief showed in their faces. They seemed to think that the whole grand arrangement had lasted long enough, and that it was time for somebody to knock something over or start a noisy disturbance. We knew all these well-dressed people were saints and angels only because grown-ups had told us. Without that information, we would never have guessed it ourselves.
        - id: ch01-b13
          speaker: narrator
          text: >-
            The angels in our Sunday books were pale, colorless, uninteresting creatures in straight white gowns and white wings. Their figures went straight up and down. Their straight yellow hair was always parted in the middle, and their faces were serious or even melancholy. We wanted nothing to do with them. These little angels were quite another breed, as if they had hatched from an entirely different egg. Their jewels flashed, their feathers shone, their noses were short, their hair stuck out, and their mouths turned up at the corners. They plainly cared very little for their fine clothes. If only we could reach them, we felt sure we would have much in common and that they would make the best possible company.
        - id: ch01-b14
          speaker: narrator
          text: >-
            One question bothered me. Those wings would give them an enormous advantage in any game that required speed or jumping. Could they be trusted to play fairly? I asked Selina.
        - id: ch01-b15
          speaker: selina
          text: “Angels always play fair.”
          emotion: disgusted
        - id: ch01-b16
          speaker: narrator
          text: >-
            She answered with great scorn. But I looked again at the brown-faced angel peeping over the lady's chair, and I still was not convinced.
    - id: ch02
      title: Beyond the Walls
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            When Edward went away to school, we changed many of our old choices. Every hero in every illustrated book was now mine if I wanted him. Yet I did not hurry to claim the young knight in armor. Perhaps I wanted a fresh saint, not one that had belonged to Edward for so long. Or perhaps, after going without a saint of my own, I had grown used to wandering into the background and seeing what I could find there.
        - id: ch02-b02
          speaker: narrator
          text: >-
            That background was tiny, but wonderfully inviting, and it held a surprising amount. First came a meadow scattered with blue and red flowers like jewels. A white road curled in willful, unnecessary loops up a steep, pointed hill. Towers, fortified walls, and bell towers crowned the top, while little knights rode down the road in pairs. On one side, the hill dropped to a wide, quiet stretch of blue water. A very curly ship lay at anchor there, with one mast and a strange crow's-nest at its top.
        - id: ch02-b03
          speaker: narrator
          text: >-
            I found plenty to do in that pleasant country, but one thing continually annoyed me. I could never pass a certain point. However often I followed the road, I always stopped at the odd, top-heavy gateway with its little gallery. It guarded the walled town, and it always kept me outside. I felt certain that noisy celebrations were happening within, but no one would give me the password.
        - id: ch02-b04
          speaker: narrator
          text: >-
            I could climb into a boat and row as far as the curly ship, but I could not get around the headland. Beyond it, I was certain that ships lay thick in a busy harbor. Merchants paced the quay, and sailors sang while they swung corded bales ashore. Yet I was always kept on the near side. I had to remain down in the meadow and imagine everything as well as I could.
        - id: ch02-b05
          speaker: narrator
          text: >-
            One day I spoke to Charlotte about it. To my surprise, she knew the same delights and the same disappointments in that delightful country. She too had climbed the white road and flattened her nose against the portcullis. Then she showed me something I had missed. You could row to the curly ship, catch a rope, clamber aboard, swarm up the mast, and settle into the crow's-nest. From there, you could just see beyond the headland and watch the busy life of the harbor for as long as you pleased.
        - id: ch02-b06
          speaker: narrator
          text: >-
            Charlotte went on to describe all the fun in that harbor. Her account lasted so long, and every part of it was given with such exact detail, that I stopped simply listening and began to look at her with suspicion.
        - id: ch02-b07
          speaker: narrator
          text: “You sound as if you've been in that crow's-nest yourself!”
        - id: ch02-b08
          speaker: narrator
          text: >-
            Charlotte said nothing. She only pursed her lips and nodded hard for several minutes. I could get no other answer from her, and I felt rather hurt. Somehow, she had reached that crow's-nest before me. This time Charlotte had got ahead.
    - id: ch03
      title: The Great Picture Book
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Grown-ups apparently had to put on fine clothes and go visiting. We saw no sense in it. Staying home in old clothes and playing was far more reasonable. Still, grown-ups did many things we could not explain, and it was their life. Usually, their visits left us free for an afternoon of our own kind of mischief.
        - id: ch03-b02
          speaker: narrator
          text: >-
            But sometimes they came for us like a press-gang. Pleading did no good. Excuses did no good. We were forced into service like unwilling soldiers driven toward battle by the rifles behind them. There was no point arguing. The order came, and we had to be quiet and march. Selina secretly rather liked dressing up and paying calls, though she pretended not to because the rest of us disapproved. That was why I thought it especially mean of her to have an earache on the afternoon Aunt Eliza ordered the pony carriage and set out on her campaign.
        - id: ch03-b03
          speaker: narrator
          text: >-
            I was ordered into the carriage at the same time. As we rolled away, I mourned the afternoon I had planned and felt that no number of future years could ever repay its loss.
        - id: ch03-b04
          speaker: narrator
          text: >-
            We were going to what we called a big house. That name covered a whole class of homes. A big house always had a long drive between rhododendrons, a porch held up by fluted columns, and a solemn butler. He would pull back the swinging doors, come down the steps, and act as if he had forgotten every friendly meeting he had ever had with you in less serious places. Inside was a vast hall where nobody left boots, coats, or hats lying about honestly and comfortably, as we did at home. People sat around dressed as though they might leave for a party at any moment.
        - id: ch03-b05
          speaker: narrator
          text: >-
            The lady of the house greeted Aunt Eliza with overflowing warmth and greeted me with a politeness that sounded hollow. Within ten seconds, the two of them had put their heads together and begun talking hard about clothes. I sat stranded on a straight-backed chair. I longed to kick its legs, but I did not dare. For a while there was enough in the room to stare at, high up, low down, and all around. Then the fidgets arrived as they always did. Scratching my legs eased them a little, but could not drive them away.
        - id: ch03-b06
          speaker: narrator
          text: >-
            My two guards were still lost in their clothes talk, so I slipped down and began a careful tour of the room. I explored, examined, and remembered what I saw. Pictures and curious ornaments covered the walls. Trinkets, old round watches, and snuffboxes lay on the tables. I took care to handle everything I could reach thoroughly and conscientiously, and some of the objects received the additional test of being smelled.
        - id: ch03-b07
          speaker: narrator
          text: >-
            At last I found an open doorway half hidden behind a curtain. I looked back. Both ladies were still talking at once, so I slipped through.
        - id: ch03-b08
          speaker: narrator
          text: >-
            The next room made much more sense. Its walls were honestly covered in books, although most of them only glimmered through the glass doors of tall cases. I read their titles hungrily and breathed on every pane I could reach. I badly wanted what stood behind the glass, but with the enemy camped so close in the next room, I did not dare try to open a case.
        - id: ch03-b09
          speaker: narrator
          text: >-
            Then I saw a large, splendidly bound book lying alone on a high desk by the window. I lifted one corner of its pages. A flash of blue and red floated out like perfume from a jar. Pictures! Brightly colored pictures! At last I had found the right sort of thing, and my afternoon might not be wasted after all.
        - id: ch03-b10
          speaker: narrator
          text: >-
            I tilted my ear toward the doorway through which I had come. The grand, eternal problem of clothes was still flowing like a full river, bubbling, turning, and rushing without any sign that it might run dry. It seemed safe to move. The book was so fine, large, and heavy that I could barely slide it off the desk. I staggered with it to the hearthrug, the only fit and proper place for a book of such quality.
        - id: ch03-b11
          speaker: narrator
          text: >-
            The hearthrugs in that house were excellent. They were broad and soft, with a pile so thick that my knees sank deep into it. The book's stiff pages refused to stay open at first. Luckily, the coal scuttle stood beside me. I found a flat piece of coal and laid it on the stubborn page. Everything seemed to have been arranged for my comfort. Perhaps this house was not so bad.
        - id: ch03-b12
          speaker: narrator
          text: >-
            The opening pages had cheerful borders full of scrolls, straps, patterned backgrounds, and small crooked figures climbing merrily up and down. Color wandered everywhere in a splendid maze. I quickly examined the words in the middle, hoping for a clue to the story. I certainly did not mean to waste time reading. One hint, one signpost, one pointing finger would have been enough. To my disgust, every word was in some foolish foreign language. The stubbornness of some people could almost make a person despair of the whole human race.
        - id: ch03-b13
          speaker: narrator
          text: >-
            The pictures remained, and pictures never lied or made excuses. I could invent the story myself. I turned the page and moved the coal. As the design slowly separated itself from the glorious confusion of color, I first felt that I knew it. Then recognition dawned. Then certainty came, so joyful that I had to clutch my stomach with both hands to keep from shouting. It was my own little city.
    - id: ch04
      title: Inside the Little City
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            I knew it well and recognized it at once, though I had never seen it from so near. There was the familiar gateway. On the left, the strange slender tower thrust its grim square head high above the walls. On the right, outside the town, the hill dropped sharply toward the sea just as it always had. But today everything looked larger, fresher, and clearer. The walls seemed newly cut from stone. Gay carpets hung over them, while beautiful ladies and long-haired children peeped and crowded along the battlements.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Best of all, the portcullis stood open. I could even glimpse the sunny square beyond it. A graceful company rode through the gate in pairs. Long trappings swept the ground beneath their horses, and the riders themselves were the gayest, proudest company I had ever seen. All that holiday clothing and solemn splendor could mean only a wedding, I decided. Wedding or not, I meant to be there.
        - id: ch04-b03
          speaker: narrator
          text: >-
            No iron gate would stop me this time. I would slip inside with the crowd, discover what lay behind those walls, and take my share of the fun. I turned the page, certain I would succeed and almost unable to breathe from excitement.
        - id: ch04-b04
          speaker: narrator
          text: >-
            At last I was inside. I stood on the proper side of those provoking walls and looked around eagerly. It seemed to be a public square, though unlike any square I knew. The houses at the back rose above a covered walkway where people pushed past one another. Wonderful pictures covered their upper stories, and a deep blue sky stretched above the straight line of rooftops.
        - id: ch04-b05
          speaker: narrator
          text: >-
            Lords and ladies filled the foreground. In the center, on a raised platform, a brave gentleman had just dismounted from his horse. He bent to kiss the fingers of a girl dressed as splendidly as Selina's lady between the saints. Venerable people in robes of every possible color stood around them. Plenty of boys were there too. They wore tiny red caps on thick hair, and their shirts had worked loose and bunched out at the waist exactly as mine so often did after I had been chasing someone.
        - id: ch04-b06
          speaker: narrator
          text: >-
            Every boy wore two different stockings, one blue and one red. That went straight to my heart. I had tried the same arrangement many times and had always been discouraged. Here was proof, carefully painted in a grown-up book, that I had been right all along.
        - id: ch04-b07
          speaker: narrator
          text: >-
            I searched for my saintly friends, the young knight and the wounded fellow, but neither was present. They must have been unable to leave their posts in the green meadow below, even for a wedding. I was disappointed not to see a single angel either. Surely one or two could have been spared for an hour to run up and watch. They would have felt completely at home among all that color, motion, and fun.
        - id: ch04-b08
          speaker: narrator
          text: >-
            The adventure had only begun, so I turned another page. Now the whole company had gathered in a grand church. I could not tell exactly what was happening, but there among the crowd were my angels at last, happy and completely at home. They must have escaped from duty, raced up the hill, and hurried through the gate. Perhaps they had cried a little when they found the square empty and feared they had missed everything.
        - id: ch04-b09
          speaker: narrator
          text: >-
            Two angels carried enormous candles, one apiece. The candles were almost more than they could manage, and they giggled sideways at each other while wax ran freely over their clothes. A third angel had wandered among the guests and was chatting comfortably with a young gentleman. Yes, these were the right kind of angels for us. They had nothing to do with sickrooms or solemn nights in a nursery.
        - id: ch04-b10
          speaker: narrator
          text: >-
            No doubt He and She were now being married, as people always were in stories. Afterward, of course, they would live happily ever after. That was the part I wanted to reach. Storybooks were so foolish. They always stopped at the very point where everything became pleasant and interesting. But this picture story was only in its first chapters. At last I had a chance to discover exactly how people lived happily ever after.
        - id: ch04-b11
          speaker: narrator
          text: >-
            He and She would go home, and the angels and I would go with them. We would invite the young knight to stay. Then the true story would begin, exactly where other stories ended. I turned the page and came out of the dim, splendid church into open country once more.
        - id: ch04-b12
          speaker: narrator
          text: >-
            Everything was as it should be. The sky was perfectly blue, flags danced in the wind, and our laughing wedding party rode down toward the water. By now I had crossed through the town and reached the far side of the hill, where I had always wanted to go. The harbor was there, packed with curly ships.
        - id: ch04-b13
          speaker: narrator
          text: >-
            Most of the ships carried heaps of wedding gifts. I saw silk bales, gold and silver dishes, and comfortable-looking bags that surely held treasure. The gayest ship of all waited beside a landing place covered with carpet. The bride was already stepping delicately down the gangway, with her ladies following in a proper line behind her. In a few more minutes we would all be aboard. The heavy ropes would splash into the water, and the sails would fill and strain in the wind.
        - id: ch04-b14
          speaker: narrator
          text: >-
            From the deck, I would watch the little walled city fall behind us, growing smaller, sinking lower, and fading into the distance. Every plunge of our bow would carry us closer to the happy island. I knew perfectly well that we were bound for an island. I could already see its people waving from a crowded quay. Small houses climbed the hill behind them until they reached a castle that crowned everything with towers and battlements.
        - id: ch04-b15
          speaker: narrator
          text: >-
            We would ride together once more, a cheerful procession clattering up the steep street and through the stern gateway. Then we would arrive. Then we would all sit down to dinner. Then, at last, we would be home. And then—
    - id: ch05
      title: The Dream Broken
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: “Ow! Ow! Ow!”
        - id: ch05-b02
          speaker: narrator
          text: >-
            It is bitter to stumble out of a glowing, many-colored dream into cold daylight. In one cruel second, I lost a sea voyage, an island, and a castle that was almost my own. Worst and bitterest of all, I knew that Aunt Eliza's angry fingers had me firmly by the back of the neck.
        - id: ch05-b03
          speaker: narrator
          text: >-
            My beautiful book was gone too. The finely dressed lady tore it from my hands and joined Aunt Eliza's angry scolding as eagerly as if she belonged to our family. Nothing remained for me but to sob miserably. I had awakened all at once to the hardness of real things and to the countless enemies of the actual world.
        - id: ch05-b04
          speaker: narrator
          text: >-
            I cared very little about their blame, their harsh words, or their abuse. I grieved with my whole heart for my vanished ship, my lost island, my dinner that would never be eaten, and the angels I could no longer reach. If I wanted angels to play with now, I would have to accept the thin, colorless creatures in nightgowns. They hovered above a Sunday-school child's bed in the pages of the Sabbath Improver, and they were no company at all.
        - id: ch05-b05
          speaker: narrator
          text: >-
            I was led shamefully from the house, soft and watery with tears. The butler worked his swinging doors with a face as hard, blank, and unmoved as stone. That face was meant to deceive even the wisest people, but it did not deceive me. I knew that the next time he was free and wandered our way, we would meet as equals in our kitchen. I would punch him, ask him riddles, and let him teach me tricks with corks and bits of string. His unfriendly manner did not add anything to my sadness.
        - id: ch05-b06
          speaker: narrator
          text: >-
            Even after they packed us into the pony carriage and the lodge gate clicked shut behind us, I kept up a careful, useful sobbing. It served as a kind of armor against questions, arguments, and more scolding. I wanted to be left alone because I was thinking very hard. Two thoughts filled my mind.
        - id: ch05-b07
          speaker: narrator
          text: “This time, I've got ahead of Charlotte!”
        - id: ch05-b08
          speaker: narrator
          text: >-
            Then came the second thought. When I was grown and big, with money of my own and a full-sized walking stick, I would leave early one morning and never stop until I reached that little walled town. There ought not to be any real difficulty. I would ask one person here and another person there until someone showed me the way. People were usually very helpful, and I could describe every stone and stick of the place.
        - id: ch05-b09
          speaker: narrator
          text: >-
            The island would be harder, because I had never even seen it and could not describe the way there. Still, I felt completely sure that somehow, at some time, sooner or later, I was meant to arrive.
