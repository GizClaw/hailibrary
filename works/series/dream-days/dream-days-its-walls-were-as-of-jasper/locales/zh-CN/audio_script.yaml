audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 机智而从容，带着温和的回望
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
  chapters:
    - id: ch01
      title: 图画里的角色
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 漫长的冬夜里，我们把图画书铺在地板上，几个人一起趴在上面，胳膊肘深深陷进炉前地毯。故事开始以前，总有一件要紧事。画里所有人物必须按照我们的年纪，从大到小分给各人，能分到哪里便分到哪里。只有这套手续妥妥当当办完，故事才获准继续。从那一刻起，情节本身的刺激之外，又多了一份属于自己的牵挂。分到手的那个人若是成功，自己也像赢得了什么。他若遭到冷落或碰壁，那份损失也仿佛落在自己头上。
        - id: ch01-b02
          speaker: narrator
          text: 爱德华是老大，这规矩对他再有利不过。卷首彩页上的英雄总归他所有。那位英雄中间也许吃些苦，最后却一定功业辉煌。我们这些弟妹拿到的人物就复杂多了，有时甚至是个十足的恶棍。规矩又要求大家必须维护自己的角色，于是，那人明明活该丢脸，我们也得设法替另一个自己辩护。爱德华从不肯放过一个好角色，抢起来简直无可救药。
        - id: ch01-b03
          speaker: narrator
          text: “野牛书”里，那个魁梧多须、穿黄皮护腿、带着火药角的猎人，当然是爱德华。我们按最要紧的那幅画给书取了这个名字，其实书里无论哪个地方、无论什么野兽，都免不了遭到屠杀。画上，大公野牛已经冲到鼻前一码，爱德华仍朝它肩头射出致命一弹。我只配做那个打倒母牛的朋友。哈罗德更惨，只能站在后面，满脸不安地替爱德华拿备用步枪。
        - id: ch01-b04
          speaker: narrator
          text: 翻到岩羚跃在峭壁前的那一幅，开枪的猎人又归了爱德华。枪口的一缕白烟还没散。我得到一个光膝盖的向导，哈罗德只能做背干粮袋的男孩，不然就得放弃那一次的阿尔卑斯梦想。女孩子在这本书里更占不到便宜，所以她们爱看《天路历程》。那里面女人不少，通常人人都能分到。童话也好，公主总会得到重视。其实，我们最喜欢的画，人物数量、男女和本领恰好同我们吻合。在我们看来，这就叫艺术。
        - id: ch01-b05
          speaker: narrator
          text: 育儿室墙上的圣诞特刊早已分过。那些镶金框的彩图里，每个人迟早都能找到一个称心的身份，出现在色彩鲜亮的好场面里。屋里别的画往往人太少，就算有人，也缺少真正的戏剧趣味。饭厅角落里倒挂着一幅人数足够的画，装在乌木和玳瑁拼成的框里。画中人偏偏什么也不做，看起来也一点不想做，我们原本不理它。后来女孩子受够了接连几本运动图书，那些插画家像是忘记世上还有女人，她们才把主意打到这幅画上。
        - id: ch01-b06
          speaker: narrator
          text: 一个雨天早晨，塞莉娜走到画前，宣布中央那位贵妇归她。贵妇的锦袍织满花朵，衣褶庄严地垂到脚边。深蓝斗篷上扣着宝石，一头浅金长发还戴着金珠冠冕。大家觉得很公平，爱德华尤其赞成，因为他立刻抢走了贵妇右边那个倚着盾牌的披甲少年。
        - id: ch01-b07
          speaker: narrator
          text: 那少年实在秀美精致。甲胄边缘起伏，表面刻着凹槽，洁净得闪闪发亮，正是我自己最想穿的模样。金发下的脸还没长胡子，可他手里握着半截断矛，一看就是真正打过仗，才从某种痛快的战斗中回来。我明明知道整个分配过程规矩、公平、有条有理，眼看他落到爱德华手中，心里还是一阵刺痛。爱德华说，另一边那个人可以给我。我不肯马上接手，只回答，还得想一想。
        - id: ch01-b08
          speaker: narrator
          text: 另一边那人没披甲，也没有武器。他只穿短上衣，腰挂皮囊，一只手指着腿上的伤。我不喜欢他，哈罗德却赶忙认领。后来我们才明白，他看中的正是伤口。哈罗德想要一道又大又疼的伤，随身带去给人看，好让别人羡慕他，至少也敬重他。
        - id: ch01-b09
          speaker: narrator
          text: 夏洛特拿到贵妇脚边的小天使，也非常满意。那个孩子正同一件大得离谱的乐器搏斗。夏洛特最想要翅膀，其次想要吉他或班卓琴。天使颈上还有一串琥珀项链，更叫她喜欢。
        - id: ch01-b10
          speaker: narrator
          text: 还剩两三个小天使，从大人物身后探头，或栖在后面。他们脸上藏着淘气，像是觉得正经事已经拖得太久，该打翻点东西，闹一场了。大人说画里的好人是圣徒和天使，不然我们绝猜不到。主日读物里的天使又白又淡，身形从头到脚都是直的，穿着白睡袍，白翅膀配着从中间分开的笔直黄发。他们永远严肃，甚至忧愁。我们不想结识这种无聊人物，更不愿同他们有任何来往。
        - id: ch01-b11
          speaker: narrator
          text: 画里的小天使却珠光宝气，面孔有神，羽毛发亮，显然是另一种蛋孵出来的。他们短鼻子、乱头发，嘴角向上翘，半点也不爱惜漂亮衣裳。我们觉得同他们一定志趣相投。只要能想办法碰见，他们准会成为最好的玩伴。不过我有点担心，玩讲究灵活的游戏时，他们靠翅膀能占太大便宜。我问塞莉娜，这些家伙靠不靠得住，会不会公平。她轻蔑地说，天使向来公平。我还是走回画前，又端详了一遍那个从贵妇椅背后探头的棕脸天使，心里的疑问一点也没消失。
    - id: ch02
      title: 城门外的世界
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 爱德华去上学以后，我们大大调整了一番，所有角色重新分配。图画书里的英雄全都在等我，只要开口，哪个都可以归我。可我没有急着接收那个披甲人。也许我想要一个新鲜的、真正属于自己的圣徒，不要爱德华当了那么久的旧角色。也许自从选择了一个圣徒也不要，我已经习惯独自离开前景，漫步到画面后方，用在那里找到的东西自得其乐。
        - id: ch02-b02
          speaker: narrator
          text: 那片后景小得很，却迷人得很，里面装下的东西多得出奇。最前面是草地，蓝花和红花像宝石一样嵌在草间。一条白路毫无必要地任性绕弯，爬上一座陡峭的圆锥形山。山顶立着塔楼、带堡垒的城墙和钟楼，小骑士两人一排，正沿路下来。山的一边沉入辽阔平静的蓝水。一艘弯弯曲曲的船泊在那里，只有一根桅杆，顶端还装着模样古怪的瞭望台。
        - id: ch02-b03
          speaker: narrator
          text: 那地方有的是玩法，可最气人的是，无论我去多少次，都越不过一道界线。沿白路上山，最后一定停在小城那座头重脚轻的回廊城门前。里面准玩得热闹，可没人肯把口令给我。我也能划船一直来到弯船旁，却永远绕不过海岬。我很确定，另一边港内船只云集，商人在码头来回走动，水手一边唱歌，一边把捆得结实的货包吊出去。可我只能留在下面的草地，凭自己的本领尽量把这一切想出来。
        - id: ch02-b04
          speaker: narrator
          text: 有一次，我同夏洛特谈起小城，才惊讶地知道，她也在那片乐土上得到过同样的快乐，又遇到过同样的失望。她走过白路，还把鼻子压扁在吊闸上。她又指出一个我完全漏掉的办法。只要划到弯船旁，抓住绳子攀上船，再顺桅杆一直爬进顶端的瞭望台，就能刚好越过海岬，从容看清港口全部的生活和热闹。
        - id: ch02-b05
          speaker: narrator
          text: 她把港里的趣事说得又多又细，我越听越疑心，忍不住问她，你说得像是自己真爬进过瞭望台。夏洛特没有回答，只抿紧嘴，一连几分钟拼命点头。此后任我怎么问，她一个字也不肯说。我觉得受了伤。她显然不知用了什么办法，真的爬上去过。这一次，她走在了我前头。
    - id: ch03
      title: 被征去拜访
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 大人要穿戴整齐，出门拜访，想来是非做不可。我们看不出这有什么道理。穿旧衣服留在家里玩，明明更加合理。不过那是他们的人生，不是我们的。他们本来就会做许多解释不了的事，我们也不便批评。何况大人还有不少更加讨厌的习惯，而他们出门以后，我们通常可以得到一个自由自在的下午，按自己的方式把天闹翻。这样比较起来，拜访还不算最坏。
        - id: ch03-b02
          speaker: narrator
          text: 但有时征兵队会来抓人。我们的恳求和借口一概遭到驳回，被硬拉去一同拜访，简直像土著兵被白人盟友的步枪逼着上战场。这种事既可恨又不可原谅，可偶尔总会发生。命令要我们上前线，我们就只能闭嘴出发。
        - id: ch03-b03
          speaker: narrator
          text: 塞莉娜心里其实悄悄喜欢换衣裳、去拜访，只因大家都不喜欢，她也装出反感的样子，好让众人的意见继续偏爱她。所以伊莱扎姑妈命人套小马车、准备出征的那个下午，她偏偏耳痛，我认为非常卑鄙。姑妈吩咐套车时，也用同一口气吩咐我同行。车子终于辘辘滚动，我想到原先安排得满满当当的下午就这样白费，只觉得未来纵然还有漫长得吓人的岁月，也永远补不回，更赔不起这份损失。
        - id: ch03-b04
          speaker: narrator
          text: 我们要去的是一座“大宅子”。我们把某一类房屋统统这样称呼。它们有穿过杜鹃花丛的长车道，有凹槽石柱撑起的门廊，也有一位庄严的管家。他会拉开弹簧门，走下台阶，假装彻底忘了自己在不那么郑重的场合里同你十分熟悉。宅子里的前厅又大又空，绝不许靴子、鞋和外套像在我家那样坦荡自在地散落。屋里的人也总穿得整整齐齐地坐着，仿佛接下来还要赶去参加一场宴会。
        - id: ch03-b05
          speaker: narrator
          text: 女主人热烈欢迎伊莱扎姑妈，对我却只有一层空空的客气。十秒不到，她们已经头碰头，热火朝天地谈起衣裳。我像退潮后留在岸上的东西，被独自搁在一把直背椅上。我很想踢椅子腿，却一点也不敢。起初四处张望还很有意思，高处低处都有东西可看。后来身体不可避免地再也坐不住，挠挠腿只能稍稍缓解那股难受。两名看守仍深深埋在衣裳问题里，我便滑下椅子，贴着房间边缘小心移动，一路探索、查看，再默默记住。
        - id: ch03-b06
          speaker: narrator
          text: 沿路有不少精美又古怪的东西。墙上是画和小摆设，桌上是首饰、圆鼓鼓的旧怀表和鼻烟盒。只要伸手够得到，我全都彻底而负责地摸过，有几件还特意拿近闻了闻。绕着房间走到后来，我偶然发现一扇门开着，半边藏在帘子的褶皱后面。我先仔细环顾四周。两位太太仍旧深陷衣裳，同时说个不停，于是我悄悄钻过门去。
        - id: ch03-b07
          speaker: narrator
          text: 里面那间屋子合理多了，四面墙老老实实铺满了书。可大多数书锁在高柜的玻璃门后，只能气人地闪着光。我眼馋地读书脊上的名字，朝每一块够得着的玻璃呵气。敌人就在近旁扎营，我终究不敢尝试开柜。幸好窗边的高桌上单独放着一本华丽的大书，一看便很有希望。我从一角轻轻掀起书页，蓝色和红色的短暂景象随即飘出来，像百花香罐忽然透出香气。
        - id: ch03-b08
          speaker: narrator
          text: 原来里面有图画，而且全是浓艳的彩图。这才是对路的东西，下午总算不会全浪费了。我侧耳去听外间。那个庄严、永恒、永远也讲不完的衣裳问题，像涨满河道的大河，还在翻滚、回旋、奔涌，听起来十分安全。我费力把又大又精美的书拖下桌，抱着它摇摇晃晃走到炉前地毯。这样的高贵好书，本来就只有那里才是合适的去处。
        - id: ch03-b09
          speaker: narrator
          text: 那家的炉前地毯确实出色，又软又宽，绒毛厚得出奇。双膝陷进去，舒服极了。可书打开以后，那些又大又硬的书页怎么也不肯平平躺好。幸亏煤斗恰巧就在胳膊旁边。我轻易找到一块扁煤，把那页不听话的纸压住。事情顺利得像屋里每一样东西都事先专为我安排过。这座宅子仔细看来，到底也没有那么坏。
        - id: ch03-b10
          speaker: narrator
          text: 最初几页围着鲜艳的卷草、带纹和织锦花样，小小的畸形人物正在色彩的迷宫里高兴地爬上爬下。我急忙查看画面中央的文字，只想找个提示，知道故事讲什么。当然，我没打算把时间浪费在阅读上，只要一块路牌、一根指路标便够。谁知那些字全是愚蠢的外国话，真叫人又失望又厌恶。某些人的乖僻，偶尔简直会让人对整个人类绝望。好在图画不会撒谎，也不会躲闪，更不会含糊搪塞。至于故事，我完全可以自己编。
    - id: ch04
      title: 我的城终于开门
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 我翻过一页，又把压纸的煤块移到新位置。满眼纷杂颜色迎面涌来，叫我欢喜。等它们慢慢显出整幅图画，心里的变化也一层接着一层。先是一阵暖暖的熟悉感，随后有什么被一点点认了出来。接着，幸福的确信一下子降临，强烈得不容抗拒。啊，就是它！我只好双手紧紧抱住肚子，拼命压住那声正挣扎着要冲出口的狂喜呼喊。眼前正是我自己的小城。
        - id: ch04-b02
          speaker: narrator
          text: 我熟悉它，当然一眼就认了出来，虽然从没靠得这样近。熟悉的城门就在眼前。左边那座细长怪塔，把阴沉的方形塔顶远远探出城墙。右边的城外，小山仍像从前那样陡然落向大海。今天一切却更大、更新、更清晰。城墙像刚刚凿成，鲜艳的毯子从墙头垂下。贵妇和留着长发的孩子探出身子，挤满城垛，争着朝外看。
        - id: ch04-b03
          speaker: narrator
          text: 最好的是，吊闸已经升起。里面沐浴阳光的广场都能看见。一队衣着华美的人骑马入城，两人一排。长长的马饰扫着地面，骑手更是我见过最光彩的一群。盛装、节日，还有庄严的入城仪式，这一定是婚礼。不管究竟是什么，我都要参加。
        - id: ch04-b04
          speaker: narrator
          text: 这一次，冷酷的吊闸休想拦住我。我要混在人群里进去，看清那道恼了我许久的城墙后面究竟有什么，也要分到城里的快乐。我信心十足，又期待得透不过气，赶紧翻开下一页。
        - id: ch04-b05
          speaker: narrator
          text: 太好了，我终于站到城墙里面了，当然要好好四处打量。眼前像是公共广场，却同我见过的全不相同。后排房屋由一带柱廊托起，柱下人群推挤，楼上墙面画满奇妙的图案。笔直屋脊上，一片无云的深蓝天空从这边铺到那边。贵族男女挤满近处，中央台座上，一位英俊绅士刚刚下马，正俯身亲吻少女的手指。少女的盛装足以同塞莉娜在圣徒之间认领的那位贵妇相比，旁边还围着一群上了年纪、穿五彩袍服的尊长。
        - id: ch04-b06
          speaker: narrator
          text: 广场上也有许多男孩。他们浓密头发上戴着小红帽，衬衣在腰间皱成一团，又从裤腰里钻出来，就像我追过什么人以后常有的样子。每个男孩还穿着两只不同颜色的长袜，一只是蓝的，一只是红的。这套穿法一下就赢得了我的心。我不知试过多少回，每次都受到许多阻挠。如今一本大人的书竟把它郑重其事地画了出来，终于替我主持公道，证明我一点也没错。
        - id: ch04-b07
          speaker: narrator
          text: 我四下寻找那两位圣徒朋友，也就是披甲人和另一个家伙，却没有看见。他们一定连婚礼也不能参加，仍旧无法离岗，还在山下的绿草地站守。天使也一个没来，这更叫人失望。明明很容易抽出一两个，放他们跑上山看一个钟头的热闹。何况这样一个满是颜色、动作和快乐的地方，他们来了准会非常自在，就像回到自己家一样。
        - id: ch04-b08
          speaker: narrator
          text: 真正的故事显然才开头，我赶紧再翻一页。我们全都来到一座庄严的教堂。里面究竟举行什么仪式，看得不大明白，可我终于在人群中认出了自己的天使，实在高兴。他们快活又自在，像是好不容易请到假，一路跑上山，再气喘吁吁地冲过城门。也许看见广场已经空了，还以为热闹全都结束，急得掉过几滴眼泪。
        - id: ch04-b09
          speaker: narrator
          text: 两个天使各抱着一根巨大的蜡烛，重得让他们东倒西歪，几乎招架不住。蜡油毫不客气地淌满衣裳，他们却还侧过脸，斜眼相看，彼此偷笑。第三个天使已经独自溜进宾客中间，同一位年轻绅士聊得十分亲热，看起来交情好极了。毫无疑问，这才是适合我们的天使。守在病床边和夜间育儿室那些乏味差事，他们才懒得理会。
        - id: ch04-b10
          speaker: narrator
          text: 他和她当然是在结婚，故事向来这样。随后他们便会永远幸福地生活，而我最想知道的，正是那句话后面的生活到底是什么模样。故事书都很愚蠢，每逢事情真正变得美好，偏偏立刻停下。这本图画故事却才到最初几章，我终于有机会看看，人究竟怎样永远幸福地生活。我们会一起回家，新郎、新娘、天使和我。披甲人也会受邀前来住一阵。别的故事全都结束的地方，我们的故事才真正开始。
        - id: ch04-b11
          speaker: narrator
          text: 下一页带我离开幽暗辉煌的教堂，回到开阔的乡野。这一切正合心意。天空没有一丝云斑，旗帜在风里跳舞，欢快的婚礼队伍说笑着骑向水边。我已经穿过小城，来到一直想去的山背后。港口果然挤满弯船，大多数船上高高堆着贺礼，有丝绸包、金银餐具，还有一袋袋仿佛装着金银块的沉重东西。
        - id: ch04-b12
          speaker: narrator
          text: 所有船里最华丽的那一艘，就紧贴着铺好地毯的码头停泊。新娘已经轻巧地走下跳板，女伴们一本正经地跟在身后，一个接一个。再等几分钟，所有人都会上船。系船的缆绳将扑通落进水里，船帆会迎风鼓起，再绷得紧紧的。我站在甲板上，看有城墙的小城向后退去，越缩越小，渐渐变得朦胧。船头每一次起伏着冲进海浪，就带我们离幸福的岛近一点。我知道得很清楚，目的地一定是座岛。
        - id: ch04-b13
          speaker: narrator
          text: 我甚至看见岛上的人挤满码头，正挥手迎接。小房子沿山坡向上，一直通到最高处的城堡。塔楼和城垛像一顶王冠，戴在所有屋舍上方。上岸以后，我们又会组成快乐的队伍，一同骑马出发。马蹄在陡峭的街道上一路嗒嗒响，带大家再次穿过阴森的城门。随后就到了。大家会围坐在一起吃饭。我们终于抵达自己的家。接下来……
    - id: ch05
      title: 梦醒以后
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 哎哟！哎哟！哎哟！
        - id: ch05-b02
          speaker: narrator
          text: 从乳白流光的梦里跌跌撞撞回到冰冷白昼，已经够苦。一瞬间失去一次航海、一座岛屿，还有那座实际上眼看就要属于自己的城堡，更是残酷。可所有事情里最苦、最残酷的，是除了这些损失，还忽然发现一位愤怒的姑妈正用手指紧紧揪住自己的后颈，怎么也挣不脱。
        - id: ch05-b03
          speaker: narrator
          text: 漂亮的大书也从手中消失了。那位爱打扮的女主人把它硬夺过去，又加入姑妈的声讨，卖力得像是我的另一位亲戚。我只剩下凄惨的哭声。梦突然醒了，真实事物又冷又硬，现实世界还有数不清的敌意在等着我。她们怎么责备，怎么辱骂，我其实并不太在乎。
        - id: ch05-b04
          speaker: narrator
          text: 我真正在乎的，是那艘失去的船，那座消散的岛，还有那顿永远没吃成的晚饭。我也不得不面对一个事实。往后若想找天使一起玩，只能将就《安息日进修读本》里那些苍白无血色、穿着睡衣、毫无意思的家伙。他们没有一个鲜活有趣，只会飘在主日学校孩子的床头。
        - id: ch05-b05
          speaker: narrator
          text: 我软绵绵、泪汪汪地被领出大宅子，别提多丢脸。管家拉动弹簧门，脸上冷得像石头，没有一丝表情。这副面孔是要骗过最精明的人，可绝对骗不过我。我很清楚，下次他休班，闲逛到我们那里，我们还会像两个男子汉那样在厨房相见。我会捶他几下，拿谜语考他，他会教我用软木塞和几截绳子变戏法。所以他现在装得多么冷淡、多么不同情我，也不能让我更加沮丧。
        - id: ch05-b06
          speaker: narrator
          text: 我们被塞进小马车，门房旁的大门已经在身后咔嗒关上，我仍很有策略地哭了许久。这种抽抽搭搭像一层保护全身的护甲，能替我挡住接下来的盘问、争论和责骂。我正在拼命思考，只想独自待着，不许任何人来打扰。那时，我的脑中一共装着两件事。
        - id: ch05-b07
          speaker: narrator
          text: 第一件，这回我终于走到夏洛特前头了。
        - id: ch05-b08
          speaker: narrator
          text: 第二件，等我长大，有自己的钱，也有一根足尺寸的手杖，我要选一个清早出发，不走到那座有城墙的小城，绝不停步。这并不真难。只要一路在这里问问，再去那里问问。人们通常很肯帮忙，而城里每一根树枝、每一块石头，我都能说得清楚。
        - id: ch05-b09
          speaker: narrator
          text: 至于那座连一眼也没亲眼见过的岛，找起来就没有这么容易了。我甚至还不知道该怎样着手。可心里的信心一点也没有动摇。不管最后要用什么办法，也不管那一天究竟会在什么时候到来，或早或晚，我命中注定会找到它，也终有一天会抵达那里。
