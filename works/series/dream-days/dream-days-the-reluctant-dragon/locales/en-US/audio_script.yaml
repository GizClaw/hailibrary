  chapters:
    - id: ch01
      title: Tracks in the Snow
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Ever since snow first made this dull-colored world look white and wonderful, footprints in it have stirred tender feelings in people. We once had a poetry book from an aunt, with a Wordsworth poem in which snowy footprints were very important. They even had a picture all to themselves. We did not think much of the poem or its feelings. Footprints in sand were different. We understood exactly how Crusoe felt when he saw one. To us, tracks in sand or snow meant excitement and mystery. They brought curiosity and suspense, and nothing sentimental at all.
        - id: ch01-b02
          speaker: narrator
          text: >-
            We woke early one winter morning, puzzled by the extra light that filled the room. At first, we could not understand it. Then the truth came to us all at once. Snowballing was no longer a distant wish. It was a solid certainty waiting just outside the door. What followed was a rough battle for the clothes we needed. Boots with laces seemed like the clumsiest invention in the world, and buttons were a needlessly slow way to fasten a coat. All the while, perfectly good snow was being wasted without us.
        - id: ch01-b03
          speaker: narrator
          text: >-
            When dinner came, we had to be dragged indoors by our collars. As soon as that brief truce ended, the snow battle began again. Before long, Charlotte and I grew tired of contests and of snowballs sliding coldly down inside our clothes. We left the trampled battlefield of the lawn and went exploring beyond it. Untouched white country spread away on every side. Our familiar world had suddenly hidden itself under a soft, mysterious covering. Here and there, a bird had landed and left a few faint marks. Almost nothing else seemed to have traveled through that blank world. That was why the strange tracks we found puzzled us so much.
        - id: ch01-b04
          speaker: narrator
          text: >-
            We found them near the corner of the shrubbery and studied them for a long while, bent over with our hands on our knees. We considered ourselves experienced trackers, so it was especially annoying to meet the trail of a beast we could not name at once.
        - id: ch01-b05
          speaker: charlotte
          text: >-
            Don't you know? I thought you knew every beast there ever was.
        - id: ch01-b06
          speaker: narrator
          text: >-
            That challenged me. I quickly named animals from hot countries and cold ones, though I had little faith in any of my guesses.
        - id: ch01-b07
          speaker: charlotte
          text: >-
            No, none of those quite fits. It looks sort of lizardy. Did you say an iguanodon? Perhaps it could be one, but that isn't British. We need a proper British beast. I think it's a dragon!
        - id: ch01-b08
          speaker: narrator
          text: >-
            I objected that the tracks were much too small.
        - id: ch01-b09
          speaker: charlotte
          text: >-
            Every dragon has to start small, just like everything else. Maybe this little dragon is lost. A little one would be rather nice to keep. It might scratch and spit, but it couldn't really hurt us. Come on, let's follow it!
        - id: ch01-b10
          speaker: narrator
          text: >-
            Hand in hand, we set off across the wide snowy world. Our hearts were full of expectation. Those few blurred prints had convinced us that we were well on our way to catching a half-grown creature from a fairy tale. We tracked the monster across the paddock, beside the hedge of the next field, and then onto the road, as neatly as any tame and civilized taxpayer. There its trail mixed with ordinary footprints and disappeared. Still, imagination and a fixed idea can do a great deal. We felt sure we knew which way a dragon would naturally go. The marks kept appearing again too, or at least Charlotte insisted they did. Since it was her dragon, I left the tracking to her and trotted peacefully beside her. Whatever happened, this was an expedition, and something was certain to come of it.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Charlotte led me over another field or two, through a little wood, and onto a fresh road. By then I felt sure that nothing but her stubborn pride kept her pretending to see dragon tracks. A reasonable person would have admitted she was completely lost. At last, she excitedly pulled me through a gap in a hedge that was obviously private. The broad world of open fields and hedgerows vanished behind us. We stood in a tidy, sheltered garden, the least dragon-haunted place one could imagine. Once inside, I recognized it as the garden of my friend the circus-man, though I had never approached it from this strange side or entered through an unlawful gap before.
        - id: ch01-b12
          speaker: narrator
          text: >-
            The circus-man was strolling along the paths and peacefully smoking his pipe. I went up and politely asked whether he had seen a Beast lately.
        - id: ch01-b13
          speaker: circus_man
          text: >-
            May I ask what particular kind of Beast you're looking for?
        - id: ch01-b14
          speaker: narrator
          text: >-
            I explained that it was a lizardy Beast. Charlotte called it a dragon, I added, though she did not know much about beasts.
        - id: ch01-b15
          speaker: circus_man
          text: >-
            I don't believe I've seen a dragon around here lately. But if I meet one, I'll know it belongs to you, and I'll have it brought straight round.
        - id: ch01-b16
          speaker: charlotte
          text: >-
            Thank you very much, but please don't go to any trouble. It may not be a dragon after all. I thought I saw its little tracks, and they seemed to come in here, but perhaps we made a mistake. Thank you anyway.
        - id: ch01-b17
          speaker: circus_man
          text: >-
            It would be no trouble. I'd be delighted. Still, you may be right about the mistake. It's growing dark, and whatever the creature was, it has escaped for now. Come inside for tea. I'm alone, so we'll make a roaring fire. And I have the biggest Book of Beasts you've ever seen, with every animal in the world shown in color. We'll look for your creature there.
        - id: ch01-b18
          speaker: narrator
          text: >-
            We were always ready for tea at any hour, and tea combined with beasts was impossible to refuse. There was marmalade, and apricot jam had been brought in especially for us. Afterward, the great Book of Beasts was spread open. The circus-man had spoken truly. Its colored pages seemed to contain every kind of creature that had ever lived anywhere in the world.
        - id: ch01-b19
          speaker: narrator
          text: >-
            When the clock struck six, sensible Charlotte nudged me. With an effort, we pulled ourselves out of Beast-land and stood reluctantly to leave.
        - id: ch01-b20
          speaker: circus_man
          text: >-
            I'll walk with you. I want another pipe, and the walk will do me good. You needn't talk unless you feel like it.
        - id: ch01-b21
          speaker: narrator
          text: >-
            Our spirits rose to their usual height at once. The road home had seemed terribly long. After the bright, warm room and the richly colored pages of the beast book, the outside world looked dark and eerie. But walking with a real Man was a treat in itself. We set off briskly with the Man between us. I looked up at him and wondered whether I would ever live long enough to smoke a large pipe with that same careless majesty. Charlotte's young mind was not fixed on tobacco as a possible goal, so she called to him from his other side.
        - id: ch01-b22
          speaker: charlotte
          text: >-
            Please tell us a story while we walk.
        - id: ch01-b23
          speaker: circus_man
          text: >-
            I knew it. I knew I'd have to tell a story. Why did I ever leave my comfortable fire? Very well, I'll tell you one. Just give me a moment to think.
        - id: ch01-b24
          speaker: narrator
          text: >-
            He thought for a minute. Then he began.
    - id: ch02
      title: The Creature in the Cave
      blocks:
        - id: ch02-b01
          speaker: circus_man
          text: >-
            Long ago, perhaps hundreds of years ago, a shepherd lived with his wife and little son in a cottage halfway between our village and that shoulder of the Downs. The shepherd spent his days, and at certain seasons his nights as well, high on the broad, rolling hills. He had only the sun, the stars, and the sheep for company. The friendly, talkative world of men and women stayed far beyond his sight and hearing. His son sometimes helped him. Even while helping, though, the Boy often had his thoughts inside one of the large books he borrowed from friendly country gentlemen and interested clergymen nearby.
        - id: ch02-b02
          speaker: circus_man
          text: >-
            His parents loved him and were rather proud of him, though they were careful not to say so where he could hear. They let him follow his own path and read as much as he pleased. Instead of boxing his ears, as some parents might have done, they treated him almost as an equal. They supplied the practical wisdom, and he supplied the learning from books. That seemed a fair division of work. Whatever the neighbors said, they knew book learning could be useful in a tight place. The Boy cared most for natural history and fairy tales. He read one kind between bits of the other and made no real distinction between them. When you think about it, that was a sensible education.
        - id: ch02-b03
          speaker: circus_man
          text: >-
            One evening the shepherd came home trembling. He had been worried and distracted for several nights. His wife sat sewing at the table, while the Boy read about the Giant with No Heart in His Body. The shepherd dropped into a chair and burst out with his news.
        - id: ch02-b04
          speaker: shepherd
          text: >-
            It's all over for me, Maria! I'm never going onto those Downs again, not ever!
          emotion: fearful
        - id: ch02-b05
          speaker: shepherd_wife
          text: >-
            Now, don't work yourself up. Tell us what has frightened you first. Then you, me, and the boy can get to the bottom of it together.
          emotion: calm
        - id: ch02-b06
          speaker: shepherd
          text: >-
            It started several nights ago. You know that cave up there. Somehow, I've never liked it, and the sheep have never liked it either. When sheep dislike a thing, you can generally trust that they have a reason. For some time now, faint noises have come from inside the cave. They sound like heavy sighs with grunts mixed among them. Sometimes I hear snoring from far, far down. It is real snoring, mind you, but it does not sound honest and proper like the snoring you and I do at night.
        - id: ch02-b07
          speaker: boy
          text: >-
            I know.
        - id: ch02-b08
          speaker: shepherd
          text: >-
            I was terribly afraid, but I couldn't stay away. This evening I crept around the cave before coming home, and there he was. I saw him as plainly as I see you!
          emotion: fearful
        - id: ch02-b09
          speaker: shepherd_wife
          text: >-
            You saw who?
          emotion: fearful
        - id: ch02-b10
          speaker: shepherd
          text: >-
            Him! The creature I'm telling you about! He was halfway out of the cave, enjoying the cool evening in a poetical sort of way. He was as big as four cart horses, and shining scales covered every bit of him. They were deep blue along his back and softened into a tender green underneath. Every time he breathed, heat shimmered above his nostrils, just as it does above our chalk roads on a baking, windless summer day. His chin rested on his paws. I would say he was meditating on things.
        - id: ch02-b11
          speaker: shepherd
          text: >-
            I admit he looked peaceful enough. He wasn't raging about, carrying on, or doing anything that was not perfectly proper. I admit all of that. But what am I supposed to do now? He has scales, you know, and claws. He certainly has a tail too, though I could not see that end of him from where I stood. I am not used to creatures with those parts. I do not hold with them, and that is the plain truth.
        - id: ch02-b12
          speaker: circus_man
          text: >-
            The Boy had seemed lost in his book through the whole account. Now he closed it, yawned, and folded his hands behind his head.
        - id: ch02-b13
          speaker: boy
          text: >-
            It's all right, Father. Don't worry. It's only a dragon.
          emotion: calm
        - id: ch02-b14
          speaker: shepherd
          text: >-
            Only a dragon? How can you sit there saying that? What do you know about dragons?
          emotion: surprised
        - id: ch02-b15
          speaker: boy
          text: >-
            I know because it is a dragon, and dragons are my subject. We each have our own line of work. You understand sheep and weather and practical things. I understand dragons. I've always said that cave was a dragon cave. A dragon must have owned it once, and if rules mean anything, a dragon ought to own it now. So when you tell me that one has finally moved in, everything is exactly right. I am not half as surprised by this news as I was when you used to tell me the cave had no dragon.
        - id: ch02-b16
          speaker: boy
          text: >-
            Leave this to me. I'll go up tomorrow morning. No, I have too much to do then. I'll visit in the evening if I'm free, and I'll talk to him. Just don't go fussing around the cave without me. You don't understand dragons, and they're very sensitive.
        - id: ch02-b17
          speaker: shepherd_wife
          text: >-
            The boy is right. Dragons are his subject, not ours, and everyone knows how much he understands about creatures in books. To tell the truth, I feel sorry for the poor animal alone up there, with no hot supper and no one to exchange news with. Perhaps we can help him. If he isn't respectable, our Boy will soon find out. He has a pleasant way that gets everyone talking.
    - id: ch03
      title: The Boy Meets the Dragon
      blocks:
        - id: ch03-b01
          speaker: circus_man
          text: >-
            The next day, after tea, the Boy walked up the chalk track toward the top of the Downs. Sure enough, there lay the dragon, stretched lazily on the grass before his cave. The view was magnificent. On both sides, bare, rolling hills flowed away like great waves. In front lay the valley, with houses gathered in little groups. Threads of white road ran between orchards and carefully worked fields. Far beyond them, old gray cities seemed to touch the horizon. A cool wind played over the grass, and the silver shoulder of a large moon appeared above the distant junipers.
        - id: ch03-b02
          speaker: circus_man
          text: >-
            It was easy to see why the dragon felt peaceful. As the Boy drew near, he heard the great creature purring steadily with contentment. None of his books had ever said that dragons purred.
        - id: ch03-b03
          speaker: boy
          text: >-
            Hello, dragon.
        - id: ch03-b04
          speaker: circus_man
          text: >-
            The dragon began to rise politely at the sound of footsteps. Then he saw that his visitor was a Boy and frowned sternly.
        - id: ch03-b05
          speaker: dragon
          text: >-
            Don't hit me, throw stones, squirt water, or do anything like that. I won't stand for it.
        - id: ch03-b06
          speaker: boy
          text: >-
            I wasn't going to hit you. And please stop saying “don't.” I hear that word all day, and it makes me tired. I only came to ask how you were. If I'm in the way, I can leave. I have plenty of friends, and I don't push myself in where nobody wants me.
        - id: ch03-b07
          speaker: dragon
          text: >-
            No, no. Don't go off offended. I'm perfectly happy here and always have something to occupy me. Always! Still, just between us, it does get a little dull sometimes.
        - id: ch03-b08
          speaker: circus_man
          text: >-
            The Boy bit off a grass stalk and chewed it.
        - id: ch03-b09
          speaker: boy
          text: >-
            Are you planning to stay long?
        - id: ch03-b10
          speaker: dragon
          text: >-
            I can't decide yet. This seems a pleasant place, but I haven't been here long. Settling down is serious. One must look around, reflect, and consider. Besides, I'll tell you something you would never guess. I'm an unbelievably lazy fellow.
        - id: ch03-b11
          speaker: boy
          text: >-
            That does surprise me.
        - id: ch03-b12
          speaker: dragon
          text: >-
            Sadly, it's true. I suspect that's how I ended up here. The other dragons were so active and earnest about everything. They were always rampaging and skirmishing, racing across desert sands, pacing along the edge of the sea, chasing knights from place to place, eating maidens, and generally making a commotion. I preferred having my meals at regular hours. Afterward, I could lean my back against a rock, sleep awhile, wake up, and think about everything happening in the world. It all went on perfectly well without me. So when the accident came, I was the one who got thoroughly caught.
        - id: ch03-b13
          speaker: boy
          text: >-
            What accident?
        - id: ch03-b14
          speaker: dragon
          text: >-
            I don't exactly know what happened. Perhaps the earth sneezed or shook itself, or the bottom fell out of something. There was a great shaking and roaring and general crash. When it ended, I found myself miles underground and wedged in as tightly as anything could be. Luckily, I need very little. At least I had peace and quiet there, and nobody was forever asking me to come along and do something. Besides, my mind is so active. I always had thoughts to occupy me, I assure you.
        - id: ch03-b15
          speaker: dragon
          text: >-
            Time passed, though, and there was a certain sameness about that underground life. At last, I thought it might be amusing to work my way upstairs and see what all you other fellows were doing. So I scratched and burrowed. I worked first this way and then that way, until at last I broke out through this very cave. I like the country. I like the view, and I like the people too, at least the few I have seen. Taken altogether, I feel rather inclined to settle down here.
        - id: ch03-b16
          speaker: boy
          text: >-
            What keeps your mind so busy? That's what I want to know.
        - id: ch03-b17
          speaker: circus_man
          text: >-
            The dragon blushed a little and looked away. At last he spoke shyly.
        - id: ch03-b18
          speaker: dragon
          text: >-
            Have you ever tried making up poetry for fun? Verses, you know?
        - id: ch03-b19
          speaker: boy
          text: >-
            Of course. I've written heaps, and I'm sure some of it is good. Nobody here cares much about it. Mother is kind when I read it, and Father is too, but somehow they never seem to understand what I mean.
        - id: ch03-b20
          speaker: dragon
          text: >-
            Exactly! That's my own case exactly. They don't seem to understand, and there is no use arguing with them about it. But you have culture. I could tell that about you the instant you arrived. I would dearly like your honest opinion of a few little pieces I tossed off lightly while I was underground. I'm tremendously pleased that we met, and I hope the other neighbors prove just as agreeable. A very pleasant older gentleman came up here last night, but he appeared not to want to intrude on me.
        - id: ch03-b21
          speaker: boy
          text: >-
            That was my father. He is a pleasant gentleman. I'll introduce you someday if you like.
        - id: ch03-b22
          speaker: dragon
          text: >-
            Could you both come to dinner tomorrow? Only if you have nothing better to do, naturally.
        - id: ch03-b23
          speaker: boy
          text: >-
            Thank you, but we never go anywhere without Mother. To be honest, she may not approve of you. You are a dragon, and there's no getting around that. When you talk about settling here and meeting the neighbors, I don't think you understand your position. Dragons are enemies of the human race.
        - id: ch03-b24
          speaker: dragon
          text: >-
            I don't have one enemy in the world. I'm too lazy to make any. And if I read my poetry to other people, I'm always willing to hear theirs in return.
        - id: ch03-b25
          speaker: boy
          text: >-
            Oh dear, I wish you would try to understand the situation properly. When the other people discover you, they will come after you with spears, swords, and every sort of weapon. According to their way of seeing things, you will have to be completely destroyed. It does not matter how politely you behave. To them, a dragon is a scourge, a pest, and a deadly monster that cannot be allowed to remain.
        - id: ch03-b26
          speaker: dragon
          text: >-
            None of that is true. My character can stand the closest examination. Now, I was working on a small sonnet when you arrived.
        - id: ch03-b27
          speaker: boy
          text: >-
            If you refuse to be sensible, I'm going home. No, I cannot stay and listen to sonnets tonight. Mother is sitting up and waiting for me. I'll come to see you again sometime tomorrow. Before then, please try your very hardest to understand that everyone considers you a pestilential scourge. If you keep treating that as a joke, you will find yourself in the most dreadful trouble. Good night!
        - id: ch03-b28
          speaker: circus_man
          text: >-
            It was easy for the Boy to calm his parents about his new friend. Dragons were his department, and they accepted his word without complaint. The shepherd received a formal introduction. He and the dragon exchanged many compliments and kindly questions. The shepherd's wife said she would gladly help in any way. She could mend things, put the cave in order, or cook something when the dragon had spent so long over his sonnets that he forgot to eat. Male creatures did that sort of thing. Still, nothing could persuade her to meet him formally. He was a dragon, she said, and nobody knew who he was. That fact outweighed everything else.
        - id: ch03-b29
          speaker: circus_man
          text: >-
            She did let her little son visit the dragon quietly in the evenings, provided he was home by nine o'clock. The Boy and the dragon spent many pleasant nights sitting together on the grass before the cave. The dragon told story after story about ancient times, when dragons were plentiful instead of rare. According to him, the whole world had been a much livelier place then, and ordinary life was full of thrills, sudden jumps, and astonishing surprises.
    - id: ch04
      title: Saint George Arrives
      blocks:
        - id: ch04-b01
          speaker: circus_man
          text: >-
            Before long, the Boy's fears came true. Even the most modest and retiring dragon cannot remain hidden when he is as large as four cart horses and covered in blue scales. At night, people in the village tavern naturally began talking about the living dragon brooding in the cave on the Downs. They were terribly frightened, but rather proud too. Having a dragon of their own made the village special. It was a distinction, almost like wearing a feather in the village cap. Even so, everyone agreed that the situation could not be allowed to continue.
        - id: ch04-b02
          speaker: circus_man
          text: >-
            They declared that the dreadful beast must be destroyed. The countryside had to be freed from this pest, this terror, this ruinous scourge. It made no difference that not even a hen roost was worse off because the dragon had arrived. He was a dragon, and he could not deny it. If he chose not to behave like one, that was his own concern. Yet after all their brave talk, no hero volunteered to take up sword and spear, rescue the suffering village, and win everlasting fame. Each night's heated discussion ended without anything being done. Meanwhile, up on the Downs, the happy dragon lounged on the grass. He enjoyed the sunsets, told the Boy stories from before the Flood, polished old poems, and meditated on fresh ones.
        - id: ch04-b03
          speaker: circus_man
          text: >-
            One day the Boy walked into the village and found everything dressed for a celebration, though the calendar gave no reason for one. Carpets and bright-colored cloths hung from the windows. The church bells clanged noisily, and flowers had been scattered over the little street. The entire population crowded along both sides. Everyone talked at once, pushed everyone else, and loudly ordered everyone else to stand back. In the middle of the crowd, the Boy caught sight of a friend his own age and called to him.
        - id: ch04-b04
          speaker: boy
          text: >-
            What's happening? Is it actors, bears, a circus, or what?
        - id: ch04-b05
          speaker: boy_friend
          text: >-
            It's all right. He's coming!
          emotion: happy
        - id: ch04-b06
          speaker: boy
          text: >-
            Who is coming?
        - id: ch04-b07
          speaker: boy_friend
          text: >-
            Saint George, of course! He heard about our dragon. He's come to kill the deadly beast and free us from its horrible rule. What a splendid fight we'll have!
          emotion: happy
        - id: ch04-b08
          speaker: circus_man
          text: >-
            That was news indeed. The Boy needed to see the truth for himself. He wriggled between the legs of the good-natured grown-ups, scolding them all the while for their rude habit of pushing. When he reached the front row, he waited breathlessly. Soon cheers rose from the far end of the street. Then came the measured hoofbeats of a great warhorse. The sound made his heart beat faster, and before he knew it, he was cheering with everyone else.
        - id: ch04-b09
          speaker: circus_man
          text: >-
            Saint George rode slowly up the street through shouts of welcome. Women cried out, babies were lifted high, and handkerchiefs waved all around him. The Boy's heart seemed to stop, and his breath came in little sobs. He had never seen such beauty and grace. Gold was laid into every ridge of the Saint's fluted armor. His feathered helmet hung from the saddle bow. Thick fair hair framed a face that looked kind and gracious beyond words, until you noticed the sternness in his eyes.
        - id: ch04-b10
          speaker: circus_man
          text: >-
            Saint George pulled his horse to a stop before the little inn. The villagers crowded around him with welcomes, thanks, and a noisy flood of complaints about all the wrongs and hardships they had suffered. The Boy heard the Saint's grave and gentle voice above them. Everything would be well now, he promised. He would stand beside the villagers, see that justice was done, and free them from their enemy. Then he dismounted and went through the inn door. The crowd poured inside after him, but the Boy turned away and ran up the hill as fast as he could put one leg before the other.
        - id: ch04-b11
          speaker: boy
          text: >-
            It's all over, dragon! He's coming! He's here already! You'll have to pull yourself together and do something at last!
          emotion: fearful
        - id: ch04-b12
          speaker: circus_man
          text: >-
            The dragon was polishing his scales with a piece of household flannel borrowed from the Boy's mother. He shone like a giant turquoise.
        - id: ch04-b13
          speaker: dragon
          text: >-
            Don't be so violent, Boy. Sit down, catch your breath, and remember that the noun governs the verb. Then perhaps you can tell me who is coming.
        - id: ch04-b14
          speaker: boy
          text: >-
            Yes, go on taking it calmly. I hope you feel half as calm when you have heard my news. It is only Saint George who is coming, that's all. He rode into the village half an hour ago. Of course, a great big creature like you can beat him. Still, I thought I had better warn you, because he is certain to come up here early. And he carries the longest and most wicked-looking spear I have ever seen in my life!
        - id: ch04-b15
          speaker: circus_man
          text: >-
            The Boy jumped about in delight at the thought of the battle.
        - id: ch04-b16
          speaker: dragon
          text: >-
            Oh dear, this is dreadful. I refuse to see him. I don't want to know him, and I'm sure he isn't pleasant. Tell him to go away. He may write if he likes, but I cannot give him an interview. I'm not receiving anyone.
          emotion: fearful
        - id: ch04-b17
          speaker: boy
          text: >-
            Dragon, don't be difficult. You must fight him eventually. He is Saint George, and you are the dragon. Get it over with, and then we can return to the sonnets. Think of other people too. If life has been dull for you, imagine how dull it has been for me.
        - id: ch04-b18
          speaker: dragon
          text: >-
            My dear little man, understand this once and for all. I cannot fight, and I will not fight. I've never fought in my life. I won't begin now just to provide you with a holiday spectacle. In the old days, I left all the fighting to the earnest dragons. That is probably why I'm still here.
        - id: ch04-b19
          speaker: boy
          text: >-
            But if you won't fight, he'll cut off your head!
          emotion: fearful
        - id: ch04-b20
          speaker: dragon
          text: >-
            I don't think he will. You'll arrange something. I trust you completely because you're such a capable manager. Run down and settle it for me, there's a good fellow. I leave everything in your hands.
        - id: ch04-b21
          speaker: circus_man
          text: >-
            The Boy returned to the village in deep gloom. First, there would be no fight after all. Second, his dear and honored friend the dragon had not acted as heroically as the Boy would have liked. Worst of all, heroic or not, the dragon would surely lose his head when Saint George came. The command to arrange everything gave him no comfort. The creature treated the whole dangerous affair as casually as an invitation to tea and croquet.
        - id: ch04-b22
          speaker: circus_man
          text: >-
            The villagers were drifting home in excellent spirits, happily discussing the coming battle. The Boy went to the inn's main room, where Saint George sat alone. He was considering the fight and all the sad stories of robbery, violence, and injustice he had just heard.
        - id: ch04-b23
          speaker: boy
          text: >-
            May I come in, Saint George? I want to speak about this dragon business, if you aren't tired of hearing about it.
        - id: ch04-b24
          speaker: saint_george
          text: >-
            Come in, Boy. I fear you have another tale of suffering. Has the tyrant taken a loving parent from you, or perhaps a dear brother or sister? Whatever it is, the wrong will soon be avenged.
        - id: ch04-b25
          speaker: boy
          text: >-
            Nothing like that happened. Someone has misunderstood. This is a good dragon.
        - id: ch04-b26
          speaker: saint_george
          text: >-
            Of course. I understand perfectly. A good dragon. I am glad my opponent is worthy of my sword and not some weak example of his poisonous kind.
        - id: ch04-b27
          speaker: boy
          text: >-
            He isn't one of any poisonous tribe. Why do grown men become so stupid once an idea gets into their heads? I keep telling you that he is good. He's my friend, and he tells the most beautiful stories about the old days and about when he was little. He's been wonderfully kind to Mother, and she'd do anything for him. Father likes him too. Father doesn't care much for art or poetry, and he always falls asleep when the dragon starts discussing style, but he still likes him. Once people truly meet the dragon, they can't help it. He's charming and trusting, and as simple as a child.
        - id: ch04-b28
          speaker: saint_george
          text: >-
            Sit down and pull your chair closer. I admire anyone who stands up for a friend, and a dragon with a loyal friend like you must have some good qualities. But that is not the real question. All evening, with grief I cannot describe, I have heard stories of murder, theft, cruelty, and wrongdoing. Some were probably painted in colors too bright to be fully convincing. Taken together, however, they make a serious list of crimes. History teaches us that even the worst villains may have every virtue in their private lives. So despite the qualities that rightly won your affection, I fear your cultivated friend must quickly be destroyed.
        - id: ch04-b29
          speaker: boy
          text: >-
            You've swallowed every tale those villagers told you. They are the biggest inventors of stories for miles around. Everyone here knows that, but you're a stranger. All they want is a fight. A fight is food and drink to them. They'll set dogs, bulls, dragons, or anything else against each other, so long as they can watch. There's an innocent badger in the stable behind this inn at this very moment. They meant to have their fun with it today, but now they're saving it until your little affair is finished.
        - id: ch04-b30
          speaker: boy
          text: >-
            I have no doubt they told you what a great hero you are. They probably said you were certain to win because right and justice are on your side, and all the rest of it. But let me tell you what I heard when I came down this street a few minutes ago. Those same villagers were placing bets as freely as they pleased, and they were offering six to four on the dragon.
        - id: ch04-b31
          speaker: saint_george
          text: >-
            Six to four on the dragon? This is an evil world. Sometimes I begin to suspect that all its wickedness is not bottled up inside dragons after all. Yet perhaps this clever creature has deceived you about his real nature. Your good opinion of him might provide the perfect cover for his wicked deeds. How can we know? At this very moment, some unfortunate Princess might be imprisoned inside that gloomy cave on the hill.
        - id: ch04-b32
          speaker: circus_man
          text: >-
            Saint George regretted the question at once. The Boy looked truly distressed.
        - id: ch04-b33
          speaker: boy
          text: >-
            I promise you there is no Princess in the cave. The dragon is a complete gentleman. No one would be more shocked than he would be to hear you speak so loosely about a subject on which he has very strong opinions.
        - id: ch04-b34
          speaker: saint_george
          text: >-
            Perhaps I have been too ready to believe what I heard. It is possible that I judged the creature unfairly. But what can we do now? The dragon and I are almost face to face. Everyone believes that each of us is thirsting for the other's blood, and the usual rules leave no clear way out. You know your friend and this countryside better than I do. What do you suggest? Is there no way you could arrange matters somehow?
        - id: ch04-b35
          speaker: boy
          text: >-
            That's exactly what the dragon said. Both of you leave everything to me. I suppose I can't persuade you to slip away quietly?
        - id: ch04-b36
          speaker: saint_george
          text: >-
            I'm afraid that is impossible. It breaks all the rules, and you know it.
        - id: ch04-b37
          speaker: boy
          text: >-
            Then will you walk up the hill with me, meet the dragon, and talk it over? It isn't far, and any friend of mine will be welcome.
        - id: ch04-b38
          speaker: saint_george
          text: >-
            It is irregular, but it also seems the most sensible course. You're taking great trouble for your friend. Cheer up. Perhaps we can avoid a fight after all.
        - id: ch04-b39
          speaker: boy
          text: >-
            But I do hope we still have one.
    - id: ch05
      title: An Arrangement Among Friends
      blocks:
        - id: ch05-b01
          speaker: boy
          text: >-
            Dragon, I've brought a friend to meet you!
        - id: ch05-b02
          speaker: circus_man
          text: >-
            The dragon woke with a start.
        - id: ch05-b03
          speaker: dragon
          text: >-
            I was only thinking about things. I'm very pleased to meet you, sir. What charming weather we're having.
        - id: ch05-b04
          speaker: boy
          text: >-
            This is Saint George. Saint George, this is the dragon. We came to discuss matters quietly. Dragon, please use plain common sense so we can reach a practical agreement. I'm tired of theories, opinions, and personal tendencies. Also, Mother is waiting up.
        - id: ch05-b05
          speaker: dragon
          text: >-
            I'm delighted to meet you, Saint George. I hear you've traveled widely, while I've always stayed close to home. If you remain nearby, I could show you our local antiquities and many interesting features of the countryside.
        - id: ch05-b06
          speaker: saint_george
          text: >-
            I think we should follow our young friend's advice and reach a businesslike understanding about this affair. Wouldn't the simplest plan be to fight properly and let the better man win? The villagers are betting on you, but I don't hold that against you.
        - id: ch05-b07
          speaker: boy
          text: >-
            Yes, please do, dragon! It would save us so much trouble.
          emotion: happy
        - id: ch05-b08
          speaker: dragon
          text: >-
            Young man, you may be quiet. Believe me, Saint George, there is nobody in the world I would rather oblige than you and this young gentleman. But this whole business is nonsense from beginning to end. It comes entirely from convention and the thick-headed ideas of the public. You and I have absolutely nothing to fight about. And whatever anyone says, I am not going to fight. That settles the matter completely.
        - id: ch05-b09
          speaker: saint_george
          text: >-
            What if I force you to fight?
        - id: ch05-b10
          speaker: dragon
          text: >-
            You cannot force me. I would simply go inside my cave and retire for a while down the tunnel where I came up. You would sit outside waiting for me to come out and fight, and before long you would be thoroughly tired of it. Once you had truly gone away, I would come cheerfully back to the surface. I tell you plainly, I like this country, and I intend to stay here.
        - id: ch05-b11
          speaker: circus_man
          text: >-
            Saint George looked across the beautiful land around them.
        - id: ch05-b12
          speaker: saint_george
          text: >-
            Still, this would be a beautiful place for a fight. Look at these great, bare, rolling Downs. They form a perfect arena. Imagine the sight of me in my golden armor, standing out against all your enormous coils of blue scales. Think what a splendid picture the two of us would make together.
        - id: ch05-b13
          speaker: dragon
          text: >-
            Now you're appealing to my artistic feelings. It won't succeed. Though I admit the picture would be lovely.
        - id: ch05-b14
          speaker: boy
          text: >-
            At last we're getting closer to business. Dragon, there must be some kind of fight. You don't want to crawl down that filthy tunnel and stay there for nobody knows how long.
        - id: ch05-b15
          speaker: saint_george
          text: >-
            Perhaps we can arrange matters. I must put my spear into you somewhere, naturally, but no rule says I have to hurt you very much. There is such a great deal of you that you must have one or two spare places. Look here, for example, just behind your front leg. A little touch from the spear there could hardly hurt you at all.
        - id: ch05-b16
          speaker: dragon
          text: >-
            George, you're tickling me now. No, that particular place will not do at all. Even if the spear did not hurt, and I feel certain it would hurt dreadfully, it would make me laugh. A dragon laughing at the moment he is speared would spoil the whole effect of the battle.
        - id: ch05-b17
          speaker: saint_george
          text: >-
            Then we'll choose another place. Under your neck, perhaps. Those folds of thick skin should be safe. If I put the spear here, you may not even feel it.
        - id: ch05-b18
          speaker: dragon
          text: >-
            Are you certain you can strike the right spot?
        - id: ch05-b19
          speaker: saint_george
          text: >-
            Absolutely. Leave that part to me.
        - id: ch05-b20
          speaker: dragon
          text: >-
            The fact that I have to leave it to you is exactly why I asked. If you made an error in the hurry and excitement, I do not doubt that you would regret it deeply. Still, you could never regret it half as much as I would. However, I suppose we all have to trust somebody as we travel through life. On the whole, your plan seems as good as any other.
        - id: ch05-b21
          speaker: boy
          text: >-
            Wait, dragon. This arrangement gives you the worst of everything. There will be a fight, and you will lose it. What do you get in return?
        - id: ch05-b22
          speaker: dragon
          text: >-
            Saint George, please tell him what happens after you defeat me in deadly combat.
        - id: ch05-b23
          speaker: saint_george
          text: >-
            According to the rules, I lead you triumphantly down to the marketplace, or whatever serves as one here.
        - id: ch05-b24
          speaker: dragon
          text: >-
            Exactly. And then?
        - id: ch05-b25
          speaker: saint_george
          text: >-
            Then come cheers and speeches. I explain that you have changed your ways and seen your mistakes.
        - id: ch05-b26
          speaker: dragon
          text: >-
            Quite so. And after that?
        - id: ch05-b27
          speaker: saint_george
          text: >-
            After that comes the usual banquet, I suppose.
        - id: ch05-b28
          speaker: dragon
          text: >-
            Precisely. That is where I come into the plan. Boy, I'm bored to death up here, and nobody truly appreciates me. With the generous help of Saint George, who is taking such trouble on my behalf, I am going into Society. I have every quality needed to make people who give parties adore me. So now everything is settled. If you don't mind, I am rather old-fashioned about late visitors. I would never wish to turn you out, of course, but it is getting on toward bedtime.
        - id: ch05-b29
          speaker: saint_george
          text: >-
            You must do your share during the battle. You need to ramp, breathe fire, and behave properly.
        - id: ch05-b30
          speaker: dragon
          text: >-
            I can ramp perfectly well. I'm out of practice with fire, but I'll do my best. Good night.
        - id: ch05-b31
          speaker: circus_man
          text: >-
            Saint George and the Boy left the dragon and walked together down the hill. They had covered almost the whole distance and were nearly back in the village when the Saint suddenly stopped in his tracks. Something important had only just returned to his mind.
        - id: ch05-b32
          speaker: saint_george
          text: >-
            I knew I'd forgotten something. We need a Princess, terrified and chained to a rock. Boy, can you arrange one?
        - id: ch05-b33
          speaker: circus_man
          text: >-
            The Boy was halfway through an enormous yawn.
        - id: ch05-b34
          speaker: boy
          text: >-
            I'm tired to death. I cannot arrange a Princess, and I cannot arrange one more thing at this time of night. Mother is still waiting up for me. Please, both of you, stop asking me to arrange anything else until tomorrow!
    - id: ch06
      title: The Battle on the Downs
      blocks:
        - id: ch06-b01
          speaker: circus_man
          text: >-
            Early next morning, people streamed onto the Downs in Sunday clothes, carrying baskets with bottle necks sticking out. Everyone meant to secure a good view of the battle. Choosing a place was not simple. The dragon might win, and even those who had put money on him could hardly expect him to treat his supporters differently from anyone else. So the spectators studied the ground carefully and chose spots that offered a quick escape in an emergency. The front row was mostly boys who had escaped from their parents. They sprawled and rolled on the grass, ignoring the sharp threats and warnings their anxious mothers called from behind.
        - id: ch06-b02
          speaker: circus_man
          text: >-
            The Boy had found an excellent front place high up near the cave. He felt as nervous as the manager of a new play on its opening night. Could the dragon really be trusted? At the last moment, he might change his mind, declare the entire performance ridiculous, and refuse to appear. Or the hurried plan and the complete lack of rehearsal might make him too nervous to come out. The Boy watched the cave closely, but its grim entrance showed no life and no sign that anyone lived there. Could the dragon have packed up and slipped away by moonlight?
        - id: ch06-b03
          speaker: circus_man
          text: >-
            By now, the higher slopes were black with spectators. Suddenly, cheers and waving handkerchiefs showed that the distant people could see something still hidden from the Boy. A minute later, Saint George's red feathers rose above the hill. The Saint rode slowly onto the broad, level ground before the dark mouth of the cave. He looked gallant and beautiful on his tall warhorse. Sunlight flashed from his golden armor. He held his great spear upright, and at its point a little white flag marked with a crimson cross fluttered in the breeze.
        - id: ch06-b04
          speaker: circus_man
          text: >-
            Saint George stopped and waited. The crowd edged backward. Even the boys in front stopped fighting among themselves and leaned forward.
        - id: ch06-b05
          speaker: boy
          text: >-
            Come on, dragon!
        - id: ch06-b06
          speaker: circus_man
          text: >-
            If the Boy had known the truth, he would not have worried. The dramatic possibilities of the day had delighted the dragon. He had been awake since very early morning, preparing for his first appearance before the public with all his heart. It was as if the years had rolled backward and made him a little dragon again, playing on the floor of his mother's cave with his sisters. Their favorite game had been saints and dragons, and in that game the dragon was always supposed to win.
        - id: ch06-b07
          speaker: circus_man
          text: >-
            First came a low muttering mixed with snorts. It rose and rose until a bellowing roar seemed to fill the whole plain. A cloud of smoke hid the mouth of the cave. Then, from the middle of it, the dragon pranced splendidly into view. He was shining, sea-blue, and magnificent. The whole crowd made one long sound of wonder, as if a mighty rocket had gone up before them. His scales glittered in the light. His long spiked tail lashed against his sides. His claws tore the turf and sent pieces flying high over his back. Smoke and fire poured without stopping from his angry nostrils.
        - id: ch06-b08
          speaker: boy
          text: >-
            Well done, dragon! I never knew he had that in him!
          emotion: happy
        - id: ch06-b09
          speaker: circus_man
          text: >-
            Saint George lowered his spear, bowed his head, and drove his heels against the horse. He thundered across the grass. The dragon charged to meet him with a roar and a squeal, all blue coils, snapping jaws, spikes, snorts, and fire.
        - id: ch06-b10
          speaker: villager
          text: >-
            He missed!
          emotion: surprised
        - id: ch06-b11
          speaker: circus_man
          text: >-
            Golden armor, blue-green coils, and a spiked tail tangled for a moment. Then the great horse pulled Saint George away toward the cave, his spear swinging high. The dragon sat down and barked viciously while the Saint struggled to turn his horse.
        - id: ch06-b12
          speaker: circus_man
          text: >-
            The Boy silently called it the end of the first round. Both performers had managed beautifully. He only hoped the Saint would not become too excited. The dragon was dependable, but what a shameless actor he was.
        - id: ch06-b13
          speaker: circus_man
          text: >-
            Saint George finally persuaded his horse to stand still. He looked around while wiping his forehead. When he caught sight of the Boy, he smiled, nodded, and for one instant held up three fingers. The whole thing had clearly been planned. The third round would finish it. The Boy wished the battle could have lasted a little longer. Then he wondered what that foolish old dragon was doing now.
        - id: ch06-b14
          speaker: circus_man
          text: >-
            During the pause, the dragon gave the crowd a full ramping performance. Ramping, you should know, means running round and round in one wide circle. At the same time, you send waves and ripples of movement along your entire spine, beginning at the tips of your pointed ears and traveling right down to the spike at the end of your long tail. If you happen to be covered in blue scales, the effect is especially pleasing. As he watched, the Boy remembered the dragon's recent wish to become a success in society.
        - id: ch06-b15
          speaker: circus_man
          text: >-
            Saint George gathered his reins, lowered the spear point, and settled firmly into the saddle.
        - id: ch06-b16
          speaker: villager
          text: >-
            Time! Start the next round!
          emotion: happy
        - id: ch06-b17
          speaker: circus_man
          text: >-
            The dragon stopped ramping, sat upright, and began bounding from side to side in huge, awkward leaps, whooping wildly as he went. The unexpected movement confused the horse, which swerved violently. Saint George nearly fell and saved himself only by grabbing the mane. As horse and rider shot past, the dragon made a vicious snap at the horse's tail. The poor frightened animal raced madly far across the Downs. Saint George lost one stirrup along the way. Fortunately for the crowd, he was too far off for anyone to hear the language he used.
        - id: ch06-b18
          speaker: circus_man
          text: >-
            The second round brought loud signs of friendship toward the dragon. The spectators quickly learned to appreciate a fighter who could hold his own and was plainly determined to give them good sport. Encouraging remarks came from every side. The dragon heard them all as he strutted back and forth, chest pushed out and tail held in the air. He was enjoying his sudden popularity enormously.
        - id: ch06-b19
          speaker: circus_man
          text: >-
            Saint George had dismounted and was tightening the straps around his saddle. At the same time, in a great and almost Eastern flow of colorful language, he told his horse exactly what he thought of the animal, its conduct during the second round, and every one of its relations. While he worked, the Boy made his way to that end of the field and held the Saint's spear for him.
        - id: ch06-b20
          speaker: boy
          text: >-
            It's been a wonderful fight, Saint George. Couldn't you make it last a little longer?
        - id: ch06-b21
          speaker: saint_george
          text: >-
            I had better not. Your innocent old friend is becoming conceited now that people are cheering. Soon he'll forget our plan and start behaving foolishly, and nobody knows where he would stop. I'll finish matters in this round.
        - id: ch06-b22
          speaker: circus_man
          text: >-
            Saint George mounted and took back his spear.
        - id: ch06-b23
          speaker: saint_george
          text: >-
            Don't be afraid. I marked the safe spot exactly. He will help me reach it because he knows this is his only way into the banquet.
          emotion: calm
        - id: ch06-b24
          speaker: circus_man
          text: >-
            This time Saint George shortened his grip on the spear and tucked its heavy end firmly beneath his arm. Instead of charging at a gallop, he came toward the dragon at a smart trot. The dragon crouched as he approached, flicking his tail until its tip cracked through the air like a huge cart whip. Near his opponent, the Saint wheeled aside and began circling carefully, never taking his eyes from the agreed spare place. The dragon used the same tactics and paced around the circle with equal care. Now and then, he made a false dart with his head. They watched and waited for an opening while every spectator held his breath.
        - id: ch06-b25
          speaker: circus_man
          text: >-
            The careful circling lasted several minutes, but the end came so quickly that the Boy saw almost nothing. There was a lightning movement of Saint George's arm. Then came a whirl and confusion of spines, claws, tail, and pieces of turf flying through the air. The dust settled. With a great shout, the spectators ran toward the fighters. Through the crowd, the Boy finally made out the dragon lying flat on the ground, pinned there by the spear. Saint George had dismounted and stood astride him.
        - id: ch06-b26
          speaker: circus_man
          text: >-
            The fall and the spear looked so genuine that the Boy ran forward breathlessly. He feared his dear old friend might truly have been wounded. As he came near, the dragon lifted one enormous eyelid, gave him a slow and solemn wink, and then collapsed once more. The creature was pinned firmly to the ground by the neck, but Saint George had struck the exact spare place they had agreed upon. The spear did not even seem to tickle him.
        - id: ch06-b27
          speaker: villager
          text: >-
            Aren't you going to cut his head off, sir?
        - id: ch06-b28
          speaker: circus_man
          text: >-
            The man had bet on the dragon and felt rather disappointed.
        - id: ch06-b29
          speaker: saint_george
          text: >-
            Not today, I think. We can always do that later, so there is no hurry. First, let us all return to the village for refreshments. Then I'll speak firmly to him, and you will find him a very different dragon.
        - id: ch06-b30
          speaker: circus_man
          text: >-
            At the magical word “refreshments,” the whole crowd instantly formed a procession and waited in silence for the signal to begin. The hours for talking, cheering, and betting had passed. Now the hour for action had arrived. Saint George gripped the spear with both hands and pulled until the dragon was free. The dragon got up, shook himself, and ran an eye over his spikes, scales, and all his other parts to make certain they remained in order. Then the Saint mounted and led the procession. The dragon followed meekly beside the Boy, while the thirsty spectators marched behind them at a respectful distance.
    - id: ch07
      title: The Dragon Goes into Society
      blocks:
        - id: ch07-b01
          speaker: circus_man
          text: >-
            Great celebrations began when they reached the village and formed up before the inn. After the refreshments, Saint George stood and gave a speech. He told the villagers that he had removed their dreadful scourge, although doing so had caused him great trouble and inconvenience. From now on, they must not wander around grumbling and imagining that they suffered from grievances, because they did not. They must also stop being so fond of fights. The next time trouble came, they might have to do the fighting themselves, and they would discover that taking part felt very different from watching.
        - id: ch07-b02
          speaker: circus_man
          text: >-
            There was also a certain badger imprisoned in the inn stable. It must be released at once, and Saint George would personally see that it happened. Then he spoke about the dragon. The creature had thought matters over and now understood that every question had two sides. He had seen the error of his ways and promised never to do such things again. If the villagers behaved well, perhaps he would stay and settle among them. They must make friends with him. They must not be prejudiced or go around imagining they knew everything there was to know, because they did not know everything, not by a very long way.
        - id: ch07-b03
          speaker: circus_man
          text: >-
            Finally, Saint George warned the villagers against the sin of inventing stories. They must not imagine that other people would believe a tale merely because it sounded possible and had been painted in exciting colors. Then he sat down amid a great deal of cheering that sounded thoroughly repentant. The dragon nudged the Boy in the ribs and whispered that he could not have made a better speech himself. With the serious business completed, everyone hurried away to prepare for the banquet.
        - id: ch07-b04
          speaker: circus_man
          text: >-
            Banquets are always pleasant because they mostly consist of eating and drinking. The especially pleasant thing is that a banquet comes after something is over. There is nothing more to worry about, and tomorrow seems a long way off. Saint George was happy because there had been a fight and he had not needed to kill anyone. He did not truly like killing, although his duties usually made him do it. The dragon was happy because he had fought without being hurt. Better still, the fight had brought him popularity and a secure place in society. The Boy was happy because there had been a fight, yet his two friends were now on the best possible terms. Everyone else was happy because there had been a fight. They needed no further reason.
        - id: ch07-b05
          speaker: circus_man
          text: >-
            The dragon made a great effort to say exactly the right thing to each person he met. Before long, he had become the life and soul of the whole evening. Saint George and the Boy watched from nearby. It seemed to them that they were merely guests at a feast where all the honor and glory belonged to the dragon. They did not mind. They were good fellows, and the dragon was neither proud of his triumph nor forgetful of his friends. On the contrary, about every ten minutes he leaned toward the Boy and asked the same important question.
        - id: ch07-b06
          speaker: dragon
          text: >-
            You will walk home with me afterward, won't you?
        - id: ch07-b07
          speaker: circus_man
          text: >-
            Each time, the Boy nodded, although he had promised his mother not to stay out late.
        - id: ch07-b08
          speaker: circus_man
          text: >-
            At last the banquet came to an end. One by one, the guests drifted away, offering many good nights, congratulations, and invitations as they went. The dragon stayed until he had seen the very last person safely off the premises. Then he emerged into the quiet street with the Boy behind him. He wiped his forehead, gave a great sigh, sat down in the middle of the road, and gazed upward at the stars.
        - id: ch07-b09
          speaker: dragon
          text: >-
            What a wonderful night it has been. Wonderful stars too, and what a wonderful little village. I think I shall simply stay here. I do not feel at all like climbing that horrible hill. The Boy promised to see me home. The Boy had better do it, then. I have no responsibility in the matter. All responsibility belongs to the Boy.
        - id: ch07-b10
          speaker: circus_man
          text: >-
            His chin dropped onto his broad chest, and he fell peacefully asleep.
        - id: ch07-b11
          speaker: boy
          text: >-
            Oh, get up, dragon! You knew Mother was waiting. I'm so tired, and you made me promise to take you home. If I'd understood what you meant, I never would have promised!
          emotion: sad
        - id: ch07-b12
          speaker: circus_man
          text: >-
            The Boy sat down in the road beside the sleeping dragon and began to cry. Then the door behind them opened, and a broad stream of light fell across the road. Saint George had left the inn to take a quiet walk in the cool night air. He immediately noticed the two figures sitting there, the great dragon completely still and the tired little Boy in tears.
        - id: ch07-b13
          speaker: saint_george
          text: >-
            What's wrong, Boy?
        - id: ch07-b14
          speaker: boy
          text: >-
            It's this great lumbering pig of a dragon! He made me promise to take him home. Then he told me to do it and went to sleep. I might as well take a haystack home. I'm exhausted, and Mother is waiting.
          emotion: sad
        - id: ch07-b15
          speaker: saint_george
          text: >-
            Don't cry. I'll help you, and together we'll take him home. Wake up, dragon!
          emotion: calm
        - id: ch07-b16
          speaker: circus_man
          text: >-
            Saint George shook the dragon by the elbow. The dragon opened his eyes sleepily.
        - id: ch07-b17
          speaker: dragon
          text: >-
            What a night, George. What a wonderful—
        - id: ch07-b18
          speaker: saint_george
          text: >-
            Listen, dragon. This little fellow is waiting to take you home. He should have been in bed two hours ago, and I don't know what his mother will say. Anyone but a selfish pig would have sent him home long ago.
        - id: ch07-b19
          speaker: dragon
          text: >-
            Then he shall go to bed at once! Just imagine that poor little fellow still awake at this hour. It is shameful, that's what it is. Saint George, I really do not think you have been very considerate. Come along immediately, and let us have no more arguing, delay, or shilly-shallying. Boy, give me your hand. Thank you. And George, an arm to help me up the hill is exactly what I wanted.
        - id: ch07-b20
          speaker: circus_man
          text: >-
            So the three set off arm in arm up the hill: the Saint, the Dragon, and the Boy. One by one, the lights in the little village began to go out behind them. But stars shone above, and a late moon gave them light as they climbed together toward the Downs. At the final corner, the three companions turned and disappeared from sight. Snatches of an old song came drifting back on the night breeze. I cannot say with certainty which of them was singing, but I think it was the Dragon.
        - id: ch07-b21
          speaker: circus_man
          text: >-
            Here we are at your gate. Good night. Hurry inside, or you'll be in trouble.
        - id: ch07-b22
          speaker: narrator
          text: >-
            Could it truly be our own gate? Yes. The familiar marks were still on its bottom bar where our feet rubbed when we swung on it.
        - id: ch07-b23
          speaker: charlotte
          text: >-
            Wait! I still want to know so many things. Did the dragon really settle there? And did—
        - id: ch07-b24
          speaker: circus_man
          text: >-
            There is no more of that story. At least, not tonight. Off you go now. Good-bye!
        - id: ch07-b25
          speaker: charlotte
          text: >-
            Do you think any of it was true? Some parts sounded terribly like nonsense.
        - id: ch07-b26
          speaker: narrator
          text: >-
            I told her encouragingly that it might be true all the same. Charlotte bolted up the path and inside like a rabbit escaping from the cold and dark. I stayed outside for one more moment. The air was still and frosty. I looked back at the silent white world we were leaving, then turned toward the different country waiting indoors, a land of warm firelight, soft cushions, and laughter.
        - id: ch07-b27
          speaker: narrator
          text: >-
            It had been the day for choir practice, and Christmas carol time was drawing near. One choir member was late going home. As he passed down the road, he sang a carol about Saint George making his reverence in a dim stable. The song said that he had defeated a dragon so fearful, grim, and fierce that now everyone could wake peacefully on Christmas Day.
        - id: ch07-b28
          speaker: narrator
          text: >-
            The singer moved farther away, and the carol faded. With my hand on the door latch, I wondered if that was the song, or something like it, that the dragon had sung while toddling happily up the hill.
