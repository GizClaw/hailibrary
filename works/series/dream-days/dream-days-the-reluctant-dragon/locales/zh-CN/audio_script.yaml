        delivery: 机智而从容，带着温和的回望
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    charlotte:
      display_name: 夏洛特
      tts:
        delivery: 聪敏直率，带着孩子的好胜和笃定
        timbre: 清脆明亮
        pace: 轻快
        pitch: 中高
    circus_man:
      display_name: 马戏人
      tts:
        delivery: 随和幽默，像一位善于讲故事的老朋友
        timbre: 温厚微沙
        pace: 从容
        pitch: 中低
    shepherd:
      display_name: 牧羊人
      tts:
        delivery: 朴实坦率，受惊时语气急促
        timbre: 粗粝浑厚
        pace: 中等
        pitch: 中低
    shepherd_wife:
      display_name: 牧羊人的妻子
      tts:
        delivery: 明理务实，说话稳当利落
        timbre: 温暖结实
        pace: 中等
        pitch: 中等
    boy:
      display_name: 男孩
      tts:
        delivery: 聪慧沉着，有书生气又保留孩子的热切
        timbre: 清亮柔和
        pace: 中等
        pitch: 中高
    dragon:
      display_name: 龙
