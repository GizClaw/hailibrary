        delivery: 文雅懒散，爱聊天也爱自我辩解
        timbre: 圆润深厚
        pace: 舒缓
        pitch: 中低
    village_boy:
      display_name: 村里的男孩
      tts:
        delivery: 兴奋爽快，话里满是看热闹的期待
        timbre: 清脆
        pace: 轻快
        pitch: 中高
    saint_george:
      display_name: 圣乔治
      tts:
        delivery: 庄重和善，带着坦荡的幽默
        timbre: 明亮浑厚
        pace: 沉稳
        pitch: 中低
    spectator:
      display_name: 观众
      tts:
        delivery: 直白不快，带着赌输后的抱怨
        timbre: 普通粗亮
        pace: 中等
        pitch: 中等
    choir_member:
      display_name: 唱诗班成员
      tts:
        delivery: 朴素虔诚，像走在夜路上自然哼唱
        timbre: 清亮柔和
        pace: 舒缓
        pitch: 中等
  chapters:
    - id: ch01
      title: 雪地上的龙脚印
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 自从我们头一回看见雪，那些洁白的脚印就总能勾起各种念头。有位姑妈曾送过我们一本诗集，里面的华兹华斯为脚印写了诗，还配了一幅图。可那诗和那份心情，我们都不大欣赏。沙地上的脚印却不一样。我们更懂鲁滨孙看见脚印时的感受。不管踪迹留在沙上还是雪上，它们只会让我们兴奋、好奇，又觉得神秘。
        - id: ch01-b02
          speaker: narrator
          text: 那个冬日早晨，我们醒得很早，还奇怪房里怎么亮了许多。等我们终于明白过来，打雪仗已经不是一场梦，它就在门外等着。接下来，大家为了抢衣服乱成一团。门口白白堆着那么多雪，谁还有耐心系靴带，再一颗一颗地扣好外套呢？
        - id: ch01-b03
          speaker: narrator
          text: 到了吃饭的时候，大人几乎是揪着后颈把我们拖回屋里的。短暂休战刚结束，草坪上又打了起来。可夏洛特和我很快就腻了，也受够了雪团钻进衣服，沿着身子一路滑下去、冰得人发抖的滋味。我们离开被脚步和雪球踩得稀烂的战场，走向更远处没人踏过的白色世界。熟悉的一切忽然藏进了一件神秘又柔软的新外衣，朝四面八方看去，都一望无际，连一道缝也找不出来。偶尔有一只鸟落下，在雪面上留下几枚浅浅的印子。除此以外，几乎看不见别的来客。也正因为这样，那串奇怪的足迹才更加叫人费解。
        - id: ch01-b04
          speaker: narrator
          text: 我们在灌木丛转角发现了它。两个人双手撑着膝盖，低头研究了很久。我们一向觉得自己是老练的捕兽人，如今竟然认不出这是什么野兽，实在有点丢脸。
        - id: ch01-b05
          speaker: charlotte
          text: 你真的不知道吗？我还以为天下的野兽，没有你不认识的呢。
        - id: ch01-b06
          speaker: narrator
          text: 她这么一说，我的好胜心立刻被挑了起来。我一口气报出一大串动物的名字，从北极说到热带，其实自己也没多大把握。
        - id: ch01-b07
          speaker: charlotte
          text: 都不对。这些脚印有点像蜥蜴。你刚才说过禽龙吗？说不定就是它。不过禽龙又不是英国的，我们要找的得是真正的英国野兽。我看，这是一条龙！
        - id: ch01-b08
          speaker: narrator
          text: 龙怎么会这么小？
        - id: ch01-b09
          speaker: charlotte
          text: 龙刚出生的时候当然也得很小，别的东西不都一样吗？也许是一条迷路的小龙。养着一定很好玩。它也许会抓人，会吐口水，可还干不了真正可怕的事。快，我们追下去！
        - id: ch01-b10
          speaker: narrator
          text: 我们手拉手走进宽广的雪地，心里全是期待。只凭几枚模糊的痕迹，我们就得意地认定，很快便能捉到一头没长大的传说怪兽。脚印越过牧场，贴着树篱到了下一片田，然后像个守法纳税的文明人那样走上大路，混进普通人的足迹里。到了这里，真正的踪迹再也分辨不出。可想象力再加上一个咬定不放的念头，往往能办成许多事。我们深信自己知道龙天生会往哪个方向走。何况夏洛特还不时坚持说，她又看见了新脚印。既然那是她的龙，我就让她负责追踪，自己在旁边安稳地小跑。这好歹是一次远征，总会碰上点事。
        - id: ch01-b11
          speaker: narrator
          text: 夏洛特又领我穿过田野和小树林。我渐渐怀疑，她只是拉不下脸，才假装还看得见脚印。最后，她兴奋地拖着我钻过一道私人树篱的缺口。眼前的田野一下消失了，我们进了一座整齐幽静的花园，怎么看都不像有龙。我马上认出，这是我那位马戏人朋友的花园。
        - id: ch01-b12
          speaker: narrator
          text: 马戏人正叼着烟斗，在小径上悠闲散步。我走过去，很客气地问他，近来有没有见过一头野兽。
        - id: ch01-b13
          speaker: circus_man
          text: 请问，你们要找的究竟是哪一种野兽？
        - id: ch01-b14
          speaker: narrator
          text: 它长得有点像蜥蜴。夏洛特说那是龙，可她其实不大懂野兽。
        - id: ch01-b15
          speaker: circus_man
          text: 我想，这一带近来没见过龙。不过要是碰上了，我会知道它属于你们，马上请人送过去。
        - id: ch01-b16
          speaker: charlotte
          text: 真是太谢谢您了。不过请别那么麻烦，因为它也许根本不是龙。我只是在雪上看见了小脚印，它们好像一直通到这里。当然，也许我们全弄错了。不管怎样，还是谢谢您。
        - id: ch01-b17
          speaker: circus_man
          text: 一点也不麻烦，我求之不得。当然，也可能只是个误会。天快黑了，不管那是什么，现在看来都已经跑掉。你们进屋喝茶吧。我正好一个人，咱们生起一大炉火。我还有一本特别大的《野兽大全》，世界上所有野兽都在里面，幅幅都是彩色图。我们一起找找你们的野兽！
        - id: ch01-b18
          speaker: narrator
          text: 只要有人请喝茶，我们向来不会拒绝。茶要是还能配上野兽，那就更好了。桌上甚至端来了橘子酱和杏子果酱，两样都是特意为我们拿来的。喝完茶，那本最大号的《野兽大全》在桌上彻底摊开。马戏人一点也没夸口，世上曾经有过的野兽，那本书果然一种也没漏掉，而且每一种都有彩色图。我们一页页看下去，早就忘了外面的天色。直到钟敲了六下，谨慎的夏洛特开始用胳膊肘碰我，我们才好不容易从那个充满彩色图画的野兽王国里回过神，恋恋不舍地站起来告辞。
        - id: ch01-b19
          speaker: circus_man
          text: 等一等，我同你们一起走。我还想抽一斗烟，散散步也有好处。你们要是不想说话，不用特意陪我聊。
        - id: ch01-b20
          speaker: narrator
          text: 我们的精神马上又好了。离开明亮温暖的屋子和彩色的野兽书，回去的路好像忽然长了许多，外面的世界也黑得阴森。可能跟一个真正的大人并肩散步，本身就是难得的享受。我们轻快地出发，马戏人走在中间。我仰头看他，暗想自己这辈子能不能活到叼着大烟斗，也摆出这样漫不经心的威严。夏洛特还年轻，没把烟草当作人生可能达到的目标，所以她从另一边先开了口。
        - id: ch01-b21
          speaker: charlotte
          text: 那么，请给我们讲个故事，好不好？
        - id: ch01-b22
          speaker: narrator
          text: 马戏人重重叹了口气，又往四下看了看。
        - id: ch01-b23
          speaker: circus_man
          text: 我就知道，早晚逃不过讲故事这一关。我干吗要离开舒服的炉火呢？好吧，我讲。先让我想一会儿。
        - id: ch01-b24
          speaker: narrator
          text: 他真的安安静静地想了一会儿。我们在黑暗的回家路上等着，然后，他给我们讲了下面这个故事。
    - id: ch02
      title: 南丘洞里的新邻居
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 很久以前，也许是几百年前，从村子走到南丘山肩的半路上，有一间小屋。屋里住着一个牧羊人、他的妻子和幼小的儿子。牧羊人白天总在宽阔如海的南丘上度过，一年里有些时候，夜间也只有太阳、星星和羊群陪着他。那儿离人们热闹的世界太远，既看不见，也听不到。
        - id: ch02-b02
          speaker: narrator
          text: 他的儿子只要不帮父亲做事，就把时间全埋进厚书里。其实就算在帮忙，他也常常这么干。书是附近和气的乡绅和热心的牧师借给他的。父母很爱他，也以他为傲，只是不当面说。他们把儿子当成平辈，觉得一家人这样分工很公平：父母负责实际经验，孩子负责书本学问。邻居们虽然不赞成，他们却知道，书本学问到紧要关头真能派上用场。男孩最爱博物和童话，两样夹在一起读，从不区分。说真的，这个读法很有道理。
        - id: ch02-b03
          speaker: narrator
          text: 一天傍晚，牧羊人回到家。他连着几夜心事重重，早就没了平日的镇定，这时更是浑身发抖。妻子在桌边缝东西，儿子正安安静静地追着看《无心巨人》的冒险。牧羊人一坐下就叫了起来。
        - id: ch02-b04
          speaker: shepherd
          text: 玛丽亚，我这回可全完了！我再也不上南丘，怎么都不去了！
          emotion: fearful
        - id: ch02-b05
          speaker: shepherd_wife
          text: 你先别慌。不管什么东西把你吓成这样，都从头说起。听完以后，我、你，再加上咱们儿子，三个人总能把它弄明白。
          emotion: calm
        - id: ch02-b06
          speaker: shepherd
          text: 事情是前几夜开始的。你们都知道上面那个洞吧？我一向不喜欢它，羊也不喜欢。羊要是不喜欢什么，通常都有原因。近来洞里总有很轻的响动，像沉重的叹气，还夹着哼哼声。有时洞深处会传来鼾声，真的是鼾声，可听着就不像你我晚上打的那种老实鼾声！
        - id: ch02-b07
          speaker: boy
          text: 我明白了。
        - id: ch02-b08
          speaker: shepherd
          text: 我当然怕得要命，可又忍不住想过去看。今天傍晚下山前，我悄悄绕到洞口。老天爷啊，我终于看见他了，看得跟现在看见你们一样清楚！
          emotion: fearful
        - id: ch02-b09
          speaker: shepherd_wife
          text: 你看见谁了？
          emotion: fearful
        - id: ch02-b10
          speaker: shepherd
          text: 当然是他，我不正在告诉你吗！他半截身子探在洞外，好像正很有诗意地享受傍晚凉风。他足有四匹拉车马那么大，满身是发亮的鳞片，上边深蓝，往下慢慢变成柔和的绿色。他一呼吸，鼻孔上方就有一层热气发颤，像盛夏无风时，白垩路面上晃动的空气。他把下巴搁在爪子上，我猜是在沉思。我承认，他看着挺安分，既没乱跳，也没胡闹。可我怎么办？那些鳞片，那些爪子，肯定还有一条尾巴，只是我没看见那一头。我不习惯这些，也不赞成这些。实话就是这样！
        - id: ch02-b11
          speaker: narrator
          text: 父亲说话时，男孩好像一直只顾读书。现在他合上书，打个呵欠，双手扣在脑后，睡意朦胧地开了口。
        - id: ch02-b12
          speaker: boy
          text: 没事的，爸爸。别担心，那不过是一条龙。
          emotion: calm
        - id: ch02-b13
          speaker: shepherd
          text: 不过是一条龙？你坐在那里，一口一个龙，到底是什么意思？还说“不过”！你又懂什么？
          emotion: surprised
        - id: ch02-b14
          speaker: boy
          text: 因为他就是龙，而且我真的懂。爸爸，每个人都有自己拿手的事。你懂羊，懂天气这一类东西，我懂龙。我早就说过，上面那个洞是龙洞。它以前一定属于一条龙。要是规矩还算数，现在当然也该有一条龙。你现在说那里果真有龙，一切就都对了。你以前说洞里没有，那才叫我惊讶。只要安静等着，规矩总会回到正路上。这事交给我吧。明天早上我上去一趟。不行，早上还有很多事。那就傍晚，要是我有空，便去同他谈谈。你会发现一切都没事。只求你别丢下我，自己在那一带乱操心。你一点也不了解龙，他们可敏感了。
        - id: ch02-b15
          speaker: shepherd_wife
          text: 儿子说得完全对。照他的说法，龙是他那一门的事，不是咱们的。人人都承认他特别懂书里的野兽。老实说，一想到那可怜的动物独自躺在山上，没有热晚饭，也没人同他交换消息，我心里就不安。也许咱们还能帮上忙。要是他不够体面，咱们儿子很快就能看出来。他很会让人喜欢，谁碰见他都愿意把话全告诉他。
        - id: ch02-b16
          speaker: narrator
          text: 第二天喝过茶，男孩沿白垩小路慢慢走向南丘顶端。龙果然懒洋洋地躺在洞前草地上。左右的南丘光秃秃地起伏，一直伸出几英里。正前方的山谷里，农舍聚成小团，白路像细线一样穿过果园和田地。地平线极远处，还浮着古老城市的灰色影子。凉风拂过草尖，一轮大月亮露出银色的肩头。难怪龙那么平和满足。男孩走近时，甚至听见他正有节奏地快活打鼾。原来龙也会打鼾，这倒是书里没说过的新知识。
        - id: ch02-b17
          speaker: boy
          text: 喂，龙！
        - id: ch02-b18
          speaker: narrator
          text: 龙听到脚步声，原本还客气地想站起来。一看来的只是个男孩，他立刻严厉地竖起眉毛。
        - id: ch02-b19
          speaker: dragon
          text: 你可不许打我，不许扔石头，不许泼水，这一套什么都别来。我告诉你，我不答应！
          emotion: angry
        - id: ch02-b20
          speaker: boy
          text: 我根本没想打你。看在老天的分上，也别总说“不许”。我听得够多了，又单调，又叫人累。我只是顺路来问问你过得怎样。要是我碍事，马上走就是了。我的朋友多得很，谁也不能说我爱往不欢迎我的地方硬挤。
        - id: ch02-b21
          speaker: dragon
          text: 别，别赌气走呀。其实我在这里快活得不得了，从早到晚都有事做，亲爱的朋友，一刻也不闲着。不过咱们私下说，有时候的确稍微有一点无聊。
        - id: ch02-b22
          speaker: narrator
          text: 男孩咬下一根草茎，放进嘴里慢慢嚌着。
        - id: ch02-b23
          speaker: boy
          text: 你打算在这里住很久吗？
        - id: ch02-b24
          speaker: dragon
          text: 现在还很难说。这地方好像相当不错，可我才来不久。一个人定居之前，总得四处看看，想了又想，再好好考虑。安顿下来可是件郑重的事。况且，我要告诉你一个怎么也猜不到的秘密。其实，我是个懒得要命的家伙！
        - id: ch02-b25
          speaker: boy
          text: 真叫人意外。
        - id: ch02-b26
          speaker: dragon
          text: 这的确是个悲哀的事实。我想，我会来到这里，也正是因为懒。别的家伙都那么活跃，那么认真，整天横冲直撞，打打杀杀，扫荡沙漠，巡视海岸，到处追骑士，还吞吃少女，闹个没完。我只喜欢准时吃饭，然后找块岩石靠着背睡一会儿。醒来以后，再想想世间万事依旧如常，依旧继续。所以那件事发生时，我被困得结结实实。
        - id: ch02-b27
          speaker: boy
          text: 发生了什么事？
        - id: ch02-b28
          speaker: dragon
          text: 这个我也说不准。我猜是大地打了个喷嚏，或是抖了抖身子，也许是什么东西的底突然塌了。反正先是一阵摇晃，再是一声巨响，四下乱成一团。等我明白过来，自己已经在地下好几英里深的地方，卡得丝毫不能动。好在我要的东西不多，那里至少安静，没人老叫我一起去干点什么。我的头脑又活跃得很，我向你保证，它总有事做。不过日子久了，生活也难免一成不变。后来我觉得，挖一条路回到地面，看看你们这些家伙在做什么，应该挺有趣。于是我向这边抓，朝那边挖，终于从这座洞里钻了出来。我喜欢这里的乡野和风景，也喜欢这里的人，至少已经见过的几个都不错。总的说来，我很想在这儿定居。
        - id: ch02-b29
          speaker: boy
          text: 你的头脑总在忙些什么？我正想知道。
        - id: ch02-b30
          speaker: narrator
          text: 龙微微红了脸，把目光移到别处。过了一会儿，他才害羞地回答。
        - id: ch02-b31
          speaker: dragon
          text: 你有没有试过写诗？只是闹着玩那种。我是说，写几行押韵的诗？
        - id: ch02-b32
          speaker: boy
          text: 当然试过，我写了一大堆。我敢说，有些还相当不错，可这里没人真在意。我念给妈妈听时，她倒很和气，爸爸其实也一样。可他们总是有点……
        - id: ch02-b33
          speaker: dragon
          text: 就是这样！我的情形一模一样。他们就是听不进去，你还没法跟他们讲道理。你是个有修养的人，这一点我一眼就看出来了。我在地下随手写了几首小诗，真想请你坦白评评。认识你太让人高兴了。但愿别的邻居也这么友善。昨夜有位很不错的老先生来过，可他好像不愿打扰我。
          emotion: happy
        - id: ch02-b34
          speaker: boy
          text: 那是我爸爸。他的确是位很不错的老先生。你要是愿意，改天我给你们正式介绍。
        - id: ch02-b35
          speaker: dragon
          text: 你们父子俩明天能不能来这里吃顿饭什么的？当然，前提是你们没有更要紧的事。
        - id: ch02-b36
          speaker: boy
          text: 非常感谢。可没有妈妈，我们从不去任何地方。老实说，我怕她不一定能完全赞成你。有一个硬邦邦的事实怎么都绕不过去：你是一条龙，对不对？你又说要定居，还说起邻居，可你根本没弄清自己的处境。你是人类的敌人呀！
        - id: ch02-b37
          speaker: dragon
          text: 我在世上一个敌人也没有。别的先不说，我连结仇都嫌累。就算我把自己的诗念给别人听，也一直愿意听听人家的诗。
        - id: ch02-b38
          speaker: boy
          text: 哎呀，真希望你能明白眼下的处境。别人发现你以后，会带着长矛、刀剑和各种家伙来追杀你。在他们眼里，你非给消灭不可。你是祸害，是灾星，是有害的怪兽！
        - id: ch02-b39
          speaker: dragon
          text: 没有一个字是真的。我的品格经得起最严格的调查。说起来，你出现时，我正在琢磨一首像十四行诗的小东西……
        - id: ch02-b40
          speaker: boy
          text: 你要是再不肯讲道理，我可回家了。不，我没空听十四行诗，妈妈还等着我。明天有空我再来。看在老天的分上，请你努力明白，自己是个会散播瘟疫的祸害。不然你非惹上天大的麻烦不可。晚安！
          emotion: angry
        - id: ch02-b41
          speaker: narrator
          text: 男孩没费多大力气就让父母放下心来。他们一向把龙这一门的事交给他，毫不犹豫地信了他。牧羊人后来正式认识了龙。两边都很讲礼数，互相说了许多赞美和亲切的问候。母亲却始终不肯正式承认这位新朋友。她说自己很愿意帮忙，可以缝补需要缝补的东西，也可以帮龙把洞穴收拾整齐。要是龙埋头写十四行诗，又像所有雄性生物一样忘了吃饭，她也可以替他做点吃的。可龙终究是龙，“谁也不知道他是什么来历”。在母亲看来，只凭这一条，就压过了所有别的好处。不过，只要儿子九点前回家，她并不反对他每晚安安静静地陪龙坐坐。于是，男孩和龙度过了许多快乐的夜晚。他们坐在草地上，龙一讲就讲很久，说的都是极古老的日子。那时候，龙在各处都能看见，世界比今天热闹得多，生活里到处都是惊险、跳荡和出人意料的事。
        - id: ch02-b42
          speaker: narrator
          text: 男孩担心的事很快就发生了。一条龙就算再谦虚，再不愿露面，只要有四匹拉车马那么大，还披着满身蓝鳞，就不可能永远不被看见。每天晚上，村里的酒馆都在说，南丘洞里盘踞着一条活龙。村民们怕得要命，又很自豪。村里有一条自己的龙，毕竟是份殊荣。不过人人还是同意，事情不能这样继续。
        - id: ch02-b43
          speaker: narrator
          text: 可怕的野兽必须消灭，四乡必须摆脱这场灾难、恐怖和毁灭性的祸害。至于龙来以后连一座鸡窝也没损坏，这个事实根本不许拿出来讨论。他是龙，这一点无法否认。他不肯照龙的规矩干坏事，那是他自己的问题。大家说了无数英勇的话，却没有一个英雄肯拿起刀矛，拯救受难的村庄，顺便赢得流传不朽的名声。酒馆里每夜都吵得激烈，一个人说得比一个人勇敢，可最后总是没有结果。龙却像个快活自在的波希米亚人，懒懒躺在草地上看落日，给男孩讲洪荒往事，一边琢磨新诗，一边润色旧作。
    - id: ch03
      title: 圣乔治来了
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 一天，男孩走进村子，发现到处都像要过节，可日历上明明没有任何节日。窗外垂着地毯和彩布，教堂钟响个不停，小街撒满鲜花。村民全挤在路两边，一边推别人，一边叫别人往后退。男孩看见一个同龄朋友，隔着人群喊他。
        - id: ch03-b02
          speaker: boy
          text: 到底出了什么事？是戏班子，还是熊，还是马戏团？
        - id: ch03-b03
          speaker: village_boy
          text: 是大好事，他马上就到了！
          emotion: happy
        - id: ch03-b04
          speaker: boy
          text: 谁要到了？
        - id: ch03-b05
          speaker: village_boy
          text: 当然是圣乔治。他听说咱们这儿有龙，特地来杀掉那头凶兽，把我们从可怕的奴役里救出来。我的天，这场仗一定好看！
          emotion: happy
        - id: ch03-b06
          speaker: narrator
          text: 这才是真正的大消息。男孩觉得非得亲眼看看不可。他从大人们的腿中间钻过去，还责怪他们不该那么没礼貌地推挤。他挤到最前面，屏住呼吸等着。不久，长街尽头传来欢呼。一匹高大战马踏着整齐的步子走来，圣乔治在尖叫、手帕和被高高举起的婴儿之间缓缓经过。他比男孩见过的任何英雄都俊美有风度。金饰的带凹槽盔甲闪闪发亮，长长的金发围着一张温厚柔和的脸，只有那双眼睛里带着严厉。他在小客栈前下马。村民们围上去，抢着诉说自己受过的伤害、委屈和压迫。圣徒庄重而温和地保证，如今一切都会好起来，他会为众人伸张正义，让他们摆脱仇敌。等他走进客栈，男孩转身就往山上飞奔。
        - id: ch03-b07
          speaker: boy
          text: 全完了，龙！他来了，现在就在村里。你非得打起精神，终于做点事不可！
          emotion: fearful
        - id: ch03-b08
          speaker: narrator
          text: 龙正在舔自己的鳞片，还用男孩母亲借给他的家用绒布来回擦拭，直到浑身像一大块绿松石那样发亮。
        - id: ch03-b09
          speaker: dragon
          text: 别这么激动，男孩。坐下喘口气，再记住名词支配动词。然后你也许肯告诉我，到底是谁来了？
        - id: ch03-b10
          speaker: boy
          text: 好，你尽管慢慢从容。等我说完，但愿你还能这样。来的不过是圣乔治，就这样。半小时前他骑进了村子。你这么大，当然打得过他。不过我得提醒你，他肯定一大早就上山，还会带着我这辈子见过最长、最凶的长矛！
        - id: ch03-b11
          speaker: narrator
          text: 只要想到即将开战，男孩就纯粹因为高兴而蹦了起来。
        - id: ch03-b12
          speaker: dragon
          text: 哎呀，哎呀，我的天。这可太可怕了。我不见他，就这么定了。我一点也不想认识那个家伙，他肯定不讨人喜欢。请你叫他马上离开。你可以告诉他，愿意就写信，可我不接受会面。我现在谁都不见。
          emotion: fearful
        - id: ch03-b13
          speaker: boy
          text: 龙啊，别这么乖僻固执。你早晚得跟他打一场，因为他是圣乔治，你是龙。早点打完，我们还能继续谈十四行诗。你也替别人想想。你要是觉得山上无聊，也想想我过得有多无聊！
        - id: ch03-b14
          speaker: dragon
          text: 亲爱的小先生，请你彻底明白，我不会打，也不肯打。我一辈子从没打过架，如今更不会只为给你们演一场罗马节庆式的厮杀，就破了这个例。从前我总让别的家伙，就是那些认真的家伙，替我去打。毫无疑问，我今天还能在这里，正是因为我一直这么做。
        - id: ch03-b15
          speaker: boy
          text: 可你要是不打，他会砍掉你的头！
          emotion: sad
        - id: ch03-b16
          speaker: dragon
          text: 我看不见得。你会想法安排好的。我对你完全有信心，你那么会张罗。乖孩子，快下山把事情处理妥当吧。我全交给你了。
        - id: ch03-b17
          speaker: narrator
          text: 男孩垂头丧气地回到村里。第一，期待的打斗泡汤了。第二，他亲爱又敬重的龙朋友，没显出他希望的英雄气概。最糟糕的是，不管龙骨子里究竟算不算英雄，圣乔治都毫无疑问会砍掉他的头。可龙竟然叫男孩来安排，还说得好像这只是一张请人喝茶、打槌球的帖子。男孩越想越生气，却还是得替他去解决。街上的村民正兴高采烈地三三两两回家，每个人都在谈即将到来的精彩大战。他们已经把明天当成了一场节日，全没想过那条龙可能是谁的朋友。男孩穿过街道，走进客栈正厅。圣乔治正独自坐在里面，一边思量这场战斗的胜算，一边回想刚才倾入他同情心里的种种劫掠、伤害和苦难故事。
        - id: ch03-b18
          speaker: boy
          text: 圣乔治，我可以进来吗？我想跟您谈谈龙这件小事。要是您还没有听腻的话。
        - id: ch03-b19
          speaker: saint_george
          text: 进来吧，孩子。恐怕又是一段苦难冤屈。那暴君夺走了你慈爱的父亲或母亲吗？还是你温柔的兄弟姐妹？放心，很快就会替他们报仇。
        - id: ch03-b20
          speaker: boy
          text: 完全不是这么回事。这里有一个误会，我想把它纠正。事实是，他是一条好龙。
        - id: ch03-b21
          speaker: saint_george
          text: 正是，我完全明白。是一条厉害的龙。相信我，对手配得上我的剑，而不是有害族类里柔弱的货色，我一点也不遗憾。
          emotion: happy
        - id: ch03-b22
          speaker: boy
          text: 可他根本不是什么有害族类！男人脑子里一旦装进一个念头，怎么就会这么笨呢？我说他是一条好龙，是我的朋友。他给我讲世上最好的故事，讲古时候，也讲自己小时候。他对妈妈好极了，妈妈愿意替他做任何事。爸爸也喜欢他，虽然爸爸不大赞成艺术和诗，龙每次谈到“风格”，他就睡着了。可谁只要认识龙，就会忍不住喜欢他。他又讨人喜欢，又信任别人，还像孩子一样单纯！
        - id: ch03-b23
          speaker: saint_george
          text: 坐下，把椅子拉近些。我喜欢肯替朋友说话的人。龙能有你这样的朋友，想必一定有他的长处。可问题不在这里。今晚我怀着说不出的悲痛，听了无数杀人、偷盗和伤害的故事。里面也许添了太多色彩，不是每一件都可信，可合在一起，仍是一张严重的罪行清单。历史告诉我们，最大的恶棍往往也有居家的美德。你那位有修养的朋友，尽管有那些值得你敬爱的品质，恐怕还是得尽快消灭。
        - id: ch03-b24
          speaker: boy
          text: 原来您把那些家伙编的故事全信了。我们村民是这一带最会撒谎的人，这是公认的事实。您是外乡人，不然早就听说了。他们只想看一场打斗，为了挑起来，什么都肯做。狗也好，公牛也好，龙也好，只要能打就行。现在客栈后的马厩里还关着一只无辜的獭，本来今天就要拿它取乐，只因为要等您这件小事完了，才暂时留着。我敢说，他们还说了许多英雄话，说您为了正义一定会赢。可我刚才走过街道，他们正在下注，押龙获胜是六赔四！
        - id: ch03-b25
          speaker: saint_george
          text: 六赔四押龙！这真是个邪恶的世界。有时我甚至怀疑，世上的恶并不全都装在龙的肚子里。不过，会不会是这头狡猾的野兽对你藏起了真性情，想借你的好话遮住恶行？说不定此刻就有一位不幸的公主，被关在那个阴暗的洞穴里。
          emotion: sad
        - id: ch03-b26
          speaker: narrator
          text: 这句话刚出口，圣乔治就后悔了，因为男孩看起来真的很伤心。
        - id: ch03-b27
          speaker: boy
          text: 我向您保证，圣乔治，洞里绝对没有公主。龙从头到尾都是位真正的绅士。听见您这么随便地谈论他看得极重的事，最震惊、最伤心的人恐怕会是他自己。
          emotion: sad
        - id: ch03-b28
          speaker: saint_george
          text: 也许我太轻信，真的误解了这动物。可现在该怎么办？龙和我几乎已经面对面，每个人都以为我们恨不得饮尽对方的血。我真看不出怎么收场。你有什么主意？不能设法安排一下吗？
        - id: ch03-b29
          speaker: boy
          text: 龙也是这么说的。你们两个真是什么都推给我。您就不能安安静静地离开吗？
          emotion: angry
        - id: ch03-b30
          speaker: saint_george
          text: 恐怕不行。那完全不合规矩，你和我一样清楚。
        - id: ch03-b31
          speaker: boy
          text: 那就这样吧。天还早，您愿不愿跟我上山见见龙，大家一起商量？路不远，而且我的朋友肯定欢迎我的任何朋友。
        - id: ch03-b32
          speaker: saint_george
          text: 这不大合常规，不过的确是最明智的办法。你为朋友费了不少心。振作一点，也许根本用不着打。
          emotion: calm
        - id: ch03-b33
          speaker: boy
          text: 可我倒是真希望能打一场！
        - id: ch03-b34
          speaker: narrator
          text: 两人来到山上。男孩故意大声告诉龙，自己带了一位朋友。龙猛地惊醒，还老实承认，他刚才只是在思考。
        - id: ch03-b35
          speaker: dragon
          text: 很高兴认识您，先生。今天的天气真好！
        - id: ch03-b36
          speaker: boy
          text: 这位是圣乔治。圣乔治，请允许我介绍龙。我们上来是要安静地把事情商量好。龙，看在老天的分上，请你说点直截了当的常识，拿出一个真能用的办法。我已经受够人生观、理论和个人倾向那一套了。还有，妈妈正坐在家里等我。
        - id: ch03-b37
          speaker: dragon
          text: 很高兴认识您，圣乔治。听说您走过很多地方，我却一向恋家。要是您在这里多留几天，我可以带您去看很多古迹和本地有趣的风景……
        - id: ch03-b38
          speaker: saint_george
          text: 我看，最好还是听年轻朋友的劝，只谈咱们这桩小事。最简单的办法，终究是照规矩打一场，让强者获胜。村里人在押你赢，不过我不在乎。
        - id: ch03-b39
          speaker: boy
          text: 对呀，打吧，龙！那能省下好多麻烦！
          emotion: happy
        - id: ch03-b40
          speaker: dragon
          text: 小朋友，你闭嘴。相信我，世上没有谁比您和这位年轻先生更值得我帮忙。可这件事从头到尾都是胡闹，是旧规矩和大众的榆木脑袋造成的。根本没有任何值得打斗的理由。无论如何，我不打。就这么定了！
          emotion: angry
        - id: ch03-b41
          speaker: saint_george
          text: 要是我逼你呢？
          emotion: angry
        - id: ch03-b42
          speaker: dragon
          text: 您办不到。我只要回到洞里，顺着来路暂时退回地底。您坐在外面等我出来交战，很快就会腻透。等您真的走远，我再快快活活地钻出来。坦白告诉您，我喜欢这里，已经决定留下了！
        - id: ch03-b43
          speaker: narrator
          text: 圣乔治望了一阵周围的美景，再次劝他。这里实在适合打一仗。光秃宽阔、起伏不平的南丘就是战场，金色盔甲和盘绕的蓝鳞身子映在一起，那幅画面会极好看。
        - id: ch03-b44
          speaker: dragon
          text: 您想从我的艺术感受下手，可这一招没用。不过照您这么一说，那幅画面的确会很好看。
        - id: ch03-b45
          speaker: boy
          text: 看来我们终于靠近正事了。龙，你得明白，总得有某种形式的战斗。你也不愿意再钻进那个肮脏的旧洞，在里面待到天知道什么时候吧。
        - id: ch03-b46
          speaker: saint_george
          text: 可以安排。我当然必须刺中你某个地方，但不一定伤得很重。你这么大，身上总该有几块多余的地方。比如这里，前腿后面。刺在这儿不会太痛。
        - id: ch03-b47
          speaker: dragon
          text: 乔治，你在挠我痒。不，这个地方绝对不行。就算不痛，可我敢说其实会痛得可怕，它也会害我笑起来，那就全毁了。
        - id: ch03-b48
          speaker: saint_george
          text: 那就再换一处。比如脖子下边的厚皮褶，我刺在这儿，你甚至不会察觉。
        - id: ch03-b49
          speaker: dragon
          text: 可您有把握刺准吗？
          emotion: fearful
        - id: ch03-b50
          speaker: saint_george
          text: 当然。交给我就是。
        - id: ch03-b51
          speaker: dragon
          text: 正因为非交给您不可，我才得问。万一临时出了差错，您当然会非常遗憾，可您的遗憾绝不会有我的一半深。不过人生路上总得信任某个人。总的看来，您的办法不比别的更坏。
        - id: ch03-b52
          speaker: boy
          text: 等等，龙。我看不出你能得到什么。现在看来，仗是一定要打，你也注定要输。你到底能落下什么好处？
        - id: ch03-b53
          speaker: dragon
          text: 圣乔治，请告诉他，我在殊死决斗里落败以后，会发生什么？
        - id: ch03-b54
          speaker: saint_george
          text: 照规矩，我想我会把你当作俘虏，凯旋带到集市广场之类的地方。
        - id: ch03-b55
          speaker: dragon
          text: 完全正确。然后呢？
        - id: ch03-b56
          speaker: saint_george
          text: 然后会有欢呼和演说。我会宣布你已经悔改，认识到了以前的错误，类似的话。
        - id: ch03-b57
          speaker: dragon
          text: 正是。然后呢？
        - id: ch03-b58
          speaker: saint_george
          text: 然后，当然照例会有一场宴会。
        - id: ch03-b59
          speaker: dragon
          text: 一点不错，我的好处就在这里。男孩，听着。我在山上已经闷得要命，还没人真正懂得欣赏我。靠这位朋友的好心和辛苦，我就要进入上流社会了。你会发现，我具备一切讨主人欢心的品质。事情既然已经定下，要是你们不介意，我是个守旧的人，并不是想赶客，可是……
        - id: ch03-b60
          speaker: saint_george
          text: 记住，打斗时你也得好好出力，龙！我说的是横冲直撞、喷火那一类。
        - id: ch03-b61
          speaker: dragon
          text: 横冲直撞我很在行。至于喷火，荒废久了，手艺退步得快得惊人，不过我会尽力。晚安！
        - id: ch03-b62
          speaker: narrator
          text: 他们下山快回到村子时，圣乔治忽然停住脚步。
        - id: ch03-b63
          speaker: saint_george
          text: 我就知道忘了什么。还应该有一位公主，吓得魂不附体，被锁在岩石上，就是这一类。孩子，你能不能安排一位公主？
        - id: ch03-b64
          speaker: boy
          text: 我累死了。现在都这么晚了，我安排不了公主，也安排不了任何别的东西。妈妈还在等我。求您别再叫我安排事情了，一切明天再说！
    - id: ch04
      title: 一场按计划进行的大战
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 第二天大清早，人们就穿上做礼拜时的好衣服，提着露出瓶颈的篮子，一队队登上南丘。每个人都想为决斗占个好位置。可挑位置并不简单，因为龙当然可能获胜。即使下注押他赢的人，也不敢指望龙会因为他们支持自己，就另眼相待。所以大家都谨慎地挑好逃路。最前排多半是逃开父母管束的男孩，他们在草地上翻滚，丝毫不理身后母亲的尖声威胁和警告。
        - id: ch04-b02
          speaker: narrator
          text: 男孩在靠近洞穴的前面抢到一个好位置，紧张得像首演之夜的舞台监督。龙靠得住吗？他会不会突然改主意，说整场表演都是胡闹？也许计划太匆忙，连排练也没有，他紧张得不敢露面。洞口毫无生气，看不出有谁住过。龙会不会已经连夜搬走了？
        - id: ch04-b03
          speaker: narrator
          text: 高处已经被观众挤得黑压压的。突然间，欢呼响起，手帕也纷纷挥动。男孩离龙的一端太近，暂时还看不见来人。过了一分钟，圣乔治头盔上的红色羽饰越过山顶。他骑进通往阴森洞口的大片空地，高大战马稳稳托着他，金甲在早晨的阳光下闪耀。长矛高高竖起，矛尖那面缀着猩红十字的小白旗迎风飘动。这个人连同战马、盔甲、长矛和旗帜，组成了一幅英武又美丽的画面。他终于勒住马，在平地中间一动不动。两边观众顿时觉得那长矛实在太长，于是不安地退后几步。就连前排那些刚才还在互扯头发、对着挥拳头的男孩，也都停了下来。他们忘了继续打架，一个个向前探出身子，等着看洞里会出现什么。
        - id: ch04-b04
          speaker: boy
          text: 快点呀，龙！
        - id: ch04-b05
          speaker: narrator
          text: 其实男孩根本用不着发愁。这场表演里的戏剧味道把龙逗得兴致勃勃。他天一亮就起床，热心准备第一次公开登场，好像又变回了一条小龙，正在母亲的洞穴里跟姐妹们玩“圣徒斗龙”。那个游戏里，每次都是龙赢。
        - id: ch04-b06
          speaker: narrator
          text: 一阵低沉的咕哝和喷鼻声从洞里传出，渐渐升成震满平原的怒吼。烟云遮住洞口，龙从烟里盛大地跃出，浑身闪着海蓝色光芒，威风凛凛。
        - id: ch04-b07
          speakers: [boy, village_boy, spectator]
          ensemble: chorus
          text: 呜——！
          emotion: surprised
        - id: ch04-b08
          speaker: narrator
          text: 那声惊叹像在看一枚巨大的焰火升空。龙的鳞片闪闪发亮，带刺的长尾抽打着身体，利爪把草皮揀起来，远远抛过背脊。他愤怒的鼻孔不断喷出浓烟和烈火。
        - id: ch04-b09
          speaker: boy
          text: 干得好，龙！真没想到他还有这一手！
          emotion: happy
        - id: ch04-b10
          speaker: narrator
          text: 圣乔治压低长矛，俯下身子，双脚猛踢马腹，雷鸣般冲过草地。龙又吼又尖叫地迎上去，蓝色身躯急速旋转，盘绕，喷着响鼻。利齿互碰，尖刺和火焰混成一团。
        - id: ch04-b11
          speakers: [boy, village_boy, spectator]
          ensemble: chorus
          text: 没刺中！
          emotion: surprised
        - id: ch04-b12
          speaker: narrator
          text: 金甲、蓝绿色盘起的身子和尖刺长尾纠缠了片刻。巨马咬紧嚼子一路狂奔，驮着高举长矛的圣徒，几乎一直冲到洞口。龙坐下来恶狠狠地吠叫，圣乔治费了好大力气，才把马拉回原位。
        - id: ch04-b13
          speaker: narrator
          text: 第一回合结束了。男孩觉得他们演得真好，只希望圣徒别真的激动起来。龙却完全不用担心，这家伙简直是个天生的演员。圣乔治终于稳住马，一边擦额头，一边朝四下看。他看到男孩，微笑着点头，飞快地举起三根手指。原来一切都照计划进行，第三回合才是最后一回合。
        - id: ch04-b14
          speaker: narrator
          text: 休息时，龙给观众表演起“腾跃”。他沿着一个大圈不停奔跑，让波浪似的动作从尖耳朵一路传过整条背脊，最后到达长尾末端的尖刺。满身披着蓝鳞时，这动作格外好看。男孩想起，龙最近才说过，他希望在社交界大获成功。
        - id: ch04-b15
          speaker: narrator
          text: 圣乔治收紧缰绳，重新上前。他压低矛尖，在马鞍上稳稳坐好。
        - id: ch04-b16
          speakers: [boy, village_boy, spectator]
          ensemble: chorus
          text: 开始！
          emotion: happy
        - id: ch04-b17
          speaker: narrator
          text: 龙停下腾跃，用后腿直立起来，笨重地从一边大跳到另一边，嘴里发出印第安人的呼号。战马果然吓得猛然侧闪，圣乔治抓住马鬃才没摔下来。马从龙身边掠过时，龙恶狠狠地咬向马尾。可怜的牲口吓得在南丘上一路狂奔，圣徒丢了一只马镫。幸好他离观众太远，没人听清他骂了些什么。
        - id: ch04-b18
          speaker: narrator
          text: 第二回合让龙赢得了公开的好感。观众懂得欣赏一个不仅守住阵地，还明显愿意奉上精彩比赛的选手。龙挺着胸，翘着尾巴，得意洋洋地踱来踱去，尽情享受新得的人缘。四面八方的鼓励声不断飘进他耳朵。他显然不只想赢得比赛，还想叫每一个看比赛的人都觉得这一趟来得值。他在欢呼里把胸膅得更高，长尾也翘得更漂亮。
        - id: ch04-b19
          speaker: narrator
          text: 圣乔治下了马，一边收紧肚带，一边用极其丰富的比喻，详细告诉战马，他对它、它的亲戚和它今天的表现到底有什么看法。男孩走过去，替他拿住长矛。
        - id: ch04-b20
          speaker: boy
          text: 真是一场痛快的仗，圣乔治！就不能让它再长一点吗？
        - id: ch04-b21
          speaker: saint_george
          text: 我看最好不要。你那位头脑单纯的老朋友一听见欢呼，已经有点自负了。他会忘掉约定，开始胡闹，谁也不知道最后会闹到哪儿。这一回我就把他解决掉。
        - id: ch04-b22
          speaker: narrator
          text: 圣乔治翻身上马，从男孩手里接过长矛。
        - id: ch04-b23
          speaker: saint_george
          text: 别害怕。我已经精确地标好了位置。他也一定会竭力配合，因为他知道，这是自己获邀参加宴会的唯一机会。
          emotion: calm
        - id: ch04-b24
          speaker: narrator
          text: 这一回，圣乔治没有飞奔，只是策马轻快小跑向龙。龙俯伏等待，尾巴来回甩动，在空中抽出大车鞭子般的爆响。圣徒快到面前时，拨转马头，谨慎地绕着圈，眼睛始终盯着那块多余的地方。龙也小心地绕着同一个圆圈踱步，偶尔用头假装攻击。双方都在找破绽，所有观众都屏住呼吸。
        - id: ch04-b25
          speaker: narrator
          text: 这一回合持续了几分钟，结局却快得让人看不清。男孩只看见圣徒的手臂像闪电般一动，接着，尖刺、利爪、尾巴和飞溅的草皮便卷成混乱的一团。尘土散去时，观众一边欢呼，一边奔上前。龙已经倒在地上，被长矛钉住，圣乔治下了马，跨在他身上。
        - id: ch04-b26
          speaker: narrator
          text: 一切都逼真得过分。男孩喘着气跑过去，生怕亲爱的老龙真受了伤。龙抬起一只大眼皮，郑重地朝他眨眨眼，然后又瘫倒。长矛虽然把他的颈部固定在地上，可圣徒正好刺中了约定的多余部位，似乎连痒也没让他觉得。
        - id: ch04-b27
          speaker: spectator
          text: 老爷，您不砍掉他的脑袋吗？
        - id: ch04-b28
          speaker: narrator
          text: 这个人押的是龙赢，当然有点不高兴。
        - id: ch04-b29
          speaker: saint_george
          text: 今天先不砍。那件事什么时候都能做，一点也不急。我看大家先回村吃点喝点，然后我再好好训他一顿。你们会发现，他从此会变成一条完全不同的龙！
          emotion: happy
        - id: ch04-b30
          speaker: narrator
          text: “吃点喝点”这几个神奇的字一出口，所有人马上排好队，安静等待出发。说话、欢呼和下注的时候已经过去，真正行动的时辰到了。圣乔治双手用力，把长矛从地里拔了出来。龙站起来，先把沉重的身体好好抖了几下，再从头到尾地检查一遍，看看全身的尖刺、鳞片和其他东西是不是都还整齐。圣徒上马带头，龙温顺地跟男孩并肩而行，口渴的观众则保持着恭敬的距离，跟在后面。
    - id: ch05
      title: 宴会之后
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 队伍回到村子，在客栈前排好，盛大的热闹便开始了。大家吃过也喝过，圣乔治站起来发表演说。他宣布，自己费了许多力气，也承受了许多不便，如今已经替村民除掉可怕的祸害。从今往后，他们不许再到处抱怨，也不许臆想自己受了委屈，因为根本没有这回事。
        - id: ch05-b02
          speaker: narrator
          text: 圣徒还说，村民不该这么热衷于打斗。下一回，也许就得他们自己上阵，那种滋味会完全不同。客栈马厩里的无辜獭必须马上放掉，他会亲眼看着这件事做完。然后他又宣布，龙已经认真反思，明白任何问题都有两面，以后再也不会做“那种事”。只要村民表现良好，龙也许会留下定居。所以大家必须同他交朋友，不许存偏见，更不能以为自己什么都懂，因为他们还差得远。
        - id: ch05-b03
          speaker: narrator
          text: 圣乔治最后警告众人，不要犯下编造传奇的罪过。不要只因为一个故事说得像模像样，色彩又鲜艳，就以为别人一定会相信。他在一片表示悔悟的欢呼声中坐下。龙用胳膊肘碰碰男孩的肋骨，悄声说，即使由他自己来讲，也讲不了这么好。随后人人散去，为宴会做准备。
        - id: ch05-b04
          speaker: narrator
          text: 宴会总是很愉快，因为它大部分时间无非就是吃吃喝喝。更妙的是，它总在某件事结束以后举行。这时候再没有什么需要担心，明天也显得无比遥远。圣乔治很快乐，因为他既打了仗，又没有杀人。其实他不喜欢杀戮，只是往常总觉得非杀不可。这一次，战斗有了，规矩也算完成，却没有谁为此送命，所以他心里格外轻松。龙也很快乐，因为他打了一仗，没有受伤，还赢得了人缘，终于在社交界站稳脚跟。他当初答应那个险些挠痒的办法，为的正是这一刻。男孩也很快乐，因为他看到了打斗，两位朋友事后又依然亲密。他既没失去龙，也没错过那场期待已久的好戏。其余的人同样很快乐，因为他们看到了打斗。对他们来说，这已经是全部理由。
        - id: ch05-b05
          speaker: narrator
          text: 龙努力对每个人说最合宜的话。无论跟谁交谈，他都能说到那个人心里，很快就成了整夜的灵魂。圣徒和男孩在旁边看着，觉得自己只是来参加一场荣耀全归龙的盛宴。不过他们都是好人，并不介意。龙也丝毫没有骄傲忘形。恰恰相反，他始终记得自己还得回南丘上的洞里。所以大约每过十分钟，他就俯下宽大的身子，凑到男孩身边，郑重地把同一个问题再问一次。
        - id: ch05-b06
          speaker: dragon
          text: 听着！待会儿你一定会送我回家，对不对？
        - id: ch05-b07
          speaker: narrator
          text: 男孩每次都点头，尽管他明明答应过母亲，自己不会晚归。宴会终于结束。宾客们带着说不完的晚安、祝贺和邀请，一个个散去。龙送走最后一人，男孩跟在他身后，一起走到街上。龙擦擦额头，叹了口气，在路中间坐下，抬头望着星空。
        - id: ch05-b08
          speaker: dragon
          text: 多么痛快的一夜！星星真好，这个小地方也真好。我看就在这里过夜吧，我不想爬那座讨厌的山。男孩答应过送我回家，他最好说到做到。我不负任何责任，责任全是男孩的！
        - id: ch05-b09
          speaker: narrator
          text: 龙的下巴垂到宽阔的胸膛上，很快便稳稳地睡着了。
        - id: ch05-b10
          speaker: boy
          text: 起来呀，龙！你明明知道妈妈还在等我。我已经累得要命，你又叫我答应送你回家。我要是早知道这意味着什么，绝对不会答应！
          emotion: sad
        - id: ch05-b11
          speaker: narrator
          text: 男孩挨着熟睡的龙坐在路上，哭了起来。身后的门忽然打开，一股灯光流到路面上。圣乔治出来呼吸凉爽的夜气，一眼看见路上的一大一小两个身影，一个是纹丝不动的巨龙，另一个是满脸泪水的男孩。
        - id: ch05-b12
          speaker: saint_george
          text: 怎么了，孩子？
        - id: ch05-b13
          speaker: boy
          text: 都怪这条又大又笨、像猪一样的龙！他先叫我答应送他回家，又说我最好说到做到，自己却睡着了。送他回家还不如送一垛干草！我又累，妈妈还……
          emotion: sad
        - id: ch05-b14
          speaker: narrator
          text: 男孩说到这里，又哭得说不下去了。
        - id: ch05-b15
          speaker: saint_george
          text: 别难过，我来帮你。咱们两个一起送他。醒醒，龙！
          emotion: calm
        - id: ch05-b16
          speaker: narrator
          text: 圣乔治严厉地说着，抓住龙的胳膊肘用力摇晃。龙睡眼惺忪地抬起头。
        - id: ch05-b17
          speaker: dragon
          text: 多美的一夜啊，乔治！多么……
        - id: ch05-b18
          speaker: saint_george
          text: 听着，龙。这小家伙正等着送你回家。你明知道他两个钟头以前就该上床了。我可不知道他母亲会说什么。只要不是一头自私的猪，早就该逼他回家睡觉……
          emotion: angry
        - id: ch05-b19
          speaker: dragon
          text: 他当然应该去睡觉！可怜的小家伙，想想看，他竟然熬到这个时辰！真是太不像话了。圣乔治，我看您实在不够体贴。不过咱们马上出发，别再争论，也别磨磨蹭蹭。男孩，把手给我。谢谢你，乔治，我正需要一条胳膊扶我上山！
          emotion: surprised
        - id: ch05-b20
          speaker: narrator
          text: 于是，圣徒、龙和男孩挽着胳膊，一起朝山上走。男孩终于不用独自承担那条又大又沉的龙，圣乔治也没有把朋友丢在路中。小村里的灯火一盏接一盏熄灭。他们攀登南丘时，天上还有星星，也有一轮迟迟升起的月亮。脚下的村子越来越暗，山路却被迟来的月光一点点照亮。三个人就这样并排往上爬，直到转过最后一道弯，从视野里消失。夜风送回一支古老歌曲的断句。谁也不能确定是谁在唱，不过马戏人觉得，那应该是龙。
        - id: ch05-b21
          speaker: circus_man
          text: 你们家门口到了。晚安。快点进去，不然肯定要挨罚！
        - id: ch05-b22
          speaker: narrator
          text: 这真是我们家的门吗？果然没错，下边那根横木上，还留着我们坐在门上摇荡时，双脚磨出的熟悉痕迹。
        - id: ch05-b23
          speaker: charlotte
          text: 可是等等！我还有一大堆事情想知道。龙后来真的留下定居了吗？还有……
        - id: ch05-b24
          speaker: circus_man
          text: 故事没有后文了，至少今晚没有。快进去吧！再见！
        - id: ch05-b25
          speaker: charlotte
          text: 不知道这是不是真事。有些地方听起来实在很像胡说八道！
        - id: ch05-b26
          speaker: narrator
          text: 就算是这样，说不定仍旧是真的。
        - id: ch05-b27
          speaker: narrator
          text: 夏洛特像兔子一样，从寒冷的黑暗里一头蹿进屋。我却在寂静的霜夜里多留了一刻。门外的世界安静得连一点动静也没有，白雪在夜色里向远处铺开。我回头望着这片沉默洁白的世界，过了一会儿，才肯把它换成屋里的炉火、软垫和笑声。那天恰好是唱诗班练习的日子，圣诞颂歌的季节也已经临近。一位回家晚了的唱诗班成员沿路走过，他的脚步在霜夜里慢慢远去，嘴里还一边走，一边唱着圣诞颂歌。
        - id: ch05-b28
          speaker: choir_member
          text: 圣乔治呀，在昏暗马厩把礼敬行。他降服了巨龙，那怪物可怕又狰狞。多狰狞，多凶猛，如今我们终于能说，圣诞清晨醒来，处处安宁又太平！
        - id: ch05-b29
          speaker: narrator
          text: 歌者渐渐走远，颂歌也消失了。我一只手搭着门闩，心里却还在想：龙心满意足、摇摇摆摆地走上山时，唱的会不会正是这首歌，或是一首很像它的歌呢？
