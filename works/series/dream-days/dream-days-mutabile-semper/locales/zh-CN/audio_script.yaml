audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 机智而从容，带着温和的回望
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    newcomer:
      display_name: 新来的姑娘
      tts:
        delivery: 坦率活泼，主意多变却理直气壮
        timbre: 清脆明亮
        pace: 轻快，兴奋时稍快
        pitch: 中高
    selina:
      display_name: 塞莉娜
      tts:
        delivery: 认真执着，激动时果断炽烈
        timbre: 清澈明亮
        pace: 中等，情绪高涨时稍快
        pitch: 中高
    harold:
      display_name: 哈罗德
      tts:
        delivery: 天真直率，疑惑时仍彬彬有礼
        timbre: 稚嫩清脆
        pace: 轻快
        pitch: 高
  chapters:
    - id: ch01
      title: 篱笆边的新朋友
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 她站在花园篱笆那边，神情严肃地看着我沿路走来。我一到跟前，她便招呼了一声。
        - id: ch01-b02
          speaker: newcomer
          text: 嗨哟，你好呀！
        - id: ch01-b03
          speaker: narrator
          text: 我回了声“你好”，有点紧张地停下脚。其实，这场相遇并非完全偶然。上个星期日，我在教堂见过这个新来的姑娘。礼拜一结束，大家谈起她，我便打听出她是谁，又住在哪一位姨妈家。那天早晨，正好有人要送短信去牧师宅。我自己也没想到，竟会那么兴冲冲地站出来跑腿。其余的人却忽然各自忙起别的事，还有几个悄悄溜出了视线。我当然还没有认真计划什么，只是恰好记得，去牧师宅要经过她姨妈家的花园。
        - id: ch01-b04
          speaker: narrator
          text: 是她先开口的。那时我正在沟上跳来跳去，努力装得若无其事。
        - id: ch01-b05
          speaker: newcomer
          text: 星期日在教堂里，我看见你了。可你那时候完全不一样，衣服齐齐整整，头发滑溜溜的，两边都往上梳，亮得不得了！他们到底给你抹了什么？你是不是也最讨厌别人替你梳头？还有，你从过道走下来时，靴子吱嘎响得好厉害。我的靴子一响，我就专踩水洼，一直踩到它不响。我想，我还是翻过篱笆去吧。
        - id: ch01-b06
          speaker: narrator
          text: 她说做就做，利利落落地翻了过来。我把双手深深插进口袋，一声不响地看着她，仿佛正在观察一种从未见过的新奇动物。
        - id: ch01-b07
          speaker: newcomer
          text: 我刚才在种花，可我一点也不喜欢。今天虫子太多了。我讨厌虫子。我挖土的时候，它们就不能躲远些吗？
        - id: ch01-b08
          speaker: narrator
          text: 我倒觉得，挖土时有虫子在，显得热闹多了。
        - id: ch01-b09
          speaker: newcomer
          text: 要是它们暖暖的、干干的，我可能不会那么讨厌。可它们偏偏……
        - id: ch01-b10
          speaker: narrator
          text: 她打了个寒战。不知怎么，我反倒因此喜欢她。若换成家里的姑娘，我早就大声嘲笑起来了。我们从虫子说到青蛙，又说到猪、姨妈、园丁、摇摇马，还有我们共同王国里的其他臣民。不到五分钟，我俩已经彼此交心，仿佛认识了一辈子。向她说自己的事，比向家里的姑娘们坦白容易得多。我想，这是因为她还不熟悉我那劣迹斑斑、破破烂烂的过去。
        - id: ch01-b11
          speaker: newcomer
          text: 你刚才走过来时，我一直在看。你低着头，双手插在口袋里，没拿石头打东西，也没吹口哨，又没跳过路上的东西。我还以为你挨骂了，或者肚子疼呢。
        - id: ch01-b12
          speaker: narrator
          text: 我腼腆地告诉她，都不是。其实，我刚才正在做一件常做的事，可那是个秘密。这下我走错了一步。“秘密”两个字立刻点燃了她。她围着我直跳，既像央求，又像下命令。
        - id: ch01-b13
          speaker: newcomer
          text: 快告诉我吧！你非说不可！我发誓，绝不告诉任何人，真的一个人也不说！
        - id: ch01-b14
          speaker: narrator
          text: 她小小的身子激动得扭来扭去，两眼巴巴地望着我，还在我面前不耐烦地蹦着。乱蓬蓬的头发披在肩上，迷人极了。就连这个年纪免不了掉的一颗门牙，也给那张脸添了几分俏皮。我开始动摇，嘴上还说，她不会爱听，我也解释不清，还是不说为好。可我心里一直明白，自己最后非讲不可。
        - id: ch01-b15
          speaker: newcomer
          text: 可我就是爱听呀！没想到你这么狠心！
          emotion: sad
        - id: ch01-b16
          speaker: narrator
          text: 这可不行。她两边嘴角刚往下一坠，我便认出了那种危险的征兆。于是我结结巴巴地解释，眼前这段路一直通到拐角，又讨厌，又没趣。我总得来回走，对它熟透了，也厌烦透了。所以每次到了那个拐角，我就会一下子去往另一个地方。
        - id: ch01-b17
          speaker: newcomer
          text: 那是什么样的地方？
        - id: ch01-b18
          speaker: narrator
          text: 我赶紧说明，那当然只是想象出来的地方。说这话时，我还有点不好意思。可那里好得不得了，是她见过的地方里最好的。每逢坐在教堂里，或是上地理课，我总会悄悄跑到那里去。
        - id: ch01-b19
          speaker: newcomer
          text: 那里肯定没有我家好！你真该看看我家，可漂亮啦！我们有……
        - id: ch01-b20
          speaker: narrator
          text: 我打断她，说那里比她家好得多。当然，她家一定很漂亮，可我想象的地方必定更好，因为无论想要什么，只要真的一想，马上就能拥有。
        - id: ch01-b21
          speaker: newcomer
          text: 听起来真不错。再给我讲讲吧，先说说你是怎么去的。
    - id: ch02
      title: 宫殿里的规矩
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 我也说不准自己怎么去，反正一眨眼就到了。开头通常有一条宽阔清亮的河。我坐在一件大概算船的东西里，不用划，也不用做什么，只管向前漂。两岸铺着美丽的草地，河水涨得满满的，几乎和草岸一样高。船就沿着草地边缘滑过去。岸上的人有的在晒干草，有的做游戏，还有的四处闲逛。他们朝我喊，我也朝他们喊。他们会从篮子里取东西给我吃，还会把自己的瓶子递来，让我喝上一口。有些人，正是书里读到的那些好人。
        - id: ch02-b02
          speaker: narrator
          text: 一直往前，最后就会来到宫殿的台阶。那是一大片宽阔的大理石阶，从宫门口一直伸进河水。台阶旁边停满想得到的各种船，有双桅帆船、平底船、划艇，还有一艘艘小军舰。到了这里，想怎样玩船都行。自己划也好，扬帆出航也好，拿长篙撑着平底船四处走也好，全都没人阻拦。
        - id: ch02-b03
          speaker: newcomer
          text: 那我要扬帆，还要掌舵。不，还是你掌舵，我坐在甲板上。也不对，我来划……至少我要叫你划，我来掌舵。哎，我知道了！我们就坐在平底船里，把手脚伸进水里拨着玩！
        - id: ch02-b04
          speaker: narrator
          text: 我客客气气地答应，一切都照她喜欢的办。可她一会儿要我掌舵，一会儿要我划船，转眼又把两样都推翻。我已经隐约觉得，自己行事的自由正被这位要求多多的客人一点点拿走。是我太冒失，竟把她请进了自己的圣地。
        - id: ch02-b05
          speaker: newcomer
          text: 我看，我们还是别坐船了。船总是摇摇晃晃的。接下来到哪儿？
        - id: ch02-b06
          speaker: narrator
          text: 走上台阶，穿过大门，头一个房间就是巧克力房。
        - id: ch02-b07
          speaker: newcomer
          text: 头一个房间就是巧克力房！
          emotion: happy
        - id: ch02-b08
          speaker: narrator
          text: 那里有想得到的每一种巧克力。软巧克力里面包着黏黏的馅儿，有白色，也有粉红色，都是姑娘们爱吃的。还有又硬又亮的巧克力，一咬就咔嚓裂开，含在嘴里能吃很久。
        - id: ch02-b09
          speaker: newcomer
          text: 我最爱吃软的，因为那样可以多吃好多！
        - id: ch02-b10
          speaker: narrator
          text: 我从没这样想过巧克力问题，不禁带着兴趣、甚至几分敬意看她。在我们家，巧克力很难得。偶尔弄到一点，大家总要使出种种古怪办法，含得慢些，咬得小些，好让它多吃一阵子。不过，我们也听过传说，说有些孩子隔一段时间就能得到想吃多少便吃多少的巧克力。眼前这位显然就是其中之一。我慷慨地提出，奶油夹心全归她，我只吃自己最喜欢的硬条。
        - id: ch02-b11
          speaker: newcomer
          text: 那可不行！你一定要跟我吃一样的。偏要吃不同的东西，一点都不好。这样吧，你把所有巧克力都给我，然后由我分给你应该吃的那一种！
        - id: ch02-b12
          speaker: narrator
          text: 我只好低声答应。在自己的巧克力房里，还要受到这种多愁善感的限制，似乎有点不公平。接下来那个房间全是汽水，四周围着大理石台面，上面装满银色小龙头。只要拧开对的那只，想喝哪一种就有哪一种。
        - id: ch02-b13
          speaker: newcomer
          text: 那儿都有些什么汽水？
        - id: ch02-b14
          speaker: narrator
          text: 我匆匆说什么都有，赶紧往下讲。她可以管我吃什么，可要是还想管我喝什么，我死也不能答应。走过长廊，宫殿后面是一座最最出色的大公园。那里有小马可以骑，也有马车和大车，还有整整一套小铁路。火车头、车厢和守车样样齐全，而且全由自己开。想舒舒服服坐头等车厢，想待在最后面的守车里，还是想直接爬上火车头，都只管自己挑。
        - id: ch02-b15
          speaker: newcomer
          text: 我要坐火车头。不，我不坐，我要……
        - id: ch02-b16
          speaker: narrator
          text: 我连忙抢着讲士兵。无论如何，总得划下一条界线。我不能让区区一个姑娘，把我的铁路系统彻底搅乱，还把火车头和车厢全颠倒过来。公园里要多少士兵就有多少，全是高大威武的好兵，都听我指挥。露台上还摆着一整排黄铜大炮。每隔一阵子，只要我一声令下，所有大炮便会一起开火。
        - id: ch02-b17
          speaker: newcomer
          text: 不行，他们不许开炮！你得叫他们停下。我最讨厌枪炮，他们只要一开火，我马上就跑得远远的！
        - id: ch02-b18
          speaker: narrator
          text: 我吓坏了，忍不住抗议。那些士兵待在那里，不正是为了开炮吗？
        - id: ch02-b19
          speaker: newcomer
          text: 我不管，反正不准开。他们愿意的话，可以跟在我身后，陪我说话，也可以替我拿东西。可绝不能开炮。
        - id: ch02-b20
          speaker: narrator
          text: 到这时，我伤心地察觉，在自己的壮丽宫殿里，我原本可以昂首阔步，不受管束，也无人质问，如今却快要沦为一个借住的房客。那些威武的好兵，竟然要被派去拿东西！我不想再讲了，虽然可讲的还多着呢。
        - id: ch02-b21
          speaker: newcomer
          text: 那里还有别的男孩子吗？
        - id: ch02-b22
          speaker: narrator
          text: 我一不留神，说那里当然有，都是很不错的伙伴，我们可以痛痛快快地……话刚出口，我便醒悟过来，赶紧改口说，大家自然可以一起玩。不过，她会做我的朋友吧？她会坐我的船，我们还可以一起坐守车旅行。为了她，我甚至可以阻止士兵开炮。
        - id: ch02-b23
          speaker: narrator
          text: 可她只是淘气地转开脸。不管我怎么劝，她始终不肯答应。这时村里的钟敲响了，也叫醒我身体里那座吵闹的钟。半英里外，正午的羊肉还在等我。若是迟到，不但要受罚，往后的自由也会被削掉一块。我俩匆匆道别。分手以前，我总算让她承认，下午也许会再来种花，只要那些虫子别再横行霸道，肯给她一个机会。
        - id: ch02-b24
          speaker: narrator
          text: 临走时，我再三叮嘱，刚才讲过的事绝不能告诉别人。她一条腿前后晃着，眯起眼睛，从旁边打量我，看起来还有些犹豫。我便告诉她，这是个天大的秘密，只属于我俩，除了我和她，谁也不知道。
        - id: ch02-b25
          speaker: narrator
          text: 她终于使劲点头，睁大眼睛，把小嘴抿得紧紧的。把秘密说出去的欢喜，和独占秘密的幸福，总是难分高下。不过，通常还是后者会赢——至少能赢一阵子。
    - id: ch03
      title: 雨天里的艺术家
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 等我吃完羊肉，正泡在热腾腾的米布丁里时，才有空停下来，看看周围的情形。朝窗外一望，我顿时大失所望，外面竟然下起了大雨。这件事实在处处扫兴。即使雨一会儿停了，凭我的经验也知道，虫子一定会多得讨厌，而且活蹦乱跳。下午的约会恐怕没有什么希望了。我闷闷不乐地做完谢饭祷告，跟大家上楼去教室，拿出颜料盒，决心认真献身于近来备受冷落的艺术。哈罗德拿着一张纸和一支铅笔，退到角落的桌边，架开双肘，吐出舌头。文学一向是他表现艺术的方式。
        - id: ch03-b02
          speaker: narrator
          text: 坏天气毫无转好的意思，塞莉娜也坐不住了。她不肯自己找件事做，偏要在屋里绕来绕去，打扰我们这些正把心中理想变成作品的艺术家。她从我肩后看了好几分钟，我才发现。若早些知道，我一定会跟她说上几句。
        - id: ch03-b03
          speaker: selina
          text: 我猜，你把那东西叫作船吧？谁听说过粉红色的船？呼——呼！
        - id: ch03-b04
          speaker: narrator
          text: 我强压怒火。要想漂亮地赢过她，就必须保持冷静。我勉强平静地指出，现在玩具店的橱窗里就放着一艘粉红色的船。她要是不信，大可以亲自去看。难道她会比造船的人更懂船吗？
        - id: ch03-b05
          speaker: narrator
          text: 塞莉娜一时被堵住了，可没过多久，又发起进攻。
        - id: ch03-b06
          speaker: selina
          text: 那些东西也很好笑。我猜，你想画的是树吧？可它们全是蓝的。
        - id: ch03-b07
          speaker: narrator
          text: 我严厉地回答，那些本来就是树，而且非画成蓝色不可。因为她上星期偷了我的藤黄颜料，害我调不出绿色。
        - id: ch03-b08
          speaker: selina
          text: 我才没偷你的藤黄颜料。要是我是你，也不会为了一小块脏兮兮的颜料撒谎。
        - id: ch03-b09
          speaker: narrator
          text: 她虽然傲慢，身子却已经朝哈罗德那边挪去。我审慎地没有再说什么。毕竟我知道，她知道那块颜料是她偷的。哈罗德刚察觉她悄悄靠近，便扔下铅笔，整个人趴在桌上，用自己的身体护住文学心血，不让它遭受冰冷的批评。他身体里不知哪里发出一阵又像尖叫、又像汽笛的声音，仿佛蒸汽正在泄漏。那声音又长又尖，从头到尾一个调子。
        - id: ch03-b10
          speaker: selina
          text: 我就想看一眼！
        - id: ch03-b11
          speaker: narrator
          text: 塞莉娜拼命想把他从字迹上拔起来，可哈罗德像帽贝一样紧贴桌沿，尖叫声足以震聋全人类，甚至威胁到奥林匹斯山上的安宁。看来，该展示一下武力了。其实，哈罗德有多少心声被她偷看去，我毫不在乎。她迟早总会看到。我甚至欢迎这场乱子，因为这样我就能安静画画。可是，同一性别的伙伴自有不成文的规矩。男孩子单凭是男孩子，受的欺压、折磨和践踏已经够多了。危急时刻要是不团结，谁知道会招来多少灾难和耻辱？说不定连整个族类都会灭绝。哈罗德的文章值不值得保卫，已经不重要了。我扔下画笔，呐喊着冲进战团。
        - id: ch03-b12
          speaker: narrator
          text: 一时之间，谁也占不了上风。人在某个年纪，年长一两岁的差别，远比性别带来的那一点优势重要。我们就这样拉扯混战，谁都不肯退。忽然，塞莉娜裙子上的褶裥挣脱开来，响声就像远处一排火枪噼啪射击。最终让她那不屈精神低头的，与其说是蛮力，不如说正是这场衣裙上的灾难。
        - id: ch03-b13
          speaker: narrator
          text: 我很快就明白，女人的舌头确实比刀剑厉害。塞莉娜把撕裂的裙子远远抻开，用人身攻击和辱骂的希腊火，替刚才的失败报仇。我短暂却不甚清白的一生里，每桩见不得人的旧事、每个错误、每件傻事，还有每次丢脸挨过的罚，都像魔灯戏一样在眼前轮番上演。不过，这些消息对我并不新鲜，以前又排演过许多回，听来早已不痛不痒。况且，无论得胜的将军品行如何，打赢的一方终究还是打赢了。
        - id: ch03-b14
          speaker: narrator
          text: 哈罗德咯咯笑着，得意地叫了几声，从桌上爬下来，露出那份叫无数裙褶断送生命的文件。
        - id: ch03-b15
          speaker: harold
          text: 你愿意的话，可以看。只是一封死亡信。
        - id: ch03-b16
          speaker: narrator
          text: 谁也猜不出哈罗德眼下会拿什么取乐。唯一能肯定的，是那一定出人意料，无法猜测，更不可能预先料到。谁会为了放松心情，想到写一份死后分配财产的文书？哈罗德最近却偏偏迷上这个。公平地说，“死亡信”这个名字起得一针见血。“遗嘱”之类的字眼也许还有不同含义和用法，可“死亡信”绝不会叫人误会。我铺平那张皱巴巴的纸，读了起来。它跟体面家庭律师通常采用的格式相去甚远。两者唯一相似之处，或许就是同样没有标点。
        - id: ch03-b17
          speaker: narrator
          text: 亲爱的爱德华等我死了我把所有的钱都留给你还有手杖鞭子马鞭我的剑和枪砖头堡垒和一切好东西再见亲爱的夏洛特等我死了我把手表指南针铅笔盒我的水手和坎珀当号我的画还有所有东西都留给你再见你亲爱的兄弟阿们亲爱的玛莎我非常爱你我把花园老鼠兔子和盆栽都留给你等我死了请照顾好它们我亲爱的……信写到这里便残缺了。
        - id: ch03-b18
          speaker: selina
          text: 怎么，你一样东西也没留给我！你真是个小气鬼。上次送你的生日礼物，我要收回来！
          emotion: angry
        - id: ch03-b19
          speaker: harold
          text: 我不在乎。我本来正要留东西给你，可现在不留了。因为我还没死，你就想偷看我的死亡信！
        - id: ch03-b20
          speaker: selina
          text: 那我也写一封死亡信，一样东西都不留给你！
        - id: ch03-b21
          speaker: narrator
          text: 她说完便去找铅笔。屋里的暴风雨让我忘了窗外。如今一看，雨已经完全停了，万物都浸在明亮的阳光里，那金色比我的藤黄颜料所能画出的颜色还要耀眼。我留下塞莉娜和哈罗德，让他们用互相剥夺继承权的方式解决争端，自己溜出房间，逃到户外，急着从早晨放下的地方，重新拾起那条新友谊的线头。
    - id: ch04
      title: 大炮终于开火
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 暴雨刚过，阳光辉煌地重返大地。空气又暖又湿，散发着雨后泥土和草木的气息。绿叶上缀满闪亮的水珠，雨洗过的清风拂来，叫人精神一振。想象中的公园和宫殿也披上更鲜活的虹彩。原本模糊的美景重新显露，仿佛泛起红晕，也重新有了心跳。我奔向约好的地方，心里再次陪着新伙伴穿过那座心爱的宫殿。早晨我太仓促地把她领了进去。现在仔细一想，才发现那里运转得并不顺当。那种环境并不适合她，也不能让她充分显出光彩。
        - id: ch04-b02
          speaker: narrator
          text: 不过没什么要紧。我还有许多别的宫殿，可以任她挑选。只要再多熟悉她一点，弄清她的脾气和喜好，自然能找到一座合她心意的。譬如，我还有一座真正的阿拉伯宫殿，只是很少去，唯有兴起浓浓的东方情调时才会造访。那里是个十足的奇境，挂满丝绸帷幔，喷泉里流着玫瑰水，四处都是凉亭和高高的宣礼塔。
        - id: ch04-b03
          speaker: narrator
          text: 几百名训练有素、沉默无声的奴仆挤满楼梯和小径，随时听候吩咐。只要她愿意，他们可以整天替她跑腿搬东西，我那些勇敢的士兵也就不必再受这种屈辱。集市上还会不时出现盛大的队伍，骆驼、大象和轿子从街巷间经过，样样都有。是的，这位爱发号施令的年轻姑娘，明明更适合东方。我决定，只要一有机会，便要亲自把她护送到那里。
        - id: ch04-b04
          speaker: narrator
          text: 我赶到篱笆边，踩着两根横木爬上去，探身四处寻找早晨那位灵魂相契的伙伴。很快，我便看见了她，就在不远处。她背对着我，而且……谁也无法预料，眼前的情形究竟会变成什么样。她正在跟一个男孩子说话。
        - id: ch04-b05
          speaker: narrator
          text: 男孩子和男孩子当然不一样，天知道，我从来不是心胸狭窄的人。可那是邻村牧师的儿子，一个红头发的男孩，也是世上走过路的最下等的小畜生。他养雪貂，这是他唯一的长处。显然，他正靠这门本事卑鄙地取代我。她低着头，全神贯注地看着他捧在手里的东西，连周围都顾不上了。我忐忑地喊了声“嗨”，没有回答。我又喊了一次。可是这一回，心里已经尝到失败的苦味，也觉得厄运就要落下来。
        - id: ch04-b06
          speaker: narrator
          text: 她只回了我一个复杂的动作。它的意思果断明确，样子却很难形容。她不耐烦地甩头，猛耸左肩，左脚又向后一踢。这三个动作同时做出来，就这么一下，已经足够。那个红头发男孩甚至不屑朝我看一眼。他又何必看呢？我没再尝试，从篱笆上跳下来，沿着那条叫人疲惫的路往家走。
        - id: ch04-b07
          speaker: narrator
          text: 起初，我一点也不想独自去那座常去的宫殿。不久以前，我还同她一起品尝过那里的乐趣。没有她陪着，那里仿佛也失去了吸引力。可是走了一两分钟，习惯还是悄悄把我领了进去，和平时差不多。没过多久，我发现，重新得到独来独往、凡事自己作主的自由，倒也颇能安慰人。
        - id: ch04-b08
          speaker: narrator
          text: 再没有姑娘反复无常的主意和异想天开的禁令，我爱划船就划船，爱扬帆就扬帆，爱撑平底船就撑平底船。到了巧克力房，我咔嚓咬开硬巧克力棒，慢慢嚼着，对那些偏爱软心、外表光鲜的巧克力的人，很有几分轻蔑。我又随心所欲地调出无数种汽水，大口痛饮，再也不怕谁来禁止。
        - id: ch04-b09
          speaker: narrator
          text: 最后，我昂首阔步走进公园，叫所有士兵在露台上列队。这里又完全属于我了。我让他们看准我的拍子，随后亲自发出口令。顷刻之间，所有大炮一齐开火。
