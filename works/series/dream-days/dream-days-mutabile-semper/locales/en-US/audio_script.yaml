  chapters:
    - id: ch01
      title: The Girl Beyond the Fence
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            She was standing beyond the garden fence when I came down the road, watching me with a serious look.
        - id: ch01-b02
          speaker: new_girl
          text: “Hi-o!”
        - id: ch01-b03
          speaker: narrator
          text: “Hullo!” I stopped, feeling rather nervous. To tell the truth, the meeting was not quite an accident on my side. I had seen her in church the Sunday before. After the service, I found out who the newcomer was and which aunt she was visiting. So when someone was needed that morning to carry a note to the Parsonage, I surprised myself by stepping forward eagerly. Everyone else suddenly found something absorbing to do or quietly slipped out of sight. I had made no real plan, but I did remember that the road to the Parsonage passed her aunt's garden.
        - id: ch01-b04
          speaker: narrator
          text: >-
            She began talking while I jumped back and forth across the ditch, trying to look perfectly at ease.
        - id: ch01-b05
          speaker: new_girl
          text: >-
            I saw you in church on Sunday, but you looked different then. You were all dressed up, and your hair was brushed smooth at the sides. It was so shiny! What do they put on it? Don't you hate having your hair brushed? And your boots squeaked all the way down the aisle. When mine squeak, I walk through puddles until they stop. I think I'll climb over the fence.
        - id: ch01-b06
          speaker: narrator
          text: >-
            She went straight to work and climbed over the fence in a businesslike way. I stood with my hands deep in my pockets, following every movement with silent interest, as if she were some strange new animal I had never seen before.
        - id: ch01-b07
          speaker: new_girl
          text: >-
            I've been gardening, and I didn't like it. There are so many worms today. I hate worms. I wish they would keep out of the way when I'm digging.
        - id: ch01-b08
          speaker: narrator
          text: “I like finding worms when I dig. They make things more lively, don't they?”
        - id: ch01-b09
          speaker: new_girl
          text: “I might not mind them if they were warm and dry, but...”
        - id: ch01-b10
          speaker: narrator
          text: >-
            She shivered as she said it, and somehow that made me like her. If one of my own family had behaved that way, I would have jeered at once. From worms we moved quite naturally to frogs. Then we talked of pigs, aunts, gardeners, rocking horses, and all the other citizens of the kingdom children share. Within five minutes, each of us knew the other's private thoughts, and I felt I had known her all my life. It was easier to speak frankly about myself with her than with the girls in my family. I decided that this must be because she did not already know all the worn, ragged, and shameful pieces of my past.
        - id: ch01-b11
          speaker: new_girl
          text: >-
            I watched you coming down the road. Your head was down, your hands were in your pockets, and you weren't throwing stones or whistling or jumping over anything. I thought perhaps someone had scolded you, or maybe you had a stomachache.
        - id: ch01-b12
          speaker: narrator
          text: “No, it wasn't that. The truth is, I was... I often... but it's a secret.” The word was a mistake. It sent her dancing around me, begging and commanding at once.
        - id: ch01-b13
          speaker: new_girl
          text: “Oh, tell me! You have to. I promise I will never tell anyone else. I truly won't!”
        - id: ch01-b14
          speaker: narrator
          text: >-
            Her whole small body wriggled with excitement. She danced impatiently just in front of me, staring up with pleading eyes. Her hair tumbled loosely over her shoulders, and the gap left by the front tooth she had lost at her age only made her face more charming.
        - id: ch01-b15
          speaker: narrator
          text: “You won't want to hear it. I can't explain it properly, anyway. Perhaps I had better not tell you.” Even as I spoke, I knew I would give in.
        - id: ch01-b16
          speaker: new_girl
          text: “But I do want to hear! I never thought you would be so unkind.”
          emotion: sad
        - id: ch01-b17
          speaker: narrator
          text: >-
            The corners of her mouth began to turn down. I knew that warning sign far too well, and it would never do. So, stumbling over the words, I explained. This stretch of road, all the way to the corner, was terribly dull. I had to go up and down it again and again. I knew every part of it, and I was sick of the whole thing. Whenever I reached the corner, I simply went right away to another place.
        - id: ch01-b18
          speaker: new_girl
          text: “What kind of place?”
        - id: ch01-b19
          speaker: narrator
          text: “It is only a place I imagine, of course. But it is the finest place you ever saw. I go there in church, or during geography lessons.”
        - id: ch01-b20
          speaker: new_girl
          text: “It can't be finer than my home. You ought to see it. Our home is lovely, and we have...”
        - id: ch01-b21
          speaker: narrator
          text: “It is much finer. I mean, I'm sure your home is beautiful. But this place must be better, because whatever you want, you only have to want it, and then it is yours.”
        - id: ch01-b22
          speaker: new_girl
          text: “That does sound splendid. Please tell me more. First, how do you get there?”
    - id: ch02
      title: The Palace of Everything
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            I told her I never knew exactly how I arrived. I just went. Usually it began with a broad, clear river and a sort of boat. No one rowed it. It simply carried me along. Beautiful green meadows stretched down both banks, and the full river rose level with the grass. The boat glided close beside the meadow edges. People there made hay, played games, or walked about. They called to me, and I called back. They brought things to eat from their baskets and let me drink from their bottles. Some of them were the wonderful people I knew from books.
        - id: ch02-b02
          speaker: narrator
          text: >-
            At last the boat reached the Palace steps, great broad marble steps running all the way down into the water. Every sort of boat anyone could imagine waited beside them. There were schooners, punts, rowboats, and little warships. Once I arrived, I could choose any kind of boating I pleased. I might row, sail, or push a punt about all day.
        - id: ch02-b03
          speaker: new_girl
          text: >-
            I would sail, and I would steer. No, you would steer while I sat on the deck. No, I would row. At least, I would make you row while I steered. Or perhaps we would sit in a punt and dabble!
        - id: ch02-b04
          speaker: narrator
          text: “We can do whatever you like.” I said it generously, though this demanding guest was already making me feel less free in my own private kingdom.
        - id: ch02-b05
          speaker: new_girl
          text: “Actually, I don't think we should go boating. Boats wobble too much. What comes next?”
        - id: ch02-b06
          speaker: narrator
          text: “You climb the steps and go through the door. The very first place is the Chocolate Room.”
        - id: ch02-b07
          speaker: new_girl
          text: “The Chocolate Room!”
          emotion: happy
        - id: ch02-b08
          speaker: narrator
          text: >-
            I described every chocolate anyone could imagine. There were soft ones filled with sticky white and pink creams, the sort girls liked. There were also hard, shining sticks that cracked between your teeth and lasted beautifully when you sucked them.
        - id: ch02-b09
          speaker: new_girl
          text: “I like the soft ones. You can eat so many more of them.”
        - id: ch02-b10
          speaker: narrator
          text: >-
            That was an entirely new way of looking at chocolate, and I studied her with interest and some respect. Chocolate was far from common in our house. Whenever we managed to get any, we invented the strangest tricks to make it last as long as possible. Still, legends had reached us about children who, from time to time, truly possessed as much chocolate as they could eat. Clearly, she was one of those remarkable children.
        - id: ch02-b11
          speaker: narrator
          text: “You may have all the creams. I'll take the hard sticks, since those are my favorites.”
        - id: ch02-b12
          speaker: new_girl
          text: >-
            No, you mustn't! You have to eat the same kind as I do. It isn't nice to like different things. Give all the chocolate to me, and then I will give you what you ought to have.
        - id: ch02-b13
          speaker: narrator
          text: >-
            “All right,” I said quietly. It seemed unfair to face such a rule in my own Chocolate Room. I went on to the next room, where a marble counter ran around the walls. Little silver taps gave any fizzy drink you wanted.
        - id: ch02-b14
          speaker: new_girl
          text: “What kinds of fizzy drinks?”
        - id: ch02-b15
          speaker: narrator
          text: >-
            “Every kind,” I said quickly, and hurried on before she could ask more. She might control what I ate, but I would not let her interfere with what I drank. A long corridor led to the back of the palace, where the finest park in the world spread out. It had ponies to ride, along with carts and carriages. There was also a complete little railway, with its own engine and guard's van. You worked the railway yourself. You could travel first class, ride in the van, or stand on the engine, exactly as you chose.
        - id: ch02-b16
          speaker: new_girl
          text: “I would ride on the engine. No, perhaps I would...”
        - id: ch02-b17
          speaker: narrator
          text: >-
            I cut in before she could rearrange my railway. The park also held countless tall soldiers, all belonging to me, and a line of brass cannons along the terrace. Whenever I gave the command, every gun fired.
        - id: ch02-b18
          speaker: new_girl
          text: >-
            No, they won't! You must order them not to fire. I hate guns, and if they start shooting, I will run straight away.
        - id: ch02-b19
          speaker: narrator
          text: “But firing is what the guns are there for!”
          emotion: surprised
        - id: ch02-b20
          speaker: new_girl
          text: >-
            I don't care. They may walk behind me, talk to me, and carry things for me. But they must not fire those guns.
        - id: ch02-b21
          speaker: narrator
          text: >-
            By then, I knew sadly what was happening. In my own brave palace, where I had always swaggered about without rules and where no one questioned me, I was quickly becoming nothing more than a lodger. The thought of my magnificent soldiers being ordered to carry things was almost too much. Though I still had a great deal more to show her, I no longer felt inclined to tell it.
        - id: ch02-b22
          speaker: new_girl
          text: “Are there any other boys?”
        - id: ch02-b23
          speaker: narrator
          text: >-
            “Oh, yes. Fine fellows, too. We will have great...” I had answered without thinking, but now I stopped myself. “Naturally, we will play with them. But you are going to be my friend, aren't you? You will come in my boat, and we will travel in the guard's van together. I will even stop the soldiers from firing their guns.”
        - id: ch02-b24
          speaker: narrator
          text: >-
            She only looked away with a mischievous smile. I tried every argument I could think of and did everything in my power, but nothing I said would make her promise to belong especially to me.
    - id: ch03
      title: Rain in the Schoolroom
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Just then, the village clock struck. At once, another noisy clock seemed to wake inside me. Midday mutton waited half a mile away, and arriving late would bring punishments and a painful loss of privileges. We said a hurried goodbye. Before we parted, I got her to admit that she might be gardening again that afternoon, provided the worms behaved less aggressively and gave her a chance.
        - id: ch03-b02
          speaker: narrator
          text: “Remember, you must not tell anyone what I told you.”
        - id: ch03-b03
          speaker: narrator
          text: >-
            She hesitated. She swung one leg and looked sideways at me through half-closed eyes.
        - id: ch03-b04
          speaker: narrator
          text: “It is a dead secret. It belongs to just us two, and no one else in the world knows.”
        - id: ch03-b05
          speaker: narrator
          text: >-
            Then she promised. She nodded hard, her eyes grew wide, and her mouth squeezed into a tiny shape. The delight of revealing something and the joy of possessing a secret are very closely matched. But the joy of keeping the secret usually wins, at least for a while.
        - id: ch03-b06
          speaker: narrator
          text: >-
            By the time I had passed the mutton and was deep in warm rice pudding, I finally had enough leisure to look around. Rain was pouring against the window. This spoiled everything. Even if it stopped later, I knew from experience that the worms would be offensively lively. I said grace sulkily and followed the others upstairs to the schoolroom. There I took out my paint box and decided to devote myself seriously to the Art I had lately neglected. Harold carried a sheet of paper and a pencil to a corner table, planted his elbows squarely, and stuck out his tongue. Literature had always been his chosen form of art.
        - id: ch03-b07
          speaker: narrator
          text: >-
            The hopeless weather made Selina restless. Instead of settling down to some occupation of her own, she chose to wander around and bother us artists while we tried to give shape to our highest ideas. She had been peering over my shoulder for several minutes before I realized she was there. Otherwise, I would have had something to say about it much sooner.
        - id: ch03-b08
          speaker: selina
          text: “I suppose you call that a ship. Whoever heard of a pink ship? Hoo-hoo!”
        - id: ch03-b09
          speaker: narrator
          text: >-
            I swallowed my anger. To answer properly, I needed a cool head. “There is a pink ship in the toy shop window right now. Go and see it if you like. Do you think you know more about ships than the people who make them?”
        - id: ch03-b10
          speaker: narrator
          text: >-
            That stopped Selina only briefly. Soon she attacked again.
        - id: ch03-b11
          speaker: selina
          text: “Those are strange things, too. Are they supposed to be trees? They're blue.”
        - id: ch03-b12
          speaker: narrator
          text: “They are trees, and they have to be blue. You stole my gamboge last week, so I can't mix any green.”
        - id: ch03-b13
          speaker: selina
          text: “I did not steal your gamboge. And if I were you, I wouldn't tell lies about one dirty little bit of paint.”
          emotion: angry
        - id: ch03-b14
          speaker: narrator
          text: >-
            She spoke proudly, though she was already edging toward Harold. I kept silent. I knew that she knew she had taken it.
        - id: ch03-b15
          speaker: narrator
          text: >-
            The moment Harold noticed her coming, he dropped his pencil and threw himself flat across the table, covering his writing with his whole body. From somewhere beneath him came a long, piercing squeal mixed with a whistle, like steam escaping without ever changing its note.
        - id: ch03-b16
          speaker: selina
          text: “I only want one little look!”
        - id: ch03-b17
          speaker: narrator
          text: >-
            Selina tried to pull his small body away from the writing, but Harold clung to the table edge like a limpet and kept up his deafening cry. I did not care whether Selina stole Harold's private thoughts. She would probably get hold of them sooner or later, and I welcomed a struggle that left me free to paint. But boys have their own unwritten laws, and we have to stand together. We were already bullied, mistreated, and trampled quite enough. If boys deserted one another in dangerous times, who could tell what humiliations would follow? Our whole tribe might disappear. I dropped my brush and charged shouting into the fight.
        - id: ch03-b18
          speaker: narrator
          text: >-
            For a while, no one could tell who would win. There is a time in life when being a year or two older matters far more than the smaller advantage of being a girl. Then the gathered cloth of Selina's dress tore loose with a sound like distant gunfire. That disaster, more than any mere physical force, finally defeated her determined spirit.
        - id: ch03-b19
          speaker: narrator
          text: >-
            Selina held out her ruined dress and proved that a girl's tongue can be stronger than a sword. She took revenge with a burning storm of personal insults. Every dark event in my short but imperfect life appeared before me. She displayed every error, every foolish act, and every humiliating punishment as though she were showing pictures from a magic lantern. The information was not especially new, and hearing it many times before had weakened its force. Besides, a victory stays a victory, whatever faults the winning general may possess.
        - id: ch03-b20
          speaker: narrator
          text: >-
            Harold slid from the table, chuckling and crowing. His paper, saved at the price of Selina's dress, lay open before us.
        - id: ch03-b21
          speaker: harold
          text: “You may read it if you want. It is only a Death-letter.”
        - id: ch03-b22
          speaker: narrator
          text: >-
            No one could ever guess what Harold might choose for amusement. Only one thing was certain. It would be improbable and impossible to predict. Who else, looking for a pleasant way to pass the time, would choose to arrange what happened to all his belongings after death? Yet this was Harold's latest passion. To be fair, he had named it perfectly. “Will” and “testament” can mean several things, but no one could mistake “Death-letter.” I smoothed the crumpled page and read. Its form looked nothing like a document prepared by a respectable family lawyer. The only likeness was that it had no punctuation.
        - id: ch03-b23
          speaker: narrator
          text: >-
            Harold began by addressing dear Edward. When he died, Edward would receive all his money, walking sticks, whips, riding crop, sword, gun, bricks, forts, and all the other things he owned. Then he said goodbye. Dear Charlotte was to have his watch, compass, pencil case, toy sailors, Camperdown, pictures, and everything. He said goodbye to her too, signing himself her loving brother. He told dear Martha that he loved her very much. She would inherit his garden, mice, rabbits, and potted plants when he died, and he asked her to care for them. There the unfinished letter stopped.
        - id: ch03-b24
          speaker: selina
          text: “You haven't left me anything! You are a mean little boy, and I will take back the birthday present I gave you.”
          emotion: angry
        - id: ch03-b25
          speaker: harold
          text: “I don't care. I meant to leave you something, but now I won't. You tried to read my Death-letter before I was dead!”
        - id: ch03-b26
          speaker: selina
          text: “Then I will write my own Death-letter, and I won't leave you one single thing!”
          emotion: angry
        - id: ch03-b27
          speaker: narrator
          text: >-
            Selina went away to find a pencil and begin her artistic revenge. The battle indoors had kept my attention from everything outside. Now one glance through the window showed me that the rain had stopped completely. Everything was bathed in a rich glow of sunlight, more golden than any yellow paint I could possibly make. I left Selina and Harold to settle their quarrel by leaving each other nothing. Then I slipped from the room and escaped outdoors, eager to take up the loose end of my new friendship exactly where I had dropped it that morning.
    - id: ch04
      title: A Better Palace
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            After the downpour, the returning sunshine made everything glorious. The warm, wet earth sent up rich smells. Drops of water glittered over all the green leaves, and the touch of the washed air made me hurry along. In my mind, the parks and palaces of imagination glowed in brighter colors. Their beauties, blurred for a little while by the rain, seemed fresh and alive again. As I ran toward our meeting place, I imagined walking beside my new companion through the corridors of the favorite palace I had introduced her to so hastily.
        - id: ch04-b02
          speaker: narrator
          text: >-
            As I thought it over, though, I began to see that the arrangement would never work properly. I had made a mistake. Those were not the surroundings where she was best fitted to shine. But that hardly mattered. I had many other palaces to place at her disposal, plenty of them. Once I knew her better and understood all her tastes, I had no doubt that I could find something to suit her perfectly.
        - id: ch04-b03
          speaker: narrator
          text: >-
            For example, I had a true Arabian palace. I visited it only rarely, when I felt exactly in the mood for the East. It was a wonder of silk hangings, rosewater fountains, pavilions, and slender minarets. Hundreds of silent, well-trained servants filled its stairs and paths. They would be ready to fetch and carry for her all day if that was what she wanted. My brave soldiers would then escape such an indignity. At unexpected moments, splendid processions moved through the bazaar with camels, elephants, and covered palanquins. Yes, I decided, this commanding young person was much better suited to the East. I would personally take her there at the earliest possible moment.
        - id: ch04-b04
          speaker: narrator
          text: >-
            I reached the garden fence, climbed two rails, and leaned over. I looked first one way and then the other for the companion who had seemed to share my very soul that morning. It did not take long to find her. She stood only a short distance away, with her back toward me. One can never know exactly what will be waiting. She was talking to a boy.
        - id: ch04-b05
          speaker: narrator
          text: >-
            Of course, there are boys and boys, and I had never been narrow-minded about them. But this one was the parson's son from the next village, a red-haired and thoroughly common little beast. His one good quality was that he kept ferrets. It was plainly through that very hobby that he was so shamefully replacing me. The girl had bent her head over something he held in his hands and was studying it with complete attention.
        - id: ch04-b06
          speaker: narrator
          text: >-
            With some fear, I called, “Hi!” No one answered. I called “Hi!” again, and this time I already felt the sickness of failure and doom.
        - id: ch04-b07
          speaker: narrator
          text: >-
            Her only reply was a complicated gesture. It was hard to describe, but its meaning was perfectly clear. She tossed her head, jerked her left shoulder, and kicked backward with her left foot, all at the same moment. That was all, and that was enough. The red-haired boy did not even lower himself enough to look in my direction. Why should he? I dropped from the fence without making another attempt. Then I turned homeward and walked once more along the weary old road.
    - id: ch05
      title: My Kingdom Again
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            At first, I had very little desire to make a lonely visit to my usual palace. Only a short while before, I had tasted all its pleasures in company, and now they seemed spoiled. The river, rooms, and park had all been shared with someone else. Yet after a minute or two, I found myself slipping back there from habit, much as I always did.
        - id: ch05-b02
          speaker: narrator
          text: >-
            Before long, I noticed a certain comfort and consolation in having my freedom again. I was rid of all girlish whims and fanciful restrictions. On the palace river, I rowed when I wanted, sailed when I wanted, and pushed a punt about exactly as I pleased.
        - id: ch05-b03
          speaker: narrator
          text: >-
            In the Chocolate Room, I cracked and nibbled the hard sticks I liked best. I felt a certain scorn for anyone who preferred the soft kind hidden under a fancy outer coating. In the next room, I mixed and swallowed countless fizzy drinks of my own choosing. There was no one beside me to interfere, and I had no fear that anyone would forbid a flavor.
        - id: ch05-b04
          speaker: narrator
          text: >-
            At last, fully myself again, I swaggered into the great park. I paraded every one of my soldiers along the terrace and formed them into splendid ranks. The brass cannons stood ready in their row. I ordered the soldiers to take their time from me and watch for my signal. Then, with no one left to object or run away, I gave the command. Every gun fired.
