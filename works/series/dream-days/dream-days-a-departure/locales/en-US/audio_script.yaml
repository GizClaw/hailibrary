audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: reflective, lightly amused, and intimate
        timbre: warm and clear
        pace: measured
        pitch: medium
    harold:
      display_name: Harold
      tts:
        delivery: earnest, lively, and direct
        timbre: bright and boyish
        pace: brisk
        pitch: medium-high
    charlotte:
      display_name: Charlotte
      tts:
        delivery: sensitive, candid, and quietly observant
        timbre: soft and youthful
        pace: measured
        pitch: medium
  chapters:
    - id: ch01
      title: The Toys Depart
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            It is a splendid thing to be a real prince. A pirate chief has his attractions too, and becoming captain of a band of robbers must be magnificent. But there is also something wonderfully tempting about being an heir. A long-lost heir in a play can stride into a kingdom he never knew was his, just at the right moment, certain of his own great worth and of all the rights wicked people kept from him. Yet even the ordinary sort of heir, waiting at home, has a career few people would refuse.
        - id: ch01-b02
          speaker: narrator
          text: >-
            One day he steps out of childhood, with all its rules and restrictions, and into property, freedom, and the respect that has been saved and polished especially for him. Once you count the worries of ruling a kingdom or commanding robbers, neither occupation offers very much more. So an ambitious boy who also enjoys life's comforts may well wonder which glittering career to choose. Should he become an heir, or an engine driver?
        - id: ch01-b03
          speaker: narrator
          text: >-
            An eldest son usually has that question settled for him. In childhood, though, inheritance often travels the other way, and the youngest succeeds. This is clearest when money is short and the weekly bills stand in a row like stiff hurdles. Father approaches each one with less confidence that his legs can carry him over it. Then the right of inheritance appears most powerfully in clothes. The younger heir marches through the land in trousers first shaped for his brother's legs, wearing new leaves but never fruit of his own. It can be bitter. Among all the fine threads that tie young and old, rich and poor, and past and present together, few are stronger or brighter than the plain delight of new clothes.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Men feel it and women feel it. A prince pleased with his perfect fit smiles much like a peasant in his Sunday best, and grandparents share the thrill that makes a child skip in a new frock. Never trust anyone who claims to feel no joy in new clothes.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Still, do not grieve too much for the boy whose parents cannot buy him new things. His heroes are the boys just older than he is, so their clothes share the same glamour. Receiving them carries a special privilege that no fashionable shop can sell. Galahad's sword, like many another hero's weapon, came to him already gray with history. In the same way, a boy may prefer trousers that are famous and shining with his hero's glory, even after all their soft surface has been worn away.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Clothes are not the only things inherited backward. There are toys as well. By the solemn age of nine or ten, a boy knows it would hardly be proper to announce that he still owns a hoop and a Noah's Ark. By then he wants a catapult, a pistol, or perhaps a sword stick. He is quite willing for the younger children, still helpless in kilts and petticoats, to own his babyish things in name.
        - id: ch01-b07
          speaker: narrator
          text: >-
            After all, the toys remain in the house. On a wet afternoon, when the old feeling returns, he can borrow them and play on the floor just as before. No one can call him a regular fondler of baby toys. He can always say he is only amusing the little ones.
        - id: ch01-b08
          speaker: narrator
          text: >-
            So none of us complained when the toys passed in name to Harold, and then from Harold to Charlotte. They were still there. They always had been, and surely they always would be. Once the nursery door was shut, there were no kings, queens, or grand owners in that little republic on the floor. Charlotte sometimes lifted her chin and acted important now that she owned property, but we all understood that her title only counted in the drawing room.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Why does a coming loss send no faint voice ahead, or cast even the lightest shadow of sorrow, to warn the happy people who are about to suffer it? Why do the Olympians never think it worth giving a hint about the thunderbolts they are quietly making? And why, oh why, did none of our thick heads imagine that a day would come when even Charlotte was judged too grown-up and motherly for toys?
        - id: ch01-b10
          speaker: narrator
          text: >-
            Our so-called education was hammered into us with rulers and canes. Every new grammar, musical instrument, stretch of history, or strange rule of arithmetic arrived with some painful tap first. Yet Time, the greatest schoolmaster, never bothered to rap our knuckles or our heads before beginning a new lesson.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Uncle Thomas caused the disaster. It was not the first mine he had exploded beneath us. He moved from one favorite cause to another, from Psychical Research to the White Rose and then to a Children's Hospital. Every day brought more leaflets. On each one, a woodcut showed Little Annie of Poplar sitting up in a white cot, surrounded by toys donated by nice, kind, rich children.
        - id: ch01-b12
          speaker: narrator
          text: >-
            The Olympians were always ready to melt over a sugary picture, and this idea delighted them. One day Charlotte came home untidy and breathless. Yelling Redskins had chased her right to the very door of our peaceful house. She was told sharply that French lessons would begin on Monday. From now on she must stop all pretense of being a trapper or a Redskin when she had no proper reason to be either. Worse still, at that very moment, all her toys were being packed into a box for the last time. They were going to London to brighten the lives of poor children and bring light to the eyes of all the little Annies in Poplar.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Naturally, the rest of us received no official notice that this great territory had been surrendered. We were not supposed to care. Harold had been promoted long before to a real birthday knife. Everyone knew that I belonged heart and soul to outlawed catapults. Mine were confiscated every week because they caused trouble with neighboring powers, but Edward kept me supplied from his school, which had a proud old tradition of making excellent ones.
        - id: ch01-b14
          speaker: narrator
          text: >-
            So Charlotte was supposed to be the only person affected. Even she had begun reading Miss Yonge and ought, by grown-up reasoning, to have cared more for crowded families of curates and dreadful deathbeds. But every one of us felt angry, betrayed, and almost ready to mutiny. We had pretended to despise those toys for years. Still, they had grown up beside us. They had shared our joys and troubles, seen us at our worst, and become part of the settled order of life. Looking at bare shelves and empty corners that were hateful in their tidiness, we finally understood what the toys had meant.
    - id: ch02
      title: The Empty Nursery
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            There was old Leotard, for example. We had sadly neglected him in recent years, though he still suited certain moods exactly. Leotard was an acrobat who lived in a glass-fronted box. His slim body and loose-jointed arms and legs were made of cardboard, and his hands always gripped a trapeze bar.
        - id: ch02-b02
          speaker: narrator
          text: >-
            If you spun the box around five or six times, its wonderful hidden machinery woke. Leotard swung and leaped forward and backward. One moment he sat astride the bar, and the next he flew free. His joints seemed iron and his muscles seemed wonderfully supple. He was forever inventing some new position no one could guess beforehand. Above him, below him, and all around, a richly dressed painted audience watched from stalls, boxes, dress circle, and gallery. They never showed the least excitement, which made us suspect they were made in Germany.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Leotard was perhaps not varied enough for every occasion. He did not sympathize, and no one would choose him as a companion in bed. But within his limits he was always fresh and absorbing. He never ran out of clever, unexpected movements. Now he was gone. That was all. We had never especially treasured him while he stayed with us, yet somehow he had built a place in our lives that belonged only to him.
        - id: ch02-b04
          speaker: narrator
          text: >-
            Sunrise and sunset, the dinner bell, a sudden rainbow, lessons, Leotard, and the moon through the nursery windows had all belonged to the great order of things. Move one of them, and the whole machine seemed to go wrong. The point was not that the world would keep turning as before. The point was that Leotard would not.
        - id: ch02-b05
          speaker: narrator
          text: >-
            Another bare corner had been the stable of the spotty horse. At the end of each hard-working day, he used to doze there peacefully all night. Long ago, each of us had taken a turn being jerked around the room on his uncertain back. We dug our heels into his hard sides and scratched our hands on the tin tacks that held his mane to his stiffly curved neck.
        - id: ch02-b06
          speaker: narrator
          text: >-
            As we grew taller, we stopped valuing him as a riding animal. He accepted the change with perfect good nature. Whenever a military mood seized us, he was ready to become a whole cavalry squadron, a horde of Cossacks, or heavy guns pounding into position. During the time when we thought of nothing but battles at sea, he served honorably as a gunboat. No foolish pride about being a horse prevented him from becoming a roaring locomotive, shaking the earth, clanging fearfully, and destroying time and distance. How could life meet all its emergencies without the spotty horse, always willing to take whatever part was needed?
        - id: ch02-b07
          speaker: narrator
          text: >-
            When your spirits are low, few things comfort you like the honest smell of a painted animal. Without thinking, I turned toward the shelf that had so long been Mount Ararat for our battered Noah's Ark. The shelf was empty. The Ark had slipped its moorings and sailed away to Poplar. It had taken its unforgettable smell with it. Gone too was that pleasant feeling of disorder which even the best-managed Ark always gives a room.
        - id: ch02-b08
          speaker: narrator
          text: >-
            Its sliding roof almost never closed all the way. A pair of giraffe legs or an elephant's trunk was always sticking out, softening the stiff shape of the box. It reminded us that the mixed crowd inside was cramped and eager to tumble onto the floor. Then they could browse and gallop, flutter and bellow and neigh, and be themselves again.
        - id: ch02-b09
          speaker: narrator
          text: >-
            None of us cared much for Ham, Shem, or Japhet. They were included because the story required them, but nobody truly wanted them. The Ark existed for the animals. They had tails, trunks, and horns, and usually at least three legs, though a few unfortunate creatures had lost even more. Birds counted as animals too. There was a gray dove with black wings, and a red-crested bird that might have been a woodpecker or perhaps a hoopoe. There was even a dear beetle, as large as the dove, who could hold his own among any of the mammals.
        - id: ch02-b10
          speaker: narrator
          text: >-
            Charlotte had naturally been the sole head of the doll department for years. If its whole staff was absent today, I had no official right to notice. Still, you can belong to a club for many years without ever quite understanding what the other members are for. Then one Christmas or holiday, you enter and look at the deserted armchairs, empty sofas, and bare hat pegs. The room feels wrong, and suddenly you realize those other fellows had their appointed uses after all.
        - id: ch02-b11
          speaker: narrator
          text: >-
            Where was old Jerry? What had become of Eugenie, Rosa, Sophy, and Esmeralda? We had drifted apart, and we rarely spoke. Perhaps my new plans and achievements had even made me look down on those old-fashioned members who were content to remain exactly what they had always been. Now their corners were empty and their chairs unoccupied. My eyes had opened, and I wanted them back.
        - id: ch02-b12
          speaker: narrator
          text: >-
            Still, it was none of my business. If we were listing grievances, I had no case. My catapults might be officially locked away, but I knew the drawer, the hiding place of its key, and how to make life miserable for every creature within a mile. I only had to return the catapult properly when I had finished.
        - id: ch02-b13
          speaker: narrator
          text: >-
            Harold and Charlotte had suffered more. I wondered how they were taking it. At the very least, they could count on my moral support if they planned a protest or a counterattack. Their dogged, gloomy faces suggested that something might indeed be planned as they trotted toward the raspberry canes. Every mood drew us toward its own place. People in love sought the orchard. Anyone tired of rules and hungry for the road, the mining camp, or the country across the border went to the big meadow. But when you were sulky, rebellious, and full of plots, you always hid behind the raspberry canes.
    - id: ch03
      title: The Rescue
      blocks:
        - id: ch03-b01
          speaker: harold
          text: >-
            You can come too, if you want. We thought you wouldn't care, because you've got your catapults. But we've decided what we're going to do, and we're doing it. So don't tell us we oughtn't to, or anything like that, because we're going to.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Harold spoke quietly as soon as he noticed me sitting up in bed and watching him. The whole day had passed with a threatening sort of peace. Charlotte and Harold had carefully avoided me and everyone else. That alone should have made someone suspicious.
        - id: ch03-b03
          speaker: narrator
          text: >-
            That evening we had kept to separate corners. Sometimes we read. Sometimes we drew ships and battles on the blank leaves of books. No one talked or offered criticism. The dreadful tidiness of the universe weighed on us until bedtime came. We undressed, said our prayers more mechanically than usual, and climbed into beds that did not contain even one giraffe beneath a pillow.
        - id: ch03-b04
          speaker: narrator
          text: >-
            Harold settled under his sheets with loud grunts and made a great show of being overcome by sleep. But I saw him pull his pillow forward and prop his head against the brass bars of his cot. I knew most of his tricks, so it was plain that he intended to stay painfully awake.
        - id: ch03-b05
          speaker: narrator
          text: >-
            I had dozed off anyway. When I woke and sat up, Harold was already standing on the floor and feeling under the bed for his shoes. I watched him grimly. Just after he invited me, Charlotte slipped into the room with her face stiff and determined.
        - id: ch03-b06
          speaker: narrator
          text: >-
            Then I understood that I had no leading part in this scene. The younger two had planned the whole play. The story, the setting, and the cast belonged to them. My scepter had fallen, and my rule was over. At that magical hour of a summer night, ordinary laws meant nothing. All codes were canceled. Once the clock had struck ten, the true rulers and lawmakers were those who best understood the moonlight, the warm spirit of June, and the upside-down order that took command of the world.
        - id: ch03-b07
          speaker: narrator
          text: >-
            I followed humbly, almost timidly, behind those two determined young people. I did not offer one word of protest as they marched straight to the schoolroom. There, in the moonlight, stood the grim, enormous box. A great part of our past and of our very selves lay buried inside it, cold and wrapped in paper. It waited for the morning carrier, who would hurry it away to that strange, cold, distant Children's Hospital. The children there would misunderstand all the toys' little faults, and no one would know when to forgive them.
        - id: ch03-b08
          speaker: narrator
          text: >-
            I stood dreaming while Harold raised the lid. He and Charlotte thrust in their arms, searching, feeling, and grabbing among the packed toys.
        - id: ch03-b09
          speaker: harold
          text: >-
            I've found Rosa. I can tell by her hair. Shall I pull Rosa out?
        - id: ch03-b10
          speaker: charlotte
          text: >-
            Oh, yes. Give me Rosa!
          emotion: surprised
        - id: ch03-b11
          speaker: narrator
          text: >-
            Rosa came out looking quite undisturbed. She wore the same calm, moon-shaped expression as always while the comedy of the world rose and fell around her. Charlotte carried her to the window seat. There, in the moonlight, the two shared their private secrets and left Harold to search alone.
        - id: ch03-b12
          speaker: harold
          text: >-
            Here's something with sharp corners. I think it must be Leotard. We'd better leave him in.
        - id: ch03-b13
          speaker: charlotte
          text: >-
            Yes. We can't rescue Leotard.
          emotion: sad
        - id: ch03-b14
          speaker: narrator
          text: >-
            Poor old Leotard. I said nothing, because this was not my play. But if he heard and understood what was happening above him, surely he must have sent up one weak, smothered cry. Surely he begged to be saved from unfamiliar little Annies and kept by an audience that would value him and never judge him too severely.
        - id: ch03-b15
          speaker: harold
          text: >-
            I've reached the Noah's Ark now.
        - id: ch03-b16
          speaker: charlotte
          text: >-
            Push the lid back a little. Then pull out a dove, or a zebra, or a giraffe, if you can reach one.
        - id: ch03-b17
          speaker: narrator
          text: >-
            Harold struggled, grunting and twisting. At last he brought out a small gray elephant and a large beetle with a red stomach, and held them up in triumph.
        - id: ch03-b18
          speaker: harold
          text: >-
            Everything's packed too tightly. I can't get anything else. But when I came back up, I'm certain I felt Potiphar!
        - id: ch03-b19
          speaker: narrator
          text: >-
            Down he plunged again. Potiphar was a beautifully shaped bull covered in suede. He felt rough, comfortable, and warm when you took him to bed. He was my own special pride and joy, and honest feeling ran through me when he came into the light again, as strong and thick-necked as ever.
        - id: ch03-b20
          speaker: charlotte
          text: >-
            That will have to be enough. We mustn't take any more, or they'll discover what we've done. Put the box back properly and bring those with you.
        - id: ch03-b21
          speaker: narrator
          text: >-
            Harold pushed down the paper and twisted straw he had disturbed. He set the lid back so squarely that it looked innocent, then gathered up the little company we had saved. We crept toward the window we usually used for escaping prison and slipping out at night. Seconds later, we were hurrying silently in single file along the dark edge of the lawn.
    - id: ch04
      title: Moonlight Land
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            What a riot and clamor filled that moonlit night in June. Every silent thing spoke through scent and color, through swelling buds and rich new growth. Under the laurels, all was ghostly and still. The shadows seemed haunted by brigands, and twigs cracked while leaves whispered about the night and all the frightening things it might hold.
        - id: ch04-b02
          speaker: narrator
          text: >-
            But once we stepped into the open garden, it welcomed us with a glad new face. It was as cheerful as the garden we knew when sunlight swept across it, yet strange in its nighttime shape. We felt like guests entering a hall where horns announced an unfamiliar feast. Could this be the same grass, the same flower beds, paths, bushes, and patches of lawn? The full white light pouring over everything was new, and it explained the change.
        - id: ch04-b03
          speaker: narrator
          text: >-
            This was Moonlight Land and Past-Ten-o'clock Land. We belonged to it. All its other creatures were awake at last, free to speak, and they understood us as we understood them. Charlotte and Harold hurried forward, intent on their mission, and probably noticed little of this. I was only an extra in their play, so I had time to take it in. I could not fully understand the land's language or message then, but I remembered it and understood long afterward.
        - id: ch04-b04
          speaker: narrator
          text: >-
            Beneath the farthest hedge, where the garden ended loosely and the paddock began the outer world, darkness returned. It was not the solid blackness crouching under crowded laurels. This was a softer dusk hanging from the wide arms of tall elms.
        - id: ch04-b05
          speaker: narrator
          text: >-
            A small grave made a darker mark on the gray ground. I caught up with the others just in time to see Rosa laid stiffly inside. Moonlight had turned her cherry-red cheeks pale, but her brave smile was as victorious as ever. The grave was tiny and shallow for something that held so much.
        - id: ch04-b06
          speaker: narrator
          text: >-
            Potiphar had stood upright and stout-necked through so many days and so much changing weather. Now he had to bow his head and lie meekly on his side beside Rosa. The elephant and the beetle nestled wherever they could find room. In this silent country, it did not matter that one had a backbone and the other had red blood. Such differences counted for nothing there. They were only a little less crowded than they had been in their native Ark.
        - id: ch04-b07
          speaker: narrator
          text: >-
            We shoveled the earth back and stamped it firm. I was glad that no prayers were said and no speeches made. Everything about it was natural, right, and clear. There was no need to explain or defend it before the stars and flowers that watched us.
        - id: ch04-b08
          speaker: narrator
          text: >-
            The bond between us and the toys was not entirely broken now. One link remained. The Noah's Ark might be disappearing beyond the horizon with its cargo of sad-faced emigrants, but two passengers had missed the boat and would always stay close. When we played above them, an elephant would understand and a beetle would hear. The little creatures beneath us would still belong to our games. In spirit, the beetle could crawl once more across the familiar nursery floor.
        - id: ch04-b09
          speaker: narrator
          text: >-
            From now on, the spotty horse would race across faraway plains and feel homesick for his old stable. But Potiphar would never again paw the nursery floor when bullfights were announced. At least he had escaped rough treatment by town children, strangers quite capable of looking at that splendid bull and mistaking him for a cow.
        - id: ch04-b10
          speaker: narrator
          text: >-
            Jerry and Esmeralda might lose their limbs and stuffing, slowly or suddenly, in the world's most distant places and its most mysterious corners. Rosa's story, though, was finished. Nothing worse awaited her than slowly returning to the earth, almost near enough to touch and call to the familiar faces and things that had treated her as a friend from the first moment she opened her eyes.
        - id: ch04-b11
          speaker: narrator
          text: >-
            We turned toward home. For one moment, the man in the moon looked at me through the tangled elm branches, and he had never seemed so friendly. Plainly, he meant to watch over them. He was nearly always there, so it would be no trouble. He could tell them how life was still going up above, and whenever they grew a little dull, he could add a story or two of his own.
        - id: ch04-b12
          speaker: narrator
          text: >-
            Going away became easier when I knew we had left someone behind on the spot to keep them company. He was a good fellow, cheerful and comforting, with a great supply of stories, and a man one could trust entirely and completely.
