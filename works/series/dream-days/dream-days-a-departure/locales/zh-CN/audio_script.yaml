audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 机智而从容，带着温和的回望
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    harold:
      display_name: 哈罗德
      tts:
        delivery: 天真直率，疑惑时仍彬彬有礼
        timbre: 稚嫩清脆
        pace: 轻快
        pitch: 高
    charlotte:
      display_name: 夏洛特
      tts:
        delivery: 敏感细致，说悄悄话时轻柔谨慎
        timbre: 柔和清亮
        pace: 中等偏慢
        pitch: 中高
  chapters:
    - id: ch01
      title: 继承人的快乐
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 做一个真正的王子当然很好，做海盗头领也有许多好处，若能接掌一帮强盗，更是威风。不过，继承人同样很迷人。不只是戏台上那种失散多年的继承人。他会在最要紧的时候昂首走进一座从未料到的王国，满心知道自己身怀无人识得的才德，也知道本该属于自己的权利被坏人扣了许多年。哪怕只做普通而平淡、守在家里的继承人，也很少有人不肯拜师学这门行当。
        - id: ch01-b02
          speaker: narrator
          text: 想想看，你从牵引带和种种管束中一步跨出去，也告别了晚饭后只许喝一杯波特酒的日子。迎面便是财产、自由和应得的尊重。那些好东西全替你存好，擦亮，上漆，掸净灰尘，还薰得香喷喷的，只等你来接手。把王子的烦恼和强盗头领的责任算进去，它们恐怕也给不了更多。所以，一个年轻人既有雄心，又舍不得人生桌边那些可口配菜时，常会对着一柜台闪亮的职业犯愁：到底该做继承人，还是做火车司机？
        - id: ch01-b03
          speaker: narrator
          text: 长子往往不必选择。可在童年，继承次序常常是反过来的，像祖先那套“幼子继承法”，最小的孩子接收遗产。家境若不宽裕，每周账簿上的数字就像一排高栏，父亲跨到每一道前都更迟疑，更怀疑自己的双腿还能不能撑完全程。这时，继承权最厉害的地方便是衣裳。弟弟穿着多年前照哥哥身材裁的裤子，在家中领地大步走动。新长的是枝叶，果实却不是自己的。实在苦得很。人类之间有许多漂亮丝线，而喜爱新衣的快乐尤其坚韧，处处都能看见，还闪着变幻的光。
        - id: ch01-b04
          speaker: narrator
          text: 喜爱新衣是一种诚实又简单的快乐。它把古今贵贱所有人都牵在一起。男人为它心痒，女人也一样。衣裳合身的王子和穿上礼拜日新装的乡下人，脸上都是同一种得意。孩子穿着刚做好的衣裳蹦跳，祖父母看在眼里，血管中也会涌起同样的兴奋。年长和年幼的人，得到的快乐并没有分别。谁若声称新衣不能给他一点快乐，可别相信。
        - id: ch01-b05
          speaker: narrator
          text: 不过，我们不必替穿不上新衣的孩子太难过。他梦中的英雄本来就是比自己年长一点的孩子，英雄穿过的衣裳也带着荣光。轮到自己接手，便像得到斯韦尔斯和韦尔斯店里绝对买不到的宝物。加拉哈德和许多英雄拿到宝剑时，那剑早已有了悠久历史。男孩也宁可自己的裤子富有传奇，声名显赫，笼着心中英雄的光环，哪怕呢绒早已磨得一根绒毛也不剩。
        - id: ch01-b06
          speaker: narrator
          text: 玩具也照这套规矩传下去。孩子走近九岁甚至十岁以后，再公开宣称铁环和诺亚方舟属于自己，似乎不大合适。他自己也明白，因为这时真正想要的已是弹弓、手枪，甚至藏剑手杖。他很乐意把玩具的名义所有权交给还穿短裙的弟妹。那些小家伙远不如他能干，却很适合在名义上接管旧物。反正东西仍在。雨天下午若忽然想念旧日快乐，还可以说是“借”来，在地板上像从前一样玩个痛快，又不会落下成天抱着婴儿玩具的名声。甚至还能装作只是陪小孩子玩。
        - id: ch01-b07
          speaker: narrator
          text: 所以，玩具先传给哈罗德，再传到夏洛特手里，我们谁也没有抱怨。玩具仍旧在那里，从前一直在那里，将来也会一直在那里。只要育儿室的门关严，地板上的小共和国里便没有国王、女王，也没有高低等级。夏洛特终于有了不动产，偶尔会扬起下巴，对我们摆点主人的架子。可大家都知道，她那份产权只在客厅里算数。
    - id: ch02
      title: 空了的育儿室
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一场离别就要降临，为什么从不先送来一点微声、一丝悲伤的影子，警告那些快乐而毫无防备的人？奥林匹斯山上的大人们在高处默默锻造雷霆时，为什么不肯透露半点消息？我们这些榆木脑袋又为什么从没想到，有一天连夏洛特也会被嫌年纪太大，太像个小主妇，不该再玩玩具？所谓教育，总有戒尺和藤条替新语法、新乐器、新的历史年代和古怪算术开路。每一样新知识到来之前，似乎都先有一阵疼痛提醒我们。可时间这位最大的老师，每教到一个新阶段之前，偏偏不肯先敲敲我们的指节或脑袋，给我们一点预告。
        - id: ch02-b02
          speaker: narrator
          text: 这事全是托马斯舅舅惹出来的。这已不是他头一回在我们船头下面埋好地雷，再把它炸响。他一向爱追逐新风尚，先从心灵研究迷到白玫瑰运动，又从那里迷上一家儿童医院。我们每天都收到大批传单，上面的木刻画着波普勒的小安妮。她在洁白病床上坐起来，身边摆满善良有钱的孩子送来的玩具。奥林匹斯山上的大人最吃这种糖浆般甜腻的感伤，立刻赞成了这个主意。
        - id: ch02-b03
          speaker: narrator
          text: 一天，夏洛特披头散发、气喘吁吁地冲进家门，一群高声喊叫的红种人刚把她追到我们宁静家园的门槛。大人却冷冷通知她，星期一就开始上法语课。往后不得再无凭无据地冒充捕兽人或红种人。更要紧的是，她的全部玩具此刻正在一件件装箱，很快就要送往伦敦，让流浪儿和波普勒的小安妮们重获生活的欢乐，眼里重新发光。
        - id: ch02-b04
          speaker: narrator
          text: 我们几个没有收到这场割地的正式通知，因为按理不该再对玩具有兴趣。哈罗德早已升格，生日时得到了一把大家正式认可的刀。我则全心献给无法无天、不可救药的弹弓。它们每周都因引起国际纠纷而被没收，可爱德华仍稳定供应。他的学校在制造弹弓方面有悠久又优良的传统。这样看来，只有夏洛特真正受了影响。可她都读到扬格小姐的小说了，本该去关心子女成群的副牧师和悲惨揪心的临终床榻。
        - id: ch02-b05
          speaker: narrator
          text: 然而我们人人愤怒，只觉得遭到背叛，阴沉得几乎要造反。我们装作瞧不起那些玩具已经很久，可它们陪着我们长大，分享过欢乐和悲伤，也见过我们最糟的样子。它们早已成为日常天地中理所当然的一部分。我们望着无人居住的架子，望着空空荡荡、整洁得可恨的角落。也许这是多年来头一次，我们迟迟承认，原来那些玩具如此重要。
        - id: ch02-b06
          speaker: narrator
          text: 比如老利奥塔尔。近几年他备受冷落，却总能回应某一种特别的心情。他是住在玻璃盒里的杂技演员，松垮的四肢和细长身子全由纸板做成，两手永远抓着空中秋千。把盒子飞快转五六圈，神秘机关便会启动。他前后荡跃，时而跨坐杆上，时而飞到空中，关节仿佛铸铁，筋骨却又柔韧，每次都能变出猜不到的新姿势。上方、下方和四周画着衣着华丽的观众，池座、包厢、楼座、顶层一应俱全。面对惊险表演，他们却个个呆板无情，明摆着是德国制造。利奥塔尔不够多才多艺，不大懂得体贴，也不是随时都能陪伴的朋友。睡觉时，你更不会挑他一起上床。
        - id: ch02-b07
          speaker: narrator
          text: 可在自己的小天地里，他又总是新鲜、迷人，足智多谋，花样百出。现在他走了，就这样走了。从前并未格外受宠，却悄悄为自己占住了一个独有的位置。日出日落，开饭铃，忽然出现的彩虹，功课，利奥塔尔，还有透过育儿室窗户照进来的月亮，全属于万物的宏大秩序。拿走任何一样，整套机关仿佛都要乱掉。此刻要紧的并不是世界还会照旧旋转，而是利奥塔尔再也不会转了。
        - id: ch02-b08
          speaker: narrator
          text: 花斑马待过的角落也已经空了。每天辛苦工作完，他从前总在那里安稳打盹，睡过漫漫长夜。早些年，我们轮流骑上他并不牢靠的背，被颠着绕屋飞奔，把脚跟踢向纹丝不动的肚腹，也被固定鬃毛的铁钉划伤过手。后来个子长高，我们不再看重他作为驮兽的本领。他却坦率又好脾气地接受新局面，一声不响地配合。军人气概来临时，他能变成一整队骑兵、一大群哥萨克，或赶赴阵地的炮兵。大家只谈海军战略时，他又光荣地当过炮艇。他甚至肯放下马族骄傲，扮演震动大地、铿锵怒吼，一举消灭时间和空间的火车头。没有这样一个在紧要关头担起所需角色的伙伴，往后无数紧急局面可怎么办？
        - id: ch02-b09
          speaker: narrator
          text: 心情低落时，再没有什么比彩漆动物那股诚实的气味更能安慰人。我不由自主地转向那层架子，那里一直是饱经风霜的旧方舟停靠的亚拉腊山。可架子已经空了。方舟解开缆绳驶向波普勒，带走了熟悉的气味，也带走了那种愉快的凌乱。管理得再好的方舟也总会留下这种感觉。它的滑动舱顶从来关不严，总有一双长颈鹿腿或一根象鼻支在外面，让僵直的轮廓柔和下来，也提醒我们，里面那群五花八门的朋友挤得难受，早已想像瀑布一样涌到地板上，吃草、奔跑、振翅、吼叫、嘶鸣，重新做回自己。
        - id: ch02-b10
          speaker: narrator
          text: 我们从没太在意含、闪和雅弗。他们只是因为故事里有，才待在方舟里，谁也不真需要他们。方舟当然是造给动物的，而不是为了这几个人。动物该有尾巴、长鼻子、犄角，至少还要剩三条腿，尽管有些倒霉家伙连三条也没能保住。鸟也算动物，比如灰身黑翅的鸽子，还有红冠啄木鸟。说起来，那只红冠鸟也可能其实是戴胜，我们始终没能确定。昆虫自然也算。有只讨人喜欢的甲虫和鸽子一样大，站在任何哺乳动物中都不吃亏，完全能守住自己的位置。
        - id: ch02-b11
          speaker: narrator
          text: 娃娃部门早由夏洛特独自掌管。今天全体职员不在岗位，我也没有正式权利过问。可一个人在俱乐部待了多年，可能始终不懂其他会员有什么用。直到某个圣诞节或节日走进去，看见扶手椅无人落座，沙发空空荡荡，帽钩也光秃秃的，才会沮丧地明白，那些家伙原来各有职分。老杰里呢？欧仁妮、罗莎、索菲和埃斯梅拉达呢？不错，我们早已疏远，很少说话。我忙着新的雄心和功业，甚至瞧不起这些守旧、不求上进，只肯做原来那个自己的会员。可现在，他们的角落空了，椅子没人坐了。我终于睁开眼，只想把他们全要回来。
        - id: ch02-b12
          speaker: narrator
          text: 但这不关我的事。我若申诉，根本无处立足。我的弹弓虽被正式没收，我却知道关在哪只抽屉里，也知道钥匙藏在哪里。只要事后按时放回去，我随时能让方圆一英里的活物不得安生。真正挨了这道命令的是另外两人。不论他们正筹划抗议还是反击，我至少该在道义上支持，甚至还能多出一份力。两人阴沉又倔强地走向覆盆子丛，看来真有事情要做。某种心情总会寻找某个地方。恋爱时去果园。受够管教、厌倦规矩，一心向往大路、矿营和国境另一边时，就去大草地。满怀反叛和闷气，肚子里又装着阴谋时，则一定钻到覆盆子丛后面。
    - id: ch03
      title: 月下开箱
      blocks:
        - id: ch03-b01
          speaker: harold
          text: 你要是愿意，也可以跟我们来。我们本来觉得你不会在乎，因为你已经有弹弓了。可我们已经决定了，就一定要做。你可别说什么“不该这样”，反正我们非做不可！
        - id: ch03-b02
          speaker: narrator
          text: 白天在一种不祥的安静里过去了。夏洛特和哈罗德有意避开我，也避开所有人，那副目标明确的刻意样子，本该惹人怀疑。晚上，我们各自在不同角落看书，或心不在焉地在书前空页上画船和战斗。谁也不说话，也不评论别人的作品，整个宇宙阴沉沉的整洁压在身上。随后睡觉时刻到了。我们脱掉衣服，做完比平日更机械的祷告，最后躺进床里。枕头下面竟连一头长颈鹿也没有。
        - id: ch03-b03
          speaker: narrator
          text: 哈罗德装出累得要命的样子，哼哼着钻进被单，却把枕头往前拉，脑袋抵住小床的黄铜栏杆。我熟悉他的花招，立刻看出他打算痛苦地保持清醒。可我还是睡着了一会儿。醒来时，他已经下床，正在床底找鞋。我冷冷坐起来盯着他，他这才说我也可以去。夏洛特随即溜进房间，脸绷得紧紧的。
        - id: ch03-b04
          speaker: narrator
          text: 我这才明白，这出戏里没有我的角色。两个小家伙已经排好了一切，戏是他们的，布景是他们的，演员也是他们挑的。我的权杖掉了，统治结束了。夏夜这个神奇时辰里，法律不算数，规章也一笔勾销。十点钟一敲，谁最贴近月光，最懂六月暖意和颠倒乾坤的趣味，谁才是真正的君主和立法者。于是我一句抗议也没有，只能几乎胆怯地跟在他们身后。
        - id: ch03-b05
          speaker: narrator
          text: 我们径直走进课室。月光照着阴森的大箱子。我们大半的往昔和性情都埋在里面，冷冰冰地裹着纸，只等早晨的运送人把它们送去陌生、冰冷而遥远的儿童医院。在那里，它们那点小缺陷会被误解，再没人肯宽容。我站在一旁，像个无事可做的恍惚看客，只能望着他们行动。哈罗德把箱盖撑起来，他和夏洛特一齐伸进胳膊，在纸团和麦秸之间探寻、摸索、抓取。
        - id: ch03-b06
          speaker: harold
          text: 我摸到罗莎了，这头发我认得。要把她拿出来吗？
        - id: ch03-b07
          speaker: charlotte
          text: 快，把罗莎给我！
          emotion: surprised
        - id: ch03-b08
          speaker: narrator
          text: 罗莎被拖出箱子，仍旧安详地用月亮般的圆脸望着这个忽上忽下的喜剧世界，仿佛一点也没受惊。夏洛特抱着她退到窗边座位。月光中，她们两个交换起只属于彼此的秘密。箱边只剩哈罗德一个人，他只好独自继续探寻。
        - id: ch03-b09
          speaker: harold
          text: 这里有个角很尖的东西，我想是利奥塔尔。还是别救他了。
        - id: ch03-b10
          speaker: charlotte
          text: 嗯，利奥塔尔实在救不了。
          emotion: sad
        - id: ch03-b11
          speaker: narrator
          text: 可怜的老利奥塔尔！我当然没开口，这戏里没有我的角色。可他若听见并懂得头顶发生的一切，也许会在箱中发出一声微弱、窒息的轻喊，再送上一句几乎听不见的恳求，请他们救自己出去。那些素不相识的小安妮未必懂他，他一定更愿意留下，继续面对真正欣赏、从不过分挑剔的观众。
        - id: ch03-b12
          speaker: harold
          text: 现在摸到诺亚方舟了。
        - id: ch03-b13
          speaker: charlotte
          text: 把盖子往后推一点。鸽子、斑马、长颈鹿，哪只顺手就拉哪只出来。
        - id: ch03-b14
          speaker: narrator
          text: 哈罗德哼哼着扭动身体，忙了好一阵，终于得意地举起一头灰色小象和一只红肚子大甲虫。
        - id: ch03-b15
          speaker: harold
          text: 里面卡得太紧，别的都拿不出来。不过我刚才收手时，肯定摸到了波提乏！
        - id: ch03-b16
          speaker: narrator
          text: 他说完又一头扎进箱子。波提乏是一头做得精致的公牛，外面蒙着麂皮。那层皮摸起来粗糙而舒服，睡觉时抱在怀里又很暖。他一直是我个人最珍爱的快乐和骄傲。如今重新出现在月光里，粗壮的脖颈和结实的身躯仍同从前一样，我心里顿时涌起一阵真切而诚实的激动。
        - id: ch03-b17
          speaker: charlotte
          text: 这些就够了。再拿下去准会被发现。把箱子恢复原样，带上它们走吧。
        - id: ch03-b18
          speaker: narrator
          text: 哈罗德把刚才翻乱的纸团和扭曲麦秸重新压好，端端正正盖上箱子，做得若无其事，仿佛从没人碰过。他抱起这点抢救出来的东西，我们偷偷走向那扇窗。平日若要逃狱或趁夜出走，大家最常走的就是那里。几秒后，三个人已排成一列，沿草坪黑暗的边缘无声赶路。
    - id: ch04
      title: 十点以后国
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 六月那个明月之夜，一切沉默的东西都借着气味、色彩、萌芽的冲力和丰盛生机说起话来。四处喧腾呼喊，仿佛挤满合唱的声音。月桂树阴下仍然阴森得像鬼影出没，也像有强盗潜伏。细枝噼啪轻响，暗处不断传来窃窃私语，谈着黑夜，也谈着黑夜可能带来的一切恐怖。
        - id: ch04-b02
          speaker: narrator
          text: 可我们一走进开阔的花园，它就换上一张欢喜的新脸来迎接。白昼的阳光曾经像耙子一样扫遍、搜遍这里，如今陌生的夜色又让它焕然一新。它仍把我们当成贵客，迎进一座号角正为奇异新宴吹响的大厅。这还是原来的草吗？还是那些熟悉的花圃、小路、树丛和一块块草坪吗？至少淹没一切的莹白月光是新的，足以解释全部变化。
        - id: ch04-b03
          speaker: narrator
          text: 这里是月光国，也是十点以后国。我们身在其中，也属于这里。别的居民全明白这一点，它们的舌头终于自由，灵魂也终于醒来。它们彼此回应，彼此理解，也彼此知晓。夏洛特和哈罗德心里装着使命，只顾匆匆赶路，多半没留意这些。我只是个配角，倒有充分的空闲把一切收进心里。那时我还听不懂这片国土的全部语言，也弄不明白它传来的消息。许多年以后，我仍旧记得，而且终于明白了。
        - id: ch04-b04
          speaker: narrator
          text: 最远的树篱下面，井然事物松开的尽头，外界从牧场开始，黑暗又落了下来。那不是拥挤月桂树下蹲伏的浓黑，而是一层暮色，从高高榆树张开的宽阔手臂间垂下。小坟墓在灰暗中显得更暗。我在那里追上他们，恰好看见罗莎直挺挺躺进去。月光让她樱桃般的脸颊变得苍白，可勇敢的微笑仍像往常一样得意而无畏。坟墓很小，也很浅，里面容纳的东西却那么多。
        - id: ch04-b05
          speaker: narrator
          text: 罗莎进去以后，波提乏也只得低下始终昂着的粗脖子，温顺地侧身躺倒。那么多日子和不同天气里，他本来一直结实地站着。小象和甲虫也只好各找地方依偎。在这片沉默的土地上，有没有脊椎，有没有红色血液，已经毫无意义，它们彼此平等。坟中的位置仍旧拥挤，只比它们故乡那艘方舟稍微宽松一点。
        - id: ch04-b06
          speaker: narrator
          text: 泥土被一铲铲填回去，又用脚仔细踩实。我很庆幸没有人祷告，也没有人发表演说。整件事自然而正确，不言自明。面对头顶群星和四周花朵组成的观众，它不需要辩解，也不需要解释，更无须别人替它说明其中的意义。如今，我们同它们并未彻底断开，还有一环留在彼此之间。
    - id: ch05
      title: 留在原地的伙伴
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 诺亚方舟载着一船愁容满面的移民，也许已经驶得只剩地平线下的一点船身，最后完全消失了。可有两个乘客错过了船，从此会永远留在我们附近。我们在它们头顶玩耍时，小象会明白，甲虫会听见，还会在灵魂里重新爬过那块再熟悉不过的地板。
        - id: ch05-b02
          speaker: narrator
          text: 花斑马会驰过遥远平原，在异乡马厩里想念故乡。波提乏再也不能在斗牛节目开场时刨蹄登场，却逃过了城里陌生人的粗暴对待。那些没见识的人很可能把他错认成母牛。老杰里和埃斯梅拉达或许会被带到天涯海角，在谁也猜不到的角落，慢慢或飞快地掉光四肢，漏尽身体里的填料。
        - id: ch05-b03
          speaker: narrator
          text: 可罗莎的书已经合上。等待她的最坏命运，不过是在泥土里自然朽坏。就在伸手可及、出声能听见的地方，尽是她初次睁眼以来便认识的面孔和物件。从第一次看见这个世界起，她身边始终是这些老朋友。它们从未把她当过陌生人。
        - id: ch05-b04
          speaker: narrator
          text: 我们转身离开时，纠缠在榆树枝间的月中人忽然同我对视。那一刻，他显得从未有过的亲切。显然，他会替我们照看它们。反正他总在那里，或圆或缺，费不了一点事。他还会告诉它们，上面的日子仍怎样向前走，家里的一切如今过得怎样。要是它们偶尔觉得沉闷，他就添上一两个自己的故事，陪它们消磨夜晚。
        - id: ch05-b05
          speaker: narrator
          text: 知道原地还留着一个人，告别和离开便容易了一些。况且，他是个很好的伙伴，快活，体贴，满肚子讲不完的故事。要照看坟里的老朋友，再没有谁比他更合适。我们对月中人完全信得过。
