audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 机智而从容，带着温和的回望
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    harold:
      display_name: 哈罗德
      tts:
        delivery: 天真直率，疑惑时仍彬彬有礼
        timbre: 稚嫩清脆
        pace: 轻快
        pitch: 高
    adult:
      display_name: 大人
      tts:
        delivery: 随意自然，对自己的话漫不经心
        timbre: 平和清晰
        pace: 中等
        pitch: 中等
    funny_man:
      display_name: 有趣的人
      tts:
        delivery: 一本正经又暗含幽默，待孩子真诚专注
        timbre: 低沉温厚
        pace: 从容
        pitch: 中低
  chapters:
    - id: ch01
      title: 落空的马戏
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 大人说话真该小心些。他们彼此答应一件事，转眼又不算数，或许不觉得有什么。生活像一只五彩的橡皮球，随便往哪边踢，翻出来总还有鲜亮的新颜色。失望了，开个玩笑，笑一笑，手边马上又有别的快乐。可孩子的小小世界全由他们摆布。大人随口一句话，孩子已经忙着盖起尖塔高耸的梦中宫殿了，这时候，怎么能说了不算呢？
        - id: ch01-b02
          speaker: narrator
          text: 这一次，说的是马戏。并不是我们先提的，全怪那张当地报纸，是它让大人开了口。
        - id: ch01-b03
          speaker: adult
          text: 什么，有马戏团！带孩子们去看倒不错。星期三正合适，就星期三去吧。对了，如今又时兴打褶，还要缀上一排排宽花边。
        - id: ch01-b04
          speaker: narrator
          text: 后面的话，我一句也没听进去。别人怎么想，我也不知道。只觉得房子快撑破了，四面墙挤得人透不过气，连屋顶都在一跳一跳，仿佛要掀开。我非得逃到外面去，甩开砖墙瓦顶，独自在没人的天地间走一走，才能好好承受这份又狂热、又叫人发晕的盼望。
        - id: ch01-b05
          speaker: narrator
          text: 那天的大自然却规规矩矩，一点也看不出地球正绕着自己的马戏圆环飞转。可我满脑子都是听来的奇闻。长尾巴的小马真能用后腿走路，还会开枪吗？小丑真能演出史书上那些迷人的把戏吗？那些美得不像凡人的女子，真会从乳白色的阿拉伯骏马上腾空，穿过纸环吗？这实在不大可能，传说一定有些夸张。不过，我并不贪心，只要给我看见其中极小的一部分，就远远超过我的愿望，足够让我心满意足了。
        - id: ch01-b06
          speaker: narrator
          text: 可这么好的事，真会落到我身上吗？我真能亲眼看见，还能承受住那份狂喜吗？不会的，准要出岔子。我们当中也许有人会得麻疹，也许整个世界会轰的一声炸掉。我不能抱希望，连一点点都不敢，必须逼自己想些别的。
        - id: ch01-b07
          speaker: narrator
          text: 当然，白天黑夜，我想的、梦的还是只有马戏。醒着时，我挽着小丑，伴着乐队威风的曲子，把长鞭甩得啪啪响。睡着以后，我骑着乌黑的骏马，追一位浑身薄纱亮片的公主。她始终只领先一马身，可我怎么也赶不上。每天清早，我和哈罗德刚睁开眼，就互相盘问马戏传闻究竟有几分是真的。等头一个女仆起床时，我们早把知道的故事全谈完了。就这样，我们越来越靠近那个有望成为一生中最灿烂的日子。大人真该多加小心。
        - id: ch01-b08
          speaker: narrator
          text: 其实我早就告诉过自己，这事绝不可能成真。那幅美景太甜美，太空灵，根本落不到现实里。可希望破灭时，我还是痛得恶心，像身体真的受了伤。走进早餐室，竟没看见大家甩鞭子、跳椅子、高声呼喊，预演下午的盛事，我便觉得又反常，又不祥。
        - id: ch01-b09
          speaker: narrator
          text: 接着，我听见了“花园会”，又听见“我的淡紫薄纱裙”。这两样说的偏偏都是当天下午。事情一下变得惨白可怕。我坐在那里，一句话也不说。每听一分钟，心便往下沉一截，像钟里的铅锤，直坠到靴底。
        - id: ch01-b10
          speaker: narrator
          text: 我从没想过直接追问，更别说责怪他们。早先最盼望的时候，我也不敢当着他们谈马戏，生怕说破了法术。哈罗德可不一样。他一听明白那些话，也听见希望的丧钟，立刻放声哀号，活像失去了至亲。整间屋子都塞满了他的叫声。
        - id: ch01-b11
          speaker: harold
          text: 马戏！马戏！我要去看马戏！
          emotion: sad
        - id: ch01-b12
          speaker: narrator
          text: 窗玻璃跟着发颤，墙壁也嘲弄似的把“马戏”一声声送回来。他要马戏，要完整的马戏，除此之外什么也不要。折中不行，托辞不行，将来才兑现、既没担保又靠不住的空头许诺也不行。他已经在“期望银行”开出支票，非要当场兑付。否则他就一直叫，叫到抽搐，缓过来再接着叫。叫喊就是他的职业、艺术、使命和终身事业。他既有才干，又有决心，根本不打算退休。
        - id: ch01-b13
          speaker: narrator
          text: 世上嗓门大的人，就算不能次次靠喊叫当上皇帝，至少总有人理会。别的东西卖不出高价也罢，“安静”这一样，旁人非得花任何代价从他们手里买回来。于是，那些命里注定要应付孩子的大人，用尽真假难辨的说法和各种卑劣手段去哄哈罗德。
        - id: ch01-b14
          speaker: narrator
          text: 我不理会那些空洞的安慰。他们许诺得再大方，信用也早已破产。我只是等着，直到那句熟得不能再熟的话，宣布希望彻底死去。
        - id: ch01-b15
          speaker: adult
          text: 改天吧，乖孩子！
        - id: ch01-b16
          speaker: narrator
          text: 我一声不响地离开了房间。那些迟钝的人居然还以为，这句陈旧得磨破了的话真有用。若还有什么能让事情变得更糟，那就是听见它。
        - id: ch01-b17
          speaker: narrator
          text: 我照例凭本能去找大自然，离开人走的路，躲进一道亲切的树篱下，独自熬过无人看见的黑暗时刻。世界不再是圆球，太空里也没有一颗颗飞转着举办马戏的星球。古老的说法又站起来，宣告自己才是真理。大地重新变平，沟渠纵横，停滞不动，死气沉沉。笔直的白路往前爬，榆树沿着僵硬的篱笆站成一线。整个自然不再绕着中心旋转，只剩一道道平线，瘫向遥远的边缘。我真想一直走到那里，再悄悄掉下去。
        - id: ch01-b18
          speaker: narrator
          text: 我阴沉地坐着，一截接一截地嚼小树枝，忽然想起从前在报纸上费力拼读过的几则广告。那些伟大而幸福的人拥有吨位四位数的大船，却还要公开恳求年轻人前去相助，给他们当学徒。我不知道学徒究竟做什么，也不知道自己够不够大，算不算年轻人。但有一点很清楚，不管中间要吃多少苦，只要走上这条路，我终究能看遍全世界的马戏。欢乐法国、绚丽西班牙，还有荷兰、波希米亚、中国、秘鲁，哪里的马戏都去看。这计划值得从头到尾仔细盘算。眼下的日子已经忍无可忍，我非尽快做点什么不可。
    - id: ch02
      title: 鲜血与橙子
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 中午和吃饭的时候都阴沉沉的。后来出了一点小乱子，才把空气里的电放掉一些。哈罗德遇到失望，从不久久发愁。他只需猛烈发作一次，在一分钟里化回空气和水，变成眼泪和叫声，让受辱的大自然收回赔偿。随后，他便用笑容把脸熨平，接受事情的新模样。
        - id: ch02-b02
          speaker: narrator
          text: 神明若会感激凡人，一定是因为有些凡人记性短。奥林匹斯众神一直赏识哈罗德这项美德，毕竟他们正靠它保住自己。这一回，谢礼是一只又大又饱满的橙子，皮也像那个年代的橙子一样厚。哈罗德先在橙子的肩头咬个洞，塞进一块糖，再慢慢摆弄，直到整只橙子的肉体和灵魂都穿过糖块，进了他的肚子。
        - id: ch02-b03
          speaker: narrator
          text: 等他装满橙汁和坏主意，便想出一条毒计。他把空橙皮又拍又捏，恢复原样，接着灌满清水，在洞口塞上一块新糖。那时我正坐在门口发愁，想着热带天空下陌生而狂野的马戏。他走过来，满脸和气地把橙子递给我。
        - id: ch02-b04
          speaker: narrator
          text: 平常，这种老把戏骗不了我。可坏心情搅乱了判断，而我又太需要安慰，根本没细看安慰从哪里来。我伸手抓住那枚金黄的骗局，它一下瘪了，清水直喷进眼睛，泼满衣领，再顺着脖子流下去，连身上最低处也湿透了。
        - id: ch02-b05
          speaker: narrator
          text: 转眼间，我已把哈罗德按倒在地，使出全身力气，要把他的脑袋碾进碎石里。他明白事情已经审结，再也没有讨论和辩解的余地，便严肃地集中全部力量，专门踢我的肚子。
        - id: ch02-b06
          speaker: narrator
          text: 可有些人就是不肯让事情安静地发展下去。“他们”当中有一个猛冲过来，把尖利而不合情理的责骂劈头浇在我俩身上。她骂我欺负弟弟，明明受伤上当的是我；又骂哈罗德袭击一只干净衣领，仿佛那是什么了不得的大罪。其实不久以前，我早在绝望的坏脾气里亲手弄脏、糟蹋了那只衣领。我俩又厌恶又不服，各自逃向一边，后来却在菜园里重新会合。短短的仇怨已经忘得一干二净。
        - id: ch02-b07
          speaker: harold
          text: 我真想当个穴居人，就像乔治叔叔讲的那种。拿一把燧石斧头，什么衣服也不穿，住在洞里，谁也不认识！
        - id: ch02-b08
          speaker: narrator
          text: 我马上领会了这个念头的好处。我说，要是有不喜欢的人来看我们，我们就拿斧头砍他的脑袋，一直砍到他倒下死掉。
        - id: ch02-b09
          speaker: harold
          text: 然后，我们把他拖进洞里，剥掉他的皮！
        - id: ch02-b10
          speaker: narrator
          text: 我俩安静了一会儿，尽情欣赏想象出的美妙场面。当时真正需要的就是鲜血。我们不要奢侈品，也不要任何昂贵难找、要从远方运来的东西，只要普普通通的鲜血，别的一概不要，而且要多多的。
        - id: ch02-b11
          speaker: narrator
          text: 可惜哪里都找不到鲜血。时代已经脱了节，我们又生得太晚。于是，我俩跑去温室，钻到下面的暖气装置里，扮演穴居人那种黑暗、肮脏、无人管束的生活，直到彻底玩腻。随后重新钻回有历史的年代，跑到路上，想找一样有知觉的活物拿石头砸。
        - id: ch02-b12
          speaker: narrator
          text: 大自然平常是个快活的盟友，有时却会闹脾气，不肯陪人玩。她把消息传给手下，那些披毛戴羽的小居民得到暗示，便沿着僻静的小路悄悄溜回家。我们四处侦察、潜伏、匍匐前进、设下埋伏，全都没有用。灌木丛里那个小小的社会，平时总有东西奔跑、蹦跳、振翅飞过，那天却像全有别的约会，谁也不肯露面。
        - id: ch02-b13
          speaker: narrator
          text: 我俩同时冒出一个可怕的念头，它们也许都去看马戏了。于是，我们缩着身子坐上篱笆，心里越发难受。连越来越近的车轮声也没引起兴趣。一个人既然只想拿石头砸东西，人类就显得十分碍事，最好别来。忽然，我俩同时跳下篱笆，脸也亮了。耳朵早受过训练，那声音只会来自一辆双轮马车，而车上准是“有趣的人”。
    - id: ch03
      title: 有趣的人的好主意
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 我们叫他“有趣的人”，是因为他忧郁、严肃，话也很少。他会一直望进我们的灵魂，让我们说出心里真正惦记的事，再想出一个亮堂堂的好主意，把所有乌云扫掉。然后，他真的会跟我们出发，专心把那件事从头玩到尾，其他事情一概放下。
        - id: ch03-b02
          speaker: narrator
          text: 他跟别的大人不一样。那些人总觉得，逗孩子时非演一场难受的滑稽戏不可。他们费力挤出笑话，又笨拙地扭动身子，还暗自得意，以为自己才是真正有趣的人。我们却只能坐着忍受完整场表演，完了还得拍手，当然比他们更清楚谁才有趣。其实，我们心里的意思是，他是理想中的人，其他人只是现实里的人，不过当时还不会这样说。
        - id: ch03-b03
          speaker: narrator
          text: 他看见我们，便让马放慢脚步。双轮马车缓缓爬到面前，恰好停在对面。他支着下巴，久久而深情地望着我俩，始终不开口。我们在尘土里蹦上蹦下，羞怯地咧嘴笑，心里却充满期待。这个人下一刻会说什么、做什么，从来没人猜得到。
        - id: ch03-b04
          speaker: funny_man
          text: 你们看上去很无聊，无聊透顶。要不然，让我想想，你们没有结婚吧？
        - id: ch03-b05
          speaker: narrator
          text: 他问得又忧伤又认真，我俩赶紧保证自己绝没结婚。不过大家相识这么久，他本该知道才对。
        - id: ch03-b06
          speaker: funny_man
          text: 那就只是无聊，是吃饱喝足以后厌倦了人世。既然你们保证没结婚，就爬上车来吧，我带你们出去兜风。我也无聊，正想做一件阴暗、可怕又刺激的事。
        - id: ch03-b07
          speaker: narrator
          text: 我们当然立刻爬上车，欢喜得直叫，还把他的脚踩了个遍。马车刚一动，哈罗德便气势汹汹地问他要去哪里。
        - id: ch03-b08
          speaker: funny_man
          text: 我太太命令我去找副牧师，把他带回家喝茶。你们觉得，这件事够刺激吗？
        - id: ch03-b09
          speaker: narrator
          text: 我俩的脸立刻垮了。当时那位副牧师实在很失败，不管从哪个意思说，他都不是有趣的人。
        - id: ch03-b10
          speaker: funny_man
          text: 不过，我不打算去。接下来，我还该在某间农舍停下，问一件什么事。是什么来着？我敢肯定，里头牵扯到荨麻疹。算了，我忘了，反正也不重要。听着，我们是三个什么都敢干的亡命少年。不如去看马戏吧？
          emotion: happy
        - id: ch03-b11
          speaker: narrator
          text: 有些最了不得的时刻，根本写不进文字。很会写的人，也许能把情感的颜色和暗流慢慢说清。可是那份感受本身呢？它又强又活，忽然从心底跳起来，越胀越大，堵住喉咙。惊喜像一泼冷水迎面而来，叫人喘不过气，头也发晕。谁能把它描出来，还能活命？
        - id: ch03-b12
          speaker: narrator
          text: 我只知道，那一刻要我当场为“有趣的人”死掉，我也心甘情愿。我甚至盼着红印第安人从树篱后跳出来，袭击马车，好让他看看我会怎样保护他。可胸中翻腾着这么多东西，我却连一个小小的字也说不出来。
        - id: ch03-b13
          speaker: narrator
          text: 哈罗德就没有这么沉默。他扬起尖细的嗓子，郑重地唱起宇宙间伟大的马戏之歌，赞美圆环永不消失的荣光。他仿佛唱到了它怎样诞生，又怎样被宇宙的力量塑造，怎样同群星的秩序彼此和谐。他还歌唱马匹的力量、速度和温驯，歌唱小丑，歌唱恶作剧的荣耀，歌唱那个永远流传的形象。
        - id: ch03-b14
          speaker: narrator
          text: 最后，他唱到圆环上的女子。她完美无缺，周身每一道优美的曲线都自由舒展，是大地最崇高的造物，也是时代最尊贵的化身。至少，听起来他无疑唱了这些，或许还唱得更多。可真正能分辨出来的，始终只有一句。
        - id: ch03-b15
          speaker: harold
          text: 我们要去看马戏啦！我们要去看马戏啦！
          emotion: happy
        - id: ch03-b16
          speaker: narrator
          text: 这句甜美又有节奏的话，他唱了一遍又一遍。不过我也说不准，因为耳中一切都朦朦胧胧，像在梦里。老母马肩上长出火焰的翅膀，载着我们穿过紫色云层。大地和车轮的辘辘声，早已远远落在下方。
    - id: ch04
      title: 圆环上的女子
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 等我回过神来，自己竟已经真真切切地坐在马戏场中。中间究竟经过了哪些路、做过哪些事，我几乎全不记得，梦和晕眩还留在脑中。我第一次闻见那股醉人的马戏气味。只要这副泥土做的身体还在，我就永远不会忘记。四周嗡嗡作响，闪光与薄雾交织。空白、神秘的场地上，巨大的悬念沉沉压着。我们的期待已经绷到极点，却不知道第一场惊喜会从哪里来，又会以什么神圣的模样出现。
        - id: ch04-b02
          speaker: narrator
          text: 看不见的马蹄先咚咚响起，叫我们浑身一颤。接着铜钹轰然撞响，铃声铿锵，喝彩粗哑得像雷。科拉莉一下旋进场中，在天地之间飞驰。一会儿，她挺身站起，脸颊绯红，光彩照人；一会儿又俯向飞扬的马鬃。乐队奏着令人发狂的舞曲，仿佛正把她抛起、摆弄，再塑成千百种姿态。
        - id: ch04-b03
          speaker: narrator
          text: 穿长礼服的伯爵甩响巨鞭，像一声声手枪，为音乐打着拍子。他的战吼越过乐队，清清楚楚地传来，激得人热血沸腾，恨不得马上做出辉煌大事。科拉莉一面欢笑，一面得意地撞破纸环。我俩死死抓着面前的红布，灵魂却跟她一圈圈飞转。她腾跃，我们也腾跃；她俯身，我们也俯身；她抓着马鬃或马尾飞荡，我们也跟着飞荡，仿佛肉身还坐在原处，整个人却早已被她带进圆环。
        - id: ch04-b04
          speaker: narrator
          text: 叫人着迷的，不只是她那些使人神魂颠倒的惊险绝技，也不只是那匹仙种般的乳白骏马。它长尾飘扬，蹄子像狍。世上若真有中了魔法的王子，那匹马一定就是。可真正使我们屏住呼吸、动也不敢动的，是科拉莉超过凡人的美，而且她以我们从没见过的模样展现出来。哪位公主的手臂能白得这样耀眼？哪位公主穿过如此精巧的粉红衣裙，还缀满闪亮的亮片？
        - id: ch04-b05
          speaker: narrator
          text: 我们从前见过的女人，总是灰扑扑的，身形像沙漏，腿几乎看不见。这里鼓起一团，那里紧紧束住，行动慢吞吞，还总劝别人别让四肢太有活力。眼前的科拉莉却是一个全新的启示。从此，我们必须修改自己的想象，让它赶上时代。
        - id: ch04-b06
          speaker: narrator
          text: 人在万分激动时，思绪会猛地冲出去。那一刻，我看见自己同科拉莉紧紧相拥，并肩走遍世界。我们越过山岭和平原，穿过古老的城市，也经过一排排鼓掌的亲戚。我穿着星期日的灯笼裤，她仍穿着粉红衣裙，浑身亮片。
        - id: ch04-b07
          speaker: narrator
          text: 夏日会衰败，花朵会凋零，所有美都会绕场一周，再从门口离去。终于，科拉莉也要退场了。她侧身立在马背上，轻轻喘息，身子像一朵郁金香随风摇晃。消失以前，她向这边弯腰，又向那边致意。我的心、我的灵魂，还有场中所有光明、荣耀和叫人销魂的魅力，全都跟她走了。
        - id: ch04-b08
          speaker: narrator
          text: 哈罗德猛吸一口气，像从梦里醒来。
        - id: ch04-b09
          speaker: harold
          text: 她是不是美极了？
        - id: ch04-b10
          speaker: narrator
          text: 他的声音竟然低低的，全不像平常。我心头忽然一痛。从前在许多冒险里，我们只是友好的对手。可这回要严重得多。难道争斗与冷淡就要开始？难道自家的炉边要爆发内战，旧日情谊也要断裂？随后，我想起真正的情形，不禁很同情哈罗德。命运早已无情地写定，他必须让给我，因为我是哥哥。一个安排合理的宇宙里，规矩总有它的用处。
        - id: ch04-b11
          speaker: narrator
          text: 科拉莉走后，几乎没什么值得等了。我仍迟迟不肯离开，还守在原处，只盼她也许会再次回到圆环上，让我再看她一眼。下一刻，小丑绊了一跤，用无比高明的技巧摔得四脚朝天。新的情感立刻在胸中活动起来。爱情那短短的一刻过去了，严肃的雄心昂起了头。
        - id: ch04-b12
          speaker: narrator
          text: 要是我也能成为小丑这样了不起的人物！他沉着自信，出口成章，又敏捷得难以想象。他敢对抗整个社会，独自同人人作对，却次次都能占上风。他的幽默那么新鲜，对女士又如此有礼。对手哪怕穿着长礼服，留着小胡子，也照样被他弄得狼狈不堪，败得无话可说。再看他双腿叉开的架势，多威风，多有自信！
        - id: ch04-b13
          speaker: narrator
          text: 人若能这样本领齐全、光彩堂皇地走过一生，还会向往什么更好的事业？成功是他的主调，机敏是护住全身的铠甲，而圆润的笑声当场就是奖赏。连科拉莉的身影也晃了晃，渐渐退远。当然，晚上我仍会回到她身边，这一点毫无疑问。可是白天所有干活的时间，我都要当小丑。
    - id: ch05
      title: 沙漠新娘
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 短短的幕间休息结束了。乐队拖出意味深长的和弦，奏起前曲。节目单上，一行格外高大的字宣告，“沙漠新娘泽菲琳”将献上举世无双的无鞍马术。美貌和机智已经让我十分满足，我几乎不敢再盼新的激动。可这个称号染着浪漫的颜色，而科拉莉也唤起了我对女性的兴趣，连她本人都没能使这份兴趣完全满足。
        - id: ch05-b02
          speaker: narrator
          text: 号角大声吹响，泽菲琳热烈地荡入场中。她一跃而起，挺直站立，两只脚各踏在一匹柔韧奔腾的阿拉伯骏马上。我立刻知道，命运已经决定，我的篇章已经合拢。沙漠新娘才是我唯一的新娘。
        - id: ch05-b03
          speaker: narrator
          text: 她穿着黑衣，幽暗如暮色的薄纱之间，大颗银星闪闪发光。胯下两匹雄壮的马，也跟她的头发一样漆黑。它们像雷鸣一样奔过，卷起风暴、旋风和夹着木屑的热燥沙风。东方太阳吻过她的脸颊，故乡沙漠的风暴仿佛是她的随从，一路追随在身边。
        - id: ch05-b04
          speaker: narrator
          text: 科拉莉又算什么？她的粉红丝衣、金色头发和纤细四肢，怎么能同这位丰美壮丽的克娄巴特拉相比？一眨眼，我已经同泽菲琳和两匹乌黑的骏马奔驰在沙漠上。我们并肩飞驰，追过鸵鸟，越过斑马。一路向前，荒野仿佛开出了玫瑰。
        - id: ch05-b05
          speaker: narrator
          text: 那天傍晚究竟怎样回家，我记不清了。一路上到处都有奇异的存在，幽灵般的马蹄声环绕着我们。鼻端还是辛烈的马戏气味，耳边仍有鞭子的炸响，还有小丑爽朗的笑声。“有趣的人”体贴地不说话，让我们的幻梦安然留下，不用刺耳的批评和分析去碰它。
        - id: ch05-b06
          speaker: narrator
          text: 到了门口，他放下我俩，也没给我机会说出一路费力想好的、却又笨拙的谢辞。那天剩下的时间里，我心神恍惚，沉默不语，只听见乐队的进行曲一直在脑中某个角落演奏。
        - id: ch05-b07
          speaker: narrator
          text: 终于，我的头刚碰到枕头，就立刻回到了泽菲琳身边。我同她脸贴着脸，驰骋在无边的撒哈拉，纵然失去整个世界也毫不可惜。偶尔，在四周翻卷的沙云之间，会闪出科拉莉的双眼。那双眼睛，仿佛带着一丝温柔的责备。
