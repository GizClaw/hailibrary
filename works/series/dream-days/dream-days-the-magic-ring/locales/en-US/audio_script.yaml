audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: reflective, lightly amused, and intimate
        timbre: warm and clear
        pace: measured
        pitch: medium
    harold:
      display_name: Harold
      tts:
        delivery: earnest, lively, and direct
        timbre: bright and boyish
        pace: brisk
        pitch: medium-high
    grown_up:
      display_name: A Grown-Up
      tts:
        delivery: casual, distracted, and matter-of-fact
        timbre: smooth and mature
        pace: conversational
        pitch: medium
    second_grown_up:
      display_name: Another Grown-Up
      tts:
        delivery: breezy, social, and absent-minded
        timbre: light and mature
        pace: conversational
        pitch: medium-high
    funny_man:
      display_name: The Funny Man
      tts:
        delivery: grave, perceptive, and quietly playful
        timbre: mellow and thoughtful
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: A Promise of the Circus
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Grown-ups really ought to be more careful. To them, making a promise and taking it back may seem like a small thing. They have plenty of other pleasures waiting. Life is like a bright rubber ball at their feet. Kick it one way or another, and it still comes bouncing back, blue or yellow or green and always shining. A disappointment can be laughed away, and another amusement soon replaces it. But children build palaces that point to the stars on the strength of a grown-up's most careless word. When your words can move someone else's whole little world, you ought to take care.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The circus was a perfect example. We children had not brought it up. The grown-ups began it after reading the local newspaper.
        - id: ch01-b03
          speakers: [grown_up, second_grown_up]
          ensemble: duo
          text: >-
            A circus! That would be lovely for the children. Wednesday would suit us. Yes, let's go on Wednesday. Oh, and pleats are fashionable again, with rows of deep braid.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Perhaps the others spoke after that. If they did, I understood nothing. The house seemed ready to burst. The walls pressed in and almost choked me, while the roof felt as though it were jumping loose. I had to escape into the open air, shake off every brick and stone, and wander through some lonely corner of the earth. Only there could I properly take in the passion and promise of what I had heard.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Nature looked very proper and settled that day. Nothing suggested that the earth itself was racing around a circus ring. Could all the wonders I had heard about possibly be true? Did long-tailed ponies stand on their hind legs and fire pistols? Could clowns really perform half the marvelous tricks history gave them? And could ladies more beautiful than earthly women truly leap from cream-colored Arabian horses through paper hoops?
        - id: ch01-b06
          speaker: narrator
          text: >-
            Surely some of it had been exaggerated. I did not need the whole legend. The smallest part of it would satisfy me. Give me only a tiny share of all the wonders people claimed for a circus, and I would ask for nothing more. Yet even if the old stories were true for once, could I really be meant to see such things in the flesh? Could I live through that much joy? It was too much to hope for. Something was certain to stop us. One of us would catch measles, or the whole world would explode with a bang. I told myself sternly that I must not hope, and I tried to force my thoughts elsewhere.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Of course, I thought and dreamed of nothing else, by day or by night. Awake, I walked arm in arm with a clown and cracked a mighty whip while brave music poured from the band. Asleep, I rode a coal-black horse after a princess dressed in gauze and spangles. No matter how hard I chased, she always stayed one impossible length ahead. Every early morning, as soon as we were fully awake, Harold and I questioned each other about the great circus traditions. Could this trick be real? Could that marvelous story be trusted? We used up all our knowledge long before the first housemaid stirred. In that fever of happiness, we floated toward Wednesday as though it would be the whitest day of all. And that brings me back to the point. Grown-ups really ought to be more careful.
    - id: ch02
      title: The Promise Breaks
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            I had always known it could not truly happen. I had told myself so a dozen times. The vision was too beautiful ever to become real.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Still, the disappointment hurt like a wound. At breakfast, nobody was cracking whips, jumping over chairs, or shouting in joyful practice for the wild afternoon ahead. That felt like a bad sign. Then I heard the words “garden party” and “my mauve tulle,” and understood that both belonged to that very afternoon. I sat without speaking while my heart sank lower each minute, like a clock weight dropping all the way into my boots.
        - id: ch02-b03
          speaker: narrator
          text: >-
            I never considered asking a direct question, much less blaming anyone. Even while I had been happy, I had feared that plain talk of the circus in front of the grown-ups might break the spell. So I suffered in silence. Harold was made differently. The moment he understood where their talk was going, he heard the funeral bell of every hope he had. Then he filled the room with the noise of grief.
        - id: ch02-b04
          speaker: harold
          text: “Circus! Circus! I want the circus!”
          emotion: sad
        - id: ch02-b05
          speaker: narrator
          text: >-
            The windows shook and the walls seemed to shout the word back. Harold wanted the whole circus and nothing less. He would accept no bargain and no shaky promise for later. He had drawn a check on the Bank of Expectation, and it had to be paid at once. Otherwise he meant to yell until he fell into a fit, recover, and begin again. Yelling was now his profession, his art, and his life's work. He was well qualified and had no wish to retire.
        - id: ch02-b06
          speaker: narrator
          text: >-
            Noisy people may not always win everything, but they always win attention. Even when nobody will pay their full price, someone will pay for silence. So the grown-ups gathered around Harold and tried every false argument and shabby trick known to people who must manage children. They offered comfort freely because none of it was worth anything. Their promises sounded generous, but they were already bankrupt. I could take no comfort from them. I waited until I heard the hateful old sentence that killed the last of my hope.
        - id: ch02-b07
          speaker: grown_up
          text: “We'll go some other time, dear.”
        - id: ch02-b08
          speaker: narrator
          text: >-
            I left without a word. Somehow that worn-out phrase made everything worse, though the dull grown-ups still believed it could help.
        - id: ch02-b09
          speaker: narrator
          text: >-
            As usual, I went to nature. Beneath a friendly hedge, away from everyone, I passed through my darkest hour unseen. The world was no longer a globe surrounded by circling shows. No great spheres wheeled through space like circuses of their own. All the old and joyless beliefs returned. The earth had gone flat again, cut by ditches, still and deadly flat. Straight white roads crawled between stiff rows of elms and rigid hedges. Nothing curved, spun, or escaped. All of nature stretched in hard lines toward the farthest edge, and I felt like walking all the way to that boundary and quietly dropping off.
        - id: ch02-b10
          speaker: narrator
          text: >-
            While I sat chewing gloomy bits of stick, I remembered some fascinating newspaper notices. Great and happy men owned enormous ships, yet publicly begged young people to join them as apprentices. I did not know exactly what an apprentice was, or whether I was large enough to count as a youth. But it seemed clear that, after whatever hardships came first, this path could take me to every circus in the world. I would see the circuses of merry France and bright Spain, of Holland, Bohemia, China, and Peru. It was a plan worth considering from every side. Something had to end this unbearable state of affairs.
    - id: ch03
      title: Cave-Men and the Funny Man
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Noon and even the midday meal passed gloomily. Then a small disturbance released some of the charge in the air. Harold never brooded over disappointment as I did. Insulted nature demanded one wild burst from him, all tears, noise, and flying breath. After that minute of dissolving into his original elements, he could smooth his face into a smile and fit himself to the new shape of the world.
        - id: ch03-b02
          speaker: narrator
          text: >-
            If the gods ever feel grateful to human beings, it must be when we kindly forget things quickly. Their own safety depends on it. They had rewarded Harold's short memory with a large, thick-skinned orange. In the old-fashioned way, he bit a hole near the top, pushed in a lump of sugar, and patiently worked the fruit. Soon the whole body and soul of the orange had passed through that sugar and into him. Full of juice and wickedness, he planned a trap. He patted and squeezed the empty peel back into its proper shape, filled it with water, put fresh sugar in the hole, and offered it sweetly to me. I was sitting in the doorway, dreaming of strange wild circuses beneath tropical skies.
        - id: ch03-b03
          speaker: narrator
          text: >-
            That old trick would never have fooled me on an ordinary day. Harold had counted on my bad temper. Perhaps he knew I was hungry for comfort and would not examine its source. I grabbed the golden fraud without thinking. It collapsed and shot water into my eyes, over my collar, and down my neck until I was wet underneath everything.
        - id: ch03-b04
          speaker: narrator
          text: >-
            I knocked Harold down at once and put all my strength into grinding his head against the gravel. Harold understood that discussion was over, so he devoted himself to kicking me in the stomach.
        - id: ch03-b05
          speaker: narrator
          text: >-
            Some people cannot let events finish peacefully. At that very moment, one of the grown-ups swept down and poured sharp, foolish scolding over us both. I was accused of mistreating my younger brother, though I was plainly the injured and deceived person. Harold was condemned for the terrible crime of attacking a clean collar. In truth, I had already stained and spoiled that collar myself, earlier in the day, out of pure desperate temper. Neither of us accepted the judgment. Disgusted and defiant, we ran in different directions.
        - id: ch03-b06
          speaker: narrator
          text: >-
            Later we met again in the kitchen garden. Our brief quarrel was forgotten, and we walked along together.
        - id: ch03-b07
          speaker: harold
          text: >-
            I wish I were a cave-man, like the ones Uncle George told us about. I'd have a stone hatchet and no clothes, and I'd live in a cave and know nobody!
        - id: ch03-b08
          speaker: narrator
          text: >-
            I understood the best part of the idea at once. I said that if anyone we disliked came to visit, we would hit him on the head with the hatchet until he fell down dead.
        - id: ch03-b09
          speaker: harold
          text: “Then we'd pull him into the cave and skin him!”
        - id: ch03-b10
          speaker: narrator
          text: >-
            We silently enjoyed the splendid picture we had made. Blood was what we wanted just then. No expensive luxury would do. We wanted plain blood, and plenty of it.
        - id: ch03-b11
          speaker: narrator
          text: >-
            But blood was unavailable. We had been born too late. We went to the greenhouse instead, crawled into the heating space beneath it, and played at the dark, dirty, unrestricted lives of cave-men until we were thoroughly tired of them. Then we returned to historical times and went to the road to find some living creature we could throw stones at.
        - id: ch03-b12
          speaker: narrator
          text: >-
            Nature is often a cheerful friend, but sometimes she sulks and will not play. On such days, she passes word to everyone beneath her. All the small people in fur and feathers understand, and they slip home by quiet back ways. We searched, hid, crept, and set ambushes for nothing. The whole little society of the bushes had disappeared. Every creature that usually ran, hopped, or fluttered seemed to have an appointment elsewhere. Then the same horrible thought struck us both. Perhaps they had all gone to the circus. We climbed onto the fence, hunched ourselves up, and felt miserable together.
        - id: ch03-b13
          speaker: narrator
          text: >-
            Approaching wheels did not interest us at first. When you want to throw stones at something, people only seem to be in the way. Then we both jumped down, suddenly cheerful. Our trained ears knew that rattle could only come from a dog-cart. We were sure it must be the funny man.
        - id: ch03-b14
          speaker: narrator
          text: >-
            We called him that because he was sad and serious. He spoke little, but he looked straight into our souls until we told him exactly what filled our minds. Then he would offer one wonderfully clear suggestion, and every cloud would vanish. Better still, he would come with us at once and play the adventure all the way to its end. He did it earnestly, as though nothing in the world mattered more, and he put every other duty aside. That was why we called him funny. We meant that he was different from the other grown-ups, though we did not yet know the words for the ideal man and the real one. Those others pulled faces, bent themselves into awkward shapes, and dragged out heavy jokes because they believed children required a painful performance. They imagined they were the funny men. We, who had to sit through it and applaud, knew better.
        - id: ch03-b15
          speaker: narrator
          text: >-
            When he saw us, he slowed his horse to a walk. The dog-cart crept forward and stopped opposite the fence. He rested his chin on one hand and studied us for a long time without speaking. We shuffled in the dust, grinning shyly and waiting. You could never guess what this man might say or do.
        - id: ch03-b16
          speaker: funny_man
          text: >-
            You look bored. Completely bored. Unless... let me think. You aren't married, are you?
        - id: ch03-b17
          speaker: narrator
          text: >-
            He asked so seriously that we quickly assured him we were not, though after knowing us so long he should have remembered.
        - id: ch03-b18
          speaker: funny_man
          text: >-
            Then it must be boredom. You've had too much of life and grown tired of the world. Well, if you're certain you aren't married, climb into the cart. I'll take you driving. I'm bored too, and I want to do something dark, dreadful, and exciting.
        - id: ch03-b19
          speaker: narrator
          text: >-
            We scrambled in, barking with delight and stepping all over his toes. As we started, Harold demanded to know where he was going.
        - id: ch03-b20
          speaker: funny_man
          text: >-
            My wife ordered me to fetch the curate for tea. Does that sound exciting enough for you?
        - id: ch03-b21
          speaker: narrator
          text: >-
            Our faces fell. We did not enjoy the present curate. He was no kind of funny man.
        - id: ch03-b22
          speaker: funny_man
          text: >-
            But I'm not going to fetch him. I was also meant to stop at a cottage and ask about something. Nettle rash was part of it, I think. Never mind. I've forgotten, and it doesn't matter. Look here. We're three desperate fellows who will stop at nothing. Shall we go to the circus?
          emotion: happy
    - id: ch04
      title: The Magic Ring
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Some moments are too great to describe. Skilled writers can name every shade and current of feeling, and often take many pages to do it. But the feeling itself is different. It is a fierce, living thing that leaps up inside you, grows until it chokes you, and takes your breath like a plunge into cold water. How could anyone put that into words and survive? I only knew I would gladly have died for the funny man, right there and then. I wished red Indians would spring from the hedge and attack the dog-cart, just so I could show him what I was ready to do. Yet with all that devotion blazing inside me, I could not find one little word to say.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Harold was not silent. In a high, solemn chant, he sang the great song of the circus and the eternal glory of the Ring. He seemed to sing of its beginning before time, and how the forces of the universe had shaped it to fit the plan of the stars. He sang of horses, strong, swift, and willing to perform their tricks. He sang of clowns and the glorious mischief that would live forever. Last came the Woman of the Ring, perfect and free in every curving limb, the finest thing the earth and all of time had ever produced. At least, Harold seemed to sing all that and more. The only words anyone could actually understand were these.
        - id: ch04-b03
          speaker: harold
          text: “We're going to the circus! We're going to the circus!”
          emotion: happy
        - id: ch04-b04
          speaker: narrator
          text: >-
            He repeated that sweet rhythm again and again. I heard him dimly, as if in a dream. Wings of fire seemed to rise from the old mare's shoulders. We flew through purple clouds while the earth and the rattle of wheels fell far below.
        - id: ch04-b05
          speaker: narrator
          text: >-
            The dream and dizziness were still with me when, somehow, I found myself inside the circus. I could hardly remember the steps that had brought me there. Then I breathed in the first taste of that thrilling circus smell, a scent which has stayed with me for the rest of my life. A shining mist and a restless hum filled the tent. Light glittered through the haze, while the empty ring waited beneath it, blank and mysterious. Suspense seemed to brood over that open space. Every nerve in us was drawn tight with expectation, and we had no idea from which side, or in what marvelous shape, the first wonder would appear.
        - id: ch04-b06
          speaker: narrator
          text: >-
            First came the thud of hidden hoofs, and all of us trembled. Cymbals crashed, bells rang, and the crowd answered with a rough roar of applause. Then Coralie was among us, spinning through the ring between earth and sky. One moment she stood upright, flushed, glowing, and joyful. The next she crouched beside the flowing mane. The maddening dance music of the band seemed to toss her and shape her every movement. A count in a frock coat cracked his great whip in time, each stroke sharp as a pistol. His clear cry rose above the music and made us long to perform some splendid deed. Coralie only laughed in triumph as she burst through the paper hoops.
        - id: ch04-b07
          speaker: narrator
          text: >-
            We clutched the red cloth in front of us. Our souls raced around and around the ring with Coralie. We leaped when she leaped, lay flat when she did, and felt ourselves swing with her from mane or tail. The delight was not only in those wild feats. Her cream-colored horse looked like a creature of fairy blood, long-tailed and light-footed, surely an enchanted prince if any horse had ever been one. Yet even its magic mattered less than Coralie herself. More than her daring, more than the music and the speed, her beauty held us helpless.
        - id: ch04-b08
          speaker: narrator
          text: >-
            What princess had such dazzling white arms? Who else could wear pink and spangles so lightly? Until then, the women we knew had seemed gray and shaped like hourglasses, bunched out here and squeezed tight there. They appeared to have almost no legs. They moved slowly and were always ready to discourage any energetic use of arms or feet. Coralie was a revelation. Everything we imagined about women would have to be brought up to date. In one swift rush of thought, I saw her and me walking through the whole world together. We crossed hills and plains and passed through famous cities. Rows of relations applauded as we went by. I wore my Sunday knickerbockers, and she wore her pink and spangles.
        - id: ch04-b09
          speaker: narrator
          text: >-
            Summers fade, flowers die, and every beauty must ride around the ring and out through the gate. Coralie passed away too, balanced sideways on her horse and breathing hard. She swayed like a tulip, bowing first to one side and then the other. When she vanished, she carried my heart and soul with her, along with all the light and glory of the circus.
        - id: ch04-b10
          speaker: narrator
          text: >-
            Harold woke from the spell with a gasp.
        - id: ch04-b11
          speaker: harold
          text: “Wasn't she beautiful?”
        - id: ch04-b12
          speaker: narrator
          text: >-
            His voice was unusually quiet. For one painful moment, I wondered if this would end our friendly rivalry and begin a war between us. Then I remembered how the universe was properly arranged. Harold would have to give way because I was older. Rules must have some purpose.
        - id: ch04-b13
          speaker: narrator
          text: >-
            With Coralie gone, there seemed little worth waiting for, though I stayed in hope that she might return. Then the clown tripped and fell flat with magnificent skill, and a fresh set of feelings began to move inside me. Love had enjoyed its brief hour. Now a stern ambition took its place. What a splendid life the clown led! He was complete in himself, quick with words, and more nimble than anyone could imagine. He stood against the whole force of society, his hand raised against everyone else's, and yet he always came out on top.
        - id: ch04-b14
          speaker: narrator
          text: >-
            He treated ladies with perfect courtesy and defeated every rival, even men in frock coats and mustaches. His jokes always felt fresh, and he stood with a grand, confident spread of the legs. Could any career be finer? He went through life splendidly equipped. Success sounded through everything he did. Cleverness was his armor, and the rich music of laughter paid him at once. Coralie's image began to waver and move farther away. I would return to her in the evenings, naturally. But through all the working hours of every day, I would be a clown.
        - id: ch04-b15
          speaker: narrator
          text: >-
            The short interval ended. The band drew out a set of long chords, a beginning filled with some important promise. On the program, letters taller than all their neighbors announced Zephyrine, the Bride of the Desert, in her unequaled bareback performance. I had already received so much beauty and so much wit that I hardly dared expect another great feeling. Still, the name Bride of the Desert carried romance inside it. Coralie had awakened my interest in women, and even Coralie herself had not satisfied that interest completely.
        - id: ch04-b16
          speaker: narrator
          text: >-
            Trumpets called, and Zephyrine swept into the arena. With one bound, she stood with a foot on each of two plunging Arabian horses. At once, I knew my fate was decided. The old chapter was closed. The Bride of the Desert was the only bride for me.
        - id: ch04-b17
          speaker: narrator
          text: >-
            She wore black, and great silver stars shone through the twilight of her gauze. Her hair was as black as the two powerful horses beneath her. They thundered past in a tempest, in a whirlwind of flying tan. The eastern sun had left its kiss upon her cheeks, and the sandstorms of her native desert seemed to sweep behind her. How could Coralie, with her pink silk, golden hair, and slender shape, compare with this magnificent, full-grown Cleopatra?
        - id: ch04-b18
          speaker: narrator
          text: >-
            In an instant, Zephyrine and I were racing across the desert with the two coal-black horses. We galloped side by side, faster than ostriches and farther than zebras. As we passed, the wilderness seemed to bloom like a rose.
    - id: ch05
      title: Home Through a Dream
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            I cannot clearly remember how we reached home that evening. The ordinary steps of the journey have vanished. Strange presences seemed to follow us along the road, and phantom hoofbeats sounded in a circle on every side. The sharp circus smell stayed in my nose. In my ears were the crack of the great whip and the clown's open, honest laugh. The Ring had disappeared behind us, but it had not released us.
        - id: ch05-b02
          speaker: narrator
          text: >-
            The funny man understood. Thoughtfully, he did not talk, question us, criticize anything, or pull our wonderful illusion apart with explanations. He simply left the dream alone. When he set us down at our gate, he slipped away before I could speak. I had been laboring over some clumsy words of thanks, but he gave me no chance to get rid of them.
        - id: ch05-b03
          speaker: narrator
          text: >-
            Through the rest of the evening, I wandered in silence, too distracted to join the ordinary world or attend to anything anyone said. I heard almost nothing around me. The band's marching music went on playing in one corner of my mind, bright and steady and far away.
        - id: ch05-b04
          speaker: narrator
          text: >-
            At last my head touched the pillow. In an instant, I was beside Zephyrine again. Cheek to cheek, we rode across the endless Sahara, glad to lose the whole world behind us. The two black horses carried us onward through the circling sand. Now and then, through those clouds, Coralie's eyes appeared. They seemed to hold a tender reproach.
