audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: reflective, lightly amused, and intimate
        timbre: warm and clear
        pace: measured
        pitch: medium
    selina:
      display_name: Selina
      tts:
        delivery: thoughtful, intense, and increasingly fervent
        timbre: clear and youthful
        pace: deliberate
        pitch: medium
    harold:
      display_name: Harold
      tts:
        delivery: earnest, lively, and direct
        timbre: bright and boyish
        pace: brisk
        pitch: medium-high
  chapters:
    - id: ch01
      title: The Things We Really Knew
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            When it came to ordinary lessons, we children were all about equal. Now and then, one of us would be chosen, for no sensible reason and with no concern for what that child wanted, to struggle with the endings of some foolish language that had been dead for ages. Another might be ordered to practice scales because someone imagined a gift for music, though the gift never appeared. That child would pound the unfeeling piano keys and sprinkle them with tears of boredom or rebellion. But in the subjects meant for boys and girls alike, such as geography, arithmetic, and the dreary deeds of kings and queens, none of us wished to do better than the others. Even a child whose highest dream was cracking a whip in a circus ring was expected to know those things. Whatever gifts we had, we shared a stubborn resolve to dodge our work. It kept us all at one steady level of ignorance, with plenty of disobedience mixed in.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Luckily, there were many healthier subjects that we could choose for ourselves. We would never have called them education. Each of us followed a private path through them and sometimes learned an astonishing amount. Our elders knew so little about these matters that our special knowledge struck them as almost uncanny.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Edward cared about the uniforms, equipment, colors, and mottoes of every regiment in the British Army. He never made a mistake about colored facings. Chevrons, badges, medals, and stars were old friends to him, and he even knew the names of most commanding colonels. He would lie flat on the lawn through the best hours of a sunny day, studying a battered Army List. Birds and animals might call him to come and play, but he never noticed them.
        - id: ch01-b04
          speaker: narrator
          text: >-
            My own knowledge seemed broader and freer. Dragoons could have marched past in Lincoln green, and riflemen could have worn fur pouches over tartan trousers, without drawing a word from me. But if anyone wanted exact information about the animals of America, I was the person to ask. I knew where and why bison wallowed, how hunters trapped beavers and stalked wild turkeys, how to deal with a grizzly bear, and just how unpleasantly close a constrictor could get. Everything that burrowed, strutted, roared, or wriggled between the Atlantic and Pacific belonged to my field.
        - id: ch01-b05
          speaker: narrator
          text: >-
            The others respected my authority. If a bear-hunting book entered the house, everyone might tremble with excitement, but I had to decide whether the tracks had been described and followed correctly before the story earned our full approval. A famous writer's trappers and lifelike forests meant nothing to me if he mixed his pemmican wrongly. I condemned the whole achievement, and that was the end of it.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Harold was not quite old enough to have a chosen subject of his own. He did have instincts. When we hunted birds' nests, those instincts nearly became prophecy. The rest of us might suspect eggs, wonder about eggs, or suggest rather doubtfully that eggs could be somewhere nearby. Harold went straight to the right bush, branch, or hole, as though he carried a magic rod. Still, that was a natural gift, and gifts did not count as subjects. It could not rank beside Edward's hard-won knowledge of uniforms or my learning about prairie dogs, gathered through painful study and wide travel in the golden worlds of the Army List and the adventure stories of Ballantyne.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Selina's subject, for reasons no one could explain, was naval history. There are no rules about such subjects. You do not really possess them. They possess you, and hardly anyone can trace how the first tiny beginning took hold. Selina had never once seen the sea. Then again, I had never set foot in America, though I knew its hidden paths so well. If I had suddenly been dropped in the Rocky Mountains, I felt sure I would have known exactly what to do. In the same way, if a genie had set Selina down at Portsmouth Harbor, she could have taught most people there a thing or two.
        - id: ch01-b08
          speaker: narrator
          text: >-
            From Blake's time to Nelson's death, and never one day later, Selina took part in spirit in every great and notable battle of the British Navy. Even during the dark years, when she had to gather her skirts and flee from De Ruyter or Van Tromp, she stayed cheerful. She knew the glorious days were coming, when she would happily batter the fleets of the world.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Once that golden age arrived, she was very busy indeed. She loved to stand where the splinters flew thickest, but she also studied seamanship and battle movements with care. She knew the order in which the great ships entered a fight, which enemy each one faced, when each dropped anchor, and which had a spring on its cable. She did not know what that last phrase meant, but she made sure to remember it. Whenever possible, she entered battle on the quarterdeck of the brave ship that held its fire longest.
    - id: ch02
      title: Trafalgar Day
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Sadly, I was away when Selina's strange passion seized her. I had been sent on a hateful visit to an aunt, so my account can only be a weak thing pieced together from what others told me. I never stopped regretting that absence. With a lasting sense of injury, I entered it against the aunt's name. The whole affair was splendidly useless, and that was exactly what delighted the artist in me.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Best of all, it happened to Selina. She had lately begun subscribing regularly to the Young Ladies' Journal, and she let herself be taken to unfamiliar tea parties with a resignation that was plainly put on. Her outburst was a special joy to me. It reminded me that the dreadful good behavior creeping over us might be no more than a thin outer coating. Edward was away too, being beaten into shape at school. He lost nothing by missing it. With his stern and practical nature, he would only have said, as he often did, that he could not see any sense in the business.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Harold was luckier. The gods had always been especially kind to him. He was allowed not only to witness the ceremony, but to feed its sacred fire. The dull grown-ups in temporary command made him pay for it afterward. Even so, I am sure he always carried a little of the bright happiness of an altar boy who has been given the great honor of swinging incense at Mass.
        - id: ch02-b04
          speaker: narrator
          text: >-
            October and the year were both growing old. In the woods and hedges, everything gently hinted that its course was nearly done. That still afternoon, the whole countryside seemed to breathe like a runner close to the finish. Selina wandered through the garden and into the pasture, lost in her thoughts. She lay down on a small rise. From there, she could see the garden on one side and the downs and the old coach road on the other.
        - id: ch02-b05
          speaker: narrator
          text: >-
            Before long, Harold hurried up, breathless and bursting with his latest grievance.
        - id: ch02-b06
          speaker: harold
          text: >-
            I asked him not to do it. I said, “Please wait just a little. Edward will be home soon. Waiting won't hurt you, the pig won't mind, Edward will be pleased, and everyone will be happy.” But he said he was very sorry, only bacon wouldn't wait for anybody. So I called him a perfect beast and came away. And I think they're doing it now!
          emotion: sad
        - id: ch02-b07
          speaker: selina
          text: “Yes, he is a beast.”
        - id: ch02-b08
          speaker: narrator
          text: >-
            Selina answered without much attention. She had forgotten all about the killing of the pig. Harold kicked apart a newly raised molehill and poked his stick into the hole. Then a long, sorrowful sound floated from Farmer Larkin's land. It was a thin cry for mercy. The brave spirit of a black Berkshire pig was already traveling the stony road to Hades.
        - id: ch02-b09
          speaker: selina
          text: “Do you know what day this is?”
        - id: ch02-b10
          speaker: narrator
          text: >-
            Selina spoke quietly and stared far into the distance. Harold neither knew nor seemed to care. He had opened a whole yard of the mole's tunnel and was digging at it with complete attention.
        - id: ch02-b11
          speaker: selina
          text: “It's Trafalgar Day. Trafalgar Day, and nobody cares!”
          emotion: sad
        - id: ch02-b12
          speaker: narrator
          text: >-
            Her voice told Harold that his behavior was somehow improper, though he could not tell why. He gave up his hunt and sat in a more polite attitude.
        - id: ch02-b13
          speaker: selina
          text: >-
            Coaches used to travel along that road over there. Uncle Thomas told me. People watched for them so they could tell the time, and perhaps collect their parcels. Then, one morning, nobody would expect anything unusual. First there would be the ordinary cloud of dust. Then the coach would race past, and everyone would know. It would be covered in laurel from end to end. The coachman would wear laurel, and the guard would wear it too. Then they would know. They would know!
        - id: ch02-b14
          speaker: narrator
          text: >-
            Harold listened with respectful silence. He would much rather have chased the mole, which must already have traveled a mile if it had any sense. But Harold had the natural instincts of a gentleman. A gentleman's chief mark, perhaps his complete definition, is that he never lets anyone see that he is bored.
        - id: ch02-b15
          speaker: narrator
          text: >-
            Selina stood and paced the grass like an officer walking a short quarterdeck. She could not keep still.
        - id: ch02-b16
          speaker: selina
          text: “Why can't we do something? He did everything. Why can't we do anything for him?”
          emotion: angry
        - id: ch02-b17
          speaker: harold
          text: “Who did everything?”
        - id: ch02-b18
          speaker: narrator
          text: >-
            Harold asked meekly. There was no use thinking about the mole any longer. Like the dead, it traveled fast.
        - id: ch02-b19
          speaker: selina
          text: “Nelson, of course.”
        - id: ch02-b20
          speaker: narrator
          text: >-
            She spoke sharply and kept searching the countryside for some help or suggestion.
        - id: ch02-b21
          speaker: harold
          text: “But he's dead, isn't he?”
        - id: ch02-b22
          speaker: selina
          text: “What has that got to do with it?”
          emotion: angry
        - id: ch02-b23
          speaker: narrator
          text: >-
            Harold was startled. The pig's last cry had faded into silence, and he had thought that matter was finished. Whatever fun the holidays might bring Edward, that particular pig would contribute no more. Now Selina seemed to say that death did not really change the situation. Harold would have to reconsider his ideas.
        - id: ch02-b24
          speaker: narrator
          text: >-
            He sat upright and looked toward the garden for assistance. At that moment, a thin column of smoke rose into the quiet air. The gardener had spent the afternoon sweeping, and now he was burning the autumn leaves. Without knowing it, he had become a priest making an offering to the calm goddess of changing colors and coming cold.
        - id: ch02-b25
          speaker: narrator
          text: >-
            Harold sprang up and ran. Nelson vanished from his mind, along with the pig, the mole, Farmer Larkin's betrayal, and Selina's strange guilty fever. Here was real fire to play with. That was even better than splashing in water or reshaping soft earth. Of all the toys the world offers sensible people, the four elements are easily the finest.
    - id: ch03
      title: The Tribute
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Selina stayed where she was, resting her chin on her fists. As she watched the smoke, her thoughts whirled and drifted with it in curls and little currents. Dusk came quickly across the garden on that short October day. Small red flames leaped through the smoke and vanished. Now Harold appeared, staggering under an armful of leaves. Then he disappeared again as he bent to feed the fire.
        - id: ch03-b02
          speaker: narrator
          text: >-
            But Selina's inward eye saw another kind of smoke. It lay in heavy banks around the masts and hulls of fighting ships. Beneath it came the boom of guns, the crash and tear of splintering wood, the cry of the boarding party, and the choking breath of a gunner stretched beside his cannon. At last, the smoke tore open like a dark funeral curtain. Through it, she saw the shining spirit of the Victor, crowned by a perfect death, spring upward with complete confidence into the air the immortals breathe.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Evening had nearly become night when Selina rose and walked slowly toward the beckoning fire. There was something of a priestess in her step, and something of a worshipper in the purpose of her eyes.
        - id: ch03-b04
          speaker: narrator
          text: >-
            The leaves were burning well now. Harold had just thrown on an old gorse bush, and it blazed and crackled splendidly.
        - id: ch03-b05
          speaker: selina
          text: >-
            Go and get more sticks. Bring shavings, chunks of wood, anything you can find. There's a pile of old pea sticks in the kitchen garden. Carry as many as you can, then go back for another load!
        - id: ch03-b06
          speaker: harold
          text: “But, Selina, those pea sticks belong to the gardener!”
          emotion: surprised
        - id: ch03-b07
          speaker: narrator
          text: >-
            Harold stared at her. She hardly seemed like his sister. He pictured the gardener raging over the loss of his pea sticks and promising revenge.
        - id: ch03-b08
          speaker: selina
          text: “Go and bring them now!”
          emotion: angry
        - id: ch03-b09
          speaker: narrator
          text: >-
            Selina stamped with impatience. Harold ran at once, obedient to the strict discipline in which he had been raised. His eyes were round as the letter O, and he talked rapidly to himself as he went, plainly confused by it all.
        - id: ch03-b10
          speaker: narrator
          text: >-
            The pea sticks burned wonderfully. The fire stopped smoldering and sprang high enough to look like a true bonfire. At first Harold watched in awed silence. Soon he was jumping around it and shouting in triumph. Selina stood with a grim face and a frown. Even this did not satisfy her.
        - id: ch03-b11
          speaker: selina
          text: >-
            Can't you find more wood? Search everywhere. Take old baskets and matting from the tool shed. Break up that old cucumber frame Edward pushed you into when we were playing scouts and Mohicans. Wait! Hooray, I have it. Come with me.
          emotion: happy
        - id: ch03-b12
          speaker: narrator
          text: >-
            Close by stood a greenhouse, Aunt Eliza's special pride. Even the stern gardener approved of it. The fuel that heated it was stored in an attached shed. We had been strictly forbidden to touch so much as one stick, but Selina marched straight toward that sacred supply. Harold followed obediently. After stealing the pea sticks, he was ready for any crime, though he pinched himself to make sure he was awake.
        - id: ch03-b13
          speaker: selina
          text: “You take the coal. Here's a basket. I'll see to the bundles of wood.”
        - id: ch03-b14
          speaker: narrator
          text: >-
            Within minutes, no one could mistake their fire for a feeble little heap of leaves. It was a real bonfire. Selina had become a wild follower of an ancient god. Her hat was gone, her hair flew loose, and every trace of the proper young lady had burned away. She strode around the pile she had built from stolen fuel, or stabbed at it with a pea stick.
        - id: ch03-b15
          speaker: selina
          text: “I knew there must be something we could do. It isn't much, but it is something!”
          emotion: happy
    - id: ch04
      title: The Stars Understand
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            The gardener had gone home for tea. Aunt Eliza had driven a long way to take hers elsewhere, and she was not expected home until late. No window looked over this far end of the garden. So the Tribute burned brightly, with no one to stop it.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Far-off villagers saw the glow and muttered that those young devils must be at their tricks again. Then they continued toward their beer. Not one remembered the date. Not one thought of Nelson, who had kept their honest beer in pint pots bought with honest pennies, and saved them from liters and decimal money.
        - id: ch04-b03
          speaker: narrator
          text: >-
            Nearby, frightened rabbits popped into sight, then vanished with a flash of white tails. Alarmed birds fluttered among the branches or flew across the clearing to quieter places for the night. Not one bird or beast thought of the hero who had kept their little homes of horsehair, wool, or moss safely under the British flag. Nor did they think of the steady Game Laws, which made hunting a terror mostly for creatures grander than themselves.
        - id: ch04-b04
          speaker: narrator
          text: >-
            No one seemed to know. No one seemed to care or understand. In the joy of her burnt offering and sacrifice, Selina stood alone.
        - id: ch04-b05
          speaker: narrator
          text: >-
            And yet, she was not quite alone.
        - id: ch04-b06
          speaker: narrator
          text: >-
            Just as the fire reached its loudest roar, a few stars stepped gently into the enormous sky. They looked down uncertainly, first with wonder, then with interest. Suddenly, they recognized what they saw, and their surprise turned glad. They, at least, understood everything. Among the stars, Nelson's name was spoken every day. His story belonged to the music that carried them on their courses, and he was their fellow, their companion, and their comrade. They peeped down and winked, then peeped again. They called to their slower brothers to hurry and look.
    - id: ch05
      title: After the Fire
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            The best moments of life can make us drunk with feeling. For a little while, Selina had lived in as golden a joy as our gray world allows. Then came the bitter waking. The flames sank into dark embers at the very moment Aunt Eliza rushed wildly onto the scene.
        - id: ch05-b02
          speaker: narrator
          text: >-
            Selina was stripped of every rank and privilege, broken like a sailor before the mast, and marked forever as someone who could not be trusted. The grown-ups had believed they could rely on her while Edward was safely at school and I was under an aunt's watch far away. Now that belief was gone. Her pocket money was stopped for no stated length of time. Her new church service book, the pride of her last birthday, was taken from her keeping and placed under the control of a Trust.
        - id: ch05-b03
          speaker: narrator
          text: >-
            Those punishments were not what hurt her most. She grieved because she had pulled poor Harold into a dreadful scrape against his better judgment. Then the excitement drained away completely. The proper young-lady part of her crept timidly back to its usual home. Selina could only see herself as an ordinary fool. Nothing could justify her, and she had no excuse or explanation to offer.
        - id: ch05-b04
          speaker: narrator
          text: >-
            Harold's case was less sad than it looked to his sensitive sister. He was young, and his memory was short. It is true that he started upstairs toward his lonely little bed, howling miserably. Ahead of him stretched a gloomy future filled with enough pain and punishment to last until the end of the world.
        - id: ch05-b05
          speaker: narrator
          text: >-
            Outside his door, however, he stumbled over Augustus the cat and caught him. At once, Harold's mourning became a song of victory as he carried his prize safely into port. Augustus hated nothing more than sleeping with little boys. But he was clever rather than foolish, and any trapper sly enough to capture him had done something worth celebrating.
        - id: ch05-b06
          speaker: narrator
          text: >-
            When Augustus understood that his fate was settled and his bed chosen for the night, he wisely accepted it. With a lazy air of perfect understanding, he listened to Harold's tangled chatter about pigs and heroes, moles and bonfires. Harold talked himself to sleep with it. Even so, Augustus may not have been one of those rare companions who truly understood.
        - id: ch05-b07
          speaker: narrator
          text: >-
            Selina knew nothing of Harold's comfort. She knew nothing of the sympathy in the stars winking above her, either. Only after a long, sad while, with her pillow very wet, did she drift into that strange and wandering country where your own favorite hero may come strolling down the road. There, you may commit any wild and foolish act you please, and everyone understands and appreciates it.
