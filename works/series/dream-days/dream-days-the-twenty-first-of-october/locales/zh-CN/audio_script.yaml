audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 机智而从容，带着温和的回望
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    selina:
      display_name: 塞莉娜
      tts:
        delivery: 认真执着，激动时果断炽烈
        timbre: 清澈明亮
        pace: 中等，情绪高涨时稍快
        pitch: 中高
    harold:
      display_name: 哈罗德
      tts:
        delivery: 天真直率，疑惑时仍彬彬有礼
        timbre: 稚嫩清脆
        pace: 轻快
        pitch: 高
    villager_1:
      display_name: 村民甲
      tts:
        delivery: 随口嘟囔，毫不在意
        timbre: 粗哑朴实
        pace: 中等
        pitch: 中低
    villager_2:
      display_name: 村民乙
      tts:
        delivery: 随口附和，漫不经心
        timbre: 厚实低沉
        pace: 中等
        pitch: 低
    villager_3:
      display_name: 村民丙
      tts:
        delivery: 懒散含混，满不在乎
        timbre: 干涩苍老
        pace: 稍慢
        pitch: 中低
  chapters:
    - id: ch01
      title: 我们各自的学问
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 说到一般的学问和才艺，我们几个孩子谁也不比谁强。有时，大人会忽然挑中一个，逼他去跟某种早就死透了的荒唐语言搏斗，管他愿不愿意。有时，他们又凭空认定另一个有艺术天分，叫他没完没了地弹音阶和练习曲，直弹到厌烦或气恼的眼泪落在琴键上。至于地理、算术，还有那些叫人疲倦的国王王后事迹，连只想去马戏场甩鞭子的人也得学。可我们谁要是学得特别好，谁反倒觉得丢脸。各人的天资虽不相同，逃课躲懒的决心却一样坚定，所以大家始终站在同一条线上。那是一条无知的线，不过无知里还掺着不服管教。
        - id: ch01-b02
          speaker: narrator
          text: 幸好，还有许多更健康的学问，可以任由我们自己挑选。我们绝不承认那是教育，只管沿着自己的路钻研，积下的专门知识常常多得叫大人害怕。爱德华迷的是英国陆军。他熟悉各团的制服、装备、军旗和格言，制服镶边从不会认错，臂章、徽章、勋章、星章也难不住他，甚至连多数团长的名字都知道。他能趴在草坪上，把整个晴朗的下午花在一本破旧的《陆军名册》上，鸟兽来撩拨也不抬头。
        - id: ch01-b03
          speaker: narrator
          text: 我的本领更自由，范围也更广。龙骑兵就算穿着林肯绿招摇过市，步枪兵就算把毛皮囊系在格子呢裤外面，我也懒得理会。可你若想打听美洲大陆的动物，那就来对地方了。野牛在哪儿打滚，为什么打滚，河狸怎样设套捕捉，野火鸡怎样悄悄逼近，灰熊怎样对付，蟒蛇又会怎样把客人缠得喘不过气，我都知道。从大西洋到太平洋，凡是会打洞、会踱步、会咆哮、会扭动的东西，它们住在哪儿，有什么习性，全是我的地盘。
        - id: ch01-b04
          speaker: narrator
          text: 大家也公认我是这方面的权威。家里若来了一本猎熊小说，哪怕人人兴奋得空气都像带了电，也得先让我审一审。熊的足迹写对了吗？追踪的方法可靠吗？我点过头，这本书才算真正过关。一个作家尽可以凭捕兽人和边地森林誉满天下，可只要他配肉干的方法不对，我就把他的成就骂得一文不值，从此再没人提。
        - id: ch01-b05
          speaker: narrator
          text: 哈罗德太小，还没有自己的专长，不过他找鸟窝的天赋简直像能预知未来。我们还在猜这里也许有蛋，那里可能藏着蛋，他已经直奔正确的灌木、树枝或洞口，仿佛带着探宝杖。但天赋只是天赋，不能跟爱德华的制服知识，或我对草原犬鼠的研究相比。我们的学问可是苦读得来的，还曾在《陆军名册》和巴兰坦小说这两片黄金国度里远游。
        - id: ch01-b06
          speaker: narrator
          text: 塞莉娜的专长偏偏是海军史。专长这种东西没有规矩。与其说你拥有它，不如说它占有了你，至于它从哪儿萌芽，往往根本查不出来。塞莉娜从没见过海，可我也从没踏上美洲大陆，不照样熟悉那里的小路吗？要是有人突然把我丢进落基山脉，我会像回家一样自在。要是神怪把塞莉娜扔到朴次茅斯码头，她准能教那里的常客几手。
        - id: ch01-b07
          speaker: narrator
          text: 从布莱克时代到纳尔逊之死，再往后她就不屑过问了。英国海军每一场著名战役，她都在心里亲自打过。战况最坏时，她提着裙子逃跑，让毫无风度的德·鲁伊特或范·特罗普在后面追，心里却仍很快活，因为她知道，痛打全世界舰队的光辉岁月马上就会到来。好日子一来，她可忙极了。她最爱站在木屑横飞得最密的地方，也仔细研究航海和舰队调度。战列舰按什么次序进场，各自迎战哪艘敌舰，何时下锚，哪艘在锚索上加了弹簧缆，她全记得。那句术语她虽然不懂，事实却绝不会漏掉。每逢交战，她总站在那艘英勇军舰的后甲板上，等到最后一刻才开炮。
    - id: ch02
      title: 特拉法尔加纪念日
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 塞莉娜那次离奇发作时，我偏偏去了一个讨厌的姨妈家，只能把别人讲给我的事拼起来。我一辈子都为错过它懊恼，还委屈地把账记在姨妈头上。整件事壮丽得毫无用处，正合我的艺术趣味。更妙的是，闹事的竟是塞莉娜。她刚订了《年轻淑女杂志》，还会装出一副忍耐神气，让人带去参加陌生的茶会。这让我明白，那些正在爬上我们身的规矩礼法，也许不过是一层薄皮。
        - id: ch02-b02
          speaker: narrator
          text: 爱德华也不在，他正在学校里挨打受训。不过，他天性严峻务实，就算在场，也只会说看不出这有什么道理。哈罗德却一向受众神偏爱。他不但看见了一切，还像祭司一样亲手给圣火添柴。那时，他虽然挨了那些庸俗、没有想象力、暂且掌权的大人的罚，可往后心里一定一直留着侍童般洁白的喜悦。他蒙了大恩，仿佛获准在弥撒最神圣的一刻挥动香炉。
        - id: ch02-b03
          speaker: narrator
          text: 十月渐渐醇熟，一年也快走到尽头。林地和树篱到处轻声暗示，漫长的路已经快走完了。寂静的午后，无论朝哪边听，都像能听见赛跑者接近终点时急促的呼吸和呜咽。塞莉娜让一个念头牢牢占住，独自穿过花园，走进牧场。她在一小片高地上躺下，一边能俯瞰花园，一边能望见丘陵和古老的驿车道，就在那里慢慢咀嚼自己的想象。不久，哈罗德气喘吁吁地跑来，满肚子都是新受的委屈。
        - id: ch02-b04
          speaker: harold
          text: 我求过他别杀。我说，只要再等一会儿，爱德华很快就回来了。晚一点对他又没什么，猪也不会介意，爱德华会高兴，大家都会高兴。可他只说很抱歉，培根从来不等人。我骂他是个十足的畜生，就走了。可……可我觉得，他们现在已经动手了！
          emotion: sad
        - id: ch02-b05
          speaker: selina
          text: 对，他是个畜生。
        - id: ch02-b06
          speaker: narrator
          text: 塞莉娜回答得心不在焉，她早已忘了杀猪的事。哈罗德踢散鼹鼠刚拱起的土堆，又拿棍子往洞里捅。拉金农场那边传来一声拖得长长的悲鸣。那细弱的叫声像在哀求，也告诉他们，一头肥壮的黑色伯克夏猪，那条坚强的灵魂，已经踏上通往冥府的石子路。
        - id: ch02-b07
          speaker: selina
          text: 你知道今天是什么日子吗？
        - id: ch02-b08
          speaker: narrator
          text: 哈罗德既不知道，也不在意。他已经刨开一码来长的鼹鼠地道，还在专心地挖。
        - id: ch02-b09
          speaker: selina
          text: 今天是特拉法尔加纪念日。特拉法尔加纪念日——可是谁也不在乎！
          emotion: sad
        - id: ch02-b10
          speaker: narrator
          text: 她的语气提醒哈罗德，他这样不太得体。究竟哪里不妥，他并不清楚，还是放弃了鼹鼠，摆出礼貌而专心的样子。
        - id: ch02-b11
          speaker: selina
          text: 看那边，从前驿车就走那条老路。托马斯舅舅前几天告诉我的。人们等驿车过来，好照它的时辰看时间，也许还要领包裹。有一天早晨，他们什么也不会料到。先是一团和平常一样的尘土，接着驿车飞奔而来，这时他们就明白了！整辆车从头到尾都披满月桂，车夫戴着月桂，护车人也戴着月桂。于是他们知道了，他们知道了！
        - id: ch02-b12
          speaker: narrator
          text: 哈罗德恭敬地听着，一声不响。其实，他宁愿继续追那只鼹鼠。那家伙若有点脑筋，这会儿早逃到一英里外了。不过，哈罗德天生有绅士的本能。绅士最要紧的标志之一，就是再无聊也绝不让人看出来。
        - id: ch02-b13
          speaker: narrator
          text: 塞莉娜站起来，在草地上走来走去，步子短短的，就像在军舰后甲板上巡行。
        - id: ch02-b14
          speaker: selina
          text: 我们为什么不能做点什么？他……他做了所有的事。我们为什么不能为他做一点事？
          emotion: angry
        - id: ch02-b15
          speaker: harold
          text: 谁做了所有的事？
        - id: ch02-b16
          speaker: narrator
          text: 哈罗德问得很温顺。再惦记鼹鼠已经没有用了。它跟死者一样，走得飞快。
        - id: ch02-b17
          speaker: selina
          text: 当然是纳尔逊！
          emotion: angry
        - id: ch02-b18
          speaker: harold
          text: 可他……他已经死了，不是吗？
        - id: ch02-b19
          speaker: selina
          text: 那又有什么关系？
          emotion: angry
    - id: ch03
      title: 献给英雄的火
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 哈罗德吃了一惊。那头猪最后的叫声已经停了，在他看来，事情也该彻底结束。假期里不管还有多少乐子等着爱德华，那头猪肯定再也帮不上忙。可姐姐却说，死了并没有改变什么。看来，他得重新想一想。他坐直身体，朝花园望去，想找点帮助。恰在这时，一缕细烟笔直升进静止的空气。园丁下午扫了落叶，如今正像一位自己毫不知情的祭司，把秋叶献给那位眼神宁静的女神。金色午后里，她披着变幻的颜色和寒意将临的预兆，缓缓巡视大地。
        - id: ch03-b02
          speaker: narrator
          text: 哈罗德马上跳起来跑了。他忘了纳尔逊，也忘了猪、鼹鼠、拉金的背叛和塞莉娜那场奇怪的良心热病。那里有火，是真正能玩的火，比玩水或捏弄松软的泥土更带劲。世界给心性健全的人预备了许多玩具，其中最了不起的，当然是最原始的那几样元素。
        - id: ch03-b03
          speaker: narrator
          text: 塞莉娜仍坐着，双拳托住下巴。她看着烟，思绪也跟着盘旋飘荡。十月的白昼很短，暮色迈着轻快的脚步越过花园。烟里不时蹿起细小的红色火舌，又转眼消失。哈罗德一会儿抱着大捆落叶踉跄走来，一会儿用力拨火，身影断断续续地透过烟雾显现。
        - id: ch03-b04
          speaker: narrator
          text: 塞莉娜心里看见的却是另一种烟。浓烟阴沉沉地压在战舰的桅杆和船身周围。下面传来炮声轰鸣，撞击和木板撕裂的爆响，登船队的呐喊，还有炮手倒在炮旁时哽住的最后一口气。终于，烟雾像一道撕开的丧幕。她看见胜利者光辉的灵魂，头戴圆满死亡的冠冕，确信无疑地跃进不朽者呼吸的苍穹。暮色沉向黑暗，她才站起身，慢慢走向那堆召唤她的火。她走路像一位女祭司，眼中带着信徒坚定的决意。
        - id: ch03-b05
          speaker: narrator
          text: 落叶已经烧旺，哈罗德又添上一丛老荆豆。火焰腾起来，噼啪作响，叫人振奋。
        - id: ch03-b06
          speaker: selina
          text: 再去拿些树枝，还有刨花、大木块，能找到什么就拿什么。菜园里堆着旧豌豆架，你能抱多少就抱多少。送来以后，再回去拿！
        - id: ch03-b07
          speaker: harold
          text: 可是，我说——
          emotion: surprised
        - id: ch03-b08
          speaker: narrator
          text: 哈罗德几乎认不出姐姐了。他仿佛已经看见园丁发现豌豆架全没了，气得发狂，嚷着要报复。
        - id: ch03-b09
          speaker: selina
          text: 快去拿来！
          emotion: angry
        - id: ch03-b10
          speaker: narrator
          text: 哈罗德立刻跑了。从小受的严厉管教，这时显出了作用。可是他的眼睛瞪得像两个圆圆的字母 O，一边跑，一边飞快地自言自语，脑子显然已经乱了。
        - id: ch03-b11
          speaker: narrator
          text: 豌豆架烧得极旺。火不再闷着，一下蹿起来，渐渐成了一堆真正的篝火。哈罗德起初敬畏得不敢出声，后来围着火堆又跳又叫，为胜利欢呼。塞莉娜却皱紧眉头，严厉地看着，显然还不满意。
        - id: ch03-b12
          speaker: selina
          text: 不能再找些木头吗？到处搜一搜。工具房里有旧篮筐、旧席子，还有别的东西，都拿出来。爱德华推你撞上的那个旧黄瓜棚也拆掉，就是我们玩侦察兵和莫希干人那天。等等……好哇！我知道了。跟我来。
        - id: ch03-b13
          speaker: narrator
          text: 附近有一间温室，是伊丽莎姨妈最珍爱的宝贝，连严厉的园丁也很满意。温室一头连着外屋，里面存着燃料。那些燃料神圣不可侵犯，大人严禁他们碰哪怕一根柴，可塞莉娜径直走了进去。偷过豌豆架之后，哈罗德已经准备好犯下任何罪行。他乖乖跟在后面，却一路掐自己，想知道是不是在做梦。
        - id: ch03-b14
          speaker: selina
          text: 你拿煤。这里有篮子。柴捆交给我！
        - id: ch03-b15
          speaker: narrator
          text: 没过几分钟，谁也不能再说这是一堆寒酸的凑合货了。塞莉娜已经变成狂女祭司。她没戴帽子，散乱的头发飞扬，年轻淑女身上的渣滓都烧光了。她大步绕着赃物堆成的祭坛巡视，又拿豌豆杆拨火。
        - id: ch03-b16
          speaker: selina
          text: 我早知道我们能做点什么！虽然不多……可到底做了一点事！
          emotion: happy
    - id: ch04
      title: 星辰明白
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 园丁回家喝茶去了。伊丽莎姨妈坐车到很远的地方喝茶，要到很晚才回来。花园这一头也没有窗户看得见。于是，这份贡礼无人阻拦，欢快地燃烧起来。远处的村民看见火光，只随口嘟囔了一句。
        - id: ch04-b02
          speakers: [villager_1, villager_2, villager_3]
          ensemble: chorus
          text: 那群小魔鬼又在捣蛋了。
        - id: ch04-b03
          speaker: narrator
          text: 他们继续朝啤酒走，根本没想今天是什么日子，也没想起纳尔逊。正是纳尔逊保住了他们盛着老实啤酒的老实品脱杯，让他们还能用老实的便士付钱，不至于改喝按升算的酒、改用十进制的钱币。
        - id: ch04-b04
          speaker: narrator
          text: 近处，受惊的兔子探出头，又甩着白尾巴消失。鸟儿惊慌地扑腾，或飞过空地，到更安静的地方过夜。可鸟兽也没想起那位英雄。多亏了他，它们用马毛、羊毛或苔藓搭的小窝，才能年年安稳地留在英国国旗下面。长久不变的狩猎法，也让打猎只成为比它们高贵的家伙才要害怕的事。仿佛没有谁知道，没有谁在意，也没有谁同情。塞莉娜沉浸在燔祭和牺牲的狂喜中，孤零零地站着。
        - id: ch04-b05
          speaker: narrator
          text: 可她并不完全孤单。火焰轰鸣得最响时，几颗星星轻轻走上无边的夜空，迟疑地向下看。起先惊奇，接着有了兴趣，然后忽然认出来，露出欣喜的神情。至少星星知道是怎么回事，它们明白。在星辰中间，那个名字每天都有人提起。他的故事，是星辰运行所依的乐声之一；他本人，就是它们的伙伴和战友。星星探头看了又看，不住地眨眼，还招呼姗姗来迟的兄弟赶快来看。
        - id: ch04-b06
          speaker: narrator
          text: 人生最好的部分，不过是一场沉醉。塞莉娜短暂地醉过，也尝过我们灰暗人生所能给出的、如黄金般灿烂的狂喜。接着，她不得不尝清醒的苦味。火焰刚暗成阴沉的余烬，伊丽莎姨妈就怒气冲冲地闯了进来。
        - id: ch04-b07
          speaker: narrator
          text: 塞莉娜立刻并且永远遭到降职和革退，仿佛被赶到普通水手舱，还从此背上不可信赖的烙印。哪怕爱德华安稳地待在学校，我也在远方受姨妈看管，别人照样不能信任她。她的零用钱无限期停发，上个生日收到的那本新祈祷书也被收走，交给一个信托机构保管。可真正叫她伤心的，不是这些惩罚。
        - id: ch04-b08
          speaker: narrator
          text: 她难过，是因为自己不顾哈罗德原本明智的判断，硬把可怜的弟弟拖进一场可怕的祸事。等热潮完全退去，昂扬的心气噗地泄光，身体里属于年轻淑女的那一部分又怯生生爬回旧日住处，她再看自己，只觉得那是一个不折不扣的傻瓜。没有正当理由，无法否认，也找不出半点借口或解释。
        - id: ch04-b09
          speaker: narrator
          text: 哈罗德年纪小，记性又短，所以并没有敏感的姐姐想得那么可怜。不错，他朝楼上孤零零的小床走去时，一路哭得凄凄惨惨。眼前的未来满是痛苦和惩罚，仿佛足够一直挨到世界末日。可到了房门口，他被猫奥古斯塔斯绊了一跤，顺手便把它捉住了。哀歌立刻变成凯歌，他押着战利品进了港。
        - id: ch04-b10
          speaker: narrator
          text: 奥古斯塔斯最讨厌跟小男孩一起上床睡觉。不过，它向来宁肯做个识时务的无赖，也不肯当傻瓜。能设下圈套逮住它的捕兽人，确实完成了一桩大功。奥古斯塔斯明白命运已经定了，今晚住哪儿也改不了，便聪明地接受现实。它懒洋洋地躺着，摆出一副什么都听懂了的样子，听哈罗德颠三倒四地念叨猪和英雄、鼹鼠和篝火。那番自说自唱的话，恰好成了哈罗德的催眠曲。只是，奥古斯塔斯到底是不是那种真正明白一切的稀有伙伴，恐怕很值得怀疑。
        - id: ch04-b11
          speaker: narrator
          text: 塞莉娜既不知道哈罗德找到了安慰，也不知道头顶的星星正眨着眼同情她。过了好一阵伤心的时光，枕头已经湿漉漉的，她才慢慢漂进那个离奇又不讲道理的国度。在那里，你会遇见自己最心爱的英雄沿路走来。你尽可以做出任何异想天开、莽撞荒唐的怪事，而每一个人都懂得，也都欣赏。
