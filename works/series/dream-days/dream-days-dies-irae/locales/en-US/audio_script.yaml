  chapters:
    - id: ch01
      title: A Blind Day
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The days I remember come marching out of the mist of years long gone. Most are bright and open, like dandelions that have soaked in sunlight from morning until evening. But here and there comes one sad, blind day. It is blind as a window blurred by driving rain, so that the sunshine, the wheeling birds, the happy fields, and the old garden all disappear. At the time, I did not understand the misery that darkened such a day. I only felt it striking me, almost like a real blow.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Martha began this particular day, though none of it was truly her fault. That was half the trouble. There was no solid person to blame, and no one who could make things right. Breakfast had just ended, and outside the sun seemed to be calling us as loudly as a trumpet. I ran upstairs with a broken bootlace in my hand. Martha was huddled in a corner, crying with her face buried in her apron. All I could get from her was one miserable sob after another. Each one hurt me, while the sun grew more impatient and I still needed my bootlace.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Downstairs, I learned why. Martha's brother Billy was dead. Her sailor brother had drowned in one of those strange, distant seas that we dreamed of crossing one day. We knew Billy and thought very highly of him. Whenever we heard he was coming to see Martha, we counted the days. At last his cheerful voice would sound from the kitchen, and we would charge down shouting. First he had to show us his tattooed arms. They seemed more wonderful and enviable every time. Then we demanded tricks, juggling, and alarming feats of strength. After that came sea stories, one after another, until bedtime. In Billy's particular place in the world, there had never been anyone quite like him.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Now people said he had drowned. Martha was wretched, and I could not get a new bootlace. They told me Billy would never return. I looked out at the sun, which returned perfectly well every morning, and their words meant nothing to me. Martha's grief reached me a little because I could see and hear it. It left a dull, bad pain somewhere deep inside, though I could not have said where. And through it all, I still wanted that bootlace.
        - id: ch01-b05
          speaker: narrator
          text: >-
            It was a poor beginning for a day that had looked so promising. I tied my boot with a piece of old string and went to find the girls. Something already felt out of tune. The moment I entered the schoolroom, I knew things were wrong there too. Selina stared emptily through the window with one foot curled around her leg. I spoke, and she only jerked her shoulder crossly. Charlotte lay sprawled in a chair with nothing to do, and she had plainly been sniffling already.
        - id: ch01-b06
          speaker: narrator
          text: >-
            The cause seemed small to me, and the girls were being most unreasonable about it. A hamper had recently been sent to Edward at school. He was allowed only one each term, so packing it was half celebration and half sacred ceremony. Jam, cake, sausages, and apples went in first. When everything had been wedged safely into place, the girls laid their own private gifts on top. I forget exactly what they were. They were not especially useful to a boy, but the girls had planned them, worked on them, saved their pocket money for them, and happily imagined how delighted Edward would be.
        - id: ch01-b07
          speaker: narrator
          text: >-
            The day before, Edward's short reply had arrived. He praised the cakes and jam. He reported that Smith major strongly approved of the sausages. Then he hinted that, now he had plenty to eat, five shillings in postage stamps would arm him against every possible turn of fortune. That was all. He never mentioned the girls' gifts or said that he liked them.
        - id: ch01-b08
          speaker: narrator
          text: >-
            To Harold and me, the letter seemed natural and sensible. Food was the chief thing, and five shillings could prepare a fellow for almost anything. The presents were very nice in their way, of course, but life was serious. A boy needed cake and half-crowns for the struggle, not ornaments and knitted mittens. The girls stubbornly saw the insult differently. So I received my second cold welcome of the morning.
    - id: ch02
      title: Everything Goes Wrong
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Feeling rather discouraged, I went downstairs and out into the sunlight. Harold was alone on the gravel, playing at conspirators. He had dug a little hole in the path and laid an imaginary trail of gunpowder to it. As he dashed for safety among the laurels before the explosion, I heard him muttering to himself.
        - id: ch02-b02
          speaker: harold
          text: >-
            “My God!” cried the Czar. “My plans have been ruined!”
        - id: ch02-b03
          speaker: narrator
          text: >-
            It seemed the perfect moment for me to become a black puma. On the whole, Harold liked black pumas as well as any animal we knew. I sprang at him with the proper howl and rolled him over on the gravel.
        - id: ch02-b04
          speaker: narrator
          text: >-
            Life is full of things that work and things that do not. This did not. From underneath me came a piercing cry.
        - id: ch02-b05
          speaker: harold
          text: “Oh! That's my sore knee!”
        - id: ch02-b06
          speaker: narrator
          text: >-
            Harold wriggled out of the puma's grip and howled miserably. I truly had not known about his sore knee, and he knew that I had not known. By the laws of boys, his behavior was therefore quite wrong, sore knee or no sore knee, and I owed him no apology. Even so, I tried to meet him halfway. We could hide beside the pond, I suggested, and ambush the ducks as they waddled down in one innocent line. Then we could chase them like bison scattering across the great prairie. It was a thrilling game and strictly forbidden. Harold refused every offer. He went back to the house, wailing at the top of his lungs.
        - id: ch02-b07
          speaker: narrator
          text: >-
            Things had become unbearable. I headed blindly toward the open country. Before I even reached the gate, a shrill voice called down from a window.
        - id: ch02-b08
          speaker: window_voice
          text: “Keep out of the flower beds!”
        - id: ch02-b09
          speaker: narrator
          text: >-
            The gate snapped shut behind me, and at once I felt better. Ten minutes down the road, I decided that my whole life needed to change. I was trapped, and this miserable state of things had to end. I had already done everything anyone could ask. No better-meaning fellow ever marched along a road with such a wounded heart. I only wanted to live peacefully with others and enjoy whatever life offered. What I needed now was an entirely different world.
        - id: ch02-b10
          speaker: narrator
          text: >-
            Surely justice and sympathy still lived somewhere. The pampas sounded promising. Mile after mile of grass, perhaps one wild horse, and not a single relation in sight. That seemed a sensible cure for a bruised spirit. Other places let you dive for pearls and stab attacking sharks with a large knife. No relative would interrupt a person happily occupied that way. Still, I was not ready to give up my family altogether. First they must understand what they had done. They must see themselves clearly and wish, when it was far too late, that they had treated me better.
    - id: ch03
      title: General and Pirate
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The army suited this plan better than any other career. I would enlist and follow the drum. For years beneath foreign skies, I would march, fight, and present arms. Then, at last, war would sweep into the peaceful countryside where I had grown up and where everyone had nearly forgotten me. Terrified people would gather in helpless crowds, with several particular aunts among them.
        - id: ch03-b02
          speaker: narrator
          text: >-
            They would wonder whether any hope remained except the mercy of that mysterious, unbeatable General whose adventures had become legend. Then the army would enter the village. Guns would rattle and bounce along the street. Last of all, I would appear on a coal-black horse. I would be the famous General, my pale, stern face marked by a most interesting sword cut.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Every boy has practiced what happens next many times. Naturally, I would forgive them. With a black horse and a sword scar, a man can afford to be very generous. But I would give them a thorough talking-to first.
        - id: ch03-b04
          speaker: narrator
          text: >-
            That delightful future carried me along for about twenty minutes. Then my injuries began aching again and demanded a new remedy. This time I turned to the sea. The sea was my true place after all. There a person could be famous and lawless at once. The army always seemed weighed down by slow obedience and discipline.
        - id: ch03-b05
          speaker: narrator
          text: >-
            A life at sea began roughly, by every account, and just then I wanted to suffer terribly. For a while, I would be a poor cabin boy, kicked, beaten, and cursed. Perhaps some small report of my misery would reach my family's ears. Then, at the proper time, the pirate ship would appear. Such ships always did. It would sit low in the water, with a wicked black hull, guns everywhere, and the Jolly Roger snapping overhead. I alone would command it.
        - id: ch03-b06
          speaker: narrator
          text: >-
            Soon an East Indiaman would sail into view, carrying all my relations. Not one important relation would be absent. My crew would make the sailors walk the plank, and the captain would hang from his own yardarm. Then I would deal with the passengers, that miserable collection of familiar faces trembling together on the quarterdeck.
        - id: ch03-b07
          speaker: narrator
          text: >-
            And after that came the same ending again. The air would be thick with my mercy. Of all the heroes one can become, none is more wonderfully generous than a pirate chief.
    - id: ch04
      title: The Settlement
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            When I finally returned from the future to the real world, those pleasant dreams had carried me much farther than I knew. I stopped and looked around. On my right stood a long, low building of gray stone. It was new, but it did not look smug about being new. It had a character of its own without needing lichen, worn carvings, or crumbling windows to give it one.
        - id: ch04-b02
          speaker: narrator
          text: >-
            A stranger might not have known what the place was, but I had explored it before. Most people called it the Settlement. Some spoke of “those fellows up by Halliday's,” which was quite exact enough for our neighborhood. Others laughed and called the men “monks.” I knew that name was nonsense. I had read all about monks. They wore long robes, shaved their heads, and kept enormous dogs with brandy bottles around their necks. Those dogs spent their time pulling grateful travelers out of the snow.
        - id: ch04-b03
          speaker: narrator
          text: >-
            The Settlement owned only an Irish terrier, or perhaps the terrier owned all the men together. The men wore every sort of clothing and mostly grew whiskers down the sides of their faces. Once, while searching as usual for something I never found, I had wandered up there. They welcomed me like a friend. Their perfect little rooms held books and pictures but none of those fussy cloths people put on chair backs.
        - id: ch04-b04
          speaker: narrator
          text: >-
            They showed me their chapel. It was high, quiet, and faintly scented. Its beauty felt new and strange, partly because of what was there and partly because the usual dreariness of churches was missing. They fed me in their dining hall too. A long table rested openly on wooden trestles. Nothing was painted. All the wood had been scrubbed clean and still smelled of the forest.
        - id: ch04-b05
          speaker: narrator
          text: >-
            For days after that visit, I carried away a feeling of cleanness and freshness, sharp and cool as spring water. The open rooms, red tiles, and oak benches offered a comfort that needed no soft cushions.
        - id: ch04-b06
          speaker: narrator
          text: >-
            That morning I felt far too unfriendly to call on anyone. Still, the place suited my mood, so I went around the back. Beyond the level kitchen garden, the ground dropped steeply away. I did not yet know the word Gothic, or what it meant. Perhaps that steady style of building made the Settlement seem like a companion while I was discouraged.
        - id: ch04-b07
          speaker: narrator
          text: >-
            I stood looking at the low gray building and thought about my friends inside. They always seemed to be enjoying themselves, especially when they played with the Irish terrier as an equal. Their faces carried a certain look. They shared some purpose and some work, and they all seemed to understand the same orders. I remembered Martha saying that these men did a great deal of good. I also remembered vague things I had heard about giving things up, obeying rules, and denying oneself.
        - id: ch04-b08
          speaker: narrator
          text: >-
            Out of my gloomy heart rose a fascinating new idea. At once, the army felt stale and overacted, while piracy seemed dull and unprofitable. This, or something like it, would become both my calling and my revenge. I might choose an even harsher life, like the ones in my books. There would be black bread and a shirt made of hair. There would be terrible vows that could never be broken. Above all, there would be an iron grating.
        - id: ch04-b09
          speaker: narrator
          text: >-
            The grating mattered most because my relations would stand sadly on its other side. In my mind, I arranged the entire group in the proper order. Their eyes were sorrowful as they begged me to listen.
        - id: ch04-b10
          speakers: [selina, harold, martha, charlotte]
          ensemble: chorus
          text: >-
            Now we understand how wrong we were. We were always too slow to recognize a fine soul, especially when it belonged to our own family. We misunderstood you and never valued you properly. We admit it. And now—
        - id: ch04-b11
          speaker: narrator
          text: >-
            In my vision, I raised one thin, holy hand toward them. It was so wasted that light almost shone through the fingertips.
        - id: ch04-b12
          speaker: narrator
          text: >-
            “My dear friends, you have come too late. Your apology is proper and admirable, and I always knew you would make it someday. But my choice is made. Go home now, and mourn over how late your repentance came. I have taken my vows. From this day on, strict living and holy work are my only relations. Once a month, if you wish, you may come and look at me through this very strong grating. But—”
        - id: ch04-b13
          speaker: narrator
          text: >-
            Whack! A well-aimed lump of garden earth flew past my ear, burst against a tree behind me, and covered me with dirt. The present returned in an instant. I jumped behind the trees. The enemy was loose, with ambushes, alarms, and daring attacks waiting everywhere.
    - id: ch05
      title: The Day Turns Bright Again
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            I knew the attacker. It was the gardener's boy, a common enemy who hated me simply because I was a gentleman. I quickly found a fine sticky clod with one hand. With the other, I carefully pushed my hat beyond the tree trunk. All my years of fighting Red Indians had taught me something.
        - id: ch05-b02
          speaker: narrator
          text: >-
            Just as I expected, a second clod struck the middle of my poor hat. It was first-rate in both size and stickiness. With a terrible battle cry, I charged from shelter and threw my own ammunition. The gardener's boy had begun skipping in victory too soon. My clod caught him squarely in the stomach.
        - id: ch05-b03
          speaker: narrator
          text: >-
            Foolishly, he kept throwing. His breath was gone after my first hit, so every shot flew wide and uncertain. He already fought like someone running away. I struck him again from close range. Then we grabbed each other at the top of the hill and rolled all the way to the bottom together.
        - id: ch05-b04
          speaker: narrator
          text: >-
            He pulled free, found his feet, and trotted quickly toward his mother's cottage. Over his shoulder, he sent back threats and curses tangled with tearful pleas.
        - id: ch05-b05
          speaker: narrator
          text: >-
            I hurried toward the road with my whole body tingling and my head held high. I never looked back at the suggestive Settlement or the splendid future that now lay broken around it. Life had pleasures after all. Life meant action, struggle, and victory! The present had turned rosy again. Surprises waited on every side, and I was becoming terribly hungry.
        - id: ch05-b06
          speaker: narrator
          text: >-
            As I reached the road, a cart came rattling past. I ran, caught the chain hanging beneath it, and swung between the spinning wheels. Sweet-smelling dust choked and blinded me while the world streamed underneath like a striped ribbon. Then the driver flicked his whip at me, and I had to return to earth.
        - id: ch05-b07
          speaker: narrator
          text: >-
            I left the road and crossed the fields toward home. That way was not much shorter. Its true advantage was that it avoided the bridge, so I had to splash through the stream and get pleasantly wet. Bridges were for narrow people with serious aims and callings, people forced to abandon many of life's best joys.
        - id: ch05-b08
          speaker: narrator
          text: >-
            A truly wise person found joy in every element. Sun-warmed air had its touch, garden soil its smell, mud its wonderful ability to take any shape, and fire its showers of sparks. Such a person would never forget the happiness of wet feet.
        - id: ch05-b09
          speaker: narrator
          text: >-
            When I came out onto the common, Harold burst from a nearby thicket and ran to meet me. All the morning's rain clouds had vanished from his face. He had made a new squirrel stick, entirely by himself. He had even melted the lead. I examined it with great care and declared it absolutely magnificent.
        - id: ch05-b10
          speaker: narrator
          text: >-
            As we entered our gate, we could see the girls in the distance, gardening with an energy far more cheerful than their miserable idleness that morning. Harold explained what had changed.
        - id: ch05-b11
          speaker: harold
          text: >-
            Another letter came today. The hamper got shaken on the journey, so the presents slipped down into the straw and went everywhere. One was even inside the cold duck! That's why Edward didn't find them at first. And now he says, “Thank you awfully!”
          emotion: happy
        - id: ch05-b12
          speaker: narrator
          text: >-
            I did not see Martha again until we all gathered for tea. Her eyes were red, and she was strangely quiet. She did not scold us or find fault with anything. Instead, she was unusually kind about the jams and other treats. She kept urgently offering us special things, though we needed very little urging.
        - id: ch05-b13
          speaker: narrator
          text: >-
            Then, while I was busiest eating, Martha suddenly disappeared. A little later, Charlotte whispered to me.
        - id: ch05-b14
          speaker: charlotte
          text: “Martha went up to her room and locked herself in. I heard her.”
        - id: ch05-b15
          speaker: narrator
          text: >-
            I thought that was a very strange thing to do.
