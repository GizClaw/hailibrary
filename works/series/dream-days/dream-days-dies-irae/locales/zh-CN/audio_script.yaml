audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 机智而从容，带着温和的回望
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    selina:
      display_name: 塞莉娜
      tts:
        delivery: 认真执着，激动时果断炽烈
        timbre: 清澈明亮
        pace: 中等，情绪高涨时稍快
        pitch: 中高
    harold:
      display_name: 哈罗德
      tts:
        delivery: 天真直率，疑惑时仍彬彬有礼
        timbre: 稚嫩清脆
        pace: 轻快
        pitch: 高
    martha:
      display_name: 玛莎
      tts:
        delivery: 朴实利落，悲伤时克制而低沉
        timbre: 温厚微哑
        pace: 中等
        pitch: 中低
    charlotte:
      display_name: 夏洛特
      tts:
        delivery: 敏感细致，说悄悄话时轻柔谨慎
        timbre: 柔和清亮
        pace: 中等偏慢
        pitch: 中高
  chapters:
    - id: ch01
      title: 一个处处走调的早晨
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 许多难忘的日子，会排着队从久远岁月的雾里走出来。它们大多像晒了一整天太阳的蒲公英，眼睛睁得圆圆的。可队伍里偶尔也有一个孤苦的瞎子。它的眼睛像一扇遭了急雨的窗，水珠顺着灰暗的玻璃往下淌，把阳光、飞鸟、田野和花园全遮住了。那是一场不明不白的苦难留下的污痕。你说不清它是什么，只觉得它一下下打在身上。
        - id: ch01-b02
          speaker: narrator
          text: 事情是从玛莎那里开始的，可不能真怪她。麻烦也正在这里。眼前没有一个实实在在的人，能让我责怪，再逼他赔罪，只有一种摸不着的糟糕情形。早餐刚结束，太阳就在外面催我们了，活像传令官吹着喇叭。我拿着断鞋带跑上楼找玛莎，却见她缩在墙角，脸埋进围裙里哭。她什么也说不出来，只是一声接一声抽泣。每一声都像打在我身上，叫人闷痛。太阳却越等越不耐烦，而我还等着她给我一根鞋带。
        - id: ch01-b03
          speaker: narrator
          text: 到楼下一问，我才知道，玛莎那个当水手的哥哥比利死了。他淹死在遥远陌生的海上，而我们一直梦想着有一天也要去那样的海上航行。我们很熟悉比利，也很赏识他。每次听说他要来看妹妹，总要一天一天数着日子盼他。等厨房里终于传出他快活的嗓音，我们就欢呼着跑下楼。先要他亮出胳膊上的刺青，那永远是第一件事。无论看过多少回，那些图案总能带来新的欢喜、羡慕和敬畏。然后，我们又要他变戏法、耍杂技，做那些古怪而吓人的体操。最后才轮到海上的故事，一个接一个，怎么听也听不够，一直讲到该上床了。
        - id: ch01-b04
          speaker: narrator
          text: 在比利自己的天地里，没人比得上他。如今，他们说他淹死了，玛莎痛苦极了，而我却拿不到新鞋带。他们还说，比利再也不会回来。我望着窗外每天都会回来的太阳，完全不懂这句话。玛莎的悲伤倒有一点钻进我心里。那只是因为我看见她哭，也听见她哭，于是身体深处某个找不准的地方，生出一阵沉沉的疼。可我还是很需要那根鞋带。
        - id: ch01-b05
          speaker: narrator
          text: 外面明明是个大好的早晨，开头却糟透了。我拿一截旧绳临时顶替鞋带，然后去找姑娘们，心里总觉得天地间有哪里走了调。刚进教室，我就知道这里也不对劲。塞莉娜没精打采地望着窗外，一只脚绕在另一条腿后面。我跟她说话，她烦躁地耸耸肩，连一句话都懒得回。夏洛特无事可做，却摊在椅子里。一大早，她就已经有点抽鼻子了。
        - id: ch01-b06
          speaker: narrator
          text: 说到底，不过是一件小事，姑娘们却偏要把满屋空气弄得像带了电。前几天，又到了给寄宿学校里的爱德华寄食物篮的时候。他每学期只许收一篮，所以大家预备起来，一半像狂欢，一半像举行仪式。先把果酱、蛋糕和香肠仔细放好，再用苹果填满角落。所有东西塞稳以后，姑娘们才把自己的礼物摆在最上面。我忘了那些礼物究竟是什么，反正对男孩子没多大实际用处。可她们费过心、出过力，还从零用钱里省出钱，整天想象爱德华收到以后会多么惊喜。
        - id: ch01-b07
          speaker: narrator
          text: 昨天，爱德华寄回一封短短信。他大大称赞蛋糕和果酱，还说大史密斯也给香肠盖了赞成的印章。最后，他暗示自己如今粮草充足，只要再汇五先令邮票，就能全副武装，对付命运的一切打击。信到这里便完了。姑娘们亲手做的礼物，他一个字没提，更没说自己喜不喜欢。她们为了那些东西动过脑筋、费过工夫，还特意克扣自己的零用钱，收到的却只有沉默。可在哈罗德和我看来，这封信明明自然又合理。粮食才是头等大事，五先令更是一整套装备，足以应付运气最意外的变化。小饰物和针织手套当然也挺好，可生活是一件严肃的事，要把这场战斗打下去，靠的是蛋糕和半克朗。姑娘们却固执地认定自己受了轻慢。于是，那天早晨我第二回碰了钉子。
        - id: ch01-b08
          speaker: narrator
          text: 我有些泄气，走下楼去，又走进阳光里。哈罗德正独自在碎石路上玩密谋造反。他先在路面挖了一个小坑，又朝小坑牵过去一条想象中的火药引线。等那场无可避免的爆炸快要发生，他赶紧躲进月桂树丛，嘴里还低声扮演起计划受挫的沙皇。
        - id: ch01-b09
          speaker: harold
          text: 天哪！我的计划破产了！
        - id: ch01-b10
          speaker: narrator
          text: 这正是扮黑美洲狮的好机会。哈罗德向来很喜欢这种动物。于是我发出应有的嗥叫，猛扑到他身上，把他撞得在碎石地上滚了一圈。
        - id: ch01-b11
          speaker: harold
          text: 哎哟，是我那只疼的膝盖！
          emotion: sad
        - id: ch01-b12
          speaker: narrator
          text: 哈罗德从美洲狮的爪下挣脱，放声惨号。可我真不知道他膝盖疼，他也知道我不知道。按照男孩子的规矩，不管那只膝盖怎样，他这种态度都不对，我不欠他一句道歉。不过，我还是让了一半，提议到池塘边设伏，截住排成一队走来的鸭子，再把它们当作散开逃过大草原的野牛追猎。这个游戏迷人得很，也明令不许我们玩。哈罗德仍不肯和解，只管哭着退回屋里。
    - id: ch02
      title: 将军与海盗
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 事情简直糟到了地狱里。我不辨方向，直奔外面的乡野。快到大门时，窗口还有个尖嗓门命令我别踩花坛。直到门在身后恶狠狠地咔嗒合上，我才舒服一点。走了十分钟，我渐渐看清，非把生活彻底换掉不可。我已经进了死胡同，这种日子必须结束。一个用心再好不过的人，正怀着一颗受尽委屈的心，在路上沉重前行。他只愿自己活，也让别人活，跟伙伴和睦相处，享受生活给他的欢乐。可他能做的已经全做了。
        - id: ch02-b02
          speaker: narrator
          text: 我相信，世上总还有公道和同情居住的地方。潘帕斯草原听起来就很好。青草一里又一里铺向远处，偶尔才出现一匹野马，整个地平线以内连一个亲戚也没有。对于一颗伤痕累累的心，这种生活既合理，又很能治病。还有些好地方，人可以潜水采珍珠，用大刀刺鲨鱼的肚子。忙着这种幸福的工作时，也不会有亲戚跑来干涉。不过，我眼下还不能永远甩掉他们。得先让他们明白自己的处境，看看自己究竟是什么样的人。然后等一切都太迟了，再后悔当初为什么没有好好待我。
        - id: ch02-b03
          speaker: narrator
          text: 所有职业里，从军最适合这个计划。你报名入伍，跟着鼓声远去。在陌生天空下操练、行军、战斗、端枪，度过无人记载的漫长岁月。终于，等了又等，机会来了。战争的恐怖在你出生长大的宁静乡野间闪烁，可故乡的人早就快把你忘了。大家惊叫着聚在一起，吓得浑身发软，其中当然有几位姨妈。她们会问自己，大家还有什么希望？唯一的指望，只剩那位将军的慈悲。他就是人们讲过无数传奇故事的将军，神秘，而且不可战胜。
        - id: ch02-b04
          speaker: narrator
          text: 大军开进村庄，火炮沿街轰隆跳动。最后出场的才是你。你就是那位将军，传说中的英雄，骑着煤黑色战马。苍白的脸绷得紧紧的，上面还有一道十分有趣的刀疤。接下来会怎样，每个男孩子都排演过二十遍。你当然宽宏大量。有那匹黑马和那道刀疤在，你完全有资格宽宏大量。可你还是要把他们狠狠训上一顿。
        - id: ch02-b05
          speaker: narrator
          text: 这个念头叫我快活了足足二十分钟。随后，旧日的委屈又涌上来，嚷着要新的膏药和止疼糖浆。我便转而想起大海。海才是我真正的天地。只有在那里，功名和无法无天可以合在一起。军队却总拖着一份沉重乏味的纪律。听说海上起初很苦，可那时我正想狠狠吃些苦。我愿意先做个可怜的小舱童，让人踢、让人打、让人咒骂。也许，我的苦难会有一点风声传进他们耳中。
        - id: ch02-b06
          speaker: narrator
          text: 到了时候，单桅帆船或三角帆船就会出现。这种船总会出现的。那船模样凶险，黑色船身低低伏在水面，周身全是大炮，头顶飘着骷髅旗，而唯一的船长就是我。不久，一艘东印度商船照例驶来，满载着亲戚，一个该来的也不少。船员全都要走跳板，船长得吊在自己的桁端荡来荡去。接着轮到那些乘客。那群熟悉而可怜的人，全挤在后甲板上发抖。然后，又是那出老戏，空气浓得仿佛全是宽宏大量。全部英雄角色里，没有谁比海盗头子更真正懂得宽宏大量。
    - id: ch03
      title: 铁栅栏后的前程
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 我终于把自己从未来拉回眼前，才发现这些美妙幻景已经带我走出很远。我停下来环顾四周，辨认自己到了哪里。右手边有一幢低矮绵长的灰石房屋。它很新，却没有新房子那种自鸣得意，反倒自有气派。那种性格并不靠地衣，也不靠风雨把线脚和窗棂磨得斑驳模糊。陌生人大概猜不出那是什么地方，我却从小就是探险家，对它熟悉得很。多数人叫它“聚居所”。也有人用我们这一带已经足够简短的说法，叫它“哈利迪家那边的那伙人”。还有人带点讥讽，叫他们“修士”。
        - id: ch03-b02
          speaker: narrator
          text: 我知道“修士”这个称呼错得可笑，因为我在书里十分熟悉修士。他们该穿长袍，剃光头顶，还该养着脖子系白兰地瓶的大狗。那些狗会不停从雪里拖出一个个快乐的旅客。聚居所里却只有一条爱尔兰㹴犬。共同养它、也共同受它管束的那些好人，穿的衣服什么样式都有，多半还留着络腮胡。有一回，我照例在寻找一样始终找不到的东西，不知不觉走到那里。他们请我进去，把我当作朋友，也当作并肩的伙伴，让我在他们的小房间里随意走动。
        - id: ch03-b03
          speaker: narrator
          text: 那些小房间简直理想，满是书画，没有半点椅背巾的俗气。他们又带我看礼拜堂。里面高敞、寂静，飘着淡香，有一种陌生的新美。这美来自它拥有的东西，也来自它没有的东西。它没有的，正是寻常礼拜场所那种大家太熟悉的寒酸。他们还请我在饭厅吃饭。长桌明明白白架在支架上，所有木器都保持原色，没有油漆，擦洗得干净又健康，还散发着原来那片森林的气味。那次拜访以后，一种洁净的感觉跟了我许多天。那份刺醒感官的清新，就像清凉的泉水。扫得空阔的房间、红砖地和橡木长椅，也让人觉得舒服。这份舒服和软垫家具毫无关系。
        - id: ch03-b04
          speaker: narrator
          text: 那天早晨，我不想跟任何人友好来往。不过，那幢房子的模样恰好合我的心境。我绕到屋后，那里先留着一片平地做菜园，到了尽头，地势便陡然落下。那时我还不懂什么叫哥特式，也不知道世上有这种东西。可整幢建筑从头到尾一以贯之，大概正因如此，才像我灰心时的伙伴。我望着那幢低低的、灰色的、显得胸有成竹的房子，想着里面那些亲切的朋友。他们总是过得很快活，还跟爱尔兰㹴犬一起嬉闹。那条狗在他们中间地位十足，和人人都完全平等。
        - id: ch03-b05
          speaker: narrator
          text: 那些人脸上有一种特别的神情，仿佛大家有共同的目标，也有共同的正事。他们都在服从一套人人承认、人人明白的命令。玛莎说过，他们“做了老多好事”。我也零零碎碎听说过，他们会放弃许多东西，遵守规矩，克制自己之类的事。一个新鲜迷人的念头，便从我忧郁的心底浮了上来。军旅生涯顿时显得表演过火，既陈旧又做作。海盗这个行当也变得乏味，没了半点好处。这，或者某种相近的生活，才该成为我的使命，也成为我的复仇。
        - id: ch03-b06
          speaker: narrator
          text: 也许，我过的日子还要比他们严酷，像书里写的那样，只吃黑面包，身上穿苦衣。我还要发下不可撤销、叫人听了血都发冷的誓。最要紧的是，那里必须有一道铁栅栏。所有亲戚都会在栅栏另一边排成一行，一个也不少，个个愁眉苦脸地向我哀求。他们终于承认自己愚笨迟钝，尤其不懂得欣赏亲人高贵的心灵。他们误解了我，也亏待了我，现在全都知道错了。
        - id: ch03-b07
          speaker: narrator
          text: 到这时，我会挥一挥瘦得透光的苦修者之手，告诉他们，一切都太迟了。他们认错当然可嘉，我也早料到这一天迟早会来，可木已成舟。他们只好回家，慢慢哀叹这份迟来的悔意。至于我，早已发愿献身，从此只有苦行和圣工才是亲人。要是他们愿意，每月可以来一次，隔着那道结实的铁栅栏瞻仰我。可是就在这里，啪的一声！
        - id: ch03-b08
          speaker: narrator
          text: 一团瞄得很准的园土擦过耳边，在身后树干上炸开，溅了我一身泥。我一下回到眼前，灵巧地躲进树后。敌人已经出动了，到处是埋伏、警报和惊险的突袭。我知道，那是园丁家的男孩。这个红头发的无产者恨我，只因为我是绅士。我一手赶紧捡起一团又黏又好的泥，另一手把帽子小心伸出树干。这些年跟红种人打仗，我可不是白练的。
        - id: ch03-b09
          speaker: narrator
          text: 果然，又一团又大又黏的泥正中我可怜的帽子。我像埃阿斯那样发出可怕的战吼，冲出掩体，把自己的弹药投了出去。园丁家的男孩正为过早到来的胜利蹦跳，毫无防备，那团泥结结实实打中了他的肚子。
        - id: ch03-b10
          speaker: narrator
          text: 那傻瓜不知道那天诸神究竟站在哪一边，竟继续朝我发射泥团。可第一下已经打得他喘不上气，后面几发摇摇晃晃，全都偏了。他胡乱投掷，简直像个已经绝望、只顾逃命的人。我趁近距离又打中他一次，接着两人在坡顶扭成一团，一路滚到坡底。他终于挣脱出来，重新站稳，便飞快逃向母亲的小屋。可他还不忘回头，把咒骂和求饶一齐朝我扔过来。那声音又像威胁，又透着藏不住的哭腔。
        - id: ch03-b11
          speaker: narrator
          text: 我则神气十足地奔向大路，浑身激动得发麻，脑袋高高昂起。我一次也没有回头，既不看那幢方才还启发过我的聚居所，也不看散落在它四周、已经摔成碎片的周密前程。原来生活还是有快活的。生活就是行动，就是争斗，就是胜利。眼前的世界重新泛起玫瑰色，四面八方都潜伏着意想不到的惊喜，而我也开始饿得不像话了。
    - id: ch04
      title: 回家的路
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 我刚到路上，一辆大车便隆隆驶来。我冲过去抓住车底垂下的链条，惊险地荡在飞转的车轮之间。香喷喷的尘土呛住我，也迷住我的眼睛，整个世界像一条斑驳的带子，从脚下飞快滑过。直到车夫拿鞭子抽我，我才不得不重新降落人间。
        - id: ch04-b02
          speaker: narrator
          text: 我离开大路，穿过田野往家走。不是因为这条路近了多少，而是因为走这里不用过桥，非得哗啦哗啦趟过小溪，把脚痛快地弄湿。桥是给心胸狭窄的人走的。那些人有目标，也有使命，只好放弃人生许多最高的乐趣。真正聪明的人，会请每一种元素都来服侍自己的快乐。晒过太阳的空气抚在身上，园土散发出香气，泥巴可以随手捏成各种形状，玩火时飞旋的火星更叫人欣喜若狂。这些东西各有各的妙处，可聪明人绝不会因此忘记，把双脚弄得湿透同样是一种幸福。
        - id: ch04-b03
          speaker: narrator
          text: 我走出田野，来到公地。哈罗德从旁边的小树林蹿出来迎我，早晨笼在脸上的雨云已经吹散了。原来他新做了一根猎松鼠棍，完全是自己动手，连铅也是亲自熔的。我用行家的眼光仔细检查，宣布它绝对漂亮。我们进了自家大门，远远看见姑娘们在园里干活，兴致勃勃，跟早晨那副心灰意懒的样子恰好相反。
        - id: ch04-b04
          speaker: harold
          text: 今天又来了一封信。原来篮子一路颠来颠去，礼物全钻进稻草，散得到处都是。有一件居然是在冷鸭子肚里找到的，所以他们起初才没看见。爱德华说，他真是太太太感谢了。
          emotion: happy
        - id: ch04-b05
          speaker: narrator
          text: 直到大家重新聚在一起吃茶点，我才又见到玛莎。她两眼通红，沉默得古怪，既不呵斥人，也不挑任何东西的毛病。这跟平日的她完全不同。相反，她变得格外温柔，也格外体贴。她把果酱和各种吃食不停往我们面前送，还近乎急切地劝我们尝那些平日难得一见的美味。其实，我们根本用不着她再三催促。
        - id: ch04-b06
          speaker: narrator
          text: 后来，正当我吃得最忙时，玛莎忽然不见了。谁也没看见她离席时去了哪里。过了一会儿，夏洛特悄悄凑到我身边，把声音压得很低，告诉我她刚才听见了什么。
        - id: ch04-b07
          speaker: charlotte
          text: 玛莎回自己房里去了。我听见她还锁上了门。
          emotion: sad
        - id: ch04-b08
          speaker: narrator
          text: 我听了却怎么也想不明白，只觉得一个人忽然离开茶桌，独自回房，还把房门锁起来，实在是种很奇怪的做法。
