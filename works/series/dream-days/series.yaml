cover_prompt: |-
  A wordless cover scene in the English countryside of the late nineteenth century shows two school-age children following mysterious tracks across a fresh snowy field. A thoughtful boy in a buttoned brown wool coat and cap kneels to study the prints, while a lively girl in a dark blue coat and bonnet points eagerly toward a small friendly green dragon emerging beyond the hedge. The dragon is gentle and rounded rather than fierce, with folded wings, expressive eyes, and snow dusting its back. The pointing girl and kneeling boy tracing the tracks form the focal action, linking the children's everyday world to the realm of story and imagination. Use a child-height three-quarter view with bare shrubs, distant fields, and the winding trail leading inward, leaving broad calm winter sky at the top. Keep the children's clothes faithful to Britain around the 1890s, make every figure original, and avoid designs from later illustrated or screen adaptations. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
