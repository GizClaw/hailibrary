cover_prompt: |-
  A wordless cover scene in a late-Victorian London attic transformed by imagination at warm twilight. Sara Crewe, a slender eleven-year-old girl with long dark hair, grave green-gray eyes, and a worn black frock, kneels beside a small fire while her doll Emily sits near a patched blanket and a simple tea setting. Beyond the attic window, wet slate roofs and chimneys establish the period, while a faint glimpse of the richly furnished room below suggests the school she once knew. Sara lifts a covered dish toward her hungry friend Ermengarde, making quiet generosity the focal action. Use an intimate three-quarter view, frame the girls with rafters and window light, and leave calm shadowed wall space across the top. Keep every costume and object grounded in 1880s London and avoid imagery from any modern adaptation. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
