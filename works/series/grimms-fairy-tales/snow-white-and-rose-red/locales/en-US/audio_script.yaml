  chapters:
    - id: ch01
      title: The Two Rose-Trees
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: There was once a poor widow who lived in a lonely cottage. A garden grew in front of it, with two rose-trees. One bore white roses, and the other bore red. The widow had two daughters who were like those trees. Their names were Snow-white and Rose-red.
        - id: ch01-b02
          speaker: narrator
          text: Both girls were good, happy, busy, and cheerful. Snow-white was the quieter and gentler one. She liked to stay home with her mother, help with the housework, or read aloud when the work was done. Rose-red would rather run through the fields and meadows, looking for flowers and chasing butterflies.
        - id: ch01-b03
          speaker: narrator
          text: The sisters loved each other so dearly that they always held hands when they went out together. Snow-white often made her sister a promise.
        - id: ch01-b04
          speaker: snow_white
          text: We will always stay together.
        - id: ch01-b05
          speaker: rose_red
          text: Yes, for as long as we live.
        - id: ch01-b06
          speaker: mother
          text: And whatever one of you has, she must share with the other.
        - id: ch01-b07
          speaker: narrator
          text: The girls often went alone into the forest to gather red berries. No animal ever hurt them. The creatures came close without fear. A little hare ate cabbage leaves from their hands. A roe grazed beside them, a stag bounded past, and birds perched on the branches and sang every song they knew.
        - id: ch01-b08
          speaker: narrator
          text: Nothing bad ever happened to the sisters in the forest. If they stayed out too late and night came before they reached home, they simply lay down side by side on the soft moss. There they slept until morning. Their mother knew what they did and understood that they were safe, so she felt no distress about them.
        - id: ch01-b09
          speaker: narrator
          text: One dawn, after a night in the forest, they woke to see a beautiful child in shining white clothes sitting beside them. He stood, gave them a kind look, and walked silently into the trees. Then the girls looked around. They had slept right beside a precipice. If they had taken only a few more steps in the dark, they would surely have fallen.
        - id: ch01-b10
          speaker: mother
          text: That must have been the angel who watches over good children.
        - id: ch01-b11
          speaker: narrator
          text: Snow-white and Rose-red kept their mother's little cottage so neat that it was a pleasure to look inside. In summer, Rose-red took care of the house. Before her mother woke each morning, she placed a wreath of flowers beside the bed, and in it she put one rose from each tree. In winter, Snow-white lit the fire and hung the copper kettle over it. She polished that kettle so brightly that it shone like gold.
        - id: ch01-b12
          speaker: narrator
          text: On snowy evenings, their mother had Snow-white bolt the door. Then all three sat around the hearth while the mother put on her spectacles and read from a large book. The girls listened and spun. A lamb rested on the floor nearby, and behind them a white dove slept on its perch with its head beneath its wing.
    - id: ch02
      title: The Bear by the Fire
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: One evening, while they sat together in comfort, someone knocked at the door and waited to be let in.
        - id: ch02-b02
          speaker: mother
          text: Quickly, Rose-red, open the door. It may be a traveler looking for shelter.
        - id: ch02-b03
          speaker: narrator
          text: Rose-red drew back the bolt, expecting to find a poor man outside. Instead, a bear pushed his broad black head through the doorway. Rose-red screamed and jumped back. The lamb bleated, the dove fluttered, and Snow-white hid behind her mother's bed. Then the bear spoke.
        - id: ch02-b04
          speaker: bear
          text: Please don't be frightened. I won't hurt you. I'm half frozen, and I only want to warm myself beside your fire.
        - id: ch02-b05
          speaker: mother
          text: You poor bear. Lie down by the hearth, but mind that you don't burn your fur. Snow-white, Rose-red, come out now. He means no harm.
        - id: ch02-b06
          speaker: narrator
          text: The girls came out. Before long, the lamb and dove crept closer too, and neither was afraid.
        - id: ch02-b07
          speaker: bear
          text: Children, would you brush the snow from my coat?
        - id: ch02-b08
          speaker: narrator
          text: They fetched a broom and swept every bit of snow from his thick hide. The bear stretched out by the fire and gave a deep, comfortable growl. It did not take long for the girls to feel completely at ease with their clumsy guest. They pulled his fur with both hands, planted their feet on his broad back, and rolled him from side to side. Sometimes they picked up a hazel twig and switched him with it. Whenever he growled, they only laughed, and the bear took every trick in good humor. He protested only when their play grew too rough.
        - id: ch02-b09
          speaker: bear
          text: Let me live, children! Snowy-white, Rosy-red, will you beat your lover dead?
        - id: ch02-b10
          speaker: narrator
          text: At bedtime, the others went to their rooms, but the mother let the bear stay.
        - id: ch02-b11
          speaker: mother
          text: Sleep here by the hearth. You'll be safe from the cold and the bad weather.
        - id: ch02-b12
          speaker: narrator
          text: At dawn, the sisters opened the door for him, and he trotted over the snow into the forest.
        - id: ch02-b13
          speaker: narrator
          text: From that day on, the bear returned at the same hour every evening. He lay beside the hearth and let the children play with him as much as they pleased. The family became so used to their black friend that they never bolted the door until he had arrived.
        - id: ch02-b14
          speaker: narrator
          text: When spring came and everything outdoors turned green, the bear spoke to Snow-white one morning.
        - id: ch02-b15
          speaker: bear
          text: I have to go away now, and I won't be back all summer.
        - id: ch02-b16
          speaker: snow_white
          text: Where must you go, dear bear?
        - id: ch02-b17
          speaker: bear
          text: Into the forest, to guard my treasure from wicked dwarfs. During winter, the ground freezes hard, so they must stay below. But now the sun has warmed and softened the earth. They can break through, creep out, and steal. Once anything reaches their caves, it rarely sees daylight again.
        - id: ch02-b18
          speaker: narrator
          text: Snow-white was very sorry to see him leave. She unbolted the door, and as the bear hurried out, his coat caught on the bolt. A patch of fur tore away. Snow-white thought she saw gold shining underneath, but she could not be certain. The bear ran off at once and soon vanished behind the trees.
    - id: ch03
      title: The Dwarf in the Tree
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: A short while later, the mother sent her daughters into the forest for firewood. They found a large tree lying on the ground. Close to its trunk, something bounced back and forth in the grass. At first, they could not tell what it was.
        - id: ch03-b02
          speaker: narrator
          text: When they came closer, they saw a dwarf with an old, withered face and a snow-white beard a yard long. The tip of his beard was trapped in a crack in the tree. He jumped this way and that like a dog tied to a rope, with no idea how to free himself. He glared at the girls with fiery red eyes.
        - id: ch03-b03
          speaker: dwarf
          text: Why are you standing there? Come over here and help me!
          emotion: angry
        - id: ch03-b04
          speaker: rose_red
          text: What happened to you, little man?
        - id: ch03-b05
          speaker: dwarf
          text: You stupid, nosy goose! I wanted a little wood for cooking, so I tried to split this tree. Thick logs burn up the small amount of food we eat. We don't gobble down as much as you greedy, clumsy people. My wedge was set, and everything was going perfectly. Then the slippery wood sprang apart. The tree snapped shut before I could pull out my beautiful white beard. Now I'm stuck, and you silly, smooth-faced things are laughing at me. Ugh! You're horrible!
          emotion: angry
        - id: ch03-b06
          speaker: narrator
          text: The children pulled with all their strength, but the beard was caught too tightly.
        - id: ch03-b07
          speaker: rose_red
          text: I'll run and bring someone to help.
        - id: ch03-b08
          speaker: dwarf
          text: What a senseless goose! Why bring anyone else? The two of you are already more than I can stand. Can't you think of anything better?
          emotion: angry
        - id: ch03-b09
          speaker: snow_white
          text: Be patient. I know how to help you.
        - id: ch03-b10
          speaker: narrator
          text: Snow-white took the scissors from her pocket and cut off the trapped end of his beard. The instant he was free, the dwarf grabbed a bag hidden among the tree roots. It was filled with gold. He lifted it onto his back and muttered as he went.
        - id: ch03-b11
          speaker: dwarf
          text: What rude people, cutting away part of my fine beard! May bad luck follow you!
          emotion: angry
        - id: ch03-b12
          speaker: narrator
          text: He swung the bag over his shoulder and left without so much as a glance at the children.
    - id: ch04
      title: The Fishing Line and the Eagle
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Some time later, Snow-white and Rose-red went to catch fish for a meal. Near the brook, they noticed something like a giant grasshopper hopping toward the water as if it meant to jump in. They ran closer and recognized the dwarf.
        - id: ch04-b02
          speaker: rose_red
          text: Where are you going? You don't mean to jump into the water, do you?
        - id: ch04-b03
          speaker: dwarf
          text: I'm not that foolish! Can't you see this cursed fish is pulling me in?
          emotion: angry
        - id: ch04-b04
          speaker: narrator
          text: The dwarf had been sitting beside the brook and fishing when the wind twisted his beard around the line. At that very moment, a big fish bit the hook. The little man was too weak to haul it out. The fish had the upper hand and began dragging him straight toward the water. He clutched the reeds and rushes with both hands, but they did him little good. He had to follow every movement of the fish, and each pull brought him closer to being dragged into the brook.
        - id: ch04-b05
          speaker: narrator
          text: The girls arrived just in time. They held the dwarf fast and tried to unwind his beard, but beard and line were tangled too firmly. Once again, Snow-white had to use her scissors. She cut through the snarl, and another small piece of beard fell away. The dwarf shrieked when he saw it.
        - id: ch04-b06
          speaker: dwarf
          text: Is that any way to treat someone, you toadstool? First you clipped the end of my beard, and now you've cut off the finest part! How can I show my face among my own people? I hope you wear the soles right off your shoes!
          emotion: angry
        - id: ch04-b07
          speaker: narrator
          text: He pulled a sack of pearls from the rushes. Without another word, he dragged it away and disappeared behind a stone.
        - id: ch04-b08
          speaker: narrator
          text: Not long afterward, the mother sent the sisters into town to buy needles, thread, laces, and ribbons. Their road crossed a heath scattered with huge rocks. A large bird circled slowly above them, sinking lower with every turn. At last it landed near a rock, and a loud, pitiful cry rang out.
        - id: ch04-b09
          speaker: narrator
          text: The girls ran over in horror. An eagle had seized the dwarf and was about to carry him away. Feeling sorry for him, they caught hold of the little man and pulled against the eagle. They tugged until the bird finally released its prey.
        - id: ch04-b10
          speaker: narrator
          text: The dwarf recovered from his first fright. Then his shrill voice rose again.
        - id: ch04-b11
          speaker: dwarf
          text: Couldn't you have rescued me more carefully? Look what you did to my brown coat! It's torn and full of holes, you clumsy, useless creatures!
          emotion: angry
        - id: ch04-b12
          speaker: narrator
          text: He picked up a sack filled with precious stones and slipped beneath the rock into his hole. By now, the girls were used to his thanklessness and expected nothing better from him. They continued along the road, went into town, and bought everything their mother had asked them to bring home.
    - id: ch05
      title: The Prince in the Bearskin
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: On their way home across the heath, the sisters surprised the dwarf once more. He had poured his precious stones onto a clean patch of ground. He had not expected anyone to pass so late in the day. Evening sunlight touched the jewels, and they glittered in every color. The sight was so beautiful that the girls stopped to look.
        - id: ch05-b02
          speaker: dwarf
          text: What are you staring at?
          emotion: angry
        - id: ch05-b03
          speaker: narrator
          text: His ash-gray face turned copper-red with rage. He was about to continue his abuse when a loud growl sounded. A black bear trotted from the forest toward them.
        - id: ch05-b04
          speaker: narrator
          text: The dwarf sprang up in terror, but he could not reach his cave. The bear was already too close. In his dread, the dwarf begged for his life.
        - id: ch05-b05
          speaker: dwarf
          text: Dear Mr. Bear, please spare me! I'll give you all my treasure. Look at these beautiful jewels! Let me live. What would you want with one thin little fellow? You wouldn't even feel me between your teeth. Take those two wicked girls instead. They're tender and plump as young quails. Please, eat them and let me go!
          emotion: fearful
        - id: ch05-b06
          speaker: narrator
          text: The bear paid no attention to his words. He struck the wicked creature once with his paw, and the dwarf never moved again.
        - id: ch05-b07
          speaker: narrator
          text: The girls had run away, but the bear called after them.
        - id: ch05-b08
          speaker: bear
          text: Snow-white! Rose-red! Don't be afraid. Wait for me, and I'll go with you.
        - id: ch05-b09
          speaker: narrator
          text: They recognized his voice and stopped. When the bear reached them, his bearskin suddenly fell away. A handsome man stood before them, dressed entirely in gold.
        - id: ch05-b10
          speaker: bear
          text: I am a King's son. That wicked dwarf bewitched me after he stole my treasure. I had to wander through the forest as a wild bear until his death set me free. Now he has received the punishment he deserved.
        - id: ch05-b11
          speaker: narrator
          text: Snow-white married the prince, and Rose-red married his brother. The sisters divided the great treasure that the dwarf had gathered in his cave.
        - id: ch05-b12
          speaker: narrator
          text: Their mother lived peacefully and happily with her children for many years. She brought the two rose-trees with her, and they stood outside her window. Every year, they bore the most beautiful roses, white and red.
