audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容的童话讲述
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    snow_white:
      display_name: 白雪
      tts:
        delivery: 文静真诚
        timbre: 柔和明亮
        pace: 从容
        pitch: 中高音
    rose_red:
      display_name: 红玫
      tts:
        delivery: 活泼爽朗
        timbre: 清亮有朝气
        pace: 轻快
        pitch: 中高音
    mother:
      display_name: 母亲
      tts:
        delivery: 慈爱稳重
        timbre: 温厚柔和
        pace: 平稳
        pitch: 中音
    bear_prince:
      display_name: 熊与王子
      tts:
        delivery: 善良坦率
        timbre: 低沉宽厚
        pace: 沉稳
        pitch: 低音
    dwarf:
      display_name: 矮人
      tts:
        delivery: 尖刻暴躁
        timbre: 尖细干涩
        pace: 急促
        pitch: 高音
  chapters:
    - id: ch01
      title: 两株玫瑰
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，一个穷寡妇带着两个女儿，住在一间孤零零的小屋里。屋前的花园里长着两株玫瑰，一株开白花，一株开红花。两个女儿就像这两株花，一个叫白雪，一个叫红玫。她们同样善良快乐，也同样勤快开朗。白雪文静温柔，爱陪母亲做家务，空闲时就念书给她听。红玫更加活泼，常跑到草地和田野里采花、捉蝴蝶。
        - id: ch01-b02
          speaker: narrator
          text: >-
            姐妹俩感情非常好，每次一同出门，都手拉着手。
        - id: ch01-b03
          speaker: snow_white
          text: 我们两个永远也不分开。
        - id: ch01-b04
          speaker: rose_red
          text: 对，只要我们还活着，就永远不分开。
        - id: ch01-b05
          speaker: mother
          text: 你们记住，一个人有的东西，也要分给另一个。
        - id: ch01-b06
          speaker: narrator
          text: >-
            她们常常独自去林中采红浆果。那里的野兽从不伤害她们，反倒放心地走到身旁。小野兔从她们手中吃卷心菜叶，狍子挨着她们吃草，雄鹿欢快地跃过去，鸟儿停在树枝上，把会唱的歌都唱出来。
        - id: ch01-b07
          speaker: narrator
          text: >-
            姐妹俩从没遇上过任何祸事。有时她们在林子里待得太晚，夜色已经落下，就紧挨着躺在柔软的苔藓上，一直安睡到第二天清晨。母亲知道她们会这样，也知道她们会平安，所以从不为她们担心。
        - id: ch01-b08
          speaker: narrator
          text: >-
            有一次，晨光唤醒了在林中过夜的姐妹俩。一个漂亮的孩子正坐在旁边，身上的白衣闪闪发亮。他站起来，亲切地看了她们一眼，什么也没说，就走进了森林。姐妹俩这才看见，她们睡在悬崖边上。昨夜只要再向前几步，就会在黑暗中掉下去。
        - id: ch01-b09
          speaker: mother
          text: 那一定是守护好孩子的天使。
    - id: ch02
      title: 炉边的黑熊
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            白雪和红玫把小屋收拾得干干净净，谁走进去都会觉得赏心悦目。夏天，红玫照料屋子。每天清早，母亲还没醒，她会把一只花环放在床边，里面各有一朵白玫瑰和红玫瑰。冬天，白雪点起炉火，把擦得像金子一样亮的铜壶挂上炉钩。下雪的傍晚，母亲叫白雪闩好门，一家人便围着炉火坐下。母亲戴上眼镜，捧着大书念给女儿听。姐妹俩一边纺线，一边静静听着。她们脚边卧着小羊，身后的栖木上停着白鸽，脑袋藏在翅膀下。
        - id: ch02-b02
          speaker: narrator
          text: >-
            一天晚上，一家人正舒服地围坐在一起，门外突然传来敲门声。
        - id: ch02-b03
          speaker: mother
          text: 红玫，快去开门。大概是赶路的人想来避一避风雪。
        - id: ch02-b04
          speaker: narrator
          text: >-
            红玫拉开门闩，还以为外面站着一个可怜人。谁知一颗又宽又大的黑熊脑袋伸进了门。红玫吓得尖叫着跳开，小羊咩咩叫，白鸽拍起翅膀，白雪躲到了母亲的床后。
        - id: ch02-b05
          speaker: bear_prince
          text: 别害怕，我不会伤害你们。我快要冻僵了，只求让我在这里暖和一会儿。
          emotion: calm
        - id: ch02-b06
          speaker: mother
          text: 可怜的熊，到炉火边躺下吧，别让火烧到你的皮毛。
        - id: ch02-b07
          speaker: mother
          text: 白雪，红玫，都出来吧。他心地不坏，不会伤害你们。
        - id: ch02-b08
          speaker: narrator
          text: >-
            姐妹俩走了出来。过了一会儿，小羊和白鸽也不再怕熊，慢慢凑到他身边。
        - id: ch02-b09
          speaker: bear_prince
          text: 孩子们，来帮我拍一拍，把毛里的雪都弄掉吧。
        - id: ch02-b10
          speaker: narrator
          text: >-
            她们拿来扫帚，把熊皮上的雪扫得干干净净。熊伸展身体，卧在火边，舒服又满足地低声哼哼。孩子们很快就不再拘束，跟这个笨重的客人玩闹起来。她们用手扯他的毛，把脚踩到他背上，将他滚来滚去，有时还拿榛树枝抽他。熊一哼，她们就笑。熊总是好脾气地由着她们，只有闹得太过分时才出声。
        - id: ch02-b11
          speaker: bear_prince
          text: >-
            孩子们，饶我一命吧。白雪白，红玫红，难道要把爱人送了终？
        - id: ch02-b12
          speaker: narrator
          text: >-
            到了睡觉的时候，其他人都上床去了。
        - id: ch02-b13
          speaker: mother
          text: 你就留在炉边睡吧，这里不冷，也淋不到外面的风雪。
        - id: ch02-b14
          speaker: narrator
          text: >-
            天一亮，姐妹俩就打开门，让熊出去。他踏过白雪，慢悠悠地跑进森林。从那以后，熊每天晚上都在同一时辰来，躺在炉边，任凭孩子们怎么和他玩。大家渐渐习惯了这位黑朋友，每晚一定等他进门，才把门闩上。
    - id: ch03
      title: 被夹住的白胡子
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            春天来了，外面一片新绿。一天早晨，熊告诉白雪，他该走了。
        - id: ch03-b02
          speaker: bear_prince
          text: 这个夏天，我都不能再回来了。
        - id: ch03-b03
          speaker: snow_white
          text: 亲爱的熊，你要去什么地方呢？
          emotion: sad
        - id: ch03-b04
          speaker: bear_prince
          text: >-
            我要进森林守护财宝，不能让邪恶的矮人偷走。冬天大地冻得坚硬，他们困在地下，挖不出来。现在太阳把泥土晒暖了，他们会钻出地面，到处窥探偷窃。东西一落进他们手里，搬进洞穴，就很难再回到阳光下。
        - id: ch03-b05
          speaker: narrator
          text: >-
            白雪很舍不得他，还是走过去替他拉开了门闩。熊匆匆出门，皮毛在门闩上钩了一下，扯落一小块。白雪似乎瞧见皮毛下面闪出金光，却又不能确定。熊飞快地跑远，没多久就消失在树林后面。
        - id: ch03-b06
          speaker: narrator
          text: >-
            没过多久，母亲叫女儿们进森林捡柴。她们发现一棵砍倒在地的大树，树干旁有个东西在草里来回乱跳。起初谁也看不清那是什么。走近一瞧，原来是个矮人，长着一张干瘪的老脸，雪白的胡子足有一码长。胡子末梢卡在树缝里，他就像一条拴在绳上的狗，前后跳个不停，完全不知道该怎么办。
        - id: ch03-b07
          speaker: dwarf
          text: 你们还站着干什么？没看见我需要帮忙吗？
          emotion: angry
        - id: ch03-b08
          speaker: rose_red
          text: 小个子，你怎么会弄成这样？
        - id: ch03-b09
          speaker: dwarf
          text: >-
            你这又蠢又多事的呆鹅！我想劈点柴做饭。我们小个子吃得少，粗木头一下就会把那点饭烧焦，哪像你们这些粗俗又贪吃的人。我明明把楔子打稳了，谁知木头太滑，忽然弹开又合上，夹住了我漂亮的白胡子。现在我走不了，你们两个油光水滑的牛奶脸还敢笑。呸，真讨厌！
          emotion: angry
        - id: ch03-b10
          speaker: narrator
          text: >-
            两个孩子拼命拉，胡子却夹得太牢，怎么也拉不出来。
        - id: ch03-b11
          speaker: rose_red
          text: 我去找个人来帮忙。
        - id: ch03-b12
          speaker: dwarf
          text: >-
            你这没脑子的呆鹅！你们两个已经够多了，还找人来做什么？就想不出别的办法吗？
          emotion: angry
        - id: ch03-b13
          speaker: snow_white
          text: 先别急，我能帮你脱身。
          emotion: calm
        - id: ch03-b14
          speaker: narrator
          text: >-
            白雪从衣袋里拿出剪刀，剪掉胡子末梢。矮人一感觉自己脱了身，立刻抓起藏在树根间的袋子。那袋子沉甸甸的，里面装满了金子。
        - id: ch03-b15
          speaker: dwarf
          text: 粗野的家伙，竟然剪坏我的漂亮胡子。你们等着倒霉吧！
          emotion: angry
        - id: ch03-b16
          speaker: narrator
          text: >-
            他把袋子甩上背，连看也不看两个孩子，径自走了。
    - id: ch04
      title: 溪边与荒原
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            过了一阵，白雪和红玫去溪边捉鱼。她们远远看见一个像大蚱蜢的东西朝水边乱蹦，仿佛马上要跳下去。跑近才发现，又是那个矮人。
        - id: ch04-b02
          speaker: rose_red
          text: 你这是要去哪里？该不会真想跳进水里吧？
        - id: ch04-b03
          speaker: dwarf
          text: 我才没那么蠢！是这条该死的鱼想把我拖下去，你们看不见吗？
          emotion: angry
        - id: ch04-b04
          speaker: narrator
          text: >-
            矮人原本坐在溪边钓鱼。一阵风吹来，偏偏把他的胡子和钓线缠在了一起。这时，一条大鱼咬了钩。矮人身子瘦弱，根本没有力气把鱼拉上岸，反倒让鱼占了上风，一点点拖向溪水。他死死抓住周围的芦苇和灯心草，可一点用也没有。鱼怎么游，他就得怎么跟着移动，眼看就要被拖进水里。
        - id: ch04-b05
          speaker: narrator
          text: >-
            姐妹俩及时抓住矮人，试着解开钓线上的胡子。可是线和胡子缠成一团，她们只好用剪刀再剪掉一截。
        - id: ch04-b06
          speaker: dwarf
          text: >-
            你这毒菌子，把我的脸弄成这样，也叫有礼貌吗？剪了胡子尖还不够，这次连最好的一段也没了！我怎么去见自己人？真该让你跑穿鞋底！
          emotion: angry
        - id: ch04-b07
          speaker: narrator
          text: >-
            矮人从灯心草里拖出一袋珍珠，再也没说话，拉着袋子消失在石头后面。
        - id: ch04-b08
          speaker: narrator
          text: >-
            不久，母亲让两个孩子进城买针线、花边和丝带。路要穿过一片荒原，巨大的岩石东一块、西一块，散落得到处都是。姐妹俩看见一只大鸟在头顶缓缓盘旋，越飞越低，最后落在不远处的岩石旁。紧接着，一声响亮又凄惨的尖叫传了过来。她们赶紧跑过去，惊恐地看见一只鹰抓住了那个老相识，正要把他带走。
        - id: ch04-b09
          speaker: narrator
          text: >-
            两个孩子看他可怜，马上紧紧抓住矮人的身体，跟鹰拉扯起来。她们一直不肯松手，过了好一会儿，鹰终于丢下了猎物。矮人刚从最初的惊吓里缓过神来，就扯开尖嗓子骂了起来。
        - id: ch04-b10
          speaker: dwarf
          text: >-
            你们就不会轻一点吗？瞧瞧我的棕褐色外衣，被你们扯得到处是破洞。真是两个没用的笨家伙！
          emotion: angry
        - id: ch04-b11
          speaker: narrator
          text: >-
            他提起一袋宝石，又溜进了岩石下的洞里。两个姑娘早已习惯他的忘恩负义，继续赶路，到城里办完了事情。
    - id: ch05
      title: 熊皮落下以后
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            回家的路上，姐妹俩又经过荒原。矮人以为时候这么晚，不会再有人来，便把整袋宝石倒在一块干净的地上。夕阳落在晶莹的宝石上，各色光芒不停地闪烁跳动。两个孩子从没见过这么美的景象，不由得停下脚步，站在那里看个不停。
        - id: ch05-b02
          speaker: dwarf
          text: 你们张着嘴站在那里干什么？
          emotion: angry
        - id: ch05-b03
          speaker: narrator
          text: >-
            矮人气得灰白的脸变成了紫铜色。他正要把那些难听的话接着骂下去，忽然听见一声响亮的咆哮。一头黑熊从森林里慢慢跑来。矮人吓得跳起身，急忙想躲进自己的洞穴，可熊已经到了近前，他怎么也来不及了。
        - id: ch05-b04
          speaker: dwarf
          text: >-
            亲爱的熊先生，求您饶命！我的财宝都给您，这些漂亮的宝石全都给您。像我这么瘦小，吃进嘴里，您的牙缝都感觉不到。不如吃那两个坏姑娘吧。她们的肉很嫩，又胖得像小鹌鹑。求求您，吃她们吧！
          emotion: fearful
        - id: ch05-b05
          speaker: narrator
          text: >-
            熊根本不理他，只用熊掌打了这个邪恶的家伙一下。矮人倒下去，再也不动了。姐妹俩已经逃远，熊便朝她们喊。
        - id: ch05-b06
          speaker: bear_prince
          text: 白雪，红玫，别害怕。请等一等，我和你们一起走。
          emotion: calm
        - id: ch05-b07
          speaker: narrator
          text: >-
            姐妹俩听出了他的声音，停下脚步。熊走到她们面前，身上的熊皮忽然落下。站在那里的，竟是一位身穿金衣的英俊男子。
        - id: ch05-b08
          speaker: bear_prince
          text: >-
            我是国王的儿子。那个邪恶的矮人偷了我的财宝，还用魔法把我变成野熊。我只能在森林里四处奔走，直到他死去，我才恢复原来的模样。现在，他终于得到了应有的惩罚。
        - id: ch05-b09
          speaker: narrator
          text: >-
            后来，白雪嫁给了王子，红玫嫁给了王子的弟弟。姐妹俩平分了矮人聚在洞穴里的大批财宝。老母亲也和孩子们住在一起，安宁幸福地生活了许多年。她把花园里的两株玫瑰带到新家，让它们长在自己的窗前。从此年年都有最美的花盛开，一树洁白，一树鲜红。
