audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, grave, and quietly suspenseful
        timbre: clear and rounded
        pace: measured
        pitch: medium
    princess:
      display_name: The Youngest Princess
      tts:
        delivery: youthful, proud, and emotionally direct
        timbre: bright and clear
        pace: natural
        pitch: high
    frog_prince:
      display_name: The Frog Prince
      tts:
        delivery: patient, earnest, and gently courtly
        timbre: light and resonant
        pace: steady
        pitch: medium
    king:
      display_name: The King
      tts:
        delivery: dignified, firm, and fatherly
        timbre: deep and full
        pace: deliberate
        pitch: low
    faithful_henry:
      display_name: Faithful Henry
      tts:
        delivery: loyal, heartfelt, and respectful
        timbre: sturdy and warm
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Golden Ball
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Long ago, when wishes could still come true, there lived a king whose daughters were all beautiful. The youngest was so lovely that even the sun, which had seen almost everything, seemed amazed whenever it shone on her face. Near the King's castle stood a great, dark forest. Deep among the trees, beneath an old lime tree, there was a well. On very warm days, the young princess would sit beside its cool water. Whenever she grew bored, she played with her favorite toy, a golden ball, tossing it high and catching it again.
        - id: ch01-b02
          speaker: narrator
          text: >-
            One day, the ball missed her waiting hand. It struck the ground, rolled away, and dropped straight into the well. The princess watched it disappear. The water was so deep that she could not see the bottom. She began to cry, louder and louder, and nothing could comfort her. Then a voice spoke to her.
        - id: ch01-b03
          speaker: frog_prince
          text: >-
            What is wrong, King's daughter? You are crying so hard that even a stone would feel sorry for you.
        - id: ch01-b04
          speaker: narrator
          text: >-
            She turned toward the voice. A frog had lifted his thick, ugly head out of the water.
        - id: ch01-b05
          speaker: princess
          text: >-
            Oh, it's you, old water-splasher. I'm crying because my golden ball fell into the well.
          emotion: sad
        - id: ch01-b06
          speaker: frog_prince
          text: >-
            Please stop crying. I can get it for you. But what will you give me if I bring your favorite toy back?
        - id: ch01-b07
          speaker: princess
          text: >-
            Anything you want, dear frog. You may have my clothes, my pearls and jewels, even the golden crown on my head.
        - id: ch01-b08
          speaker: frog_prince
          text: >-
            I don't want your clothes, your pearls, your jewels, or your crown. But promise to love me and let me be your friend and playmate. Let me sit beside you at your little table, eat from your little golden plate, drink from your little cup, and sleep in your little bed. If you promise me all that, I'll dive down and bring up your golden ball.
        - id: ch01-b09
          speaker: princess
          text: >-
            Yes, yes, I promise you everything. Just bring my ball back!
        - id: ch01-b10
          speaker: narrator
          text: >-
            But in her heart she thought the frog was talking nonsense. He lived in the water with the other frogs and did nothing but croak. How could he ever be a human being's friend?
        - id: ch01-b11
          speaker: narrator
          text: >-
            Once he had her promise, the frog dipped his head beneath the water and sank out of sight. Before long, he swam back with the ball in his mouth and tossed it onto the grass. The princess was delighted. She snatched up her beautiful toy and ran away.
        - id: ch01-b12
          speaker: frog_prince
          text: >-
            Wait! Wait for me! Take me with you. I can't run as fast as you can!
        - id: ch01-b13
          speaker: narrator
          text: >-
            He called after her with the loudest croaks he could make, but it did no good. She never looked back. She hurried home, soon forgot the poor frog, and left him to return to his well.
    - id: ch02
      title: A Knock at the Door
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The next day, the princess sat at the royal table with her father and all his courtiers, eating from her little golden plate. Then something came creeping up the marble staircase. Splish, splash. Splish, splash. When it reached the top, it knocked on the door and called out.
        - id: ch02-b02
          speaker: frog_prince
          text: >-
            Princess! Youngest princess! Open the door for me!
        - id: ch02-b03
          speaker: narrator
          text: >-
            She ran to see who was there. The moment she opened the door and saw the frog, she slammed it shut again. She rushed back to the table, badly frightened. The King could see her heart pounding.
        - id: ch02-b04
          speaker: king
          text: >-
            My child, what has scared you so? Is there a giant outside who wants to carry you away?
        - id: ch02-b05
          speaker: princess
          text: >-
            Oh, no. It isn't a giant. It's a disgusting frog.
          emotion: disgusted
        - id: ch02-b06
          speaker: king
          text: >-
            And what does a frog want from you?
        - id: ch02-b07
          speaker: princess
          text: >-
            Father, yesterday I was playing beside the well in the forest, and my golden ball fell into the water. I cried so much that the frog brought it back for me. He kept insisting, so I promised he could be my companion. I never thought he could leave the water! Now he's outside, and he wants to come in.
        - id: ch02-b08
          speaker: narrator
          text: >-
            While she was speaking, the frog knocked a second time.
        - id: ch02-b09
          speaker: frog_prince
          text: >-
            Princess, youngest princess, open the door for me! Have you forgotten what you told me yesterday beside the cool water of the well? Princess, youngest princess, open the door for me!
        - id: ch02-b10
          speaker: king
          text: >-
            You must do what you promised. Go and let him in.
        - id: ch02-b11
          speaker: narrator
          text: >-
            The princess opened the door. The frog hopped inside and followed her step by step, all the way to her chair.
        - id: ch02-b12
          speaker: frog_prince
          text: >-
            Lift me up beside you.
        - id: ch02-b13
          speaker: narrator
          text: >-
            She kept putting it off until the King finally ordered her to obey. Once the frog was on the chair, he wanted to be on the table. When she placed him there, he spoke again.
        - id: ch02-b14
          speaker: frog_prince
          text: >-
            Slide your little golden plate closer. Then we can eat together.
        - id: ch02-b15
          speaker: narrator
          text: >-
            She did as he asked, though anyone could see she hated doing it. The frog enjoyed his meal. But every bite the princess tried to swallow nearly stuck in her throat. At last, the frog had eaten enough.
        - id: ch02-b16
          speaker: frog_prince
          text: >-
            I'm full now, and I'm tired. Carry me to your little room, make your silken bed ready, and we'll both lie down to sleep.
    - id: ch03
      title: The Enchantment Breaks
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The princess began to cry. She was afraid of the cold frog. She could hardly bear to touch him, and now he expected to sleep in her pretty, clean bed. But the King grew angry.
        - id: ch03-b02
          speaker: king
          text: >-
            When someone helps you in your time of need, you must not despise him afterward.
          emotion: angry
        - id: ch03-b03
          speaker: narrator
          text: >-
            So she picked up the frog with two fingers, carried him upstairs, and set him in a corner. But after she climbed into bed, he crept over to her.
        - id: ch03-b04
          speaker: frog_prince
          text: >-
            I'm tired, and I want to sleep too. Lift me onto the bed, or I'll tell your father.
        - id: ch03-b05
          speaker: narrator
          text: >-
            At that, the princess became terribly angry. She seized the frog and threw him against the wall with all her strength.
        - id: ch03-b06
          speaker: princess
          text: >-
            Now you'll finally be quiet, you horrible frog!
          emotion: angry
        - id: ch03-b07
          speaker: narrator
          text: >-
            But when he fell, he was no longer a frog. He had become a king's son with beautiful, kind eyes. Her father wished the prince to be her dear companion and husband. The prince told her that a wicked witch had enchanted him. No one but the princess could have freed him from the well. He told her that the next day, they would travel together to his kingdom.
        - id: ch03-b08
          speaker: narrator
          text: >-
            Then they went to sleep.
    - id: ch04
      title: Faithful Henry
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            The next morning, the sun woke them. A carriage arrived, drawn by eight white horses. White ostrich feathers nodded on their heads, and they wore harnesses of golden chains. Standing behind the carriage was the young King's servant, Faithful Henry.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Henry had been so unhappy when his master was changed into a frog that he had ordered three iron bands fastened around his heart. Without them, he feared his heart would burst from grief and sorrow. Now the carriage had come to take the young King home to his kingdom. Henry helped the couple inside, then took his place behind them. His master's freedom filled him with joy.
        - id: ch04-b03
          speaker: narrator
          text: >-
            After they had traveled some distance, the young King heard a loud crack behind him, as if something had broken. He turned around and called to his servant.
        - id: ch04-b04
          speaker: frog_prince
          text: >-
            Henry, the carriage is breaking!
        - id: ch04-b05
          speaker: faithful_henry
          text: >-
            No, master, the carriage is safe. That was one of the iron bands around my heart. I had them put there because my pain was so great when you were a frog, trapped down in the well.
        - id: ch04-b06
          speaker: narrator
          text: >-
            Twice more during the journey, a cracking sound rang out. Each time, the young King thought the carriage was breaking. But it was only the iron bands springing away from Faithful Henry's heart, because his master was free and happy once again.
