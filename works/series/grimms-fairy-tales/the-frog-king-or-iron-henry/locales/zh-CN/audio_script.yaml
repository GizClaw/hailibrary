audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 从容而富有童话讲述感
        timbre: 温暖清澈
        pace: 舒缓有变化
        pitch: 中等
    princess:
      display_name: 小公主
      tts:
        delivery: 娇贵直率，情绪来得快
        timbre: 清亮稚嫩
        pace: 轻快
        pitch: 偏高
    frog_prince:
      display_name: 青蛙王子
      tts:
        delivery: 做青蛙时执着坦率，恢复人形后温和沉着
        timbre: 年轻而明朗
        pace: 从容
        pitch: 中等
    king:
      display_name: 国王
      tts:
        delivery: 威严正直，话语坚定
        timbre: 低沉厚实
        pace: 稳健
        pitch: 偏低
    faithful_henry:
      display_name: 忠仆亨利
      tts:
        delivery: 忠诚恳切，喜悦中带着深情
        timbre: 朴实温厚
        pace: 沉稳
        pitch: 中低
  chapters:
    - id: ch01
      title: 掉进深井的金球
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，许愿还会灵验。有位国王，他的女儿个个美丽，小女儿尤其动人。就连见过无数奇景的太阳，每次照到她脸上，也会惊叹。城堡旁有一片幽暗的大森林，林中一棵老椴树下藏着一口深井。天气很热时，小公主常走进森林，坐在清凉的井边。觉得无聊了，她就拿出最心爱的金球，高高抛起，再伸手接住。
        - id: ch01-b02
          speaker: narrator
          text: 有一回，金球没有落进公主伸出的小手，而是掉到旁边的地上，一直滚进了井水。公主眼睁睁看着它消失。可井太深了，连井底都望不见。她哭了起来，声音越来越大，谁也劝不住。就在这时，一个声音从水边传来，问她出了什么事，怎么哭得连石头都要心疼。公主循声望去，一只青蛙正从水里探出又粗又丑的脑袋。
        - id: ch01-b03
          speaker: princess
          text: 原来是你呀，老水洼客！我的金球掉进井里了，我正为它哭呢。
          emotion: sad
        - id: ch01-b04
          speaker: frog_prince
          text: 别哭了，我能帮你。可我要是替你捞回玩具，你拿什么来谢我？
        - id: ch01-b05
          speaker: princess
          text: 你想要什么都行。我的衣裳、珍珠和宝石，连头上的金冠也可以给你。
        - id: ch01-b06
          speaker: frog_prince
          text: 那些东西我都不要。我要你喜欢我，让我陪你玩，坐在你的小桌旁，用你的小金盘吃饭，用你的小杯子喝水，还要睡在你的小床上。你答应这些，我就潜下去，把金球捞上来。
        - id: ch01-b07
          speaker: princess
          text: 好呀，只要你把球还给我，你说的我全都答应。
        - id: ch01-b08
          speaker: narrator
          text: 嘴上虽然这样说，公主心里却觉得，这只傻青蛙尽说胡话。它只会和别的青蛙住在水里呱呱叫，怎么可能给人做伴呢？
    - id: ch02
      title: 门外的客人
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 青蛙得到承诺，低下头，沉进了井水。不一会儿，它嘴里衔着金球游回来，把球抛上草地。公主见漂亮的玩具失而复得，高兴极了，捡起来转身就跑。
        - id: ch02-b02
          speaker: frog_prince
          text: 等一等，带我一起走！我可跑不了你那么快。
        - id: ch02-b03
          speaker: narrator
          text: 青蛙在身后扯开嗓子，拼命呱呱叫。可不管它叫得多响，公主就是不听。她一口气跑回家，很快便把这只可怜的青蛙忘得一干二净。青蛙没办法，只好重新回到井里。
        - id: ch02-b04
          speaker: narrator
          text: 第二天，公主和国王、满朝大臣坐在桌旁，正用自己的小金盘吃饭，忽然听见有东西啪嗒啪嗒、啪嗒啪嗒地爬上大理石楼梯。它爬到最上面，来到门前，敲响了门。
        - id: ch02-b05
          speaker: frog_prince
          text: 公主，最小的公主，快给我开门！
        - id: ch02-b06
          speaker: narrator
          text: 公主跑过去，想看看门外是谁。门一打开，青蛙就蹲在她面前。她吓得赶紧砰一声关上门，又回到桌旁继续吃饭。国王一眼看出她心跳得厉害，便问门外是不是有个巨人，想要把她抓走。
        - id: ch02-b07
          speaker: princess
          text: 不是巨人，是一只恶心的青蛙。
          emotion: fearful
        - id: ch02-b08
          speaker: king
          text: 一只青蛙找你做什么？
        - id: ch02-b09
          speaker: princess
          text: 昨天我在森林的井边玩，金球掉进了水里。我哭得很伤心，是青蛙替我捞了回来。它非要我答应让它做伙伴，我只好答应，可我哪想到它真能离开井水！现在它就在外面，非要进来。
        - id: ch02-b10
          speaker: narrator
          text: 这时，青蛙又敲起门来。
        - id: ch02-b11
          speaker: frog_prince
          text: 公主呀，最小的公主！快快开门让我进去！难道你忘了昨天在清凉的井边，亲口对我许下的诺言？公主呀，最小的公主！快快开门让我进去！
    - id: ch03
      title: 必须兑现的承诺
      blocks:
        - id: ch03-b01
          speaker: king
          text: 答应过的事，就一定要做到。去给它开门吧。
        - id: ch03-b02
          speaker: narrator
          text: 公主只得开门。青蛙跳进来，一步一步跟着她，来到椅子边，叫她把自己抱上去。公主迟迟不肯动，直到国王下令才照办。青蛙上了椅子，又要坐到桌上。等公主把它放上桌，它还想和她同吃一盘饭。
        - id: ch03-b03
          speaker: frog_prince
          text: 把你的小金盘推过来一点，我们一起吃吧。
        - id: ch03-b04
          speaker: narrator
          text: 公主虽然把小金盘推了过去，谁都看得出她有多不情愿。青蛙吃得津津有味，她却每吃一口都像被噎住，怎么也咽不下去。
        - id: ch03-b05
          speaker: frog_prince
          text: 我吃饱了，也累了。带我去你的小房间，把绸缎小床铺好，我们一起睡觉。
        - id: ch03-b06
          speaker: narrator
          text: 公主听了便哭起来。她害怕这只冰凉的青蛙，连碰都不愿意碰，如今它竟还要睡进自己漂亮又干净的小床。国王见状，生气地训斥她。
        - id: ch03-b07
          speaker: king
          text: 它在你有难时帮助过你，你事后就不该轻视它。
          emotion: angry
        - id: ch03-b08
          speaker: narrator
          text: 公主只好用两根手指捏起青蛙，带到楼上，把它放在墙角。等她上了床，青蛙又爬了过来。
        - id: ch03-b09
          speaker: frog_prince
          text: 我也累了，也要睡觉。把我抱上床，不然我就去告诉你父亲。
        - id: ch03-b10
          speaker: narrator
          text: 公主气坏了。她抓起青蛙，用尽力气把它摔向墙壁。
        - id: ch03-b11
          speaker: princess
          text: 这下你该安静了吧，你这讨厌的青蛙！
          emotion: angry
        - id: ch03-b12
          speaker: narrator
          text: 可青蛙落下来时，已经不再是青蛙，竟变成了一位双眼温柔明亮的王子。按照父亲的意愿，他从此成了公主亲爱的伴侣和丈夫。王子告诉她，自己中了一个恶毒女巫的魔法，除了公主，谁也不能把他从井中解救出来。到了明天，两人就会一起回他的王国。说完，他们便睡下了。
    - id: ch04
      title: 忠仆亨利的铁箍
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 第二天早晨，太阳唤醒他们时，一辆马车已经驶来。车前套着八匹白马，每匹马头上都插着白色鸵鸟羽毛，身上系着金链。车后站着年轻王子的仆人忠仆亨利。主人变成青蛙以后，亨利悲痛欲绝，唯恐自己的心会因哀伤而裂开，便让人用三道铁箍把心紧紧箍住。
        - id: ch04-b02
          speaker: narrator
          text: 这辆马车是来接王子回国的。亨利扶王子和公主上车，自己又站回车后。看到主人终于获救，他满心欢喜。马车走了一段路，王子忽然听见身后咔嚓一响，仿佛有什么东西断了。他连忙转过身去。
        - id: ch04-b03
          speaker: frog_prince
          text: 亨利，马车裂开了！
          emotion: surprised
        - id: ch04-b04
          speaker: faithful_henry
          text: 不，主人，不是马车。那是我心上的一道铁箍。您变成青蛙，被困在井里时，我痛苦极了，才让人把它箍在心上。
        - id: ch04-b05
          speaker: narrator
          text: 一路上，又接连响了两声。王子每次都以为马车裂了，其实，是忠仆亨利心上的铁箍一道道崩开。因为他的主人已经自由，也终于得到了幸福。
