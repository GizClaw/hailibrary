  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and steady folktale storytelling
        timbre: clear and gently resonant
        pace: measured
        pitch: medium
    girl:
      display_name: Little Girl
      tts:
        delivery: gentle and sincere, with quiet faith
        timbre: young and clear
        pace: measured
        pitch: high
    poor_man:
      display_name: Poor Man
      tts:
        delivery: weary and pleading
        timbre: thin and rough
        pace: slow
        pitch: low
    first_child:
      display_name: First Child
      tts:
        delivery: soft and mournful
        timbre: young and light
        pace: slow
        pitch: high
    third_child:
      display_name: Third Child
      tts:
        delivery: timid and pleading
        timbre: young and clear
        pace: measured
