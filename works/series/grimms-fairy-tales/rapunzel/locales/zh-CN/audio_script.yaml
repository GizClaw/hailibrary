audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静而有童话叙事感
        timbre: 温暖清晰
        pace: 舒缓
        pitch: 中音
    husband:
      display_name: 丈夫
      tts:
        delivery: 忠厚而忧心
        timbre: 朴实温和
        pace: 适中
        pitch: 中低音
    wife:
      display_name: 妻子
      tts:
        delivery: 虚弱而急切
        timbre: 柔和
        pace: 稍慢
        pitch: 中音
    enchantress:
      display_name: 女巫
      tts:
        delivery: 威严冷厉
        timbre: 低沉锐利
        pace: 稳健
        pitch: 中低音
    rapunzel:
      display_name: 莴苣姑娘
      tts:
        delivery: 真挚清亮
        timbre: 柔美明净
        pace: 适中
        pitch: 中高音
    prince:
      display_name: 王子
      tts:
        delivery: 诚恳坚定
        timbre: 年轻清朗
        pace: 适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 高墙后的花园
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，有一对夫妻盼了许多年，一直想要个孩子。后来，妻子终于觉得，上帝就要让她如愿了。他们家后墙有扇小窗，从那里望出去，能看见一座美丽的花园。园里开满鲜花，也长满青翠的草木。可是四周全是高墙，谁也不敢进去。那是一个女巫的园子，她法力高强，世上的人都怕她。
        - id: ch01-b02
          speaker: narrator
          text: >-
            一天，妻子站在窗前，看见园里有一畦莴苣，长得又鲜又绿。她太想尝一尝了，而且一天比一天想得厉害。可她知道自己拿不到，便越来越憔悴，脸色也变得苍白凄苦。丈夫看了很害怕，连忙问她。
        - id: ch01-b03
          speaker: husband
          text: 亲爱的妻子，你究竟怎么了？
        - id: ch01-b04
          speaker: wife
          text: 要是吃不到屋后花园里的莴苣，我会死的。
          emotion: sad
        - id: ch01-b05
          speaker: narrator
          text: >-
            丈夫深爱着她。他想，不能眼看妻子死去，无论付出什么代价，也得亲自给她弄些莴苣来。黄昏时，他翻过高墙，溜进女巫的花园，匆匆抓了一把莴苣带回家。妻子马上把莴苣拌成沙拉，吃得津津有味。谁知第二天，她对莴苣的馋念比原来还强了三倍。丈夫要想得片刻安宁，只能再去一次。
        - id: ch01-b06
          speaker: narrator
          text: >-
            天暗下来，他又翻墙进了花园。双脚才落地，他就吓坏了，因为女巫正站在面前，怒目瞪着他。
        - id: ch01-b07
          speaker: enchantress
          text: 你好大的胆子！竟敢翻进我的花园，像贼一样偷我的莴苣！我一定要惩罚你！
          emotion: angry
        - id: ch01-b08
          speaker: husband
          text: >-
            求您宽恕我吧。我实在没有别的办法。妻子从窗口看见了您的莴苣，馋得不得了。她说，要是吃不到一点，就会死的。
          emotion: fearful
        - id: ch01-b09
          speaker: narrator
          text: 女巫听完，怒气稍稍平息了。
        - id: ch01-b10
          speaker: enchantress
          text: >-
            要真是这样，你想拿多少莴苣都可以。不过我有一个条件。你妻子生下孩子后，必须把孩子交给我。我会好好待她，像母亲一样照料她。
        - id: ch01-b11
          speaker: narrator
          text: >-
            男人吓得什么都答应了。妻子临盆时，女巫立刻出现。她给孩子取名叫莴苣姑娘，随后把孩子带走了。
    - id: ch02
      title: 没有门的高塔
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            莴苣姑娘渐渐长大，成了天底下最美丽的孩子。十二岁那年，女巫把她关进森林里的一座高塔。塔上没有楼梯，也没有门，只有最顶端开着一扇小窗。女巫想进去时，就站在塔下喊她。
        - id: ch02-b02
          speaker: enchantress
          text: |-
            莴苣姑娘，莴苣姑娘，
            把你的长发放下来。
        - id: ch02-b03
          speaker: narrator
          text: >-
            莴苣姑娘有一头极美的长发，细柔得像纺出的金丝。听见女巫的声音，她就解开辫子，把长发绕在窗边的钩子上。头发一直垂下二十厄尔，女巫便攀着它爬上塔去。
    - id: ch03
      title: 森林里的歌声
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            一两年后，王子骑马穿过森林，从高塔旁经过。他忽然听见一阵美妙的歌声，便停下来倾听。唱歌的是莴苣姑娘。她一个人住在塔里，只能用甜美的歌声排遣时光。王子想爬上去见她，可绕着塔找了又找，根本没有门。他只好回去。那歌声却深深打动了他的心，让他念念不忘。从那以后，他每天都来森林里听她唱歌。
        - id: ch03-b02
          speaker: narrator
          text: 有一天，王子站在一棵树后，看见女巫走到塔下，又听见她喊道。
        - id: ch03-b03
          speaker: enchantress
          text: |-
            莴苣姑娘，莴苣姑娘，
            把你的长发放下来。
        - id: ch03-b04
          speaker: narrator
          text: 莴苣姑娘放下长辫，女巫攀着辫子上去了。
        - id: ch03-b05
          speaker: prince
          text: 原来这就是上塔的梯子。那我也来碰碰运气。
        - id: ch03-b06
          speaker: narrator
          text: 第二天傍晚，天色刚暗，王子便来到塔下，照着听来的话喊起来。
        - id: ch03-b07
          speaker: prince
          text: |-
            莴苣姑娘，莴苣姑娘，
            把你的长发放下来。
        - id: ch03-b08
          speaker: narrator
          text: 长发立刻垂了下来，王子攀着它上了塔。
    - id: ch04
      title: 丝线织成的梯子
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            莴苣姑娘起初怕得厉害，因为她从没见过这样的男人。王子却像朋友一样亲切地跟她说话。他告诉她，她的歌声深深撼动了他的心，叫他再也不能安宁，所以他非来见她不可。莴苣姑娘慢慢不怕了。王子问她愿不愿意嫁给自己。她看着年轻英俊的王子，心想，他一定会比年老的戈特尔婆婆更爱我。于是，她答应了，把手放进王子手中。
        - id: ch04-b02
          speaker: rapunzel
          text: >-
            我愿意跟你走，可我不知道怎么下塔。你每次来，都给我带一绞丝线吧。我会把丝线织成梯子。等梯子织好，我就爬下去，你再骑马带我离开。
        - id: ch04-b03
          speaker: narrator
          text: >-
            两人说好，在梯子织成以前，王子每天傍晚都来，因为戈特尔婆婆总在白天出现。女巫一直没有察觉，直到有一次，莴苣姑娘无意间问她。
        - id: ch04-b04
          speaker: rapunzel
          text: 戈特尔婆婆，为什么拉您的时候这么沉，拉年轻的王子却轻得多？他一转眼就到我身边了。
        - id: ch04-b05
          speaker: enchantress
          text: 你这个坏丫头！我听见了什么？我以为早就把你和全世界隔开了，你竟敢骗我！
          emotion: angry
        - id: ch04-b06
          speaker: narrator
          text: >-
            女巫怒火冲天，一把揪住莴苣姑娘美丽的长发，在左手上缠了两圈，右手拿起剪刀。咔嚓，咔嚓，长发被剪断了，那对漂亮的辫子落在地上。她毫不留情，又把可怜的莴苣姑娘赶进一片荒野，让她在那里受尽悲苦和煎熬。
    - id: ch05
      title: 两滴眼泪
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            就在赶走莴苣姑娘的那天，女巫把剪下来的辫子系在窗钩上。傍晚，王子来到塔下，又喊起那两句话。
        - id: ch05-b02
          speaker: prince
          text: |-
            莴苣姑娘，莴苣姑娘，
            把你的长发放下来。
        - id: ch05-b03
          speaker: narrator
          text: >-
            女巫把长发放下去。王子爬上塔，看见的不是心爱的莴苣姑娘，而是恶狠狠盯着他的女巫。她的目光就像毒汁一样。
        - id: ch05-b04
          speaker: enchantress
          text: >-
            哈！你想来接心上人吗？那只美丽的小鸟已经不在巢里唱歌了。猫把她叼走了，还要抓瞎你的双眼！你永远失去莴苣姑娘了，再也别想见到她！
        - id: ch05-b05
          speaker: narrator
          text: >-
            王子痛不欲生，绝望地从塔上跳下。他保住了性命，落进荆棘丛时，尖刺却扎瞎了他的双眼。从此，他什么也看不见，只能在森林里四处流浪。他只吃草根和浆果，每天都为失去心爱的妻子悲叹流泪。
        - id: ch05-b06
          speaker: narrator
          text: >-
            他就这样凄苦地漂泊了好几年，终于来到莴苣姑娘栖身的荒野。莴苣姑娘已经生下一对双胞胎，一个男孩，一个女孩，母子三人生活得十分困苦。王子听见一个声音，觉得说不出的熟悉，便朝声音传来的方向走去。
        - id: ch05-b07
          speaker: narrator
          text: >-
            等他走近，莴苣姑娘认出了他，一下扑到他颈上，哭了起来。两滴眼泪落进王子的眼睛，他的双眼立刻恢复清明，又能像从前一样看见了。王子带着她回到自己的王国，举国上下都欢喜地迎接他们。
        - id: ch05-b08
          speaker: narrator
          text: 从此，他们幸福知足地生活了许多年。
