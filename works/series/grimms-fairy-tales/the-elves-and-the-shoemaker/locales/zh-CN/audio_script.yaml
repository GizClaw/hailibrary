audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温厚从容，带着古老童话的神秘感
        timbre: 温暖清澈
        pace: 舒缓而有变化
        pitch: 中音
    shoemaker:
      display_name: 鞋匠
      tts:
        delivery: 朴实诚恳，说话稳重
        timbre: 温和厚实
        pace: 不疾不徐
        pitch: 中低音
    wife:
      display_name: 鞋匠的妻子
      tts:
        delivery: 热心爽快，语气亲切
        timbre: 柔和明亮
        pace: 自然而利落
        pitch: 中高音
    little_men:
      display_name: 两个小人儿
      tts:
        delivery: 轻快活泼，歌唱时充满欢喜
        timbre: 清亮轻盈
        pace: 明快
        pitch: 高音
  chapters:
    - id: ch01
      title: 第一个故事
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有个鞋匠。他没有做错什么，日子却越过越穷，到最后，手里只剩下够做一双鞋的皮料。一天晚上，他把皮料照着鞋样裁好，准备天亮以后再动手。他心里坦荡，睡前把自己托付给上帝，便安安稳稳地睡着了。
        - id: ch01-b02
          speaker: narrator
          text: 第二天早晨，鞋匠做完祷告，刚要坐到桌边干活，就看见那双鞋已经做好了，正整整齐齐地摆在桌上。他吃惊得说不出话，拿起鞋翻来覆去地看。每一针都缝得又细又匀，连一处毛病也找不到，简直是一件拿来展示手艺的杰作。
        - id: ch01-b03
          speaker: narrator
          text: 不久，一位顾客进了店。他一眼就喜欢上这双鞋，付的钱比平常还多。鞋匠拿这些钱买回皮料，足够做两双鞋。夜里，他照旧把皮料裁好。第二天起床一看，两双鞋又全做好了，根本不用他动手。顾客接连来买鞋，留下的钱又够买四双鞋的皮料。再过一夜，四双鞋也做好了。
        - id: ch01-b04
          speaker: narrator
          text: 就这样，鞋匠每晚裁好皮料，第二天早晨总能看见做好的鞋。他重新靠诚实的手艺过上了自立的生活，后来还成了富裕的人。
        - id: ch01-b05
          speaker: narrator
          text: 圣诞节快到的时候，一天晚上，鞋匠裁完皮料，临睡前和妻子商量起来。
        - id: ch01-b06
          speaker: shoemaker
          text: 今晚咱们别睡了，留下来看看吧。我真想知道，一直帮咱们干活的究竟是谁。你说呢？
        - id: ch01-b07
          speaker: narrator
          text: 妻子觉得这个主意很好。她点亮蜡烛，两个人躲进房间一角，藏在挂着的衣服后面，静静等着。午夜一到，两个漂亮的赤身小人儿走了进来。他们坐到桌边，拿起裁好的皮料，小手飞快地缝着、绱着、敲着。那动作又熟练又麻利，鞋匠看得眼睛都舍不得眨一下。
        - id: ch01-b08
          speaker: narrator
          text: 两个小人儿一刻也没有停。等所有鞋子都做好，齐齐摆上桌面，他们马上跑走了。
        - id: ch01-b09
          speaker: narrator
          text: 第二天早晨，妻子想起昨夜看到的一切，对鞋匠说出了自己的打算。
        - id: ch01-b10
          speaker: wife
          text: 是这两个小人儿让咱们富了起来，咱们可得好好谢谢他们。他们什么也没穿，总这么跑来跑去，一定冻得慌。这样吧，我给他们做小衬衫、小外套、小背心和小裤子，再给每人织一双袜子。你也给他们做两双小鞋，好不好？
        - id: ch01-b11
          speaker: shoemaker
          text: 好啊，我很愿意给他们做。
        - id: ch01-b12
          speaker: narrator
          text: 等礼物全都做好，一天夜里，夫妻俩没有往桌上放裁好的皮料，而是把那些小衣裳和小鞋整齐地摆在那里。他们又躲到一旁，等着看小人儿会怎样。
        - id: ch01-b13
          speaker: narrator
          text: 午夜时分，两个小人儿蹦蹦跳跳地来了。他们本想马上干活，却没找到皮料，只看到一件件漂亮的小衣裳。两个人先是一愣，接着高兴极了。他们飞快地把衣裳穿好，一边穿，一边唱了起来。
        - id: ch01-b14
          speaker: little_men
          text: 如今我们穿得俏，何必还把鞋来造？
          emotion: happy
        - id: ch01-b15
          speaker: narrator
          text: 两个小人儿又蹦又跳，越过椅子，跃过长凳，最后一路舞出了门。从那以后，他们再也没有来过。不过，鞋匠的一生始终过得很好，不管做什么，事事都顺利兴旺。
