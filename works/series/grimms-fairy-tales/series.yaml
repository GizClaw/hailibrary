cover_prompt: |-
  A wordless cover gathers familiar Grimm tale motifs in a deep German woodland of an undefined old folk-tale past. A red-hooded child with a wicker basket follows a path, two children discover a cottage trimmed with bread and sweets, a long golden braid descends from a stone tower, and a white goose walks beneath an apple tree. At the center, four animal musicians—a gray donkey, brown dog, striped cat, and red-combed rooster—balance joyfully one above another. Their improbable musical tower is the focal action, while the other motifs remain smaller discoveries among the trees. Use a gently elevated theatrical composition with layered forest clearings and generous pale evening sky above the canopy. Keep every figure original, friendly, and rooted in the old tales, avoiding all film, animation, and commercial character designs. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
