audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉稳而有童话讲述感
        timbre: 温暖清晰
        pace: 舒缓有变化
        pitch: 中音
    miller:
      display_name: 磨坊主
      tts:
        delivery: 爱夸口又故作体面
        timbre: 粗朴明亮
        pace: 稍快
        pitch: 中低音
    king:
      display_name: 国王
      tts:
        delivery: 威严贪婪而不容置疑
        timbre: 厚重冷硬
        pace: 稳定
        pitch: 低音
    queen:
      display_name: 磨坊主的女儿与王后
      tts:
        delivery: 真挚柔和且随处境变化
        timbre: 清亮年轻
        pace: 中等
        pitch: 中高音
    manikin:
      display_name: 小矮人
      tts:
        delivery: 神秘机敏并带几分尖刻
        timbre: 细而有力
        pace: 灵活
        pitch: 高音
    messenger:
      display_name: 使者
      tts:
        delivery: 忠实直接且善于叙述
        timbre: 清楚朴实
        pace: 中等
        pitch: 中音
  chapters:
    - id: ch01
      title: 国王的考验
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个贫穷的磨坊主，他有一个很美的女儿。有一天，他进宫去见国王。为了让自己显得了不起，他竟夸起了女儿。
        - id: ch01-b02
          speaker: miller
          text: 我的女儿有一门了不得的本事，她能把稻草纺成金子。
        - id: ch01-b03
          speaker: king
          text: 这本事我喜欢。她要真有你说的那么能干，明天就带她进宫，让我亲眼瞧瞧。
        - id: ch01-b04
          speaker: narrator
          text: 第二天，姑娘被带到宫里。国王把她领进一间塞满稻草的屋子，又摆下一架纺车和一个线轴。
        - id: ch01-b05
          speaker: king
          text: 马上开始纺。明天一早，要是这些稻草还没全变成金子，你就得死。
        - id: ch01-b06
          speaker: narrator
          text: 国王亲手锁上门，把姑娘一个人留在里面。她哪知道怎样把稻草纺成金子？无论如何也想不出活命的办法。她越想越绝望，最后只能坐在那里哭。
    - id: ch02
      title: 两夜金光
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 门忽然开了，一个小矮人走了进来。
        - id: ch02-b02
          speaker: manikin
          text: 晚上好，磨坊家的姑娘。你怎么哭成这样？
        - id: ch02-b03
          speaker: queen
          text: 我得把满屋稻草纺成金子，可我一点儿也不会。
          emotion: sad
        - id: ch02-b04
          speaker: manikin
          text: 要是我替你纺，你愿意拿什么来换？
        - id: ch02-b05
          speaker: queen
          text: 我把项链给你。
        - id: ch02-b06
          speaker: narrator
          text: 小矮人收下项链，坐到纺车前。纺车呼噜噜转了三圈，一个线轴就满了。他换上第二个线轴，又是呼噜噜三圈，很快也缠得满满的。他就这样一个接一个地换着线轴，不停地纺到天亮。满屋稻草都纺完了，所有线轴上都缠满了金子。
        - id: ch02-b07
          speaker: narrator
          text: 天才刚亮，国王便赶来了。他看到满屋金子，又吃惊又高兴，可心里也更加贪婪。他把姑娘送进另一间更大的屋子，里面照样堆满稻草，还命令她用一夜全部纺成金子，不然就要她的命。姑娘没有办法，又哭了起来。这时，门再次打开，小矮人又出现了。
        - id: ch02-b08
          speaker: manikin
          text: 这回我也能替你纺。你还有什么可以给我？
        - id: ch02-b09
          speaker: queen
          text: 我把手上的戒指给你。
        - id: ch02-b10
          speaker: narrator
          text: 小矮人拿走戒指，再次转起纺车。到了早晨，所有稻草又都成了亮闪闪的金子。
    - id: ch03
      title: 第三个约定
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 国王看得欢喜极了，却还是觉得金子不够。他又把姑娘带进一间更大的屋子，那里照旧堆满稻草，比前两次还多。
        - id: ch03-b02
          speaker: king
          text: 今夜把这些也纺成金子。你要是办得到，我就娶你做王后。
        - id: ch03-b03
          speaker: narrator
          text: 国王心想，就算她只是磨坊主的女儿，世上也再找不到比她更富有的新娘了。姑娘独自留在屋里，小矮人第三次来到她面前。
        - id: ch03-b04
          speaker: manikin
          text: 这一次，你要拿什么换我替你纺？
        - id: ch03-b05
          speaker: queen
          text: 我什么也没有了，再也拿不出东西给你。
        - id: ch03-b06
          speaker: manikin
          text: 那就答应我。将来你要是真做了王后，第一个孩子得给我。
        - id: ch03-b07
          speaker: narrator
          text: 姑娘心想，谁知道自己会不会真有那么一天呢？可眼前找不到别的活路，她只好答应。小矮人又替她把稻草全纺成了金子。早晨，国王见屋里一切都合心意，便娶了她。磨坊主美丽的女儿就这样做了王后。
    - id: ch04
      title: 三天期限
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 一年过去，王后生下一个漂亮的孩子。她早已把小矮人忘了。没想到，小矮人突然走进她的房间。
        - id: ch04-b02
          speaker: manikin
          text: 现在该兑现诺言，把答应我的东西交出来了。
        - id: ch04-b03
          speaker: narrator
          text: 王后吓得魂不附体。她苦苦哀求，只想让孩子留在自己身边，还愿意把整个王国的财富都给小矮人。
        - id: ch04-b04
          speaker: manikin
          text: 不行。对我来说，一个活生生的孩子，比世上所有财宝都珍贵。
        - id: ch04-b05
          speaker: narrator
          text: 王后哭喊起来，哭得那样伤心，小矮人也有些不忍了。
        - id: ch04-b06
          speaker: manikin
          text: 我给你三天。只要三天之内猜出我的名字，孩子就归你。
        - id: ch04-b07
          speaker: narrator
          text: 王后一夜没睡，把自己一生听过的名字全想了一遍。她还派使者走遍全国，叫他从远处到近处四处打听，看世上还有什么别的名字。第二天，小矮人来了。王后先猜卡斯帕，又猜梅尔基奥尔和巴尔塔萨，接着把知道的名字一个个说完。
        - id: ch04-b08
          speaker: manikin
          text: 你说的这些，没有一个是我的名字。
        - id: ch04-b09
          speaker: narrator
          text: 到了第二天，王后又派人去附近打听当地人的姓名。等小矮人再来，她便挑出几个最少见、最古怪的名字来猜。
        - id: ch04-b10
          speaker: queen
          text: 你会不会叫短肋骨？还是羊腿杆？难道是花边腿？
        - id: ch04-b11
          speaker: manikin
          text: 都不对，那不是我的名字。
    - id: ch05
      title: 名字的秘密
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 第三天，使者终于回来了。
        - id: ch05-b02
          speaker: messenger
          text: 我一个新名字也没能找到。不过，我走到森林尽头的一座高山上，那里荒僻得连狐狸和野兔都要互道晚安。我看见一所小屋，门前燃着一堆火。一个模样滑稽的小矮人正绕着火堆跳。他一直单脚蹦着，还大声唱起了一首歌。
        - id: ch05-b03
          speaker: messenger
          text: 今天烤饼，明天酿酒，后天王后的孩子归我所有。哈！谁也猜不到我这名字，我就叫侏儒怪，谁能知晓！
        - id: ch05-b04
          speaker: narrator
          text: 王后听见这个名字，心里别提多高兴了。不久，小矮人果然来到她面前。
        - id: ch05-b05
          speaker: manikin
          text: 王后娘娘，现在你猜猜看，我叫什么？
        - id: ch05-b06
          speaker: queen
          text: 你叫康拉德吗？
        - id: ch05-b07
          speaker: manikin
          text: 我不叫这个名字。
        - id: ch05-b08
          speaker: queen
          text: 那么，你叫哈里吗？
        - id: ch05-b09
          speaker: manikin
          text: 我也不叫这个名字。
        - id: ch05-b10
          speaker: queen
          text: 莫非你的名字是侏儒怪？
        - id: ch05-b11
          speaker: manikin
          text: 是魔鬼告诉你的！一定是魔鬼告诉你的！
          emotion: angry
        - id: ch05-b12
          speaker: narrator
          text: 小矮人气疯了。他把右脚狠狠跺进地里，整条腿都陷了下去。接着，他又用双手拼命拉扯左腿，竟把自己撕成了两半。
