  chapters:
    - id: ch01
      title: FIRST STORY
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            There once was a shoemaker who had grown terribly poor, though it was no fault of his own. At last, all he had left was enough leather for one pair of shoes. That evening, he cut the leather into the pieces he meant to sew the next morning. Then, with a clear conscience, he went peacefully to bed, put himself in God's care, and fell asleep.
        - id: ch01-b02
          speaker: narrator
          text: >-
            In the morning, after saying his prayers, he went to sit down at his workbench. There on the table stood the two shoes, completely finished. The shoemaker was so amazed that he had no words. He picked them up and looked closely. Every stitch was perfect. The shoes might have been a master's finest work.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Before long, a customer came in. He liked the shoes so much that he paid more than the usual price. With that money, the shoemaker bought enough leather for two pairs. Again, he cut the pieces that night, ready to begin fresh in the morning.
        - id: ch01-b04
          speaker: narrator
          text: >-
            But when he woke, the work was already done. Customers soon arrived and paid enough for him to buy leather for four pairs. The next morning, all four pairs were finished too. Night after night, whatever he cut out was made into shoes by morning. Before long, he could support himself honestly again. In time, he became a wealthy man.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Then, one evening not long before Christmas, the shoemaker finished cutting out his work. Before he and his wife went to bed, he turned to her.
        - id: ch01-b06
          speaker: shoemaker
          text: >-
            What if we stay awake tonight and find out who's been giving us all this help?
        - id: ch01-b07
          speaker: narrator
          text: >-
            His wife liked the idea. She lit a candle, and the two of them hid in a corner behind some hanging clothes. Then they waited and watched.
        - id: ch01-b08
          speaker: narrator
          text: >-
            At midnight, two pretty little men came into the room. They wore no clothes at all. They sat at the shoemaker's table, picked up every piece of cut leather, and began to stitch and sew and hammer. Their tiny fingers worked so quickly and skillfully that the shoemaker could hardly look away.
        - id: ch01-b09
          speaker: narrator
          text: >-
            The little men kept working until every shoe was finished and standing on the table. Then they hurried away.
        - id: ch01-b10
          speaker: narrator
          text: >-
            The next morning, the shoemaker's wife spoke to him.
        - id: ch01-b11
          speaker: wife
          text: >-
            Those little men have made us rich, and we ought to thank them. They run around with nothing on. They must be cold. I know what I'll do. I'll make each of them a little shirt, coat, vest, and pair of pants. I'll knit stockings for them too. And you can make them each a little pair of shoes.
        - id: ch01-b12
          speaker: shoemaker
          text: >-
            I'd be very glad to do that.
        - id: ch01-b13
          speaker: narrator
          text: >-
            When all the gifts were ready, the shoemaker and his wife placed them together on the table instead of setting out cut leather. Once again, they hid themselves so they could see what the little men would do.
        - id: ch01-b14
          speaker: narrator
          text: >-
            At midnight, the little men came bounding in, ready to begin work. But there was no leather waiting for them. They found only the pretty little clothes. At first they stared in surprise. Then they were filled with delight.
        - id: ch01-b15
          speaker: narrator
          text: >-
            They dressed as fast as they could, pulling on all their fine new things. Then they began to sing together.
        - id: ch01-b16
          speakers: [elf_1, elf_2]
          ensemble: duo
          text: >-
            Now we're such fine boys to see! Why should we go on making shoes?
          emotion: happy
        - id: ch01-b17
          speaker: narrator
          text: >-
            The little men danced and skipped. They leaped over the chairs and benches, and at last they danced right out the door.
        - id: ch01-b18
          speaker: narrator
          text: >-
            They never came back again. But for the rest of the shoemaker's life, all went well with him, and everything he undertook prospered.
