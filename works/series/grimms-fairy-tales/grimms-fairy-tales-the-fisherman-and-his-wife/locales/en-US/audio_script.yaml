audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and steady folktale storytelling
        timbre: clear and gently resonant
        pace: measured
        pitch: medium
    fisherman:
      display_name: Fisherman
      tts:
        delivery: humble and hesitant, growing more troubled with each request
        timbre: gentle and weathered
        pace: measured
        pitch: medium-low
    wife:
      display_name: Wife
      tts:
        delivery: demanding and restless, with mounting impatience
        timbre: firm and clear
        pace: brisk
        pitch: medium
    flounder:
      display_name: Flounder
      tts:
        delivery: composed and spare, with quiet authority
        timbre: smooth and resonant
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Enchanted Flounder
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once there was a fisherman who lived with his wife in a miserable little hovel beside the sea. Every day, he went out with his rod and fished. One day he sat there, looking down into the clear water and waiting. All at once, his line plunged deep below the surface. He drew it up again, and there on the hook was a large flounder.
        - id: ch01-b02
          speaker: flounder
          text: >-
            Listen, fisherman. Please let me live. I am not truly a flounder. I am an enchanted prince. Killing me will do you no good, and I would not be fit to eat. Put me back in the water and let me go.
        - id: ch01-b03
          speaker: fisherman
          text: >-
            You don't need to say so much. Of course I'll let a fish go if it can talk.
        - id: ch01-b04
          speaker: narrator
          text: >-
            He put the flounder back into the clear water. The fish swam to the bottom, leaving a long trail of blood behind him. Then the fisherman got up and returned to his wife in the hovel.
        - id: ch01-b05
          speaker: wife
          text: >-
            Husband, didn't you catch anything today?
        - id: ch01-b06
          speaker: fisherman
          text: >-
            I caught a flounder. He told me he was an enchanted prince, so I let him go.
        - id: ch01-b07
          speaker: wife
          text: >-
            And you didn't ask for anything first?
        - id: ch01-b08
          speaker: fisherman
          text: >-
            No. What would I ask for?
        - id: ch01-b09
          speaker: wife
          text: >-
            It's hard to go on living in this filthy hovel. You could have asked for a little cottage. Go back and call him. Tell him we want a cottage. I'm sure he'll give us one.
        - id: ch01-b10
          speaker: fisherman
          text: >-
            Why should I go back there?
        - id: ch01-b11
          speaker: wife
          text: >-
            Because you caught him and then set him free. He'll do it. Go now.
        - id: ch01-b12
          speaker: narrator
          text: >-
            The fisherman still did not want to go. But he did not want to oppose his wife either, and she had told him to leave at once. So he walked back to the sea. By then, the water had turned green and yellow, and the smooth surface was gone. He stopped at the edge and called out.
        - id: ch01-b13
          speaker: fisherman
          text: |-
            Flounder, flounder in the sea,
            Please come up and speak to me.
            For my wife, good Ilsabil,
            Wants a thing against my will.
        - id: ch01-b14
          speaker: narrator
          text: >-
            The flounder swam up to him.
        - id: ch01-b15
          speaker: flounder
          text: >-
            Well, what does she want?
        - id: ch01-b16
          speaker: fisherman
          text: >-
            When I caught you, I didn't wish for anything. My wife says I should have. She doesn't want to stay in that wretched hovel. She wants a cottage.
        - id: ch01-b17
          speaker: flounder
          text: >-
            Go home. She already has it.
        - id: ch01-b18
          speaker: narrator
          text: >-
            When the fisherman returned, the hovel was gone. A small cottage stood in its place. His wife was sitting on a bench in front of the door, waiting there. As soon as he came near, she got up, took him by the hand, and led him toward their new home.
        - id: ch01-b19
          speaker: wife
          text: >-
            Come inside and look. Isn't this much better?
        - id: ch01-b20
          speaker: narrator
          text: >-
            They went in together. There was a little porch, a pretty parlor, a bedroom, a kitchen, and a pantry. Fine furniture filled the rooms. Beautiful things made of tin and brass stood everywhere, and nothing they needed was missing. Behind the cottage was a small yard with hens and ducks. Beside it lay a little garden where flowers bloomed and fruit grew.
        - id: ch01-b21
          speaker: wife
          text: >-
            Look at all this. Isn't it lovely?
        - id: ch01-b22
          speaker: fisherman
          text: >-
            Yes. Let's always remember that. We can live here and be content.
        - id: ch01-b23
          speaker: wife
          text: >-
            We'll see about that.
        - id: ch01-b24
          speaker: narrator
          text: >-
            They ate something and went to bed.
    - id: ch02
      title: The Stone Castle
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            For a week or perhaps two, everything went well. Then the wife spoke again.
        - id: ch02-b02
          speaker: wife
          text: >-
            Listen, husband. This cottage is much too small, and so are the garden and the yard. The flounder could just as easily have given us a bigger house. I want to live in a great stone castle. Go tell him to give us one.
        - id: ch02-b03
          speaker: fisherman
          text: >-
            Wife, this cottage is good enough. Why would we need a castle?
        - id: ch02-b04
          speaker: wife
          text: >-
            Just go. The flounder can do it.
        - id: ch02-b05
          speaker: fisherman
          text: >-
            He only just gave us this cottage. I don't want to ask him again so soon. He might get angry.
        - id: ch02-b06
          speaker: wife
          text: >-
            Go. It will be easy for him, and he'll be glad to do it. Now go to him.
        - id: ch02-b07
          speaker: narrator
          text: >-
            The fisherman's heart grew heavy. He would not go at first. "It isn't right," he told himself. Still, he gave in and went. The sea had changed again. Now it was purple, dark blue, and gray instead of green and yellow. The water looked thick, though it remained quiet. He stood beside it and called.
        - id: ch02-b08
          speaker: fisherman
          text: |-
            Flounder, flounder in the sea,
            Please come up and speak to me.
            For my wife, good Ilsabil,
            Wants a thing against my will.
        - id: ch02-b09
          speaker: flounder
          text: >-
            Well, what does she want?
        - id: ch02-b10
          speaker: fisherman
          text: >-
            I'm afraid she wants to live in a great stone castle.
          emotion: fearful
        - id: ch02-b11
          speaker: flounder
          text: >-
            Go home. She is standing at the door.
        - id: ch02-b12
          speaker: narrator
          text: >-
            The fisherman started home. When he arrived, he found a great stone palace. His wife stood on the steps, about to go in. She took him by the hand.
        - id: ch02-b13
          speaker: wife
          text: >-
            Come inside.
        - id: ch02-b14
          speaker: narrator
          text: >-
            A vast hall inside was paved with marble. Many servants threw the doors wide for them. Beautiful hangings shone along the walls. Every room held tables and chairs of pure gold, and crystal chandeliers hung from the ceilings. Carpets covered the bedrooms and all the other rooms. The tables were so loaded with the finest food and wine that they almost broke beneath it all. Out back were a great courtyard, stables filled with horses and cows, and the finest carriages. There was a magnificent garden of beautiful flowers and fruit trees, too. Beyond that stretched a park half a mile long, where stags, deer, and hares roamed. Everything anyone could desire was there.
        - id: ch02-b15
          speaker: wife
          text: >-
            Well? Isn't it beautiful?
        - id: ch02-b16
          speaker: fisherman
          text: >-
            Yes, it is. Now let this be enough. We can live in this beautiful castle and be content.
        - id: ch02-b17
          speaker: wife
          text: >-
            We'll think about that after we sleep.
        - id: ch02-b18
          speaker: narrator
          text: >-
            Then they went to bed.
    - id: ch03
      title: The King
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The next morning, the wife woke first, just as day was breaking. From her bed, she could see the beautiful countryside spread out beyond the palace. Her husband was still beside her, stretching himself awake. She jabbed him in the side with her elbow.
        - id: ch03-b02
          speaker: wife
          text: >-
            Get up, husband. Look out the window. Couldn't we be king over all that land? Go to the flounder. We will be king.
        - id: ch03-b03
          speaker: fisherman
          text: >-
            Wife, why should we be king? I don't want to be king.
        - id: ch03-b04
          speaker: wife
          text: >-
            Then I will be king. Go to the flounder. I want to be king.
        - id: ch03-b05
          speaker: fisherman
          text: >-
            Why do you want that? I don't want to ask him for it.
        - id: ch03-b06
          speaker: wife
          text: >-
            Why not? Go this instant. I must be king!
          emotion: angry
        - id: ch03-b07
          speaker: narrator
          text: >-
            The fisherman went away, deeply unhappy that his wife wanted to be king. Again and again, he thought, "It isn't right." He did not want to go, but he went anyway. At the shore, the sea was dark gray. The water heaved up from below, and a rotten smell rose from it. He stood there and called.
        - id: ch03-b08
          speaker: fisherman
          text: |-
            Flounder, flounder in the sea,
            Please come up and speak to me.
            For my wife, good Ilsabil,
            Wants a thing against my will.
        - id: ch03-b09
          speaker: flounder
          text: >-
            Well, what does she want?
        - id: ch03-b10
          speaker: fisherman
          text: >-
            She wants to be king.
        - id: ch03-b11
          speaker: flounder
          text: >-
            Go back to her. She is king already.
        - id: ch03-b12
          speaker: narrator
          text: >-
            When the fisherman reached the palace, the castle had grown much larger. A great tower rose above it, and magnificent decorations covered it. A sentinel guarded the door. Crowds of soldiers stood nearby with kettledrums and trumpets. Inside, everything was real marble and gold. Velvet covers lay all around, trimmed with enormous golden tassels. Then the doors of the hall swung open, revealing the whole splendid court. His wife sat on a high throne made of gold and diamonds. A great golden crown rested on her head. In her hand was a scepter of pure gold set with jewels. Her ladies-in-waiting stood in rows on either side. The first was tallest, and every woman after her stood exactly one head shorter.
        - id: ch03-b13
          speaker: fisherman
          text: >-
            Wife, so now you are king.
        - id: ch03-b14
          speaker: wife
          text: >-
            Yes. Now I am king.
        - id: ch03-b15
          speaker: narrator
          text: >-
            He stood looking at her for a long time.
        - id: ch03-b16
          speaker: fisherman
          text: >-
            Now that you are king, let everything else be. We don't need to wish for anything more.
        - id: ch03-b17
          speaker: wife
          text: >-
            No, husband. Time passes so slowly that I can't stand it. Go back to the flounder. I am king, but now I must be emperor as well.
        - id: ch03-b18
          speaker: fisherman
          text: >-
            Wife, why do you want to be emperor?
        - id: ch03-b19
          speaker: wife
          text: >-
            Husband, go to the flounder. I will be emperor.
        - id: ch03-b20
          speaker: fisherman
          text: >-
            He can't make you emperor. I must not ask the fish for that. There is only one emperor in the land. The flounder cannot do it. I promise you, he can't.
        - id: ch03-b21
          speaker: wife
          text: >-
            What? I am the king, and you are only my husband. Go this moment! If he can make a king, he can make an emperor. I will be emperor. Go now!
          emotion: angry
        - id: ch03-b22
          speaker: narrator
          text: >-
            He was forced to leave. As he walked, his thoughts troubled him. This would not end well. Asking to be emperor was shameless. At last, the flounder would grow tired of it.
    - id: ch04
      title: The Emperor
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            The sea was black and thick when he arrived. It began to boil up from below, throwing bubbles into the air. A sharp wind swept across it, breaking the water into curdled-looking waves. The fisherman was afraid. Even so, he went to the shore, stood there, and called.
        - id: ch04-b02
          speaker: fisherman
          text: |-
            Flounder, flounder in the sea,
            Please come up and speak to me.
            For my wife, good Ilsabil,
            Wants a thing against my will.
        - id: ch04-b03
          speaker: flounder
          text: >-
            Well, what does she want?
        - id: ch04-b04
          speaker: fisherman
          text: >-
            My wife wants to be emperor.
        - id: ch04-b05
          speaker: flounder
          text: >-
            Go to her. She is emperor already.
        - id: ch04-b06
          speaker: narrator
          text: >-
            The fisherman went back. The whole palace was now made of polished marble, covered with alabaster statues and golden ornaments. Soldiers marched before the door. They blew trumpets and beat cymbals and drums. Inside, barons, counts, and dukes hurried around, waiting on her like servants. When the fisherman came near, they opened doors of pure gold for him.

            His wife sat on a throne made from a single piece of gold. It rose two miles high. On her head was a golden crown three yards tall, set with diamonds and red jewels. She held a scepter in one hand and the imperial orb in the other. Her guards stood in two rows beside her. Each was smaller than the one before, from a giant two miles high down to a dwarf no bigger than a little finger. Princes and dukes crowded before the throne.
        - id: ch04-b07
          speaker: fisherman
          text: >-
            Wife, are you emperor now?
        - id: ch04-b08
          speaker: wife
          text: >-
            Yes. Now I am emperor.
        - id: ch04-b09
          speaker: narrator
          text: >-
            The fisherman went and stood among all those princes and dukes. For a while, he said nothing. He only looked carefully at his wife on the towering throne.
        - id: ch04-b10
          speaker: fisherman
          text: >-
            Wife, now that you are emperor, please be content.
        - id: ch04-b11
          speaker: wife
          text: >-
            Husband, why are you just standing there? I may be emperor now, but I want to be pope too. Go to the flounder.
        - id: ch04-b12
          speaker: fisherman
          text: >-
            Wife, is there nothing you won't wish for? You cannot be pope. There is only one pope in all Christendom. He cannot make you pope.
        - id: ch04-b13
          speaker: wife
          text: >-
            Husband, I will be pope. Go right now. I must be pope today.
        - id: ch04-b14
          speaker: fisherman
          text: >-
            No, wife. I don't want to ask him. It would be wrong. It is too much. The flounder cannot make you pope.
        - id: ch04-b15
          speaker: wife
          text: >-
            Nonsense! If he can make an emperor, he can make a pope. Go straight to him. I am emperor, and you are only my husband. Will you go at once?
          emotion: angry
        - id: ch04-b16
          speaker: narrator
          text: >-
            The fisherman was frightened, so he went. He felt faint. He shivered and shook, and his knees and legs trembled beneath him. A high wind tore over the land while clouds raced through the sky. As evening came, everything grew dark. Leaves ripped free from the trees and flew through the air. The sea rose and roared as if it were boiling, then splashed far up the shore. In the distance, he saw ships tossing and pitching on the waves. They were in terrible danger, and they fired their guns for help. Only one small patch of blue remained in the middle of the sky. All around it, the heavens glowed red with the heavy storm. The fisherman was full of despair. In great fear, he went to the sea, stood there, and called.
    - id: ch05
      title: The Pope
      blocks:
        - id: ch05-b01
          speaker: fisherman
          text: |-
            Flounder, flounder in the sea,
            Please come up and speak to me.
            For my wife, good Ilsabil,
            Wants a thing against my will.
        - id: ch05-b02
          speaker: flounder
          text: >-
            Well, what does she want?
        - id: ch05-b03
          speaker: fisherman
          text: >-
            She wants to be pope.
        - id: ch05-b04
          speaker: flounder
          text: >-
            Go back to her. She is pope already.
        - id: ch05-b05
          speaker: narrator
          text: >-
            The fisherman returned and saw what looked like a huge church with palaces all around it. A crowd filled the way, and he had to push through them to get inside. There, thousands upon thousands of candles filled everything with light. His wife wore robes of gold and sat on a throne far higher than the last one. Three great golden crowns rose above her head, and all the splendor of the church surrounded her. Long rows of candles stood on either side. The largest reached as high as the tallest tower. From there, each candle grew smaller, down to the last one, which was no bigger than a kitchen candle. Every emperor and king knelt before her and kissed her shoe. The fisherman stood still and stared at her.
        - id: ch05-b06
          speaker: fisherman
          text: >-
            Wife, are you pope now?
        - id: ch05-b07
          speaker: wife
          text: >-
            Yes. I am pope.
        - id: ch05-b08
          speaker: narrator
          text: >-
            He kept looking at her for a short while. It was like staring into the bright sun.
        - id: ch05-b09
          speaker: fisherman
          text: >-
            Wife, if you are pope, please let this be enough.
        - id: ch05-b10
          speaker: narrator
          text: >-
            She stayed as stiff as a post. She did not move, answer him, or show any sign of life.
        - id: ch05-b11
          speaker: fisherman
          text: >-
            Now that you are pope, be satisfied. There is nothing greater you can become.
        - id: ch05-b12
          speaker: wife
          text: >-
            I will think about that.
        - id: ch05-b13
          speaker: narrator
          text: >-
            They went to bed, but the wife was not satisfied. Her greed would not let her sleep. Over and over, she wondered what else might be left for her to become.

            The fisherman slept deeply and soundly. He had spent so much of the day running back and forth. His wife could not fall asleep at all. She tossed from one side to the other through the whole night. All the while, she kept searching for something more she could be, but she could not think of anything.
    - id: ch06
      title: The Last Wish
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            At last, the sun began to rise. The wife saw the red light of dawn and sat up in bed. Through the window, she watched the sun climb into the sky.
        - id: ch06-b02
          speaker: wife
          text: >-
            Why can't I command the sun and moon to rise?
        - id: ch06-b03
          speaker: narrator
          text: >-
            She drove her elbows into her husband's ribs.
        - id: ch06-b04
          speaker: wife
          text: >-
            Wake up! Go to the flounder. I want to be like God.
        - id: ch06-b05
          speaker: narrator
          text: >-
            The fisherman was still half asleep, but the words horrified him so much that he fell right out of bed. He could not believe what he had heard. Surely he had misunderstood her. He rubbed his eyes and looked at his wife.
        - id: ch06-b06
          speaker: fisherman
          text: >-
            Wife, what did you just say?
          emotion: fearful
        - id: ch06-b07
          speaker: wife
          text: >-
            If I can't command the sun and moon to rise, then I have to stand here and watch them rise on their own. I cannot bear that. I will never know another happy hour unless I can make the sun and moon rise myself.
        - id: ch06-b08
          speaker: narrator
          text: >-
            She gave him such a terrible look that a shudder ran through him.
        - id: ch06-b09
          speaker: wife
          text: >-
            Go now. I want to be like God.
          emotion: angry
        - id: ch06-b10
          speaker: narrator
          text: >-
            The fisherman fell to his knees before her.
        - id: ch06-b11
          speaker: fisherman
          text: >-
            Wife, the flounder cannot do that. He can make an emperor or a pope, but not this. I beg you, stay as you are. Remain pope.
          emotion: fearful
        - id: ch06-b12
          speaker: narrator
          text: >-
            She flew into a rage. Her hair whipped wildly around her head as she shouted.
        - id: ch06-b13
          speaker: wife
          text: >-
            I will not stand for this! I won't bear it any longer. Will you go?
          emotion: angry
        - id: ch06-b14
          speaker: narrator
          text: >-
            He pulled on his trousers and ran away like a madman. Outside, a terrible storm was raging. The wind struck him so hard that he could barely keep his feet beneath him. Houses toppled over, and trees crashed to the ground. The mountains trembled. Great rocks broke loose and rolled down into the sea. Above him, the sky was pitch-black. Thunder crashed, and lightning flashed through the darkness. The sea rushed toward the land in black waves as high as church towers and mountains. Each wave carried a crest of white foam along its top.

            The fisherman cried out, but even he could not hear his own words.
        - id: ch06-b15
          speaker: fisherman
          text: |-
            Flounder, flounder in the sea,
            Please come up and speak to me.
            For my wife, good Ilsabil,
            Wants a thing against my will.
        - id: ch06-b16
          speaker: flounder
          text: >-
            Well, what does she want?
        - id: ch06-b17
          speaker: fisherman
          text: >-
            She wants to be like God.
        - id: ch06-b18
          speaker: flounder
          text: >-
            Go home. You will find her back in the dirty hovel.
        - id: ch06-b19
          speaker: narrator
          text: >-
            And there they are living to this very day.
