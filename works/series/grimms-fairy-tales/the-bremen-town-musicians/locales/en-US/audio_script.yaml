  chapters:
    - id: ch01
      title: Four Travelers
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            A man once owned a donkey who had carried sacks of grain to the mill for many long years. The donkey never tired of the work, but now his strength was failing. He could no longer do what he once had done. His master began wondering how he could avoid the cost of feeding him. The donkey could tell that trouble was coming, so he ran away and took the road to Bremen.
        - id: ch01-b02
          speaker: donkey
          text: >-
            In Bremen, I can surely become a town musician.
        - id: ch01-b03
          speaker: narrator
          text: >-
            After he had gone some distance, he found a hound stretched out beside the road. The dog was panting as if he had run until he had no strength left.
        - id: ch01-b04
          speaker: donkey
          text: >-
            Why are you lying here gasping, big fellow?
        - id: ch01-b05
          speaker: hound
          text: >-
            I'm old, and I get weaker every day. I can't hunt anymore, so my master meant to kill me. I ran for my life. But how will I earn enough to eat now?
        - id: ch01-b06
          speaker: donkey
          text: >-
            Come to Bremen with me. I'm going there to be a town musician, and you can join me. I'll play the lute, and you can beat the kettledrum.
        - id: ch01-b07
          speaker: narrator
          text: >-
            The hound liked the idea, and the two went on together. Before long, they saw a cat sitting in the path. The cat wore a face as gloomy as three straight days of rain.
        - id: ch01-b08
          speaker: donkey
          text: >-
            What's gone wrong with you, old whiskers?
        - id: ch01-b09
          speaker: cat
          text: >-
            How can anyone be cheerful when her life is in danger? I'm getting old. My teeth are worn down, and these days I'd rather sit by the fire and purr than chase mice. My mistress wanted to drown me, so I escaped. But now I don't know where to go.
        - id: ch01-b10
          speaker: donkey
          text: >-
            Then come with us to Bremen. You know all about making music at night. You can become a town musician too.
        - id: ch01-b11
          speaker: narrator
          text: >-
            The cat thought that sounded wise, so she joined them. The three runaways traveled on until they reached a farmyard. A rooster sat on the gate, crowing with all his might.
        - id: ch01-b12
          speaker: donkey
          text: >-
            That crow cuts right through a person! What's the matter?
        - id: ch01-b13
          speaker: cock
          text: >-
            I've been announcing fine weather. Today Our Lady washes the Christ child's little shirts and wants the sun to dry them. But guests are coming on Sunday, and the housewife has no mercy. She told the cook to put me in tomorrow's soup. They're going to cut off my head tonight, so I'm crowing as loud as I can while I still can.
        - id: ch01-b14
          speaker: donkey
          text: >-
            Listen, Red-comb, you'd better leave with us. We're going to Bremen. Anywhere is better than death. You have a fine voice, and when all four of us make music together, it ought to sound like something!
        - id: ch01-b15
          speaker: narrator
          text: >-
            The rooster agreed, and all four set off together.
    - id: ch02
      title: A Light in the Forest
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            They could not reach Bremen in a single day. That evening, they came to a forest and decided to spend the night there. The donkey and the hound lay down beneath a large tree. The cat and the rooster settled among the branches, though the rooster flew right to the top, where he would be safest.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Before closing his eyes, the rooster looked in every direction. Far away, he thought he saw a tiny spark of light. He called down to the others that there must be a house nearby.
        - id: ch02-b03
          speaker: donkey
          text: >-
            Then we'd better get up and keep going. This is a poor place to spend the night.
        - id: ch02-b04
          speaker: narrator
          text: >-
            The hound thought a few bones with some meat still on them would be welcome too. So the animals headed toward the light. It grew brighter and larger as they went, until they stood before a robber's house blazing with lamps. Since the donkey was the tallest, he went to the window and peered inside.
        - id: ch02-b05
          speaker: cock
          text: >-
            What can you see, my gray horse?
        - id: ch02-b06
          speaker: donkey
          text: >-
            I see a table loaded with good food and drink, and a band of robbers sitting there enjoying it.
        - id: ch02-b07
          speaker: cock
          text: >-
            Now that is exactly what we need.
        - id: ch02-b08
          speaker: donkey
          text: >-
            Yes. If only we could be in there!
        - id: ch02-b09
          speaker: narrator
          text: >-
            The four animals talked over how they might drive the robbers away. At last, they made a plan. The donkey put his front feet on the window ledge. The hound climbed onto the donkey's back, the cat climbed onto the hound, and the rooster flew up and perched on the cat's head.
    - id: ch03
      title: The Strangest Music
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            At their signal, all four began their music at once. The donkey brayed, the hound barked, the cat meowed, and the rooster crowed.
        - id: ch03-b02
          speakers: [donkey, hound, cat, cock]
          ensemble: chorus
          text: >-
            Hee-haw! Woof! Meow! Cock-a-doodle-doo!
        - id: ch03-b03
          speaker: narrator
          text: >-
            Then they crashed through the window. Glass clattered all around them. At that horrible noise, the robbers leaped from their seats. They were sure a ghost had burst into the house, and they fled into the forest in terror.
        - id: ch03-b04
          speaker: narrator
          text: >-
            The four companions sat down at the abandoned table. They were delighted with everything the robbers had left behind, and they ate as if they would have nothing again for a whole month.
        - id: ch03-b05
          speaker: narrator
          text: >-
            When the four musicians had finished, they put out the light. Each one chose a sleeping place that suited him. The donkey lay on some straw in the yard. The hound curled up behind the door. The cat settled on the hearth beside the warm ashes, and the rooster perched on a roof beam. After their long journey, they were so tired that they soon fell asleep.
    - id: ch04
      title: The Robber Returns
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Midnight had passed when the robbers looked back from far away. No light burned in the house now, and everything seemed quiet.
        - id: ch04-b02
          speaker: robber_captain
          text: >-
            We never should have let ourselves be scared out of our senses.
        - id: ch04-b03
          speaker: narrator
          text: >-
            The captain ordered one robber to go back and inspect the house. The robber found everything still. He went into the kitchen to light a candle. In the darkness, the cat's fiery eyes gleamed from the hearth. He mistook them for glowing coals and held a match close to them.
        - id: ch04-b04
          speaker: narrator
          text: >-
            The cat had no patience for that joke. She sprang into his face, spitting and scratching. The robber stumbled away in terror and raced for the back door. But the hound was lying there. He jumped up and bit the robber's leg. The robber tore across the yard past the straw pile, and the donkey struck him with a sharp kick from one hind foot. All that noise woke the rooster, who cried down from the beam.
        - id: ch04-b05
          speaker: cock
          text: >-
            Cock-a-doodle-doo!
    - id: ch05
      title: The Musicians' New Home
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            The robber ran back to his captain as fast as he could.
        - id: ch05-b02
          speaker: robber
          text: >-
            There's a horrible witch in that house! She spat at me and raked my face with her long claws. A man with a knife was standing by the door, and he stabbed me in the leg. Then a black monster in the yard struck me with a wooden club. Up on the roof, a judge shouted, "Bring that thief to me!" I barely got away!
          emotion: fearful
        - id: ch05-b03
          speaker: narrator
          text: >-
            After that, the robbers never dared enter the house again. But the four musicians of Bremen found the place so comfortable that they never wished to leave.
        - id: ch05-b04
          speaker: narrator
          text: >-
            And the mouth of the last person who told this tale is still warm.
