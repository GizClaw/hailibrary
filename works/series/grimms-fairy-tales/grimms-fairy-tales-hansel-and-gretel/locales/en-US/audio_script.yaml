audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, grave, and quietly suspenseful
        timbre: clear and rounded
        pace: measured
        pitch: medium
    hansel:
      display_name: Hansel
      tts:
        delivery: thoughtful, brave, and direct
        timbre: clear and youthful
        pace: steady
        pitch: medium-high
    grethel:
      display_name: Grethel
      tts:
        delivery: tender, earnest, and increasingly courageous
        timbre: light and youthful
        pace: natural
        pitch: high
    father:
      display_name: Father
      tts:
        delivery: weary, gentle, and troubled
        timbre: rough and warm
        pace: slow
        pitch: low
    stepmother:
      display_name: Stepmother
      tts:
        delivery: sharp, impatient, and forceful
        timbre: dry and firm
        pace: brisk
        pitch: medium
    witch:
      display_name: Witch
      tts:
        delivery: falsely sweet at first, then harsh and menacing
        timbre: thin and raspy
        pace: deliberate
        pitch: medium-high
  chapters:
    - id: ch01
      title: The White Pebbles
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Near a great forest lived a poor woodcutter, his wife, and his two children. The boy was called Hansel, and the girl was called Grethel. They had very little to eat even in ordinary times. Then a terrible famine spread across the land. Day after day, the father could no longer find enough bread to put on the table.
        - id: ch01-b02
          speaker: narrator
          text: One night he lay awake, turning over and over with worry. At last he spoke to his wife.
        - id: ch01-b03
          speaker: father
          text: What will happen to us? How can we feed the children when we don't even have enough for ourselves?
        - id: ch01-b04
          speaker: stepmother
          text: Here's what we'll do. Tomorrow morning, we'll take them deep into the forest. We'll make them a fire and give them each a piece of bread. Then we'll leave them there while we go to work. They won't find their way home, and we'll be free of them.
        - id: ch01-b05
          speaker: father
          text: No. I can't leave my children alone in the woods. Wild animals would find them and tear them to pieces.
        - id: ch01-b06
          speaker: stepmother
          text: You fool! Then all four of us will starve. You might as well start making our coffins.
          emotion: angry
        - id: ch01-b07
          speaker: narrator
          text: She would not give him any peace until he agreed.
        - id: ch01-b08
          speaker: father
          text: Still, I feel so sorry for the poor children.
          emotion: sad
        - id: ch01-b09
          speaker: narrator
          text: Hansel and Grethel were awake too, because hunger had kept them from sleeping. They heard everything their stepmother said. Grethel wept bitterly.
        - id: ch01-b10
          speaker: grethel
          text: It's all over for us now.
          emotion: fearful
        - id: ch01-b11
          speaker: hansel
          text: Hush, Grethel. Don't be afraid. I'll find a way to help us.
          emotion: calm
        - id: ch01-b12
          speaker: narrator
          text: When the grown-ups were finally asleep, Hansel climbed out of bed, put on his little coat, opened the door downstairs, and crept outside. The moon shone brightly. White pebbles lay all around the front of the house, glittering like real silver coins. Hansel bent down and filled his coat pocket with as many stones as he could possibly squeeze inside. Then he slipped back into the house.
        - id: ch01-b13
          speaker: hansel
          text: Don't worry, little sister. Sleep peacefully. God won't leave us alone.
          emotion: calm
        - id: ch01-b14
          speaker: narrator
          text: At daybreak, before the sun was up, the stepmother woke the children.
        - id: ch01-b15
          speaker: stepmother
          text: Get up, you lazy children! We're going into the forest to gather wood.
        - id: ch01-b16
          speaker: narrator
          text: She handed each child a small piece of bread.
        - id: ch01-b17
          speaker: stepmother
          text: This is your lunch. Don't eat it before noon, because there won't be any more.
        - id: ch01-b18
          speaker: narrator
          text: Grethel tucked her bread safely under her apron, while Hansel carried the pebbles inside his coat. Then the father, the stepmother, and both children set out together for the forest. They had not gone far when Hansel stopped and peered back at the house. A little later he stopped again, and then again after that.
        - id: ch01-b19
          speaker: father
          text: Hansel, why do you keep hanging back and staring at the house? Watch where you're going, and keep walking.
        - id: ch01-b20
          speaker: hansel
          text: I'm looking at my little white cat. She's sitting on the roof to say goodbye to me.
        - id: ch01-b21
          speaker: stepmother
          text: Foolish boy. That isn't your cat. It's the morning sun shining on the chimney.
        - id: ch01-b22
          speaker: narrator
          text: Hansel was not looking at any cat. Each time he stopped, he dropped a white pebble onto the road.
    - id: ch02
      title: The Path Home
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: When they reached the middle of the forest, the father told the children to gather wood. Hansel and Grethel picked up armful after armful of brush until the pile was as high as a little hill. Their father set it on fire, and soon the flames were leaping high.
        - id: ch02-b02
          speaker: father
          text: The fire will keep you warm.
        - id: ch02-b03
          speaker: stepmother
          text: Lie down beside it and rest. We're going farther in to cut wood. When we're finished, we'll come back for you.
        - id: ch02-b04
          speaker: narrator
          text: The children stayed by the fire. At noon, each one ate a little bread. They could hear what sounded like an ax striking wood, so they thought their father was close by. But there was no ax. Their father had tied a branch to a dead tree, and the wind knocked it back and forth.
        - id: ch02-b05
          speaker: narrator
          text: The children sat and waited for hours. At last, weariness closed their eyes and they fell fast asleep beside the dying fire. When they finally woke, night had fallen. The whole forest around them was dark.
        - id: ch02-b06
          speaker: grethel
          text: How will we ever get out of the woods now?
          emotion: fearful
        - id: ch02-b07
          speaker: hansel
          text: Wait until the moon comes up. Then we'll find the way.
          emotion: calm
        - id: ch02-b08
          speaker: narrator
          text: The full moon rose. Hansel took his little sister's hand, and they followed the pebbles. Every stone shone like a newly minted silver coin, showing them where to go.
        - id: ch02-b09
          speaker: narrator
          text: Hand in hand, they followed that shining trail through the trees. They walked the whole night long. Just as the next day was breaking, they came to their father's house once more. They hurried to the door and knocked, and their stepmother opened it.
        - id: ch02-b10
          speaker: stepmother
          text: You wicked children! Why did you sleep in the forest so long? We thought you would never come back.
        - id: ch02-b11
          speaker: narrator
          text: Their father could hardly contain his joy when he saw them. Ever since the moment he left them alone in the forest, his heart had ached for what he had done.
    - id: ch03
      title: The Trail of Crumbs
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Before long, another famine spread across the land. One night, the children heard their stepmother speaking to their father again.
        - id: ch03-b02
          speaker: stepmother
          text: The food is gone again. We have half a loaf left, and then nothing. The children have to go. This time, we'll take them farther into the woods, where they can never find the way out. It's the only way to save ourselves.
        - id: ch03-b03
          speaker: narrator
          text: The father's heart was heavy. He thought it would be better to share his last bite with his children. But his wife scolded him and refused to listen. He had agreed once, and now she forced him to agree again.
        - id: ch03-b04
          speaker: narrator
          text: The children were still awake, and once again they heard the whole conversation. When the grown-ups fell asleep, Hansel got out of bed. He meant to gather white pebbles just as he had before. But when he reached the door, he found that the stepmother had locked it. No matter what he tried, he could not get outside.
        - id: ch03-b05
          speaker: hansel
          text: Don't cry, Grethel. Go to sleep. God will help us.
          emotion: calm
        - id: ch03-b06
          speaker: narrator
          text: Early the next morning, the stepmother came for the children and pulled them out of bed. She gave each of them a bit of bread, but the pieces were even smaller than the first time. As the family walked toward the forest, Hansel secretly crumbled his bread inside his pocket. Again and again, he stopped long enough to drop one morsel onto the ground behind him.
        - id: ch03-b07
          speaker: father
          text: Hansel, why do you keep stopping and looking behind you? Come along.
        - id: ch03-b08
          speaker: hansel
          text: I'm watching my little pigeon on the roof. It wants to say goodbye.
        - id: ch03-b09
          speaker: stepmother
          text: Simpleton! That isn't your pigeon. It's the morning sun on the chimney.
        - id: ch03-b10
          speaker: narrator
          text: Little by little, Hansel dropped every crumb along the path.
        - id: ch03-b11
          speaker: narrator
          text: The stepmother led them deeper into the forest than they had ever been. Once more, a great fire was built.
        - id: ch03-b12
          speaker: stepmother
          text: Stay here. If you get tired, you can sleep. We're going to cut wood, and we'll come for you this evening when we're done.
        - id: ch03-b13
          speaker: narrator
          text: At noon, Grethel broke her little piece of bread in two and shared it with Hansel, because every bit of his bread lay scattered along the way. After they ate, the children fell asleep. The afternoon faded. Evening came and went, yet no one returned for them. They did not wake until the night was completely dark.
        - id: ch03-b14
          speaker: hansel
          text: Wait for the moon, Grethel. Then we'll see the crumbs I left. They'll lead us home.
          emotion: calm
        - id: ch03-b15
          speaker: narrator
          text: When the moon rose, the children set off and searched the path. But no pale crumbs shone back at them. Not one was left. The countless birds that flew through the woods and over the fields had already pecked up every piece.
        - id: ch03-b16
          speaker: hansel
          text: We'll find the way soon.
        - id: ch03-b17
          speaker: narrator
          text: But they did not. They walked all night, then all the next day, from morning until evening. They never found the edge of the forest. They were terribly hungry, with only two or three berries from the ground to eat. At last their legs could carry them no farther. They lay beneath a tree and slept.
        - id: ch03-b18
          speaker: narrator
          text: Three mornings had passed since they left home. They started walking again, but every step seemed to take them deeper into the woods. Without help, they would soon die from hunger and exhaustion.
    - id: ch04
      title: The House of Bread
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: At midday, they saw a beautiful snow-white bird perched on a branch. It sang so sweetly that both children stopped where they were and listened until the last note faded. Then the bird spread its wings and flew ahead of them. Hansel and Grethel followed it through the trees until it came to rest on the roof of a little house.
        - id: ch04-b02
          speaker: narrator
          text: Up close, they saw that the house was made of bread and covered with cakes. Its windows were clear sugar.
        - id: ch04-b03
          speaker: hansel
          text: Let's eat! I'll try a piece of the roof, and you can have some window. That sugar should taste good.
        - id: ch04-b04
          speaker: narrator
          text: Hansel reached up and broke off a bit of roof. Grethel leaned against a window and nibbled the sugar pane. Then a soft voice called from inside.
        - id: ch04-b05
          speaker: witch
          text: Nibble, nibble, little mouse. Who is nibbling at my house?
        - id: ch04-b06
          speakers: [hansel, grethel]
          ensemble: duo
          text: The wind, the wind, from heaven it blew. It isn't us. That much is true!
        - id: ch04-b07
          speaker: narrator
          text: They kept eating without a worry. Hansel liked the roof so much that he tore off a large piece. Grethel pushed out a whole round windowpane, sat down, and enjoyed it.
        - id: ch04-b08
          speaker: narrator
          text: Suddenly the door opened. A very old woman came creeping out on crutches. Hansel and Grethel were so frightened that they dropped their food.
        - id: ch04-b09
          speaker: witch
          text: Oh, you dear children! Who brought you all the way out here? Come inside and stay with me. Nothing will hurt you.
        - id: ch04-b10
          speaker: narrator
          text: The old woman nodded kindly, took both children by the hand, and led them into her little house. A wonderful meal was waiting there. She gave them milk, pancakes sprinkled with sugar, apples, and nuts. Afterward, she covered two pretty little beds with fresh white sheets. Hansel and Grethel climbed in, warm and full, and thought they must have reached heaven.
        - id: ch04-b11
          speaker: narrator
          text: But the old woman had only pretended to be kind. She was a wicked witch who waited for children. She had built the bread house to lure them close. Whenever a child fell into her hands, she killed, cooked, and ate the child, and called it a feast.
        - id: ch04-b12
          speaker: narrator
          text: Witches have red eyes and poor sight, but they can smell a human from far away, just as animals can. When Hansel and Grethel entered her part of the woods, the witch laughed cruelly.
        - id: ch04-b13
          speaker: witch
          text: I have them now. They won't get away from me!
          emotion: happy
        - id: ch04-b14
          speaker: narrator
          text: Before dawn, while the children still slept, the witch was already awake. She looked at their round red cheeks.
        - id: ch04-b15
          speaker: witch
          text: What a delicious little meal they'll make.
          emotion: happy
        - id: ch04-b16
          speaker: narrator
          text: She grabbed Hansel with one shriveled hand, carried him to a small stable, and locked him behind a barred door. He screamed, but it did no good. Then she shook Grethel awake.
        - id: ch04-b17
          speaker: witch
          text: Up, lazy girl! Fetch water and cook something fine for your brother. He's locked in the stable, and I'm going to fatten him. When he's plump, I'll eat him.
          emotion: angry
        - id: ch04-b18
          speaker: narrator
          text: Grethel cried bitterly, but nothing could change it. She had to obey the witch.
    - id: ch05
      title: The Witch's Oven
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: From then on, the finest food in the house was cooked for poor Hansel, so that he would grow plump. Grethel herself received nothing but crab shells to eat. Every morning, without fail, the old witch crept out to the little stable and called through the barred door.
        - id: ch05-b02
          speaker: witch
          text: Hansel, stick out your finger. I want to feel whether you're getting fat.
        - id: ch05-b03
          speaker: narrator
          text: Hansel held out a little bone instead. The witch's eyes were too dim to see it. She thought the bone was his finger and could not understand why the boy stayed so thin.
        - id: ch05-b04
          speaker: narrator
          text: Four weeks passed. Hansel was no fatter, and the witch lost her patience.
        - id: ch05-b05
          speaker: witch
          text: Grethel! Hurry and bring water. Fat or thin, Hansel dies tomorrow. I'll cook him then.
          emotion: angry
        - id: ch05-b06
          speaker: narrator
          text: Grethel went for the water, sobbing so hard that tears ran down her cheeks.
        - id: ch05-b07
          speaker: grethel
          text: Dear God, please help us. If the wild animals had eaten us in the forest, at least we would have died together.
          emotion: sad
        - id: ch05-b08
          speaker: witch
          text: Stop that noise. It won't help you.
          emotion: angry
        - id: ch05-b09
          speaker: narrator
          text: Early the next morning, Grethel hung the cauldron over the fire and filled it with water.
        - id: ch05-b10
          speaker: witch
          text: We'll bake first. I've heated the oven and kneaded the dough.
        - id: ch05-b11
          speaker: narrator
          text: She shoved Grethel toward the oven. Flames were already leaping inside.
        - id: ch05-b12
          speaker: witch
          text: Crawl in and see if it's hot enough for the bread.
        - id: ch05-b13
          speaker: narrator
          text: The witch meant to shut Grethel inside, bake her, and eat her too. But Grethel understood the plan.
        - id: ch05-b14
          speaker: grethel
          text: I don't know how. How am I supposed to get in there?
        - id: ch05-b15
          speaker: witch
          text: Silly goose! The door is plenty big. Look, even I can fit through it.
        - id: ch05-b16
          speaker: narrator
          text: The witch climbed up to the oven and leaned through the opening, thrusting her head well inside to prove that she could fit. At once, Grethel came up behind her and gave her a mighty push. The old woman went tumbling deep into the oven. Grethel slammed the heavy iron door and shot the bolt into place.
        - id: ch05-b17
          speaker: narrator
          text: The witch howled horribly. Grethel ran away, and the wicked witch burned to death.
        - id: ch05-b18
          speaker: narrator
          text: Grethel raced to the stable and opened the door.
        - id: ch05-b19
          speaker: grethel
          text: Hansel, we're safe! The old witch is dead!
          emotion: happy
        - id: ch05-b20
          speaker: narrator
          text: Hansel sprang through the open door like a bird flying free from its cage. Brother and sister threw their arms around each other. They kissed, they danced, and they cried out with joy. Now that the witch was dead, they no longer had anything to fear. They went back into her house and looked around. In every corner stood chests packed with pearls and precious stones.
        - id: ch05-b21
          speaker: hansel
          text: These are much better than pebbles!
          emotion: happy
        - id: ch05-b22
          speaker: narrator
          text: He stuffed his pockets with all they could hold.
        - id: ch05-b23
          speaker: grethel
          text: I'm taking some home too.
        - id: ch05-b24
          speaker: narrator
          text: She filled her apron with treasure.
        - id: ch05-b25
          speaker: hansel
          text: Now let's leave and find our way out of the witch's forest.
    - id: ch06
      title: Home Again
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: After walking for two hours, they reached a wide stretch of water.
        - id: ch06-b02
          speaker: hansel
          text: We can't cross. There's no footbridge and no bridge anywhere.
        - id: ch06-b03
          speaker: grethel
          text: And there isn't a boat. But a white duck is swimming over there. I'll ask her to help us.
        - id: ch06-b04
          speaker: grethel
          text: Little duck, little duck, come and see. Hansel and Grethel are waiting for thee. No plank, no bridge can carry us back. Please take us across on your snowy white back.
        - id: ch06-b05
          speaker: narrator
          text: The duck swam over. Hansel climbed onto her back and told Grethel to sit beside him.
        - id: ch06-b06
          speaker: grethel
          text: No, we'd be too heavy for the little duck. She can carry us one at a time.
        - id: ch06-b07
          speaker: narrator
          text: The good little duck did just that. First she carried one child over the water, and then she came back for the other. Once Hansel and Grethel were both safely on the far bank, they walked on. Before long, the trees and paths began to look more and more familiar. At last, they saw their father's house in the distance.
        - id: ch06-b08
          speaker: narrator
          text: The children began to run. They raced to the house, rushed into the room, and threw themselves into their father's arms. The poor man had not known a single happy hour since the day he abandoned them in the forest. While they were gone, their stepmother had died.
        - id: ch06-b09
          speaker: narrator
          text: Grethel lifted her apron and poured out her treasure. Pearls and precious stones rolled across the room. Then Hansel reached into his pockets and tossed down one shining handful after another. There was enough treasure to end every fear of hunger. All their worry was over, and the three of them lived together in perfect happiness.
        - id: ch06-b10
          speaker: narrator
          text: My tale is done. There runs a mouse. Catch it if you can, and make yourself a great fur cap.
