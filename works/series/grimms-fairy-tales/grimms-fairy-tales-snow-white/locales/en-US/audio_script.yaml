  chapters:
    - id: ch01
      title: A Wish in Winter
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once, in the middle of winter, snowflakes drifted from the sky like feathers. A queen sat at a window sewing. Its frame was made of black ebony. She looked out at the falling snow as she worked, until the needle pricked her finger. Three drops of blood landed on the snow. The bright red looked so beautiful against the white that she made a wish.
        - id: ch01-b02
          speaker: first_queen
          text: I wish I had a child as white as snow, as red as blood, and as black as this window frame.
        - id: ch01-b03
          speaker: narrator
          text: |-
            Soon she had a daughter. The child was white as snow and red as blood, with hair as black as ebony, so they called her Little Snow-white. But when the baby was born, her mother died.

            A year later, the King married again. His new wife was beautiful, proud, and haughty. She could not bear for anyone to be more beautiful than she was. She owned a wonderful looking-glass. Whenever she stood before it, she would ask it a question.
        - id: ch01-b04
          speaker: stepmother
          text: Looking-glass, looking-glass, on the wall, who is the fairest in the land of all?
        - id: ch01-b05
          speaker: looking_glass
          text: You, O Queen, are the fairest of all.
        - id: ch01-b06
          speaker: narrator
          text: |-
            That answer always satisfied her, because she knew the glass told the truth.

            Snow-white grew more beautiful every year. By the time she was seven, she was as beautiful as the day, and more beautiful than the Queen. One day, the Queen asked the glass her usual question.
        - id: ch01-b07
          speaker: stepmother
          text: Looking-glass, looking-glass, on the wall, who is the fairest in the land of all?
        - id: ch01-b08
          speaker: looking_glass
          text: You are fairer than all who are here, Lady Queen. But Snow-white is fairer still.
        - id: ch01-b09
          speaker: narrator
          text: |-
            The Queen was horrified. Her face turned yellow and green with envy. From then on, the sight of Snow-white made her heart heave with hatred. Envy and pride grew in her heart like a weed, and she had no peace by day or night.

            At last, she summoned a huntsman.
        - id: ch01-b10
          speaker: stepmother
          text: Take that child into the forest. I never want to see her again. Kill her, and bring me her heart as proof.
          emotion: angry
        - id: ch01-b11
          speaker: narrator
          text: The huntsman obeyed. He took Snow-white far into the forest, just as the Queen had ordered. There he drew his knife. As he was about to pierce the innocent child's heart, Snow-white saw what he meant to do and began to cry.
        - id: ch01-b12
          speaker: snow_white
          text: Oh, dear huntsman, please let me live! I'll run deep into the wild forest, and I'll never come home again.
          emotion: fearful
        - id: ch01-b13
          speaker: narrator
          text: Her beauty moved the huntsman to pity.
        - id: ch01-b14
          speaker: huntsman
          text: Then run, you poor child.
        - id: ch01-b15
          speaker: narrator
          text: |-
            He thought the wild animals would soon devour her. Even so, letting her go felt like rolling a stone from his heart. Just then, a young boar ran past. The huntsman killed it, cut out its heart, and took that to the Queen as proof that Snow-white was dead. The cook salted it, and the wicked Queen ate it, believing she had eaten Snow-white's heart.

            Snow-white was now alone in the great forest. She was so frightened that every leaf on every tree seemed to catch her eye, and she had no idea what to do. At last she began to run. Sharp stones cut beneath her feet, and thorns caught at her as she pushed through. Wild animals ran past her, but none of them harmed her.

            She ran until her feet could carry her no farther. Evening was close when she spotted a little cottage and went inside to rest. Everything there was tiny, wonderfully neat, and clean. A white cloth covered the table. On it stood seven small plates, seven spoons, seven knives and forks, and seven little mugs. Along the wall were seven small beds, side by side, each covered in snowy white.
        - id: ch01-b16
          speaker: narrator
          text: Snow-white was terribly hungry and thirsty. She ate a little bread and a few vegetables from each of the seven plates. Then she drank a single drop of wine from each of the seven mugs. She divided everything that way because she did not want to take all her food and drink from one person's place. Afterward, her tired body needed sleep. She lay on one little bed, but it was too long. Another was too short. She tried them one after another until the seventh bed fit her at last. Snow-white said a prayer, settled there, and fell asleep.
    - id: ch02
      title: The House of the Seven Dwarfs
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: When it was completely dark, the owners of the cottage returned. They were seven dwarfs, and each day they dug and delved in the mountains for ore. One by one, they lit their seven candles. Light filled the little house, and right away they saw that someone had been there. Nothing was quite in the order they had left it.
        - id: ch02-b02
          speaker: dwarf_one
          text: Who sat in my chair?
        - id: ch02-b03
          speaker: dwarf_two
          text: Who ate from my plate?
        - id: ch02-b04
          speaker: dwarf_three
          text: Who took some of my bread?
        - id: ch02-b05
          speaker: dwarf_four
          text: Who ate my vegetables?
        - id: ch02-b06
          speaker: dwarf_five
          text: Who used my fork?
        - id: ch02-b07
          speaker: dwarf_six
          text: Who cut something with my knife?
        - id: ch02-b08
          speaker: dwarf_seven
          text: Who drank from my mug?
        - id: ch02-b09
          speaker: narrator
          text: The first dwarf looked around and noticed a hollow in his bed.
        - id: ch02-b10
          speaker: dwarf_one
          text: Who climbed into my bed?
        - id: ch02-b11
          speakers: [dwarf_two, dwarf_three, dwarf_four, dwarf_five]
          ensemble: chorus
          text: Someone lay in my bed, too!
        - id: ch02-b12
          speaker: narrator
          text: The other dwarfs hurried to their own beds, and each found that someone had lain there, too. But when the seventh dwarf reached his bed, he found Snow-white still asleep in it. He called to his companions. They all came running, crying out in astonishment. Then they brought their seven little candles close and let the light shine over Snow-white.
        - id: ch02-b13
          speakers: [dwarf_one, dwarf_two, dwarf_three, dwarf_four]
          ensemble: chorus
          text: Oh, heavens! What a beautiful child!
          emotion: surprised
        - id: ch02-b14
          speaker: narrator
          text: |-
            They were so delighted that they did not wake her. They let her sleep while the seventh dwarf spent one hour beside each of his companions, moving from bed to bed through the night.

            In the morning, Snow-white woke and was frightened to see seven dwarfs around her. But they spoke kindly and asked her name.
        - id: ch02-b15
          speaker: snow_white
          text: My name is Snow-white.
        - id: ch02-b16
          speakers: [dwarf_one, dwarf_two, dwarf_three, dwarf_four]
          ensemble: chorus
          text: How did you find your way to our house?
        - id: ch02-b17
          speaker: narrator
          text: Snow-white told them that her stepmother had wanted her killed, that the huntsman had spared her, and that she had run all day before finding their home.
        - id: ch02-b18
          speakers: [dwarf_one, dwarf_two, dwarf_three, dwarf_four]
          ensemble: chorus
          text: If you keep our house, cook our meals, make the beds, wash, sew, and knit, and leave everything neat and clean, you may stay with us. You won't lack anything.
        - id: ch02-b19
          speaker: snow_white
          text: Yes. I'll gladly do all of that.
          emotion: happy
        - id: ch02-b20
          speaker: narrator
          text: So Snow-white stayed with the seven dwarfs and did everything she had promised. She cooked and washed, made the beds, sewed and knitted, and kept their home neat and clean. Each morning, the dwarfs left for the mountains to search for copper and gold. They worked there all day. In the evening, they came home, and their supper had to be ready for them. Snow-white was alone in the cottage from morning until night, so the good dwarfs gave her a serious warning.
        - id: ch02-b21
          speakers: [dwarf_one, dwarf_two, dwarf_three, dwarf_four]
          ensemble: chorus
          text: Watch out for your stepmother. She'll soon learn where you are. Make sure you don't let anyone inside.
    - id: ch03
      title: Laces and a Poisoned Comb
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The Queen believed she had eaten Snow-white's heart. Certain that she was once again the most beautiful woman of all, she went to her looking-glass.
        - id: ch03-b02
          speaker: stepmother
          text: Looking-glass, looking-glass, on the wall, who is the fairest in the land of all?
        - id: ch03-b03
          speaker: looking_glass
          text: O Queen, you are the fairest I see. But beyond the hills, where the seven dwarfs dwell, Snow-white is alive and well, and no one is as fair as she.
        - id: ch03-b04
          speaker: narrator
          text: |-
            The Queen was stunned by what she heard. She knew the looking-glass had never spoken falsely. There could be only one answer. The huntsman had betrayed her, and little Snow-white was still alive.

            As long as Snow-white remained the fairest in the whole land, envy would not let the Queen rest. She thought about killing the girl again. She turned one plan over after another until at last she knew what to do. The Queen painted her face and dressed like an old peddler woman. Her disguise was so complete that no one could have recognized her. Then she traveled over all seven mountains to the seven dwarfs' cottage. She knocked and called through the door.
        - id: ch03-b05
          speaker: stepmother
          text: Pretty things for sale! Very cheap, very cheap!
        - id: ch03-b06
          speaker: narrator
          text: Snow-white looked through the window.
        - id: ch03-b07
          speaker: snow_white
          text: Good day, ma'am. What are you selling?
        - id: ch03-b08
          speaker: stepmother
          text: Good things, pretty things. I have stay-laces in every color.
        - id: ch03-b09
          speaker: narrator
          text: She pulled out a lace woven from bright silk. Snow-white decided such a respectable old woman could come inside. She unbolted the door and bought the pretty lace.
        - id: ch03-b10
          speaker: stepmother
          text: Child, you look dreadful. Come here and let me lace you the right way.
        - id: ch03-b11
          speaker: narrator
          text: Snow-white suspected nothing. She stood still while the woman fitted the new lace around her. But the Queen pulled it tight, then tighter, until Snow-white could not breathe. She fell as if dead.
        - id: ch03-b12
          speaker: stepmother
          text: Now I'm the most beautiful.
        - id: ch03-b13
          speaker: narrator
          text: |-
            The Queen ran away.

            That evening, the seven dwarfs came home and found their dear Snow-white on the floor. She did not move or stir and seemed to be dead. They lifted her and saw that her laces were much too tight. The dwarfs cut them apart. Snow-white began to breathe, and after a little while, she came back to life. When they heard what had happened, they understood at once.
        - id: ch03-b14
          speakers: [dwarf_one, dwarf_two, dwarf_three, dwarf_four]
          ensemble: chorus
          text: That old peddler was the wicked Queen. Be careful! While we're away, don't let anyone inside.
        - id: ch03-b15
          speaker: narrator
          text: Back at the palace, the Queen stood before the glass again.
        - id: ch03-b16
          speaker: stepmother
          text: Looking-glass, looking-glass, on the wall, who is the fairest in the land of all?
        - id: ch03-b17
          speaker: looking_glass
          text: O Queen, you are the fairest I see. But beyond the hills, where the seven dwarfs dwell, Snow-white is alive and well, and no one is as fair as she.
        - id: ch03-b18
          speaker: narrator
          text: Fear sent all the blood rushing to the Queen's heart. Snow-white was alive again.
        - id: ch03-b19
          speaker: stepmother
          text: This time I'll make something that will finish you.
          emotion: angry
        - id: ch03-b20
          speaker: narrator
          text: The Queen knew witchcraft. She used it to make a poisoned comb, then disguised herself as a different old woman. Once more, she crossed the seven mountains, knocked at the cottage, and called out.
        - id: ch03-b21
          speaker: stepmother
          text: Good things for sale! Cheap, cheap!
        - id: ch03-b22
          speaker: narrator
          text: Snow-white looked outside.
        - id: ch03-b23
          speaker: snow_white
          text: Go away. I can't let anyone come in.
        - id: ch03-b24
          speaker: stepmother
          text: Surely you're allowed to look.
        - id: ch03-b25
          speaker: narrator
          text: The old woman held up the poisoned comb. Snow-white liked it so much that she let herself be persuaded and opened the door. After they agreed on a price, the woman spoke again.
        - id: ch03-b26
          speaker: stepmother
          text: Now let me comb your hair properly.
        - id: ch03-b27
          speaker: narrator
          text: Poor Snow-white had no suspicion that the old woman was her stepmother in disguise. She stood quietly and let the woman do whatever she liked. But the moment the comb went into Snow-white's hair, the poison hidden in it began to work. The girl collapsed to the floor without feeling or movement.
        - id: ch03-b28
          speaker: stepmother
          text: So much for the great beauty. Now you're done for.
        - id: ch03-b29
          speaker: narrator
          text: |-
            She hurried away.

            Luckily, evening was near. The dwarfs returned and found Snow-white lying as if dead. They suspected her stepmother immediately. When they searched, they found the poisoned comb. As soon as they pulled it from Snow-white's hair, she woke and told them what had happened.
        - id: ch03-b30
          speakers: [dwarf_one, dwarf_two, dwarf_three, dwarf_four]
          ensemble: chorus
          text: You must be on your guard. Don't open the door to anyone.
    - id: ch04
      title: The Poisoned Apple
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: At home, the Queen went straight to the looking-glass.
        - id: ch04-b02
          speaker: stepmother
          text: Looking-glass, looking-glass, on the wall, who is the fairest in the land of all?
        - id: ch04-b03
          speaker: looking_glass
          text: O Queen, you are the fairest I see. But beyond the hills, where the seven dwarfs dwell, Snow-white is alive and well, and no one is as fair as she.
        - id: ch04-b04
          speaker: narrator
          text: The Queen trembled and shook with rage.
        - id: ch04-b05
          speaker: stepmother
          text: Snow-white will die, even if it costs me my own life!
          emotion: angry
        - id: ch04-b06
          speaker: narrator
          text: |-
            She went into a secret, lonely room where no one else ever entered. There she made a deadly poisonous apple. It looked lovely from the outside, white with one red cheek. Anyone who saw it would want a taste, but one bite would bring death.

            When the apple was ready, the Queen painted her face and dressed as a country woman. She crossed the seven mountains and knocked at the dwarfs' door. Snow-white leaned out of the window.
        - id: ch04-b07
          speaker: snow_white
          text: I can't let you come in. The seven dwarfs have forbidden it.
        - id: ch04-b08
          speaker: stepmother
          text: That's no concern of mine. I'll soon sell all these apples. Here, I'll give you one.
        - id: ch04-b09
          speaker: snow_white
          text: No. I don't dare take anything.
        - id: ch04-b10
          speaker: stepmother
          text: Are you worried it's poisoned? Watch. I'll cut it in half. You can have the red side, and I'll eat the white.
        - id: ch04-b11
          speaker: narrator
          text: |-
            The apple had been cleverly made so that only its red half held poison. Snow-white longed for the beautiful fruit. When she saw the woman eat from the white half, she could resist no longer. She reached out and took the poisoned piece.

            The moment she bit it, Snow-white fell dead.
        - id: ch04-b12
          speaker: narrator
          text: The Queen stared at her dreadfully, then burst into laughter.
        - id: ch04-b13
          speaker: stepmother
          text: White as snow, red as blood, black as ebony wood! This time the dwarfs won't wake you again.
        - id: ch04-b14
          speaker: narrator
          text: Back at home, she questioned the looking-glass.
        - id: ch04-b15
          speaker: stepmother
          text: Looking-glass, looking-glass, on the wall, who is the fairest in the land of all?
        - id: ch04-b16
          speaker: looking_glass
          text: O Queen, in this land, you are the fairest of all.
        - id: ch04-b17
          speaker: narrator
          text: |-
            At last, the Queen's envious heart was at rest, as much as an envious heart can ever rest.

            That evening, the dwarfs came home and found Snow-white lying on the ground. She no longer breathed. This time she truly seemed dead. They lifted her and searched all over for something poisonous. First they loosened her clothes. Then they combed through her hair. They washed her with water and with wine, trying everything they could think of. Nothing helped at all. The poor child was dead, and she remained dead.
        - id: ch04-b18
          speaker: narrator
          text: They laid her on a bier. All seven sat around her and wept for three days.
    - id: ch05
      title: The Glass Coffin
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The dwarfs meant to bury Snow-white, but she still looked alive, and her cheeks were still a lovely red.
        - id: ch05-b02
          speakers: [dwarf_one, dwarf_two, dwarf_three, dwarf_four]
          ensemble: chorus
          text: We can't bury her under the dark ground.
          emotion: sad
        - id: ch05-b03
          speaker: narrator
          text: |-
            So they had a clear glass coffin made, where Snow-white could be seen from every side. They laid her inside. In golden letters, they wrote her name and that she was a king's daughter. They placed the coffin on the mountain, and one dwarf always stayed beside it to keep watch. Birds came and mourned for Snow-white, too. First came an owl, then a raven, and finally a dove.

            Snow-white lay in the coffin for a long, long time. She did not change. She looked as if she were asleep, for she was white as snow, red as blood, and her hair was black as ebony.

            One day, a king's son traveled through the forest and stopped at the dwarfs' cottage for the night. He saw the coffin on the mountain, saw beautiful Snow-white within it, and read the golden words. Then he spoke to the dwarfs.
        - id: ch05-b04
          speaker: prince
          text: Give me the coffin. I'll pay whatever price you ask.
        - id: ch05-b05
          speakers: [dwarf_one, dwarf_two, dwarf_three, dwarf_four]
          ensemble: chorus
          text: We wouldn't give it up for all the gold in the world.
        - id: ch05-b06
          speaker: prince
          text: Then give it to me as a gift. I can't live without seeing Snow-white. I will honor and treasure her as the person dearest to me.
        - id: ch05-b07
          speaker: narrator
          text: |-
            His words moved the good dwarfs to pity, and they gave him the coffin.

            The prince's servants lifted it onto their shoulders and carried it away. As they went, they stumbled over a tree stump. The jolt knocked loose the poisoned piece of apple that Snow-white had bitten. It flew out of her throat.

            Before long, Snow-white opened her eyes. She raised the coffin lid, sat up, and was alive once more.
        - id: ch05-b08
          speaker: snow_white
          text: Oh, heavens! Where am I?
          emotion: surprised
        - id: ch05-b09
          speaker: prince
          text: You're with me.
          emotion: happy
        - id: ch05-b10
          speaker: narrator
          text: Filled with joy, the prince told her everything that had happened.
        - id: ch05-b11
          speaker: prince
          text: I love you more than anything in the world. Come with me to my father's palace, and be my wife.
        - id: ch05-b12
          speaker: narrator
          text: Snow-white agreed and went with him.
    - id: ch06
      title: The Wedding Feast
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: |-
            Snow-white and the prince celebrated their wedding with great splendor. Snow-white's wicked stepmother was invited to the feast.

            After dressing in her finest clothes, the Queen went to her looking-glass.
        - id: ch06-b02
          speaker: stepmother
          text: Looking-glass, looking-glass, on the wall, who is the fairest in the land of all?
        - id: ch06-b03
          speaker: looking_glass
          text: O Queen, among those here, you are the fairest. But the young Queen is fairer by far.
        - id: ch06-b04
          speaker: narrator
          text: |-
            The wicked Queen cursed. She was so miserable that she did not know what to do. At first she refused to attend the wedding, but she could find no peace. She had to go and see the young Queen for herself.

            The moment she entered, she recognized Snow-white. Rage and fear stopped her where she stood. She could not move.
        - id: ch06-b05
          speaker: narrator
          text: Iron slippers had already been heating in the fire. They were carried in with tongs and placed before the Queen. She was forced to put on the red-hot shoes and dance until she fell down dead.
