audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静从容的童话讲述
        timbre: 温暖清澈
        pace: 舒缓而有张力
        pitch: 中音
    queen:
      display_name: 王后
      tts:
        delivery: 高傲冷酷，嫉妒时狠厉
        timbre: 华丽而尖锐
        pace: 稍慢，情绪激烈时加快
        pitch: 中高音
    mirror:
      display_name: 魔镜
      tts:
        delivery: 郑重而不带偏见
        timbre: 空灵清亮
        pace: 平稳
        pitch: 中音
    snow_white:
      display_name: 白雪公主
      tts:
        delivery: 天真真诚，危急时惶恐
        timbre: 清甜稚嫩
        pace: 自然轻快
        pitch: 高音
    huntsman:
      display_name: 猎人
      tts:
        delivery: 粗朴直接，带着怜悯
        timbre: 低沉厚实
        pace: 稍慢
        pitch: 低音
    dwarf_1:
      display_name: 第一个小矮人
      tts:
        delivery: 直率警觉
        timbre: 明亮结实
        pace: 轻快
        pitch: 中音
    dwarf_2:
      display_name: 第二个小矮人
      tts:
        delivery: 认真好奇
        timbre: 温和清楚
        pace: 轻快
        pitch: 中音
    dwarf_3:
      display_name: 第三个小矮人
      tts:
        delivery: 朴实敏锐
        timbre: 略带沙哑
        pace: 轻快
        pitch: 中低音
    dwarf_4:
      display_name: 第四个小矮人
      tts:
        delivery: 爽快警醒
        timbre: 饱满有力
        pace: 轻快
        pitch: 中音
    dwarf_5:
      display_name: 第五个小矮人
      tts:
        delivery: 仔细而活泼
        timbre: 清脆
        pace: 轻快
        pitch: 中高音
    dwarf_6:
      display_name: 第六个小矮人
      tts:
        delivery: 干脆认真
        timbre: 稳实
        pace: 轻快
        pitch: 中音
    dwarf_7:
      display_name: 第七个小矮人
      tts:
        delivery: 温厚友善
        timbre: 柔和圆润
        pace: 从容
        pitch: 中低音
    dwarfs:
      display_name: 七个小矮人
      tts:
        delivery: 齐声时热诚，告诫时严肃
        timbre: 高低交错的群声
        pace: 自然
        pitch: 中音
    prince:
      display_name: 王子
      tts:
        delivery: 恳切坚定
        timbre: 清朗温厚
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 白雪般的孩子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 隆冬时节，雪花像羽毛一样从天上飘下来。一位王后坐在黑檀木窗框边做针线。她一边缝，一边望着外面的雪，针尖忽然扎破手指，三滴鲜血落在白雪上。红与白映在一起，十分好看。王后心想，要是能有个孩子，肌肤像雪一样白，嘴唇像血一样红，头发像窗框的木头一样黑，那该多好。不久，她真的生下一个女儿。孩子正是她盼望的模样，于是取名白雪公主。可是，孩子刚出生，王后便去世了。一年后，国王又娶了一位妻子。新王后容貌美丽，性情却骄傲傲慢，绝不肯让别人胜过自己。她有一面神奇的魔镜。每当她站到镜前，看着镜中的自己，都要问同一个问题。她知道，魔镜从来不说谎。
        - id: ch01-b02
          speaker: queen
          text: 墙上的镜子，镜子，全国谁最美丽？
        - id: ch01-b03
          speaker: mirror
          text: 王后啊，您最美丽！
        - id: ch01-b04
          speaker: narrator
          text: 王后听见这句话，总是心满意足。白雪公主却一天天长大，也一天比一天漂亮。七岁那年，她美得像明亮的白昼，比王后还要美。这一次，王后再问魔镜，答案变了。
        - id: ch01-b05
          speaker: queen
          text: 墙上的镜子，镜子，全国谁最美丽？
        - id: ch01-b06
          speaker: mirror
          text: 王后娘娘，这里数您最美丽，可是白雪公主比您更美丽。
        - id: ch01-b07
          speaker: narrator
          text: 王后大吃一惊，嫉妒得脸色一阵黄、一阵青。从此，只要看见白雪公主，她就恨得心口起伏。嫉妒和骄傲像野草，在她心里越长越高，叫她日夜不得安宁。终于，她召来一个猎人，要他把孩子带进森林杀掉，再把她的心带回来作凭证。猎人把白雪公主带到林中，拔出了刀。眼看刀尖就要刺进她的心口，白雪公主哭着求他。
        - id: ch01-b08
          speaker: snow_white
          text: 好心的猎人，请饶了我吧！我会逃进荒林，再也不回家。
          emotion: fearful
        - id: ch01-b09
          speaker: narrator
          text: 猎人看着这个美丽又无辜的孩子，动了恻隐之心。
        - id: ch01-b10
          speaker: huntsman
          text: 那你快逃吧，可怜的孩子。
        - id: ch01-b11
          speaker: narrator
          text: 他暗想，野兽很快就会把她吃掉。可自己不用亲手杀她，他心上那块大石总算落了地。正巧一头小野猪跑过，他刺死野猪，挖出它的心，拿回去证明孩子已死。厨子只得用盐把那颗心腌好。恶毒的王后吃了下去，还以为那就是白雪公主的心。白雪公主独自留在茫茫森林，怕得连每棵树上的每一片叶子都要看个仔细。她不知道怎么办，只顾越过尖石，穿过荆棘，一直向前跑。野兽从身旁经过，却没有伤她。她跑了整整一天，直到双脚再也迈不动，天也快黑了，才看见一座小屋。她走进去，想歇一歇。屋里每样东西都很小，却整洁极了。铺着白布的桌上，有七只小盘子，每只盘里都有一把小勺，旁边还摆着七把小刀、七把小叉和七只小杯子。墙边并排放着七张小床，都盖着雪白的被子。她又饿又渴，就从每只盘子里吃一点蔬菜和面包，从每只杯子里喝一小口葡萄酒，因为不肯把一个人的食物全吃光。她累极了，便在小床上挨个儿躺下。这张太长，那张又太短，只有第七张正合适。她做过祷告，便躺在那里睡着了。
    - id: ch02
      title: 七个小矮人的家
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 夜里，小屋的主人回来了。他们是七个小矮人，白天在山里挖矿石。他们点亮七支蜡烛，马上发现屋里的东西和离开时不一样。
        - id: ch02-b02
          speaker: dwarf_1
          text: 谁坐了我的椅子？
        - id: ch02-b03
          speaker: dwarf_2
          text: 谁吃了我盘里的东西？
        - id: ch02-b04
          speaker: dwarf_3
          text: 谁拿走了我的面包？
        - id: ch02-b05
          speaker: dwarf_4
          text: 谁吃过我的蔬菜？
        - id: ch02-b06
          speaker: dwarf_5
          text: 谁用过我的叉子？
        - id: ch02-b07
          speaker: dwarf_6
          text: 谁拿我的刀切了东西？
        - id: ch02-b08
          speaker: dwarf_7
          text: 谁喝了我杯里的酒？
        - id: ch02-b09
          speaker: narrator
          text: 第一个小矮人发现自己的床凹下一块。
        - id: ch02-b10
          speaker: dwarf_1
          text: 谁爬上了我的床？
        - id: ch02-b11
          speaker: dwarfs
          text: 我们的床也有人躺过！
          emotion: surprised
        - id: ch02-b12
          speaker: narrator
          text: 其他小矮人赶过来，发现自己的床也被人躺过。第七个小矮人再看向自己的床，白雪公主正在上面熟睡。他赶紧叫来伙伴。大家跑到床边，惊讶地喊了起来，又举起七支小蜡烛，让烛光照在她脸上。
        - id: ch02-b13
          speaker: dwarfs
          text: 天哪，天哪！这个孩子真可爱！
          emotion: surprised
        - id: ch02-b14
          speaker: narrator
          text: 他们欢喜得没有叫醒她，任她继续睡。第七个小矮人只好轮流在伙伴们的床上睡，每张床睡一个钟头，就这样过了一夜。第二天早晨，白雪公主醒来，看见七个小矮人，吓了一跳。他们友善地问她叫什么。
        - id: ch02-b15
          speaker: snow_white
          text: 我叫白雪公主。
        - id: ch02-b16
          speaker: dwarfs
          text: 你是怎么到我们家来的？
        - id: ch02-b17
          speaker: narrator
          text: 她告诉他们，继母想杀她，猎人饶了她的性命。她跑了一整天，最后找到了这座小屋。
        - id: ch02-b18
          speaker: dwarfs
          text: 你要是愿意替我们看家，做饭、铺床、洗衣、缝补、织毛线，把屋里收拾干净，就留下来吧。你什么也不会缺。
        - id: ch02-b19
          speaker: snow_white
          text: 我愿意，我打心眼里愿意！
          emotion: happy
        - id: ch02-b20
          speaker: narrator
          text: 白雪公主从此住了下来，为他们料理家务，把小屋收拾得井井有条。每天早晨，小矮人上山寻找铜和金子，直到晚上才回来。那时，白雪公主已经为他们备好了晚饭。她白天总是独自在家，小矮人担心继母找来，临走前特意叮嘱她。
        - id: ch02-b21
          speaker: dwarfs
          text: 小心你的继母。她很快就会找到这里。我们不在，谁来都别让他进门。
    - id: ch03
      title: 鲜艳的束衣带
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 王后以为自己吃下了白雪公主的心，觉得自己又是全国最美的人。她走到魔镜前。
        - id: ch03-b02
          speaker: queen
          text: 墙上的镜子，镜子，全国谁最美丽？
        - id: ch03-b03
          speaker: mirror
          text: 王后啊，我眼中数您最美丽。可是在群山那边，七个小矮人的家里，白雪公主依然活得好好的，谁也比不上她美丽。
        - id: ch03-b04
          speaker: narrator
          text: 王后惊呆了。魔镜从不说谎，她立刻明白猎人骗了自己，白雪公主还活着。只要自己不是全国最美的人，嫉妒就不让她安宁。她想了又想，终于想出一条毒计。她往脸上涂了颜色，换上衣服，扮成一个老女货郎，谁也认不出她。她翻过七座山，来到小矮人的屋前，敲响了门。
        - id: ch03-b05
          speaker: queen
          text: 漂亮东西，又好又便宜！
        - id: ch03-b06
          speaker: snow_white
          text: 您好，老婆婆。您卖的是什么？
        - id: ch03-b07
          speaker: queen
          text: 都是又好又漂亮的东西。你看，各种颜色的束衣带。
        - id: ch03-b08
          speaker: narrator
          text: 她从货物里抽出一根束衣带，那带子用鲜艳的彩丝织成，漂亮极了。白雪公主心想，这位看起来正派的老婆婆应该可以进来。她忘了小矮人的警告，拉开门闩，把人放进屋，还买下了那根漂亮的带子。
        - id: ch03-b09
          speaker: queen
          text: 孩子，瞧你这副邋遢样。过来，我替你好好系一回。
        - id: ch03-b10
          speaker: narrator
          text: 白雪公主一点也没有怀疑，乖乖站到她面前，任她用新带子束衣。王后下手又快又狠，把带子越勒越紧。白雪公主完全喘不过气来，倒在地上，像死去了一样。
        - id: ch03-b11
          speaker: queen
          text: 现在，我才是最美的。
        - id: ch03-b12
          speaker: narrator
          text: 王后转身逃走了。没过多久，傍晚到了。小矮人们回到家，看见心爱的白雪公主倒在地上，一动不动，像是已经死去，都吓坏了。他们把她抱起来，发现衣带系得太紧，赶紧把带子剪断。白雪公主先是慢慢有了一点呼吸，过了一会儿，又活了过来。听完事情的经过，小矮人们认出了凶手。
        - id: ch03-b13
          speaker: dwarfs
          text: 那个老货郎就是恶毒的王后。千万小心！我们不在，谁来都别开门。
    - id: ch04
      title: 有毒的梳子
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 王后回到家，又站在镜子前。
        - id: ch04-b02
          speaker: queen
          text: 墙上的镜子，镜子，全国谁最美丽？
        - id: ch04-b03
          speaker: mirror
          text: 王后啊，我眼中数您最美丽。可是在群山那边，七个小矮人的家里，白雪公主依然活得好好的，谁也比不上她美丽。
        - id: ch04-b04
          speaker: narrator
          text: 听见白雪公主还活着，她吓得全身的血都涌向心口。
        - id: ch04-b05
          speaker: queen
          text: 这一次，我一定要想个办法，彻底了结你。
        - id: ch04-b06
          speaker: narrator
          text: 王后懂得巫术。她施展法术，做出一把有毒的梳子。接着，她又换了装束，变成另一个老婆婆的模样，再次翻过七座山，来到小矮人的屋门前，一边敲门，一边叫卖。
        - id: ch04-b07
          speaker: queen
          text: 好东西，又便宜又好！
        - id: ch04-b08
          speaker: snow_white
          text: 快走吧，我不能放任何人进来。
        - id: ch04-b09
          speaker: queen
          text: 不让我进门，看一眼总行吧？
        - id: ch04-b10
          speaker: narrator
          text: 老婆婆掏出那把毒梳，举起来给她看。白雪公主一眼就喜欢上了它，受不住诱惑，还是开了门。等两人谈好价钱，老婆婆便叫她坐到自己面前。
        - id: ch04-b11
          speaker: queen
          text: 来，我替你好好梳一回头。
        - id: ch04-b12
          speaker: narrator
          text: 白雪公主毫无戒心。梳子刚插进头发，毒性便发作，她立刻失去知觉，倒在地上。
        - id: ch04-b13
          speaker: queen
          text: 你这个美人尖儿，这回总算完了。
        - id: ch04-b14
          speaker: narrator
          text: 王后说完便走了。幸好天色已经接近黄昏，小矮人们很快回到家。他们看见白雪公主像死去一样倒在地上，马上疑心是继母下的手。他们仔细查看，终于在她头发里找到了毒梳。梳子才拔出来，白雪公主便醒了。她把事情从头到尾讲了一遍，小矮人再次警告她，一定要提防继母，无论谁来，都不能开门。王后回到家，又站在镜子前，得到的还是同一个回答。
        - id: ch04-b15
          speaker: queen
          text: 墙上的镜子，镜子，全国谁最美丽？
        - id: ch04-b16
          speaker: mirror
          text: 王后啊，我眼中数您最美丽。可是在群山那边，七个小矮人的家里，白雪公主依然活得好好的，谁也比不上她美丽。
        - id: ch04-b17
          speaker: narrator
          text: 王后气得浑身发抖。
        - id: ch04-b18
          speaker: queen
          text: 白雪公主非死不可，哪怕赔上我的性命！
          emotion: angry
    - id: ch05
      title: 红白相间的苹果
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 王后走进一间从来没有人去的隐秘屋子，做出一个毒性极强的苹果。苹果一边雪白，一边鲜红，外表诱人极了，谁看见都想吃。可只要咬上一口，就必死无疑。她又扮成乡下女人，带着苹果翻过七座山，敲响小屋的门。
        - id: ch05-b02
          speaker: snow_white
          text: 我不能让您进来。七个小矮人不许我开门。
        - id: ch05-b03
          speaker: queen
          text: 随你的便。我的苹果很快就能卖完。喏，这一个送给你。
        - id: ch05-b04
          speaker: snow_white
          text: 不行，我什么东西都不敢拿。
        - id: ch05-b05
          speaker: queen
          text: 你怕苹果有毒？看着，我把它切成两半。红的归你，白的归我。
        - id: ch05-b06
          speaker: narrator
          text: 这个苹果做得十分巧妙，只有红的半边有毒。白雪公主看着那个漂亮的苹果，实在很想尝一尝。又见老婆婆当着她的面吃下白的那半，她再也忍不住，伸手接过了有毒的红苹果。她才把一小口放进嘴里，便倒在地上死了。王后站在窗外，用可怕的目光盯住她，放声大笑。
        - id: ch05-b07
          speaker: queen
          text: 白得像雪，红得像血，黑得像黑檀木！这一回，小矮人再也救不醒你了。
          emotion: happy
        - id: ch05-b08
          speaker: narrator
          text: 王后回家后，又问魔镜谁最美丽。
        - id: ch05-b09
          speaker: queen
          text: 墙上的镜子，镜子，全国谁最美丽？
        - id: ch05-b10
          speaker: mirror
          text: 王后啊，全国数您最美丽。
        - id: ch05-b11
          speaker: narrator
          text: 这时，她那颗嫉妒的心才安定下来——如果嫉妒的心当真能安定的话。傍晚，小矮人们回到家，发现白雪公主躺在地上，已经没有呼吸，真的死了。他们把她抱起来，仔细寻找有毒的东西。他们解开她的衣带，梳理她的头发，又用水和葡萄酒为她清洗，可全都没有用。可怜的孩子死了，再也没有醒来。七个小矮人把她放在灵床上，围坐在四周，为她哭了整整三天。他们本想把她安葬，可她看起来仍像活着，脸颊依然那么红润。
        - id: ch05-b12
          speaker: dwarfs
          text: 我们不能把她埋进黑暗的泥土里。
          emotion: sad
        - id: ch05-b13
          speaker: narrator
          text: 于是，他们请人做了一口透明的玻璃棺材，让人从四面都能看见她。他们把白雪公主放进去，用金字写下她的名字，还写明她是一位国王的女儿。棺材被安放在山上，七个小矮人轮流守护，总有一个人留在旁边。鸟儿也飞来为她哭泣，先是猫头鹰，然后是乌鸦，最后是一只鸽子。白雪公主在棺材里躺了很久很久，模样一直没有改变，仿佛只是在熟睡。她的肌肤白得像雪，嘴唇红得像血，头发黑得像黑檀木。
    - id: ch06
      title: 沉睡的人醒来了
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 有一天，一位王子来到森林，去小矮人家借宿。他看见山上的玻璃棺材和棺中的白雪公主，也读了棺材上的金字，知道她的名字，还知道她是一位国王的女儿。
        - id: ch06-b02
          speaker: prince
          text: 把这口棺材让给我吧。你们想要什么，我都可以给。
        - id: ch06-b03
          speaker: dwarfs
          text: 就算拿全世界的金子来换，我们也不会把她让出去。
        - id: ch06-b04
          speaker: prince
          text: 那就把她送给我吧。见不到白雪公主，我就活不下去。我会尊敬她、珍爱她，把她当成最心爱的珍宝。
        - id: ch06-b05
          speaker: narrator
          text: 王子说得这样恳切，好心的小矮人们动了恻隐之心，便把棺材交给他。王子叫仆人们把棺材扛在肩上，抬着它离开。途中，他们不小心绊在一个树桩上。棺材猛地一震，白雪公主先前咬下的那块毒苹果从喉咙里掉了出来。没过多久，她睁开眼睛，抬起棺盖，坐了起来。白雪公主又活了。
        - id: ch06-b06
          speaker: snow_white
          text: 天哪，我这是在哪里？
          emotion: surprised
        - id: ch06-b07
          speaker: prince
          text: 你和我在一起。
          emotion: happy
        - id: ch06-b08
          speaker: narrator
          text: 王子满心欢喜，把发生过的事告诉她。
        - id: ch06-b09
          speaker: prince
          text: 我爱你胜过世上的一切。跟我去父王的宫殿吧，做我的妻子。
        - id: ch06-b10
          speaker: narrator
          text: 白雪公主答应了，跟他回到宫殿。他们举行了一场盛大华丽的婚礼，白雪公主那恶毒的继母也接到了邀请。王后穿上漂亮衣裳，照例走到魔镜前。
        - id: ch06-b11
          speaker: queen
          text: 墙上的镜子，镜子，全国谁最美丽？
        - id: ch06-b12
          speaker: mirror
          text: 王后啊，这里数您最美丽，可是年轻的王后比您美丽千百倍。
        - id: ch06-b13
          speaker: narrator
          text: 恶毒的女人听见这话，开口咒骂起来。她痛苦万分，痛苦得简直不知如何是好。起初，她怎么也不肯去参加婚礼，可心里始终不得安宁，非要亲眼看看那位年轻王后不可。走进婚宴，她一眼认出白雪公主，顿时又怒又怕，僵在原地，连一步也动不了。铁鞋早已放在火中烧得通红。人们用火钳把鞋夹进来，摆到她面前，强迫她穿上。她只得穿着滚烫的铁鞋不停跳舞，直到倒在地上死去。
