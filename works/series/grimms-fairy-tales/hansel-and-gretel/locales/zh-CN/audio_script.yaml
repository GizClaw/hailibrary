audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉稳从容，带古老童话的讲述感
        timbre: 温暖清晰
        pace: 舒缓而有张力
        pitch: 中音
    hansel:
      display_name: 汉塞尔
      tts:
        delivery: 机敏勇敢，遇险时努力镇定
        timbre: 清亮的男孩声
        pace: 自然偏快
        pitch: 中高音
    gretel:
      display_name: 格蕾特
      tts:
        delivery: 天真敏感，危急时显出果断
        timbre: 清澈的女孩声
        pace: 自然
        pitch: 高音
    father:
      display_name: 父亲
      tts:
        delivery: 忧愁迟疑，语气朴实
        timbre: 低沉疲惫
        pace: 缓慢
        pitch: 低音
    stepmother:
      display_name: 继母
      tts:
        delivery: 冷硬急躁，言语尖刻
        timbre: 干涩锐利
        pace: 偏快
        pitch: 中音
    witch:
      display_name: 老巫婆
      tts:
        delivery: 伪善时甜腻，凶狠时尖厉
        timbre: 苍老沙哑
        pace: 忽缓忽急
        pitch: 中低音
  chapters:
    - id: ch01
      title: 月光下的白石子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 一片大森林旁，住着一个穷樵夫和他的妻子。家里还有两个孩子，男孩叫汉塞尔，女孩叫格蕾特。赶上遍地饥荒，家里那点吃的很快就没了，连每天的面包也找不到。一天夜里，樵夫愁得睡不着，在床上翻来覆去，最后忍不住叹起气来。
        - id: ch01-b02
          speaker: father
          text: 这可怎么办？咱们自己都没得吃了，拿什么喂两个可怜的孩子？
          emotion: sad
        - id: ch01-b03
          speaker: stepmother
          text: 我倒有个办法。明早把他们领到森林最深的地方，生一堆火，再给他们一人一块面包。然后咱们去干活，把他们留在那里。他们找不回家，咱们也就不用再养他们了。
        - id: ch01-b04
          speaker: father
          text: 不，我下不了这个手。把孩子独自丢在森林里，我怎么忍心？野兽很快就会来，把他们撕碎的！
          emotion: fearful
        - id: ch01-b05
          speaker: stepmother
          text: 你真是个傻瓜！不这么办，咱们四个都得饿死。你还不如现在就去刨棺材板！
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: 女人不肯让丈夫安生，一遍遍逼迫他，直到他终于答应照她的话去做。
        - id: ch01-b07
          speaker: father
          text: 可我心里还是舍不得那两个苦命的孩子。
          emotion: sad
        - id: ch01-b08
          speaker: narrator
          text: 两个孩子也饿得睡不着，把继母的话听得一清二楚。格蕾特止不住眼泪。
        - id: ch01-b09
          speaker: gretel
          text: 哥哥，这下咱们全完了。
          emotion: sad
        - id: ch01-b10
          speaker: hansel
          text: 别哭，格蕾特。我会想出办法救咱们的。
          emotion: calm
        - id: ch01-b11
          speaker: narrator
          text: 等大人睡熟，汉塞尔披上小外套，悄悄打开楼下的门，溜了出去。月亮照得四下通明，屋前的白石子像一枚枚银币，在地上闪着光。他弯腰捡了又捡，把衣袋装得满满的，这才回到妹妹身边。
        - id: ch01-b12
          speaker: hansel
          text: 放心睡吧，好妹妹。上帝不会丢下我们的。
          emotion: calm
        - id: ch01-b13
          speaker: narrator
          text: 汉塞尔说完，又躺回自己的床上。天刚蒙蒙亮，太阳还没出来，女人就走进来叫醒了两个孩子。
        - id: ch01-b14
          speaker: stepmother
          text: 起来，两个懒虫！咱们进森林捡柴去。这块面包留到中午再吃，吃完可就没有了。
        - id: ch01-b15
          speaker: narrator
          text: 每个孩子只分到一小块面包，而且这就是他们当天全部的食物。格蕾特把自己的藏在围裙下面，汉塞尔的口袋里却装着石子。一家人朝森林走去。没走多远，汉塞尔便停下来望着屋子，走几步又回一次头。
        - id: ch01-b16
          speaker: father
          text: 汉塞尔，你老往后看什么？别再落下了，看着路，好好走。
        - id: ch01-b17
          speaker: hansel
          text: 爸爸，我的小白猫正坐在屋顶上。它想跟我道别呢。
        - id: ch01-b18
          speaker: stepmother
          text: 傻孩子，那不是猫，是早晨的太阳照在烟囱上。
        - id: ch01-b19
          speaker: narrator
          text: 汉塞尔看的根本不是小猫。他每次停下来，都偷偷从口袋里取出一颗白石子，扔在身后的路上。到了森林中央，父亲让孩子们捡来枯枝，堆成一座小山，又把火点着。火焰越烧越高。
        - id: ch01-b20
          speaker: stepmother
          text: 你们就在火边躺下歇着吧。我们进林子砍柴，干完了就来接你们。
        - id: ch01-b21
          speaker: narrator
          text: 孩子们守着火堆。中午，他们吃掉各自的面包。附近一直响着劈木头的声音，他们以为父亲还在那里。其实，那只是父亲绑在枯树上的一根树枝，正被风吹得来回敲打。等了很久，两个孩子困得睁不开眼，终于睡熟了。再醒来时，四周已经漆黑。
        - id: ch01-b22
          speaker: gretel
          text: 哥哥，这么黑，咱们怎么走出森林？
          emotion: fearful
        - id: ch01-b23
          speaker: hansel
          text: 先等等。月亮一升起来，我就能带你找到路。
          emotion: calm
        - id: ch01-b24
          speaker: narrator
          text: 满月升上来了。汉塞尔牵住妹妹，沿着白石子往前走。那些石子像刚铸好的银币，一颗接一颗地发亮，一直为他们指着回家的方向。他们走了整整一夜，天亮时终于又站在自家门前。
        - id: ch01-b25
          speaker: stepmother
          text: 你们两个坏孩子！怎么在森林里睡到这么晚？我们还当你们永远不回来了！
        - id: ch01-b26
          speaker: narrator
          text: 父亲却满心欢喜。把孩子孤零零地留在森林以后，他一直心痛不已。如今看见他们平安回来，他总算放下了心。
    - id: ch02
      title: 消失的面包屑
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 没过多久，饥荒又来了。一天夜里，孩子们再次听见继母和父亲商量。
        - id: ch02-b02
          speaker: stepmother
          text: 东西又吃光了，只剩半条面包。吃完以后，什么都不会有。孩子必须走。这回把他们领得更远，叫他们再也出不来。咱们只有这样才能活命！
        - id: ch02-b03
          speaker: narrator
          text: 父亲心里沉甸甸的。他想着，还不如把最后一口食物也分给孩子。可女人一句也听不进去，只是不停地责骂他、数落他。头一次既然让了步，这一回，他也没能坚持到底。
        - id: ch02-b04
          speaker: narrator
          text: 孩子们仍旧醒着。等大人睡熟，汉塞尔又想出去捡白石子，可门已经让继母锁死了。
        - id: ch02-b05
          speaker: hansel
          text: 格蕾特，别再哭了，安安静静睡吧。仁慈的上帝会来帮咱们。
          emotion: calm
        - id: ch02-b06
          speaker: narrator
          text: 清早，女人把两个孩子从床上拽起来，只给他们一人一点面包，比上次还要小。路上，汉塞尔把自己的面包捏碎，藏在口袋里。他一会儿停一下，把一小块丢到地上。
        - id: ch02-b07
          speaker: father
          text: 汉塞尔，你停下来四处看什么？快往前走。
        - id: ch02-b08
          speaker: hansel
          text: 我的小鸽子在屋顶上，它想跟我告别。我在看它呢。
        - id: ch02-b09
          speaker: stepmother
          text: 真傻！那不是鸽子，是朝阳照着烟囱。
        - id: ch02-b10
          speaker: narrator
          text: 汉塞尔还是边走边撒，直到口袋里的面包屑全落在小路上。女人把孩子领到森林更深的地方，那地方他们从来没有到过。大人又生起一堆旺火。
        - id: ch02-b11
          speaker: stepmother
          text: 乖乖留在这里。累了就睡一会儿。我们去砍柴，傍晚再回来接你们。
        - id: ch02-b12
          speaker: narrator
          text: 中午到了，格蕾特把自己的面包分了一半给哥哥。汉塞尔那份，已经一路撒完。后来他们睡着了。黄昏来了，又悄悄过去，始终没人回来接这两个可怜的孩子。直到四周一片漆黑，他们才醒过来。
        - id: ch02-b13
          speaker: hansel
          text: 别怕，格蕾特。等月亮出来，咱们就能看见面包屑。顺着它们一定能回家。
          emotion: calm
        - id: ch02-b14
          speaker: narrator
          text: 月亮终于升起，孩子们马上动身。可路上一块面包屑也没有。树林里、田野间有成千上万只鸟，早就把它们啄光了。
        - id: ch02-b15
          speaker: hansel
          text: 咱们再找找，很快会找到路的。
        - id: ch02-b16
          speaker: narrator
          text: 他们没能找到。兄妹俩走过一整夜，第二天又从早走到晚，还是没走出森林。他们饿得发慌，只在地上找到两三颗浆果。最后，两条腿再也撑不住了，他们倒在一棵树下，睡了过去。
    - id: ch03
      title: 面包和糖做的小屋
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 离开父亲的屋子，已经过去三个早晨。孩子们重新迈开脚步，却只会越走越深。要是救援再不来，他们就会饿死、累死。中午，他们看见一只美丽的雪白小鸟停在树枝上。小鸟唱得美极了，他们不由得站在那里，一直听到歌声停下。随后，小鸟展开翅膀，在前面飞，他们就在后面紧紧跟随。
        - id: ch03-b02
          speaker: narrator
          text: 小鸟把他们带到一座小屋前，落在屋顶上。走近了，孩子们才看清，墙是面包砌的，屋顶铺着糕饼，晶莹的窗户竟然是糖做的。
        - id: ch03-b03
          speaker: hansel
          text: 这下可以饱餐一顿了！我尝尝屋顶，你去吃那扇窗户。糖窗一定很甜。
        - id: ch03-b04
          speaker: narrator
          text: 汉塞尔伸手掰下一点屋顶，尝了尝味道。格蕾特靠着窗子，也啃起糖做的窗玻璃。这时，屋里传出一个轻柔的声音。
        - id: ch03-b05
          speaker: witch
          text: 啃呀啃，咬呀咬，是谁在啃我的小屋角？
        - id: ch03-b06
          speakers: [hansel, gretel]
          ensemble: duo
          text: 是风呀，是风呀，那是天上吹来的风呀。
        - id: ch03-b07
          speaker: narrator
          text: 两个孩子一点也没停。汉塞尔觉得屋顶香极了，索性扯下一大块。格蕾特推出一整片圆窗，坐下来慢慢吃。忽然门开了，一个老得不能再老的女人拄着拐杖，慢吞吞地爬出来。孩子们吓得把手里的食物都掉在地上。老太婆却点了点头。
        - id: ch03-b08
          speaker: witch
          text: 哎呀，两个可爱的孩子，是谁领你们来的？快进屋吧，就留在我这里。谁也不会伤害你们。
        - id: ch03-b09
          speaker: narrator
          text: 老太婆一手牵着一个，把两个孩子带进小屋。桌上很快摆满了好吃的，有牛奶、薄饼和糖，还有苹果与坚果。吃完以后，老太婆又替他们铺好两张漂亮的小床，上面蒙着干净的白床单。汉塞尔和格蕾特躺进被窝，觉得自己简直进了天堂。
    - id: ch04
      title: 老巫婆的烤炉
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 可老太婆的和善全是假装的。她是个恶毒的巫婆，专门守候迷路的孩子。她盖这座面包屋，就是为了把孩子骗进来。谁落在她手里，谁就会被杀死、煮熟，成为她的节日大餐。巫婆的眼睛是红的，看不清远处，鼻子却像野兽一样灵。只要有人靠近，她很远就能闻到。汉塞尔和格蕾特刚走到附近，她便恶狠狠地笑起来，用嘲弄的口气说出了自己的打算。
        - id: ch04-b02
          speaker: witch
          text: 他们终于落到我手上了。这一次，一个也逃不掉！
        - id: ch04-b03
          speaker: narrator
          text: 第二天一早，孩子们还在睡，巫婆已经起来了。她瞧着两张红润饱满的小脸，低声嘀咕。
        - id: ch04-b04
          speaker: witch
          text: 嗯，这一定是鲜嫩的一口！
          emotion: happy
        - id: ch04-b05
          speaker: narrator
          text: 她用干瘪的手一把抓起汉塞尔，把他拖进外面的小畜棚，锁在带栅栏的门后。任凭汉塞尔怎么大声喊叫，都没有一点用。巫婆回到屋里，用力摇醒格蕾特。
        - id: ch04-b06
          speaker: witch
          text: 快起来，你这个懒东西！去打水，再给你哥哥做好吃的。他关在畜棚里，我要把他养胖。等肉长够了，我就吃掉他。
          emotion: angry
        - id: ch04-b07
          speaker: narrator
          text: 格蕾特哭得很伤心，可再多的眼泪也救不了哥哥。恶毒的巫婆让她做什么，她就只能做什么。从那天起，最好的饭菜都送给可怜的汉塞尔，格蕾特自己得到的却只有螃蟹壳。每天早晨，巫婆都慢慢爬到小畜棚前。
        - id: ch04-b08
          speaker: witch
          text: 汉塞尔，伸根手指给我摸摸。让我看看你长胖了没有。
        - id: ch04-b09
          speaker: narrator
          text: 汉塞尔每次都递出一根小骨头。巫婆眼神不好，把骨头当成了他的手指。她怎么也不明白，这孩子为什么一直养不胖。四个星期过去，汉塞尔还是瘦瘦的。巫婆失去了耐心，再也不愿意等。
        - id: ch04-b10
          speaker: witch
          text: 喂，格蕾特！快去打水。管他是胖是瘦，明天我都要杀掉他，煮来吃！
          emotion: angry
        - id: ch04-b11
          speaker: narrator
          text: 可怜的格蕾特只好去打水，眼泪一路滚下脸颊。
        - id: ch04-b12
          speaker: gretel
          text: 亲爱的上帝，求你救救我们！早知道这样，还不如让森林里的野兽吃掉。那样我和哥哥至少能死在一起。
          emotion: sad
        - id: ch04-b13
          speaker: witch
          text: 闭上嘴吧！你再怎么哭喊，也救不了自己。
          emotion: angry
        - id: ch04-b14
          speaker: narrator
          text: 第二天一早，格蕾特吊起装水的大锅，点着火。巫婆却另有打算。
        - id: ch04-b15
          speaker: witch
          text: 先烤面包。面我已经和好，炉子也烧热了。
        - id: ch04-b16
          speaker: narrator
          text: 她把格蕾特推到烤炉前。炉膛里，一股股火焰正往外蹿。
        - id: ch04-b17
          speaker: witch
          text: 钻进去看看。要是够热，咱们就能把面包放进去。
        - id: ch04-b18
          speaker: narrator
          text: 巫婆真正想做的，是等格蕾特进了炉子，立刻关上炉门，把她活活烤熟，再把她吃掉。格蕾特看穿了她的念头。
        - id: ch04-b19
          speaker: gretel
          text: 可我不知道怎么钻进去。你平时是怎么进去的？
        - id: ch04-b20
          speaker: witch
          text: 真是个蠢东西！炉门这么大。看着，连我都钻得进去！
          emotion: angry
        - id: ch04-b21
          speaker: narrator
          text: 老巫婆爬上前，把头伸进烤炉。格蕾特猛地推了她一把，把她整个推进火里。接着，女孩关紧铁门，插上门闩。炉子里响起了可怕的嚎叫。格蕾特转身跑开，那个不敬上帝的巫婆就这样凄惨地烧死了。
        - id: ch04-b22
          speaker: narrator
          text: 格蕾特像闪电一样冲到畜棚前，打开了栅栏门。
        - id: ch04-b23
          speaker: gretel
          text: 汉塞尔，我们得救了！老巫婆已经死了！
          emotion: happy
        - id: ch04-b24
          speaker: narrator
          text: 汉塞尔像笼门打开时飞出的小鸟，一下跳了出来。兄妹俩高兴得又抱又跳，不住地亲吻对方。他们再也不用怕巫婆了，便走进她的屋子。屋里每个角落都放着箱子，装满了珍珠和宝石。
        - id: ch04-b25
          speaker: hansel
          text: 这些可比白石子值钱多了！
          emotion: happy
        - id: ch04-b26
          speaker: narrator
          text: 汉塞尔抓起珍珠和宝石，只要口袋还能装下，就一把接一把地往里塞。
        - id: ch04-b27
          speaker: gretel
          text: 我也要带一点回家。
        - id: ch04-b28
          speaker: narrator
          text: 格蕾特也兜起围裙，把珍珠和宝石装了满满一兜。
        - id: ch04-b29
          speaker: hansel
          text: 咱们现在就走，离开巫婆的森林。
    - id: ch05
      title: 回家的路
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 走了两个小时，他们来到一大片水边。
        - id: ch05-b02
          speaker: hansel
          text: 这里没有木板，也没有桥。咱们过不去。
        - id: ch05-b03
          speaker: gretel
          text: 也看不见来往的船。不过水上有一只白鸭。我求求她，也许她肯载咱们。
        - id: ch05-b04
          speaker: narrator
          text: 格蕾特朝白鸭喊起来。
        - id: ch05-b05
          speaker: gretel
          text: 小白鸭，小白鸭，你可看见，汉塞尔和格蕾特等在水边？这里没有木板，也没有桥，请用雪白的背把我们载到对岸。
        - id: ch05-b06
          speaker: narrator
          text: 格蕾特唱完歌谣，白鸭便游到他们身边。汉塞尔坐上她的背，又让妹妹挨着自己坐下。
        - id: ch05-b07
          speaker: gretel
          text: 不行，两个人太重，小白鸭会受不了。请她一次载一个吧。
        - id: ch05-b08
          speaker: narrator
          text: 善良的小白鸭照她说的做了，一次载一个，把兄妹俩分别送过水面。他们平安上岸，又走了一会儿，四周的森林看起来越来越熟悉。最后，他们远远看见父亲的屋子，立刻飞奔过去，冲进屋里的房间，一头扑进父亲怀里。
        - id: ch05-b09
          speaker: narrator
          text: 自从把孩子留在森林，父亲没有快活过一刻。那个女人却已经死了。格蕾特松开围裙，珍珠和宝石顿时滚得满屋都是。汉塞尔也从口袋里一把接一把地往外掏。从此，所有忧愁都结束了，一家人共同过着无比幸福的生活。
        - id: ch05-b10
          speaker: narrator
          text: 我的故事讲完啦。那边跑过一只小耗子，谁要是捉住它，就能拿它做一顶又大又暖的皮帽子。
