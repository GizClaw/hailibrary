audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉着而富有童话叙事感
        timbre: 温暖清晰
        pace: 舒缓有变化
        pitch: 中音
    little_red_cap:
      display_name: 小红帽
      tts:
        delivery: 天真直率，后来变得警醒
        timbre: 清亮稚嫩
        pace: 轻快自然
        pitch: 中高音
    mother:
      display_name: 妈妈
      tts:
        delivery: 关切而认真
        timbre: 温和清楚
        pace: 从容
        pitch: 中音
    wolf:
      display_name: 狼
      tts:
        delivery: 表面亲切，暗藏狡猾和凶狠
        timbre: 低沉粗哑
        pace: 稍慢
        pitch: 低音
    grandmother:
      display_name: 外婆
      tts:
        delivery: 年迈慈爱，遇事镇定
        timbre: 柔和苍老
        pace: 缓慢
        pitch: 中低音
    huntsman:
      display_name: 猎人
      tts:
        delivery: 果断有力
        timbre: 浑厚清晰
        pace: 稳健
        pitch: 低音
  chapters:
    - id: ch01
      title: 红丝绒小帽
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个很招人喜欢的小姑娘，见过她的人都疼爱她，外婆尤其疼她。外婆什么都舍得给她。有一次，外婆送来一顶红丝绒小帽。小姑娘戴着特别合适，从此再也不肯换别的帽子。大家便叫她小红帽。
        - id: ch01-b02
          speaker: mother
          text: 小红帽，来，把这块蛋糕和这瓶葡萄酒送给外婆。她病了，身子很弱，吃了这些会好受些。趁天气还凉快，赶快上路吧。一路好好走，别离开小路，免得摔碎瓶子，让外婆什么也喝不到。进屋先说早上好，也别一进门就到处乱瞧。
        - id: ch01-b03
          speaker: little_red_cap
          text: 我会处处小心的。
        - id: ch01-b04
          speaker: narrator
          text: 小红帽伸手向妈妈作了保证。外婆住在村外的树林里，离村子有半里格。小红帽刚进树林，就遇见一只狼。她不知道这个家伙有多坏，所以一点也不害怕。
        - id: ch01-b05
          speaker: wolf
          text: 你好，小红帽。
        - id: ch01-b06
          speaker: little_red_cap
          text: 谢谢你，狼先生。
        - id: ch01-b07
          speaker: wolf
          text: 这么早就出门，你去哪儿呀？
        - id: ch01-b08
          speaker: little_red_cap
          text: 我去外婆家。
        - id: ch01-b09
          speaker: wolf
          text: 你的围裙里装了什么？
        - id: ch01-b10
          speaker: little_red_cap
          text: 蛋糕和葡萄酒。昨天家里烤了蛋糕。外婆病得可怜，我给她带点儿好吃的，让她长长力气。
        - id: ch01-b11
          speaker: wolf
          text: 那你外婆住在哪儿？
        - id: ch01-b12
          speaker: little_red_cap
          text: 再往树林里走四分之一里格就到了。屋子在三棵大橡树下面，再往下还有一片榛树丛。你肯定知道。
        - id: ch01-b13
          speaker: narrator
          text: 狼心里盘算，这小东西又嫩又肥，吃起来肯定比老太婆更香。他得使个巧计，把她们两个都抓住。于是，狼装作若无其事的样子，陪小红帽并肩走了一小段，才开口诱她。
        - id: ch01-b14
          speaker: wolf
          text: 小红帽，你看看周围，这些花多漂亮。怎么不四处瞧瞧呢？小鸟唱得这么好听，你也没听见吧？你走得一本正经，像是在上学。可树林里的其他东西都多快活呀。
    - id: ch02
      title: 林中小屋
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 小红帽抬起眼睛。阳光从树叶间穿过，在林间这里一束、那里一束地跳动，四周又开满了好看的花。她想着，要是给外婆带一束新鲜的花，外婆一定也会高兴。现在时候还早，照样能及时赶到。于是她跑下小路，进树林采起花来。每采下一朵，她总觉得更远的地方还有一朵更美的，便追过去。就这样，她越走越远，一直进了树林深处。
        - id: ch02-b02
          speaker: narrator
          text: 狼却径直奔到外婆家，敲响了门。
        - id: ch02-b03
          speaker: grandmother
          text: 谁呀？
        - id: ch02-b04
          speaker: wolf
          text: 是小红帽。我给您带了蛋糕和葡萄酒，开门吧。
        - id: ch02-b05
          speaker: grandmother
          text: 抬起门闩就能进来。我身子太弱，起不了床。
        - id: ch02-b06
          speaker: narrator
          text: 狼抬起门闩，门开了。他一声不响地冲到床前，吞掉外婆。随后穿上她的衣服，戴上她的睡帽，躺进床里，还拉好了床帘。小红帽仍在林中跑来跑去。等到花多得拿不下，她才想起外婆，重新上路。
        - id: ch02-b07
          speaker: narrator
          text: 她看见小屋的门大开着，觉得很奇怪。一走进房间，心里又突然涌上一阵说不出的不安。往常她明明最喜欢来陪外婆，今天怎么这样难受呢？她大声喊了早上好，屋里却没有人回答。她只好走到床边，伸手拉开床帘。外婆躺在那里，睡帽一直遮住了大半张脸，模样怎么看都很古怪。
        - id: ch02-b08
          speaker: little_red_cap
          text: 外婆，您的耳朵怎么这么大？
        - id: ch02-b09
          speaker: wolf
          text: 这样才听得清你说话呀，孩子。
        - id: ch02-b10
          speaker: little_red_cap
          text: 可是外婆，您的眼睛怎么这么大？
        - id: ch02-b11
          speaker: wolf
          text: 这样才看得清你呀，亲爱的。
        - id: ch02-b12
          speaker: little_red_cap
          text: 可是外婆，您的手怎么这么大？
        - id: ch02-b13
          speaker: wolf
          text: 这样才能把你抱得更紧。
        - id: ch02-b14
          speaker: little_red_cap
          text: 哎呀，外婆，您的嘴怎么大得这么吓人？
          emotion: fearful
        - id: ch02-b15
          speaker: wolf
          text: 这样就能一口吃掉你！
        - id: ch02-b16
          speaker: narrator
          text: 话刚说完，狼就从床上一跃而起，把小红帽吞进肚里。
    - id: ch03
      title: 猎人来了
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 狼吃饱后又躺回床上，睡着了，呼噜打得震天响。正好有个猎人从门外经过。他听见动静，觉得老太太的呼噜实在太响，得进去看看她是不是不舒服。猎人走到床边，一眼认出了狼。
        - id: ch03-b02
          speaker: huntsman
          text: 你这个老恶棍，原来藏在这里！我找你好久了！
          emotion: angry
        - id: ch03-b03
          speaker: narrator
          text: 猎人正要朝狼开枪，忽然想到，这家伙可能已经把外婆吞下去了，而外婆说不定还活着，还能救出来。他便没有开枪，而是拿起一把剪刀，小心剪开熟睡的狼的肚皮。才剪了两下，他就看见一顶红亮亮的小帽。再剪两下，小红帽一下子跳了出来。
        - id: ch03-b04
          speaker: little_red_cap
          text: 啊，真把我吓坏了！狼肚子里黑极了！
          emotion: fearful
        - id: ch03-b05
          speaker: narrator
          text: 接着，年迈的外婆也活着出来了，只是虚弱得几乎喘不上气。小红帽赶紧跑出去，找来几块大石头，大家一起把石头塞进狼的肚子。狼醒来以后想要逃走，可石头实在太重，他刚站起来就栽倒在地，死了。
        - id: ch03-b06
          speaker: narrator
          text: 三个人都高兴极了。猎人剥下狼皮，带着狼皮回了家。外婆吃了小红帽送来的蛋糕，又喝了她送来的葡萄酒，又很快恢复了精神。小红帽却默默记住了一件事。
        - id: ch03-b07
          speaker: little_red_cap
          text: 只要我活着，只要妈妈不许，我就再也不独自离开小路，跑进树林了。
    - id: ch04
      title: 另一只狼
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 人们还讲过另一件事。后来，小红帽又有一次给外婆送蛋糕。路上，另一只狼来和她说话，也想哄她离开小路。可小红帽已经有了戒心，只顾沿着大路向前走。到了外婆家，她把路上的事全说了。那只狼虽然向她问好，眼神却坏透了。要不是在大路上，他肯定已经吃掉她了。
        - id: ch04-b02
          speaker: grandmother
          text: 那我们把门关紧，别让他进来。
        - id: ch04-b03
          speaker: narrator
          text: 没过多久，狼来敲门了。
        - id: ch04-b04
          speaker: wolf
          text: 外婆，开门！我是小红帽，给您送蛋糕来了。
        - id: ch04-b05
          speaker: narrator
          text: 她们一句话也不说，更没有开门。灰毛狼便绕着屋子偷偷转了两三圈，最后纵身跳上屋顶。他打算一直等到傍晚，等小红帽从外婆家出来，就偷偷跟在后面，再趁着天黑把她吃掉。可外婆已经看透了他的打算。屋前正好摆着一只很大的石槽。
        - id: ch04-b06
          speaker: grandmother
          text: 小红帽，拿水桶来。昨天我煮了香肠，你把煮香肠的水提来，倒进石槽。
        - id: ch04-b07
          speaker: narrator
          text: 小红帽一桶又一桶地提水，直到大石槽全满了。香肠的气味飘上屋顶。狼使劲闻着，不停探头往下看。最后，他的脖子伸得太远，脚下再也站不稳。他开始向下滑，接着从屋顶直直掉进大石槽，淹死了。
        - id: ch04-b08
          speaker: narrator
          text: 小红帽欢欢喜喜地回到家，从此再没有伤害过任何人。
