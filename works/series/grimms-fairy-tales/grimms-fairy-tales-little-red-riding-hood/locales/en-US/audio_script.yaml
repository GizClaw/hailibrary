  chapters:
    - id: ch01
      title: Into the Woods
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, there was a dear little girl. Everyone who saw her loved her, but her grandmother loved her most of all. The old woman would have given the child anything. One day, she gave her a little cap made of red velvet. It suited the girl so well that she never wanted to wear anything else. From then on, everyone called her Little Red-Cap.
        - id: ch01-b02
          speaker: narrator
          text: One morning, her mother called to her.
        - id: ch01-b03
          speaker: mother
          text: Come here, Little Red-Cap. Take this piece of cake and this bottle of wine to your grandmother. She's sick and weak, and they'll help her feel stronger. Leave before the day gets hot. Walk quietly, and stay on the path. If you fall and break the bottle, Grandmother won't get any wine. And when you enter her room, remember to say good morning before you start looking into every corner.
        - id: ch01-b04
          speaker: little_red_cap
          text: I'll be very careful, Mother. I promise.
        - id: ch01-b05
          speaker: narrator
          text: Little Red-Cap gave her mother her hand on it. Then she set out. Her grandmother lived in the woods, half a league from the village. Just as the girl entered the forest, a wolf came up to her. Little Red-Cap had no idea what a wicked creature he was, so she was not afraid.
        - id: ch01-b06
          speaker: wolf
          text: Good day, Little Red-Cap.
        - id: ch01-b07
          speaker: little_red_cap
          text: Thank you, Wolf.
        - id: ch01-b08
          speaker: wolf
          text: Where are you going so early?
        - id: ch01-b09
          speaker: little_red_cap
          text: To my grandmother's house.
        - id: ch01-b10
          speaker: wolf
          text: And what are you carrying in your apron?
        - id: ch01-b11
          speaker: little_red_cap
          text: Cake and wine. We baked yesterday, so my poor sick grandmother is getting something good to help her grow stronger.
        - id: ch01-b12
          speaker: wolf
          text: Where does your grandmother live?
        - id: ch01-b13
          speaker: little_red_cap
          text: About a quarter of a league farther into the woods. Her house is under three big oak trees, with nut trees just below. You must know the place.
        - id: ch01-b14
          speaker: narrator
          text: The wolf looked at the tender young girl and thought she would make an even finer meal than the old woman. If he was clever, he could catch them both. He walked beside Little Red-Cap for a while. Then he spoke again.
        - id: ch01-b15
          speaker: wolf
          text: Little Red-Cap, look at all the pretty flowers around you. Can't you hear how sweetly the birds are singing? You're walking along as seriously as if you were going to school, while everything here in the woods is merry.
        - id: ch01-b16
          speaker: narrator
          text: Little Red-Cap looked up. Sunbeams danced between the trees, and flowers grew everywhere. She thought a fresh bouquet would please her grandmother. It was still early, so she was sure she had plenty of time. She left the path and ran among the trees to gather flowers. Each time she picked one, she saw a prettier flower farther away. She hurried after it and wandered deeper and deeper into the woods.
    - id: ch02
      title: At Grandmother's House
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Meanwhile, the wolf ran straight to Grandmother's house and knocked on the door.
        - id: ch02-b02
          speaker: grandmother
          text: Who's there?
        - id: ch02-b03
          speaker: wolf
          text: It's Little Red-Cap. I've brought you cake and wine. Please open the door.
        - id: ch02-b04
          speaker: grandmother
          text: Lift the latch. I'm too weak to get up.
        - id: ch02-b05
          speaker: narrator
          text: The wolf lifted the latch, and the door swung open. Without saying another word, he went straight to the bed and swallowed Grandmother. Then he put on her clothes and her cap. He climbed into her bed and pulled the curtains closed.
        - id: ch02-b06
          speaker: narrator
          text: Little Red-Cap kept running from flower to flower. When she had gathered all she could carry, she remembered her grandmother and went back toward the cottage.
        - id: ch02-b07
          speaker: narrator
          text: The cottage door stood open. That surprised her. When she stepped inside, she felt so strange and uneasy that she spoke to herself.
        - id: ch02-b08
          speaker: little_red_cap
          text: Oh dear. Why do I feel so uneasy today? I usually love being with Grandmother.
        - id: ch02-b09
          speaker: little_red_cap
          text: Good morning!
        - id: ch02-b10
          speaker: narrator
          text: No one answered. Little Red-Cap went to the bed and pulled back the curtains. There lay Grandmother, with her cap drawn low over her face. She looked very strange.
        - id: ch02-b11
          speaker: little_red_cap
          text: Oh, Grandmother, what big ears you have!
        - id: ch02-b12
          speaker: wolf
          text: All the better to hear you with, my child.
        - id: ch02-b13
          speaker: little_red_cap
          text: But Grandmother, what big eyes you have!
        - id: ch02-b14
          speaker: wolf
          text: All the better to see you with, my dear.
        - id: ch02-b15
          speaker: little_red_cap
          text: And Grandmother, what large hands you have!
        - id: ch02-b16
          speaker: wolf
          text: All the better to hug you with.
        - id: ch02-b17
          speaker: little_red_cap
          text: Oh, Grandmother! What a terribly big mouth you have!
          emotion: fearful
        - id: ch02-b18
          speaker: wolf
          text: All the better to eat you with!
        - id: ch02-b19
          speaker: narrator
          text: The moment the wolf said those words, he sprang out of bed in a single bound and swallowed Little Red-Cap.
    - id: ch03
      title: The Huntsman
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Once the wolf had eaten his fill, he lay down in the bed again. Soon he was fast asleep and snoring loudly. A huntsman happened to be passing the house. He heard the noise and stopped.
        - id: ch03-b02
          speaker: huntsman
          text: The old woman is snoring terribly loudly. I'd better see if she needs anything.
        - id: ch03-b03
          speaker: narrator
          text: He entered the cottage and went to the bed. There he saw the wolf.
        - id: ch03-b04
          speaker: huntsman
          text: So I've found you at last, you old sinner! I've been hunting you for a long time.
        - id: ch03-b05
          speaker: narrator
          text: The huntsman raised his gun, ready to fire. Then he realized the wolf might have swallowed Grandmother, and she might still be saved. He put the gun aside, took a pair of scissors, and began cutting open the sleeping wolf's belly. After two snips, he saw Little Red-Cap's red cap shining inside. Two more snips, and the girl sprang out.
        - id: ch03-b06
          speaker: little_red_cap
          text: Oh, I was so frightened! It was terribly dark inside the wolf!
          emotion: fearful
        - id: ch03-b07
          speaker: narrator
          text: Then the old grandmother climbed out alive, though she could hardly breathe. Little Red-Cap quickly fetched some large stones. Together, they filled the wolf's body with them. When he woke, he tried to run away. But the stones were so heavy that he fell down at once and died.
        - id: ch03-b08
          speaker: narrator
          text: All three were delighted. The huntsman took the wolf's skin and went home with it. Grandmother ate the cake and drank the wine Little Red-Cap had brought. Soon she felt strong again. Little Red-Cap made herself a promise.
        - id: ch03-b09
          speaker: little_red_cap
          text: As long as I live, I'll never leave the path and run into the woods by myself when Mother has forbidden it.
    - id: ch04
      title: Another Wolf
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: But there is another part to the story. One day, Little Red-Cap was carrying cakes to her old grandmother again. Another wolf came up and tried to lure her off the path. This time, Little Red-Cap was on her guard. She kept walking straight ahead until she reached the cottage. Then she told Grandmother what had happened.
        - id: ch04-b02
          speaker: little_red_cap
          text: I met a wolf on the way here. He said good morning, but there was such a wicked look in his eyes. If we'd been anywhere but the public road, I'm sure he would have eaten me.
        - id: ch04-b03
          speaker: grandmother
          text: Then we'll shut the door so he can't come in.
        - id: ch04-b04
          speaker: narrator
          text: Before long, the wolf knocked at the cottage.
        - id: ch04-b05
          speaker: wolf
          text: Open the door, Grandmother. It's Little Red-Cap, and I've brought you some cakes.
        - id: ch04-b06
          speaker: narrator
          text: Little Red-Cap and Grandmother said nothing, and they did not open the door. The gray wolf prowled around the house two or three times. At last, he jumped onto the roof. He meant to wait there until Little Red-Cap started home that evening. Then he would follow her in the darkness and eat her.
    - id: ch05
      title: The Stone Trough
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: But Grandmother understood what the wolf was planning. A great stone trough stood in front of the house, and she knew what to do.
        - id: ch05-b02
          speaker: grandmother
          text: Take the pail, Little Red-Cap. I made sausages yesterday. Carry the water I boiled them in out to the trough.
        - id: ch05-b03
          speaker: narrator
          text: Little Red-Cap carried pail after pail until the great trough was full. The smell of sausages drifted up to the wolf. He sniffed and peered over the edge of the roof. He stretched his neck farther and farther until he lost his footing. Down he slipped, straight from the roof into the stone trough, and drowned.
        - id: ch05-b04
          speaker: narrator
          text: Little Red-Cap went home joyfully, and she never did anything to harm anyone.
