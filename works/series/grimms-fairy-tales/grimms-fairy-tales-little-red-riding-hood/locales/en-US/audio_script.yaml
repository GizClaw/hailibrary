audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, grave, and quietly suspenseful
        timbre: clear and rounded
        pace: measured
        pitch: medium
    little_red_cap:
      display_name: Little Red-Cap
      tts:
        delivery: bright, trusting, and direct
        timbre: light and youthful
        pace: natural
        pitch: high
    mother:
      display_name: Mother
      tts:
        delivery: caring, practical, and firm
        timbre: warm and clear
        pace: measured
        pitch: medium
    wolf:
      display_name: Wolf
      tts:
        delivery: smooth, calculating, and menacing beneath the charm
        timbre: dark and rough
        pace: deliberate
        pitch: low
    grandmother:
      display_name: Grandmother
      tts:
        delivery: gentle, frail, and sensible
        timbre: soft and aged
