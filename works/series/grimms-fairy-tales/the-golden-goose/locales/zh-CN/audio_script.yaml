      tts:
        delivery: 精明而冷淡
        timbre: 年轻明亮
        pace: 适中
        pitch: 中
    little_grey_man:
      display_name: 灰发小老头
      tts:
        delivery: 温和沉着，言语简洁
        timbre: 苍老柔和
        pace: 稍慢
        pitch: 中低
    second_son:
      display_name: 二儿子
      tts:
        delivery: 自以为有理而不耐烦
        timbre: 年轻清楚
        pace: 适中
        pitch: 中
    dummling:
      display_name: 小傻瓜
      tts:
        delivery: 朴实真诚
        timbre: 年轻温厚
        pace: 适中
