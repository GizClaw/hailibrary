  chapters:
    - id: ch01
      title: 三兄弟进森林
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前有个人，养了三个儿子。最小的那个叫小傻瓜，人们总是轻视他，嘲笑他，处处贬低他。
        - id: ch01-b02
          speaker: narrator
          text: >-
            有一天，大儿子要进森林砍柴。出门以前，母亲给他带上一块又香又甜的蛋糕，还有一瓶葡萄酒，好让他不至于挨饿受渴。他刚进森林，就遇到了一个满头灰发的小老头。小老头先向他问了好，接着开口求他。
        - id: ch01-b03
          speaker: little_grey_man
          text: >-
            能分我一块你口袋里的蛋糕吗？再给我喝一口酒吧，我又饿又渴。
        - id: ch01-b04
          speaker: eldest_son
          text: >-
            蛋糕和酒要是分给你，我自己吃什么？快走开！
        - id: ch01-b05
          speaker: narrator
          text: >-
            大儿子撇下小老头，接着赶路。可他对着一棵树才砍了没多久，一斧子就落偏了，正中自己的胳膊。他只得回家包扎伤口。这件事，正是灰发小老头做的。
        - id: ch01-b06
          speaker: narrator
          text: >-
            接下来，二儿子也去了森林。母亲同样给他带上蛋糕和葡萄酒。他也遇见了那个灰发小老头，小老头又向他讨一块蛋糕和一口酒。
        - id: ch01-b07
          speaker: second_son
          text: >-
            分给你，我自己的东西不就少了吗？走开！
        - id: ch01-b08
          speaker: narrator
          text: >-
            二儿子觉得自己很有道理，也扔下小老头走了。惩罚来得一点也不慢。他只朝树砍了几下，就砍中了自己的腿，只好让人抬回家。
        - id: ch01-b09
          speaker: dummling
          text: >-
            父亲，也让我去砍柴吧。
        - id: ch01-b10
          speaker: father
          text: >-
            你两个哥哥都砍伤了自己，你就别去了。你根本不懂怎么干。
        - id: ch01-b11
          speaker: narrator
          text: >-
            小傻瓜一遍遍地央求，父亲最后只好答应。
        - id: ch01-b12
          speaker: father
          text: >-
            那你就去吧。等你受了伤，也许能长点见识。
        - id: ch01-b13
          speaker: narrator
          text: >-
            母亲只给小傻瓜带了一块用水和面、埋在灰烬里烤成的饼，外加一瓶酸啤酒。
    - id: ch02
      title: 金鹅与三个女儿
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            小傻瓜来到森林，也碰见了灰发小老头。小老头问候过他，便开口说道。
        - id: ch02-b02
          speaker: little_grey_man
          text: >-
            分我一点你的饼吧，也让我喝口瓶里的酒。我实在饿得慌，也渴得很。
        - id: ch02-b03
          speaker: dummling
          text: >-
            我只有灰烬里烤的饼，还有酸啤酒。你不嫌弃的话，我们就坐下一起吃。
        - id: ch02-b04
          speaker: narrator
          text: >-
            两个人坐了下来。可小傻瓜一拿出烤饼，它已经变成香甜的好蛋糕，瓶里的酸啤酒也成了上好的葡萄酒。他们吃喝过后，小老头对他说。
        - id: ch02-b05
          speaker: little_grey_man
          text: >-
            你心地善良，肯把自己有的东西分给别人，我就送你一份好运。看见那棵老树了吗？把它砍倒，你会在树根下面找到一样东西。
        - id: ch02-b06
          speaker: narrator
          text: >-
            小老头说完便走了。小傻瓜砍倒那棵老树，只见树根那里坐着一只鹅，身上的羽毛全是纯金的。他抱起金鹅，来到一家客店过夜。店主人有三个女儿，她们瞧见这只奇妙的鸟，都想弄明白它究竟是什么，也都想拔一根金羽毛归自己。
        - id: ch02-b07
          speaker: eldest_daughter
          text: >-
            我总能找到机会，从它身上拔下一根羽毛。
        - id: ch02-b08
          speaker: narrator
          text: >-
            小傻瓜一出门，大女儿便抓住金鹅的翅膀。谁知她的手指和手掌一下子粘牢了。二女儿很快也走过来，满脑子只想着给自己弄一根羽毛。她刚碰到姐姐，也被牢牢粘住。
        - id: ch02-b09
          speaker: narrator
          text: >-
            最后，三女儿也为了同样的事走了过来。两个姐姐一看见她，马上惊叫起来。
        - id: ch02-b10
          speaker: older_sisters
          text: >-
            别过来！求你了，千万别靠近我们！
          emotion: fearful
        - id: ch02-b11
          speaker: narrator
          text: >-
            三女儿根本不明白她们为什么赶自己走，心里还想着。
        - id: ch02-b12
          speaker: youngest_daughter
          text: >-
            她们都在那边，我为什么不能过去？
        - id: ch02-b13
          speaker: narrator
          text: >-
            她跑到姐姐们身边，才一碰到二姐，也牢牢粘住了。于是，三姐妹只能这样连在金鹅上，过了一夜。
    - id: ch03
      title: 越来越长的队伍
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            第二天一早，小傻瓜把金鹅夹在腋下，动身上路。他对粘在后面的三个姑娘毫不在意。他往左，她们就得往左跑。他往右，她们也只能跟着往右跑。
        - id: ch03-b02
          speaker: narrator
          text: >-
            走到田野中间，一位牧师迎面而来。他看见这支古怪的队伍，立刻训斥那三个姑娘。
        - id: ch03-b03
          speaker: parson
          text: >-
            真不像话！你们三个没出息的姑娘，为什么追着这个年轻人跑过田野？像什么样子！
          emotion: angry
        - id: ch03-b04
          speaker: narrator
          text: >-
            牧师一把抓住三女儿的手，想把她拉下来。可他刚碰到她，自己也粘住了，只能跟在后面一起跑。
        - id: ch03-b05
          speaker: narrator
          text: >-
            没过多久，教堂司事走了过来。他看见自己的上司竟然跟在三个姑娘后面飞跑，惊讶得大声喊起来。
        - id: ch03-b06
          speaker: sexton
          text: >-
            喂，牧师大人！您急着去哪儿啊？今天还有一场洗礼，可千万别忘了！
          emotion: surprised
        - id: ch03-b07
          speaker: narrator
          text: >-
            司事追上去，揪住牧师的袖子。他也马上粘住，只得随着队伍往前跑。
        - id: ch03-b08
          speaker: narrator
          text: >-
            这五个人一个接一个小跑时，两个农夫扛着锄头从田里走来。牧师高声求他们帮忙，把自己和司事解开。两个农夫伸手去碰司事，也一起粘住了。现在，跟着小傻瓜和金鹅奔跑的，已经有七个人。
    - id: ch04
      title: 公主笑了
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            不久，小傻瓜来到一座城。城里的国王有个女儿，她严肃得谁也逗不笑。国王早已下令，不管是谁，只要能让公主笑出来，就能娶她为妻。
        - id: ch04-b02
          speaker: narrator
          text: >-
            小傻瓜听到这个消息，便带着金鹅，还有后面那一长串人，来到公主面前。公主一看见七个人一个接一个，怎么也停不下来地往前跑，顿时放声大笑，笑得好像再也不会停了。
        - id: ch04-b03
          speaker: narrator
          text: >-
            小傻瓜于是请求娶公主为妻，婚礼随后举行。后来国王去世，小傻瓜继承了王国。他和妻子心满意足地生活了许多年。
