audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉着而富有童话讲述感
        timbre: 温暖清晰
        pace: 舒缓有变化
        pitch: 中
    fisherman:
      display_name: 渔夫
      tts:
        delivery: 老实迟疑，渐渐惶恐
        timbre: 朴厚略低
        pace: 偏慢
        pitch: 中低
    wife:
      display_name: 妻子
      tts:
        delivery: 强硬急切，欲望逐步加深
        timbre: 明亮有力
        pace: 中快
        pitch: 中高
    flounder:
      display_name: 比目鱼
      tts:
        delivery: 平静简短，不动声色
        timbre: 深沉清澈
        pace: 从容
        pitch: 中低
  chapters:
    - id: ch01
      title: 会说话的比目鱼
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个渔夫和妻子住在海边一间破破烂烂的茅屋里。渔夫每天都去打鱼。一天，他拿着钓竿坐在岸边，望着清亮的海水。鱼线忽然往下沉，一直沉到很深很深的地方。他赶紧收起鱼线，钓上来一条大比目鱼。
        - id: ch01-b02
          speaker: flounder
          text: 渔夫，请你放过我吧。我不是真的比目鱼，而是中了魔法的王子。杀了我也没有用，我的肉并不好吃。把我放回水里，让我走吧。
        - id: ch01-b03
          speaker: fisherman
          text: 好了，不必说这么多。既然你会说话，我当然会放你走。
        - id: ch01-b04
          speaker: narrator
          text: 说完，渔夫就把鱼放回清亮的海里。比目鱼慢慢沉向海底，身后留下一道长长的血痕。渔夫这才从岸边站起来，空着手回到妻子住的那间破茅屋。
        - id: ch01-b05
          speaker: wife
          text: 当家的，你今天什么也没钓到吗？
        - id: ch01-b06
          speaker: fisherman
          text: 我钓到一条比目鱼。他说自己是中了魔法的王子，我就把他放了。
        - id: ch01-b07
          speaker: wife
          text: 那你没先向他许个愿？
        - id: ch01-b08
          speaker: fisherman
          text: 没有。我有什么可许的？
        - id: ch01-b09
          speaker: wife
          text: 老住在这肮脏的破茅屋里，实在太难熬了。你刚才本可以替咱们要一座小屋。现在回去叫他吧，告诉他咱们想有一座小屋住。他一定会答应这点请求。
        - id: ch01-b10
          speaker: fisherman
          text: 我为什么还要回去找他呢？
        - id: ch01-b11
          speaker: wife
          text: 你捉住了他，又放了他，他当然会答应。快去！
        - id: ch01-b12
          speaker: narrator
          text: 渔夫还是不愿意去，可他又不想违拗妻子，只得重新走向海边。到了那里，他看见海水已经变成青黄色，再也不像放鱼时那么清亮平静。他停下脚步，站在岸边呼唤比目鱼。
        - id: ch01-b13
          speaker: fisherman
          text: 比目鱼呀，海中游，请你听我把话说。我的妻子伊尔莎比尔，偏要逼我违心愿。
        - id: ch01-b14
          speaker: flounder
          text: 她这次想要什么？
        - id: ch01-b15
          speaker: fisherman
          text: 我妻子说，我本来应该许个愿。她不想再住破茅屋，想要一座小屋。
        - id: ch01-b16
          speaker: flounder
          text: 回去吧，她已经有了。
    - id: ch02
      title: 从小屋到城堡
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 渔夫回去一看，妻子已经不在破茅屋里了。茅屋原来的地方立着一座小屋，她正坐在门前的长凳上。妻子牵住他的手，带他进屋去看。里面有一间小门厅、一间漂亮的客厅和一间卧室，还有厨房和食品储藏室。家具样样上好，精美的锡器和铜器也一件不少。屋后有个小院，养着鸡鸭。旁边的小花园里开着花，也结着果子。
        - id: ch02-b02
          speaker: wife
          text: 你看看，这不是好多了吗？这里多好呀！
        - id: ch02-b03
          speaker: fisherman
          text: 是很好。咱们就住在这里，从今往后该知足了。
        - id: ch02-b04
          speaker: wife
          text: 知不知足，以后再说吧。
        - id: ch02-b05
          speaker: narrator
          text: 两人吃了些东西，便上床睡了。日子安安稳稳地过了一两个星期，妻子又开口了。她嫌这座小屋根本不够两个人住，还嫌花园和院子都太小。她说，比目鱼本来就能给他们更大的房子，于是命渔夫再去一趟，替她要一座宏伟的石头城堡。
        - id: ch02-b06
          speaker: fisherman
          text: 这小屋已经够好了，咱们为什么非得住城堡？比目鱼刚把小屋给咱们，我这么快又去找他，他会生气的。
        - id: ch02-b07
          speaker: wife
          text: 你去就是了。这点事对他轻而易举，他也会乐意。快去找他。
        - id: ch02-b08
          speaker: narrator
          text: 渔夫的心一下子沉了下去。他不愿动身，暗暗告诉自己，这样做不对。可他最终还是去了。到了海边，他看见海水已经变成紫色和深蓝色，又灰又浓，再也不是先前的青黄色。不过，这时的海面还算安静。
        - id: ch02-b09
          speaker: fisherman
          text: 比目鱼呀，海中游，请你听我把话说。我的妻子伊尔莎比尔，偏要逼我违心愿。
        - id: ch02-b10
          speaker: flounder
          text: 她这次想要什么？
        - id: ch02-b11
          speaker: fisherman
          text: 她想住进一座宏伟的石头城堡。
          emotion: fearful
        - id: ch02-b12
          speaker: flounder
          text: 回去吧，她就在门前。
        - id: ch02-b13
          speaker: narrator
          text: 渔夫原想回家，到了那里，眼前却是一座宏伟的石头宫殿。妻子正站在台阶上准备进门。她拉住渔夫的手，把他带了进去。宽阔的厅堂铺着大理石，许多仆人迎上来，替他们敞开大门。墙上挂着明亮华美的帷幔，房间里摆着纯金的桌椅，水晶吊灯从天花板上垂下来。每一间厅房和卧室都铺着地毯。桌上的美酒佳肴多得几乎要把桌子压垮。屋后有座大院，里面有马厩、牛棚和最好的马车。还有一座美丽的大花园，种满花木果树。半英里长的园林里，雄鹿、雌鹿和野兔四处跑着。凡是想得到的，这里都有。
        - id: ch02-b14
          speaker: wife
          text: 怎么样，这还不漂亮吗？
        - id: ch02-b15
          speaker: fisherman
          text: 的确漂亮。就这样吧，咱们住在这里，该满足了。
        - id: ch02-b16
          speaker: wife
          text: 这件事以后再想。先睡吧。
    - id: ch03
      title: 国王与皇帝
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 第二天早晨，天刚蒙蒙亮，妻子先醒了。她躺在床上，望见窗外美丽的国土一直铺到远方。丈夫还在身边伸懒腰，她便用胳膊肘捅了捅他的腰，要他起来看看。
        - id: ch03-b02
          speaker: wife
          text: 起来，往窗外看。咱们为什么不能统治这片国土？去找比目鱼。咱们要做国王。
        - id: ch03-b03
          speaker: fisherman
          text: 为什么要做国王？我不想当国王。
        - id: ch03-b04
          speaker: wife
          text: 你不想当，那就让我来当。快去，我一定要做国王！
        - id: ch03-b05
          speaker: fisherman
          text: 你为什么非做国王不可？这种话我不愿对他说。
        - id: ch03-b06
          speaker: wife
          text: 有什么不能说的？立刻去！
        - id: ch03-b07
          speaker: narrator
          text: 渔夫想到妻子非要做国王，心里很不快活。他一路反复想着，这样不对，真的不对。他一点也不愿意去，可脚步还是把他带到了海边。眼前的海水已经暗灰一片，从深处一阵阵向上翻涌，还散发出一股腐臭。渔夫走近水边，停在那里。
        - id: ch03-b08
          speaker: fisherman
          text: 比目鱼呀，海中游，请你听我把话说。我的妻子伊尔莎比尔，偏要逼我违心愿。
        - id: ch03-b09
          speaker: flounder
          text: 她这次想要什么？
        - id: ch03-b10
          speaker: fisherman
          text: 她想做国王。
        - id: ch03-b11
          speaker: flounder
          text: 回去吧，她已经是国王了。
        - id: ch03-b12
          speaker: narrator
          text: 渔夫回到宫殿，发现城堡又大了许多。高塔耸立，处处装饰得富丽堂皇。卫兵守在门前，大队士兵敲着定音鼓，吹着号角。渔夫走进宫里，眼前尽是真正的大理石和黄金，上面罩着天鹅绒，垂着巨大的金穗子。厅门一开，辉煌的宫廷全都展现在他眼前。妻子头戴巨大的金冠，手握纯金和宝石制成的权杖，坐在黄金和钻石的高高宝座上。宝座两边各有一排宫女，一个总比前一个矮一头。
        - id: ch03-b13
          speaker: fisherman
          text: 妻子，现在你真是国王了。就到这里吧，咱们别再许愿了。
        - id: ch03-b14
          speaker: wife
          text: 不行。我觉得时间过得太慢，再也忍不住了。我虽然是国王，还必须做皇帝。去找比目鱼。
        - id: ch03-b15
          speaker: fisherman
          text: 你为什么还想做皇帝？整个国土只有一位皇帝。比目鱼不可能把你变成皇帝，我不能去说这种话。我向你保证，他真的办不到。
        - id: ch03-b16
          speaker: wife
          text: 我是国王，你只是我的丈夫！他能让我做国王，就能让我做皇帝。马上去！
          emotion: angry
        - id: ch03-b17
          speaker: narrator
          text: 渔夫被逼得没有办法，只好又出发了。一路上，他心里越来越不安。他反复想着，这件事不会有好结果。妻子竟然还要做皇帝，实在太不知羞耻，比目鱼到头来也会厌烦。到了海边，他看见海水已经又黑又稠，从深处翻滚上来，不断冒出气泡。一阵尖利的风横扫海面，吹得海水仿佛凝结起来。渔夫害怕了，却还是走到岸边。
        - id: ch03-b18
          speaker: fisherman
          text: 比目鱼呀，海中游，请你听我把话说。我的妻子伊尔莎比尔，偏要逼我违心愿。
        - id: ch03-b19
          speaker: flounder
          text: 她这次想要什么？
        - id: ch03-b20
          speaker: fisherman
          text: 唉，她想做皇帝。
          emotion: fearful
        - id: ch03-b21
          speaker: flounder
          text: 回去吧，她已经是皇帝了。
    - id: ch04
      title: 还要做教皇
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 渔夫回去一看，整座宫殿都由磨光的大理石砌成，上面装点着雪花石膏雕像和黄金饰物。士兵在门前列队行进，一边吹号，一边敲钹击鼓。宫殿里面，那些男爵、伯爵和公爵全都像仆人一样来来往往。他们替渔夫打开两扇纯金的大门，渔夫这才走了进去。
        - id: ch04-b02
          speaker: narrator
          text: 渔夫走进大门，看见妻子坐在一整块黄金铸成的宝座上，那宝座足有两英里高。她头上的巨大金冠有三码高，冠上镶满钻石和红宝石。她一只手握着权杖，另一只手托着皇权宝球。宝座两边各站着一列禁卫军，每一个都比前一个矮。从两英里高的巨人开始，一路排到只有小拇指那么大的侏儒。宝座前还站着许多王公贵族。渔夫走到他们中间，仰头看着高处的妻子。
        - id: ch04-b03
          speaker: fisherman
          text: 妻子，你现在是皇帝了吗？既然已经做了皇帝，就知足吧。
        - id: ch04-b04
          speaker: wife
          text: 当然，我现在是皇帝。可你为什么还站着？我要再做教皇。去找比目鱼。
        - id: ch04-b05
          speaker: fisherman
          text: 你究竟还有什么不想要？整个基督教世界只有一位教皇，比目鱼不能让你做教皇。
        - id: ch04-b06
          speaker: wife
          text: 我今天就必须做教皇。马上去！
        - id: ch04-b07
          speaker: fisherman
          text: 我不愿对他说。这太过分了，他办不到。
        - id: ch04-b08
          speaker: wife
          text: 胡说！他能让我做皇帝，就能让我做教皇。我是皇帝，你不过是我的丈夫。现在就去！
          emotion: angry
        - id: ch04-b09
          speaker: narrator
          text: 渔夫怕极了，只好再次出发。他浑身虚软，不停地打着寒战，膝盖和两条腿都在发抖。狂风扫过大地，云在天上飞驰。黄昏将近，四下越来越暗，树叶纷纷从树上落下。海水不断上涨，像沸腾了一样怒吼着扑向岸边。远处有几艘船陷在危急里，一边随浪头上下颠簸，一边鸣炮求救。天空中央还剩一小块蓝色，四周却红得像一场可怕的暴风雨。渔夫满心绝望，战战兢兢地站到岸边。
        - id: ch04-b10
          speaker: fisherman
          text: 比目鱼呀，海中游，请你听我把话说。我的妻子伊尔莎比尔，偏要逼我违心愿。
        - id: ch04-b11
          speaker: flounder
          text: 她这次想要什么？
        - id: ch04-b12
          speaker: fisherman
          text: 她想做教皇。
          emotion: fearful
        - id: ch04-b13
          speaker: flounder
          text: 回去吧，她已经是教皇了。
    - id: ch05
      title: 欲望不肯入睡
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 渔夫回去以后，眼前出现了一座大教堂般的宏伟建筑，四周还环绕着许多宫殿。他费力地从人群中挤进去，只见里面燃着成千上万支蜡烛，到处灯火辉煌。妻子身披金衣，头戴三顶巨大的金冠，坐在一张比从前高得多的宝座上，周围尽是教会的华贵排场。宝座两边各有一排蜡烛，最大的和最高的塔一样高，最小的不过是厨房里用的小蜡烛。所有皇帝和国王都跪在她面前，低头亲吻她的鞋。
        - id: ch05-b02
          speaker: fisherman
          text: 妻子，你现在真的是教皇了？那就到此为止吧。
        - id: ch05-b03
          speaker: wife
          text: 是的，我是教皇。
        - id: ch05-b04
          speaker: narrator
          text: 渔夫站在那里，仔细望了妻子一会儿。她身上的金光亮得刺眼，他看着她，就像在直视耀眼的太阳。可她僵得像一根木桩，坐在那里一动不动，脸上也没有一点生气。
        - id: ch05-b05
          speaker: fisherman
          text: 你已经是教皇，该满足了。再没有更了不起的人可以做了。
        - id: ch05-b06
          speaker: wife
          text: 那可要让我想一想。
        - id: ch05-b07
          speaker: narrator
          text: 妻子说完以后，两人便上床睡觉。渔夫白天来来回回跑了许多路，很快便睡得又沉又香。妻子却一点也不满足。贪欲搅得她根本睡不着，她整夜从床的这边翻到那边，又从那边翻回来。她脑子一刻也没有停下，不停地盘算自己还能变成什么。可她想来想去，始终想不出别的身份。
    - id: ch06
      title: 回到破茅屋
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 漫长的一夜终于过去，太阳开始升起。妻子看见窗外泛起红色的晨曦，立刻从床上坐了起来。她隔着窗户，一直盯着太阳从天边向上升，心里忽然有了主意。
        - id: ch06-b02
          speaker: wife
          text: 难道我不能命令太阳和月亮升起来吗？当家的，醒醒！去找比目鱼，我要变得和上帝一样。
        - id: ch06-b03
          speaker: narrator
          text: 渔夫还半睡半醒，听见这话，吓得从床上滚了下来。他以为自己听错了，揉了揉眼睛。
        - id: ch06-b04
          speaker: fisherman
          text: 妻子，你刚才说什么？
          emotion: surprised
        - id: ch06-b05
          speaker: wife
          text: 我不能命令太阳和月亮升起，只能站在这里眼睁睁看着太阳和月亮自己升起来，我受不了！只要我还不能亲自命令它们升起，我就再也不会有一刻快活。马上去找比目鱼，我要变得和上帝一样。
          emotion: angry
        - id: ch06-b06
          speaker: narrator
          text: 妻子恶狠狠地盯着渔夫，那副神情叫他从头到脚打了个寒战。渔夫实在害怕，只好跪倒在她面前，求她放弃这个可怕的愿望，安安稳稳地继续做教皇。
        - id: ch06-b07
          speaker: fisherman
          text: 比目鱼做不到。他能让你做皇帝，也能让你做教皇，可这件事他办不到。求求你，就这样做你的教皇吧。
          emotion: fearful
        - id: ch06-b08
          speaker: narrator
          text: 妻子勃然大怒，头发乱纷纷地飞舞起来。
        - id: ch06-b09
          speaker: wife
          text: 我受够了，再也忍不下去了！你到底去不去？
          emotion: angry
        - id: ch06-b10
          speaker: narrator
          text: 渔夫连忙套上裤子，疯了似的跑了出去。外面正刮着一场可怕的暴风，狂风迎面扑来，吹得他东倒西歪，几乎站不住脚。房屋和树木一座接一座地倒下，群山也在颤抖，一块块岩石滚进海里。天空已经漆黑如墨，雷鸣和闪电一阵接着一阵。黑色的海浪像教堂高塔和山岳一样高，朝着岸边压来，每一道浪尖都顶着白色泡沫。渔夫终于走到海边，对着大海放声呼喊。可风暴的声音实在太响，他连自己的呼喊也听不见。
        - id: ch06-b11
          speaker: fisherman
          text: 比目鱼呀，海中游，请你听我把话说。我的妻子伊尔莎比尔，偏要逼我违心愿。
        - id: ch06-b12
          speaker: flounder
          text: 她这次想要什么？
        - id: ch06-b13
          speaker: fisherman
          text: 她想变得和上帝一样。
        - id: ch06-b14
          speaker: flounder
          text: 回去找她吧。等你到了那里，就会发现她又住回那间肮脏的破茅屋了。
        - id: ch06-b15
          speaker: narrator
          text: 渔夫转身往家走。等他回到海边的住处，果然发现妻子已经回到那间肮脏的破茅屋里。直到今天，他们还住在那里。
