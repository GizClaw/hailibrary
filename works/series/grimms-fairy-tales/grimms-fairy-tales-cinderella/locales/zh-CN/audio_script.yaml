audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: 沉稳而富有童话感, timbre: 温暖清晰, pace: 舒缓, pitch: 中}
    mother:
      display_name: 母亲
      tts: {delivery: 温柔而虚弱, timbre: 柔和, pace: 缓慢, pitch: 中高}
    cinderella:
      display_name: 灰姑娘
      tts: {delivery: 纯真而坚定, timbre: 清亮, pace: 适中, pitch: 中高}
    elder_sister:
      display_name: 姐姐
      tts: {delivery: 骄横而急切, timbre: 明亮, pace: 适中, pitch: 中高}
    younger_sister:
      display_name: 妹妹
      tts: {delivery: 虚荣而急切, timbre: 清脆, pace: 适中, pitch: 高}
    father:
      display_name: 父亲
      tts: {delivery: 平实而迟疑, timbre: 低沉, pace: 适中, pitch: 低}
    stepmother:
      display_name: 继母
      tts: {delivery: 冷硬而专横, timbre: 干冷, pace: 适中, pitch: 中}
    prince:
      display_name: 王子
      tts: {delivery: 坚定而直接, timbre: 清朗, pace: 适中, pitch: 中}
    pigeon_1:
      display_name: 鸽子甲
      tts: {delivery: 清脆而警醒, timbre: 轻亮, pace: 轻快, pitch: 高}
    pigeon_2:
      display_name: 鸽子乙
      tts: {delivery: 坚定而明快, timbre: 圆润, pace: 稍快, pitch: 中高}
  chapters:
    - id: ch01
      title: 炉灰里的姑娘
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个富人的妻子病得很重。她知道自己就要离开人世，便把唯一的女儿叫到床边。
        - id: ch01-b02
          speaker: mother
          text: 好孩子，你要永远善良虔诚。上帝会一直保护你，我也会从天上望着你，陪着你。
        - id: ch01-b03
          speaker: narrator
          text: 说完，母亲闭上眼睛，离开了人世。姑娘天天到母亲坟前哭泣，也始终善良虔诚。冬天，白雪像洁白的被单盖住坟墓。等春天的太阳把雪融去，父亲已经娶了新的妻子。继母带来两个女儿。她们长得白净漂亮，心肠却又黑又坏。从那以后，可怜姑娘的苦日子开始了。
        - id: ch01-b04
          speakers: [elder_sister, younger_sister]
          ensemble: duo
          text: 这只蠢鹅也想跟我们坐在客厅？想吃面包，就得干活。出去吧，厨房丫头！
          emotion: disgusted
        - id: ch01-b05
          speaker: narrator
          text: 她们脱下姑娘漂亮的衣服，给她套上灰旧的罩衣，又扔来一双木鞋。
        - id: ch01-b06
          speakers: [elder_sister, younger_sister]
          ensemble: duo
          text: 快看这位骄傲的公主！她穿得可真气派呀！
          emotion: happy
        - id: ch01-b07
          speaker: narrator
          text: 两人一边笑，一边把她赶进厨房。姑娘每天从天不亮一直忙到深夜，挑水、生火、做饭、洗衣，什么重活都落在她身上。姐妹俩还想尽办法欺负她，不光出言嘲笑，还故意把豌豆和扁豆倒进炉灰，逼她坐下来一颗颗拣出来。到了晚上，她累得浑身无力，却连一张床也没有，只能睡在炉边的灰堆里。她总是灰头土脸，大家便叫她灰姑娘。
        - id: ch01-b08
          speaker: narrator
          text: 一天，父亲要去赶集，问两个继女想要什么。
        - id: ch01-b09
          speaker: elder_sister
          text: 我要漂亮衣裳。
        - id: ch01-b10
          speaker: younger_sister
          text: 我要珍珠和宝石。
        - id: ch01-b11
          speaker: father
          text: 灰姑娘，你想让我带什么回来？
        - id: ch01-b12
          speaker: cinderella
          text: 爸爸，您回来的路上，第一根碰掉您帽子的树枝，请把它折下来给我。
        - id: ch01-b13
          speaker: narrator
          text: 父亲给两个继女买好礼物。回家时，他骑马经过青翠的灌木丛，一根榛树枝擦过来，碰掉了帽子。他折下树枝带回家，把衣裳、珍珠和宝石交给继女，也把榛树枝给了灰姑娘。灰姑娘道过谢，把树枝栽在母亲坟上。她哭得那么伤心，泪水落下来，浇湿了泥土。树枝慢慢长成一棵秀美的树。灰姑娘每天三次坐到树下哭泣祈祷。总有一只小白鸟飞来。只要她说出心愿，小鸟就会把她要的东西抛下来。
    - id: ch02
      title: 鸟儿来帮忙
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 后来，国王要举行三天庆典，请全国年轻漂亮的姑娘都来，好让王子挑选新娘。两个继姐听说自己也能参加，高兴极了。
        - id: ch02-b02
          speakers: [elder_sister, younger_sister]
          ensemble: duo
          text: 灰姑娘，快来给我们梳头，把鞋刷好，再扣上鞋扣。我们要进王宫参加庆典啦！
          emotion: happy
        - id: ch02-b03
          speaker: narrator
          text: 灰姑娘照着吩咐做了，却忍不住哭起来。她也想去跳舞，便求继母带她同去。
        - id: ch02-b04
          speaker: stepmother
          text: 你也想去？看看你，满身灰尘，脏兮兮的！你连衣裳和鞋都没有，还想跳舞？
          emotion: disgusted
        - id: ch02-b05
          speaker: narrator
          text: 灰姑娘一再恳求，继母才给她出了个难题。
        - id: ch02-b06
          speaker: stepmother
          text: 我把一盘扁豆倒进炉灰了。两个钟头之内全拣出来，你就能跟我们去。
        - id: ch02-b07
          speaker: narrator
          text: 灰姑娘从后门跑进花园，向鸟儿求助。
        - id: ch02-b08
          speaker: cinderella
          text: 家鸽呀，斑鸠呀，天空下所有的鸟儿呀，快来帮我。好的放进锅，坏的吞进肚。
        - id: ch02-b09
          speaker: narrator
          text: 两只白鸽先从厨房窗口飞进来，随后是斑鸠，最后天空下所有的鸟儿都扑棱棱地挤进屋，落在炉灰里。鸽子点着头，啄呀，啄呀，啄呀，啄呀。其他鸟儿也跟着啄呀，啄呀，把所有好豆子拣进盘中。不到一个钟头，活儿就做完了，鸟儿又一齐飞走。灰姑娘欢欢喜喜地端着盘子去见继母，以为自己终于可以跟她们去参加庆典了。
        - id: ch02-b10
          speaker: stepmother
          text: 不行。你没有衣裳，也不会跳舞，去了只会让人笑话。
        - id: ch02-b11
          speaker: narrator
          text: 灰姑娘哭了。继母又把两盘扁豆倒进炉灰，心里认定这回她绝对做不完。
        - id: ch02-b12
          speaker: stepmother
          text: 要是一个钟头内把这两盘都拣出来，我就让你去。
        - id: ch02-b13
          speaker: cinderella
          text: 家鸽呀，斑鸠呀，天空下所有的鸟儿呀，再来帮帮我。好的放进锅，坏的吞进肚。
        - id: ch02-b14
          speaker: narrator
          text: 两只白鸽又从厨房窗口飞进来，接着是斑鸠，最后所有鸟儿都挤进屋，落在炉灰里。它们点着头，啄呀，啄呀，啄呀，啄呀，把好豆子全拣进两只盘子。还不到半个钟头，活儿已经做完，鸟儿又全都飞走。灰姑娘满心欢喜地把盘子送到继母面前，以为这一次总能跟大家同去了。
        - id: ch02-b15
          speaker: stepmother
          text: 做完了也没用。你没衣裳，又不会跳舞。带你出门，只会让我们丢脸！
        - id: ch02-b16
          speaker: narrator
          text: 继母转过身，领着两个傲慢的女儿匆匆走了。
    - id: ch03
      title: 三天的舞会
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 家里没人以后，灰姑娘来到母亲坟前的榛树下。
        - id: ch03-b02
          speaker: cinderella
          text: 小树呀，摇一摇，抖一抖，把金银衣裳抛给我。
        - id: ch03-b03
          speaker: narrator
          text: 小鸟给她抛下一件金银织成的衣裳，还有一双用丝线和银线绣成的鞋。她赶紧穿好，来到庆典。继母和继姐没有认出她，只当她是异国公主。她穿着金光闪闪的衣裳，美丽极了。她们哪里想得到，眼前的人就是灰姑娘，还以为她正待在家里的炉灰中拣扁豆呢。王子迎上来，牵住她的手，从此不肯再跟别的姑娘跳舞。有人来邀请她，王子总说——
        - id: ch03-b04
          speaker: prince
          text: 她是我的舞伴。
        - id: ch03-b05
          speaker: narrator
          text: 灰姑娘跳到傍晚，便想回家。
        - id: ch03-b06
          speaker: prince
          text: 我陪你一起走。
        - id: ch03-b07
          speaker: narrator
          text: 王子想知道她是谁家的姑娘，可她一下挣脱，跳进了鸽舍。王子守在那里，直到她父亲回来，才说那个陌生姑娘跳进了鸽舍。父亲心想，会不会是灰姑娘？他叫人拿来斧头和鹤嘴锄，把鸽舍劈得七零八落，里面却连个人影也没有。等他们回到家，灰姑娘已经穿着脏衣服躺在炉灰里，壁炉台上只亮着一盏昏暗的小油灯。原来，她早从鸽舍后面跳下，飞快跑到小榛树旁。她脱下漂亮衣裳，把它放在母亲坟上，让鸟儿收走，自己又换回灰罩衣，安安静静坐进厨房的炉灰里。
        - id: ch03-b08
          speaker: narrator
          text: 第二天，家人又去了庆典。灰姑娘再次站到榛树下。
        - id: ch03-b09
          speaker: cinderella
          text: 我的小树，摇一摇，抖一抖，把金银衣裳抛给我。
        - id: ch03-b10
          speaker: narrator
          text: 小鸟抛下的衣裳比昨天那件漂亮得多。灰姑娘穿着它走进庆典，所有人都惊叹她的美貌。王子早就等着她，一见她来，马上牵起她的手，再也不和别人跳舞。有人上前邀请，王子仍旧告诉对方，她是自己的舞伴。傍晚，灰姑娘又要离开。王子跟在后面，想亲眼看看她到底走进哪一所房子。她却从他面前逃开，钻进屋后的花园。那里有棵高大秀美的梨树，枝头挂满了华美的大梨。灰姑娘像松鼠一样敏捷地攀进枝叶之间，王子根本不知道她躲去了哪里，只好等她父亲回来。
        - id: ch03-b11
          speaker: prince
          text: 那个陌生姑娘从我身边逃走了。我想，她爬上了这棵梨树。
        - id: ch03-b12
          speaker: narrator
          text: 父亲又想，会不会是灰姑娘？他叫人拿来斧头，把整棵梨树砍倒，可树上还是没人。等他们走进厨房，灰姑娘像平常一样躺在炉灰里。原来，她早从梨树另一边跳下，赶到小榛树旁，把漂亮衣裳交还给树上的鸟儿，又穿回自己的灰罩衣。
        - id: ch03-b13
          speaker: narrator
          text: 第三天，家人走后，灰姑娘又来到母亲坟前。
        - id: ch03-b14
          speaker: cinderella
          text: 我的小树，摇一摇，抖一抖，把金银衣裳抛给我。
        - id: ch03-b15
          speaker: narrator
          text: 这回，小鸟抛下的衣裳比灰姑娘从前穿过的任何一件都华贵灿烂，鞋子也是金的。她穿戴好，第三次走进庆典。人们望着她，惊讶得一句话也说不出来。王子依旧只牵着她一个人的手，只和她跳舞。每当有人上前邀请她，王子便告诉那个人，她是自己的舞伴。
    - id: ch04
      title: 金鞋认出了新娘
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 傍晚，灰姑娘又想离开。王子急着陪她一同回去，可她逃得太快，王子没能追上。不过，这一次王子早想好了计策，叫人在整座楼梯上涂满沥青。灰姑娘匆匆跑下楼时，左脚的鞋粘在那里，没能带走。王子把它捡起来，仔细一看，这只鞋又小巧又精致，通体都是金的。第二天一早，他拿着金鞋去见灰姑娘的父亲。
        - id: ch04-b02
          speaker: prince
          text: 谁穿得下这只金鞋，谁就是我的妻子。除了她，我谁也不娶。
        - id: ch04-b03
          speaker: narrator
          text: 姐妹俩听了很高兴，因为她们的脚都很漂亮。姐姐拿着鞋进房试穿，母亲守在旁边。鞋太小，她的大脚趾怎么也塞不进去。
        - id: ch04-b04
          speaker: stepmother
          text: 把脚趾割掉。等你做了王后，就用不着走路了。
        - id: ch04-b05
          speaker: narrator
          text: 姐姐拿刀割掉大脚趾，把脚硬塞进鞋里。她强忍着疼痛走到王子面前。王子以为找到了新娘，扶她上马，带着她离开。可他们必须从墓地旁经过。母亲坟前的榛树上坐着两只鸽子，它们看见这位新娘，立刻叫了起来。
        - id: ch04-b06
          speakers: [pigeon_1, pigeon_2]
          ensemble: duo
          text: 回头瞧，回头瞧，鞋里鲜血往外冒。这只鞋儿太嫌小，真新娘还在家中等你找。
        - id: ch04-b07
          speaker: narrator
          text: 王子低头一看，鲜血正从她脚上淌下来。他掉转马头，把假新娘送回家，叫妹妹来试。妹妹的脚趾进去了，脚后跟却太大。
        - id: ch04-b08
          speaker: stepmother
          text: 削掉一点脚后跟。做了王后，你就不用走路了。
        - id: ch04-b09
          speaker: narrator
          text: 妹妹拿刀削掉一块脚后跟，忍着疼把脚硬塞进鞋里，再走出去见王子。王子也把她当成新娘，扶她上马，带着她离开。可他们经过榛树时，两只小鸽子又坐在枝头叫了起来。
        - id: ch04-b10
          speakers: [pigeon_1, pigeon_2]
          ensemble: duo
          text: 回头瞧，回头瞧，鞋里鲜血往外冒。这只鞋儿太嫌小，真新娘还在家中等你找。
        - id: ch04-b11
          speaker: narrator
          text: 王子低头一看，血已经流出鞋子，染红了白袜。他再次掉转马头，把假新娘送了回去。
        - id: ch04-b12
          speaker: prince
          text: 这个也不是。你们再没有别的女儿了吗？
        - id: ch04-b13
          speaker: father
          text: 没有了。我亡妻留下过一个瘦小的厨房丫头，可她绝不会是那位新娘。
        - id: ch04-b14
          speaker: narrator
          text: 王子让他把姑娘叫来。
        - id: ch04-b15
          speaker: stepmother
          text: 不行！她脏得很，哪能出来见人？
          emotion: disgusted
        - id: ch04-b16
          speaker: narrator
          text: 王子坚决要见，灰姑娘只好出来。她先洗净手和脸，走到王子面前行礼。王子递给她金鞋。灰姑娘坐在矮凳上，脱下沉重的木鞋，把脚伸进去。金鞋严丝合缝。她站起身，王子看清她的脸，终于认出眼前正是和自己跳舞的美丽姑娘。
        - id: ch04-b17
          speaker: prince
          text: 这才是真正的新娘！
        - id: ch04-b18
          speaker: narrator
          text: 继母和两个姐姐吓坏了，又气得脸色煞白。王子扶灰姑娘上马，带她离去。经过榛树时，两只白鸽唱道——
        - id: ch04-b19
          speakers: [pigeon_1, pigeon_2]
          ensemble: duo
          text: 回头瞧，回头瞧，鞋里一滴血没有。这只鞋儿正正好，真新娘就在马上跟你走。
        - id: ch04-b20
          speaker: narrator
          text: 鸽子唱完便飞下来，落在灰姑娘肩头。一只停在右边，一只停在左边，就这样一直陪着她。
    - id: ch05
      title: 婚礼与惩罚
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 灰姑娘和王子举行婚礼时，两个虚伪的姐姐也来了。她们想讨灰姑娘欢心，好分到一点福气。新婚夫妇去教堂时，姐姐走在右边，妹妹走在左边。鸽子飞来，分别啄瞎了她们的一只眼睛。等众人从教堂回来，姐姐改走左边，妹妹走在右边，鸽子又啄瞎了她们剩下的眼睛。姐妹俩作恶又撒谎，终于受到了惩罚。从此，她们一生都活在黑暗中。
