  chapters:
    - id: ch01
      title: The Well
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: There once was a widow with two daughters. One was pretty and hardworking. The other was ugly and idle. The idle girl was the widow's own daughter, so the widow loved her best. Her stepdaughter had to do all the work and live like the Cinderella of the house. Each day, the poor girl sat beside a well along the road. She spun and spun until her fingers bled.
        - id: ch01-b02
          speaker: narrator
          text: One day, blood stained her shuttle. She dipped it into the well to rinse it, but it slipped from her hand and sank to the bottom. Crying, she ran home and told her stepmother what had happened. The widow scolded her without mercy.
        - id: ch01-b03
          speaker: widow
          text: You let the shuttle fall in, so you can go down and bring it back!
          emotion: angry
        - id: ch01-b04
          speaker: narrator
          text: The girl returned to the well. She had no idea what else to do. In her sorrow, she jumped in after the shuttle. She lost her senses. When she woke again, she found herself in a lovely meadow. Sunshine filled the sky, and thousands upon thousands of flowers grew around her.
    - id: ch02
      title: The Meadow Road
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: She crossed the meadow and came to a baker's oven filled with bread. The bread called out to her.
        - id: ch02-b02
          speaker: bread
          text: Please, take me out! Take me out, or I'll burn! I've been baking for so long!
        - id: ch02-b03
          speaker: narrator
          text: The girl went straight to the oven. With the bread shovel, she drew out every loaf, one after another. Then she continued down the path until she reached an apple tree heavy with fruit. The tree called to her.
        - id: ch02-b04
          speaker: apple_tree
          text: Oh, shake me! Shake me! All my apples are ripe!
        - id: ch02-b05
          speaker: narrator
          text: She shook the tree, and the apples fell like rain. She kept shaking until every apple was down. Then she gathered them into one heap and went on her way.
        - id: ch02-b06
          speaker: narrator
          text: At last, she came to a little house. An old woman peered out. Her teeth were so large that the girl grew frightened and turned to run.
        - id: ch02-b07
          speaker: mother_holle
          text: What frightens you, dear child? Stay here with me. Do the housework properly, and things will go well for you. Just make my bed carefully. Shake it hard enough for the feathers to fly, because that's when snow falls on the earth. I am Mother Holle.
        - id: ch02-b08
          speaker: narrator
          text: The old woman's kind words gave the girl courage, and she agreed to work for her.
    - id: ch03
      title: Mother Holle's House
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: She took care of everything just as Mother Holle wanted. Whenever she made the bed, she shook it so strongly that the feathers flew around like snowflakes. Life there was pleasant. Mother Holle never spoke an angry word to her, and every day there was boiled or roasted meat to eat.
        - id: ch03-b02
          speaker: narrator
          text: After some time, though, the girl became sad. At first, she could not understand why. Then she realized she was homesick. She was thousands of times better off with Mother Holle than she had been at home, but she still longed to return.
        - id: ch03-b03
          speaker: industrious_daughter
          text: I miss my home. Even though I have such a good life down here, I can't stay any longer. I must go back to my own family.
          emotion: sad
        - id: ch03-b04
          speaker: mother_holle
          text: I'm glad you still long for home. You have served me faithfully, so I will take you back myself.
        - id: ch03-b05
          speaker: narrator
          text: Mother Holle took her hand and led her to a great door. The door opened. As the girl stood beneath it, a heavy shower of gold poured down. The gold clung to her until it covered her from head to toe.
        - id: ch03-b06
          speaker: mother_holle
          text: This is yours because you worked so hard.
        - id: ch03-b07
          speaker: narrator
          text: Mother Holle also returned the shuttle that had fallen into the well. Then the door closed, and the girl found herself back on the earth, close to her mother's house.
        - id: ch03-b08
          speaker: narrator
          text: When she entered the yard, the rooster stood beside the well and called out.
        - id: ch03-b09
          speaker: rooster
          text: Cock-a-doodle-doo! Your golden girl's come home to you!
        - id: ch03-b10
          speaker: narrator
          text: She went inside, still covered in gold. This time, both her mother and her sister welcomed her warmly.
    - id: ch04
      title: The Second Daughter
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The girl told them everything that had happened. As soon as the widow learned how she had gained so much wealth, she wanted the same good fortune for her own ugly, lazy daughter. She made that daughter sit by the well and spin. To stain the shuttle with blood, the girl pushed her hand into a thornbush and pricked her finger. Then she tossed the shuttle into the well and jumped in after it.
        - id: ch04-b02
          speaker: narrator
          text: Like her sister, she landed in the beautiful meadow and followed the same path. At the oven, the bread called to her again.
        - id: ch04-b03
          speaker: bread
          text: Please, take me out! Take me out, or I'll burn! I've been baking for so long!
        - id: ch04-b04
          speaker: lazy_daughter
          text: Why would I want to get myself dirty?
        - id: ch04-b05
          speaker: narrator
          text: She walked on and soon reached the apple tree. Once again, it called out.
        - id: ch04-b06
          speaker: apple_tree
          text: Oh, shake me! Shake me! All my apples are ripe!
        - id: ch04-b07
          speaker: lazy_daughter
          text: No, thank you! One of those apples might hit me on the head.
        - id: ch04-b08
          speaker: narrator
          text: And she kept going. When she reached Mother Holle's house, the old woman's teeth did not scare her. She had already heard all about them, and she offered to work there at once.
    - id: ch05
      title: The Reward for Her Service
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: On the first day, she forced herself to work hard. Whenever Mother Holle gave her a task, she obeyed, because she kept thinking about the gold she expected to receive. On the second day, she began to grow lazy. By the third, she was lazier still. Soon she would not even get out of bed in the morning.
        - id: ch05-b02
          speaker: narrator
          text: She did not make Mother Holle's bed properly, and she never shook it enough to send the feathers flying. Before long, Mother Holle had had enough and told her it was time to leave.
        - id: ch05-b03
          speaker: narrator
          text: The lazy girl was quite willing to go. She thought the golden rain must be waiting for her now. Mother Holle led her to the great door, just as before. But when the girl stood beneath it, no gold came down. Instead, a huge kettleful of pitch poured over her.
        - id: ch05-b04
          speaker: mother_holle
          text: That is the reward for the work you gave me.
        - id: ch05-b05
          speaker: narrator
          text: Mother Holle shut the door. The lazy girl went home completely covered in pitch. As soon as the rooster beside the well saw her, he cried out.
        - id: ch05-b06
          speaker: rooster
          text: Cock-a-doodle-doo! Your pitch-covered girl's come home to you!
        - id: ch05-b07
          speaker: narrator
          text: But the pitch clung fast to her, and for as long as she lived, it never came off.
