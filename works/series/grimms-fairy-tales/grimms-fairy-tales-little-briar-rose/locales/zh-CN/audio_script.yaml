audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉着而富有童话色彩
        timbre: 温暖清澈
        pace: 舒缓且富有变化
        pitch: 中音
    king_and_queen:
      display_name: 国王和王后
      tts:
        delivery: 真挚而带着渴望
        timbre: 成熟温和
        pace: 稍慢
        pitch: 中音
    frog:
      display_name: 青蛙
      tts:
        delivery: 笃定而神秘
        timbre: 清亮圆润
        pace: 从容
        pitch: 中高音
    thirteenth_wise_woman:
      display_name: 第十三位智慧仙女
      tts:
        delivery: 冰冷凌厉
        timbre: 尖锐深沉
        pace: 紧逼
        pitch: 中低音
    twelfth_wise_woman:
      display_name: 第十二位智慧仙女
      tts:
        delivery: 郑重而克制
        timbre: 柔和沉稳
        pace: 缓慢
        pitch: 中音
    briar_rose:
      display_name: 睡美人
      tts:
        delivery: 天真自然
        timbre: 年轻清亮
        pace: 轻快
        pitch: 中高音
    old_woman:
      display_name: 老妇人
      tts:
        delivery: 朴实平静
        timbre: 苍老微哑
        pace: 缓慢
        pitch: 低音
    prince:
      display_name: 王子
      tts:
        delivery: 勇敢坚定
        timbre: 年轻明朗
        pace: 沉稳
        pitch: 中音
    old_man:
      display_name: 老人
      tts:
        delivery: 善意而忧心
        timbre: 苍老厚重
        pace: 不紧不慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 十三位智慧仙女
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 很久以前，一位国王和一位王后天天盼着有个孩子，可这个心愿总也不能实现。
        - id: ch01-b02
          speaker: king_and_queen
          text: 唉，我们要是能有一个孩子，那该多好啊！
          emotion: sad
        - id: ch01-b03
          speaker: narrator
          text: 有一天，王后正在沐浴，一只青蛙忽然从水里爬上了岸。
        - id: ch01-b04
          speaker: frog
          text: 你的心愿会实现。一年还没过完，你就会有一个女儿。
        - id: ch01-b05
          speaker: narrator
          text: 青蛙说的话真的成了事实。王后生下一个非常美丽的女孩。国王高兴得心都快盛不下了，马上吩咐人们准备一场盛宴。
        - id: ch01-b06
          speaker: narrator
          text: 亲戚、朋友和熟人都收到了邀请。国王还请来智慧仙女，想让她们也喜爱这个孩子。可王国里有十三位仙女，宫中却只找得出十二只金盘，所以有一位只能留在家里。
        - id: ch01-b07
          speaker: narrator
          text: 宴会办得华丽极了。快要散席时，仙女们一个接一个地送上神奇的祝福。美德、美貌、财富，还有人们向往的种种美好东西，全都送给了小公主。
        - id: ch01-b08
          speaker: narrator
          text: 第十一位仙女刚说完，没被邀请的第十三位便闯进了大厅。她要为受到的冷落报仇。她没向谁问好，也不抬眼看谁，开口就大声降下诅咒。
        - id: ch01-b09
          speaker: thirteenth_wise_woman
          text: 国王的女儿到十五岁时，会让纺锤刺伤，然后倒在地上死去！
          emotion: angry
        - id: ch01-b10
          speaker: narrator
          text: 她说完就转身走了，再没多留下一句话。大厅里的人都惊恐不已。幸好第十二位仙女还没说出自己的祝福。她不能取消诅咒，只能让它变得轻一些。
        - id: ch01-b11
          speaker: twelfth_wise_woman
          text: 公主不会死。她会陷入沉睡，这一睡就是一百年。
    - id: ch02
      title: 高塔里的纺锤
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 国王想保住女儿，便下令把全国的纺锤统统烧掉。公主却一天天长大，仙女们的祝福也全落在了她身上。她美丽、谦逊、善良，又很聪慧，见过她的人没有不喜欢她的。
        - id: ch02-b02
          speaker: narrator
          text: 公主十五岁生日那天，国王和王后都出了门，宫殿里只有她一个人。她便想去哪里就去哪里，一间间房子和卧室都看了个遍。最后，她走到了一座古老的高塔前。
        - id: ch02-b03
          speaker: narrator
          text: 她登上狭窄的螺旋楼梯，顶上有一扇小门，锁里还插着一把生锈的钥匙。她转动钥匙，小门一下就开了。屋里坐着一位老妇人，正拿着纺锤忙忙碌碌地纺麻。
        - id: ch02-b04
          speaker: briar_rose
          text: 老太太，您好。您坐在这里做什么呢？
        - id: ch02-b05
          speaker: old_woman
          text: 我在纺纱呢。
        - id: ch02-b06
          speaker: narrator
          text: 老妇人说着，点了点头。
        - id: ch02-b07
          speaker: briar_rose
          text: 那个东西怎么转得这么欢，还一直叮铃铃地响呀？
        - id: ch02-b08
          speaker: narrator
          text: 她拿起纺锤，也想动手试一试。手指才刚碰上去，那道魔法诅咒就应验了。纺锤刺破了她的手指。
        - id: ch02-b09
          speaker: narrator
          text: 刚觉得指尖一疼，公主就倒向屋里的床，沉沉睡着了。
    - id: ch03
      title: 沉睡的城堡
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 这场沉睡很快就传遍整座宫殿。国王和王后刚回到家，走进大厅，便和满宫廷的人一起睡了过去。
        - id: ch03-b02
          speaker: narrator
          text: 马儿在马厩里睡了，狗儿躺在院中，鸽子停在屋顶，就连墙上的苍蝇也一动不动。炉灶里的火安静下来，烤肉不再滋滋响。
        - id: ch03-b03
          speaker: narrator
          text: 厨子原本正要揪那个厨房小工的头发，因为小工忘了办事。可他的手一松，人也跟着睡了。风停了，城堡前的树木上，再也没有一片叶子会动。
        - id: ch03-b04
          speaker: narrator
          text: 可在城堡外面，荆棘却开始长了起来。它们一年比一年高，慢慢包住城墙，又爬遍城堡。后来从外面望去，别说城堡，就连屋顶的旗帜都看不见了。
        - id: ch03-b05
          speaker: narrator
          text: 美丽公主的故事倒传遍了各地。人们叫她“睡美人”。一位又一位王子来到这里，想穿过荆棘去找她。
        - id: ch03-b06
          speaker: narrator
          text: 他们谁也没能进去。那些荆棘紧紧缠在一起，像无数双手伸向年轻人。只要被它们抓住，就再也挣脱不了。那些王子最后都悲惨地死在了荆棘中。
    - id: ch04
      title: 一百年后的王子
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 很多很多年后，又有一位王子来到这个国家。他遇到一位老人，听老人说起那道荆棘篱笆。
        - id: ch04-b02
          speaker: old_man
          text: 人们说，荆棘后面有一座城堡。一位名叫睡美人的公主睡在里面，美得让人不敢相信。她已经睡了一百年，国王、王后和宫廷中的所有人也在那里沉睡。
        - id: ch04-b03
          speaker: narrator
          text: 老人还说，自己的祖父早就讲过，许多王子都试过穿越荆棘。他们被困得牢牢的，没有一个人能活着出来。
        - id: ch04-b04
          speaker: prince
          text: 我不怕。我要进去，亲眼看看那位美丽的睡美人。
        - id: ch04-b05
          speaker: narrator
          text: 善良的老人一遍又一遍地劝他，王子一句也没有听进去。
        - id: ch04-b06
          speaker: narrator
          text: 正好在这个时候，一百年过完了，睡美人该醒来的日子也到了。王子走到篱笆前，那些荆棘已经变成又大又美的花朵。
        - id: ch04-b07
          speaker: narrator
          text: 花朵自己向两边分开，让王子毫发无伤地穿了过去。等他走过，花朵又在身后闭拢，变回一道篱笆。
        - id: ch04-b08
          speaker: narrator
          text: 城堡的院子里，马儿和长着斑点的猎犬仍在睡觉。屋顶的鸽子把脑袋藏在翅膀下面。走进屋里，王子又看见苍蝇睡在墙上。
        - id: ch04-b09
          speaker: narrator
          text: 厨房里，厨子还伸着那只要去抓小工的手，女仆则坐在黑母鸡旁边，正要给它拔毛。王子继续往前走，来到大厅，满宫廷的人都睡在那里，国王和王后就躺在王座旁边。
    - id: ch05
      title: 城堡醒来了
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 王子越走越深。四周静得出奇，只要有人呼吸，都能听得清清楚楚。他最后来到高塔，打开了那扇小屋的门。
        - id: ch05-b02
          speaker: narrator
          text: 睡美人就躺在那里。她太美了，王子怎么也舍不得把眼睛移开。他俯下身，吻了睡美人。
        - id: ch05-b03
          speaker: narrator
          text: 这个吻才刚落下，睡美人就睁开眼醒了。她望着王子，目光十分温柔。
        - id: ch05-b04
          speaker: narrator
          text: 他们两人一起走下高塔。国王和王后醒了，宫廷中的人也都醒了。大家你看着我，我看着你，个个惊奇得不得了。
        - id: ch05-b05
          speaker: narrator
          text: 院里的马儿站起来抖抖身体，猎犬们跳起来摇着尾巴。屋顶的鸽子从翅膀下伸出脑袋，四处看看，然后飞向了开阔的田野。
        - id: ch05-b06
          speaker: narrator
          text: 墙上的苍蝇又爬了起来。厨房的火焰重新跳动，烤肉转着圈，又发出滋滋的响声。厨子顺手给了小工一记重重的耳光，小工疼得大叫起来。女仆也拔完了鸡毛，把鸡准备好，等着送上烤架。
        - id: ch05-b07
          speaker: narrator
          text: 后来，王子和睡美人举行了一场光彩夺目的婚礼。
        - id: ch05-b08
          speaker: narrator
          text: 从那以后，他们心满意足地生活在一起，一直到了生命的尽头。
