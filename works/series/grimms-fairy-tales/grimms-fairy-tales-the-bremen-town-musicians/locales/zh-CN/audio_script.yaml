audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts: {delivery: 从容而富有童话感, timbre: 温暖清晰, pace: 舒缓有变化, pitch: 中音}
    donkey:
      display_name: 驴
      tts: {delivery: 乐观而有主见, timbre: 粗厚响亮, pace: 适中, pitch: 中低音}
    hound:
      display_name: 猎狗
      tts: {delivery: 忠厚而略显疲惫, timbre: 沙哑低沉, pace: 稍慢, pitch: 低音}
    cat:
      display_name: 猫
      tts: {delivery: 机敏而带几分忧郁, timbre: 轻柔微哑, pace: 适中, pitch: 中高音}
    rooster:
      display_name: 公鸡
      tts: {delivery: 响亮而直爽, timbre: 高亢清脆, pace: 稍快, pitch: 高音}
    robber:
      display_name: 强盗
      tts: {delivery: 惊慌失措, timbre: 粗哑紧绷, pace: 急促, pitch: 中音}
    robber_captain:
      display_name: 强盗头子
      tts: {delivery: 强硬而懊恼, timbre: 粗重低沉, pace: 稳健, pitch: 低音}
  chapters:
    - id: ch01
      title: 四个逃难的伙伴
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个人养了一头驴。许多年来，驴总把一袋袋谷子驮到磨坊，从来不知道疲倦。可它渐渐老了，力气越来越小，再也干不了多少活。主人开始盘算，怎样才能省下养它的钱。驴看出事情不妙，赶紧逃了出来，动身去不来梅。它心里已经有了一个打算。
        - id: ch01-b02
          speaker: donkey
          text: 到了不来梅，我准能当个城市乐手。
        - id: ch01-b03
          speaker: narrator
          text: 走了一阵，驴看见一条猎狗躺在路边，累得张大嘴直喘气。
        - id: ch01-b04
          speaker: donkey
          text: 大个子，你怎么喘成这样？
        - id: ch01-b05
          speaker: hound
          text: 唉，我老了，一天比一天虚弱，再也打不了猎。主人想要杀我，我只好逃了。可从今往后，我到哪儿去找吃的呢？
          emotion: sad
        - id: ch01-b06
          speaker: donkey
          text: 那就听我的吧。我正要去不来梅当城市乐手。你也跟我去，咱们一起做乐手。我弹鲁特琴，你敲定音鼓。
        - id: ch01-b07
          speaker: narrator
          text: 猎狗答应下来，跟着驴继续上路。没过多久，它们又看见一只猫坐在小路上。那张脸阴沉沉的，简直像连下了三天雨。
        - id: ch01-b08
          speaker: donkey
          text: 喂，刮胡子的老伙计，什么事这么不顺心？
        - id: ch01-b09
          speaker: cat
          text: 我的命都快保不住了，怎么高兴得起来？我年纪大了，牙也磨得只剩短桩。比起四处追老鼠，我宁愿守着炉火打呼噜。女主人却要把我淹死，我只能逃出来。现在我连该去哪儿都不知道。
          emotion: sad
        - id: ch01-b10
          speaker: donkey
          text: 跟我们去不来梅。你很会唱夜里的曲子，正好当个城市乐手。
        - id: ch01-b11
          speaker: narrator
          text: 猫觉得这主意不错，也加入了它们。三个逃难的伙伴来到一座农庄，看见一只公鸡站在大门上，正扯开嗓子拼命啼叫。
        - id: ch01-b12
          speaker: donkey
          text: 你这一嗓子，简直能把人从头穿到脚。到底出什么事了？
        - id: ch01-b13
          speaker: rooster
          text: 今天是圣母给圣婴洗小衬衣、要把衣服晒干的日子，所以我预报了好天气。可星期日有客人要来，主妇一点儿也不可怜我。她告诉厨娘，明天要把我煮进汤里，今天晚上就砍我的头。趁现在还能叫，我得使足力气叫个痛快！
        - id: ch01-b14
          speaker: donkey
          text: 红冠子，别留在这儿了，跟我们走吧。我们要去不来梅。到了哪里，都有比死更好的出路。你嗓子这么好，咱们一起奏乐，一定很像样！
        - id: ch01-b15
          speaker: narrator
          text: 公鸡也同意了。就这样，四个伙伴一起向前走去。
    - id: ch02
      title: 森林里的灯光
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一天之内，它们赶不到不来梅。傍晚，四个伙伴走进一片森林，决定在那里过夜。驴和猎狗躺在一棵大树下面，猫和公鸡在树枝间找到了位置。公鸡飞得最高，一直落在安全的树梢上。睡觉前，它向四周望去，远处好像亮着一点火光。它马上叫醒伙伴们，说附近一定有房子，因为那边有灯。
        - id: ch02-b02
          speaker: donkey
          text: 既然有房子，咱们还是起来接着走吧。这里可住不舒服。
        - id: ch02-b03
          speaker: narrator
          text: 猎狗也盼着能找到几根带肉的骨头。于是大家朝火光走去。那光越来越亮，也越来越大，最后，它们来到一座灯火通明的房子。原来，这是一群强盗的住处。驴个头最大，便走到窗前，探头往里看。
        - id: ch02-b04
          speaker: rooster
          text: 灰马兄弟，你看到什么啦？
        - id: ch02-b05
          speaker: donkey
          text: 还能看到什么？桌上摆满了好吃好喝的，一群强盗正围在那里享用呢。
        - id: ch02-b06
          speaker: rooster
          text: 那可正是我们想要的！
        - id: ch02-b07
          speaker: donkey
          text: 是啊。唉，要是咱们也能坐在桌边，那该多好！
        - id: ch02-b08
          speaker: narrator
          text: 四只动物凑到一起，商量怎么赶走强盗。最后，它们想出了办法。驴把前蹄搭在窗台上，猎狗跳上驴背，猫再爬到猎狗背上，公鸡最后飞起来，站到了猫的头顶。
    - id: ch03
      title: 一场吓人的音乐会
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 大家站稳以后，等着同一个信号，突然一齐奏起音乐。驴大声嘶鸣，猎狗汪汪吠叫，猫尖声喵叫，公鸡放声啼鸣。紧接着，它们撞破窗户，冲进屋里，玻璃哗啦啦落了一地！这阵可怕的巨响吓得强盗全都跳起来。他们一心以为鬼怪闯进了屋，慌忙逃进森林。
        - id: ch03-b02
          speaker: narrator
          text: 四个伙伴心满意足地坐到桌边，把强盗留下的食物吃了个痛快。看它们那副胃口，简直像是接下来一个月都没饭吃。四位乐手吃饱后，吹灭了灯，各自找地方睡觉。驴躺在院子的稻草上，猎狗守在门后，猫卧在炉边温暖的灰烬旁，公鸡栖在屋顶的横梁上。走了一整天，大家都累坏了，很快就睡着了。
    - id: ch04
      title: 强盗夜探小屋
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 午夜已经过去。强盗们从远处看见屋里的灯灭了，周围似乎也没有一点动静。
        - id: ch04-b02
          speaker: robber_captain
          text: 我们真不该被吓得失去理智。你回去看看，屋里究竟有什么。
        - id: ch04-b03
          speaker: narrator
          text: 一个强盗只好回去。他见屋里静悄悄的，便走进厨房，想把蜡烛点亮。黑暗中，猫的两只眼睛闪着火光，他还以为那是烧红的煤，就把一根火柴凑过去引火。猫可不懂这个玩笑，一下扑到他脸上，冲他吐唾沫，又抓又挠。强盗吓坏了，连忙往后门逃。谁知猎狗正睡在那里，跳起来便在他腿上咬了一口。他从院里的草堆旁跑过，驴抬起后蹄，又结结实实地踢了他一下。响声惊醒了公鸡。它顿时来了精神，从横梁上朝下面高叫：“喔——喔——喔！”
        - id: ch04-b04
          speaker: narrator
          text: 那个强盗拼命跑回头领身边，喘着气讲起自己遇到的可怕事情。
        - id: ch04-b05
          speaker: robber
          text: 哎呀，屋里坐着一个可怕的女巫！她朝我吐唾沫，还用长爪子抓我的脸。门边有个拿刀的汉子，往我腿上刺了一刀。院子里躺着一个黑怪物，抡起木棍狠狠打我。屋顶上还有一个法官，他大喊：“把这个恶棍给我带过来！”我好不容易才逃回来！
          emotion: fearful
    - id: ch05
      title: 乐手们的新家
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 从那以后，强盗们再也不敢踏进这所房子。四位不来梅的乐手却觉得这里舒服极了，再也不愿离开。最后一个讲完这个故事的人，嘴巴至今还是热的呢。
