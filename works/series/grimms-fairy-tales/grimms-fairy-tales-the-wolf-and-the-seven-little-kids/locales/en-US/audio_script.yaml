audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and steady folktale storytelling
        timbre: clear and gently resonant
        pace: measured
        pitch: medium
    mother_goat:
      display_name: Mother Goat
      tts:
        delivery: loving and watchful, with firm resolve when danger comes
        timbre: warm and mature
        pace: measured
        pitch: medium
    wolf:
      display_name: Wolf
      tts:
        delivery: cunning and forceful, shifting between false sweetness and rough menace
        timbre: deep and coarse
        pace: deliberate
        pitch: low
    miller:
      display_name: Miller
      tts:
        delivery: wary and reluctant
        timbre: sturdy and weathered
        pace: moderate
        pitch: medium-low
    kid_1:
      display_name: First Little Kid
      tts:
        delivery: alert and earnest
        timbre: young and clear
        pace: quick
        pitch: high
    kid_2:
      display_name: Second Little Kid
      tts:
        delivery: cautious and direct
        timbre: young and light
        pace: moderate
        pitch: high
    kid_3:
      display_name: Third Little Kid
      tts:
        delivery: lively and watchful
        timbre: youthful and bright
        pace: quick
        pitch: medium-high
    kid_4:
      display_name: Fourth Little Kid
      tts:
        delivery: serious and plainspoken
        timbre: young and steady
        pace: moderate
        pitch: medium-high
    kid_5:
      display_name: Fifth Little Kid
      tts:
        delivery: spirited and emphatic
        timbre: small and crisp
        pace: brisk
        pitch: high
    kid_6:
      display_name: Sixth Little Kid
      tts:
        delivery: gentle and attentive
        timbre: soft and youthful
        pace: moderate
        pitch: high
    kid_7:
      display_name: Youngest Little Kid
      tts:
        delivery: tender and brave, with simple childlike directness
        timbre: small and soft
