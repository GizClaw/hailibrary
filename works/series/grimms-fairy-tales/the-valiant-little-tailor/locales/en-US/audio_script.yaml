audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and steady folktale storytelling
        timbre: clear and gently resonant
        pace: measured
        pitch: medium
    tailor:
      display_name: Little Tailor
      tts:
        delivery: quick-witted and boldly self-assured
        timbre: light and bright
        pace: lively
        pitch: medium-high
    jam_seller:
      display_name: Jam Seller
      tts:
        delivery: practical and increasingly annoyed
        timbre: earthy and clear
        pace: measured
        pitch: medium
    mountain_giant:
      display_name: Mountain Giant
      tts:
        delivery: boastful and suspicious, with blunt force
        timbre: huge and rumbling
        pace: slow
        pitch: very low
    soldier_one:
      display_name: First Soldier
      tts:
        delivery: wary and troubled
        timbre: firm and weathered
        pace: measured
        pitch: medium-low
    soldier_two:
      display_name: Second Soldier
      tts:
        delivery: nervous but resolute
        timbre: crisp and sturdy
        pace: measured
        pitch: medium
    king:
      display_name: King
      tts:
        delivery: commanding and calculating, with guarded unease
        timbre: full and authoritative
        pace: measured
        pitch: low
    first_forest_giant:
      display_name: First Forest Giant
      tts:
        delivery: sleepy at first, then fiercely enraged
        timbre: rough and booming
        pace: slow
        pitch: very low
    second_forest_giant:
      display_name: Second Forest Giant
      tts:
        delivery: gruff and defensive, rising to fury
        timbre: deep and gravelly
        pace: slow
        pitch: very low
    horseman:
      display_name: Horseman
      tts:
        delivery: doubtful and cautious
        timbre: clear and sturdy
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: Seven at One Stroke
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: One summer morning, a little tailor sat sewing on his table beside the window. He felt cheerful, and his needle flew through the cloth. Then a peasant woman came along the street, calling out her wares.
        - id: ch01-b02
          speaker: jam_seller
          text: Good jam, cheap! Good jam, cheap!
        - id: ch01-b03
          speaker: narrator
          text: That sounded fine to the tailor. He poked his small head out the window.
        - id: ch01-b04
          speaker: tailor
          text: Come upstairs, my good woman. You can sell some of it here.
        - id: ch01-b05
          speaker: narrator
          text: The woman carried her heavy basket up the three steps. At the tailor's command, she unpacked every jar. He examined each one, lifted it, and sniffed it before making his choice.
        - id: ch01-b06
          speaker: tailor
          text: This jam seems good. Weigh out four ounces for me. And if it comes to a quarter pound, I won't mind.
        - id: ch01-b07
          speaker: narrator
          text: The woman had climbed all that way expecting a large sale. Instead, she had unpacked every jar for four ounces of jam. She weighed it out as he asked, then went away angry and grumbling.
        - id: ch01-b08
          speaker: tailor
          text: May God bless this jam and give me health and strength!
        - id: ch01-b09
          speaker: narrator
          text: He took bread from the cupboard, cut a slice across the loaf, and spread it with jam.
        - id: ch01-b10
          speaker: tailor
          text: That should taste sweet. But first I'll finish this jacket.
        - id: ch01-b11
          speaker: narrator
          text: He set the bread close beside him and went on sewing the jacket. The thought of his meal made him so happy that every stitch grew longer than the last. Meanwhile, the smell of sweet jam drifted up to the wall, where a great many flies were sitting. The scent drew them down in a crowd, and they covered the bread.
        - id: ch01-b12
          speaker: tailor
          text: Hey! Who invited you?
        - id: ch01-b13
          speaker: narrator
          text: He chased them off, but the flies understood no German. They returned in even greater numbers. At last the tailor lost his patience. He pulled a scrap of cloth from beneath his worktable.
        - id: ch01-b14
          speaker: tailor
          text: Just wait. I'll show you!
        - id: ch01-b15
          speaker: narrator
          text: He struck the flies without mercy. When he lifted the cloth and counted, seven lay dead before him, their legs stretched out.
        - id: ch01-b16
          speaker: tailor
          text: So that's the sort of fellow I am! The whole town must hear about this.
        - id: ch01-b17
          speaker: narrator
          text: "He could not help admiring his own bravery. He quickly cut out a belt, stitched it together, and embroidered it in large letters: Seven at one stroke."
        - id: ch01-b18
          speaker: tailor
          text: The town? No, the whole world will hear of it!
        - id: ch01-b19
          speaker: narrator
          text: His heart wagged with joy like a lamb's tail. He fastened on the belt and decided to seek his fortune in the wide world, for his little workshop seemed far too small for such courage. Before leaving, he searched every part of the house for something useful to carry. All he found was an old cheese, so he put it in his pocket. Just outside the door, he noticed a bird tangled in a thicket. He freed it, then tucked it into the pocket beside the cheese. With that, he took to the road boldly. He was so light and nimble that the journey did not tire him.
    - id: ch02
      title: The Giant's Tests
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The road climbed a mountain. At the very top sat a powerful giant, calmly looking over the country. The tailor walked straight up to him.
        - id: ch02-b02
          speaker: tailor
          text: Good day, friend! I see you're looking out across the wide world. That's where I'm headed to try my luck. Would you like to come along?
        - id: ch02-b03
          speaker: mountain_giant
          text: You miserable little ragamuffin!
          emotion: disgusted
        - id: ch02-b04
          speaker: narrator
          text: The giant looked down on him with contempt. The tailor unbuttoned his coat and showed him the belt.
        - id: ch02-b05
          speaker: tailor
          text: Oh, really? Read this, and you'll see what kind of man I am.
        - id: ch02-b06
          speaker: narrator
          text: The giant read, Seven at one stroke. He supposed the tailor had killed seven men, and began to respect the tiny fellow. Even so, he wanted to test him. He squeezed a stone in one hand until water dripped from it.
        - id: ch02-b07
          speaker: mountain_giant
          text: If you're strong, do that.
        - id: ch02-b08
          speaker: tailor
          text: Is that all? Where I come from, that's child's play.
        - id: ch02-b09
          speaker: narrator
          text: He reached into his pocket, took out the soft cheese, and squeezed until liquid ran from it.
        - id: ch02-b10
          speaker: tailor
          text: There. Mine was a little better, wasn't it?
        - id: ch02-b11
          speaker: narrator
          text: The giant had no answer. He could hardly believe that such a little man had done it. Still determined to test him, he picked up another stone and threw it so high that the eye could barely follow it.
        - id: ch02-b12
          speaker: mountain_giant
          text: Now you try, little mite.
        - id: ch02-b13
          speaker: tailor
          text: A good throw, but your stone fell back to earth. I'll throw one that never comes back.
        - id: ch02-b14
          speaker: narrator
          text: The tailor pulled the bird from his pocket and tossed it into the air. Glad to be free, it flew away and never returned.
        - id: ch02-b15
          speaker: tailor
          text: Well, friend? How did you like that throw?
        - id: ch02-b16
          speaker: mountain_giant
          text: You can throw, I'll grant you. Now let's see whether you can carry a proper load.
        - id: ch02-b17
          speaker: narrator
          text: He led the tailor to a great oak that had been cut down.
        - id: ch02-b18
          speaker: mountain_giant
          text: If you're strong enough, help me carry this tree out of the forest.
        - id: ch02-b19
          speaker: tailor
          text: Gladly. Put the trunk on your shoulder. I'll take the branches and twigs, since they're the heaviest part.
        - id: ch02-b20
          speaker: narrator
          text: The giant hoisted the trunk onto his shoulder. Instead of lifting the crown, the tailor climbed onto a branch behind him, where the giant could not turn to look. So the giant carried the trunk, every branch and twig, and the tailor too. The little man rode along, cheerful and comfortable, whistling the song, Three Tailors Rode Forth from the Gate. He acted as though carrying that enormous tree were child's play. After dragging the load partway through the forest, the giant could go no farther.
        - id: ch02-b21
          speaker: mountain_giant
          text: Listen! I have to drop the tree!
        - id: ch02-b22
          speaker: narrator
          text: The tailor sprang down and wrapped both arms around the tree as if he had been carrying it all along.
        - id: ch02-b23
          speaker: tailor
          text: You're such a huge fellow, yet you can't even carry one tree!
        - id: ch02-b24
          speaker: narrator
          text: They walked on. At a cherry tree, the giant bent down the top where the ripest fruit grew and placed it in the tailor's hand. But the tailor was too weak to hold it. The moment the giant let go, the tree snapped upright and flung the little man into the air. He came down unhurt.
        - id: ch02-b25
          speaker: mountain_giant
          text: What's this? Can't you hold one weak branch?
        - id: ch02-b26
          speaker: tailor
          text: Strength isn't the problem. Do you think that could trouble a man who struck down seven at one blow? I jumped over the tree because hunters are shooting in the thicket below. Try it yourself, if you can.
        - id: ch02-b27
          speaker: narrator
          text: The giant took up the challenge and tried to leap over the tree. He could not clear it. Instead, he landed among the branches and hung there helplessly. Once again, the tailor had the upper hand.
        - id: ch02-b28
          speaker: mountain_giant
          text: If you're truly so brave, come spend the night in our cave.
        - id: ch02-b29
          speaker: narrator
          text: The tailor willingly followed him. Inside the cave, other giants sat around a fire, and each held a whole roasted sheep in his hands as he ate. The tailor looked around. The place was certainly much roomier than his workshop. His giant showed him an enormous bed and told him to sleep there. But it was far too large for the little man. He left it empty and curled up in a corner instead. At midnight, the giant believed his guest was sound asleep in the bed. He rose, gripped a heavy iron bar, and brought it down with one terrible blow. The bed split apart, and the giant was sure he had finished off the little grasshopper. At first light, all the giants went into the forest. They had forgotten him completely. Then the tailor walked right up to them, cheerful and bold. The giants stared at the man they thought they had killed. Terror took hold of them. Afraid he would strike them all dead, they fled in a great hurry.
    - id: ch03
      title: A Warrior at the Palace
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "The little tailor kept going wherever his pointed nose led him. After a long walk, he reached the courtyard of a royal palace. Tired at last, he stretched out on the grass and fell asleep. People gathered around him and read the words on his belt: Seven at one stroke."
        - id: ch03-b02
          speakers: [soldier_one, soldier_two]
          ensemble: duo
          text: What is this great warrior doing here in a time of peace? He must be a mighty lord.
        - id: ch03-b03
          speaker: narrator
          text: They hurried to the King and reported what they had found. In their opinion, such a mighty warrior would be valuable if war ever came. A man like that must not be allowed to leave. The King liked their advice. He sent one of his courtiers to offer the stranger a place in the royal army as soon as he woke. The courtier stood beside the sleeper and waited. At last the tailor stretched his arms and legs, opened his eyes, and listened to the offer.
        - id: ch03-b04
          speaker: tailor
          text: That's exactly why I came. I'm ready to serve the King.
        - id: ch03-b05
          speaker: narrator
          text: The palace received him with honor, and a special home was set aside for him. The King's soldiers were far less pleased. They feared the words on his belt, and soon every one of them wished this dangerous newcomer a thousand miles away.
        - id: ch03-b06
          speaker: soldier_one
          text: What will become of us? If we quarrel with him, seven men will fall every time he strikes.
        - id: ch03-b07
          speaker: soldier_two
          text: None of us could stand against him.
        - id: ch03-b08
          speaker: narrator
          text: The soldiers made up their minds. They went together to the King and asked to leave his service.
        - id: ch03-b09
          speakers: [soldier_one, soldier_two]
          ensemble: duo
          text: We won't remain beside a man who kills seven at one stroke.
        - id: ch03-b10
          speaker: narrator
          text: The King was sorry that one newcomer might cost him all his faithful soldiers. He wished he had never laid eyes on the tailor. He would gladly have sent him away, yet he did not dare. The fellow might kill the King and all his people, then sit on the royal throne himself. The King thought for a long time before a plan came to him. He sent word that he had a request for so great a warrior. Two giants lived in one of his forests. They robbed and murdered, burned homes, and ruined the countryside. Anyone who approached them risked death. If the tailor conquered and killed them both, the King would give him his only daughter as a wife and half the kingdom as her dowry. A hundred horsemen would go along to help.
        - id: ch03-b11
          speaker: narrator
          text: The tailor was delighted by the offer. A beautiful princess and half a kingdom were not prizes a man was offered every day of his life.
        - id: ch03-b12
          speaker: tailor
          text: Yes, I'll soon deal with those giants. I don't need a hundred horsemen. A man who can strike down seven at once has nothing to fear from two.
    - id: ch04
      title: Two Giants in the Forest
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The tailor set out, with the hundred horsemen behind him. At the edge of the forest, he stopped them.
        - id: ch04-b02
          speaker: tailor
          text: Wait here. I'll finish the giants by myself.
        - id: ch04-b03
          speaker: narrator
          text: He bounded among the trees, searching on every side. Before long, he found both giants asleep beneath a tree. They snored so hard that the branches moved up and down. The tailor filled both pockets with stones and climbed into the tree. He edged along a branch until he sat directly above them, then dropped stone after stone onto the first giant's chest. At first the giant felt nothing. Finally he woke and shoved his companion.
        - id: ch04-b04
          speaker: first_forest_giant
          text: Why are you hitting me?
        - id: ch04-b05
          speaker: second_forest_giant
          text: I didn't hit you. You must have dreamed it.
        - id: ch04-b06
          speaker: narrator
          text: They settled down again. This time the tailor dropped a stone on the second giant.
        - id: ch04-b07
          speaker: second_forest_giant
          text: What's that for? Why are you throwing things at me?
          emotion: angry
        - id: ch04-b08
          speaker: first_forest_giant
          text: I'm not throwing anything at you.
        - id: ch04-b09
          speaker: narrator
          text: The two giants growled and argued over which one had struck the other. They went on accusing each other for a while. But both were weary, so in the end they let the matter rest. Their eyes closed once more. Up in the branches, the tailor chose the largest stone in his pocket and hurled it with all his strength onto the first giant's chest.
        - id: ch04-b10
          speaker: first_forest_giant
          text: That's enough!
          emotion: angry
        - id: ch04-b11
          speaker: narrator
          text: He leaped up like a madman and shoved his companion against the tree so hard that the trunk shook. The second giant paid him back with a blow of his own. Their rage rose higher and higher. They ripped trees from the ground and beat each other with the trunks. Neither would stop. At last, both giants crashed dead to the earth at the same moment. Only then did the tailor jump down from his branch.
        - id: ch04-b12
          speaker: tailor
          text: Lucky they didn't pull up my tree. I'd have had to leap to another like a squirrel. But we tailors are nimble.
        - id: ch04-b13
          speaker: narrator
          text: He drew his sword and stabbed each giant twice in the chest. Then he returned to the horsemen.
        - id: ch04-b14
          speaker: tailor
          text: It's done. I finished them both, though they fought hard. They tore up trees to defend themselves. But trees are no use against a man who kills seven at one stroke.
        - id: ch04-b15
          speaker: horseman
          text: But weren't you wounded?
        - id: ch04-b16
          speaker: tailor
          text: Don't worry about me. They didn't bend a single hair on my head.
        - id: ch04-b17
          speaker: narrator
          text: The horsemen could hardly believe his story. They rode into the forest to look for themselves. There they found both giants lying in their blood, with all the uprooted trees scattered around them.
    - id: ch05
      title: The Unicorn
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The tailor returned to the palace and demanded the reward the King had promised. But the King now regretted making that promise. Once again, he searched for some new danger that might rid him of this troublesome hero.
        - id: ch05-b02
          speaker: king
          text: Before you receive my daughter and half my kingdom, you must perform one more heroic deed. A unicorn is causing great harm in the forest. Catch it first.
        - id: ch05-b03
          speaker: tailor
          text: I fear one unicorn even less than two giants. Seven at one stroke, that's the kind of work for me.
        - id: ch05-b04
          speaker: narrator
          text: He took a rope and an ax into the forest, again leaving his companions outside. He searched for a long time. Then the unicorn charged straight at him, ready to run him through with its horn.
        - id: ch05-b05
          speaker: tailor
          text: Easy now. You can't do it quite that fast.
        - id: ch05-b06
          speaker: narrator
          text: He stood perfectly still and waited while the unicorn thundered closer. Only when the beast was almost upon him did he spring behind a tree. The unicorn could not turn aside. It smashed into the trunk with all its strength, driving its horn deep into the wood. No matter how it pulled, it did not have enough strength to wrench the horn free.
        - id: ch05-b07
          speaker: tailor
          text: Now I've caught my bird.
        - id: ch05-b08
          speaker: narrator
          text: He stepped from behind the tree, looped the rope around the unicorn's neck, and chopped its horn free with the ax. Then he led the captured beast to the King.
    - id: ch06
      title: The Wild Boar
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Even after seeing the captured unicorn, the King still refused to hand over the promised reward. He invented a third demand. Before any wedding could take place, the tailor must capture a wild boar that was causing terrible damage in the forest. The royal huntsmen, he said, would go along to help.
        - id: ch06-b02
          speaker: tailor
          text: Gladly. That's child's play!
        - id: ch06-b03
          speaker: narrator
          text: He would not take the huntsmen into the forest. That suited them very well. The wild boar had attacked them several times before, and they had no wish to lie in wait for it again. The moment the boar spotted the tailor, it rushed at him. Foam covered its mouth, and its sharpened tusks were ready to knock him down. The quick little hero darted into a chapel nearby. Without stopping, he sprang up to a window and leaped straight out again. The boar charged through the door after him. But the tailor raced around the outside and slammed the door shut behind the beast. The raging boar was far too heavy and clumsy to jump out through the window. It was caught. Then the tailor called the huntsmen over so they could see the prisoner with their own eyes.
        - id: ch06-b04
          speaker: narrator
          text: Then the hero returned to the King. There could be no more excuses. Like it or not, the King had to keep his promise at last. He gave the tailor his daughter as a wife and half the kingdom with her. Had he known that the supposed warrior before him was really only a little tailor, his grief would have been greater still. The wedding was held with great splendor and very little joy. And so a tailor was made into a king.
    - id: ch07
      title: The Tailor Keeps His Crown
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: Some time later, the young Queen heard her husband talking in his sleep.
        - id: ch07-b02
          speaker: tailor
          text: Boy, finish that jacket and patch those trousers, or I'll rap your ears with the yardstick!
        - id: ch07-b03
          speaker: narrator
          text: Now she knew what kind of life her husband had been born to. The next morning, she complained to her father and begged him to rid her of a husband who was nothing but a tailor. The King comforted her.
        - id: ch07-b04
          speaker: king
          text: Leave your bedroom door open tonight. My servants will wait outside. Once he is asleep, they'll enter, bind him, and put him on a ship bound for the wide world.
        - id: ch07-b05
          speaker: narrator
          text: The Queen was satisfied. But the King's armor-bearer had overheard everything. He was friendly with the young lord, so he warned him about the whole plot.
        - id: ch07-b06
          speaker: tailor
          text: I'll put a stop to that plan.
        - id: ch07-b07
          speaker: narrator
          text: That night, he went to bed beside his wife at the usual time. When she believed he had fallen asleep, she quietly got up and opened the bedroom door. Then she returned to bed. The tailor had only been pretending to sleep. He knew the King's men were waiting just outside. So he began to cry out in a clear, loud voice.
        - id: ch07-b08
          speaker: tailor
          text: Boy, finish that jacket and patch those trousers, or I'll rap your ears with the yardstick! I struck down seven at one blow. I killed two giants, captured a unicorn, and caught a wild boar. Why should I fear the men waiting outside my room?
        - id: ch07-b09
          speaker: narrator
          text: When the servants heard him, terror seized them.
        - id: ch07-b10
          speaker: narrator
          text: The servants heard him name every feat and then speak of the men outside his door. Great fear swept over them. They turned and fled as if the wild huntsman himself were chasing close behind. After that night, none of them ever dared attempt anything against him again.
        - id: ch07-b11
          speaker: narrator
          text: So the little tailor kept his crown. He remained a king, and no one challenged him again, for the rest of his life.
