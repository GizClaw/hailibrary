      display_name: 士兵甲
      tts: {delivery: 紧张而戒备, timbre: 低沉厚实, pace: 稍快, pitch: 低音}
    soldier_2:
      display_name: 士兵乙
      tts: {delivery: 忧虑而谨慎, timbre: 稳重清晰, pace: 中速, pitch: 中低音}
    soldier_3:
      display_name: 士兵丙
      tts: {delivery: 不安而坚决, timbre: 粗粝有力, pace: 稍缓, pitch: 中音}
    king:
      display_name: 国王
      tts: {delivery: 威严中藏着算计, timbre: 低沉端正, pace: 从容, pitch: 低音}
    first_forest_giant:
      display_name: 第一个森林巨人
      tts: {delivery: 暴躁粗声, timbre: 浑厚, pace: 偏快, pitch: 低音}
    second_forest_giant:
      display_name: 第二个森林巨人
      tts: {delivery: 粗野不耐烦, timbre: 沙哑厚重, pace: 中速, pitch: 低音}
    horseman_1:
      display_name: 骑兵甲
      tts: {delivery: 谨慎而惊疑, timbre: 清晰沉稳, pace: 中速, pitch: 中低音}
    horseman_2:
      display_name: 骑兵乙
      tts: {delivery: 关切而怀疑, timbre: 温厚有力, pace: 稍缓, pitch: 低音}
    horseman_3:
      display_name: 骑兵丙
      tts: {delivery: 诧异而警觉, timbre: 明亮结实, pace: 稍快, pitch: 中音}
    queen:
      display_name: 年轻的王后
      tts: {delivery: 骄矜而不安, timbre: 清亮, pace: 中速, pitch: 中高音}
  chapters:
    - id: ch01
      title: 一击打死七个
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 夏日清晨，小裁缝坐在窗边的工作台上，心情好极了，手里的针线也走得飞快。街上来了一个提着重篮子的农妇，一路叫卖。
        - id: ch01-b02
          speaker: jam_woman
          text: 好果酱，又好又便宜！好果酱，又好又便宜！
        - id: ch01-b03
          speaker: tailor
          text: 好大嫂，上楼来吧！你的果酱在我这里准能卖掉。
        - id: ch01-b04
          speaker: narrator
          text: 农妇爬上三级台阶，把每只罐子都摆出来。小裁缝看过一罐又一罐，拿起来掂，还凑近闻，最后只要了四盎司，说多到四分之一磅也无妨。农妇原盼着做成一笔大生意，只好气呼呼地给他称好，嘴里抱怨着走了。
            她那只沉甸甸的篮子，原本装着满满一篮生意。谁知小裁缝挑了半天，买下的果酱还不够痛快吃上几口。
        - id: ch01-b05
          speaker: tailor
          text: 愿上帝赐福这果酱，也赐给我健康和力气！
        - id: ch01-b06
          speaker: narrator
          text: 他切下一片面包，厚厚涂上果酱，决定缝完上衣再吃。甜香飘到墙边，引来大群苍蝇。小裁缝赶了又赶，苍蝇听不懂德语，回来得反而更多。
            他越缝越高兴，针脚也越跨越大。面包就放在手边，那股甜味一路飘上墙，原本停在那里的苍蝇成群飞下来，谁也不肯错过这顿好吃的。
        - id: ch01-b07
          speaker: tailor
          text: 谁请你们来的？都走开！还不走吗？等着，我这就让你们尝尝厉害！
        - id: ch01-b08
          speaker: narrator
          text: 他抓起一块布，狠狠拍下去。揭开一数，七只苍蝇直挺挺地躺在那里，细腿全都伸开了。小裁缝不由得佩服起自己。
            方才还赶也赶不走的不速之客，这一回全都没了动静。小裁缝望着自己的战果，越看越觉得这不是一件可以藏在铺子里的小事。
        - id: ch01-b09
          speaker: tailor
          text: 原来我是这样的好汉！这事不能只让全城知道，全世界都该听说！
        - id: ch01-b10
          speaker: narrator
          text: 他缝了一条腰带，在上面绣上大字：“我一击打死七个！”他的心快活得像小羊羔的尾巴一样直摇。这间小铺子再也装不下他的勇武了。临行前，他只找到一块陈奶酪，又在门外救下一只困在灌木里的鸟，把它们一同放进口袋，神气十足地上了路。
            他先说要让全城知道，转念一想，全城哪里够呢？于是，他真的把铺子抛在身后，打算走遍世界。他在屋里翻来找去，没有别的行李可带。小鸟便和那块奶酪挤在了同一个口袋里。
        - id: ch01-b11
          speaker: narrator
          text: 小裁缝身轻腿快，一直走到山顶。那里坐着一个强壮的巨人，正悠闲地眺望远方。
            山路并没有让他疲倦。他一口气来到最高处，眼前的世界全都铺展开来，巨人就舒舒服服地坐在那里。
        - id: ch01-b12
          speaker: tailor
          text: 你好，伙计！你在看这辽阔的世界吗？我正要去那里碰碰运气。要不要跟我一起走？
        - id: ch01-b13
          speaker: giant
          text: 就凭你这个小无赖？你这个可怜虫！
          emotion: disgusted
        - id: ch01-b14
          speaker: tailor
          text: 是吗？看看我的腰带，再说我是怎样的人吧！
        - id: ch01-b15
          speaker: narrator
          text: 巨人把“七个”当成了七个人，对小个子有了几分敬意，却还想试他的本领。他把石头攥得滴出水来，要小裁缝照做。
            腰带上可没有写明死的是苍蝇。巨人读完，先前的轻蔑少了些，可眼前这个人实在太小，他还不能就这样相信。
        - id: ch01-b16
          speaker: tailor
          text: 这也算本事？我们那儿的小孩子都会。瞧，我这一手是不是更强？
        - id: ch01-b17
          speaker: narrator
          text: 小裁缝悄悄捏的是软奶酪，汁水立刻流了出来。巨人看呆了，又把石头抛得高到几乎看不见。
            巨人哪里知道他手中根本不是石头，一时竟找不出话来。可巨人不肯服输，又想出一个比试的办法。
        - id: ch01-b18
          speaker: giant
          text: 小不点儿，现在换你扔一个。
        - id: ch01-b19
          speaker: tailor
          text: 扔得不错，可它还是落回来了。我扔出去的这个，可永远不会回来。
        - id: ch01-b20
          speaker: narrator
          text: 他放出口袋里的鸟。小鸟欢喜地飞走，再也没有回来。巨人承认他会扔东西，又要试试他会不会扛重物，便领他来到一棵倒下的大橡树旁。
            在巨人眼里，那只越飞越远的小鸟当然就是永不落地的投掷物。他虽服了这一手，却还觉得扛东西才见真力气。
        - id: ch01-b21
          speaker: giant
          text: 你要真有力气，就帮我把这棵树抬出林子。
        - id: ch01-b22
          speaker: tailor
          text: 没问题。你扛树干，我来托住最重的枝杈。
        - id: ch01-b23
          speaker: narrator
          text: 巨人扛起树干，小裁缝却坐上树枝。巨人看不见身后，只好连树带人一起扛，还听见小裁缝快活地吹着《三个裁缝骑马出城门》。走了一段，巨人累得再也撑不住。
            巨人只顾在前面吃力迈步，完全不知道身后多了一份重量。小裁缝坐得舒舒服服，吹曲子的样子，就像扛这棵大树真是小孩子玩耍一样。
        - id: ch01-b24
          speaker: giant
          text: 听着，我非把树放下来不可了！
        - id: ch01-b25
          speaker: narrator
          text: 小裁缝马上跳下去，抱住树，装得像一路都在抬。
        - id: ch01-b26
          speaker: tailor
          text: 你这么大个子，怎么连一棵树都扛不动？
    - id: ch02
      title: 巨人的考验
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 两人继续赶路。巨人把结满熟樱桃的树梢压下来交给小裁缝。小裁缝压不住，树梢猛地弹起，把他带到半空，又把他安然抛回地上。
        - id: ch02-b02
          speaker: giant
          text: 怎么回事？连这么细的树枝，你也按不住？
        - id: ch02-b03
          speaker: tailor
          text: 我的力气可不小。一击打死七个的人，会怕一根树枝吗？我看见树丛那边有猎人开枪，才从树顶跳过去。你也跳一个试试！
        - id: ch02-b04
          speaker: narrator
          text: 巨人一跳，却挂在了枝杈间，小裁缝又赢了。巨人只好请他到山洞过夜。洞里还有几个巨人，围着火堆，每人抓着一只烤羊大吃。小裁缝觉得，这里比自己的铺子宽敞得多。
            方才明明是树把小裁缝弹了出去，他却说成自己有意纵身一跃。巨人照做时，不但没能飞过树顶，还让枝条牢牢挂住了。
        - id: ch02-b05
          speaker: giant
          text: 那张床给你，今晚就睡在那里。
        - id: ch02-b06
          speaker: narrator
          text: 床对小裁缝太大，他便躲进角落。半夜，巨人以为他睡熟了，拿铁棍一击劈断大床，还当自己已经结果了那只小蚱蜢。天刚亮，巨人们进了森林，早忘了他。小裁缝忽然快活又大胆地走来，吓得他们怕被一击全杀死，转身就逃。
            小裁缝从一开始就没有躺到那张大床上。巨人那一棍落下时，他安安稳稳地待在角落。清早再见到这个本该被砸死的小人儿，巨人们只当他的本领深不可测。
        - id: ch02-b07
          speaker: narrator
          text: 小裁缝顺着鼻尖所指的方向走了很久，来到王宫庭院。他累得倒在草地上睡着了。人们围过来，看见腰带上的字，都把他当成了大战士。
            大家从四面看了又看，越看那行字，越觉得睡在眼前的一定是位威名赫赫的大人物。
        - id: ch02-b08
          speakers: [onlooker_1, onlooker_2, onlooker_3]
          ensemble: chorus
          text: 太平无事的时候，这位大英雄来做什么？他一定是个了不起的大人物！若有战争，他会很有用，千万不能让他走。
          emotion: surprised
        - id: ch02-b09
          speaker: narrator
          text: 国王听了，派侍臣守在旁边。等小裁缝伸伸四肢、睁开眼，侍臣便请他为国王效力。
            人们告诉国王，这样厉害的人若遇上战争，一定能派上大用场。国王很赞同，侍臣便一直站在睡着的小裁缝身旁，等他自然醒来。
        - id: ch02-b10
          speaker: tailor
          text: 我正是为这件事来的。我愿意为国王效力。
        - id: ch02-b11
          speaker: narrator
          text: 他受到隆重接待，还有了自己的宅院。士兵们却害怕得很，恨不得他远在千里之外。
        - id: ch02-b12
          speakers: [soldier_1, soldier_2, soldier_3]
          ensemble: chorus
          text: 这可怎么办？要是和他争起来，他每一击都会打倒我们七个人，谁也拦不住他。我们不愿跟这样的人待在一起，请让我们退役吧！
          emotion: fearful
        - id: ch02-b13
          speaker: narrator
          text: 国王舍不得失去所有忠心的士兵，也后悔见过小裁缝。可他又怕赶走这个人，会害得自己和臣民全被杀死，连王位也被夺走。国王想了很久，终于想出一条计策。
            为了一个新来的人丢掉所有旧部，国王自然不肯。可要他当面辞退这位“一击打死七个”的勇士，他又没有这个胆量。
        - id: ch02-b14
          speaker: king
          text: 森林里住着两个巨人，抢劫、杀人、破坏、纵火，谁靠近都有丧命的危险。你若杀了他们，我就把唯一的女儿嫁给你，再用半个王国作嫁妆，还派一百名骑兵助你。
        - id: ch02-b15
          speaker: narrator
          text: 小裁缝心想，漂亮的公主和半个王国可不是天天有人送来。这件事正适合他。
            国王说那两个巨人四处作恶，无人能够近身。小裁缝听见的，却是世上少有的一份好奖赏。
        - id: ch02-b16
          speaker: tailor
          text: 我很快就能制服他们，也用不着一百名骑兵。一击能打死七个的人，哪会怕两个巨人？
    - id: ch03
      title: 两个巨人与独角兽
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 小裁缝带着一百名骑兵出发。到了林边，他叫众人留下，自己蹦跳着进去。两个巨人正在树下熟睡，鼾声震得树枝一起一伏。他装满两口袋石子，爬到他们头顶，接连把石子丢到第一个巨人的胸口。那巨人挨了许久才醒。
            小裁缝先在林中左右张望，找准两个巨人睡觉的地方，才悄悄动手。他顺着树枝挪到正上方，一颗又一颗地往下扔。头几颗石子落下，第一个巨人睡得太沉，竟毫无知觉。
        - id: ch03-b02
          speaker: first_forest_giant
          text: 你为什么打我？
        - id: ch03-b03
          speaker: second_forest_giant
          text: 我根本没打你。你是在做梦吧。
        - id: ch03-b04
          speaker: narrator
          text: 两人又睡了。小裁缝改砸第二个巨人。
        - id: ch03-b05
          speaker: second_forest_giant
          text: 你拿东西砸我干什么？
        - id: ch03-b06
          speaker: first_forest_giant
          text: 我没砸你！
        - id: ch03-b07
          speaker: narrator
          text: 他们争了一会儿，困得睁不开眼，又把事情放下。小裁缝挑出最大的石头，用尽力气砸向第一个巨人。
            两个巨人谁也不肯认账，可睡意最终压过了怒气。他们闭上眼睛以后，小裁缝的游戏还没有结束。
        - id: ch03-b08
          speaker: first_forest_giant
          text: 这也太过分了！
          emotion: angry
        - id: ch03-b09
          speaker: narrator
          text: 他发疯般跳起，把同伴推得撞上大树。另一个立刻还手。两个巨人越打越怒，连树都拔起来互相抽打，最后同时倒地死了。小裁缝跳下树，庆幸他们没拔掉自己坐的那棵，不然他就得像松鼠一样跳到别处。裁缝的身手毕竟灵巧。他拔剑在每个巨人胸前刺了两下，才去见骑兵。
            那棵被撞的树摇个不停。两个巨人都认定是对方故意动手，谁也不再听解释。他们用连根拔起的大树打了很久，直到两边一起没了气息。
        - id: ch03-b10
          speaker: tailor
          text: 已经办完了，我给了他们最后一击！这一仗可不轻松。他们走投无路，拔起树来抵抗。可碰见我这样一击能杀七个的人，再挣扎也没用。
        - id: ch03-b11
          speakers: [horseman_1, horseman_2, horseman_3]
          ensemble: chorus
          text: 你真的一点伤也没受吗？
        - id: ch03-b12
          speaker: tailor
          text: 不用担心，他们连我的一根头发也没碰弯。
        - id: ch03-b13
          speaker: narrator
          text: 骑兵不信，进林一看，两个巨人果然倒在血泊里，周围满是拔起的树。小裁缝回去索要奖赏，国王却反悔了，又想出一项危险的差事。
            骑兵们沿着小裁缝出来的路骑进去，所见的一切都像是一场可怕大战留下的痕迹。
            眼前的景象正好替小裁缝证明了那场“恶战”。可他完成了国王交代的事，国王还是舍不得公主和半个王国。
        - id: ch03-b14
          speaker: king
          text: 想娶我的女儿、拿到半个王国，你还得做一件英雄才能做到的事。森林里有头独角兽四处为祸，你先去捉住它。
        - id: ch03-b15
          speaker: tailor
          text: 两个巨人都不怕，我还会怕一头独角兽？一下打死七个，才是我的本事。
        - id: ch03-b16
          speaker: narrator
          text: 他带着绳子和斧头进了森林，让随从等在外面。找了许久，独角兽迎面冲来，要用角把他刺穿。小裁缝站着不动，等它逼近才闪到树后。
            独角兽来得又快又猛，根本不给人商量的工夫。小裁缝却没有提前逃跑，因为他早已看准了身旁那棵树。
        - id: ch03-b17
          speaker: tailor
          text: 慢一点，慢一点，哪能这么着急！
        - id: ch03-b18
          speaker: narrator
          text: 独角兽全力撞上树，长角扎进树干，再也拔不出来。
        - id: ch03-b19
          speaker: tailor
          text: 好了，这只鸟儿终于落在我手里了。
        - id: ch03-b20
          speaker: narrator
          text: 他用绳子套住独角兽的颈项，再拿斧头把长角从树里劈出，牵着它去见国王。
            直到绳套牢牢收紧，树干也被劈开，他才把这个无法脱身的俘虏领出森林。
    - id: ch04
      title: 最后一项差事
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 国王仍不肯兑现诺言。婚礼以前，小裁缝还得捉住一头糟蹋森林的野猪，猎人可以帮忙。
        - id: ch04-b02
          speaker: tailor
          text: 乐意得很，这不过是小孩子的游戏！
        - id: ch04-b03
          speaker: narrator
          text: 小裁缝没带猎人。他们反倒松了口气，因为那头野猪好几次把他们赶得狼狈不堪，谁也不想再去埋伏。野猪看见小裁缝，口吐白沫，亮着锋利的獠牙直冲过来。小裁缝钻进附近的小礼拜堂，窜上窗台，一跃跳到外面。野猪追进堂里，他便绕回门边，把门关紧。野猪又重又笨，跳不出窗口，就这样成了俘虏。
            它原本就要把小裁缝掀翻在地，没料到对手会从窗口逃走。它只顾追进门内，再想转身已经迟了。
        - id: ch04-b04
          speaker: narrator
          text: 小裁缝叫猎人亲眼来看，自己去找国王。这回国王无论是否情愿，都得把女儿和半个王国交给他。若早知道眼前不是战场上的英雄，只是个裁缝，国王会更加难受。婚礼办得无比盛大，却没多少喜气，小裁缝就此成了国王。
            猎人们亲眼看见野猪关在礼拜堂里，国王再也找不到推脱的理由。婚礼的排场越大，国王心里的欢喜却越少。
        - id: ch04-b05
          speaker: narrator
          text: 过了一段日子，年轻的王后听见丈夫夜里说梦话。
        - id: ch04-b06
          speaker: tailor
          text: 小伙计，把紧身上衣做好，再把裤子补好！不然我就拿尺子敲你的耳朵！
        - id: ch04-b07
          speaker: narrator
          text: 王后这才知道丈夫原来是个裁缝。第二天一早，她向父亲诉苦，请他帮自己摆脱这个丈夫。
            梦话里的紧身上衣、裤子和尺子，泄露了年轻君主从前的行当。王后觉得自己受了欺骗，便把这当成一桩委屈。
        - id: ch04-b08
          speaker: queen
          text: 他根本不是什么英雄，不过是个裁缝。父王，请您帮我把他赶走吧。
        - id: ch04-b09
          speaker: king
          text: 今晚把卧房门开着。我的仆人会守在外面，等他睡熟就进去捆住他，再抬上船，让船把他送到辽阔的世界去。
        - id: ch04-b10
          speaker: narrator
          text: 王后满意了。可国王的掌甲侍从听见了全盘计划。他与年轻的君主交好，便悄悄前去报信。
            国王要仆人趁小裁缝熟睡时进房，把他捆好送上船。那艘船会把他带到辽阔的世界里，再也回不到王宫。
        - id: ch04-b11
          speaker: tailor
          text: 我会让他们的算盘打不成。
        - id: ch04-b12
          speaker: narrator
          text: 当晚，小裁缝照常与妻子上床。王后以为他睡着了，起身开门，又躺回去。小裁缝只是在装睡。他忽然用清楚响亮的声音喊起来。
            门外的人已经守在那里，只等动手。他知道他们全都能听见，便把白天想好的话当作梦话说给他们听。
        - id: ch04-b13
          speaker: tailor
          text: 小伙计，把紧身上衣做好，把裤子补好，不然我就用尺子敲你的耳朵！我一击打死七个，杀了两个巨人，牵走一头独角兽，还捉住一头野猪，难道会害怕站在门外的那些人吗？
        - id: ch04-b14
          speaker: narrator
          text: 门外的人听见这些话，吓得魂不附体，仿佛狂猎人正在身后追赶。他们飞也似的逃走，再没有人敢对小裁缝下手。
            那些人本来准备冲进房间捆人，如今谁也不敢再碰这位杀过巨人、捉过独角兽和野猪的国王。
        - id: ch04-b15
          speaker: narrator
          text: 就这样，小裁缝一直做着国王，直到生命的尽头。
