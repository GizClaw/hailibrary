    onlooker_2:
      display_name: 围观者乙
      tts: {delivery: 好奇而郑重, timbre: 温和厚实, pace: 中速, pitch: 中音}
    onlooker_3:
      display_name: 围观者丙
      tts: {delivery: 热切而笃定, timbre: 明朗有力, pace: 稍缓, pitch: 中低音}
