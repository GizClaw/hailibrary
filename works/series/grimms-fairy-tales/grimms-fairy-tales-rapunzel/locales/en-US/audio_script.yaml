  chapters:
    - id: ch01
      title: The Enchantress's Garden
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: There once lived a man and a woman who had wished for a child for many years. At last, the woman began to hope that God would grant their wish. Behind their house was a little window. Through it, they could see a splendid garden filled with beautiful flowers and herbs. A high wall surrounded the garden, and no one dared enter. It belonged to a powerful enchantress whom everyone feared.
        - id: ch01-b02
          speaker: narrator
          text: One day, the woman stood at the window and looked down. She saw a bed of beautiful rampion, also called rapunzel. It looked so fresh and green that she longed to taste it. Her desire grew stronger each day. She knew she could never get any, and soon she grew pale and miserable. Her husband became alarmed.
        - id: ch01-b03
          speaker: man
          text: Dear wife, what's wrong?
        - id: ch01-b04
          speaker: wife
          text: If I can't eat some of the rampion in the garden behind our house, I shall die.
          emotion: sad
        - id: ch01-b05
          speaker: narrator
          text: Her husband loved her. He decided that he would bring her some rampion himself, whatever it might cost him. At twilight, he climbed over the wall into the enchantress's garden. He quickly gathered a handful and carried it home. His wife made a salad and ate it with great pleasure.
        - id: ch01-b06
          speaker: narrator
          text: But she liked it so much that the next day she wanted it three times as badly. If her husband was ever to have any peace, he would have to go back. That evening, in the gathering dark, he lowered himself into the garden again. The moment he reached the ground, he was terrified. The enchantress stood before him.
        - id: ch01-b07
          speaker: enchantress
          text: How dare you climb into my garden and steal my rampion like a thief! You will pay for this!
          emotion: angry
        - id: ch01-b08
          speaker: man
          text: Please, have mercy on me. I only did it because I had no other choice. My wife saw your rampion from our window. She wanted it so desperately that she would have died without some to eat.
          emotion: fearful
        - id: ch01-b09
          speaker: narrator
          text: The enchantress's anger softened.
        - id: ch01-b10
          speaker: enchantress
          text: If what you say is true, you may take as much rampion as you want. But I have one condition. You must give me the child your wife is going to have. The child will be treated well, and I will care for her like a mother.
        - id: ch01-b11
          speaker: narrator
          text: The man was so frightened that he agreed to everything. When his wife gave birth, the enchantress appeared at once. She named the child Rapunzel and carried her away.
    - id: ch02
      title: The Tower in the Forest
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Rapunzel grew into the most beautiful child under the sun. When she was twelve, the enchantress locked her in a tower deep in a forest. The tower had no stairs and no door. There was only one little window, high at the very top.
        - id: ch02-b02
          speaker: narrator
          text: Whenever the enchantress wanted to enter, she stood beneath the window and called up.
        - id: ch02-b03
          speaker: enchantress
          text: |-
            Rapunzel, Rapunzel,
            let down your hair to me.
        - id: ch02-b04
          speaker: narrator
          text: Rapunzel's magnificent hair was long and fine, like spun gold. When she heard the enchantress's voice, she unfastened her braided hair and wound it around a hook above the window. The shining length dropped twenty ells to the ground. Then the enchantress took hold and climbed all the way up to Rapunzel.
        - id: ch02-b05
          speaker: narrator
          text: A year or two later, the King's son rode through the forest and passed the tower. He heard someone singing. The song was so lovely that he stopped to listen. It was Rapunzel. Alone in the tower, she passed her time by letting her sweet voice ring out.
        - id: ch02-b06
          speaker: narrator
          text: The Prince wanted to climb up and find the singer. He searched all around the tower, but there was no door anywhere. At last, he had to ride home. Still, the song had touched his heart so deeply that he could not forget it. Every day, he rode back into the forest and stood listening beneath the tower.
        - id: ch02-b07
          speaker: narrator
          text: One day, while he stood behind a tree, he saw the enchantress approach the tower and heard her call.
        - id: ch02-b08
          speaker: enchantress
          text: |-
            Rapunzel, Rapunzel,
            let down your hair to me.
        - id: ch02-b09
          speaker: narrator
          text: Rapunzel lowered her braids, and the enchantress climbed up.
        - id: ch02-b10
          speaker: prince
          text: So that's the ladder to the tower. I'll try my luck with it myself.
        - id: ch02-b11
          speaker: narrator
          text: The next evening, as darkness began to fall, the Prince went to the tower and called.
        - id: ch02-b12
          speaker: prince
          text: |-
            Rapunzel, Rapunzel,
            let down your hair to me.
        - id: ch02-b13
          speaker: narrator
          text: At once, the long hair fell from the window, and the Prince climbed up.
    - id: ch03
      title: A Promise and a Plan
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Rapunzel was terribly frightened when the Prince came through her window. Never before had she seen a man. But he began to speak to her gently, just as a friend would. He told her that her singing had touched his heart so deeply that he had found no rest. He simply had to see her for himself. As he talked, Rapunzel's fear faded.
        - id: ch03-b02
          speaker: narrator
          text: The Prince asked Rapunzel to marry him. She saw that he was young and handsome, and she thought he would love her more than old Dame Gothel did. Rapunzel said yes and placed her hand in his.
        - id: ch03-b03
          speaker: rapunzel
          text: I will gladly leave with you, but I don't know how to get down. Bring me a skein of silk each time you come. I'll weave the silk into a ladder. When it's finished, I'll climb down, and you can take me away on your horse.
        - id: ch03-b04
          speaker: narrator
          text: They agreed that the Prince would visit every evening, since the old woman came during the day. For a while, the enchantress noticed nothing. Then one day, Rapunzel spoke without thinking.
        - id: ch03-b05
          speaker: rapunzel
          text: Dame Gothel, why are you so much heavier to pull up than the young Prince? He reaches me in a moment.
        - id: ch03-b06
          speaker: enchantress
          text: You wicked child! What did I just hear? I thought I had shut you away from everyone in the world, but you have deceived me!
          emotion: angry
        - id: ch03-b07
          speaker: narrator
          text: In her fury, the enchantress seized Rapunzel's beautiful hair. She wrapped it twice around her left hand and took a pair of scissors in her right. Snip, snap! She cut it off, and the lovely braids fell to the floor.
        - id: ch03-b08
          speaker: narrator
          text: The enchantress had no pity. She took poor Rapunzel into a desert and left her there to live in grief and misery.
    - id: ch04
      title: The Fall from the Tower
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: That same day, after casting Rapunzel out, the enchantress returned to the tower. She tied the severed braids to the hook above the window. That evening, the Prince came and called as usual.
        - id: ch04-b02
          speaker: prince
          text: |-
            Rapunzel, Rapunzel,
            let down your hair to me.
        - id: ch04-b03
          speaker: narrator
          text: The enchantress lowered the hair, and the Prince climbed up. But his beloved Rapunzel was not waiting for him. Instead, he found the enchantress staring at him with a wicked, venomous look.
        - id: ch04-b04
          speaker: enchantress
          text: Aha! You came for your beloved, but the beautiful bird is no longer singing in her nest. The cat has caught her, and it will scratch out your eyes, too. Rapunzel is lost to you. You will never see her again!
        - id: ch04-b05
          speaker: narrator
          text: The Prince was beside himself with pain. In despair, he leaped from the tower. The fall did not kill him, but he landed among thorns, and they pierced his eyes.
        - id: ch04-b06
          speaker: narrator
          text: Blind and alone, he wandered through the forest. He had no food except the roots and berries he found along the way. Day after day, he mourned and wept for his beloved wife. For several years, he roamed through the world in misery.
    - id: ch05
      title: Rapunzel's Tears
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: At last, the Prince reached the desert where Rapunzel lived in wretchedness with the twins she had borne, a boy and a girl. He heard a voice that seemed deeply familiar. He moved toward the sound.
        - id: ch05-b02
          speaker: narrator
          text: When he came near, Rapunzel recognized him. She threw her arms around his neck and wept. Two of her tears fell into his eyes. At once, his eyes grew clear, and he could see as well as before.
        - id: ch05-b03
          speaker: narrator
          text: The Prince led Rapunzel and the children back to his kingdom, where he was welcomed with great joy.
        - id: ch05-b04
          speaker: narrator
          text: And Rapunzel and the Prince lived for many years in happiness and contentment.
