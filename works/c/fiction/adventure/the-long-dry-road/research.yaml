schema_version: 1
required: true
scope: Wet walking-surface risk and the choice to use a dry route while carrying a breakable jar.
sources:
  - id: cdc-young-worker-slips
    title: Young Worker Slips, Trips, and Falls
    publisher: CDC National Institute for Occupational Safety and Health
    url: https://www.cdc.gov/niosh/young-workers/slips-trips-falls/index.html
    accessed: 2026-08-28
    supports:
      - Rain and slippery surfaces are common causes of slips and falls.
      - Stable, flat, non-slippery footing reduces slip risk.
  - id: osha-walking-surfaces
    title: General Requirements — Walking-Working Surfaces
    publisher: Occupational Safety and Health Administration
    url: https://www.osha.gov/laws-regs/regulations/standardnumber/1910/1910.22
    accessed: 2026-08-28
    supports:
      - Walking surfaces should be maintained dry where feasible and kept free of hazards such as spills.
claims:
  - claim: The rain-soaked muddy shortcut can be slippery, so choosing the dry route reduces the story's immediate slip-and-drop risk while Badger carries a glass jar.
    source_ids: [cdc-young-worker-slips, osha-walking-surfaces]
    pages: [p02, p03, p04]
limits:
  - The story says the jar might break after a slip; it does not claim that every wet path causes a fall or that every dry path is risk-free.
