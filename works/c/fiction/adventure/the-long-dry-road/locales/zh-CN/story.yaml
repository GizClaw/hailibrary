      tts:
        delivery: 务实稳重
        timbre: 清楚的年轻声音
        pace: 中速
        pitch: 中低音
    tortoise:
      display_name: 乌龟
      tts:
        delivery: 耐心细致
        timbre: 柔和的年轻声音
        pace: 慢速
        pitch: 中音
