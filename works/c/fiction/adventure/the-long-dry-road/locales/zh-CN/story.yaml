schema_version: 1
language: zh-CN
writer: 松果先生
title: 绕远的路
summary: 獾为了稳稳地把果汁送到山脚，绕开泥泞的近路，途中还帮乌龟扶正了小车。
cast:
  narrator: {display_name: 旁白, tts: {delivery: 沉稳清楚, timbre: 清晰的成年声音, pace: 中慢速, pitch: 中音}}
  badger: {display_name: 獾, tts: {delivery: 务实坚定, timbre: 厚实的成年声音, pace: 中速, pitch: 中低音}}
  tortoise: {display_name: 乌龟, tts: {delivery: 耐心真诚, timbre: 柔和的成年声音, pace: 慢速, pitch: 低音}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, text: 獾要把果汁送到山脚。}]}
  - {id: p02, illustration: p02, lines: [{speaker: narrator, text: 雨水把近路泡得又湿又滑。}]}
  - {id: p03, illustration: p03, lines: [{speaker: badger, text: 走这条路，果汁准会洒出来。}]}
  - {id: p04, illustration: p04, lines: [{speaker: narrator, content: [{text: 獾决定}, {vocabulary: {id: detour, text: 绕路}}, {text: ，走那条远些却干燥的路。}]}]}
  - {id: p05, illustration: p05, lines: [{speaker: narrator, text: 远路虽然长，脚下却很稳。}]}
  - {id: p06, illustration: p06, lines: [{speaker: narrator, text: 走到半路，一辆小车翻在路边。}]}
  - {id: p07, illustration: p07, lines: [{speaker: tortoise, text: 车轮卡住了，怎么也抬不起来。}]}
  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: 獾放稳果汁，和乌龟一起抬起小车。}]}
  - {id: p09, illustration: p09, lines: [{speaker: narrator, text: 小车扶正了，它们一同往山脚走。}]}
  - {id: p10, illustration: p10, lines: [{speaker: badger, text: 到了山脚，果汁没洒，小车也扶起来了。}]}
chapters:
  - {id: ch01, title: 选择干路, page_refs: [p01, p02, p03, p04, p05]}
  - {id: ch02, title: 路上的小车, page_refs: [p06, p07, p08, p09, p10]}
questions:
  - {id: q01, type: explicit-choice, speaker: narrator, prompt: 獾为什么不走近路？, choices: [近路湿滑，果汁容易洒, 近路没有花, 它忘了方向], answer: 近路湿滑，果汁容易洒。, page_refs: [p02, p03]}
  - {id: q02, type: sequence, speaker: narrator, prompt: 獾帮助乌龟以前，先做了什么？, answer: 把果汁放稳。, page_refs: [p08]}
  - {id: q03, type: cause-effect, speaker: narrator, prompt: 选择干路带来了什么结果？, answer: 果汁送到了山脚，獾也帮助了乌龟。, page_refs: [p04, p08, p09, p10]}
