schema_version: 2
language: zh-CN
writer: 栗叶灯
title: 长长的干路
summary: 獾为了护好果汁罐，没有走泥泞的近路。走上干路后，他遇到翻车的乌龟，便放下罐子一起帮忙。
chapters:
  - id: ch01
    title: 绕开泥路
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
  - id: ch02
    title: 扶起小车
    page_refs:
      - p06
      - p07
      - p08
      - p09
      - p10
questions:
  - id: q01
    type: picture
    speaker: narrator
    prompt: 近路上有什么？
    answer: 泥。
    page_refs:
      - p02
  - id: q02
    type: sequence
    speaker: narrator
    prompt: 扶小车前，獾先做什么？
    answer: 放下果汁罐。
    page_refs:
      - p08
  - id: q03
    type: cause-effect
    speaker: narrator
    prompt: 獾为什么走干路？
    answer: 泥泞的近路看着很滑。
    page_refs:
      - p02
      - p03
      - p04
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 獾把果汁罐绑在篮子里。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 近路满是泥，干路从旁边绕过去。
    - id: p03
      illustration: p03
      paragraphs:
        - text: 獾扶着罐子说：“这片泥地太滑了。”
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: 獾决定
            - vocabulary:
                id: detour
                text: 绕路
            - text: 走干路。
    - id: p05
      illustration: p05
      paragraphs:
        - text: 走在长路上，罐子一直很稳。
    - id: p06
      illustration: p06
      paragraphs:
        - text: 獾看见乌龟守着翻倒的小车。
    - id: p07
      illustration: p07
      paragraphs:
        - text: 乌龟说：“一个车轮卡在石缝里。”
    - id: p08
      illustration: p08
      paragraphs:
        - text: 獾放下罐子。他和乌龟扶起小车。
    - id: p09
      illustration: p09
      paragraphs:
        - text: 两个朋友沿着干路往前走。
    - id: p10
      illustration: p10
      paragraphs:
        - text: 果汁和小车都平安到了小屋。
audio_script:
