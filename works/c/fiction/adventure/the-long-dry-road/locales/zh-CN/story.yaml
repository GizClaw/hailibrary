schema_version: 1
language: zh-CN
writer: 栗叶灯
title: 长长的干路
summary: 獾为了护好果汁罐，没有走泥泞的近路。走上干路后，他遇到翻车的乌龟，便放下罐子一起帮忙。
cast:
  narrator: {display_name: 旁白, tts: {delivery: 平静清楚, timbre: 温暖的成年声音, pace: 中慢速, pitch: 中音}}
  badger: {display_name: 獾, tts: {delivery: 务实稳重, timbre: 清楚的年轻声音, pace: 中速, pitch: 中低音}}
  tortoise: {display_name: 乌龟, tts: {delivery: 耐心细致, timbre: 柔和的年轻声音, pace: 慢速, pitch: 中音}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, text: 獾把果汁罐放稳。}]}
  - {id: p02, illustration: p02, lines: [{speaker: narrator, text: 近路满是泥。}, {speaker: narrator, text: 旁边有条干路。}]}
  - {id: p03, illustration: p03, lines: [{speaker: narrator, text: 泥地看着很滑。}, {speaker: narrator, text: 獾扶稳罐子。}]}
  - id: p04
    illustration: p04
    lines:
      - speaker: narrator
        content: [{text: 獾}, {vocabulary: {id: detour, text: 绕路}}, {text: 走上干路。}]
  - {id: p05, illustration: p05, lines: [{speaker: narrator, text: 果汁罐一路没有歪。}]}
  - {id: p06, illustration: p06, lines: [{speaker: narrator, text: 乌龟的小车翻了。}]}
  - {id: p07, illustration: p07, lines: [{speaker: tortoise, text: 一个车轮卡在石缝里。}]}
  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: 獾先放下罐子。}, {speaker: narrator, text: 他们一起扶起小车。}]}
  - {id: p09, illustration: p09, lines: [{speaker: narrator, text: 朋友们沿着干路前进。}]}
  - {id: p10, illustration: p10, lines: [{speaker: narrator, text: 果汁和小车安全到家。}]}
chapters:
  - {id: ch01, title: 绕开泥路, page_refs: [p01, p02, p03, p04, p05]}
  - {id: ch02, title: 扶起小车, page_refs: [p06, p07, p08, p09, p10]}
questions:
  - {id: q01, type: picture, speaker: narrator, prompt: 近路上有什么？, answer: 泥。, page_refs: [p02]}
  - {id: q02, type: sequence, speaker: narrator, prompt: 扶小车前，獾先做什么？, answer: 放下果汁罐。, page_refs: [p08]}
  - {id: q03, type: cause-effect, speaker: narrator, prompt: 獾为什么走干路？, answer: 泥泞的近路看着很滑。, page_refs: [p02, p03, p04]}
