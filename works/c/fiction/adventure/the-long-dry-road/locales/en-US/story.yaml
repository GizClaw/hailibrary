questions:
  - id: q01
    type: picture
    speaker: narrator
    prompt: What covers the short path?
    answer: Mud.
    page_refs:
      - p02
  - id: q02
    type: sequence
    speaker: narrator
    prompt: What does Badger do before lifting the cart?
    answer: Badger sets down the jar.
    page_refs:
      - p08
  - id: q03
    type: cause-effect
    speaker: narrator
    prompt: Why does Badger take the dry road?
    answer: The short path looks slippery.
    page_refs:
      - p02
      - p03
      - p04
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: Badger straps a juice jar into its basket.
    - id: p02
      illustration: p02
      paragraphs:
        - text: Mud covers the shortcut. A dry road curves around.
    - id: p03
      illustration: p03
      paragraphs:
        - text: Badger holds the jar. He says, “That mud is slick.”
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: "Badger takes the dry "
            - vocabulary:
                id: detour
                text: detour
            - text: .
    - id: p05
      illustration: p05
      paragraphs:
