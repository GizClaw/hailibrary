    - id: p06
      illustration: p06
      paragraphs:
        - text: Badger finds Tortoise beside a tipped cart.
    - id: p07
      illustration: p07
      paragraphs:
        - text: Tortoise says, “One wheel is stuck between stones.”
    - id: p08
      illustration: p08
      paragraphs:
        - text: Badger sets the jar down. Together they lift the cart.
    - id: p09
      illustration: p09
      paragraphs:
        - text: The friends follow the long dry road.
    - id: p10
      illustration: p10
      paragraphs:
        - text: The juice and cart reach the cottage safely.
