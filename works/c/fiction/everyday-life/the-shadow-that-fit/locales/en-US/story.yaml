schema_version: 1
language: en-US
writer: sage-paw
title: The Shadow That Fit
summary: Nia and Bo make a bird shadow for their stage. They move the lamp back to make the shadow fit, then lift the bird to make it rise.
cast:
  narrator: {display_name: Narrator, tts: {delivery: warm and curious, timbre: friendly adult voice, pace: medium, pitch: medium}}
  nia: {display_name: Nia, tts: {delivery: inventive and expressive, timbre: bright child voice, pace: medium, pitch: medium-high}}
  bo: {display_name: Bo, tts: {delivery: thoughtful and steady, timbre: gentle child voice, pace: slow-medium, pitch: medium}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, text: "Nia cuts out a paper bird."}, {speaker: narrator, text: "Bo watches."}]}
  - {id: p02, illustration: p02, lines: [{speaker: narrator, text: "Nia holds it by the screen."}, {speaker: nia, text: "Our bird can fly!"}]}
  - id: p03
    illustration: p03
    lines:
      - {speaker: narrator, text: "Bo puts the lamp close."}
      - speaker: narrator
        content: [{text: "A huge "}, {vocabulary: {id: shadow, text: shadow}}, {text: " spills off the screen."}]
  - {id: p04, illustration: p04, lines: [{speaker: nia, text: "Only one wing fits!"}]}
  - {id: p05, illustration: p05, lines: [{speaker: bo, text: "The lamp is too close."}]}
  - {id: p06, illustration: p06, lines: [{speaker: narrator, text: "They move the lamp back."}]}
  - id: p07
    illustration: p07
    lines:
      - speaker: narrator
        content: [{text: "The smaller "}, {vocabulary: {id: shadow, text: shadow}}, {text: " fits the screen."}]
  - {id: p08, illustration: p08, lines: [{speaker: nia, text: "Now the bird is too low."}]}
  - {id: p09, illustration: p09, lines: [{speaker: narrator, text: "Bo lifts the paper bird."}]}
  - id: p10
    illustration: p10
    lines:
      - speaker: narrator
        content: [{text: "The "}, {vocabulary: {id: shadow, text: shadow}}, {text: " rises across the stage."}]
      - {speaker: nia, text: "The show is ready!"}
chapters:
  - {id: ch01, title: Too Big, page_refs: [p01, p02, p03, p04, p05]}
  - {id: ch02, title: Just Right, page_refs: [p06, p07, p08, p09, p10]}
questions:
  - {id: q01, type: picture, speaker: narrator, prompt: "What does Nia make?", answer: "A paper bird.", page_refs: [p01]}
  - {id: q02, type: sequence, speaker: narrator, prompt: "What do they move first?", answer: "They move the lamp back.", page_refs: [p05, p06]}
  - {id: q03, type: cause-effect, speaker: narrator, prompt: "Why do they move the lamp?", answer: "The huge shadow does not fit.", page_refs: [p03, p04, p05, p06, p07]}
