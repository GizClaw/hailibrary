      paragraphs:
        - text: Nia cuts out a paper bird. Bo watches.
    - id: p02
      illustration: p02
      paragraphs:
        - text: Nia holds up the bird. She says, “It will fly here.”
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: "Bo puts the lamp close. A huge "
            - vocabulary:
                id: shadow
                text: shadow
            - text: " spills off the screen."
    - id: p04
      illustration: p04
      paragraphs:
        - text: “Only one wing fits!” Nia says.
    - id: p05
      illustration: p05
      paragraphs:
        - text: Bo points at the lamp. He says, “It is too close.”
    - id: p06
      illustration: p06
      paragraphs:
        - text: They move the lamp back.
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: "Now the smaller "
            - vocabulary:
                id: shadow
                text: shadow
            - text: " fits the screen."
    - id: p08
      illustration: p08
      paragraphs:
        - text: Nia says, “The bird is too low.”
    - id: p09
      illustration: p09
      paragraphs:
        - text: Bo lifts the paper bird.
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: "The "
            - vocabulary:
                id: shadow
                text: shadow
            - text: " rises. Nia says, “The show is ready!”"
