schema_version: 1
language: zh-CN
writer: 栗叶灯
title: 正好放下的影子
summary: 妮娅和波波想演一场小鸟影子戏。他们把灯移远，让影子完整地落在幕布上，再举高小鸟让它飞起来。
cast:
  narrator: {display_name: 旁白, tts: {delivery: 温暖好奇, timbre: 亲切的成年声音, pace: 中速, pitch: 中音}}
  nia: {display_name: 妮娅, tts: {delivery: 灵巧活泼, timbre: 明亮的童声, pace: 中速, pitch: 中高音}}
  bo: {display_name: 波波, tts: {delivery: 细心稳当, timbre: 柔和的童声, pace: 中慢速, pitch: 中音}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, text: 妮娅剪出一只纸鸟。}, {speaker: narrator, text: 波波在旁边看。}]}
  - {id: p02, illustration: p02, lines: [{speaker: narrator, text: 妮娅把纸鸟放在幕布前。}, {speaker: nia, text: 小鸟要飞啦！}]}
  - id: p03
    illustration: p03
    lines:
      - {speaker: narrator, text: 波波把灯放得很近。}
      - speaker: narrator
        content: [{text: 大}, {vocabulary: {id: shadow, text: 影子}}, {text: 跑出了幕布。}]
  - {id: p04, illustration: p04, lines: [{speaker: nia, text: 只看得到一只翅膀！}]}
  - {id: p05, illustration: p05, lines: [{speaker: bo, text: 灯离纸鸟太近了。}]}
  - {id: p06, illustration: p06, lines: [{speaker: narrator, text: 他们把灯往后移。}]}
  - id: p07
    illustration: p07
    lines:
      - speaker: narrator
        content: [{text: 小}, {vocabulary: {id: shadow, text: 影子}}, {text: 完整地落在幕布上。}]
  - {id: p08, illustration: p08, lines: [{speaker: nia, text: 可是小鸟飞得太低。}]}
  - {id: p09, illustration: p09, lines: [{speaker: narrator, text: 波波举高纸鸟。}]}
  - id: p10
    illustration: p10
    lines:
      - speaker: narrator
        content: [{vocabulary: {id: shadow, text: 影子}}, {text: 飞到幕布中间。}]
      - {speaker: nia, text: 可以开演啦！}
chapters:
  - {id: ch01, title: 影子太大, page_refs: [p01, p02, p03, p04, p05]}
  - {id: ch02, title: 小鸟飞起来, page_refs: [p06, p07, p08, p09, p10]}
questions:
  - {id: q01, type: picture, speaker: narrator, prompt: 妮娅剪了什么？, answer: 一只纸鸟。, page_refs: [p01]}
  - {id: q02, type: sequence, speaker: narrator, prompt: 他们先移动什么？, answer: 把灯往后移。, page_refs: [p05, p06]}
  - {id: q03, type: cause-effect, speaker: narrator, prompt: 为什么要把灯移远？, answer: 大影子放不进幕布。, page_refs: [p03, p04, p05, p06, p07]}
