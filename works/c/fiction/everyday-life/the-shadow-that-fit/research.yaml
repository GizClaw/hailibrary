schema_version: 1
required: true
sources:
  - url: https://hirshhorn.si.edu/explore/mini-art-lesson-illumination-station/
    title: Illumination Station
    publisher: Smithsonian Institution, Hirshhorn Museum and Sculpture Garden
    supports: A shadow is the dark area created when an object blocks light, and learners can change a shadow's size by changing the setup.
  - url: https://www.exploratorium.edu/sites/default/files/pdfs/ifi/Subtle_Shifts.pdf
    title: Measuring Shadows Activity
    publisher: Exploratorium Institute for Inquiry
    supports: Moving a light or object while keeping other parts of a setup controlled allows learners to observe patterns in shadow size.
notes: The story reports the result of one controlled tabletop setup in which the bird and screen stay fixed while the lamp moves. It does not claim that moving any lamp farther away always produces an identical change under every geometry or light source. Children should use scissors and a warm, stable lamp with adult supervision.
