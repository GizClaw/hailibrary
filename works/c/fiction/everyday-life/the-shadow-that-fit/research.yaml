    publisher: Exploratorium Institute for Inquiry
    supports: Moving a light or object while keeping other parts of a setup controlled allows learners to observe patterns in shadow size.
notes: The story reports the result of one controlled tabletop setup. It does not claim that moving any lamp farther away always produces an identical change under every geometry or light source.
