schema_version: 3
language: zh-CN
writer: 栗叶灯
title: 铁盒响了
summary: 林澄找到外婆的旧纽扣盒，并决定不借用自己不记得的故事。
chapters:
  - id: ch01
    title: 开始
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
  - id: ch02
    title: 转变
    page_refs:
      - p06
      - p07
      - p08
      - p09
      - p10
      - p11
questions:
  - id: q01
    type: sequence
    prompt: 外婆打开盒子后，林澄看见了什么？
    answer: 里面有很多旧纽扣。
    page_refs:
      - p04
      - p05
  - id: q02
    type: cause-effect
    prompt: 林澄为什么愿意再等一颗纽扣？
    answer: 林澄摇头：“我不记得。”
    page_refs:
      - p09
      - p10
      - p11
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 林澄在床下找线。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 她拉出一个旧铁盒。
    - id: p03
      illustration: p03
      paragraphs:
        - text: 盒子哗啦响。
    - id: p04
      illustration: p04
      paragraphs:
        - text: 外婆打开盒子。
    - id: p05
      illustration: p05
      paragraphs:
        - text: 里面有很多旧纽扣。
    - id: p06
      illustration: p06
      paragraphs:
        - text: 红扣子来自旧雨衣。
    - id: p07
      illustration: p07
      paragraphs:
        - text: 蓝扣子来自旧毛衣。
    - id: p08
      illustration: p08
      paragraphs:
        - text: 林澄问：“有我的吗？”
    - id: p09
      illustration: p09
      paragraphs:
        - text: 外婆找到小熊扣。
    - id: p10
      illustration: p10
      paragraphs:
        - text: 林澄摇头：“我不记得。”
    - id: p11
      illustration: p11
      paragraphs:
        - text: 外婆收回小熊扣。林澄愿意等一个自己记得的。
