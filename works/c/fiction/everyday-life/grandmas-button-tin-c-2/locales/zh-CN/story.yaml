schema_version: 3
language: zh-CN
writer: 栗叶灯
title: 柔软的粘扣带
summary: 林澄和外婆用柔软的粘扣带做好小外套，把旧绿扣子留在铁盒里。
chapters:
  - id: ch01
    title: 开始
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
  - id: ch02
    title: 转变
    page_refs:
      - p06
      - p07
      - p08
      - p09
      - p10
      - p11
questions:
  - id: q01
    type: sequence
    prompt: 林澄剪好布片后，外婆做了什么？
    answer: 外婆缝好小外套。
    page_refs:
      - p05
      - p06
  - id: q02
    type: cause-effect
    prompt: 最后，什么使外套做好了？
    answer: 她们把软粘扣带缝平。
    page_refs:
      - p07
      - p10
      - p11
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 小表妹要回家了。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 林澄想送她外套。
    - id: p03
      illustration: p03
      paragraphs:
        - text: 外婆拿出奶油色的布。
    - id: p04
      illustration: p04
      paragraphs:
        - text: 林澄按住纸样。
    - id: p05
      illustration: p05
      paragraphs:
        - text: 她小心剪下布片。
    - id: p06
      illustration: p06
      paragraphs:
        - text: 外婆缝好小外套。
    - id: p07
      illustration: p07
      paragraphs:
        - text: 外套还少软粘扣带。
    - id: p08
      illustration: p08
      paragraphs:
        - text: 外婆拿出两片宽软粘扣带。
    - id: p09
      illustration: p09
      paragraphs:
        - text: 宝宝回家，抓住她的小指。
    - id: p10
      illustration: p10
      paragraphs:
        - text: 林澄说：“用软的。”
    - id: p11
      illustration: p11
      paragraphs:
        - text: 她们把软粘扣带缝平。林澄把绿扣子留在铁盒里。
