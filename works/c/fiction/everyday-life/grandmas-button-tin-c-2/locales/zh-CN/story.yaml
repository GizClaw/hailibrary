article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 小表妹要回家了。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 林澄想送她外套。
    - id: p03
      illustration: p03
      paragraphs:
        - text: 外婆拿出奶油色的布。
    - id: p04
      illustration: p04
      paragraphs:
        - text: 林澄按住纸样。
    - id: p05
      illustration: p05
      paragraphs:
        - text: 她小心剪下布片。
    - id: p06
      illustration: p06
      paragraphs:
        - text: 外婆缝好小外套。
    - id: p07
      illustration: p07
      paragraphs:
        - text: 外套还少一颗纽扣。
    - id: p08
      illustration: p08
      paragraphs:
        - text: 林澄拿起旧绿扣子。
    - id: p09
      illustration: p09
      paragraphs:
        - text: 宝宝回家，抓住她的手。
    - id: p10
      illustration: p10
      paragraphs:
        - text: 林澄说：“用绿的。”
    - id: p11
      illustration: p11
      paragraphs:
        - text: 她把绿扣子缝好了。
