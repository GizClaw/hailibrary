sources:
  - url: https://www.hse.gov.uk/asthma/bakers.htm
    title: Baker
    publisher: UK Health and Safety Executive
    supports: Bakers should work carefully and avoid raising clouds of flour dust because flour dust can cause occupational asthma.
  - url: https://www.hse.gov.uk/food/industries/low-flour-dust.htm
    title: Flour dust and risks to bakers
    publisher: UK Health and Safety Executive
    supports: Careful handling and controls should prevent flour from becoming airborne and reduce inhalation exposure.
  - url: https://www.osha.gov/combustible-dust
    title: Combustible Dust — Overview
    publisher: U.S. Occupational Safety and Health Administration
    supports: Flour is among food materials that can become explosible as suspended dust under the necessary concentration and conditions.
notes: The story therefore keeps flour covered in a closed jar and lets the remaining breeze turn a paper pinwheel beside cooling bread instead of lifting flour. The captured east wind and cloud ferry are clearly declared fantasy devices; the story makes no factual claim that wind can be stored in a pocket or that boats can travel on clouds.
