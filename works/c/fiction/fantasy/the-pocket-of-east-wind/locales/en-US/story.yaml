  narrator: {display_name: Narrator, tts: {delivery: tender and attentive, timbre: soft adult voice, pace: medium-slow, pitch: medium}}
  lin: {display_name: Lin, tts: {delivery: thoughtful and brave, timbre: clear young voice, pace: medium, pitch: medium-high}}
