  - {id: p02, illustration: p02, lines: [{speaker: narrator, text: "A small east wind slept inside."}]}
  - {id: p03, illustration: p03, lines: [{speaker: lin, text: "I will carry you safely."}]}
  - {id: p04, illustration: p04, lines: [{speaker: narrator, text: "A cloud ferry waited with an empty sail."}]}
  - {id: p05, illustration: p05, lines: [{speaker: lin, text: "I can finish my errand."}, {speaker: lin, text: "Or I can free the wind and help them."}]}
  - {id: p06, illustration: p06, lines: [{speaker: narrator, text: "Lin opened the pocket. The wind raced out."}]}
  - {id: p07, illustration: p07, lines: [{speaker: lin, text: "Go. A road should be shared."}]}
  - {id: p08, illustration: p08, lines: [{speaker: narrator, content: [{text: "One tiny "}, {vocabulary: {id: breeze, text: breeze}}, {text: " remained in a corner."}]}]}
  - {id: p09, illustration: p09, lines: [{speaker: mei, text: "Even a little breeze can wake a quiet room."}]}
  - {id: p10, illustration: p10, lines: [{speaker: narrator, text: "Travelers returned with stories. Warm bread waited."}]}
