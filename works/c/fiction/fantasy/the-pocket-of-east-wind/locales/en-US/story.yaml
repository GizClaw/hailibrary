    type: sequence
    speaker: narrator
    prompt: What does Lin do before opening the pocket?
    answer: Lin walks to the waiting ferry.
    page_refs:
      - p03
      - p04
      - p05
      - p06
  - id: q02
    type: cause-effect
    speaker: narrator
    prompt: Why does the ferry begin to move?
    answer: The wind fills its sail.
    page_refs:
      - p06
      - p07
  - id: q03
    type: picture
    speaker: narrator
    prompt: What remains in the pocket?
    answer: One tiny breeze.
    page_refs:
