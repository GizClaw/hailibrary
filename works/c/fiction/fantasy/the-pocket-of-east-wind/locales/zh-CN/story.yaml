schema_version: 1
language: zh-CN
writer: 栗叶灯
title: 口袋里的东风
summary: 林把一口袋东风送到停住的云船。东风吹满船帆，让云船重新出发。还有一缕微风跟着林回了家。
cast:
  narrator: {display_name: 旁白, tts: {delivery: 柔和专注, timbre: 温暖的成年声音, pace: 中慢速, pitch: 中音}}
  lin: {display_name: 林, tts: {delivery: 认真勇敢, timbre: 清楚的童声, pace: 中速, pitch: 中高音}}
  mei: {display_name: 梅婆婆, tts: {delivery: 平静温暖, timbre: 温厚的年长声音, pace: 慢速, pitch: 中低音}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, text: 梅婆婆送给林一个绿布袋。}]}
  - {id: p02, illustration: p02, lines: [{speaker: narrator, text: 东风缩在前口袋里。}, {speaker: mei, text: 先别打开它。}]}
  - {id: p03, illustration: p03, lines: [{speaker: narrator, text: 林向山上的云船走去。}]}
  - {id: p04, illustration: p04, lines: [{speaker: narrator, text: 云船停着，船帆软软的。}]}
  - {id: p05, illustration: p05, lines: [{speaker: narrator, text: 林看见等候的客人。}, {speaker: lin, text: 他们需要东风。}]}
  - {id: p06, illustration: p06, lines: [{speaker: narrator, text: 林打开口袋。}, {speaker: narrator, text: 东风吹满船帆。}]}
  - {id: p07, illustration: p07, lines: [{speaker: narrator, text: 云船从白云上滑过。}]}
  - id: p08
    illustration: p08
    lines:
      - speaker: narrator
        content: [{text: 里面还留着一缕}, {vocabulary: {id: breeze, text: 微风}}, {text: 。}]
  - id: p09
    illustration: p09
    lines:
      - speaker: narrator
        content: [{vocabulary: {id: breeze, text: 微风}}, {text: 在面包房里扬起面粉。}]
  - {id: p10, illustration: p10, lines: [{speaker: narrator, text: 客人们回来了。}, {speaker: narrator, text: 大家一起吃面包。}]}
chapters:
  - {id: ch01, title: 一口袋东风, page_refs: [p01, p02, p03]}
  - {id: ch02, title: 等候的云船, page_refs: [p04, p05, p06, p07]}
  - {id: ch03, title: 留下的微风, page_refs: [p08, p09, p10]}
questions:
  - {id: q01, type: sequence, speaker: narrator, prompt: 打开口袋前，林先去了哪里？, answer: 停住的云船旁。, page_refs: [p03, p04, p05, p06]}
  - {id: q02, type: cause-effect, speaker: narrator, prompt: 云船为什么动起来？, answer: 东风吹满了船帆。, page_refs: [p06, p07]}
  - {id: q03, type: picture, speaker: narrator, prompt: 口袋里还留下什么？, answer: 一缕微风。, page_refs: [p08]}
