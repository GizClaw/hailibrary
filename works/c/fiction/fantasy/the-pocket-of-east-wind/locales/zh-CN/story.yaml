schema_version: 2
language: zh-CN
writer: 栗叶灯
title: 口袋里的东风
summary: 林把一口袋东风送到停住的云船。东风吹满船帆，让云船重新出发。还有一缕微风跟着林回了家。
chapters:
  - id: ch01
    title: 一口袋东风
    page_refs:
      - p01
      - p02
      - p03
  - id: ch02
    title: 等候的云船
    page_refs:
      - p04
      - p05
      - p06
      - p07
  - id: ch03
    title: 留下的微风
    page_refs:
      - p08
      - p09
      - p10
questions:
  - id: q01
    type: sequence
    speaker: narrator
    prompt: 打开口袋前，林先去了哪里？
    answer: 停住的云船旁。
    page_refs:
      - p03
      - p04
      - p05
      - p06
  - id: q02
    type: cause-effect
    speaker: narrator
    prompt: 云船为什么动起来？
    answer: 东风吹满了船帆。
    page_refs:
      - p06
      - p07
  - id: q03
    type: picture
    speaker: narrator
    prompt: 口袋里还留下什么？
    answer: 一缕微风。
    page_refs:
      - p08
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 梅婆婆送给林一个绿布袋。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 东风缩在口袋里。梅婆婆说：“先别打开。”
    - id: p03
      illustration: p03
      paragraphs:
        - text: 林向山上的云船走去。
    - id: p04
      illustration: p04
      paragraphs:
        - text: 云船停着，软软的船帆垂了下来。
    - id: p05
      illustration: p05
      paragraphs:
        - text: 林看见等候的客人。他说：“他们需要东风。”
    - id: p06
      illustration: p06
      paragraphs:
        - text: 林打开口袋，东风吹满船帆。
    - id: p07
      illustration: p07
      paragraphs:
        - text: 云船从白云上滑过去。
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: 口袋里还留着一缕
            - vocabulary:
                id: breeze
                text: 微风
            - text: 。
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: 回到家，
            - vocabulary:
                id: breeze
                text: 微风
            - text: 绕着面团打转。
    - id: p10
      illustration: p10
      paragraphs:
        - text: 客人们回来了。大家一起吃热面包。
