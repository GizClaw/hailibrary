"questions":
  - "id": "q01"
    "type": "sequence"
    "prompt": "吊桥挡路后，玛拉先去哪里？"
    "answer": "运河边的小巷。"
    "page_refs":
      - "p02"
      - "p03"
  - "id": "q02"
    "type": "cause-effect"
    "prompt": "玛拉为什么沿亮石头走？"
    "answer": "风卷起纸叶，遮住了小路。"
    "page_refs":
      - "p04"
      - "p05"
      - "p06"
      - "p07"
