schema_version: 2
language: zh-CN
writer: 栗叶灯
title: 月光包裹
summary: 吊桥升起，挡住了玛拉送货的路。月蛾借着水里的月光找到踏脚石，带玛拉把包裹安全送到观星台。
chapters:
  - id: ch01
    title: 路被挡住
    page_refs:
      - p01
      - p02
      - p03
      - p04
  - id: ch02
    title: 月光照路
    page_refs:
      - p05
      - p06
      - p07
  - id: ch03
    title: 送到了
    page_refs:
      - p08
      - p09
      - p10
questions:
  - id: q01
    type: sequence
    speaker: narrator
    prompt: 吊桥挡路后，玛拉先去哪里？
    answer: 运河边的小巷。
    page_refs:
      - p02
      - p03
  - id: q02
    type: cause-effect
    speaker: narrator
    prompt: 玛拉为什么沿亮石头走？
    answer: 风卷起纸叶，遮住了小路。
    page_refs:
      - p04
      - p05
      - p06
      - p07
  - id: q03
    type: picture
    speaker: narrator
    prompt: 谁收到了包裹？
    answer: 观星台的老人。
    page_refs:
      - p09
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: 玛拉接过银色
            - vocabulary:
                id: parcel
                text: 包裹
            - text: 。她要送去观星台。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 吊桥升起来，挡住了过河的路。
    - id: p03
      illustration: p03
      paragraphs:
        - text: 玛拉走进运河边的小巷。
    - id: p04
      illustration: p04
      paragraphs:
        - text: 风卷起纸叶，遮住了小路。
    - id: p05
      illustration: p05
      paragraphs:
        - text: 月蛾落在袋子上，说：“看看水面。”
    - id: p06
      illustration: p06
      paragraphs:
        - text: 月光照亮了运河边的干石路。
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: 玛拉沿着石路走，
            - vocabulary:
                id: parcel
                text: 包裹
            - text: 一直很稳。
    - id: p08
      illustration: p08
      paragraphs:
        - text: 玛拉和月蛾到了观星台。
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: 玛拉把
            - vocabulary:
                id: parcel
                text: 包裹
            - text: 交给天文学家。
    - id: p10
      illustration: p10
      paragraphs:
        - text: 一团暖光从里面亮起。大家都笑了。
