"article":
  "pages":
    - "id": "p01"
      "illustration": "p01"
      "paragraphs":
        - "content":
            - "text": "玛拉接过银色"
            - "vocabulary":
                "id": "parcel"
                "text": "包裹"
            - "text": "。她要送去观星台。"
    - "id": "p02"
      "illustration": "p02"
      "paragraphs":
        - "text": "吊桥升起来，挡住了过河的路。"
    - "id": "p03"
      "illustration": "p03"
      "paragraphs":
        - "text": "玛拉走进运河边的小巷。"
    - "id": "p04"
      "illustration": "p04"
      "paragraphs":
        - "text": "风卷起纸叶，遮住了小路。"
    - "id": "p05"
      "illustration": "p05"
      "paragraphs":
        - "text": "月蛾落在袋子上，说：“看看水面。”"
    - "id": "p06"
      "illustration": "p06"
      "paragraphs":
        - "text": "月光照亮了运河边的干石路。"
    - "id": "p07"
      "illustration": "p07"
      "paragraphs":
        - "content":
            - "text": "玛拉沿着石路走，"
            - "vocabulary":
                "id": "parcel"
                "text": "包裹"
            - "text": "一直很稳。"
    - "id": "p08"
      "illustration": "p08"
      "paragraphs":
        - "text": "玛拉和月蛾到了观星台。"
    - "id": "p09"
      "illustration": "p09"
      "paragraphs":
        - "content":
            - "text": "玛拉把"
            - "vocabulary":
                "id": "parcel"
                "text": "包裹"
            - "text": "交给天文学家。"
    - "id": "p10"
      "illustration": "p10"
      "paragraphs":
        - "text": "一团暖光从里面亮起。大家都笑了。"
