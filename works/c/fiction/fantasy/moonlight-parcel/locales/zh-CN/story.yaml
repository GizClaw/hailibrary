schema_version: 1
language: zh-CN
writer: 银月
title: 月夜送包裹
summary: 吊桥升起，夜路又被风遮住。玛拉借着水上的月光，按时送到了包裹。
cast:
  narrator: {display_name: 旁白, tts: {delivery: 温和准确, timbre: 清晰的成年声音, pace: 中慢速, pitch: 中音}}
  mara: {display_name: 玛拉, tts: {delivery: 沉着坚定, timbre: 温暖的青年声音, pace: 中速, pitch: 中音}}
  moth: {display_name: 月蛾, tts: {delivery: 轻盈愉快, timbre: 轻柔带气声, pace: 中速, pitch: 高音}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, content: [{text: 夜深了，玛拉抱着银色的}, {vocabulary: {id: parcel, text: 包裹}}, {text: 赶路。}]}]}
  - {id: p02, illustration: p02, lines: [{speaker: narrator, text: 吊桥升在半空，过不去了。}]}
  - {id: p03, illustration: p03, lines: [{speaker: mara, text: 绕运河边的小路吧。}]}
  - {id: p04, illustration: p04, lines: [{speaker: narrator, text: 风卷起落叶，遮住了小路。}, {speaker: mara, text: 这下往哪儿走？}]}
  - {id: p05, illustration: p05, lines: [{speaker: moth, text: 别急，低头看看。}]}
  - {id: p06, illustration: p06, lines: [{speaker: narrator, text: 月光落在水上，亮出一条银路。}]}
  - {id: p07, illustration: p07, lines: [{speaker: mara, text: 原来石墩在这儿！}]}
  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: 她踩着石墩，到了圆顶观星屋。}]}
  - {id: p09, illustration: p09, lines: [{speaker: mara, text: 还没到午夜，您的包裹送来啦。}]}
  - {id: p10, illustration: p10, lines: [{speaker: narrator, text: 盒盖一开，暖光溢满了屋子。月蛾绕着光飞舞。}]}
chapters:
  - {id: ch01, title: 此路不通, page_refs: [p01, p02, p03, p04]}
  - {id: ch02, title: 水上的月光, page_refs: [p05, p06, p07]}
  - {id: ch03, title: 送达, page_refs: [p08, p09, p10]}
questions:
  - {id: q01, type: sequence, speaker: narrator, prompt: 最先是什么挡住了玛拉？, answer: 升起的桥挡住了她。, page_refs: [p02]}
  - {id: q02, type: cause-effect, speaker: narrator, prompt: 玛拉为什么会低头看水？, answer: 月蛾提醒她低头看看。, page_refs: [p05, p06]}
  - {id: q03, type: short-answer, speaker: narrator, prompt: 月光帮她找到了什么？, answer: 月光照出了水面上的石墩。, page_refs: [p06, p07]}
