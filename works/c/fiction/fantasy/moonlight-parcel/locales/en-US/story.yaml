    type: sequence
    speaker: narrator
    prompt: What does Mara do after the bridge stops her?
    answer: She takes the canal lane.
    page_refs:
      - p02
      - p03
  - id: q02
    type: cause-effect
    speaker: narrator
    prompt: Why does Mara follow the bright stones?
    answer: The wind hides the lane.
