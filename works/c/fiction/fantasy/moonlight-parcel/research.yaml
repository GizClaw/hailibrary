schema_version: 1
required: true
sources:
  - url: https://psl.noaa.gov/outreach/education/science/glitter/
    title: Glittering Light on Water
    publisher: NOAA Physical Sciences Laboratory
    supports: Light from the moon can reflect from many moving points on rippled water and appear as a glittering path whose shape depends on surface roughness and viewing geometry.
  - url: https://science.nasa.gov/moon/moon-phases/
    title: Moon Phases
    publisher: NASA Science
    supports: Moonlight is reflected sunlight, and one short delivery must retain the same visible lunar phase.
  - url: https://www.nps.gov/articles/river-and-stream-safety.htm
    title: River and Stream Safety
    publisher: U.S. National Park Service
    supports: A route near water should avoid uncertain in-water footing and use a dry, established path rather than improvised stepping stones.
notes: The water glitter is a real reflection phenomenon, but the story does not claim that it reliably points toward a destination. Mara uses the visible reflection only as a clue to notice an established dry walkway with a stone railing. The warm globe inside the parcel and the speaking moon moth are declared fantasy elements. The full Moon remains unchanged throughout the single-night trip.
