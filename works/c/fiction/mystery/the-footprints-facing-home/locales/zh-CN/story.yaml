schema_version: 2
language: zh-CN
writer: 栗叶灯
title: 朝着家的脚印
summary: 门廊上的湿脚印都朝着小乔家的门。小乔和小山对过鞋底才发现，小乔拉小车倒着走时留下了这些脚印。
chapters:
  - id: ch01
    title: 奇怪的脚印
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
  - id: ch02
    title: 倒着走
    page_refs:
      - p06
      - p07
      - p08
      - p09
      - p10
questions:
  - id: q01
    type: picture
    speaker: narrator
    prompt: 每个脚印里有什么形状？
    answer: 一颗小星星。
    page_refs:
      - p05
  - id: q02
    type: sequence
    speaker: narrator
    prompt: 小乔想起来以前，小山先做了什么？
    answer: 对过鞋底，还说明人能倒着走。
    page_refs:
      - p04
      - p05
      - p06
      - p07
  - id: q03
    type: cause-effect
    speaker: narrator
    prompt: 脚印为什么朝着家门？
    answer: 小乔面朝家门，倒着拉小车。
    page_refs:
      - p06
      - p07
      - p08
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 一串湿脚印穿过小乔的门廊。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 鞋尖都朝着小乔家。小乔问：“谁来过？”
    - id: p03
      illustration: p03
      paragraphs:
        - text: 小乔叫来小山，说：“快看这串脚印。”
    - id: p04
      illustration: p04
      paragraphs:
        - text: 小山拿一只脚印和小乔的鞋比。
    - id: p05
      illustration: p05
      paragraphs:
        - text: 鞋底和脚印都有一颗小星星。
    - id: p06
      illustration: p06
      paragraphs:
        - text: 小山指着鞋尖。他说：“鞋尖只说明脚朝哪边。”
    - id: p07
      illustration: p07
      paragraphs:
        - text: 小乔想起那辆红色小车。
    - id: p08
      illustration: p08
      paragraphs:
        - text: 雨停前，她曾拉着小车倒着走。
    - id: p09
      illustration: p09
      paragraphs:
        - text: 鞋和脚印一样大，都有星星。
    - id: p10
      illustration: p10
      paragraphs:
        - text: 小乔擦干门廊，小山放好小车。
