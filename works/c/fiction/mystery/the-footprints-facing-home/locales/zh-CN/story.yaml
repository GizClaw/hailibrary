"article":
  "pages":
    - "id": "p01"
      "illustration": "p01"
      "paragraphs":
        - "text": "一串湿脚印穿过小乔的门廊。"
    - "id": "p02"
      "illustration": "p02"
      "paragraphs":
        - "text": "鞋尖都朝着小乔家。小乔问：“谁来过？”"
    - "id": "p03"
      "illustration": "p03"
      "paragraphs":
        - "text": "小乔叫来小山，说：“快看这串脚印。”"
    - "id": "p04"
      "illustration": "p04"
      "paragraphs":
        - "text": "小山拿鞋和一个脚印比。"
    - "id": "p05"
      "illustration": "p05"
      "paragraphs":
        - "text": "鞋底和脚印都有一颗小星星。"
    - "id": "p06"
      "illustration": "p06"
      "paragraphs":
        - "text": "小山指着鞋尖。他说：“鞋尖只说明脚朝哪边。”"
    - "id": "p07"
      "illustration": "p07"
      "paragraphs":
        - "text": "小乔想起那辆红色小车。"
    - "id": "p08"
      "illustration": "p08"
      "paragraphs":
        - "text": "雨停前，她曾拉着小车倒着走。"
    - "id": "p09"
      "illustration": "p09"
      "paragraphs":
        - "text": "鞋和脚印一样大，都有星星。"
    - "id": "p10"
      "illustration": "p10"
      "paragraphs":
        - "text": "小乔擦干门廊，小山放好小车。"
