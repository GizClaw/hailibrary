schema_version: 2
language: en-US
writer: sage-paw
title: The Boot Prints Pointing Home
summary: Wet boot prints point toward Jo's door. Jo and Sam compare the clues and discover that Jo made the prints while walking backward with a wagon.
chapters:
  - id: ch01
    title: A Strange Trail
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
  - id: ch02
    title: Walking Backward
    page_refs:
      - p06
      - p07
      - p08
      - p09
      - p10
questions:
  - id: q01
    type: picture
    speaker: narrator
    prompt: What shape is on each print?
    answer: A little star.
    page_refs:
      - p05
  - id: q02
    type: sequence
    speaker: narrator
    prompt: What does Sam do before Jo remembers?
    answer: Sam compares the boot and explains the toes.
    page_refs:
      - p04
      - p05
      - p06
      - p07
  - id: q03
    type: cause-effect
    speaker: narrator
    prompt: Why do the prints point home?
    answer: Jo walked backward while facing home.
    page_refs:
      - p06
      - p07
      - p08
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: Wet yellow-boot prints cross Jo's porch.
    - id: p02
      illustration: p02
      paragraphs:
        - text: Every toe points toward Jo's door. Jo asks, “Who came here?”
    - id: p03
      illustration: p03
      paragraphs:
        - text: Jo calls Sam. She says, “Look at this trail.”
    - id: p04
      illustration: p04
      paragraphs:
        - text: Sam compares one print with Jo's boot.
    - id: p05
      illustration: p05
      paragraphs:
        - text: Both have the same little star.
    - id: p06
      illustration: p06
      paragraphs:
        - text: Sam points to the toe marks. They show where the boots faced.
    - id: p07
      illustration: p07
      paragraphs:
        - text: Jo remembers the red wagon.
    - id: p08
      illustration: p08
      paragraphs:
        - text: Before the rain stopped, she pulled it backward.
    - id: p09
      illustration: p09
      paragraphs:
        - text: Jo's boots match the size and star marks.
    - id: p10
      illustration: p10
      paragraphs:
        - text: Jo dries the porch. Sam parks the wagon.
