  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: "Jo shows Sam the backward walk."}, {speaker: narrator, text: "Sam laughs kindly."}]}
  - {id: p09, illustration: p09, lines: [{speaker: narrator, text: "Jo's boots match every print."}]}
