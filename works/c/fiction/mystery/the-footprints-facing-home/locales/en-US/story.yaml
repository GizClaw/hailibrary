schema_version: 1
language: en-US
writer: river-wink
title: The Footprints Facing Home
summary: Jo follows suspicious wet prints until one small star turns the mystery around.
cast:
  narrator: {display_name: Narrator, tts: {delivery: playful and observant, timbre: clear adult voice, pace: medium, pitch: medium}}
  jo: {display_name: Jo, tts: {delivery: confident and expressive, timbre: bright young voice, pace: medium-fast, pitch: medium-high}}
  sam: {display_name: Sam, tts: {delivery: calm and amused, timbre: smooth young voice, pace: medium, pitch: medium-low}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, text: "Wet footprints crossed Jo's porch."}]}
  - {id: p02, illustration: p02, lines: [{speaker: jo, text: "Someone walked toward my door!"}]}
  - {id: p03, illustration: p03, lines: [{speaker: narrator, text: "Jo called Sam to see the clue."}]}
  - {id: p04, illustration: p04, lines: [{speaker: sam, text: "First, let us check the boots."}]}
  - {id: p05, illustration: p05, lines: [{speaker: narrator, text: "A tiny star marked each print."}, {speaker: jo, text: "My boots have stars!"}]}
  - {id: p06, illustration: p06, lines: [{speaker: sam, text: "The toes point at the door."}, {speaker: sam, text: "Prints show which way your boots faced."}, {speaker: sam, text: "They may not show which way you moved."}]}
  - {id: p07, illustration: p07, lines: [{speaker: jo, text: "Yesterday, I pulled my wagon backward."}]}
  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: "Jo tried the funny walk again."}]}
  - {id: p09, illustration: p09, lines: [{speaker: narrator, text: "Her boots fitted every print."}]}
  - {id: p10, illustration: p10, lines: [{speaker: jo, text: "The visitor was me, going the other way!"}]}
chapters:
  - {id: ch01, title: A Visitor, page_refs: [p01, p02, p03, p04, p05]}
  - {id: ch02, title: The Other Way, page_refs: [p06, p07, p08, p09, p10]}
questions:
  - {id: q01, type: explicit-choice, speaker: narrator, prompt: "Where are the prints?", choices: [On Jo's porch, In Sam's kitchen, Beside a pond], answer: "On Jo's porch.", page_refs: [p01]}
  - {id: q02, type: sequence, speaker: narrator, prompt: "What does Sam check first?", answer: "Sam checks the boots.", page_refs: [p04]}
  - {id: q03, type: cause-effect, speaker: narrator, prompt: "Why do the prints look as if someone walked toward the door?", answer: "Jo's boots still faced the door while she walked backward away from it.", page_refs: [p06, p07, p08]}
