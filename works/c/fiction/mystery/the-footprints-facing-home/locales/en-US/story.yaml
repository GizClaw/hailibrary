"article":
  "pages":
    - "id": "p01"
      "illustration": "p01"
      "paragraphs":
        - "text": "Wet yellow-boot prints cross Jo's porch."
    - "id": "p02"
      "illustration": "p02"
      "paragraphs":
        - "text": "Every toe points toward Jo's door. Jo asks, “Who came here?”"
    - "id": "p03"
      "illustration": "p03"
      "paragraphs":
        - "text": "Jo calls Sam. She says, “Look at this trail.”"
    - "id": "p04"
      "illustration": "p04"
      "paragraphs":
        - "text": "Sam compares one print with Jo's boot."
    - "id": "p05"
      "illustration": "p05"
      "paragraphs":
        - "text": "Both have the same little star."
    - "id": "p06"
      "illustration": "p06"
      "paragraphs":
        - "text": "Sam points to the toe marks. They show where the boots faced."
    - "id": "p07"
      "illustration": "p07"
      "paragraphs":
        - "text": "Jo remembers the red wagon."
    - "id": "p08"
      "illustration": "p08"
      "paragraphs":
        - "text": "Before the rain stopped, she pulled it backward."
    - "id": "p09"
      "illustration": "p09"
      "paragraphs":
        - "text": "Jo's boots match the size and star marks."
    - "id": "p10"
      "illustration": "p10"
      "paragraphs":
        - "text": "Jo dries the porch. Sam parks the wagon."
