schema_version: 1
required: true
reason: The mystery depends on what footwear impressions can support, and its revised test must avoid encouraging children to walk backward on a damp surface.
sources:
  - id: nist-footwear-workflow
    title: Quantitative Evaluation of Footwear Evidence - Initial Workflow for an End-to-End System
    publisher: National Institute of Standards and Technology
    url: https://www.nist.gov/publications/quantitative-evaluation-footwear-evidence-initial-workflow-end-end-system
    accessed: 2026-08-28
    supports:
      - Footwear comparisons consider outsole design and size, among other characteristics.
      - A visual match is treated as supporting correspondence, not as proof that excludes every other possible source.
  - id: nist-foundation-review
    title: Footwear and Tire Impression Evidence - A NIST Scientific Foundation Review
    publisher: National Institute of Standards and Technology
    url: https://www.nist.gov/spo/forensic-science-program/footwear-and-tire-impression-evidence-nist-scientific-foundation-review
    accessed: 2026-08-28
    supports:
      - Footwear marks can be recovered and compared with footwear impressions.
  - id: cdc-young-worker-slips
    title: Young Worker Slips, Trips, and Falls
    publisher: CDC National Institute for Occupational Safety and Health
    url: https://www.cdc.gov/niosh/young-workers/slips-trips-falls/index.html
    accessed: 2026-08-28
    supports:
      - Rain and spills are common causes of slips, trips, and falls.
      - Slippery material should be cleaned up and walkways should be kept clear.
  - id: hse-slips-trips
    title: Slips and trips
    publisher: UK Health and Safety Executive
    url: https://www.hse.gov.uk/cleaning/topics/slips.htm
    accessed: 2026-08-28
    supports:
      - Damp smooth floors remain a slip risk.
      - Contamination should be removed and floors left dry.
story_application:
  - The children compare only visible tread, shape, and size, then combine that limited match with Jo's memory; the story does not claim unique forensic identification.
  - They preserve the old trail, do not repeat backward walking, test the orientation with a boot held by hand over soft clay on a dry low table, and clean the porch afterward.
