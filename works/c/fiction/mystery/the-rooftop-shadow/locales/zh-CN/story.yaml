schema_version: 1
language: zh-CN
writer: 松果先生
title: 墙上的怪影
summary: 松鼠把墙上的影子当成怪兽，兔子陪它顺着月光找到了屋顶的小风车。
cast:
  narrator: {display_name: 旁白, tts: {delivery: 好奇清楚, timbre: 清晰的成年声音, pace: 中慢速, pitch: 中音}}
  squirrel: {display_name: 松鼠, tts: {delivery: 紧张又好奇, timbre: 明亮的童声, pace: 中速, pitch: 中高音}}
  rabbit: {display_name: 兔子, tts: {delivery: 平静有条理, timbre: 柔和的童声, pace: 中慢速, pitch: 中音}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, content: [{text: 墙上有一个大}, {vocabulary: {id: shadow, text: 影子}}, {text: 。}]}]}
  - {id: p02, illustration: p02, lines: [{speaker: squirrel, text: 快看，像不像长角的怪兽？}]}
  - {id: p03, illustration: p03, lines: [{speaker: rabbit, text: 别急，先找找影子从哪儿来。}]}
  - {id: p04, illustration: p04, lines: [{speaker: narrator, text: 它们发现一束月光。}]}
  - {id: p05, illustration: p05, lines: [{speaker: narrator, text: 月光从屋顶斜着照下来。}]}
  - {id: p06, illustration: p06, lines: [{speaker: squirrel, text: 墙上的影子一动，屋顶那边也有东西在转。}]}
  - {id: p07, illustration: p07, lines: [{speaker: narrator, text: 它们走到屋外。}]}
  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: 屋顶的小风车正迎着风转。}]}
  - {id: p09, illustration: p09, lines: [{speaker: rabbit, text: 月光被风车挡住，墙上就有了影子。}]}
  - {id: p10, illustration: p10, lines: [{speaker: squirrel, text: 哪有什么怪兽，是小风车的影子！}]}
chapters:
  - {id: ch01, title: 会动的黑影, page_refs: [p01, p02, p03, p04, p05]}
  - {id: ch02, title: 沿着月光, page_refs: [p06, p07, p08, p09, p10]}
questions:
  - {id: q01, type: explicit-choice, speaker: narrator, prompt: 松鼠起初以为影子是什么？, choices: [怪兽, 树, 云], answer: 怪兽。, page_refs: [p02]}
  - {id: q02, type: sequence, speaker: narrator, prompt: 看见月光以后，它们去了哪里？, answer: 屋外。, page_refs: [p04, p05, p07]}
  - {id: q03, type: cause-effect, speaker: narrator, prompt: 大影子是怎样出现的？, answer: 转动的风车挡住月光，把影子投在墙上。, page_refs: [p05, p08, p09]}
