schema_version: 1
language: zh-CN
writer: 栗叶灯
title: 屋顶上的影子
summary: 墙上有个长角的大影子，一直动来动去。松鼠和兔子顺着月光检查，发现屋顶的小风车挡住了光。
cast:
  narrator: {display_name: 旁白, tts: {delivery: 平静好奇, timbre: 温暖的成年声音, pace: 中慢速, pitch: 中音}}
  squirrel: {display_name: 松鼠, tts: {delivery: 活泼小心, timbre: 明亮的童声, pace: 中速, pitch: 中高音}}
  rabbit: {display_name: 兔子, tts: {delivery: 耐心清楚, timbre: 柔和的童声, pace: 中慢速, pitch: 中音}}
pages:
  - id: p01
    illustration: p01
    lines:
      - speaker: narrator
        content: [{text: 一个大}, {vocabulary: {id: shadow, text: 影子}}, {text: 在墙上移动。}]
  - {id: p02, illustration: p02, lines: [{speaker: squirrel, text: 它好像长着角！}]}
  - id: p03
    illustration: p03
    lines:
      - speaker: narrator
        content: [{text: 兔子提着灯检查}, {vocabulary: {id: shadow, text: 影子}}, {text: 。}]
  - {id: p04, illustration: p04, lines: [{speaker: narrator, text: 月光照到了墙上。}]}
  - {id: p05, illustration: p05, lines: [{speaker: rabbit, text: 光是从屋顶来的。}]}
  - id: p06
    illustration: p06
    lines:
      - {speaker: narrator, text: 屋顶上的形状在动。}
      - speaker: narrator
        content: [{text: 墙上的}, {vocabulary: {id: shadow, text: 影子}}, {text: 也动。}]
  - {id: p07, illustration: p07, lines: [{speaker: narrator, text: 两个朋友绕到屋外。}]}
  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: 他们找到转动的小风车。}]}
  - id: p09
    illustration: p09
    lines:
      - speaker: narrator
        content: [{text: 小风车挡住月光，做出}, {vocabulary: {id: shadow, text: 影子}}, {text: 。}]
  - {id: p10, illustration: p10, lines: [{speaker: squirrel, text: 原来一点也不可怕！}, {speaker: narrator, text: 朋友们笑了。}]}
chapters:
  - {id: ch01, title: 墙上的角, page_refs: [p01, p02, p03, p04, p05]}
  - {id: ch02, title: 屋顶的小风车, page_refs: [p06, p07, p08, p09, p10]}
questions:
  - {id: q01, type: picture, speaker: narrator, prompt: 墙上什么在动？, answer: 一个大影子。, page_refs: [p01]}
  - {id: q02, type: sequence, speaker: narrator, prompt: 朋友们绕到屋外后找到了什么？, answer: 转动的小风车。, page_refs: [p07, p08]}
  - {id: q03, type: cause-effect, speaker: narrator, prompt: 影子为什么会动？, answer: 小风车在月光里转动。, page_refs: [p08, p09]}
