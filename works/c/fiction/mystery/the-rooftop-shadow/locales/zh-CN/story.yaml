schema_version: 2
language: zh-CN
writer: 栗叶灯
title: 屋顶上的影子
summary: 墙上有个长角的大影子，一直动来动去。松鼠和兔子顺着月光检查，发现屋顶的小风车挡住了光。
chapters:
  - id: ch01
    title: 墙上的角
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
  - id: ch02
    title: 屋顶的小风车
    page_refs:
      - p06
      - p07
      - p08
      - p09
      - p10
questions:
  - id: q01
    type: picture
    speaker: narrator
    prompt: 墙上什么在动？
    answer: 一个大影子。
    page_refs:
      - p01
  - id: q02
    type: sequence
    speaker: narrator
    prompt: 朋友们绕到屋外后找到了什么？
    answer: 转动的小风车。
    page_refs:
      - p07
      - p08
  - id: q03
    type: cause-effect
    speaker: narrator
    prompt: 影子为什么会动？
    answer: 小风车在月光里转动。
    page_refs:
      - p08
      - p09
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: 一个大
            - vocabulary:
                id: shadow
                text: 影子
            - text: 在墙上移动。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 松鼠喊：“它好像长着角！”
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: 兔子仔细看着
            - vocabulary:
                id: shadow
                text: 影子
            - text: 的边。
    - id: p04
      illustration: p04
      paragraphs:
        - text: 一束月光照到了墙上。
    - id: p05
      illustration: p05
      paragraphs:
        - text: 兔子指着屋顶说：“光从上面来。”
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: 屋顶上的形状在动。墙上的
            - vocabulary:
                id: shadow
                text: 影子
            - text: 也动。
    - id: p07
      illustration: p07
      paragraphs:
        - text: 两个朋友绕到屋外。
    - id: p08
      illustration: p08
      paragraphs:
        - text: 他们找到了转动的小风车。
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: 小风车挡住月光，做出了
            - vocabulary:
                id: shadow
                text: 影子
            - text: 。
    - id: p10
      illustration: p10
      paragraphs:
        - text: 松鼠笑着说：“原来只是小风车！”朋友们都笑了。
