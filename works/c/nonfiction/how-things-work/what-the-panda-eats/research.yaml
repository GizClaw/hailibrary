notes:
  - The unnamed panda and its single-day sequence are a representative nonfiction framing, not a record of one observed wild individual.
  - Authoritative percentages differ by population and presentation: the Chinese forestry source says about 99%, while the Smithsonian zoo-care article says around 95%. The learner text therefore says "almost all" rather than presenting one context-specific percentage as universal.
  - The food-part sequence is a plausible composite. Preferences change with season and bamboo type, so the work does not claim that every panda eats all three parts every day or in one fixed order.
  - The article gives the 10–14-hour wild feeding range. Its morning, noon, and later scenes do not claim uninterrupted eating or an exact clock schedule.
  - The panda remains nonverbal. Resting between feeding bouts and lying down on the ground are ordinary bear actions, not anthropomorphic behavior.
