schema_version: 1
style: naturalistic-storybook
aspect_ratio: 3:2
embedded_text: prohibited
shared_by_all_locales: true
continuity:
  character: The same adult giant panda in every image, with a broad rounded face, compact black ears, symmetrical teardrop eye patches, black shoulder band and legs, white torso, pear-shaped build, and a small shallow notch on the outer right ear; natural proportions and no clothing.
  location: One quiet temperate mountain bamboo grove with mossy gray boulders, soft leaf litter, and layered green bamboo; no fences, keepers, buildings, signs, bowls, or human objects.
  palette: Deep bamboo green, fresh spring green, warm ivory fur, charcoal black markings, moss gray, and soft amber daylight.
  time: Morning light progresses to neutral noon and then warm late-afternoon light without changing the grove geography.
assets:
  - id: cover
    file: artwork/cover.webp
    scene: The recurring adult giant panda sits in its bamboo grove holding one fresh bamboo stem with leafy branches; shoots and stems nearby preview the food-part sequence without showing a false event.
  - id: p01
    file: artwork/p01.webp
    scene: In gentle morning light, the recurring panda walks across leaf litter beside mossy rocks toward a nearby patch of bamboo, beginning its feeding day.
  - id: p02
    file: artwork/p02.webp
    scene: The panda sits surrounded by abundant living bamboo, with shoots, upright stems, and leafy branches all visible as parts of the same plant.
  - id: p03
    file: artwork/p03.webp
    scene: The panda holds and bites one tender pale-green bamboo shoot, with a few intact shoots rooted nearby.
  - id: p04
    file: artwork/p04.webp
    scene: The panda sits beside the peeled remains of the finished shoot and reaches naturally toward more bamboo.
  - id: p05
    file: artwork/p05.webp
    scene: The panda pulls one thick green bamboo stem close with both front paws while seated against the same mossy boulder.
  - id: p06
    file: artwork/p06.webp
    scene: In a close environmental view, the panda uses its teeth to peel the woody outer layer from the stem and exposes the pale inner portion.
  - id: p07
    file: artwork/p07.webp
    scene: The panda gathers a bunch of narrow green bamboo leaves in its front paws and eats them one mouthful at a time.
  - id: p08
    file: artwork/p08.webp
    scene: Under neutral noon light, the panda rests naturally on its belly beside uneaten bamboo, eyes partly closed.
  - id: p09
    file: artwork/p09.webp
    scene: Later, the panda sits up in the same place and resumes eating a leafy bamboo branch.
  - id: p10
    file: artwork/p10.webp
    scene: In warm late-afternoon light, the panda curls on leaf litter beside a modest pile of bamboo remains after the long feeding day.
generation:
  workflow: Codex built-in image generation
  use_case: illustration-story
  text_in_image_requested: false
  source_format: PNG generated outside the repository, then converted with cwebp
  final_sizes:
    cover: 1536x1024 quality 82
    pages: 768x512 quality 80
