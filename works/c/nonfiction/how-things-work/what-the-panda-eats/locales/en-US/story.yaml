      "illustration": "p01"
      "paragraphs":
        - "text": "Morning comes, and a giant panda is hungry."
    - "id": "p02"
      "illustration": "p02"
      "paragraphs":
        - "content":
            - "text": "Almost all its food is "
            - "vocabulary":
                "id": "bamboo"
                "text": "bamboo"
            - "text": "."
    - "id": "p03"
      "illustration": "p03"
      "paragraphs":
        - "content":
            - "text": "First, it bites a soft bamboo "
            - "vocabulary":
                "id": "shoot"
                "text": "shoot"
            - "text": "."
    - "id": "p04"
      "illustration": "p04"
      "paragraphs":
        - "text": "Soon, that shoot is gone."
    - "id": "p05"
      "illustration": "p05"
      "paragraphs":
        - "content":
            - "text": "The panda pulls a thick "
