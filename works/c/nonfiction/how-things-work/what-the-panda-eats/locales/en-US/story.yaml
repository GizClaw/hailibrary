schema_version: 2
language: en-US
writer: sage-paw
title: What Does a Giant Panda Eat?
summary: A hungry giant panda eats several parts of bamboo. After a noon nap, it starts eating again.
chapters:
  - id: ch01
    title: Morning Bamboo
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
  - id: ch02
    title: A Long Meal
    page_refs:
      - p06
