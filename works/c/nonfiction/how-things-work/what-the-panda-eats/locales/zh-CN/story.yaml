"schema_version": 3
"language": "zh-CN"
"writer": "栗叶灯"
"title": "熊猫吃什么"
"summary": "大熊猫饿了，先吃竹笋，再吃竹竿和竹叶。睡过午觉，它又接着吃。"
"chapters":
  - "id": "ch01"
    "title": "清早的竹子"
    "page_refs":
      - "p01"
      - "p02"
      - "p03"
      - "p04"
      - "p05"
  - "id": "ch02"
    "title": "吃了又吃"
    "page_refs":
      - "p06"
      - "p07"
      - "p08"
      - "p09"
      - "p10"
"questions":
  - "id": "q01"
    "type": "picture"
    "prompt": "熊猫手里是什么？"
    "answer": "竹笋。"
    "page_refs":
      - "p03"
  - "id": "q02"
    "type": "sequence"
    "prompt": "吃完竹笋后，它吃什么？"
    "answer": "竹竿。"
    "page_refs":
      - "p03"
      - "p05"
      - "p06"
  - "id": "q03"
    "type": "explicit-choice"
    "prompt": "大熊猫主要吃竹子，还是吃鱼？"
    "answer": "竹子。"
    "page_refs":
      - "p02"
"article":
  "pages":
    - "id": "p01"
      "illustration": "p01"
      "paragraphs":
        - "text": "天刚亮，大熊猫的肚子饿了。"
    - "id": "p02"
      "illustration": "p02"
      "paragraphs":
        - "content":
            - "text": "它的食物几乎全是"
            - "vocabulary":
                "id": "bamboo"
                "text": "竹子"
            - "text": "。"
    - "id": "p03"
      "illustration": "p03"
      "paragraphs":
        - "content":
            - "text": "它先吃一根"
            - "vocabulary":
                "id": "shoot"
                "text": "竹笋"
            - "text": "。"
    - "id": "p04"
      "illustration": "p04"
      "paragraphs":
        - "text": "很快，它吃完了，还想再吃。"
    - "id": "p05"
      "illustration": "p05"
      "paragraphs":
        - "content":
            - "text": "大熊猫抱来一根粗"
            - "vocabulary":
                "id": "stem"
                "text": "竹竿"
            - "text": "。"
    - "id": "p06"
      "illustration": "p06"
      "paragraphs":
        - "text": "剥掉外皮，再吃里面软的部分。"
    - "id": "p07"
      "illustration": "p07"
      "paragraphs":
        - "text": "接着，它抓起一把竹叶。"
    - "id": "p08"
      "illustration": "p08"
      "paragraphs":
        - "text": "中午，它睡了一觉。"
    - "id": "p09"
      "illustration": "p09"
      "paragraphs":
        - "text": "醒来后，它接着吃。"
    - "id": "p10"
      "illustration": "p10"
      "paragraphs":
        - "text": "它每天要吃十到十四小时。睡醒后，它还会吃。"
