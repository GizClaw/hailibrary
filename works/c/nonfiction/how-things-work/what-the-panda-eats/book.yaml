  - picture-book
style: naturalistic-storybook
status: draft
locales:
  - en-US
  - zh-CN
labels:
  topics:
    - animals
    - food
    - nature
  themes:
    - discovery
  moods:
    - calm
    - gentle
characters:
  - id: narrator
    kind: narrator
    description: A calm observer follows one giant panda through its long day of eating.
    voice_identity: warm clear adult guide
  - id: panda
    kind: character
    description: A nonverbal adult giant panda chooses and eats different parts of bamboo.
    visual_identity: Adult giant panda with a broad rounded face, compact black ears, symmetrical teardrop eye patches, a black shoulder band and legs, a white torso, and a small shallow notch on the outer right ear; natural bear anatomy and no clothing.
    voice_identity: low soft nonverbal animal voice
cover: artwork/cover.webp
artwork_manifest: artwork.yaml
learning:
  goals:
    - Follow an ordered day of eating, resting, and eating again.
    - Identify bamboo shoots, stems, and leaves as giant panda foods.
    - Recall that eating can take 10 to 14 hours of a giant panda's day.
  concepts:
    - bamboo as almost all of a giant panda's food
    - bamboo shoots, stems, and leaves
    - long daily feeding time
