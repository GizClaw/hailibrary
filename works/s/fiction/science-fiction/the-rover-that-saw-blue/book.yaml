schema_version: 1
id: the-rover-that-saw-blue
type:
  - reading
  - science-fiction
style: deep-space-science-fiction
status: draft
locales:
  - en-US
  - zh-CN
labels:
  topics:
    - science
    - space
    - technology
    - mystery
  themes:
    - curiosity
    - cooperation
    - problem-solving
    - responsibility
  moods:
    - mysterious
    - reflective
    - hopeful
characters:
  - id: narrator
    kind: narrator
    description: A close third-person narrator who follows the rover team while keeping observations separate from explanations.
    voice_identity: alert, precise, warm without announcing a lesson
  - id: mina
    kind: character
    description: Mina Ko, the eleven-year-old camera lead, eager to share a remarkable image but willing to expose her own mistaken interpretation.
    visual_identity: East Asian girl age eleven, oval face, straight black bob with a small teal hair clip, teal utility coveralls, signal-orange safety harness, gray wrist controller.
    voice_identity: quick, visually attentive, candid when revising herself
  - id: leo
    kind: character
    description: Leo Alvarez, the eleven-year-old geology lead who prepared the simulated soil and initially blames the camera because he trusts his mixture.
    visual_identity: Latino boy age eleven, warm tan skin, round face, short dark curly hair, rust-orange utility jacket over a mineral-gray shirt, dark work trousers.
    voice_identity: thoughtful, defensive about his soil mixture, quick to blame the camera, then curious
  - id: samira
    kind: character
    description: Samira Brooks, the eleven-year-old rover driver who turns disagreement into controlled tests.
    visual_identity: Black girl age eleven, deep brown skin, long braided ponytail, cool-white utility coveralls with signal-orange shoulder panels, compact black command tablet with blank screen graphics.
    voice_identity: calm, practical, economical, firm about procedure
  - id: dr-reyes
    kind: character
    description: Dr. Elena Reyes, the team's science mentor, who asks narrowing questions and controls access to the test yard.
    visual_identity: Latina woman in her early forties, medium-brown skin, silver-streaked dark hair in a low bun, navy utility jacket over a pale gray shirt, dark trousers.
    voice_identity: measured, probing, patient with uncertainty
cover: artwork/cover.webp
artwork_manifest: artwork.yaml
learning:
  goals:
    - Distinguish a camera observation from an interpretation and an assumption.
    - Compare raw, processed, calibrated, repeated, and physical evidence to test competing explanations.
    - Explain why visible color can guide a follow-up question without identifying a material by itself.
  concepts:
    - rover image calibration
    - observation and interpretation
    - controlled comparison
    - revisable explanations
rights:
  text: project-original
  artwork: project-generated
  writer_persona: project-original
