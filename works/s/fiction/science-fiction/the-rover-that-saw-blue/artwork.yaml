schema_version: 1
style: deep-space-science-fiction
aspect_ratio: "3:2"
embedded_text: prohibited
shared_by_all_locales: true
continuity:
  mina: East Asian girl age eleven, oval face, straight black bob with a small teal hair clip, teal utility coveralls, signal-orange safety harness, gray wrist controller.
  leo: Latino boy age eleven, warm tan skin, round face, short dark curly hair, rust-orange utility jacket over a mineral-gray shirt, dark work trousers.
  samira: Black girl age eleven, deep brown skin, long braided ponytail, cool-white utility coveralls with signal-orange shoulder panels, compact black command tablet with abstract blank graphics and no symbols.
  dr-reyes: Latina woman in her early forties, medium-brown skin, silver-streaked dark hair in a low bun, navy utility jacket over a pale gray shirt, dark trousers.
  rover: Compact six-wheeled school rover with a low white-and-mineral-gray body, signal-orange camera mast, paired round camera lenses, small sampling arm, and circular calibration target made of solid color and gray swatches without marks.
  control-room: Plausible school mission-control room with dark mineral-gray consoles, large wordless image displays, glass wall overlooking the sealed test yard, cool white equipment light, and no visible writing.
  mars-yard: Indoor Mars simulation yard with rust-red iron-rich sand, brown and gold rocks, shallow ridges, a pale smooth-edged stone, dark maintenance wall, hard white simulated sunlight, and no signs or writing.
  maintenance-light: Small practical lamp behind the maintenance wall with a translucent blue protective sleeve and a dark hinged light shield held by metal clips.
  palette: Deep black, mineral gray, rust red, signal orange, cool white, restrained teal, and one controlled electric-blue anomaly.
assets:
  - id: cover
    file: artwork/cover.webp
    scene: Mina, Leo, and Samira lean toward a wordless control-room display showing the rover's rust-red test yard and one electric-blue patch beside a pale stone, while the six-wheeled rover is visible through the glass beyond them.
  - id: p01
    file: artwork/p01.webp
    scene: Mina enlarges the final rover frame on a wordless display; Leo and Samira turn toward the single blue patch beside a pale stone in the otherwise rust-red indoor Mars yard.
  - id: p02
    file: artwork/p02.webp
    scene: The stopped rover waits beyond the locked glass wall while Mina nearly adds a dramatic slide to a blank presentation layout and Leo studies the blue patch with protective concern for his soil mixture.
  - id: p03
    file: artwork/p03.webp
    scene: Dr. Reyes faces the three students at the console, where a wordless rover image sits beside three evidence tiles showing rust-red ground, a vivid blue swatch, and a pale stone texture, each above an empty outlined field.
  - id: p04
    file: artwork/p04.webp
    scene: The students study three wordless hypothesis branches beneath the rover image, represented by a blue-coated rock, a camera lens with red-green-blue sensor swatches, and a blue practical lamp shining across a surface; empty outlined evidence fields sit below each branch.
  - id: p05
    file: artwork/p05.webp
    scene: Mina erases a dramatic blue-rock graphic from a blank slide while Samira draws one firm dividing line beneath three abstract possibilities and Leo watches, chastened but engaged.
  - id: p06
    file: artwork/p06.webp
    scene: A close wordless technical view of the raw camera mosaic shows tiny red, green, and blue sensor cells around the pale stone, while the team compares it with the processed image at the console.
  - id: p07
    file: artwork/p07.webp
    scene: Mina checks the rover's circular color-and-gray calibration target on screen as a neutral gray swatch appears slightly blue; the actual target is visible on the rover deck through the glass.
  - id: p08
    file: artwork/p08.webp
    scene: Two corrected wordless views sit side by side, the blue patch weaker but still present, while Mina, Leo, and Samira debate material, light, and processing with distinct expressions.
  - id: p09
    file: artwork/p09.webp
    scene: Dr. Reyes shows three differently rendered but clearly identical Martian landscapes and one enhanced-color terrain view on blank borderless screens, while Leo removes a bright blue mineral icon from the presentation.
  - id: p10
    file: artwork/p10.webp
    scene: The team studies the blue patch concentrated on the pale stone's smooth upper edge and traces possible viewing angles with plain light beams and no labels.
  - id: p11
    file: artwork/p11.webp
    scene: Samira checks a short rover route on a map made only of terrain shapes, Leo watches the protected science zone, and Mina schedules reference and scene images before movement.
  - id: p12
    file: artwork/p12.webp
    scene: Under bright simulated sunrise light, the rover photographs the pale stone from a second angle; its edge is gray while a narrow blue streak now lies on the sand behind it.
  - id: p13
    file: artwork/p13.webp
    scene: Samira overlays two camera sight lines across a wordless model of the yard, and both extend toward a narrow gap in the dark maintenance wall.
  - id: p14
    file: artwork/p14.webp
    scene: Mina examines abstract equipment-history tiles while a small blue-sleeved maintenance lamp glows behind the still-locked wall; the students wait without entering the yard.
  - id: p15
    file: artwork/p15.webp
    scene: Dr. Reyes and Samira enter the yard and discover a dark light shield hanging from one loose metal clip as a thin blue beam crosses the pale stone and a second light chip.
  - id: p16
    file: artwork/p16.webp
    scene: From the rover's first position, the team performs a controlled lamp-on and lamp-off comparison, with the blue patch appearing only in the illuminated condition.
  - id: p17
    file: artwork/p17.webp
    scene: Mina arranges raw, processed, corrected, lamp-on, and lamp-off images in a clean wordless sequence while Leo and Samira review the complete evidence chain.
  - id: p18
    file: artwork/p18.webp
    scene: Leo prepares a careful Mars background using a rust-red globe, brown and gold terrain samples, rover color-filter imagery, and a separate follow-up sensor, all without labels.
  - id: p19
    file: artwork/p19.webp
    scene: During the school demonstration, Samira answers a visitor while Mina runs the lamp comparison and Leo acknowledges the soil beside the large wordless display.
  - id: p20
    file: artwork/p20.webp
    scene: After the audience leaves, the rover faces the now-gray pale stone under stable white light, its calibration target clean and its small optical arm poised for a closer test.
generation:
  workflow: Codex built-in image generation
  text_in_image_requested: false
  visual_review:
    status: passed
    checks:
      - no-visible-text
      - scene-alignment
      - character-continuity
      - clothing-and-prop-continuity
      - rover-and-yard-continuity
      - plausible-equipment
      - audience-safety
      - dimensions-and-compression
