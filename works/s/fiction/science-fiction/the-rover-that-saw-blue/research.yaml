schema_version: 1
required: true
sources:
  - url: https://science.nasa.gov/mars/facts/
    publisher: NASA Science
    claims:
      - Iron minerals in Martian dirt oxidize, or rust, helping the surface appear red.
      - The Martian surface is not uniformly red and includes brown, gold, and tan colors.
  - url: https://www.jpl.nasa.gov/images/pia16800-raw-natural-and-white-balanced-views-of-martian-terrain/
    publisher: NASA Jet Propulsion Laboratory
    claims:
      - Raw, estimated natural-color, and white-balanced presentations of the same Curiosity Mastcam scene answer different viewing questions and can look different.
      - White balancing estimates terrain colors under Earth-like rather than Martian lighting, while calibrated natural color estimates how a person might see the scene on Mars.
  - url: https://science.nasa.gov/resource/mast-camera-and-its-calibration-target-on-curiosity-rover/
    publisher: NASA Science
    claims:
      - Known colors on Curiosity's Mastcam calibration target help researchers adjust images to estimate natural color.
      - Dust can accumulate on the target, so its design includes magnets that concentrate some Martian dust away from reference areas.
  - url: https://science.nasa.gov/resource/mastcam-z-looks-at-its-calibration-target/
    publisher: NASA Science
    claims:
      - Perseverance's Mastcam-Z team uses primary and secondary color and grayscale targets to adjust for changes in brightness and atmospheric dust through the day.
  - url: https://science.nasa.gov/resource/martian-rocks-lining-possible-ancient-channel-enhanced-color/
    publisher: NASA Science
    claims:
      - An enhanced-color Opportunity image combined exposures through selected filters to make differences in surface materials easier to see.
      - The image supported investigation of more than one possible history rather than proving one interpretation by color alone.
  - url: https://www.jpl.nasa.gov/news/nasas-perseverance-rover-cameras-capture-mars-like-never-before/
    publisher: NASA Jet Propulsion Laboratory
    claims:
      - Mastcam-Z color observations help rover teams choose targets for closer study.
      - Mastcam-Z can separate light into multiple color bands for clues about composition, while other instruments such as SuperCam provide closer and more specific follow-up observations.
  - url: https://www.nasa.gov/pdf/392975main_Rover_Races_Activity.pdf
    publisher: NASA
    claims:
      - In Step 2 C-E of NASA's Rover Races activity, one Rover Driver walks the course and writes the command list before the race.
      - Three blindfolded Rover Students then act as the rover and follow that driver's verbal commands exactly; the commands cannot be changed during execution.
notes: >-
  The school, students, indoor test yard, camera pipeline, maintenance lamp,
  loose shield, pale stone, and public demonstration are fictional. The story
  does not claim that blue in a rover image identifies water, life, or a mineral.
  Its mixed cause is internal to the simulation: real blue illumination reached
  a pale surface, and the team's first image processing strengthened the color
  contrast. NASA mission examples support only the general distinctions among
  recorded data, calibrated or white-balanced renderings, enhanced-color views,
  and follow-up composition measurements.
