  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 清醒、准确而温和，始终把不确定之处说清楚
        timbre: 清澈的成年声音，带轻微纪录片质感
        pace: 平稳中速
        pitch: 中音
    mina:
      display_name: 米娜·柯
      tts:
        delivery: 反应快、留意画面细节，改正自己时有真实停顿
        timbre: 明亮集中的少女声音
        pace: 稍快
        pitch: 中高音
    leo:
      display_name: 利奥·阿尔瓦雷斯
      tts:
        delivery: 重视材料与实物，先有一点防备，随后转为好奇
        timbre: 温暖圆润的少年声音
        pace: 从容中速
        pitch: 中音
    samira:
      display_name: 萨米拉·布鲁克斯
      tts:
        delivery: 冷静务实，语气坚定但不生硬
        timbre: 平滑沉着的少女声音
        pace: 均匀中慢速
        pitch: 中低音
    dr-reyes:
      display_name: 埃琳娜·雷耶斯老师
      tts:
        delivery: 耐心追问，准确区分证据能够支持到哪里
        timbre: 稳定柔和、带自然权威感的成年女声
        pace: 从容中慢速
        pitch: 中低音
