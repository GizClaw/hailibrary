    - id: p06
      illustration: p06
      blocks:
        - id: p06-b01
          speaker: narrator
          text: 未经图像处理程序调整的文件里，每个位置都保留着相机记录的红、绿、蓝数据。浅色石头附近的蓝色数值仍然较高，说明蓝色不全是程序后来加出来的。不过，原始数据也不能证明石头本身是蓝的。彩色光照到灰白表面，相机照样会记下蓝光；感光元件若有问题，也可能从最早的数据开始出错。
    - id: p07
      illustration: p07
      blocks:
        - id: p07-b01
          speaker: narrator
          content:
            - text: >-
                米娜接着查看探测车上的颜色参照板。板上几块材料的颜色和反光特点是已知的，研究人员可用它判断当时的光线怎样影响了相机记录。NASA 的火星车也带着这类参照物，用来调整图像的颜色与明暗。那张图里，本应接近中性灰的一格也稍稍偏蓝。重新做完
            - vocabulary: {id: calibration, text: 校准}
            - text: 后，那一格回到中性灰，沙地看起来稍暖了一些。蓝斑随之变淡，但没有完全消失。
    - id: p08
      illustration: p08
      blocks:
        - id: p08-b01
          speaker: narrator
          text: 米娜把两张图并排放好。
        - id: p08-b02
          speaker: mina
          text: 处理过程把差别放大了，可石头也许还是有点特别。
        - id: p08-b03
          speaker: narrator
          text: 利奥摇头。
        - id: p08-b04
          speaker: leo
          text: 也可能是相机只在这种光线下出错。我配的土没有变。
        - id: p08-b05
          speaker: narrator
          text: 萨米拉指着石头上沿。
        - id: p08-b06
          speaker: samira
          text: 先别选。探测车换个位置后，蓝色还会不会贴在这里？
        - id: p08-b07
          speaker: narrator
          text: 她调出场地图，开始寻找第二个拍摄角度。
    - id: p09
      illustration: p09
      blocks:
        - id: p09-b01
          speaker: narrator
          text: 雷耶斯老师调出 NASA 公布的同一片火星地形。屏幕上有原始图、接近人在火星上所见的自然色图，还有按地球光照效果调整的白平衡图。她又打开一张增强色照片，不同滤镜让地表差异更明显。
        - id: p09-b02
          speaker: dr-reyes
          text: 哪张接近人眼所见？哪张便于比较？哪张能直接说出矿物名称？
        - id: p09-b03
          speaker: narrator
          text: 三名学生逐张查看说明。利奥在“蓝色矿物”上加了删除线，却没有把它从草稿中删掉。
    - id: p10
      illustration: p10
      blocks:
        - id: p10-b01
          speaker: narrator
          text: 三名学生重新观察第一张照片。最亮的蓝色贴着石头光滑的上沿，旁边粗糙的沙只带一点冷色；越靠画面左侧，蓝色越淡。米娜预测，若材料本来就是蓝的，换个角度后，蓝色仍会留在同一处表面。利奥在画面上标出蓝斑；若感光元件出错，异常可能总出现在画面的同一区域。萨米拉则预测，若是反光，换角度后亮斑会变弱或移到别处。她据此设计了第二天的短路线。
    - id: p11
      illustration: p11
      blocks:
        - id: p11-b01
          speaker: narrator
          text: 定时模拟开始后，探测车不能临时乱走。萨米拉逐个核对转弯，利奥确认车轮不会压进待观察区域，米娜则安排先拍参照板，再拍全景和石头近景。直接冲向目标当然更快，可车轮一旦搅动沙地，原来的表面就会被破坏。萨米拉在模拟器里跑了一遍路线，修正最后一个转弯，再把指令上传。
    - id: p12
      illustration: p12
      blocks:
        - id: p12-b01
          speaker: narrator
          text: 第二天，模拟灯从暗黄慢慢升到白亮。探测车按上传路线抵达第二个拍摄位置，参照板、全景、近景依次传回控制室。石头上沿接近灰白，原来的蓝斑不见了，后方沙地却多出一道窄蓝光。
        - id: p12-b02
          speaker: mina
          text: 蓝色没有留在石头上。
        - id: p12-b03
          speaker: narrator
          text: 米娜的兴奋一下散了。利奥放大全景，在维护墙边的缝里发现一点蓝光。
    - id: p13
      illustration: p13
      blocks:
        - id: p13-b01
          speaker: narrator
          text: 新的校准图没有整体偏蓝，利奥更难坚持相机一直有故障。原始数据里也有那道窄蓝光，图像处理程序没有凭空造出它。萨米拉沿两次拍摄方向画出延长线。两条线在维护墙边的缝隙处相交，蓝斑则落在不同物体上。她圈住缝隙，请米娜去查设备记录。
    - id: p14
      illustration: p14
      blocks:
        - id: p14-b01
          speaker: narrator
          text: 米娜查询设备记录。前一天下午，工作人员打开墙后的维护灯检查散热风扇，后面没有留下关灯记录。按规定，那盏灯应背向沙地，并由深色挡板遮住。隔着玻璃望去，墙缝里的蓝色灯罩还在发亮。这个线索仍不能证明灯光越过挡板照到了石头。定时任务尚未结束，雷耶斯老师没有开门；他们先拍下蓝光，继续等。
    - id: p15
      illustration: p15
      blocks:
        - id: p15-b01
          speaker: narrator
          text: 门锁解除后，萨米拉和老师先走进模拟场。深色挡板有一只卡扣松开了，后面的维护灯套着蓝色保护罩。一束细光穿过缝隙，扫过浅色石头，又延伸到另一片浅色碎块。那束光正好经过两张照片中发蓝的位置。萨米拉怀疑相机记录的正是这束光。老师先拍下卡扣、灯罩和光束，谁也没有碰挡板。
    - id: p16
      illustration: p16
      blocks:
        - id: p16-b01
          speaker: narrator
          content:
            - text: >-
                大家把探测车移回第一个位置，锁定相机设置，分别拍下开灯与关灯的画面。灯一亮，石旁蓝斑出现；灯一关，它便消失。探测车移到第二个位置后，他们也先固定好位置和设置，再开关维护灯。蓝光按预计方向移动。两组照片共同
            - vocabulary: {id: corroborate, text: 佐证}
            - text: 了反光解释。
    - id: p17
      illustration: p17
      blocks:
        - id: p17-b01
          speaker: narrator
          text: 米娜保留最初的照片和划掉“蓝色矿物”的草稿，重新排出演示顺序。她先并排放好原始图、第一次处理图和校准后的图，再把两组开关灯照片放在下方。利奥的手指跟着三张图里变淡却没消失的蓝斑移动，随后把相机故障卡片移出最终答案栏。萨米拉逐对核对开灯与关灯图，又把松动挡板的照片推到旁边。米娜把那张未定稿的开场页移到整个展示最前面。
    - id: p18
      illustration: p18
      blocks:
        - id: p18-b01
          speaker: narrator
          text: 利奥重写了展示中的火星背景。火星表面的铁矿物发生氧化，使大量尘土呈红色；NASA 的资料也列出棕、金黄和黄褐等颜色。他把不同滤镜拍出的地表图放在后续测量计划旁边。火星车先借助颜色选择值得细查的目标，再用更专门的仪器研究成分。利奥把那块浅色石头的近距离光谱测量写进后续计划。
    - id: p19
      illustration: p19
      blocks:
        - id: p19-b01
          speaker: narrator
          text: 周六展示时，米娜先播放开关灯试验。灯亮，蓝斑出现；探测车换位，蓝斑跟着移动；灯灭，蓝斑消失。一位参观者举手问相机是不是坏了。萨米拉指回第一张原始图。
        - id: p19-b02
          speaker: samira
          text: 它拍到了真正照进来的光，第一次处理又把色差放大了。
        - id: p19-b03
          speaker: leo
          text: 我只顾相信自己配的土，太早就怪相机了。
        - id: p19-b04
          speaker: narrator
          text: 米娜随即调出三张校准对比图。
    - id: p20
      illustration: p20
      blocks:
        - id: p20-b01
          speaker: narrator
          text: 人群散去后，探测车再次对准浅色石头。维护挡板已经扣牢，参照板擦得干净，相机设置也完整记进日志。屏幕上，石头上沿恢复了灰白，周围仍是红褐色沙地。米娜把文件命名为“浅色目标”，又把利奥提议的近距离光谱测量排进下一次任务。玻璃墙外，探测车的光学臂缓缓移向石头。
