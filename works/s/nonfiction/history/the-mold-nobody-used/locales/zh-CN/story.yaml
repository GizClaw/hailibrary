          text: 可这些动物没有先被感染，因此试验没有检验青霉素能否在活体内抵抗感染，也没有治疗人体深处的感染。
    - id: p06
      illustration: p06
      blocks:
        - id: p06-b01
          speaker: narrator
          text: 后来，弗莱明自己讲过一个广为流传的说法：孢子从开着的窗户飞进了实验室。史学研究发现，这个说法有不少疑点。
        - id: p06-b02
          speaker: narrator
          text: 弗莱明楼下一层是C. J. 拉图什的真菌实验室，那里培养了多种霉菌。孢子从楼下飘上来的可能性更大，却也没有得到证实。
        - id: p06-b03
          speaker: narrator
          content:
            - text: 培养皿没有记录孢子走过的路；较可信的解释仍只是一个
            - vocabulary: {id: assumption, text: 假设}
            - text: 。
    - id: p07
      illustration: p07
      blocks:
        - id: p07-b01
          speaker: narrator
          text: “发现以后十年无人理会”也不准确。
        - id: p07-b02
          speaker: narrator
          text: 弗莱明让助手克拉多克和里德利尝试浓缩活性物质。弗莱明自己继续把青霉素用于细菌研究，还把霉菌样本送给别人。
        - id: p07-b03
          speaker: narrator
          text: 困难在于培养液很弱，成分复杂，活性又容易消失。它已经是有用的实验室材料，却还不是成分稳定、剂量明确的药。
    - id: p08
      illustration: p08
      blocks:
        - id: p08-b01
          speaker: narrator
          text: 三十年代仍有人研究青霉素，只是没有人走通从培养液到全身治疗的整条路。
        - id: p08-b02
          speaker: narrator
          text: 说那段时间“什么也没发生”，会抹去已有工作；说“药已经做好，只等人发现”，同样夸大了证据。
        - id: p08-b03
          speaker: narrator
          text: 比较记录后，更稳妥的结论是：现象早已公开，关键方法和体内证据仍然不足。
    - id: p09
      illustration: p09
      blocks:
        - id: p09-b01
          speaker: narrator
          text: 后来，牛津大学的恩斯特·钱恩在查阅抗菌物质时读到弗莱明的论文。霍华德·弗洛里带领团队，把问题推进了一步。
        - id: p09-b02
          speaker: narrator
          text: 他们不只问霉菌液能不能影响培养皿中的细菌。团队还要知道活性物质能否被分离、测量，并在活体内接受检验。
        - id: p09-b03
          speaker: narrator
          text: 1939年起，这项工作需要化学、生物学、医学和工程方法配合。
    - id: p10
      illustration: p10
      blocks:
        - id: p10-b01
          speaker: narrator
          text: 诺曼·希特利设计培养霉菌和处理大量液体的办法。
        - id: p10-b02
          speaker: narrator
          text: 钱恩与希特利利用酸碱变化和溶剂，让活性物质在两种液体间转移。爱德华·亚伯拉罕继续去除杂质。
        - id: p10-b03
          speaker: narrator
          content:
            - vocabulary: {id: purify, text: 提纯}
            - text: 不是把混浊液体简单滤清，而是在除去无关成分时保住脆弱的活性。
        - id: p10-b04
          speaker: narrator
          text: 操作稍有变化，这一批的活性物质就可能损失。
    - id: p11
      illustration: p11
      blocks:
        - id: p11-b01
          speaker: narrator
          text: 不同批次还需要同一把“尺子”。希特利把样品放进带细菌的培养皿，用周围空白圈的大小比较活性。
        - id: p11-b02
          speaker: narrator
          text: 这个测定不能预告人体治疗的全部结果，却能把“看上去不错”变成共同认可的单位。
        - id: p11-b03
          speaker: narrator
          text: 研究者因此可以追问：改了哪一步，测到的效果是否真的随之改变？
    - id: p12
      illustration: p12
      blocks:
        - id: p12-b01
          speaker: narrator
          text: 1940年5月，团队用八只感染了强毒力链球菌的小鼠做了对照试验。四只接受青霉素，另外四只没有接受。
        - id: p12-b02
          speaker: narrator
          text: 第二天早晨，未治疗的小鼠已经死亡，接受治疗的小鼠仍活着。
        - id: p12-b03
          speaker: narrator
          text: 结果不能直接等同于人体疗效，却说明活性物质在当时的试验条件下能在活体内发挥作用。
    - id: p13
      illustration: p13
      blocks:
        - id: p13-b01
          speaker: narrator
          text: 牛津团队在1940年发表小鼠试验报告后，对青霉素的认识需要更新。此前，实验室现象已很清楚，治疗感染的可能性却有限，也未经证实；现在，小鼠试验为全身治疗提供了新证据。
        - id: p13-b02
          speaker: narrator
          text: 可是，治疗一个人需要的青霉素远多于培养皿或小鼠试验的用量，还要评估安全性并确定剂量。
        - id: p13-b03
          speaker: narrator
          text: 团队既有理由兴奋，也有理由谨慎；新证据把研究推向人体试验，却不能预先给出答案。
    - id: p14
      illustration: p14
      blocks:
        - id: p14-b01
          speaker: narrator
          text: 1941年2月，牛津的医生给警察阿尔伯特·亚历山大治疗严重细菌感染。
        - id: p14-b02
          speaker: narrator
          text: 不同记载对他最初怎样受伤说法不一，因此不能肯定某个版本。
        - id: p14-b03
          speaker: narrator
          text: 用药后，他的病情明显好转，可库存很快用完，感染再次加重，亚历山大最终去世。
        - id: p14-b04
          speaker: narrator
          text: 这个病例既带来疗效上的希望，也暴露了供应不足造成的残酷限制。
    - id: p15
      illustration: p15
      blocks:
        - id: p15-b01
          speaker: narrator
          text: 此后的病人带来了更多临床证据，可每一份药都来之不易。
        - id: p15-b02
          speaker: narrator
          text: 工作人员让霉菌铺满几百个浅容器，再收集、提取液体，甚至从病人的尿液里回收青霉素。
        - id: p15-b03
          speaker: narrator
          text: 希特利设计了可叠放的陶瓷培养器和连续提取装置。
        - id: p15-b04
          speaker: narrator
          text: 牛津实验室表明这种治疗值得继续试验，也表明手工生产远远不够。
    - id: p16
      illustration: p16
      blocks:
        - id: p16-b01
          speaker: narrator
          text: 战时的英国工厂难以立刻承担这种新工艺。1941年，弗洛里和希特利赴美寻求协助。
        - id: p16-b02
          speaker: narrator
          text: 他们带去的是菌种、测定方法和初步证据，不是一份照着做就成功的配方。
        - id: p16-b03
          speaker: narrator
          text: 美国农业部在伊利诺伊州皮奥里亚的实验室也加入了。政府、大学、药厂和不同专业的人员开始共同解决量产问题。
    - id: p17
      illustration: p17
      blocks:
        - id: p17-b01
          speaker: narrator
          text: 皮奥里亚的研究者比较培养原料，也寻找产量更高的霉菌。
        - id: p17-b02
          speaker: narrator
          text: 玉米加工产生的浸泡液为霉菌提供了合适养料。研究者从当地市场的一个发霉甜瓜上找到一种菌株，它在生产条件下比弗莱明的原始菌株产量更高。
        - id: p17-b03
          speaker: narrator
          text: 工厂不是把弗莱明的原培养皿放大，而是重新选择菌株、养料、设备和操作条件。
    - id: p18
      illustration: p18
      blocks:
        - id: p18-b01
          speaker: narrator
          text: 深罐又带来一连串问题。霉菌需要空气，送入空气却会产生泡沫；搅拌会改变温度和生长，过热还会损害产物。
        - id: p18-b02
          speaker: narrator
          content:
            - text: 工程师逐步解决供气、冷却、搅拌、控泡、提取和干燥，建立深罐
            - vocabulary: {id: fermentation, text: 发酵}
            - text: 方法。
        - id: p18-b03
          speaker: narrator
          text: 任何一环不稳，整批产品都可能失败。
    - id: p19
      illustration: p19
      blocks:
        - id: p19-b01
          speaker: narrator
          text: 到1944年，美国的产量已经大幅提高，足以为诺曼底登陆中的盟军重伤员提供青霉素。
        - id: p19-b02
          speaker: narrator
          text: 战争加快了计划，有限的药物仍要经过严格分配。这项成果来自跨越国家和机构的协作。
        - id: p19-b03
          speaker: narrator
          text: 研究者提出方法，工人照料培养物，医护人员记录反应，病人承担风险。工程团队则让生产结果能够一批批稳定重现。
    - id: p20
      illustration: p20
      blocks:
        - id: p20-b01
          speaker: narrator
          text: 1945年的诺贝尔奖授予弗莱明、钱恩和弗洛里。希特利和许多参与者没有出现在获奖名单里。
        - id: p20-b02
          speaker: narrator
          text: 保存下来的仪器、论文和生产记录仍能让人看见他们的贡献。
        - id: p20-b03
          speaker: narrator
          text: 展柜里摆着最初的培养皿、希特利的提取装置、陶瓷培养器和一小瓶青霉素。
        - id: p20-b04
          speaker: narrator
          text: 空白圈到药物之间有多少步，一眼便看得见。
