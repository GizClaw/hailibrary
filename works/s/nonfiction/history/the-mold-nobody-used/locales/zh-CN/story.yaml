schema_version: 2
language: zh-CN
writer: 星火
title: 霉菌成为药以前
summary: >-
  1928年，弗莱明从一个混入霉菌的培养皿中发现了重要现象，但那还不是可以治病的成药。牛津团队后来分离、提纯并检验青霉素，美英两国的实验室和工厂又解决了量产难题。比较不同时期的记录，可以看见人们怎样修正解释、补做试验并展开协作，最终把实验室现象变成药物。
chapters:
  - id: ch01
    title: 空白圈留下的问题
    page_refs: [p01, p02, p03, p04, p05]
  - id: ch02
    title: 培养皿不能证明什么
    page_refs: [p06, p07, p08, p09, p10]
  - id: ch03
    title: 进入活体的证据
    page_refs: [p11, p12, p13, p14, p15]
  - id: ch04
    title: 从浅皿到深罐
    page_refs: [p16, p17, p18, p19, p20]
questions:
  - id: q01
    type: evidence
    speaker: narrator
    prompt: 哪项重复出现的证据，支持了霉菌会放出活性物质的解释？
    answer: 弗莱明重新培养霉菌并过滤培养液后，新的细菌培养皿旁再次出现了空白圈。
    page_refs: [p02, p03]
  - id: q02
    type: source-analysis
    speaker: narrator
    prompt: 为什么文章把“孢子从窗外飞来”看作假设，而不是观察？
    answer: 没有记录能确定孢子的路线，后来的史学研究还找到了怀疑窗户说的理由。
    page_refs: [p06]
  - id: q03
    type: compare
    speaker: narrator
    prompt: 牛津团队提出的问题，与弗莱明最初的问题有什么不同？
    answer: 弗莱明先检验霉菌液能否影响培养皿中的细菌；牛津团队进一步检验活性物质能否被分离、测量，并在活体内发挥作用。
    page_refs: [p03, p04, p09, p10]
  - id: q04
    type: evidence
    speaker: narrator
    prompt: 小鼠对照试验为青霉素增加了什么证据？
    answer: 未治疗的感染小鼠死亡，接受青霉素的小鼠仍活着，说明它在当时条件下能在活体内发挥作用。
    page_refs: [p12, p13]
  - id: q05
    type: evaluate
    speaker: narrator
    prompt: 为什么亚历山大的病例既带来希望，也要求谨慎？
    answer: 他的病情用药后明显好转，但药物用完后感染再次加重，他最终去世。
    page_refs: [p14]
  - id: q06
    type: compare
    speaker: narrator
    prompt: 为什么量产工作不是简单放大弗莱明的培养皿？
    answer: 团队更换了菌株和养料，还解决了深罐供气、冷却、搅拌、控泡、提取与干燥等问题。
    page_refs: [p16, p17, p18]
  - id: q07
    type: synthesis
    speaker: narrator
    prompt: 后来的证据怎样改变了最初空白圈的含义？
    answer: 空白圈先说明一种可重复的实验室现象；提纯、动物试验、病人反应和稳定量产，后来说明了这种现象怎样成为药物。
    page_refs: [p03, p05, p10, p12, p14, p18, p20]
  - id: q08
    type: main-idea
    speaker: narrator
    prompt: 为什么说“一个人偶然发现了成药”会让历史失真？
    answer: 弗莱明发现并研究了重要现象，但许多研究者、病人、工人、机构和工程团队补上了成药所需的证据与方法。
    page_refs: [p01, p07, p09, p15, p16, p19, p20]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: >-
            “一位科学家偶然看见霉菌，于是发现了救命药。”这个说法好记，却把漫长的过程挤成了一个瞬间。培养皿上的空白圈确实重要，但它只能说明附近的细菌发生了变化。它还不能回答三件事：这种变化由什么造成，能不能在身体里起作用，又能不能做出足够多的药。
    - id: p02
      illustration: p02
      paragraphs:
        - text: >-
            1928年9月，亚历山大·弗莱明在伦敦圣玛丽医院整理培养皿。一个皿里长着葡萄球菌，也混进了一团霉菌。靠近霉菌的细菌没有照常生长，有些菌落变得透明。弗莱明留下了这个培养皿。霉菌落进去带有偶然性，而把反常现象留下来研究，是他作出的选择。
    - id: p03
      illustration: p03
      paragraphs:
        - text: >-
            眼前能看见的是霉菌、细菌和它们之间的空白。至于原因，当时还只是解释。也许霉菌放出了一种物质，穿过培养基，挡住了细菌生长；也许空白另有原因。弗莱明培养霉菌，过滤培养液，再把液体放到新的细菌旁边。空白圈又出现了，第一个解释因此得到支持。
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: 弗莱明把这种活性物质叫作
            - vocabulary: {id: penicillin, text: 青霉素}
            - text: >-
                。他发现，不同细菌的反应并不一样：有些受到明显抑制，有些几乎不受影响。重复试验把一次巧合变成了可以比较的现象，同时也划出了边界。青霉素不是对所有细菌都有效，培养皿更不能直接证明它可以安全治病。
    - id: p05
      illustration: p05
      paragraphs:
        - text: >-
            1929年，弗莱明发表论文，写下观察方法、过滤液和不同细菌的反应。他认为，这种物质可帮助实验室分离某些细菌，也可能用于部分表面感染。论文还记下了毒性检查：把青霉素注入兔子的静脉和小鼠的腹腔后，没有观察到毒性作用。可这些动物没有先被感染，因此试验没有检验青霉素能否在活体内抵抗感染，也没有治疗人体深处的感染。
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: >-
                后来，弗莱明自己讲过一个广为流传的说法：孢子从开着的窗户飞进了实验室。史学研究发现，这个说法有不少疑点。弗莱明楼下一层是C. J. 拉图什的真菌实验室，那里培养了多种霉菌。孢子从楼下飘上来的可能性更大，却也没有得到证实。培养皿没有记录孢子走过的路；较可信的解释仍只是一个
            - vocabulary: {id: assumption, text: 假设}
            - text: 。
    - id: p07
      illustration: p07
      paragraphs:
        - text: >-
            “发现以后十年无人理会”也不准确。弗莱明让助手克拉多克和里德利尝试浓缩活性物质。弗莱明自己继续把青霉素用于细菌研究，还把霉菌样本送给别人。困难在于培养液很弱，成分复杂，活性又容易消失。它已经是有用的实验室材料，却还不是成分稳定、剂量明确的药。
    - id: p08
      illustration: p08
      paragraphs:
        - text: >-
            三十年代仍有人研究青霉素，只是没有人走通从培养液到全身治疗的整条路。说那段时间“什么也没发生”，会抹去已有工作；说“药已经做好，只等人发现”，同样夸大了证据。比较记录后，更稳妥的结论是：现象早已公开，关键方法和体内证据仍然不足。
    - id: p09
      illustration: p09
      paragraphs:
        - text: >-
            后来，牛津大学的恩斯特·钱恩在查阅抗菌物质时读到弗莱明的论文。霍华德·弗洛里带领团队，把问题推进了一步。他们不只问霉菌液能不能影响培养皿中的细菌。团队还要知道活性物质能否被分离、测量，并在活体内接受检验。1939年起，这项工作需要化学、生物学、医学和工程方法配合。
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: >-
                诺曼·希特利设计培养霉菌和处理大量液体的办法。钱恩与希特利利用酸碱变化和溶剂，让活性物质在两种液体间转移。爱德华·亚伯拉罕继续去除杂质。
            - vocabulary: {id: purify, text: 提纯}
            - text: >-
                不是把混浊液体简单滤清，而是在除去无关成分时保住脆弱的活性。操作稍有变化，这一批的活性物质就可能损失。
    - id: p11
      illustration: p11
      paragraphs:
        - text: >-
            不同批次还需要同一把“尺子”。希特利把样品放进带细菌的培养皿，用周围空白圈的大小比较活性。这个测定不能预告人体治疗的全部结果，却能把“看上去不错”变成共同认可的单位。研究者因此可以追问：改了哪一步，测到的效果是否真的随之改变？
    - id: p12
      illustration: p12
      paragraphs:
        - text: >-
            1940年5月，团队用八只感染了强毒力链球菌的小鼠做了对照试验。四只接受青霉素，另外四只没有接受。第二天早晨，未治疗的小鼠已经死亡，接受治疗的小鼠仍活着。结果不能直接等同于人体疗效，却说明活性物质在当时的试验条件下能在活体内发挥作用。
    - id: p13
      illustration: p13
      paragraphs:
        - text: >-
            牛津团队在1940年发表小鼠试验报告后，对青霉素的认识需要更新。此前，实验室现象已很清楚，治疗感染的可能性却有限，也未经证实；现在，小鼠试验为全身治疗提供了新证据。可是，治疗一个人需要的青霉素远多于培养皿或小鼠试验的用量，还要评估安全性并确定剂量。团队既有理由兴奋，也有理由谨慎；新证据把研究推向人体试验，却不能预先给出答案。
    - id: p14
      illustration: p14
      paragraphs:
        - text: >-
            1941年2月，牛津的医生给警察阿尔伯特·亚历山大治疗严重细菌感染。不同记载对他最初怎样受伤说法不一，因此不能肯定某个版本。用药后，他的病情明显好转，可库存很快用完，感染再次加重，亚历山大最终去世。这个病例既带来疗效上的希望，也暴露了供应不足造成的残酷限制。
    - id: p15
      illustration: p15
      paragraphs:
        - text: >-
            此后的病人带来了更多临床证据，可每一份药都来之不易。工作人员让霉菌铺满几百个浅容器，再收集、提取液体，甚至从病人的尿液里回收青霉素。希特利设计了可叠放的陶瓷培养器和连续提取装置。牛津实验室表明这种治疗值得继续试验，也表明手工生产远远不够。
    - id: p16
      illustration: p16
      paragraphs:
        - text: >-
            战时的英国工厂难以立刻承担这种新工艺。1941年，弗洛里和希特利赴美寻求协助。他们带去的是菌种、测定方法和初步证据，不是一份照着做就成功的配方。美国农业部在伊利诺伊州皮奥里亚的实验室也加入了。政府、大学、药厂和不同专业的人员开始共同解决量产问题。
    - id: p17
      illustration: p17
      paragraphs:
        - text: >-
            皮奥里亚的研究者比较培养原料，也寻找产量更高的霉菌。玉米加工产生的浸泡液为霉菌提供了合适养料。研究者从当地市场的一个发霉甜瓜上找到一种菌株，它在生产条件下比弗莱明的原始菌株产量更高。工厂不是把弗莱明的原培养皿放大，而是重新选择菌株、养料、设备和操作条件。
    - id: p18
      illustration: p18
      paragraphs:
        - content:
            - text: >-
                深罐又带来一连串问题。霉菌需要空气，送入空气却会产生泡沫；搅拌会改变温度和生长，过热还会损害产物。工程师逐步解决供气、冷却、搅拌、控泡、提取和干燥，建立深罐
            - vocabulary: {id: fermentation, text: 发酵}
            - text: >-
                方法。任何一环不稳，整批产品都可能失败。
    - id: p19
      illustration: p19
      paragraphs:
        - text: >-
            到1944年，美国的产量已经大幅提高，足以为诺曼底登陆中的盟军重伤员提供青霉素。战争加快了计划，有限的药物仍要经过严格分配。这项成果来自跨越国家和机构的协作。研究者提出方法，工人照料培养物，医护人员记录反应，病人承担风险。工程团队则让生产结果能够一批批稳定重现。
    - id: p20
      illustration: p20
      paragraphs:
        - text: >-
            1945年的诺贝尔奖授予弗莱明、钱恩和弗洛里。希特利和许多参与者没有出现在获奖名单里。保存下来的仪器、论文和生产记录仍能让人看见他们的贡献。展柜里摆着最初的培养皿、希特利的提取装置、陶瓷培养器和一小瓶青霉素。空白圈到药物之间有多少步，一眼便看得见。
