schema_version: 1
required: true
sources:
  - url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2048009/
    publisher: British Journal of Experimental Pathology via PubMed Central
    claims:
      - Fleming's 1929 paper records the mold-contaminated culture, clear zones near the mold, tests of filtered mold broth, the name penicillin, and unequal effects on different bacteria.
      - Fleming proposed laboratory use and cautious possible use for some surface infections; he also reported rabbit intravenous and mouse intraperitoneal injections without observed toxicity, but no infection-protection test or successful deep-infection treatment.
  - url: https://books.openedition.org/obp/1990
    publisher: Open Book Publishers via OpenEdition Books
    claims:
      - Fleming's 1929 report included an intravenous injection in a rabbit and an intraperitoneal injection in a mouse, with no toxic effect observed.
      - These toxicity checks did not infect the animals first and therefore did not test whether penicillin protected a living animal from infection.
  - url: https://www.understandinganimalresearch.org.uk/human-diseases/penicillin
    publisher: Understanding Animal Research
    claims:
      - Fleming injected a mouse and a rabbit with penicillin to check toxicity but did not perform the infected-mouse protection test later used by the Oxford team.
  - url: https://pmc.ncbi.nlm.nih.gov/articles/PMC1139110/
    publisher: Medical History via PubMed Central
    claims:
      - Fleming later told the open-window story himself, but Ronald Hare's historical investigation found no proof for it and presented evidence against it.
      - C. J. La Touche kept mold cultures in a mycology laboratory one floor below Fleming's; that is a more likely source of the spore, but the route remains unproved.
      - Fleming and his assistants performed further concentration and treatment-related work, so the period after 1929 was not literal abandonment or total neglect.
  - url: https://www.ndorms.ox.ac.uk/files/news/19400824_florey_penicillinasachemotherapeuticagent_lancet.pdf/@@download
    publisher: The Lancet via the University of Oxford
    claims:
      - The 1940 Oxford report named Chain, Florey, Gardner, Heatley, Jennings, Orr-Ewing, and Sanders and described penicillin as a chemotherapeutic agent.
      - In the decisive mouse comparison, four infected mice received penicillin and remained alive the next morning, while four untreated infected controls died.
  - url: https://www.ndorms.ox.ac.uk/files/news/19410816_florey_furtherobservationsonpenicillin_lancet.pdf/@@download
    publisher: The Lancet via the University of Oxford
    claims:
      - The 1941 Oxford report documented culture, assay, production, extraction, clinical observations, and Heatley's technical role.
      - Early production varied by batch and required careful measurement, sterile handling, concentration, and purification.
  - url: https://www.mhs.ox.ac.uk/backfromthedead/exhibition/production/index.html
    publisher: History of Science Museum, University of Oxford
    claims:
      - Heatley developed apparatus to grow, extract, purify, concentrate, and assay penicillin, including stackable ceramic vessels and continuous extraction equipment.
      - Oxford used hundreds of vessels and improvised equipment to make material for the first human trials, demonstrating both clinical promise and the limits of hand production.
  - url: https://oxfordhealth.web.ox.ac.uk/penicillin
    publisher: University of Oxford
    claims:
      - The Oxford mouse test took place on May 25, 1940.
      - Albert Alexander began treatment on February 12, 1941, improved, then died after the limited penicillin supply ran out.
      - Florey and Heatley traveled to the United States in 1941 to seek industrial production help.
  - url: https://www.acs.org/education/whatischemistry/landmarks/flemingpenicillin.html
    publisher: American Chemical Society
    claims:
      - Fleming's plate observation led to repeated tests and the 1929 report, but unstable crude material resisted early isolation.
      - The Oxford team connected extraction, purification, assay, animal testing, and clinical work; Heatley and Abraham made distinct technical contributions.
      - American government laboratories and drug companies solved linked fermentation, aeration, mixing, cooling, foam, recovery, purification, and packaging problems.
      - Penicillin could be lost during purification because it was unstable and heat-sensitive, so extraction was performed at low temperatures.
      - By 1944 production was sufficient for severe Allied casualties during the Normandy invasion.
  - url: https://pubmed.ncbi.nlm.nih.gov/18588247/
    publisher: Biotechnology and Bioengineering via PubMed
    claims:
      - In agitated Penicillium chrysogenum fermenters, higher stirrer speeds shortened effective hyphal length and lowered penicillin production compared with a lower speed.
      - The study supports a mechanism in which frequent circulation through the impeller dispersion zone damages mycelia and lowers the culture's penicillin synthesis rate.
  - url: https://www.ars.usda.gov/midwest-area/peoria-il/national-center-for-agricultural-utilization-research/docs/penicillin-opening-the-era-of-antibiotics/
    publisher: United States Department of Agriculture Agricultural Research Service
    claims:
      - Peoria researchers used corn steep liquor and deep, aerated vats to increase penicillin production.
      - A productive strain was found on a moldy cantaloupe and later improved for mass production.
      - Methods and strains were shared with research groups and industry during wartime scale-up.
  - url: https://www.ars.usda.gov/news-events/news/research-news/2021/penicillium-strain-named-state-microbe-of-illinois/
    publisher: United States Department of Agriculture Agricultural Research Service
    claims:
      - When grown in vats with corn steep liquor and other nutrients, the cantaloupe strain produced more penicillin than Fleming's original strain.
  - url: https://blog.sciencemuseum.org.uk/oxford-and-the-forgotten-man-of-penicillin/
    publisher: Science Museum Group
    claims:
      - Florey and Chain developed penicillin toward a viable systemic medicine, and Heatley's purification work was pivotal.
      - Fleming, Chain, and Florey received the 1945 Nobel Prize, while Heatley's contribution is preserved through later historical attention and surviving apparatus.
  - url: https://www.nobelprize.org/prizes/medicine/1945/summary/
    publisher: Nobel Prize Outreach
    claims:
      - The 1945 Nobel Prize in Physiology or Medicine was awarded jointly to Alexander Fleming, Ernst Chain, and Howard Florey for penicillin and its curative effect.
notes: >-
  The work distinguishes contemporary records from later retellings. Sources disagree about how Albert Alexander's original injury occurred, so the story identifies only his severe bacterial infection, response to treatment, supply failure, and death. The exact route by which the mold spore reached Fleming's plate is also left unresolved. The current titles, "Before the Mold Became Medicine" and "霉菌成为药以前", describe the gap between the first laboratory effect and dependable medicine; they do not claim that nobody used the mold. Fleming, his assistants, and other researchers continued laboratory work, while the later Oxford and transatlantic teams supplied the missing evidence and production methods.
