schema_version: 1
id: the-mold-nobody-used
type:
  - reading
  - narrative-nonfiction
style: naturalistic-storybook
status: draft
locales:
  - en-US
  - zh-CN
labels:
  topics:
    - history
    - science
    - body-and-health
  themes:
    - curiosity
    - discovery
    - cooperation
    - responsibility
  moods:
    - reflective
    - hopeful
characters:
  - id: narrator
    kind: narrator
    description: A source-aware history narrator who separates visible evidence from later interpretation.
    voice_identity: measured, humane, exact about uncertainty
  - id: fleming
    kind: character
    description: Alexander Fleming, the bacteriologist who investigated the unusual mold-contaminated plate in 1928.
    visual_identity: Scottish man in his late forties, light skin, receding brown hair, neat mustache, round spectacles, white laboratory coat over a dark brown waistcoat and white shirt.
    voice_identity: observant, reserved, practical
  - id: chain
    kind: character
    description: Ernst Chain, the biochemist who brought Fleming's paper into the Oxford antibacterial research program.
    visual_identity: European man in his early thirties, light skin, thick dark wavy hair, round dark spectacles, white laboratory coat over a navy suit and blue tie.
    voice_identity: quick, analytical, intense
  - id: florey
    kind: character
    description: Howard Florey, the pathologist who led the Oxford research team and clinical program.
    visual_identity: Australian man around forty, light skin, short light-brown hair brushed back, clean-shaven face, white laboratory coat over a charcoal suit and pale shirt.
    voice_identity: calm, decisive, evidence-led
  - id: heatley
    kind: character
    description: Norman Heatley, the biochemist and experimental problem-solver who developed growth, assay, extraction, and production methods.
    visual_identity: English man in his late twenties, light skin, short dark-brown hair, thin wire spectacles, white laboratory coat with rolled sleeves over a burgundy sweater vest and pale shirt.
    voice_identity: meticulous, inventive, modest
  - id: alexander
    kind: character
    description: Albert Alexander, the Oxford police officer whose severe infection improved during early penicillin treatment before the supply ran out.
    visual_identity: English man in his early forties, light skin, short brown hair, clean-shaven face, plain white hospital gown under a cream wool blanket.
    voice_identity: tired, steady, understated
cover: artwork/cover.webp
artwork_manifest: artwork.yaml
learning:
  goals:
    - Distinguish an observation from an interpretation or assumption.
    - Compare what laboratory, animal, clinical, and production evidence can establish.
    - Explain why penicillin became a medicine through linked contributions rather than one isolated moment.
  concepts:
    - penicillin discovery and development
    - historical evidence and uncertainty
    - scientific testing and scale-up
rights:
  text: project-original
  artwork: project-generated
  writer_persona: project-original
