schema_version: 1
required: true
sources:
  - url: https://asiacenter.harvard.edu/sites/default/files/2023-06/shengua_app3.pdf
    publisher: Harvard University Asia Center
    claims:
      - A scholarly translation of item 307 in Shen Kuo's Dream Pool Essays identifies Bi Sheng as a commoner active during the Qingli reign, 1041 to 1048.
      - The passage describes one raised character per sticky-clay type, hardening by fire, an iron board and frame, a resin-wax-paper-ash bed, and leveling the type surface before printing.
      - Shen Kuo says the method was inconvenient for only a few copies but very efficient for tens, hundreds, or thousands; two iron boards allowed setting and printing to alternate.
      - The passage records duplicate types for common characters, rhyme-group storage, quick production of an uncommon character, and reheating to release used clay types.
      - Shen Kuo reports that wood grain, moisture-related unevenness, and adhesion to the binding mixture made wood unsuitable for this particular system.
      - The passage ends by saying that after Bi Sheng's death Shen Kuo's relatives obtained and preserved the types.
      - The translator's notes identify scholarly debate about what kind of clay was meant and note that woodblock printing remained preferred for many uses.
  - url: https://www.loc.gov/item/2021666451/
    publisher: Library of Congress
    claims:
      - Dream Pool Essays is an encyclopedic collection by Shen Kuo, 1031 to 1095, and includes an early known account of Bi Sheng's movable-type printing.
      - The Library's digitized edition is a later material witness to the text, not a portrait or workshop record of Bi Sheng.
  - url: https://www.zjskw.gov.cn/art/2022/5/16/art_1229614965_46849.html
    publisher: Zhejiang Federation of Humanities and Social Sciences
    claims:
      - Shen Kuo's account of Bi Sheng in Dream Pool Essays is described as the earliest reliable historical record of the invention and use of movable-type printing.
      - Dream Pool Essays was assembled by Shen Kuo as a collection of notes covering many fields, so the Bi Sheng passage is a technical account rather than a full biography.
  - url: https://ich.unesco.org/en/RL/china-engraved-block-printing-technique-00229
    publisher: UNESCO Intangible Cultural Heritage
    claims:
      - Traditional Chinese engraved-block printing uses a prepared fine-grained wooden block whose raised design is inked and pressed by hand onto paper.
      - A complete carved block preserves a page for repeated printing, while preparing and correcting that page requires skilled work.
  - url: https://ich.unesco.org/en/RL/wooden-movable-type-printing-of-china-00322
    publisher: UNESCO Intangible Cultural Heritage
    claims:
      - Wooden movable characters can be arranged into a type-page, dismantled, and used again.
      - The survival of wooden movable-type printing demonstrates that Shen Kuo's criticism of wood concerned Bi Sheng's recorded arrangement, not an impossibility for all later systems.
  - url: https://www.loc.gov/exhibits/world/world-record.html#obj146
    publisher: Library of Congress
    claims:
      - Korean metal movable type was cast in the thirteenth century, and surviving specimens include Chinese characters made of brass, iron, copper, and wood.
      - Metal type is later evidence and must not be inserted into Shen Kuo's account of Bi Sheng's clay process.
  - url: https://www.unesco.org/en/memory-world/baegun-hwasang-chorok-buljo-jikji-simche-yojeol-volii-second-volume-anthology-great-buddhist-priests
    publisher: UNESCO Memory of the World
    claims:
      - Jikji was printed at Cheongju in July 1377 with movable metal type and is the oldest surviving book that provides material evidence of such printing.
      - A surviving metal-type book can show what later printers achieved, but it does not document Bi Sheng's appearance, voice, workshop, or the books he printed.
  - url: https://afe.easia.columbia.edu/songdynasty-module/tech-printing.html
    publisher: Columbia University Asia for Educators
    claims:
      - Bi Sheng's eleventh-century movable type used baked clay, which was fragile.
      - Woodblock printing remained less expensive for many Chinese printing jobs, while later wooden and Korean metal movable type followed different material paths.
notes: >-
  The museum, Mei, Dr. Chen, their exhibit deadline, their handling of replicas,
  and every reconstructed workshop view are invented. Bi Sheng never speaks in
  the work. The narrative treats Shen Kuo's item 307 as the central surviving
  passage: it gives a detailed process and a narrow comment on materials but not
  a portrait, voice, birthplace, childhood, complete occupation, workshop layout,
  named printed book, sequence of experiments, or adoption statistics. The date
  range is the Qingli reign frame, not claimed as the exact day or duration of an
  invention. Later wooden and metal type are compared through separate evidence.
  Material advantages are not presented as a single ladder of progress: output
  size, preparation, reuse, durability, writing system, skill, and printing goal
  can change which method is practical.
