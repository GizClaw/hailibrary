schema_version: 1
id: the-printer-who-moved-characters
type: [reading, narrative-nonfiction]
style: clay-diorama
status: draft
locales: [en-US, zh-CN]
labels:
  topics: [history, technology, culture]
  themes: [curiosity, discovery, problem-solving, tradition]
  moods: [warm, reflective]
characters:
  - id: narrator
    kind: narrator
    description: A source-conscious museum narrator who keeps documented facts, later evidence, and reconstruction distinct.
    voice_identity: clear, curious, and exact without sounding formal
  - id: mei
    kind: character
    description: A nine-year-old museum volunteer who wants visitors to remember Bi Sheng as a person and tests ways to make incomplete history vivid.
    visual_identity: Chinese girl age 9, round face, black hair in two low loops, teal cotton jacket, rust-red skirt over dark leggings, small tan museum satchel.
    voice_identity: bright, quick, and candid when she changes her mind
  - id: dr-chen
    kind: character
    description: A print historian preparing a hands-on display who wants every claim to remain inside the evidence while still welcoming young visitors.
    visual_identity: Chinese woman age 42, oval face, black hair in a low bun, warm gray cardigan over an indigo shirt, dark trousers, thin round glasses, cream cotton gloves when handling objects.
    voice_identity: patient, dryly funny, and careful about sources
  - id: bi-sheng-reconstruction
    kind: historical-figure
    description: A clearly identified museum reconstruction of Bi Sheng at work; no surviving portrait, voice, workshop view, or quotation is claimed.
    visual_identity: imagined Northern Song artisan model with a broad clay face, tied black hair under a plain brown cloth cap, muted ochre cross-collar robe, charcoal apron, no official insignia.
    voice_identity: silent in the work because no words are attributed to him
cover: artwork/cover.webp
artwork_manifest: artwork.yaml
learning:
  goals:
    - Explain how the movable parts in Bi Sheng's recorded system were made, arranged, used, and stored.
    - Compare the goals and trade-offs of woodblock, fired-clay movable type, later wooden type, and later metal type.
    - Distinguish what Shen Kuo's surviving passage records from reconstruction and later evidence.
    - Evaluate how a museum can make incomplete history vivid without presenting guesses as facts.
  concepts:
    - Bi Sheng and Shen Kuo
    - movable type and woodblock printing
    - material and production trade-offs
    - primary historical evidence and uncertainty
rights:
  text: project-original
  artwork: project-generated
  writer_persona: project-original
