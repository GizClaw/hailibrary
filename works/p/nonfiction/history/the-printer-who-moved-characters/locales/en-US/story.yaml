schema_version: 2
language: en-US
writer: river-wink
title: The Printer Who Moved Characters
summary: Mei wants a museum exhibit to give Bi Sheng a face and a lively workshop. Dr. Chen asks her to begin with Shen Kuo's surviving detailed account instead. The finished exhibit uses an empty portrait frame and separate displays to show what is recorded, what came later, and what remains unknown.
chapters:
  - id: ch01
    title: The Empty Portrait
    page_refs: [p01, p02, p03, p04]
  - id: ch02
    title: A Page Made of Pieces
    page_refs: [p05, p06, p07, p08, p09]
  - id: ch03
    title: Fast for Which Job?
    page_refs: [p10, p11, p12, p13, p14]
  - id: ch04
    title: What Materials Can Tell Us
    page_refs: [p15, p16, p17, p18]
questions:
  - id: q01
    type: cause-effect
    speaker: narrator
    prompt: Why did Mei decide not to hang her imagined portrait of Bi Sheng?
    answer: Shen Kuo's passage describes Bi Sheng's process but does not describe his face, so hanging the portrait would turn a guess into a fact.
    page_refs: [p01, p03, p04]
  - id: q02
    type: short-answer
    speaker: narrator
    prompt: How did two iron boards help the printing work continue?
    answer: One board could be used for printing while type was arranged on the other, and then the boards changed jobs.
    page_refs: [p09, p10]
  - id: q03
    type: compare
    speaker: narrator
    prompt: How did a woodblock and Bi Sheng's movable type handle a changed page differently?
    answer: A woodblock held one fixed page, while separate clay types could be removed and arranged again for different pages.
    page_refs: [p02, p13, p14]
  - id: q04
    type: evidence
    speaker: narrator
    prompt: Which details in the passage describe the workshop process?
    answer: Shen Kuo recorded materials, leveling, two alternating boards, duplicate common characters, and storage by rhyme. He also described types carved for missing uncommon characters and removal by reheating.
    page_refs: [p05, p07, p08, p09, p11, p12, p13]
  - id: q05
    type: main-idea
    speaker: narrator
    prompt: What made a printing material suitable for one job and less suitable for another?
    answer: The number of copies, preparation time, reuse, durability, and the printer's skills changed which material suited the job.
    page_refs: [p06, p10, p14, p15, p16, p17]
  - id: q06
    type: character-motive
    speaker: narrator
    prompt: Why did Mei ask Dr. Chen to place the wooden movable-type display after the clay reconstruction?
    answer: She wanted visitors to see Shen Kuo's Song clay method first and recognize wooden type as later evidence.
    page_refs: [p16]
  - id: q07
    type: evaluate
    speaker: narrator
    prompt: Was the finished exhibit both memorable and honest? Support your judgment with two features.
    answer: Yes. Visitors could move replicas and compare printing systems, while the empty portrait and separate evidence trays showed what remained unknown or came from later history.
    page_refs: [p01, p14, p16, p17, p18]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: "The museum would open in two days, and one frame in the printing room was still empty. Mei had drawn an imagined portrait of Bi Sheng for it. Dr. Chen studied the bold face, then asked, “How do we know he looked like that?” Mei had no answer. She folded the drawing and looked at the empty frame."
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: "They began with the older method beside the empty frame. A carver cut a whole page in reverse on one "
            - vocabulary: {id: printing-woodblock, text: woodblock}
            - text: ". After ink met the raised surface, paper could take the page again and again. The block kept that page ready, but a different page needed a different carving."
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: "Dr. Chen opened a copy of Shen Kuo's Dream Pool Essays. Its short passage about Bi Sheng is the main "
            - vocabulary: {id: historical-record, text: historical source}
            - text: " for his invention. It tells us much about a method and little about a life. “Can one passage carry an exhibit?” Mei asked. “Only if we show where its evidence ends,” Dr. Chen replied."
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: "The passage calls Bi Sheng a commoner and places his work in the Qingli years, from 1041 to 1048. It does not name a book he printed or describe his face, voice, home, or workshop. Mei put her portrait away. The museum clay figure had a deliberately ordinary face. The figure stood only for actions recorded in the passage, not for Bi Sheng's appearance. A label would identify the scene as a reconstruction."
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: "Next, they followed the recorded actions. Bi Sheng formed small pieces from sticky clay and carved one raised character on each. He hardened the pieces in fire. A page no longer had to stay inside one block. Its characters had become separate parts that a printer could select and move."
    - id: p06
      illustration: p06
      paragraphs:
        - text: "The reconstruction showed an unfired piece slumping beside the hardened type. Later scholars still debated whether ordinary clay worked well. Some thought fired type would break too easily. A later scholar pointed to a nineteenth-century book successfully printed with clay type. Shen Kuo himself preferred fired clay to wood in this system and said Bi Sheng's types were still carefully preserved. The display showed both pieces and left the question open."
    - id: p07
      illustration: p07
      paragraphs:
        - text: "Making pieces was only the start. The record says the printer covered an iron board with a mix of pine resin, wax, and paper ash. An iron frame sat on top. Heat would soften the bed under the type, so the pieces could be fixed together for one page."
    - id: p08
      illustration: p08
      paragraphs:
        - text: "The printer packed the clay pieces close inside the frame. Before printing, he pressed a flat board across them until their tops made one even surface. Mei tried the replica. One high piece rocked the board, and one low piece did not touch it. She reset both pieces until the board rested evenly."
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: "Bi Sheng's "
            - vocabulary: {id: movable-printing-type, text: movable type}
            - text: " did more than break a page into pieces. Shen Kuo describes two iron boards working in turn. While one board printed, the next page could be arranged on the other. In the reconstruction, the artisan inked one board and set a clay piece into the second. Once the first page was printed, the boards were ready to switch jobs."
    - id: p10
      illustration: p10
      paragraphs:
        - text: "Shen Kuo was clear about the size of the job. For only two or three copies, he said, the method was not convenient. For tens, hundreds, or thousands, he called it fast. The setup took time, and many copies could repay that effort. Mei wrote one question beside the copy counter: “How many copies?”"
    - id: p11
      illustration: p11
      paragraphs:
        - text: "A page might repeat the same character, so one clay piece for each character was not enough. Common characters had many copies; Shen Kuo says some had more than twenty. Unused pieces went into sections of a wooden case, arranged by rhyme. Mei sorted the replicas, then found the next common character without digging through the whole tray."
    - id: p12
      illustration: p12
      paragraphs:
        - text: "What if the next page needed an uncommon character that was missing? The passage says a printer could carve it then and harden it over a grass fire. The reconstruction showed that step. The hands-on table had no working flame; its brazier was painted clay. Mei held up a blank piece. “Good,” she said. “This fire can't burn my fingers or wake the alarm.”"
    - id: p13
      illustration: p13
      paragraphs:
        - text: "After printing, heat softened the binding mix again. Shen Kuo wrote that one brush of the hand made the clay types fall free and stay perfectly clean. The printer returned them to their case, ready to join different pages. One by one, the clean pieces filled the empty compartments."
    - id: p14
      illustration: p14
      paragraphs:
        - content:
            - text: "Mei set the "
            - vocabulary: {id: printing-woodblock, text: woodblock}
            - text: " beside the loose type. “So movable pieces always win,” she said. Dr. Chen pointed to the time needed for sorting and setting. Mei saw the "
            - vocabulary: {id: practical-tradeoff, text: trade-off}
            - text: ": avoiding a new full-page carving meant spending time sorting and setting loose pieces. A fixed block could print the same page again without more carving. Separate pieces helped when pages changed or many copies justified the setup. Mei took back her claim and began timing both demonstrations."
    - id: p15
      illustration: p15
      paragraphs:
        - text: "Shen Kuo also explains why Bi Sheng avoided wood in this arrangement. He says wood grain varied, moisture made the surface uneven, and the pieces stuck to the binding bed. His criticism applies to Bi Sheng's setting method. Later printers could prepare wood and hold it in other ways. Dr. Chen lifted one damp wooden replica, and it clung to the model bed."
    - id: p16
      illustration: p16
      paragraphs:
        - content:
            - text: "Later printers did use wooden "
            - vocabulary: {id: movable-printing-type, text: movable type}
            - text: ". Around 1298, Wang Zhen used wooden type to print a county gazetteer. His Book of Agriculture, published in 1313, later described the method. A living tradition in China still arranges wooden characters, prints a page, takes it apart, and reuses the pieces. Mei asked Dr. Chen to place this display after the clay reconstruction in the visitors' path."
    - id: p17
      illustration: p17
      paragraphs:
        - text: "Metal offered another path. Korean printers cast metal type by the thirteenth century. Jikji, printed in 1377, is the oldest surviving book made with movable metal type. Its pages show what cast type could produce, although casting and setting still demanded equipment and skill. Dr. Chen placed its case beside the later wood display, leaving the clay reconstruction across the gallery."
    - id: p18
      illustration: p18
      paragraphs:
        - content:
            - text: "On opening morning, the portrait frame remained empty. Below it, a full-page woodblock lay face-down beside the movable clay replicas. Three blank color-coded trays kept Shen Kuo's record, later evidence, and unknowns separate. Mei watched a visiting child move one replica and ask how the next page would change. The child reached for one more piece."
