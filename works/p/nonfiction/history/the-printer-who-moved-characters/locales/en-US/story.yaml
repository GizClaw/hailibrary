schema_version: 2
language: en-US
writer: river-wink
title: The Printer Who Moved Characters
summary: Mei wants a museum exhibit to give Bi Sheng a face and a lively workshop. Dr. Chen asks her to begin with Shen Kuo's single surviving account instead. As they rebuild the clay-type process and compare it with woodblock, wood, and metal type, they discover that an honest gap can make history more interesting, not less.
chapters:
  - id: ch01
    title: The Empty Portrait
    page_refs: [p01, p02, p03, p04]
  - id: ch02
    title: A Page Made of Pieces
    page_refs: [p05, p06, p07, p08, p09]
  - id: ch03
    title: Fast for Which Job?
    page_refs: [p10, p11, p12, p13, p14]
  - id: ch04
    title: What Materials Can Tell Us
    page_refs: [p15, p16, p17, p18]
questions:
  - id: q01
    type: cause-effect
    speaker: narrator
    prompt: Why did Mei remove her imagined portrait of Bi Sheng?
    answer: Shen Kuo's passage describes Bi Sheng's process but does not describe his face, so the portrait would turn a guess into a fact.
    page_refs: [p01, p03, p04]
  - id: q02
    type: short-answer
    speaker: narrator
    prompt: How did two iron boards help the printing work continue?
    answer: One board could be used for printing while type was arranged on the other, and then the boards changed jobs.
    page_refs: [p09, p10]
  - id: q03
    type: compare
    speaker: narrator
    prompt: How did a woodblock and Bi Sheng's movable type handle a changed page differently?
    answer: A woodblock held one fixed page, while separate clay types could be removed and arranged again for different pages.
    page_refs: [p02, p13, p14]
  - id: q04
    type: evidence
    speaker: narrator
    prompt: What details show that Shen Kuo understood the workshop process rather than only knowing Bi Sheng's name?
    answer: He recorded materials, leveling, two alternating boards, duplicate common characters, storage by rhyme, quick replacement types, and removal by reheating.
    page_refs: [p05, p07, p08, p09, p11, p12, p13]
  - id: q05
    type: main-idea
    speaker: narrator
    prompt: What does the work say about choosing one best printing material?
    answer: No material was best for every job; the number of copies, preparation, reuse, durability, and available skill changed the choice.
    page_refs: [p06, p10, p14, p15, p16, p17]
  - id: q06
    type: character-motive
    speaker: narrator
    prompt: Why did Dr. Chen keep the later wood and metal displays apart from the clay reconstruction?
    answer: She wanted visitors to compare later evidence without wrongly placing those materials inside Shen Kuo's account of Bi Sheng.
    page_refs: [p16, p17]
  - id: q07
    type: evaluate
    speaker: narrator
    prompt: Was the finished exhibit both memorable and honest? Support your judgment with two features.
    answer: Yes. Visitors could move replicas and compare printing systems, while the empty portrait and separate evidence trays showed what remained unknown or came from later history.
    page_refs: [p01, p14, p16, p17, p18]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: "The museum opened in two days, and one frame in the printing room was still empty. Mei had drawn an imagined portrait of Bi Sheng for it. Dr. Chen studied the bold face, then asked, “How do we know he looked like that?” Mei lowered the drawing. She wanted visitors to remember a person, not just a machine."
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: "They began with the older method beside the empty frame. A carver cut a whole page in reverse on one wooden "
            - vocabulary: {id: printing-woodblock, text: woodblock}
            - text: ". After ink met the raised surface, paper could take the page again and again. The block protected that page well, but a different page needed a different carving."
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: "Dr. Chen opened a copy of Shen Kuo's Dream Pool Essays. Its short passage about Bi Sheng is the main "
            - vocabulary: {id: historical-record, text: historical source}
            - text: " for his invention. It tells us much about a method and little about a life. “Can one passage carry an exhibit?” Mei asked. “Only if we show its edges,” Dr. Chen replied."
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: "The passage calls Bi Sheng a commoner and places his work in the Qingli years, from 1041 to 1048. It does not name a book he printed or describe his face, voice, home, or workshop. Mei removed her portrait. She kept a clay figure at the workbench, but the label would call the scene a reconstruction, not a memory."
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: "Next, they followed the recorded actions. Bi Sheng formed small pieces from sticky clay and carved one raised character on each. He hardened the pieces in fire. A page no longer had to stay inside one block. Its characters had become separate parts that a printer could select and move."
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: "Clay offered useful choices, but it also brought a "
            - vocabulary: {id: practical-tradeoff, text: trade-off}
            - text: ". A new piece could be shaped and fired quickly, according to Shen Kuo. Fired clay could also be fragile. Mei replaced one cracked replica and smiled. “At least ours proves that part,” she said."
    - id: p07
      illustration: p07
      paragraphs:
        - text: "Making pieces was only the start. The record says the printer covered an iron board with a mix of pine resin, wax, and paper ash. An iron frame sat on top. Heat would soften the bed under the type, so the pieces could be fixed together for one page."
    - id: p08
      illustration: p08
      paragraphs:
        - text: "The printer packed the clay pieces close inside the frame. Before printing, he pressed a flat board across them until their tops made one even surface. Mei tried the replica. One high piece rocked the board, and one low piece missed it. A page made from movable parts still required careful leveling."
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: "Bi Sheng's "
            - vocabulary: {id: movable-printing-type, text: movable type}
            - text: " did more than break a page into pieces. Shen Kuo describes two iron boards working in turn. While one board printed, the next page could be arranged on the other. Dr. Chen moved her hands between the trays. “The idea saves waiting only when the work is organized,” she said."
    - id: p10
      illustration: p10
      paragraphs:
        - text: "Shen Kuo was clear about the size of the job. For only two or three copies, he said, the method was not convenient. For tens, hundreds, or thousands, he called it fast. The setup took time, but many copies could repay that effort. Fast was not a property of the tool alone; it depended on the printing goal."
    - id: p11
      illustration: p11
      paragraphs:
        - text: "A page might repeat the same character, so one clay piece for each character was not enough. Common characters had many copies; Shen Kuo says some had more than twenty. Unused pieces went into sections of a wooden case, arranged by rhyme. The system needed ways to store and find pieces as much as clever material."
    - id: p12
      illustration: p12
      paragraphs:
        - text: "What if the next page needed an uncommon character that was missing? The passage says a printer could carve it then and harden it over a grass fire. Mei left one space in the replica frame. She made a new blank piece, but Dr. Chen stopped her before the museum alarm met the flame."
    - id: p13
      illustration: p13
      paragraphs:
        - text: "After printing, heat softened the binding mix again. The clay pieces could come free without staying dirty, Shen Kuo wrote. They were ready to return to their case and later pages. The useful unit was not a finished page anymore. It was one small character that could join many different pages."
    - id: p14
      illustration: p14
      paragraphs:
        - content:
            - text: "Mei set the "
            - vocabulary: {id: printing-woodblock, text: woodblock}
            - text: " beside the loose type. “So movable pieces always win,” she said. Dr. Chen pointed to the time needed for sorting and setting. A fixed block could print the same page again without more carving. Separate pieces helped when pages changed or many copies justified the setup. The better choice depended on the job."
    - id: p15
      illustration: p15
      paragraphs:
        - text: "Shen Kuo also explains why Bi Sheng did not use wood in this arrangement. He says wood grain varied, moisture made the surface uneven, and the pieces stuck to the binding bed. That is evidence about one recorded system, not a law against wood. A later solution could change the wood, the setting method, or both."
    - id: p16
      illustration: p16
      paragraphs:
        - content:
            - text: "Later printers did use wooden "
            - vocabulary: {id: movable-printing-type, text: movable type}
            - text: ". A living tradition in China still arranges wooden characters, prints a page, takes it apart, and reuses the pieces. Mei placed that display beyond the clay workshop. It answered one question—wood could work—without saying that Shen Kuo had described the later method."
    - id: p17
      illustration: p17
      paragraphs:
        - content:
        - text: "Metal offered another path. Korean printers cast metal type by the thirteenth century. Jikji, printed in 1377, is the oldest surviving book made with movable metal type. Its pages show what cast type could produce, yet casting and setting still demanded equipment and skill. That later book proves an achievement; it cannot fill the blank spaces in Bi Sheng's life."
    - id: p18
      illustration: p18
      paragraphs:
        - content:
            - text: "On opening morning, the portrait frame remained empty. Below it, visitors moved clay replicas and compared a fixed block with reusable pieces. Three trays separated Shen Kuo's record, later evidence, and unknowns. Mei watched a child rearrange the type. Her exhibit had a person-shaped gap, but no dull gap. It let the recorded work move."
