schema_version: 2
language: zh-CN
writer: 江笑
title: 毕昇与活字
summary: 博物馆开馆前，小梅想给毕昇画一张像，陈老师却请她先读沈括留下的那段记载。他们按照文字复原泥活字的工序，再与雕版、后来的木活字和金属活字比较。最后，空画像框和分区摆放的证据托盘清楚标出哪些事有记载，哪些事还不知道。
chapters:
  - id: ch01
    title: 空着的画像框
    page_refs: [p01, p02, p03, p04]
  - id: ch02
    title: 把一页拆成许多字
    page_refs: [p05, p06, p07, p08, p09]
  - id: ch03
    title: 印多少才省事
    page_refs: [p10, p11, p12, p13, p14]
  - id: ch04
    title: 材料留下的答案
    page_refs: [p15, p16, p17, p18]
questions:
  - id: q01
    type: cause-effect
    speaker: narrator
    prompt: 小梅为什么决定不挂自己画的毕昇像？
    answer: 沈括记下了毕昇的印刷方法，却没有写他的长相。挂出想象的画像，会让参观者把猜想当成事实。
    page_refs: [p01, p03, p04]
  - id: q02
    type: short-answer
    speaker: narrator
    prompt: 两块铁板怎样让工作接着进行？
    answer: 一块铁板印刷时，另一块可以排下一页；前一块印完，两块再交换任务。
    page_refs: [p09, p10]
  - id: q03
    type: compare
    speaker: narrator
    prompt: 要印新的一页时，雕版和毕昇的活字有什么不同？
    answer: 一块雕版固定着完整的一页，改页往往要另刻木板；泥活字可以拆开，再排成新页。
    page_refs: [p02, p13, p14]
  - id: q04
    type: evidence
    speaker: narrator
    prompt: 哪些细节说明沈括了解实际的印刷工序？
    answer: 他写到了制字、烧字、铺铁板、排字、压平、两板轮换、备重复字、按韵存放、补做生字和加热拆版。
    page_refs: [p05, p07, p08, p09, p11, p12, p13]
  - id: q05
    type: main-idea
    speaker: narrator
    prompt: 为什么不能只问“哪种材料最好”？
    answer: 印多少份、准备要多久、能否重排、是否耐用，以及工匠掌握什么方法，都会影响哪种材料更合适。
    page_refs: [p06, p10, p14, p15, p16, p17]
  - id: q06
    type: character-motive
    speaker: narrator
    prompt: 小梅为什么请陈老师把木活字展台放在泥活字复原区之后？
    answer: 她想让参观者先看沈括记载的宋代泥活字，再明白木活字是后来的证据。
    page_refs: [p16]
  - id: q07
    type: evaluate
    speaker: narrator
    prompt: 最后的展览有没有同时做到“有趣”和“诚实”？请用两项布置说明理由。
    answer: 做到了。参观者能动手重排字块，也能比较几种方法；空画像框和分区摆放的证据托盘则提醒大家哪些内容没有根据。
    page_refs: [p01, p14, p16, p17, p18]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: "再过两天，博物馆就要开馆。印刷展厅里还空着一只画像框。小梅画了浓眉方脸的毕昇。陈老师接过画，只问：“哪条记载写了他的长相？”小梅答不上来。她想让参观者记住毕昇，陈老师却不愿让猜出的脸变成事实。"
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: "两人先看较早的印书方法。工匠把整页内容反刻在一块木制"
            - vocabulary: {id: printing-woodblock, text: 雕版}
            - text: "上，刷墨以后，一页可以反复印。这样的书版能把固定内容保留下来；每换一页，通常又得准备另一块书版。小梅摸着复制品的边缘说：“难怪印一部书要这么多书版，能装满架子。”"
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: "陈老师把《梦溪笔谈》复制本放上书托。沈括写毕昇的一小段，是了解这项发明最重要的"
            - vocabulary: {id: historical-record, text: 史料}
            - text: "。它不是传记，却把制字、排版和拆版写得很细。小梅问：“只有这么一小段，展厅会不会太空？”陈老师说：“先看看这一段究竟装得下多少事。”"
    - id: p04
      illustration: p04
      paragraphs:
        - text: "原文说，庆历年间，布衣毕昇做出新方法。布衣就是普通百姓，不是做官的人。庆历年间是1041年到1048年。原文没讲毕昇的长相、住处、声音，也没说他印过哪本书。小梅收起画像。博物馆做了一个泥人，脸很普通。泥人只代表史料记下的动作，不代表毕昇的真实长相。旁边会注明这是工序复原。"
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: "复原要从小泥块开始。毕昇在胶泥上刻出凸起的反字，一个字做成一个字模，再用火烧硬。整页内容不再锁在一块木板里。每个字模都能被选出来，也能换位置。这就是沈括记载的"
            - vocabulary: {id: movable-printing-type, text: 活字}
            - text: "。"
    - id: p06
      illustration: p06
      paragraphs:
        - text: "复原模型里，没烧的泥块塌了，烧硬的字块仍然方正。普通泥料是否合用，后世学者仍有争论。有人认为泥字容易碎。一位学者指出，十九世纪有人曾用泥活字成功印书。沈括则说，在毕昇的方法里，烧过的泥字比木字合适。毕昇死后，这些活字仍被珍藏。模型同时摆出塌下的泥块和烧硬的字块，不说哪一方已经赢了。"
    - id: p07
      illustration: p07
      paragraphs:
        - text: "有了字模，还不能马上印。沈括记下了一块铁板，板上铺着松脂、蜡和纸灰等粘合材料，再套上铁框。排满以后稍稍加热，下面的材料变软，许多字便能固定成一整版。"
    - id: p08
      illustration: p08
      paragraphs:
        - text: "字块高低不齐，墨就不能均匀落到纸上。因此，工匠要用平板压过版面，使所有字的顶端一样平。小梅拿木板一试：一枚字块高了，木板会晃；一枚低了，纸上就可能少一处。她重新排好两枚字块，木板终于稳稳落下。"
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: "记录里还有两块轮流工作的铁板。一块正在印，另一块同时排下一页。复原场景中，工匠给一块板刷墨，又把一枚"
            - vocabulary: {id: movable-printing-type, text: 活字}
            - text: "排进另一块板。前一页印完时，下一页已经排好。"
    - id: p10
      illustration: p10
      paragraphs:
        - text: "这方法是不是每次都快？沈括自己加了条件：只印两三本，并不简便；要印几十、几百，甚至上千本，才很快。制字、找字、排字都要花时间。印数多，这些准备才更值得。所谓“快”，要先问一句：准备印多少？"
    - id: p11
      illustration: p11
      paragraphs:
        - text: "一页里常会碰见同一个字，所以常用字不能只备一个。沈括说，有的字要准备二十多个。暂时不用的字，按韵分组，收进木格。相同的字块归进一格，需要时很快就能找到下一枚。"
    - id: p12
      illustration: p12
      paragraphs:
        - text: "碰到没准备过的少见字，工匠可以当场刻一个，用草火烧成。复原模型照着这一步做。互动展台却没有真火，火盆只是涂色泥塑。小梅把新泥块举到假火旁：“这样不会烫手，报警器也不会响。”"
    - id: p13
      illustration: p13
      paragraphs:
        - text: "一页印完，再次加热，粘合材料便会变软。沈括说，用手一拂，烧过的泥字就会自己脱落，完全不沾污。工匠把干净的字块逐个放回木格，等着再排下一页。"
    - id: p14
      illustration: p14
      paragraphs:
        - content:
            - text: "小梅把整页"
            - vocabulary: {id: printing-woodblock, text: 雕版}
            - text: "和一盘散字摆在一起，马上宣布：“会动的肯定赢。”陈老师让她算找字和排版的时间。小梅看清了"
            - vocabulary: {id: practical-tradeoff, text: 取舍}
            - text: "：想省下重刻整页的工夫，就得花时间找字、排字。内容不变时，雕版拿来就能再印；页面常改、印数又多时，散字更有用。她收回“肯定赢”这句话，拿起计时器，准备分别测试。"
    - id: p15
      illustration: p15
      paragraphs:
        - text: "沈括还解释了毕昇为何不用木头做字模。木纹疏密不同，沾水会高低不平，还会粘住下面的材料。这些问题说的是毕昇采用的固定方法。后来的工匠可以另做处理。陈老师提起一块潮湿的木字，它还粘在展台的模拟材料上。"
    - id: p16
      illustration: p16
      paragraphs:
        - content:
            - text: "后来的工匠确实做出了木"
            - vocabulary: {id: movable-printing-type, text: 活字}
            - text: "。约在1298年，王祯用木活字印过地方志；1313年刊印的《农书》又记下了这种方法。直到今天，中国还有工匠排木字、印一页、拆版，再用这些字。小梅请陈老师把这个展台放在参观路线的后段，让大家先看宋代泥活字，再看元代木活字。"
    - id: p17
      illustration: p17
      paragraphs:
        - text: "后来，金属活字成了另一种选择。十三世纪，朝鲜半岛已有金属活字。《直指》印于1377年，是现存最早的金属活字印刷书。它说明铸字能够印书，不过铸字、排字仍要技术和工具。陈老师把《直指》展柜放在木活字展台旁，与泥活字复原区隔开。"
    - id: p18
      illustration: p18
      paragraphs:
        - content:
            - text: "开馆那天，画像框仍然空着。框下倒扣着一块整页雕版，旁边是能移动的泥字。三只不同颜色的空白托盘把资料分成三类：沈括的记载、后世证据和没有答案的问题。一个孩子挪动一枚复制字块，问下一页会怎样变化。小梅看着他又拿起一枚。"
