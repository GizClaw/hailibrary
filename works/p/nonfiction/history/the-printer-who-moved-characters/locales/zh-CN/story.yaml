          speaker: narrator
          content:
            - text: "后来的工匠确实做出了木"
            - vocabulary: {id: movable-printing-type, text: 活字}
            - text: "。直到今天，中国还有工匠把木字排成一页，印完拆开，下次再用。"
        - {id: p16-b02, speaker: narrator, text: "小梅把这部分放到泥活字复原区的后面。它能证明木字可行，却不能倒过来变成《梦溪笔谈》里已经发生的事。"}
    - id: p17
      illustration: p17
      blocks:
        - {id: p17-b01, speaker: narrator, text: "金属又给出了另一种选择。十三世纪的朝鲜已经铸造金属活字。一三七七年印成的《直指》，是现存最早能证明金属活字印刷的书。"}
        - {id: p17-b02, speaker: narrator, text: "它的书页说明铸出的活字能够印书，铸字和排字却仍需要技术与工具。这本后来的实物，也不会告诉我们毕昇的脸是什么样。"}
    - id: p18
      illustration: p18
      blocks:
        - {id: p18-b01, speaker: narrator, text: "开馆那天，画像框仍然空着。框下的复制字块可以重排，旁边依次放着沈括的记载、后来的证据和没有答案的问题。"}
        - {id: p18-b02, speaker: narrator, text: "一个孩子动手换了几块字，小梅看得很高兴。她没有给毕昇编出一张脸。参观者却能看见，那位印刷者怎样把固定的一页变成会移动的许多字。"}
