schema_version: 2
language: zh-CN
writer: 江笑
title: 毕昇与活字
summary: 博物馆开馆前，小梅想给毕昇画一张像，陈老师却请她先读沈括留下的那段记载。他们按照文字复原泥活字的工序，再与雕版、后来的木活字和金属活字比较。小梅终于找到一个办法：让展览有趣，同时让未知仍是未知。
chapters:
  - id: ch01
    title: 空着的画像框
    page_refs: [p01, p02, p03, p04]
  - id: ch02
    title: 把一页拆成许多字
    page_refs: [p05, p06, p07, p08, p09]
  - id: ch03
    title: 印多少才省事
    page_refs: [p10, p11, p12, p13, p14]
  - id: ch04
    title: 材料留下的答案
    page_refs: [p15, p16, p17, p18]
questions:
  - id: q01
    type: cause-effect
    speaker: narrator
    prompt: 小梅为什么收起自己画的毕昇像？
    answer: 沈括记下了毕昇的印刷方法，却没有写他的长相。挂出想象的画像，会让参观者把猜想当成事实。
    page_refs: [p01, p03, p04]
  - id: q02
    type: short-answer
    speaker: narrator
    prompt: 两块铁板怎样让工作接着进行？
    answer: 一块铁板印刷时，另一块可以排下一页；前一块印完，两块再交换任务。
    page_refs: [p09, p10]
  - id: q03
    type: compare
    speaker: narrator
    prompt: 改印新的一页时，雕版和毕昇的活字有什么不同？
    answer: 一块雕版固定着完整的一页，改页往往要另刻木板；泥活字可以拆开，再排成新页。
    page_refs: [p02, p13, p14]
  - id: q04
    type: evidence
    speaker: narrator
    prompt: 哪些细节说明沈括了解实际的印刷工序？
    answer: 他写到了制字、烧字、铺铁板、排字、压平、两板轮换、备重复字、按韵存放、补做生字和加热拆版。
    page_refs: [p05, p07, p08, p09, p11, p12, p13]
  - id: q05
    type: main-idea
    speaker: narrator
    prompt: 为什么不能只问“哪种材料最好”？
    answer: 印多少份、准备要多久、能否重排、是否耐用，以及工匠掌握什么方法，都会改变合适的选择。
    page_refs: [p06, p10, p14, p15, p16, p17]
  - id: q06
    type: character-motive
    speaker: narrator
    prompt: 陈老师为什么把木活字和金属活字放在泥活字复原区之外？
    answer: 那些是后来的证据。分开放，参观者可以比较发展，又不会误以为沈括写过这些后来的方法。
    page_refs: [p16, p17]
  - id: q07
    type: evaluate
    speaker: narrator
    prompt: 最后的展览有没有同时做到“有趣”和“诚实”？请找两项布置说明。
    answer: 做到了。参观者能动手重排字块，也能比较几种方法；空画像框和分开的证据盘则提醒大家哪些内容没有根据。
    page_refs: [p01, p14, p16, p17, p18]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: "离开馆只剩两天，印刷展厅里还有一只空画像框。小梅本来画了一位浓眉、方脸的毕昇。陈老师接过画，没有说好不好看，只问：“哪条记载写了他的长相？”小梅答不上来。她盼着参观者记住一个人，陈老师却不愿让一张猜出来的脸变成事实。"
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: "两人先看较早的印书方法。工匠把整页内容反刻在一块木制"
            - vocabulary: {id: printing-woodblock, text: 雕版}
            - text: "上，刷墨以后，一页可以反复印。这样的木板能把固定内容保留下来；书一换页，通常又得准备另一块。小梅摸着复制品的边缘说：“难怪一部书要装满架子。”"
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: "陈老师把《梦溪笔谈》的复制本放上书托。沈括写毕昇的那一小段，是了解这项发明最重要的"
            - vocabulary: {id: historical-record, text: 史料}
            - text: "。它不像传记，没有从出生讲到去世，却把制字、排版和拆版写得很细。小梅问：“材料这么少，展厅会不会太空？”陈老师说：“先看看这一段究竟装得下多少事。”"
    - id: p04
      illustration: p04
      paragraphs:
        - text: "原文只说，庆历年间，有一位布衣毕昇做出了新方法。庆历年间就是公元一千零四十一年到一千零四十八年。至于毕昇长什么样、住在哪里、说话是什么声音、印过哪一本书，这段文字都没讲。小梅收起画像，只留下正在劳动的泥塑复原景。"
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: "复原要从小泥块开始。毕昇在胶泥上刻出凸起的反字，一个字做成一个字模，再用火烧硬。整页内容不再锁在一块木板里。每个小字都能被选出来，也能换位置。这就是沈括记载的"
            - vocabulary: {id: movable-printing-type, text: 活字}
            - text: "。"
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: "用泥有方便，也有"
            - vocabulary: {id: practical-tradeoff, text: 取舍}
            - text: "。原文说，缺少的字可以现刻、现烧，很快补上；可是烧硬的泥字也比较容易破。小梅刚换下一个裂开的复制品，就笑了：“这个缺点不用写，我手里已经有证据。”"
    - id: p07
      illustration: p07
      paragraphs:
        - text: "有了字模，还不能马上印。沈括记下了一块铁板，板上铺着松脂、蜡和纸灰一类的粘合物，再套上铁框。排满以后稍稍加热，下面的材料变软，许多字便能固定成一整版。"
    - id: p08
      illustration: p08
      paragraphs:
        - text: "字块高低不齐，墨就不能均匀落到纸上。因此，工匠要用平板压过版面，使所有字的顶端一样平。小梅拿木板一试：一个字高了，木板会晃；一个字低了，纸上就可能少一处。能移动，不等于可以随便放。"
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: "记录里还有两块轮流工作的铁板。一块正在印，另一块同时排下一页。前一页结束，后一页已经等着了。小梅左右开工，手却碰在一起。陈老师笑道：“"
            - text: "办法能省等待，手脚也得安排好。"
            - text: "这套"
            - vocabulary: {id: movable-printing-type, text: 活字}
            - text: "方法既靠点子，也靠配合。"
    - id: p10
      illustration: p10
      paragraphs:
        - text: "这方法是不是每次都快？沈括自己加了条件：只印两三本，并不简便；要印几十、几百，甚至上千本，才很快。制字、找字、排字都要花时间。印数多，这些准备才更值得。所谓“快”，要先问一句：准备印多少？"
    - id: p11
      illustration: p11
      paragraphs:
        - text: "一页里常会碰见同一个字，所以常用字不能只备一个。沈括说，有的字要准备二十多个。暂时不用的字，按韵分组，收进木格。只会烧出字块还不够；没有一套寻找和存放的方法，排字的人仍会在许多小块中翻个没完。"
    - id: p12
      illustration: p12
      paragraphs:
        - text: "碰到从没准备过的少见字，工匠可以当场刻一个，用草火烧成。小梅故意在铁框里留出空位，捏好一块新泥。她刚朝火盆走，陈老师便指指上方的报警器。小梅停住脚：“古法先不跟现代消防比快。”"
    - id: p13
      illustration: p13
      paragraphs:
        - text: "一页印完，再次加热，粘合物便会变软。沈括说，用手一拂，烧过的泥字就能自己脱落，也不容易沾脏。字块重新回到木格，下一页还能再用。可以反复组合的小单位，不再是一整页，而是一个个字。"
    - id: p14
      illustration: p14
      paragraphs:
        - content:
            - text: "小梅把整页"
            - vocabulary: {id: printing-woodblock, text: 雕版}
            - text: "和一盘散字摆在一起，马上宣布：“会动的肯定赢。”陈老师让她算找字和排版的时间。内容不变时，雕版拿来就能再印；页面常改、印数又多时，散字更有用。两种目标不同，工具也不必争同一个第一。"
    - id: p15
      illustration: p15
      paragraphs:
        - text: "沈括还解释了毕昇为何不用木头做这一套字模。木纹有疏有密，遇到水分后高低不平，又容易和黏合物粘在一起。这里说的是毕昇所用的排版办法，并不是宣布木头永远不能做活字。若材料处理或固定方法改变，结果也可能改变。"
    - id: p16
      illustration: p16
      paragraphs:
        - content:
            - text: "后来的工匠确实做出了木"
            - vocabulary: {id: movable-printing-type, text: 活字}
            - text: "。直到今天，中国还有工匠把木字排成一页，印完拆开，下次再用。小梅把这部分放到泥活字复原区的后面。它能证明木字可行，却不能倒过来变成《梦溪笔谈》里已经发生的事。"
    - id: p17
      illustration: p17
      paragraphs:
        - text: "金属又给出了另一种选择。十三世纪的朝鲜已经铸造金属活字。一三七七年印成的《直指》，是现存最早能证明金属活字印刷的书。它的书页说明铸出的活字能够印书，铸字和排字却仍需要技术与工具。这本后来的实物，也不会告诉我们毕昇的脸是什么样。"
    - id: p18
      illustration: p18
      paragraphs:
        - content:
            - text: "开馆那天，画像框仍然空着。框下的复制字块可以重排，旁边依次放着沈括的记载、后来的证据和没有答案的问题。一个孩子动手换了几块字，小梅看得很高兴。她没有给毕昇编出一张脸。参观者却能看见，那位印刷者怎样把固定的一页变成会移动的许多字。"
