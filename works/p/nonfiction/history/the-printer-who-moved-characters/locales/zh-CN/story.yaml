            - text: "陈老师让她算找字和排版的时间。小梅看清了"
            - vocabulary: {id: practical-tradeoff, text: 取舍}
            - text: "：想省下重刻整页的工夫，就得花时间找字、排字。内容不变时，雕版拿来就能再印；页面常改、印数又多时，散字更有用。她收回“肯定赢”这句话，拿起计时器，准备分别测试。"
    - id: p15
      illustration: p15
      blocks:
        - {id: p15-b01, speaker: narrator, text: "沈括还解释了毕昇为何不用木头做字模。木纹疏密不同，沾水会高低不平，还会粘住下面的材料。"}
        - {id: p15-b02, speaker: narrator, text: "这些问题说的是毕昇采用的固定方法。后来的工匠可以另做处理。陈老师提起一块潮湿的木字，它还粘在展台的模拟材料上。"}
    - id: p16
      illustration: p16
      blocks:
        - id: p16-b01
          speaker: narrator
          content:
            - text: "后来的工匠确实做出了木"
            - vocabulary: {id: movable-printing-type, text: 活字}
            - text: "。约在一二九八年，王祯用木活字印过地方志；一三一三年刊印的《农书》又记下了这种方法。直到今天，中国还有工匠排木字、印一页、拆版，再用这些字。"
        - {id: p16-b02, speaker: narrator, text: "小梅请陈老师把这个展台放在参观路线的后段，让大家先看宋代泥活字，再看元代木活字。"}
    - id: p17
      illustration: p17
      blocks:
        - {id: p17-b01, speaker: narrator, text: "后来，金属活字成了另一种选择。十三世纪，朝鲜半岛已有金属活字。《直指》印于一三七七年，是现存最早的金属活字印刷书。"}
        - {id: p17-b02, speaker: narrator, text: "它说明铸字能够印书，不过铸字、排字仍要技术和工具。陈老师把《直指》展柜放在木活字展台旁，与泥活字复原区隔开。"}
    - id: p18
      illustration: p18
      blocks:
        - {id: p18-b01, speaker: narrator, text: "开馆那天，画像框仍然空着。框下倒扣着一块整页雕版，旁边是能移动的泥字。三只不同颜色的空白托盘把资料分成三类：沈括的记载、后世证据和没有答案的问题。"}
        - {id: p18-b02, speaker: narrator, text: "一个孩子挪动一枚复制字块，问下一页会怎样变化。小梅看着他又拿起一枚。"}
