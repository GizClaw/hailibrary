schema_version: 2
language: en-US
writer: river-wink
title: The Tea Horse Road
summary: In the late Qing dynasty, Yunsheng travels north from Lijiang with a mule caravan carrying tea. A damaged pack frame forces him and Uncle Ma to choose between a promised arrival and the team's safety. They reach the post with sound mules and dry tea, but spend three extra nights there and accept less money.
chapters:
  - id: ch01
    title: The Promised Day
    page_refs: [p01, p02, p03, p04, p05, p06]
  - id: ch02
    title: The High Pass
    page_refs: [p07, p08, p09, p10, p11, p12]
  - id: ch03
    title: One Day Late
    page_refs: [p13, p14, p15, p16, p17, p18]
questions:
  - id: q01
    type: cause-effect
    speaker: narrator
    prompt: Why does Uncle Ma keep urging the caravan forward before it reaches the pass?
    answer: He promised to reach Pine Wind Post by the next evening, before the buyer left the following morning, and the crew needed prompt payment.
    page_refs: [p02, p03, p05]
  - id: q02
    type: evidence
    speaker: narrator
    prompt: Which details show that Willow's problem is more serious than one shifted bundle?
    answer: Willow's rear hoof slides, its skin is rubbed, and unloading reveals a cracked wooden bar in the pack frame.
    page_refs: [p06, p07, p08]
  - id: q03
    type: compare
    speaker: narrator
    prompt: How do the high pass and the lower forest path serve the caravan's goals differently?
    answer: The high pass is faster for meeting the buyer, while the forest path takes longer but avoids the wet narrow section and protects the mule team.
    page_refs: [p06, p09, p10, p12]
  - id: q04
    type: character-motive
    speaker: narrator
    prompt: Why does Yunsheng speak again after Uncle Ma first refuses a long stop?
    answer: He observes Willow's slipping hoof and rubbed skin, so he believes continuing could turn a small delay into an injured mule and a stopped team.
    page_refs: [p06, p07]
  - id: q05
    type: short-answer
    speaker: narrator
    prompt: How does the crew carry Willow's tea without overloading another mule?
    answer: They give several lightly loaded mules a matched pair of small bundles, one on each side, and Yunsheng carries the empty damaged frame.
    page_refs: [p10, p11]
  - id: q06
    type: evaluate
    speaker: narrator
    prompt: Was taking the lower path reasonable despite the money lost? Use evidence known at the choice and two later results.
    answer: Yes. Before the choice, Willow had slipped twice, its skin was rubbed, and a crosspiece was cracked. Afterward, all eight mules could travel and the tea stayed dry, though the crew paid for three nights and accepted a lower price. No one knows whether the stones fell before or after the choice.
    page_refs: [p06, p07, p08, p14, p16, p17]
  - id: q07
    type: character-motive
    speaker: narrator
    prompt: Why does Uncle Ma tell Yunsheng to stop the whole line without waiting for an order?
    answer: Yunsheng noticed trouble early and kept warning him when pressing on could harm a mule and delay everyone, so Uncle Ma now trusts his judgment.
    page_refs: [p05, p06, p07, p18]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: "In the late Qing dynasty, fourteen-year-old Yunsheng joined a "
            - vocabulary: {id: caravan, text: caravan}
            - text: " from Pu'er carrying compressed tea north from Lijiang. At Pine Wind Post, a trader heading north would buy the load and carry it toward Tibetan regions. Eight mules wore wooden pack frames, with wrapped tea bundles balanced on both sides. Yunsheng had walked shorter roads before, but never this far into the mountains."
    - id: p02
      illustration: p02
      paragraphs:
        - text: At the yard gate, Uncle Ma checked each rope and looked at the low sun. “We promised Pine Wind Post that we would arrive tomorrow evening,” he said. “The tea buyer leaves after that. If we miss him, payment must wait.” Several workers had families counting on that money.
    - id: p03
      illustration: p03
      paragraphs:
        - text: They left before dawn. Yunsheng wanted Uncle Ma to see that he could manage a full day's pace. When the trail climbed into cloud, he kept the last two mules close and called out before each bend. “Good,” Uncle Ma said. “Do the same when you are tired.”
    - id: p04
      illustration: p04
      paragraphs:
        - text: By midday, rain darkened the stones. The lead mule's copper bells kept a steady beat. Then Willow snorted near Yunsheng, and a tea bundle knocked against its wooden frame. He turned. The bundle leaned outward on the patient gray mule near the end of the line.
    - id: p05
      illustration: p05
      paragraphs:
        - text: Lan lifted the bundle while Yunsheng pulled its rope tight. The load looked level again. “We should check the whole frame,” Yunsheng said. Uncle Ma studied the clouds above the pass. “At the flat spot beside the trail. A long stop now may cost us the buyer.”
    - id: p06
      illustration: p06
      paragraphs:
        - text: The trail narrowed at the pass entrance. Cold rain ran over a sloping stone, and loose pebbles rolled away under Willow's rear hoof. The mule spread its legs and would not step forward. Uncle Ma reached for the lead rope, but Yunsheng asked, “Can we unload here first?”
    - id: p07
      illustration: p07
      paragraphs:
        - text: “That flat spot just ahead, off the trail, is safer for stopping,” Uncle Ma replied. Willow tried one step, and its rear hoof slid again. Yunsheng pointed beneath the frame, where wet hair lay flat around a rubbed patch of skin. “The frame is moving,” he said. “If Willow falls, nobody reaches the post.”
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: "Uncle Ma finally raised his hand, and the entire line stopped. The crew led the mules onto the nearby flat spot and removed Willow's "
            - vocabulary: {id: cargo, text: cargo}
            - text: ". Once the tea bundles were down, Lan found a cracked wooden bar hidden under the rope. The break had let the frame twist with every step."
    - id: p09
      illustration: p09
      paragraphs:
        - text: Lan knew a lower path through the forest, but it would add most of a day. “Most of a day?” Uncle Ma asked. “The crew is waiting for its pay.” “I know,” Lan said. “But can we promise she'll cross that wet ledge?” She tightened Willow's lead rope. Uncle Ma looked at the pass and said nothing.
    - id: p10
      illustration: p10
      paragraphs:
        - text: Yunsheng expected Uncle Ma to choose the pass. Instead, the leader turned the first mule downhill. “We take the forest path,” he said. “Keep the tea dry, and keep the loads even.” Lan led Willow near the middle. Yunsheng waited for the other mules to turn, then followed at the rear with the empty broken frame across his shoulders.
    - id: p11
      illustration: p11
      paragraphs:
        - text: Beneath the trees, they shared Willow's tea among several lightly loaded mules. Each received one small bundle on each side, so no load leaned. Rain tapped the wrapped tea, but water did not reach the leaves. Yunsheng checked the ropes again before the line moved.
    - id: p12
      illustration: p12
      paragraphs:
        - text: The forest path stayed broad, yet roots and mud kept the pace slow. Uncle Ma no longer called for speed. From the rear, Yunsheng listened past the lead mule's bells for a slipping hoof or a knocking bundle. For the rest of that wet afternoon, the loads stayed quiet.
    - id: p13
      illustration: p13
      paragraphs:
        - text: At a timber shelter, Lan let Willow rest without a load and checked its back and legs. The rubbed skin had not opened. Uncle Ma placed a short piece of wood beside the cracked bar. Yunsheng wrapped rope around both pieces until the frame held straight.
    - id: p14
      illustration: p14
      paragraphs:
        - text: Clear light reached the lower trail the next morning. Across the valley, fresh stones covered part of the upper path. Yunsheng could not tell when they had fallen. Uncle Ma watched for a moment, then sent the line onward.
    - id: p15
      illustration: p15
      paragraphs:
        - text: Pine Wind Post came into view near sunset, a day late. The buyer was nowhere in the yard. Keeper Luo shook his head. “The buyer left this morning. He will return in three days.” Uncle Ma's mouth tightened, but he did not blame Yunsheng.
    - id: p16
      illustration: p16
      paragraphs:
        - text: Keeper Luo inspected the dry bundles and locked them in his storehouse. “The buyer left his terms,” he said. “He'll pay one-tenth less for a late load. Lodging is two copper coins per person each night.” “Can you lower the lodging rate?” Uncle Ma asked. Keeper Luo shook his head. After a pause, Uncle Ma counted out the first night's coins.
    - id: p17
      illustration: p17
      paragraphs:
        - text: Three days later, the buyer returned and opened a bundle. The tea was dry, and every mule could still travel. He paid the lower price Keeper Luo had named, but he bought the full load. The crew bought goods to carry home. Lan removed the temporary wood, replaced the cracked bar, and tightened Willow's frame.
    - id: p18
      illustration: p18
      paragraphs:
        - text: At the next departure, Uncle Ma handed Yunsheng Willow's lead rope. “You heard Willow before anyone else,” he said. “If you hear trouble today, stop the whole line. Don't wait for my order.” Yunsheng closed his hand around the rope and walked ahead of Willow, keeping her at the rear of the line. The full team moved south toward Lijiang, every return bundle level, while the two copper bells rang beyond the bend.
