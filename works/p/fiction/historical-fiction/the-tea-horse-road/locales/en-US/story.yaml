schema_version: 2
language: en-US
writer: river-wink
title: The Tea Horse Road
summary: In the late Qing dynasty, Yunsheng travels north from Lijiang with a mule caravan carrying tea. A damaged pack frame forces him and Uncle Ma to choose between a promised arrival and the team's safety, and their slower choice brings a real cost.
chapters:
  - id: ch01
    title: The Promised Day
    page_refs: [p01, p02, p03, p04, p05, p06]
  - id: ch02
    title: The High Pass
    page_refs: [p07, p08, p09, p10, p11, p12]
  - id: ch03
    title: One Day Late
    page_refs: [p13, p14, p15, p16, p17, p18]
questions:
  - id: q01
    type: cause-effect
    speaker: narrator
    prompt: Why does Uncle Ma keep urging the caravan forward before it reaches the pass?
    answer: He promised to reach Pine Wind Post by the next evening, when the buyer would leave, and the crew needed prompt payment.
    page_refs: [p02, p03, p05]
  - id: q02
    type: evidence
    speaker: narrator
    prompt: Which details show that Willow's problem is more serious than one shifted bundle?
    answer: Willow's rear hoof slides, its skin is rubbed, and unloading reveals a cracked crosspiece in the pack frame.
    page_refs: [p06, p07, p08]
  - id: q03
    type: compare
    speaker: narrator
    prompt: How do the high pass and the lower forest path serve the caravan's goals differently?
    answer: The high pass is faster for meeting the buyer, while the forest path takes longer but avoids the wet narrow section and protects the mule team.
    page_refs: [p06, p09, p10, p12]
  - id: q04
    type: character-motive
    speaker: narrator
    prompt: Why does Yunsheng speak again after Uncle Ma first refuses a long stop?
    answer: He observes Willow's slipping hoof and rubbed skin, so he believes continuing could turn a small delay into an injured mule and a stopped team.
    page_refs: [p06, p07]
  - id: q05
    type: short-answer
    speaker: narrator
    prompt: How does the crew carry Willow's tea without overloading another mule?
    answer: They give several lightly loaded mules one small bundle each, and Yunsheng carries the empty damaged frame.
    page_refs: [p10, p11]
  - id: q06
    type: evaluate
    speaker: narrator
    prompt: Was taking the lower path a reasonable choice even though the caravan lost money? Use two results from the story.
    answer: Yes. The team arrived with every mule able to travel and every tea bundle dry, while the upper trail later had fresh fallen stones. The choice still had a cost because the crew waited and earned less.
    page_refs: [p14, p15, p16, p17]
  - id: q07
    type: main-idea
    speaker: narrator
    prompt: What changes in Uncle Ma's view of Yunsheng by the final page?
    answer: Uncle Ma first treats Yunsheng mainly as a helper who must keep pace, but later trusts him to listen for trouble at the rear.
    page_refs: [p03, p05, p18]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: "In the late Qing dynasty, fourteen-year-old Yunsheng joined a "
            - vocabulary: {id: caravan, text: caravan}
            - text: " carrying compressed tea north from Lijiang. Eight mules wore wooden pack frames, with wrapped tea bundles balanced on both sides. Yunsheng had walked shorter roads before, but this journey would take the team through mountain country toward Tibetan markets."
    - id: p02
      illustration: p02
      paragraphs:
        - text: At the yard gate, Uncle Ma checked each rope and looked at the lowering sun. “We promised Pine Wind Post that we would arrive tomorrow evening,” he said. “The tea buyer leaves after that. If we miss him, payment must wait.” Several workers had families counting on that money.
    - id: p03
      illustration: p03
      paragraphs:
        - text: They left before dawn. Yunsheng wanted Uncle Ma to see that he could manage a full day's pace. When the trail climbed into cloud, he kept the last two mules close and called each bend ahead. “Good,” Uncle Ma said. “Do the same when you are tired.”
    - id: p04
      illustration: p04
      paragraphs:
        - text: By midday, rain darkened the stones. The lead mule's copper bells kept a steady beat, but a smaller bell near the rear struck twice and stopped. Yunsheng turned. One tea bundle leaned outward on Willow, a patient gray mule near the end of the line.
    - id: p05
      illustration: p05
      paragraphs:
        - text: Lan lifted the bundle while Yunsheng pulled its rope tight. The load looked level again. “We should check the whole frame,” Yunsheng said. Uncle Ma studied the clouds above the pass. “At the next level place. A long stop now may cost us the buyer.”
    - id: p06
      illustration: p06
      paragraphs:
        - text: The trail narrowed at the pass entrance. Cold rain ran over a sloping stone, and loose pebbles dropped from Willow's rear hoof. The mule braced its legs and would not step forward. Uncle Ma reached for the lead rope, but Yunsheng asked, “Can we unload here first?”
    - id: p07
      illustration: p07
      paragraphs:
        - text: “The hollow ahead is safer for stopping,” Uncle Ma replied. Willow tried one step, and its rear hoof slid again. Yunsheng pointed beneath the frame, where wet hair lay flat over a rubbed patch of skin. “The frame is moving,” he said. “If Willow falls, nobody reaches the post.”
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: "Uncle Ma finally raised his hand, and the entire line halted. In a small level hollow, the crew removed Willow's "
            - vocabulary: {id: cargo, text: cargo}
            - text: ". Once the tea bundles were down, Lan found a cracked wooden crosspiece hidden under the rope. The break had let the frame twist with every step."
    - id: p09
      illustration: p09
      paragraphs:
        - text: Lan knew a lower path through the forest, but it would add most of a day. Uncle Ma looked up at the short pass, then down at the resting mule. “The crew needs its pay,” he said quietly. “And the animals must be able to bring the return load home,” Lan answered.
    - id: p10
      illustration: p10
      paragraphs:
        - text: Yunsheng expected Uncle Ma to choose the pass. Instead, the leader turned the first mule downhill. “We take the forest path,” he said. “Keep the tea dry, and keep the loads even.” Lan led Willow. Yunsheng carried the empty broken frame across his shoulders.
    - id: p11
      illustration: p11
      paragraphs:
        - text: Beneath the trees, they shared Willow's tea among several lightly loaded mules. Each received one small bundle on each side, so no load leaned. Rain tapped the wrapped tea, but water did not reach the leaves. Yunsheng checked the ropes again before the line moved.
    - id: p12
      illustration: p12
      paragraphs:
        - text: The forest path stayed broad, yet roots and mud kept the pace slow. Uncle Ma no longer called for speed. From the rear, Yunsheng heard the large bells ahead and the smaller bells between them. Their uneven music now told him exactly where each mule walked.
    - id: p13
      illustration: p13
      paragraphs:
        - text: At a timber shelter, Lan let Willow rest without a load and checked its back and legs. The rubbed skin had not opened. Uncle Ma fitted a short wooden brace beside the cracked crosspiece, while Yunsheng wound rope around both pieces until the frame held straight.
    - id: p14
      illustration: p14
      paragraphs:
        - text: Clear light reached the lower trail the next morning. Across the valley, fresh stones covered part of the upper path. Yunsheng could not tell when they had fallen. Uncle Ma watched for a moment, then sent the line onward without guessing what might have happened there.
    - id: p15
      illustration: p15
      paragraphs:
        - text: Pine Wind Post came into view near sunset, one day after the promise. The buyer's place in the yard stood empty. Keeper Luo shook his head. “He left this morning. He will return in three days.” Uncle Ma's mouth tightened, but he did not blame Yunsheng.
    - id: p16
      illustration: p16
      paragraphs:
        - text: Keeper Luo inspected the dry bundles and locked them in his storehouse. The crew would have to pay for three more nights and accept a lower price. Uncle Ma counted out the lodging coins. “That is the cost of arriving late,” he told Yunsheng, with no smile.
    - id: p17
      illustration: p17
      paragraphs:
        - text: Three days later, the buyer returned and opened a bundle. The tea was dry, and every mule could still travel. He paid less than the first offer, but he bought the full load. Afterward, Lan replaced Willow's brace and tightened the frame for the journey home.
    - id: p18
      illustration: p18
      paragraphs:
        - text: At the next departure, Uncle Ma handed Yunsheng the rear rope. “You heard the first wrong note,” he said. “Listen from there today.” Yunsheng took his place behind Willow. The full team moved north, every bundle level, while the two copper bells rang beyond the bend.
