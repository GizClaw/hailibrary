schema_version: 2
language: zh-CN
writer: 江笑
title: 茶马古道上的慢一天
summary: 清朝末年，云生随运茶的骡马队从丽江向北赶路。驮架受损以后，他和马叔必须在如期交货与保护骡马之间作出选择。他们绕路后迟到，既多付了店钱，也少收了茶款，好在八头骡子都能平安回程。
chapters:
  - id: ch01
    title: 约好的日子
    page_refs: [p01, p02, p03, p04, p05, p06]
  - id: ch02
    title: 山口前的选择
    page_refs: [p07, p08, p09, p10, p11, p12]
  - id: ch03
    title: 迟到一天
    page_refs: [p13, p14, p15, p16, p17, p18]
questions:
  - id: q01
    type: cause-effect
    speaker: narrator
    prompt: 到达山口以前，马叔为什么一直催大家赶路？
    answer: 他答应第二天傍晚前把茶送到松风马店，收茶人随后就要离开，伙计们也等着拿工钱。
    page_refs: [p02, p03, p05]
  - id: q02
    type: evidence
    speaker: narrator
    prompt: 哪些情况说明青柳遇到的不只是茶包歪了？
    answer: 青柳的后蹄打滑，背上的皮肤被磨红；卸下茶包后，兰姐又发现驮架的横木裂了。
    page_refs: [p06, p07, p08]
  - id: q03
    type: compare
    speaker: narrator
    prompt: 翻山口和走林中小路，分别更符合马队的哪个目标？
    answer: 翻山口更快，更可能按时见到收茶人；林中小路更慢，却避开湿滑窄路，更能保护整支马队。
    page_refs: [p06, p09, p10, p12]
  - id: q04
    type: character-motive
    speaker: narrator
    prompt: 马叔起初不愿停很久，云生为什么还要再次开口？
    answer: 云生看见青柳的蹄子再次打滑，又发现驮架磨到了它的背，担心一头骡子受伤会拖住全队。
    page_refs: [p06, p07]
  - id: q05
    type: short-answer
    speaker: narrator
    prompt: 大家怎样带走青柳原来驮的茶，又没有让一头骡子多驮太多？
    answer: 几头原本驮得轻的骡子各分到一对小茶包，左右各一包；云生自己扛着卸空的坏驮架。
    page_refs: [p10, p11]
  - id: q06
    type: evaluate
    speaker: narrator
    prompt: 绕走林中小路让大家少赚了钱，这个选择仍然合理吗？请根据作决定时已知的情况和后来的结果说明。
    answer: 合理。作决定前，青柳的后蹄两次打滑，背被磨红，驮架横木也裂了。后来八头骡子都能赶路，茶也没受潮；代价是多付三晚店钱，货价低了一成。至于上山路的新落石，谁也不知道何时落下，不能用它证明当时一定会出事。
    page_refs: [p06, p07, p08, p14, p16, p17]
  - id: q07
    type: character-motive
    speaker: narrator
    prompt: 马叔为什么准许云生一发现异常就自己叫停全队，不必等命令？
    answer: 云生最早发现青柳不对，又在继续赶路可能伤到骡子时坚持提醒，马叔已经信得过他的判断。
    page_refs: [p05, p06, p07, p18]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: 清朝末年，一支从普洱来的
            - vocabulary: {id: caravan, text: 马帮}
            - text: 在丽江歇过脚，要把茶运到北边的松风马店。那里有位继续北上的收茶人，会买下茶叶，再运往藏区。十四岁的云生第一次随队走远路。八头骡子的背上都绑着木驮架，两边的茶包一样高。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 出发前，马叔挨个拉了拉绳结，又抬头看天。“明天傍晚前要赶到松风马店，”他对云生说，“收茶人后天一早就走。错过他，工钱也得跟着等。”院里的几个赶马人听见了，都默默加快了手脚。
    - id: p03
      illustration: p03
      paragraphs:
        - text: 天还没亮，铜铃就在石板路上响起来。云生管着队尾的两头骡子，心里只想着别落下。山路钻进云里以后，他每到转弯处都先出声提醒。马叔回头说：“现在走得稳。累了以后也要这么稳。”
    - id: p04
      illustration: p04
      paragraphs:
        - text: 中午，下起了雨。领头骡子的两只大铃还在有节奏地响。队尾的青柳忽然打了个响鼻，歪向一边的茶包磕在木驮架上。云生马上回头，看见这头灰骡一侧的茶包正向外斜着。
    - id: p05
      illustration: p05
      paragraphs:
        - text: 兰姐托起茶包，云生重新收紧绳子。茶包看起来平了，云生还是不放心：“得把下面的木架也查一遍。”马叔望着山口上方的黑云说：“到了前面路边的小平地再查。停久了，收茶人可不会等我们。”
    - id: p06
      illustration: p06
      paragraphs:
        - text: 山口越来越窄，冷雨顺着斜石往下流。青柳的后蹄刚踩上斜石，下面的碎石就滚下坡。它把四条腿撑开，再也不肯向前。马叔刚抓住缰绳，云生便问：“能不能先卸茶？”
    - id: p07
      illustration: p07
      paragraphs:
        - text: “前面路边那块平地更适合停队。”马叔指着不远处。青柳勉强又走一步，后蹄再次一滑。云生摸到驮架下方，看见湿毛紧贴着一块磨红的皮肤。“木架一直在动，”他说，“要是青柳摔了，全队就更不可能按时到马店。”
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: 马叔这才举手，让前面的骡子都停下。大家把骡子牵到前面那块路边的小平地，把青柳背上的
            - vocabulary: {id: cargo, text: 货物}
            - text: 一件件卸下。兰姐拨开湿绳，看见驮架的一根横木裂开了。每走一步，裂口就让木架向一边扭。
    - id: p09
      illustration: p09
      paragraphs:
        - text: 兰姐说，绕过山口的林中小路要多走大半天。“大半天？”马叔皱起眉，“伙计们等着工钱。”“我知道，”兰姐说，“可谁敢说它过得了那段湿石路？”她拉住青柳的缰绳。马叔看向山口，没有接话。
    - id: p10
      illustration: p10
      paragraphs:
        - text: 云生以为马叔还会往上走。马叔却把领头骡子转向下坡：“走林子。茶不能湿，每头骡子两边的驮子也得平。”兰姐牵着卸空的青柳走在队伍中间。等其他骡子都下了坡，云生才扛着坏驮架守住队尾。
    - id: p11
      illustration: p11
      paragraphs:
        - text: 到了树下，大家重新分茶包。几头原本驮得轻的骡子，左右各多带一小包，两边一样重。雨点落在包布上，里面的茶仍是干的。云生摸过一遍绳结，又回到最后，才让队尾动身。
    - id: p12
      illustration: p12
      paragraphs:
        - text: 林中小路宽一些，泥和树根却拖慢了脚步。马叔没有再催。云生走在最后，听着前方领头骡子的铃声，也留心有没有蹄子打滑、茶包磕木架的动静。那天下午，一路没有再响起茶包磕木架的声音。
    - id: p13
      illustration: p13
      paragraphs:
        - text: 入夜前，他们找到一间木棚。兰姐不让青柳驮东西，先查看它的背和腿。磨红的皮肤并没有破。马叔削出一块短木条，贴住裂开的横木；云生用绳子把两块木头一圈圈扎牢。
    - id: p14
      illustration: p14
      paragraphs:
        - text: 第二天早晨，云散了。隔着山谷望去，他们看见原先那段上山路上多了不少新落石。云生不知道石头是什么时候掉下来的，只是安静地望了一会儿。马叔也没有多说，只挥手让大家继续赶路。
    - id: p15
      illustration: p15
      paragraphs:
        - text: 太阳快落山时，松风马店终于出现在坡下。他们比约好的日子晚了一天，院里已经不见收茶人的身影。罗掌柜摇了摇头，说：“收茶人今早走了，三天后才回来。”马叔沉默了一会儿，却没有责怪云生。
    - id: p16
      illustration: p16
      paragraphs:
        - text: 罗掌柜查看每个茶包，见包布里面仍是干的，便把茶锁进库房。“收茶人留下了话，”他说，“迟到一天，他就少付一成茶钱。住店每人每晚两个铜钱。”“店钱能不能少些？”马叔问。罗掌柜摇头。马叔沉默片刻，数出第一晚的钱。
    - id: p17
      illustration: p17
      paragraphs:
        - text: 三天后，收茶人回来拆开一包茶。茶没有受潮，八头骡子也都能继续赶路。他照罗掌柜说的价钱少付一成，收下整批茶。大家买好回程要带的货物，兰姐也拆下临时木条，换上了新的横木。
    - id: p18
      illustration: p18
      paragraphs:
        - text: 向南返回丽江时，马叔把青柳的缰绳递给云生。“青柳有动静，是你先听见的。今天再发现不对，自己叫全队停下，不用等我。”云生握紧绳子，走到青柳前面，带着它守在队尾。前方转过山弯，两只大铜铃响着，回程的货包都稳稳当当。
