        - {id: p17-b04, speaker: narrator, text: 交易结束后，兰姐换掉临时木条，又把青柳的驮架仔细收紧。}
    - id: p18
      illustration: p18
      blocks:
        - {id: p18-b01, speaker: narrator, text: 再次出发时，马叔把队尾的缰绳递给云生。}
        - {id: p18-b02, speaker: uncle_ma, text: 最先乱掉的铃声，是你听见的。今天还由你守后面。}
        - {id: p18-b03, speaker: narrator, text: 云生走到青柳身后。}
        - {id: p18-b04, speaker: narrator, text: 前方转过山弯，两只大铜铃响着，所有茶包都稳稳当当。}
