schema_version: 2
language: zh-CN
writer: 江笑
title: 茶马古道上的慢一天
summary: 清朝末年，云生随运茶的骡马队从丽江向北赶路。驮架受损以后，他和马叔必须在如期交货与保护骡马之间作出选择；绕远让大家付出了看得见的代价，也保住了完整的队伍。
chapters:
  - id: ch01
    title: 约好的日子
    page_refs: [p01, p02, p03, p04, p05, p06]
  - id: ch02
    title: 山口前的选择
    page_refs: [p07, p08, p09, p10, p11, p12]
  - id: ch03
    title: 迟到一天
    page_refs: [p13, p14, p15, p16, p17, p18]
questions:
  - id: q01
    type: cause-effect
    speaker: narrator
    prompt: 到达山口以前，马叔为什么一直催大家赶路？
    answer: 他答应第二天傍晚前把茶送到松风驿，收茶人随后就要离开，同行的人也等着拿工钱。
    page_refs: [p02, p03, p05]
  - id: q02
    type: evidence
    speaker: narrator
    prompt: 哪些情况说明青柳遇到的不只是茶包歪了？
    answer: 青柳的后蹄打滑，背上的毛被磨平；卸下茶包后，兰姐又发现驮架的横木裂了。
    page_refs: [p06, p07, p08]
  - id: q03
    type: compare
    speaker: narrator
    prompt: 翻山口和走林中小路，分别更符合马队的哪个目标？
    answer: 翻山口更快，更可能按时见到收茶人；林中小路更慢，却避开湿滑窄路，更能保护整支马队。
    page_refs: [p06, p09, p10, p12]
  - id: q04
    type: character-motive
    speaker: narrator
    prompt: 马叔起初不愿停很久，云生为什么还要再次开口？
    answer: 云生看见青柳的蹄子再次打滑，又发现驮架磨到了它的背，担心一头骡子受伤会拖住全队。
    page_refs: [p06, p07]
  - id: q05
    type: short-answer
    speaker: narrator
    prompt: 大家怎样带走青柳原来驮的茶，又没有让另一头骡子独自增加很多重量？
    answer: 几头原本较轻的骡子各分担一小包，云生自己背着卸空的坏驮架。
    page_refs: [p10, p11]
  - id: q06
    type: evaluate
    speaker: narrator
    prompt: 绕走林中小路让大家少赚了钱，这个选择仍然合理吗？请用故事中的两个结果说明。
    answer: 合理。大家到达时骡马都能继续走，茶包也没有受潮；原来的上山路后来还出现了新落石。不过，迟到确实让大家多付了住店钱，也少收了货款。
    page_refs: [p14, p15, p16, p17]
  - id: q07
    type: main-idea
    speaker: narrator
    prompt: 从开头到结尾，马叔对云生的看法发生了什么变化？
    answer: 起初，马叔主要要求云生跟上速度；后来，他相信云生能听出队尾的异常，把队尾的缰绳交给了云生。
    page_refs: [p03, p05, p18]
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: 清朝末年，一支从普洱来的
            - vocabulary: {id: caravan, text: 马帮}
            - text: 在丽江歇过脚，又要向北送茶。十四岁的云生第一次随队走远路。八头骡子都架着木驮架，两边的茶包绑得一样高。过了丽江，前面就是一重又一重的山。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 出发前，马叔挨个拉了拉绳结，又抬头看天。“明天傍晚前要赶到松风驿，”他对云生说，“收茶人后天一早就走。错过他，工钱也得跟着等。”院里的几个赶马人听见了，都默默加快了手脚。
    - id: p03
      illustration: p03
      paragraphs:
        - text: 天还没亮，铜铃就在石板路上响起来。云生管着队尾的两头骡子，心里只想着别落下。山路钻进云里以后，他每到转弯处都先出声提醒。马叔回头说：“现在走得稳。累了以后也要这么稳。”
    - id: p04
      illustration: p04
      paragraphs:
        - text: 中午，下起了雨。领头骡子的两只大铃仍有节奏，队尾却忽然传来两声乱响，接着安静了。云生马上回头。灰骡青柳身旁的一包茶向外斜着，连小铃也被绳子压住了。
    - id: p05
      illustration: p05
      paragraphs:
        - text: 兰姐托起茶包，云生重新收紧绳子。茶包看起来平了，云生还是不放心：“得把下面的木架也查一遍。”马叔望着山口上方的黑云说：“到了前面的平地再查。停久了，收茶人可不会等我们。”
    - id: p06
      illustration: p06
      paragraphs:
        - text: 山口越来越窄，冷雨顺着斜石往下流。青柳迈出一条后腿，蹄子下面的碎石就滚下坡。它把四条腿撑开，再也不肯向前。马叔刚拿过缰绳，云生便问：“能不能先卸茶？”
    - id: p07
      illustration: p07
      paragraphs:
        - text: “前面那块平地更适合停队。”马叔指着不远处。青柳勉强又走一步，后蹄再次一滑。云生摸到驮架下方，发现一片湿毛紧贴着皮肤，已经磨红了。“木架一直在动，”他说，“青柳摔了，全队更到不了。”
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: 马叔这才举手，让前面的骡子都停下。大家退到旁边的小平地，把青柳背上的
            - vocabulary: {id: cargo, text: 货物}
            - text: 一件件卸下。兰姐扒开湿绳，看见驮架的一根横木裂开了。每走一步，裂口就让木架向一边扭。
    - id: p09
      illustration: p09
      paragraphs:
        - text: 兰姐知道一条绕过山口的林中小路，可是要多走大半天。马叔仰头看近路，又低头看青柳。“同行的人等着工钱。”他的声音低了下来。兰姐回答：“这些骡子还得把回程的东西带回家。”
    - id: p10
      illustration: p10
      paragraphs:
        - text: 云生以为马叔还会往上走。马叔却转过领头骡子：“走林子。茶不能湿，每副担子也得平。”兰姐牵着卸空的青柳先走。云生把坏驮架扛到肩上，跟在它们后面下了坡。
    - id: p11
      illustration: p11
      paragraphs:
        - text: 到了树下，大家重新分茶包。几头原本驮得轻的骡子，各自多带一小包，而且两边重量相同。雨点落在包布上，没有碰到里面的茶。云生又摸了一遍绳结，才让队尾动身。
    - id: p12
      illustration: p12
      paragraphs:
        - text: 林中小路宽一些，泥和树根却拖慢了脚步。马叔没有再催。云生走在最后，听见大铃在前方领路，小铃在中间一声声回应。铃声并不整齐，他反而能听清每一头骡子走到了哪里。
    - id: p13
      illustration: p13
      paragraphs:
        - text: 入夜前，他们找到一间木棚。兰姐不让青柳驮东西，先查看它的背和腿。磨红的皮肤并没有破。马叔削出一块短木条，贴住裂开的横木；云生用绳子把两块木头一圈圈扎牢。
    - id: p14
      illustration: p14
      paragraphs:
        - text: 第二天早晨，云散了。从低处的路上望去，原来那段上山路多了不少新落石。云生不知道石头是什么时候掉下来的，也没有说他们一定会遇上。马叔看了一会儿，只挥手让大家继续赶路。
    - id: p15
      illustration: p15
      paragraphs:
        - text: 太阳快落山时，松风驿终于出现在坡下。他们比约好的日子晚了一天，院里收茶人的位置已经空了。罗掌柜摇头说：“今早走的，三天后才回来。”马叔抿紧嘴，却没有责怪云生。
    - id: p16
      illustration: p16
      paragraphs:
        - text: 罗掌柜查看每个茶包，见包布里面仍是干的，便把茶锁进库房。全队要多付三晚的住店钱，收茶人回来后还会压低价钱。马叔数出几枚钱，平静地说：“这就是迟到一天花掉的钱。”
    - id: p17
      illustration: p17
      paragraphs:
        - text: 三天后，收茶人回来拆开一包茶。茶没有受潮，八头骡子也都能继续赶路。他把整批茶收下，却少付了一些钱。交易结束后，兰姐换掉临时木条，又把青柳的驮架仔细收紧。
    - id: p18
      illustration: p18
      paragraphs:
        - text: 再次出发时，马叔把队尾的缰绳递给云生。“最先乱掉的铃声，是你听见的。今天还由你守后面。”云生走到青柳身后。前方转过山弯，两只大铜铃响着，所有茶包都稳稳当当。
