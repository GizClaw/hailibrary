      blocks:
        - {id: p15-b01, speaker: narrator, text: 太阳快落山时，松风马店终于出现在坡下。}
        - {id: p15-b02, speaker: narrator, text: 他们比约好的日子晚了一天，院里已经不见收茶人的身影。}
        - {id: p15-b03, speaker: narrator, text: 罗掌柜摇了摇头。}
        - {id: p15-b04, speaker: keeper_luo, text: 收茶人今早走了，三天后才回来。}
        - {id: p15-b05, speaker: narrator, text: 马叔沉默了一会儿，却没有责怪云生。}
    - id: p16
      illustration: p16
      blocks:
        - {id: p16-b01, speaker: narrator, text: 罗掌柜查看每个茶包，见包布里面仍是干的，便把茶锁进库房。}
        - {id: p16-b02, speaker: keeper_luo, text: 收茶人留下了话。迟到一天，他就少付一成茶钱。住店每人每晚两个铜钱。}
        - {id: p16-b03, speaker: uncle_ma, text: 店钱能不能少些？}
        - {id: p16-b04, speaker: narrator, text: 罗掌柜摇头。马叔沉默片刻，数出第一晚的钱。}
    - id: p17
      illustration: p17
      blocks:
        - {id: p17-b01, speaker: narrator, text: 三天后，收茶人回来拆开一包茶。}
        - {id: p17-b02, speaker: narrator, text: 茶没有受潮，八头骡子也都能继续赶路。}
        - {id: p17-b03, speaker: narrator, text: 他照罗掌柜说的价钱少付一成，收下整批茶。}
        - {id: p17-b04, speaker: narrator, text: 大家买好回程要带的货物，兰姐也拆下临时木条，换上了新的横木。}
    - id: p18
      illustration: p18
      blocks:
        - {id: p18-b01, speaker: narrator, text: 向南返回丽江时，马叔把青柳的缰绳递给云生。}
        - {id: p18-b02, speaker: uncle_ma, text: 青柳有动静，是你先听见的。今天再发现不对，自己叫全队停下，不用等我。}
        - {id: p18-b03, speaker: narrator, text: 云生握紧绳子，走到青柳前面，带着它守在队尾。}
        - {id: p18-b04, speaker: narrator, text: 前方转过山弯，两只大铜铃响着，回程的货包都稳稳当当。}
