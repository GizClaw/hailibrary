schema_version: 1
style: woodblock-print
aspect_ratio: "3:2"
embedded_text: prohibited
shared_by_all_locales: true
continuity:
  setting: Late Qing mountain trade route north of Lijiang, with stone paths, forested slopes, simple timber shelters, and no modern objects.
  caravan: Eight brown and gray mules with plain wooden pack frames, woven ropes, wrapped tea bundles, and one lead mule wearing two round copper bells.
  palette: Yunsheng indigo and rust; Uncle Ma forest green and rust; Lan mustard, indigo, and rust; Keeper Luo indigo and green; fibrous cream paper throughout.
assets:
  - {id: cover, file: artwork/cover.webp, scene: "Yunsheng stands between Uncle Ma and Lan beside a halted eight-mule tea caravan at a wet mountain fork, with the steep pass above and a lower forest path below; the lead mule's copper bells and wrapped tea bundles are clear, with no writing anywhere."}
  - {id: p01, file: artwork/p01.webp, scene: "At dawn outside late-Qing Lijiang, Yunsheng joins an eight-mule caravan loaded with wrapped compressed-tea bundles while tiled roofs and mountain passes rise behind."}
  - {id: p02, file: artwork/p02.webp, scene: Uncle Ma shows Yunsheng the sinking sun with gestures beside the caravan yard as workers secure cargo to wooden pack frames; all boards and bundles are blank.}
  - {id: p03, file: artwork/p03.webp, scene: "The caravan climbs a stone mountain trail under gathering clouds, Yunsheng walking proudly near the rear while Lan and Uncle Ma hold their places."}
  - {id: p04, file: artwork/p04.webp, scene: "On a narrow slope, Willow snorts and a rear tea bundle knocks against its wooden frame as it tilts; Yunsheng turns while the lead mule's copper bells remain farther ahead."}
  - {id: p05, file: artwork/p05.webp, scene: Lan straightens the shifted bundle on the gray mule Willow while Yunsheng steadies the rope and Uncle Ma watches the darkening pass.}
  - {id: p06, file: artwork/p06.webp, scene: "At the high pass entrance, cold rain shines on stone; Willow braces and refuses a narrow sloping section while loose pebbles fall below."}
  - {id: p07, file: artwork/p07.webp, scene: Yunsheng points to a rubbed patch beneath Willow's tilted wooden pack frame and to the mule's sliding rear hoof as Uncle Ma weighs the warning.}
  - {id: p08, file: artwork/p08.webp, scene: "In a small level hollow, the crew unloads wrapped tea bundles and discovers a cracked wooden crosspiece on Willow's pack frame."}
  - {id: p09, file: artwork/p09.webp, scene: Uncle Ma studies the steep upper pass and the lower forest path while Yunsheng and Lan wait beside the unloaded mule in steady cold rain.}
  - {id: p10, file: artwork/p10.webp, scene: "The caravan carefully turns away from the pass entrance toward a lower forest path, Yunsheng carrying the empty cracked frame and Lan leading Willow."}
  - {id: p11, file: artwork/p11.webp, scene: "Under trees, small tea bundles from Willow are shared among several lightly loaded mules, with balanced pairs and no animal shown overloaded."}
  - {id: p12, file: artwork/p12.webp, scene: The longer forest trail curves through wet pines; the eight mules move slowly in a line while Yunsheng listens from the rear and copper bells lead ahead.}
  - {id: p13, file: artwork/p13.webp, scene: "At a dry timber shelter, Willow rests without a load while Lan checks its back and Uncle Ma and Yunsheng bind the cracked frame with rope and a wooden brace."}
  - {id: p14, file: artwork/p14.webp, scene: "From the lower path the next morning, the caravan sees fresh stones scattered across part of the upper trail they had left; nobody approaches the fallen rock."}
  - {id: p15, file: artwork/p15.webp, scene: "The caravan arrives late at Pine Wind Post after the buyer has gone, and Keeper Luo stands in the quiet yard beside a blank wooden tally board."}
  - {id: p16, file: artwork/p16.webp, scene: Keeper Luo stores the dry tea bundles inside a timber warehouse while Uncle Ma counts a few coins for extra lodging and Yunsheng watches.}
  - {id: p17, file: artwork/p17.webp, scene: Three days later the buyer examines intact wrapped tea bundles at the post while Willow stands rested with the repaired frame and the crew receives payment.}
  - {id: p18, file: artwork/p18.webp, scene: "At the departure for Lijiang, Uncle Ma gives Yunsheng the rear rope; the complete mule team begins its return journey with copper bells leading and every bundle of return goods level."}
