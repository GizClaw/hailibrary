schema_version: 1
required: true
historical_scope: The story is original historical fiction set in the late Qing dynasty on the Yunnan-Tibet branch of the Tea Horse Road, north of Lijiang. Yunsheng, Uncle Ma, Lan, Keeper Luo, Pine Wind Post, the deadline, the damaged pack frame, the prices, and the storm are fictional. Lan's work as a woman mule handler is a historically uncommon element that the story presents without comment; the cited 2005 report establishes that a woman worked as a muleteer and led a caravan that year, but it does not establish how often women traveled with late-Qing caravans.
sources:
  - url: https://whc.unesco.org/en/list/811
    title: Old Town of Lijiang
    publisher: UNESCO World Heritage Centre
    supports: From the twelfth century onward, Lijiang was a goods-distribution center for trade among Sichuan, Yunnan, and Tibet at the meeting of the southern Silk Road and Tea Horse Roads; its setting includes strategic mountain passes.
  - url: https://www.tianmen.gov.cn/csly/cwh/201611/t20161130_1932216.shtml
    title: 茶马古道·普洱茶
    publisher: 天门市人民政府（转载茶业研究资料）
    supports: The Yunnan-Tibet route carried compressed Yunnan tea by pack caravans from Pu'er through Dali, Lijiang, and Zhongdian toward Tibet; the route crossed high mountains and deep valleys, and this trade expanded strongly in the Ming and Qing periods.
  - url: https://www.npc.gov.cn/c2/c30834/202411/t20241101_440355.html
    title: 茶马古道：各民族交往交流交融的见证
    publisher: 中国人大网
    supports: Tea moved from Yunnan and Sichuan toward Tibet, horses and other products moved in return, and the tea-horse trade remained important through the Ming and Qing dynasties.
  - url: https://www.sky.yn.gov.cn/ztzl/yq30zn/zgwj/mzwxs/0686547483519150870
    title: 滇藏茶马古道与宗教文化
    publisher: 云南省社会科学院
    supports: The Yunnan-Tibet route linked Pu'er and Simao with Lijiang and Tibetan trade; historical records describe tea production and exchange during the Qing dynasty and caravans traveling between Lijiang and the southern tea centers.
  - url: https://wlt.xizang.gov.cn/xccx/lytg/202011/t20201127_183054.html
    title: 踏访茶马古道：探寻往来滇藏间的马帮精神
    publisher: 西藏自治区文化和旅游厅
    supports: The Yunnan-Tibet Tea Horse Road was an old trade route using caravans to exchange Yunnan tea, iron, salt, and other goods with horses, medicinal materials, woolen cloth, and other products from Tibet.
  - url: https://www.peds.gov.cn/zx_nr.asp?id=5731
    title: 茶马古道壮丽人文
    publisher: 中国共产党普洱市委员会党史研究室
    supports: Historical caravan cargo was tied to wooden pack frames; bells helped handlers hear changes within the line and warn approaching caravans on narrow or steep sections.
  - url: https://www.montana.edu/extension/ravalli/documents/4HHorsePackingManual.pdf
    title: 4-H Horse Packing Manual
    publisher: Montana State University Extension
    supports: Side-to-side load balance is important for a pack horse or mule, both for how the load rides and for avoiding sores.
  - url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10613475/
    title: The history and welfare of working mules in the valleys of the Toubkal massif, in the High Atlas of Morocco
    publisher: Frontiers in Veterinary Science via PubMed Central
    supports: Pack-saddle tack and poorly fitted or maintained pack saddles are associated with rubbed skin and wounds on working mules.
  - url: https://www.cctv.com/folklore/20051024/101591.shtml
    title: 马帮：一种渐行渐远的行走文化
    publisher: 央视国际（来源：中国青年报）
    supports: A 2005 report identifies Geda Na as the head muleteer (总马锅头) and only woman on that year's 168-day caravan trek to Beijing. It also records that she had previously worked in a state-run caravan that supplied the Dulong River gorge for about forty years before disbanding when the road opened in 2000. This supports the existence and uncommonness of women muleteers, not a claim that their participation was routine in the late Qing dynasty.
notes: Weather, trail failure, animal reactions, repairs, prices, and travel time are presented only as events in this invented journey. The stated late-delivery discount and lodging rate are fictional terms used to make the tradeoff concrete. The story does not claim that stopping caused the later rockfall; the characters see only that the dangerous section changed after they turned back.
