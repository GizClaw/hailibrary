assets:
  - id: cover
    file: artwork/cover.webp
    scene: 愚公在两座大山前画出一条向南的路，阿莲和智叟从两侧观察。
    prompt: "Wide cover composition at an ancient Chinese village beneath two immense mountains. In the foreground Yugong, an elderly Chinese villager with swept-back white hair, a short white beard, an indigo cross-collar tunic, rust-red sash, cream trousers, straw sandals, and a straight wooden staff, draws a direct line through damp earth toward the mountains. Lian, an elderly Chinese village woman with silver hair in a low coil, a forest-green cross-collar jacket, mustard apron, dark indigo trousers, straw sandals, and a sturdy woven carrying basket, studies the hard slope. Zhisou, an elderly Chinese villager with a narrow gray beard, a mustard robe under a rust-red vest, an indigo cloth cap, a knotted walking cane, and a small two-wheeled handcart, watches from the other side. Keep faces clear, mountains dominant, and the route visually legible. No written marks or signage."
  - id: p01
    file: artwork/p01.webp
    scene: 两座山挡住村口，村民推着陷在泥里的车绕行。
    prompt: "Establishing wide view of an ancient Chinese village north of two towering mountains. A family struggles with a wooden cart stuck in a muddy detour while the direct southern way is blocked by rock. Show the long winding path and fading evening light, with villagers small against the mountains. No featured main characters and no written marks."
  - id: p02
    file: artwork/p02.webp
    scene: 愚公在泥地上画直线，望向山壁。
    prompt: "Medium-wide view at dawn. Yugong, an elderly Chinese villager with swept-back white hair, a short white beard, an indigo cross-collar tunic, rust-red sash, cream trousers, straw sandals, and a straight wooden staff, uses the staff to draw a line from the village gate toward the meeting place of the two mountains. Wind lifts his hair; keep the line, his intent gaze, and the stone barrier in focus."
  - id: p03
    file: artwork/p03.webp
    scene: 晚饭桌边，愚公提出开路，阿莲认真发问。
    prompt: "Interior evening scene around a low wooden table. Yugong, an elderly Chinese villager with swept-back white hair, a short white beard, an indigo cross-collar tunic, rust-red sash, cream trousers, straw sandals, and a straight wooden staff, traces an imagined route across the tabletop. Lian, an elderly Chinese village woman with silver hair in a low coil, a forest-green cross-collar jacket, mustard apron, dark indigo trousers, straw sandals, and a sturdy woven carrying basket, studies him beside a bowl of soup. Their posture shows a serious proposal and a practical challenge; mountains are visible through the open doorway."
  - id: p04
    file: artwork/p04.webp
    scene: 阿莲试背半筐石头，发现山土下面是硬石。
    prompt: "At the mountain foot, Lian, an elderly Chinese village woman with silver hair in a low coil, a forest-green cross-collar jacket, mustard apron, dark indigo trousers, straw sandals, and a sturdy woven carrying basket, kneels beside scraped soil that reveals blue-gray hard stone, then tests her half-filled basket as its straps press into her hands. Yugong, an elderly Chinese villager with swept-back white hair, a short white beard, an indigo cross-collar tunic, rust-red sash, cream trousers, straw sandals, and a straight wooden staff, stands near a charcoal mark on the low rock face. Emphasize weight, hard material, and careful inspection."
  - id: p05
    file: artwork/p05.webp
    scene: 智叟带着装好行李的小车，提出搬到山南。
    prompt: "Zhisou, an elderly Chinese villager with a narrow gray beard, a mustard robe under a rust-red vest, an indigo cloth cap, a knotted walking cane, and a small two-wheeled handcart, arrives beside the marked rock face; his handcart carries a cooking pot, rolled sleeping mat, and tied bundles. Yugong, an elderly Chinese villager with swept-back white hair, a short white beard, an indigo cross-collar tunic, rust-red sash, cream trousers, straw sandals, and a straight wooden staff, and Lian, an elderly Chinese village woman with silver hair in a low coil, a forest-green cross-collar jacket, mustard apron, dark indigo trousers, straw sandals, and a sturdy woven carrying basket, turn toward him as he gestures around the mountain toward the south."
  - id: p06
    file: artwork/p06.webp
    scene: 三人推拉小车，车轮卡在乱石坡。
    prompt: "Dynamic side view on a rough mountain detour. Zhisou, an elderly Chinese villager with a narrow gray beard, a mustard robe under a rust-red vest, an indigo cloth cap, a knotted walking cane, and a small two-wheeled handcart, pulls his loaded handcart. Yugong, an elderly Chinese villager with swept-back white hair, a short white beard, an indigo cross-collar tunic, rust-red sash, cream trousers, straw sandals, and a straight wooden staff, and Lian, an elderly Chinese village woman with silver hair in a low coil, a forest-green cross-collar jacket, mustard apron, dark indigo trousers, straw sandals, and a sturdy woven carrying basket, push behind him. One wheel hangs between rocks and their sandals slip in damp soil; show the pot and mat securely tied as the obstacle."
  - id: p07
    file: artwork/p07.webp
    scene: 三人终于到达山南，却回望被山遮住的村庄。
    prompt: "Sunset on the south side of the mountains. Zhisou, an elderly Chinese villager with a narrow gray beard, a mustard robe under a rust-red vest, an indigo cloth cap, a knotted walking cane, and a small two-wheeled handcart, rubs his blistered palms beside the cart. Lian, an elderly Chinese village woman with silver hair in a low coil, a forest-green cross-collar jacket, mustard apron, dark indigo trousers, straw sandals, and a sturdy woven carrying basket, presses one sore shoulder. Yugong, an elderly Chinese villager with swept-back white hair, a short white beard, an indigo cross-collar tunic, rust-red sash, cream trousers, straw sandals, and a straight wooden staff, studies the ridge that completely hides their village. Warm southern fields stretch behind the tired trio."
  - id: p08
    file: artwork/p08.webp
    scene: 阿莲指出不是每户人家都能搬走，智叟沉默看着行李。
    prompt: "Quiet medium group scene beside the handcart at sunset. Lian, an elderly Chinese village woman with silver hair in a low coil, a forest-green cross-collar jacket, mustard apron, dark indigo trousers, straw sandals, and a sturdy woven carrying basket, points back toward the hidden village while questioning the plan. Zhisou, an elderly Chinese villager with a narrow gray beard, a mustard robe under a rust-red vest, an indigo cloth cap, a knotted walking cane, and a small two-wheeled handcart, looks down at his tied household bundles, his earlier confidence gone. Yugong, an elderly Chinese villager with swept-back white hair, a short white beard, an indigo cross-collar tunic, rust-red sash, cream trousers, straw sandals, and a straight wooden staff, listens without triumph. Keep the distant ridge large and the human dilemma visible through gesture."
  - id: p09
    file: artwork/p09.webp
    scene: 黑夜里，三人扶着车沿石壁返回村庄。
    prompt: "Night journey along the narrow detour. Yugong, an elderly Chinese villager with swept-back white hair, a short white beard, an indigo cross-collar tunic, rust-red sash, cream trousers, straw sandals, and a straight wooden staff; Lian, an elderly Chinese village woman with silver hair in a low coil, a forest-green cross-collar jacket, mustard apron, dark indigo trousers, straw sandals, and a sturdy woven carrying basket; and Zhisou, an elderly Chinese villager with a narrow gray beard, a mustard robe under a rust-red vest, an indigo cloth cap, a knotted walking cane, and a small two-wheeled handcart, take turns steadying the small cart beside a steep stone wall under moonlight. Show weariness, careful feet, and the winding route leading back toward a few village lamps."
  - id: p10
    file: artwork/p10.webp
    scene: 阿莲在灯下修筐，并要求先安排劳作和休息。
    prompt: "Warm lamplit home interior. Lian, an elderly Chinese village woman with silver hair in a low coil, a forest-green cross-collar jacket, mustard apron, dark indigo trousers, straw sandals, and a sturdy woven carrying basket, threads new hemp rope through the rim of her worn basket. Yugong, an elderly Chinese villager with swept-back white hair, a short white beard, an indigo cross-collar tunic, rust-red sash, cream trousers, straw sandals, and a straight wooden staff, places a dull chisel on the table and listens. Their blistered feet are wrapped, household tools wait nearby, and their calm expressions show a plan becoming practical."
  - id: p11
    file: artwork/p11.webp
    scene: 第一凿落下，只打出豆大的石屑。
    prompt: "Crisp morning at the marked rock face. Yugong, an elderly Chinese villager with swept-back white hair, a short white beard, an indigo cross-collar tunic, rust-red sash, cream trousers, straw sandals, and a straight wooden staff, strikes a chisel and one bean-sized chip flies from the hard stone. Lian, an elderly Chinese village woman with silver hair in a low coil, a forest-green cross-collar jacket, mustard apron, dark indigo trousers, straw sandals, and a sturdy woven carrying basket, waits safely aside with the repaired basket. Birds lift from grass, and the tiny new notch contrasts with the enormous mountains."
  - id: p12
    file: artwork/p12.webp
    scene: 智叟量着小缺口，愚公坐在石上仍决定明年继续。
    prompt: "Late-day medium-wide scene after the first workday. Zhisou, an elderly Chinese villager with a narrow gray beard, a mustard robe under a rust-red vest, an indigo cloth cap, a knotted walking cane, and a small two-wheeled handcart, measures the tiny notch with his cane. Yugong, an elderly Chinese villager with swept-back white hair, a short white beard, an indigo cross-collar tunic, rust-red sash, cream trousers, straw sandals, and a straight wooden staff, sits rubbing his wrist. Lian, an elderly Chinese village woman with silver hair in a low coil, a forest-green cross-collar jacket, mustard apron, dark indigo trousers, straw sandals, and a sturdy woven carrying basket, sorts the few fallen stones. The repaired basket and first stones on the muddy road show a modest result; expressions are serious but gently amused."
