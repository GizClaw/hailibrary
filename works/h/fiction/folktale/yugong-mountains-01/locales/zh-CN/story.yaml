schema_version: 3
language: zh-CN
writer: 百径灯
title: 愚公试两条路
summary: 愚公想在山中开路，阿莲和智叟让他先看清搬家与开山各自的难处。
chapters:
  - {id: c01, title: 山挡住了路, page_refs: [p01, p02, p03, p04]}
  - {id: c02, title: 先试一试搬家, page_refs: [p05, p06, p07, p08]}
  - {id: c03, title: 第一凿, page_refs: [p09, p10, p11, p12]}
questions:
  - {id: q01, type: sequence, prompt: 三人先试了什么办法？, answer: 他们先推着智叟的小车绕山去山南。, page_refs: [p05, p06, p07]}
  - {id: q02, type: cause-effect, prompt: 什么困难让试走一直持续到日落？, answer: 车轮不断被乱石卡住，三人在湿滑的山路上走得很慢。, page_refs: [p06, p07]}
  - {id: q03, type: character-motive, prompt: 愚公为什么让阿莲决定何时停工？, answer: 阿莲试过运石的辛苦，愚公相信她安排劳作和休息的办法。, page_refs: [p04, p10]}
  - {id: q04, type: short-answer, prompt: 第一天开山有什么结果？, answer: 硬石只掉下一粒小石屑，留下一个小缺口。, page_refs: [p11, p12]}
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - {text: 很久以前，两座大山挡在村子南面。村民去田地或集市，只能推车绕过又长又泥泞的山路。}
    - id: p02
      illustration: p02
      paragraphs:
        - {text: 一辆送病人的车又陷进泥里。第二天，年迈的愚公在地上画了一条直线，一直指向山南。}
    - id: p03
      illustration: p03
      paragraphs:
        - {text: 晚饭时，愚公说想从山中间开路。阿莲问他：“硬石怎么凿？挖下来的石头又放在哪儿？”}
    - id: p04
      illustration: p04
      paragraphs:
        - {text: 他们到山脚试了试。土下很快露出硬石。阿莲只背半筐碎石，手掌就被筐绳勒痛了。}
    - id: p05
      illustration: p05
      paragraphs:
        - {text: 智叟推来装着锅和席子的小车。他说：“搬到山南更省力。你们先跟我走一趟吧。”}
    - id: p06
      illustration: p06
      paragraphs:
        - {text: 三人推车上路。车轮在乱石间一会儿卡住，一会儿悬空。他们忙了一整天，才绕出谷口。}
    - id: p07
      illustration: p07
      paragraphs:
        - {text: 山南的田野就在夕阳下。可愚公回头时，山脊挡住了村里的屋顶、井和泥路。}
    - id: p08
      illustration: p08
      paragraphs:
        - {text: 阿莲问：“我们搬了，走不了远路的老人怎么办？”智叟看着车上的家当，一时没有回答。}
    - id: p09
      illustration: p09
      paragraphs:
        - {text: 他们摸黑把车推回村子。搬家有尽头，却只帮得了一户。开山很慢，却能留下大家的路。}
    - id: p10
      illustration: p10
      paragraphs:
        - {text: 阿莲在灯下修好旧筐。她说要先安排干活、休息和家务，还让愚公累了就停手。}
    - id: p11
      illustration: p11
      paragraphs:
        - {text: 霜降前，愚公打下第一凿。铁声惊飞小鸟，可硬石上只掉下一粒豆大的石屑。}
    - id: p12
      illustration: p12
      paragraphs:
        - {text: 智叟量着小缺口，问愚公能有几个秋天。愚公揉着手腕说：“明年就从第二角往下凿。”}
