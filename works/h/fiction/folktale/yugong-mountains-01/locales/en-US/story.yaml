schema_version: 3
language: en-US
writer: manypath-lantern
title: Yu Tries Two Roads
summary: Old Man Yu wants to cut a road through the mountains, but Lian and Zhisou make him test both plans first.
chapters:
  - {id: c01, title: "Mountains in the Way", page_refs: [p01, p02, p03, p04]}
  - {id: c02, title: "Trying the Move", page_refs: [p05, p06, p07, p08]}
  - {id: c03, title: "The First Chip", page_refs: [p09, p10, p11, p12]}
questions:
  - {id: q01, type: sequence, prompt: "Which plan did the three people test first?", answer: "They pushed Zhisou's cart around the mountains.", page_refs: [p05, p06, p07]}
  - {id: q02, type: cause-effect, prompt: "What made the trial journey last until sunset?", answer: "The cart wheels caught in rocks while the travelers slipped on the damp trail.", page_refs: [p06, p07]}
  - {id: q03, type: character-motive, prompt: "Why did Yu let Lian decide when he must stop working?", answer: "Her test showed how hard carrying stone was, so he trusted her plan for work and rest.", page_refs: [p04, p10]}
  - {id: q04, type: short-answer, prompt: "What changed after the first workday?", answer: "A tiny corner was gone and some stones lay on the road.", page_refs: [p11, p12]}
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - {text: "Long ago, two mountains blocked a village from the south. Families had to push their carts around a long, muddy road."}
    - id: p02
      illustration: p02
      paragraphs:
        - {text: "A cart carrying a sick child became stuck. The next morning, Old Man Yu drew a straight line toward the south."}
    - id: p03
      illustration: p03
      paragraphs:
        - {text: "At dinner Yu proposed a road through the mountains. Lian asked how they would break and carry the hard stone."}
    - id: p04
      illustration: p04
      paragraphs:
        - {text: "They tested the slope. Hard rock hid under the soil. Half a basket of stones hurt Lian's hands."}
    - id: p05
      illustration: p05
      paragraphs:
        - {text: "Zhisou arrived with a loaded cart. “Moving south is easier,” he said. “Come try the journey with me.”"}
    - id: p06
      illustration: p06
      paragraphs:
        - {text: "They pushed and pulled all day. The wheels caught between rocks, and their feet slipped on the damp trail."}
    - id: p07
      illustration: p07
      paragraphs:
        - {text: "At sunset they reached the southern fields. Looking back, Yu could not see the village beyond the high ridge."}
    - id: p08
      illustration: p08
      paragraphs:
        - {text: "“What about neighbors who cannot move?” Lian asked. Zhisou looked at his bundles and had no quick answer."}
    - id: p09
      illustration: p09
      paragraphs:
        - {text: "They guided the cart home in darkness. Moving could help one family, but a road could help the whole village."}
    - id: p10
      illustration: p10
      paragraphs:
        - {text: "Lian repaired the basket. She planned work, rest, and chores. Yu agreed to stop when she told him."}
    - id: p11
      illustration: p11
      paragraphs:
        - {text: "Before winter, Yu struck the first chisel blow. Birds flew up, but only one tiny chip broke free."}
    - id: p12
      illustration: p12
      paragraphs:
        - {text: "Zhisou measured the notch and asked how many autumns Yu had. “Next year, we start with the second chip,” Yu replied."}
