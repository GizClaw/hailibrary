assets:
  - id: cover
    file: artwork/cover.webp
    scene: 小君把小筐递向年轻工人，愚公站在逐渐深入的山口旁。
    prompt: "Wide cover scene at the growing cut between two immense mountains. Jun, a Chinese village girl with two short black braids tied with rust-red cords, mustard tunic, forest-green trousers, cloth shoes, padded shoulder cloth, and tiny round woven basket, carries loose stones beside young villagers lifting hammers. Yugong, an elderly Chinese villager with swept-back white hair, short white beard, indigo cross-collar tunic, rust-red sash, cream trousers, straw sandals, and straight wooden staff, watches from the opened path. Keep the child and passed-on work central, the mountain gap clearly visible, and all tools safely separated from Jun."
  - id: p01
    file: artwork/p01.webp
    scene: 小君在安全距离外看大人凿山，母亲拦住她靠近。
    prompt: "Medium-wide view of workers striking a marked rock face while Jun, a Chinese village girl with two short black braids tied with rust-red cords, a mustard tunic, forest-green trousers, cloth shoes, and a padded shoulder cloth, watches from a clearly safe distance. The tiny round woven basket that completes her recurring visual identity is not present yet because she has not begun carrying stones. Her mother gently holds one shoulder, and small chips remain confined near the hammers. Show Jun's wish to help through her forward posture."
  - id: p02
    file: artwork/p02.webp
    scene: 阿莲从小君的小筐里取出一半石头。
    prompt: "Close group view on the gravel path. Jun, a Chinese village girl with two short black braids tied with rust-red cords, a mustard tunic, forest-green trousers, cloth shoes, a padded shoulder cloth, and a tiny round woven basket, holds her basket. Lian, an elderly Chinese village woman with silver hair in a low coil, a forest-green cross-collar jacket, mustard apron, dark indigo trousers, straw sandals, and a sturdy woven carrying basket, removes half the stones. Emphasize the light safe load, padded shoulder cloth, and their attentive expressions."
  - id: p03
    file: artwork/p03.webp
    scene: 村民在不再陷车的碎石路旁带来锤子和木楔。
    prompt: "Busy village-road scene after rain. A wooden cart rolls firmly across newly laid gravel while several villagers arrive with hammers, wooden wedges, and a food basket. Yugong, an elderly Chinese villager with swept-back white hair, a short white beard, an indigo cross-collar tunic, rust-red sash, cream trousers, straw sandals, and a straight wooden staff, indicates an opened crack at the distant work face. Jun, a Chinese village girl with two short black braids tied with rust-red cords, a mustard tunic, forest-green trousers, cloth shoes, a padded shoulder cloth, and a tiny round woven basket, stays with loose stones away from striking tools."
  - id: p04
    file: artwork/p04.webp
    scene: 冬夜里阿莲替手抖的愚公系工具绳，窗外孩子扫雪。
    prompt: "Warm winter interior beside a small hearth. Yugong, an elderly Chinese villager with swept-back white hair, a short white beard, an indigo cross-collar tunic, rust-red sash, cream trousers, straw sandals, and a straight wooden staff, rests his trembling hand near a tool handle. Lian, an elderly Chinese village woman with silver hair in a low coil, a forest-green cross-collar jacket, mustard apron, dark indigo trousers, straw sandals, and a sturdy woven carrying basket, ties its cord for him. Through the open window, Jun, a Chinese village girl with two short black braids tied with rust-red cords, a mustard tunic, forest-green trousers, cloth shoes, a padded shoulder cloth, and a tiny round woven basket, and other children use branches to clear snow from the first gravel section. Keep the contrast between aging hands and active children clear."
  - id: p05
    file: artwork/p05.webp
    scene: 开春时年轻人已在山脚开工，长高的小君继续运石。
    prompt: "Bright spring morning at the mountain cut. Young villagers are already driving wedges and lifting hammers as Yugong, an elderly Chinese villager with swept-back white hair, a short white beard, an indigo cross-collar tunic, rust-red sash, cream trousers, straw sandals, and a straight wooden staff, arrives. Jun, a Chinese village girl now visibly a little taller, with two short black braids tied with rust-red cords, a mustard tunic, forest-green trousers, cloth shoes, a padded shoulder cloth, and a tiny round woven basket, carries her basket along the safe gravel lane."
  - id: p06
    file: artwork/p06.webp
    scene: 智叟停车追问愚公，年轻人从老人手中接过锤子。
    prompt: "Balanced medium scene beside the worksite. Zhisou, an elderly Chinese villager with a narrow gray beard, a mustard robe under a rust-red vest, an indigo cloth cap, a knotted walking cane, and a small two-wheeled handcart, questions Yugong, an elderly Chinese villager with swept-back white hair, a short white beard, an indigo cross-collar tunic, rust-red sash, cream trousers, straw sandals, and a straight wooden staff. Behind them a young worker takes the hammer and strikes the seam Yugong indicated. Jun, a Chinese village girl with two short black braids tied with rust-red cords, a mustard tunic, forest-green trousers, cloth shoes, a padded shoulder cloth, and a tiny round woven basket, passes with her basket empty."
  - id: p07
    file: artwork/p07.webp
    scene: 守山神在山腹石座上听见逐年靠近的锤声。
    prompt: "Inside a vast mountain chamber, the tall guardian spirit with weathered stone-gray face, long cloudlike white brows, indigo layered robe edged in forest green, and crooked pine-wood staff rises from a stone seat. Fine dust shakes from the ceiling as faint repeated blows approach through several visible layers of rock."
  - id: p08
    file: artwork/p08.webp
    scene: 守山神乘云禀告天帝，并指向下方由老人传给年轻人的劳作。
    prompt: "High sweeping composition above the twin mountains. The guardian, a tall mountain guardian spirit with a weathered stone-gray face, long cloudlike white brows, an indigo layered robe edged in forest green, and a crooked pine-wood staff, rises on curling clouds and reports to a distant Ruler of Heaven at a bright celestial threshold, pointing honestly toward the cut below. At the cut Yugong, an elderly Chinese villager with swept-back white hair, a short white beard, an indigo cross-collar tunic, rust-red sash, cream trousers, straw sandals, and a straight wooden staff, rests while younger villagers continue the same line of work. Show successive road sections and changing seasons as subtle landscape bands."
  - id: p09
    file: artwork/p09.webp
    scene: 夜里两位大力神抬起大山，村中的水碗轻轻晃动。
    prompt: "Legendary moonlit wide view with two colossal, dignified strong brothers lifting Taihang and Wangwu from opposite sides beyond the sleeping village. In a foreground doorway Lian, an elderly Chinese village woman with silver hair in a low coil, a forest-green cross-collar jacket, mustard apron, dark indigo trousers, straw sandals, and a sturdy woven carrying basket, steadies a gently trembling water bowl. Beside her Yugong, an elderly Chinese villager with swept-back white hair, a short white beard, an indigo cross-collar tunic, rust-red sash, cream trousers, straw sandals, and a straight wooden staff, listens upright in darkness. Keep the supernatural action solemn and nonviolent."
  - id: p10
    file: artwork/p10.webp
    scene: 清晨阳光穿过原来的山口，新路伸向南方田野。
    prompt: "Sunrise establishing view from the village gate. Unblocked southern light crosses the well and roofs, and a broad level road reaches straight to warm fields. The two mountains now stand tiny at distant eastern and southern horizons as villagers gather in astonishment."
