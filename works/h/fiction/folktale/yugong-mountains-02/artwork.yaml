    file: artwork/p11.webp
    scene: 小君在新路旁寻找旧缺口，碎石间冒出细草。
    prompt: "Low medium view beside the open road. Jun, a Chinese village girl with two short black braids tied with rust-red cords, a mustard tunic, forest-green trousers, cloth shoes, a padded shoulder cloth, and a tiny round woven basket, kneels where the first notch used to be, her basket hanging empty, while one thin green shoot rises between stones of the remaining gravel section. Other villagers test the new road with carts in the softly focused distance."
  - id: p12
    file: artwork/p12.webp
    scene: 愚公和智叟并肩推车回家，阿莲刚系好车绳。
    prompt: "Warm closing view on the new road. Zhisou, an elderly Chinese villager with a narrow gray beard, a mustard robe under a rust-red vest, an indigo cloth cap, a knotted walking cane, and a small two-wheeled handcart, and Yugong, an elderly Chinese villager with swept-back white hair, a short white beard, an indigo cross-collar tunic, rust-red sash, cream trousers, straw sandals, and a straight wooden staff, walk side by side pushing the cart toward the village. Lian, an elderly Chinese village woman with silver hair in a low coil, a forest-green cross-collar jacket, mustard apron, dark indigo trousers, straw sandals, and a sturdy woven carrying basket, has just tightened a loose rope. Jun, a Chinese village girl with two short black braids tied with rust-red cords, a mustard tunic, forest-green trousers, cloth shoes, a padded shoulder cloth, and a tiny round woven basket, passes with her basket empty. Keep the stable wheels and open southern light prominent."
