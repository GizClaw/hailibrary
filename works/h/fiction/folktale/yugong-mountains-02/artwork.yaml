schema_version: 2
style: woodblock-print
aspect_ratio: "3:2"
embedded_text: prohibited
shared_by_all_locales: true
assets:
  - id: cover
    file: artwork/cover.webp
    scene: 小君把小筐递向年轻工人，愚公站在逐渐深入的山口旁。
    prompt: "Wide cover scene at the growing cut between two immense mountains. Jun, a Chinese village girl with two short black braids tied with rust-red cords, mustard tunic, forest-green trousers, cloth shoes, padded shoulder cloth, and tiny round woven basket, carries loose stones beside young villagers lifting hammers. Yugong, an elderly Chinese villager with swept-back white hair, short white beard, indigo cross-collar tunic, rust-red sash, cream trousers, straw sandals, and straight wooden staff, watches from the opened path. Keep the child and passed-on work central, the mountain gap clearly visible, and all tools safely separated from Jun."
  - id: p01
    file: artwork/p01.webp
    scene: 小君在安全距离外看大人凿山，母亲拦住她靠近。
    prompt: "Medium-wide view of workers striking a marked rock face while Jun, with two short black braids, mustard tunic, forest-green trousers, cloth shoes, and padded shoulder cloth, watches from a clearly safe distance. Her mother gently holds one shoulder, and small chips remain confined near the hammers. Show Jun's wish to help through her forward posture."
  - id: p02
    file: artwork/p02.webp
    scene: 阿莲从小君的小筐里取出一半石头。
    prompt: "Close group view on the gravel path. Jun holds her tiny round basket as Lian, an elderly woman with silver hair in a low coil, forest-green jacket, mustard apron, dark indigo trousers, straw sandals, and sturdy woven basket, removes half the stones. Emphasize the light safe load, padded shoulder cloth, and their attentive expressions."
  - id: p03
    file: artwork/p03.webp
    scene: 村民在不再陷车的碎石路旁带来锤子和木楔。
    prompt: "Busy village-road scene after rain. A wooden cart rolls firmly across newly laid gravel while several villagers arrive with hammers, wooden wedges, and a food basket. Yugong indicates an opened crack at the distant work face; Jun stays with loose stones away from striking tools."
  - id: p04
    file: artwork/p04.webp
    scene: 冬夜里阿莲替手抖的愚公系工具绳，窗外孩子扫雪。
    prompt: "Warm winter interior beside a small hearth. Yugong's trembling hand rests near a tool handle while Lian ties its cord for him. Through the open window, Jun and other children use branches to clear snow from the first gravel section. Keep the contrast between aging hands and active children clear."
  - id: p05
    file: artwork/p05.webp
    scene: 开春时年轻人已在山脚开工，长高的小君继续运石。
    prompt: "Bright spring morning at the mountain cut. Young villagers are already driving wedges and lifting hammers as Yugong arrives with his straight staff. Jun, visibly a little taller but in the same mustard tunic and green trousers, carries her tiny basket along the safe gravel lane."
  - id: p06
    file: artwork/p06.webp
    scene: 智叟停车追问愚公，年轻人从老人手中接过锤子。
    prompt: "Balanced medium scene beside the worksite. Zhisou, with narrow gray beard, mustard robe, rust-red vest, indigo cap, knotted cane, and loaded two-wheeled handcart, questions Yugong. Behind them a young worker takes the hammer and strikes the seam Yugong indicated, while Jun passes with an empty basket."
  - id: p07
    file: artwork/p07.webp
    scene: 守山神在山腹石座上听见逐年靠近的锤声。
    prompt: "Inside a vast mountain chamber, the tall guardian spirit with weathered stone-gray face, long cloudlike white brows, indigo layered robe edged in forest green, and crooked pine-wood staff rises from a stone seat. Fine dust shakes from the ceiling as faint repeated blows approach through several visible layers of rock."
  - id: p08
    file: artwork/p08.webp
    scene: 守山神乘云上天，俯看老人和新工人轮换劳作。
    prompt: "High sweeping composition above the twin mountains. The guardian spirit rises on curling clouds toward a bright heavenly opening while looking down at the cut below, where elderly Yugong rests and younger villagers continue the same line of work. Show successive road sections and changing seasons as subtle landscape bands."
  - id: p09
    file: artwork/p09.webp
    scene: 夜里两位大力神抬起大山，村中的水碗轻轻晃动。
    prompt: "Legendary moonlit wide view with two colossal, dignified strong brothers lifting Taihang and Wangwu from opposite sides beyond the sleeping village. In a foreground doorway, Lian steadies a gently trembling water bowl while Yugong listens upright in darkness. Keep the supernatural action solemn and nonviolent."
  - id: p10
    file: artwork/p10.webp
    scene: 清晨阳光穿过原来的山口，新路伸向南方田野。
    prompt: "Sunrise establishing view from the village gate. Unblocked southern light crosses the well and roofs, and a broad level road reaches straight to warm fields. The two mountains now stand tiny at distant eastern and southern horizons as villagers gather in astonishment."
  - id: p11
    file: artwork/p11.webp
    scene: 小君在新路旁寻找旧缺口，碎石间冒出细草。
    prompt: "Low medium view beside the open road. Jun kneels where the first notch used to be, her tiny basket hanging empty, while one thin green shoot rises between stones of the remaining gravel section. Other villagers test the new road with carts in the softly focused distance."
  - id: p12
    file: artwork/p12.webp
    scene: 愚公和智叟并肩推车回家，阿莲刚系好车绳。
    prompt: "Warm closing view on the new road. Zhisou and Yugong walk side by side pushing the small cart toward the village; preserve their distinct clothing, beards, cane, and staff. Lian has just tightened a loose rope, and Jun passes with her empty little basket. Keep the stable wheels and open southern light prominent."
