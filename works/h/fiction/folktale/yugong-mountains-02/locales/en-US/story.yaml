schema_version: 3
language: en-US
writer: manypath-lantern
title: Hands That Took the Hammer
summary: Jun and the villagers continue Yu's work until the returning blows alarm the guardian in the old legend.
chapters:
  - {id: c01, title: "Jun's Small Basket", page_refs: [p01, p02, p03, p04]}
  - {id: c02, title: "Year After Year", page_refs: [p05, p06, p07, p08]}
  - {id: c03, title: "The Open Road", page_refs: [p09, p10, p11, p12]}
questions:
  - {id: q01, type: sequence, prompt: "What did Jun do before the villagers brought tools?", answer: "She watched from a distance, then carried a light basket of loose stones.", page_refs: [p01, p02, p03]}
  - {id: q02, type: sequence, prompt: "What happened after the children planned the next road section?", answer: "When spring came, workers had begun before Yu arrived.", page_refs: [p04, p05]}
  - {id: q03, type: character-motive, prompt: "Why did Jun's mother keep her away from the hammers?", answer: "She feared that flying stone chips would hurt Jun.", page_refs: [p01]}
  - {id: q04, type: short-answer, prompt: "What changes did the guardian hear and see?", answer: "The hammers returned closer to the center, the old man slowed, and the child grew.", page_refs: [p07, p08]}
  - {id: q05, type: cause-effect, prompt: "What changed when the mountains were carried away?", answer: "Southern light entered the village and a level road reached the fields.", page_refs: [p09, p10]}
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - {text: "After Yu began cutting the road, Jun watched each day. She wanted to help, but her mother feared the flying chips."}
    - id: p02
      illustration: p02
      paragraphs:
        - {text: "Jun brought a tiny basket and gathered only loose stones. Lian removed half. “Carry ten safe loads, not one crushing load.”"}
    - id: p03
      illustration: p03
      paragraphs:
        - {text: "Their gravel kept wheels above the mud. Other villagers saw the change and brought hammers, wedges, food, and time."}
    - id: p04
      illustration: p04
      paragraphs:
        - {text: "In winter Yu's hand shook badly. Lian told him to hammer less. Outside, children planned the next road section."}
    - id: p05
      illustration: p05
      paragraphs:
        - {text: "When spring came, young workers had started before Yu arrived. Jun had grown, so her little basket looked even smaller."}
    - id: p06
      illustration: p06
      paragraphs:
        - {text: "Zhi asked how many years Yu could guard the cut. Yu pointed to the new workers. “They do not begin before our first blow.”"}
    - id: p07
      illustration: p07
      paragraphs:
        - {text: "The old legend says a guardian lived inside the mountains. After every winter, he heard the hammers return closer to the center."}
    - id: p08
      illustration: p08
      paragraphs:
        - {text: "The old man slowed, but the child grew. The guardian feared the work would continue. He rose through the clouds and reported this to the Ruler of Heaven."}
    - id: p09
      illustration: p09
      paragraphs:
        - {text: "The ruler sent two mighty brothers to carry away the mountains. That night bowls trembled, and distant thunder rolled under the village."}
    - id: p10
      illustration: p10
      paragraphs:
        - {text: "At sunrise, southern light filled the village gate. The mountains stood far away, and a level road reached toward the fields."}
    - id: p11
      illustration: p11
      paragraphs:
        - {text: "Jun ran out but could not find the old notch. The short gravel road remained, with one green shoot between its stones."}
    - id: p12
      illustration: p12
      paragraphs:
        - {text: "Zhi returned with his cart. Yu held one shaft. Lian tightened a rope. The two old men pushed home together."}
