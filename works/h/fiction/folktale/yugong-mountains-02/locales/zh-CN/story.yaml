schema_version: 3
language: zh-CN
writer: 百径灯
title: 接过锤子的人
summary: 小君和村民接过愚公的工作，年年不停的锤声终于惊动了传说中的守山神。
chapters:
  - {id: c01, title: 小君的小筐, page_refs: [p01, p02, p03, p04]}
  - {id: c02, title: 一年又一年, page_refs: [p05, p06, p07, p08]}
  - {id: c03, title: 山外的新路, page_refs: [p09, p10, p11, p12]}
questions:
  - {id: q01, type: sequence, prompt: 村民带来工具以前，小君先做了什么？, answer: 她先在远处观看，再用轻轻的小筐搬走敲下的石头。, page_refs: [p01, p02, p03]}
  - {id: q02, type: sequence, prompt: 孩子们计划接长石路以后发生了什么？, answer: 春天到来时，大家赶在愚公之前开始干活。, page_refs: [p04, p05]}
  - {id: q03, type: character-motive, prompt: 小君的母亲为什么不让她靠近锤子？, answer: 她怕飞落的碎石伤到小君。, page_refs: [p01]}
  - {id: q04, type: short-answer, prompt: 守山神听见和看见了哪些变化？, answer: 锤声一年比一年靠近山心，老人慢下来，孩子却长大了。, page_refs: [p07, p08]}
  - {id: q05, type: cause-effect, prompt: 两座山被背走以后，村口发生了什么变化？, answer: 南方的光照进村口，平路直接伸向田野。, page_refs: [p09, p10]}
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - {text: 愚公开山以后，小君天天在远处看。她想帮忙，母亲却怕飞落的碎石伤到她。}
    - id: p02
      illustration: p02
      paragraphs:
        - {text: 小君带来一只小筐，只捡已经敲下的石头。阿莲拿掉半筐，说：“能走十趟，别一趟就累倒。”}
    - id: p03
      illustration: p03
      paragraphs:
        - {text: 碎石铺进泥路，车轮不再下陷。村民看见变化，有人送木楔，有人来抡锤，也有人只干半天。}
    - id: p04
      illustration: p04
      paragraphs:
        - {text: 冬天，愚公的手抖得更厉害。阿莲叫他少抡锤，窗外的孩子却在商量开春怎样接长石路。}
    - id: p05
      illustration: p05
      paragraphs:
        - {text: 春天，愚公来到山脚，年轻人已经开工。小君长高了，她的小筐看起来反而更小。}
    - id: p06
      illustration: p06
      paragraphs:
        - {text: 智叟推车经过，问愚公还能守几年。愚公指着接过锤子的人说：“后来的人不必从第一凿开始。”}
    - id: p07
      illustration: p07
      paragraphs:
        - {text: 传说山里住着守山神。他发现冬天过后，锤声总会回来，还一年比一年靠近山心。}
    - id: p08
      illustration: p08
      paragraphs:
        - {text: 老人慢下来，孩子却长大了。守山神害怕这场工作不会停，便乘云去禀告天帝。}
    - id: p09
      illustration: p09
      paragraphs:
        - {text: 天帝命两位大力神背走两座山。那一夜，水碗轻轻晃动，远处响起一声春雷。}
    - id: p10
      illustration: p10
      paragraphs:
        - {text: 清晨，南方的光直照进村口。两座山已经到了远方，平坦的新路一直伸向田野。}
    - id: p11
      illustration: p11
      paragraphs:
        - {text: 小君跑上新路，却找不到从前的缺口。村边那段碎石路还在，石缝里长出了一株细草。}
    - id: p12
      illustration: p12
      paragraphs:
        - {text: 智叟推着行李回来。愚公扶住车辕，阿莲系紧绳子。两个老人沿着新路慢慢回家。}
