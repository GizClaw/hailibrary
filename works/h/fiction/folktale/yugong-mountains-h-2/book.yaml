    description: 年迈村民，想为全村开出一条向南的路。
    visual_identity: "An elderly Chinese villager with swept-back white hair, a short white beard, an indigo cross-collar tunic, rust-red sash, cream trousers, straw sandals, and a straight wooden staff."
  - id: lian
    kind: human
    description: 愚公的妻子，会安排劳作与休息。
    visual_identity: "An elderly Chinese village woman with silver hair in a low coil, a forest-green cross-collar jacket, mustard apron, dark indigo trousers, straw sandals, and a sturdy woven carrying basket."
  - id: zhisou
    kind: human
    description: 选择搬去山南，却不断观察开路结果的邻居。
    visual_identity: "An elderly Chinese villager with a narrow gray beard, a mustard robe under a rust-red vest, an indigo cloth cap, a knotted walking cane, and a small two-wheeled handcart."
  - id: jun
    kind: human
    description: 从安全搬运小石头开始参与的邻家孩子。
    visual_identity: "A Chinese village girl with two short black braids tied with rust-red cords, a mustard tunic, forest-green trousers, cloth shoes, a padded shoulder cloth, and a tiny round woven basket."
  - id: guardian
    kind: spirit
    description: 住在山中并把持续施工禀告天帝的守山神。
    visual_identity: "A tall mountain guardian spirit with a weathered stone-gray face, long cloudlike white brows, an indigo layered robe edged in forest green, and a crooked pine-wood staff."
