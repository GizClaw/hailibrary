schema_version: 1
id: the-magpie-and-the-bright-key
type:
  - reading
  - illustrated-short-story
style: cut-paper-collage
status: draft
locales:
  - en-US
  - zh-CN
labels:
  topics:
    - animals
    - mystery
    - nature
  themes:
    - discovery
    - fairness
    - lost-and-found
    - problem-solving
  moods:
    - mysterious
    - warm
characters:
  - id: narrator
    kind: narrator
    description: An observant guide who follows the search without telling readers what to conclude.
    voice_identity: calm adult storyteller with clear, curious attention
  - id: mina
    kind: character
    description: Mina / 米娜, a thoughtful seven-year-old who asks the group to test its first guess.
    visual_identity: Medium-brown skin, two long black braids tied with teal bands, orange sweatshirt,
      navy overalls, and red rain boots.
    voice_identity: steady child voice, curious and quietly firm
  - id: leo
    kind: character
    description: Leo / 乐乐, Mina’s energetic seven-year-old friend who makes a quick accusation and
      later admits why.
    visual_identity: Light-brown skin, short dark-brown curls, mustard-yellow jacket, forest-green
      trousers, and blue shoes.
    voice_identity: bright child voice that moves quickly, then softens
  - id: ms-rowan
    kind: character
    description: Rowan / 罗阿姨, the community garden keeper whose missing key starts the search.
    visual_identity: Deep-brown skin, silver hair in a high bun, teal cardigan, plum work apron,
      tan trousers, and brown ankle boots.
    voice_identity: warm practical adult voice with an honest, thoughtful pause
  - id: magpie
    kind: character
    description: A wild Eurasian magpie that never speaks and remains free in the garden.
    visual_identity: Black-and-white bird with a long layered tail showing subtle blue-green paper
      accents; always smaller than the human characters and never wears human objects.
    voice_identity: none; never assign a spoken block
cover: artwork/cover.webp
artwork_manifest: artwork.yaml
learning:
  goals:
    - Use two nearby observations to question a character’s first guess.
    - Track how a question changes the search and leads to the missing key.
  concepts:
    - blame
rights:
  text: project-original
  artwork: project-generated
  writer_persona: project-original
