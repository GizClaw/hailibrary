schema_version: 1
style: cut-paper-collage
aspect_ratio: 3:2
embedded_text: prohibited
shared_by_all_locales: true
setting: A wordless fictional community garden with a red-brick potting shed, a pear tree, a low pale
  stone wall, a wooden bench, a green carrying basket, and a blue side gate. Keep the spatial layout
  stable. Do not show signs, labels, writing, printed seed packets, or numbered tools.
continuity: Preserve Mina’s two teal-tied black braids, orange sweatshirt, navy overalls, red boots,
  and medium-brown skin; Leo’s short dark curls, mustard jacket, green trousers, blue shoes, and
  light-brown skin; and Rowan’s deep-brown skin, silver bun, teal cardigan, plum apron, tan trousers,
  and brown boots. Preserve the magpie’s black-and-white cut-paper body and long blue-green accented
  tail. The same small bright brass key, paired yellow work gloves, and green basket recur throughout.
  The bird stays wild, silent, and physically separate from the key.
assets:
  - id: cover
    file: artwork/cover.webp
    scene: Mina kneels beside the wooden bench, studying a bright brass key resting near folded yellow
      gloves, while Leo looks from the key toward a black-and-white magpie high in the pear tree. Rowan
      stands by the green basket. The image suggests a mystery without showing the bird touching
      the key.
  - id: p01
    file: artwork/p01.webp
    scene: At the garden bench, Rowan sets the small bright brass key directly on folded yellow work
      gloves while Mina and Leo carry empty terracotta pots nearby.
  - id: p02
    file: artwork/p02.webp
    scene: The black-and-white magpie watches from the pear tree. Sunlight catches the brass key on the
      bench, while the bird stays on a high branch at a clear distance.
  - id: p03
    file: artwork/p03.webp
    scene: Rowan lifts the paired yellow gloves from the bench with one hand as the small brass key
      slips unseen into the open cuff of one glove; the green basket waits below her hand.
  - id: p04
    file: artwork/p04.webp
    scene: At the closed blue side gate, Rowan searches her empty apron pocket while Mina and Leo
      look worried. The magpie sits on the distant low wall, with no key near it.
  - id: p05
    file: artwork/p05.webp
    scene: Leo points accusingly toward the magpie on the wall. Mina frowns at Leo and raises one hand
      to slow the group down; Rowan watches, uncertain.
  - id: p06
    file: artwork/p06.webp
    scene: The magpie has flown down but remains on the low wall, clearly far from the now-empty bench.
      Mina watches the distance closely while Leo lowers his pointing hand.
  - id: p07
    file: artwork/p07.webp
    scene: Mina speaks thoughtfully to Leo and Rowan beside the empty bench. The magpie remains well
      away in the pear tree. No books, charts, screens, labels, or scientific symbols appear.
  - id: p08
    file: artwork/p08.webp
    scene: Mina asks Rowan a focused question. Rowan looks at her empty hands, then turns toward
      the red-brick potting shed as she remembers the gloves and green basket.
  - id: p09
    file: artwork/p09.webp
    scene: Inside the tidy potting shed, Rowan removes a plain cloth and a few unmarked small garden
      tools from the green basket. The folded yellow gloves are visible at the bottom as Mina and Leo lean
      closer.
  - id: p10
    file: artwork/p10.webp
    scene: Mina lifts the yellow gloves above the green basket. The bright brass key is visibly sliding
      from one open glove cuff into the basket while Leo and Rowan react with surprise.
  - id: p11
    file: artwork/p11.webp
    scene: Outside the shed, Leo looks down with an embarrassed expression while speaking to Mina and
      Rowan. Rowan gives a small honest nod, Mina listens without scolding, and the magpie remains free
      in the distant pear tree. The green basket and yellow gloves may rest nearby; the key need not be
      visible during this conversation.
  - id: p12
    file: artwork/p12.webp
    scene: Rowan opens the blue side gate with the recovered brass key. Mina and Leo carry pots
      through together, while the magpie waits high in the pear tree at a clear distance.
generation:
  workflow: Codex built-in image generation; cwebp compression and resize
  text_in_image_requested: false
