schema_version: 2
language: en-US
writer: brass-compass
title: The Magpie and the Bright Key
summary: A bright key disappears near a magpie. Mina tests the first guess and finds the key elsewhere.
chapters:
  - id: ch01
    title: The Missing Key
    page_refs:
      - p01
      - p02
      - p03
      - p04
  - id: ch02
    title: A Bird on the Wall
    page_refs:
      - p05
      - p06
      - p07
      - p08
  - id: ch03
    title: Inside the Glove
    page_refs:
      - p09
      - p10
      - p11
      - p12
questions:
  - id: q01
    type: cause-effect
    speaker: narrator
    prompt: How did the key get into the green basket?
    answer: The key slipped into one glove, and Rowan put the gloves in the basket.
    page_refs:
      - p01
      - p03
  - id: q02
    type: sequence
    speaker: narrator
    prompt: What did Mina do after she watched the magpie stay away?
    answer: Mina recalled the study, then asked Rowan what she had carried.
    page_refs:
      - p06
      - p07
      - p08
  - id: q03
    type: character-motive
    speaker: narrator
    prompt: Why did Leo blame the magpie?
    answer: Leo saw the bright key and guessed that the nearby magpie had taken it.
    page_refs:
      - p04
      - p05
      - p11
  - id: q04
    type: short-answer
    speaker: narrator
    prompt: Where did Mina find the key?
    answer: Mina found it inside one of the yellow gloves in the green basket.
    page_refs:
      - p09
      - p10
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: At the community garden, Rowan set a bright brass key on the bench. It rested on her folded yellow gloves. Mina and Leo carried empty pots nearby.
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: A black-and-white magpie watched from the pear tree. The key shone below. The bird stayed high on the branch.
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: Rowan gathered the gloves with one hand. The key slipped into one glove, but no one saw it. She dropped the gloves into her green basket.
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: Later, Rowan needed the key to open the side gate. It was gone, and the magpie sat on the wall. Rowan glanced at the bird and wondered if it took the key.
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: "Leo pointed and cried, “That magpie took the bright key!” Mina frowned. “Don’t "
            - vocabulary:
                id: blame
                text: blame
            - text: " the bird yet; let’s check first.”"
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: The magpie stayed on the wall, far from the empty bench. Mina whispered, “It isn’t coming near.”
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: The magpie flew back to the pear tree. Mina recalled one study of wild magpies. The birds usually avoided new objects, shiny or dull.
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: “What did you carry after you set down the key?” Mina asked. Rowan studied her empty hands and looked toward the shed. “The gloves and my basket,” she said.
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: They hurried to the shed. Rowan pulled out a cloth and small tools. The folded yellow gloves lay at the bottom.
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: Mina lifted the gloves. The bright key slid from one glove. It landed inside the basket with a tiny clink.
    - id: p11
      illustration: p11
      paragraphs:
        - content:
            - text: Leo looked down. “I blamed the magpie because the key was bright,” he said. Rowan nodded. “So did I.”
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: Rowan unlocked and opened the side gate with the key. Above them, the magpie waited in the pear tree.
audio_script:
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: observant, calm, and lightly curious
        timbre: clear warm adult alto
        pace: measured medium
        pitch: middle-low
    mina:
      display_name: Mina
      tts:
        delivery: thoughtful and quietly firm, with focused questions
        timbre: smooth clear child voice
        pace: steady with brief thinking pauses
        pitch: middle-high
    leo:
      display_name: Leo
      tts:
        delivery: quick and certain at first, then softer and honest
        timbre: bright slightly breathy child voice
        pace: brisk, easing after the key is found
        pitch: high
    ms-rowan:
      display_name: Rowan
      tts:
        delivery: practical and warm, with an honest pause when remembering
        timbre: rich rounded adult mezzo
        pace: unhurried medium
        pitch: middle
    magpie:
      display_name: Magpie
      tts:
        delivery: silent; all movement is described by the narrator
        timbre: no synthesized voice
        pace: no spoken delivery
        pitch: unvoiced
