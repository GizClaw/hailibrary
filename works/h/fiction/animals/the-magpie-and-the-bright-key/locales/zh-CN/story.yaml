schema_version: 2
language: zh-CN
writer: 铜罗盘
title: 喜鹊和亮钥匙
summary: 亮钥匙不见了，乐乐和罗阿姨先怀疑围墙上的喜鹊。米娜没有跟着猜，而是问罗阿姨刚才拿过什么。
chapters:
  - id: ch01
    title: 钥匙不见了
    page_refs:
      - p01
      - p02
      - p03
      - p04
  - id: ch02
    title: 远处的喜鹊
    page_refs:
      - p05
      - p06
      - p07
      - p08
  - id: ch03
    title: 钥匙落进篮子
    page_refs:
      - p09
      - p10
      - p11
      - p12
questions:
  - id: q01
    type: cause-effect
    speaker: narrator
    prompt: 钥匙怎么会在绿篮子里？
    answer: 钥匙先滑进一只手套里，罗阿姨又把手套放进了绿篮子。
    page_refs:
      - p01
      - p03
  - id: q02
    type: sequence
    speaker: narrator
    prompt: 看到喜鹊没有靠近长椅后，米娜先后做了什么？
    answer: 米娜先想起读过的研究，再问罗阿姨放下钥匙后拿过什么。
    page_refs:
      - p06
      - p07
      - p08
  - id: q03
    type: character-motive
    speaker: narrator
    prompt: 乐乐为什么认定是喜鹊拿走了钥匙？
    answer: 乐乐看到钥匙很亮，喜鹊又在附近，就猜是喜鹊拿走了钥匙。
    page_refs:
      - p04
      - p05
      - p11
  - id: q04
    type: short-answer
    speaker: narrator
    prompt: 米娜在哪里找到了钥匙？
    answer: 米娜在绿篮子里的一只黄手套里找到了钥匙。
    page_refs:
      - p09
      - p10
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - content:
            - text: 菜园开门前，罗阿姨把一把亮钥匙放在长椅上。钥匙正好压着一双黄手套。米娜和乐乐在旁边搬花盆。
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: 梨树上停着一只黑白喜鹊。长椅上的钥匙很亮。喜鹊一直待在高高的树枝上。
    - id: p03
      illustration: p03
      paragraphs:
        - content:
            - text: 罗阿姨一手拿起那双手套。钥匙滑进一只手套里，谁也没看见。她把手套放进绿篮子里。
    - id: p04
      illustration: p04
      paragraphs:
        - content:
            - text: 过了一会儿，罗阿姨要开边门，却找不到钥匙。那只喜鹊正好落在围墙上。罗阿姨看了看喜鹊，猜钥匙是它拿的。
    - id: p05
      illustration: p05
      paragraphs:
        - content:
            - text: 乐乐指着喜鹊喊：“一定是它拿走了亮钥匙！”米娜皱起眉：“别忙着
            - vocabulary:
                id: blame
                text: 怪
            - text: 它，我们先找找。”
    - id: p06
      illustration: p06
      paragraphs:
        - content:
            - text: 喜鹊仍停在远处的围墙上，离空空的长椅很远。米娜轻声说：“它没有靠近长椅。”
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: 喜鹊飞回了梨树。米娜想起读过的一项研究。研究中的野生喜鹊常常躲开新东西，不管东西亮不亮。
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: “放下钥匙后，您又拿了什么？”米娜问。罗阿姨看着双手，突然想起绿篮子：“手套！我把手套带进小屋了。”
    - id: p09
      illustration: p09
      paragraphs:
        - content:
            - text: 三个人跑进放工具的小屋。罗阿姨拿出布和几件小工具。篮子底部露出黄手套的一角。
    - id: p10
      illustration: p10
      paragraphs:
        - content:
            - text: 米娜提起手套。那把钥匙从手套里滑出来，叮的一声落进篮子。
    - id: p11
      illustration: p11
      paragraphs:
        - content:
            - text: 乐乐低下头：“我只看见钥匙很亮，就说是喜鹊拿的。”罗阿姨点点头：“我也是。”
    - id: p12
      illustration: p12
      paragraphs:
        - content:
            - text: 罗阿姨用找回的钥匙开了锁，推开边门。喜鹊还停在梨树上，离他们远远的。
audio_script:
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 冷静清楚地讲述，留意人物真正看到的动作
        timbre: 温和清澈的成年中低音
        pace: 平稳适中
        pitch: 中低
    mina:
      display_name: 米娜
      tts:
        delivery: 沉着好奇，追问时轻而坚定
        timbre: 清楚柔和的童声
        pace: 稳定，思考处稍作停顿
        pitch: 中高
    leo:
      display_name: 乐乐
      tts:
        delivery: 开始时又快又肯定，后来明显放轻并带着不好意思
        timbre: 明亮、稍带气声的童声
        pace: 前段稍快，找到钥匙后放慢
        pitch: 高
    ms-rowan:
      display_name: 罗阿姨
      tts:
        delivery: 亲切利落，回想时有诚实的停顿
        timbre: 圆润厚实的成年女中音
        pace: 不急不慢
        pitch: 中
    magpie:
      display_name: 喜鹊
      tts:
        delivery: 不发言，所有动作都由旁白描述
        timbre: 不合成角色声音
        pace: 无口语输出
        pitch: 无声
