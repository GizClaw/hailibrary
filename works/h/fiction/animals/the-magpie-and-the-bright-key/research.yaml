schema_version: 1
required: true
reason: The story directly challenges the familiar claim that magpies are specially attracted to
  shiny objects. Its factual passage therefore needs both the original study's limits and a clear
  note that applying the result to a Chinese-language setting is an extension across closely related species.
sources:
  - url: https://doi.org/10.1007/s10071-014-0794-4
    supports: "p07: Shephard, Lea, and Hempel de Ibarra's one set of trials, published online in 2014
      in Animal Cognition, tested Eurasian magpies (Pica pica) in England. It found no unconditional
      attraction to shiny objects in either captive or free-living birds; unfamiliar shiny and non-shiny
      objects elicited wary responses in the free-living birds. The story therefore uses 'one study' and
      'usually avoided' rather than making a universal claim or assigning a known motive to the fictional bird."
    verified_at: 2026-09-13
  - url: https://pubmed.ncbi.nlm.nih.gov/25123853/
    supports: "p07: the PubMed record verifies the authors, journal, DOI, species name Pica pica,
      2014 online-publication date, and the limited result for captive and free-living birds."
    verified_at: 2026-09-13
  - url: https://news-archive.exeter.ac.uk/2014/august/title_406690_en.html
    supports: "p07 research scope: the University of Exeter release states that the same study used
      wild birds at eight field-test sites on the Exeter campus and captive birds that had come from
      a rescue centre. Both shiny and non-shiny unfamiliar objects were presented."
    verified_at: 2026-09-13
  - url: https://www.worldbirdnames.org/new/updates/species-updates/
    supports: "Taxonomic limit: current IOC treatment splits Oriental Magpie (Pica serica), including
      the magpies usually encountered in eastern China, from the Pica pica species complex. The English
      study's result is therefore relevant to the Chinese 喜鹊 only by cautious extension to a closely
      related species, not as direct experimental evidence about Pica serica."
    verified_at: 2026-09-13
