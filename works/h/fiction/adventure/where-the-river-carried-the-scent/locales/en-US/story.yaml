schema_version: 1
language: en-US
writer: inkstone-observer
title: Where the River Carried the Scent
summary: Search dog Moss finds scent on both sides of a river, forcing the team to separate what he detects from what they can responsibly conclude.
cast:
  narrator: {display_name: Narrator, tts: {delivery: attentive and restrained, timbre: clear adult voice, pace: medium, pitch: medium}}
  moss: {display_name: Moss, tts: {delivery: alert barks and quiet breathing, timbre: natural Labrador vocalizations, pace: responsive, pitch: medium-low}}
  ana: {display_name: Ana, tts: {delivery: focused and patient, timbre: steady adult voice, pace: medium, pitch: medium}}
  jo: {display_name: Jo, tts: {delivery: practical and candid, timbre: weathered older voice, pace: medium, pitch: low}}
  dev: {display_name: Dev, tts: {delivery: precise and curious, timbre: light adult voice, pace: medium, pitch: medium-high}}
  eli: {display_name: Eli, tts: {delivery: tired and clear, timbre: warm adult voice, pace: medium-slow, pitch: medium-low}}
pages:
  - id: p01
    illustration: p01
    lines:
      - {speaker: narrator, text: "At dawn, Eli's bunk at the wetland station was still empty. His field bag was gone, but the supper left for him had not been touched."}
      - {speaker: narrator, text: "Rain had swollen the river during the night, turning familiar sandbars into brown water and separating paths that usually met."}
      - {speaker: jo, text: "He knows these marshes better than any of us. That lowers some risks, but it does not make him impossible to injure."}
      - {speaker: narrator, text: "A broken radio, a twisted ankle, or one blocked crossing could defeat even excellent knowledge of the land."}
  - id: p02
    illustration: p02
    lines:
      - {speaker: jo, text: "I last saw Eli checking the north-bank reed plots. He planned to return before dark, unless the water gauges needed another reading."}
      - {speaker: dev, text: "His notebook lists three plots and an old flood shelter, but it does not say which he visited last."}
      - {speaker: narrator, text: "The team had several reasonable destinations and no continuous account of Eli's movements. Urgency made every incomplete clue feel larger."}
      - {speaker: dev, text: "We should keep the planned destinations separate from places supported by fresh observations."}
  - id: p03
    illustration: p03
    lines:
      - {speaker: narrator, text: "Ana opened a sealed box and removed Eli's clean reed-sample case. Everyone else stepped away so their own odor would not crowd the starting area."}
      - {speaker: narrator, text: "Moss sniffed the case, then lifted his head into the moving air. His red harness meant he was working; it did not turn him into a compass."}
      - {speaker: ana, text: "Watch what he reports. Do not decide what it means before he reports it."}
      - {speaker: narrator, text: "Jo folded Eli's spare jacket away; using a handled object would have made the starting scent less controlled."}
  - id: p04
    illustration: p04
    lines:
      - {speaker: narrator, text: "Moss tested the breeze in several directions before moving downstream. He crossed and recrossed the path, sampling air rather than following a visible footprint."}
      - {speaker: dev, text: "He is not keeping his nose on the ground."}
      - {speaker: ana, text: "This is an air-scent search. Odor can reach him on currents that bend around reeds, water, and warm ground."}
      - {speaker: narrator, text: "Ana described a possibility, not a promise about where the current had begun."}
      - {speaker: narrator, text: "Moss's changing direction therefore showed active sampling, not confusion or a failure to choose."}
  - id: p05
    illustration: p05
    lines:
      - {speaker: narrator, text: "At the first river bend, Moss turned sharply toward a clump of alder and gave his trained alert. Ana rewarded him, then marked the place and time."}
      - {speaker: jo, text: "Then Eli must be downstream. The flood could carry a person faster than we think."}
      - {speaker: narrator, text: "Jo's fear supplied a complete story before the evidence did. He was trying to protect Eli, yet the conclusion could pull searchers toward dangerous water."}
      - {speaker: dev, text: "The alert is important enough to record precisely and uncertain enough to investigate carefully."}
  - id: p06
    illustration: p06
    lines:
      - {speaker: ana, text: "The alert establishes that target odor reached Moss here strongly enough for his trained response. It does not locate Eli by itself."}
      - {speaker: jo, text: "If we keep qualifying every clue, we may arrive after help matters."}
      - {speaker: ana, text: "And if we mistake one detection for a location, we may spend that time searching the wrong bank."}
      - {speaker: narrator, text: "Both dangers were real: delay could harm Eli, while certainty without support could misdirect the whole operation."}
      - {speaker: narrator, text: "Their disagreement concerned how to act under uncertainty, not whether Eli deserved immediate help."}
  - id: p07
    illustration: p07
    lines:
      - {speaker: dev, text: "The survey ribbons lean from the south bank toward us. A crosswind could have carried odor over the river before Moss detected it."}
      - {speaker: jo, text: "Or Eli could still be somewhere below this bend."}
      - {speaker: ana, text: "Yes. We now have two explanations that fit the first alert. Neither should be erased merely because the other is possible."}
      - {speaker: narrator, text: "Dev recorded wind direction without drawing a trail that nobody had observed."}
      - {speaker: dev, text: "We can compare later alerts with this wind only if we preserve when this measurement was taken."}
  - id: p08
    illustration: p08
    lines:
      - {speaker: narrator, text: "On the search map, they placed a point for the alert, a short line for the measured wind, and a circle around the sector still unchecked."}
      - {speaker: dev, text: "A point says where we observed something. A line would claim we knew how the scent traveled between places."}
      - {speaker: jo, text: "The cautious map looks almost empty."}
      - {speaker: ana, text: "Empty space is useful when it keeps an assumption from dressing itself as evidence."}
      - {speaker: narrator, text: "The map looked less dramatic than Jo wanted, but it allowed another team to inspect their reasoning."}
  - id: p09
    illustration: p09
    lines:
      - {speaker: narrator, text: "They crossed the raised footbridge, the only approved route over the swollen river. Near the south-bank reeds, Moss circled twice and alerted again."}
      - {speaker: jo, text: "Two banks. That should mean Eli crossed before the rain."}
      - {speaker: dev, text: "It could. It could also mean the same breeze carried odor to two places."}
      - {speaker: narrator, text: "The second alert added evidence, but it did not automatically select one explanation."}
      - {speaker: ana, text: "Repeat detection can increase confidence that odor is present while leaving its source unresolved."}
  - id: p10
    illustration: p10
    lines:
      - {speaker: jo, text: "Either Eli crossed, or his scent did. We cannot search both ideas forever."}
      - {speaker: ana, text: "We do not need forever. We need a plan that tests both without sending anyone into the current."}
      - {speaker: narrator, text: "Jo wanted one decisive direction because divided attention felt like hesitation. Ana saw that parallel checks could be faster than defending a premature answer."}
      - {speaker: dev, text: "High-bank teams can cover both sectors while Moss works the air between them."}
      - {speaker: narrator, text: "The division of labor tested alternatives without dividing responsibility for everyone's safety."}
  - id: p11
    illustration: p11
    lines:
      - {speaker: narrator, text: "Two foot teams took safe access paths along the high banks. They checked shelters, calls, broken branches, and recent boot marks while staying out of flooded channels."}
      - {speaker: narrator, text: "No team found Eli, but each cleared a sector that no longer needed the same attention."}
      - {speaker: jo, text: "A negative result feels like no result."}
      - {speaker: dev, text: "Only if we forget that knowing where he is not can change where we look next."}
      - {speaker: narrator, text: "They also logged unsearched pockets, preventing absence of evidence from being mistaken for a completed search."}
  - id: p12
    illustration: p12
    lines:
      - {speaker: dev, text: "Both alerts align with the earlier crosswind, and neither high-bank team found signs directly downstream. That strengthens the transport explanation."}
      - {speaker: ana, text: "Strengthens, yes; proves, no. Two alert points cannot reveal every turn of moving air."}
      - {speaker: jo, text: "So we favor the south-bank source while preserving the downstream possibility."}
      - {speaker: narrator, text: "For the first time, Jo stated a conclusion with its limit attached."}
      - {speaker: narrator, text: "That qualification did not weaken the plan; it told each team what contradictory evidence should make them reconsider."}
  - id: p13
    illustration: p13
    lines:
      - {speaker: narrator, text: "A light rain arrived, cooling the exposed mud. Dev's ribbons sagged, then turned toward the willows as the breeze shifted along the river."}
      - {speaker: dev, text: "The air that carried the first odor is already gone. A later alert may belong to a different pattern."}
      - {speaker: jo, text: "Then our map is becoming old while we draw it."}
      - {speaker: ana, text: "That is why every observation carries a time, not just a place."}
  - id: p14
    illustration: p14
    lines:
      - {speaker: narrator, text: "Moss entered the willow reeds, worked for several minutes, and then lost the odor. He cast wider, slowed, and finally looked back at Ana."}
      - {speaker: jo, text: "Give him another minute. Eli may be close."}
      - {speaker: narrator, text: "Ana noticed mud collecting between Moss's booties and the quick rise of his breathing. Continuing might produce another alert, but fatigue could make his work less clear."}
      - {speaker: ana, text: "His condition is also evidence, and it changes our decision."}
  - id: p15
    illustration: p15
    lines:
      - {speaker: ana, text: "That is enough for this pass."}
      - {speaker: narrator, text: "She led Moss to dry ground, offered water, checked each paw, and let him settle beneath a rain cover."}
      - {speaker: jo, text: "Stopping feels wrong while Eli is missing."}
      - {speaker: ana, text: "Moss is a team member, not a tool we spend until it breaks. Rest protects him and the quality of what he can tell us next."}
      - {speaker: narrator, text: "Jo looked toward the reeds, caught between immediate action and evidence he could trust."}
  - id: p16
    illustration: p16
    lines:
      - {speaker: jo, text: "I called the upper-sector canine team. Independent coverage should not depend on one tired dog or one handler's interpretation."}
      - {speaker: ana, text: "Thank you. They can test the ridge while Moss recovers."}
      - {speaker: narrator, text: "Jo had not become less worried. Instead, he changed what worry asked him to do—from pressing one team harder to widening the evidence safely."}
      - {speaker: dev, text: "The foot teams can also recheck the old shelters from the high path."}
  - id: p17
    illustration: p17
    lines:
      - {speaker: narrator, text: "After resting, Moss returned with an even stride. Below the willows, he turned toward a narrow side opening and alerted near the bank."}
      - speaker: narrator
        content: [{text: "Water usually moved through this small "}, {vocabulary: {id: channel, text: channel}}, {text: ", though floodwater now covered its lower edges."}]
      - {speaker: jo, text: "This point lies beyond both earlier searches."}
      - {speaker: ana, text: "And it belongs to the new wind, so we must not connect it carelessly to the old points."}
  - id: p18
    illustration: p18
    lines:
      - {speaker: ana, text: "Target odor reached this opening. The new wind, the wall of reeds, and air moving along the channel may each have shaped where Moss met it."}
      - {speaker: dev, text: "The channel also points uphill toward a dry terrace. That is terrain we can inspect without entering floodwater."}
      - {speaker: jo, text: "We still cannot claim Eli traveled along the water."}
      - {speaker: narrator, text: "Jo now rejected the very shortcut in reasoning that had tempted him at the first bend."}
  - id: p19
    illustration: p19
    lines:
      - {speaker: jo, text: "The old flood shelter stands above that terrace. Eli mentioned the gauges, and the shelter is the safest nearby place if equipment fails."}
      - {speaker: dev, text: "That clue comes from Eli's plan and local knowledge, not from Moss's alert alone."}
      - {speaker: ana, text: "Together they justify checking the high path first. They still do not guarantee he is there."}
      - {speaker: narrator, text: "The team moved uphill with a reason strong enough to act on and modest enough to revise."}
  - id: p20
    illustration: p20
    lines:
      - {speaker: narrator, text: "A voice answered before the shelter came fully into view. Eli stood in the doorway, wrapped in an emergency blanket with one boot tied by cord."}
      - {speaker: eli, text: "I heard you below, but the flooded reeds blocked the direct descent. I stayed here because the ground is high and dry."}
      - {speaker: jo, text: "We found you by following the channel."}
      - {speaker: ana, text: "We found him by combining the alert, terrain, his field plan, and your knowledge of the shelter."}
  - id: p21
    illustration: p21
    lines:
      - {speaker: eli, text: "My boot strap broke before the rain. I reached the last gauge, but the steep return became unsafe once the mud loosened."}
      - {speaker: eli, text: "I chose shelter over a risky descent. The wind carried the odor from my wet jacket wherever it could; I did not travel to every place Moss marked."}
      - {speaker: jo, text: "So the alerts helped us reach you, even though they never formed your route."}
      - {speaker: narrator, text: "The successful rescue confirmed the decision to search uphill, not every explanation the team had considered."}
  - id: p22
    illustration: p22
    lines:
      - {speaker: narrator, text: "Before leaving, Dev revised the search record. Alert points remained separate; each included time, wind, terrain, and the areas already checked."}
      - {speaker: dev, text: "A single scent line would be neat, memorable, and unsupported. The honest map shows detections, conditions, and uncertainty."}
      - {speaker: jo, text: "It also shows why our interpretation changed. That matters to the next team more than making us look certain."}
      - {speaker: ana, text: "A record should preserve reasoning, including the alternatives that evidence weakened."}
  - id: p23
    illustration: p23
    lines:
      - {speaker: narrator, text: "Moss rested while the foot team prepared Eli for the high path. Ana praised the dog without turning him into the hero of a simpler story."}
      - {speaker: ana, text: "Moss contributed sensitive detections. Dev measured conditions, the bank teams cleared ground, Jo supplied local knowledge, and Eli made the choice that kept him safe."}
      - {speaker: jo, text: "Calling every alert a location would have hidden most of that work—and might have sent us into the river."}
  - id: p24
    illustration: p24
    lines:
      - {speaker: narrator, text: "They returned above the river with Eli walking between them. Below, the current kept rearranging reeds and reflections as if refusing to hold one perfect line."}
      - {speaker: jo, text: "At the first alert, I wanted certainty because certainty felt like speed."}
      - {speaker: ana, text: "What changed the search was not slower thinking. It was giving each clue exactly the weight it could carry."}
      - {speaker: narrator, text: "Their map ended with an open question about the air, a confirmed account from Eli, and a route home that nobody had to risk the water to complete."}
chapters:
  - {id: ch01, title: The First Alert, page_refs: [p01, p02, p03, p04, p05, p06]}
  - {id: ch02, title: Two Banks, Two Hypotheses, page_refs: [p07, p08, p09, p10, p11, p12]}
  - {id: ch03, title: When the Air Changed, page_refs: [p13, p14, p15, p16, p17, p18]}
  - {id: ch04, title: Evidence Without a Perfect Line, page_refs: [p19, p20, p21, p22, p23, p24]}
questions:
  - {id: q01, type: evidence, speaker: narrator, prompt: "What does Moss's first alert establish, and what does it leave uncertain?", answer: "It establishes that target odor reached Moss at the bend, but it does not establish Eli's exact location or route.", page_refs: [p04, p05, p06]}
  - {id: q02, type: compare, speaker: narrator, prompt: "How do Jo's first conclusion and Ana's interpretation differ?", answer: "Jo treats the alert as proof that Eli is downstream, while Ana treats it as one detection shaped by conditions.", page_refs: [p05, p06, p10]}
  - {id: q03, type: synthesis, speaker: narrator, prompt: "Which observations support the idea that scent crossed the river?", answer: "The crosswind comes from the opposite bank, Moss alerts on both banks, and the early alert positions align with that breeze.", page_refs: [p07, p09, p12]}
  - {id: q04, type: evaluate, speaker: narrator, prompt: "Why does Ana stop Moss after he loses the odor?", answer: "Continuing with a tired dog could reduce the quality of the search, so rest and another team preserve better evidence.", page_refs: [p14, p15, p16]}
  - {id: q05, type: evidence, speaker: narrator, prompt: "What leads the team from the side channel to the shelter?", answer: "Moss alerts at the channel opening, and Jo knows a high dry shelter is reachable above it.", page_refs: [p17, p18, p19]}
  - {id: q06, type: synthesis, speaker: narrator, prompt: "How does the team turn Moss's alerts into a responsible search plan?", answer: "They interpret alerts with wind, terrain, timing, rest, independent coverage, and local knowledge instead of treating the dog as an exact locator.", page_refs: [p06, p08, p12, p15, p16, p18, p19]}
  - {id: q07, type: evaluate, speaker: narrator, prompt: "Why is the final map more honest without one continuous scent line?", answer: "The observations show changing air and separate detections, not a measured continuous path from Eli to Moss.", page_refs: [p08, p13, p22, p24]}
  - {id: q08, type: main-idea, speaker: narrator, prompt: "What does Moss contribute that neither replaces nor completes the team's reasoning?", answer: "He supplies sensitive detections that become useful only when the team combines them with conditions, coverage, expertise, and safe access.", page_refs: [p06, p16, p18, p23]}
