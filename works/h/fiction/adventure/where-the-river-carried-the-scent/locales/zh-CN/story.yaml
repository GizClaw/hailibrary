schema_version: 1
language: zh-CN
writer: 砚舟
title: 气味随河风去了哪里
summary: 搜救犬小墨在河两岸都闻到了目标气味。队员们必须分清：它真正发现了什么，他们又能据此判断到哪一步。
cast:
  narrator: {display_name: 旁白, tts: {delivery: 专注克制, timbre: 清晰的成年声音, pace: 中速, pitch: 中音}}
  moss: {display_name: 小墨, tts: {delivery: 警觉的吠声与平静呼吸, timbre: 自然的拉布拉多犬声音, pace: 随行动变化, pitch: 中低音}}
  ana: {display_name: 安娜, tts: {delivery: 专注耐心, timbre: 稳定的成年声音, pace: 中速, pitch: 中音}}
  jo: {display_name: 老周, tts: {delivery: 实在坦率, timbre: 经风吹日晒的年长声音, pace: 中速, pitch: 低音}}
  dev: {display_name: 德文, tts: {delivery: 精确好奇, timbre: 轻盈的成年声音, pace: 中速, pitch: 中高音}}
  eli: {display_name: 伊莱, tts: {delivery: 疲惫但清楚, timbre: 温和的成年声音, pace: 中慢速, pitch: 中低音}}
pages:
  - id: p01
    illustration: p01
    lines:
      - {speaker: narrator, text: "天亮以后，伊莱的床铺仍旧空着。他带走了野外调查包，河边站给他留的晚饭却一口没动。"}
      - {speaker: narrator, text: "夜里的雨水把河撑得又宽又急，平日露在水面的沙洲全被黄水吞没，原本相通的小路也断成了几截。"}
      - {speaker: jo, text: "这片湿地，他比谁都熟。熟悉能避开一些麻烦，却不能保证人永远不会受伤。"}
  - id: p02
    illustration: p02
    lines:
      - {speaker: jo, text: "最后见到伊莱时，他正往北岸的芦苇样地走。他说天黑前回来，除非水位计还要再读一次。"}
      - {speaker: dev, text: "调查本上列了三块样地和一座旧避洪屋，没有写他最后去了哪一处。"}
      - {speaker: narrator, text: "几个去处都说得通，谁也讲不出伊莱从头到尾的行程。时间越紧，每条不完整的线索越容易显得斩钉截铁。"}
  - id: p03
    illustration: p03
    lines:
      - {speaker: narrator, text: "安娜打开密封箱，取出伊莱没用过的芦苇样品盒。其他人全退到一旁，免得自己的气味挤进搜索起点。"}
      - {speaker: narrator, text: "小墨闻过盒子，随即抬头试探流动的空气。红色背带表示它开始工作，却没有把它变成一枚会指人的指南针。"}
      - {speaker: ana, text: "先看它发现了什么，别急着替它把答案说完。"}
  - id: p04
    illustration: p04
    lines:
      - {speaker: narrator, text: "小墨朝几个方向迎风嗅闻，才沿下游走去。它不时横穿小路，鼻子始终抬着，并没有追逐地上的某一串脚印。"}
      - {speaker: dev, text: "它为什么不贴着地面闻？"}
      - {speaker: ana, text: "这是空气嗅探。气味会随气流绕过芦苇、水面和晒暖的泥地，再来到它面前。"}
      - {speaker: narrator, text: "安娜说的是可能发生的过程，并没有保证气味一定从哪个方向出发。"}
  - id: p05
    illustration: p05
    lines:
      - {speaker: narrator, text: "到了第一道河湾，小墨忽然转向一丛桤木，做出了训练过的示警动作。安娜立刻奖励它，并记下地点和时间。"}
      - {speaker: jo, text: "那伊莱一定在下游。洪水推着人走，比我们想的还快。"}
      - {speaker: narrator, text: "担心替老周把故事一口气补全了。他是真想救伊莱，可这个结论也可能把搜救队引向最危险的水边。"}
  - id: p06
    illustration: p06
    lines:
      - {speaker: ana, text: "这次示警能说明：目标气味在这里强到足以让小墨作出反应。单凭这一点，还不能确定伊莱在哪儿。"}
      - {speaker: jo, text: "每条线索都要加上好几个‘也许’，等我们赶到，救援可能已经没有意义。"}
      - {speaker: ana, text: "可要是把一次闻到气味当成准确位置，我们也可能把宝贵时间全用在错误的河岸。"}
      - {speaker: narrator, text: "两种危险都是真的：行动太迟会害人，证据不够却过早确定，也会让整支队伍走偏。"}
  - id: p07
    illustration: p07
    lines:
      - {speaker: dev, text: "看样地上的布条，风从南岸斜着吹向这里。气味可能先过了河，才被小墨闻到。"}
      - {speaker: jo, text: "也可能伊莱真的就在这道河湾下面。"}
      - {speaker: ana, text: "对。眼下有两种解释，都能讲通第一次示警的一部分。不能因为其中一种可能成立，就把另一种擦掉。"}
      - {speaker: narrator, text: "德文记下风向，却没有在地图上画出一条从未被观察到的气味路线。"}
  - id: p08
    illustration: p08
    lines:
      - {speaker: narrator, text: "他们在图上点出示警位置，用一小段线标记实测风向，又把尚未排查的范围圈了起来。"}
      - {speaker: dev, text: "一个点，只表示我们在哪里观察到了事情；连成一条线，就等于声称知道气味怎样走完了中间那段路。"}
      - {speaker: jo, text: "这么谨慎的地图，看上去几乎什么也没有。"}
      - {speaker: ana, text: "空白也有用。至少，它不会让推测穿上证据的衣服。"}
  - id: p09
    illustration: p09
    lines:
      - {speaker: narrator, text: "队伍从架高的人行桥过河。这是涨水以后唯一获准通行的过河点。到了南岸芦苇边，小墨绕了两圈，再次示警。"}
      - {speaker: jo, text: "两边都有，那伊莱该是在下雨前过了河。"}
      - {speaker: dev, text: "有这种可能；也可能同一阵风把气味送到了两个地方。"}
      - {speaker: narrator, text: "第二次示警增加了证据，却没有自动替他们选定哪种解释。"}
  - id: p10
    illustration: p10
    lines:
      - {speaker: jo, text: "要么伊莱过了河，要么过河的只有气味。我们总不能永远两边都查。"}
      - {speaker: ana, text: "不用查到永远，只要定一个能同时检验两种解释、又不让任何人下水的计划。"}
      - {speaker: narrator, text: "老周盼着一个明确方向，因为分头留意在他看来像犹豫；安娜却知道，并行排查可能比守着一个仓促答案更快。"}
      - {speaker: dev, text: "两支步行队沿高岸分开查，小墨继续搜索两岸之间的气流。"}
  - id: p11
    illustration: p11
    lines:
      - {speaker: narrator, text: "两支小队沿高处的安全通道前进，逐一查看避雨处、折断的树枝、新脚印，也不断呼喊伊莱的名字。谁都没有踏进被水淹没的支流。"}
      - {speaker: narrator, text: "他们没有找到人，却各自排除了一片不必再投入同样力量的区域。"}
      - {speaker: jo, text: "没找到，听起来就像没有结果。"}
      - {speaker: dev, text: "除非我们忘了，知道他不在哪儿，也会改变下一步往哪儿找。"}
  - id: p12
    illustration: p12
    lines:
      - {speaker: dev, text: "两处示警都顺着刚才的侧风，而两支高岸队也没在正下游找到痕迹。这让‘气味被风带过河’更说得通。"}
      - {speaker: ana, text: "是更说得通，不是已经证明。两个点描不出流动空气的每一次转弯。"}
      - {speaker: jo, text: "那就先把南岸气味来源放在前面，同时保留下游的可能。"}
      - {speaker: narrator, text: "老周第一次在说出结论时，也把结论的边界一并说了出来。"}
  - id: p13
    illustration: p13
    lines:
      - {speaker: narrator, text: "小雨又落下来，裸露的泥地渐渐降温。德文插下的布条先垂下，随后转向柳树林，风开始顺着河弯吹。"}
      - {speaker: dev, text: "带来前两次气味的空气已经过去。接下来再有示警，很可能属于另一种风况。"}
      - {speaker: jo, text: "我们还在画，地图就已经变旧了。"}
      - {speaker: ana, text: "所以每条观察都要记时间，不能只记地点。"}
  - id: p14
    illustration: p14
    lines:
      - {speaker: narrator, text: "小墨钻进柳树下的芦苇，搜了几分钟，气味却断了。它扩大搜索范围，步子越来越慢，最后回头望向安娜。"}
      - {speaker: jo, text: "再给它一分钟吧，伊莱也许就在附近。"}
      - {speaker: narrator, text: "安娜看见泥巴塞进小墨的脚套，也听见它呼吸变快。继续下去也许会多一次示警，疲劳却可能让信息变得含糊。"}
      - {speaker: ana, text: "它的身体状况也是证据，也该改变我们的决定。"}
  - id: p15
    illustration: p15
    lines:
      - {speaker: ana, text: "这一轮到这里。"}
      - {speaker: narrator, text: "她把小墨带回干地，喂水，逐只检查脚掌，再让它在雨棚下面安静趴好。"}
      - {speaker: jo, text: "伊莱还没找到，这时候停下来，总觉得不对。"}
      - {speaker: ana, text: "小墨是队员，不是可以一直用到坏掉的工具。休息既保护它，也保护下一轮搜索的可信度。"}
      - {speaker: narrator, text: "老周望着芦苇，心里仍在催促行动，却也开始在意什么样的行动值得相信。"}
  - id: p16
    illustration: p16
    lines:
      - {speaker: jo, text: "我已经叫了上游的搜救犬小队。复核不能只靠一只累了的狗，也不能只靠一位训导员的解释。"}
      - {speaker: ana, text: "谢谢。他们查山脊，小墨正好恢复。"}
      - {speaker: narrator, text: "老周一点也没有少担心。只是这回，他不再催着一支队伍硬撑，而是把担心变成了更安全的增援。"}
      - {speaker: dev, text: "步行队也能从高路重新检查几座旧避洪屋。"}
  - id: p17
    illustration: p17
    lines:
      - {speaker: narrator, text: "休息过后，小墨步子重新稳了。到了柳树下方，它忽然转向一处狭窄开口，在岸边再次示警。"}
      - speaker: narrator
        content: [{text: "平日里，水从这条小"}, {vocabulary: {id: channel, text: 河道}}, {text: "流过；如今洪水已经漫上两侧的低地。"}]
      - {speaker: jo, text: "这个点在前两轮搜索范围之外。"}
      - {speaker: ana, text: "而且属于新的风向，不能随手把它和早先两个点连在一起。"}
  - id: p18
    illustration: p18
    lines:
      - {speaker: ana, text: "目标气味到过这个开口。新的风、成墙的芦苇，以及沿河道流动的空气，都可能改变小墨在哪里遇见它。"}
      - {speaker: dev, text: "河道还指向上方的一片干燥台地。那里的地形可以检查，不必靠近洪水。"}
      - {speaker: jo, text: "但我们仍不能说，伊莱本人沿水路走过。"}
      - {speaker: narrator, text: "第一次示警时，他差点走上的那条思维近路，如今被自己拦住了。"}
  - id: p19
    illustration: p19
    lines:
      - {speaker: jo, text: "台地上方有一座旧避洪屋。伊莱提过水位计；要是装备坏了，那是附近最安全的去处。"}
      - {speaker: dev, text: "这条线索来自伊莱的计划和你对当地的了解，并不只是小墨的示警。"}
      - {speaker: ana, text: "几条线索合在一起，足够支持我们先查高路，却还不能保证他就在屋里。"}
      - {speaker: narrator, text: "这个判断已经足够支持行动，却还留着改主意的余地。队伍沿高路往坡上走。"}
  - id: p20
    illustration: p20
    lines:
      - {speaker: narrator, text: "避洪屋还没有完全露出来，里面便有人回应。伊莱裹着急救毯站在门口，一只靴子用细绳重新绑过。"}
      - {speaker: eli, text: "我听见你们在下面，可涨水的芦苇地挡住了直路。这里地势高，也干燥，我就一直等着。"}
      - {speaker: jo, text: "我们顺着那条河道找到了你。"}
      - {speaker: ana, text: "是示警、地形、调查计划和你记得的避洪屋一起把我们带来的。"}
  - id: p21
    illustration: p21
    lines:
      - {speaker: eli, text: "下雨前，我的靴带断了。最后一处水位计虽然读完，泥坡却已经松得没法安全返回。"}
      - {speaker: eli, text: "我没冒险下坡，而是来这里避雨。湿外套的气味随风去了哪里，我控制不了；小墨标出的地方，我并没有一一走过。"}
      - {speaker: jo, text: "原来示警帮助我们找到你，却从来不是你的行走路线。"}
      - {speaker: narrator, text: "救援成功证明他们查高处的决定有效，却没有把途中想过的每一种解释都变成事实。"}
  - id: p22
    illustration: p22
    lines:
      - {speaker: narrator, text: "离开前，德文重新整理搜索记录。几个示警点彼此分开，每个点都附有时间、风向、地形和已经排查的区域。"}
      - {speaker: dev, text: "画一条完整气味线当然整齐，也容易记，可证据并不支持。诚实的图应该留下探测、条件和不确定之处。"}
      - {speaker: jo, text: "还要留下我们的解释为什么改变。这比装出从头到尾都很确定，对下一支队伍更有用。"}
      - {speaker: ana, text: "记录不只保存答案，也该保存推理，以及被证据削弱的其他可能。"}
  - id: p23
    illustration: p23
    lines:
      - {speaker: narrator, text: "步行队替伊莱准备返程时，小墨在一旁休息。安娜好好夸奖了它，却没有把整个故事压缩成一只英雄犬的功劳。"}
      - {speaker: ana, text: "小墨提供灵敏的气味探测，德文测量环境，两岸队伍排除区域，老周补上地方知识，伊莱自己也作了保命的选择。"}
      - {speaker: jo, text: "要是把每次示警都当成位置，这些工作反而会被遮住，我们甚至可能已经被引进河里。"}
  - id: p24
    illustration: p24
    lines:
      - {speaker: narrator, text: "伊莱走在队伍中间，大家沿高岸返回。脚下的河流不断重排芦苇和倒影，仿佛从不肯替谁保留一条完美的线。"}
      - {speaker: jo, text: "第一次示警时，我急着要一个确定答案，因为确定听起来就像速度。"}
      - {speaker: ana, text: "真正推动搜索的不是拖慢判断，而是只让每条线索承担它撑得住的分量。"}
      - {speaker: narrator, text: "最终地图留下一个仍未解开的气流问题、一份伊莱亲口确认的经历，还有一条无需任何人冒险下水的归途。"}
chapters:
  - {id: ch01, title: 第一次示警, page_refs: [p01, p02, p03, p04, p05, p06]}
  - {id: ch02, title: 两岸，两种推测, page_refs: [p07, p08, p09, p10, p11, p12]}
  - {id: ch03, title: 风向变了, page_refs: [p13, p14, p15, p16, p17, p18]}
  - {id: ch04, title: 不画完整的线, page_refs: [p19, p20, p21, p22, p23, p24]}
questions:
  - {id: q01, type: evidence, speaker: narrator, prompt: "小墨第一次示警能证明什么，又不能证明什么？", answer: "它能证明目标气味在河湾被小墨闻到，却不能单独证明伊莱的准确位置和走过的路线。", page_refs: [p04, p05, p06]}
  - {id: q02, type: compare, speaker: narrator, prompt: "老周最初的结论和安娜的解释有什么不同？", answer: "老周把示警直接当成伊莱在下游的证明；安娜只把它看成受环境影响的一次探测。", page_refs: [p05, p06, p10]}
  - {id: q03, type: synthesis, speaker: narrator, prompt: "哪些观察支持“气味被风带过河”这种推测？", answer: "风从对岸吹来，小墨在两岸都示警，最初两次示警的位置也和当时的风向对得上。", page_refs: [p07, p09, p12]}
  - {id: q04, type: evaluate, speaker: narrator, prompt: "小墨丢失气味以后，安娜为什么让它停下来？", answer: "疲劳可能影响搜索质量。让小墨休息，再由另一支队伍确认，能留下更可靠的证据。", page_refs: [p14, p15, p16]}
  - {id: q05, type: evidence, speaker: narrator, prompt: "队伍为什么会从小河道转向避洪屋？", answer: "小墨在河道口示警，而老周知道上方有能从高岸到达的避洪屋。", page_refs: [p17, p18, p19]}
  - {id: q06, type: synthesis, speaker: narrator, prompt: "队伍怎样把小墨的示警变成一套负责任的搜索计划？", answer: "他们把示警同风向、地形、时间、休息、独立复核和地方知识结合起来，没有把搜救犬当成能准确报出位置的仪器。", page_refs: [p06, p08, p12, p15, p16, p18, p19]}
  - {id: q07, type: evaluate, speaker: narrator, prompt: "最终地图为什么没有画出一条连续的气味线？", answer: "现有证据只有不同时刻的示警和不断变化的风，并没有测出一条从伊莱到小墨的连续路径。", page_refs: [p08, p13, p22, p24]}
  - {id: q08, type: main-idea, speaker: narrator, prompt: "小墨为搜索提供了什么，又有什么不能替代？", answer: "它提供了灵敏的气味探测，却不能替代队伍对环境、搜索范围、安全路线和不确定性的判断。", page_refs: [p06, p16, p18, p23]}
