schema_version: 1
language: zh-CN
writer: 星火
title: 墙后的掌声
summary: 空剧场里忽然响起掌声。伊奥娜以为藏着一位知音，查到最后，却发现是通风百叶窗松了。
cast:
  narrator: {display_name: 旁白, tts: {delivery: 沉着有氛围, timbre: 清晰的成年声音, pace: 中速, pitch: 中音}}
  iona: {display_name: 伊奥娜, tts: {delivery: 克制有力, timbre: 洪亮的成年声音, pace: 中快速, pitch: 中音}}
  ren: {display_name: 阿任, tts: {delivery: 务实冷幽默, timbre: 有质感的成年声音, pace: 中速, pitch: 低音}}
  maia: {display_name: 迈娅, tts: {delivery: 准确温和, timbre: 醇厚的年长声音, pace: 中慢速, pitch: 中低音}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, text: 伊奥娜独自在空剧场里排练开场白。}]}
  - {id: p02, illustration: p02, lines: [{speaker: narrator, text: 她刚说完，侧墙后忽然响起一阵掌声。}]}
  - {id: p03, illustration: p03, lines: [{speaker: iona, text: 这位知音很会挑时候，不太会藏。}]}
  - {id: p04, illustration: p04, lines: [{speaker: ren, text: 没脚印，门也没开。至于天花板，我替你找过了，里面没有知音。}]}
  - {id: p05, illustration: p05, lines: [{speaker: maia, text: 我刚敲鼓，墙上的灰也跟着抖。先盯住这些动静，别急着猜是谁。}]}
  - {id: p06, illustration: p06, lines: [{speaker: narrator, text: 他们列出每次声响：演讲后、试鼓时，还有后台小车经过时。}]}
  - {id: p07, illustration: p07, lines: [{speaker: narrator, text: 伊奥娜又讲了一遍开场白。这回，墙一声不吭。}]}
  - {id: p08, illustration: p08, lines: [{speaker: narrator, text: 阿任把厚门一关，墙后立刻“啪”了一声。}]}
  - {id: p09, illustration: p09, lines: [{speaker: maia, text: 这里在震。不是有人在鼓掌，是门一关，墙里就有东西动。}]}
  - {id: p10, illustration: p10, lines: [{speaker: narrator, content: [{text: 检修板后，通风}, {vocabulary: {id: shutter, text: 百叶窗}}, {text: 挂在磨损的轴销上。}]}]}
  - {id: p11, illustration: p11, lines: [{speaker: ren, text: 厚门一关，空气被挤进管道，松掉的叶片就撞到了一起。}]}
  - {id: p12, illustration: p12, lines: [{speaker: iona, text: 那就把它封住。破案。}]}
  - {id: p13, illustration: p13, lines: [{speaker: maia, text: 把百叶封死，声音是没了，排练厅也不通风了。你只顾着治“吵”。}]}
  - {id: p14, illustration: p14, lines: [{speaker: ren, text: 换掉轴销，再加一块软垫挡住撞击，风道还能照常通风。}]}
  - {id: p15, illustration: p15, lines: [{speaker: narrator, text: 他们没有把百叶钉死，而是换好轴销，又装上软垫。}]}
  - {id: p16, illustration: p16, lines: [{speaker: narrator, text: 厚门再次关上。百叶照常开合，再也没有乱鼓掌。}]}
  - {id: p17, illustration: p17, lines: [{speaker: maia, text: 安静有用，可警报还是得让每个人收到。}]}
  - {id: p18, illustration: p18, lines: [{speaker: narrator, text: 他们测试能听见也能看见的警报，迈娅先注意到灯光。}]}
  - {id: p19, illustration: p19, lines: [{speaker: iona, text: 我只顾着追查掌声，差点把通风口堵了。还好证据不肯给我面子。}]}
  - {id: p20, illustration: p20, lines: [{speaker: narrator, text: 正式演出那晚，掌声终于从观众席那边传来。}]}
chapters:
  - {id: ch01, title: 看不见的观众, page_refs: [p01, p02, p03, p04, p05, p06]}
  - {id: ch02, title: 掌声从哪里来, page_refs: [p07, p08, p09, p10, p11, p12, p13]}
  - {id: ch03, title: 别把百叶钉死, page_refs: [p14, p15, p16, p17, p18, p19, p20]}
questions:
  - {id: q01, type: short-answer, speaker: narrator, prompt: 最初哪三件事似乎和掌声有关？, answer: 演讲、试鼓和后台小车经过。, page_refs: [p06]}
  - {id: q02, type: character-motive, speaker: narrator, prompt: 伊奥娜为什么先想到藏起来的知音？, answer: 声音在她讲完以后出现，而她也乐意把它当成赞美。, page_refs: [p02, p03]}
  - {id: q03, type: evidence, speaker: narrator, prompt: 哪些证据说明声音来自墙里，而不是观众？, answer: 重讲开场白时没有声音，关门却引出了声响，迈娅还在墙上摸到了振动。, page_refs: [p07, p08, p09]}
  - {id: q04, type: compare, speaker: narrator, prompt: 把百叶封死和把百叶修好，会带来什么不同结果？, answer: 封死百叶虽然不再有撞击声，却会挡住通风；换轴销、加软垫既能防止撞击，又能让空气继续流通。, page_refs: [p12, p13, p14, p15]}
  - {id: q05, type: evaluate, speaker: narrator, prompt: 为什么“安静”不是唯一目标？, answer: 剧场还需要通风，也需要让每个人都能收到紧急警报。, page_refs: [p13, p17, p18]}
  - {id: q06, type: main-idea, speaker: narrator, prompt: 伊奥娜对解决问题有了什么新认识？, answer: 她学会先查清原因，再想一想快速修补会不会妨碍通风、警报或其他人的需要。, page_refs: [p12, p13, p18, p19]}
