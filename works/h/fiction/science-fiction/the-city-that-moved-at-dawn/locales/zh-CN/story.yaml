schema_version: 1
language: zh-CN
writer: 北辰
title: 黎明搬城记
summary: 森让整座城在黎明换位置，本想省下能源，却没想到一条“最短路线”会把麻烦推给居民。
cast:
  narrator: {display_name: 旁白, tts: {delivery: 沉稳清晰, timbre: 温和的成年声音, pace: 中速, pitch: 中音}}
  sen: {display_name: 森, tts: {delivery: 聪敏并愿意负责, timbre: 坚定的成年声音, pace: 中速, pitch: 中高音}}
  lu: {display_name: 路, tts: {delivery: 直接而体恤, timbre: 稳厚的成年声音, pace: 中慢速, pitch: 中低音}}
  node: {display_name: 节点, tts: {delivery: 中性简洁, timbre: 平滑的合成声音, pace: 匀速, pitch: 中音}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, text: 每到黎明，白湾城的街区便沿地面轨道缓慢换位。}]}
  - {id: p02, illustration: p02, lines: [{speaker: sen, text: 住宅挪到阴凉里，花园转去晒太阳。地方用对了，就能少耗些能源。}]}
  - {id: p03, illustration: p03, lines: [{speaker: node, text: 新路线已选择：总移动距离最短。}]}
  - {id: p04, illustration: p04, lines: [{speaker: narrator, text: 第一轮移动悄无声息。一个个街区滑过轨道，稳稳停在新位置。}]}
  - {id: p05, illustration: p05, lines: [{speaker: sen, text: 这次，轮到城市迁就人了。}]}
  - {id: p06, illustration: p06, lines: [{speaker: narrator, text: 可第二天，集市沿最短路线滑离了交通站。}]}
  - {id: p07, illustration: p07, lines: [{speaker: narrator, text: 货篮没有摔倒，买菜的人却要多走很远。}]}
  - {id: p08, illustration: p08, lines: [{speaker: lu, text: 街区是挪得稳稳当当。可集市一走，谁得多走路，你问过吗？}]}
  - {id: p09, illustration: p09, lines: [{speaker: node, text: 当前路线节省百分之十二的移动距离。}]}
  - {id: p10, illustration: p10, lines: [{speaker: sen, text: 这个数字只算了轨道有多长，没算人手里的篮子有多重。}]}
  - {id: p11, illustration: p11, lines: [{speaker: narrator, text: 森跟着一位老人走完新增的路，才看见算法省下的距离去了哪里。}]}
  - {id: p12, illustration: p12, lines: [{speaker: sen, text: 先关掉自动选路。没改好之前，不能再让它替大家拿主意。}]}
  - {id: p13, illustration: p13, lines: [{speaker: narrator, text: 她邀请摊主、住户和孩子把街区模型摆到桌上。}]}
  - {id: p14, illustration: p14, lines: [{speaker: lu, text: 集市宁可多绕一点，也得留在车站边上。}]}
  - {id: p15, illustration: p15, lines: [{speaker: narrator, content: [{text: 人们用彩色筹片表示}, {vocabulary: {id: consent, text: 同意}}, {text: ，也能要求某个街区保持不动。}]}]}
  - {id: p16, illustration: p16, lines: [{speaker: sen, text: 给节点装个谁都看得见的暂停键。以后算路线，也要把人的麻烦算进去。}]}
  - {id: p17, illustration: p17, lines: [{speaker: node, text: 新规则：没有共同确认，不执行移动。}]}
  - {id: p18, illustration: p18, lines: [{speaker: narrator, text: 集市走了稍长的轨道，却仍紧邻交通站。}]}
  - {id: p19, illustration: p19, lines: [{speaker: lu, text: 它不再处处走最短的路，可这才像我们的城。}]}
  - {id: p20, illustration: p20, lines: [{speaker: sen, text: 原来，造出一条路还不够。我得把改路的权利，也交到大家手里。}]}
chapters:
  - {id: ch01, title: 最短的舞步, page_refs: [p01, p02, p03, p04, p05]}
  - {id: ch02, title: 没被计算的距离, page_refs: [p06, p07, p08, p09, p10, p11, p12]}
  - {id: ch03, title: 一座能说不的城市, page_refs: [p13, p14, p15, p16, p17, p18, p19, p20]}
questions:
  - {id: q01, type: character-motive, speaker: narrator, prompt: 森最初为什么设计移动街区？, answer: 她想让住宅、花园等根据日照和需要换位，减少固定布局的消耗。, page_refs: [p01, p02, p05]}
  - {id: q02, type: evidence, speaker: narrator, prompt: 哪些细节说明系统选择的最短路线给居民添了麻烦？, answer: 集市离交通站远了，人们提着东西要多走很长一段路。, page_refs: [p06, p07, p09, p11]}
  - {id: q03, type: evidence, speaker: narrator, prompt: 什么让森意识到数字遗漏了人的负担？, answer: 她亲自陪老人走完新增的路，看见对方搬运重物。, page_refs: [p10, p11]}
  - {id: q04, type: compare, speaker: narrator, prompt: 原规则和新规则如何对待居民意见？, answer: 原规则自动追求最短距离，新规则要求共同确认并允许暂停。, page_refs: [p03, p12, p15, p17]}
  - {id: q05, type: evaluate, speaker: narrator, prompt: 集市改走较长轨道是否算失败？为什么？, answer: 不算；它保留了重要的交通可达性，并反映居民共同选择。, page_refs: [p14, p18, p19]}
  - {id: q06, type: main-idea, speaker: narrator, prompt: 森后来明白，发明者该对使用发明的人负起什么责任？, answer: 发明者要正视造成的麻烦，及时停下有害的自动运行，并让受影响的人参与制定规则和作出选择。, page_refs: [p08, p12, p15, p16, p20]}
