schema_version: 1
language: en-US
writer: kind-spark
title: The City That Moved at Dawn
summary: Sen's moving city saves energy but begins deciding life for its residents, forcing its creator to redefine responsibility.
cast:
  narrator: {display_name: Narrator, tts: {delivery: composed and lucid, timbre: warm adult voice, pace: medium, pitch: medium}}
  sen: {display_name: Sen, tts: {delivery: inventive and accountable, timbre: firm adult voice, pace: medium, pitch: medium-high}}
  lu: {display_name: Lu, tts: {delivery: direct and empathetic, timbre: steady adult voice, pace: medium-slow, pitch: low-medium}}
  node: {display_name: Node, tts: {delivery: neutral and concise, timbre: smooth synthetic voice, pace: even, pitch: medium}}
pages:
  - {id: p01, illustration: p01, lines: [{speaker: narrator, text: "At dawn, White Bay's neighborhoods glided slowly along ground rails."}]}
  - {id: p02, illustration: p02, lines: [{speaker: sen, text: "Homes can seek shade while gardens meet the sun. A fixed city no longer wastes so much energy."}]}
  - {id: p03, illustration: p03, lines: [{speaker: node, text: "New route selected: shortest total movement."}]}
  - {id: p04, illustration: p04, lines: [{speaker: narrator, text: "The first change resembled a quiet dance. Each module stopped exactly where planned."}]}
  - {id: p05, illustration: p05, lines: [{speaker: sen, text: "At last, the city adapts to people instead of demanding the reverse."}]}
  - {id: p06, illustration: p06, lines: [{speaker: narrator, text: "The next morning, however, the market slid away from the transit stop."}]}
  - {id: p07, illustration: p07, lines: [{speaker: narrator, text: "No basket fell, yet shoppers now carried them much farther."}]}
  - {id: p08, illustration: p08, lines: [{speaker: lu, text: "You made movement safe, but never asked whom that safety might strand."}]}
  - {id: p09, illustration: p09, lines: [{speaker: node, text: "Current route reduces movement distance by twelve percent."}]}
  - {id: p10, illustration: p10, lines: [{speaker: sen, text: "The number measures rails, not the weight in people's hands."}]}
  - {id: p11, illustration: p11, lines: [{speaker: narrator, text: "Sen walked the added distance beside an older vendor and saw where the algorithm had moved its burden."}]}
  - {id: p12, illustration: p12, lines: [{speaker: sen, text: "Disable automatic choice. Until we repair it, the system must not decide for everyone."}]}
  - {id: p13, illustration: p13, lines: [{speaker: narrator, text: "She invited vendors, residents, and children to arrange city models around a table."}]}
  - {id: p14, illustration: p14, lines: [{speaker: lu, text: "For the market, staying near transit matters more than moving less."}]}
  - {id: p15, illustration: p15, lines: [{speaker: narrator, content: [{text: "Colored tokens recorded "}, {vocabulary: {id: consent, text: consent}}, {text: ", while any neighborhood could request stillness."}]}]}
  - {id: p16, illustration: p16, lines: [{speaker: sen, text: "Node needs a visible pause control and a way to count unequal burdens."}]}
  - {id: p17, illustration: p17, lines: [{speaker: node, text: "New rule: no movement without shared confirmation."}]}
  - {id: p18, illustration: p18, lines: [{speaker: narrator, text: "The market took a longer rail and remained beside the transit stop."}]}
  - {id: p19, illustration: p19, lines: [{speaker: lu, text: "This is not the shortest city. It feels more like ours."}]}
  - {id: p20, illustration: p20, lines: [{speaker: sen, text: "An invention should not choose the road for others. It should let them change it together."}]}
chapters:
  - {id: ch01, title: The Shortest Dance, page_refs: [p01, p02, p03, p04, p05]}
  - {id: ch02, title: Distance Not Counted, page_refs: [p06, p07, p08, p09, p10, p11, p12]}
  - {id: ch03, title: A City That Can Refuse, page_refs: [p13, p14, p15, p16, p17, p18, p19, p20]}
questions:
  - {id: q01, type: character-motive, speaker: narrator, prompt: "Why does Sen initially design moving neighborhoods?", answer: "She wants homes and gardens to shift with light and need, reducing waste from a fixed arrangement.", page_refs: [p01, p02, p05]}
  - {id: q02, type: evidence, speaker: narrator, prompt: "What evidence shows that Node's shortest route creates a problem?", answer: "The market moves away from transit and people carry goods farther.", page_refs: [p06, p07, p09, p11]}
  - {id: q03, type: evidence, speaker: narrator, prompt: "What helps Sen recognize the burden missing from her number?", answer: "She walks the added distance beside an older vendor carrying a basket.", page_refs: [p10, p11]}
  - {id: q04, type: compare, speaker: narrator, prompt: "How do the original and revised rules treat residents' views?", answer: "The original rule automatically minimizes distance; the revision requires consent and allows a pause.", page_refs: [p03, p12, p15, p17]}
  - {id: q05, type: evaluate, speaker: narrator, prompt: "Is the market's longer route a failure? Explain.", answer: "No. It preserves important access and reflects a shared choice.", page_refs: [p14, p18, p19]}
  - {id: q06, type: main-idea, speaker: narrator, prompt: "What does the story say a creator owes other people?", answer: "A creator must face consequences, stop harmful automation, and include affected people in the rules.", page_refs: [p08, p12, p15, p16, p20]}
