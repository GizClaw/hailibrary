language: en-US
writer: brass-compass
title: The Button Sewn Today
summary: "Nora and Grandma hurry to make a coat, and Nora chooses to give its treasured green button to the baby."
chapters:
  - id: ch01
    title: Beginning
    page_refs:
      - p01
