questions:
  - id: q01
    type: sequence
    prompt: How do Nora and Grandma fix the crooked cuff?
    answer: "Nora removes the crooked stitches, and they finish the coat with blue edging."
    page_refs:
      - p05
      - p06
      - p07
  - id: q02
    type: cause-effect
    prompt: What happens after Nora closes the curtain?
    answer: "The room grows dim, and the baby cries less."
    page_refs:
      - p10
  - id: q03
    type: character-motive
    prompt: Why does Nora finally share the old green button?
    answer: The baby’s grip helps Nora feel close enough to give it away and make a shared memory.
    page_refs:
      - p08
      - p12
      - p13
  - id: q04
    type: short-answer
    prompt: What does Nora promise if the green button falls off?
    answer: They will look for it together.
    page_refs:
      - p13
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: "The baby is coming home, but Nora cannot buy the coat she planned."
    - id: p02
      illustration: p02
      paragraphs:
        - text: Grandma spreads out cream cloth. “There is enough for a small coat.”
    - id: p03
      illustration: p03
      paragraphs:
        - text: "Nora takes the ruler, and they trace the paper pattern together."
    - id: p04
      illustration: p04
      paragraphs:
        - text: "Her first cut slips, so Grandma calmly redraws the edge."
    - id: p05
      illustration: p05
      paragraphs:
        - text: The machine races and leaves crooked stitches across one cuff.
    - id: p06
      illustration: p06
      paragraphs:
        - text: "“Take them out,” Nora says, working slowly with the seam ripper."
    - id: p07
      illustration: p07
      paragraphs:
        - text: "Late that night, the cream coat finally has pale blue edging."
    - id: p08
      illustration: p08
      paragraphs:
        - text: "Nora loves the old green button, but fears the baby will lose it."
    - id: p09
      illustration: p09
      paragraphs:
        - text: "The baby comes home early, and the coat still hangs open."
    - id: p10
      illustration: p10
      paragraphs:
        - text: "When the baby cries, Nora closes the curtain halfway. The room dims, and soon the baby cries less."
    - id: p11
      illustration: p11
      paragraphs:
        - text: Aunt May touches the coat. “Did you make this?”
    - id: p12
      illustration: p12
      paragraphs:
        - text: "The baby grips Nora’s finger, and Nora no longer steps away."
    - id: p13
      illustration: p13
      paragraphs:
        - text: "“Use the green one. If it falls, we will look together.”"
    - id: p14
      illustration: p14
      paragraphs:
        - text: "Nora sews it firmly, and it rises with the baby’s breathing."
