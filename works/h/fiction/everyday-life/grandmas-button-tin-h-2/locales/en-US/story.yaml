questions:
  - id: q01
    type: sequence
    prompt: What happened in order?
    answer: Nora finds a problem, works with Grandma, and makes a choice.
    page_refs:
      - p01
      - p08
      - p14
  - id: q02
    type: cause-effect
    prompt: Which action caused the result?
    answer: Nora sews it firmly, and it rises with the baby’s breathing.
    page_refs:
      - p13
      - p14
  - id: q03
    type: character-motive
    prompt: Why did Nora change what she did?
    answer: The baby held her finger, and Nora chose to make a new story.
