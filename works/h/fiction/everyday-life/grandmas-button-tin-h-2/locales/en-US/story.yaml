questions:
  - id: q01
    type: sequence
    prompt: What does Nora do after the machine leaves crooked stitches?
    answer: "“Take them out,” Nora says, working slowly with the seam ripper."
    page_refs:
      - p05
      - p06
  - id: q02
    type: cause-effect
    prompt: What happens after Nora closes the curtain?
    answer: "The room dims, and soon the baby cries less."
    page_refs:
      - p10
  - id: q03
    type: character-motive
    prompt: Why does Nora save the green button on a keepsake scrap?
    answer: I want the scrap to remember today.
    page_refs:
      - p12
      - p13
  - id: q04
    type: short-answer
    prompt: Where does Nora keep the green button?
    answer: Nora stitches the green button to the keepsake scrap. Then she closes it in the tin.
    page_refs:
      - p14
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: "The baby is coming home, but Nora cannot buy the coat she planned."
    - id: p02
      illustration: p02
      paragraphs:
        - text: Grandma spreads out cream cloth. “There is enough for a small coat.”
    - id: p03
      illustration: p03
      paragraphs:
        - text: "Nora takes the ruler, and they trace the paper pattern together."
    - id: p04
      illustration: p04
      paragraphs:
        - text: "Her first cut slips, so Grandma calmly redraws the edge."
    - id: p05
      illustration: p05
      paragraphs:
        - text: The machine races and leaves crooked stitches across one cuff.
    - id: p06
      illustration: p06
      paragraphs:
        - text: "“Take them out,” Nora says, working slowly with the seam ripper."
    - id: p07
      illustration: p07
      paragraphs:
        - text: "Late that night, the cream coat has blue edging. Its soft fastening is not sewn on."
    - id: p08
      illustration: p08
      paragraphs:
        - text: "Nora loves the old green button, but leaves it on a cream keepsake scrap."
    - id: p09
      illustration: p09
      paragraphs:
        - text: "The baby comes home early. The wide soft fasteners are not sewn on yet."
    - id: p10
      illustration: p10
      paragraphs:
        - text: "When the baby cries, Nora closes the curtain halfway. The room dims, and soon the baby cries less."
    - id: p11
      illustration: p11
      paragraphs:
        - text: Aunt May touches the coat. “Did you make this?”
    - id: p12
      illustration: p12
      paragraphs:
        - text: "The baby grips Nora’s finger, and Nora no longer steps away."
    - id: p13
      illustration: p13
      paragraphs:
        - text: "“Use the soft strips for her coat. Keep the green button away from the baby. I want the scrap to remember today.”"
    - id: p14
      illustration: p14
      paragraphs:
        - text: "Nora and Grandma sew both wide strips flat. Nora stitches the green button to the keepsake scrap. Then she closes it in the tin."
