schema_version: 3
language: zh-CN
writer: 铜罗盘
title: 今天的纽扣
summary: 林澄与外婆用软粘扣带做好小外套，让绿扣子在铁盒里记住今天。
chapters:
  - id: ch01
    title: 开始
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
      - p07
  - id: ch02
    title: 转变
    page_refs:
      - p08
      - p09
      - p10
      - p11
      - p12
      - p13
      - p14
questions:
  - id: q01
    type: sequence
    prompt: 缝纫机留下歪针脚后，林澄做了什么？
    answer: “拆掉吧。”林澄拿起拆线器，慢慢重来。
    page_refs:
      - p05
      - p06
  - id: q02
    type: cause-effect
    prompt: 林澄拉上一半窗帘后，宝宝怎样了？
    answer: 屋里暗下来，宝宝的哭声也变小了。
    page_refs:
      - p10
  - id: q03
    type: character-motive
    prompt: 林澄为什么把绿扣子缝在纪念布片上？
    answer: 我要让布片记住今天。
    page_refs:
      - p12
      - p13
  - id: q04
    type: short-answer
    prompt: 林澄最后把绿扣子放在哪里？
    answer: 后来，她把绿扣子缝在纪念布片上，收进合好的铁盒。
    page_refs:
      - p14
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 小表妹快回家了，林澄买不到想送的外套。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 外婆铺开奶油色软布：“够做一件小的。”
    - id: p03
      illustration: p03
      paragraphs:
        - text: 林澄接过尺子，和外婆一起画纸样。
    - id: p04
      illustration: p04
      paragraphs:
        - text: 她剪歪了一刀，外婆只把边线重新画好。
    - id: p05
      illustration: p05
      paragraphs:
        - text: 缝纫机忽然跑快，袖口留下一排歪针脚。
    - id: p06
      illustration: p06
      paragraphs:
        - text: “拆掉吧。”林澄拿起拆线器，慢慢重来。
    - id: p07
      illustration: p07
      paragraphs:
        - text: 夜深时，小外套有了奶油色衣身和蓝边。软粘扣带还没有缝好。
    - id: p08
      illustration: p08
      paragraphs:
        - text: 林澄喜欢旧绿扣子，却把它留在奶油色纪念布片上。
    - id: p09
      illustration: p09
      paragraphs:
        - text: 第二天，宝宝提前回家，宽软粘扣带还没有缝好。
    - id: p10
      illustration: p10
      paragraphs:
        - text: 宝宝大哭，林澄拉上一半窗帘。屋里暗下来，宝宝的哭声也变小了。
    - id: p11
      illustration: p11
      paragraphs:
        - text: 小姨看见外套，轻声问：“是你做的吗？”
    - id: p12
      illustration: p12
      paragraphs:
      - text: 宝宝用一只小手紧紧抓住林澄的小指，她不再往后躲。
    - id: p13
      illustration: p13
      paragraphs:
        - text: “外套用软粘扣带。绿扣子不能让宝宝碰到。我要让布片记住今天。”
    - id: p14
      illustration: p14
      paragraphs:
        - text: 林澄和外婆把两片宽粘扣带缝平。后来，她把绿扣子缝在纪念布片上，收进合好的铁盒。
