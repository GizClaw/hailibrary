schema_version: 3
language: zh-CN
writer: 铜罗盘
title: 缝在今天的纽扣
summary: 林澄与外婆赶做小外套，最终愿意把珍爱的旧绿扣子送给宝宝。
chapters:
  - id: ch01
    title: 开始
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
      - p07
  - id: ch02
    title: 转变
    page_refs:
      - p08
      - p09
      - p10
      - p11
      - p12
      - p13
      - p14
questions:
  - id: q01
    type: sequence
    prompt: 先后发生了哪些事？
    answer: 林澄发现问题，和外婆行动，最后作出选择。
    page_refs:
      - p01
      - p08
      - p14
  - id: q02
    type: cause-effect
    prompt: 哪次行动带来了结果？
    answer: 林澄亲手缝牢纽扣，它随着宝宝的呼吸起伏。
    page_refs:
      - p13
      - p14
  - id: q03
    type: character-motive
    prompt: 林澄为什么改变了做法？
    answer: 因为宝宝抓住她，她愿意把今天变成新故事。
    page_refs:
      - p12
      - p13
  - id: q04
    type: short-answer
    prompt: 结尾出现了什么物件？
    answer: 绿纽扣。
    page_refs:
      - p14
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 小表妹快回家了，林澄买不到想送的外套。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 外婆铺开奶油色软布：“够做一件小的。”
    - id: p03
      illustration: p03
      paragraphs:
        - text: 林澄接过尺子，和外婆一起画纸样。
    - id: p04
      illustration: p04
      paragraphs:
        - text: 她剪歪了一刀，外婆只把边线重新画好。
    - id: p05
      illustration: p05
      paragraphs:
        - text: 缝纫机忽然跑快，袖口留下一排歪针脚。
    - id: p06
      illustration: p06
      paragraphs:
        - text: “拆掉吧。”林澄拿起拆线器，慢慢重来。
    - id: p07
      illustration: p07
      paragraphs:
        - text: 夜深时，小外套终于有了奶油色衣身和蓝边。
    - id: p08
      illustration: p08
      paragraphs:
        - text: 旧绿扣子很美，可林澄怕宝宝弄丢它。
    - id: p09
      illustration: p09
      paragraphs:
        - text: 第二天，宝宝提前回家，外套还敞着衣襟。
    - id: p10
      illustration: p10
      paragraphs:
        - text: 宝宝大哭，林澄拉上窗帘，让屋里暗下来。
    - id: p11
      illustration: p11
      paragraphs:
        - text: 小姨看见外套，轻声问：“是你做的吗？”
    - id: p12
      illustration: p12
      paragraphs:
      - text: 宝宝用两只小手紧紧抓住林澄的小指，她不再往后躲。
    - id: p13
      illustration: p13
      paragraphs:
        - text: “用绿的。掉了，我们一起找。”
    - id: p14
      illustration: p14
      paragraphs:
        - text: 林澄亲手缝牢纽扣，它随着宝宝的呼吸起伏。
