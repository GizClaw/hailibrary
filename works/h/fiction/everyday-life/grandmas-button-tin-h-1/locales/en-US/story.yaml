questions:
  - id: q01
    type: sequence
    prompt: What does Nora ask after hearing the old button stories?
    answer: "“These are all grown-up stories. Is one from me?”"
    page_refs:
      - p10
      - p11
  - id: q02
    type: cause-effect
    prompt: Why does Grandma return the bear button to the tin?
    answer: "That is your story about me, not one I remember."
    page_refs:
      - p13
      - p14
  - id: q03
    type: character-motive
    prompt: Why does Nora refuse the button from her old overalls?
    answer: "“I cannot remember it. That is your story about me, not one I remember.”"
    page_refs:
      - p12
      - p13
  - id: q04
    type: short-answer
    prompt: What does Nora choose after Grandma returns the bear button?
    answer: Nora closes the tin and chooses to wait for one she remembers.
