      - p14
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: "On a rainy day, Nora searches under the bed for her cable."
    - id: p02
      illustration: p02
      paragraphs:
        - text: She drags out a faded tin that rattles as it moves.
    - id: p03
      illustration: p03
      paragraphs:
        - text: Grandma wipes off the dust and opens the lid.
    - id: p04
      illustration: p04
      paragraphs:
        - text: "Buttons crowd together, and some are worn cloudy."
    - id: p05
      illustration: p05
      paragraphs:
        - text: A pearl button came from Mom’s childhood concert blouse.
    - id: p06
      illustration: p06
      paragraphs:
        - text: Mom pulled it loose and held it through her first solo.
    - id: p07
      illustration: p07
      paragraphs:
        - text: The red button came from Uncle Rob’s raincoat.
    - id: p08
      illustration: p08
      paragraphs:
        - text: The blue glass one came from Grandpa’s backward sweater.
    - id: p09
      illustration: p09
      paragraphs:
      - text: The old wooden toggle rode safely with Grandma to dressmaking school.
    - id: p10
      illustration: p10
      paragraphs:
      - text: "Nora loves every old button story. Still, she feels like the last guest to arrive."
    - id: p11
      illustration: p11
      paragraphs:
        - text: “These are all grown-up stories. Is one from me?”
    - id: p12
      illustration: p12
      paragraphs:
        - text: Grandma finds the bear button from Nora’s old overalls.
    - id: p13
      illustration: p13
      paragraphs:
        - text: "“I cannot remember it. That is your story about me, not one I remember.” Nora lowers her hand."
    - id: p14
      illustration: p14
      paragraphs:
        - text: "Grandma returns the bear button. Nora closes the tin and chooses to wait for one she remembers."
