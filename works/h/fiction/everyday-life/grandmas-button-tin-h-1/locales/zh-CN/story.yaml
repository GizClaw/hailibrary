schema_version: 3
language: zh-CN
writer: 铜罗盘
title: 等一个记得的故事
summary: 林澄听外婆讲旧纽扣的来历，却拒绝了自己不记得的小熊扣。
chapters:
  - id: ch01
    title: 开始
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
      - p07
  - id: ch02
    title: 转变
    page_refs:
      - p08
      - p09
      - p10
      - p11
      - p12
      - p13
      - p14
questions:
  - id: q01
    type: sequence
    prompt: 听完旧纽扣的故事后，林澄接着做了什么？
    answer: 她先问有没有自己的纽扣，又拒绝了不记得的小熊扣。
    page_refs:
      - p10
      - p11
      - p12
      - p13
  - id: q02
    type: cause-effect
    prompt: 外婆为什么把小熊扣放回盒子？
    answer: 林澄说这段回忆属于大人，不属于她。
    page_refs:
      - p12
      - p13
      - p14
  - id: q03
    type: character-motive
    prompt: 林澄为什么不要背带裤上的纽扣？
    answer: 她不记得穿过那条背带裤，想要一段真正属于自己的回忆。
    page_refs:
      - p12
      - p13
  - id: q04
    type: short-answer
    prompt: 外婆答应等一颗怎样的纽扣？
    answer: 一颗林澄自己记得的纽扣。
    page_refs:
      - p14
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: 雨天，林澄在床下找充电线。
    - id: p02
      illustration: p02
      paragraphs:
        - text: 她拖出一只褪色的铁盒，里面哗啦作响。
    - id: p03
      illustration: p03
      paragraphs:
        - text: 外婆擦掉灰，打开了盒盖。
    - id: p04
      illustration: p04
      paragraphs:
      - text: 各色纽扣挤在一起，有的发亮，有的已经磨花。
    - id: p05
      illustration: p05
      paragraphs:
        - text: 一颗珍珠扣来自妈妈小时候的白衬衫。
    - id: p06
      illustration: p06
      paragraphs:
        - text: 妈妈上台唱歌时，紧张得把它攥在掌心。
    - id: p07
      illustration: p07
      paragraphs:
        - text: 红扣子来自舅舅丢过纽扣的雨衣。
    - id: p08
      illustration: p08
      paragraphs:
        - text: 蓝玻璃扣来自外公穿反的旧毛衣。
    - id: p09
      illustration: p09
      paragraphs:
        - text: 木扣子陪外婆坐车去学缝衣。
    - id: p10
      illustration: p10
      paragraphs:
      - text: 林澄听得入迷，也有一点不服气。旧纽扣都认识大人小时候的样子。
    - id: p11
      illustration: p11
      paragraphs:
        - text: “这些都是大人的故事。有我的吗？”
    - id: p12
      illustration: p12
      paragraphs:
        - text: 外婆找出她三岁背带裤上的小熊扣。
    - id: p13
      illustration: p13
      paragraphs:
      - text: “可我不记得。”林澄把手放回膝上。那只是大人讲给她的故事。
    - id: p14
      illustration: p14
      paragraphs:
        - text: 外婆收好小熊扣：“那就等一个你记得的。”
