schema_version: 1
required: true
sources:
  - id: unesco-dragon-boat-festival
    title: The Dragon Boat festival
    publisher: UNESCO Intangible Cultural Heritage
    url: https://ich.unesco.org/en/RL/the-dragon-boat-festival-00225
    supports: "p02-p03: the festival begins on the fifth day of the fifth lunar month; practices and honored heroes vary by region; common elements include dragon boating and rice-dumpling foods."
    verified_at: 2026-09-13
  - id: smithsonian-four-festivals
    title: Four Festivals
    publisher: Smithsonian Folklife Festival
    url: https://festival.si.edu/2014/china/through-the-seasons/four-festivals/smithsonian
    supports: "p02-p03: zongzi and scented pouches are associated with the festival; the Qu Yuan account is presented as a legend, not settled origin history."
    verified_at: 2026-09-13
  - id: smithsonian-commemoration-competition
    title: "Commemoration and Competition: Celebrating Dragon Boat Festival in China"
    publisher: Smithsonian Folklife Festival
    url: https://festival.si.edu/blog/2014/commemoration-and-competition-celebrating-dragon-boat-festival-in-china
    supports: "p03: people tell different origin stories; in one account villagers raced boats, beat drums, and tried to rescue Qu Yuan."
    verified_at: 2026-09-13
  - id: idbf-competition-regulations-2025
    title: IDBF Competition Regulations Edition 9
    publisher: International Dragon Boat Federation
    url: https://www.dragonboat.sport/wp-content/uploads/2025/03/2025-IDBF-Competition-Regulations-Edition-9.pdf
    supports: "p04-p11: paddlers face forward and propel the boat with single-bladed paddles; a steerer works at the rear; a drum and drummer at the bow usually maintain stroke cadence. 'Usually' is retained as a qualification rather than treated as a universal rule."
    verified_at: 2026-09-13
  - id: wikipedia-dragon-boat-crew
    title: Dragon boat
    publisher: Wikipedia contributors
    url: https://en.wikipedia.org/wiki/Dragon_boat#Crew
    supports: "p04-p12: the first pair of paddlers, called pacers, strokes, or timers, set the team pace; a good drummer synchronizes the drum with the leading pair rather than making the leading pair follow the drum. The story simplifies the pair to Tao's visible front paddle and has the audible drum carry that timing to the back rows."
    verified_at: 2026-09-13
  - id: idbf-rules-of-racing-2025
    title: IDBF Rules of Racing Edition 9
    publisher: International Dragon Boat Federation
    url: https://www.dragonboat.sport/wp-content/uploads/2025/03/2025-IDBF-Rules-of-Racing-Edition9.pdf
    supports: "p08-p11: in IDBF racing the drummer sits in the provided seat and actively beats the drum at short regular intervals after the starting area. The story does not claim that all local events use identical rules."
    verified_at: 2026-09-13
  - id: hong-kong-archives-drums
    title: Yesterday's Vacation in Hong Kong - Summer Events
    publisher: Government Records Service, Hong Kong SAR
    url: https://www.grs.gov.hk/ws/online/yvhk/en/exhibition-city/index.html
    supports: "p07-p11: archival description records teams paddling forward to the rhythmic beat of drums in international dragon boat races."
    verified_at: 2026-09-13
  - id: idbf-water-safety
    title: IDBF Water Safety Policy
    publisher: International Dragon Boat Federation
    url: https://www.dragonboat.sport/wp-content/uploads/2021/02/Water-Safety-Policy.pdf
    supports: "p01 and artwork: personal flotation aids are established safety equipment; under-eighteen participants outside competition should wear one under qualified supervision. All fictional crew members are adults."
    verified_at: 2026-09-13
  - id: cambridge-rhythm
    title: rhythm
    publisher: Cambridge Dictionary
    url: https://dictionary.cambridge.org/us/dictionary/english/rhythm
    supports: "Vocabulary: rhythm is a noun, US pronunciation /ˈrɪð.əm/, meaning a regular repeated pattern of sound or movement."
    verified_at: 2026-09-13
  - id: cambridge-dumpling
    title: dumpling
    publisher: Cambridge Dictionary
    url: https://dictionary.cambridge.org/us/dictionary/english/dumpling
    supports: "Vocabulary: dumpling is a countable noun with US pronunciation /ˈdʌm.plɪŋ/. Smithsonian and Han Dian establish that the rice food wrapped in leaves is the festival food meant by rice dumpling here."
    verified_at: 2026-09-13
  - id: handian-jiepai
    title: 节拍
    publisher: 汉典
    url: https://www.zdic.net/hans/%E8%8A%82%E6%8B%8D
    supports: "Vocabulary: 节拍 is pronounced jié pāi and names beats that repeat at regular time intervals."
    verified_at: 2026-09-13
  - id: handian-zong
    title: 粽
    publisher: 汉典
    url: https://www.zdic.net/hans/%E7%B2%BD
    supports: "Vocabulary: 粽 is pronounced zòng; 粽子 is food made by wrapping glutinous rice and other ingredients in leaves and cooking it."
    verified_at: 2026-09-13
notes:
  - Mei, Tao, Coach Fang, their town, practice, race, wave, and finish are invented. No named real race, result, distance, crew size, or required drum pattern is claimed.
  - The story explains an ordinary timing function: Tao and his partner in the first row set the pace, Mei matches Tao's visible paddle, and the audible drum helps the back rows share that timing. Referring to Tao's one visible paddle is a Level H simplification of the leading pair's shared pacing role. The story does not claim that the drum alone sets the pace or supplies force, steering, or victory.
  - Festival practices are framed with some and may. The text does not present one region's customs or hero as universal.
  - The Qu Yuan rescue account is consistently labeled a legend. No claim is made that it is the single proven origin of dragon boat racing.
