schema_version: 1
style: woodblock-print
aspect_ratio: "3:2"
embedded_text: prohibited
shared_by_all_locales: true
continuity:
  setting: A fictional river town in China on a clear early-summer festival morning, with a stone embankment, green hills, cream paper sky, and low tiled roofs.
  boat: One long indigo dragon boat with a rust-red dragon head, mustard horns, cream teeth, green scale accents, a large plain rust-red barrel drum at the bow, paired wooden paddles, and one steering oar at the rear.
  mei: Young Chinese woman, black bob, indigo headband, rust-red shirt with mustard cuffs, forest-green personal flotation vest, dark indigo trousers.
  tao: Young Chinese man, short black hair, indigo shirt, rust-red personal flotation vest, mustard wristbands, dark trousers; always seated in the first paddling row.
  coach-fang: Chinese woman in her forties, black hair in a low bun, forest-green shirt, mustard personal flotation vest, rust-red cap, dark trousers.
  crew: Adult Chinese paddlers in alternating indigo and rust shirts, all wearing fastened green or mustard personal flotation vests; paired seats and wooden paddles remain consistent.
  palette: Fibrous cream paper with indigo water, rust-red focal details, mustard highlights, forest-green hills and safety vests, and carved black linework.
assets:
  - id: cover
    file: artwork/cover.webp
    scene: Mei beats the plain drum at the bow while the full adult crew drives matching paddles into the river together; Tao is visible in the first row, Coach Fang watches from a safety boat near shore, and festival spectators and tiled roofs sit in the distance.
  - id: p01
    file: artwork/p01.webp
    scene: At the riverside dock, Mei fastens her green personal flotation vest and takes the bow drum seat as Coach Fang checks the boat and Tao waits in the first paddling row.
  - id: p02
    file: artwork/p02.webp
    scene: Families gather safely along the stone riverbank with wordless leaf-wrapped zongzi and small patterned scent pouches while decorated dragon boats wait on the water; no banners or written signs.
  - id: p03
    file: artwork/p03.webp
    scene: "A clearly symbolic legend vignette appears as a carved cloud-shaped inset above the present river: old boats hurry across water while a drummer beats, with no portrait label, writing, or claim of literal present action."
  - id: p04
    file: artwork/p04.webp
    scene: Coach Fang checks fastened flotation vests at the dock; adult paddlers sit in pairs facing the bow, Mei sits by the front drum, Tao occupies the first row, and the steerer stands at the rear with a long steering oar.
  - id: p05
    file: artwork/p05.webp
    scene: During practice, Mei raises one drumstick too soon while staggered paddles enter and leave the water at visibly different moments; the boat tilts only slightly and everyone remains safely seated.
  - id: p06
    file: artwork/p06.webp
    scene: The boat pauses in calm water as Tao turns toward Mei to speak and Coach Fang demonstrates equal spacing with two open hands; paddles rest across laps.
  - id: p07
    file: artwork/p07.webp
    scene: Mei makes slow even drum strokes while paired paddles rise and enter the indigo water together, forming a clear repeated visual rhythm and moving the boat straight.
  - id: p08
    file: artwork/p08.webp
    scene: Just after the race start, several dragon boats surge forward in separate lanes; Mei beats the bow drum, her crew faces forward, and the waterfront crowd stays behind a barrier with no readable markings.
  - id: p09
    file: artwork/p09.webp
    scene: A wave from a nearby racing boat reaches Mei's boat; the rear paddles fall slightly behind while Mei looks back and Tao glances toward her from the first row.
  - id: p10
    file: artwork/p10.webp
    scene: Mei deliberately slows her drum strokes, Tao signals calm effort to the crew, and the uneven paddle line begins to come back together without any unsafe standing.
  - id: p11
    file: artwork/p11.webp
    scene: With the crew together again, Mei quickens the even beat little by little; all paddles enter the water together as the boat crosses a simple buoy finish with no letters or numbers.
  - id: p12
    file: artwork/p12.webp
    scene: Back on shore, Tao asks Mei a question beside the resting drum while Coach Fang smiles nearby and a tray of leaf-wrapped zongzi rests on the dock; another boat with a distant drummer begins its race behind them.
generation:
  workflow: Codex built-in image generation
  text_in_image_requested: false
  visual_review:
    status: pass
    checks:
      - no-visible-text
      - character-and-clothing-continuity
      - boat-drum-and-paddle-continuity
      - scene-alignment
      - safe-water-sport-details
      - woodblock-print-style
