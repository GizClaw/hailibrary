schema_version: 1
id: the-drum-on-the-dragon-boat
type:
  - reading
  - narrative-nonfiction
style: woodblock-print
status: draft
locales:
  - en-US
  - zh-CN
labels:
  topics:
    - culture
    - sports
  themes:
    - cooperation
    - tradition
  moods:
    - adventurous
    - warm
characters:
  - id: narrator
    kind: narrator
    description: A clear river-festival narrator who separates observed racing from regional traditions and legends.
    voice_identity: warm, precise, and lively
  - id: mei
    kind: character
    description: A young first-time boat drummer who listens to the paddles and adjusts her beat.
    visual_identity: Young Chinese woman, black bob, indigo headband, rust-red shirt with mustard cuffs, forest-green personal flotation vest, dark indigo trousers.
    voice_identity: bright, focused, and quietly determined
  - id: tao
    kind: character
    description: The lead paddler whose front-row stroke sets the crew's pace and whose calm calls help the crew recover.
    visual_identity: Young Chinese man, short black hair, indigo shirt, rust-red personal flotation vest, mustard wristbands, dark trousers.
    voice_identity: strong, direct, and encouraging
  - id: back-paddler
    kind: character
    description: An adult paddler in a back row who calls out when the drum does not carry the front-row timing clearly.
    visual_identity: One of the adult crew members seated behind Tao, wearing the crew's indigo or rust shirt and a fastened flotation vest.
    voice_identity: clear, urgent, and cooperative
  - id: coach-fang
    kind: character
    description: The adult coach who checks safety gear and gives Mei one practical timing cue.
    visual_identity: Chinese woman in her forties, black hair in a low bun, forest-green shirt, mustard personal flotation vest, rust-red cap, dark trousers.
    voice_identity: calm, low, and exact
cover: artwork/cover.webp
artwork_manifest: artwork.yaml
learning:
  goals:
    - Explain how a drumbeat matched to the front paddlers helps every row move at the same time.
    - Use nearby sound and movement clues to infer why the drummer changes speed.
    - Recognize that Dragon Boat Festival customs and honored figures vary by region.
  concepts:
    - dragon boat stroke timing
    - Dragon Boat Festival customs
    - legend and regional variation
rights:
  text: project-original
  artwork: project-generated
  writer_persona: project-original
