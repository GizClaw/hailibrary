schema_version: 2
language: en-US
writer: brass-compass
title: The Drum on the Dragon Boat
summary: Mei drums for a racing crew for the first time. She learns to match Tao's front paddle, helping every row stay together during a festival race.
chapters:
  - id: ch01
    title: Finding the Beat
    page_refs:
      - p01
      - p02
      - p03
      - p04
      - p05
      - p06
      - p07
  - id: ch02
    title: Together on the River
    page_refs:
      - p08
      - p09
      - p10
      - p11
      - p12
questions:
  - id: q01
    type: explicit-choice
    speaker: narrator
    prompt: Where does the drummer sit on Mei's dragon boat?
    choices:
      - At the bow
      - In the first paddling row
      - At the rear steering oar
    answer: At the bow
    page_refs:
      - p01
      - p04
  - id: q02
    type: sequence
    speaker: narrator
    prompt: What did Mei do first after a back-row paddler said they could not hear the beat?
    answer: She stopped beating the drum.
    page_refs:
      - p06
  - id: q03
    type: cause-effect
    speaker: narrator
    prompt: What happened when Mei made a steady rhythm?
    answer: Every row moved together, and the boat went straight ahead.
    page_refs:
      - p07
  - id: q04
    type: character-motive
    speaker: narrator
    prompt: Why did Mei slow her beat after the wave?
    answer: She heard late splashes from the back and matched Tao's slower pace to help those rows catch up.
    page_refs:
      - p09
      - p10
      - p12
  - id: q05
    type: short-answer
    speaker: narrator
    prompt: Why does the book call the Qu Yuan story a legend?
    answer: It is a story people tell, not something known for sure. Other places tell other stories.
    page_refs:
      - p02
      - p03
article:
  pages:
    - id: p01
      illustration: p01
      paragraphs:
        - text: Festival morning brought Mei to the river. She put on her safety vest and got into the boat. Today, she would drum for the crew for the first time.
    - id: p02
      illustration: p02
      paragraphs:
        - content:
            - text: "Some families carried "
            - vocabulary:
                id: zongzi
                text: rice dumplings
            - text: " wrapped in leaves. Some children wore small pouches. Festival customs differ by place."
    - id: p03
      illustration: p03
      paragraphs:
        - text: One legend says people raced boats to save Qu Yuan. He was lost in the river. They beat drums as they paddled. Other places tell other stories.
    - id: p04
      illustration: p04
      paragraphs:
        - text: Coach Fang checked the boat and each vest. Paddlers sat in pairs, facing forward. Tao's first row set the pace. Mei drummed at the bow, while a steerer guided from the rear.
    - id: p05
      illustration: p05
      paragraphs:
        - text: Practice began. Tao and his partner set the pace. Mei struck fast, then waited too long. The back paddles fell out of time, and the boat jerked slightly.
    - id: p06
      illustration: p06
      paragraphs:
        - text: '“I can''t hear the beat!” a back-row paddler called. Mei stopped, and Tao said, “Watch my paddle.” Coach Fang said, “Match his paddle so the back rows hear the pace.”'
    - id: p07
      illustration: p07
      paragraphs:
        - content:
            - text: "Mei matched her drum to Tao's paddle. Her drum helped every row stay in time with his steady "
            - vocabulary:
                id: rhythm
                text: rhythm
            - text: ". The paddles entered together, and the boat went straight."
    - id: p08
      illustration: p08
      paragraphs:
        - content:
            - text: "The race began. Drums sounded across the river. Mei matched Tao's "
            - vocabulary:
                id: rhythm
                text: rhythm
            - text: ", and their crew pulled together."
    - id: p09
      illustration: p09
      paragraphs:
        - text: A wave rocked the boat, and the back paddles fell behind. Mei stayed with Tao's paddle and heard two late splashes.
    - id: p10
      illustration: p10
      paragraphs:
        - text: 'Tao signaled a slower pace. Mei chose to match his paddle. Tao called to the crew: “Steady!” The late splashes moved closer to the beat.'
    - id: p11
      illustration: p11
      paragraphs:
        - text: Soon all paddles entered together. Tao quickened the pace, and Mei matched him. The boat crossed the finish line with paddles moving as one.
    - id: p12
      illustration: p12
      paragraphs:
        - text: On shore, Tao asked, “Why did you wait before speeding up?” Mei said, “The back rows were late, so I matched your slower pace.” A distant drum marked the next race.
audio_script:
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: attentive, warm, and lightly energetic
        timbre: clear adult voice with a smooth edge
        pace: steady medium
        pitch: middle
    mei:
      display_name: Mei
      tts:
        delivery: focused and thoughtful, with growing confidence
        timbre: bright young adult voice with clean resonance
        pace: measured medium with brief thinking pauses
        pitch: middle-high
    tao:
      display_name: Tao
      tts:
        delivery: direct and encouraging over the sound of the boat
        timbre: firm young adult voice with a warm chest tone
        pace: brisk
        pitch: middle-low
    back-paddler:
      display_name: Back-row paddler
      tts:
        delivery: urgent enough to be heard, but cooperative
        timbre: clear adult voice with a light rasp
        pace: brisk
        pitch: middle
    coach-fang:
      display_name: Coach Fang
      tts:
        delivery: calm, concise, and exact
        timbre: mellow adult voice with a dry, steady tone
        pace: unhurried
        pitch: low
